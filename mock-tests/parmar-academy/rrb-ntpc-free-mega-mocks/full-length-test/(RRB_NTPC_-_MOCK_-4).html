const questions = [{"sr_no": 1, "question": " <p style=\"orphans:0;widows:0\">    According to Whittaker's classification, organisms belonging to    the kingdom____do not have a well-defined nucleus.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Protista</p>", "option2": " <p style=\"orphans:0;widows:0\">    Fungi</p>", "option3": " <p style=\"orphans:0;widows:0\">    Monera</p>", "option4": " <p style=\"orphans:0;widows:0\">    Plantae</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1773186555516_html_9ec7bf2b9d8c860a.png\" width=\"23\" height=\"23\" > <u><b>Additional    Information</b></u></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Monera     are <b>single-celled</b> organisms with no true<b> nuclear     membrane.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">It is a     kingdom that contained unicellular organisms with a prokaryotic     cell organization having no nuclear membrane and vacuoles but     having a rigid cell wall, reproducing through binary fission.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Example:     bacteria.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">R.H.     Whittaker was the first to propose the five-kingdom     classification of the world's flora and fauna into the <b>Animalia,     Plantae, Fungi, Protista, and Monera in 1969.</b></p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence the correct answer    is <b>Monera</b></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0\">    Which of the following pairs is correct?<br> I. Spleen -    Graveyard of RBC<br> II. SA node-Natural pacemaker of the heart.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Only I</p>", "option2": " <p style=\"orphans:0;widows:0\">    Neither I nor II</p>", "option3": " <p style=\"orphans:0;widows:0\">    Only II</p>", "option4": " <p style=\"orphans:0;widows:0\">    Both I and II</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1773186555516_html_aee53d74ccfbe355.png\" width=\"22\" height=\"22\" > <u><b>Important    Points</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. Spleen    - Graveyard of RBC:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     spleen, an organ in the lymphatic system, is often referred to as     the <b>'Graveyard'</b> for red blood cells (RBCs)     because it is where old and damaged RBCs are broken down.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">However,     the spleen isn't a cellular organelle.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Organelles     are structures within a cell that carry out specific functions.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     spleen is a whole organ made up of many different types of cells     and tissues.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     process of breaking down RBCs primarily takes place in the     spleen's red pulp area, which is filled with blood.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Hence     statement I is correct.</b></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>II. SA    node- Natural pacemaker of the heart:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The <b>Sinoatrial</b> (SA)     node is a specialized group of cells located in the right atrium     of the heart.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">It     generates electrical impulses that initiate each <b>heartbeat,     prompting </b>heart contractions and regulating the heart's     rhythm.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">This     function has earned it the title of the heart's natural     pacemaker.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">However,     similar to the spleen, the SA node is not a cellular organelle.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">It's a     group of cells within a specific organ.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Hence     statement Il is correct.</b></p>    </li></ul>    <p style=\"orphans:0;widows:0\">The correct answer is<b> Both    I and II.</b></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0\">    Which juice secreted by the organs in the alimentary canal plays    an important role in the digestion of fats?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Pancreatic juice, saliva</p>", "option2": " <p style=\"orphans:0;widows:0\">    Hydrochloric acid, mucus</p>", "option3": " <p style=\"orphans:0;widows:0\">    Bile juice, Pancreatic juice</p>", "option4": " <p style=\"orphans:0;widows:0\">    Saliva, hydrochloric acid</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1773186555516_html_aee53d74ccfbe355.png\" width=\"22\" height=\"22\" > <u><b>Important    Points</b></u></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Bile     juice, Pancreatic juice secreted by the organs plays an important     role in the digestion of fats.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Bile     juice is secreted by <b>the liver.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">It does     not contain any types of <b>enzymes.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The bile     juice helps to make the food<b> alkaline and break down the     fat molecules.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Pancreatic     juice</b> is secreted by the <b>pancreas.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">It     contains enzymes like <b>amylase, trypsin, pancreatic     lipase, nucleases and lipase.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Secretion     of the Pancreatic juice is regulated by the <b>hormones     secretin</b> and <b>cholecystokinin.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Lipase     is the digestive enzyme of fat.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Ptyalin     is the digestive enzyme of the Saliva.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Hydrochloric     acid is produced naturally in the human stomach to help the     digestion of food.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence the correct answer is <b>Bile    juice, Pancreatic juice.</b></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0\">    During which stage of mitosis the spindle fibers are formed &amp;    get attached to the chromosomes?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Anaphase</p>", "option2": " <p style=\"orphans:0;widows:0\">    Prophase</p>", "option3": " <p style=\"orphans:0;widows:0\">    Telophase</p>", "option4": " <p style=\"orphans:0;widows:0\">    Metaphase</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1773186555516_html_aee53d74ccfbe355.png\" width=\"22\" height=\"22\" > <u><b>Important    Points</b></u></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Cell     Division is the process by which a mature cell divides and forms     Two nearly equal daughter cells that resemble the parental cell     in a number of characteristics</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Two     processes take place during cell reproduction.</p>    </li></ul>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Cell     growth:</b> which is the period of synthesis and duplication     of various components of the cell.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Cell     division:</b> It is the process when a mature cell divides     into two cells.</p>    </li></ol>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>The Cell    cycle completes in 2 steps:</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Interphase</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">M-phase/Dividing     phase</p>    </li></ol>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1773186555516_html_756a6939c63dc606.png\" width=\"21\" height=\"20\" > <u><b>Additional    Information</b></u><br> The M-phase or Mitosis is further divided    into 4 sub-stages:</p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Prophase</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Metaphase</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Anaphase</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Telophase</p>    </li></ol>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Metaphase     is characterized by:</b>The complete disintegration of the     nuclear envelope, hence the chromosomes are spread throughout the     cytoplasm.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Completion     of the condensation of chromosomes, so the chromosomes are     clearly visible and their morphology is best studied.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Spindle     fibres formed and get attached to the chromosomes at the     kinetochore disc.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     chromosomes align themselves at the equator.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence the  correct answer    is <b>Metaphase.</b></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Consider the following statements regarding <b>SAMPANN    (System for Accounting and Management of Pension):</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">I. SAMPANN is    an integrated online pension management system created    specifically for pensioners of the Department of    Telecommunications (DoT), enabling direct pension disbursal to    their bank accounts.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">II. The    integration of SAMPANN with DigiLocker allows pensioners to access    Gratuity Payment Orders, ePPOs, Pension Commutation Orders, and    Form 16 digitally, ensuring secure and long-term preservation of    pension-related documents.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">III. SAMPANN    functions under the Ministry of Finance, as it is the nodal    ministry for all central government pension schemes.</p>    <p style=\"orphans:0;widows:0\"><b>How many of the above    statements are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only one</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only two</p>", "option3": " <p style=\"orphans:0;widows:0\">    All three</p>", "option4": " <p style=\"orphans:0;widows:0\">    None</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">SAMPANN     has been further strengthened by integrating pension-related     documents with DigiLocker, promoting paperless governance and     digital access for DoT pensioners.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1773186555516_html_9ec7bf2b9d8c860a.png\" width=\"23\" height=\"23\" > <u><b>Important    Points</b></u></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">SAMPANN     is a centralized digital system specifically designed for DoT     pensioners, providing online processing, sanctioning, disbursal,     grievance redressal, and digital profile management.<b> Hence,     Statement I is correct.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Through     DigiLocker integration, pensioners can securely access GPOs,     ePPOs, Commutation Orders, Form 16, etc., ensuring authenticity     and long-term digital preservation. <b>Hence, Statement II     is correct.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">SAMPANN     is implemented by the Department of Telecommunications under the     Ministry of Communications, not the Ministry of Finance. <b>Hence,     Statement III is incorrect.</b></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1773186555516_html_16befd5dd6ccef0a.png\" width=\"20\" height=\"19\" > <u><b>Additional    Information</b></u></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>DigiLocker:</b> A     flagship digital document platform under the Ministry of     Electronics and IT (MeitY) for secure cloud-based document     access.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>SAMPANN     Objectives:</b> Faster pension processing, transparent     disbursal, reduced paperwork, real-time grievance monitoring.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">SAMPANN     supports India's larger vision of Digital India, efficient public     service delivery, and paperless governance.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence the correct answer is <b>Only    two.</b></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    Consider the following statements regarding the OECD-finalised    Global Minimum Tax framework:<br> I. The global minimum tax    agreement mandates a uniform 21% global corporate tax rate    applicable to all multinational enterprises, irrespective of their    revenue thresholds.<br> II. The updated OECD agreement completely    replaces the Pillar Two minimum tax rules, discontinuing the 15%    minimum effective tax rate mechanism agreed upon under the BEPS    initiative.<br> <b>How many of the above statements are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only I</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only II</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both I and II</p>", "option4": " <p style=\"orphans:0;widows:0\">    None</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The OECD recently finalized updates to the Global Minimum Tax    framework, maintaining the 15% minimum effective tax standard    under Pillar Two, while negotiating transitional provisions and    limited carve-outs for specific jurisdictions and firms.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1773186555516_html_93859ba3b3f09532.png\" width=\"20\" height=\"20\" > <u><b>Important    Points</b></u></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The OECD     does not mandate a 21% global corporate tax rate. The agreed     global minimum rate remains 15%, applicable only to large     multinational enterprises with revenues above specified     thresholds (usually €750 million). <b>Hence, Statement I     is incorrect.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     updated agreement does not replace Pillar Two or discontinue the     15% rule. Pillar Two remains the core framework for the Global     Minimum Tax under the BEPS (Base Erosion and Profit Shifting)     initiative. <b>Hence, Statement II is incorrect</b></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1773186555516_html_ed8d383cc172efb9.png\" width=\"23\" height=\"22\" > <u><b>Additional    Information</b></u></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>BEPS     Initiative:</b> A joint OECD-G20 effort to curb profit     shifting and tax base erosion by MNCs.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Pillar     Two:</b> Imposes a 15% global minimum tax to prevent a \"race     to the bottom\" in corporate tax competition.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Pillar     One</b>: Deals with reallocating taxing rights over large     digital-economy companies.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The 2026     revisions mainly adjust implementation timelines and clarify     exemptions but retain the 15% global minimum tax structure.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence the correct answer is <b>None</b></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Consider the following statements regarding pension systems in    India:<br> <br>     </p>    <p style=\"orphans:0;widows:0\">I. Under the Old Pension Scheme    (OPS), retirees receive a defined benefit pension funded entirely    by the government, typically calculated as 50% of their last drawn    salary.<br> II. Under the Contributory Pension Scheme (CPS), also    known as NPS for government employees, both employee and    government make contributions during service, and the pension    amount depends on accumulated corpus and market returns.<br> III.    The Unified Pension Scheme (UPS) for Central government staff    incorporates guaranteed minimum benefits while retaining employee    contributions, making it a hybrid of defined benefit and defined    contribution systems.<br> <b>How many of the above statements are    correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only one</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only two</p>", "option3": " <p style=\"orphans:0;widows:0\">    All three</p>", "option4": " <p style=\"orphans:0;widows:0\">    None</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Tamil Nadu has introduced the <b>Tamil Nadu Assured Pension    Scheme (TAPS), </b>blending features of OPS and UPS while    retaining a contribution structure similar to CPS.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1773186555516_html_17cd8aaefc1e4f46.png\" width=\"21\" height=\"21\" > <u><b>Important     Points</b></u></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">OPS is a     defined-benefit system funded fully by the government, the     pension is usually<b> 50% of last pay</b>, fixed and     insulated from market fluctuations. <b>Hence, Statement I is     correct.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">CPS/NPS     is a defined-contribution system with both employee and state     contributing; the pension depends on market-linked returns and     accumulated corpus. <b>Hence, Statement II is correct.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">UPS is a     hybrid scheme, combining a guaranteed minimum payout (DB feature)     with mandatory employee contribution (DC feature). <b>Hence,     Statement III is correct.</b></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1773186555516_html_16befd5dd6ccef0a.png\" width=\"20\" height=\"19\" > <u><b>Additional    Information</b></u></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">TAPS     assures 50% of last drawn pay, includes gratuity, and reduces     fiscal pressure compared to restoring full OPS.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>OPS     challenge:</b> Long-term fiscal burden increases after each     Pay Commission revision.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">CPS/NPS     is regulated by PFRDA.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>State     debt:</b> Tamil Nadu's debt is 26.1% of GSDP, affecting     pension-related fiscal capacity.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence the correct answer is <b>All    three</b></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0\">    The book “Modi’s Mission” is written by:</p>", "option1": "<p style=\"orphans:0;widows:0\">    Suraj Kumar</p>", "option2": " <p style=\"orphans:0;widows:0\">    Berjis Desai</p>", "option3": " <p style=\"orphans:0;widows:0\">    Shashi Tharoor</p>", "option4": " <p style=\"orphans:0;widows:0\">    Anil Chattopadhyay</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>“Modi’s Mission”</b> was authored by <b>Berjis    Desai</b>, a noted Indian lawyer. The book discusses the    government’s demonetisation move and its objective of tackling    black money and corruption.</p>    <p style=\"orphans:0;widows:0\">Hence, The correct answer    is Berjis Desai.</p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    Who won the Miss Universe 2025 title?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Fátima Bosch</p>", "option2": " <p style=\"orphans:0;widows:0\">    R'Bonney Gabriel</p>", "option3": " <p style=\"orphans:0;widows:0\">    Harnaaz Sandhu</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sheynnis Palacios</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Fátima Bosch</b> from <b>Mexico</b> won    the <b>Miss Universe 2025</b> crown, defeating more than    100 contestants from around the world.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The event was    hosted in <b>Thailand</b>.</p>    <p style=\"orphans:0;widows:0\">Hence, The correct answer    is <b>Fátima Bosch.</b></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    Which of the following statements about the Panchayati Raj system    in India is correct?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Panchayati Raj was first introduced by the 73rd Constitutional    Amendment in 1992.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Panchayati Raj consists of two tiers: Gram Panchayat and Zilla    Parishad.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Panchayati Raj institutions are completely independent of state    governments.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Members of the Panchayati Raj are appointed by the District    Collector.</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>73rd     Constitutional Amendment (1992)</b> formalized the     Panchayati Raj system in India, giving it constitutional status.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">It is     a <b>three-tier system</b> in most states: Gram     Panchayat (village), Panchayat Samiti (block), and Zilla Parishad     (district).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Panchayati     Raj institutions are <b>not fully independent</b>; they     function under state government guidance.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Members     are <b>elected</b>, not appointed.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence, The correct answer is    \"<b>Panchayati Raj was first introduced by the 73rd    Constitutional Amendment in 1992.\"</b></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0\">    Which of the following memories is <b>volatile</b> and    loses its data when the power supply is turned off?</p>", "option1": "<p style=\"orphans:0;widows:0\">     ROM</p>", "option2": " <p style=\"orphans:0;widows:0\">    Hard Disk</p>", "option3": " <p style=\"orphans:0;widows:0\">    RAM</p>", "option4": " <p style=\"orphans:0;widows:0\">    CD-ROM</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1773186555516_html_b4b01013bf658811.png\" width=\"23\" height=\"22\" >  <b>Additional    Information             </b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>RAM     (Random Access Memory)</b> is <b>volatile memory</b> —     it temporarily stores data and instructions currently being used     by the CPU. When power is off, data is lost.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>ROM     (Read Only Memory)</b> is <b>non-volatile</b> —     it permanently stores firmware.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Hard     Disk</b> is <b>non-volatile secondary storage</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>CD-ROM</b> is     also <b>non-volatile storage</b>.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence the answer is <b>RAM.</b></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    With reference to the Union Budget 2026–27, consider the    following statements:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The Budget    introduced India Semiconductor Mission 2.0 to strengthen domestic    chip manufacturing and supply chains.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. It    proposed an increase in public capital expenditure (Capex) to an    all-time high of over ₹12 lakh crore to boost infrastructure.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. The fiscal    deficit target for 2026–27 was set higher than the previous year    to prioritize growth over fiscal consolidation.</p>    <p style=\"orphans:0;widows:0\">Which of the statements given    above is/are correct?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Only 1 and 2</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only 2 and 3</p>", "option3": " <p style=\"orphans:0;widows:0\">    Only 1 and 3</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1 is correct</b>: The Budget launched India    Semiconductor Mission 2.0 with expanded scope to develop a    domestic semiconductor ecosystem — a key strategic and    manufacturing push.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2 is correct</b>: Public capital expenditure was increased to a    record high of about ₹12.2 lakh crore, underlining the    government’s continued infrastructure-led growth strategy.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    3 is incorrect</b>: The fiscal deficit target was maintained or    marginally lowered relative to prior estimates, emphasizing a    balance between growth and fiscal prudence rather than sharply    higher deficit spending. </p>    <p style=\"orphans:0;widows:0\">Hence, The correct answer    is <b>\"Only 1 and 2\".</b></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    Which of the following statements about the Reserve Bank of India    (RBI) is correct?</p>", "option1": "<p style=\"orphans:0;widows:0\">    RBI is responsible for issuing coins in India.</p>", "option2": " <p style=\"orphans:0;widows:0\">    RBI regulates the supply of money in the economy.</p>", "option3": " <p style=\"orphans:0;widows:0\">    RBI provides loans directly to the general public.</p>", "option4": " <p style=\"orphans:0;widows:0\">    RBI controls only private banks, not public sector banks.</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Reserve Bank of India (RBI) </b>is the<b> central    bank of India</b> and the main authority responsible for    monetary policy.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Its key    functions include:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. I<b>ssuing    currency notes (coins are issued by the Government of India, not    RBI)</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>Controlling    money supply</b> through tools like the Cash Reserve Ratio    (CRR), Statutory Liquidity Ratio (SLR), Repo Rate, and Reverse    Repo Rate.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. <b>Regulating    and supervising banks</b> (both public and private) to ensure    financial stability.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4.<b> Acting    as a lender of last resort to banks in need</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Why not the    other options?</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A) Coins are    issued by the Ministry of Finance, not RBI.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C) RBI does    not provide loans to the general public; commercial banks do that.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">D) <b>RBI    regulates all banks</b> (public and private), not    just <b>private banks</b>.</p>    <p style=\"orphans:0;widows:0\">Hence, The correct answer is <b>\"RBI    regulates the supply of money in the economy.\"</b></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0\">    During the Delhi Sultanate, which ruler introduced the market    control policy (Diwan-i-Riyasat) and price regulation of    commodities, aiming to check inflation and protect the common    people?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Iltutmish</p>", "option2": " <p style=\"orphans:0;widows:0\">    Alauddin Khilji</p>", "option3": " <p style=\"orphans:0;widows:0\">    Muhammad bin Tughlaq</p>", "option4": " <p style=\"orphans:0;widows:0\">    Firoz Shah Tughlaq</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Alauddin Khilji (1296–1316 CE)</b>, of the <b>Khilji    dynasty</b>, is well-known for his <b>economic and    administrative reforms</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">His <b>market     control policy</b> included:</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>Setting    fixed prices</b> for goods like food grains, horses, and    cattle.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>State    supervision of markets</b> to prevent hoarding and    profiteering.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3.<b> Appointment    of officers </b>to inspect and enforce price regulations.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Purpose: <b>To     stabilize the economy</b>, ensure adequate supplies for the army,     and protect the poor from inflation.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Other     options:</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1.    Iltutmish</b> focused on consolidation and administration.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2.    Muhammad bin Tughlaq</b> is known for <b>token currency    and failed experiments.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3. Firoz    Shah Tughlaq</b> introduced<b> welfare measures and    canals, but not strict market control.</b></p>    <p style=\"orphans:0;widows:0\">Hence, the correct answer is    \"<b>Alauddin Khilji\".</b></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0\">    A convex lens forms a real image of an object on a screen. If the    lens is replaced by a concave lens of the same focal length, what    will happen to the image?</p>", "option1": "<p style=\"orphans:0;widows:0\">    The image remains real at the same position.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The image becomes virtual and upright.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The image remains real but inverted.</p>", "option4": " <p style=\"orphans:0;widows:0\">    No image is formed on the screen.</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Convex lens (converging lens)</b>: Can produce a<b> real    image </b>because it converges rays to a point. Real images    can be projected on a screen.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Concave    lens (diverging lens)</b>: Always produces a <b>virtual,    upright image</b>. The rays diverge and never actually meet on the    other side. </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Therefore,    replacing a convex lens with a concave lens makes <b>it    impossible to form a real image on a screen.</b></p>    <p style=\"orphans:0;widows:0\">Hence, The correct answer is <b>\"No    image is formed on the screen.\"</b></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    In December 2025, India won its first bronze medal at the FIH    Men’s Junior Hockey World Cup. Which team did they defeat in the    bronze medal match?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Germany</p>", "option2": " <p style=\"orphans:0;widows:0\">    Netherlands</p>", "option3": " <p style=\"orphans:0;widows:0\">    Argentina</p>", "option4": " <p style=\"orphans:0;widows:0\">    Australia</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>India</b> staged a stunning comeback to beat<b> Argentina    4-2</b>, earning the<b> bronze </b>— their first    podium finish in this tournament  history.</p>    <p style=\"orphans:0;widows:0\">Hence, The correct answer    is <b>\"Argentina\".</b></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    Which of the following mountain ranges acts as the northern    boundary of the Indian subcontinent?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Aravalli Hills</p>", "option2": " <p style=\"orphans:0;widows:0\">    Western Ghats</p>", "option3": " <p style=\"orphans:0;widows:0\">    Himalayas</p>", "option4": " <p style=\"orphans:0;widows:0\">    Vindhyas</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Himalayas </b>form a natural barrier between    the <b>Indian subcontinent and the Tibetan Plateau</b>,    acting as the <b>northern boundary of India.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u><b>Other    options:</b></u></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Aravalli     Hills </b>– run northeast–southwest across Rajasthan,     much older and smaller.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Western     Ghats</b> – along India’s west coast, unrelated to     northern boundary.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Vindhyas </b>–     central India, mark the boundary between northern and southern     plains, not the northern limit.</p>    </li></ol>    <p style=\"orphans:0;widows:0\">Hence, The correct answer    is <b>\"Himalayas\".</b></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    Which of the following rivers is known for having a tidal bore in    India?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Godavari</p>", "option2": " <p style=\"orphans:0;widows:0\">    Brahmaputra</p>", "option3": " <p style=\"orphans:0;widows:0\">    Ganga</p>", "option4": " <p style=\"orphans:0;widows:0\">    Narmada</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    A <b>tidal bore</b> is <b>a sudden rise in water    level in the lower course of a river caused by incoming high tides    from the sea</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In India,<b> the    Brahmaputra and the Hooghly </b>(a distributary of the Ganga)    are <b>famous for tidal bores</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u><b>Characteristics:</b></u></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Occurs     in the <b>estuarine region</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Can     travel<b> upstream</b> against the river current at     high speed.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Seen     mainly in rivers with a large tidal range and funnel-shaped     estuaries.</p>    </li></ol>    <p style=\"orphans:0;widows:0\">Hence, The correct answer    is <b>\"Brahmaputra\".</b></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Arrange the following events in chronological order:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1.    Non-Cooperation Movement</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Civil    Disobedience Movement</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Quit India    Movement</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Champaran    Satyagraha</p>    <p style=\"orphans:0;widows:0\">Select the correct answer using    the code below:</p>", "option1": "<p style=\"orphans:0;widows:0\">    4-1-2-3</p>", "option2": " <p style=\"orphans:0;widows:0\">    1-4-2-3</p>", "option3": " <p style=\"orphans:0;widows:0\">    4-2-1-3</p>", "option4": " <p style=\"orphans:0;widows:0\">    1-2-4-3</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct chronological sequence of major Gandhian movements is:</p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Champaran     Satyagraha (1917)</b> – Gandhi’s first satyagraha in     India, launched to protest against the exploitation of indigo     farmers in Bihar.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Non-Cooperation     Movement (1920–22)</b> – Initiated in response to the     Rowlatt Act and Jallianwala Bagh massacre; it aimed at boycotting     British institutions and goods.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Civil     Disobedience Movement (1930–34)</b> – Began with the     Dandi March (Salt Satyagraha) to break the salt law and openly     defy British authority.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Quit     India Movement (1942)</b> – Launched during World War II     with the slogan “Do or Die,” demanding immediate independence     from British rule.</p>    </li></ol>    <p style=\"orphans:0;widows:0\">Thus, arranging them in    chronological order gives: option A i.e. 4-1-2-3</p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    If the Reserve Bank of India increases the Repo Rate, what will be    its immediate impact?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Increase in money supply</p>", "option2": " <p style=\"orphans:0;widows:0\">    Decrease in borrowing cost</p>", "option3": " <p style=\"orphans:0;widows:0\">    Reduction in inflationary pressure</p>", "option4": " <p style=\"orphans:0;widows:0\">    Increase in government expenditure</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The <b>Repo Rate</b> is the rate at which the RBI lends    money to commercial banks.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">When the RBI    increases the repo rate:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Banks     have to pay higher interest to borrow funds from the RBI.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">As a     result, banks increase their lending rates.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Loans     (home, car, business) become expensive.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Demand     for credit decreases.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Money     supply in the economy reduces.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence, the correct answer    is <b>\"Reduction in inflationary pressure\".</b></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    Which part of the human brain is responsible for maintaining body    balance and posture?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Cerebrum</p>", "option2": " <p style=\"orphans:0;widows:0\">    Medulla oblongata</p>", "option3": " <p style=\"orphans:0;widows:0\">    Cerebellum</p>", "option4": " <p style=\"orphans:0;widows:0\">    Hypothalamus</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Cerebellum</b> controls balance, coordination and posture.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Cerebrum →    thinking, memory, intelligence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Medulla →    controls involuntary actions like heartbeat, breathing.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Hypothalamus    → regulates temperature, hunger, hormones.</p>    <p style=\"orphans:0;widows:0\">Hence, the correct answer    is  <b>\"Cerebellum\".</b></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    The speed of sound is maximum in:</p>", "option1": "<p style=\"orphans:0;widows:0\">    Air</p>", "option2": " <p style=\"orphans:0;widows:0\">    Water</p>", "option3": " <p style=\"orphans:0;widows:0\">    Steel</p>", "option4": " <p style=\"orphans:0;widows:0\">    Vacuum</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The speed of sound depends on the <b>elasticity</b> and <b>density</b> of    the medium.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">In <b>solids</b>,     particles are tightly packed and have strong intermolecular     forces.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">This     allows sound waves to travel faster.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">In     liquids, particles are less tightly packed than solids.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">In     gases, particles are far apart, so sound travels slowest.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Order of    Speed of Sound:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Solids &gt;    Liquids &gt; Gases</b></p>    <p style=\"orphans:0;widows:0\">Hence, the correct answer    is <b>\"Steel\".</b></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    Which of the following compounds has the highest boiling point?</p>", "option1": "<p style=\"orphans:0;widows:0\">    CH₄</p>", "option2": " <p style=\"orphans:0;widows:0\">    NH₃</p>", "option3": " <p style=\"orphans:0;widows:0\">    H<sub>2</sub>O</p>", "option4": " <p style=\"orphans:0;widows:0\">    HF</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Water forms extensive <b>hydrogen bonding network</b>,    stronger than NH₃ and HF overall (due to 2 H atoms + 2 lone    pairs). CH₄ has only weak van der Waals forces.</p>    <p style=\"orphans:0;widows:0\">Hence, the correct answer    is <b>\"H</b><sub><b>2</b></sub><b>O\".</b></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    Which of the following provisions was introduced by the Government    of India Act, 1919?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Provincial Autonomy</p>", "option2": " <p style=\"orphans:0;widows:0\">    Dyarchy in Provinces</p>", "option3": " <p style=\"orphans:0;widows:0\">    Federal Court</p>", "option4": " <p style=\"orphans:0;widows:0\">    Separate Electorates for Muslims</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    1919 Act (Montagu–Chelmsford Reforms) introduced <b>Dyarchy </b>in    provinces.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Provincial    Autonomy → 1935 Act</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Federal Court    → 1935 Act</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Separate    electorates for Muslims → 1909 Act (Morley–Minto Reforms)</p>    <p style=\"orphans:0;widows:0\">Hence, the correct answer    is <b>\"Dyarchy in Provinces\".</b></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Consider the following statements regarding Fundamental Rights:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. They are    justiciable in nature.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. They can    be suspended during a National Emergency.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Right to    Property is still a Fundamental Right.</p>    <p style=\"orphans:0;widows:0\">Which of the statements given    above is/are correct?</p>", "option1": "<p style=\"orphans:0;widows:0\">    1 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    1 and 2</p>", "option3": " <p style=\"orphans:0;widows:0\">    2 and 3</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statements 1 and 2 are correct. Fundamental Rights are enforceable    in courts and can be suspended during National Emergency (<b>except    Articles 20 and 21)</b>. Right to Property is now a legal right    under Article 300A, not a Fundamental Right.</p>    <p style=\"orphans:0;widows:0\">Hence, the correct answer is  <b>\"1    and 2\".</b></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Consider the following statements about Peninsular rivers:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    Narmada flows westward into the Arabian Sea.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. The Tapi    River forms a delta before entering the sea.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. The    Godavari is the longest river of Peninsular India.</p>    <p style=\"orphans:0;widows:0\">Which of the statements given    above is/are correct?</p>", "option1": "<p style=\"orphans:0;widows:0\">    1 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Narmada     flows west into the Arabian Sea</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Tapi     forms an estuary, not a delta</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Godavari     is the longest Peninsular river</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence, the correct answer is <b>\"1    and 3 only\".</b></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0\">    The <b>2025 Nobel Peace Prize</b> was awarded to <b>María    Corina Machado</b> of <b>Venezuela</b> for her    efforts in</p>", "option1": "<p style=\"orphans:0;widows:0\">    combating climate change globally</p>", "option2": " <p style=\"orphans:0;widows:0\">    advancing vaccine research</p>", "option3": " <p style=\"orphans:0;widows:0\">    promoting democratic rights and peaceful transition from    dictatorship</p>", "option4": " <p style=\"orphans:0;widows:0\">    developing quantum computing technologies</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The 2025 Nobel Peace Prize was given to <i>María Corina    Machado</i> for her <b>tireless work in defending    democratic rights in Venezuela and her struggle to achieve a just    and peaceful transition from dictatorship to democracy</b>.</p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0\">    During the <b>77th Republic Day Parade</b> on    January 26, 2026, the Indian Army’s <b>Bhairav Light    Commando Battalion</b> made its first parade appearance. What    is the primary <b>operational role</b> of this    battalion?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Heavy mechanised warfare formations</p>", "option2": " <p style=\"orphans:0;widows:0\">    Traditional ceremonial duties</p>", "option3": " <p style=\"orphans:0;widows:0\">    Rapid-response, high-mobility combat and commando operations</p>", "option4": " <p style=\"orphans:0;widows:0\">    Naval amphibious assault missions</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The newly raised <b>Bhairav Light Commando Battalions</b> march    in the Republic Day Parade for the first time as part of the    Indian Army’s evolving strategy to enhance rapid-deployment and    high-impact combat capabilities. These compact, highly agile units    are designed to bridge the gap between conventional infantry and    elite special forces, undertaking swift, surprise, and tactical    operations in diverse combat environments. Their parade debut    reflects both their strategic importance and the Army’s focus on    modernised, functional readiness rather than purely ceremonial    display</p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0\">    Which of the following statements about the <b>Stone Age</b> is    correct?</p>", "option1": "<p style=\"orphans:0;widows:0\">    The Stone Age is divided into Paleolithic, Mesolithic, and    Neolithic periods based on advancements in stone tools and    lifestyle.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Humans during the Stone Age primarily used metal tools for hunting    and farming</p>", "option3": " <p style=\"orphans:0;widows:0\">    The Stone Age saw the first use of written scripts and large    cities.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Agriculture was widely practiced during the Paleolithic period.</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The <b>Stone Age</b> marks the earliest period of human    history, characterized by the use of stone tools. It is divided    into three main phases:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Paleolithic     (Old Stone Age):</b> Humans were hunter-gatherers and used     simple chipped stone tools.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Mesolithic     (Middle Stone Age):</b> Transitional period with more     advanced microlithic tools and beginnings of semi-permanent     settlements.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Neolithic (New Stone     Age):</b> Marked by polished stone tools, agriculture,     domestication of animals, and permanent villages.<br> Metal     tools, writing, and cities appeared much later, in the Bronze and     Iron Ages.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 30, "question": "Wुicु यी पुध ीियियथing ीधौपiॅोिस iौ cिधधृनोपधक ोौ ो ुोनॅधौप ीधौपiॅोि in Sयहपु Inकiो ोnक iौ ोिसय ाnयथn ोौ पुध “ीधौपiॅोि यी िigुपौ”?", "option1": "<p style=\"orphans:0;widows:0\">    Pongal</p>", "option2": " <p style=\"orphans:0;widows:0\">    Diwali</p>", "option3": " <p style=\"orphans:0;widows:0\">    Bihu</p>", "option4": " <p style=\"orphans:0;widows:0\">    Onam</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Pongal</b> is a four-day harvest festival celebrated    mainly in <b>Tamil Nadu</b> in January. It marks the    beginning of the sun’s northward journey (Uttarayana) and is    dedicated to the Sun God, thanking nature for a bountiful harvest.    Though <b>Diwali</b> is also called the festival of    lights, it is not a harvest festival in South India. <b>Bihu</b> is    celebrated in Assam, and <b>Onam</b> is Kerala’s    harvest festival, but Pongal specifically fits the South Indian    harvest and light-themed celebration.</p>    <p style=\"orphans:0;widows:0\">Hence, the correct answer    is <b>\"Pongal\".</b></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0\">    Which of the following is a <b>classical dance form of    Kerala</b>, traditionally performed as part of temple rituals?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Bharatanatyam</p>", "option2": " <p style=\"orphans:0;widows:0\">    Kathakali</p>", "option3": " <p style=\"orphans:0;widows:0\">    Odissi</p>", "option4": " <p style=\"orphans:0;widows:0\">    Manipuri</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Kathakali</b> is a classical dance-drama originating    from <b>Kerala</b>, known for its elaborate costumes, painted    faces, and storytelling through gestures and facial expressions.    It is traditionally performed to depict stories from <b>Hindu    epics like Mahabharata and Ramayana</b> in temple festivals.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Bharatanatyam</b> is    from Tamil Nadu, <b>Odissi</b> from Odisha,    and <b>Manipuri</b> from Manipur.</p>    <p style=\"orphans:0;widows:0\">Hence, the correct answer    is <b>\"Kathakali\".</b></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0\">    The Indian Constitution draws its features from various sources.    Which of the following is <b>not a source of the Indian    Constitution</b>?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Government of India Act, 1935</p>", "option2": " <p style=\"orphans:0;widows:0\">    British Parliamentary System</p>", "option3": " <p style=\"orphans:0;widows:0\">    U.S. Constitution</p>", "option4": " <p style=\"orphans:0;widows:0\">    French Revolution</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The <b>Indian Constitution</b> is a blend of various    sources:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Government     of India Act, 1935:</b> Provided administrative machinery     and federal features.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>British     Parliamentary System:</b> Inspired parliamentary democracy,     rule of law, and legislative procedures.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>U.S.     Constitution:</b> Contributed ideas of fundamental rights,     judicial review, and the federal structure.<br> The <b>French     Revolution</b> influenced the world politically, but its     principles were not directly incorporated as a source of India’s     Constitution.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence, the correct answer    is<b> \"French Revolution\".</b></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0\">    What does GDP at constant prices measure?</p>", "option1": "<p style=\"orphans:0;widows:0\">    GDP including inflation effects</p>", "option2": " <p style=\"orphans:0;widows:0\">    GDP excluding inflation effects</p>", "option3": " <p style=\"orphans:0;widows:0\">    GDP at current market prices</p>", "option4": " <p style=\"orphans:0;widows:0\">    GDP of informal sector only</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <b>GDP at constant prices</b> uses a <b>base year</b> to    remove the effect of price changes (inflation), showing the real    growth in output.</p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0\">    According to <b>Newton’s First Law of Motion</b>, an object    will <b>continue to move with constant velocity</b> unless:</p>", "option1": "<p style=\"orphans:0;widows:0\">    No force acts on it</p>", "option2": " <p style=\"orphans:0;widows:0\">    A net external force acts on it</p>", "option3": " <p style=\"orphans:0;widows:0\">    Its mass increases</p>", "option4": " <p style=\"orphans:0;widows:0\">    Gravity is zero</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Newton’s First Law (Law of Inertia) states that <b>an    object at rest stays at rest, and an object in motion continues in    motion with the same speed and direction unless acted upon by a    net external force</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Examples    of Isaac Newton’s First Law of Motion</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1.    Passenger in a bus</b><br> When a moving bus suddenly stops,    passengers fall forward.<br> Their body was in motion and tends    to remain in motion (inertia).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2. Dust    from a carpet</b><br> When we beat a carpet, dust particles come    out.<br> The carpet moves, but dust tends to remain at rest.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3. Coin    and card experiment</b><br> If a card is flicked quickly from    under a coin, the coin falls straight down into the glass.<br> The    coin remains at rest due to inertia.</p>    <p style=\"orphans:0;widows:0\">Hence, the correct answer is \"<b>A    net external force acts on it\".</b></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\">    The <b>weight of an object</b> on Earth is the <b>force    of gravity</b> acting on it. If the object is taken to the    Moon, its <b>weight</b> will:</p>", "option1": "<p style=\"orphans:0;widows:0\">    Increase</p>", "option2": " <p style=\"orphans:0;widows:0\">    Decrease</p>", "option3": " <p style=\"orphans:0;widows:0\">    Remain the same</p>", "option4": " <p style=\"orphans:0;widows:0\">    Become zero</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Weight W=mg</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">W=mg depends    on the <b>acceleration due to gravity</b> g.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Since the    Moon’s gravity is about <b>1/6th of Earth’s</b>, the    object weighs less, though its <b>mass remains unchanged</b>.</p>    <p style=\"orphans:0;widows:0\">Hence, the correct answer is    \"Decrease\".</p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0\">    Which of the following is <b>not</b> an operating    system?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Windows 10</p>", "option2": " <p style=\"orphans:0;widows:0\">    Linux</p>", "option3": " <p style=\"orphans:0;widows:0\">    Oracle</p>", "option4": " <p style=\"orphans:0;widows:0\">    MacOS</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <b>Windows 10, Linux, and macOS</b> are <b>operating    systems</b>. <b>Oracle</b> is a <b>database    management system (DBMS)</b>, <b>not an OS</b>.</p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0\">    Which of the following statements about Gopal Krishna Gokhale is    correct?</p>", "option1": "<p style=\"orphans:0;widows:0\">    He was an extremist leader who believed in mass protests and    boycotts.</p>", "option2": " <p style=\"orphans:0;widows:0\">    He founded the Servants of India Society to train Indians for    public service.</p>", "option3": " <p style=\"orphans:0;widows:0\">    He supported the partition of Bengal in 1905.</p>", "option4": " <p style=\"orphans:0;widows:0\">    He was opposed to all forms of constitutional reforms offered by    the British.</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Explanation:</b><br> Gopal Krishna Gokhale was a <b>moderate    leader</b> of the Indian National Congress. He founded    the <b>Servants of India Society</b> in 1905 to train    Indians for public service and social reform. He believed in    constitutional methods, dialogue with the British, and gradual    reforms.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Statement     A is wrong because he was a moderate, not an extremist like     Tilak.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Statement     C is wrong; he opposed the partition of Bengal.</p>     </li><li><p style=\"orphans:0;widows:0\">Statement D is wrong; He     worked for constitutional reforms and believed in dialogue with     the British to achieve self-government.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0\">    Which Constitutional Amendment Act lowered the voting age from 21    years to 18 years?</p>", "option1": "<p style=\"orphans:0;widows:0\">    42nd Amendment Act</p>", "option2": " <p style=\"orphans:0;widows:0\">    44th Amendment Act</p>", "option3": " <p style=\"orphans:0;widows:0\">    61st Amendment Act</p>", "option4": " <p style=\"orphans:0;widows:0\">    73rd Amendment Act</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The 61st Constitutional Amendment Act, 1988 reduced the voting age    from 21 to 18 years.<br> 42nd → Mini Constitution (1976)<br> 44th    → Removed Right to Property from Fundamental Rights<br> 73rd →    Panchayati Raj institutions</p>    <p style=\"orphans:0;widows:0\">Hence<b> option C</b> is    the correct option </p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0\">    Which of the following winds blow from the subtropical    high-pressure belts towards the equatorial low-pressure belt?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Westerlies</p>", "option2": " <p style=\"orphans:0;widows:0\">    Trade Winds</p>", "option3": " <p style=\"orphans:0;widows:0\">    Polar Winds</p>", "option4": " <p style=\"orphans:0;widows:0\">    Monsoon Winds</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Explanation:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Trade     Winds</b> blow from the subtropical high-pressure belts     (around 30° N and 30° S) towards the equatorial low-pressure     belt.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">In the     Northern Hemisphere, they blow from the northeast (NE Trade     Winds).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">In the     Southern Hemisphere, they blow from the southeast (SE Trade     Winds).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Their     direction is affected by the Coriolis force.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Other    options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Westerlies</b> blow     from subtropical highs toward subpolar lows (30° to 60°     latitudes).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Polar     Winds (Polar Easterlies)</b> blow from polar high-pressure     areas toward subpolar low-pressure areas.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Monsoon Winds</b> are     seasonal winds caused by differential heating of land and sea.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0\">    In humans, blood group O is considered a universal donor because:</p>", "option1": "<p style=\"orphans:0;widows:0\">    It contains both A and B antigens</p>", "option2": " <p style=\"orphans:0;widows:0\">    It lacks both A and B antigens on RBCs</p>", "option3": " <p style=\"orphans:0;widows:0\">    It has no antibodies  </p>", "option4": " <p style=\"orphans:0;widows:0\">    It contains Rh factor</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Explanation:</b><br> Blood group O does not have A or B    antigens on red blood cells, so it does not trigger immune    reactions in recipients (in ABO system).</p>    <p style=\"orphans:0;widows:0\">Hence <b>option B</b> is    the correct answer.</p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0\">    In a certain code language, ‘put this Pen’ is coded as ‘mr    st qr’ and ‘Pen on desk’ is coded as ‘qr lm pq’. How is    ‘Pen’ coded in the given language?</p>", "option1": "<p style=\"orphans:0;widows:0\">    op</p>", "option2": " <p style=\"orphans:0;widows:0\">    pq</p>", "option3": " <p style=\"orphans:0;widows:0\">    lm</p>", "option4": " <p style=\"orphans:0;widows:0\">    qr</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Compare the Sentences:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence     1: put this <b>pen</b> -&gt; mr st <b>qr</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence     2: <b>pen</b> on desk-&gt; <b>qr</b> lm pq</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Looking at    both sentences, the word <b>'pen'</b> is the only one    that repeats.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Looking at    the code sets, the code <b>'qr'</b> is the only one that    repeats in both</p>    <ul>     <li><p style=\"orphans:0;widows:0\"><b>pen = qr</b></p>    </li></ul>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0\">    FRSU is related to IOUS in a certain way based on the English    alphabetical order. In the same way, SLWQ is related to VIYO. To    which of the given options is YEZN related, following the same    logic?</p>", "option1": "<p style=\"orphans:0;widows:0\">    LCAK</p>", "option2": " <p style=\"orphans:0;widows:0\">    AABL</p>", "option3": " <p style=\"orphans:0;widows:0\">    BBBL</p>", "option4": " <p style=\"orphans:0;widows:0\">    ZBZK</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Set 1: FRSU -&gt; IOUS</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">F(6) + 3     = I (9)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">R(18) -     3 = O (15)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">S(19) +     2 = U (21)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">U (21) -     2 = S (19)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Pattern:</b> <i><b>+3,     -3, +2, -2</b></i></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Set 2:    SLWQ -&gt; VIYO</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">S(19) +     3 = V (22)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">L (12) -     3 = I (9)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">W(23) +     2 = Y (25)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Q (17) -     2 = O (15)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Pattern     Verified:</b> +3, -3, +2, -2</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>(YEZN):</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Y     (25) + 3</b> = 28 ( <b>B</b> )</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>E (5)     - 3</b> = 2 (<b>B</b>)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Z     (26) + 2</b> = 28 ( <b>B </b>)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>N     (14) - 2</b> = 12 (<b>L</b>)</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Final    Result: BBBL</b></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0\">    In a certain code language, ‘ROSE’ is coded as ‘3517’ and    ‘LION’ is coded as ‘2458’. What is the code for ‘O’ in    the given code language?</p>", "option1": "<p style=\"orphans:0;widows:0\">    1</p>", "option2": " <p style=\"orphans:0;widows:0\">    5</p>", "option3": " <p style=\"orphans:0;widows:0\">    2</p>", "option4": " <p style=\"orphans:0;widows:0\">    7</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    We are given two words and their corresponding codes:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">             <b>ROSE</b> = <b>3 5 1 7</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">              <b>LION</b> = <b>2 4 5 8</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Common     Letter:</b> Comparing <b>ROSE</b> and <b>LION</b>,     the only letter they both share is <b>'O'</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Common     Digit:</b> Comparing the codes <b>3517</b> and <b>2458</b>,     the only digit they both share is <b>5</b>.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Since 'O' is    the only common letter and 5 is the only common digit, we can    conclude:</p>    <p style=\"orphans:0;widows:0\"><b>The code for 'O' is 5.</b></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    This question is based on the five, three-digit numbers given    below. (Example: 697 – First digit = 6, second digit = 9 and    third digit = 7) (NOTE: All operations to be done from left to    right.)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>(Left) 673    163 187 270 378 (Right)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">What will be    the resultant if the first digit of the lowest number is    subtracted from the first digit of the highest number?</p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    6</p>", "option2": " <p style=\"orphans:0;widows:0\">    8</p>", "option3": " <p style=\"orphans:0;widows:0\">    5</p>", "option4": " <p style=\"orphans:0;widows:0\">    4</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "     <ol><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Given     Series:</b> 673, 163, 187, 270, 378</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">First      digit of the highest number (673) is <b>6</b>.</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">First      digit of the lowest number (163) is <b>1</b>.</p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Final     Calculation:</b></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Resultant      = (First digit of Highest) - (First digit of Lowest)</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">6- 1      = <b>5</b></p>     </li></ul>    </li></ol>    <p style=\"orphans:0;widows:0\"><b>Correct Ans: (5)</b></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0\">    If 2 is added to each even digit and 2 is added to each odd digit    in the number 5362145, what will be the sum of all the odd digits    in the new number thus formed?</p>", "option1": "<p style=\"orphans:0;widows:0\">    23</p>", "option2": " <p style=\"orphans:0;widows:0\">    32</p>", "option3": " <p style=\"orphans:0;widows:0\">    12</p>", "option4": " <p style=\"orphans:0;widows:0\">    22</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "     <ol><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Original     Number:</b> 5362145</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Apply     Transformation Rules:</b></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rule:</b> Add      2 to each even digit and add 2 to each odd digit.</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">5(Odd)      + 2 = <b>7</b></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">3 (Odd)      + 2 = <b>5</b></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">6      (Even) + 2 = <b>8</b></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">2      (Even) + 2 = <b>4</b></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">1 (Odd)      + 2 = <b>3</b></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">4      (Even) + 2 = <b>6</b></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">5 (Odd)      + 2 = <b>7</b></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>New     Number Formed:</b> 7584367</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Identify     and Sum Odd Digits:</b></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Odd      digits in 7584367 are: <b>7, 5, 3, 7</b></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Sum = 7      + 5 + 3 + 7 = <b>22</b></p>     </li></ul>    </li></ol>    <p style=\"orphans:0;widows:0\"><b>Correct ans : (22)</b> </p>", "question_heading": ""}, {"sr_no": 46, "question": "Rधीधन पय पुध ीियियथing nहंृध
