, "option1": "<p style=\"orphans:0;widows:0\">    # = LKP, % = FGH</p>", "option2": " <p style=\"orphans:0;widows:0\">    # = MKI, % = NHU</p>", "option3": " <p style=\"orphans:0;widows:0\">    # = KLM, % = NHY</p>", "option4": " <p style=\"orphans:0;widows:0\">    # = JGM, % = URX</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    This is the most important latest pattern question, ( in every    exam of railway this type is asked)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>always    check First to First letter relation </b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Given</b>:     # : OLR :: PMS : %</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Pattern</b>:     Constant <b>+5</b> shift in alphabetical ranks.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Right     Side</b>: P(16) + 5 = U, M(13) + 5 = R, S(19) + 5 = X (<b>URX</b>).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Left Side</b>: Reverse     shift (-5) from OLR: O(15) - 5=J, L(12) - 5 = G, R(18) - 5 = M     (<b>JGM</b>).</p>    </li></ul>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    This question is based on the five, three-digit numbers given    below. (Example: 697 – First digit = 6, second digit = 9 and    third digit = 7) (NOTE: All operations to be done from left to    right.)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>(Left) 797    740 270 169 993 (Right)</b></p>    <p style=\"orphans:0;widows:0\">What will be the resultant if the    first digit of the highest number is added to the third digit of    the lowest number?</p>", "option1": "<p style=\"orphans:0;widows:0\">    17</p>", "option2": " <p style=\"orphans:0;widows:0\">    18</p>", "option3": " <p style=\"orphans:0;widows:0\">    21</p>", "option4": " <p style=\"orphans:0;widows:0\">    19</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Series</b>:     797, 740, 270, 169, 993</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Highest     Number</b>: 993 (First digit = 9).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Lowest     Number</b>: 169 (Third digit = 9).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Resultant</b>:     9 + 9 = <b>18</b>.</p>    </li></ul>    <p style=\"orphans:0;widows:0\"><b>Therefore Answer is 18</b></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0\">    If 1 is added to each odd digit and 2 is subtracted from each even    digit in the number 6457312, what will be sum of the highest and    lowest digits in the number thus formed?</p>", "option1": "<p style=\"orphans:0;widows:0\">    8</p>", "option2": " <p style=\"orphans:0;widows:0\">    6</p>", "option3": " <p style=\"orphans:0;widows:0\">    4</p>", "option4": " <p style=\"orphans:0;widows:0\">    9</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The original number is <b>6457312</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Transformation</b>:     Apply +1 to odds and -2 to evens.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">6(Even)     - 2 = <b>4</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">4 (Even)     - 2 = <b>2</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">5 (Odd)     + 1 = <b>6</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">7 (Odd)     + 1 = <b>8</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">3 (Odd)     + 1 = <b>4</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">1 (Odd)     + 1 = <b>2</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">2 (Even)     - 2 = <b>0</b></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>New    Number:</b> 4268420.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Result</b>:     Highest digit is <b>8</b>, lowest is <b>0</b>.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Final Sum</b>: <b>8</b>.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Which of the following letter-clusters should replace # and % so    that the pattern and relationship followed between the    letter-cluster pair on the left side of :: is the same as that on    the right side of ::?</p>    <p style=\"orphans:0;widows:0\"># : UWC :: OHW : %</p>", "option1": "<p style=\"orphans:0;widows:0\">    # = MCU, % = KXS</p>", "option2": " <p style=\"orphans:0;widows:0\">    # = QMY, % = MCU</p>", "option3": " <p style=\"orphans:0;widows:0\">    # = SRA, % = QMY</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    # = KXS, % = SRA</p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    This problem follows a constant \"Plus/Minus\" pattern for    each corresponding letter in the cluster.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Pattern:    (+2, +5, +2)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Left Side (#    to UWC):</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>S</b> (19)     + 2 = <b>U</b> (21)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>R</b> (18)     + 5 = <b>W</b> (23)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A</b> (1)     + 2 = <b>C</b> (3)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><i><b>Pattern:     (+2, +5, +2)</b></i></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Right Side    (OHW to %):</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>O</b> (15)     + 2 = <b>Q</b> (17)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>H</b> (8)     + 5 = <b>M</b> (13)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>W</b> (23)     + 2 = <b>Y</b> (25)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><i><b>Pattern:     (+2, +5, +2)</b></i></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><b>Correct Answer:  (# =    SRA, % = QMY )</b></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the triad that follows the same pattern as that followed by    the two triads given below. Both triads follow the same pattern</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">IP-KR-MO</p>    <p style=\"orphans:0;widows:0\">KR-MT-OQ</p>", "option1": "<p style=\"orphans:0;widows:0\">    XS-NV-PT</p>", "option2": " <p style=\"orphans:0;widows:0\">    MS-NU-PQ</p>", "option3": " <p style=\"orphans:0;widows:0\">    KS-NU-PQ</p>", "option4": " <p style=\"orphans:0;widows:0\">    LS-NU-PR</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "     <ol><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Analyze     Triad 1 (IP-KR-MO):</b></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>First      Letters:</b> I(9) + 2 = K(11); K(11) + 2 = M(13).</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Second      Letters:</b> P(16) + 2 = R(18); R(18) - 3 = O(15).</p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Pattern:</b> First     letters move <b>+2, +2</b>; second letters move <b>+2,     -3</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Apply     to missing triad (starting with LS):</b></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>First      Letters:</b> L(12) + 2 = <b>N</b>; N(14) + 2 = <b>P</b>.</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Second      Letters:</b> S(19) + 2 = <b>U</b>; U(21) - 3 = <b>R</b>.</p>     </li></ul>    </li></ol>    <p style=\"orphans:0;widows:0\"><b>Final Result: LS - NU - PR</b></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"orphans:0;widows:0\">    Based on the English alphabetical order, three of the following    four letter-clusters are alike in a certain way and thus form a    group. Which letter-cluster DOES NOT belong to that group? (Note:    The odd one out is not based on the number of consonants/vowels or    their position in the letter-cluster.)</p>", "option1": "<p style=\"orphans:0;widows:0\">    BDH</p>", "option2": " <p style=\"orphans:0;widows:0\">    SUY</p>", "option3": " <p style=\"orphans:0;widows:0\">    CFI</p>", "option4": " <p style=\"orphans:0;widows:0\">    FHL</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option     A (BDH):</b> B(2) + 2 = D(4); D(4) + 4 = H(8) (Gap: <b>+2,     +4</b>).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option     B (SUY):</b> S(19) + 2 = U(21); U(21) + 4 = Y(25) (Gap: <b>+2,     +4</b>).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option     D (FHL):</b> F(6) + 2 = H(8); H(8) + 4 = L(12) (Gap: <b>+2,     +4</b>).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option     C (CFI): </b>C(3) + 3 = F(6); F(6) + 3 = I(9) (Gap: <b>+3,     +3</b>).</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Result:    Option C (CFI) does not follow the +2, +4 pattern.</b></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"orphans:0;widows:0\">    Based on the English alphabetical order, three of the following    four letter-cluster pairs are alike in a certain way and thus form    a group. Which letter-cluster pair DOES NOT belong to that group?    (Note: The odd one out is not based on the number of    consonants/vowels or their position in the letter cluster)</p>", "option1": "<p style=\"orphans:0;widows:0\">    NR - VA</p>", "option2": " <p style=\"orphans:0;widows:0\">    HK - QT</p>", "option3": " <p style=\"orphans:0;widows:0\">    EH - NQ</p>", "option4": " <p style=\"orphans:0;widows:0\">    JM – SV</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option     B (HK - QT):</b> H(8) + 3 = K(11); Q(17) + 3 = T(20). The     gap within both clusters is <b>+3</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option     C (EH - NQ):</b> E(5) + 3 = H(8); N(14) + 3 = Q(17). The gap     within both clusters is <b>+3</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option     D (JM - SV):</b> J(10) + 3 = M(13); S(19) + 3 = V(22). The     gap within both clusters is <b>+3</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option     A (NR - VA):</b> N(14) + <b>4</b> = R(18); V(22)     + <b>5</b> = A(27). The gaps are <b>+4 and +5</b>.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Result:</b> Option    A is the odd one out because its internal gaps are not +3.</p>    <p style=\"orphans:0;widows:0\"><b>Correct ANS : (NR - VA)</b></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    What should come in place of the question mark (?) in the given    series based on the English alphabetical order?</p>    <p style=\"orphans:0;widows:0\"><b>GMT BHO WCJ RXE ? </b>   </p>", "option1": "<p style=\"orphans:0;widows:0\">    AXL</p>", "option2": " <p style=\"orphans:0;widows:0\">    RPQ</p>", "option3": " <p style=\"orphans:0;widows:0\">    ZLS</p>", "option4": " <p style=\"orphans:0;widows:0\">    MSZ</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>GMT BHO WCJ RXE ? </b> </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Logic</b>:     Each letter in the cluster follows a consistent pattern     of <b>-5</b> shifts in the alphabetical order.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Calculation</b>:</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">First      Letter: R(18) - 5 = 13 -&gt; <b>M</b>.</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Second      Letter: X(24) - 5 = 19 -&gt;<b>S</b>.</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Third      Letter: E(5) - 5 = 26 -&gt; <b>Z</b>.</p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0\"><b>Final Result</b>: <b>MSZ</b>.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following number-pairs, the second number is obtained by    applying certain mathematical operations to the first number.    Select the set in which the numbers are related in the same way as    are the numbers of the following sets. (NOTE: Operations should be    performed on the whole numbers, without breaking down the numbers    into their constituent digits. E.g. 13 – Operations on 13 such    as adding/subtracting/multiplying to 13 can be performed. Breaking    down 13 into 1 and 3 and then performing mathematical operations    on 1 and 3 is not allowed.)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">60, 5</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">90, 8</p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    60, 11</p>", "option2": " <p style=\"orphans:0;widows:0\">    80,7</p>", "option3": " <p style=\"orphans:0;widows:0\">    65, 4</p>", "option4": " <p style=\"orphans:0;widows:0\">    60, 6 </p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>LOGIC</b>: <b>{First Number} =({Second Number} *10) + 10 </b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Verification</b>:     (5 * <i>10) + 10=60; (8 * </i>10) + 10=90.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Apply</b>:     (7 * 10) + 10=<b>80</b>.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Result</b>: <b>80,     7</b>.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    What should come in place of the question mark (?) in the given    series?</p>    <p style=\"orphans:0;widows:0\">501  500  497     492  485 ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    476</p>", "option2": " <p style=\"orphans:0;widows:0\">    371</p>", "option3": " <p style=\"orphans:0;widows:0\">    573</p>", "option4": " <p style=\"orphans:0;widows:0\">    577</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Series</b>:     501, 500, 497, 492, 485, ?</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Differences</b>:     -1, -3, -5, -7</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Logic</b>:     The series follows a pattern of subtracting consecutive odd     numbers starting from 1.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Pattern</b>: -1,     -3, -5, -7, -9</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Next Gap</b>:    Subtract the next odd number (9).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">                             485 - 9 = <b>476</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0\"><b>Result</b>: <b>476</b>. </p>    </li></ul>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    What will come in the place of the question mark (?) in the    following equation, if ‘+’ and ‘−’ are interchanged and    ‘×’ and ‘÷’ are interchanged?</p>    <p style=\"orphans:0;widows:0\">51 ÷ 12 + 162 × 3 − 94 =?</p>", "option1": "<p style=\"orphans:0;widows:0\">    562</p>", "option2": " <p style=\"orphans:0;widows:0\">    642</p>", "option3": " <p style=\"orphans:0;widows:0\">    552</p>", "option4": " <p style=\"orphans:0;widows:0\">    652</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rule</b>:     Interchange (+) with (-) and (x) with (÷).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>New     Equation</b>: 51 x 12 - 162 ÷ 3 + 94 = ?</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Calculation</b>:</p>     <ol>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">162 / 3      = 54</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">51 x 12      = 612</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">612 -      54 +  94 = <b>652</b>.</p>     </li></ol>     </li><li><p style=\"orphans:0;widows:0\"><b>Result</b>: <b>652</b>.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the number from among the given options that can replace    the question mark (?) in the following series.</p>    <p style=\"orphans:0;widows:0\">14 28 31 62 65 130    133 ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    231</p>", "option2": " <p style=\"orphans:0;widows:0\">    266</p>", "option3": " <p style=\"orphans:0;widows:0\">    225</p>", "option4": " <p style=\"orphans:0;widows:0\">    128</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Alternating Number Series</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Series</b>:     14 28 31 62 65 130 133 ?</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Logic</b>:    Multiply by 2, then add 3.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Calculation</b>:     133 * 2 = <b>266</b>.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Correct Answer = 266</b></p>    </li></ul>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"orphans:0;widows:0\">    Rajeev ranked 35th from the top and 12th from the bottom in his    class. How many students are there in his class?</p>", "option1": "<p style=\"orphans:0;widows:0\">    42</p>", "option2": " <p style=\"orphans:0;widows:0\">    46</p>", "option3": " <p style=\"orphans:0;widows:0\">    45</p>", "option4": " <p style=\"orphans:0;widows:0\">    43</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Total Number of Students = (Rank from Top + Rank from Bottom) –    1</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rajeev    positions</b>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">                  Rank from the top = <b>35th</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">                  Rank from the bottom    = <b>12th</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Total =    (35 + 12) – 1 = 46</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Logic: </b>The    number 1 is subtracted because when you add the ranks from both    ends, Rajeev is counted twice (once from the top and once from the    bottom).</p>    <p style=\"orphans:0;widows:0\"><b>Answer = 46</b></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    If '−' means '÷', '÷' means '×', '×' means '+' and '+' means    '−', then what will come in place of the question mark (?) in    the following equation?</p>    <p style=\"orphans:0;widows:0\">2÷ 45 × 855 − 19 + 15 = ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    180</p>", "option2": " <p style=\"orphans:0;widows:0\">    136</p>", "option3": " <p style=\"orphans:0;widows:0\">    120</p>", "option4": " <p style=\"orphans:0;widows:0\">    460</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>. Given Conditions (Substitution Rule):</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <b>'—'</b> means <b>'÷'</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <b>'÷'</b> means <b>'×'</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <b>'×'</b> means <b>'+'</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <b>'+'</b> means <b>'—'</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Equation    After Substitution:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2 × 45 +    855 ÷ 19 - 15 = ?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2 × 45 + 45    - 15 = ?</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">90 + 45 - 15    = ?</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">135 - 15 =    120</p>    <p style=\"orphans:0;widows:0\">The value that replaces the    question mark is <b>120</b></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In a certain code language, A + B means ‘A is the mother of B’    A – B means ‘A is the brother of B’ A × B means ‘A is the    wife of B’ and A ÷ B means ‘A is the father of B’.</p>    <p style=\"orphans:0;widows:0\">How is R related to Z if ‘R + S    ÷ T – U × Z’?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Wife's father's mother</p>", "option2": " <p style=\"orphans:0;widows:0\">    Wife's mother's mother</p>", "option3": " <p style=\"orphans:0;widows:0\">    Wife's mother's sister</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Wife's father's sister</p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>R     + S</b>: <b>R</b> is the <b>Mother</b> of S.</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><i>(M      is female, 1 generation above N)</i></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>S ÷     T</b>: <b>S</b> is the <b>Father</b> of T.</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><i>(S      is male, 1 generation above T; R is S's mother)</i></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>T -     U</b>: <b>T</b> is the <b>Brother</b> of U.</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><i>(T      and U are siblings; S is the father of both)</i></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>U ×     Z</b>: <b>U</b> is the <b>Wife</b> of Z.</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><i>(U      is female, Z is her husband; S is the father of the wife U)</i></p>     </li></ul>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1773186555516_html_e75443dc1566fd66.jpg\" width=\"228\" height=\"177\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">how is R    related to Z - <b>Wife's father's mother</b></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1773186555516_html_4f92dc75f9e61e98.jpg\" width=\"250\" height=\"172\" > </p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0\">    District E is to the east of District F. District F is to the    south of District G. District G is to the east of District H.    District H is to the west of District I. District E is to the    south-west of District I. What is the position of District G with    respect to District I?</p>", "option1": "<p style=\"orphans:0;widows:0\">    East</p>", "option2": " <p style=\"orphans:0;widows:0\">    West</p>", "option3": " <p style=\"orphans:0;widows:0\">    South</p>", "option4": " <p style=\"orphans:0;widows:0\">    north</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>District     G &amp; H:</b>District G is to the <b>East</b> of     District H</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>District     H &amp; I:</b>District H is to the <b>West</b> of     District I</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><i>Observation:</i> Both      G and I are to the East of H.</p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>District     E &amp; I:</b>District E is to the <b>South-West</b> of     Distric I.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>District     E &amp; F:</b>District E is to the <b>East</b> of     District F</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>District     F &amp; G:</b>District F is to the <b>South</b> of     District G.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net. the north</b></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"orphans:0;widows:0\">    Six people, M, N,  P, Q, R and S are sitting in a row, facing    north. No one sits to the right of M. Only two people sit between    M and N. Only one person sits between N and S. P sits third to the    left of R.  How many people sit between Q and S?</p>", "option1": "<p style=\"orphans:0;widows:0\">    five</p>", "option2": " <p style=\"orphans:0;widows:0\">    two</p>", "option3": " <p style=\"orphans:0;widows:0\">    three</p>", "option4": " <p style=\"orphans:0;widows:0\">    four</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>NOTE </b>- Another arrangement is also Possible <b>S P N Q R M</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">To determine    the number of people between <b>Q</b> and <b>S</b>,    we arrange all six people (M, N, P, Q, R and S) based on the fixed    constraints:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Fixing     M and N:</b> Since no one sits to the right of <b>M</b>, <b>M</b> must     be at the extreme right end. Two people sit between <b>M</b> and <b>N</b>,     placing <b>N</b> in the 3rd position from the left.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Locating     S:</b> Only one person sits between <b>N</b> and <b>S</b>.     Since there is only one spot to the right of <b>N</b>, <b>S</b> must     be to the right of <b>N</b>, placing <b>S</b> in     the 5th position (immediately to the left of <b>M</b>).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Arranging     P, R, and O:</b> <b>P</b> sits third to the left     of <b>R.</b> This block (P _ N R ) fits     perfectly into the remaining slots.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Final     Spot for Q:</b> The only remaining position (2nd from the     left) is filled by <b>Q</b>.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1773186555516_html_1f7c095a9baf583f.jpg\" width=\"370\" height=\"107\" > </p>    <p style=\"orphans:0;widows:0\"><b>Two people</b> sit    between Q and S</p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"orphans:0;widows:0\">    M, N, O, P, Q, R, and S are sitting around a circular table facing    the centre. Only one person sits between R and S when counted from    the right of R. Only one person sits between S and O. Only one    person sits between R and Q. Only two people sit between M and O.    Only one person sits between N and Q. Who sits third to the right    of P ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Q</p>", "option2": " <p style=\"orphans:0;widows:0\">    S</p>", "option3": " <p style=\"orphans:0;widows:0\">    N</p>", "option4": " <p style=\"orphans:0;widows:0\">    R</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Establish     the R-S-O Chain:</b> Counted from the right of <b>R</b>,     only one person sits between <b>R</b> and <b>S</b>.     Then, with one person between <b>S </b>and <b>O</b>,     and only one between <b>R</b> and <b>Q</b>, we     establish a core sequence: <b>R — (M) — S — (N) — O     — (Q)</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Place     M, N, and Q:</b> The constraint that only two people sit     between <b>M</b> and <b>O</b> fixes <b>M</b> between <b>R</b> and <b>S</b>.     The rule that only one person sits between <b>N</b> and <b>Q</b> allows     us to place <b>N</b> between <b>S</b> and <b>O</b>,     and <b>Q</b> to the right of <b>O</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Final     Seat for P:</b> After placing everyone else, only one spot     remains between <b>Q</b> and <b>R</b>, which must     be occupied by <b>P</b>.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1773186555516_html_7b3811947dbf408d.jpg\" width=\"288\" height=\"249\" > </p>    <ul>     <li><p style=\"orphans:0;widows:0\"><b>S sits third to the right     of P</b></p>    </li></ul>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"orphans:0;widows:0\">    A, B, C, D, E and F live on six different floors of the same    building. The lowermost floor in the building is numbered 1, the    floor above it, number 2 and so on till the topmost floor is    numbered 6. Only two people lives between B and F. Only A lives    above D. E lives on an even numbered floor. B lives on the    lowermost floor. How many people live between C and A?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Two</p>", "option2": " <p style=\"orphans:0;widows:0\">    Four</p>", "option3": " <p style=\"orphans:0;widows:0\">    one</p>", "option4": " <p style=\"orphans:0;widows:0\">    five</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Fixed     Base:</b> <b>B</b> lives on the lowermost floor (<b>Floor     1</b>).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Locating     F:</b> Since exactly two people live between <b>B</b> and <b>F</b>, <b>F</b> must     be on <b>Floor 4</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>The     A-D Pair:</b> The rule \"Only <b>A</b> lives     above <b>D</b>\" means <b>A</b> must be on the     topmost floor (<b>Floor 6</b>) and <b>D</b> must be     on <b>Floor 5</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Placing     E and C:</b> <b>E</b> lives on an even-numbered floor.     With Floors 4 and 6 already occupied, <b>E</b> must be     on <b>Floor 2</b>. This leaves <b>Floor 3</b> for <b>C</b>.</p>    </li></ul>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <b>Floor</b></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <b>Person</b></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <b>6</b></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       A</p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <b>5</b></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       D</p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <b>4</b></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       F</p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <b>3</b></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       C</p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <b>2</b></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       E</p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <b>1</b></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       B</p>      </td>     </tr>    </table>    <p style=\"line-height:100%;orphans:0;widows:0;margin-bottom:0in\">    Two people live between A and C. </p>    <p style=\"line-height:100%;orphans:0;widows:0;margin-bottom:0in\">    <b>Hence, Two is the correct answer.</b></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the given statements and conclusions carefully. Assuming that    the information given in the statements is true, even if it    appears to be at variance with commonly known facts, decide which    of the given conclusions logically follow(s) from the statements.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Statements:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Some Pen are    Tiger.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Some Pen are    Water.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Some Tiger    are Book</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Conclusions</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(I) Some Pen    are Book.</p>    <p style=\"orphans:0;widows:0\">(II) Some Tiger are Water.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Both conclusions (I) and (II) follow</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only conclusion (I) follows.</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Neither conclusion (I) nor (II) follows.</p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option4": " <p style=\"orphans:0;widows:0\">    Only conclusion (II) follows.</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1773186555516_html_990347b2c072d877.jpg\" width=\"373\" height=\"158\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>(I) Some    pen are Book:</b> While some pen are Tiger and some Tiger are    Book, there is <b>no direct connection</b> stated    between \"Pen\" and \"Book.\"</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>(II) Some    Tiger are Water:</b> There is <b>no stated    relationship</b> between \"Tiger\" and \"Water.\"    Therefore, this does not follow.</p>    <p style=\"orphans:0;widows:0\"><b>Result:</b> <b>Neither    Conclusion (I) nor (II) follows.</b></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"orphans:0;widows:0\">    M, N, O, P, Q and R live on six different floors of the same    building. The lowermost floor in the building is numbered 1, the    floor above it, number 2 and so on till the topmost floor is    numbered 6. Q lives on a floor which is a prime number. The    product of floors on which Q and M live is 8. O lives immediately    above R. The sum of floors on which M and N live is 7. How many    people live between O and Q?</p>", "option1": "<p style=\"orphans:0;widows:0\">    One</p>", "option2": " <p style=\"orphans:0;widows:0\">    Three</p>", "option3": " <p style=\"orphans:0;widows:0\">    Two</p>", "option4": " <p style=\"orphans:0;widows:0\">    Four</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Determine     Q and M:</b> <b>Q</b> lives on a prime-numbered floor     (2, 3, or 5), and the product of the floors for <b>Q</b> and <b>M</b> is     8.</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The      only factors of 8 among the floor numbers (1–6) are 2 and 4.</p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Since <b>Q</b> must      be a prime number, <b>Q</b> lives on <b>Floor      2</b> and <b>M</b> lives on <b>Floor 4</b>.</p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Locate     N:</b> The sum of the floors for <b>M</b> and <b>N</b> is     7. Since <b>M</b> is on Floor 4, <b>N</b> must     live on <b>Floor 3</b> (7 - 4 = 3).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Place     O and R:</b> <b>O</b> lives immediately above <b>R</b>.     The only two consecutive empty slots remaining are <b>Floor     6</b> and <b>Floor 5</b>.</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>O</b> is      on <b>Floor 6</b> and <b>R</b> is on <b>Floor      5</b>.</p>     </li></ul>    </li></ul>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <b>Floor</b></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <b>Person</b></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <b>6</b></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       O</p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <b>5</b></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       R</p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <b>4</b></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       M</p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <b>3</b></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       N</p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <b>2</b></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       Q</p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <b>1</b></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       P</p>      </td>     </tr>    </table>    <p style=\"line-height:100%;orphans:0;widows:0;margin-bottom:0in\">    Three people live between O and Q.</p>    <p style=\"line-height:100%;orphans:0;widows:0;margin-bottom:0in\">    <b>Hence, Three is the correct answer.</b></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the set in which the numbers are related in the same way as    are the numbers of the following sets. (NOTE: Operations should be    performed on the whole numbers, without breaking down the numbers    into their constituent digits. E.g. 13 – Operations on 13 such    as adding/subtracting/multiplying to 13 can be performed. Breaking    down 13 into 1 and 3 and then performing mathematical operations    on 1 and 3 is not allowed.)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(23, 28, 5)</p>    <p style=\"orphans:0;widows:0\">(29, 50, 21)</p>", "option1": "<p style=\"orphans:0;widows:0\">    (36, 52, 13)</p>", "option2": " <p style=\"orphans:0;widows:0\">    (45, 52, 4)</p>", "option3": " <p style=\"orphans:0;widows:0\">    (10, 34, 24)</p>", "option4": " <p style=\"orphans:0;widows:0\">    (48, 71, 20)</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed by both sets is: <b>(First Number) +    (Third Number) = (Second Number)</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Triad 1:    (</b>23, 28, 5)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">                   Relationship: 23 +    5 = 28</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Triad 2</b>:    (29, 20, 21)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">                  Relationship: 29 +    21 = 50</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option    A:</b> (36, 52, 13)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">                                 36 + 13 = 49 (Does not match 52)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option    B:</b> (45, 52, 4)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">                                45 + 4 = 49 (Does not match 52)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option    C: </b>(10, 34, 24)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">                               <b>10 + 24 = 34</b> (<b>Matches!</b>)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option    D: </b>(48, 71, 20)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">                        48 +    20 = 68 (Does not match 71)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"> <b>Answer = (10, 34, 24)</b> </p>", "question_heading": ""}, {"sr_no": 70, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In this    question, a group of numbers is coded by using letters and symbols    as per the table given below and the conditions which follow.</p>    <table>     <col>      <col>      <col>      <col>      <col>      <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <b>Number</b></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       0</p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       1</p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       2</p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       3</p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       4</p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       5</p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       6</p>      </td>             contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  `;

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
