<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>9.) RRB NTPC - MOCK -5 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {

font-family:'Nirmala UI'\"><b>Shield     volcanoes</b></span><span style=\"font-family:'Nirmala UI'\"> are     formed by highly fluid (low-viscosity) lava that spreads over     large areas, creating broad and gently sloping sides.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Composite     volcanoes (Stratovolcanoes) have steep sides and are formed by     alternating layers of lava and ash.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A     caldera is a large depression formed after a volcanic eruption     collapses the summit.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Cinder     cone volcanoes are small and formed mainly from volcanic ash and     cinders.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Example: </span><span style=\"font-family:'Nirmala UI'\"><b>Mauna    Loa</b></span><span style=\"font-family:'Nirmala UI'\"> is one of the    largest shield volcanoes in the world.</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which planet in the Solar System    has the </span><span style=\"font-family:'Nirmala UI'\"><b>maximum    number of confirmed moons</b></span><span style=\"font-family:'Nirmala UI'\">?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Jupiter</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Saturn</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Uranus</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neptune</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking ws:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The Indus River flows mainly </span><span style=\"font-family:'Nirmala UI'\"><b>from    north to south</b></span><span style=\"font-family:'Nirmala UI'\">.    Tributaries joining the river </span><span style=\"font-family:'Nirmala UI'\"><b>from    the western side are called right-bank tributaries</b></span><span style=\"font-family:'Nirmala UI'\">,    while those joining </span><span style=\"font-family:'Nirmala UI'\"><b>from    the eastern side are left-bank tributaries</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    Shyok River originates near the </span><span style=\"font-family:'Nirmala UI'\"><b>Rimo    Glacier in the Karakoram Range</b></span><span style=\"font-family:'Nirmala UI'\"> and    flows through </span><span style=\"font-family:'Nirmala UI'\"><b>Ladakh</b></span><span style=\"font-family:'Nirmala UI'\"> before    joining the Indus River near </span><span style=\"font-family:'Nirmala UI'\"><b>Skardu</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Since    it joins the Indus </span><span style=\"font-family:'Nirmala UI'\"><b>from    the right (western) side</b></span><span style=\"font-family:'Nirmala UI'\">,    it is considered a </span><span style=\"font-family:'Nirmala UI'\"><b>right-bank    tributary</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">On    the other hand, Ravi River, Beas River, and Sutlej River    are </span><span style=\"font-family:'Nirmala UI'\"><b>left-bank    tributaries</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    the correct Answer: Shyok River</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which MS Excel function is used to    count only the cells containing numerical values?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">COUNT</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">COUNTA</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">COUNTIF</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">SUM</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>COUNT</b></span><span style=\"font-family:'Nirmala UI'\"> </span>→<span style=\"font-family:'Nirmala UI'\">     Counts only numeric values.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">COUNTA     </span>→<span style=\"font-family:'Nirmala UI'\"> Counts all non-empty     cells (text + numbers).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">COUNTIF     </span>→<span style=\"font-family:'Nirmala UI'\"> Counts cells based on     a condition.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">SUM     </span>→<span style=\"font-family:'Nirmala UI'\"> Adds numbers.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence </span><span style=\"font-family:'Nirmala UI'\"><b>option    A</b></span><span style=\"font-family:'Nirmala UI'\"> is the correct    option.</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following components    of the CPU performs arithmetic and logical operations?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Control Unit</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Arithmetic Logic Unit</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Cache</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Register</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span><span style=\"font-family:'Nirmala UI'\"><br> The    ALU performs calculations like addition, subtraction, comparison,    AND/OR operations.<br> Control Unit </span>→<span style=\"font-family:'Nirmala UI'\">    Directs operations</span><span style=\"font-family:'Nirmala UI'\"><br> Registers    </span>→<span style=\"font-family:'Nirmala UI'\"> Temporary storage    inside CPU</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding the Governor of a State:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Governor is appointed by the President of India.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Governor holds office during the pleasure of the President.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Governor can make laws independently without the State     Legislature.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the statements given above is/are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 and 2 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 and 3 only</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2 and 3</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     1 – Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> The     Governor is appointed by the President under Article 155.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     2 – Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> The     Governor holds office during the pleasure of the President     (Article 156).</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     3 – Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> The     Governor cannot make laws independently. However, he/she can     promulgate an Ordinance when the State Legislature is not in     session under Article 213.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Under which Article of the Indian    Constitution can a National Emergency be declared on the grounds    of “armed rebellion”?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 352</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 356</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 360</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 368</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article     352</b></span><span style=\"font-family:'Nirmala UI'\"> deals with     National Emergency.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Originally,     the term used was “internal disturbance.”</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>44th     Constitutional Amendment Act, 1978</b></span><span style=\"font-family:'Nirmala UI'\"> replaced     “internal disturbance” with “armed rebellion” to prevent     misuse.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Other    options:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Article     356 </span>→<span style=\"font-family:'Nirmala UI'\"> President’s     Rule (State Emergency)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Article     360 </span>→<span style=\"font-family:'Nirmala UI'\"> Financial     Emergency</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Article     368 </span>→<span style=\"font-family:'Nirmala UI'\"> Amendment of the     Constitution</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which Five Year Plan in India was    based on the Mahalanobis Model emphasizing heavy industries?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">First Five Year Plan</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Second Five Year Plan</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Third Five Year Plan</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Fourth Five Year Plan</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Second Five Year Plan (1956–61) focused on rapid     industrialization.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     was based on the Mahalanobis Model, giving priority to heavy and     basic industries.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The     First Plan focused mainly on agriculture.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Which of the following pairs is/are    correctly matched regarding the Mauryan Empire?</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Kalinga     War – 261 BCE</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Megasthenes     – Author of </span><span style=\"font-family:'Nirmala UI'\"><i>Indica</i></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Ashoka     – Issued the Minor Rock Edict at Maski mentioning his personal     name</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Bindusara     – Founder of the Mauryan Empire</span></p>    </li></ol>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 and 2 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 and 3 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2 and 3 only</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2, 3 and 4</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Kalinga War took place around </span><span style=\"font-family:'Nirmala UI'\"><b>261     BCE</b></span><span style=\"font-family:'Nirmala UI'\"> during the     reign of Ashoka – correct.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Megasthenes wrote </span><span style=\"font-family:'Nirmala UI'\"><i>Indica</i></span><span style=\"font-family:'Nirmala UI'\">,     describing the Mauryan administration – correct.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In     the Maski Minor Rock Edict, Ashoka’s personal name “Ashoka”     is mentioned instead of just “Devanampiya Piyadasi” –     correct.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The     Mauryan Empire was founded by Chandragupta Maurya, not     Bindusara – so statement 4 is incorrect.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding Sher Shah Suri:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">He     defeated Humayun in the Battle of Chausa in 1539.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">He     built the Purana Qila in Delhi.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">He     introduced the system of branding of horses (Dagh) in the army.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">He     died during the siege of Kalinjar.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the statements given above are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2 and 4 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 and 4 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 3 and 4 only</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2, 3 and 4</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span><span style=\"font-family:'Nirmala UI'\"><br> Sher    Shah Suri defeated Humayun at the Battle of Chausa    in 1539 and later at Kannauj. He renovated and expanded Purana    Qila in Delhi. He died in 1545 due to a gunpowder explosion during    the siege of Kalinjar Fort.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    system of branding of horses (</span><span style=\"font-family:'Nirmala UI'\"><i>Dagh</i></span><span style=\"font-family:'Nirmala UI'\">)    was later properly organized under </span><span style=\"font-family:'Nirmala UI'\"><b>Alauddin    Khalji </b></span><span style=\"font-family:'Nirmala UI'\">not Sher    Shah Suri.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Who among the following introduced    strict market control regulations in Delhi to maintain low prices    of essential commodities and military supplies?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Balban</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Alauddin Khilji</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Muhammad bin Tughlaq</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Firoz Shah Tughlaq</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span><span style=\"font-family:'Nirmala UI'\"><br> Alauddin    Khilji introduced a strict system of market control in Delhi. He    regulated prices of food grains, cloth, horses, and other goods to    maintain a large army at low cost and to prevent hoarding and    black marketing.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The Quit India Resolution was    passed at which session of the Indian National Congress?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lahore Session, 1929</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Karachi Session, 1931</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bombay Session, 1942</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Wardha Session, 1940</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Quit    India Resolution was passed on 8 August 1942</b></span><span style=\"font-family:'Nirmala UI'\"> at    the</span><span style=\"font-family:'Nirmala UI'\"><b> Bombay    Session</b></span><span style=\"font-family:'Nirmala UI'\"> of the    Indian National Congress, held at Gowalia Tank Maidan (now August    Kranti Maidan). </span><span style=\"font-family:'Nirmala UI'\"><b>The    movement was led by Mahatma Gandhi, who gave the famous call    of “Do or Die.”</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">This    marked the beginning of a mass civil disobedience movement    demanding immediate independence from British rule.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following newspapers    was founded by Bal Gangadhar Tilak to spread nationalist ideas    among the masses?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Amrita Bazar Patrika</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kesari</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The Hindu</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Young India</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span><span style=\"font-family:'Nirmala UI'\"><br> Bal    Gangadhar Tilak founded the newspapers </span><span style=\"font-family:'Nirmala UI'\"><b>Kesari</b></span><span style=\"font-family:'Nirmala UI'\"> (in    Marathi) and </span><span style=\"font-family:'Nirmala UI'\"><i>Mahratta</i></span><span style=\"font-family:'Nirmala UI'\"> (in    English) to promote nationalist ideas and political awareness.    Through these newspapers, he strongly criticized British policies    and inspired the freedom movement.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><i>Young    India</i></span><span style=\"font-family:'Nirmala UI'\"> was later    associated with Mahatma Gandhi.</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following monetary    policy tools is used by the Reserve Bank of India to absorb excess    liquidity from the banking system on a short-term basis?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Repo Rate</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Reverse Repo Rate</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bank Rate</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Cash Reserve Ratio</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span><span style=\"font-family:'Nirmala UI'\"><br> The </span><span style=\"font-family:'Nirmala UI'\"><b>Reverse    Repo Rate</b></span><span style=\"font-family:'Nirmala UI'\"> is the    rate at which the Reserve Bank of India borrows money    from commercial banks. When RBI increases the reverse repo rate,    banks are encouraged to deposit more funds with RBI, which helps    absorb excess liquidity from the market and control inflation.</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following taxes    is </span><span style=\"font-family:'Nirmala UI'\"><b>not</b></span><span style=\"font-family:'Nirmala UI'\"> included    in the divisible pool of taxes shared between the Centre and the    States?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Corporation Tax</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Customs Duty</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Surcharge on Income Tax</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Union Excise Duty</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span><span style=\"font-family:'Nirmala UI'\"><br> Under    Article 270 of the Constitution, most central taxes form part of    the divisible pool and are shared with states based on the    recommendations of the Finance Commission of India.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">However, </span><span style=\"font-family:'Nirmala UI'\"><b>surcharges    and cesses</b></span><span style=\"font-family:'Nirmala UI'\"> levied    by the Union government are </span><span style=\"font-family:'Nirmala UI'\"><b>not    shareable</b></span><span style=\"font-family:'Nirmala UI'\"> with    states. That is why Surcharge on Income Tax does not form part of    the divisible pool.</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The National Makhana Board has been    established primarily to promote the cultivation and export of    makhana in which state of India?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Uttar Pradesh</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bihar</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Assam</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">West Bengal</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span><span style=\"font-family:'Nirmala UI'\"><br> The </span><span style=\"font-family:'Nirmala UI'\"><b>National    Makhana Board </b></span><span style=\"font-family:'Nirmala UI'\">has    been set up to promote production, processing, value addition, and    export of makhana (fox nuts).</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Bihar    is the largest producer of makhana in India, especially in    the </span><span style=\"font-family:'Nirmala UI'\"><b>Mithilanchal    region</b></span><span style=\"font-family:'Nirmala UI'\">, and the board    aims to support farmers, improve research, and enhance global    competitiveness of this crop.</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Who was recently elected as the    first woman President of the Press Club of India in 2025?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Jatin Gandhi</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Afzal Imam</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sangeeta Barooah Pisharoty</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Aditi Singh Rajput</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span><span style=\"font-family:'Nirmala UI'\"><br> Senior    journalist Sangeeta Barooah Pisharoty made history in December    2025 by becoming the </span><span style=\"font-family:'Nirmala UI'\"><b>first    woman President</b></span><span style=\"font-family:'Nirmala UI'\"> of    the Press Club of India, winning the election along with her    team sweeping key positions. She secured this leadership role in    one of India’s most prominent journalist bodies, marking a    significant moment for gender representation in media leadership.</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <span tyle=\"font-family:'Nirmala UI'\"><b>    Meghalaya</b></span><span style=\"font-family:'Nirmala UI'\"> (harvest    festival of the </span><span style=\"font-family:'Nirmala UI'\"><b>Garo    tribe</b></span><span style=\"font-family:'Nirmala UI'\">)</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In early 2026, the Government of    India released its first ever comprehensive anti-terror doctrine    aimed at countering cross-border terror, cyber threats, and misuse    of drones. What is the name of this doctrine?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">GUARDIAN</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">PRAHAAR</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">SANCHAR</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">SURAKSHA</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Purpose     of the Doctrine:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The      doctrine is India’s </span><span style=\"font-family:'Nirmala UI'\"><b>first      integrated counter-terrorism strategy</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It      addresses </span><span style=\"font-family:'Nirmala UI'\"><b>modern      security threats</b></span><span style=\"font-family:'Nirmala UI'\">,      including cross-border terrorism, cyber attacks, and the      potential use of drones for attacks.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This      is part of India’s move to strengthen its national security      framework in line with global best practices.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Why     “PRAHAAR”?</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">“<span style=\"font-family:'Nirmala UI'\">PRAHAAR”      is an acronym derived from </span><span style=\"font-family:'Nirmala UI'\"><b>“Proactive,      Responsive, and Holistic Approach to Anti-terrorism”</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It      represents a </span><span style=\"font-family:'Nirmala UI'\"><b>coordinated      effort between military, intelligence, police, and civil      agencies</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The      doctrine emphasizes </span><span style=\"font-family:'Nirmala UI'\"><b>prevention,      preparedness, and rapid response</b></span><span style=\"font-family:'Nirmala UI'\">,      rather than just post-incident action.</span></p>     </li></ul>    </li></ol>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">India’s men’s football team    will compete in the </span><span style=\"font-family:'Nirmala UI'\"><b>SAFF    Championship</b></span><span style=\"font-family:'Nirmala UI'\"> in    September</span><span> </span><span style=\"font-family:'Nirmala UI'\">2026.    In which country is this tournament scheduled to be held?</span></p>", "option1": "<p rking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span><span style=\"font-family:'Nirmala UI'\"><br> The United    Nations Security Council is responsible for maintaining    international peace and security. It has the authority to impose    economic sanctions and authorize military action.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    General Assembly can make recommendations, the International Court    of Justice settles legal disputes, and ECOSOC deals with economic    and social issues.</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In a certain code language, ‘GSTA’    is coded as ‘55’ and ‘XMBJ’ is coded as ‘57’. What is    the code for ‘ZEPN’ in the given language?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">58</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">55</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">60</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">69</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"page-break-inside:avoid;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The Logic follows here </span><span style=\"font-family:'Nirmala UI'\"><b>:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>(Sum    of Positional Values) + (8)</b></span></p>    <p style=\"page-break-inside:avoid;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>    <p style=\"page-break-inside:avoid;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>GSTA </b></span><span style=\"font-family:'Nirmala UI'\">=    55 - G(7) + S(19) + T(20) + A(1) = 47</span></p>    <p style=\"page-break-inside:avoid;orphans:0;widows:0;margin-bottom:0in\">                       <span style=\"font-family:'Nirmala UI'\">47    + 8 = 55</span></p>    <p style=\"page-break-inside:avoid;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>XMBJ </b></span><span style=\"font-family:'Nirmala UI'\">=    57</span><span style=\"font-family:'Nirmala UI'\"><b> </b></span><span style=\"font-family:'Nirmala UI'\">-     X(24) + M(13) + B(2) + J(10) = 49</span></p>    <p style=\"page-break-inside:avoid;orphans:0;widows:0;margin-bottom:0in\">                      <span style=\"font-family:'Nirmala UI'\">49    + 8 = 57</span></p>    <p style=\"page-break-inside:avoid;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>ZEPN = ?</b></span><span style=\"font-family:'Nirmala UI'\">    -  Z(26) + E(5) + P(16) + N(14) = 61</span></p>    <p style=\"page-break-inside:avoid;orphans:0;widows:0;margin-bottom:0in\">                       <span style=\"font-family:'Nirmala UI'\">61    + 8 = 69</span></p>    <p style=\"page-break-inside:avoid;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>    <p style=\"page-break-inside:avoid;orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    the code for ‘ZEPN’ is 69</b></span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">NCLG is related to PHNL in a    certain way based on the English alphabetical order. In the same    way, QLOP is related to SQQU. To which of the given options is    VWTZ related, following the same logic?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">VBUD</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI >    <span style=\"font-family:'Nirmala UI'\">In a certain code language, ‘LAST’    is coded as ‘2468’ and ‘SNOW’ is coded as ‘1327’. What    is the code for ‘S’ in the given code language?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">7</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The logic relies on finding    the </span><span style=\"font-family:'Nirmala UI'\"><b>common    element</b></span><span style=\"font-family:'Nirmala UI'\"> between the    two words.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>LAST</b></span><span style=\"font-family:'Nirmala UI'\"> =    2468</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>SNOW</b></span><span style=\"font-family:'Nirmala UI'\"> =    1327</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    only letter present in both \"LAST\" and \"SNOW\"    is </span><span style=\"font-family:'Nirmala UI'\"><b>S</b></span><span style=\"font-family:'Nirmala UI'\">.    Looking at the codes, the only digit present in both \"2468\"    and \"1327\" is </span><span style=\"font-family:'Nirmala UI'\"><b>2</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    the correct answer is 2</b></span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p sty -family:'Nirmala UI'\">,    Second letter </span><span style=\"font-family:'Nirmala UI'\"><b>+9</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Applying    the logic to  </span><span style=\"font-family:'Nirmala UI'\"><b>Option B    (LH - OK - RT)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>LH    to OK:</b></span><span style=\"font-family:'Nirmala UI'\"> L(12) + 3 =    O(15) | H(8) + 3 = K(11) (</span><span style=\"font-family:'Nirmala UI'\"><b>Matches</b></span><span style=\"font-family:'Nirmala UI'\">)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>OK    to RT:</b></span><span style=\"font-family:'Nirmala UI'\"> O(15) + 3 =    R(18) | K(11) + 9 = T(20) (</span><span style=\"font-family:'Nirmala UI'\"><b>Matches</b></span><span style=\"font-family:'Nirmala UI'\">)</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    the correct answer is (LH-OK-RT)</b></span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Which of the following    letter-clusters should replace # and % so that the pattern and    relationship followed between the letter-cluster pair on the left    side of :: is the same as that on the right side of ::?</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">#    : ONJ :: VUQ : %</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"># = AIM, % = STX</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"># = RQM, % = SRN</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"># = DIO, % = AST</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"># = RHM, % = PRZ</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>The logic</b></span><span style=\"font-family:'Nirmala UI'\"> for    this letter-cluster analogy is a consistent </span><span style=\"font-family:'Nirmala UI'\"><b>subtraction    of 3 </b></span><span style=\"font-family:'Nirmala UI'\"> from the    positional value of each letter.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>First    Pair (# : ONJ)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>R</b></span><span style=\"font-family:'Nirmala UI'\"> (18)    - 3 = </span><span style=\"font-family:'Nirmala UI'\"><b>O</b></span><span style=\"font-family:'Nirmala UI'\"> (15)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Q</b></span><span style=\"font-family:'Nirmala UI'\"> (17)    - 3 = </span><span style=\"font-family:'Nirmala UI'\"><b>N</b></span><span style=\"font-family:'Nirmala UI'\"> (14)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>M</b></span><span style=\"font-family:'Nirmala UI'\"> (13)    - 3 = </span><span style=\"font-family:'Nirmala UI'\"><b>J</b></span><span style=\"font-family:'Nirmala UI'\"> (10)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Result:    # = RQM</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Second    Pair (VUQ : %)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>V</b></span><span style=\"font-family:'Nirmala UI'\"> (22)    - 3 = </span><span style=\"font-family:'Nirmala UI'\"><b>S</b></span><span style=\"font-family:'Nirmala UI'\"> (19)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>U</b></span><span style=\"font-family:'Nirmala UI'\"> (21)    - 3 = </span><span style=\"font-family:'Nirmala UI'\"><b>R</b></span><span style=\"font-family:'Nirmala UI'\"> (18)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Q</b></span><span style=\"font-family:'Nirmala UI'\"> (17)    - 3 = </span><span style=\"font-family:'Nirmala UI'\"><b>N</b></span><span style=\"font-family:'Nirmala UI'\"> (14)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Result:    % = SRN</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    the correct answer is  (# = RQM, % = SRN)</b></span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Based on the English alphabetical    order, three of the following four letter-cluster pairs are alike    in a certain way and thus form a group. Which letter-cluster pair    DOES NOT belong to that group? (Note: The odd one out is not based    on the number of consonants/vowels or their position in the    letter-cluster.)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">HZ-MS</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">MF-RY</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">YR-FK</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">AT-FM</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Logic:</b></span><span style=\"font-family:'Nirmala UI'\"> In    three of the pairs,</span><span style=\"font-family:'Nirmala UI'\"><b> the    first letter shifts by +5</b></span><span style=\"font-family:'Nirmala UI'\"> and    the </span><span style=\"font-family:'Nirmala UI'\"><b>second letter shifts    by</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>-7</b></span><span style=\"font-family:'Nirmala UI'\"> to    form the second cluster.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>HZ    - MS:</b></span><span style=\"font-family:'Nirmala UI'\"> H(8) + 5    = </span><span style=\"font-family:'Nirmala UI'\"><b>M</b></span><span style=\"font-family:'Nirmala UI'\">(13)    | Z(26) - 7 = </span><span style=\"font-family:'Nirmala UI'\"><b>S</b></span><span style=\"font-family:'Nirmala UI'\">(19)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>MF    - RY:</b></span><span style=\"font-family:'Nirmala UI'\"> M(13) + 5    = </span><span style=\"font-family:'Nirmala UI'\"><b>R</b></span><span style=\"font-family:'Nirmala UI'\">(18)    | F(6) - 7 = </span><span style=\"font-family:'Nirmala UI'\"><b>Y</b></span><span style=\"font-family:'Nirmala UI'\">(25) (Cycles    back from A)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>AT    - FM:</b></span><span style=\"font-family:'Nirmala UI'\"> A(1) + 5    = </span><span style=\"font-family:'Nirmala UI'\"><b>F</b></span><span style=\"font-family:'Nirmala UI'\">(6)    | T(20) - 7 = </span><span style=\"font-family:'Nirmala UI'\"><b>M</b></span><span style=\"font-family:'Nirmala UI'\">(13)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The    Odd One Out:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>YR    - FK:</b></span><span style=\"font-family:'Nirmala UI'\"> Y(25) + 5    = </span><span style=\"font-family:'Nirmala UI'\"><b>D</b></span><span style=\"font-family:'Nirmala UI'\">(4)    | R(18) - 7 = </span><span style=\"font-family:'Nirmala UI'\"><b>K</b></span><span style=\"font-family:'Nirmala UI'\">(11)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    first letter should be </span><span style=\"font-family:'Nirmala UI'\"><b>D</b></span><span style=\"font-family:'Nirmala UI'\">,    but the pair uses </span><span style=\"font-family:'Nirmala UI'\"><b>F</b></span><span style=\"font-family:'Nirmala UI'\">.    Therefore, this pair does not follow the (+5, -7) pattern.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    the correct answer is (YR-FK)</b></span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">What should come in place of the    question mark (?) in the given series?</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">7,    13, ? , 145, 721, 4321</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">23</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">36</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">25</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">37</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1773448
