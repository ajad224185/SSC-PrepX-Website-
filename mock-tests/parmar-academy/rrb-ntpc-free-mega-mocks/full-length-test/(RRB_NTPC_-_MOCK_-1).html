<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>1.) RRB NTPC - MOCK -1 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {

pt\"><span style=\"font-family:'Nirmala UI'\"> </span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Who among the following acts as a guardian of the Constitution of India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Juvenile Justice Board</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">District Court</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Supreme Court</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">High Court</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1771731187170_image018.png\" width=\"25\" height=\"25\" alt ><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">Additional Information</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">Supreme Court at the apex of the Indian Judiciary is the highest authority to uphold the Constitution of India, to protect the rights and liberties of the citizens, and to uphold</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">the values of rule of law.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">The Indian Constitution provides for a provision of the</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Supreme Court under Part V (The Union) and Chapter 6 titled 'The Union Judiciary'.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">The Constitution of India has provided an independent judiciary with a hierarchical setup containing</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">High Courts and Subordinate Courts</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">under it.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">India is a federal State having a single and unified judicial system with a three-tier structure, i.e.,</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Supreme Court, High Courts and Subordinate Courts.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">The</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Indian Constitution under Article 124(1)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">states that there shall be a Supreme Court of India consisting of a</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Chief Justice of India (CJI) and 34 judges, including the CJI</span><span style=\"font-family:'Nirmala UI'\">.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">The Jurisdiction of the Supreme Court of India can broadly be categorised into original jurisdiction, appellate jurisdiction and advisory jurisdiction.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Hence the correct answer is</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Supreme Court</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Which one of the following is a non-constitutional and non-statutory body?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Unique Identification Authority of India</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">NITI Aayog</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">National Human Rights Commission</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Competition Commission of India</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1771731187170_image019.png\" width=\"29\" height=\"29\" alt ><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">Additional Information</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">NITI Aayog was established by the</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Government of India in 2015</span><span style=\"font-family:'Nirmala UI'\">.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">It is an advisory body to the government on matters of economic policy and development.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">It is not a constitutional body and does not have any specific powers or functions that are mentioned in any law. (Hence Option 2 is correct)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">The main purpose of NITI Aayog is to replace the Planning Commission of India.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">The Planning Commission was a non-statutory body that was established in 1950. It was responsible for formulating and implementing the national development plans.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">The chairman of NITI Aayog is Prime Minister of India</span><span style=\"font-family:'Nirmala UI'\">. The chairman is assisted by a vice-chairman and a few other members.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1771731187170_image020.png\" width=\"30\" height=\"24\" alt ><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Unique Identification Authority of India (UIDAI)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">It is a statutory authority established by the Government of India under the Aadhaar Act, 2016.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">The UIDAI is responsible for issuing 12-digit Aadhaar numbers to all residents of India.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">National Human Rights Commission (NHRC)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">It is a statutory body established by the Government of India under the Protection of Human Rights Act, 1993.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">It does this by investigating complaints of human rights violations, recommending measures to prevent human rights violations, and spreading awareness about human rights.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Competition Commission of India (CCI)</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">It is an autonomous statutory body established by the Government of India under the Competition Act, 2002.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">The CCI is responsible for promoting and enforcing competition in the markets of India.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">It does this by preventing anti-competitive practices such as cartels, abuse of dominance, and unfair trade practices.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Hence the correct answer is</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Niti Aayog</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">The idea of the Concurrent List has been taken from the constitution of__</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">South Africa</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Australia</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Canada</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Germany</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "   <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1771731187170_image013.png\" width=\"23\" height=\"23\" alt ><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">Additional Information:</span></p><table cellspacing=\"0\" cellpadding=\"0\" style=\"width:325.2pt;border:0.75pt solid #000000;border-collapse:collapse\"><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Country</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Borrowed Features</span></p></td></tr><tr><td style=\"border: 1px soli ht:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">iii) 61st (1989)</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">C. Added Fundamental Duties &amp; changed Preamble</span></p></td></tr><tr><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">iv) 86th (2002)</span></p></td><td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">D. Made Right to Education a Fundamental Right</span></p></td></tr></table><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">i–C, ii–B, iii–A, iv–D</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">i–B, ii–C, iii–D, iv–A</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">i–A, ii–D, iii–C, iv–B</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">i–D, ii–A, iii–B, iv–C</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1771731187170_image013.png\" width=\"23\" height=\"23\" alt ><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">Additional information</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">42nd Amendment (1976):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">- Known as the “</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Mini-Constitution.</span><span style=\"font-family:'Nirmala UI'\">”</span><br><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">- Added Fundamental Duties (</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Article 51A</span><span style=\"font-family:'Nirmala UI'\">).</span><br><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">- Changed the Preamble: added “</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Socialist</span><span style=\"font-family:'Nirmala UI'\">,” “</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Secular</span><span style=\"font-family:'Nirmala UI'\">,” and “</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Integrity</span><span style=\"font-family:'Nirmala UI'\">.”</span><br><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">- Strengthened central government powers during Emergency.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">44th Amendment (1978):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">- Reversed many provisions of the 42nd Amendment.</span><br><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">- Restored Fundamental Rights curtailed during Emergency.</span><br><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">- Limited grounds for declaring National Emergency (only on “armed rebellion”).</span><br><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">- Property right moved from Fundamental Right to a legal right.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">•</span><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">61st Amendment (1989):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">- Reduced voting age from 21 to 18 years.</span><br><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">- Expanded democratic participation, especially for youth.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">•</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">86th Amendment (2002):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">- Inserted Article 21A: Right to Education as a Fundamental Right.</span><br><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">- Made free and compulsory education for children aged 6–14 years.</span><br><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">- Strengthened India’s commitment to universal education.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Hence the correct answer is</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">i–C, ii–B, iii–A, iv–D</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Consider the following statements about Article 21A:</span></p><ol type=\"1\"><li style=\"margin-left:32.07pt;line-height:116%;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span>It was added by the 86th Constitutional Amendment Act, 2002.</span></li><li style=\"margin-left:32.07pt;line-height:116%;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span>It guarantees free and compulsory education to children aged 6 to 14 years.</span></li><li style=\"margin-left:32.07pt;line-height:116%;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span>It is enforceable only during emergencies.</span></li></ol><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Which statements are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1 and 2 only</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">2 and 3 only</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">1 and 3 only</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">All of the above</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1771731187170_image011.png\" width=\"26\" height=\"26\" alt ><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">Additional Information</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Article 21A</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">guarantees right to free and compulsory education for children</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">aged 6– 14</span><span style=\"font-weight:bold;font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">and was added by the 86th Amendment.</span><span style=\"font-family:'Nirmala UI'\"> </span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">It is enforceable at all times, not just during emergencies.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Hence the correct answer is</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1 and 2 only</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Which of the following statements is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A Judge of the Supreme Court submits his resignation to the President.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A Judge of the Supreme Court submits his resignation to the Prime Minister.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A Judge of the Supreme Court submits his resignation to the Vice-President.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">A Judge of the Supreme Court submits his resignation to the Attorney-General.</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">Judges of the Supreme Court are appointed by the President under</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Article 124(2</span><span style=\"font-family:'Nirmala UI'\">) of the Constitution.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">A judge of the Supreme Court submits his resignation to the President of India.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1771731187170_image011.png\" width=\"26\" height=\"26\" alt ><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">Additional Information:</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">A person to be appointed as a judge of the Supreme Court should have the following qualifications under Article 124 (3).</span></p><ol type=\"1\"><li style=\"margin-left:32.07pt;line-height:116%;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span>Should be a citizen of India.</span></li><li style=\"margin-left:32.07pt;line-height:116%;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span>Should have been a judge of a High Court (or High courts in succession) for at least five years.</span></li><li style=\"margin-left:32.07pt;line-height:116%;padding-left:3.93pt;font-family:'Nirmala rgin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1771731187170_image022.png\" width=\"19\" height=\"19\" alt ><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">Additional Information</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">Revolution is elliptical and takes ~365.25 days; day-night is</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">due to rotation.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Elliptical orbit</span><span style=\"font-family:'Nirmala UI'\">: Earth’s path around the Sun is not a perfect circle but an ellipse.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Time taken</span><span style=\"font-family:'Nirmala UI'\">: One revolution = 365 days + 6 hours. Extra 6 hours accumulate </span><span style=\"font-family:'Arial Unicode MS'\">→</span><span style=\"font-family:'Nirmala UI'\"> leap year every 4 years.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Day &amp; night</span><span style=\"font-family:'Nirmala UI'\">: Caused by Earth’s</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">rotation</span><span style=\"font-family:'Nirmala UI'\">, not revolution.</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">Revolution =</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">seasons</span><span style=\"font-family:'Nirmala UI'\">, Rotation =</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">day/night</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Hence the correct Answer is</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">1 and 2 only</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Consider the following statements about planets which of the statements is/are correct?</span></p><ol type=\"1\"><li style=\"margin-left:32.07pt;line-height:116%;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span>Mercury is the smallest planet in the Solar System.</span></li><li style=\"margin-left:32.07pt;line-height:116%;padding-left:3.93pt;font-family:'Nirmala UI';font-size:12pt\"><span>Jupiter is the largest planet in the Solar System.</span></li></ol><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:11 idth=\"18\" height=\"18\" alt ><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">Additional Information</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">NABARD</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">(National Bank for Agriculture and Rural Development) launched the Self-Help Group - Bank Linkage Programme (SHG-BLP) in 1992, which is considered the world's largest microfinance initiative.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">The programme aims to link banks and Self-Help Groups (SHGs), enabling financial inclusion and empowering rural households, especially women.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Self Help Groups (SHGs):</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">SHGs are informal associations of 10-20 people, typically women, who come together to save small amounts and access credit to meet their needs.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">The concept of SHGs promotes financial literacy, peer support, and collective decision-making.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">NABARD</span><span style=\"font-family:'Nirmala UI'\">: It was established in 1982 under the recommendations of the B. Sivaraman Committee.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">It is India's apex development bank for financing agriculture and rural development.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">NABARD plays a pivotal role in rural credit planning and implementation of various government schemes.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1771731187170_image004.png\" width=\"24\" height=\"20\" alt ><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Microfinance:</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">It refers to providing small loans and financial services to individuals or groups who lack access to traditional banking services</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Hence the correct answer is</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">NABARD</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Which of the following best represents the concept of Net Domestic Product (NDP)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">GDP - Income from abroad</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">GDP + Income from abroad</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">GNP - Depreciation</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">GDP - Depreciation</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1771731187170_image019.png\" width=\"29\" height=\"29\" alt ><span style=\"font-weight:bold;text-decoration:underline;font-family:'Nirmala UI'\">Additional Information</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">Net domestic product (NDP) is an annual measure of the economic output of a nation that is adjusted as per the depreciation effect.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">The NDP is calculated by</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">subtracting depreciation from the gross domestic product</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">(GDP).</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">An increased NDP indicates growth in economic health, while a decrease would indicate a slowdown of the economy of the country.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-family:'Nirmala UI'\">Depreciation is the measure of the decreased monetary value of an asset over time due to use, wear and tear, or obsolescence.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Gross National Income (GNI)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">is the total amount of money earned by a nation's people and businesses.</span></p><p style=\"margin-top:0pt;margin-left:36pt;margin-bottom:0pt;text-indent:-18pt;line-height:116%;font-size:12pt\"><span style=\"font-size:10pt;font-family:'Symbol'\">●</span><span style=\"width:12pt;font:7pt 'Times New Roman';display:inline-block;font-family:'Times New Roman'\">        </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">Net national product (NNP)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\">is the monetary value of finished goods and services produced by a country's citizens, overseas and domestically, in a given period.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Hence the correct answer is</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-weight:bold;font-family:'Nirmala UI'\">GDP-Depreciation</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\"> </span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Which of the following is a bowed string instrument of India?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;line-height:116%;font-size:12pt\"><span style=\"font-family:'Nirmala UI'\">Sitar</span></p>", "option2": " <p style=\"margin-top:0pt;margin-botto let currentQuestion = 0;

let bookmarks = new Set();

let isPaletteOpen = false;

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);

  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);

  if (overlay) {

      closePalette();

  const searchInput = document.getElementById('paletteSearch');
