<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3.) RRB NTPC - MOCK -2 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {

pan style=\"font-size:12pt\"> Dr.     Soumya Kanti Ghosh and Shri T. Rabi Sankar.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Finance     Commission Act, 1951.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Dr.    Arvind Panagariya</b></span></span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The______was    started by the Sikh reformers to purify their religious places by    removing the evil social practices that had slowly crept into    them.</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Namdhari    Movement</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Akali    Movement</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Ghadar    Movement</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Nirankari    Movement</span></span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_6de0b7b16f9df427.png\" width=\"16\" height=\"16\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    Information</b></u></span></span></p>    < >     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     73rd Constitutional Amendment Act came in 1992 and it gave     constitutional status to the three-tier structure of Panchayati     Raj Institutions.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">101st     Constitutional Amendment Act, 2016 applied GST throughout the     country from 1 July 2017.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">103rd     Constitutional Amendment Act, 2019 gave 10% reservation to the     economically weaker section.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>92nd    Constitution Amendment Act of 2003</b></span></span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The    folk dance ‘Bagurumba’ is performed by which community in    Assam?</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Santhals</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Bodos</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Meiteis</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Garos</span></span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_93859ba3b3f09532.png\" width=\"18\" height=\"18\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    Information</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Bagurumba     is a traditional folk dance of the Bodo community in Assam, often     called the “butterfly dance” because its graceful movements     resemble butterflies fluttering in nature. It is performed mainly     by women during festivals like </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><i>Bwishagu</i></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> and     is deeply connected to themes of nature, fertility, and community     life.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Music    &amp; Instruments:</b></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Accompanied    by indigenous instruments like:</span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Kham</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> (long     cylindrical drum)</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Sifung</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> (bamboo     flute)</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Serja</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> (bowed     instrument)</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Tharkha</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> (split     bamboo clapper)</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Jota/Gongwan</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> (metal    or bamboo percussion)</span></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Bodos</b></span></span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Carnatic    music is confined to ______ .</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Karnataka,    Maharashtra, Gujarat and Rajasthan</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Uttar    Pradesh, Bihar, West Bengal and Haryana</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Gujarat,    Maharashtra, Rajasthan and Haryana</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font- font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">cow-worshiping</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">snake-worshiping</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">owl-worshiping</span></span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_4df59c8df96d6ec7.png\" width=\"15\" height=\"15\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    Information</b></u></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Gugga    Naumi festival celebrated in the honour of Gugga Pir. It is    observed on the 9th day of the Krishna Paksha (</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>waning    phase of moon</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">)    in Bhadon month (</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>August    and September)</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">.</span></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Snake-worshiping.</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> </span></span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the following is the correct formula for calculating Net    Indirect Taxes? </span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Direct    Taxes + Subsidies</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Indirect    Taxes – Subsidies</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Indirect    Taxes + Subsidies</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Direct    Taxes – Subsidies</span></span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_6de0b7b16f9df427.png\" width=\"16\" height=\"16\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    Information</b></u></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Net    Indirect Taxes</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">:    Taxes that are levied on services and products and are collected    by the seller. Examples - Sales tax, Value-added tax (VAT), Excise    tax, Customs duty, Service tax. Indirect taxes are transferable    taxes where the liability to pay can be shifted to others like    Value Added Tax.</span></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Indirect    Taxes - Subsidies.</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> </span></span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the following statements about transfer payments are correct?</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1. Transfer    payments are made by the government to households.</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2. Pension,    scholarship etc. is not a part of the transfer payments.</span></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">3. Transfer    payments are often used as a means of redistributing income within    a society.</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1,    2 and 3</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2    and 3 only</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 2 only</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 3 only</span></span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_aee53d74ccfbe355.png\" width=\"20\" height=\"20\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    Information</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Transfer     payments are the receipts which the residents of a country get     for 'free', without having to provide any goods or services in     return.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">They     consist of gifts, remittances and grants. Example Unemployment     Security Payments, Old age Pension, scholarship etc.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>1    and 3 only.</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> </span></span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Bahlol    Lodi was succeeded by his son _____ under the title of Sultan    Sikandar Shah in 1489. </span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Nizam    Khan</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Khizr    Khan</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Bahlul    Shah</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:1 "font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Bhagat    Singh and Batukeshawar Dutt</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Bhagat    Singh and Sukhdev</span></span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_93859ba3b3f09532.png\" width=\"18\" height=\"18\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    Information</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">They     threw bombs against the passage of the Public Safety Bill and the     Trade Disputes Bill which would reduce the civil liberties of     citizens.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">They     were members of the Hindustan Socialist Republican Association.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">On     23rd March, 1931 Bhagat Singh was hanged in the Lahore jail at     the age of 23.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The    correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Bhagat    Singh and Batukeshwar Dutt. </b></span></span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The    right to form cooperative societies, a fundamental right has been    provided in ____ .</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">79th    Amendment Act, 2014</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">45th    Amendment Act, 2018</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">97th    Amendment Act, 2011</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">16th    Amendment Act, 2009</span></span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_7fd8c8812deee0e2.png\" width=\"22\" height=\"22\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    Information</b></u></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>97th    Amendment Act, 2011</b></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     right to form cooperative societies is a fundamental right that     has been provided in the Indian Constitution.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">It     is enshrined in Article 19(c) of the Constitution, which     guarantees the freedom to form associations or unions.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">This     right was added to the Constitution by the 97th Amendment Act of     2011.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Article     19(1)(c) guarantees all citizens the right \"to form     associations or unions or co-operative societies\".</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_b89630ccb631cf5.png\" width=\"19\" height=\"15\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>NOTE-</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> This    right, like other rights under Article 19, </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>is    not absolute and is subject to reasonable restrictions under    clause (4)</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> of    the same article, </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>namely    \"in the interests of the sovereignty and integrity of India,    the security of the State, friendly relations with foreign States,    public order or morality or in relation to contempt of court,    defamation or incitement to an offence</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">\".</span></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>97th    Amendment Act, 2011</b></span></span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The    ratio of the mass of hydrogen to the mass of oxygen in water is    always ____ .</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2:1</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1:8</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">8:1</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1:2</span></span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_6de0b7b16f9df427.png\" width=\"16\" height=\"16\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    Information</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Atomic     Mass of the Hydrogen = 1</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Atomic     Mass of the oxygen = 16</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Explanation:</b></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1     mole of hydrogen = 1gm</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1     mole of oxygen = 16gm</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Water     (H</span></span><sub><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2</span></span></sub><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">O)     = 2 Hydrogen atoms + 1 Oxygen atom</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2     moles of hydrogen = 2gm</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1     mole of oxygen = 16 gm</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     ratio of the mass of Hydrogen: Ratio of mass of Oxygen = 2/16 =     1/8</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     ratio of the mass of Hydrogen to the mass of Oxygen in water is     always 1:8</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>1:8.</b></span></span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    among the following are the lowermost plants of the plant    kingdom? </span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Pteridophyta</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Thallophyta</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Phanerogamae</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Bryophyta</span></span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_7fd8c8812deee0e2.png\" width=\"22\" height=\"22\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    Information</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Thallophyta</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> is     the lowermost plants of the plant kingdom.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">It     is the largest group of the plant kingdom.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Ulva,     Chara, and Cladophora</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> are     examples of Thallophyta.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Algae     and Fungi are two subdivisions.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Thallophyta</b></span></span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The    process of copying the genetic information on the RNA from one of    the DNA is called ______ .</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Transcription</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Transcoping</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Transformation</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Translation</span></span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_53b68c3e92eaa0d.png\" width=\"26\" height=\"26\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    Information</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Transcription     is the process of copying the genetic information on the RNA from     one of the DNA.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     process involves copying a gene's DNA sequence to make an RNA     molecule.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">DNA     safely stores genetic material in the nuclei of cells as a     template.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Transcription</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> is     carried out by an enzyme called RNA polymerase.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Transcription     ends in a process called </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>termination.</b></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Transformation</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> -     is a process by which DNA molecules can be transferred between     microbial cells.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Translation</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> -     is the process by which the amino acid chains (polypeptides are     formed from mRNA during protein synthesis.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Transcription.</b></span></span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the following is a result of erosion?</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Sand    dune</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Delta</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Canyon</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Lagoon</span></span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_17cd8aaefc1e4f46.png\" width=\"19\" height=\"19\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    Information</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Deep     valley carved by river erosion.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Example:     Grand Canyon.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Canyon.</b></span></span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Consider    the following statements regarding the Western Disturbances in    India</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>:</b></span></span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">They     originate from the Mediterranean and Caspian Sea regions.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">They     bring winter rainfall to Northern India, especially Punjab and     Haryana.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">They     are blocked by the Himalayas, preventing them from reaching     Southern India.</span></span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the above statements are correct?</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 2 only</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2    and 3 only</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 3 only</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">All    of the above</span></span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_9ec7bf2b9d8c860a.png\" width=\"21\" height=\"21\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    information</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Western     Disturbances are extra-tropical storms originating in the     Mediterranean and Caspian regions.  </span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">They     travel eastward and bring winter rainfall to Northern India,     especially beneficial for Rabi crops. The Himalayas act as a     barrier, preventing their penetration into Southern India.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>All    of the above.</b></span></span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">India's    first open-sea marine fish farming project as part of the Blue    Economy initiative in the Andaman Sea. This project was    implemented through collaboration between which two entities?</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Ministry    of Fisheries and Coastal States Development Council</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Central    Marine Fisheries Research Institute and NITI Aayog</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">National    Institute of Ocean Technology and Andaman &amp; Nicobar    Administration</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Indian    Council of Agricultural Research and Ministry of Earth Sciences</span></span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">India     launched its first open-sea marine fish farming project in     the </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Andaman     Sea as part of its Blue Economy initiative.</b></span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_d22854b621bed63f.png\" width=\"22\" height=\"21\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Points</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     project was implemented through collaboration between     the </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>National     Institute of Ocean Technology and the Andaman &amp; Nicobar     Administration</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     National Institute of Ocean Technology developed specialized     open-sea cages used for finfish farming.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     collaboration aims to unlock marine resources and enhance the     livelihoods of fishing communities.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_16befd5dd6ccef0a.png\" width=\"18\" height=\"17\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    Information</b></u></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>National    Institute of Ocean Technology.</b></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">An     autonomous research institute under the Ministry of Earth     Sciences.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Focuses     on development of technologies for ocean observation, marine     living resources, and offshore engineering.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Andaman    &amp; Nicobar Administration</b></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     local administrative authority governing the Andaman and Nicobar     Islands.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Plays     a key role in implementing central initiatives at the regional     level.</span></span></p>    </li></ul>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Finfish     Farming</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> Refers     to the cultivation of fish species with fins, such as seabass and     cobia. Commonly practiced in open-sea cages to increase marine     fish production.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Seaweed     Cultivation</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> Involves     growing marine algae in ocean waters. Supports sustainable     aquaculture and provides additional income to coastal     communities.</span></span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The    correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>National    Institute of Ocean Technology and Andaman &amp; Nicobar    Administration.</b></span></span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">PM    Narendra Modi inaugurated the Grand International Exposition of    Sacred Piprahwa Relics related to Bhagwan Buddha in New Delhi. The    Piprahwa town is located in which Indian state?</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Bihar</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Uttar    Pradesh</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Odisha</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Madhya    Pradesh</span></span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Prime     Minister Narendra Modi inaugurated </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>the     Grand International Exposition of Sacred Piprahwa Relics</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> related     to Bhagwan Buddha in New Delhi.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_aee53d74ccfbe355.png\" width=\"20\" height=\"20\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Points</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Piprahwa     is located in the </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Siddharthnagar</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> district     of </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Uttar     Pradesh.</b></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     site is closely associated with relics of </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Bhagwan     Buddha.</b></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Archaeological     findings from Piprahwa are preserved in </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>the     National Museum, New Delhi</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> and </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>the     Indian Museum, Kolkata</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     exposition reflects India's efforts to promote Buddhist heritage     and cultural diplomacy.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_d82d8c122935f5fc.png\" width=\"17\" height=\"17\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    Information</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Piprahwa </b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Archaeological     Site Located near the India-Nepal border in Uttar Pradesh.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">It     is associated with the ancient Kapilavastu region. Linked to the     relics of Lord Buddha discovered during excavations. Cultural     Significance</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">An     important site in Buddhist history and archaeology.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Strengthens     India's role as a custodian of Buddhist heritage.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Uttar    Pradesh.</b></span></span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">What    is the name of the Aadhaar mascot launched by the Unique    Identification Authority of India (UIDAI) to simplify public    understanding of Aadhaar services?</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Udai</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Aarav</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Saarthi</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Pragati</span></span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>UIDAI </b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">launched     the Aadhaar mascot named Udai (</span></span><span><span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">उदय</span></span></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">)     as a resident-facing communication companion to simplify Aadhaar     services.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_17cd8aaefc1e4f46.png\" width=\"19\" height=\"19\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Points</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     Aadhaar mascot launched by UIDAI is named Udai (</span></span><span><span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">उदय</span></span></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">).</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Udai     will act as a people-friendly communication companion for     Aadhaar-related services.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     mascot aims to simplify information on Aadhaar updates,     authentication, offline verification and selective data sharing.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Aadhaar     Mascot Initiative Designed to make Aadhaar services more     relatable Supports awareness of responsible Aadhaar usage Helps     communicate adoption of new Aadhaar technologies</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_16befd5dd6ccef0a.png\" width=\"18\" height=\"17\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    Information</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Selection     Process Chosen through national design and naming competitions on     MyGov 875 entries received from across India.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Winner     announced as </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Arun     Gokul</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> from     Kerala Unique Identification Authority of India (UIDAI) Statutory     authority under the Government of India Responsible for issuing     and managing Aadhaar.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Focuses     on secure, inclusive and people-centric digital identity.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Udai.</b></span></span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    mobile application will forest staff use for the tiger census    during the All India Tiger Estimation Survey 2026 at Anamalai    Tiger Reserve?</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Wildlife    Census Portal</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><sp \">The     census is part of the All India Tiger Estimation Survey 2026.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     app records animal signs, GPS locations, transect distances and     vegetation data in real time.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Anamalai     Tiger Reserve Located in </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Coimbatore</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> and </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Tiruppur     districts of Tamil Nadu</b></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Spread     over </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>1,108     square</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> kilometres     Had </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>25     tigers in the 2022</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> census.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_93f906c30420f90a.png\" width=\"14\" height=\"14\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    Information</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>M-STRIPES     Monitoring</b></ /span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>integrate     Al-driven translation</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> and </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>speech-to-text     conversion</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> for     parliamentary content.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     initiative supports </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>real-time     translation of debates,</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>committee     meetings,</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> and </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>agenda     files </b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">into     multiple languages.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">An     Al-powered chatbot will assist MPs and officials in retrieving     parliamentary rules and procedural documents.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     project includes automatic summarization of lengthy debates for     improved decision-making and record-keeping.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     initiative aligns with India's push for technology-driven     governance and inclusive policymaking.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Sansad    Bhashini.</b></span></span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">What    is the name of the initiative launched by the Ministry of    Panchayati Raj to develop gender-sensitive governance at the    grassroots level?</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Women    Empowerment Gram Panchayats</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Rural    Women Leadership Scheme</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Model    Women-Friendly Gram Panchayats</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Gender    Equality Panchayat Initiative</span></span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     Ministry of Panchayati Raj launched the Model Women-Friendly Gram     Panchayats Initiative on 5th March 2025, at Vigyan Bhawan, in New     Delhi.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_u
