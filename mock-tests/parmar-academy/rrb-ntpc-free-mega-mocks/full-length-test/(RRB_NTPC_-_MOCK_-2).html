ottom:0in\"><span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_9ec7bf2b9d8c860a.png\" width=\"21\" height=\"21\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Points</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Leila     Aboulela</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">,     a </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Sudanese-Scottish     writer</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">,     wins the 2025 PEN Pinter Prize.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Award     given by </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>English     PEN for writing on faith, migration, and Muslim women</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Known     for novels:</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> The     Translator (1999), Minaret (2005), and River Spirit (2023).</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Born     in Cairo</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">,     raised in Khartoum, Sudan; now lives in Aberdeen, Scotland.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Her     works are translated into </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>15     languages </b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">and     studied in universities.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">First     winner of the </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Caine     Prize for African Writing.</b></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Also     won the </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Saltire     Fiction Book Award and Scottish Book Awards</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     PEN Pinter Prize, named after Harold Pinter, began in 2009.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">It     honours authors who \"</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>speak     truth to power</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">.\"</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Past     winners:</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> Arundhati     Roy (2024), Salman Rushdie (2014), Chimamanda Ngozi Adichie     (2018).</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Leila    Aboulela</b></span></span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    part of the Human lungs provide surface for the exchange of gases?</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Diaphragm</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Bronchioles</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Bronchi</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Alveoli</span></span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_93859ba3b3f09532.png\" width=\"18\" height=\"18\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    Information</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     alveoli are where the lungs and the blood exchange oxygen and     carbon dioxide during the process of breathing in and breathing     out.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">These     are tiny air sacs at the end of the bronchioles (tiny branches of     air tubes in the lungs).</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Oxygen     breathed in from the air passes through the alveoli and into the     blood and travels to the tissues throughout the body.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Carbon     dioxide travels in the blood from the body's tissues and passes     through the alveoli to be breathed out.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Alveoli.</b></span></span></p>    <p style=\"orphans:0;widows:0\"><span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_5194a6b64435de8f.jpg\" width=\"457\" height=\"369\" > </span> </p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">iodine    test is used to check the presence of________</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Cholesterol</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Fat</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Protein</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Carbohydrates</span></span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_aee53d74ccfbe355.png\" width=\"20\" height=\"20\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Points</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">An     iodine test is used to check the presence of carbohydrates.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Carbohydrates     are organic compounds in which the ratio of Carbon, Hydrogen, and     Oxygen is 1: 2: 1.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Carbohydrates     are classified into three major groups:</b></span></span></p>    </li></ul>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Monosaccharides</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Oligosaccharides</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Polysaccharides</span></span></p>    </li></ol>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">In     the iodine test if the sample contains carbohydrates then the     sample turns </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>blue-black</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> in     colour with a few drops of a</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b> potassium     iodide solution.</b></span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_7825f2be65c1d812.png\" width=\"17\" height=\"16\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    Information</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Proteins     are tested using the Biuret test for proteins. Tests to determine     fats are the Acrolein test, Baudouin test, and Hubble's test.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>carbohydrates.</b></span></span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">What    is the process by which a gas is converted into a solid?</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Deposition</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Sublimation</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Vaporisation</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Freezing</span></span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_4ac2176c1e29996d.png\" width=\"17\" height=\"17\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Points</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>A     deposition</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> is     a process by which a gas is converted into a solid.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Sublimation</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> is     the process by which a solid is converted to gas directly without     changing into liquid in between.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Vaporisation</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> is     the process of conversion of a liquid into a gas (vapor).</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Freezing </b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">is     a process of conversion of liquid into solid at the freezing     point.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Deposition.</b></span></span></p>    <p style=\"orphans:0;widows:0\"><span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_fcd6f72b3e730dbb.jpg\" width=\"456\" height=\"282\" > </span> </p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The    law of Inertia was first propounded by whom?</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Einstein</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Newton</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Galileo</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Edison</span></span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_aee53d74ccfbe355.png\" width=\"20\" height=\"20\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Points</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     Law of Inertia states that every object in a state of uniform     motion will remain in that state of motion unless an external     force acts on it.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Galileo     formulated the law of inertia in the early 1</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>7th     century, based on his observations of the motion of objects.</b></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">He     realized that an object in motion will tend to stay in motion     unless acted upon by a force.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">This     is in contrast to the Aristotelian view, which held that objects     in motion would eventually come to rest unless a force was     continuously applied to keep them moving. Newton later     incorporated Galileo's law of inertia into his three laws of     motion.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     first law of motion states that \"every body remains at rest,     or in motion with uniform velocity in a straight line, unless     acted upon by a force.\" This is essentially the same as     Galileo's law of inertia.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Einstein     did not propound the law of inertia. He is most famous for his     theory of relativity, which revolutionized our understanding of     space, time, and gravity.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">However,     the law of inertia is a basic principle of classical mechanics,     which was developed before Einstein's theory of relativity.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Edison     was an inventor, not a physicist. He did not contribute to the     development of the law of inertia.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Galileo.</b></span></span></p>    <p style=\"orphans:0;widows:0\"><span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_7c2ad6364b033701.jpg\" width=\"457\" height=\"261\" > </span> </p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    law states that \"A good absorber is a good emitter\"?</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Stefan's    law</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Kirchhoff's    Radiation Law</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Biot-Savart    law</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Bragg's    Law</span></span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "   <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_6de0b7b16f9df427.png\" width=\"16\" height=\"16\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    information</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Kirchhoff's     Law-</b></u></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">For     an arbitrary body emitting and absorbing thermal radiation in     thermodynamic equilibrium, the emissivity and absorptivity are     equal. That means anybody absorbing heat well will also emit the     heat energy well.</span></span></p>    </li></ul>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Important       Laws</b></span></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Details</b></span></span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Stefan's       Law</span></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Total       radiant heat energy emitted from a surface is proportional to       the fourth power of its absolute temperature</span></span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Kirchhoff's       Radiation Law</span></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">For       any arbitrary body emitting and absorbing thermal radiation in       thermodynamic equilibrium, the emissivity is equal to       absorptivity.<br> </span></span><br>        </p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Biot-Savart       Law</span></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">It       helps in calculating the strength of a magnetic field at       various points.</span></span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Bragg's       Law</span></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><br> It       gives the angles for coherent and incoherent scattering from a       crystal lattice.</span></span></p>      </td>     </tr>    </table>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Kirchhoff's    Radiation Law</b></span></span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    chamber of the human heart receives deoxygenated blood from the    body?</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Left    Atrium</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Right    Atrium</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Left    Ventricle</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Right    Ventricle</span></span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_6de0b7b16f9df427.png\" width=\"16\" height=\"16\" > </span> <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Additional    Information</b></u></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     right atrium receives deoxygenated blood from the body through     the </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>superior     and inferior vena cava</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">From     here, </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>blood     flows into the right ventricle</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">,     which pumps it to the lungs via the p</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>ulmonary     artery for oxygenation.</b></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     left atrium, in contrast, receives oxygenated blood from the     lungs.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hence    the correct answer is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Right    Atrium.</b></span></span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">What    should come in place of the question mark (?) in the given series?</span></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>482,    480, 476, 470, 462, ?</b></span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">452</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">454</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">448</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">450</span></span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">To    find the next number, we will check the jump between the given    number;</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>   <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1772583763537_html_2b51dbb46862c56d.png\" width=\"248\" height=\"65\" > </span> </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p> n:</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b> 768295</b></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Add </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>2</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> to    each </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>even    digit </b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">and subtract</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b> 3 </b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">from    each</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b> odd    digit.</b></span></span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">7       - 3 = 4</span></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2       + 2 = 4</span></span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">6       + 2 = 8</span></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">9       - 3 = 6</span></span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">8       + 2 = 10</span></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">5       - 3 = 2</span></span></p>      </td>     </tr>    </table>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Greatest     digit = </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>10</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> and     smallest digit = </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>2</b></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Sum     = 10 + 2 = 12</b></span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Hence,    12 is the correct answer.</b></span></span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">If    ‘A’ stands for ‘÷’, ‘B’ stands for ‘×’, ‘C’    stands for ‘+’ and ‘D’ stands for ‘−’, then what    will come in place of the question mark (?) in the following    equation?</span></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>124    C 116 D (340 A 4) C (18 B 2) = ?</b></span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">167</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">174</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">180</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">191</span></span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">New    equation after replacing the letter with their corresponding    mathematical operators as per the given instructions:</span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">124     + 116 − (340 ÷ 4) + (18 × 2) = ?</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Apply </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>BODMAS</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> rule;</span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">340     ÷ 4 = 85</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">18     × 2 = 36</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Now    expression becomes:</span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">124     + 116 − 85 + 36 = 191</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Hence,    191 is the correct answer.</b></span></span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Seven    people, I, J, K, L, X, Y and Z are sitting in a row, facing north.    No one sits to the left of J. Only four people sit between J and    K. Only three people sit to the right of X. I sit to the immediate    left of L. Y is not an immediate neighbour of X. Who sits at the    rightmost end of the line?</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">J</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">X</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Y</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Z</span></span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">No     one sits to the left of J means </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>J     must be at the extreme left end.</b></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Only     four people sit between J and K means </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>K     must be fifth to right of J.</b></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Only     three people sit to the right of X means </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>X     must be fourth from right end.</b></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">I     sit to the immediate left of L and Y is not an immediate     neighbour of X. So, </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>the     person immediate right of X is Z.</b></span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Final    arrangement:<br> </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>J    - I - L - X - Z - K - Y</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><br> The    person sitting at the </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>rightmost    end</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> of    the line is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Y.</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><br> </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Hence,    Y is the correct answer.</b></span></span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Shivam    starts from Point A and drives 6 km towards North. He then takes a    right turn, drives 7 km, turns right and drives 12 km. He then    takes a right turn and drives 8 km. He takes a final right turn,    drives 6 km and stops at Point P. How far (shortest distance) and    towards which direction should he drive in order to reach Point A    again? (All turns are 90° turns only unless specified)</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1km,    East</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2    km, East</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">3    km, West</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">4    km, north</span></span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">From     point A first go to </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>North</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> direction     for </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>6km</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Turns     right </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>(East)</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"> and     drives</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b> 7     km.</b></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12p     ‘FEAR’ is coded as ‘3287’. What is the code for ‘R’ in    the given code language?</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">3</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">8</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">7</span></span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">To    find the code for the letter 'R', we need to compare the two words    and their corresponding codes to identify which digit matches each    letter.</span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Common     letters in both words: </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>F,     A, E</b></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Common     digits in both codes</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>:     8, 3, 2</b></span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    letter in FEAR (not in FATE) is</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b> R.</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><br> Now    the digit that appears only in FEAR is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>7.</b></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><br> So, </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>code    for R is 7.<br> Hence, 7 is the correct answer.</b></span></span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Refer    to the following number and symbol series and answer the question    that follows. Counting to be done from left to right only.</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">(Left)    J @ 2 A 7 © &amp; 8 B * # 9 3 6 &amp; 6 # &amp; * © @ D(Right)</span></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">How    many such numbers are there each of which is immediately preceded    by a number and also immediately followed by a number?</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">One</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Two</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Three</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Four</span></span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">As    per the condition, we need numbers that are immediately preceded    by a number and immediately followed by a number.</span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Only     3 is preceded by 9 and followed by 6.</b></span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Hence,    one is the correct answer.</b></span></span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">H,    I, O, S, T and U live on six different floors of the same    building. The lowermost floor in the building is numbered 1, the    floor above it, number 2 and so on till the topmost floor is    numbered 6. S lives on floor numbered 5. O lives on a floor above    S. Only T lives below I.  U lives on an even numbered    floor. How many people live below H?</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Three</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Two</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">One</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">None</span></span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Fix     the position of </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-siz p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">To    find out next set of alphabets, we need to check for the pattern    in the given example:</span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">G     + 6 = M + 6 = S</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">L     + 7 = S + 7 = Z</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A     + 8 = I + 8 = Q</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The    pattern is;</span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>First     letter + 6</b></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Second     letter + 7</b></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Third     letter + 8</b></span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Applying    this pattern on </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>SZQ:</b></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12p pt\">To    find the odd one out, we need to look at the numerical positions    of the letters in the English alphabet (where A=1, B=2, ...,    Z=26).</span></span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Y</span></span>→<span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">       D (+5), T </span></span>→<span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">       J (-10)</span></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">+5,       -10</span></span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">F       </span></span>→<span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">       K (+5), A </span></span>→<span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">       K (+10)</span></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>+5,       +10</b></span></span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Q       </span></span>→<span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">       V (+5), N </span></span>→<span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">       D (-10)</span></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">+5, let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
