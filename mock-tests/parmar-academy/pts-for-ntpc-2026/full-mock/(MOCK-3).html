s to the immediate right of B, so E is at position 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. The only remaining person, D, must be at position 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The arrangement from left to right is: D, A, C, B, E.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, D is sitting at the extreme left end of the row.</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Some pens are books.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">All books are diaries.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">No diary is a notebook.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(I) Some diaries are pens.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(II) No pen is a notebook.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both conclusions (I) and (II) follow</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (I) follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (II) follows</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither conclusion (I) nor (II) follows</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. From the statements 'Some pens are books' and 'All books are diaries', the common portion between pens and books lies entirely inside diaries. Hence, 'Some diaries are pens' definitely follows (Conclusion I is true).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. From 'No diary is a notebook', the portion of pens that are diaries/books cannot be notebooks (i.e., 'Some pens are not notebooks' is true). However, the remaining portion of pens can still be notebooks. Thus, 'No pen is a notebook' is not a certain conclusion (Conclusion II does not follow).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, only conclusion (I) follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794634842940_image051.jpeg\" width=\"530\" height=\"405\" alt ></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following letter-number clusters will replace the question mark (?) in the given series to make it logically complete?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">BDF5, EGI10, HJL15, KMO20, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NPR25</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NPS25</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MPR25</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>OPR25</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the series is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For the first letter:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B + 3 = E</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E + 3 = H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>H + 3 = K</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K + 3 = </span><span style=\"font-weight:bold\">N</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For the second letter:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D + 3 = G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>G + 3 = J</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>J + 3 = M</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M + 3 = </span><span style=\"font-weight:bold\">P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For the third letter:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F + 3 = I</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I + 3 = L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L + 3 = O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O + 3 = </span><span style=\"font-weight:bold\">R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For the number:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 + 5 = 10</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10 + 5 = 15</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15 + 5 = 20</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20 + 5 = </span><span style=\"font-weight:bold\">25</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, the missing term is </span><span style=\"font-weight:bold\">NPR25</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">What is the smallest number which, when divided by 12, 15 and 20, leaves a remainder of 7 in each case?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>67</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>60</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>127</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>187</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>LCM of 12, 15 and 20 = 60. Required number = LCM + remainder = 60 + 7 = 67.</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A number is first increased by 20% and then the new number is decreased by 25%. What is the net change in the original number?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5% decrease</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>No change</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10% increase</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10% decrease</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Let the number be 100. After 20% increase = 120. After 25% decrease = 120 × 75/100 = 90. Net change = 100 − 90 = 10, i.e. a 10% decrease.</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The cost price of 12 articles is equal to the selling price of 9 articles. What is the profit percentage?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>33 1/3%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>30%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40%</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>12 × CP = 9 × SP ⇒ SP/CP = 12/9 = 4/3. Profit = 4/3 − 1 = 1/3 of CP, i.e. 33 1/3%.</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A sum of money at simple interest amounts to ₹5,600 in 2 years and to ₹6,800 in 5 years. What is the sum?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹4,400</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹5,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹4,800</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹5,200</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Interest for (5 − 2) = 3 years = 6,800 − 5,600 = ₹1,200, so interest per year = ₹400. Interest for 2 years = ₹800. Sum = 5,600 − 800 = ₹4,800.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">What is the difference between the compound interest (compounded annually) and the simple interest on ₹8,000 for 2 years at 5% per annum?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹15</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹30</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹25</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹20</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>For 2 years, CI − SI = P × (r/100)² = 8,000 × (5/100)² = 8,000 × 1/400 = ₹20.</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If A : B = 3 : 5 and B : C = 4 : 7 and A + B + C = 670, then what is the value of C?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>350</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>320</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>300</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>380</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Make B equal: A : B = 12 : 20 and B : C = 20 : 35, so A : B : C = 12 : 20 : 35. Total parts = 67, so 1 part = 670/67 = 10. C = 35 × 10 = 350.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The average of 11 numbers is 50. The average of the first six numbers is 49 and the average of the last six numbers is 52. What is the sixth number?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>52</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>54</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>56</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>58</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Total of 11 numbers = 11 × 50 = 550. Sum of first six + sum of last six = 6 × 49 + 6 × 52 = 294 + 312 = 606. The sixth number is counted twice, so sixth number = 606 − 550 = 56.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A can complete a work in 12 days and B can complete it in 18 days. They work together for 4 days and then A leaves. In how many more days will B finish the remaining work?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6 days</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8 days</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7 days</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9 days</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Work done together in 4 days = 4 × (1/12 + 1/18) = 4 × 5/36 = 5/9. Remaining work = 4/9. B's time = (4/9) × 18 = 8 days.</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Pipe A can fill a tank in 20 minutes and pipe B can fill it in 30 minutes, while pipe C can empty the full tank in 60 minutes. If all three pipes are opened together, in how much time will the empty tank be filled?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15 minutes</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 minutes</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18 minutes</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20 minutes</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Net work in 1 minute = 1/20 + 1/30 − 1/60 = (3 + 2 − 1)/60 = 4/60 = 1/15. So the tank is filled in 15 minutes.</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A train 180 m long crosses a pole in 12 seconds. How much time will it take to completely cross a platform 270 m long?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>24 seconds</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>27 seconds</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>36 seconds</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>30 seconds</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Speed of train = 180/12 = 15 m/s. Distance to cover = 180 + 270 = 450 m. Time = 450/15 = 30 seconds.</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The speed of a boat in still water is 12 km/h and the speed of the stream is 3 km/h. How much total time will the boat take to go 45 km downstream and come back to the starting point?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6 hours</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8 hours</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7 hours</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9 hours</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Downstream speed = 12 + 3 = 15 km/h, time = 45/15 = 3 hours. Upstream speed = 12 − 3 = 9 km/h, time = 45/9 = 5 hours. Total time = 3 + 5 = 8 hours.</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A vessel contains 60 litres of a milk and water mixture in the ratio 7 : 3. How many litres of water must be added to the mixture so that the ratio of milk to water becomes 7 : 5?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10 litres</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15 litres</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 litres</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18 litres</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Milk = 60 × 7/10 = 42 L and water = 18 L. For ratio 7 : 5 with milk 42 L, water must be 42 × 5/7 = 30 L. Water to be added = 30 − 18 = 12 litres.</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The diagonals of a rhombus are 16 cm and 30 cm. What is its perimeter?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>60 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>64 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>68 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>72 cm</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Diagonals bisect each other at right angles, so half-diagonals are 8 cm and 15 cm. Side = √(8² + 15²) = √289 = 17 cm. Perimeter = 4 × 17 = 68 cm.</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">What is the curved surface area of a cylinder of radius 7 cm and height 20 cm? (Use π = 22/7)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>880 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>660 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>440 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1,100 cm²</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Curved surface area = 2πrh = 2 × 22/7 × 7 × 20 = 880 cm².</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">What is the volume of a cone whose base radius is 6 cm and height is 8 cm?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>48π cm³</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>288π cm³</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>144π cm³</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>96π cm³</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Volume = (1/3)πr²h = (1/3) × π × 36 × 8 = 96π cm³.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Each interior angle of a regular polygon is 140°. How many sides does the polygon have?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Each exterior angle = 180° − 140° = 40°. Number of sides = 360°/40° = 9.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In triangle ABC, ∠A = 70°. The bisectors of ∠B and ∠C meet at point I. What is the measure of ∠BIC?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>110°</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>120°</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>135°</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>125°</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>∠BIC = 90° + ∠A/2 = 90° + 35° = 125°.</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A chord of length 24 cm is drawn in a circle of radius 13 cm. What is the distance of the chord from the centre of the circle?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7 cm</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>The perpendicular from the centre bisects the chord, so half-chord = 12 cm. Distance = √(13² − 12²) = √(169 − 144) = √25 = 5 cm.</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If tan θ = 3/4 and θ is an acute angle, then what is the value of (sin θ + cos θ)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7/5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6/5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8/5</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>tan θ = 3/4 gives a right triangle with perpendicular 3, base 4 and hypotenuse 5. sin θ = 3/5 and cos θ = 4/5, so sin θ + cos θ = 7/5.</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">From a point on the ground 30 m away from the foot of a tower, the angle of elevation of the top of the tower is 60°. What is the height of the tower? (Use √3 = 1.73)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>30 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>34.6 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>51.9 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>60 m</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>tan 60° = height/30 ⇒ height = 30 × √3 = 30 × 1.73 = 51.9 m.</span></p>", "question_heading": ""}, {"sr_no": 51, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If x + </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794635767276_image001.png\" width=\"7\" height=\"29\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> = 5, then what is the value of x² + </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794635767276_image002.png\" width=\"13\" height=\"29\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>21</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>23</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>27</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>x² + 1/x² = (x + 1/x)² − 2 = 25 − 2 = 23.</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If x − y = 4 and xy = 12, then what is the value of x³ − y³?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>160</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>196</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>224</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>208</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>x³ − y³ = (x − y)³ + 3xy(x − y) = 4³ + 3 × 12 × 4 = 64 + 144 = 208.</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A father's age is three times his son's age. After 12 years, the father's age will be twice the son's age. What is the present age of the son?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 years</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10 years</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14 years</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15 years</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Let son's age = S, father's age = 3S. After 12 years: 3S + 12 = 2(S + 12) ⇒ 3S + 12 = 2S + 24 ⇒ S = 12 years.</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The marked price of an article is ₹2,000. A shopkeeper allows two successive discounts of 20% and 10%. What is the selling price of the article?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹1,400</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹1,500</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹1,440</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹1,600</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>SP = 2,000 × (80/100) × (90/100) = 2,000 × 0.72 = ₹1,440.</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Find the value of: 15 + 5 × 4 − 18 ÷ 3</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>26</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>31</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>29</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>35</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>By BODMAS: 5 × 4 = 20 and 18 ÷ 3 = 6. So 15 + 20 − 6 = 29.</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The product of two numbers is 2,160 and their HCF is 12. What is their LCM?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>120</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>150</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>216</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>180</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>HCF × LCM = product of the two numbers ⇒ LCM = 2,160/12 = 180.</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">What is the median of the data: 12, 7, 15, 9, 21, 18, 10?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Arranged in ascending order: 7, 9, 10, 12, 15, 18, 21. There are 7 values, so the median is the 4th value = 12.</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The population of a town is 25,000. It increases by 10% in the first year and by 20% in the second year. What is the population at the end of the second year?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>32,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>33,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>32,500</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>34,000</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Population = 25,000 × 110/100 × 120/100 = 25,000 × 1.32 = 33,000.</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">What is the distance between the points (−1, 2) and (4, 14)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>11 units</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 units</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15 units</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13 units</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Distance = √[(4 − (−1))² + (14 − 2)²] = √(5² + 12²) = √169 = 13 units.</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A man travels 60 km at a speed of 30 km/h and then another 60 km at a speed of 20 km/h. What is his average speed for the whole journey?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>24 km/h</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>22 km/h</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25 km/h</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>26 km/h</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Time for first part = 60/30 = 2 h and for second part = 60/20 = 3 h. Average speed = total distance/total time = 120/5 = 24 km/h.</span></p>", "question_heading": ""}, {"sr_no": 61, "question": "  <p style=\"orphans:0;widows:0\">    <b>Which of the following compounds is an aromatic hydrocarbon    with the molecular formula </b>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794640105734_html_e9de1572802d9a53.gif\" > <b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Hexane</p>", "option2": " <p style=\"orphans:0;widows:0\">    Cyclohexane</p>", "option3": " <p style=\"orphans:0;widows:0\">    Benzene</p>", "option4": " <p style=\"orphans:0;widows:0\">    Propane</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    Benzene is the simplest aromatic hydrocarbon with a cyclic ring    structure composed of six carbon atoms joined in a planar    hexagonal ring with alternating single and double bonds. Its    molecular formula is     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794640105734_html_e9de1572802d9a53.gif\" > .</p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0\">    <b>What is the pH value of a 0.1 M hydrochloric acid (HCl)    solution?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1</p>", "option2": " <p style=\"orphans:0;widows:0\">    2</p>", "option3": " <p style=\"orphans:0;widows:0\">    7</p>", "option4": " <p style=\"orphans:0;widows:0\">    0</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Hydrochloric acid (HCl) is a strong acid that completely    dissociates in water:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794640105734_html_9ee4b20576a70c51.gif\" > .</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Therefore,    the hydrogen ion concentration     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794640105734_html_5efc14c27d97ebb4.gif\" > .</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Using the pH    formula:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794640105734_html_7ea997fccc6da661.gif\" > .</p>    <p style=\"orphans:0;widows:0\">Thus, the pH of the solution is    1.</p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"orphans:0;widows:0\">    <b>In a sound wave propagating through a medium, the region of low    pressure and low density is called a ________.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Crest</p>", "option2": " <p style=\"orphans:0;widows:0\">    Trough</p>", "option3": " <p style=\"orphans:0;widows:0\">    Compression</p>", "option4": " <p style=\"orphans:0;widows:0\">    Rarefaction</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    A sound wave travels through a medium as a series of compressions    and rarefactions. The regions where particles are crowded    together, resulting in high density and high pressure, are called    <b>compressions</b>. Conversely, the regions where particles are    spread apart, resulting in low density and low pressure, are    called <b>rarefactions</b>.</p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"orphans:0;widows:0\">    <b>In the process of decomposition within an ecosystem, the    breakdown of detritus into smaller particles by organisms like    earthworms is known as which of the following?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Catabolism</p>", "option2": " <p style=\"orphans:0;widows:0\">    Fragmentation</p>", "option3": " <p style=\"orphans:0;widows:0\">    Leaching</p>", "option4": " <p style=\"orphans:0;widows:0\">    Humification</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Decomposition of dead organic matter (detritus) involves five    major steps: fragmentation, leaching, catabolism, humification,    and mineralization. Detritivores (such as earthworms) feed on    detritus and break it down into smaller particles; this specific    step is called <b>fragmentation</b>.</p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following pairs of physical quantities has the    same SI unit?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Work and Power</p>", "option2": " <p style=\"orphans:0;widows:0\">    Impulse and Linear momentum</p>", "option3": " <p style=\"orphans:0;widows:0\">    Force and Pressure</p>", "option4": " <p style=\"orphans:0;widows:0\">    Acceleration and Velocity</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    Impulse and linear momentum have the same SI unit, which is     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794640105734_html_675416115c7c2be6.gif\" >     or     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794640105734_html_e631c17ea90ac197.gif\" > .    According to Newton's Second Law of Motion, impulse is equal to    the change in momentum (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794640105734_html_8b66ad6328fae972.gif\" > ).    Hence, both quantities share identical units and dimensions (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794640105734_html_fb695c48cce6d0c4.gif\" > ).</p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"orphans:0;widows:0\">    <b>In which of the following landmark judgments did the Supreme    Court of India uphold the constitutional validity of Section 18A    of the Scheduled Castes and the Scheduled Tribes (Prevention of    Atrocities) Act, 1989, which bars the grant of anticipatory bail?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    M. Nagaraj v. Union of India</p>", "option2": " <p style=\"orphans:0;widows:0\">    Prathvi Raj Chauhan v. Union of India</p>", "option3": " <p style=\"orphans:0;widows:0\">    Indira Sawhney v. Union of India</p>", "option4": " <p style=\"orphans:0;widows:0\">    Jarnail Singh v. Lachhmi Narain Gupta</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In <i>Prathvi Raj Chauhan v. Union of India (2020)</i>, the    Supreme Court of India upheld the constitutional validity of    Section 18A of the Scheduled Castes and the Scheduled Tribes    (Prevention of Atrocities) Act, 1989. Section 18A was inserted by    the 2018 Amendment to rule out the provision of anticipatory bail    for offenses under the Act, confirming that pre-arrest bail cannot    be granted if a prima facie case under the Act is established.</p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following legendary classical dancers was    conferred the Padma Vibhushan in the year 2000 for their    pioneering contribution to Odissi dance?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Guru Pankaj Charan Das</p>", "option2": " <p style=\"orphans:0;widows:0\">    Guru Kelucharan Mohapatra</p>", "option3": " <p style=\"orphans:0;widows:0\">    Guru Bipin Singh</p>", "option4": " <p style=\"orphans:0;widows:0\">    Guru Deba Prasad Das</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Guru Kelucharan Mohapatra was an eminent Indian classical dancer,    guru, and choreographer who played a pivotal role in reviving and    popularising Odissi dance in the 20th century. He was awarded the    Padma Shri in 1974, the Padma Bhushan in 1988, and the Padma    Vibhushan in 2000, becoming the first person from Odisha to    receive the Padma Vibhushan.</p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following peaks is the highest point of the    Satpura Range in Peninsular India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Amarkantak</p>", "option2": " <p style=\"orphans:0;widows:0\">    Dhupgarh</p>", "option3": " <p style=\"orphans:0;widows:0\">    Guru Shikhar</p>", "option4": " <p style=\"orphans:0;widows:0\">    Kalsubai</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Mount Dhupgarh (or Dhoopgarh), rising to an elevation of    approximately 1,350 metres, is the highest peak of the Satpura    Range. It is situated near the hill station of Pachmarhi in the    Narmadapuram (Hoshangabad) district of Madhya Pradesh. Among the    other options, Guru Shikhar is the highest peak of the Aravalli    Range, Kalsubai is the highest peak of Maharashtra (Western    Ghats), and Amarkantak is a prominent plateau peak in the Maikal    Hills.</p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"orphans:0;widows:0\">    <b>In which year was the South Asian Association for Regional    Cooperation (SAARC) established?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1981</p>", "option2": " <p style=\"orphans:0;widows:0\">    1985</p>", "option3": " <p style=\"orphans:0;widows:0\">    1989</p>", "option4": " <p style=\"orphans:0;widows:0\">    1993</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The South Asian Association for Regional Cooperation (SAARC) was    established on 8 December 1985 in Dhaka, Bangladesh, with the    signing of the SAARC Charter. Its seven founding members were    Bangladesh, Bhutan, India, Maldives, Nepal, Pakistan, and Sri    Lanka (Afghanistan joined later in 2007). The permanent    Secretariat of SAARC is located in Kathmandu, Nepal.</p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following pairs of Fundamental Duties and their    corresponding clause under Article 51A of the Constitution of    India is INCORRECTLY matched?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Article 51A(e) – To promote harmony and the spirit of common    brotherhood</p>", "option2": " <p style=\"orphans:0;widows:0\">    Article 51A(g) – To safeguard public property and to abjure    violence</p>", "option3": " <p style=\"orphans:0;widows:0\">    Article 51A(h) – To develop the scientific temper, humanism and    the spirit of inquiry and reform</p>", "option4": " <p style=\"orphans:0;widows:0\">    Article 51A(k) – To provide opportunities for education to one's    child or ward between six and fourteen years</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Under Article 51A of the Indian Constitution: <b>Article 51A(g):</b>    To protect and improve the natural environment including forests,    lakes, rivers, and wildlife, and to have compassion for living    creatures.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Article    51A(i):</b> To safeguard public property and to abjure violence.</p>    <p style=\"orphans:0;widows:0\">Therefore, pairing Article 51A(g)    with safeguarding public property is incorrect.</p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following led the Khond uprising against the    British authorities in the 1840s and 1850s, which was primarily    triggered by the government's attempt to suppress the traditional    human sacrifice practice known as 'Mariah'?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Chakra Bisoi</p>", "option2": " <p style=\"orphans:0;widows:0\">    Buddho Bhagat</p>", "option3": " <p style=\"orphans:0;widows:0\">    U Tirot Sing</p>", "option4": " <p style=\"orphans:0;widows:0\">    Gomdhar Konwar</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Khond uprising (1837–1856) took place in the hilly tracts    spanning from Odisha to the Andhra Pradesh region. It was led by    Chakra Bisoi. The primary grievance of the Khonds was the British    government's intervention to ban their customary human sacrifice    ritual known as 'Mariah', along with the introduction of new taxes    and the influx of moneylenders into tribal territory.</p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"orphans:0;widows:0\">    <b>According to the 44th Constitutional Amendment Act, 1978, the    enforcement of which of the following Fundamental Rights cannot be    suspended by a Presidential Order under Article 359 even during a    National Emergency?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Articles 14 and 19</p>", "option2": " <p style=\"orphans:0;widows:0\">    Articles 19 and 22</p>", "option3": " <p style=\"orphans:0;widows:0\">    Articles 20 and 21</p>", "option4": " <p style=\"orphans:0;widows:0\">    Articles 22 and 23</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The 44th Constitutional Amendment Act, 1978, introduced safeguards    against the misuse of emergency provisions. Under Article 359, it    restricted the power of the President to suspend the right to move    any court for the enforcement of Fundamental Rights, ensuring that    the rights guaranteed under <b>Article 20</b> (protection in    respect of conviction for offences) and <b>Article 21</b>    (protection of life and personal liberty) cannot be suspended even    during a National Emergency.</p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following is NOT a Fundamental Duty under Article    51A of the Constitution of India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    To promote international peace and security</p>", "option2": " <p style=\"orphans:0;widows:0\">    To protect and improve the natural environment</p>", "option3": " <p style=\"orphans:0;widows:0\">    To develop scientific temper, humanism and the spirit of inquiry</p>", "option4": " <p style=\"orphans:0;widows:0\">    To safeguard public property and to abjure violence</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    'To promote international peace and security' is a Directive    Principle of State Policy under Article 51 (Part IV) of the Indian    Constitution, not a Fundamental Duty. Fundamental Duties were    incorporated into Part IVA under Article 51A by the 42nd    Constitutional Amendment Act, 1976, upon the recommendation of the    Swaran Singh Committee. The other three options are Fundamental    Duties explicitly listed under clauses (g), (h), and (i) of    Article 51A.</p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"orphans:0;widows:0\">    <b>Which tab in the Windows Task Manager allows a user to view and    manage the programs that launch automatically every time the    operating system boots up?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Startup</p>", "option2": " <p style=\"orphans:0;widows:0\">    App history</p>", "option3": " <p style=\"orphans:0;widows:0\">    Services</p>", "option4": " <p style=\"orphans:0;widows:0\">    Performance</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the Windows Task Manager, the <b>Startup</b> (or Startup apps)    tab displays a list of applications configured to run    automatically when the computer starts. Users can view the    'Startup impact' of each program and enable or disable them to    optimize system boot time.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">•    <b>Performance:</b> Displays real-time graphs for CPU, Memory,    Disk, Network, and GPU usage.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>App    history:</b> Shows the historical resource usage (CPU time,    network data) of applications.</p>    <p style=\"orphans:0;widows:0\">• <b>Services:</b> Lists all    background system services and their current status    (Running/Stopped).</p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the Central    Vigilance Commission (CVC):</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. It was established in 1964 on the recommendations of the    Santhanam Committee.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. It was accorded statutory status by an Act of Parliament in    2003.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. The Central Vigilance Commissioner is appointed on the    recommendation of a committee headed by the Chief Justice of    India.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statements 1 and 2 are correct, while statement 3 is incorrect.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- The Central    Vigilance Commission (CVC) was set up by an executive resolution    in February 1964 on the recommendations of the Committee on    Prevention of Corruption, headed by K. Santhanam.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- In    September 2003, Parliament enacted the Central Vigilance    Commission Act, 2003, conferring statutory status upon it.</p>    <p style=\"orphans:0;widows:0\">- The Central Vigilance    Commissioner and Vigilance Commissioners are appointed by the    President on the recommendation of a three-member committee    consisting of the Prime Minister (Chairperson), the Minister of    Home Affairs, and the Leader of the Opposition in the Lok Sabha    (not the Chief Justice of India).</p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following keyboard shortcuts is used to insert a    hyperlink for the selected text in Microsoft Word?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Ctrl + H</p>", "option2": " <p style=\"orphans:0;widows:0\">    Ctrl + K</p>", "option3": " <p style=\"orphans:0;widows:0\">    Ctrl + L</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ctrl + M</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In Microsoft Word and most standard text editing software, the    keyboard shortcut <b>Ctrl + K</b> is used to insert a hyperlink.    Other common shortcuts include:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Ctrl +    H</b>: Opens the Find and Replace dialog box.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Ctrl +    L</b>: Left-aligns the selected text or paragraph.</p>    <p style=\"orphans:0;widows:0\">• <b>Ctrl + M</b>: Indents the    paragraph from the left.</p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following economic activities does NOT belong to    the tertiary sector?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Transportation</p>", "option2": " <p style=\"orphans:0;widows:0\">    Banking</p>", "option3": " <p style=\"orphans:0;widows:0\">    Brick-making</p>", "option4": " <p style=\"orphans:0;widows:0\">    Communication</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Brick-making is a manufacturing activity that transforms raw    material (clay) into a finished good, placing it in the secondary    sector. In contrast, transportation, banking, and communication    provide services rather than physical goods, categorizing them    under the tertiary (service) sector.</p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:0;widows:0\">    <b>The 'Alai Darwaza', which serves as the southern gateway to the    Quwwat-ul-Islam Mosque complex in Delhi, was constructed by which    Sultan of Delhi in 1311 CE?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Qutb-ud-din Aibak</p>", "option2": " <p style=\"orphans:0;widows:0\">    Shams-ud-din Iltutmish</p>", "option3": " <p style=\"orphans:0;widows:0\">    Alauddin Khalji</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ghiyas-ud-din Tughlaq</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Alai Darwaza was constructed in 1311 CE by Sultan Alauddin    Khalji of the Khalji dynasty. It is situated as the southern    entrance gate of the Quwwat-ul-Islam Mosque within the Qutb    complex in Delhi. Built of red sandstone adorned with white marble    inlays, it is celebrated as the first building in India to employ    true arches and a true dome based on Islamic architectural    principles.</p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"orphans:0;widows:0\">    <b>Which tab in the Windows Task Manager provides real-time    graphical representations and metrics for hardware components such    as the CPU, Memory, Disk, and Network?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    App history</p>", "option2": " <p style=\"orphans:0;widows:0\">    Services</p>", "option3": " <p style=\"orphans:0;widows:0\">    Performance</p>", "option4": " <p style=\"orphans:0;widows:0\">    Details</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In the Windows Task Manager, the <b>Performance</b> tab displays    real-time charts and detailed statistical data for key system    resources, including the CPU, Memory (RAM), Disks, Network    interfaces (Wi-Fi/Ethernet), and GPU.</p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following regions has a remarkably high population    density primarily due to the presence of fertile alluvial soil and    perennial water supply amidst an otherwise arid region?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Kalahari Basin</p>", "option2": " <p style=\"orphans:0;widows:0\">    Nile River Valley</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sahara Highlands</p>", "option4": " <p style=\"orphans:0;widows:0\">    Atacama Plateau</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Nile River Valley and its delta support an exceptionally high    population density because the river provides a reliable,    perennial source of freshwater and deposits nutrient-rich alluvial    silt, creating fertile arable land in the middle of the arid    Sahara Desert. Regions like the Kalahari, Sahara Highlands, and    Atacama suffer from extreme aridity and water scarcity, leading to    very sparse populations.</p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"orphans:0;widows:0\">    <b>According to the Aitareya Brahmana of the Later Vedic period,    which Varna was described as 'Anyasya Balikrit' (tribute-payer to    another)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Brahmana</p>", "option2": " <p style=\"orphans:0;widows:0\">    Kshatriya</p>", "option3": " <p style=\"orphans:0;widows:0\">    Vaishya</p>", "option4": " <p style=\"orphans:0;widows:0\">    Shudra</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In the Later Vedic period, the Aitareya Brahmana characterizes the    four varnas according to their social positions and duties. The    Vaishya was described as <i>'Anyasya Balikrit'</i> (one who pays    tribute to another) and <i>'Anyasyadya'</i> (to be lived on by    another), as they were the primary agriculturalists, cattle    rearers, and traders who formed the producing class and bore the    burden of paying taxes to the ruling and priestly classes.</p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"orphans:0;widows:0\">    <b>The Gandhi-Irwin Pact of 1931 was officially endorsed by the    Indian National Congress in which of the following annual    sessions?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Lahore Session (1929)</p>", "option2": " <p style=\"orphans:0;widows:0\">    Karachi Session (1931)</p>", "option3": " <p style=\"orphans:0;widows:0\">    Belgaum Session (1924)</p>", "option4": " <p style=\"orphans:0;widows:0\">    Tripuri Session (1939)</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Gandhi-Irwin Pact, signed on 5 March 1931, was formally    endorsed by the Indian National Congress at its Karachi Session    held in late March 1931. This historic session was presided over    by Sardar Vallabhbhai Patel. In the same session, Congress also    passed landmark resolutions on Fundamental Rights and the National    Economic Programme, and authorized Mahatma Gandhi to represent the    Congress at the Second Round Table Conference.</p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following was the author of the famous epic poem    'Shahnama' and served as a court poet of Sultan Mahmud of Ghazni?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Utbi</p>", "option2": " <p style=\"orphans:0;widows:0\">    Firdausi</p>", "option3": " <p style=\"orphans:0;widows:0\">    Al-Biruni</p>", "option4": " <p style=\"orphans:0;widows:0\">    Hasan Nizami</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Firdausi (Abu al-Qasim Firdausi) was a renowned Persian poet who    lived in the court of Mahmud of Ghazni. He authored the famous    epic 'Shahnama' (The Book of Kings), which chronicled the history    of ancient Persia up to the Islamic conquest. Firdausi is often    referred to as the 'Homer of the East'.</p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following was the first language to be officially    granted the status of a 'Classical Language' in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Sanskrit</p>", "option2": " <p style=\"orphans:0;widows:0\">    Tamil</p>", "option3": " <p style=\"orphans:0;widows:0\">    Telugu</p>", "option4": " <p style=\"orphans:0;widows:0\">    Odia</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Tamil was the first language in India to be accorded the status of    a 'Classical Language' in the year 2004. Subsequently, Sanskrit    was declared a classical language in 2005, followed by Kannada and    Telugu in 2008, Malayalam in 2013, and Odia in 2014.</p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:0;widows:0\">    <b>The first edition of the All India Olympic Games, which were    later renamed as the National Games of India, was held in 1924 in    which of the following cities?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Bombay</p>", "option2": " <p style=\"orphans:0;widows:0\">    Lahore</p>", "option3": " <p style=\"orphans:0;widows:0\">    Calcutta</p>", "option4": " <p style=\"orphans:0;widows:0\">    Delhi</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The first edition of the Indian Olympic Games (later known as the    National Games) was held in February 1924 in Lahore (in undivided    India) to select the Indian contingent for the 1924 Paris    Olympics. These games were officially renamed as the 'National    Games' during the 9th edition held in Bombay in 1940.</p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following was a major factor responsible for the    slowdown in the growth rate of the agricultural sector during the    post-1991 economic reform period?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Sharp decline in public investment in irrigation and rural    infrastructure</p>", "option2": " <p style=\"orphans:0;widows:0\">    Elimination of the Minimum Support Price (MSP) system</p>", "option3": " <p style=\"orphans:0;widows:0\">    Imposition of heavy export duties on agricultural goods</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ban on the commercial production of cash crops</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    During the post-1991 economic reforms, the agricultural sector    experienced a deceleration in growth. A primary structural factor    was the significant cutback in public investment by the government    in key rural infrastructure, such as irrigation, rural roads,    power, and agricultural research. Additionally, the reduction of    input subsidies increased the cost of cultivation for farmers.</p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"orphans:0;widows:0\">    <b>In which of the following power-saving modes does a computer    save the current state of open applications and documents to the    storage drive (HDD/SSD) rather than RAM, allowing the system to    consume virtually zero power?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Sleep mode</p>", "option2": " <p style=\"orphans:0;widows:0\">    Hibernate mode</p>", "option3": " <p style=\"orphans:0;widows:0\">    Standby mode</p>", "option4": " <p style=\"orphans:0;widows:0\">    Lock state</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In <b>Hibernate mode</b>, the operating system saves all open    documents, programs, and the current system state to a hidden file    on the hard drive or SSD (such as hiberfil.sys in Windows) and    then completely powers down the computer. Unlike Sleep mode, which    keeps RAM powered with a low level of electrical current,    Hibernate mode consumes virtually no power.</p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"orphans:0;widows:0\">    <b>In which generation of computers were vacuum tubes primarily    used as the core processing and memory components?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    First Generation</p>", "option2": " <p style=\"orphans:0;widows:0\">    Second Generation</p>", "option3": " <p style=\"orphans:0;widows:0\">    Third Generation</p>", "option4": " <p style=\"orphans:0;widows:0\">    Fourth Generation</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>First Generation (approx. 1940–1956):</b> These computers    relied on <b>vacuum tubes</b> as circuitry and magnetic drums for    memory. They were massive, generated an immense amount of heat,    consumed a lot of electricity, and were difficult to program    (often using machine language). Famous examples include the <b>ENIAC</b>    and <b>UNIVAC</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Second    Generation (approx. 1956–1963):</b> Replaced vacuum tubes with    <b>transistors</b>, making computers smaller, faster, cheaper, and    more energy-efficient.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Third    Generation (approx. 1964–1971):</b> Introduced <b>Integrated    Circuits (ICs)</b>, where many transistors were miniaturized and    placed on silicon chips.</p>    <p style=\"orphans:0;widows:0\"><b>Fourth Generation (approx.    1971–Present):</b> Marked by the invention of the <b>microprocessor</b>    (Very Large Scale Integration / VLSI), leading to personal    computers and modern computing.</p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0\">    <b>Who is the author of the book ‘Discovery of India’?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Mahatma Gandhi</p>", "option2": " <p style=\"orphans:0;widows:0\">    Jawaharlal Nehru</p>", "option3": " <p style=\"orphans:0;widows:0\">    Dr. Rajendra Prasad</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sardar Patel</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The book was written by Jawaharlal Nehru in <b>1944</b> while he    was imprisoned in Ahmednagar Fort.</p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following classical dances is associated with    Kerala?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Kathak</p>", "option2": " <p style=\"orphans:0;widows:0\">    Kuchipudi</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kathakali</p>", "option4": " <p style=\"orphans:0;widows:0\">    Odissi</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <b>Kathakali</b> is a classical dance form of Kerala known for its    combination of dance, acting, music and elaborate costumes.</p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"orphans:0;widows:0\">    <b>Who has recently been given the additional charge of Director    General (DG) of the Indo-Tibetan Border Police (ITBP)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Shatrujeet Singh Kapoor</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sanjay Singhal</p>", "option3": " <p style=\"orphans:0;widows:0\">    Amrit Mohan Prasad</p>", "option4": " <p style=\"orphans:0;widows:0\">    Daljit Singh Chawdhary</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The Union Ministry of Home Affairs assigned the <b>additional    charge of Director General (DG) of the Indo-Tibetan Border Police    (ITBP)</b> to <b>Sanjay Singhal</b>, the Director General of    Sashastra Seema Bal (SSB).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sanjay    Singhal</b>, a <b>1993-batch IPS officer of the Uttar Pradesh    cadre</b>, took over the additional responsibility following the    retirement of ITBP chief <b>Shatrujeet Singh Kapoor</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">He has been    serving as the <b>27th Director General of SSB since September    2025</b>. Earlier, he served as Special Director General in the    BSF and as DIG and IG in the ITBP.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sashastra    Seema Bal (SSB)</b> guards India's borders with <b>Nepal (1,751    km)</b> and <b>Bhutan (699 km)</b>.</p>    <p style=\"orphans:0;widows:0\"><b>Indo-Tibetan Border Police    (ITBP)</b> was established on <b>24 October 1962</b> during the    Sino-Indian War and is responsible for guarding the <b>3,488-km    India-China border</b> along the Line of Actual Control (LAC).</p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Indian wrestler created history by winning a silver medal    in the 50 kg category at the World Wrestling Championships 2026?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Neelam Sirohi</p>", "option2": " <p style=\"orphans:0;widows:0\">    Antim Panghal</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kajal Dhochak</p>", "option4": " <p style=\"orphans:0;widows:0\">    Anshu Malik</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Indian wrestler <b>Neelam Sirohi</b> won the <b>silver medal in    the women's 50 kg category</b> at the <b>World Wrestling    Championships 2026</b>, held in <b>Astana, Kazakhstan</b>.</p>    <p style=\"orphans:0;widows:0\">In the final, she was defeated by    Japan's <b>Yui Susaki</b>, a four-time world champion and <b>Tokyo    Olympic gold medalist</b>.</p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"orphans:0;widows:0\">    <b>Which city will host the inaugural 'SCO Civilisational Dialogue    Forum'?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Tashkent</p>", "option2": " <p style=\"orphans:0;widows:0\">    Dushanbe</p>", "option3": " <p style=\"orphans:0;widows:0\">    New Delhi</p>", "option4": " <p style=\"orphans:0;widows:0\">    Bishkek</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    India will host the inaugural <b>SCO Civilisational Dialogue Forum</b>    in <b>New Delhi from 20 to 22 November 2026</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The forum    aims to strengthen <b>cultural ties, mutual understanding, and    people-to-people connections</b> among the member countries of the    Shanghai Cooperation Organisation (SCO).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">India has    invited all <b>10 SCO member countries, including Pakistan</b>, to    the inaugural event. The announcement was made by Defence Minister    <b>Rajnath Singh</b> during a meeting in <b>Dushanbe, Tajikistan</b>.</p>    <p style=\"orphans:0;widows:0\">The <b>Shanghai Cooperation    Organisation (SCO)</b> was established on <b>15 June 2001</b> and    is headquartered in <b>Beijing, China</b>.</p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"orphans:0;widows:0\">    <b>What is the name of the new patrol vessel (Yard 1283) recently    launched by Goa Shipyard?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Samarth</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sankalp</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sujata</p>", "option4": " <p style=\"orphans:0;widows:0\">    Srishti</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The Indian Navy's Next Generation Offshore Patrol Vessel (NGOPV)    <b>'Srishti' (Yard 1283)</b> was launched at <b>Goa Shipyard    Limited (GSL)</b>.</p>    <p style=\"orphans:0;widows:0\">The vessel is part of the Indian    Navy's <b>11 Next Generation Offshore Patrol Vessels (NGOPV)    Project</b>.</p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"orphans:0;widows:0\">    <b>What rank has India secured out of 122 countries in the Global    Hunger Index (GHI) 2026?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    (a) 106th</p>", "option2": " <p style=\"orphans:0;widows:0\">    (b) 100th</p>", "option3": " <p style=\"orphans:0;widows:0\">    (c) 84th</p>", "option4": " <p style=\"orphans:0;widows:0\">    (d) 72nd</p>", "answer"
