<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>3.) MOCK-2 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

HOME related, following the same logic?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KMPD</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KMQD</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KNQD</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>JMQD</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed here is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1st letter: +3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2nd letter: −2</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3rd letter: +4</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4th letter: −1</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MOST: M +3 = P, O −2 = M, S +4 = W, T −1 = S → PMWS</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DARK: D +3 = G, A −2 = Y, R +4 = V, K −1 = J→ GYVJ</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the same logic to HOME: H +3 = K, O −2 = M, M +4 = Q, E −1 = D</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, HOME is related to KMQD.</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">5 is related to 131 following a certain logic. Following the same logic, 6 is related to 222. To which of the following is 8 related, following the same logic?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into their constituent digits.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>508</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>528</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>518</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>512</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The logic followed here is: n→ n³ + 6</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5³ + 6 = 125 + 6 = 131</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6³ + 6 = 216 + 6 = 222</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly, 8³ + 6 = 512 + 6 = 518</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, 8 is related to 518.</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Three of the following four words are alike in a certain way and thus form a group. Which is the one that does not belong to that group?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sitar</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Veena</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sarod</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Tabla</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sitar, Veena and Sarod are string instruments, whereas Tabla is a percussion instrument.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, Tabla is the odd one out.</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a certain code language, 'FRAME' is coded as 'GTDQJ'. How will 'BRAIN' be coded in that language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CTDMS</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CTDNS</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CSDMS</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CTEMS</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed here is: the 1st to 5th letters are moved forward by 1, 2, 3, 4 and 5 places respectively.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FRAME: F +1 = G, R +2 = T, A +3 = D, M +4 = Q, E +5 = J→ GTDQJ</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the same logic to BRAIN: B +1 = C, R +2 = T, A +3 = D, I +4 = M, N +5 = S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, BRAIN is coded as CTDMS.</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If '+' and '−' are interchanged and '×' and '÷' are interchanged, then what will be the value of the following expression? 36 ÷ 4 + 6 × 3 − 5</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>145</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>149</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>147</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>142</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>After interchanging the signs, the expression becomes:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>36 × 4 − 6 ÷ 3 + 5</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the BODMAS rule:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= 144 − 2 + 5</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= 147</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, 147 is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following sets of signs, when placed in the blanks from left to right in the same order, will balance the given equation? 18 _ 6 _ 4 _ 5 = 17</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>×, ÷, +</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>÷, ×, +</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>÷, +, ×</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>−, ×, +</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Checking each option:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(×, ÷, +): 18 × 6 ÷ 4 + 5 = 27 + 5 = 32✗</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(÷, ×, +): 18 ÷ 6 × 4 + 5 = 3 × 4 + 5 = 12 + 5 = 17✓</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(÷, +, ×): 18 ÷ 6 + 4 × 5 = 3 + 20 = 23✗</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(−, ×, +): 18 − 6 × 4 + 5 = 18 − 24 + 5 = −1✗</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, the correct set of signs is ÷, ×, +.</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In the question, the relationship between different elements is shown in the statement. The statement is followed by two conclusions. Study the statement and decide which of the given conclusions definitely follow(s).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statement: M &gt; N ≥ O = P &lt; Q ≤ R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Conclusions: (I) M &gt; P (II) R &gt; O</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (I) follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (II) follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both conclusions (I) and (II) follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither conclusion (I) nor (II) follows</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given statement: M &gt; N≥ O = P &lt; Q ≤ R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) M &gt; N ≥ O = P gives M &gt; P. Hence, conclusion (I) follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(II) O = P &lt; Q ≤ R gives R &gt; O. Hence, conclusion (II) follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, both conclusions (I) and (II) follow.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statements: All pens are bottles. Some bottles are cups. All cups are plates.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Conclusions: (I) Some bottles are plates. (II) Some pens are cups. (III) Some plates are bottles.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only (I) and (II) follow</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only (II) and (III) follow</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All (I), (II) and (III) follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only (I) and (III) follow</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From 'Some bottles are cups' and 'All cups are plates', we get 'Some bottles are plates'. Hence, conclusion (I) follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>By conversion, 'Some bottles are plates' gives 'Some plates are bottles'. Hence, conclusion (III) follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'All pens are bottles' and 'Some bottles are cups' do not give a definite relation between pens and cups; 'Some pens are cups' is only a possibility. Hence, conclusion (II) does not follow.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, only conclusions (I) and (III) follow.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794461804251_image001.jpeg\" width=\"532\" height=\"184\" alt ></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In the question below, a statement is followed by two assumptions numbered (I) and (II). An assumption is something supposed or taken for granted. Consider the statement and decide which of the assumptions is/are implicit in the statement.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statement: A city transport department has put up a hoarding that reads, 'Travel by bus – save fuel and keep the city clean.'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Assumptions: (I) Travelling by bus consumes less fuel per passenger than travelling by private vehicles. (II) All citizens of the city own private vehicles.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only assumption (I) is implicit</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only assumption (II) is implicit</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both assumptions (I) and (II) are implicit</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither assumption (I) nor (II) is implicit</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The slogan advises people to use buses to save fuel. This is meaningful only if bus travel uses less fuel per passenger than private vehicles. Hence, assumption (I) is implicit.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The slogan does not suggest that every citizen owns a private vehicle. Hence, assumption (II) is not implicit.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, only assumption (I) is implicit.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In the question below, a statement is followed by two courses of action numbered (I) and (II). A course of action is an administrative decision to be taken for improvement, follow-up or further action. Decide which of the courses of action logically follow(s) for pursuing.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statement: Many passengers have complained about poor cleanliness in the trains running on a particular route.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Courses of action: (I) The railway should immediately stop all trains running on that route. (II) The railway should increase the frequency of cleaning and appoint supervisors to monitor the work.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only course of action (I) follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only course of action (II) follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both courses of action (I) and (II) follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither course of action (I) nor (II) follows</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Stopping all trains would cause great inconvenience to passengers and is an extreme step for a cleanliness issue. Hence, course of action (I) does not follow.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Increasing cleaning frequency and appointing supervisors directly addresses the complaints. Hence, course of action (II) follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, only course of action (II) follows.</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Pointing to a man in a photograph, Nisha said, 'His mother is the only daughter of my mother's father.' How is the man related to Nisha?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Brother</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cousin</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Maternal uncle</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Father</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'My mother's father' is Nisha's maternal grandfather.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>His only daughter is Nisha's mother.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>So, the man's mother is Nisha's mother, which means the man is the son of Nisha's mother.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the man is Nisha's brother.</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Ravi starts from point A and walks 10 m towards the north. He turns left and walks 15 m. He then turns left again and walks 25 m. Finally, he turns right and walks 5 m to reach point B. How far and in which direction is point B from point A? (All turns are 90-degree turns only, unless specified.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25 m, North-West</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>35 m, South-West</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20 m, South</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25 m, South-West</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let point A be at the coordinates (0, 0).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Walks 10 m North: reaching (0, 10).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Turns left (West) and walks 15 m: reaching (−15, 10).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Turns left (South) and walks 25 m: reaching (−15, −15).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Turns right (West) and walks 5 m: reaching (−20, −15), which is point B.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Distance = √(20² + 15²) =√625 = 25 m.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Point B is 20 m West and 15 m South of A, so it lies to the South-West of A.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, B is 25 m South-West of A.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794461804251_image002.jpeg\" width=\"560\" height=\"264\" alt ></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">At 7 a.m., Anil and Sunil are standing facing each other. Anil's shadow falls exactly to his right. Which direction is Sunil facing?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>North</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>South</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>East</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>West</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>At 7 a.m. the sun is in the East, so shadows fall towards the West.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Anil's shadow falls to his right, so his right side is West. This means Anil is facing North.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sunil is facing Anil, so Sunil is facing South.</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a row of students, Ravi is 12th from the left end and Mohan is 18th from the right end. When they interchange their positions, Ravi becomes 22nd from the left end. How many students are there in the row?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>38</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>39</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>41</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>After the interchange, Ravi occupies Mohan's original position. So, Mohan's original position is 22nd from the left end.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total number of students = (position from left) + (position from right) − 1</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= 22 + 18 − 1 = 39</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, there are 39 students in the row.</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">How many pairs of letters are there in the word 'DREAMING', each of which has as many letters between them in the word as there are between them in the English alphabetical series?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Word: D R E A M I N G (positions 1 to 8)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D and A: two letters (R, E) lie between them in the word, and two letters (B, C) lie between them in the alphabet.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D and I: four letters (R, E, A, M) lie between them in the word, and four letters (E, F, G, H) lie between them in the alphabet. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I and G: one letter (N) lies between them in the word, and one letter (H) lies between them in the alphabet.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>No other pair satisfies the condition.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, there are three such pairs.</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Study the following alphanumeric-symbol series carefully and answer the question that follows. Counting is to be done from left to right only.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(Left) 4 K A 7 # E @ 2 M I 9 $ T O 5 U &amp; 3 R % (Right)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">How many vowels are there, each of which is immediately preceded by a consonant and immediately followed by a number?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>We need to find the pattern: Consonan→ Vowel → Number.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Checking each vowel:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A: preceded by K (consonant) and followed by 7 (number) — Valid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E: preceded by # (symbol) — Not valid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I: preceded by M (consonant) and followed by 9 (number) — Valid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O: preceded by T (consonant) and followed by 5 (number) — Valid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U: preceded by 5 (number) — Not valid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, there are three such vowels (K A 7, M I 9 and T O 5).</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Refer to the following letter, number and symbol series and answer the question that follows. Counting is to be done from left to right only.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(Left) 8 # J 3 @ R 6 % B 1 $ F 9 * L 4 &amp; (Right)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If the series is written in the reverse order, which element will be fifth to the right of the tenth element from the left end?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>@</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>J</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given series: 8 # J 3 @ R 6 % B 1 $ F 9 * L 4 &amp;</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Reversed series: &amp; 4 L * 9 F $ 1 B % 6 R @ 3 J # 8</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The tenth element from the left end is %.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Counting five places to the right of %: 6 (1st), R (2nd), @ (3rd), 3 (4th), J (5th).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, the required element is J.</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If 15 August 2026 is a Saturday, what will be the day of the week on 26 January 2027?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Monday</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Tuesday</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Wednesday</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sunday</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Number of days from 15 August 2026 to 26 January 2027:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>August: 16 days (16 to 31), September: 30, October: 31, November: 30, December: 31, January: 26</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total = 16 + 30 + 31 + 30 + 31 + 26 = 164 days</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>164 = 7 × 23 + 3, so the odd days = 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Saturday + 3 days = Tuesday.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, 26 January 2027 will be a Tuesday.</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">What is the angle between the hour hand and the minute hand of a clock at 8:20?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>130°</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>120°</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>125°</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>140°</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Angle of the hour hand from 12 at 8:20 = 8 × 30° + 20 × 0.5° = 240° + 10° = 250°</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Angle of the minute hand from 12 at 20 minutes = 20 × 6° = 120°</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Angle between the hands = 250° − 120° = 130°</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, the angle between the hands is 130°.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a group of 60 people, 35 like tea, 28 like coffee and 12 like neither tea nor coffee. How many people like both tea and coffee?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>17</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>19</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>People who like at least one of the two drinks = 60 − 12 = 48</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Using n(T ∪ C) = n(T) + n(C) − n(T∩ C):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>48 = 35 + 28 − n(T∩ C)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>n(T∩ C) = 63 − 48 = 15</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, 15 people like both tea and coffee.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794461804251_image003.jpeg\" width=\"494\" height=\"186\" alt ></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the number that will replace the question mark (?) in the following arrangement. The sets are formed using the same logic.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(3, 4, 25), (5, 12, 169), (8, 15, ?)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into their constituent digits.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>279</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>259</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>299</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>289</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The logic followed here is: third number = (first number)² + (second number)²</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3² + 4² = 9 + 16 = 25</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5² + 12² = 25 + 144 = 169</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly, 8² + 15² = 64 + 225 = 289</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, the missing number is 289.</span></p>", "question_heading": ""}, {"sr_no": 26, "question": "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">What should come in place of the question mark (?) in the given series?</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><strong><span style=\"font-size:12pt\"><span style=\"font-family: &quot;Nirmala UI&quot;;\">13, 20, 34, ?, 118, 230</span></span></strong></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>58</span></p>", "option2": "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>66</span></p>", "option3": "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>62</span></p>", "option4": "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>64</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13, 20, 34, ?, 118, 230</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The differences between consecutive terms are 7, 14, 28, 56, 112, each double the previous one.</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13 + 7 = 20</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20 + 14 = 34</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>34 + 28 = 62</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>62 + 56 = 118</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>118 + 112 = 230</span></p>\r\n\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, the missing number is 62.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Arrange the following words in a meaningful order and select the option that gives the correct order.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">1. Bud</span><span style=\"font-weight:bold\">   </span><span style=\"font-weight:bold\">2. Seed</span><span style=\"font-weight:bold\">   </span><span style=\"font-weight:bold\">3. Flower</span><span style=\"font-weight:bold\">   </span><span style=\"font-weight:bold\">4. Fruit</span><span style=\"font-weight:bold\">   </span><span style=\"font-weight:bold\">5. Germination</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2, 5, 1, 3, 4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2, 1, 5, 3, 4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5, 2, 1, 3, 4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2, 5, 3, 1, 4</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The meaningful order follows the life cycle of a flowering plant:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Seed→ Germination → Bud → Flower → Fruit</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>That is, 2, 5, 1, 3, 4.</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Seven friends — A, B, C, D, E, F and G — are sitting in a row facing north. D sits third from the left end of the row. Only two people sit between D and B. G sits second to the right of D. F sits to the immediate right of B. C sits to the immediate left of D. A does not sit at either end of the row. How many people sit between E and G?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the positions in the row be numbered 1 to 7 from left to right (facing north, so right means towards the higher numbers).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. D sits at position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Only two people sit between D and B, so B sits at position 6 (position 0 does not exist).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. G sits second to the right of D, so G sits at position 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. F sits to the immediate right of B, so F sits at position 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. C sits to the immediate left of D, so C sits at position 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. The remaining positions are 1 and 4 for A and E. A does not sit at an end, so A sits at position 4 and E sits at position 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Final arrangement (left to right): E, C, D, A, G, B, F</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The people sitting between E and G are C, D and A.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, three people sit between E and G.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794461804251_image004.jpeg\" width=\"464\" height=\"165\" alt ></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Eight persons — A, B, C, D, P, Q, R and S — are sitting in two parallel rows containing four persons each. In row 1, A, B, C and D are sitting and all of them face south. In row 2, P, Q, R and S are sitting and all of them face north. Each person in row 1 faces exactly one person of row 2. B sits at the extreme left end of the row. A sits second to the right of B. D does not sit at either end of the row. P sits opposite D. Q sits to the immediate left of P. S sits opposite B. Who sits to the immediate right of the person sitting opposite A?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Number the positions 1 to 4 from west to east. Persons in row 1 face south (their left is East and right is West). Persons in row 2 face north (their left is West and right is East).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. B sits at the extreme left end of row 1, so B sits at position 4 (East end).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. A sits second to the right of B, so A sits at position 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. D does not sit at an end, so D sits at position 3 and C sits at position 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. P sits opposite D, so P sits at position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Q sits to the immediate left of P, so Q sits at position 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. S sits opposite B, so S sits at position 4, and R sits at position 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Row 1 (facing south): C, A, D, B</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Row 2 (facing north): R, Q, P, S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The person sitting opposite A is Q. The person sitting to the immediate right of Q is P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, the answer is P.</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Six friends — A, B, C, D, E and F — are of different heights. E is taller than only F. B is taller than D but shorter than A. C is taller than A. D is taller than E. Who is the third shortest?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E is taller than only F, so E is the second shortest and F is the shortest.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D is taller than E, so D comes next.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B is taller than D but shorter than A, and C is taller than A.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>So, the order from tallest to shortest is: C &gt; A &gt; B &gt; D &gt; E &gt; F</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The third shortest person is D.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, D is the answer.</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following built the famous 'Hawa Mahal' in Jaipur    in the year 1799?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Maharaja Sawai Jai Singh</p>", "option2": " <p style=\"orphans:0;widows:0\">    Maharaja Sawai Pratap Singh</p>", "option3": " <p style=\"orphans:0;widows:0\">    Maharaja Man Singh I</p>", "option4": " <p style=\"orphans:0;widows:0\">    Maharaja Jaswant Singh</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Hawa Mahal (Palace of Winds) in Jaipur, Rajasthan, was built    in 1799 by Maharaja Sawai Pratap Singh. It was designed by Lal    Chand Ustad using red and pink sandstone and features 953    intricately designed small windows (jharokhas).</p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0\">    <b>Which committee was constituted by the Government of India in    August 1991 to recommend comprehensive reforms in the country's    direct and indirect tax structure?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    C. Rangarajan Committee</p>", "option2": " <p style=\"orphans:0;widows:0\">    Raja Chelliah Committee</p>", "option3": " <p style=\"orphans:0;widows:0\">    Tarapore Committee</p>", "option4": " <p style=\"orphans:0;widows:0\">    Malhotra Committee</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Tax Reforms Committee was constituted in August 1991 under the    chairmanship of Dr. Raja J. Chelliah to suggest measures for    overhauling the Indian tax system. The committee recommended    rationalizing and reducing personal and corporate income tax    rates, reducing peak customs tariffs, introducing value-added    taxation (VAT), and simplifying procedures to widen the tax base.</p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0\">    <b>An object is placed at a distance of 20 cm in front of a convex    lens. If a real and inverted image is formed at a distance of 60    cm on the other side of the lens, what is the magnification    produced by the lens?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    +3</p>", "option2": " <p style=\"orphans:0;widows:0\">    -3</p>", "option3": " <p style=\"orphans:0;widows:0\">    +0.33</p>", "option4": " <p style=\"orphans:0;widows:0\">    -0.33</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    According to the Cartesian sign convention for spherical lenses:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Object    distance (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794477714430_html_ca251a9e165ee99b.gif\" > )    =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794477714430_html_d76fb73c875efc44.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Image    distance (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794477714430_html_acc4ed3bbe33fd32.gif\" > )    =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794477714430_html_f9126e1f72930a6.gif\" >     (since a real image is formed on the other side of the lens)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Magnification    (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794477714430_html_4d187224ad27976d.gif\" > )    of a lens is given by the formula:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794477714430_html_6a525466d94d683c.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794477714430_html_d026c329bbd374a8.gif\" > </p>    <p style=\"orphans:0;widows:0\">The negative sign indicates that    the image formed is real and inverted.</p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following geographical regions typically has the    lowest population density due to an extremely arid climate and    scarcity of water?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    River plains</p>", "option2": " <p style=\"orphans:0;widows:0\">    Hot deserts</p>", "option3": " <p style=\"orphans:0;widows:0\">    Coastal areas</p>", "option4": " <p style=\"orphans:0;widows:0\">    Delta regions</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Hot deserts (such as the Sahara or Thar Desert) have very low    population density mainly due to harsh climatic conditions,    extreme aridity, high temperatures, and severe scarcity of water,    which make human settlement and agriculture extremely difficult.</p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\">    <b>A book lies stationary on a table. If the downward    gravitational force acting on it is completely balanced by the    upward normal reaction force, what happens to the book?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    It remains at rest.</p>", "option2": " <p style=\"orphans:0;widows:0\">    It begins to accelerate upwards.</p>", "option3": " <p style=\"orphans:0;widows:0\">    It begins to slide horizontally.</p>", "option4": " <p style=\"orphans:0;widows:0\">    It moves downward with constant speed.</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    According to Newton's First Law of Motion, an object at rest will    remain at rest unless acted upon by a net unbalanced external    force. Here, the downward gravitational force and the upward    normal reaction force are equal in magnitude and opposite in    direction, so the net force acting on the book is zero (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794477714430_html_99bac7c17bb6cb7e.gif\" > ).    Consequently, the book remains at rest.</p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following National Parks in India is the only    natural habitat of the Asiatic Lion?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Kanha National Park</p>", "option2": " <p style=\"orphans:0;widows:0\">    Gir National Park</p>", "option3": " <p style=\"orphans:0;widows:0\">    Ranthambore National Park</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sundarbans National Park</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Gir National Park, located in Gujarat, is globally renowned as the    only remaining natural habitat of the Asiatic Lion (Panthera leo    leo).</p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0\">    <b>In MS Word, which of the following options is used to    automatically repeat the header row of a table at the top of each    page when the table spans across multiple pages?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Table Tools &gt; Layout tab &gt; Data group &gt; Repeat Header    Rows</p>", "option2": " <p style=\"orphans:0;widows:0\">    Insert tab &gt; Header &amp; Footer group &gt; Header</p>", "option3": " <p style=\"orphans:0;widows:0\">    Table Tools &gt; Table Design tab &gt; Table Style Options &gt;    Header Row</p>", "option4": " <p style=\"orphans:0;widows:0\">    Page Layout tab &gt; Page Setup group &gt; Print Titles</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In MS Word, to repeat header rows across pages for a multi-page    table, select the header row(s) and go to <b>Table Tools &gt;    Layout tab &gt; Data group &gt; Repeat Header Rows</b> (or    right-click the row &gt; Table Properties &gt; Row tab &gt; check    'Repeat as header row at the top of each page'). The 'Header Row'    check box in the Table Design tab only applies special visual    formatting to the first row and does not repeat it across pages.    'Print Titles' is an MS Excel feature.</p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following methods of political struggle was    predominantly adopted by the Moderate leaders of the Indian    National Congress during the early phase (1885–1905)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Revolutionary armed struggle</p>", "option2": " <p style=\"orphans:0;widows:0\">    Constitutional agitation through petitions, prayers, and protests</p>", "option3": " <p style=\"orphans:0;widows:0\">    Direct mass action and civil disobedience</p>", "option4": " <p style=\"orphans:0;widows:0\">    Complete boycott of all government institutions</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    During the early Moderate phase (1885–1905), Congress leaders    such as Dadabhai Naoroji, Gopal Krishna Gokhale, and Pherozeshah    Mehta believed in working within the legal framework through    constitutional agitation. Their strategy is often summarized as    the '3Ps'—Prayer, Petition, and Protest. They relied on appeals,    speeches, and memorandums to convince the British government to    enact political and administrative reforms.</p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0\">    <b>Under the New Industrial Policy announced in July 1991, the    number of industries reserved exclusively for the public sector    was reduced from 17 to ______.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    12</p>", "option2": " <p style=\"orphans:0;widows:0\">    8</p>", "option3": " <p style=\"orphans:0;widows:0\">    6</p>", "option4": " <p style=\"orphans:0;widows:0\">    4</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Under the New Industrial Policy (NIP) announced on 24 July 1991,    one of the major steps toward deregulation and liberalization was    reducing the number of industries exclusively reserved for the    public sector from 17 (as categorized under Schedule A of IPR    1956) to 8. Over time, this list was pruned further, and    currently, only two sectors—Atomic Energy and Railway    Operations—remain reserved for the public sector.</p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0\">    <b>Information regarding the construction, administration, and    repair of the ancient public irrigation reservoir 'Sudarshana    Lake' is primarily obtained from the:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Hathigumpha Inscription</p>", "option2": " <p style=\"orphans:0;widows:0\">    Junagadh Rock Inscription</p>", "option3": " <p style=\"orphans:0;widows:0\">    Nanaghat Inscription</p>", "option4": " <p style=\"orphans:0;widows:0\">    Rummindei Pillar Inscription</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Junagadh Rock Inscription of Saka ruler Rudradaman I (c. 150    CE) provides comprehensive historical details regarding the    Sudarshana Lake in Saurashtra (Gujarat). It records that the lake    was originally constructed by Pushyagupta, a governor under    Chandragupta Maurya, and canals were added under Ashoka by    Tusaspha. Later, when a severe storm breached the dam, Rudradaman    I had it reconstructed out of his own treasury without burdening    his subjects with additional taxes (vishti or pranaya).</p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Article of the Constitution of India provides for the    reservation of seats for Scheduled Castes, Scheduled Tribes, and    women in Panchayati Raj institutions?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Article 243C</p>", "option2": " <p style=\"orphans:0;widows:0\">    Article 243D</p>", "option3": " <p style=\"orphans:0;widows:0\">    Article 243E</p>", "option4": " <p style=\"orphans:0;widows:0\">    Article 243G</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Article 243D of the Constitution of India provides for the    reservation of seats for Scheduled Castes (SCs) and Scheduled    Tribes (STs) in every Panchayat in proportion to their population.    It also mandates that not less than one-third of the total number    of seats shall be reserved for women (including the number of    seats reserved for women belonging to SCs and STs).</p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Article of the Indian Constitution directs the State to    take steps to separate the judiciary from the executive in the    public services of the State?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Article 48</p>", "option2": " <p style=\"orphans:0;widows:0\">    Article 49</p>", "option3": " <p style=\"orphans:0;widows:0\">    Article 50</p>", "option4": " <p style=\"orphans:0;widows:0\">    Article 51</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Article 50 of the Indian Constitution provides for the separation    of the judiciary from the executive in the public services of the    State. It is an important provision under Part IV (Directive    Principles of State Poli
