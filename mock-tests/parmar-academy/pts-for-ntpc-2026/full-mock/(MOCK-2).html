cy) aimed at ensuring the independence of    the judiciary.</p>", "question_heading": ""}, {"sr_no": 43, "question": "In ौूनधोकौुधधप ौयीपथोनध िiाध MS Eसcिध, थुicु ीधोपहनध ोहपयंोपicोििद हूकोपधौ पुध cोिcिहोपधक नधौिहपौ in कधूधnकधnप cिधिस ोौ ौययn ोौ पुध ौयहनcध कोपो in नधीधनधncधक cिधिस iौ ंयकiीiधक?", "option1": "<p style=\"orphans:0;widows:0\">    AutoComplete</p>", "option2": " <p style=\"orphans:0;widows:0\">    AutoFilter</p>", "option3": " <p style=\"orphans:0;widows:0\">    Automatic Recalculation</p>", "option4": " <p style=\"orphans:0;widows:0\">    AutoRecover</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In spreadsheet applications such as Microsoft Excel, <b>Automatic    Recalculation</b> is the default feature that recalculates all    dependent formulas immediately whenever a referenced cell's value    is altered. By default, Excel keeps calculation set to    \"Automatic\", ensuring real-time updates of values across    the worksheet.</p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0\">    <b>The famous 'Hornbill Festival' is celebrated annually in which    of the following states of India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Nagaland</p>", "option2": " <p style=\"orphans:0;widows:0\">    Manipur</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mizoram</p>", "option4": " <p style=\"orphans:0;widows:0\">    Meghalaya</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Hornbill Festival is celebrated every year from 1 to 10    December in the northeastern state of <b>Nagaland</b>. Organized    by the State Tourism and Art &amp; Culture Departments, it is    popularly known as the 'Festival of Festivals' to encourage    inter-tribal interaction and promote cultural heritage.</p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following was conferred the Sahitya Akademi Award    2025 in the English language category for the novel 'Crimson    Spring'?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Navtej Sarna</p>", "option2": " <p style=\"orphans:0;widows:0\">    Devabrat Das</p>", "option3": " <p style=\"orphans:0;widows:0\">    Prasun Bandyopadhyay</p>", "option4": " <p style=\"orphans:0;widows:0\">    Girijakumar Baliyar Singh</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Former diplomat and author Navtej Sarna won the Sahitya Akademi    Award 2025 in the English language category for his historical    novel <i>Crimson Spring</i>, which revolves around the events of    the 1919 Jallianwala Bagh massacre. The awards were officially    announced by the Sahitya Akademi in March 2026 across 24    recognized Indian languages.</p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Article of the Constitution of India imposes a    restriction on discussing the conduct of any Judge of the Supreme    Court or of a High Court in the discharge of their duties in the    Legislature of a State?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Article 202</p>", "option2": " <p style=\"orphans:0;widows:0\">    Article 211</p>", "option3": " <p style=\"orphans:0;widows:0\">    Article 214</p>", "option4": " <p style=\"orphans:0;widows:0\">    Article 226</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Article 211</b> of the Constitution of India provides for    'Restriction on discussion in the Legislature'. It states that no    discussion shall take place in the Legislature of a State with    respect to the conduct of any Judge of the Supreme Court or of a    High Court in the discharge of their duties. Unlike Article 121    (which allows Parliament to discuss a judge's conduct during a    removal/impeachment motion), Article 211 imposes an absolute    prohibition because State Legislatures have no constitutional    authority regarding the removal of higher judiciary judges.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Other    relevant Articles:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Article    202:</b> Annual financial statement of a State.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Article    214:</b> High Courts for States.</p>    <p style=\"orphans:0;widows:0\"><b>Article 226:</b> Power of High    Courts to issue certain writs.</p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0\">    <b>According to the Badminton World Federation (BWF) rules, what    is the standard overall length of a badminton court?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    11.50 m</p>", "option2": " <p style=\"orphans:0;widows:0\">    13.40 m</p>", "option3": " <p style=\"orphans:0;widows:0\">    15.20 m</p>", "option4": " <p style=\"orphans:0;widows:0\">    16.00 m</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    According to Law 1 of the Badminton World Federation (BWF) Laws of    Badminton (updated and codified in April 2026), the standard    badminton court is a rectangle measuring <b>13.40 m</b> (44 ft) in    total length for both singles and doubles play. The overall width    of the court is 6.10 m (20 ft) for doubles and 5.18 m (17 ft) for    singles.</p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following characteristics distinctively marks the    sculptures of the Buddha produced under the Gandhara School of    Art?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Realistic human anatomy, wavy hair, and heavy drapery with    classical folds</p>", "option2": " <p style=\"orphans:0;widows:0\">    Shaved head, smiling round face, and thin, clinging transparent    drapery</p>", "option3": " <p style=\"orphans:0;widows:0\">    Exclusive use of spotted red sandstone with a stiff frontal    posture</p>", "option4": " <p style=\"orphans:0;widows:0\">    Representation solely through aniconic symbols like footprints and    umbrellas</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The <b>Gandhara School of Art</b> flourished primarily in the    north-western region of ancient India (modern Pakistan and    Afghanistan) during the reign of the Kushana dynasty (1st century    BCE to 4th century CE).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Key    characteristics of Gandhara sculptures include:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Greco-Roman    (Hellenistic) Influence:</b> The Buddha is rendered with realistic    human anatomical precision, sharp facial features resembling the    Greek god Apollo, wavy hair gathered into an <i>ushnisha</i>    (topknot), and thick, heavy drapery with realistic folds    reminiscent of a Roman toga.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Medium:</b>    In the early phase, blue-grey schist stone was predominantly used,    followed later by stucco, mud, and lime.</p>    <p style=\"orphans:0;widows:0\">In contrast, thin clinging    transparent robes, shaved heads/spiral curls, and the use of    spotted red sandstone are typical hallmarks of the indigenous    <b>Mathura School of Art</b>.</p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0\">    <b>In the parliamentary form of government in India, the Council    of Ministers is collectively responsible to which of the    following?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Rajya Sabha</p>", "option2": " <p style=\"orphans:0;widows:0\">    Lok Sabha</p>", "option3": " <p style=\"orphans:0;widows:0\">    President of India</p>", "option4": " <p style=\"orphans:0;widows:0\">    Supreme Court of India</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    According to Article 75(3) of the Constitution of India, the    Council of Ministers is collectively responsible to the Lok Sabha    (House of the People). This collective responsibility is the    foundational principle of a parliamentary system of democracy.</p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Union Ministry is the nodal agency responsible for the    implementation of the PM-KUSUM (Pradhan Mantri Kisan Urja Suraksha    evam Utthan Mahabhiyan) scheme?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Ministry of New and Renewable Energy</p>", "option2": " <p style=\"orphans:0;widows:0\">    Ministry of Agriculture and Farmers Welfare</p>", "option3": " <p style=\"orphans:0;widows:0\">    Ministry of Power</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ministry of Rural Development</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The PM-KUSUM (Pradhan Mantri Kisan Urja Suraksha evam Utthan    Mahabhiyan) scheme was launched in 2019 by the Ministry of New and    Renewable Energy (MNRE). The scheme aims to promote solar power    generation, de-dieselise the farm sector, and provide energy and    water security to farmers across India.</p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"orphans:0;widows:0\">    <b>Which mode of nutrition is observed in fungi like mushrooms    that obtain nutrients from dead and decaying organic matter?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Autotrophic nutrition</p>", "option2": " <p style=\"orphans:0;widows:0\">    Saprophytic nutrition</p>", "option3": " <p style=\"orphans:0;widows:0\">    Parasitic nutrition</p>", "option4": " <p style=\"orphans:0;widows:0\">    Holozoic nutrition</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Organisms like mushrooms and molds lack chlorophyll and cannot    perform photosynthesis. They obtain their food by secreting    digestive enzymes onto dead and decaying organic matter and    absorbing the nutrients. This mode of nutrition is known as    saprophytic (or saprotrophic) nutrition.</p>", "question_heading": ""}, {"sr_no": 52, "question": "  <p style=\"orphans:0;widows:0\">    <b>The concentration of hydroxide ions (</b><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794477714430_html_f050bd3a25ee6425.gif\" > <b>)    in an aqueous solution primarily determines its:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Basicity</p>", "option2": " <p style=\"orphans:0;widows:0\">    Acidity</p>", "option3": " <p style=\"orphans:0;widows:0\">    Salinity</p>", "option4": " <p style=\"orphans:0;widows:0\">    Radioactivity</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    In an aqueous solution, the concentration of hydrogen ions (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794477714430_html_1f4402055c246fee.gif\" > )    determines acidity, whereas the concentration of hydroxide ions    (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794477714430_html_f050bd3a25ee6425.gif\" > )    determines its basicity (alkalinity). A higher concentration of     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794477714430_html_f050bd3a25ee6425.gif\" >     relative to     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794477714430_html_1f4402055c246fee.gif\" >     makes the solution basic (pH &gt; 7).</p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following electrical instruments is primarily used    to detect the presence and direction of a small electric current    in a circuit?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Voltmeter</p>", "option2": " <p style=\"orphans:0;widows:0\">    Galvanometer</p>", "option3": " <p style=\"orphans:0;widows:0\">    Rheostat</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ammeter</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    A <b>galvanometer</b> is an electromechanical instrument used to    detect the presence and indicate the direction of small electric    currents flowing through a circuit. It has a pointer that deflects    from its central zero position to the left or right depending on    the direction of the current. In contrast, an ammeter measures the    magnitude of electric current, a voltmeter measures the electric    potential difference, and a rheostat is a variable resistor used    to control the magnitude of current.</p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"orphans:0;widows:0\">    <b>What is the work done by the gravitational force when an object    moves horizontally along a level surface?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Positive</p>", "option2": " <p style=\"orphans:0;widows:0\">    Negative</p>", "option3": " <p style=\"orphans:0;widows:0\">    Zero</p>", "option4": " <p style=\"orphans:0;widows:0\">    Infinite</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    Work done is given by the formula     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794477714430_html_5f9836ff6a56423a.gif\" > ,    where     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794477714430_html_4a97c13c8f18833a.gif\" >     is the angle between the applied force and the direction of    displacement. The gravitational force acts vertically downward,    while the displacement is horizontal, making     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794477714430_html_300fa684b0f584f.gif\" > .    Since     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794477714430_html_eb1aa35cc6be4a7d.gif\" > ,    the work done by gravity is zero.</p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"orphans:0;widows:0\">    <b>Which legendary playback singer of India was popularly known as    the 'Queen of Melody' and 'Swar Kokila'?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Asha Bhosle</p>", "option2": " <p style=\"orphans:0;widows:0\">    Lata Mangeshkar</p>", "option3": " <p style=\"orphans:0;widows:0\">    Alka Yagnik</p>", "option4": " <p style=\"orphans:0;widows:0\">    Shreya Ghoshal</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Lata Mangeshkar was widely acclaimed and affectionately referred    to as the 'Queen of Melody' and 'Swar Kokila' of India. In    recognition of her extraordinary contribution to music, she was    conferred with the Bharat Ratna, India's highest civilian honour,    in 2001.</p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following commanders led the vanguard of Maharana    Pratap's army against the Mughal forces in the Battle of    Haldighati (1576)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Hakim Khan Sur</p>", "option2": " <p style=\"orphans:0;widows:0\">    Hasan Khan Mewati</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mahmud Lodi</p>", "option4": " <p style=\"orphans:0;widows:0\">    Raja Man Singh</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In the Battle of Haldighati (1576), fought between Maharana Pratap    and the Mughal army led by Raja Man Singh I of Amber, the vanguard    (harawal) of Maharana Pratap's forces was commanded by Hakim Khan    Sur, a warrior of the Sur dynasty. In contrast, Hasan Khan Mewati    fought alongside Rana Sanga against Babur in the Battle of Khanwa    (1527).</p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"orphans:0;widows:0\">    <b>The famous 'Moti Masjid' (Pearl Mosque) situated inside the    Agra Fort was built by ________, whereas the 'Moti Masjid' located    within the Red Fort complex of Delhi was commissioned by ________.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Akbar; Jahangir</p>", "option2": " <p style=\"orphans:0;widows:0\">    Shah Jahan; Aurangzeb</p>", "option3": " <p style=\"orphans:0;widows:0\">    Aurangzeb; Shah Jahan</p>", "option4": " <p style=\"orphans:0;widows:0\">    Jahangir; Shah Jahan</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Moti Masjid (Pearl Mosque) inside the Agra Fort was built by    Mughal Emperor Shah Jahan between 1648 and 1654 for members of the    royal court. In contrast, the Moti Masjid inside the Red Fort of    Delhi was commissioned by his successor, Emperor Aurangzeb,    between 1659 and 1660 for his personal use.</p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"orphans:0;widows:0\">    <b>Indian-born author Rohinton Mistry's acclaimed novel </b><i><b>A    Fine Balance</b></i><b> was shortlisted for the prestigious Booker    Prize in which of the following years?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1991</p>", "option2": " <p style=\"orphans:0;widows:0\">    1996</p>", "option3": " <p style=\"orphans:0;widows:0\">    1998</p>", "option4": " <p style=\"orphans:0;widows:0\">    2002</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Rohinton Mistry's second novel, <i>A Fine Balance</i>, published    in 1995, was shortlisted for the Booker Prize in 1996 (the prize    was won that year by Graham Swift for <i>Last Orders</i>). It also    won the 1996 Giller Prize and the Commonwealth Writers' Prize for    Best Book. Rohinton Mistry was shortlisted for the Booker Prize    three times: for <i>Such a Long Journey</i> (1991), <i>A Fine    Balance</i> (1996), and <i>Family Matters</i> (2002).</p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Which of the following statements is/are correct regarding    primary and cache memory in a computer system?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Cache memory is volatile and placed between the CPU and RAM to    speed up data retrieval.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>RAM (Random Access Memory) retains its data permanently even    when the main power supply is switched off.</b></p>    <p style=\"orphans:0;widows:0\"><b>EEPROM allows    stored data to be erased using electrical pulses rather than    ultraviolet light.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only 1 and 2</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only 1 and 3</p>", "option3": " <p style=\"orphans:0;widows:0\">    Only 2 and 3</p>", "option4": " <p style=\"orphans:0;widows:0\">    All 1, 2, and 3</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1 is correct:</b> Cache memory is an extremely fast    volatile memory placed close to or inside the CPU to reduce the    average time required to access data from the main memory (RAM).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2 is incorrect:</b> RAM is <b>volatile memory</b>, meaning it    loses all its stored contents the moment power is turned off.</p>    <p style=\"orphans:0;widows:0\"><b>Statement 3 is correct:</b>    EEPROM (Electrically Erasable Programmable Read-Only Memory) can    be erased and reprogrammed using electrical impulses, whereas its    predecessor EPROM required ultraviolet (UV) light.</p>", "question_heading": ""}, {"sr_no": 60, "question": "Cयnौiकधन पुध ीियियथing ूोiनौ यी Inपधनnधप Pनयपयcियस ोnक पुधiन ूनiंोनद ीहncपiयnौ: SMTP (Siंूिध Mोiि Tनोnौीधन Pनयपयcिय): Uौधक ीयन नधपनiधॅing धंोiिस ीनयं ो ंोiि ौधनॅधन पय ो ियcोि cिiधnप. FTP (Fiिध Tनोnौीधन Pनयपयcिय): Uौधक ीयन पनोnौीधननing cयंूहपधन ीiिधौ ृधपथधधn ो cिiधnप ोnक ो ौधनॅधन यॅधन ो nधपथयना. HTTP (Hदूधनपधसप Tनोnौीधन Pनयपयcिय): Uौधक ीयन पनोnौीधननing ुदूधनपधसप नधतहधौपौ ोnक थधृ ूोgधौ यn पुध Wयिनक Wiकध Wधृ.", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2, and 3</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Pair 1 is incorrectly matched:</b> <b>SMTP</b> is strictly used    for <b>sending</b> emails from an email client to a server or    between servers. Protocols used for <i>receiving/retrieving</i>    emails are POP3 (Post Office Protocol 3) or IMAP (Internet Message    Access Protocol).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Pair 2 is    correctly matched:</b> FTP is a standard network protocol used for    transmitting files between computers over a TCP/IP connection.</p>    <p style=\"orphans:0;widows:0\"><b>Pair 3 is correctly matched:</b>    HTTP serves as the foundational protocol for data communication on    the World Wide Web, enabling browsers to load web pages.</p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Which of the following statements regarding Exercise KHANJAR    are correct?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. It is a joint Special Forces exercise between India and    Kyrgyzstan.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. Its 13th edition was conducted at Missamari, Assam, in    February 2026.</b></p>    <p style=\"orphans:0;widows:0\"><b>3. Its primary    focus is Counter-Terrorism and Special Forces Operations.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Correct</b> — Exercise <b>KHANJAR</b> is a joint <b>Special    Forces exercise between India and Kyrgyzstan</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Correct</b>    — The <b>13th edition</b> was conducted from <b>4–17 February    2026</b> at <b>Missamari, Assam</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Correct</b>    — Its main focus is on <b>Counter-Terrorism and Special Forces    Operations</b> in <b>urban and mountainous terrain</b>.</p>    <p style=\"orphans:0;widows:0\"><b>Therefore, all three    statements are correct.</b></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0\">    <b>What was the theme of National Science Day 2026?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Viksit Bharat through Science and Innovation</p>", "option2": " <p style=\"orphans:0;widows:0\">    Women in Science: Catalyzing Viksit Bharat</p>", "option3": " <p style=\"orphans:0;widows:0\">    Science, Society and Sustainable Development</p>", "option4": " <p style=\"orphans:0;widows:0\">    Future of Science in India</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>National Science Day is observed on 28 February</b> to    commemorate C.V. Raman’s discovery of the Raman Effect.</p>    <p style=\"orphans:0;widows:0\">The 2026 theme was <b>“Women in    Science: Catalyzing Viksit Bharat.”</b></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"orphans:0;widows:0\">    <b>In February 2026, Narendra Modi became the first recipient of    the ‘Medal of the Knesset’ awarded by the parliament of which    country?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    France</p>", "option2": " <p style=\"orphans:0;widows:0\">    Israel</p>", "option3": " <p style=\"orphans:0;widows:0\">    Germany</p>", "option4": " <p style=\"orphans:0;widows:0\">    Japan</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    On <b>25 February 2026</b>, Israel’s Knesset awarded Narendra    Modi the <b>Medal of the Knesset</b>.</p>    <p style=\"orphans:0;widows:0\">He became the <b>first recipient</b>    of this newly established honour.</p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding Exercise Dharma    Guardian:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>It is conducted between the Indian Army and Japan Ground    Self-Defense Force.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Its 7th edition was conducted in Uttarakhand during    February–March 2026.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Its primary objective was to practice maritime warfare    operations.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1 is correct:</b> It is an annual military exercise    between India and Japan.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2 is correct:</b> The 7th edition was held from <b>24 February–9    March 2026</b> at Chaubattia, Uttarakhand.</p>    <p style=\"orphans:0;widows:0\"><b>Statement 3 is incorrect:</b>    Its focus was on <b>joint operations in urban warfare and    counter-terrorism scenarios under a UN mandate</b>, not maritime    warfare</p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"orphans:0;widows:0\">    <b>What is the primary objective of Bharat-VISTAAR launched in    March 2026?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Promote defence production</p>", "option2": " <p style=\"orphans:0;widows:0\">    Digitize urban transportation</p>", "option3": " <p style=\"orphans:0;widows:0\">    Provide AI-based agricultural advisories to farmers</p>", "option4": " <p style=\"orphans:0;widows:0\">    Create an AI education platform for students</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Bharat-VISTAAR stands for <b>Virtually Integrated System to Access    Agricultural Resources</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">It is an    <b>AI-powered, voice-first and multilingual Digital Public    Infrastructure</b>.</p>    <p style=\"orphans:0;widows:0\">It provides farmers with    advisories on <b>weather, market prices, crop management, pests    and diseases, and soil-related information.</b></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"orphans:0;widows:0\">    <b>Which team did India defeat in the ICC Men’s T20 World Cup    2026 final to win the title?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    England</p>", "option2": " <p style=\"orphans:0;widows:0\">    South Africa</p>", "option3": " <p style=\"orphans:0;widows:0\">    New Zealand</p>", "option4": " <p style=\"orphans:0;widows:0\">    Australia</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    India defeated New Zealand by <b>96 runs</b> in Ahmedabad on <b>8    March 2026</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">India scored    <b>255/5</b>, the highest total in a T20 World Cup final.</p>    <p style=\"orphans:0;widows:0\">India became the first team to    win the T20 World Cup title in consecutive editions.</p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"orphans:0;widows:0\">    <b>Who is the author of the book </b><i><b>The Midnight Train</b></i><b>,    released in February 2026?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Matt Haig</p>", "option2": " <p style=\"orphans:0;widows:0\">    Amitav Ghosh</p>", "option3": " <p style=\"orphans:0;widows:0\">    Arundhati Roy</p>", "option4": " <p style=\"orphans:0;widows:0\">    Shashi Tharoor</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <i>The Midnight Train</i> was written by <b>Matt Haig</b>.</p>    <p style=\"orphans:0;widows:0\">Matt Haig is a renowned <b>British    author</b> known for fiction and contemporary literature.</p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"orphans:0;widows:0\">    <b>At which location was the Indian Air Force exercise ‘Vayu    Shakti–2026’ conducted in February 2026?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Pokhran, Rajasthan</p>", "option2": " <p style=\"orphans:0;widows:0\">    Jaisalmer, Rajasthan</p>", "option3": " <p style=\"orphans:0;widows:0\">    Dehradun, Uttarakhand</p>", "option4": " <p style=\"orphans:0;widows:0\">    Babina, Uttar Pradesh</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    President Droupadi Murmu witnessed the exercise at Pokhran Field    Firing Range on 27 February 2026.</p>    <p style=\"orphans:0;widows:0\">It was a major Indian Air Force    exercise involving fighter aircraft, helicopters and transport    aircraft.</p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"orphans:0;widows:0\">    <b>Which team won the 2025–26 Ranji Trophy title for the first    time?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Karnataka</p>", "option2": " <p style=\"orphans:0;widows:0\">    Jammu and Kashmir</p>", "option3": " <p style=\"orphans:0;widows:0\">    Vidarbha</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mumbai</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Jammu and Kashmir won the 2025–26 Ranji Trophy title for the    first time.</p>    <p style=\"orphans:0;widows:0\">Jammu and Kashmir defeated    Karnataka in the final.</p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the Very    Short-Range Air Defence System (VSHORADS), successfully tested by    DRDO in February 2026:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>DRDO conducted three consecutive successful flight trials of    this system.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>It was tested at the Integrated Test Range (ITR), Chandipur,    Odisha.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>It is developed to neutralise high-speed aerial threats.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statement 1 is correct: DRDO conducted three consecutive    successful flight trials of VSHORADS on 27–28 February 2026.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Statement 2    is correct: The trials were conducted at the Integrated Test Range    (ITR), Chandipur, Odisha.</p>    <p style=\"orphans:0;widows:0\">Statement 3 is correct: VSHORADS    is an indigenous Very Short-Range Air Defence System developed to    neutralise aerial threats at varying altitudes and ranges.</p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Two trains are moving in opposite directions at speeds of 80 km/h and 120 km/h. The length of one train is 300 m, and they take 12 seconds to cross each other. What is the length (in m) of the other train, correct to 2 decimal places? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>388.88</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>333.33</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>366.67</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>377.77</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Relative speed = 80 + 120 = 200 km/h = 200 × 5/18 = 500/9 m/s. Distance covered in 12 s = (500/9) × 12 = 666.67 m = sum of the two lengths. Other train = 666.67 − 300 = 366.67 m.</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The difference between the compound interest (compounded annually) and the simple interest on a certain sum for 2 years at 9% per annum is ₹97.20. Find the sum. </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹12,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹10,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹15,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹12,500</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>For 2 years, CI − SI = P × (R/100)². So 97.20 = P × (9/100)² = P × 0.0081. P = 97.20 ÷ 0.0081 = ₹12,000.</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Find the greatest number that divides 72 and 119, leaving remainders 3 and 4 respectively. </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>17</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>23</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>21</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>19</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Subtract the remainders: 72 − 3 = 69 and 119 − 4 = 115. The required number = HCF(69, 115). 69 = 3 × 23 and 115 = 5 × 23, so HCF = 23.</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The perimeter of a right-angled triangle is 60 cm and its hypotenuse is 26 cm. Find the area of the triangle. </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>240 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>180 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>160 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>120 cm²</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Let the legs be a and b. a + b = 60 − 26 = 34 and a² + b² = 26² = 676. (a + b)² = a² + b² + 2ab ⇒ 1156 = 676 + 2ab ⇒ ab = 240. Area = ab/2 = 120 cm².</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Driving at 30 km/h, Vinod reaches his office 5 minutes late. Driving at 40 km/h, he reaches 3 minutes early. What is the distance between his residence and his office? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>16 km</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20 km</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15 km</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18 km</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Time difference = 5 + 3 = 8 min = 2/15 h. d/30 − d/40 = 2/15 ⇒ d(4 − 3)/120 = 2/15 ⇒ d = 240/15 = 16 km.</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A solid right circular cone of height 11.2 cm and base radius 2.8 cm is melted and recast into a solid sphere. What is the diameter of the sphere? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8.4 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4.2 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2.8 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5.6 cm</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Volume stays the same: (4/3)πR³ = (1/3)π(2.8)²(11.2). So 4R³ = 2.8² × 11.2 = 2.8² × (4 × 2.8) ⇒ R³ = 2.8³ ⇒ R = 2.8 cm. Diameter = 5.6 cm.</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">One diagonal of a rhombus is 65% of the other. A square is drawn with the longer diagonal as its side. What is the ratio of the area of the rhombus to that of the square? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18 : 15</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13 : 40</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15 : 18</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40 : 13</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Let the longer diagonal = d, so the shorter = 0.65d. Area of rhombus = ½ × d × 0.65d = 0.325d². Area of square = d². Ratio = 0.325 : 1 = 13 : 40.</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The difference between the selling prices of an item when sold at an 8% profit and when sold at a 13% loss is ₹115.50. Find the cost price of the item. </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹550</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹540</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹560</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹580</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>SP at 8% profit = 1.08 CP and SP at 13% loss = 0.87 CP. Difference = (1.08 − 0.87) CP = 0.21 CP = 115.50 ⇒ CP = 115.50 ÷ 0.21 = ₹550.</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">20 men and 15 boys can do a piece of work in 10 days, while 25 men and 10 boys can do it in 9 days. Find the ratio of the daily work done by a man to that done by a boy. </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14 : 5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 : 5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 : 12</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 : 14</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Total work is the same: 10(20m + 15b) = 9(25m + 10b) ⇒ 200m + 150b = 225m + 90b ⇒ 60b = 25m ⇒ m : b = 60 : 25 = 12 : 5.</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">24 mango trees, 56 apple trees and 72 orange trees have to be planted in rows such that each row contains the same number of trees and all trees in a row are of one variety only. Find the minimum number of rows required. </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>17</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>19</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Trees per row must divide 24, 56 and 72, and for minimum rows it must be the largest such number: HCF(24, 56, 72) = 8. Rows = 24/8 + 56/8 + 72/8 = 3 + 7 + 9 = 19.</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Lead spheres of diameter 6 cm are dropped into a cylindrical beaker of diameter 9 cm containing water, and all of them are fully submerged. If the water level rises by 32 cm, how many spheres were dropped? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>16</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Volume of water raised = π(4.5)²(32) = 648π cm³. Volume of one sphere = (4/3)π(3)³ = 36π cm³. Number of spheres = 648π ÷ 36π = 18.</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If the roots of the quadratic equation (2 − p)x² + 2px − (p + 1) = 0 are equal, then the value of p is:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>−2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>−1</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>For equal roots, D = b² − 4ac = 0. (2p)² − 4(2 − p)(−(p + 1)) = 4p² + 4(2 − p)(p + 1) = 4p² + 4(p + 2 − p²) = 4p + 8 = 0 ⇒ p = −2.</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If x⁴ + x⁻⁴ = 1154, then the value of x + x⁻¹ is: (x &gt; 0) </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>x⁴ + x⁻⁴ = (x² + x⁻²)² − 2 ⇒ (x² + x⁻²)² = 1156 ⇒ x² + x⁻² = 34. Then (x + x⁻¹)² = x² + x⁻² + 2 = 36 ⇒ x + x⁻¹ = 6.</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Find the value of tan 15° + cot 15°. </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>tan θ + cot θ = (sin²θ + cos²θ)/(sin θ cos θ) = 2/sin 2θ. For θ = 15°: 2/sin 30° = 2/(1/2) = 4.</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The greatest number that will divide 155, 260 and 315, leaving remainders 5, 10 and 15 respectively, is: </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>75</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>50</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Subtract the remainders: 155 − 5 = 150, 260 − 10 = 250, 315 − 15 = 300. HCF(150, 250, 300) = 50. (Check: 50 &gt; 15, the largest remainder.)</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The radius of a sphere and the base radius of a cone are both 3√2 cm. If the surface area of the sphere equals the total surface area of the cone, find the height of the cone. </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9√2 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8√2 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 cm</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>4πr² = πr(r + l) ⇒ 4r = r + l ⇒ l = 3r = 9√2 cm. h² = l² − r² = 162 − 18 = 144 ⇒ h = 12 cm.</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A right circular cone is surmounted on a hemisphere, and the base radius of the cone equals the radius of the hemisphere. The diameter of the hemisphere is 12 cm and the height of the cone is 8 cm. Find the cost of painting the outer surface of the solid at ₹25 per π cm². </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹10,371</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹6,930</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹3,300</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹4,500</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>r = 6 cm, slant height l = √(6² + 8²) = 10 cm. Outer surface = cone CSA + hemisphere CSA = πrl + 2πr² = 60π + 72π = 132π cm². Cost = 132 × 25 = ₹3,300.</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If tan 15° = 2 − √3, what is the value of tan 15° cot 75° + tan 75° cot 15°? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>cot 75° = tan 15° and tan 75° = cot 15° = 1/(2 − √3) = 2 + √3. Expression = tan²15° + cot²15° = (2 − √3)² + (2 + √3)² = (7 − 4√3) + (7 + 4√3) = 14.</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The ratio of the marked price to the cost price of an article is 5 : 3. After two successive discounts of 16% and 20%, the article is sold for ₹3,024. Find the profit or loss. </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Loss, ₹112</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Loss, ₹216</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Profit, ₹324</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Profit, ₹225</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>SP = MP × 0.84 × 0.80 = 0.672 MP = 3,024 ⇒ MP = ₹4,500. CP = (3/5) × 4,500 = ₹2,700. Profit = 3,024 − 2,700 = ₹324.</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Four years ago, a mother's age was 13 times her daughter's age. Two years from now, the mother's age will be 4 times the daughter's age. After how many years from now will the mother's age be 3 times the daughter's age? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Let present ages be M and D. M − 4 = 13(D − 4) ⇒ M = 13D − 48. M + 2 = 4(D + 2) ⇒ 13D − 46 = 4D + 8 ⇒ D = 6, M = 30. 30 + t = 3(6 + t) ⇒ t = 6 years.</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The difference between the compound interest (compounded annually) and the simple interest on a sum invested for 3 years at 20% per annum is ₹448. Find the sum invested. </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹3,750</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹4,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹3,500</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹3,000</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>CI = P[(1.2)³ − 1] = 0.728P and SI = P × 0.20 × 3 = 0.6P. CI − SI = 0.128P = 448 ⇒ P = 448 ÷ 0.128 = ₹3,500.</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A sum was invested for 2 years at 40% per annum compound interest, compounded annually. Had it been compounded half-yearly, the amount would have been ₹4,544 more. Find the sum invested. </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹37,500</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹40,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹42,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹42,500</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Annually: A = P(1.4)² = 1.96P. Half-yearly: rate 20% for 4 periods, A = P(1.2)⁴ = 2.0736P. Difference = 0.1136P = 4,544 ⇒ P = ₹40,000.</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A can complete a work alone in 15 days, and B can complete one-third of the same work in 10 days. A and B work together for 6 days, after which A leaves. B and C together complete the remaining work in 8 days. In how many days will A and C together complete the whole work? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 days</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9 days</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15 days</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18 days</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>B alone takes 30 days. Total work = LCM(15, 30) = 30 units: A = 2, B = 1 unit/day. In 6 days A + B do 18 units; 12 units remain. B + C do 12 units in 8 days ⇒ 1.5/day ⇒ C = 0.5/day. A + C = 2.5/day ⇒ time = 30 ÷ 2.5 = 12 days.</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The radius of a cylinder is 16⅔% more than the radius of a hemisphere. The height of the cylinder is 21 cm, and its volume equals the volume of a sphere of radius 7 cm. Find the volume of the hemisphere (correct to 2 decimal places, π = 22/7). </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>136.09 cm³</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>133.04 cm³</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>134.10 cm³</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>132.08 cm³</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>πR²(21) = (4/3)π(7)³ ⇒ R² = 4 × 343/63 = 196/9 ⇒ R = 14/3 cm. R = (7/6)r ⇒ r = 4 cm. Hemisphere volume = (2/3)(22/7)(4)³ = 2816/21 ≈ 134.10 cm³.</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A pipe can fill an empty tank in 12.5 hours. A leak at the bottom can empty the full tank in 17.5 hours. The leak is closed 14 hours after the pipe is opened. What is the total time (in hours) taken to fill the tank? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>22.5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20.5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>27</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Take capacity = 87.5 units: pipe = 7 units/h, leak = 5 units/h. In 14 h, net filled = 14 × 2 = 28 units. Remaining 59.5 units at 7 units/h = 8.5 h. Total = 14 + 8.5 = 22.5 hours.</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The value of (sin 70° − 2 sin³ 70°)/(2 cos³ 70° − cos 70°) is: </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>tan 70°</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>cot 70°</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>cosec 70°</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>sec 70°</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Numerator = sin 70°(1 − 2 sin²70°) = sin 70° cos 140°. Denominator = cos 70°(2 cos²70° − 1) = cos 70° cos 140°. Ratio = sin 70°/cos 70° = tan 70°.</span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The sum of two numbers is 288 and their HCF is 16. How many such pairs of numbers can be formed? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Let the numbers be 16a and 16b with HCF(a, b) = 1. 16(a + b) = 288 ⇒ a + b = 18. Co-prime pairs with sum 18: (1, 17), (5, 13), (7, 11). [(3, 15) and (9, 9) are not co-prime.] So 3 pairs.</span></p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">k is the greatest number which, when it divides 2996, 4752 and 7825, leaves the same remainder in each case. What is the product of the digits of k? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>120</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>108</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>84</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>72</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>k = HCF of the differences: 4752 − 2996 = 1756, 7825 − 4752 = 3073, 7825 − 2996 = 4829. 1756 = 4 × 439, 3073 = 7 × 439, 4829 = 11 × 439, so k = 439. Product of digits = 4 × 3 × 9 = 108.</span></p>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The value of (1 + tan 20° + sec 20°)(1 + cot 20° − cosec 20°) is: </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>−1</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>0</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>Write in sin/cos: [(cos 20° + sin 20° + 1)/cos 20°] × [(sin 20° + cos 20° − 1)/sin 20°] = [(sin 20° + cos 20°)² − 1]/(sin 20° cos 20°) = (2 sin 20° cos 20°)/(sin 20° cos 20°) = 2.</span></p>", "question_heading": ""}, {"sr_no": 100, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If sin θ &gt; cos θ (θ acute), then the value of [√(1 − 2 sin θ cos θ) + √(1 + 2 sin θ cos θ)]/(2 tan θ) is: </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>cot θ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>cos θ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>sin θ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>tan θ</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>1 − 2 sin θ cos θ = (sin θ − cos θ)² and 1 + 2 sin θ cos θ = (sin θ + cos θ)². Since sin θ &gt; cos θ &gt; 0, the roots are (sin θ − cos θ) and (sin θ + cos θ); their sum = 2 sin θ. Value = 2 sin θ ÷ (2 sin θ/cos θ) = cos θ.</span></p>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
