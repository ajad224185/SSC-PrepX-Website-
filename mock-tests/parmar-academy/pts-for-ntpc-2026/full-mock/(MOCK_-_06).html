an></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both conclusions (I) and (II) follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither conclusion (I) nor (II) follows</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. All roses are flowers.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. All flowers are plants.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combining the two universal affirmative statements (A + A = A):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- All roses are plants. Thus, conclusion (I) logically follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- However, the converse of 'All roses are plants' is 'Some plants are roses', not 'All plants are roses'. Thus, conclusion (II) does not follow.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, only conclusion (I) follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795548306348_image053.jpeg\" width=\"450\" height=\"315\" alt ></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In the following triads, each group of letters is related to the subsequent one following a certain logic. Select, from the given options, the one which follows the same logic.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>TRAM - ATMR - MRTA</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CLOP - OCPL - PLCO</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BEAT - ABTE - TEAB</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HURT - RHTU - TUHR</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FROG - OFRG - GRFO</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MINT - NMTI - TMIN</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The logic followed in the triads is based on the rearrangement of letter positions from the original word (1-2-3-4):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Second word: Letters at positions 3, 1, 4, 2</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Third word: Letters at positions 4, 2, 1, 3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For TRAM (1 = T, 2 = R, 3 = A, 4 = M):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 3-1-4-2: A-T-M-R (ATMR)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 4-2-1-3: M-R-T-A (MRTA)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For CLOP (1 = C, 2 = L, 3 = O, 4 = P):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 3-1-4-2: O-C-P-L (OCPL)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 4-2-1-3: P-L-C-O (PLCO)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the same rule to the options:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For HURT (1 = H, 2 = U, 3 = R, 4 = T):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 3-1-4-2: R-H-T-U (RHTU)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 4-2-1-3: T-U-H-R (TUHR)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, 'HURT - RHTU - TUHR' is the correct triad.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three of the following four letter-clusters are alike in a certain way and thus form a group. Which is the one that does not belong to that group?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CEG</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>JLO</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PRT</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>VXZ</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed here is adding 2 to the positional value of each consecutive letter:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CEG: C (3) + 2 = E (5); E (5) + 2 = G (7)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PRT: P (16) + 2 = R (18); R (18) + 2 = T (20)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>VXZ: V (22) + 2 = X (24); X (24) + 2 = Z (26)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>JLO: J (10) + 2 = L (12); L (12) + 3 = O (15) [Does not follow the pattern]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, JLO is the odd one out.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If each of the digits in the number 64285 is arranged in ascending order from left to right, the position of how many digits will remain unchanged?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>None</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given number: 64285</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Arranging the digits in ascending order: 24568</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing original and new positions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Original: 6, 4, 2, 8, 5</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Rearranged: 2, 4, 5, 6, 8</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only the digit '4' remains in the second position. Hence, the position of only one digit remains unchanged.</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language, ‘CROWD’ is coded as ‘59341’ and ‘SWORD’ is coded as ‘48195’. What is the code for ‘S’ in the given code language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing the letters and digits in both words:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Letters in 'CROWD' = {C, R, O, W, D} with digits = {1, 3, 4, 5, 9}</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Letters in 'SWORD' = {S, W, O, R, D} with digits = {1, 4, 5, 8, 9}</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The common letters between both words are R, O, W, and D. The common digits in both sets are 1, 4, 5, and 9.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The remaining letter in 'SWORD' is 'S' and the corresponding remaining digit is '8'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, the code for 'S' is 8.</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the triad which follows the same pattern as that followed by the two triads given below. Both triads follow the same pattern.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BD – EG – HJ</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KM – NP – QS</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>AC – FI – KN</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PR – SU – VX</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LN – PR – TV</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>GI – KM – OQ</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the given triads is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Within each pair, the second letter is obtained by adding 2 to the first letter:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B (+2) = D, E (+2) = G, H (+2) = J</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K (+2) = M, N (+2) = P, Q (+2) = S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Between consecutive pairs, each corresponding letter increases by 3:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B (+3) = E (+3) = H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D (+3) = G (+3) = J</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly, for KM – NP – QS:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K (+3) = N (+3) = Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M (+3) = P (+3) = S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Now check the options:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In </span><span style=\"font-weight:bold\">PR – SU – VX</span><span>:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (+2) = R, S (+2) = U, V (+2) = X</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (+3) = S (+3) = V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R (+3) = U (+3) = X</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, PR – SU – VX follows the exact same pattern.</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Rohan starts from his office and drives 8 km towards the north. He turns left and drives 5 km. He then turns left and drives 8 km to reach Point Q. How far and in which direction should he drive from Point Q to reach his office again? (All turns are 90-degree turns only.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 km towards the west</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8 km towards the south</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 km towards the east</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8 km towards the north</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the office be at the origin </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795548306348_image054.png\" width=\"35\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Drives 8 km north: reaches </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795548306348_image055.png\" width=\"35\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Turns left (west) and drives 5 km: reaches </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795548306348_image056.png\" width=\"54\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Turns left (south) and drives 8 km: reaches Point Q at </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795548306348_image057.png\" width=\"54\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Point Q is 5 km to the west of the office. Therefore, to reach his office again from Point Q, Rohan must drive </span><span style=\"font-weight:bold\">5 km towards the east</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795548306348_image058.jpeg\" width=\"531\" height=\"409\" alt ></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>What should come in place of the question mark (?) in the given series to make it logically complete?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>AZ2, CY4, EX8, GW16, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>JV32</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>IV32</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>IU32</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>IV24</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the series is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First letter: A (+2) → C (+2) → E (+2) → G (+2) → </span><span style=\"font-weight:bold\">I</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second letter: Z (-1) → Y (-1) → X (-1) → W (-1) → </span><span style=\"font-weight:bold\">V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Number: 2 (× 2) → 4 (× 2) → 8 (× 2) → 16 (× 2) → </span><span style=\"font-weight:bold\">32</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combining these, the next term is </span><span style=\"font-weight:bold\">IV32</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Each vowel in the word PLATFORM is changed to the letter immediately following it in the English alphabetical order and each consonant is changed to the letter immediately preceding it in the English alphabetical order. Which of the following letters will be fifth from the left in the new group of letters thus formed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given word: PLATFORM</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>According to the given condition:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Each vowel is replaced by the immediately following letter (+1):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A → B</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O → P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Each consonant is replaced by the immediately preceding letter (-1):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P → O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L → K</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T → S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F → E</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R → Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M → L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The newly formed sequence of letters is: O, K, B, S, E, P, Q, L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Counting from the left, the fifth letter is </span><span style=\"font-weight:bold\">E</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Seven people, P, Q, R, S, T, U, and V, are sitting in a row facing north. Only V sits to the right of U. Only three people sit between P and U. Only Q sits between R and S, and S is not an immediate neighbour of P. Who sits at the extreme left end of the row?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the seven positions from left to right be numbered 1 to 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. \"Only V sits to the right of U\": This means U is at position 6 and V is at position 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. \"Only three people sit between P and U\": Counting 3 spots to the left of U (positions 5, 4, 3), P must be at position 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. \"Only Q sits between R and S, and S is not an immediate neighbour of P\": The only three consecutive vacant positions are 3, 4, and 5. Thus, Q sits at position 4. Since S cannot be adjacent to P (at position 2), R sits at position 3 and S sits at position 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. The only remaining position is 1, which must be occupied by T.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The complete arrangement from left to right is: </span><span style=\"font-weight:bold\">T, P, R, Q, S, U, V</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, </span><span style=\"font-weight:bold\">T</span><span> sits at the extreme left end of the row.</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Five boxes A, B, C, D, and E are kept one above the other, but not necessarily in the same order. Box D is kept at the bottom. Only two boxes are kept between Box D and Box A. Box B is kept immediately below Box A. Box C is kept above Box E. How many boxes are kept between Box C and Box E?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>None</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given information, we can determine the order of the boxes from top (5) to bottom (1):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Box D is at the bottom (Position 1).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Only two boxes are kept between Box D and Box A, so Box A is at Position 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Box B is kept immediately below Box A, so Box B is at Position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Box C is kept above Box E, which leaves Box C at Position 5 (top) and Box E at Position 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The arrangement from top to bottom is: C (5), A (4), B (3), E (2), D (1).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, there are two boxes (A and B) kept between Box C and Box E.</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'P + Q' means 'P is the brother of Q',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'P – Q' means 'P is the sister of Q',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'P × Q' means 'P is the father of Q' and</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'P ÷ Q' means 'P is the wife of Q'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the above, how is M related to K if 'M – N + R ÷ T × K'?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Maternal aunt</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Paternal aunt</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sister</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mother</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given expression: M – N + R ÷ T × K</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. M – N → M is the sister of N.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. N + R → N is the brother of R. (Thus, M, N, and R are siblings, and M is female).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. R ÷ T → R is the wife of T.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. T × K → T is the father of K.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since R is the wife of T and T is the father of K, R is the mother of K.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M is the sister of R (mother).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, M is the maternal aunt (mother's sister) of K.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795548306348_image059.jpeg\" width=\"540\" height=\"158\" alt ></p>", "question_heading": ""}, {"sr_no": 56, "question": "Rधीधन पय पुध ीियियथing िधपपधन ौधनiधौ ोnक ोnौथधन पुध तहधौपiयn पुोप ीियियथौ. Cयहnपing पय ृध कयnध ीनयं िधीप पय नigुप यnिद.(Lधीप) H K E T M U P A I R O Z B E A L F G (Rigुप)Hयथ ंोnद ौहcु ॅयथिधस ोनध पुधनध, धोcु यी थुicु iौ iंंधकiोपिधद ूनधcधकधक ृद ो cयnौयnोnप ोnक ोिसय iंंधकiोपिधद ीियियथधक ृद ो cयnौयnोnप?", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Five</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>We need to find the number of vowels that follow the pattern: </span><span style=\"font-weight:bold\">Consonant – Vowel – Consonant</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given series: H K </span><span style=\"font-weight:bold\">E</span><span> T M </span><span style=\"font-weight:bold\">U</span><span> P A I R </span><span style=\"font-weight:bold\">O</span><span> Z B E A L F G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Checking all the vowels in the series:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K – </span><span style=\"font-weight:bold\">E</span><span> – T : Preceded by K (Consonant) and followed by T (Consonant) → </span><span style=\"font-weight:bold\">Valid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M – </span><span style=\"font-weight:bold\">U</span><span> – P : Preceded by M (Consonant) and followed by P (Consonant) → </span><span style=\"font-weight:bold\">Valid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P – </span><span style=\"font-weight:bold\">A</span><span> – I : Followed by I (Vowel) → Invalid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A – </span><span style=\"font-weight:bold\">I</span><span> – R : Preceded by A (Vowel) → Invalid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R – </span><span style=\"font-weight:bold\">O</span><span> – Z : Preceded by R (Consonant) and followed by Z (Consonant) → </span><span style=\"font-weight:bold\">Valid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B – </span><span style=\"font-weight:bold\">E</span><span> – A : Followed by A (Vowel) → Invalid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E – </span><span style=\"font-weight:bold\">A</span><span> – L : Preceded by E (Vowel) → Invalid</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, there are </span><span style=\"font-weight:bold\">3</span><span> such vowels (E, U, and O).</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following letter-number clusters will replace the question mark (?) in the given series to make it logically complete?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DWE 81, GUH 64, JSK 49, MQN 36, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>QNR 25</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>POQ 25</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PNR 16</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>QOQ 25</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the given series is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First letter: D (+3) → G (+3) → J (+3) → M (+3) → </span><span style=\"font-weight:bold\">P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second letter: W (-2) → U (-2) → S (-2) → Q (-2) → </span><span style=\"font-weight:bold\">O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Third letter: E (+3) → H (+3) → K (+3) → N (+3) → </span><span style=\"font-weight:bold\">Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Number: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795548306348_image060.png\" width=\"56\" height=\"21\" alt style=\"vertical-align:middle\" ><span>, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795548306348_image061.png\" width=\"56\" height=\"21\" alt style=\"vertical-align:middle\" ><span>, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795548306348_image062.png\" width=\"56\" height=\"21\" alt style=\"vertical-align:middle\" ><span>, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795548306348_image063.png\" width=\"56\" height=\"21\" alt style=\"vertical-align:middle\" ><span>, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795548306348_image064.png\" width=\"56\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the missing cluster is </span><span style=\"font-weight:bold\">POQ 25</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A + B' means 'A is the father of B',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A – B' means 'A is the mother of B',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A × B' means 'A is the brother of B', and</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A ÷ B' means 'A is the sister of B'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the above, how is P related to S in the expression 'P – Q + R × S'?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Father's sister</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Father's mother</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mother's mother</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sister</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given expression 'P – Q + R × S':</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. P – Q means 'P is the mother of Q'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Q + R means 'Q is the father of R'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. R × S means 'R is the brother of S'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since Q is the father of R and R is the brother of S, Q is the father of S.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since P is the mother of Q, P is the father's mother of S.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795548306348_image065.jpeg\" width=\"452\" height=\"408\" alt ></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following letter-number clusters will replace the question mark (?) in the given series to make it logically complete?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BZD 45, FUJ 54, JPP 63, NKV 72, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SFB 81</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>RGC 81</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>RFB 81</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>REB 79</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the given series is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For the first letter:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B (+4) → F (+4) → J (+4) → N (+4) → </span><span style=\"font-weight:bold\">R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For the second letter:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Z (−5) → U (−5) → P (−5) → K (−5) → </span><span style=\"font-weight:bold\">F</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For the third letter:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D (+6) → J (+6) → P (+6) → V (+6) → </span><span style=\"font-weight:bold\">B</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For the number:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>45 (+9) → 54 (+9) → 63 (+9) → 72 (+9) → </span><span style=\"font-weight:bold\">81</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the missing cluster is </span><span style=\"font-weight:bold\">RFB 81</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language, ‘fresh green apple’ is coded as ‘sa po ki’, ‘eat green fruit’ is coded as ‘po te lu’, and ‘fresh sweet juice’ is coded as ‘ki na re’. How is ‘apple’ coded in that language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>po</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ki</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>sa</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>te</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. ‘fresh green apple’ = ‘sa po ki’</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. ‘eat green fruit’ = ‘po te lu’</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. ‘fresh sweet juice’ = ‘ki na re’</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From statements (1) and (2), the common word is ‘green’ and the common code is ‘po’, so ‘green’ = ‘po’.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From statements (1) and (3), the common word is ‘fresh’ and the common code is ‘ki’, so ‘fresh’ = ‘ki’.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In statement (1), the only remaining word is ‘apple’ and the only remaining code is ‘sa’.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, ‘apple’ is coded as ‘sa’.</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the foundation of    the Rashtrakuta dynasty:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Dantidurga, initially a feudatory (samanta) of the Chalukyas    of Badami, overthrew his overlord Kirtivarman II in the mid-8th    century CE to establish independent Rashtrakuta rule.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. To legitimise his royal status despite not being born into a    Kshatriya clan, he performed the Hiranyagarbha (golden womb)    ritual with the assistance of Brahmanas.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. He commissioned the monolithic Kailasanatha Temple at Ellora    to commemorate his decisive victory over the Chalukyas.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2, and 3</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1 is correct:</b> <b>Dantidurga</b> (also known as    Dantivarman II) was a Rashtrakuta chief who defeated the last    Badami Chalukya ruler, <b>Kirtivarman II</b>, around <b>753 CE</b>,    laying the foundation of the Rashtrakuta Empire in the Deccan.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2 is correct:</b> After seizing power, Dantidurga performed the    <i>Hiranyagarbha</i> ritual, which was believed to lead to the    \"rebirth\" of the sacrificer as a Kshatriya, even if he    was not one by birth.</p>    <p style=\"orphans:0;widows:0\"><b>Statement 3 is incorrect:</b>    The rock-cut <b>Kailasanatha Temple (Cave 16)</b> at Ellora was    built by Dantidurga's uncle and successor, <b>Krishna I</b> (r. c.    756–774 CE), not by Dantidurga himself.</p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following correctly represents the order of the    Sun's layers from the innermost to the outermost, and identifies    its outermost visible part?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Core → Convective Zone → Radiative Zone → Chromosphere →    Photosphere (outermost visible) → Corona</p>", "option2": " <p style=\"orphans:0;widows:0\">    Core → Radiative Zone → Convective Zone → Photosphere    (outermost visible) → Chromosphere → Corona</p>", "option3": " <p style=\"orphans:0;widows:0\">    Core → Radiative Zone → Convective Zone → Chromosphere →    Corona (outermost visible) → Photosphere</p>", "option4": " <p style=\"orphans:0;widows:0\">    Core → Photosphere → Radiative Zone → Convective Zone →    Chromosphere → Corona (outermost visible)</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The layers of the Sun from inside out are Core, Radiative Zone,    Convective Zone, Photosphere, Chromosphere, and Corona. The    Photosphere is the outermost visible part, whereas the Corona is    the outermost layer but is not visible to the naked eye except    during solar eclipses.</p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"orphans:0;widows:0\">    <b>Which branch of science is dedicated to accurately measuring    and understanding the Earth's geometric shape, orientation in    space, and gravity field?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Geomorphology</p>", "option2": " <p style=\"orphans:0;widows:0\">    Cartography</p>", "option3": " <p style=\"orphans:0;widows:0\">    Geodesy</p>", "option4": " <p style=\"orphans:0;widows:0\">    Geophysics</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Geodesy is defined as the science of accurately measuring and    understanding the Earth's geometric shape, orientation in space,    and gravity field.</p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Q4. Match the following dams with the rivers they are built on:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Tehri Dam — (i) Ganga River</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. Farakka Dam — (ii) Bhagirathi River</b></p>    <p style=\"orphans:0;widows:0\"><b>3. Tilaiya Dam    — (iii) Barakar River</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    A) 1-(ii), 2-(i), 3-(iii)</p>", "option2": " <p style=\"orphans:0;widows:0\">    B) 1-(i), 2-(ii), 3-(iii)</p>", "option3": " <p style=\"orphans:0;widows:0\">    C) 1-(ii), 2-(iii), 3-(i)</p>", "option4": " <p style=\"orphans:0;widows:0\">    D) 1-(iii), 2-(i), 3-(ii)</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Tehri Dam is built on the Bhagirathi River in Uttarakhand, Farakka    Dam is built on the Ganga River in West Bengal, and Tilaiya Dam is    built on the Barakar River in Jharkhand</p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"orphans:0;widows:0\">    <b>In a standard Soil Horizon profile, which layer is known as the    \"Illuviation layer\" or the \"zone of accumulation\"?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    O – Organic Layer</p>", "option2": " <p style=\"orphans:0;widows:0\">    E – Eluviation Layer</p>", "option3": " <p style=\"orphans:0;widows:0\">    B – Subsoil</p>", "option4": " <p style=\"orphans:0;widows:0\">    C – Parent Rock</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In the soil horizon, <b>B – Subsoil</b> is the illuviation    layer, also called the zone of accumulation. Above it lies <b>E –    Eluviation Layer</b> (leached minerals &amp; organic matter), and    below it lies <b>C – Parent Rock</b> (partly weathered rock).</p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"orphans:0;widows:0\">    <b>Which fiber crop is also known as the \"Golden Fiber\"?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Cotton</p>", "option2": " <p style=\"orphans:0;widows:0\">    Jute</p>", "option3": " <p style=\"orphans:0;widows:0\">    Hemp</p>", "option4": " <p style=\"orphans:0;widows:0\">    Silk</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Jute is a fiber crop that is also called \"Golden Fiber\".    Cotton is known as \"Silver Fiber\".</p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following pairs of Palaeolithic sites and their    locations is INCORRECTLY matched?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Hunasagi / Hungsi — Karnataka</p>", "option2": " <p style=\"orphans:0;widows:0\">    Belan Valley (Mirzapur) — Uttar Pradesh</p>", "option3": " <p style=\"orphans:0;widows:0\">    Lakhudiyar Cave Paintings — Himachal Pradesh</p>", "option4": " <p style=\"orphans:0;widows:0\">    Inamgaon and Nevasa — Maharashtra</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Lakhudiyar Cave Paintings are located in Almora, Uttarakhand.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The other    sites—</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Hunasagi/Hungsi    (Karnataka),</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Belan Valley    (Uttar Pradesh), and</p>    <p style=\"orphans:0;widows:0\">Inamgaon and Nevasa    (Maharashtra)—are correctly matched</p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following pairs of sites belong to the Mature    Harappan phase (2600–1900 BCE)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Ahar and Desalpur</p>", "option2": " <p style=\"orphans:0;widows:0\">    Kot Diji and Siswal</p>", "option3": " <p style=\"orphans:0;widows:0\">    Amri and Rangpur</p>", "option4": " <p style=\"orphans:0;widows:0\">    Kalibangan and Banawali</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Kalibangan and Banawali are Mature Harappan Sites (2600–1900    BCE). Ahar, Desalpur, Amri, and Rangpur are Late Harappan Sites,    while Kot Diji and Siswal are Early Harappan Sites</p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"orphans:0;widows:0\">    <b>In the context of the six Vedangas, which of the following    pairs is INCORRECTLY matched?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Siksha — Study of phonetics</p>", "option2": " <p style=\"orphans:0;widows:0\">    Nirukta — Study of etymology</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kalpa — Study of poetic meter</p>", "option4": " <p style=\"orphans:0;widows:0\">    Vyakaran — Study of grammar</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <b>Kalpa</b> is the study of practices, whereas <b>Chhanda</b> is    the study of poetic meter. Siksha (phonetics), Nirukta    (etymology), and Vyakaran (grammar) are correctly matched.</p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Match the following Jain texts with their respective    descriptions or authors:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Bhagavati Sutra — (i) Written by Acharya Umaswati; first    book in Jain philosophy.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. Tattvarthadhigama Sutra — (ii) Known for verses on monk    conduct, sermons, and poetic teachings.</b></p>    <p style=\"orphans:0;widows:0\"><b>3.    Uttaradhyayana Sutra — (iii) Mentions about the Mahajanapadas.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1-(iii), 2-(i), 3-(ii)</p>", "option2": " <p style=\"orphans:0;widows:0\">    1-(i), 2-(iii), 3-(ii)</p>", "option3": " <p style=\"orphans:0;widows:0\">    1-(iii), 2-(ii), 3-(i)</p>", "option4": " <p style=\"orphans:0;widows:0\">    1-(ii), 2-(i), 3-(iii)</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Bhagavati Sutra mentions the Mahajanapadas.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Tattvartha/Tattvarthadhigama    Sutra, written by Acharya Umaswati, is the first book in Jain    philosophy.</p>    <p style=\"orphans:0;widows:0\">Uttaradhyayana Sutra is known for    its verses on monk conduct, sermons, and poetic teachings.</p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"orphans:0;widows:0\">    <b>Which shortcut key is used to create a new blank presentation    quickly in MS PowerPoint 365?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Ctrl + N</p>", "option2": " <p style=\"orphans:0;widows:0\">    Shift + N</p>", "option3": " <p style=\"orphans:0;widows:0\">    Ctrl + P</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ctrl + O</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Ctrl + N. This command instantly opens a fresh presentation    window, allowing users to start creating slides without navigating    through menus.</p>    <p style=\"orphans:0;widows:0\">Shortcut keys like Ctrl + N    improve productivity by enabling quick access to common functions    within software applications such as PowerPoint.</p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the titles and    achievements of Samudragupta:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. The title Kaviraja reflects his patronage and skill in    poetry/arts, alongside his depiction playing the Veena on coins.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. The Prayag Prasasti was composed in Prakrit by Harisena to    commemorate Samudragupta's victories.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both 1 and 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statement 1 is correct: Samudragupta took the title <i>Kaviraja</i>    and has been shown playing the Veena on coins.</p>    <p style=\"orphans:0;widows:0\">Statement 2 is incorrect: <i>Prayag    Prasasti</i> was composed by his court poet Harisena, and Sanskrit    was promoted as the official language of the Guptas (not Prakrit).</p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"orphans:0;widows:0\">    <b>Which ruler is noted as having invited Muhammad Ghori to attack    Prithviraj Chauhan, and which fort did Ghori capture after    conquering Kannauj?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Khusrau Malik; Tabarhinda fort</p>", "option2": " <p style=\"orphans:0;widows:0\">    Jai Chand; Fort of Asni</p>", "option3": " <p style=\"orphans:0;widows:0\">    Bhima II; Multan fort</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ghiyasuddin Muhammad; Lahore fort</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Jai Chand is said to have invited Muhammad Ghori to attack    Prithviraj Chauhan. Following the Battle of Chandawar, Ghori    conquered Kannauj and captured the Fort of Asni.</p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Match the following architectural works or writers with their    associated person or place from the notes:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Quwwat-ul-Islam — (i) Ajmer;</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. Adhai din ka Jhonpra — (ii) Delhi;</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. Hasan-un-Nizami — (iii) Added three more storeys to Qutub    Minar;</b></p>    <p style=\"orphans:0;widows:0\"><b>4. Iltutmish —    (iv) Author of Tajul-Ma'asir</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1-(ii), 2-(i), 3-(iv), 4-(iii)</p>", "option2": " <p style=\"orphans:0;widows:0\">    1-(i), 2-(ii), 3-(iv), 4-(iii)</p>", "option3": " <p style=\"orphans:0;widows:0\">    1-(ii), 2-(iii), 3-(i), 4-(iv)</p>", "option4": " <p style=\"orphans:0;widows:0\">    1-(iv), 2-(i), 3-(ii), 4-(iii)</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Quwwat-ul-Islam is located at Delhi, while Adhai din ka Jhonpra is    at Ajmer.</p>    <p style=\"orphans:0;widows:0\">Hasan-un-Nizami (patronized by    Qutb-ud-din Aibak) was the author of <i>Tajul-Ma'asir</i>, and    Iltutmish added three more storeys to Qutub Minar.</p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following is the principal structural component of    the cell wall of fungi?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Cellulose</p>", "option2": " <p style=\"orphans:0;widows:0\">    Peptidoglycan</p>", "option3": " <p style=\"orphans:0;widows:0\">    Chitin</p>", "option4": " <p style=\"orphans:0;widows:0\">    Lignin</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The cell wall of fungi is primarily composed of <b>chitin</b>, a    tough, nitrogen-containing polysaccharide made of    N-acetylglucosamine units. In contrast, plant cell walls are made    predominantly of cellulose, while bacterial cell walls are    composed of peptidoglycan.</p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following satellite series launched by ISRO is    primarily used for Earth observation and high-resolution mapping    (cartography)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Astrosat</p>", "option2": " <p style=\"orphans:0;widows:0\">    Cartosat</p>", "option3": " <p style=\"orphans:0;widows:0\">    GSAT</p>", "option4": " <p style=\"orphans:0;widows:0\">    NavIC</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Cartosat is a series of Indian Earth observation satellites built    and operated by ISRO. These satellites are specifically designed    for cartographic applications, urban and rural planning, coastal    land use, and high-resolution Earth mapping.</p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following is a recognized adverse effect    associated with the prolonged misuse of anabolic steroids in    females?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Deepening of voice and abnormal menstrual cycles</p>", "option2": " <p style=\"orphans:0;widows:0\">    Reduction in facial and body hair</p>", "option3": " <p style=\"orphans:0;widows:0\">    Decreased aggressiveness and excessive calmness</p>", "option4": " <p style=\"orphans:0;widows:0\">    Significant loss of muscle mass</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Prolonged abuse of anabolic steroids by females causes    masculinisation (virilisation). Key side effects include the    deepening of the voice, abnormal or irregular menstrual cycles,    excessive facial and body hair growth (hirsutism), enlargement of    the clitoris, and increased aggressiveness or mood swings.</p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:0;widows:0\">    <b>In which landmark judgment did the Supreme Court invalidate    clauses (4) and (5) of Article 368—introduced by the 42nd    Constitutional Amendment Act, 1976—on the grounds that a limited    amending power is itself a basic feature of the Constitution?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Indira Nehru Gandhi v. Raj Narain (1975)</p>", "option2": " <p style=\"orphans:0;widows:0\">    Minerva Mills v. Union of India (1980)</p>", "option3": " <p style=\"orphans:0;widows:0\">    Waman Rao v. Union of India (1981)</p>", "option4": " <p style=\"orphans:0;widows:0\">    I.R. Coelho v. State of Tamil Nadu (2007)</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In the <b>Minerva Mills case (1980)</b>, the Supreme Court struck    down clauses (4) and (5) of Article 368, which had been inserted    by the 42nd Constitutional Amendment Act, 1976. Clause (4) barred    judicial review of constitutional amendments, while Clause (5)    declared that there was no limitation whatever on the constituent    power of Parliament. The Court held that since a limited amending    power is an essential part of the basic structure of the    Constitution, Parliament cannot expand its amending authority into    an unlimited power under Article 368.</p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"orphans:0;widows:0\">    <b>With reference to Alternative Dispute Resolution (ADR)    mechanisms in India, which of the following statements is    INCORRECT regarding a 'Permanent Lok Adalat' established under    Chapter VI-A of the Legal Services Authorities Act, 1987?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    It is established to deal exclusively with disputes relating to    specified public utility services such as transport, postal, and    power supply.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Its pecuniary jurisdiction is restricted to claims up to a    financial ceiling notified by the Central Government.</p>", "option3": " <p style=\"orphans:0;widows:0\">    If the parties fail to reach a settlement through conciliation, it    has no authority to decide the dispute on merits and must refer it    to a regular court.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Every award made by the Permanent Lok Adalat is final, binding on    all parties, and deemed to be a decree of a civil court.</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Under Section 22C(8) of the Legal Services Authorities Act, 1987    (inserted by the 2002 Amendment), if the parties fail to arrive at    an agreement through conciliation, the Permanent Lok Adalat is    empowered to decide the dispute on its merits, provided the    dispute does not relate to any offence. This is a crucial    distinction between a regular Lok Adalat (which acts purely as a    conciliatory forum and cannot adjudicate on merits if the parties    disagree) and a Permanent Lok Adalat. Therefore, the statement    claiming it has no power to decide on merits is incorrect.</p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>With reference to the authors of 'Tawarikh' during the Delhi    Sultanate period, consider the following statements:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. They mostly lived in cities (mainly Delhi) and rarely in    villages.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. They often wrote histories for the Sultans in the hope of    rich rewards.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only 1</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only 2</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both 1 and 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Both statements are correct. During the Delhi Sultanate, the    authors of 'Tawarikh' (histories written in Persian) were learned    men—secretaries, administrators, poets, and courtiers. They    lived primarily in cities, especially Delhi, and rarely ventured    into villages. Furthermore, they wrote their accounts often in    anticipation of valuable rewards and patronage from the ruling    Sultans, and advocated for an ideal social order based on    birthright and gender distinctions.</p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Which of the following subjects are included in the Concurrent    List (List III) of the Seventh Schedule of the Indian    Constitution?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>I. Bankruptcy and insolvency</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>II. Economic and social planning</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>III. Betting and gambling</b></p>    <p style=\"orphans:0;widows:0\"><b>IV. Public    health and sanitation</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only I and II</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only II and III</p>", "option3": " <p style=\"orphans:0;widows:0\">    Only I, II and IV</p>", "option4": " <p style=\"orphans:0;widows:0\">    Only I, III and IV</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Under the Seventh Schedule of the Indian Constitution:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Bankruptcy    and insolvency</b> is listed under Entry 9 of the <b>Concurrent    List (List III)</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Economic    and social planning</b> is listed under Entry 20 of the <b>Concurrent    List (List III)</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Public    health and sanitation</b> (Entry 6) and <b>Betting and gambling</b>    (Entry 34) fall under the <b>State List (List II)</b>.</p>    <p style=\"orphans:0;widows:0\">Therefore, only subjects I and II    are part of the Concurrent List.</p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"orphans:0;widows:0\">    <b>The folk dance 'Hojagiri', which is performed by the Reang    community, belongs to which of the following states?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Nagaland</p>", "option2": " <p style=\"orphans:0;widows:0\">    Tripura</p>", "option3": " <p style=\"orphans:0;widows:0\">    Manipur</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mizoram</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Hojagiri is a traditional folk dance performed in the state of    Tripura by the Reang (Bru) community. It is mainly performed by    women and young girls during festivals like Hojagiri or Laxmi    Puja, where dancers exhibit balancing skills with earthen pitchers    and lamps while moving only the lower half of the body.</p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"orphans:0;widows:0\">    <b>In which of the following states is the cultural festival of    'Phool Dei' traditionally celebrated?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Himachal Pradesh</p>", "option2": " <p style=\"orphans:0;widows:0\">    Uttarakhand</p>", "option3": " <p style=\"orphans:0;widows:0\">    Assam</p>", "option4": " <p style=\"orphans:0;widows:0\">    Odisha</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    'Phool Dei' is a traditional harvest and spring festival    celebrated primarily in the state of Uttarakhand (especially in    the Garhwal and Kumaon regions). During this festival, young girls    place freshly plucked spring flowers at the doorsteps of local    houses to usher in prosperity and good fortune.</p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"orphans:0;widows:0\">    <b>Water kept in an earthen pot (matka) remains cool during hot    summer days. Which of the following is the primary reason for this    cooling effect?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Clay conducts the internal heat of the water rapidly to the    outside environment.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Water continuously seeps out through microscopic pores, and its    evaporation cools the remaining water.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Atmospheric water vapor condenses on the outer surface of the pot,    causing heat loss.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The porous clay wall reflects ambient heat radiation and prevents    convection.</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    An earthen pot has numerous microscopic pores through which water    continuously oozes out to the exterior surface. When this water    evaporates, it draws the required latent heat of vaporization from    the pot and the remaining water inside. Due to this continuous    loss of heat, the temperature of the water inside the earthen pot    decreases and it becomes cool.</p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:0;widows:0\">    <b>According to the 2011 Census of India, what percentage of the    total workforce was classified as 'Agricultural Labourers'?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    24.6%</p>", "option2": " <p style=\"orphans:0;widows:0\">    30.0%</p>", "option3": " <p style=\"orphans:0;widows:0\">    41.6%</p>", "option4": " <p style=\"orphans:0;widows:0\">    3.8%</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    According to the 2011 Census, the working population in India is    categorized into four main groups:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Agricultural    Labourers:</b> 30.0%</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Cultivators:</b>    24.6%</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Household    Industry Workers:</b> 3.8%</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Other    Workers:</b> 41.6%</p>    <p style=\"orphans:0;widows:0\">Combined, cultivators and    agricultural labourers accounted for 54.6% of the workforce    engaged in the agricultural/primary sector. Thus, agricultural    labourers constituted 30.0% of the total workforce.</p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"orphans:0;widows:0\">    <b>Which country became the eighth member state to join the South    Asian Association for Regional Cooperation (SAARC) in 2007?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Myanmar</p>", "option2": " <p style=\"orphans:0;widows:0\">    Afghanistan</p>", "option3": " <p style=\"orphans:0;widows:0\">    Iran</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mauritius</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Afghanistan became the 8th member of SAARC (South Asian    Association for Regional Cooperation) during the 14th SAARC Summit    held in New Delhi, India, in April 2007. SAARC was founded in 1985    in Dhaka with seven founding member countries: Bangladesh, Bhutan,    India, Maldives, Nepal, Pakistan, and Sri Lanka.</p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following is the author of the book ‘Wise and    Otherwise’?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Jhumpa Lahiri</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sudha Murty</p>", "option3": " <p style=\"orphans:0;widows:0\">    Arundhati Roy</p>", "option4": " <p style=\"orphans:0;widows:0\">    Kiran Desai</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    'Wise and Otherwise: A salute to life' is a widely acclaimed book    written by renowned author and philanthropist Sudha Murty. In this    book, she shares various real-life encounters and inspiring    stories from her travels across India, reflecting on human nature,    values, and morality.</p>", "question_heading": ""}, {"sr_no": 88, "question": "  <p style=\"orphans:0;widows:0\">    <b>Which metal is placed below hydrogen in the reactivity series    and therefore does NOT displace hydrogen gas from dilute </b>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795576267574_html_750d079b11998050.gif\" > <b>    or dilute </b>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795576267574_html_70a42bbbffcce71.gif\" > <b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Zinc</p>", "option2": " <p style=\"orphans:0;widows:0\">    Magnesium</p>", "option3": " <p style=\"orphans:0;widows:0\">    Copper</p>", "option4": " <p style=\"orphans:0;widows:0\">    Iron</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    Copper lies below hydrogen in the reactivity series and does not    react with dilute     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795576267574_html_750d079b11998050.gif\" >     or dilute     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795576267574_html_70a42bbbffcce71.gif\" >     to liberate hydrogen gas, whereas metals above hydrogen (like     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795576267574_html_6b65d2e797239872.gif\" > ,       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795576267574_html_4fef12b5b0027838.gif\" > ,    and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795576267574_html_74247880d400aced.gif\" > )    generally do.</p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0\">    <b>Which sequence of steps correctly initiates a blank    presentation in MS PowerPoint 2016 or later?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Home → Layout → Clear All</p>", "option2": " <p style=\"orphans:0;widows:0\">    File → New → Blank Presentation</p>", "option3": " <p style=\"orphans:0;widows:0\">    File → Save As → Blank Template</p>", "option4": " <p style=\"orphans:0;widows:0\">    View → New Window → Blank</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    File → New → Blank Presentation – To start a fresh    presentation in PowerPoint 2016 or later,</p>    <p style=\"orphans:0;widows:0\">you go to the File tab, choose    New, and then select Blank Presentation. Home → Layout → Clear    All: This only changes or resets the layout of an existing slide.    File → Save As → Blank Template: This saves an existing file    as a template.</p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:0;widows:0\">    <b>In the context of Local Area Networks (LANs), what is the    primary purpose of a MAC (Media Access Control) address?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    To define the physical layout and cabling of the network</p>", "option2": " <p style=\"orphans:0;widows:0\">    To provide a logical address for network routing</p>", "option3": " <p style=\"orphans:0;widows:0\">    To uniquely identify a network interface controller (NIC) at the    data link layer</p>", "option4": " <p style=\"orphans:0;widows:0\">    To specify the network protocol being used for communication</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    To uniquely identify a network interface controller (NIC) at the    data link layer. A MAC (Media Access Control) address is a unique    hardware identifier assigned to each network interface controller    (NIC). It operates at the data link layer (Layer 2) of the OSI    model. Its primary purpose is to ensure that data packets are    delivered to the correct device within a Local Area Network (LAN).</p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"orphans:0;widows:0\">    <b>The successful qualification level load test of the Drogue    Parachute for the Gaganyaan mission was conducted at which of the    following facilities?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Satish Dhawan Space Centre (SDSC), Sriharikota</p>", "option2": " <p style=\"orphans:0;widows:0\">    Vikram Sarabhai Space Centre (VSSC), Thiruvananthapuram</p>", "option3": " <p style=\"orphans:0;widows:0\">    Rail Track Rocket Sled (RTRS) facility of DRDO, Chandigarh</p>", "option4": " <p style=\"orphans:0;widows:0\">    Liquid Propulsion Systems Centre (LPSC), Mahendragiri</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Rail Track Rocket Sled (RTRS) facility, operated by the    Terminal Ballistics Research Laboratory (TBRL) under the DRDO, is    uniquely suited for such complex tests. It allows for    high-velocity simulation of deployment conditions that are    otherwise impossible to replicate in a wind tunnel.</p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Assertion (A): The Indian Navy established a dedicated 'MILAN    village' at the Eastern Naval Command, Visakhapatnam, for the 2026    exercise.</b></p>    <p style=\"orphans:0;widows:0\"><b>Reason (R):    This village serves as a central hub to facilitate cultural and    social interaction among international delegates participating in    the naval exercise.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    (A) is false but (R) is true.</p>", "option2": " <p style=\"orphans:0;widows:0\">    (A) is true but (R) is false.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both (A) and (R) are true but (R) is not the correct explanation    of (A).</p>", "option4": " <p style=\"orphans:0;widows:0\">    Both (A) and (R) are true and (R) is the correct explanation of    (A).</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    ● Exercise MILAN is the Indian Navy’s flagship biennial    multilateral naval exercise. First held in 1995, it has evolved    significantly from a modest regional engagement into one of the    largest and most inclusive maritime exercises in the Indo-Pacific    region.</p>    <p style=\"orphans:0;widows:0\">● The 13th edition of Exercise    MILAN took place in Visakhapatnam, Andhra Pradesh, from February    15 to February 25, 2026.</p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"orphans:0;widows:0\">    <b>The joint military exercise 'VAJRA PRAHAR' is conducted    annually between the special forces of India and which of the    following nations?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    France</p>", "option2": " <p style=\"orphans:0;widows:0\">    United States</p>", "option3": " <p style=\"orphans:0;widows:0\">    Russia</p>", "option4": " <p style=\"orphans:0;widows:0\">    United Kingdom</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The joint military exercise 'VAJRA PRAHAR' is conducted annually    between the Special Forces of India and the United States of    America.</p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"orphans:0;widows:0\">    <b>Who was sworn in as the new Chief Minister of Manipur on    February 4, 2026?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    O. Ibobi Singh</p>", "option2": " <p style=\"orphans:0;widows:0\">    Yumnam Khemchand Singh</p>", "option3": " <p style=\"orphans:0;widows:0\">    N. Biren Singh</p>", "option4": " <p style=\"orphans:0;widows:0\">    Konthoujam Govindas Singh</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Shri Yumnam Khemchand Singh was sworn in as the Chief Minister of    Manipur on February 4, 2026.</p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"orphans:0;widows:0\">    <b>Which country did India defeat in the final to win the 2026    SAFF Under-19 Women’s Championship title?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Bangladesh</p>", "option2": " <p style=\"orphans:0;widows:0\">    Bhutan</p>", "option3": " <p style=\"orphans:0;widows:0\">    Nepal</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sri Lanka</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    ● India defeated Bangladesh in the final to win the 2026 SAFF    Under-19 Women’s Championship title.</p>    <p style=\"orphans:0;widows:0\">● The final match took place on    February 7, 2026, at the Pokhara Rangasala Stadium in Nepal. India    secured a commanding 4–0 victory over the defending champions,    with goals scored by captain Julan Nongmaithem, Elizabed Lakra,    Pearl Fernandes, and substitute Anwita Raghuraman.</p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"orphans:0;widows:0\">    <b>Which team emerged as the overall champion of the 6th Khelo    India Winter Games 2026?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Services Sports Control Board</p>", "option2": " <p st
