s://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image065.png\" width=\"93\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For </span><span style=\"font-weight:bold\">SURF</span><span>:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S = 1, U = 2, R = 3, F = 4</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Second word: </span><span style=\"font-weight:bold\">RSFU</span><span> follows the position order </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image064.png\" width=\"93\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Third word: </span><span style=\"font-weight:bold\">FUSR</span><span> follows the position order </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image065.png\" width=\"93\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the same rule to </span><span style=\"font-weight:bold\">MINT</span><span> (M = 1, I = 2, N = 3, T = 4):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Second word (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image064.png\" width=\"93\" height=\"21\" alt style=\"vertical-align:middle\" ><span>): </span><span style=\"font-weight:bold\">NMTI</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Third word (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image065.png\" width=\"93\" height=\"21\" alt style=\"vertical-align:middle\" ><span>): </span><span style=\"font-weight:bold\">TIMN</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, </span><span style=\"font-weight:bold\">MINT - NMTI - TIMN</span><span> is the correct triad.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language, ‘PLUM’ is coded as ‘7429’, ‘LIME’ is coded as ‘2963’, and ‘POEM’ is coded as ‘7832’. What is the code for ‘U’ in the given code language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing the given codes:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. ‘PLUM’ = ‘7429’ and ‘LIME’ = ‘2963’: The common letters are L and M, and the common digits are 2 and 9. Thus, {L, M} = {2, 9}.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. ‘PLUM’ = ‘7429’ and ‘POEM’ = ‘7832’: The common letters are P and M, and the common digits are 2 and 7. Thus, {P, M} = {2, 7}.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From (1) and (2), the common letter is M and the common digit is 2, which gives M = 2, L = 9, and P = 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Now in ‘PLUM’ (‘7429’), we have identified P = 7, L = 9, and M = 2. The remaining letter is ‘U’ and the remaining digit is 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, the code for ‘U’ is 4.</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Seven boxes, A, B, C, D, E, F, and G, are kept one above another, but not necessarily in the same order.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Box D is kept fifth from the top. Only two boxes are kept between Box D and Box A. Box B is kept immediately below Box A. Only one box is kept between Box B and Box F. Box G is kept immediately above Box E.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which box is kept second from the bottom?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>G</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the positions be numbered 1 to 7 from top to bottom:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Box D is fifth from the top → Position 5 = D.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Only two boxes are between D and A → Position 2 = A.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Box B is immediately below Box A → Position 3 = B.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Only one box is between B and F → Since position 5 is already occupied by D, Box F must be at Position 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Box G is immediately above Box E → The only consecutive vacant positions left are 6 and 7, so Position 6 = G and Position 7 = E.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. The remaining Box C must be at Position 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The arrangement from top to bottom is: F (1), A (2), B (3), C (4), D (5), G (6), E (7).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the box kept second from the bottom (Position 6) is </span><span style=\"font-weight:bold\">G</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All Rivers are Oceans.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>No Ocean is a Sea.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Some Seas are Lakes.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. No River is a Sea.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. Some Lakes are Oceans.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (I) follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (II) follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both conclusions (I) and (II) follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither conclusion (I) nor (II) follows</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. All Rivers are Oceans (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image066.png\" width=\"11\" height=\"21\" alt style=\"vertical-align:middle\" ><span>-type: All </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image066.png\" width=\"11\" height=\"21\" alt style=\"vertical-align:middle\" ><span> are </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image067.png\" width=\"11\" height=\"21\" alt style=\"vertical-align:middle\" ><span>)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. No Ocean is a Sea (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image068.png\" width=\"10\" height=\"21\" alt style=\"vertical-align:middle\" ><span>-type: No </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image067.png\" width=\"11\" height=\"21\" alt style=\"vertical-align:middle\" ><span> is </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image069.png\" width=\"10\" height=\"21\" alt style=\"vertical-align:middle\" ><span>)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Some Seas are Lakes (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image070.png\" width=\"7\" height=\"21\" alt style=\"vertical-align:middle\" ><span>-type: Some </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image069.png\" width=\"10\" height=\"21\" alt style=\"vertical-align:middle\" ><span> are </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image071.png\" width=\"12\" height=\"21\" alt style=\"vertical-align:middle\" ><span>)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For Conclusion I: Combining statements 1 and 2 (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image072.png\" width=\"71\" height=\"21\" alt style=\"vertical-align:middle\" ><span>), we get: \"No River is a Sea\". Hence, conclusion I logically follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For Conclusion II: There is no definite relation given between Lakes and Oceans; some Lakes are Seas, and no Sea is an Ocean, but Lakes and Oceans may or may not overlap. Hence, conclusion II does not follow definitely.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, only conclusion (I) follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image073.jpeg\" width=\"438\" height=\"249\" alt ></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Aarav starts from Point M and drives 28 km towards South. He then takes a left turn and drives 35 km. He takes another left turn and drives 52 km. He then turns left and drives 64 km. Finally, he turns left and drives 24 km to stop at Point N. How far (shortest distance) and towards which direction should he drive from Point N in order to reach Point M again? (All turns are 90° turns only unless specified.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>35 km towards east</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>29 km towards east</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>29 km towards west</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>35 km towards west</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the starting Point M be at the origin </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image074.png\" width=\"35\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Drives 28 km South: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image075.png\" width=\"63\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Turns left (East) and drives 35 km: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image076.png\" width=\"72\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Turns left (North) and drives 52 km: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image077.png\" width=\"181\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Turns left (West) and drives 64 km: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image078.png\" width=\"181\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Turns left (South) and drives 24 km to Point N: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image079.png\" width=\"191\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, Point N is 29 km West of Point M. To reach Point M from Point N, Aarav must drive </span><span style=\"font-weight:bold\">29 km towards east</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image080.jpeg\" width=\"500\" height=\"358\" alt ></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following letter-number clusters will replace the question mark (?) in the given series to make it logically complete?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BX125, EV64, IS27, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MO8</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NO8</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NN8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MP16</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the given series is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First letter:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B + 3 = E</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E + 4 = I</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I + 5 = </span><span style=\"font-weight:bold\">N</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second letter:</span></p><p style=\ in-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Option A: (14, 125, 21) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image088.png\" width=\"221\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Option B: (18, 512, 26) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image089.png\" width=\"174\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (Matches the pattern)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Option C: (12, 216, 17) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image090.png\" width=\"221\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Option D: (24, 729, 31) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image091.png\" width=\"221\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, option B is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Some books are diaries.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All diaries are notebooks.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Some notebooks are registers.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) Some books are notebooks.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(II) Some registers are diaries.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (I) follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (II) follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both conclusions (I) and (II) follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither conclusion (I) nor (II) follows</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">Some books are diaries</span><span> and </span><span style=\"font-weight:bold\">All diaries are notebooks</span><span>: Since all diaries are notebooks, the part of books that are diaries must also be notebooks. Therefore, </span><span style=\"font-style:italic\">Some books are notebooks</span><span> logically follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">All diaries are notebooks</span><span> and </span><span style=\"font-weight:bold\">Some notebooks are registers</span><span>: There is no definite relationship established between diaries and registers. Hence, </span><span style=\"font-style:italic\">Some registers are diaries</span><span> does not definitely follow.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, only conclusion (I) follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image092.jpeg\" width=\"492\" height=\"282\" alt ></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Six boxes, A, B, C, D, E and F, are kept one above another, but not necessarily in the same order. Box E is kept at the topmost position. Box A is kept immediately below Box E. Only two boxes are kept between Box A and Box D. Box C is kept immediately above Box D. Box B is kept below Box D. Which box is kept third from the top?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the 6 positions be numbered 1 to 6 from bottom to top (where 6 is topmost and 1 is bottommost):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Box E is at the topmost position (position 6).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Box A is immediately below Box E, so Box A is at position 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Only two boxes are kept between Box A and Box D, which places Box D at position 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Box C is kept immediately above Box D, so Box C is at position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Box B is kept below Box D, so Box B is at position 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. The only remaining box, F, must be at position 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the arrangement from top to bottom is: E (6), A (5), F (4), C (3), D (2), B (1).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The box kept third from the top is </span><span style=\"font-weight:bold\">F</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three of the following four letter-clusters are alike in a certain way and thus form a group. Which is the one that does not belong to that group?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CEG</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KMO</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SUW</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PRU</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed by the letters in each cluster is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CEG: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image093.png\" width=\"114\" height=\"25\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KMO: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image094.png\" width=\"119\" height=\"25\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SUW: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image095.png\" width=\"116\" height=\"25\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PRU: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image096.png\" width=\"113\" height=\"25\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In all options except PRU, the positional difference between consecutive letters is +2. Therefore, PRU is the odd one out.</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PM 22 is related to TJ 8 in a certain way. In the same way, DR 19 is related to HO 5. To which of the following is BK 7 related, following the same logic?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>GI −8</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FH −7</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>EG −6</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FH −6</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The logic followed here is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First letter: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image097.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> to positional value</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second letter: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image098.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> to positional value</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Number: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image099.png\" width=\"34\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For PM 22 : TJ 8</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image100.png\" width=\"131\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image101.png\" width=\"131\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image102.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For DR 19 : HO 5</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image103.png\" width=\"116\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image104.png\" width=\"132\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image105.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly, for BK 7 :</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image106.png\" width=\"114\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image107.png\" width=\"125\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image108.png\" width=\"88\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, BK 7 is related to FH −7.</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Seven people, A, B, C, D, E, F, and G, are sitting in a row, facing north. Only two people sit to the left of C. Only two people sit between C and G. E sits to the immediate right of G. Only one person sits between D and B, where D sits to the left of B. A is not an immediate neighbor of D. How many people sit to the right of B?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the 7 positions from left to right be 1, 2, 3, 4, 5, 6, 7 facing north.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Only two people sit to the left of C, so C sits at position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Only two people sit between C and G. Since C is at 3, G must be at position 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. E sits to the immediate right of G, so E sits at position 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Only one person sits between D and B, and D sits to the left of B. The available positions are 1, 2, 4, and 5. This is only possible if D is at position 2 and B is at position 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. The remaining positions are 1 and 5. Since A is not an immediate neighbor of D (position 2), A cannot sit at position 1. Thus, A sits at position 5 and F sits at position 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The final arrangement from left to right is: F, D, C, B, A, G, E.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>People sitting to the right of B are A, G, and E. Hence, there are 3 people to the right of B.</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K is the father of L. L is the sister of M. N is the mother of R. R is the son of M. How is N related to K?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Daughter</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Son's wife</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Brother's wife</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mother</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. K is the father of L, and L is the sister of M. Therefore, K is the father of both L and M.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. R is the son of M, and N is the mother of R. Since N is the mother, M must be the father of R (husband of N).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Since M is male, M is the son of K.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. N is the wife of M (K's son). Therefore, N is K's son's wife (daughter-in-law).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image109.jpeg\" width=\"464\" height=\"488\" alt ></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Each letter in the word REPUBLIC is arranged in English alphabetical order from left to right. How many letters are there in the English alphabetical series between the letter which is third from the left and the one which is first from the right in the new letter cluster thus formed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>16</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>17</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The given word is REPUBLIC.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Arranging the letters in English alphabetical order from left to right:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B, C, E, I, L, P, R, U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The letter third from the left is </span><span style=\"font-weight:bold\">E</span><span> (positional value = 5).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The letter first from the right is </span><span style=\"font-weight:bold\">U</span><span> (positional value = 21).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Number of letters between E and U in the English alphabetical series = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image110.png\" width=\"113\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, the correct answer is 15.</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A + B' means 'A is the father of B',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A - B' means 'A is the sister of B',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A × B' means 'A is the brother of B', and</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A ÷ B' means 'A is the mother of B'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>How is K related to N in the expression 'K - L + M × N'?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Father's sister</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mother's sister</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sister</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Daughter</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given expression 'K - L + M × N':</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 'K - L' means K is the sister of L.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 'L + M' means L is the father of M.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 'M × N' means M is the brother of N.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since L is the father of M and M is the brother of N, L is the father of N.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since K is the sister of L, K is the father's sister of N.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205768186_image111.jpeg\" width=\"473\" height=\"407\" alt ></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"orphans:0;widows:0\">    <b>The famous Moplah (Mappila) Rebellion of 1921 took place in    which of the following regions of India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Malabar</p>", "option2": " <p style=\"orphans:0;widows:0\">    Coromandel</p>", "option3": " <p style=\"orphans:0;widows:0\">    Konkan</p>", "option4": " <p style=\"orphans:0;widows:0\">    Bundelkhand</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Moplah Rebellion (also known as the Mappila Riots) occurred in    1921 in the Malabar region of northern Kerala. It began as an    agrarian uprising by Muslim peasants (Moplahs) against oppressive    British land revenue policies and local feudal landlords (Jenmis),    eventually becoming intertwined with the Khilafat and    Non-Cooperation Movements.</p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0\">    <b>What was the original childhood name of Swami Dayanand    Saraswati, the founder of the Arya Samaj?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Narendranath Datta</p>", "option2": " <p style=\"orphans:0;widows:0\">    Mool Shankar</p>", "option3": " <p style=\"orphans:0;widows:0\">    Gadadhar Chattopadhyay</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mahesh Das</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The original name of Swami Dayanand Saraswati was <b>Mool Shankar</b>    (Mool Shankar Tiwari). He was born in 1824 in Tankara, Gujarat,    and later founded the Arya Samaj in Bombay in 1875. Among the    other options: Narendranath Datta was the childhood name of Swami    Vivekananda, Gadadhar Chattopadhyay was the name of Ramakrishna    Paramahansa, and Mahesh Das was the original name of Birbal.</p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"orphans:0;widows:0\">    <b>If the Primary Deficit of a government in a financial year is    zero, it implies that:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    The government's total expenditure equals its total revenue</p>", "option2": " <p style=\"orphans:0;widows:0\">    The government borrows solely to finance its past interest    commitments</p>", "option3": " <p style=\"orphans:0;widows:0\">    The government has zero fiscal deficit in that financial year</p>", "option4": " <p style=\"orphans:0;widows:0\">    The revenue deficit of the government is completely eliminated</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Primary Deficit is defined as the Fiscal Deficit minus Interest    Payments:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795224086999_html_74c19a984fff40bc.gif\" > .</p>    <p style=\"orphans:0;widows:0\">When the primary deficit is zero,    it means that     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795224086999_html_dc02d02aa770bf79.gif\" > .    Since fiscal deficit represents the total gross borrowings of the    government, a zero primary deficit indicates that the entire    borrowing of the government is used merely to service past    interest obligations, rather than financing fresh current expenses    or asset creation.</p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Mughal Emperor commissioned the construction of the 'Moti    Masjid' (Pearl Mosque) inside the Red Fort complex in Delhi?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Shah Jahan</p>", "option2": " <p style=\"orphans:0;widows:0\">    Jahangir</p>", "option3": " <p style=\"orphans:0;widows:0\">    Aurangzeb</p>", "option4": " <p style=\"orphans:0;widows:0\">    Akbar</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Moti Masjid (Pearl Mosque) inside the Red Fort complex in    Delhi was built by the Mughal Emperor Aurangzeb between 1659 and    1660 for his personal use. In contrast, the Moti Masjid located    inside the Agra Fort was constructed by his father, Shah Jahan.</p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following is a Fundamental Duty of an Indian    citizen under Article 51A of the Constitution of India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    To organize village panchayats</p>", "option2": " <p style=\"orphans:0;widows:0\">    To separate the judiciary from the executive</p>", "option3": " <p style=\"orphans:0;widows:0\">    To safeguard public property and to abjure violence</p>", "option4": " <p style=\"orphans:0;widows:0\">    To secure a uniform civil code for all citizens</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Under Article 51A(i) of the Constitution of India, it is a    Fundamental Duty of every citizen \"to safeguard public    property and to abjure violence\". The other three    provisions—organization of village panchayats (Article 40),    separation of judiciary from the executive (Article 50), and    uniform civil code (Article 44)—are Directive Principles of    State Policy (DPSP) enshrined in Part IV of the Constitution.</p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following festivals is celebrated as a premier    10-day purification and sanctification festival by the Angami    tribe of Nagaland in the month of February?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Moatsu</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sekrenyi</p>", "option3": " <p style=\"orphans:0;widows:0\">    Tokhu Emong</p>", "option4": " <p style=\"orphans:0;widows:0\">    Aoleang</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <b>Sekrenyi</b> (also known as <i>Phousanyi</i>) is the most    prominent festival of the <b>Angami Naga</b> tribe of Nagaland.    Celebrated over a period of ten days in the month of February, it    is traditionally observed as a festival of purification and    sanctification to cleanse the body and soul of all past sins and    ailments. Among the other options: <b>Moatsu</b> is celebrated by    the Ao tribe, <b>Tokhu Emong</b> by the Lotha tribe, and <b>Aoleang</b>    by the Konyak tribe.</p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"orphans:0;widows:0\">    <b>According to the 2011 Census of India, what is the overall    literacy rate of the country?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    74.04%</p>", "option2": " <p style=\"orphans:0;widows:0\">    82.14%</p>", "option3": " <p style=\"orphans:0;widows:0\">    65.46%</p>", "option4": " <p style=\"orphans:0;widows:0\">    72.80%</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    According to the Census of India 2011, the overall literacy rate    of the country is <b>74.04%</b>. Among this, the male literacy    rate stands at 82.14% and the female literacy rate is 65.46%.</p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"orphans:0;widows:0\">    <b>During the reign of which of the following Delhi Sultans was    the office of 'Naib-i-Mamlakat' (Regent of the realm) created by    the Turkish nobility (Turkan-i-Chahalgani) to curtail royal    authority, with Malik Ikhtiyar-ud-din Aitigin being its first    appointee?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Rukn-ud-din Firuz</p>", "option2": " <p style=\"orphans:0;widows:0\">    Muiz-ud-din Bahram Shah</p>", "option3": " <p style=\"orphans:0;widows:0\">    Ala-ud-din Masud Shah</p>", "option4": " <p style=\"orphans:0;widows:0\">    Nasir-ud-din Mahmud</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The office of 'Naib-i-Mamlakat' (Regent or Deputy of the realm)    was created during the reign of <b>Muiz-ud-din Bahram Shah</b>    (1240–1242). After deposing Razia Sultan, the powerful group of    forty Turkish nobles ('Turkan-i-Chahalgani') placed Bahram Shah on    the throne on the condition that he delegate actual administrative    powers to a deputy. Malik Ikhtiyar-ud-din Aitigin was appointed as    the first Naib-i-Mamlakat, consolidating the nobility's dominance    over the crown.</p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following states possesses the largest reserves of    coal in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Chhattisgarh</p>", "option2": " <p style=\"orphans:0;widows:0\">    Jharkhand</p>", "option3": " <p style=\"orphans:0;widows:0\">    Odisha</p>", "option4": " <p style=\"orphans:0;widows:0\">    Madhya Pradesh</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Jharkhand has the highest coal reserves in India, accounting for    more than 26% of the nation's total deposits. Major coalfields    located in the state include Jharia, Bokaro, and Giridih. Odisha    ranks second, followed by Chhattisgarh.</p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"orphans:0;widows:0\">    <b>What was the duration of the First Five-Year Plan in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1948–1953</p>", "option2": " <p style=\"orphans:0;widows:0\">    1950–1955</p>", "option3": " <p style=\"orphans:0;widows:0\">    1951–1956</p>", "option4": " <p style=\"orphans:0;widows:0\">    1952–1957</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The First Five-Year Plan in India was launched for the period 1951    to 1956. It was based on the Harrod-Domar model and focused    primarily on the development of the primary sector, especially    agriculture and irrigation.</p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"orphans:0;widows:0\">    <b>Pandit Birju Maharaj, the legendary maestro and Padma Vibhushan    awardee of Kathak dance, belonged to which of the following    gharanas?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Jaipur Gharana</p>", "option2": " <p style=\"orphans:0;widows:0\">    Lucknow Gharana</p>", "option3": " <p style=\"orphans:0;widows:0\">    Banaras Gharana</p>", "option4": " <p style=\"orphans:0;widows:0\">    Raigarh Gharana</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Pandit Birju Maharaj (Brijmohan Nath Mishra) was the leading    exponent and face of the Kalka-Bindadin family of the <b>Lucknow    Gharana</b> of Kathak. He was the son of Acchan Maharaj and nephew    of legendary dancers Shambhu Maharaj and Lachhu Maharaj. In 1986,    he was honoured with India's second highest civilian award, the    Padma Vibhushan.</p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"orphans:0;widows:0\">    <b>Henry Louis Vivian Derozio, the pioneer of the Young Bengal    Movement, was associated as a teacher with which of the following    institutions in Calcutta?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Sanskrit College</p>", "option2": " <p style=\"orphans:0;widows:0\">    Hindu College</p>", "option3": " <p style=\"orphans:0;widows:0\">    Fort William College</p>", "option4": " <p style=\"orphans:0;widows:0\">    Scottish Church College</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Henry Louis Vivian Derozio was appointed as a teacher of English    literature and history at Hindu College, Calcutta, in 1826. His    radical teaching inspired his students, known as the 'Derozians',    to question traditional customs, promote women's education, and    advocate for freedom of thought, leading to the Young Bengal    Movement.</p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"orphans:0;widows:0\">    <b>On 8 December 1930, the revolutionary trio of Benoy Basu, Badal    Gupta, and Dinesh Gupta entered the Writers' Building in Calcutta    disguised in European attire and assassinated which notorious    British Inspector General of Prisons?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    F. J. Lowman</p>", "option2": " <p style=\"orphans:0;widows:0\">    Charles Tegart</p>", "option3": " <p style=\"orphans:0;widows:0\">    Col. N. S. Simpson</p>", "option4": " <p style=\"orphans:0;widows:0\">    James A. Scott</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    On 8 December 1930, three young revolutionaries of the Bengal    Volunteers—Benoy Krishna Basu, Badal Gupta, and Dinesh    Gupta—entered the Writers' Building (the seat of the British    administration in Calcutta) dressed in European attire. They shot    and killed Colonel N. S. Simpson, the Inspector General of    Prisons, who was notorious for his brutal treatment and torture of    political prisoners. Following a fierce gun battle with the police    known as the 'Corridor Warfare', Badal committed suicide by    consuming cyanide, while Benoy and Dinesh shot themselves; Benoy    died of his wounds days later, and Dinesh was subsequently tried    and hanged. In their honour, Kolkata's Dalhousie Square was later    renamed B.B.D. Bagh.</p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"orphans:0;widows:0\">    <b>In India, the term 'White Revolution' is primarily associated    with the sharp increase in the production of which of the    following?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Milk</p>", "option2": " <p style=\"orphans:0;widows:0\">    Eggs</p>", "option3": " <p style=\"orphans:0;widows:0\">    Fish</p>", "option4": " <p style=\"orphans:0;widows:0\">    Cotton</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The White Revolution, also known as 'Operation Flood', is    associated with the massive increase in milk production in India.    It was launched in 1970 under the leadership of Dr. Verghese    Kurien, who is known as the 'Father of the White Revolution in    India'.</p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following places in India is most likely to    experience the least difference between day and night    temperatures?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Thiruvananthapuram</p>", "option2": " <p style=\"orphans:0;widows:0\">    Jaisalmer</p>", "option3": " <p style=\"orphans:0;widows:0\">    Leh</p>", "option4": " <p style=\"orphans:0;widows:0\">    Jaipur</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Coastal areas experience the moderating influence of the sea,    which keeps the diurnal (day-and-night) range of temperature very    low. Due to its coastal location and proximity to the equator,    Thiruvananthapuram experiences very little variation between day    and night temperatures, unlike interior or desert areas such as    Jaisalmer or Jaipur.</p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Under Article 35 of the Constitution of India, the Parliament    has exclusive legislative power with respect to which of the    following matters?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Prescribing residence qualification for certain public    employment under Article 16(3)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. Empowering courts other than the Supreme Court and High    Courts to issue writs under Article 32(3)</b></p>    <p style=\"orphans:0;widows:0\"><b>3. Prescribing    punishments for acts declared as offences under Article 17 and    Article 23</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only 1 and 2</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only 2 and 3</p>", "option3": " <p style=\"orphans:0;widows:0\">    Only 1 and 3</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Article 35 of the Constitution of India lays down that the power    to make laws to give effect to certain specified Fundamental    Rights vests exclusively in the Parliament (and not in State    Legislatures) to maintain uniformity throughout the country. Under    this article, Parliament has the exclusive power to legislate on:    (1) Prescribing requirement of residence for employment under    Article 16(3); (2) Empowering lower courts to issue writs under    Article 32(3); (3) Restricting or abrogating rights of armed    forces personnel under Article 33; (4) Indemnifying acts done    during martial law under Article 34; and (5) Prescribing    punishments for offences declared under Part III, such as    untouchability (Article 17) and human trafficking/forced labour    (Article 23). Thus, all statements 1, 2, and 3 are correct.</p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0\">    <b>The famous Sun Temple of Konark is located in which of the    following states of India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Odisha</p>", "option2": " <p style=\"orphans:0;widows:0\">    Gujarat</p>", "option3": " <p style=\"orphans:0;widows:0\">    Rajasthan</p>", "option4": " <p style=\"orphans:0;widows:0\">    Madhya Pradesh</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Konark Sun Temple is a 13th-century CE Sun temple situated at    Konark on the coastline of Odisha, India. It was built by King    Narasimhadeva I of the Eastern Ganga dynasty around 1250 CE and is    designated as a UNESCO World Heritage Site.</p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:0;widows:0\">    <b>Bleaching powder is manufactured by the action of chlorine gas    on which of the following compounds?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Dry slaked lime</p>", "option2": " <p style=\"orphans:0;widows:0\">    Quicklime</p>", "option3": " <p style=\"orphans:0;widows:0\">    Limestone</p>", "option4": " <p style=\"orphans:0;widows:0\">    Gypsum</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Bleaching powder (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795224086999_html_4bed7a35831bac63.gif\" > )    is produced by the action of chlorine gas on dry slaked lime (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795224086999_html_edd3ef9bae7ae20f.gif\" > ).    The chemical reaction is:</p>    <p style=\"orphans:0;widows:0\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795224086999_html_fdf7b4337fda09df.gif\" > .</p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following groups of Articles in the Constitution    of India specifically deals with the office, election,    qualifications, and impeachment of the President of India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Articles 52 to 62</p>", "option2": " <p style=\"orphans:0;widows:0\">    Articles 74 to 78</p>", "option3": " <p style=\"orphans:0;widows:0\">    Articles 36 to 51</p>", "option4": " <p style=\"orphans:0;widows:0\">    Articles 153 to 162</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Articles 52 to 62 of Part V of the Constitution of India deal with    the President of India. These articles cover various provisions    such as the existence of the office (Article 52), executive power    of the Union (Article 53), election of the President (Articles 54    and 55), term of office (Article 56), qualifications (Article 58),    oath (Article 60), and the procedure for impeachment (Article 61).</p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"orphans:0;widows:0\">    <b>Carbon forms exceptionally strong and stable covalent bonds    with other carbon atoms, enabling catenation. Which of the    following is the primary reason for this high stability of    carbon-carbon bonds?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Presence of vacant d-orbitals</p>", "option2": " <p style=\"orphans:0;widows:0\">    Small atomic size of carbon</p>", "option3": " <p style=\"orphans:0;widows:0\">    High electropositive character</p>", "option4": " <p style=\"orphans:0;widows:0\">    Large atomic radius of carbon</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Carbon-carbon bonds are exceptionally strong and stable primarily    due to the small atomic size of carbon. Because of its small size,    the positively charged nucleus can hold the shared pair of    electrons firmly, resulting in high bond strength. In contrast,    heavier elements of group 14 (like silicon) have larger atoms,    leading to much weaker bonds.</p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following pairs of plants produces winged seeds    that are adapted for dispersal by wind?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Drumstick and Maple</p>", "option2": " <p style=\"orphans:0;widows:0\">    Xanthium and Urena</p>", "option3": " <p style=\"orphans:0;widows:0\">    Castor and Balsam</p>", "option4": " <p style=\"orphans:0;widows:0\">    Coconut and Lotus</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Drumstick and maple produce winged seeds that are light and easily    carried over long distances by the wind. In contrast, <i>Xanthium</i>    and <i>Urena</i> have hooked or spiny seeds dispersed by animals;    castor and balsam disperse seeds by an explosive bursting    mechanism; and coconut and lotus seeds are dispersed by water due    to their fibrous or spongy structures.</p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"orphans:0;widows:0\">    <b>What happens to the strength of the magnetic field inside a    current-carrying solenoid when a soft iron core is inserted into    it?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    It remains unchanged</p>", "option2": " <p style=\"orphans:0;widows:0\">    It increases significantly</p>", "option3": " <p style=\"orphans:0;widows:0\">    It decreases slightly</p>", "option4": " <p style=\"orphans:0;widows:0\">    It becomes zero</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    When a soft iron core is inserted inside a current-carrying    solenoid, the strength of the magnetic field increases    significantly. This happens because soft iron is a ferromagnetic    material with high magnetic permeability, which easily aligns with    the magnetic field and strongly concentrates the magnetic lines of    force, forming an electromagnet.</p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"orphans:0;widows:0\">    <b>Which law states that the direction of the induced    electromotive force (emf) or current always opposes the change in    magnetic flux that produces it?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Ampere's Law</p>", "option2": " <p style=\"orphans:0;widows:0\">    Coulomb's Law</p>", "option3": " <p style=\"orphans:0;widows:0\">    Lenz's Law</p>", "option4": " <p style=\"orphans:0;widows:0\">    Joule's Law</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Lenz's law states that the polarity of the induced electromotive    force (emf) is such that it tends to produce a current which    opposes the change in magnetic flux that produces it. It is    fundamentally a consequence of the law of conservation of energy.</p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"orphans:0;widows:0\">    <b>If the potential difference (voltage) applied across a resistor    of constant resistance is doubled, the electric power dissipated    by it will:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    remain unchanged</p>", "option2": " <p style=\"orphans:0;widows:0\">    be doubled</p>", "option3": " <p style=\"orphans:0;widows:0\">    become four times</p>", "option4": " <p style=\"orphans:0;widows:0\">    be halved</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    Electric power dissipated across a resistor of resistance     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795224086999_html_9dcab181f5fd021e.gif\" >     under a voltage     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795224086999_html_967e8b5dcab8d1e6.gif\" >     is given by the formula:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795224086999_html_e418f800fb0d78e4.gif\" > .    When the voltage is doubled (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795224086999_html_982a9be2a972163e.gif\" > )    while resistance     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795224086999_html_9dcab181f5fd021e.gif\" >     remains constant, the new power is     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795224086999_html_1cabd961becdf949.gif\" > .    Hence, the electric power dissipated becomes four times.</p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:0;widows:0\">    <b>How many Fundamental Duties were originally recommended by the    Swaran Singh Committee to be included in the Constitution of    India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    10</p>", "option2": " <p style=\"orphans:0;widows:0\">    8</p>", "option3": " <p style=\"orphans:0;widows:0\">    11</p>", "option4": " <p style=\"orphans:0;widows:0\">    7</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Swaran Singh Committee, set up in 1976, recommended the    inclusion of <b>8 Fundamental Duties</b> in the Constitution.    However, the 42nd Constitutional Amendment Act of 1976 introduced    10 Fundamental Duties under Part IVA (Article 51A). Later, in    2002, the 86th Constitutional Amendment Act added one more duty,    bringing the total number of Fundamental Duties to 11.</p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"orphans:0;widows:0\">    <b>_____ is a combinational digital electronic circuit that    performs arithmetic and bitwise operations on integer binary    numbers.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    AEU</p>", "option2": " <p style=\"orphans:0;widows:0\">    ALU</p>", "option3": " <p style=\"orphans:0;widows:0\">    CPU</p>", "option4": " <p style=\"orphans:0;widows:0\">    Monitor</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    ALU performs <b>arithmetic operations</b> such as addition and    subtraction.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">It also    performs <b>logical/bitwise operations</b> such as AND, OR, XOR    and NOT.</p>    <p style=\"orphans:0;widows:0\">It is a major component of the    <b>CPU</b>.</p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"orphans:0;widows:0\">    <b>Information that comes from external source and fed into    computer software is called _____.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Output</p>", "option2": " <p style=\"orphans:0;widows:0\">    Errors</p>", "option3": " <p style=\"orphans:0;widows:0\">    Status</p>", "option4": " <p style=\"orphans:0;widows:0\">    None of these</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Information entered into a computer from an external source is    called <b>Input</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The options    do not contain “Input”; therefore, <b>None of these</b> is    correct.</p>    <p style=\"orphans:0;widows:0\">Input may come through a    <b>keyboard, mouse, scanner, microphone</b>, etc.</p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"orphans:0;widows:0\">    <b>Different icons of application software can be found in _____    bar in latest version of Microsoft Windows.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Control Panel</p>", "option2": " <p style=\"orphans:0;widows:0\">    Start Menu</p>", "option3": " <p style=\"orphans:0;widows:0\">    Notification</p>", "option4": " <p style=\"orphans:0;widows:0\">    Status</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The <b>Start Menu</b> provides access to installed applications    and various system features.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Users can    find and launch application software from the Start Menu.</p>    <p style=\"orphans:0;widows:0\"><b>Windows 10/11</b> provide the    Start Menu as a central application-access point.</p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0\">    <b>An email attachment is referred to as?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    The name of cc</p>", "option2": " <p style=\"orphans:0;widows:0\">    The address of sender</p>", "option3": " <p style=\"orphans:0;widows:0\">    Subject</p>", "option4": " <p style=\"orphans:0;widows:0\">    Any document that can be attached and sent with an email</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    An <b>email attachment</b> is a file sent along with an email    message.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">It may be a    <b>document, image, PDF, spreadsheet, presentation</b>, etc.</p>    <p style=\"orphans:0;widows:0\">Attachments are commonly    represented by a <b>paperclip icon</b> in email applications.</p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:0;widows:0\">    <b>With reference to the LPG (Liberalisation, Privatisation and    Globalisation) Reforms introduced in India in 1991, consider the    following statements: 1. Liberalisation aimed to reduce    unnecessary government restrictions and industrial licensing. 2.    Privatisation involved increasing the role of the private sector    through disinvestment in public sector enterprises. 3.    Globalisation aimed to integrate the Indian economy with the world    economy by promoting foreign trade and investment. 4. The LPG    reforms were introduced under the Prime Ministership of Atal    Bihari Vajpayee. Which of the statements given above are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1, 2 and 3 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    1 and 4 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    2, 3 and 4 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2, 3 and 4</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Liberalisation :</b> Reduction of government controls,    restrictions and industrial licensing.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Privatisation    :</b> Increasing private sector participation and reducing    government ownership through disinvestment.</p>    <p style=\"orphans:0;widows:0\"><b>Globalisation :</b>    Integration of the Indian economy with the global economy through    trade, investment and technology.</p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Union Territory became the first in India to complete the    Census 2027 exercise?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Chandigarh</p>", "option2": " <p style=\"orphans:0;widows:0\">    Puducherry</p>", "option3": " <p style=\"orphans:0;widows:0\">    Ladakh</p>", "option4": " <p style=\"orphans:0;widows:0\">    Jammu &amp; Kashmir</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Ladakh became the first Union Territory in India to complete the    Census 2027 exercise.</p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"orphans:0;widows:0\">    <b>The government launched 'e-Samudra', a digital platform    integrating maritime services; with this, India also became the    world's which-largest supplier of seafarers?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Largest</p>", "option2": " <p style=\"orphans:0;widows:0\">    Second-largest</p>", "option3": " <p style=\"orphans:0;widows:0\">    Third-largest</p>", "option4": " <p style=\"orphans:0;widows:0\">    Fifth-largest</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The government launched 'e-Samudra', a digital platform    integrating maritime services for seafarers, shipping companies,    ports and other stakeholders; India also became the world's    second-largest supplier of seafarers.</p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"orphans:0;widows:0\">    <b>Assam's flagship welfare scheme Orunodoi 3.0 provides eligible    women how much monthly financial assistance through DBT?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    ₹850</p>", "option2": " <p style=\"orphans:0;widows:0\">    ₹1,000</p>", "option3": " <p style=\"orphans:0;widows:0\">    ₹1,250</p>", "option4": " <p style=\"orphans:0;widows:0\">    ₹1,500</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Orunodoi 3.0 was launched as Assam's flagship welfare scheme,    providing eligible women ₹1,250 monthly through DBT.</p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"orphans:0;widows:0\">    <b>Which jewellery became the world's first lab-grown diamond    jewellery sent into space, launched aboard Skyroot Aerospace's    Vikram-1 mission?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Celestial Spark Diamond</p>", "option2": " <p style=\"orphans:0;widows:0\">    Cosmos Bloom Diamond</p>", "option3": " <p style=\"orphans:0;widows:0\">    Astra Gem Diamond</p>", "option4": " <p style=\"orphans:0;widows:0\">    Stellar Bloom Diamond</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The 'Cosmos Bloom Diamond' became the world's first lab-grown    diamond jewellery sent into space aboard Skyroot Aerospace's    Vikram-1 mission, featuring a 16.9-carat lab-grown diamond    setting.</p>", "question_heading": ""}, {"sr_no": 95, "question": "Tुध Dिधुi Gयॅधनnंधnपैौ Viकदो Vोुini Yयुोnो ूनयॅiकधौ ीनधध ृicदcिधौ पय giिनस यी थुicु cिोौौ in gयॅधनnंधnप ौcुयियस?", "option1": "<p style=\"orphans:0;widows:0\">    Class VIII</p>", "option2": " <p style=\"orphans:0;widows:0\">    Class IX</p>", "option3": " <p style=\"orphans:0;widows:0\">    Class X</p>", "option4": " <p style=\"orphans:0;widows:0\">    Class XI</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">
