<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>4.) MOCK-2 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

 style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>508</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>528</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>518</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>512</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यहाँ अपनाया गया तर्क है: n→ n³ + 6</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5³ + 6 = 125 + 6 = 131</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6³ + 6 = 216 + 6 = 222</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इसी प्रकार, 8³ + 6 = 512 + 6 = 518</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः 8 का संबंध 518 से है।</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित चार शब्दों में से तीन एक निश्चित तरीके से समान हैं और इस प्रकार एक समूह बनाते हैं। इनमें से कौन-सा उस समूह से संबंधित नहीं है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सितार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>वीणा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सरोद</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तबला</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सितार, वीणा और सरोद तार वाले वाद्ययंत्र हैं, जबकि तबला तालवाद्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः तबला विषम विकल्प है।</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक निश्चित कूट भाषा में 'FRAME' को 'GTDQJ' के रूप में कूटबद्ध किया जाता है। उस भाषा में 'BRAIN' को कैसे कूटबद्ध किया जाएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CTDMS</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CTDNS</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CSDMS</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CTEMS</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यहाँ अपनाया गया पैटर्न है: पहले से पाँचवें अक्षर तक क्रमशः 1, 2, 3, 4 और 5 स्थान आगे बढ़ाया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FRAME: F +1 = G, R +2 = T, A +3 = D, M +4 = Q, E +5 = J→ GTDQJ</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BRAIN पर वही तर्क लागू करने पर: B +1 = C, R +2 = T, A +3 = D, I +4 = M, N +5 = S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इस प्रकार, BRAIN को CTDMS के रूप में कूटबद्ध किया जाता है।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">यदि '+' और '−' को आपस में बदल दिया जाए तथा '×' और '÷' को आपस में बदल दिया जाए, तो निम्नलिखित व्यंजक का मान क्या होगा? 36 ÷ 4 + 6 × 3 − 5</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>145</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>149</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>147</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>142</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चिह्नों को आपस में बदलने के बाद व्यंजक बन जाता है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>36 × 4 − 6 ÷ 3 + 5</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BODMAS नियम लागू करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= 144 − 2 + 5</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= 147</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः 147 सही उत्तर है।</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित में से चिह्नों का कौन-सा समूह, रिक्त स्थानों में बाएँ से दाएँ उसी क्रम में रखने पर दिए गए समीकरण को संतुलित करेगा? 18 _ 6 _ 4 _ 5 = 17</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>×, ÷, +</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>÷, ×, +</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>÷, +, ×</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>−, ×, +</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रत्येक विकल्प की जाँच:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(×, ÷, +): 18 × 6 ÷ 4 + 5 = 27 + 5 = 32✗</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(÷, ×, +): 18 ÷ 6 × 4 + 5 = 3 × 4 + 5 = 12 + 5 = 17✓</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(÷, +, ×): 18 ÷ 6 + 4 × 5 = 3 + 20 = 23✗</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(−, ×, +): 18 − 6 × 4 + 5 = 18 − 24 + 5 = −1✗</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः चिह्नों का सही समूह ÷, ×, + है।</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">इस प्रश्न में कथन के माध्यम से विभिन्न तत्वों के बीच संबंध दर्शाया गया है। कथन के बाद दो निष्कर्ष दिए गए हैं। कथन का अध्ययन करें और तय करें कि दिए गए निष्कर्षों में से कौन-सा/से निश्चित रूप से अनुसरण करता/करते है/हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कथन: M &gt; N ≥ O = P &lt; Q ≤ R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निष्कर्ष: (I) M &gt; P (II) R &gt; O</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष (I) अनुसरण करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष (II) अनुसरण करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो निष्कर्ष (I) और न ही (II) अनुसरण करता है</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिया गया कथन: M &gt; N≥ O = P &lt; Q ≤ R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) M &gt; N ≥ O = P से M &gt; P प्राप्त होता है। अतः निष्कर्ष (I) अनुसरण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(II) O = P &lt; Q ≤ R से R &gt; O प्राप्त होता है। अतः निष्कर्ष (II) अनुसरण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः निष्कर्ष (I) और (II) दोनों अनुसरण करते हैं।</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़ें। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, भले ही वह सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत हो, तय करें कि दिए गए निष्कर्षों में से कौन-सा/से तार्किक रूप से अनुसरण करता/करते है/हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कथन: सभी पेन बोतलें हैं। कुछ बोतलें कप हैं। सभी कप प्लेटें हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निष्कर्ष: (I) कुछ बोतलें प्लेटें हैं। (II) कुछ पेन कप हैं। (III) कुछ प्लेटें बोतलें हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल (I) और (II) अनुसरण करते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल (II) और (III) अनुसरण करते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I), (II) और (III) सभी अनुसरण करते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल (I) और (III) अनुसरण करते हैं</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'कुछ बोतलें कप हैं' और 'सभी कप प्लेटें हैं' से हमें 'कुछ बोतलें प्लेटें हैं' प्राप्त होता है। अतः निष्कर्ष (I) अनुसरण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>परिवर्तन के आधार पर, 'कुछ बोतलें प्लेटें हैं' से 'कुछ प्लेटें बोतलें हैं' प्राप्त होता है। अतः निष्कर्ष (III) अनुसरण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'सभी पेन बोतलें हैं' और 'कुछ बोतलें कप हैं' से पेन और कप के बीच कोई निश्चित संबंध प्राप्त नहीं होता; 'कुछ पेन कप हैं' केवल एक संभावना है। अतः निष्कर्ष (II) अनुसरण नहीं करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः केवल निष्कर्ष (I) और (III) अनुसरण करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794469764935_image001.jpeg\" width=\"532\" height=\"184\" alt ></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">नीचे दिए गए प्रश्न में एक कथन के बाद (I) और (II) क्रमांकित दो मान्यताएँ दी गई हैं। मान्यता वह बात है जिसे सत्य मान लिया जाता है। कथन पर विचार करें और तय करें कि कौन-सी मान्यता/मान्यताएँ कथन में निहित हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कथन: एक शहर के परिवहन विभाग ने एक होर्डिंग लगाया है, जिस पर लिखा है, 'बस से यात्रा करें – ईंधन बचाएँ और शहर को स्वच्छ रखें।'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">मान्यताएँ: (I) निजी वाहनों की तुलना में बस से यात्रा करने पर प्रति यात्री कम ईंधन खर्च होता है। (II) शहर के सभी नागरिकों के पास निजी वाहन हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल मान्यता (I) निहित है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल मान्यता (II) निहित है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोनों मान्यताएँ (I) और (II) निहित हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो मान्यता (I) और न ही (II) निहित है</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यह नारा लोगों को ईंधन बचाने के लिए बसों का उपयोग करने की सलाह देता है। यह तभी सार्थक है जब बस से यात्रा करने पर निजी वाहनों की तुलना में प्रति यात्री कम ईंधन खर्च हो। अतः मान्यता (I) निहित है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यह नारा यह संकेत नहीं देता कि प्रत्येक नागरिक के पास निजी वाहन है। अतः मान्यता (II) निहित नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः केवल मान्यता (I) निहित है।</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">नीचे दिए गए प्रश्न में एक कथन के बाद (I) और (II) क्रमांकित दो कार्यवाहियाँ दी गई हैं। कार्यवाही सुधार, अनुवर्ती कार्रवाई या आगे की कार्रवाई के लिए लिया जाने वाला प्रशासनिक निर्णय है। तय करें कि कौन-सी कार्यवाही तार्किक रूप से अपनाई जानी चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कथन: एक विशेष मार्ग पर चलने वाली ट्रेनों में खराब स्वच्छता को लेकर कई यात्रियों ने शिकायत की है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कार्यवाहियाँ: (I) रेलवे को उस मार्ग पर चलने वाली सभी ट्रेनों को तुरंत रोक देना चाहिए। (II) रेलवे को सफाई की आवृत्ति बढ़ानी चाहिए और काम की निगरानी के लिए पर्यवेक्षक नियुक्त करने चाहिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल कार्यवाही (I) अनुसरण करती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल कार्यवाही (II) अनुसरण करती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोनों कार्यवाहियाँ (I) और (II) अनुसरण करती हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो कार्यवाही (I) और न ही (II) अनुसरण करती है</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सभी ट्रेनों को रोकने से यात्रियों को बहुत असुविधा होगी और स्वच्छता की समस्या के लिए यह एक अत्यधिक कठोर कदम है। अतः कार्यवाही (I) अनुसरण नहीं करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सफाई की आवृत्ति बढ़ाना और पर्यवेक्षक नियुक्त करना शिकायतों का सीधे समाधान करता है। अतः कार्यवाही (II) अनुसरण करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः केवल कार्यवाही (II) अनुसरण करती है।</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक तस्वीर में एक पुरुष की ओर इशारा करते हुए निशा ने कहा, 'उसकी माँ मेरे माँ के पिता की इकलौती बेटी है।' वह पुरुष निशा से किस प्रकार संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>भाई</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चचेरा/ममेरा भाई</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मामा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पिता</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'मेरी माँ के पिता' निशा के नाना हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उनकी इकलौती बेटी निशा की माँ हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इसलिए, उस पुरुष की माँ निशा की माँ हैं, जिसका अर्थ है कि वह पुरुष निशा की माँ का बेटा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः वह पुरुष निशा का भाई है।</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">रवि बिंदु A से शुरू करके उत्तर दिशा में 10 मीटर चलता है। वह बाएँ मुड़कर 15 मीटर चलता है। फिर वह दोबारा बाएँ मुड़कर 25 मीटर चलता है। अंत में, वह दाएँ मुड़कर 5 मीटर चलता है और बिंदु B पर पहुँचता है। बिंदु B, बिंदु A से कितनी दूर और किस दिशा में है? (जब तक निर्दिष्ट न हो, सभी मोड़ केवल 90 डिग्री के हैं।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25 मीटर, उत्तर-पश्चिम</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>35 मीटर, दक्षिण-पश्चिम</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20 मीटर, दक्षिण</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25 मीटर, दक्षिण-पश्चिम</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मान लें कि बिंदु A के निर्देशांक (0, 0) हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. उत्तर दिशा में 10 मीटर चलता है: (0, 10) पर पहुँचता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. बाएँ (पश्चिम) मुड़कर 15 मीटर चलता है: (−15, 10) पर पहुँचता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. बाएँ (दक्षिण) मुड़कर 25 मीटर चलता है: (−15, −15) पर पहुँचता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. दाएँ (पश्चिम) मुड़कर 5 मीटर चलता है: (−20, −15) पर पहुँचता है, जो बिंदु B है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दूरी = √(20² + 15²) = √625 = 25 मीटर।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बिंदु B, A से 20 मीटर पश्चिम और 15 मीटर दक्षिण में है, इसलिए यह A के दक्षिण-पश्चिम में स्थित है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः B, A से 25 मीटर दक्षिण-पश्चिम में है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794469764935_image002.jpeg\" width=\"560\" height=\"264\" alt ></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">सुबह 7 बजे, अनिल और सुनील एक-दूसरे के सामने खड़े हैं। अनिल की छाया ठीक उसकी दाईं ओर पड़ती है। सुनील किस दिशा की ओर मुँह करके खड़ा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उत्तर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दक्षिण</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पूर्व</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पश्चिम</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सुबह 7 बजे सूर्य पूर्व में होता है, इसलिए छायाएँ पश्चिम की ओर पड़ती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अनिल की छाया उसकी दाईं ओर पड़ती है, इसलिए उसका दायाँ पक्ष पश्चिम है। इसका अर्थ है कि अनिल उत्तर दिशा की ओर मुँह करके खड़ा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सुनील अनिल के सामने है, इसलिए सुनील दक्षिण दिशा की ओर मुँह करके खड़ा है।</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">विद्यार्थियों की एक पंक्ति में रवि बाएँ छोर से 12वें स्थान पर और मोहन दाएँ छोर से 18वें स्थान पर है। जब वे अपने स्थान बदलते हैं, तो रवि बाएँ छोर से 22वें स्थान पर हो जाता है। पंक्ति में कुल कितने विद्यार्थी हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>38</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>39</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>41</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्थान बदलने के बाद, रवि मोहन के मूल स्थान पर आ जाता है। इसलिए, मोहन का मूल स्थान बाएँ छोर से 22वाँ है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>विद्यार्थियों की कुल संख्या = (बाएँ से स्थान) + (दाएँ से स्थान) − 1</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= 22 + 18 − 1 = 39</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः पंक्ति में 39 विद्यार्थी हैं।</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'DREAMING' शब्द में अक्षरों के ऐसे कितने जोड़े हैं, जिनके बीच शब्द में उतने ही अक्षर हैं जितने अंग्रेज़ी वर्णमाला क्रम में उनके बीच होते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चार</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-botto 23 + 3, इसलिए विषम दिन = 3।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शनिवार + 3 दिन = मंगलवार।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः 26 जनवरी 2027 को मंगलवार होगा।</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">8:20 बजे घड़ी की घंटे वाली और मिनट वाली सुई के बीच कितना कोण होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>130°</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>120°</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>125°</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>140°</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8:20 बजे 12 से घंटे वाली सुई का कोण = 8 × 30° + 20 × 0.5° = 240° + 10° = 250°</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20 मिनट पर 12 से मिनट वाली सुई का कोण = 20 × 6° = 120°</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोनों सुइयों के बीच का कोण = 250° − 120° = 130°</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः दोनों सुइयों के बीच का कोण 130° है।</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">60 लोगों के समूह में 35 लोगों को चाय, 28 लोगों को कॉफी पसंद है और 12 लोगों को न चाय पसंद है, न कॉफी। कितने लोगों को चाय और कॉफी दोनों पसंद हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>17</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>19</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कम-से-कम एक पेय पसंद करने वाले लोग = 60 − 12 = 48</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>n(T ∪ C) = n(T) + n(C) − n(T∩ C) का उपयोग करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>48 = 35 + 28 − n(T∩ C)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>n(T∩ C) = 63 − 48 = 15</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः 15 लोगों को चाय और कॉफी दोनों पसंद हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794469764935_image003.jpeg\" width=\"494\" height=\"186\" alt ></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित व्यवस्था में प्रश्नवाचक चिह्न (?) के स्थान पर आने वाली संख्या चुनें। सभी समूह एक ही तर्क से बनाए गए हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(3, 4, 25), (5, 12, 169), (8, 15, ?)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(ध्यान दें: संक्रियाएँ पूर्ण संख्याओं पर की जानी चाहिए, संख्याओं को उनके अंकों में विभाजित करके नहीं।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>279</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>259</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>299</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>289</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यहाँ अपनाया गया तर्क है: तीसरी संख्या = (पहली संख्या)² + (दूसरी संख्या)²</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3² + 4² = 9 + 16 = 25</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5² + 12² = 25 + 144 = 169</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इसी प्रकार, 8² + 15² = 64 + 225 = 289</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः लुप्त संख्या 289 है।</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">दी गई श्रृंखला में प्रश्नवाचक चिह्न (?) के स्थान पर क्या आना चाहिए?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>58</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>66</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>62</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>64</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13, 20, 34, ?, 118, 230</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>क्रमागत पदों के बीच अंतर 7, 14, 28, 56, 112 हैं, जिनमें प्रत्येक अंतर पिछले अंतर का दोगुना है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13 + 7 = 20</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20 + 14 = 34</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>34 + 28 = 62</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>62 + 56 = 118</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>118 + 112 = 230</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः लुप्त संख्या 62 है।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित शब्दों को सार्थक क्रम में व्यवस्थित करें और सही क्रम वाला विकल्प चुनें।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">1. कली</span><span style=\"font-weight:bold\">   </span><span style=\"font-weight:bold\">2. बीज</span><span style=\"font-weight:bold\">   </span><span style=\"font-weight:bold\">3. फूल</span><span style=\"font-weight:bold\">   </span><span style=\"font-weight:bold\">4. फल</span><span style=\"font-weight:bold\">   </span><span style=\"font-weight:bold\">5. अंकुरण</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2, 5, 1, 3, 4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2, 1, 5, 3, 4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5, 2, 1, 3, 4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2, 5, 3, 1, 4</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सार्थक क्रम एक पुष्पीय पौधे के जीवन चक्र का अनुसरण करता है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बीज → अंकुरण → कली → फूल → फल</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अर्थात्, 2, 5, 1, 3, 4।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">सात मित्र — A, B, C, D, E, F और G — उत्तर दिशा की ओर मुँह करके एक पंक्ति में बैठे हैं। D पंक्ति के बाएँ छोर से तीसरे स्थान पर बैठा है। D और B के बीच केवल दो व्यक्ति बैठे हैं। G, D के दाईं ओर दूसरे स्थान पर बैठा है। F, B के ठीक दाईं ओर बैठा है। C, D के ठीक बाईं ओर बैठा है। A पंक्ति के किसी भी छोर पर नहीं बैठा है। E और G के बीच कितने व्यक्ति बैठे हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चार</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मान लें कि पंक्ति में स्थानों को बाएँ से दाएँ 1 से 7 तक क्रमांकित किया गया है (उत्तर की ओर मुँह होने के कारण दाईं ओर का अर्थ बड़ी संख्या वाले स्थान हैं)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. D स्थान 3 पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. D और B के बीच केवल दो व्यक्ति बैठे हैं, इसलिए B स्थान 6 पर बैठा है (स्थान 0 मौजूद नहीं है)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. G, D के दाईं ओर दूसरे स्थान पर बैठा है, इसलिए G स्थान 5 पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. F, B के ठीक दाईं ओर बैठा है, इसलिए F स्थान 7 पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. C, D के ठीक बाईं ओर बैठा है, इसलिए C स्थान 2 पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. A और E के लिए शेष स्थान 1 और 4 हैं। A किसी छोर पर नहीं बैठता, इसलिए A स्थान 4 पर और E स्थान 1 पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंतिम व्यवस्था (बाएँ से दाएँ): E, C, D, A, G, B, F</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E और G के बीच C, D और A बैठे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः E और G के बीच तीन व्यक्ति बैठे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794469764935_image004.jpeg\" width=\"464\" height=\"165\" alt ></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">आठ व्यक्ति — A, B, C, D, P, Q, R और S — दो समानांतर पंक्तियों में बैठे हैं, जिनमें प्रत्येक पंक्ति में चार व्यक्ति हैं। पंक्ति 1 में A, B, C और D बैठे हैं और वे सभी दक्षिण की ओर मुँह करके बैठे हैं। पंक्ति 2 में P, Q, R और S बैठे हैं और वे सभी उत्तर की ओर मुँह करके बैठे हैं। पंक्ति 1 का प्रत्येक व्यक्ति पंक्ति 2 के ठीक एक व्यक्ति के सामने बैठा है। B पंक्ति के बिल्कुल बाएँ छोर पर बैठा है। A, B के दाईं ओर दूसरे स्थान पर बैठा है। D पंक्ति के किसी भी छोर पर नहीं बैठा है। P, D के सामने बैठा है। Q, P के ठीक बाईं ओर बैठा है। S, B के सामने बैठा है। A के सामने बैठे व्यक्ति के ठीक दाईं ओर कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्थानों को पश्चिम से पूर्व pan style=\"font-family:'Nirmala UI'\"><span><b>ऊपर    दिए गए कथनों में से कौन सा</b></span></span><b>/</b><span style=\"font-family:'Nirmala UI'\"><span><b>से    सही है</b></span></span><b>/</b><span style=\"font-family:'Nirmala UI'\"><span><b>हैं</b></span></span><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>केवल </span></span>1    <span style=\"font-family:'Nirmala UI'\"><span>और </span></span>2</p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>केवल </span></span>2    <span style=\"font-family:'Nirmala UI'\"><span>और </span></span>3</p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>केवल </span></span>1    <span style=\"font-family:'Nirmala UI'\"><span>और </span></span>3</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 <span style=\"font-family:'Nirmala UI'\"><span>और </span></span>3</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span>कथन </span></span>1    <span style=\"font-family:'Nirmala UI'\"><span>सही है</span></span>:    DRDO <span style=\"font-family:'Nirmala UI'\"><span>ने </span></span>27-28    <span style=\"font-family:'Nirmala UI'\"><span>फरवरी </span></span>2026    <span style=\"font-family:'Nirmala UI'\"><span>को </span></span>VSHORADS    <span style=\"font-family:'Nirmala UI'\"><span>के तीन लगातार    सफल उड़ान परीक्षण किए।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>कथन    </span></span>2 <span style=\"font-family:'Nirmala UI'\"><span>सही    है</span></span>: <span style=\"font-family:'Nirmala UI'\"><span>परीक्षण    एकीकृत परीक्षण रेंज </span></span>(ITR),    <span style=\"font-family:'Nirmala UI'\"><span>चांदीपुर</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>ओडिशा में    आयोजित किए गए थे।</span></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span>कथन    </span></span>3 <span style=\"font-family:'Nirmala UI'\"><span>सही    है</span></span>: VSHORADS <span style=\"font-family:'Nirmala UI'\"><span>एक    स्वदेशी बहुत कम दूरी की हवाई    रक्षा प्रणाली है जिसे विभिन्न    ऊंचाइयों और सीमाओं पर हवाई    खतरों को निष्क्रिय करने के    लिए विकसित किया गया है।</span></span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">दो रेलगाड़ियाँ विपरीत दिशाओं में 80 किमी/घंटा और 120 किमी/घंटा की चाल से चल रही हैं। एक रेलगाड़ी की लंबाई 300 मीटर है और वे एक-दूसरे को 12 सेकंड में पार करती हैं। दूसरी रेलगाड़ी की लंबाई (मीटर में, दशमलव के 2 स्थानों तक) क्या है? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>388.88</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>333.33</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>366.67</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>377.77</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>सापेक्ष चाल = 80 + 120 = 200 किमी/घंटा = 200 × 5/18 = 500/9 मी/से। 12 सेकंड में तय दूरी = (500/9) × 12 = 666.67 मीटर = दोनों रेलगाड़ियों की लंबाई का योग। दूसरी रेलगाड़ी = 666.67 − 300 = 366.67 मीटर।</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">किसी राशि पर 9% वार्षिक दर से 2 वर्ष के चक्रवृद्धि ब्याज (वार्षिक संयोजित) और साधारण ब्याज का अंतर ₹97.20 है। राशि ज्ञात कीजिए। </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹12,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹10,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹15,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹12,500</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>2 वर्ष के लिए, चक्रवृद्धि ब्याज − साधारण ब्याज = P × (R/100)²। अतः 97.20 = P × (9/100)² = P × 0.0081। P = 97.20 ÷ 0.0081 = ₹12,000।</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">वह सबसे बड़ी संख्या ज्ञात कीजिए जिससे 72 और 119 को भाग देने पर क्रमशः 3 और 4 शेष बचते हैं। </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>17</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>23</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>21</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>19</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>शेषफल घटाइए: 72 − 3 = 69 और 119 − 4 = 115। अभीष्ट संख्या = HCF(69, 115)। 69 = 3 × 23 और 115 = 5 × 23, अतः HCF = 23।</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक समकोण त्रिभुज का परिमाप 60 सेमी है और उसका कर्ण 26 सेमी है। त्रिभुज का क्षेत्रफल ज्ञात कीजिए। </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>240 सेमी²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>180 सेमी²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>160 सेमी²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>120 सेमी²</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>माना दोनों भुजाएँ a और b हैं। a + b = 60 − 26 = 34 तथा a² + b² = 26² = 676। (a + b)² = a² + b² + 2ab ⇒ 1156 = 676 + 2ab ⇒ ab = 240। क्षेत्रफल = ab/2 = 120 सेमी²।</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">30 किमी/घंटा की चाल से चलने पर विनोद अपने कार्यालय 5 मिनट देर से पहुँचता है। 40 किमी/घंटा की चाल से चलने पर वह 3 मिनट पहले पहुँच जाता है। उसके घर और कार्यालय के बीच की दूरी कितनी है? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>16 किमी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20 किमी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15 किमी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18 किमी</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>समय का अंतर = 5 + 3 = 8 मिनट = 2/15 घंटा। d/30 − d/40 = 2/15 ⇒ d(4 − 3)/120 = 2/15 ⇒ d = 240/15 = 16 किमी।</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">11.2 सेमी ऊँचाई और 2.8 सेमी आधार त्रिज्या वाले एक ठोस लम्ब वृत्तीय शंकु को पिघलाकर एक ठोस गोला बनाया जाता है। गोले का व्यास क्या है? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8.4 सेमी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4.2 सेमी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2.8 सेमी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5.6 सेमी</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>आयतन समान रहता है: (4/3)πR³ = (1/3)π(2.8)²(11.2)। अतः 4R³ = 2.8² × 11.2 = 2.8² × (4 × 2.8) ⇒ R³ = 2.8³ ⇒ R = 2.8 सेमी। व्यास = 5.6 सेमी।</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक समचतुर्भुज का एक विकर्ण दूसरे विकर्ण का 65% है। बड़े विकर्ण को भुजा मानकर एक वर्ग बनाया जाता है। समचतुर्भुज और वर्ग के क्षेत्रफलों का अनुपात क्या है? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18 : 15</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13 : 40</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15 : 18</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40 : 13</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>माना बड़ा विकर्ण = d, तो छोटा विकर्ण = 0.65d। समचतुर्भुज का क्षेत्रफल = ½ × d × 0.65d = 0.325d²। वर्ग का क्षेत्रफल = d²। अनुपात = 0.325 : 1 = 13 : 40।</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">किसी वस्तु को 8% लाभ पर बेचने और 13% हानि पर बेचने पर प्राप्त विक्रय मूल्यों का अंतर ₹115.50 है। वस्तु का क्रय मूल्य ज्ञात कीजिए। </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹550</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹540</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹560</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹580</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>8% लाभ पर विक्रय मूल्य = 1.08 CP तथा 13% हानि पर विक्रय मूल्य = 0.87 CP। अंतर = (1.08 − 0.87) CP = 0.21 CP = 115.50 ⇒ CP = 115.50 ÷ 0.21 = ₹550।</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">20 पुरुष और 15 लड़के किसी कार्य को 10 दिन में कर सकते हैं, जबकि 25 पुरुष और 10 लड़के उसे 9 दिन में कर सकते हैं। एक पुरुष और एक लड़के द्वारा एक दिन में किए गए कार्य का अनुपात ज्ञात कीजिए। </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14 : 5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 : 5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 : 12</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 : 14</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>कुल कार्य समान है: 10(20m + 15b) = 9(25m + 10b) ⇒ 200m + 150b = 225m + 90b ⇒ 60b = 25m ⇒ m : b = 60 : 25 = 12 : 5।</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">24 आम के पेड़, 56 सेब के पेड़ और 72 संतरे के पेड़ पंक्तियों में इस प्रकार लगाने हैं कि प्रत्येक पंक्ति में पेड़ों की संख्या समान हो और एक पंक्ति में केवल एक ही किस्म के पेड़ हों। आवश्यक पंक्तियों की न्यूनतम संख्या ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>17</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>19</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>प्रत्येक पंक्ति में पेड़ों की संख्या 24, 56 और 72 को विभाजित करनी चाहिए, और न्यूनतम पंक्तियों के लिए यह सबसे बड़ी होनी चाहिए: HCF(24, 56, 72) = 8। पंक्तियाँ = 24/8 + 56/8 + 72/8 = 3 + 7 + 9 = 19।</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">6 सेमी व्यास वाले सीसे के गोले, पानी से भरे 9 सेमी व्यास वाले एक बेलनाकार बीकर में डाले जाते हैं और सभी पूरी तरह डूब जाते हैं। यदि पानी का स्तर 32 सेमी बढ़ जाता है, तो कितने गोले डाले गए? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>16</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>बढ़े हुए पानी का आयतन = π(4.5)²(32) = 648π सेमी³। एक गोले का आयतन = (4/3)π(3)³ = 36π सेमी³। गोलों की संख्या = 648π ÷ 36π = 18।</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">यदि द्विघात समीकरण (2 − p)x² + 2px − (p + 1) = 0 के मूल बराबर हैं, तो p का मान है: </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>−2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>−1</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>बराबर मूलों के लिए, D = b² − 4ac = 0। (2p)² − 4(2 − p)(−(p + 1)) = 4p² + 4(2 − p)(p + 1) = 4p² + 4(p + 2 − p²) = 4p + 8 = 0 ⇒ p = −2।</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">यदि x⁴ + x⁻⁴ = 1154 है, तो x + x⁻¹ का मान है: (x &gt; 0) </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>x⁴ + x⁻⁴ = (x² + x⁻²)² − 2 ⇒ (x² + x⁻²)² = 1156 ⇒ x² + x⁻² = 34। फिर (x + x⁻¹)² = x² + x⁻² + 2 = 36 ⇒ x + x⁻¹ = 6।</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">tan 15° + cot 15° का मान ज्ञात कीजिए। </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>tan θ + cot θ = (sin²θ + cos²θ)/(sin θ cos θ) = 2/sin 2θ। θ = 15° के लिए: 2/sin 30° = 2/(1/2) = 4।</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">वह सबसे बड़ी संख्या जिससे 155, 260 और 315 को भाग देने पर क्रमशः 5, 10 और 15 शेष बचते हैं, है: </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>75</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>50</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>शेषफल घटाइए: 155 − 5 = 150, 260 − 10 = 250, 315 − 15 = 300। HCF(150, 250, 300) = 50। (जाँच: 50, सबसे बड़े शेषफल 15 से बड़ा है।)</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक गोले की त्रिज्या और एक शंकु के आधार की त्रिज्या दोनों 3√2 सेमी हैं। यदि गोले का पृष्ठीय क्षेत्रफल शंकु के कुल पृष्ठीय क्षेत्रफल के बराबर है, तो शंकु की ऊँचाई ज्ञात कीजिए। </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8 सेमी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9√2 सेमी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8√2 सेमी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 सेमी</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>4πr² = πr(r + l) ⇒ 4r = r + l ⇒ l = 3r = 9√2 सेमी। h² = l² − r² = 162 − 18 = 144 ⇒ h = 12 सेमी।</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक अर्धगोले पर एक लम्ब वृत्तीय शंकु रखा है और शंकु के आधार की त्रिज्या अर्धगोले की त्रिज्या के बराबर है। अर्धगोले का व्यास 12 सेमी तथा शंकु की ऊँचाई 8 सेमी है। ₹25 प्रति π सेमी² की दर से इस ठोस के बाहरी पृष्ठ को रंगने का खर्च ज्ञात कीजिए। </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹10,371</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹6,930</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹3,300</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹4,500</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>r = 6 सेमी, तिर्यक ऊँचाई l = √(6² + 8²) = 10 सेमी। बाहरी पृष्ठ = शंकु का वक्र पृष्ठ + अर्धगोले का वक्र पृष्ठ = πrl + 2πr² = 60π + 72π = 132π सेमी²। खर्च = 132 × 25 = ₹3,300।</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">यदि tan 15° = 2 − √3 है, तो tan 15° cot 75° + tan 75° cot 15° का मान क्या है? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>cot 75° = tan 15° तथा tan 75° = cot 15° = 1/(2 − √3) = 2 + √3। व्यंजक = tan²15° + cot²15° = (2 − √3)² + (2 + √3)² = (7 − 4√3) + (7 + 4√3) = 14।</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक वस्तु के अंकित मूल्य और क्रय मूल्य का अनुपात 5 : 3 है। 16% और 20% की दो क्रमागत छूटों के बाद वस्तु ₹3,024 में बेची जाती है। लाभ या हानि ज्ञात कीजिए। </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>हानि, ₹112</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>हानि, ₹216</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>लाभ, ₹324</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>लाभ, ₹225</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>विक्रय मूल्य = अंकित मूल्य × 0.84 × 0.80 = 0.672 × अंकित मूल्य = 3,024 ⇒ अंकित मूल्य = ₹4,500। क्रय मूल्य = (3/5) × 4,500 = ₹2,700। लाभ = 3,024 − 2,700 = ₹324।</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">चार वर्ष पहले माँ की आयु उसकी बेटी की आयु की 13 गुनी थी। अब से दो वर्ष बाद माँ की आयु बेटी की आयु की 4 गुनी होगी। अब से कितने वर्ष बाद माँ की आयु बेटी की आयु की 3 गुनी होगी? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>माना वर्तमान आयु M और D है। M − 4 = 13(D − 4) ⇒ M = 13D − 48। M + 2 = 4(D + 2) ⇒ 13D − 46 = 4D + 8 ⇒ D = 6, M = 30। 30 + t = 3(6 + t) ⇒ t = 6 वर्ष।</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">किसी राशि पर 20% वार्षिक दर से 3 वर्ष के चक्रवृद्धि ब्याज (वार्षिक संयोजित) और साधारण ब्याज का अंतर ₹448 है। निवेश की गई राशि ज्ञात कीजिए। </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹3,750</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹4,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹3,500</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹3,000</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>चक्रवृद्धि ब्याज = P[(1.2)³ − 1] = 0.728P तथा साधारण ब्याज = P × 0.20 × 3 = 0.6P। अंतर = 0.128P = 448 ⇒ P = 448 ÷ 0.128 = ₹3,500।</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक राशि 2 वर्ष के लिए 40% वार्षिक चक्रवृद्धि ब्याज (वार्षिक संयोजित) पर निवेश की गई। यदि ब्याज अर्धवार्षिक संयोजित होता, तो मिश्रधन ₹4,544 अधिक होता। निवेश की गई राशि ज्ञात कीजिए। </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹37,500</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹40,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹42,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹42,500</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>वार्षिक: मिश्रधन = P(1.4)² = 1.96P। अर्धवार्षिक: 20% दर, 4 अवधियाँ, मिश्रधन = P(1.2)⁴ = 2.0736P। अंतर = 0.1136P = 4,544 ⇒ P = ₹40,000।</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A किसी कार्य को अकेले 15 दिन में पूरा कर सकता है, और B उसी कार्य का एक-तिहाई भाग 10 दिन में पूरा कर सकता है। A और B 6 दिन साथ काम करते हैं, फिर A चला जाता है। B और C मिलकर शेष कार्य 8 दिन में पूरा करते हैं। A और C मिलकर पूरा कार्य कितने दिन में करेंगे? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 दिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12p
