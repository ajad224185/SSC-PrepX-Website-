_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">The ratio of each interior angle to each exterior angle of a regular polygon is 7 : 2. How many diagonals does the polygon have?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>27</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>20</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>35</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>44</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>Interior angle + exterior angle = 180°. Exterior angle = 2/9 × 180° = 40°. Number of sides n = 360°/40° = 9. Number of diagonals = n(n − 3)/2 = 9 × 6/2 = 27.</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">A sum of money is divided into two parts. The first part is lent at 8% per annum and the second part at 12% per annum, both at simple interest. The total interest after 4 years is ₹8,640. Had the rates of interest been interchanged, the total interest after 4 years would have been ₹480 more. Find the total sum.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹21,600</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹24,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹22,200</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹22,800</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>Let the parts be a (at 8%) and b (at 12%). 4(0.08a + 0.12b) = 8,640 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> 0.08a + 0.12b = 2,160. With the rates interchanged: 4(0.12a + 0.08b) = 9,120 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> 0.12a + 0.08b = 2,280. Adding: 0.20(a + b) = 4,440 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> a + b = ₹22,200. (Also a − b = 3,000, so a = ₹12,600 and b = ₹9,600.)</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">In an election between two candidates, 12% of the voters on the voter list did not cast their votes, and 4% of the votes cast were declared invalid. The winning candidate received 54% of the valid votes and won by a margin of 6,336 votes. Find the total number of voters on the voter list.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>90,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>96,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>88,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>93,750</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>Let the total number of voters = V. Votes cast = 0.88V; valid votes = 0.96 × 0.88V = 0.8448V. The winner got 54% and the loser 46% of the valid votes, so the margin = 8% of valid votes = 0.08 × 0.8448V = 0.067584V. 0.067584V = 6,336 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> V = 93,750.</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">If a + b + c = 15 and ab + bc + ca = 71, find the value of a³ + b³ + c³ − 3abc.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>150</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>210</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>165</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>180</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>a² + b² + c² = (a + b + c)² − 2(ab + bc + ca) = 225 − 142 = 83. a³ + b³ + c³ − 3abc = (a + b + c)(a² + b² + c² − ab − bc − ca) = 15 × (83 − 71) = 15 × 12 = 180.</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">A and B start running at the same time from the same point on a circular track of length 1.5 km, in opposite directions, at speeds of 15 km/h and 21 km/h respectively. After how many minutes will they meet again for the first time at the starting point?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>2.5 minutes</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>30 minutes</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>42 minutes</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>15 minutes</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>Time for one round: A = 1.5/15 h = 6 minutes; B = 1.5/21 h = 30/7 minutes. They are together at the starting point after LCM(6, 30/7) = LCM(6, 30)/HCF(1, 7) = 30 minutes. (Check: in 30 minutes A completes 5 rounds and B completes 7 rounds.)</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">A bucket is in the shape of a frustum of a cone. The radii of its two circular ends are 28 cm and 7 cm, and its height is 45 cm. What is the capacity of the bucket in litres? (Take </span><span style=\"font-family:Calibri;font-weight:bold\">π</span><span style=\"font-weight:bold\"> = 22/7)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>52.38 litres</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>45.36 litres</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>48.51 litres</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>50.82 litres</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>Volume of a frustum = (</span><span style=\"font-family:Calibri\">π</span><span>h/3)(R² + Rr + r²) = (22/7) × (45/3) × (28² + 28 × 7 + 7²) = (22/7) × 15 × (784 + 196 + 49) = (22/7) × 15 × 1,029 = 22 × 15 × 147 = 48,510 cm³ = 48.51 litres.</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">Find the value of sin² 5° + sin² 10° + sin² 15° + … + sin² 85° + sin² 90°.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>9.5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>9</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>10</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>8.5</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>The angles 5°, 10°, …, 90° give 18 terms. Pair sin²</span><span style=\"font-family:Calibri\">θ</span><span> with sin²(90° − </span><span style=\"font-family:Calibri\">θ</span><span>) = cos²</span><span style=\"font-family:Calibri\">θ</span><span>: (5°, 85°), (10°, 80°), …, (40°, 50°) give 8 pairs, each equal to 1. The remaining terms are sin² 45° = 1/2 and sin² 90° = 1. Total = 8 + 1/2 + 1 = 9.5.</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">A trader uses a faulty balance. While buying, he takes 10% more goods than the weight he pays for, and while selling, he gives only 900 g for every 1 kg. He also marks his goods 25% above the cost price and allows a discount of 10% on the marked price. What is his overall profit percentage?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>37.5%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>32.5%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>35%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>40%</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>Let the cost price of 1 kg be ₹100. While buying, he gets 1100 g for ₹100, so the true cost of 1 g = 100/1100 = ₹1/11. Selling price of '1 kg' = 100 × 1.25 × 0.90 = ₹112.50, but he actually gives only 900 g, whose true cost = 900/11 </span><span style=\"font-family:Arial\">≈</span><span> ₹81.82. Profit % = (112.50 ÷ (900/11) − 1) × 100 = (112.5 × 11/900 − 1) × 100 = (1.375 − 1) × 100 = 37.5%.</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">A, B and C can complete a work alone in 10, 15 and 30 days respectively. They start working together, but A leaves 2 days before the completion of the work and B leaves 3 days before the completion. They receive ₹6,000 in all for the work. If the payment is divided in proportion to the work done, what is C's share?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹1,600</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹1,400</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹2,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹1,200</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>Let the work be completed in T days. A works (T − 2) days, B works (T − 3) days and C works T days. (T − 2)/10 + (T − 3)/15 + T/30 = 1 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> 3(T − 2) + 2(T − 3) + T = 30 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> 6T − 12 = 30 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> T = 7. Work done: A = 5/10 = 15/30, B = 4/15 = 8/30, C = 7/30. C's share = 7/30 × 6,000 = ₹1,400.</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">A boat covers 36 km downstream and 24 km upstream in 7 hours. It also covers 54 km downstream and 18 km upstream in 7 hours 30 minutes. How much time will the boat take to go 63 km upstream and come back to the starting point?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>14 h 30 min</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>15 h 45 min</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>16 h 15 min</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>15 h</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>Let the downstream speed = d and the upstream speed = u. 36/d + 24/u = 7 and 54/d + 18/u = 7.5. Put 1/d = p and 1/u = q: 36p + 24q = 7 and 54p + 18q = 7.5. Multiply the first by 3 and the second by 4: 108p + 72q = 21 and 216p + 72q = 30 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> 108p = 9 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> p = 1/12, so d = 12 km/h. Then 24q = 7 − 3 = 4 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> q = 1/6, so u = 6 km/h. Time = 63/6 + 63/12 = 10.5 + 5.25 = 15.75 h = 15 h 45 min.</span></p>", "question_heading": ""}, {"sr_no": 60, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">If sec </span><span style=\"font-family:Calibri;font-weight:bold\">θ</span><span style=\"font-weight:bold\"> − tan </span><span style=\"font-family:Calibri;font-weight:bold\">θ</span><span style=\"font-weight:bold\"> = 1/7, where 0° &lt; </span><span style=\"font-family:Calibri;font-weight:bold\">θ</span><span style=\"font-weight:bold\"> &lt; 90°, find the value of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982179987_image003.png\" width=\"82\" height=\"30\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> .</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>9/16</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>4/3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>16/9</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>25/9</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>Since sec²</span><span style=\"font-family:Calibri\">θ</span><span> − tan²</span><span style=\"font-family:Calibri\">θ</span><span> = 1, sec </span><span style=\"font-family:Calibri\">θ</span><span> + tan </span><span style=\"font-family:Calibri\">θ</span><span> = 7. Adding the two equations: 2 sec </span><span style=\"font-family:Calibri\">θ</span><span> = 7 + 1/7 = 50/7 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> sec </span><span style=\"font-family:Calibri\">θ</span><span> = 25/7, so cos </span><span style=\"font-family:Calibri\">θ</span><span> = 7/25. Subtracting: 2 tan </span><span style=\"font-family:Calibri\">θ</span><span> = 48/7 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> tan </span><span style=\"font-family:Calibri\">θ</span><span> = 24/7, so sin </span><span style=\"font-family:Calibri\">θ</span><span> = 24/25. Then cosec </span><span style=\"font-family:Calibri\">θ</span><span> = 25/24 and cot </span><span style=\"font-family:Calibri\">θ</span><span> = 7/24. Required value = (32/24) ÷ (18/24) = 32/18 = 16/9.</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">A and B together can complete a piece of work in 24 days, B and C together in 30 days, and C and A together in 40 days. All three start the work together. After 10 days C leaves, and 4 days after that B also leaves. In how many days in all is the work completed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>30 days</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>34 days</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>32 days</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>36 days</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>(A + B) + (B + C) + (C + A) = 1/24 + 1/30 + 1/40 = (5 + 4 + 3)/120 = 1/10, so A + B + C do 1/20 of the work per day. A = 1/20 − 1/30 = 1/60 and B = 1/20 − 1/40 = 1/40 per day. Work in the first 10 days = 10/20 = 1/2. Next 4 days by A + B = 4/24 = 1/6. Remaining work = 1 − 1/2 − 1/6 = 1/3, done by A alone in (1/3) ÷ (1/60) = 20 days. Total time = 10 + 4 + 20 = 34 days.</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">A sum of money is borrowed at 10% per annum compound interest (compounded annually) and is repaid in three equal annual instalments of ₹13,310 each, the first instalment being paid at the end of the first year. Find the sum borrowed.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹36,410</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹30,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹34,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹33,100</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>The sum borrowed equals the present value of the three instalments: 13,310/1.1 = 12,100; 13,310/(1.1)² = 11,000; 13,310/(1.1)³ = 10,000. Sum borrowed = 12,100 + 11,000 + 10,000 = ₹33,100.</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">How many five-digit numbers are there which, when divided by 15, 20, 36 and 48, leave remainders 9, 14, 30 and 42 respectively?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>124</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>125</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>126</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>138</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>In each case (divisor − remainder) = 15 − 9 = 20 − 14 = 36 − 30 = 48 − 42 = 6. So the number N = k × LCM(15, 20, 36, 48) − 6. LCM = 2</span><span style=\"font-family:Arial\">⁴</span><span> × 3² × 5 = 720, so N = 720k − 6. For a five-digit number: 10000 </span><span style=\"font-family:Arial\">≤</span><span> 720k − 6 </span><span style=\"font-family:Arial\">≤</span><span> 99999 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> 13.9 </span><span style=\"font-family:Arial\">≤</span><span> k </span><span style=\"font-family:Arial\">≤</span><span> 138.9 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> k = 14, 15, …, 138. Number of such numbers = 138 − 14 + 1 = 125.</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">The seven-digit number 74x52y6 is divisible by 72, where x and y are single digits. What is the maximum possible value of (x × y)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>27</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>45</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>32</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>35</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>72 = 8 × 9. Divisibility by 8: the number formed by the last three digits, 2y6, must be divisible by 8 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> 216, 256 and 296 work, so y = 1, 5 or 9. Divisibility by 9: digit sum = 7 + 4 + x + 5 + 2 + y + 6 = 24 + x + y must be a multiple of 9 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> x + y = 3 or 12. Possible pairs: y = 1 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> x = 2; y = 5 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> x = 7; y = 9 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> x = 3. Products x × y = 2, 35 and 27. Maximum = 35.</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">Find the value of </span><span style=\"font-family:Arial;font-weight:bold\">√</span><span style=\"font-weight:bold\">(10 + </span><span style=\"font-family:Arial;font-weight:bold\">√</span><span style=\"font-weight:bold\">(25 + </span><span style=\"font-family:Arial;font-weight:bold\">√</span><span style=\"font-weight:bold\">(108 + </span><span style=\"font-family:Arial;font-weight:bold\">√</span><span style=\"font-weight:bold\">(154 + </span><span style=\"font-family:Arial;font-weight:bold\">√</span><span style=\"font-weight:bold\">225)))).</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>6</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>3.5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>4</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>Start from the innermost root: </span><span style=\"font-family:Arial\">√</span><span>225 = 15; </span><span style=\"font-family:Arial\">√</span><span>(154 + 15) = </span><span style=\"font-family:Arial\">√</span><span>169 = 13; </span><span style=\"font-family:Arial\">√</span><span>(108 + 13) = </span><span style=\"font-family:Arial\">√</span><span>121 = 11; </span><span style=\"font-family:Arial\">√</span><span>(25 + 11) = </span><span style=\"font-family:Arial\">√</span><span>36 = 6; </span><span style=\"font-family:Arial\">√</span><span>(10 + 6) = </span><span style=\"font-family:Arial\">√</span><span>16 = 4.</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">A, B and C start a business with investments in the ratio 3 : 4 : 5. After 4 months, A doubles his investment. After 6 months, B withdraws half of his investment, and after 8 months, C withdraws one-fifth of his investment. If the total profit at the end of the year is ₹1,14,000, what is B's share?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹30,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹36,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹24,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹27,000</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>Take the investments as 3, 4 and 5 units. A: 3 × 4 + 6 × 8 = 60. B: 4 × 6 + 2 × 6 = 36. C: 5 × 8 + 4 × 4 = 56. Profit ratio = 60 : 36 : 56 = 15 : 9 : 14. B's share = 9/38 × 1,14,000 = ₹27,000.</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">Rohit sold two mobile phones for ₹15,840 each. On one he gained 10% and on the other he lost 12%. What is his overall gain or loss percentage?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>Gain of 1%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>Loss of 1%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>Loss of 2.22%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>Gain of 2.22%</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>CP of the first phone = 15,840 ÷ 1.10 = ₹14,400. CP of the second phone = 15,840 ÷ 0.88 = ₹18,000. Total CP = ₹32,400; total SP = 2 × 15,840 = ₹31,680. Loss = ₹720. Loss % = 720/32,400 × 100 = 2.22% (exactly 2 2/9 %).</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">From the top of a 75 m high tower, the angles of depression of two cars on opposite sides of the tower, in a straight line with its base, are 30° and 60°. What is the distance between the two cars?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>150 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>75</span><span style=\"font-family:Arial\">√</span><span>3 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>100</span><span style=\"font-family:Arial\">√</span><span>3 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>50</span><span style=\"font-family:Arial\">√</span><span>3 m</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>Car at an angle of depression of 30°: distance from the base = 75/tan 30° = 75</span><span style=\"font-family:Arial\">√</span><span>3 m. Car at an angle of depression of 60°: distance = 75/tan 60° = 75/</span><span style=\"font-family:Arial\">√</span><span>3 = 25</span><span style=\"font-family:Arial\">√</span><span>3 m. As the cars are on opposite sides, the distance between them = 75</span><span style=\"font-family:Arial\">√</span><span>3 + 25</span><span style=\"font-family:Arial\">√</span><span>3 = 100</span><span style=\"font-family:Arial\">√</span><span>3 m (</span><span style=\"font-family:Arial\">≈</span><span> 173.2 m).</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">The parallel sides of a trapezium are 25 cm and 11 cm, and its non-parallel sides are 15 cm and 13 cm. Find the area of the trapezium.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>216 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>196 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>252 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>234 cm²</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>Through one end of the shorter parallel side, draw a line parallel to a non-parallel side. This forms a triangle with sides 15 cm, 13 cm and 25 − 11 = 14 cm. By Heron's formula, s = (15 + 13 + 14)/2 = 21 and its area = </span><span style=\"font-family:Arial\">√</span><span>(21 × 6 × 8 × 7) = </span><span style=\"font-family:Arial\">√</span><span>7056 = 84 cm². The height of the trapezium = height of this triangle on base 14 = 2 × 84/14 = 12 cm. Area of the trapezium = ½ × (25 + 11) × 12 = 216 cm².</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">The marks obtained by 30 students in a test are as follows: 4 students scored 10, 7 students scored 20, 11 students scored 30, 6 students scored 40 and 2 students scored 50. Find the value of (mean + median + mode) of the marks.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>265/3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>87</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>260/3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>90</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>Mean = (10 × 4 + 20 × 7 + 30 × 11 + 40 × 6 + 50 × 2)/30 = (40 + 140 + 330 + 240 + 100)/30 = 850/30 = 85/3. Median: n = 30, so the median is the average of the 15th and 16th values. The cumulative frequencies are 4, 11, 22, 28, 30, so both the 15th and 16th values are 30 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> median = 30. Mode = 30 (highest frequency, 11). Mean + median + mode = 85/3 + 30 + 30 = 265/3 (</span><span style=\"font-family:Arial\">≈</span><span> 88.33).</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Three of the following four letter-clusters are alike in a certain way based on the English alphabetical order and thus form a group. Which is the one that does not belong to that group?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(Note: The odd letter-cluster is not based on the number of vowels/consonants or their positions.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BDGL</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>JLOT</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MORX</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PRUZ</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The positional difference between consecutive letters in each cluster is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BDGL: B </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image001.png\" width=\"29\" height=\"25\" alt ><span> D </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image002.png\" width=\"29\" height=\"25\" alt ><span> G </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image003.png\" width=\"29\" height=\"25\" alt ><span> L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>JLOT: J </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image001.png\" width=\"29\" height=\"25\" alt ><span> L </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image002.png\" width=\"29\" height=\"25\" alt ><span> O </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image003.png\" width=\"29\" height=\"25\" alt ><span> T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PRUZ: P </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image001.png\" width=\"29\" height=\"25\" alt ><span> R </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image002.png\" width=\"29\" height=\"25\" alt ><span> U </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image003.png\" width=\"29\" height=\"25\" alt ><span> Z</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MORX: M </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image001.png\" width=\"29\" height=\"25\" alt ><span> O </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image002.png\" width=\"29\" height=\"25\" alt ><span> R </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image004.png\" width=\"29\" height=\"25\" alt ><span> X</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In all letter-clusters except MORX, the pattern of addition is (+2, +3, +5), whereas in MORX it is (+2, +3, +6). Therefore, MORX is the odd one out.</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which letter cluster will replace the question mark (?) in the following series?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">BEG, EIL, HMQ, KQV, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NUA</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NVA</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NTA</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>OUB</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the series is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First letters: B (+3) → E (+3) → H (+3) → K (+3) → </span><span style=\"font-weight:bold\">N</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second letters: E (+4) → I (+4) → M (+4) → Q (+4) → </span><span style=\"font-weight:bold\">U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Third letters: G (+5) → L (+5) → Q (+5) → V (+5) → </span><span style=\"font-weight:bold\">A</span><span> (22 + 5 = 27 → 27 - 26 = 1, which corresponds to A)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the missing cluster is </span><span style=\"font-weight:bold\">NUA</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a certain code language, ‘CROW’ is coded as ‘2853’, ‘WORK’ is coded as ‘3628’, and ‘COAL’ is coded as ‘5173’. What is the code for ‘O’ in the given code language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing ‘CROW’ (2853) and ‘WORK’ (3628):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The common letters are C, R, O, W ∩ W, O, R, K = {R, O, W}.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The common digits between 2853 and 3628 are {2, 3, 8}.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the letter ‘C’ in ‘CROW’ corresponds to the remaining digit 5 (i.e., C = 5).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Now, comparing ‘CROW’ (2853) and ‘COAL’ (5173):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The common letters are {C, O}.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The common digits between 2853 and 5173 are {3, 5}.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since C = 5, the code for ‘O’ must be 3.</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If ‘M’ stands for ‘×’, ‘N’ stands for ‘÷’, ‘O’ stands for ‘+’ and ‘P’ stands for ‘−’, then what will come in place of the question mark (?) in the following .png\" width=\"147\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the BODMAS rule:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 1 (Division): </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image010.png\" width=\"110\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 2 (Multiplication): </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image011.png\" width=\"92\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 3 (Addition): </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image012.png\" width=\"64\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 4 (Subtraction): </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image013.png\" width=\"18\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, the correct answer is 90.</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Five boxes P, Q, R, S, and T are kept one above the other. Box P is kept at the topmost position. Only two boxes are kept between Box P and Box S. Box R is kept immediately below Box S. Box Q is kept above Box T. How many boxes are kept between Box Q and Box R?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>None</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given information, we can determine the order of the boxes from top to bottom (positions 5 to 1):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Box P is at the topmost position (Position 5).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Exactly two boxes are between P and S, so Box S is at Position 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Box R is immediately below Box S, so Box R is at Position 1 (bottom-most).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Box Q is above Box T, which means Box Q is at Position 4 and Box T is at Position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The complete arrangement from top to bottom is: 5P, 4Q, 3T, 2S, 1R.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, there are </span><span style=\"font-weight:bold\">two</span><span> boxes (T and S) kept between Box Q and Box R.</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a certain code language,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A + B means ‘A is the father of B’,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A - B means ‘A is the sister of B’,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A × B means ‘A is the brother of B’ and</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A ÷ B means ‘A is the wife of B’.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">How is M related to P if ‘M × N ÷ O + P - Q’?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Brother</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Father's brother</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mother's brother</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Father</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given expression: M × N ÷ O + P - Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. M × N → M is the brother of N.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. N ÷ O → N is the wife of O.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. O + P → O is the father of P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. P - Q → P is the sister of Q.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From (2) and (3), since O is the father of P and N is the wife of O, N is the mother of P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From (1), M is the brother of N (P's mother).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, M is the mother's brother of P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image014.jpeg\" width=\"490\" height=\"247\" alt ></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Seven people, P, Q, R, S, T, U, and V, are sitting in a straight row facing north. Only two people sit to the left of T. Only two people sit between T and Q. U sits to the immediate right of Q. R sits second to the left of P. S sits to the immediate left of R. Who sits at the third position from the right end of the row?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the seven positions in the row from left to right be 1, 2, 3, 4, 5, 6, and 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Only two people sit to the left of T, which means T sits at position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Only two people sit between T and Q, so Q must be at position 6 (as position 0 is not possible).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. U sits to the immediate right of Q, so U is at position 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. R sits second to the left of P. The only available spots for R and P such that R is second to the left of P are position 2 for R and position 4 for P (since position 3 is occupied by T).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. S sits to the immediate left of R, so S sits at position 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. The only remaining person, V, sits at position 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the arrangement from left to right is: S, R, T, P, V, Q, U.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The third person from the right end is V (at position 5).</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Based on the English alphabetical order, three of the following four letter-clusters are alike in a certain way and thus form a group. Which is the one that does not belong to that group?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PRT</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KMO</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FHK</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CEG</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed by the letter-clusters is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PRT: P </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image015.png\" width=\"42\" height=\"21\" alt style=\"vertical-align:middle\" ><span> → R </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image015.png\" width=\"42\" height=\"21\" alt style=\"vertical-align:middle\" ><span> → T</span></p><p style=\"margin-top:0pt;margin-botto e:12pt\"><span>Therefore, the correct number to replace the question mark is 243.</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The position(s) of how many letters will remain unchanged if each letter in the word PENCILS is arranged in English alphabetical order?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>None</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Original word: P E N C I L S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Arranging the letters in alphabetical order from left to right:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C E I L N P S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing the positions of each letter:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1st: P → C (changed)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2nd: </span><span style=\"font-weight:bold\">E → E</span><span> (unchanged)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3rd: N → I (changed)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4th: C → L (changed)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5th: I → N (changed)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6th: L → P (changed)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7th: </span><span style=\"font-weight:bold\">S → S</span><span> (unchanged)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the positions of exactly </span><span style=\"font-weight:bold\">two</span><span> letters (E and S) remain unchanged.</span></p>", "question_heading": ""}, {"sr_no": 81, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If ‘+’ means ‘÷’, ‘−’ means ‘+’, ‘×’ means ‘−’, and ‘÷’ means ‘×’, then what will come in place of the question mark (?) in the following equation?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image022.png\" width=\"180\" height=\"21\" alt style=\"vertical-align:middle\" ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>124</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>119</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>115</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>129</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given equation: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image023.png\" width=\"175\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>According to the given conditions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘+’ denotes ‘÷’</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘−’ denotes ‘+’</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘×’ denotes ‘−’</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘÷’ denotes ‘×’</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Substituting the operational signs in the given equation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image024.png\" width=\"168\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the BODMAS rule:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image025.png\" width=\"131\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image026.png\" width=\"113\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image027.png\" width=\"132\" height=\"21\" alt style=\"vertical-align:middle\" ></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A is the sister of B. B is the brother of C. D is the mother of E. E is the daughter of C. How is E related to A?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sister's daughter</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Brother's daughter</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Daughter</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sister</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. A is the sister of B and B is the brother of C, which means A, B, and C are siblings.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. D is the mother of E and E is the daughter of C. Since D is the mother, C must be the father of E (C is male).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Since C is the brother of A, E is the daughter of A's brother.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, E is A's </span><span style=\"font-weight:bold\">Brother's daughter</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982562159_image028.jpeg\" width=\"530\" height=\"200\" alt ></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Five boxes P, Q, R, S, and T are kept one above the other, but not necessarily in the same order. Box P is kept at the topmost position. Exactly two boxes are kept between Box P and Box S. Box T is kept immediately below Box S. Box Q is kept immediately above Box R. How many boxes are kept between Box Q and Box T?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>None</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the positions of the boxes from top to bottom be numbered 5 to 1:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Box P is at the topmost position, so P is at position 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Exactly two boxes are kept between P and S, which means Box S is at position 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Box T is kept immediately below S, so Box T is at position 1 (bottommost).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Box Q is kept immediately above Box R, so Box Q is at position 4 and Box R is at position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The arrangement from top to bottom is: P (5), Q (4), R (3), S (2), T (1).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The boxes kept between Box Q and Box T are R and S, which is exactly two boxes.</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the set in which the numbers are related in the same way as are the numbers of the following sets.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into their constituent digits. E.g. 13 – Operations on 13 such as adding/subtracting/multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span sty
