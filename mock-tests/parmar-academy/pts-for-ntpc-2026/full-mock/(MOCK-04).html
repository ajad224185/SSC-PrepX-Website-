<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>7.) MOCK-04 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

<script>
// JSON INJECTION HAPPENS HERE
const questions = [{"sr_no": 1, "question": " <p style=\"orphans:0;widows:0\">    <b>The Supreme Court of India acts as the guardian and final    interpreter of the Constitution. Under Article 145(3) of the    Constitution of India, what is the minimum number of judges    required to sit on a bench to decide any case involving a    substantial question of law as to the interpretation of the    Constitution?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Three</p>", "option2": " <p style=\"orphans:0;widows:0\">    Five</p>", "option3": " <p style=\"orphans:0;widows:0\">    Seven</p>", "option4": " <p style=\"orphans:0;widows:0\">    Nine</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Article 145(3) of the Constitution of India mandates that the    minimum number of Judges who are to sit for the purpose of    deciding any case involving a substantial question of law as to    the interpretation of the Constitution, or for hearing any    reference made by the President under Article 143, shall be five.    Such a bench of at least five judges is known as a 'Constitution    Bench'.</p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0\">    <b>The famous 'Prayag Prashasti' (Allahabad Pillar Inscription),    which chronicles the conquests and military achievements of    Samudragupta, was composed by which of his court poets?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Kalidasa</p>", "option2": " <p style=\"orphans:0;widows:0\">    Harishena</p>", "option3": " <p style=\"orphans:0;widows:0\">    Banabhatta</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ravikirti</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The 'Prayag Prashasti' (also known as the Allahabad Pillar    Inscription) was composed in classical Sanskrit by Harishena, who    was the court poet and high-ranking official (sandhivigrahika) of    the Gupta emperor Samudragupta. It provides a detailed account of    Samudragupta's reign and his extensive military campaigns across    the Indian subcontinent.</p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0\">    <b>According to the 2011 Census, which of the following Indian    states has the highest percentage of urban population?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Tamil Nadu</p>", "option2": " <p style=\"orphans:0;widows:0\">    Maharashtra</p>", "option3": " <p style=\"orphans:0;widows:0\">    Goa</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mizoram</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    According to the 2011 Census, Goa is the most urbanised state in    India, with 62.17% of its total population living in urban areas.    Mizoram ranks second among states with 52.11% urban population,    while among Union Territories, Delhi has the highest proportion of    urban population (97.5%).</p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0\">    <b>In which year was Hindustan Aeronautics Limited (HAL) formed in    its present form by merging Hindustan Aircraft Limited with    Aeronautics India Limited?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1964</p>", "option2": " <p style=\"orphans:0;widows:0\">    1958</p>", "option3": " <p style=\"orphans:0;widows:0\">    1969</p>", "option4": " <p style=\"orphans:0;widows:0\">    1972</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Hindustan Aeronautics Limited (HAL) was formed on 1 October 1964    through the amalgamation of Hindustan Aircraft Limited and    Aeronautics India Limited. It operates under the administrative    control of the Ministry of Defence, Government of India, and is    headquartered in Bengaluru, Karnataka.</p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following pressure belts is popularly known as the    'Doldrums' due to its extremely calm and light winds?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Sub-tropical high pressure belt</p>", "option2": " <p style=\"orphans:0;widows:0\">    Equatorial low pressure belt</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sub-polar low pressure belt</p>", "option4": " <p style=\"orphans:0;widows:0\">    Polar high pressure belt</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    The Equatorial Low Pressure Belt, located between     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981590527_html_eaaa0169b2b95ee9.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981590527_html_83d2faa2133feb18.gif\" >     latitudes, is known as the 'Doldrums'. In this zone, intense solar    heating causes air to rise vertically, resulting in a region of    low atmospheric pressure with virtually no horizontal surface    winds, creating calm conditions.</p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    <b>Under the Ayushman Bharat - Pradhan Mantri Jan Arogya Yojana    (PM-JAY), a health cover of up to ₹______ lakh per family per    year is provided for secondary and tertiary care hospitalization.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    2</p>", "option2": " <p style=\"orphans:0;widows:0\">    3</p>", "option3": " <p style=\"orphans:0;widows:0\">    5</p>", "option4": " <p style=\"orphans:0;widows:0\">    10</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Under the Ayushman Bharat - Pradhan Mantri Jan Arogya Yojana    (PM-JAY), eligible families are provided a health cover of up to    ₹5 lakh per family per year for secondary and tertiary care    hospitalization across public and empanelled private hospitals in    India.</p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0\">    <b>Kolar Gold Fields (KGF), famous for gold mining, is located in    which of the following states of India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Karnataka</p>", "option2": " <p style=\"orphans:0;widows:0\">    Andhra Pradesh</p>", "option3": " <p style=\"orphans:0;widows:0\">    Odisha</p>", "option4": " <p style=\"orphans:0;widows:0\">    Rajasthan</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Kolar Gold Fields (KGF) is a famous gold mining region located in    the Kolar district of Karnataka. It was one of the deepest and    oldest gold mines in India.</p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0\">    <b>By which of the following names is the harvest festival of    Makar Sankranti primarily celebrated in Tamil Nadu?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Pongal</p>", "option2": " <p style=\"orphans:0;widows:0\">    Onam</p>", "option3": " <p style=\"orphans:0;widows:0\">    Bihu</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ugadi</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In Tamil Nadu, the harvest festival of Makar Sankranti is    celebrated as <b>Pongal</b>. It is a multi-day festival dedicated    to the Sun God (Surya) to thank nature for a bountiful harvest.    Among other options, Onam is celebrated in Kerala, Bihu in Assam,    and Ugadi in Karnataka, Andhra Pradesh, and Telangana.</p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    <b>In which year was the 92-year-old practice of presenting a    separate Railway Budget discontinued and merged with the Union    Budget in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    2015</p>", "option2": " <p style=\"orphans:0;widows:0\">    2016</p>", "option3": " <p style=\"orphans:0;widows:0\">    2017</p>", "option4": " <p style=\"orphans:0;widows:0\">    2018</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The practice of presenting a separate Railway Budget was started    in 1924 on the recommendations of the Acworth Committee. In    September 2016, based on the recommendations of a committee headed    by Bibek Debroy, the Government of India decided to merge the    Railway Budget with the Union Budget. On 1 February 2017, Finance    Minister Arun Jaitley presented the first integrated Union Budget    of independent India for the financial year 2017–18.</p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Constitutional Amendment Act limited the size of the    Union Council of Ministers, including the Prime Minister, to a    maximum of 15% of the total strength of the Lok Sabha?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    86th Amendment Act, 2002</p>", "option2": " <p style=\"orphans:0;widows:0\">    91st Amendment Act, 2003</p>", "option3": " <p style=\"orphans:0;widows:0\">    89th Amendment Act, 2003</p>", "option4": " <p style=\"orphans:0;widows:0\">    92nd Amendment Act, 2003</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The 91st Constitutional Amendment Act, 2003 added Article 75(1A)    to the Constitution of India, which restricts the total number of    ministers, including the Prime Minister, in the Council of    Ministers to not more than 15% of the total strength of the Lok    Sabha.</p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following traditional musical instruments,    typically made from a buffalo horn, is prominently played to    accompany the Bihu dance of Assam?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Pepa</p>", "option2": " <p style=\"orphans:0;widows:0\">    Shehnai</p>", "option3": " <p style=\"orphans:0;widows:0\">    Nadaswaram</p>", "option4": " <p style=\"orphans:0;widows:0\">    Pungi</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The <b>Pepa</b> is a traditional hornpipe/wind instrument of    Assam, primarily crafted from the horn of a domestic buffalo with    a small bamboo reed. It is an essential and characteristic    accompaniment to the Bihu dance performed during the Rongali Bihu    festival.</p>", "question_heading": ""}, {"sr_no": 12, "question": "Wुicु यी पुध ीियियथing Vधकोौ iौ कiॅiकधक inपय पथय ंोुयन नधcधnौiयnौ ाnयथn ोौ ैKनiौुnोै (Bिोcा) ोnक ैSुहािोै (Wुiपध), ोnक ूनiंोनiिद कधोिस थiपु ौोcनiीiciोि नiपधौ ोnक नiपहोिस?", "option1": "<p style=\"orphans:0;widows:0\">    Rigveda</p>", "option2": " <p style=\"orphans:0;widows:0\">    Yajurveda</p>", "option3": " <p style=\"orphans:0;widows:0\">    Samaveda</p>", "option4": " <p style=\"orphans:0;widows:0\">    Atharvaveda</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Yajurveda is the Veda of prose mantras and sacrificial    formulas, recited by the 'Adhvaryu' priest during Vedic rituals.    It is divided into two primary traditions: <b>Krishna (Black)    Yajurveda</b>, which has un-arranged and mixed verses and    commentary, and <b>Shukla (White) Yajurveda</b>, which contains    clear, well-arranged mantras distinct from its commentary (the    Shatapatha Brahmana).</p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    <b>What happens to the weight of an object when it is taken from    the Earth's equator to the North Pole?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    It decreases</p>", "option2": " <p style=\"orphans:0;widows:0\">    It increases</p>", "option3": " <p style=\"orphans:0;widows:0\">    It remains constant</p>", "option4": " <p style=\"orphans:0;widows:0\">    It becomes zero</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    The weight of an object is defined as     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981590527_html_3a0ba5a91612cd28.gif\" > ,    where     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981590527_html_4d187224ad27976d.gif\" >     is mass and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981590527_html_1a7fe57513bafe99.gif\" >     is the acceleration due to gravity. The value of     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981590527_html_1a7fe57513bafe99.gif\" >     depends on the planet's radius (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981590527_html_d4bee28b5161b488.gif\" > ).    Because Earth is an oblate spheroid, its polar radius is shorter    than its equatorial radius (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981590527_html_cd23722642942698.gif\" > ).    Additionally, the effect of Earth's rotational centrifugal force    is zero at the poles and maximum at the equator. Consequently,     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981590527_html_1a7fe57513bafe99.gif\" >     is maximum at the poles and minimum at the equator, so an object's    weight increases when moved from the equator to the poles.</p>", "question_heading": ""}, {"sr_no": 14, "question": "Wुicु यी पुध ीियियथing ुयनंयnधौ iौ ौधcनधपधक ृद पुध ोिूुो cिधिस यी पुध Iौिधपौ यी Lोngधनुोnौ in पुध ूोncनधोौ पय incनधोौध ृिययक gिहcयौध िधॅिधस?", "option1": "<p style=\"orphans:0;widows:0\">    Insulin</p>", "option2": " <p style=\"orphans:0;widows:0\">    Glucagon</p>", "option3": " <p style=\"orphans:0;widows:0\">    Somatostatin</p>", "option4": " <p style=\"orphans:0;widows:0\">    Cortisol</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    Glucagon is a peptide hormone secreted by the alpha (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981590527_html_538345c69bd85bc8.gif\" > )    cells of the Islets of Langerhans in the pancreas. Its primary    role is to raise glucose levels in the bloodstream by stimulating    glycogenolysis (breakdown of glycogen to glucose) and    gluconeogenesis in the liver. In contrast, insulin is secreted by    beta (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981590527_html_bac29e8aa916a124.gif\" > )    cells to lower blood glucose levels, and somatostatin is secreted    by delta (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981590527_html_ef1e439c7ba018c9.gif\" > )    cells.</p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following Indian states does NOT share an    international border with Myanmar?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Nagaland</p>", "option2": " <p style=\"orphans:0;widows:0\">    Manipur</p>", "option3": " <p style=\"orphans:0;widows:0\">    Tripura</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mizoram</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Tripura does not share an international border with Myanmar. India    shares a 1,643 km border with Myanmar, which touches four    northeast Indian states: Arunachal Pradesh, Nagaland, Manipur, and    Mizoram. Tripura is bounded by Bangladesh on the north, south, and    west, and shares domestic boundaries only with Assam and Mizoram.</p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    <b>Which ruler of the Haryanka dynasty shifted the capital of the    Magadha kingdom from Rajagriha to Pataliputra?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Bimbisara</p>", "option2": " <p style=\"orphans:0;widows:0\">    Udayin</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kalashoka</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mahapadma Nanda</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Udayin (also known as Udayabhadra), the son and successor of    Ajatashatru, laid the foundation of the city of Pataliputra at the    confluence of the rivers Ganga and Son, and shifted the capital of    Magadha from Rajagriha to Pataliputra.</p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <b>Who was appointed as the Chairman of the first Disinvestment    Commission set up by the Government of India in August 1996?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    C. Rangarajan</p>", "option2": " <p style=\"orphans:0;widows:0\">    G. V. Ramakrishna</p>", "option3": " <p style=\"orphans:0;widows:0\">    Raja Chelliah</p>", "option4": " <p style=\"orphans:0;widows:0\">    Vijay Kelkar</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In August 1996, the Government of India constituted the first    Disinvestment Commission as an advisory body to draw up a    comprehensive long-term disinvestment programme for Public Sector    Undertakings (PSUs). G. V. Ramakrishna, a former SEBI Chairman,    was appointed as its first Chairman.</p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    <b>Through which of the following Constitutional Amendment Acts    was the eleventh Fundamental Duty added to Part IVA of the    Constitution of India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    86th Amendment Act, 2002</p>", "option2": " <p style=\"orphans:0;widows:0\">    44th Amendment Act, 1978</p>", "option3": " <p style=\"orphans:0;widows:0\">    91st Amendment Act, 2003</p>", "option4": " <p style=\"orphans:0;widows:0\">    89th Amendment Act, 2003</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Fundamental Duties were incorporated into Part IVA (Article    51A) of the Constitution by the 42nd Constitutional Amendment Act,    1976, on the recommendations of the Swaran Singh Committee.    Originally, there were 10 Fundamental Duties. The 11th Fundamental    Duty (Article 51A(k)), which makes it the duty of a parent or    guardian to provide opportunities for education to their child    between the age of six and fourteen years, was added by the 86th    Constitutional Amendment Act, 2002.</p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <b>A long-term development plan formulated for a period of 15 to    20 years to outline broad socio-economic goals and vision for the    economy is termed as a/an:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Rolling Plan</p>", "option2": " <p style=\"orphans:0;widows:0\">    Perspective Plan</p>", "option3": " <p style=\"orphans:0;widows:0\">    Imperative Plan</p>", "option4": " <p style=\"orphans:0;widows:0\">    Indicative Plan</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    A <b>Perspective Plan</b> is a long-term plan formulated generally    for a period of 15 to 20 years. It defines the broader    socio-economic goals, future priorities, and structural changes    envisioned for the economy, within which medium-term Five-Year    Plans and Annual Plans are framed.</p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <b>Which ancient Indian university, located in modern-day Gujarat,    was especially renowned as a major center for the study of    Hinayana Buddhism?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Vikramashila</p>", "option2": " <p style=\"orphans:0;widows:0\">    Vallabhi</p>", "option3": " <p style=\"orphans:0;widows:0\">    Odantapuri</p>", "option4": " <p style=\"orphans:0;widows:0\">    Pushpagiri</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Vallabhi University, located in Saurashtra (modern Gujarat), was a    prominent center of Buddhist learning, particularly known for the    study of Hinayana Buddhism. It was patronized by the Maitraka    rulers from roughly 600 CE to 1200 CE. Chinese pilgrim Xuanzang    (Hiuen Tsang) visited Vallabhi in the 7th century and documented    it as a leading center of Hinayana doctrines, rivaling Nalanda    University which was famed for Mahayana Buddhism.</p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following was the Viceroy of India when the    Partition of Bengal was annulled in 1911?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Lord Curzon</p>", "option2": " <p style=\"orphans:0;widows:0\">    Lord Hardinge II</p>", "option3": " <p style=\"orphans:0;widows:0\">    Lord Minto II</p>", "option4": " <p style=\"orphans:0;widows:0\">    Lord Chelmsford</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Lord Hardinge II served as the Viceroy of India from 1910 to 1916.    During the Delhi Durbar of 1911, held in honour of King George V    and Queen Mary, he oversaw the annulment of the Partition of    Bengal (which had been enacted by Lord Curzon in 1905) and the    announcement of the shift of India's capital from Calcutta to    Delhi.</p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following dynasties of the Delhi Sultanate was of    Afghan origin?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Tughlaq dynasty</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sayyid dynasty</p>", "option3": " <p style=\"orphans:0;widows:0\">    Lodi dynasty</p>", "option4": " <p style=\"orphans:0;widows:0\">    Khalji dynasty</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Lodi dynasty (1451–1526 CE) was the only dynasty of the    Delhi Sultanate that was of Afghan (Pashtun) origin. It was    founded by Bahlul Lodi after displacing the Sayyid dynasty. In    contrast, the Mamluk (Slave), Khalji, and Tughlaq dynasties were    of Turkic origin, and the Sayyids claimed Arab descent.</p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <b>In the administration of the Vijayanagara Empire, what was the    term used for the territories or land grants assigned to military    commanders (Nayakas) for their maintenance?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Manyam</p>", "option2": " <p style=\"orphans:0;widows:0\">    Amaram</p>", "option3": " <p style=\"orphans:0;widows:0\">    Bhandaravada</p>", "option4": " <p style=\"orphans:0;widows:0\">    Devadana</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In the Vijayanagara administrative setup, the land grants or    territories assigned to military commanders (Nayakas) in return    for their military service were called <b>Amaram</b> (from which    the term 'Amara-Nayaka' is derived). The Nayakas collected revenue    from these lands to maintain themselves, an army contingent, and    war equipment for the service of the state.</p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <b>Which plant hormone is commonly known as the 'stress hormone'    because it promotes the closure of stomata during water-stress    conditions?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Gibberellin</p>", "option2": " <p style=\"orphans:0;widows:0\">    Abscisic acid</p>", "option3": " <p style=\"orphans:0;widows:0\">    Cytokinin</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ethylene</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Abscisic acid (ABA) is widely known as the 'stress hormone' in    plants. Under conditions of water deficiency or drought, the    concentration of ABA increases significantly, causing the stomata    to close and thereby reducing water loss through transpiration.</p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the states of    matter:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. The particles of a gas have very weak intermolecular forces    and move randomly in all directions.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. Liquids have a definite volume but do not have a definite    shape.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. During melting of a substance, its temperature always    increases continuously until the entire substance becomes liquid.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only 1</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1 — Correct:</b> Gas particles are far apart and    have very weak intermolecular forces.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2 — Correct:</b> A liquid has a fixed volume but takes the shape    of its container.</p>    <p style=\"orphans:0;widows:0\"><b>Statement 3 — Incorrect:</b>    During melting, the temperature remains constant at the <b>melting    point</b> until the substance completely melts.</p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding carbon and its    compounds:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Carbon shows catenation because of the strong carbon–carbon    bond.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. Carbon has a valency of four and can form covalent bonds    with other atoms.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. Diamond is a good conductor of electricity because each    carbon atom has a free electron.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>4. Graphite can conduct electricity due to the presence of    delocalised electrons.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    1, 2 and 4 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2, 3 and 4</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1 — Correct:</b> Catenation is the ability of    carbon to form long chains/rings through strong C–C bonds.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2 — Correct:</b> Carbon is <b>tetravalent</b> and generally    forms four covalent bonds.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    3 — Incorrect:</b> Diamond does <b>not</b> conduct electricity    because all four valence electrons are involved in strong covalent    bonds.</p>    <p style=\"orphans:0;widows:0\"><b>Statement 4 — Correct:</b>    Graphite has delocalised electrons that allow it to conduct    electricity.</p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following is an application protocol?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    HTTP.</p>", "option2": " <p style=\"orphans:0;widows:0\">    TCP.</p>", "option3": " <p style=\"orphans:0;widows:0\">    IP.</p>", "option4": " <p style=\"orphans:0;widows:0\">    UDP.</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>HTTP (HyperText Transfer Protocol)</b> is an <b>application-layer    protocol</b> used to transfer web pages and other resources over    the Internet.</p>    <p style=\"orphans:0;widows:0\"><b>TCP</b> and <b>UDP</b> are    transport-layer protocols, while <b>IP</b> is a network-layer    protocol.</p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0\">    <b>Which is not an external storage device?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    CD-ROM.</p>", "option2": " <p style=\"orphans:0;widows:0\">    DVD-ROM.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Pen drive.</p>", "option4": " <p style=\"orphans:0;widows:0\">    RAM.</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>RAM (Random Access Memory)</b> is <b>primary/internal memory</b>    used temporarily by the computer while processing data.</p>    <p style=\"orphans:0;widows:0\">CD-ROM, DVD-ROM and Pen drive are    examples of <b>external/secondary storage devices</b>.</p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0\">    <b>Who developed the concept of E-mail?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Bill gates.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Arthur c Clark.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Ray Tomlinson.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sabir Bhatia.</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Ray Tomlinson</b> developed the first networked email system in    <b>1971</b>.</p>    <p style=\"orphans:0;widows:0\">He is also credited with    introducing the <b>“@” symbol</b> to separate the user's name    from the computer/domain name in email addresses.</p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0\">    <b>DTP stands for?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Daily Text printing.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Desk top publishing.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Desk top printing.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Daily Text publishing.</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>DTP = Desktop Publishing</b>.</p>    <p style=\"orphans:0;widows:0\">It refers to creating and    designing documents such as <b>books, brochures, magazines,    newsletters and posters</b> using computer software.</p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0\">    <b>Which city ranked first among cities with a population above 10    lakh in Swachh Vayu Survekshan 2026?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Lucknow</p>", "option2": " <p style=\"orphans:0;widows:0\">    Jabalpur</p>", "option3": " <p style=\"orphans:0;widows:0\">    Bhopal</p>", "option4": " <p style=\"orphans:0;widows:0\">    Indore</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    ● The <i>Swachh Vayu Survekshan 2026</i>, conducted by the    <i>Central Pollution Control Board (CPCB)</i>, ranked <i>Lucknow</i>    first among cities with a population above 10 lakh with <i>198    points</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">● <i>Indore</i>    (197) and <i>Jabalpur</i> (195) ranked 2nd and 3rd in this    category.</p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <i>Category</i></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <i>1st rank city</i></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <i>Score</i></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       Category-I: Population above 10 lakh</p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       Lucknow</p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       198</p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       Category-II: Population 3–10 lakh</p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       Rourkela</p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       198.5</p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       Category-III: Population below 3 lakh</p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       Kalinga Nagar</p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       198.5</p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0\">    <b>In which city was the 28th Western Zonal Council meeting held?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Gandhinagar</p>", "option2": " <p style=\"orphans:0;widows:0\">    Panaji</p>", "option3": " <p style=\"orphans:0;widows:0\">    Daman</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mumbai</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    ● The 28th Western Zonal Council meeting was chaired by Union    Home and Cooperation Minister <i>Amit Shah</i> in <i>Panaji, Goa</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">● Members:    <i>Goa, Gujarat, Maharashtra</i> and <i>Dadra and Nagar Haveli and    Daman and Diu</i>.</p>    <p style=\"orphans:0;widows:0\">● Five Zonal Councils were    established in <i>1957</i> under Sections 15–22 of the <i>States    Reorganisation Act, 1956</i>; the <i>North Eastern Council</i> was    set up separately under the <i>North Eastern Council Act, 1971</i>.</p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0\">    <b>Who became the first Indian male recurve archer to win gold at    the Archery World Cup Final?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Atanu Das</p>", "option2": " <p style=\"orphans:0;widows:0\">    Dhiraj Bommadevara</p>", "option3": " <p style=\"orphans:0;widows:0\">    Rahul Banerjee</p>", "option4": " <p style=\"orphans:0;widows:0\">    Tarundeep Rai</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <i>Dhiraj Bommadevara</i> became the first Indian male recurve    archer to win <i>World Cup Final gold</i>, defeating Japan’s    <i>Nakanishi Junya</i> in a shoot-off at <i>Saltillo, Mexico</i>.</p>    <p style=\"orphans:0;widows:0\">● Historically, <i>Dola    Banerjee</i> became the first Indian archer to win gold at the    Archery World Cup Final, clinching the <i>Women’s Individual    Recurve</i> title in <i>Dubai (2007)</i>.</p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0\">    <b>The 9th Rashtriya Poshan Maah 2026 marked 10 years of which    scheme?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Saksham Anganwadi and Poshan 2.0</p>", "option2": " <p style=\"orphans:0;widows:0\">    PM POSHAN</p>", "option3": " <p style=\"orphans:0;widows:0\">    Beti Bachao Beti Padhao</p>", "option4": " <p style=\"orphans:0;widows:0\">    Pradhan Mantri Matru Vandana Yojana (PMMVY)</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The 9th <i>Rashtriya Poshan Maah 2026</i>, organised by the    <i>Ministry of Women and Child Development</i>, marked <i>10 years    of </i>Pradhan Mantri Matru Vandana Yojana (PMMVY) (launched on <i>1    January 2017</i>).</p>    <p style=\"orphans:0;widows:0\">● It was launched in <i>Varanasi,    Uttar Pradesh</i>, under the theme <i>“Hamari Anganwadi Hamari    Jimmedari”</i>.</p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\"><b>‘Project NETRA’ of ISRO, linked to a new facility in Assam,    is related to which field?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Space debris tracking (Space Situational Awareness)</p>", "option2": " <p style=\"orphans:0;widows:0\">    Weather forecasting</p>", "option3": " <p style=\"orphans:0;widows:0\">    Missile defence</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ocean floor mapping</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <i>Project NETRA</i> (Network for space object Tracking and    Analysis) is ISRO’s dedicated <i>Space Situational Awareness    (SSA)</i> network, launched in <i>September 2019</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">● It aims    to detect and track <i>space debris</i> and hazards threatening    Indian satellites in <i>Low Earth Orbit (LEO)</i>.</p>    <p style=\"orphans:0;widows:0\">● The foundation stone of    ISRO’s <i>Advanced Radar Research Facility</i> was laid at    <i>Chandrapur, Assam</i>.</p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0\">    <b>Which highest award of Uzbekistan for foreign leaders was    conferred on PM Narendra Modi?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Royal Order of the Polar Star</p>", "option2": " <p style=\"orphans:0;widows:0\">    Oliy Darajali Do’stlik Order</p>", "option3": " <p style=\"orphans:0;widows:0\">    Bintang Republik Indonesia Adipurna</p>", "option4": " <p style=\"orphans:0;widows:0\">    Guardian of the Blue Horizon</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    ● PM Narendra Modi was conferred Uzbekistan’s highest award    for foreign leaders, the <i>‘Oliy Darajali Do’stlik’ Order</i>    (<i>“Friendship of the Highest Degree”</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">● Other    global state honours awarded to PM Modi in 2026 are listed below.</p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <i>Award / Honour</i></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <i>Country</i></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       Speaker of the Knesset Medal</p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       Israel</p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       Royal Order of the Polar Star (Commander Grand Cross)</p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       Sweden</p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       Grand Cross of the Royal Norwegian Order of Merit</p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       Norway</p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       Order of the White Double Cross (1st Class)</p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       Slovakia</p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       Guardian of the Blue Horizon (Presidential Distinction)</p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       Seychelles</p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       Bintang Republik Indonesia Adipurna</p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       Indonesia</p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0\">    <b>Where was the 26th SCO Summit, attended by PM Narendra Modi,    held?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Tashkent</p>", "option2": " <p style=\"orphans:0;widows:0\">    Bishkek</p>", "option3": " <p style=\"orphans:0;widows:0\">    Astana</p>", "option4": " <p style=\"orphans:0;widows:0\">    Dushanbe</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    At the <i>26th SCO Summit in Bishkek</i>, PM Modi outlined    <i>Security, Connectivity and Opportunity</i> as India’s core    pillars and urged <i>zero tolerance for terrorism</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">● India’s    four initiatives: <i>English as an official language in the SCO    Charter, Civilization Dialogue Forum, Young Scientists Forum</i>    and <i>Young Writers Conference</i>.</p>    <p style=\"orphans:0;widows:0\">● The <i>SCO</i> was    established in <i>2001</i>, has its headquarters in <i>Beijing,    China</i>, and has <i>10 member countries</i>.</p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0\">    <b>Which country will host the XIX BRICS Summit in 2027?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Brazil</p>", "option2": " <p style=\"orphans:0;widows:0\">    Russia</p>", "option3": " <p style=\"orphans:0;widows:0\">    South Africa</p>", "option4": " <p style=\"orphans:0;widows:0\">    China</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The <i>XIX BRICS Summit</i> will be held in <i>China</i> in <i>2027</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">● The <i>XVIII    BRICS Summit</i> was held in <i>New Delhi</i> on <i>12–13    September 2026</i> under India’s Chairship, adopting the <i>BRICS    New Delhi Declaration</i>.</p>    <p style=\"orphans:0;widows:0\">● Theme: <i>“Building for    Resilience, Innovation, Cooperation and Sustainability”</i>; the    Declaration marked the <i>20th anniversary</i> of BRICS.</p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0\">    <b>Who was conferred the Dadasaheb Phalke Award for 2024?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Anant Nag</p>", "option2": " <p style=\"orphans:0;widows:0\">    Mithun Chakraborty</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mohanlal</p>", "option4": " <p style=\"orphans:0;widows:0\">    Waheeda Rehman</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Karnataka-born veteran actor <i>Anant Nag</i> was conferred the    <i>Dadasaheb Phalke Award for 2024</i> at the National Film Awards    ceremony in <i>Kevadia (Ekta Nagar), Gujarat</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">● The award    comprises a <i>Swarna Kamal medal, shawl and a cash prize</i>; the    first recipient was <i>Devika Rani</i> (1969).</p>    <p style=\"orphans:0;widows:0\">● Previous recipients: <i>Mithun    Chakraborty (2022)</i> and <i>Mohanlal (2023)</i>.</p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Marathi film was announced as India’s official entry    for the Best International Feature Film at the 99th Academy    Awards?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Chandu Champion</p>", "option2": " <p style=\"orphans:0;widows:0\">    Angh</p>", "option3": " <p style=\"orphans:0;widows:0\">    Article 370</p>", "option4": " <p style=\"orphans:0;widows:0\">    Gondhal</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    ● The Film Federation of India (FFI) announced the Marathi    folk-thriller <i>‘Gondhal’</i> as India’s official entry for    the <i>99th Academy Awards (Oscars 2027)</i>, selected among <i>33</i>    competing titles.</p>    <p style=\"orphans:0;widows:0\">● Naga filmmaker Theja Rio’s    film <i>‘Angh’</i> separately won the <i>Platform Prize 2026</i>    at the <i>Toronto International Film Festival (TIFF)</i>.</p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">Water flows through a cylindrical pipe of internal diameter 7 cm at a speed of 4 m/s into a rectangular tank whose base measures 11 m × 6 m. In how many minutes will the water level in the tank rise by 21 cm? (Take </span><span style=\"font-family:Calibri;font-weight:bold\">π</span><span style=\"font-weight:bold\"> = 22/7)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>15</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>12</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>18</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>21</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>Radius of the pipe = 3.5 cm = 0.035 m. Water flowing per second = </span><span style=\"font-family:Calibri\">π</span><span>r² × speed = 22/7 × 0.035 × 0.035 × 4 = 0.0154 m³. Volume required = 11 × 6 × 0.21 = 13.86 m³. Time = 13.86 ÷ 0.0154 = 900 seconds = 15 minutes.</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">The average weight of 36 students in a class is 42 kg. Six students whose average weight is 40 kg leave the class, and 9 new students join it. As a result, the average weight of the class becomes 43 kg. What is the average weight of the 9 new students?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>44 kg</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>45 kg</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>46 kg</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>47.5 kg</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>Initial total weight = 36 × 42 = 1,512 kg. Weight of the 6 who left = 6 × 40 = 240 kg, so the remaining 30 students weigh 1,272 kg. New strength = 30 + 9 = 39 students with total weight 39 × 43 = 1,677 kg. Weight of the 9 new students = 1,677 − 1,272 = 405 kg. Average = 405/9 = 45 kg.</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">Ramesh's monthly income increases by 20% and his monthly expenditure increases by 15%. As a result, his monthly savings increase by 30%. If the increase in his monthly savings is ₹3,600, what was his original monthly income?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹30,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹40,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹32,400</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹36,000</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>Let income = I and expenditure = E, so savings = I − E. New savings: 1.2I − 1.15E = 1.3(I − E) </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> 1.2I − 1.15E = 1.3I − 1.3E </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> 0.15E = 0.1I </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> E = (2/3)I. Original savings = I − (2/3)I = I/3. Increase in savings = 30% of I/3 = 0.1I = ₹3,600 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span> I = ₹36,000.</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">The sides of a triangular plot are in the ratio 25 : 17 : 12, and its perimeter is 540 m. Find the area of the plot.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>9,000 m²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>10,800 m²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>8,400 m²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>9,600 m²</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>Sum of the ratio terms = 25 + 17 + 12 = 54, so one part = 540/54 = 10 m. Sides = 250 m, 170 m and 120 m. s = 540/2 = 270 m. Area = </span><span style=\"font-family:Arial\">√</span><span>(270 × 20 × 100 × 150) = </span><span style=\"font-family:Arial\">√</span><span>81,000,000 = 9,000 m².</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">Pipes A and B can fill an empty tank in 20 minutes and 30 minutes respectively, while pipe C can empty the full tank in 15 minutes. The pipes are opened one at a time in the order A, B, C, each for exactly 1 minute, and this cycle is repeated. In how many minutes will the empty tank be completely filled?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>165</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>180</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>167</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>170</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>In one 3-minute cycle: 1/20 + 1/30 − 1/15 = (3 + 2 − 4)/60 = 1/60 of the tank. Within a cycle the level is highest just after B has run (A and B together add 5/60). The tank gets full when k/60 + 5/60 </span><span style=\"font-family:Arial\">≥</span><span> 1, i.e. after k = 55 complete cycles. After 55 cycles (165 minutes) the tank is 55/60 full. A then runs for 1 minute </span><span style=\"font-family:Arial\">→</span><span> 58/60, and B runs for 1 minute </span><span style=\"font-family:Arial\">→</span><span> 60/60. Total time = 165 + 2 = 167 minutes.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">If 2x + 3y = 13 and xy = 6, find the value of 8x³ + 27y³.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>1,014</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>793</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>845</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>721</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>(2x + 3y)³ = 8x³ + 27y³ + 3(2x)(3y)(2x + 3y) = 8x³ + 27y³ + 18xy(2x + 3y). So 8x³ + 27y³ = 13³ − 18 × 6 × 13 = 2,197 − 1,404 = 793.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">If x = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982179987_image001.png\" width=\"49\" height=\"32\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">  </span><span style=\"font-weight:bold\">and y = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982179987_image002.png\" width=\"49\" height=\"32\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> , find the value of x² + xy + y².</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>22</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>26</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>24</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>23</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>xy = 1. x + y = [(</span><span style=\"font-family:Arial\">√</span><span>7 + </span><span style=\"font-family:Arial\">√</span><span>3)² + (</span><span style=\"font-family:Arial\">√</span><span>7 − </span><span style=\"font-family:Arial\">√</span><span>3)²]/(7 − 3) = [2(7 + 3)]/4 = 5. x² + y² = (x + y)² − 2xy = 25 − 2 = 23. Therefore x² + xy + y² = 23 + 1 = 24.</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">A certain sum, invested at compound interest compounded annually, amounts to ₹28,090 in 2 years and to ₹29,775.40 in 3 years. Find the sum and the rate of interest.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹24,000 and 8%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹25,000 and 8%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹26,000 and 6%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹25,000 and 6%</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>Interest for the 3rd year = 29,775.40 − 28,090 = ₹1,685.40, which is the interest on ₹28,090 for one year. Rate = 1,685.40/28,090 × 100 = 6%. Sum = 28,090 ÷ (1.06)² = 28,090 ÷ 1.1236 = ₹25,000.</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">Two trains start at the same time from stations P and Q and move towards each other. After meeting, the trains take 9 hours and 16 hours respectively to reach their destinations Q and P. If the speed of the train starting from P is 64 km/h, what is the distance between P and Q?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>1,344 km</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>1,280 km</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>1,440 km</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>1,232 km</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>If after meeting the trains take t</span><span style=\"font-family:'Cambria Math'\">₁</span><span> and t</span><span style=\"font-family:'Cambria Math'\">₂</span><span> hours, then (speed of the first) : (speed of the second) = </span><span style=\"font-family:Arial\">√</span><span>t</span><span style=\"font-family:'Cambria Math'\">₂</span><span> : </span><span style=\"font-family:Arial\">√</span><span>t</span><span style=\"font-family:'Cambria Math'\">₁</span><span> = </span><span style=\"font-family:Arial\">√</span><span>16 : </span><span style=\"font-family:Arial\">√</span><span>9 = 4 : 3. Speed of the train from Q = 64 × 3/4 = 48 km/h. Time taken till meeting = </span><span style=\"font-family:Arial\">√</span><span>(t</span><span style=\"font-family:'Cambria Math'\">₁</span><span> × t</span><span style=\"font-family:'Cambria Math'\">₂</span><span>) = </span><span style=\"font-family:Arial\">√</span><span>(9 × 16) = 12 h. Distance PQ = (64 + 48) × 12 = 1,344 km.</span></p>", "question_heading": ""}, {"sr
