<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>10.) MOCK - 05 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

tyle=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>सभी पदों को एक ओर ले जाएँ: (a² − 2a + 1) + (b² + 4b + 4) + (c² + 6c + 9) = 0 ⇒ (a − 1)² + (b + 2)² + (c + 3)² = 0. वास्तविक संख्याओं के वर्गों का योग तभी शून्य होता है जब प्रत्येक वर्ग शून्य हो ⇒ a = 1, b = −2, c = −3. a³ + b³ + c³ = 1 − 8 − 27 = −34.</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक कक्षा में, यदि प्रत्येक बेंच पर 4 छात्र बैठें, तो 3 छात्रों को बैठने की जगह नहीं मिलती। यदि प्रत्येक बेंच पर 5 छात्र बैठें, तो 3 बेंच पूरी तरह खाली रहती हैं और एक बेंच पर केवल 2 छात्र होते हैं। कक्षा में कितने छात्र हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>91</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>83</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>79</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>87</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>माना बेंचों की संख्या = n. पहली स्थिति: छात्र = 4n + 3. दूसरी स्थिति: 3 बेंच खाली हैं, एक बेंच पर 2 छात्र हैं और शेष (n − 4) बेंचों पर 5-5 छात्र हैं, अतः छात्र = 5(n − 4) + 2 = 5n − 18. 4n + 3 = 5n − 18 ⇒ n = 21. छात्र = 4 × 21 + 3 = 87.</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक परिवार अपने मासिक भोजन बजट का 40% गेहूँ पर और शेष चावल पर खर्च करता है। गेहूँ का मूल्य 25% और चावल का मूल्य 10% बढ़ जाता है। इसके बाद परिवार गेहूँ की खपत 12% और चावल की खपत 5% कम कर देता है। इन दोनों वस्तुओं पर उसके कुल खर्च में कितने प्रतिशत का परिवर्तन होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7.3% की वृद्धि</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5.8% की वृद्धि</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6.7% की वृद्धि</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8.2% की वृद्धि</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>पुराना बजट = 100 मानें: गेहूँ 40, चावल 60. खर्च = मूल्य × खपत. गेहूँ पर नया खर्च = 40 × 1.25 × 0.88 = 44. चावल पर नया खर्च = 60 × 1.10 × 0.95 = 62.7. नया कुल = 44 + 62.7 = 106.7 ⇒ खर्च में 6.7% की वृद्धि होती है।</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक फल विक्रेता ₹80 प्रति kg की दर से 150 kg सेब खरीदता है। उसे पता चलता है कि 20% सेब सड़े हुए हैं और वह उन्हें फेंक देता है। वह बचे हुए सेबों में से 40% को प्रति kg क्रय मूल्य पर 25% लाभ पर बेचता है। अपने कुल निवेश पर 15% का कुल लाभ कमाने के लिए उसे शेष सेब किस मूल्य प्रति kg पर बेचने होंगे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹120</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹125</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹130</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹115</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>कुल क्रय मूल्य = 150 × 80 = ₹12,000; आवश्यक विक्रय मूल्य = 1.15 × 12,000 = ₹13,800. अच्छे सेब = 150 का 80% = 120 kg. 120 का 40% = 48 kg, ₹100 प्रति kg पर बिके = ₹4,800. शेष 72 kg से 13,800 − 4,800 = ₹9,000 मिलने चाहिए ⇒ मूल्य = 9,000 ÷ 72 = ₹125 प्रति kg.</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक दुकानदार किसी वस्तु पर उसके क्रय मूल्य से 40% अधिक मूल्य अंकित करता है और उसे 10% की दो क्रमिक छूट देकर बेचता है। यदि वह इसके स्थान पर 20% की एकल छूट देता, तो उसे ₹21 कम मिलते। वस्तु का क्रय मूल्य क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹1,500</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹1,200</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹1,750</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹2,100</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>माना क्रय मूल्य = 100x ⇒ अंकित मूल्य = 140x. 10% की दो क्रमिक छूट: विक्रय मूल्य = 140x × 0.9 × 0.9 = 113.4x. 20% की एकल छूट: विक्रय मूल्य = 140x × 0.8 = 112x. अंतर = 1.4x = ₹21 ⇒ x = 15 ⇒ क्रय मूल्य = 100 × 15 = ₹1,500.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">₹40,000 पर 3 वर्षों का चक्रवृद्धि ब्याज क्या होगा, यदि पहले, दूसरे और तीसरे वर्ष के लिए ब्याज की दरें क्रमशः 10%, 12% और 15% वार्षिक हैं और ब्याज वार्षिक रूप से संयोजित होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹14,800</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹16,320</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹17,060</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹16,672</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>मिश्रधन = 40,000 × 1.10 × 1.12 × 1.15. 1.10 × 1.12 = 1.232 और 1.232 × 1.15 = 1.4168, अतः मिश्रधन = 40,000 × 1.4168 = ₹56,672. चक्रवृद्धि ब्याज = 56,672 − 40,000 = ₹16,672. (10 + 12 + 15 = 37% की दर से साधारण ब्याज केवल ₹14,800 होता।)</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A ₹45,000 के साथ एक व्यवसाय शुरू करता है। 3 महीने बाद B ₹60,000 के साथ उसके साथ जुड़ता है, और B के 2 महीने बाद C ₹72,000 के साथ जुड़ता है। वर्ष के अंत में कुल लाभ ₹1,32,000 है। लाभ में A के हिस्से और C के हिस्से में कितना अंतर है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹2,400</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹3,600</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹3,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹4,500</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>पूँजी × समय: A = 45,000 × 12 = 5,40,000; B = 60,000 × 9 = 5,40,000; C = 72,000 × 7 = 5,04,000. अनुपात = 540 : 540 : 504 = 15 : 15 : 14 (कुल 44 भाग). A का हिस्सा = 1,32,000 × 15/44 = ₹45,000; C का हिस्सा = 1,32,000 × 14/44 = ₹42,000. अंतर = ₹3,000.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">समान धारिता वाले तीन बर्तन क्रमशः 2 : 1, 3 : 2 और 4 : 3 के अनुपात में दूध और पानी के मिश्रण से पूरी तरह भरे हैं। यदि तीनों बर्तनों की सामग्री एक बड़े पात्र में डाल दी जाए, तो उसमें दूध और पानी का अनुपात क्या होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>191 : 124</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>193 : 122</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>187 : 128</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3 : 2</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>प्रत्येक बर्तन की धारिता = LCM(3, 5, 7) = 105 लीटर मानें। दूध: 105 × 2/3 = 70, 105 × 3/5 = 63, 105 × 4/7 = 60 ⇒ कुल 193 लीटर. पानी: 35 + 42 + 45 = 122 लीटर. अनुपात = 193 : 122.</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक बल्लेबाज़ का 24 पारियों के बाद एक निश्चित औसत है। अपनी 25वीं पारी में वह 112 रन बनाता है, जिससे उसका औसत 2.5 रन बढ़ जाता है। यदि उसने 25वीं पारी में 30 रन कम बनाए होते, तो 25 पारियों के बाद उसका औसत क्या होता?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>50.8</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>50.5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>51.2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>49.9</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>माना 24 पारियों के बाद औसत = x. 24x + 112 = 25(x + 2.5) ⇒ x = 112 − 62.5 = 49.5. 24 पारियों के कुल रन = 24 × 49.5 = 1,188. 25वीं पारी में 112 − 30 = 82 रन होने पर औसत = (1,188 + 82)/25 = 1,270/25 = 50.8.</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक पिता और उसके दो पुत्रों की वर्तमान आयु का योग 82 वर्ष है। छह वर्ष पहले पिता की आयु उस समय उसके दोनों पुत्रों की आयु के योग की तीन गुनी थी। यदि बड़ा पुत्र छोटे पुत्र से 4 वर्ष बड़ा है, तो कितने वर्ष बाद पिता की आयु उसके दोनों पुत्रों की आयु के योग के बराबर होगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>24 वर्ष</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>28 वर्ष</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>26 वर्ष</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>22 वर्ष</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>माना पुत्रों की वर्तमान आयु का योग = S और पिता की आयु = F. F + S = 82 और F − 6 = 3(S − 12) ⇒ F = 3S − 30. अतः 4S − 30 = 82 ⇒ S = 28 और F = 54 (पुत्र 16 और 12 वर्ष के हैं). n वर्ष बाद: 54 + n = 28 + 2n ⇒ n = 26 वर्ष.</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">24 पुरुष प्रतिदिन 7.5 घंटे काम करके किसी कार्य को 16 दिनों में पूरा कर सकते हैं। 4 दिन बाद 6 पुरुष काम छोड़ देते हैं, और शेष पुरुष प्रतिदिन 8 घंटे काम करने का निर्णय लेते हैं। कुल कितने दिनों में कार्य पूरा होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>19 दिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20 दिन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18 दिन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>17 दिन</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>कुल कार्य = 24 × 16 × 7.5 = 2,880 मानव-घंटे. पहले 4 दिनों में किया गया कार्य = 24 × 4 × 7.5 = 720 मानव-घंटे. शेष कार्य = 2,160 मानव-घंटे, जिसे 18 पुरुष प्रतिदिन 8 घंटे काम करके करते हैं = 144 मानव-घंटे प्रतिदिन ⇒ 2,160 ÷ 144 = 15 दिन. कुल समय = 4 + 15 = 19 दिन.</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">पाइप A और B किसी खाली टंकी को क्रमशः 36 मिनट और 45 मिनट में भर सकते हैं, जबकि पाइप C भरी हुई टंकी को 30 मिनट में खाली कर सकता है। खाली टंकी पर तीनों पाइप एक साथ खोले जाते हैं। पाइप C को कितने मिनट बाद बंद किया जाए ताकि टंकी शुरुआत से ठीक 30 मिनट में भर जाए?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 मिनट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18 मिनट</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20 मिनट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15 मिनट</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>टंकी = LCM(36, 45, 30) = 180 इकाई मानें: A = 5, B = 4 और C = −6 इकाई प्रति मिनट. A और B पूरे 30 मिनट काम करते हैं: (5 + 4) × 30 = 270 इकाई. टंकी में केवल 180 इकाई आती है, अतः C को 270 − 180 = 90 इकाई निकालनी होगी ⇒ C, 90 ÷ 6 = 15 मिनट चलेगा। अतः C को 15 मिनट बाद बंद करना चाहिए।</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">दो शहर P और Q एक-दूसरे से 400 km दूर हैं। सुबह 9:00 बजे एक कार P से Q की ओर 50 km/h की चाल से चलती है, और उसी समय दूसरी कार Q से P की ओर 40 km/h की चाल से चलती है। 2 घंटे बाद पहली कार 1 घंटे के लिए रुकती है और फिर उसी चाल से आगे बढ़ती है। दोनों कारें P से कितनी दूरी पर मिलेंगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>200 km</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>220 km</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>180 km</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>240 km</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>पहले 2 घंटों में दूरी 2 × 90 = 180 km घटती है, शेष 220 km. 1 घंटे के ठहराव में केवल दूसरी कार 40 km चलती है, शेष 180 km. इसके बाद वे 90 km/h से यह दूरी 2 घंटे में तय करती हैं। पहली कार कुल 2 + 2 = 4 घंटे चलती है ⇒ P से दूरी = 4 × 50 = 200 km (वे दोपहर 2:00 बजे मिलती हैं).</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">280 m लंबी एक ट्रेन 72 km/h की चाल से चल रही है। विपरीत दिशा से आ रही दूसरी ट्रेन इसे 12 सेकंड में पूरी तरह पार कर लेती है और एक सिग्नल खंभे को 9 सेकंड में पार करती है। दूसरी ट्रेन की लंबाई क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>135 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>120 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>150 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>108 m</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>72 km/h = 20 m/s. माना दूसरी ट्रेन की चाल = v m/s; उसकी लंबाई = 9v (वह खंभे को 9 सेकंड में पार करती है). एक-दूसरे को पार करने में: 280 + 9v = 12(20 + v) ⇒ 280 + 9v = 240 + 12v ⇒ v = 40/3 m/s (= 48 km/h). लंबाई = 9 × 40/3 = 120 m.</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक व्यक्ति 48 km दूर स्थित एक स्थान तक नाव चलाकर जाता है और वापस आता है, जिसमें कुल 14 घंटे लगते हैं। वह पाता है कि जितने समय में वह धारा के अनुकूल 4 km जाता है, उतने ही समय में धारा के प्रतिकूल 3 km जाता है। शांत जल में नाव की चाल क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6 km/h</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8 km/h</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7.5 km/h</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7 km/h</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>धारा के अनुकूल चाल : धारा के प्रतिकूल चाल = 4 : 3; माना ये 4k और 3k हैं। 48/(4k) + 48/(3k) = 14 ⇒ 12/k + 16/k = 14 ⇒ k = 2. अनुकूल चाल = 8 km/h, प्रतिकूल चाल = 6 km/h. शांत जल में चाल = (8 + 6)/2 = 7 km/h.</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">△ABC में ∠B = 90°, AB = 9 cm और BC = 12 cm है। BD, AC पर लंब खींचा गया है, जो उसे D पर मिलता है। △ABD का क्षेत्रफल क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>21.6 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>19.44 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>17.28 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20.16 cm²</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>AC = √(9² + 12²) = 15 cm. BD = (AB × BC)/AC = 108/15 = 7.2 cm. AD = AB²/AC = 81/15 = 5.4 cm. △ABD का क्षेत्रफल = ½ × AD × BD = ½ × 5.4 × 7.2 = 19.44 cm².</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">10 cm और 17 cm त्रिज्या वाले दो वृत्त एक-दूसरे को प्रतिच्छेद करते हैं, और उनकी उभयनिष्ठ जीवा की लंबाई 16 cm है। यदि केंद्र उभयनिष्ठ जीवा के विपरीत ओर स्थित हैं, तो उनके केंद्रों के बीच की दूरी क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>19 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>23 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>21 cm</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>केंद्रों को मिलाने वाली रेखा उभयनिष्ठ जीवा को समकोण पर समद्विभाजित करती है, अतः आधी जीवा = 8 cm. पहले केंद्र से जीवा की दूरी = √(10² − 8²) = 6 cm; दूसरे केंद्र से = √(17² − 8²) = 15 cm. केंद्र विपरीत ओर हैं ⇒ दूरी = 6 + 15 = 21 cm.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक आयताकार पार्क 80 m × 60 m का है। पार्क के बीच से दो सड़कें, प्रत्येक 5 m चौड़ी, गुज़रती हैं, एक लंबाई के समांतर और दूसरी चौड़ाई के समांतर। पार्क के चारों ओर बाहर की तरफ 2.5 m चौड़ा एक रास्ता भी है। सड़कों और रास्ते को ₹42.80 प्रति m² की दर से पक्का करने की लागत क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹59,920</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹60,990</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹57,780</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹62,060</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>सड़कें: 80 × 5 + 60 × 5 − 5 × 5 (चौराहे वाला वर्ग दो बार गिना गया है) = 675 m². बाहरी रास्ता: (80 + 5) × (60 + 5) − 80 × 60 = 5,525 − 4,800 = 725 m². कुल क्षेत्रफल = 1,400 m². लागत = 1,400 × 42.80 = ₹59,920.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">6 cm त्रिज्या वाले धातु के एक ठोस गोले को पिघलाकर एक खोखला बेलनाकार पाइप बनाया जाता है, जिसकी बाहरी और आंतरिक त्रिज्याएँ क्रमशः 5 cm और 4 cm हैं। पाइप की लंबाई क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>36 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>28 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>24 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>32 cm</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>गोले का आयतन = (4/3)π × 6³ = 288π cm³. पाइप का आयतन = π(5² − 4²) × h = 9πh. 9πh = 288π ⇒ h = 32 cm.</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक लंब वृत्तीय बेलन और एक लंब वृत्तीय शंकु के आधार की त्रिज्याएँ बराबर हैं और ऊँचाइयाँ भी बराबर हैं। यदि उनके वक्र पृष्ठीय क्षेत्रफलों का अनुपात 8 : 5 है, तो त्रिज्या और ऊँचाई का अनुपात क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4 : 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3 : 4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3 : 5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 : 4</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>2πrh : πrl = 8 : 5 ⇒ 2h/l = 8/5 ⇒ l = 5h/4. r² = l² − h² = 25h²/16 − h² = 9h²/16 ⇒ r = 3h/4. अतः r : h = 3 : 4.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">यदि cosec θ − sin θ = l और sec θ − cos θ = m है, तो l²m²(l² + m² + 3) का मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>0</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>l = (1 − sin²θ)/sin θ = cos²θ/sin θ और m = (1 − cos²θ)/cos θ = sin²θ/cos θ. अतः lm = sin θ cos θ. l² + m² + 3 = cos⁴θ/sin²θ + sin⁴θ/cos²θ + 3 = (cos⁶θ + sin⁶θ + 3 sin²θ cos²θ)/(sin²θ cos²θ) = 1/(sin²θ cos²θ), क्योंकि cos⁶θ + sin⁶θ = 1 − 3 sin²θ cos²θ. अतः l²m²(l² + m² + 3) = sin²θ cos²θ × 1/(sin²θ cos²θ) = 1.</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक संचार टावर 20 m ऊँची इमारत के शीर्ष पर लगा है। भूमि पर स्थित एक बिंदु से टावर के तल और शीर्ष के उन्नयन कोण क्रमशः 45° और 60° हैं। टावर की ऊँचाई क्या है?</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20(</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795193985892_image008.png\" width=\"20\" height=\"22\" alt style=\"vertical-align:middle\" ><span> − 1) m</span></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20(</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795193985892_image008.png\" width=\"20\" height=\"22\" alt style=\"vertical-align:middle\" ><span> + 1) m</span></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10(</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795193985892_image008.png\" width=\"20\" height=\"22\" alt style=\"vertical-align:middle\" ><span> − 1) m</span></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795193985892_image008.png\" width=\"20\" height=\"22\" alt style=\"vertical-align:middle\" ><span> m</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span>माना ब vertical-align:middle\" ><span> का अनुसरण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• तीसरा शब्द: </span><span style=\"font-weight:bold\">FUSR</span><span>, स्थान क्रम </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205929790_image065.png\" width=\"93\" height=\"21\" alt style=\"vertical-align:middle\" ><span> का अनुसरण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यही नियम </span><span style=\"font-weight:bold\">MINT</span><span> (M = 1, I = 2, N = 3, T = 4) पर लागू करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• दूसरा शब्द (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205929790_image064.png\" width=\"93\" height=\"21\" alt style=\"vertical-align:middle\" ><span>): </span><span style=\"font-weight:bold\">NMTI</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• तीसरा शब्द (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205929790_image065.png\" width=\"93\" height=\"21\" alt style=\"vertical-align:middle\" ><span>): </span><span style=\"font-weight:bold\">TIMN</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, </span><span style=\"font-weight:bold\">MINT - NMTI - TIMN</span><span> सही त्रिक है।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक निश्चित कूट भाषा में, ‘PLUM’ को ‘7429’, ‘LIME’ को ‘2963’ और ‘POEM’ को ‘7832’ के रूप में कूटबद्ध किया जाता है। दी गई कूट भाषा में ‘U’ का कूट क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए कूटों की तुलना करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. ‘PLUM’ = ‘7429’ और ‘LIME’ = ‘2963’: उभयनिष्ठ अक्षर L और M हैं, तथा उभयनिष्ठ अंक 2 और 9 हैं। अतः {L, M} = {2, 9}।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. ‘PLUM’ = ‘7429’ और ‘POEM’ = ‘7832’: उभयनिष्ठ अक्षर P और M हैं, तथा उभयनिष्ठ अंक 2 और 7 हैं। अतः {P, M} = {2, 7}।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(1) और (2) से, उभयनिष्ठ अक्षर M है और उभयनिष्ठ अंक 2 है, जिससे M = 2, L = 9 और P = 7 प्राप्त होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अब ‘PLUM’ (‘7429’) में, P = 7, L = 9 और M = 2 हैं। शेष अक्षर ‘U’ है और शेष अंक 4 है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः ‘U’ का कूट 4 है।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सात बॉक्स, A, B, C, D, E, F और G, एक के ऊपर एक रखे गए हैं, लेकिन जरूरी नहीं कि वे इसी क्रम में हों।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बॉक्स D को ऊपर से पांचवें स्थान पर रखा गया है। बॉक्स D और बॉक्स A के बीच केवल दो बॉक्स रखे गए हैं। बॉक्स B को बॉक्स A के ठीक नीचे रखा गया है। बॉक्स B और बॉक्स F के बीच केवल एक बॉक्स रखा गया है। बॉक्स G को बॉक्स E के ठीक ऊपर रखा गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>नीचे से दूसरे स्थान पर कौन-सा बॉक्स रखा गया है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>G</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मान लीजिए कि ऊपर से नीचे तक के स्थानों को 1 से 7 तक क्रमांकित किया गया है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. बॉक्स D ऊपर से पांचवें स्थान पर है → स्थान 5 = D.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. D और A के बीच केवल दो बॉक्स हैं → स्थान 2 = A.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. बॉक्स B, बॉक्स A के ठीक नीचे है → स्थान 3 = B.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. B और F के बीच केवल एक बॉक्स है → चूंकि स्थान 5 पर पहले से ही D है, इसलिए बॉक्स F स्थान 1 पर होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. बॉक्स G, बॉक्स E के ठीक ऊपर है → केवल स्थान 6 और 7 ही लगातार खाली हैं, इसलिए स्थान 6 = G और स्थान 7 = E.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. शेष बॉक्स C स्थान 4 पर होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ऊपर से नीचे का क्रम है: F (1), A (2), B (3), C (4), D (5), G (6), E (7)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः नीचे से दूसरे स्थान (स्थान 6) पर रखा गया बॉक्स </span><span style=\"font-weight:bold\">G</span><span> है।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़िए। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, भले ही यह सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत होती हो, तय कीजिए कि दिए गए निष्कर्षों में से कौन-सा/से निष्कर्ष कथनों का तार्किक रूप से अनुसरण करता है/करते हैं।</span></p>< :0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माना बाएं से दाएं 7 स्थान 1, 2, 3, 4, 5, 6, 7 हैं जो उत्तर की ओर अभिमुख हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. C के बाएं केवल दो व्यक्ति बैठे हैं, इसलिए C स्थान 3 पर बैठता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. C और G के बीच केवल दो व्यक्ति बैठे हैं। चूंकि C स्थान 3 पर है, इसलिए G स्थान 6 पर होना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. E, G के ठीक दाएं बैठा है, इसलिए E स्थान 7 पर बैठता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. D और B के बीच केवल एक व्यक्ति बैठा है, तथा D, B के बाएं बैठा है। शेष खाली स्थान 1, 2, 4 और 5 हैं। यह केवल तभी संभव है जब D स्थान 2 पर और B स्थान 4 पर बैठे।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. अब स्थान 1 और 5 रिक्त हैं। चूंकि A, D (स्थान 2) का निकटतम पड़ोसी नहीं है, इसलिए A स्थान 1 पर नहीं बैठ सकता। अतः A स्थान 5 पर और F स्थान 1 पर बैठेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बाएं से दाएं अंतिम व्यवस्था है: F, D, C, B, A, G, E।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B के दाएं बैठे व्यक्ति A, G और E हैं। अतः B के दाएं 3 व्यक्ति बैठे हैं।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K, L का पिता है। L, M की बहन है। N, R की माता है। R, M का पुत्र है। N का K से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><spa  "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिया गया शब्द REPUBLIC है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अक्षरों को बाएं से दाएं अंग्रेजी वर्णमाला के क्रम में व्यवस्थित करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B, C, E, I, L, P, R, U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बाईं ओर से तीसरा अक्षर </span><span style=\"font-weight:bold\">E</span><span> है (वर्णमाला में स्थान मान = 5)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दाईं ओर से पहला अक्षर </span><span style=\"font-weight:bold\">U</span><span> है (वर्णमाला में स्थान मान = 21)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंग्रेजी वर्णमाला शृंखला में E और U के बीच अक्षरों की संख्या = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795205929790_image108.png\" width=\"113\" height=\"21\" alt style=\"vertical-align:middle\" ><span> है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, सही उत्तर 15 है।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक निश्चित कूट भाषा में,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A + B' का अर्थ है 'A, B का पिता है',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A - B' का अर्थ है 'A, B की बहन है',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A × B' का अर्थ है 'A, B का भाई है', और</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A ÷ B' का अर्थ है 'A, B की माता है'।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>व्यंजक 'K - L + M × N' में K का N से क्या संबंध है?</span></p>", "option1": "<p
