<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>8.) MOCK-04 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>यह शून्य    हो जाता है।</span></span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>किसी वस्तु    का भार     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981696564_html_3a0ba5a91612cd28.gif\" >     होता है</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>जहाँ       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981696564_html_4d187224ad27976d.gif\" >     द्रव्यमान और     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981696564_html_1a7fe57513bafe99.gif\" >     गुरुत्वीय त्वरण है। गुरुत्वीय    त्वरण का मान     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981696564_html_d4bee28b5161b488.gif\" >     पर निर्भर करता है। पृथ्वी    एक लघ्वक्ष गोलाभ </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>चपटा    गोलाकार</span></span>) <span style=\"font-family:'Nirmala UI'\"><span>है</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>जिसके कारण    इसकी ध्रुवीय त्रिज्या    भूमध्यरेखीय त्रिज्या की    तुलना में कम होती है </span></span>(<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981696564_html_cd23722642942698.gif\" > )<span style=\"font-family:'Nirmala UI'\"><span>।    इसके अतिरिक्त</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>पृथ्वी    के घूर्णन का अपकेंद्रीय    प्रभाव ध्रुवों पर शून्य और    भूमध्य रेखा पर अधिकतम होता    है। परिणामस्वरूप</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>गुरुत्वीय    त्वरण </span></span>(<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981696564_html_1a7fe57513bafe99.gif\" > )    <span style=\"font-family:'Nirmala UI'\"><span>का मान    ध्रुवों पर अधिकतम और भूमध्य    रेखा पर न्यूनतम होता है</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>इसलिए वस्तु    को भूमध्य रेखा से ध्रुव पर    ले जाने पर उसका भार बढ़ता    है।</span></span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span><b>रक्त में    ग्लूकोज के स्तर को बढ़ाने    के लिए अग्न्याशय में लैंगरहैंस    की द्वीपिकाओं </b></span></span><b>(Islets    of Langerhans) </b><span style=\"font-family:'Nirmala UI'\"><span><b>की    अल्फा कोशिकाओं द्वारा    निम्नलिखित में से कौन सा    हार्मोन स्रावित होता है</b></span></span><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>इंसुलिन    </span></span>(Insulin)</p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>ग्लूकागन    </span></span>(Glucagon)</p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>सोमाटोस्टैटिन    </span></span>(Somatostatin)</p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>कोर्टिसोल    </span></span>(Cortisol)</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>ग्लूकागन    </span></span>(Glucagon) <span style=\"font-family:'Nirmala UI'\"><span>एक    पेप्टाइड हार्मोन है जो    अग्न्याशय में लैंगरहैंस    की द्वीपिकाओं की अल्फा </span></span>(<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981696564_html_538345c69bd85bc8.gif\" > )    <span style=\"font-family:'Nirmala UI'\"><span>कोशिकाओं    द्वारा स्रावित होता है।    इसका मुख्य कार्य यकृत में    ग्लाइकोजेनोलिसिस </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>ग्लाइकोजन    का ग्लूकोज में टूटना</span></span>)    <span style=\"font-family:'Nirmala UI'\"><span>और    ग्लूकोनियोजेनेसिस को    उत्तेजित करके रक्त में    ग्लूकोज के स्तर को बढ़ाना    है। इसके विपरीत</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>इंसुलिन    रक्त शर्करा को कम करने के    लिए बीटा </span></span>(<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981696564_html_bac29e8aa916a124.gif\" > )    <span style=\"font-family:'Nirmala UI'\"><span>कोशिकाओं    द्वारा और सोमाटोस्टैटिन    डेल्टा </span></span>(<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794981696564_html_ef1e439c7ba018c9.gif\" > )    <span style=\"font-family:'Nirmala UI'\"><span>कोशिकाओं    द्वारा स्रावित होता है।</span></span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span><b>निम्नलिखित    में से कौन सा भारतीय राज्य    म्यांमार के साथ अंतर्राष्ट्रीय    सीमा साझा नहीं करता है</b></span></span><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>नगालैंड</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>मणिपुर</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>त्रिपुरा</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>मिज़ोरम</span></span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>त्रिपुरा    म्यांमार के साथ अंतर्राष्ट्रीय    सीमा साझा नहीं करता है। भारत    म्यांमार के साथ </span></span>1,643 <span style=\"font-family:'Nirmala UI'\"><span>किमी    लंबी सीमा साझा करता है</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>जो चार    पूर्वोत्तर भारतीय राज्यों</span></span>:    <span style=\"font-family:'Nirmala UI'\"><span>अ span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span><b>किस मराठी    फिल्म को </b></span></span><b>99</b><span style=\"font-family:'Nirmala UI'\"><span><b>वें    अकादमी पुरस्कारों में    </b></span></span><b>'</b><span style=\"font-family:'Nirmala UI'\"><span><b>सर्वश्रेष्ठ    अंतर्राष्ट्रीय फीचर फिल्म</b></span></span><b>'    </b><span style=\"font-family:'Nirmala UI'\"><span><b>श्रेणी    के लिए भारत की आधिकारिक    प्रविष्टि के रूप में घोषित    किया गया था</b></span></span><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>चंदू चैंपियन</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>अंग</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>आर्टिकल    </span></span>370</p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>गोंधळ</span></span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    ● <span style=\"font-family:'Nirmala UI'\"><span>फिल्म    फेडरेशन ऑफ इंडिया </span></span>(FFI)    <span style=\"font-family:'Nirmala UI'\"><span>ने मराठी    लोक</span></span>-<span style=\"font-family:'Nirmala UI'\"><span>थ्रिलर    ‘गोंधळ’ को </span></span>99<span style=\"font-family:'Nirmala UI'\"><span>वें    अकादमी पुरस्कार </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>ऑस्कर    </span></span>2027) <span style=\"font-family:'Nirmala UI'\"><span>के    लिए भारत की आधिकारिक प्रविष्टि    के रूप में घोषित किया</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>जिसे </span></span>33    <span style=\"font-family:'Nirmala UI'\"><span>प्रतिस्पर्धी    शीर्षकों में से चुना गया।</span></span></p>    <p style=\"orphans:0;widows:0\">● <span style=\"font-family:'Nirmala UI'\"><span>नागा    फिल्म निर्माता थेजा रियो    की फिल्म ‘अंग’ ने अलग से    टोरंटो अंतर्राष्ट्रीय    फ़िल्म महोत्सव </span></span>(TIFF) <span style=\"font-family:'Nirmala UI'\"><span>में    प्लेटफॉर्म प्राइज </span></span>2026    <span style=\"font-family:'Nirmala UI'\"><span>जीता।</span></span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">7 cm आंतरिक व्यास वाले एक बेलनाकार पाइप से पानी 4 m/s की चाल से एक आयताकार टंकी में गिर रहा है, जिसके आधार की माप 11 m × 6 m है। कितने मिनट में टंकी में पानी का स्तर 21 cm बढ़ जाएगा? (π = 22/7 लीजिए)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>15</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>12</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>18</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>21</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>पाइप की त्रिज्या = 3.5 cm = 0.035 m। प्रति सेकंड बहने वाला पानी = πr² × चाल = 22/7 × 0.035 × 0.035 × 4 = 0.0154 m³। आवश्यक आयतन = 11 × 6 × 0.21 = 13.86 m³। समय = 13.86 ÷ 0.0154 = 900 सेकंड = 15 मिनट।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">एक कक्षा के 36 विद्यार्थियों का औसत वज़न 42 kg है। 6 विद्यार्थी, जिनका औसत वज़न 40 kg है, कक्षा छोड़ देते हैं और 9 नए विद्यार्थी कक्षा में आ जाते हैं। इसके परिणामस्वरूप कक्षा का औसत वज़न 43 kg हो जाता है। 9 नए विद्यार्थियों का औसत वज़न क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>44 kg</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>45 kg</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>46 kg</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>47.5 kg</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>प्रारंभिक कुल वज़न = 36 × 42 = 1,512 kg। जाने वाले 6 विद्यार्थियों का वज़न = 6 × 40 = 240 kg, अतः शेष 30 विद्यार्थियों का वज़न = 1,272 kg। नई संख्या = 30 + 9 = 39 विद्यार्थी, कुल वज़न = 39 × 43 = 1,677 kg। 9 नए विद्यार्थियों का वज़न = 1,677 − 1,272 = 405 kg। औसत = 405/9 = 45 kg।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">रमेश की मासिक आय में 20% और मासिक व्यय में 15% की वृद्धि होती है। परिणामस्वरूप उसकी मासिक बचत में 30% की वृद्धि होती है। यदि उसकी मासिक बचत में हुई वृद्धि ₹3,600 है, तो उसकी प्रारंभिक मासिक आय कितनी थी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹30,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹40,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹32,400</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹36,000</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>माना आय = I और व्यय = E, अतः बचत = I − E। नई बचत: 1.2I − 1.15E = 1.3(I − E) ⇒ 1.2I − 1.15E = 1.3I − 1.3E ⇒ 0.15E = 0.1I ⇒ E = (2/3)I। प्रारंभिक बचत = I − (2/3)I = I/3। बचत में वृद्धि = I/3 का 30% = 0.1I = ₹3,600 ⇒ I = ₹36,000।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">एक त्रिभुजाकार भूखंड की भुजाएँ 25 : 17 : 12 के अनुपात में हैं और इसका परिमाप 540 m है। भूखंड का क्षेत्रफल ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>9,000 m²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>10,800 m²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>8,400 m²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>9,600 m²</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>अनुपात के पदों का योग = 25 + 17 + 12 = 54, अतः एक भाग = 540/54 = 10 m। भुजाएँ = 250 m, 170 m और 120 m। s = 540/2 = 270 m। क्षेत्रफल = √(270 × 20 × 100 × 150) = √81,000,000 = 9,000 m²।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">पाइप A और B एक खाली टंकी को क्रमशः 20 मिनट और 30 मिनट में भर सकते हैं, जबकि पाइप C भरी हुई टंकी को 15 मिनट में खाली कर सकता है। पाइपों को एक-एक करके A, B, C के क्रम में ठीक 1-1 मिनट के लिए खोला जाता है और यह क्रम दोहराया जाता है। खाली टंकी कितने मिनट में पूरी भर जाएगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>165</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>180</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>167</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>170</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>3 मिनट के एक चक्र में: 1/20 + 1/30 − 1/15 = (3 + 2 − 4)/60 = टंकी का 1/60 भाग। एक चक्र के अंदर B के चलने के ठीक बाद जल-स्तर सबसे अधिक होता है (A और B मिलकर 5/60 भरते हैं)। टंकी तब भरेगी जब k/60 + 5/60 ≥ 1 हो, अर्थात् k = 55 पूर्ण चक्रों के बाद। 55 चक्रों (165 मिनट) के बाद टंकी 55/60 भरी होगी। फिर A 1 मिनट चलता है → 58/60, और B 1 मिनट चलता है → 60/60। कुल समय = 165 + 2 = 167 मिनट।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">यदि 2x + 3y = 13 और xy = 6 है, तो 8x³ + 27y³ का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>1,014</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>793</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>845</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>721</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>(2x + 3y)³ = 8x³ + 27y³ + 3(2x)(3y)(2x + 3y) = 8x³ + 27y³ + 18xy(2x + 3y)। अतः 8x³ + 27y³ = 13³ − 18 × 6 × 13 = 2,197 − 1,404 = 793।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">यदि x = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982234068_image001.png\" width=\"49\" height=\"32\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">और y = </span><span style=\"font-weight:bold\"> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982234068_image002.png\" width=\"49\" height=\"32\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> है, तो x² + xy + y² का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>22</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>26</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>24</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>23</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>xy = 1। x + y = [(√7 + √3)² + (√7 − √3)²]/(7 − 3) = [2(7 + 3)]/4 = 5। x² + y² = (x + y)² − 2xy = 25 − 2 = 23। अतः x² + xy + y² = 23 + 1 = 24।</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">चक्रवृद्धि ब्याज (वार्षिक संयोजित) पर निवेश की गई एक धनराशि 2 वर्षों में ₹28,090 और 3 वर्षों में ₹29,775.40 हो जाती है। धनराशि और ब्याज की दर ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹24,000 और 8%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹25,000 और 8%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹26,000 और 6%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹25,000 और 6%</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>तीसरे वर्ष का ब्याज = 29,775.40 − 28,090 = ₹1,685.40, जो ₹28,090 पर एक वर्ष का ब्याज है। दर = 1,685.40/28,090 × 100 = 6%। धनराशि = 28,090 ÷ (1.06)² = 28,090 ÷ 1.1236 = ₹25,000।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">दो रेलगाड़ियाँ एक ही समय पर स्टेशन P और Q से एक-दूसरे की ओर चलना आरंभ करती हैं। मिलने के बाद रेलगाड़ियाँ अपने गंतव्य Q और P तक पहुँचने में क्रमशः 9 घंटे और 16 घंटे लेती हैं। यदि P से चलने वाली रेलगाड़ी की चाल 64 km/h है, तो P और Q के बीच की दूरी कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>1,344 km</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>1,280 km</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>1,440 km</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>1,232 km</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>यदि मिलने के बाद रेलगाड़ियाँ t₁ और t₂ घंटे लेती हैं, तो (पहली की चाल) : (दूसरी की चाल) = √t₂ : √t₁ = √16 : √9 = 4 : 3। Q से चलने वाली रेलगाड़ी की चाल = 64 × 3/4 = 48 km/h। मिलने तक लगा समय = √(t₁ × t₂) = √(9 × 16) = 12 घंटे। दूरी PQ = (64 + 48) × 12 = 1,344 km।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">एक सम बहुभुज के प्रत्येक अंतः कोण और प्रत्येक बाह्य कोण का अनुपात 7 : 2 है। इस बहुभुज में कितने विकर्ण हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>27</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>20</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>35</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>44</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>अंतः कोण + बाह्य कोण = 180°। बाह्य कोण = 2/9 × 180° = 40°। भुजाओं की संख्या n = 360°/40° = 9। विकर्णों की संख्या = n(n − 3)/2 = 9 × 6/2 = 27।</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">एक धनराशि को दो भागों में बाँटा जाता है। पहला भाग 8% वार्षिक और दूसरा भाग 12% वार्षिक साधारण ब्याज पर उधार दिया जाता है। 4 वर्ष बाद कुल ब्याज ₹8,640 है। यदि ब्याज की दरें आपस में बदल दी जातीं, तो 4 वर्ष बाद कुल ब्याज ₹480 अधिक होता। कुल धनराशि ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹21,600</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹24,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹22,200</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹22,800</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>माना भाग a (8% पर) और b (12% पर) हैं। 4(0.08a + 0.12b) = 8,640 ⇒ 0.08a + 0.12b = 2,160। दरें आपस में बदलने पर: 4(0.12a + 0.08b) = 9,120 ⇒ 0.12a + 0.08b = 2,280। दोनों को जोड़ने पर: 0.20(a + b) = 4,440 ⇒ a + b = ₹22,200। (साथ ही a − b = 3,000, अतः a = ₹12,600 और b = ₹9,600।)</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">दो उम्मीदवारों के बीच हुए एक चुनाव में मतदाता सूची के 12% मतदाताओं ने मतदान नहीं किया, और डाले गए मतों में से 4% मत अवैध घोषित किए गए। विजेता उम्मीदवार को वैध मतों का 54% प्राप्त हुआ और वह 6,336 मतों के अंतर से जीता। मतदाता सूची में कुल मतदाताओं की संख्या ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>90,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>96,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>88,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>93,750</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>माना कुल मतदाता = V। डाले गए मत = 0.88V; वैध मत = 0.96 × 0.88V = 0.8448V। विजेता को वैध मतों का 54% और पराजित उम्मीदवार को 46% मिला, अतः अंतर = वैध मतों का 8% = 0.08 × 0.8448V = 0.067584V। 0.067584V = 6,336 ⇒ V = 93,750।</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">यदि a + b + c = 15 और ab + bc + ca = 71 है, तो a³ + b³ + c³ − 3abc का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>150</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>210</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>165</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>180</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>a² + b² + c² = (a + b + c)² − 2(ab + bc + ca) = 225 − 142 = 83। a³ + b³ + c³ − 3abc = (a + b + c)(a² + b² + c² − ab − bc − ca) = 15 × (83 − 71) = 15 × 12 = 180।</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">A और B, 1.5 km लंबे एक वृत्ताकार ट्रैक पर एक ही बिंदु से एक ही समय पर विपरीत दिशाओं में क्रमशः 15 km/h और 21 km/h की चाल से दौड़ना आरंभ करते हैं। कितने मिनट बाद वे पहली बार पुनः प्रारंभिक बिंदु पर मिलेंगे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>2.5 मिनट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>30 मिनट</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>42 मिनट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>15 मिनट</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>एक चक्कर का समय: A = 1.5/15 घंटे = 6 मिनट; B = 1.5/21 घंटे = 30/7 मिनट। वे प्रारंभिक बिंदु पर LCM(6, 30/7) = LCM(6, 30)/HCF(1, 7) = 30 मिनट बाद एक साथ होंगे। (जाँच: 30 मिनट में A 5 चक्कर और B 7 चक्कर पूरे करता है।)</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">एक बाल्टी शंकु के छिन्नक के आकार की है। इसके दोनों वृत्ताकार सिरों की त्रिज्याएँ 28 cm और 7 cm हैं, और इसकी ऊँचाई 45 cm है। बाल्टी की धारिता लीटर में कितनी है? (π = 22/7 लीजिए)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>52.38 लीटर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>45.36 लीटर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>48.51 लीटर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>50.82 लीटर</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>छिन्नक का आयतन = (πh/3)(R² + Rr + r²) = (22/7) × (45/3) × (28² + 28 × 7 + 7²) = (22/7) × 15 × (784 + 196 + 49) = (22/7) × 15 × 1,029 = 22 × 15 × 147 = 48,510 cm³ = 48.51 लीटर।</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">sin² 5° + sin² 10° + sin² 15° + … + sin² 85° + sin² 90° का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>9.5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>9</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>10</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>8.5</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>कोण 5°, 10°, …, 90° से कुल 18 पद बनते हैं। sin²θ को sin²(90° − θ) = cos²θ के साथ युग्मित करें: (5°, 85°), (10°, 80°), …, (40°, 50°) से 8 युग्म बनते हैं, जिनमें से प्रत्येक का मान 1 है। शेष पद sin² 45° = 1/2 और sin² 90° = 1 हैं। कुल = 8 + 1/2 + 1 = 9.5।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">एक व्यापारी दोषपूर्ण तराज़ू का प्रयोग करता है। खरीदते समय वह जितने वज़न का भुगतान करता है उससे 10% अधिक माल लेता है, और बेचते समय प्रत्येक 1 kg के स्थान पर केवल 900 g देता है। वह अपने माल पर क्रय मूल्य से 25% अधिक मूल्य अंकित करता है और अंकित मूल्य पर 10% की छूट देता है। उसका कुल लाभ प्रतिशत क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>37.5%</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>32.5%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>35%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>40%</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>माना 1 kg का क्रय मूल्य ₹100 है। खरीदते समय उसे ₹100 में 1100 g माल मिलता है, अतः 1 g का वास्तविक क्रय मूल्य = 100/1100 = ₹1/11। '1 kg' का विक्रय मूल्य = 100 × 1.25 × 0.90 = ₹112.50, परंतु वह वास्तव में केवल 900 g देता है, जिसका वास्तविक क्रय मूल्य = 900/11 ≈ ₹81.82। लाभ % = (112.50 ÷ (900/11) − 1) × 100 = (112.5 × 11/900 − 1) × 100 = (1.375 − 1) × 100 = 37.5%।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">A, B और C अकेले किसी कार्य को क्रमशः 10, 15 और 30 दिनों में पूरा कर सकते हैं। वे एक साथ कार्य आरंभ करते हैं, परंतु A कार्य पूरा होने से 2 दिन पहले और B कार्य पूरा होने से 3 दिन पहले कार्य छोड़ देता है। उन्हें इस कार्य के लिए कुल ₹6,000 मिलते हैं। यदि भुगतान किए गए कार्य के अनुपात में बाँटा जाता है, तो C का हिस्सा क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹1,600</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹1,400</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹2,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹1,200</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>माना कार्य T दिनों में पूरा होता है। A ने (T − 2) दिन, B ने (T − 3) दिन और C ने T दिन कार्य किया। (T − 2)/10 + (T − 3)/15 + T/30 = 1 ⇒ 3(T − 2) + 2(T − 3) + T = 30 ⇒ 6T − 12 = 30 ⇒ T = 7। किया गया कार्य: A = 5/10 = 15/30, B = 4/15 = 8/30, C = 7/30। C का हिस्सा = 7/30 × 6,000 = ₹1,400।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">एक नाव धारा के अनुकूल 36 km और धारा के प्रतिकूल 24 km की दूरी 7 घंटे में तय करती है। वह धारा के अनुकूल 54 km और धारा के प्रतिकूल 18 km की दूरी 7 घंटे 30 मिनट में भी तय करती है। नाव को धारा के प्रतिकूल 63 km जाने और वापस प्रारंभिक बिंदु तक आने में कितना समय लगेगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>14 घंटे 30 मिनट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>15 घंटे 45 मिनट</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>16 घंटे 15 मिनट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>15 घंटे</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>माना धारा के अनुकूल चाल = d और धारा के प्रतिकूल चाल = u। 36/d + 24/u = 7 और 54/d + 18/u = 7.5। 1/d = p और 1/u = q रखने पर: 36p + 24q = 7 और 54p + 18q = 7.5। पहले समीकरण को 3 से और दूसरे को 4 से गुणा करने पर: 108p + 72q = 21 और 216p + 72q = 30 ⇒ 108p = 9 ⇒ p = 1/12, अतः d = 12 km/h। फिर 24q = 7 − 3 = 4 ⇒ q = 1/6, अतः u = 6 km/h। समय = 63/6 + 63/12 = 10.5 + 5.25 = 15.75 घंटे = 15 घंटे 45 मिनट।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">यदि sec θ − tan θ = 1/7 है, जहाँ 0° &lt; θ &lt; 90°, तो </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982234068_image003.png\" width=\"82\" height=\"30\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>9/16</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>4/3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>16/9</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>25/9</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>चूँकि sec²θ − tan²θ = 1, इसलिए sec θ + tan θ = 7। दोनों समीकरणों को जोड़ने पर: 2 sec θ = 7 + 1/7 = 50/7 ⇒ sec θ = 25/7, अतः cos θ = 7/25। घटाने पर: 2 tan θ = 48/7 ⇒ tan θ = 24/7, अतः sin θ = 24/25। तब cosec θ = 25/24 और cot θ = 7/24। अभीष्ट मान = (32/24) ÷ (18/24) = 32/18 = 16/9।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">A और B मिलकर किसी कार्य को 24 दिनों में, B और C मिलकर 30 दिनों में, तथा C और A मिलकर 40 दिनों में पूरा कर सकते हैं। तीनों एक साथ कार्य आरंभ करते हैं। 10 दिन बाद C कार्य छोड़ देता है और उसके 4 दिन बाद B भी कार्य छोड़ देता है। कुल कितने दिनों में कार्य पूरा होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>30 दिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>34 दिन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>32 दिन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>36 दिन</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>(A + B) + (B + C) + (C + A) = 1/24 + 1/30 + 1/40 = (5 + 4 + 3)/120 = 1/10, अतः A + B + C प्रतिदिन 1/20 कार्य करते हैं। A = 1/20 − 1/30 = 1/60 और B = 1/20 − 1/40 = 1/40 प्रतिदिन। पहले 10 दिनों का कार्य = 10/20 = 1/2। अगले 4 दिनों में A + B का कार्य = 4/24 = 1/6। शेष कार्य = 1 − 1/2 − 1/6 = 1/3, जिसे A अकेला (1/3) ÷ (1/60) = 20 दिनों में करता है। कुल समय = 10 + 4 + 20 = 34 दिन।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">एक धनराशि 10% वार्षिक चक्रवृद्धि ब्याज (वार्षिक संयोजित) पर उधार ली जाती है और ₹13,310 की तीन समान वार्षिक किस्तों में चुकाई जाती है, जिसमें पहली किस्त पहले वर्ष के अंत में दी जाती है। उधार ली गई राशि ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹36,410</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹30,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹34,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹33,100</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>उधार ली गई राशि तीनों किस्तों के वर्तमान मूल्य के योग के बराबर होती है: 13,310/1.1 = 12,100; 13,310/(1.1)² = 11,000; 13,310/(1.1)³ = 10,000। उधार ली गई राशि = 12,100 + 11,000 + 10,000 = ₹33,100।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">ऐसी कितनी पाँच अंकों की संख्याएँ हैं जिन्हें 15, 20, 36 और 48 से भाग देने पर क्रमशः 9, 14, 30 और 42 शेषफल प्राप्त होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>124</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>125</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>126</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>138</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>प्रत्येक स्थिति में (भाजक − शेषफल) = 15 − 9 = 20 − 14 = 36 − 30 = 48 − 42 = 6 है। अतः संख्या N = k × LCM(15, 20, 36, 48) − 6। LCM = 2⁴ × 3² × 5 = 720, इसलिए N = 720k − 6। पाँच अंकों की संख्या के लिए: 10000 ≤ 720k − 6 ≤ 99999 ⇒ 13.9 ≤ k ≤ 138.9 ⇒ k = 14, 15, …, 138। ऐसी संख्याओं की संख्या = 138 − 14 + 1 = 125।</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">सात अंकों की संख्या 74x52y6, 72 से विभाज्य है, जहाँ x और y एक-अंकीय संख्याएँ हैं। (x × y) का अधिकतम संभव मान क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>27</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>45</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>32</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>35</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>72 = 8 × 9। 8 से विभाज्यता: अंतिम तीन अंकों से बनी संख्या 2y6, 8 से विभाज्य होनी चाहिए ⇒ 216, 256 और 296 संभव हैं, अतः y = 1, 5 या 9। 9 से विभाज्यता: अंकों का योग = 7 + 4 + x + 5 + 2 + y + 6 = 24 + x + y, 9 का गुणज होना चाहिए ⇒ x + y = 3 या 12। संभव युग्म: y = 1 ⇒ x = 2; y = 5 ⇒ x = 7; y = 9 ⇒ x = 3। गुणनफल x × y = 2, 35 और 27। अधिकतम = 35।</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">√(10 + √(25 + √(108 + √(154 + √225)))) का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>6</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>3.5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>4</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>सबसे भीतर वाले वर्गमूल से आरंभ करें: √225 = 15; √(154 + 15) = √169 = 13; √(108 + 13) = √121 = 11; √(25 + 11) = √36 = 6; √(10 + 6) = √16 = 4।</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">A, B और C, 3 : 4 : 5 के अनुपात में निवेश करके एक व्यवसाय आरंभ करते हैं। 4 महीने बाद A अपना निवेश दोगुना कर देता है। 6 महीने बाद B अपने निवेश का आधा भाग निकाल लेता है, और 8 महीने बाद C अपने निवेश का पाँचवाँ भाग निकाल लेता है। यदि वर्ष के अंत में कुल लाभ ₹1,14,000 है, तो B का हिस्सा क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹30,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹36,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹24,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>₹27,000</span></p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>निवेश को 3, 4 और 5 इकाई मानें। A: 3 × 4 + 6 × 8 = 60। B: 4 × 6 + 2 × 6 = 36। C: 5 × 8 + 4 × 4 = 56। लाभ का अनुपात = 60 : 36 : 56 = 15 : 9 : 14। B का हिस्सा = 9/38 × 1,14,000 = ₹27,000।</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">रोहित ने दो मोबाइल फ़ोन प्रत्येक ₹15,840 में बेचे। एक पर उसे 10% का लाभ हुआ और दूसरे पर 12% की हानि हुई। उसका कुल लाभ या हानि प्रतिशत क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>1% का लाभ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>1% की हानि</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>2.22% की हानि</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>2.22% का लाभ</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>पहले फ़ोन का क्रय मूल्य = 15,840 ÷ 1.10 = ₹14,400। दूसरे फ़ोन का क्रय मूल्य = 15,840 ÷ 0.88 = ₹18,000। कुल क्रय मूल्य = ₹32,400; कुल विक्रय मूल्य = 2 × 15,840 = ₹31,680। हानि = ₹720। हानि % = 720/32,400 × 100 = 2.22% (ठीक 2 2/9 %)।</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">75 m ऊँची एक मीनार के शिखर से, मीनार के विपरीत ओर उसके आधार के साथ एक सीधी रेखा में स्थित दो कारों के अवनमन कोण 30° और 60° हैं। दोनों कारों के बीच की दूरी कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>150 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>75√3 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>100√3 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>50√3 m</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>30° अवनमन कोण वाली कार की आधार से दूरी = 75/tan 30° = 75√3 m। 60° अवनमन कोण वाली कार की दूरी = 75/tan 60° = 75/√3 = 25√3 m। चूँकि कारें विपरीत ओर हैं, अतः उनके बीच की दूरी = 75√3 + 25√3 = 100√3 m (≈ 173.2 m)।</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">एक समलंब की समांतर भुजाएँ 25 cm और 11 cm हैं, और इसकी असमांतर भुजाएँ 15 cm और 13 cm हैं। समलंब का क्षेत्रफल ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>216 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>196 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>252 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>234 cm²</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>छोटी समांतर भुजा के एक सिरे से किसी असमांतर भुजा के समांतर एक रेखा खींचें। इससे 15 cm, 13 cm और 25 − 11 = 14 cm भुजाओं वाला एक त्रिभुज बनता है। हीरोन के सूत्र से s = (15 + 13 + 14)/2 = 21 और इसका क्षेत्रफल = √(21 × 6 × 8 × 7) = √7056 = 84 cm²। समलंब की ऊँचाई = 14 आधार पर इस त्रिभुज की ऊँचाई = 2 × 84/14 = 12 cm। समलंब का क्षेत्रफल = ½ × (25 + 11) × 12 = 216 cm²।</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span style=\"font-weight:bold\">एक परीक्षा में 30 विद्यार्थियों द्वारा प्राप्त अंक इस प्रकार हैं: 4 विद्यार्थियों ने 10, 7 विद्यार्थियों ने 20, 11 विद्यार्थियों ने 30, 6 विद्यार्थियों ने 40 और 2 विद्यार्थियों ने 50 अंक प्राप्त किए। अंकों के (माध्य + माध्यिका + बहुलक) का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>265/3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>87</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>260/3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>90</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><span>माध्य = (10 × 4 + 20 × 7 + 30 × 11 + 40 × 6 + 50 × 2)/30 = (40 + 140 + 330 + 240 + 100)/30 = 850/30 = 85/3। माध्यिका: n = 30, अतः माध्यिका 15वें और 16वें मानों का औसत है। संचयी बारंबारताएँ 4, 11, 22, 28, 30 हैं, अतः 15वाँ और 16वाँ दोनों मान 30 हैं ⇒ माध्यिका = 30। बहुलक = 30 (सबसे अधिक बारंबारता 11)। माध्य + माध्यिका + बहुलक = 85/3 + 30 + 30 = 265/3 (≈ 88.33)।</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">अंग्रेजी वर्णमाला क्रम के आधार पर निम्नलिखित चार अक्षर-समूहों में से तीन एक निश्चित तरीके से समान हैं और इस प्रकार एक समूह बनाते हैं। कौन-सा अक्षर-समूह उस समूह से संबंधित नहीं है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(नोट: असंगत अक्षर-समूह स्वरों/व्यंजनों की संख्या या उनकी स्थिति पर आधारित नहीं है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BDGL</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>JLOT</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MORX</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PRUZ</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रत्येक अक्षर-समूह में क्रमागत अक्षरों के bsite/bulk_uploader_images/1794982632583_image002.png\" width=\"29\" height=\"25\" alt ><span> R </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982632583_image004.png\" width=\"29\" height=\"25\" alt ><span> X</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MORX को छोड़कर अन्य सभी समूहों में अक्षरों के बीच (+2, +3, +5) का अंतर है, जबकि MORX में यह (+2, +3, +6) है। अतः, MORX असंगत अक्षर-समूह है।</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित शृंखला में प्रश्न-चिह्न (?) के स्थान पर कौन-सा अक्षर-समूह आएगा?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">BEG, EIL, HMQ, KQV, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NUA</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NVA</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NTA</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>OUB</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई शृंखला में निम्नलिखित पैटर्न का अनुसरण किया गया है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पहला अक्षर: B (+3) → E (+3) → H (+3) → K (+3) → </span><span style=\"font-weight:bold\">N</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दूसरा अक्षर: E (+4) → I (+4) → M (+4) → Q (+4) → </span><span style=\"font-weight:bold\">U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीसरा अक्षर: G (+5) → L (+5) → Q (+5) → V (+5) → </span><span style=\"font-weight:bold\">A</span><span> (22 ै। डिब्बा Q, डिब्बा T के ऊपर रखा गया है। डिब्बा Q और डिब्बा R के बीच कितने डिब्बे रखे गए हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कोई नहीं</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई जानकारी के अनुसार, ऊपर से नीचे (स्थान 5 से 1 तक) डिब्बों का क्रम इस प्रकार है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. डिब्बा P सबसे शीर्ष स्थान (स्थान 5) पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. P और S के बीच केवल दो डिब्बे हैं, इसलिए डिब्बा S स्थान 2 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. डिब्बा R, डिब्बा S के ठीक नीचे है, इसलिए डिब्बा R स्थान 1 (सबसे नीचे) पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. डिब्बा Q, डिब्बा T के ऊपर है, जिसका अर्थ है कि डिब्बा Q स्थान 4 पर और डिब्बा T स्थान 3 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शीर्ष से तल तक का पूरा क्रम: P, Q, T, S, R है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, डिब्बा Q और डिब्बा R के बीच </span><span style=\"font-weight:bold\">दो</span><span> डिब्बे (T और S) रखे गए हैं।</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक निश्चित कूट भाषा में,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A + B का अर्थ है कि ‘A, B का पिता है’,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A - B का अर्थ है कि ‘A, B की बहन है’,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A × B का अर्थ है कि ‘A, B का भाई है’ और</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A ÷ B का अर्थ है कि ‘A, B की पत्नी है’।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">यदि ‘M × N ÷ O + P - Q’ है, तो M का P से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>भाई</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पिता का भाई</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माता का भाई</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पिता</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिया गया व्यंजक: M × N ÷ O + P - Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. M × N → M, N का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. N ÷ O → N, O की पत्नी है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. O + P → O, P का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. P - Q → P, Q की बहन है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(2) और (3) से, चूंकि O, P का पिता है और N, O की पत्नी है, अतः N, P की माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(1) से, M, N (P की माता) का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, M, P की माता का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794982632583_image014.jpeg\" width=\"458\" height=\"230\" alt ></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">सात व्यक्ति, P, Q, R, S, T, U और V, एक सीधी पंक्ति में उत्तर की ओर अभिमुख होकर बैठे हैं। T के बाएं केवल दो व्यक्ति बैठे हैं। T और Q के बीच केवल दो व्यक्ति बैठे हैं। U, Q के ठीक दाएं बैठा है। R, P के बाएं दूसरे स्थान पर बैठा है। S, R के ठीक बाएं बैठा है। पंक्ति के दाएं छोर से तीसरे स्थान पर कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मान लीजिए कि बाएं से दाएं पंक्ति के सात स्थान 1, 2, 3, 4, 5, 6 और 7 हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. T के बाएं केवल दो व्यक्ति बैठे हैं, अर्थात T स्थान 3 पर बैठता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. T और Q के बीच केवल दो व्यक्ति बैठे हैं, इसलिए Q स्थान 6 पर होना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. U, Q के ठीक दाएं बैठा है, इसलिए U स्थान 7 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. R, P के बाएं दूसरे स्थान पर बैठा है। R और P के लिए एकमात्र रिक्त स्थान R के लिए स्थान 2 और P के लिए
