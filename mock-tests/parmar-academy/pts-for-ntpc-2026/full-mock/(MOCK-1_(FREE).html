<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>1.) MOCK-1 (FREE - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

<script>

const questions = [{"sr_no": 1, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Part of the Indian Constitution deals with the relations    between the Union and the States?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Part IX</p>", "option2": " <p style=\"orphans:0;widows:0\">    Part XI</p>", "option3": " <p style=\"orphans:0;widows:0\">    Part XIV</p>", "option4": " <p style=\"orphans:0;widows:0\">    Part XVIII</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Part XI of the Indian Constitution (Articles 245 to 263) deals    with the relations between the Union and the States. It is divided    into Chapter I (Legislative Relations, Articles 245–255) and    Chapter II (Administrative Relations, Articles 256–263).</p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following Buddhist cave sites houses the largest    and best-preserved rock-cut Chaitya (prayer hall) in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Bhaja Caves</p>", "option2": " <p style=\"orphans:0;widows:0\">    Karla Caves</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kanheri Caves</p>", "option4": " <p style=\"orphans:0;widows:0\">    Bedse Caves</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Great Chaitya at the Karla Caves (near Lonavala, Maharashtra)    is the largest and most well-preserved rock-cut Buddhist chaitya    hall in India. It was excavated during the Satavahana period    around the 1st to 2nd century CE and is dedicated to the Hinayana    tradition of Buddhism.</p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following northeastern states is NOT covered under    the Sixth Schedule of the Indian Constitution?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Assam</p>", "option2": " <p style=\"orphans:0;widows:0\">    Manipur</p>", "option3": " <p style=\"orphans:0;widows:0\">    Tripura</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mizoram</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Sixth Schedule of the Indian Constitution provides for the    administration of tribal areas in four northeastern states: <b>Assam,    Meghalaya, Tripura, and Mizoram</b> (Articles 244(2) and 275(1)).    Manipur is not covered under the Sixth Schedule.</p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>With reference to the Anti-Defection Law under the Tenth    Schedule of the Indian Constitution, consider the following    statements:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. An independently elected member becomes disqualified to    remain a member of the House if they join any political party    after election.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. A nominated member of the House becomes disqualified if they    join any political party after the expiry of six months from    taking their seat.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. The decision of the Presiding Officer on disqualification    under the Tenth Schedule is final and cannot be subjected to    judicial review under any circumstances.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statements 1 and 2 are correct, while statement 3 is incorrect.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Under    Paragraph 2(2) of the Tenth Schedule, an independent member of a    House becomes disqualified if they join any political party after    the election.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Under    Paragraph 2(3) of the Tenth Schedule, a nominated member is    disqualified if they join any political party after the expiry of    six months from the date on which they take their seat.</p>    <p style=\"orphans:0;widows:0\">3. In the landmark judgment    <i>Kihoto Hollohan v. Zachillhu and Others (1992)</i>, the Supreme    Court declared that the Speaker/Chairman acts as a tribunal while    deciding cases of defection, and hence the decision is subject to    judicial review on grounds of mala fides, perversity, or violation    of natural justice.</p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0\">    <b>Among the halogens, fluorine and chlorine are gases, bromine is    a liquid, and iodine is a solid at room temperature. What is the    primary reason for this change in physical state down the group?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Decrease in atomic radius down the group</p>", "option2": " <p style=\"orphans:0;widows:0\">    Increase in the strength of van der Waals forces</p>", "option3": " <p style=\"orphans:0;widows:0\">    Formation of intramolecular hydrogen bonds</p>", "option4": " <p style=\"orphans:0;widows:0\">    Decrease in molecular weight down the group</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    As we move down the halogen group from fluorine to iodine, the    size of the atoms and the total number of electrons in the    diatomic molecules increase. This increases the polarizability of    the molecules, resulting in stronger van der Waals (London    dispersion) forces between them. Due to these progressively    stronger intermolecular attractions, the physical state shifts    from gas (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793889398326_html_3c79fb4e5532a5ac.gif\" > ,       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793889398326_html_8232d6dc62d18d6e.gif\" > )    to liquid (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793889398326_html_36ac3f82abfdeb9a.gif\" > )    and then to solid (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793889398326_html_9a4895566e3d2a41.gif\" > )    at room temperature.</p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following Indus Valley Civilization sites was    almost exclusively devoted to craft production, such as    bead-making and seal-making, and lacked a fortified citadel?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Kalibangan</p>", "option2": " <p style=\"orphans:0;widows:0\">    Chanhudaro</p>", "option3": " <p style=\"orphans:0;widows:0\">    Lothal</p>", "option4": " <p style=\"orphans:0;widows:0\">    Surkotada</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Chanhudaro, located in Sindh (Pakistan), was a major craft    production centre of the Harappan civilization devoted to    bead-making, shell-cutting, metal-working, and seal-making. It is    also distinguished as the only Harappan city that had no fortified    citadel.</p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following statements is correct regarding the    propagation of a longitudinal sound wave through air?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Compressions are regions of low pressure and high density.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Rarefactions are regions of low pressure and low density.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Compressions are regions of low pressure and low density.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Rarefactions are regions of high pressure and low density.</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Sound travels in air as a longitudinal wave consisting of    alternating compressions and rarefactions. In a compression,    vibrating particles are pushed close together, creating a region    of high pressure and high density. In a rarefaction, the particles    spread farther apart, creating a region of low pressure and low    density. Therefore, the statement that rarefactions are regions of    low pressure and low density is correct.</p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following is the central core of an operating    system that acts as an interface between application programs and    the computer hardware?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Shell</p>", "option2": " <p style=\"orphans:0;widows:0\">    Kernel</p>", "option3": " <p style=\"orphans:0;widows:0\">    Compiler</p>", "option4": " <p style=\"orphans:0;widows:0\">    Cache</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The <b>Kernel</b> is the foundational core of an operating system.    It operates at the lowest level of software and serves as the    primary bridge/interface between applications and the computer    hardware, managing critical resources such as the CPU, memory, and    input/output devices. In contrast, the <i>Shell</i> is the    outermost layer that takes user commands and communicates them to    the kernel.</p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following valleys is situated between the Great    Himalayas and the Pir Panjal Range?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Kullu Valley</p>", "option2": " <p style=\"orphans:0;widows:0\">    Kashmir Valley</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kangra Valley</p>", "option4": " <p style=\"orphans:0;widows:0\">    Doon Valley</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Kashmir Valley is a structural intermontane valley situated    between the Great Himalayas (to the northeast) and the Pir Panjal    Range of the Lesser Himalayas (to the southwest). It is well known    for its lacustrine deposits called Karewas, which are ideal for    the cultivation of Zafran (saffron).</p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following founded the 'Depressed Classes Mission    Society of India' in Bombay in 1906?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Dr. B. R. Ambedkar</p>", "option2": " <p style=\"orphans:0;widows:0\">    Vitthal Ramji Shinde</p>", "option3": " <p style=\"orphans:0;widows:0\">    Jyotirao Phule</p>", "option4": " <p style=\"orphans:0;widows:0\">    E. V. Ramasamy</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The 'Depressed Classes Mission Society of India' was founded by    Maharshi Vitthal Ramji Shinde in Bombay on 18 October 1906. Its    objective was to eradicate untouchability, provide educational and    employment opportunities, and improve the living conditions of the    depressed classes in India. In contrast, Dr. B. R. Ambedkar    founded the 'Bahishkrit Hitakarini Sabha' later in 1924.</p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0\">    <b>According to Census 2011, which of the following states    recorded the highest population density in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    West Bengal</p>", "option2": " <p style=\"orphans:0;widows:0\">    Uttar Pradesh</p>", "option3": " <p style=\"orphans:0;widows:0\">    Bihar</p>", "option4": " <p style=\"orphans:0;widows:0\">    Kerala</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    According to Census 2011, Bihar has the highest population density    among all Indian states with 1,106 persons per square kilometre.    It surpassed West Bengal, which recorded a density of 1,028    persons per square kilometre. Arunachal Pradesh has the lowest    population density among states with only 17 persons per square    kilometre.</p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0\">    <b>The famous Uttaramerur inscription, which provides    comprehensive details regarding the qualifications for assembly    members, committee systems (variyam), and local self-government,    belongs to the reign of which Chola monarch?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Rajaraja I</p>", "option2": " <p style=\"orphans:0;widows:0\">    Parantaka I</p>", "option3": " <p style=\"orphans:0;widows:0\">    Rajendra I</p>", "option4": " <p style=\"orphans:0;widows:0\">    Vijayalaya</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The famous Uttaramerur inscriptions (dated 919 CE and 921 CE)    found in the Vaikunta Perumal Temple at Uttaramerur (in modern-day    Kanchipuram district, Tamil Nadu) belong to the reign of the Chola    king <b>Parantaka I</b>. These inscriptions provide an    extraordinary and detailed account of the local self-government,    the constitution of the village assembly (Sabha), qualifications    and disqualifications for members, and the election of various    administrative committees (Variyams) using the unique 'Kudavolai'    (lot/pot-ticket) system.</p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following archaeological artifacts discovered at    the Harappan port-city of Lothal provides direct evidence of its    maritime trade contact with the Persian Gulf region?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Large stone inscription containing ten signs</p>", "option2": " <p style=\"orphans:0;widows:0\">    Circular button-shaped 'Persian Gulf' seal</p>", "option3": " <p style=\"orphans:0;widows:0\">    Terracotta model of a plough</p>", "option4": " <p style=\"orphans:0;widows:0\">    Bronze figurine of a dancing girl</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    A circular button-shaped steatite seal, identical to those used in    the Persian Gulf sites (such as Dilmun/Bahrain and Failaka), was    discovered at Lothal. This artifact provides direct archaeological    evidence of commercial and maritime trade contacts between the    Harappan port of Lothal and contemporary civilizations of the    Persian Gulf and Mesopotamia.</p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Part of the Indian Constitution deals with the Emergency    Provisions?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Part XV</p>", "option2": " <p style=\"orphans:0;widows:0\">    Part XVII</p>", "option3": " <p style=\"orphans:0;widows:0\">    Part XVIII</p>", "option4": " <p style=\"orphans:0;widows:0\">    Part XX</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Part XVIII of the Indian Constitution (Articles 352 to 360) deals    with Emergency Provisions. These include National Emergency    (Article 352), State Emergency or President's Rule (Article 356),    and Financial Emergency (Article 360). Part XV deals with    Elections, Part XVII deals with Official Languages, and Part XX    deals with the Amendment of the Constitution.</p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0\">    <b>In computer hardware, what does the abbreviation \"CMOS\"    stand for, which refers to the battery-backed memory chip on the    motherboard that stores system configuration and BIOS settings?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Central Management Operating System</p>", "option2": " <p style=\"orphans:0;widows:0\">    Complementary Metal-Oxide-Semiconductor</p>", "option3": " <p style=\"orphans:0;widows:0\">    Computerized Modular Output System</p>", "option4": " <p style=\"orphans:0;widows:0\">    Core Micro-Optic Semiconductor</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    CMOS stands for <b>Complementary Metal-Oxide-Semiconductor</b>. In    personal computers, CMOS refers to an onboard battery-powered    semiconductor chip (often powered by a small coin cell battery    such as CR2032) that stores critical system hardware setup    parameters, date, time, and basic BIOS/UEFI configuration settings    even when the main power is turned off.</p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    <b>In which year was the National Policy for Farmers approved by    the Government of India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    2003</p>", "option2": " <p style=\"orphans:0;widows:0\">    2005</p>", "option3": " <p style=\"orphans:0;widows:0\">    2007</p>", "option4": " <p style=\"orphans:0;widows:0\">    2011</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Government of India approved the National Policy for Farmers    in <b>2007</b>. The policy was formulated based on the    recommendations of the National Commission on Farmers, chaired by    Prof. M.S. Swaminathan, with a primary focus on the economic    well-being of farmers rather than just production targets.</p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following Gupta-era temples is notable for being    constructed entirely of baked bricks and terracotta?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Vishnu Temple, Tigawa</p>", "option2": " <p style=\"orphans:0;widows:0\">    Bhitargaon Temple, Kanpur</p>", "option3": " <p style=\"orphans:0;widows:0\">    Shiva Temple, Bhumara</p>", "option4": " <p style=\"orphans:0;widows:0\">    Parvati Temple, Nachna Kuthara</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Bhitargaon Temple, located in Kanpur district of Uttar    Pradesh, is a 5th-century Gupta-period temple. It is one of the    oldest surviving terracotta and brick Hindu temples in India with    a prominent shikhara and arched niches.</p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    <b>Which feature of modular programming allows developers to use    pre-written and tested blocks of code in multiple programs without    writing them again?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Code Redundancy</p>", "option2": " <p style=\"orphans:0;widows:0\">    Code Reusability</p>", "option3": " <p style=\"orphans:0;widows:0\">    Data Encapsulation</p>", "option4": " <p style=\"orphans:0;widows:0\">    Software Piracy</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Code reusability is a key advantage of modular programming. It    refers to the practice of using existing software components,    modules, or functions across different programs or different parts    of the same program without rewriting them, which saves    development time and reduces bugs.</p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <b>Under the 'Doctrine of Lapse' policy formulated by Lord    Dalhousie, which of the following princely states was the first to    be annexed by the British?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Jhansi</p>", "option2": " <p style=\"orphans:0;widows:0\">    Nagpur</p>", "option3": " <p style=\"orphans:0;widows:0\">    Satara</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sambalpur</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Satara was the first princely state to be annexed by    Governor-General Lord Dalhousie under the Doctrine of Lapse in    1848. According to this doctrine, any Indian princely state under    the suzerainty of the British East India Company would    automatically be annexed if the ruler died without a natural male    heir. Later, other states like Jaitpur and Sambalpur (1849),    Baghat (1850), Udaipur (1852), Jhansi (1853), and Nagpur (1854)    were also annexed under this policy.</p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <b>Under the Dual System of Government introduced in Bengal in    1765, the 'Diwani' rights acquired by the British East India    Company primarily involved the:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    maintenance of police and administration of criminal justice</p>", "option2": " <p style=\"orphans:0;widows:0\">    command of military forces and external defence</p>", "option3": " <p style=\"orphans:0;widows:0\">    collection of revenues and administration of civil justice</p>", "option4": " <p style=\"orphans:0;widows:0\">    supervision of religious endowments and municipal governance</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Following the Treaty of Allahabad (1765), Robert Clive established    the Dual System of Government in Bengal. Under this arrangement,    the administration was divided into two distinct components:    <b>Diwani</b> and <b>Nizamat</b>. The Mughal Emperor granted the    'Diwani' rights directly to the British East India Company,    empowering it to collect revenues and administer civil justice in    Bengal, Bihar, and Orissa. In contrast, the 'Nizamat' functions,    which included police duties, general administration, and criminal    justice, nominally remained with the Nawab.</p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <b>Prolonged exposure to which of the following fibrous minerals    is the primary cause of mesothelioma, an aggressive type of cancer    affecting the lining of internal organs such as the lungs?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Asbestos</p>", "option2": " <p style=\"orphans:0;widows:0\">    Silica</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mica</p>", "option4": " <p style=\"orphans:0;widows:0\">    Talc</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Mesothelioma is a rare and aggressive form of cancer that develops    in the mesothelium, the thin layer of tissue covering internal    organs (most commonly the pleura surrounding the lungs).    Inhalation or ingestion of microscopic <b>asbestos</b> fibers    causes chronic inflammation, cellular scarring, and genetic damage    over decades, making asbestos exposure the predominant cause of    this disease.</p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <b>Under the provisions of Part IX of the Constitution of India,    who has the authority to make laws authorising a Panchayat to    levy, collect, and appropriate taxes, duties, tolls, and fees?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Governor of the State</p>", "option2": " <p style=\"orphans:0;widows:0\">    State Legislature</p>", "option3": " <p style=\"orphans:0;widows:0\">    Parliament of India</p>", "option4": " <p style=\"orphans:0;widows:0\">    State Finance Commission</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    According to Article 243H of the Constitution of India, the    Legislature of a State may, by law, authorise a Panchayat to levy,    collect, and appropriate taxes, duties, tolls, and fees, and also    assign to a Panchayat such taxes and duties levied and collected    by the State Government.</p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <b>In the Balance of Payments (BoP) of a country, Foreign Direct    Investment (FDI) inflows are recorded under which of the following    categories?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Current Account – Debit</p>", "option2": " <p style=\"orphans:0;widows:0\">    Capital Account – Credit</p>", "option3": " <p style=\"orphans:0;widows:0\">    Current Account – Credit</p>", "option4": " <p style=\"orphans:0;widows:0\">    Capital Account – Debit</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Foreign Direct Investment (FDI) involves the purchase of domestic    assets by foreign entities, leading to a change in the    international asset/liability status of a nation. Since it affects    asset ownership, it is part of the Capital Account. Furthermore,    any transaction that brings foreign exchange into the country is    recorded as a credit item. Hence, FDI inflows are recorded as a    Credit in the Capital Account.</p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <b>In May 2016, the Government of India constituted a committee to    review the Fiscal Responsibility and Budget Management (FRBM) Act.    Who was the chairman of this committee?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Y. V. Reddy</p>", "option2": " <p style=\"orphans:0;widows:0\">    N. K. Singh</p>", "option3": " <p style=\"orphans:0;widows:0\">    Bimal Jalan</p>", "option4": " <p style=\"orphans:0;widows:0\">    C. Rangarajan</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Government of India constituted a five-member committee in May    2016 under the chairmanship of N. K. Singh to review the working    of the Fiscal Responsibility and Budget Management (FRBM) Act,    2003 and recommend a future fiscal consolidation roadmap.</p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following is the chemical name of Vitamin B2, an    essential water-soluble vitamin belonging to the vitamin B    complex?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Thiamin</p>", "option2": " <p style=\"orphans:0;widows:0\">    Riboflavin</p>", "option3": " <p style=\"orphans:0;widows:0\">    Niacin</p>", "option4": " <p style=\"orphans:0;widows:0\">    Pyridoxine</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Riboflavin is the scientific/chemical name for Vitamin B2. It is a    water-soluble vitamin that plays a vital role as a component of    coenzymes (FMN and FAD) involved in cellular energy production,    metabolism of fats, and cellular function. Thiamin is Vitamin B1,    Niacin is Vitamin B3, and Pyridoxine is Vitamin B6.</p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0\">    <b>The Directive Principles of State Policy incorporated in Part    IV of the Indian Constitution primarily aim to establish which    form of democracy?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Political democracy</p>", "option2": " <p style=\"orphans:0;widows:0\">    Social and economic democracy</p>", "option3": " <p style=\"orphans:0;widows:0\">    Direct participatory democracy</p>", "option4": " <p style=\"orphans:0;widows:0\">    Oligarchic democracy</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Directive Principles of State Policy (DPSP) enshrined in Part    IV (Articles 36–51) aim at realizing social and economic    democracy and establishing a welfare state in India. In contrast,    Fundamental Rights (Part III) are primarily aimed at establishing    political democracy by protecting individual civil liberties    against arbitrary state action.</p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0\">    <b>In Windows File Explorer, which of the following wildcard    search patterns is used to find all files of any format whose    names start with \"Data\" followed by exactly one single    character?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Data*.*</p>", "option2": " <p style=\"orphans:0;widows:0\">    Data?.*</p>", "option3": " <p style=\"orphans:0;widows:0\">    Data#.*</p>", "option4": " <p style=\"orphans:0;widows:0\">    Data_.*</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In Windows file searching, wildcard characters are used as    placeholders: 1. The asterisk (*) represents zero or more    characters. 2. The question mark (?) represents exactly one single    character. Therefore, Data?.* searches for any file whose name    begins with \"Data\", followed by exactly one character,    having any file extension (e.g., Data1.docx, DataA.xlsx).</p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0\">    <b>In the context of Indian classical music, the term \"Dhrupad\"    literally signifies which of the following?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Melodic improvisation</p>", "option2": " <p style=\"orphans:0;widows:0\">    Fixed or structured verse</p>", "option3": " <p style=\"orphans:0;widows:0\">    Light romantic song</p>", "option4": " <p style=\"orphans:0;widows:0\">    Rapid rhythmic cycle</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The word \"Dhrupad\" is derived from two Sanskrit words:    \"Dhruva\", meaning fixed, firm, or steadfast, and \"Pada\",    meaning verse or poetic composition. Therefore, it literally    signifies a fixed or structured verse. It is one of the oldest    surviving forms of Hindustani classical vocal music.</p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0\">    <b>The coastal region of Kerala is commonly known by which of the    following names?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Coromandel Coast</p>", "option2": " <p style=\"orphans:0;widows:0\">    Malabar Coast</p>", "option3": " <p style=\"orphans:0;widows:0\">    Konkan Coast</p>", "option4": " <p style=\"orphans:0;widows:0\">    Utkal Coast</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The coastal plain of Kerala along the southwestern part of India    is known as the Malabar Coast. In contrast, the Konkan Coast lies    along Maharashtra and Goa, the Coromandel Coast lies along Tamil    Nadu and southern Andhra Pradesh, and the Utkal Coast lies along    Odisha.</p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following Gharanas of Hindustani classical music    is primarily known for Khayal singing?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Banaras Gharana</p>", "option2": " <p style=\"orphans:0;widows:0\">    Kirana Gharana</p>", "option3": " <p style=\"orphans:0;widows:0\">    Lucknow Gharana</p>", "option4": " <p style=\"orphans:0;widows:0\">    Jaipur-Atrauli Gharana</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    It is famous for its melodious tonal treatment and precision of    notes.</p>    <p style=\"orphans:0;widows:0\">Notable exponents include Abdul    Karim Khan and Bhimsen Joshi.</p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding National Technology    Day:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. The day is observed annually on May 11 to commemorate the    success of the Pokhran-I nuclear tests.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. The 1998 nuclear tests were conducted under the code name    'Operation Shakti'.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. The official theme for the year 2026 is \"Responsible    Innovation for Inclusive Growth\".</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2, and 3</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statement 1 is incorrect: National Technology Day commemorates the    success of the Pokhran-II nuclear tests conducted on 11 May 1998,    not Pokhran-I.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Statement 2    is correct: The 1998 nuclear tests were conducted under the    codename 'Operation Shakti' at Pokhran, Rajasthan.</p>    <p style=\"orphans:0;widows:0\">Statement 3 is correct: The given    2026 theme is \"Responsible Innovation for Inclusive Growth\".</p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0\">    <b>Where will the main celebration of the 12th International Day    of Yoga (IDY) 2026 be held?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    New Delhi</p>", "option2": " <p style=\"orphans:0;widows:0\">    Rishikesh</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kolkata</p>", "option4": " <p style=\"orphans:0;widows:0\">    Bengaluru</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Union Minister of State Prataprao Jadhav announced that the 2026    International Day of Yoga (21 June) will be centered in Kolkata,    West Bengal, with the designated theme of \"Yoga for Healthy    Ageing.\"</p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0\">    <b>Under India’s BRICS Chairship for 2026, which city hosted the    BRICS Youth Entrepreneurship Working Group Meeting?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    New Delhi</p>", "option2": " <p style=\"orphans:0;widows:0\">    Mumbai</p>", "option3": " <p style=\"orphans:0;widows:0\">    Indore</p>", "option4": " <p style=\"orphans:0;widows:0\">    Bengaluru</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Department of Youth Affairs, Ministry of Youth Affairs and    Sports, organized the BRICS Youth Entrepreneurship Working Group    Meeting in Indore as part of India’s BRICS Chairship for 2026,    aimed at fostering collaboration among youth innovators across    BRICS nations</p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following is India’s first operational and    functional PM MITRA Park, developed under the Government's 5F    vision in Warangal, Telangana?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Mega Textile Hub (MTH)</p>", "option2": " <p style=\"orphans:0;widows:0\">    Kakatiya Mega Textile Park (KMTP)</p>", "option3": " <p style=\"orphans:0;widows:0\">    Telangana Integrated Textile Zone</p>", "option4": " <p style=\"orphans:0;widows:0\">    Bharat Textile Manufacturing Park</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Kakatiya Mega Textile Park (KMTP) in Warangal, Telangana, has    been inaugurated as India's first operational PM MITRA Park,    constructed at a cost of ₹1,695.54 crore to align with the '5F'    (Farm to Fibre to Factory to Fashion to Foreign) vision.</p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\">    <b>Union Minister of Health and Family Welfare Jagat Prakash Nadda    addressed the plenary session of which event in Geneva,    Switzerland, where he reiterated India’s commitment to \"Health    for All\"?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    77th World Health Assembly</p>", "option2": " <p style=\"orphans:0;widows:0\">    78th World Health Assembly</p>", "option3": " <p style=\"orphans:0;widows:0\">    79th World Health Assembly</p>", "option4": " <p style=\"orphans:0;widows:0\">    80th World Health Assembly</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Union Health Minister J.P. Nadda addressed the plenary session of    the 79th World Health Assembly (WHA) in Geneva. His address    emphasized India’s dedication to building equitable, inclusive,    and people-centric healthcare systems globally, in alignment with    the \"Health for All\" principle.</p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0\">    <b>Which country recently became the 26th member to join the    India-led International Big Cat Alliance (IBCA)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    United Arab Emirates</p>", "option2": " <p style=\"orphans:0;widows:0\">    Saudi Arabia</p>", "option3": " <p style=\"orphans:0;widows:0\">    Qatar</p>", "option4": " <p style=\"orphans:0;widows:0\">    Oman</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Saudi Arabia has officially joined the India-led International Big    Cat Alliance (IBCA), becoming the 26th nation to commit to the    protection and conservation of the world’s seven major big cats:    tiger, lion, leopard, snow leopard, puma, jaguar, and cheetah.</p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the 2026 Italian    Open:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Jannik Sinner became the first Italian man to win the    Italian Open singles title since Adriano Panatta in 1976.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. By winning the title, Jannik Sinner became the first man in    tennis history to complete the \"Career Golden Masters.\"</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. The women's singles title was won by Elina Svitolina, who    defeated runner-up Coco Gauff.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2, and 3</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Statement 1 is correct; Sinner matched Adriano Panatta's 1976    feat. Statement 3 is also correct regarding the women's singles    results. Statement 2 is incorrect because, while Sinner did    complete his Career Golden Masters, he is the second man to do so,    joining Novak Djokovic, who remains the first</p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding recent senior    government appointments:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Bharat Khera has assumed charge as the Secretary of the    Ministry of Micro, Small and Medium Enterprises (MSME).</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. Dr. R. Balasubramaniam and Dr. Joram Aniya have been    appointed as full-time members of NITI Aayog.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both 1 and 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Both statements are correct. Bharat Khera (1995-batch IAS) took    charge as the Secretary, Ministry of MSME, in May 2026.    Additionally, Dr. R. Balasubramaniam and Dr. Joram Aniya were    appointed as full-time members of NITI Aayog, a move which the    Prime Minister noted would strengthen the institution's    policymaking and innovation efforts. Nidhi Chhibber serves as the    Chief Executive Officer (CEO) of NITI Aayog.</p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0\">    <b>The second edition of the India-Cambodia Bilateral Military    Exercise, CINBAX-II 2026, was recently concluded. In which country    was this joint military exercise held?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    India</p>", "option2": " <p style=\"orphans:0;widows:0\">    Cambodia</p>", "option3": " <p style=\"orphans:0;widows:0\">    Vietnam</p>", "option4": " <p style=\"orphans:0;widows:0\">    Thailand</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The second edition of the India-Cambodia Bilateral Military    Exercise, known as CINBAX-II 2026, was successfully concluded in    Cambodia. The exercise focused on strengthening military    cooperation, interoperability, and sharing best practices in    counter-insurgency and humanitarian assistance operations.</p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0\">    <b>The Indian Coast Guard recently commissioned ICGS Achal, a    new-generation vessel, at Goa Shipyard Limited. To which series of    Fast Patrol Vessels (FPV) does this ship belong?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Veera-class</p>", "option2": " <p style=\"orphans:0;widows:0\">    Adamya-class</p>", "option3": " <p style=\"orphans:0;widows:0\">    Rajshree-class</p>", "option4": " <p style=\"orphans:0;widows:0\">    Priyadarshini-class</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    ICGS Achal is the latest vessel commissioned into the Indian Coast    Guard, belonging to the Adamya-class of Fast Patrol Vessels. Its    commissioning at Goa Shipyard Limited marks a strategic boost to    the Coast Guard’s surveillance and patrol capabilities along the    Indian coastline.</p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Study the following alphanumeric and symbol series carefully and answer the question. Counting is to be done from left to right only.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(Left) $ B 4 # D E 7 @ F 9 % H J 3 &amp; K 5 * P 8 ! T (Right)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">How many such letters are there, each of which is immediately preceded by a symbol and immediately followed by a number?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>We need to find the pattern: </span><span style=\"font-weight:bold\">Symbol – Letter – Number</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Scanning the series from left to right:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793899593034_image001.png\" width=\"93\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">$), Letter (B), Number (4) — (Valid)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. # D E → followed by letter (E), not a number — (Invalid)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3. D E 7→ preceded by letter (D), not a symbol — (Invalid)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">4. @ F 9 → Symbol (@), Letter (F), Number (9) — (Valid)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">5. % H J → followed by letter (J), not a number — (Invalid)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">6. H J 3 → preceded by letter (H), not a symbol — (Invalid)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">7. &amp; K 5 → Symbol (&amp;), Letter (K), Number (5) — (Valid)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">8. * P 8 → Symbol (*), Letter (P), Number (8) — (Valid)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">9. ! T →not followed by any number — (Invalid)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, there are 4 such letters: B, F, K, and P.</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a certain code language,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A + B means 'A is the husband of B'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A - B means 'A is the daughter of B'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A × B means 'A is the sister of B'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A ÷ B means 'A is the father of B'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A # B means 'A is the son of B'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Based on the above, how is P related to T if 'P # Q × R - S + T'?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Son's son</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Daughter's son</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Brother's son</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sister's son</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given expression 'P # Q × R - S + T':</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">S + T:</span><span> S is the husband of T (T is the wife).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">R - S:</span><span> R is the daughter of S (and T).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span style=\"font-weight:bold\">Q × R:</span><span> Q is the sister of R (so Q is also the daughter of T).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. </span><span style=\"font-weight:bold\">P # Q:</span><span> P is the son of Q.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since Q is the daughter of T and P is the son of Q, P is the </span><span style=\"font-weight:bold\">daughter's son</span><span> of T.</span><span style=\"font-size:0pt;background-color:#000000;font-family:'Times New Roman'\"> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793899593034_image002.jpeg\" width=\"419\" height=\"355\" alt ></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Five friends—P, Q, R, S, and T—live on five different floors of a building, where the bottommost floor is numbered 1 and the topmost floor is numbered 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">- R lives on the topmost floor.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">- Exactly two people live between R and P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">- Q lives immediately above P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">- S lives below P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Who lives on floor number 4?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the given information, we can determine the floor arrangement from top to bottom:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. R lives on the topmost floor, which is Floor 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Exactly two people live between R (Floor 5) and P, which means P lives on Floor 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Q lives immediately above P, so Q lives on Floor 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. S lives below P, so S must live on Floor 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. The only remaining floor is Floor 4, which must be occupied by T.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Final arrangement:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Floor 5: R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Floor 4: T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Floor 3: Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Floor 2: P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Floor 1: S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, T lives on floor number 4.</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Six friends P, Q, R, S, T and U are sitting around a circular table facing the centre. P sits second to the left of T. Q sits to the immediate right of P. S sits opposite to Q. R sits between S and T. Who sits to the immediate left of U?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the given information, we can determine the seating arrangement step by step:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. P sits second to the left of T.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Q sits to the immediate right of P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. S sits opposite to Q.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. R sits between S and T.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. The only remaining seat between P and S is occupied by U.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Going in a clockwise order, the arrangement of people facing the centre is: P, U, S, R, T, Q.</span><span style=\"font-size:0pt;background-color:#000000;font-family:'Times New Roman'\"> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793899593034_image003.jpeg\" width=\"241\" height=\"225\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, S sits to the immediate left of U.</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">MC 28 is related to QZ 23 in a certain way. In the same way, PF 34 is related to TC 29. To which of the following is SJ 41 related, following the same logic?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>VF 36</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>WG 35</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>WG 36</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>XH 37</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The logic followed here is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First letter: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793899593034_image004.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second letter: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793899593034_image005.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Number: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793899593034_image006.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For MC 28 → QZ 23:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M (13) + 4 = Q (17)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C (3) − 3 = Z (26)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>28 − 5 = 23</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For PF 34 → TC 29:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (16) + 4 = T (20)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F (6) − 3 = C (3)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>34 − 5 = 29</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly, for SJ 41:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S (19) + 4 = W (23)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>J (10) − 3 = G (7)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>41 − 5 = 36</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, SJ 41 is related to WG 36.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following letter-clusters should replace # and % so that the pattern and relationship followed between the letter-cluster pair on the left side of :: is the same as that on the right side of :: ?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\"># : FIL :: QTW : %</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># = CFI, % = TWZ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># = BFI, % = TWZ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># = CFI, % = UXA</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># = DGI, % = SVY</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed here is adding 3 to the alphabetical position of each letter to obtain the next letter-cluster:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First pair (# : FIL):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C + 3 = F</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F + 3 = I</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I + 3 = L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>So, # = CFI.</span></p><p style=\"margin-top:0pt;ma
