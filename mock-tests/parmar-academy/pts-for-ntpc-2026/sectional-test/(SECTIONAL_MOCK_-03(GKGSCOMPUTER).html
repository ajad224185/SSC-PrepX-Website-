<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>7.) SECTIONAL MOCK -03(GK/GS/COMPUTER - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

const questions = [{"sr_no": 1, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following correctly describes the archaeological    significance of Kalibangan and Dholavira in the Indus Valley    Civilization?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Kalibangan was a major dockyard city; Dholavira was the primary    center for bead-making</p>", "option2": " <p style=\"orphans:0;widows:0\">    Kalibangan is noted for evidence of a ploughed field; Dholavira is    renowned for its unique water harvesting system</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both Kalibangan and Dholavira lacked a fortified citadel</p>", "option4": " <p style=\"orphans:0;widows:0\">    Both Kalibangan and Dholavira are situated in modern-day Rajasthan</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Kalibangan, located in the Hanumangarh district of Rajasthan,    yielded the earliest known evidence of an agricultural ploughed    field with intersecting furrows. On the other hand, Dholavira,    situated in the Kutch district of Gujarat, is renowned for its    magnificent series of water reservoirs and an advanced water    conservation/harvesting system, as well as a city layout divided    into three parts (citadel, middle town, and lower town).</p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0\">    <b>The highly polished monolithic pillars erected during the reign    of Emperor Ashoka were primarily carved out of which of the    following stones?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Chunar sandstone</p>", "option2": " <p style=\"orphans:0;widows:0\">    Makrana marble</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mathura spotted red sandstone</p>", "option4": " <p style=\"orphans:0;widows:0\">    Cuddapah limestone</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The monolithic pillars erected across the subcontinent during    Emperor Ashoka's reign were predominantly carved out of    buff-coloured or grey fine-grained sandstone quarried at Chunar    (near Mirzapur/Varanasi in Uttar Pradesh). A defining hallmark of    these pillars was the exceptional mirror-like \"Mauryan    polish\" applied to their stone surfaces.</p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0\">    <b>The tribal festival of 'Sarhul', which marks the worship of    nature and the blooming of the Sal tree, is primarily celebrated    in which Indian state?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Jharkhand</p>", "option2": " <p style=\"orphans:0;widows:0\">    Gujarat</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kerala</p>", "option4": " <p style=\"orphans:0;widows:0\">    Punjab</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Sarhul is an important spring festival celebrated primarily by    various tribal communities, such as the Oraon, Munda, and Ho, in    the state of Jharkhand. It marks the beginning of the New Year for    these tribes and involves the worship of the Sal tree, symbolizing    reverence for Mother Nature.</p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following books is the autobiography of the former    President of India, Dr. A.P.J. Abdul Kalam?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Wings of Fire</p>", "option2": " <p style=\"orphans:0;widows:0\">    The Discovery of India</p>", "option3": " <p style=\"orphans:0;widows:0\">    My Experiments with Truth</p>", "option4": " <p style=\"orphans:0;widows:0\">    The Race of My Life</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    'Wings of Fire' is an autobiography of Dr. A.P.J. Abdul Kalam, the    former President of India, co-authored with Arun Tiwari. It    details his early life, education, and his contributions to    India's space and missile development programs.</p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following conditions must be satisfied for an    artificial satellite to appear stationary relative to an observer    on the Earth's surface?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    It must orbit in the polar plane with an orbital period of 12    hours.</p>", "option2": " <p style=\"orphans:0;widows:0\">    It must orbit from east to west at any arbitrary altitude.</p>", "option3": " <p style=\"orphans:0;widows:0\">    It must orbit from west to east in the equatorial plane with a    time period of 24 hours.</p>", "option4": " <p style=\"orphans:0;widows:0\">    It must have a mass identical to the mass of the Moon.</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    For a satellite to be geostationary (appearing stationary relative    to a point on Earth), it must meet specific orbital conditions: it    must orbit in the Earth's equatorial plane, rotate in the same    direction as Earth's rotation (west to east), and have an orbital    period equal to Earth's rotational period (approximately 24 hours    or one sidereal day). This circular orbit exists at an altitude of    approximately 35,786 km above Earth's surface. The satellite's    mass does not affect its orbital period or stationarity.</p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    <b>The administration of pre-formed antibodies, such as snake    antivenom or anti-tetanus serum, to provide immediate protection    is an example of which type of immunity?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Active natural immunity</p>", "option2": " <p style=\"orphans:0;widows:0\">    Passive natural immunity</p>", "option3": " <p style=\"orphans:0;widows:0\">    Active artificial immunity</p>", "option4": " <p style=\"orphans:0;widows:0\">    Passive artificial immunity</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Passive artificial immunity is acquired when ready-made antibodies    produced by another organism are introduced into the body to    provide immediate protection against an antigen. Examples include    snake antivenom, rabies antiserum, and anti-tetanus serum. Unlike    active immunity, it does not involve the recipient's immune cells    making antibodies, so no long-term immunological memory is formed.</p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following was a prominent feature introduced by    the Government of India Act, 1919?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Introduction of dyarchy in the provinces</p>", "option2": " <p style=\"orphans:0;widows:0\">    Introduction of dyarchy at the Centre</p>", "option3": " <p style=\"orphans:0;widows:0\">    Granting of provincial autonomy</p>", "option4": " <p style=\"orphans:0;widows:0\">    Establishment of the Federal Court</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Government of India Act, 1919 (also known as the    Montagu-Chelmsford Reforms) introduced 'Dyarchy' (rule of two) in    the executive government of the provinces. Under this system,    provincial subjects were divided into 'Transferred' and 'Reserved'    subjects. Provincial autonomy, dyarchy at the Centre, and the    Federal Court were provisions introduced by the subsequent    Government of India Act of 1935.</p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following was the first woman writer to receive    the prestigious Jnanpith Award?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Amrita Pritam</p>", "option2": " <p style=\"orphans:0;widows:0\">    Ashapoorna Devi</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mahadevi Varma</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mahasweta Devi</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Ashapoorna Devi was the first woman to receive the prestigious    Jnanpith Award, India's highest literary honour, in 1976 for her    celebrated Bengali novel <i>Pratham Pratishruti</i> (The First    Promise). Amrita Pritam later received it in 1981, Mahadevi Varma    in 1982, and Mahasweta Devi in 1996.</p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    <b>Under the New Industrial Policy announced on 24 July 1991, how    many industries were initially retained under compulsory    licensing, and how many were reserved exclusively for the public    sector, respectively?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    18 and 8</p>", "option2": " <p style=\"orphans:0;widows:0\">    8 and 18</p>", "option3": " <p style=\"orphans:0;widows:0\">    17 and 6</p>", "option4": " <p style=\"orphans:0;widows:0\">    14 and 4</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Under the New Industrial Policy (NIP) announced on 24 July 1991:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>Compulsory    Licensing:</b> Industrial licensing was abolished for almost all    sectors except <b>18 industries</b> specified in Annex II (which    included items such as hazardous chemicals, electronic aerospace,    motor cars, and pharmaceuticals). Over time, this was pruned down    further to just a handful.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>Public    Sector Reservation:</b> The number of industries reserved    exclusively for the public sector (Annex I) was reduced from 17    (under the Industrial Policy Resolution, 1956) to <b>8 industries</b>    (which included defence, atomic energy, coal, mineral oils, and    railways). Later, this was reduced even further to only 2 sectors.</p>    <p style=\"orphans:0;widows:0\">Therefore, the respective numbers    are 18 and 8.</p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    <b>With reference to the electoral reforms introduced by the    Election Commission of India (ECI), which of the following    statements regarding the 'Electronically Transmitted Postal Ballot    System' (ETPBS) is correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    It is currently available to all overseas (NRI) voters to cast    their vote from abroad.</p>", "option2": " <p style=\"orphans:0;widows:0\">    It allows eligible voters to cast and submit their votes entirely    online through a secure web portal.</p>", "option3": " <p style=\"orphans:0;widows:0\">    It enables registered service voters to receive postal ballots    electronically and return them through physical post.</p>", "option4": " <p style=\"orphans:0;widows:0\">    It has completely replaced Electronic Voting Machines (EVMs) in    border constituencies.</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Electronically Transmitted Postal Ballot System (ETPBS) was    developed by the Election Commission of India (ECI) with the help    of C-DAC to enable service voters (such as armed forces personnel    and government employees stationed outside their constituencies)    to exercise their franchise. Under this system, blank postal    ballots are transmitted electronically to registered service    voters, who download and print them, mark their preferences, and    dispatch them back to the Returning Officer via physical post.</p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following regulatory bodies was established in    September 2020 to replace the Medical Council of India (MCI) for    overseeing medical education and practice in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    University Grants Commission</p>", "option2": " <p style=\"orphans:0;widows:0\">    National Medical Commission</p>", "option3": " <p style=\"orphans:0;widows:0\">    Pharmacy Council of India</p>", "option4": " <p style=\"orphans:0;widows:0\">    Dental Council of India</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The National Medical Commission (NMC) is a statutory regulatory    body that came into existence on 25 September 2020, under the    National Medical Commission Act, 2019. It superseded and replaced    the Medical Council of India (MCI), which had been established in    1934 under the Indian Medical Council Act.</p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following organic acids is commonly used for    removing rust stains from clothes and cleaning wood?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Formic acid</p>", "option2": " <p style=\"orphans:0;widows:0\">    Oxalic acid</p>", "option3": " <p style=\"orphans:0;widows:0\">    Tartaric acid</p>", "option4": " <p style=\"orphans:0;widows:0\">    Malic acid</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Oxalic acid is widely used as a rust remover because it reacts    with insoluble iron(III) compounds (rust) to form soluble complex    iron oxalate ions, which can be easily washed away with water.</p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    <b>The Industrial Policy Resolution (IPR) of 1956, which aimed to    establish a 'socialist pattern of society', formed the basis of    which Five Year Plan of India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    First Five Year Plan</p>", "option2": " <p style=\"orphans:0;widows:0\">    Second Five Year Plan</p>", "option3": " <p style=\"orphans:0;widows:0\">    Third Five Year Plan</p>", "option4": " <p style=\"orphans:0;widows:0\">    Fourth Five Year Plan</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Industrial Policy Resolution (IPR) of 1956 formed the core    basis of the Second Five Year Plan (1956–1961), also known as    the Mahalanobis Plan. It emphasized rapid industrialization with a    focus on heavy and basic industries and aimed at establishing a    'socialist pattern of society' through the expansion of the public    sector.</p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following countries is NOT a member of the South    Asian Association for Regional Cooperation (SAARC)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Afghanistan</p>", "option2": " <p style=\"orphans:0;widows:0\">    Bangladesh</p>", "option3": " <p style=\"orphans:0;widows:0\">    Myanmar</p>", "option4": " <p style=\"orphans:0;widows:0\">    Maldives</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    SAARC (South Asian Association for Regional Cooperation) was    established in 1985 and currently consists of eight member    nations: Afghanistan, Bangladesh, Bhutan, India, Maldives, Nepal,    Pakistan, and Sri Lanka. Myanmar is not a member of SAARC (it    holds observer status), though it is a member of BIMSTEC and    ASEAN.</p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0\">    <b>Where are the headquarters of the World Anti-Doping Agency    (WADA) located?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Lausanne, Switzerland</p>", "option2": " <p style=\"orphans:0;widows:0\">    Montreal, Canada</p>", "option3": " <p style=\"orphans:0;widows:0\">    London, United Kingdom</p>", "option4": " <p style=\"orphans:0;widows:0\">    Paris, France</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The headquarters of the World Anti-Doping Agency (WADA) is located    in Montreal, Canada. WADA is an international independent agency    initiated by the International Olympic Committee (IOC) to promote,    coordinate, and monitor the fight against doping in sports in all    its forms.</p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following is deducted from Gross Domestic Product    (GDP) to calculate Net Domestic Product (NDP)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Depreciation</p>", "option2": " <p style=\"orphans:0;widows:0\">    Net Indirect Taxes</p>", "option3": " <p style=\"orphans:0;widows:0\">    Transfer payments</p>", "option4": " <p style=\"orphans:0;widows:0\">    Net factor income from abroad</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    Net Domestic Product (NDP) measures the net output of an economy.    It is obtained by subtracting depreciation (consumption of fixed    capital) from the Gross Domestic Product (GDP):     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794746925199_html_d8888f68ff4a506f.gif\" > .</p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <b>Who acts as the chief channel of communication between the    Council of Ministers and the President of India under the    Constitution of India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    The Speaker of Lok Sabha</p>", "option2": " <p style=\"orphans:0;widows:0\">    The Prime Minister</p>", "option3": " <p style=\"orphans:0;widows:0\">    The Cabinet Secretary</p>", "option4": " <p style=\"orphans:0;widows:0\">    The Vice-President</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Under Article 78 of the Constitution of India, the Prime Minister    acts as the chief channel of communication between the President    and the Council of Ministers. It is the duty of the Prime Minister    to communicate all decisions of the Council of Ministers relating    to the administration of the affairs of the Union and proposals    for legislation to the President.</p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    <b>Veeranatyam, also known as the 'Dance of the Brave', is a    traditional ritual dance form predominantly associated with which    state of India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Andhra Pradesh</p>", "option2": " <p style=\"orphans:0;widows:0\">    Kerala</p>", "option3": " <p style=\"orphans:0;widows:0\">    Odisha</p>", "option4": " <p style=\"orphans:0;widows:0\">    Gujarat</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Veeranatyam is a traditional ritual dance form originating from    the state of Andhra Pradesh. It is performed in honor of Lord    Shiva and Veerabhadra, holding deep religious and cultural    significance in the state.</p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <b>In the ancient Indian four-fold Ashrama system, which stage    represents the life of a householder?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Brahmacharya</p>", "option2": " <p style=\"orphans:0;widows:0\">    Grihastha</p>", "option3": " <p style=\"orphans:0;widows:0\">    Vanaprastha</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sannyasa</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In ancient Indian tradition, human life was divided into four    stages or Ashramas: 1. Brahmacharya (student/learning phase), 2.    Grihastha (householder phase of family and social duties), 3.    Vanaprastha (hermit or gradual retirement phase), and 4. Sannyasa    (complete renunciation of worldly ties).</p>", "question_heading": ""}, {"sr_no": 20, "question": "  <p style=\"orphans:0;widows:0\">    <b>The average velocity of a moving object is given by the formula    </b>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794746925199_html_b530b7a470a1300c.gif\" > <b>    (where </b>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794746925199_html_ca251a9e165ee99b.gif\" > <b>    is initial velocity and </b>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794746925199_html_acc4ed3bbe33fd32.gif\" > <b>    is final velocity) only when the object moves with:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Variable acceleration</p>", "option2": " <p style=\"orphans:0;widows:0\">    Uniform acceleration</p>", "option3": " <p style=\"orphans:0;widows:0\">    Decreasing velocity only</p>", "option4": " <p style=\"orphans:0;widows:0\">    Non-linear acceleration</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    When an object is moving along a straight line at a constant    (uniform) rate of change of velocity, its acceleration is    constant. In such uniformly accelerated motion, the average    velocity over a given time interval is calculated as the simple    arithmetic mean of the initial velocity (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794746925199_html_ca251a9e165ee99b.gif\" > )    and final velocity (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794746925199_html_acc4ed3bbe33fd32.gif\" > ),    given by     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794746925199_html_b530b7a470a1300c.gif\" > .    If acceleration is not uniform, this relationship does not hold    true.</p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following founded the 'Bharat Stree Mahamandal'    in Allahabad in 1910 to promote women's education and upliftment?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Pandita Ramabai</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sarala Devi Chaudhurani</p>", "option3": " <p style=\"orphans:0;widows:0\">    Muthulakshmi Reddi</p>", "option4": " <p style=\"orphans:0;widows:0\">    Madam Bhikaji Cama</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The 'Bharat Stree Mahamandal' was founded by Sarala Devi    Chaudhurani in Allahabad in 1910. It is recognized as one of the    first all-India women's organizations initiated by an Indian    woman. Its primary objectives were to promote female education,    address social issues like the purdah system, and foster unity    among women across different parts of India.</p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following air pollutants is NOT included in the    calculation of the National Air Quality Index (AQI) in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Ammonia</p>", "option2": " <p style=\"orphans:0;widows:0\">    Ground-level Ozone</p>", "option3": " <p style=\"orphans:0;widows:0\">    Carbon dioxide</p>", "option4": " <p style=\"orphans:0;widows:0\">    Lead</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    The National Air Quality Index (AQI) launched by the Ministry of    Environment, Forest and Climate Change in India monitors eight    criteria pollutants:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794746925199_html_1bb8cdf910505f1e.gif\" > ,       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794746925199_html_9de060da64187a24.gif\" > ,    Nitrogen Dioxide (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794746925199_html_caacd6c15be41594.gif\" > ),    Sulfur Dioxide (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794746925199_html_ad1c47d7870d63d2.gif\" > ),    Carbon Monoxide (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794746925199_html_8469c365275aaa93.gif\" > ),    Ozone (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794746925199_html_8b3fec3be935eb0a.gif\" > ),    Ammonia (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794746925199_html_c37ba8c35aff4759.gif\" > ),    and Lead (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794746925199_html_9398cb4c7491cd5.gif\" > ).    Carbon dioxide (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794746925199_html_3798a84b74d573f9.gif\" > )    is a greenhouse gas and is not considered a pollutant under the    AQI parameters.</p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <b>In MS-word, replace option comes under the menu?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    View.</p>", "option2": " <p style=\"orphans:0;widows:0\">    File.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Insert.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Edit.</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The <b>Replace</b> command is used to find specific text and    replace it with another text. In older versions of MS Word, it is    available under the <b>Edit</b> menu.</p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <b>The symbols used in an assembly language are?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Codes.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Mnemonics.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Assembler.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Machine codes.</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <b>Mnemonics</b> are symbolic instructions used in assembly    language, such as <b>ADD, SUB, MOV, and JMP</b>. They are easier    for programmers to remember than binary machine codes.</p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <b>A translator for the assembly language to machine language is?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Assembler.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Compiler.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Interpreter.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Linker.</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    An <b>assembler</b> converts <b>assembly language (mnemonics)</b>    into <b>machine language (binary/object code)</b> that can be    understood by the computer's processor.</p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0\">    <b>Where is India’s super computer “PARAM” located?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Chennai.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Pune.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Bengaluru.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Kolkata.</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The <b>PARAM series of supercomputers</b> was developed by <b>C-DAC    (Centre for Development of Advanced Computing)</b>, headquartered    in <b>Pune, Maharashtra</b>.</p>    <p style=\"orphans:0;widows:0\"><b>PARAM 8000</b> was India's    first major indigenous parallel supercomputer, developed in 1991.</p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>With reference to the Indian National Movement during the    Gandhian era, consider the following statements:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. The Non-Cooperation Movement (1920–22) was withdrawn by    Gandhi following the Chauri Chaura incident, but the movement had    already led to the boycott of government schools, colleges, courts    and foreign cloth.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. The Civil Disobedience Movement began with the Dandi March    in 1930, and unlike the Non-Cooperation Movement, it involved the    deliberate violation of specific colonial laws.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. The Gandhi-Irwin Pact (1931) resulted in the complete    acceptance of all major demands of the Congress by the British    Government, including the immediate grant of complete    independence.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>4. The Quit India Movement (1942) was launched after the    failure of the Cripps Mission, with the resolution calling for the    British to leave India immediately.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1, 2 and 4 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    2, 3 and 4 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2, 3 and 4</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1 — Correct:</b> The Non-Cooperation Movement was    withdrawn in February 1922 after the <b>Chauri Chaura incident</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2 — Correct:</b> The Civil Disobedience Movement began with    Gandhi’s <b>Dandi March (12 March–6 April 1930)</b> and    involved breaking colonial laws, especially the <b>Salt Law</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    3 — Incorrect:</b> The Gandhi-Irwin Pact did <b>not</b> grant    complete independence. Gandhi agreed to suspend the movement and    participate in the Second Round Table Conference.</p>    <p style=\"orphans:0;widows:0\"><b>Statement 4 — Correct:</b>    The Quit India Movement was launched in <b>August 1942</b> after    the failure of the Cripps Mission, with the historic <b>“Do or    Die”</b> call.</p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>With reference to the administrative and political system of    the Delhi Sultanate, consider the following statements:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Iltutmish introduced the Iqta system in a more systematic    manner and organized the Chahalgani (Group of Forty) to strengthen    the Sultanate's administration.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. Alauddin Khalji introduced strict market-control measures    primarily to maintain a large standing army at relatively low    salaries.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. Muhammad bin Tughlaq shifted the capital from Delhi to    Daulatabad and later reversed the decision, bringing the capital    back to Delhi.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>4. Firoz Shah Tughlaq abolished the practice of hereditary    succession to the office of Iqta holders.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1, 2 and 3 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    1 and 4 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    2, 3 and 4 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2, 3 and 4</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1 — Correct:</b> Iltutmish strengthened the <b>Iqta    system</b> and formed the <b>Chahalgani</b>, a powerful group of    Turkish nobles.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2 — Correct:</b> Alauddin Khalji's <b>market-control policy</b>    was closely linked to maintaining a large army at controlled    costs.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    3 — Correct:</b> Muhammad bin Tughlaq transferred the capital    from <b>Delhi to Daulatabad</b> and subsequently shifted it back    to Delhi.</p>    <p style=\"orphans:0;widows:0\"><b>Statement 4 — Incorrect:</b>    Firoz Shah Tughlaq encouraged <b>hereditary succession</b> in    several administrative and military positions, including Iqtas.</p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following words was added to the Preamble of the    Indian Constitution by the 42nd Constitutional Amendment Act,    1976?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Justice, Liberty and Equality</p>", "option2": " <p style=\"orphans:0;widows:0\">    Socialist, Secular and Integrity</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sovereign, Democratic and Republic</p>", "option4": " <p style=\"orphans:0;widows:0\">    Fraternity, Equality and Liberty</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The <b>42nd Constitutional Amendment Act, 1976</b> added three    words to the Preamble:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Socialist</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Secular</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Integrity</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The original    expression <b>\"Unity of the Nation\"</b> was changed to    <b>\"Unity and Integrity of the Nation.\"</b></p>    <p style=\"orphans:0;widows:0\">The amendment was passed during    the tenure of Prime Minister <b>Indira Gandhi</b>.</p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following cell organelles is known as the    'Powerhouse of the Cell'?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Ribosome</p>", "option2": " <p style=\"orphans:0;widows:0\">    Mitochondria</p>", "option3": " <p style=\"orphans:0;widows:0\">    Golgi Apparatus</p>", "option4": " <p style=\"orphans:0;widows:0\">    Lysosome</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Mitochondria</b> are known as the powerhouse of the cell    because they produce most of the energy in the form of <b>ATP    (Adenosine Triphosphate)</b> through cellular respiration.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">They are    called <b>semi-autonomous organelles</b> because they possess    their own DNA and ribosomes.</p>    <p style=\"orphans:0;widows:0\">Mitochondria are mainly    responsible for aerobic respiration.</p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0\">    <b>The Delhi Government launched the expanded ANMOL (Advanced    Newborn Monitoring and Optimal Lifecare) scheme under which    campaign for universal infant genetic screening?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Mission Indradhanush</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sewa Sankalp Abhiyan</p>", "option3": " <p style=\"orphans:0;widows:0\">    Ayushman Bharat Mission</p>", "option4": " <p style=\"orphans:0;widows:0\">    Poshan Abhiyaan</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The <b>Delhi Government</b> launched the expanded <b>ANMOL</b>    (Advanced Newborn Monitoring and Optimal Lifecare) scheme under    <b>Sewa Sankalp Abhiyan</b> for universal infant genetic    screening. CREATE QUES WITH OPTION</p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0\">    <b>Where was the 2nd </b><b>Indian Navy Commanders’ Conference    2026</b><b> inaugurated, during which Operation Urja Suraksha was    reviewed under the JAI pillars?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    INS Valsura, Gujarat</p>", "option2": " <p style=\"orphans:0;widows:0\">    Nausena Bhawan, New Delhi</p>", "option3": " <p style=\"orphans:0;widows:0\">    Naval Headquarters, Mumbai</p>", "option4": " <p style=\"orphans:0;widows:0\">    Southern Naval Command, Kochi</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The <b>Indian Navy</b> opened the 2nd <b>Commanders’ Conference    2026</b> at <b>Nausena Bhawan, New Delhi</b>, reviewing <b>'Operation    Urja Suraksha'</b> under the <b>'JAI'</b> (Jointness,    Aatmanirbharta, Innovation) pillars.</p>", "question_heading": ""}, {"sr_no": 33, "question": " <p sty
