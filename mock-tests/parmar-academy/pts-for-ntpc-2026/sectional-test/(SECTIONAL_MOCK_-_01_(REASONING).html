<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>11.) SECTIONAL MOCK - 01 (REASONING - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

const questions = [{"sr_no": 1, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which letter-cluster should come in place of the question mark (?) in the given series based on the English alphabetical order?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">BFM, EIQ, HLU, KOY, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NRD</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MRC</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NRC</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MQB</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the series is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First letter: B (+3) = E, E (+3) = H, H (+3) = K, K (+3) = N</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second letter: F (+3) = I, I (+3) = L, L (+3) = O, O (+3) = R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Third letter: M (+4) = Q, Q (+4) = U, U (+4) = Y, Y (+4) = C</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the next letter-cluster in the series is NRC.</span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Six people P, Q, R, S, T and U are sitting in a row facing north. P sits at the extreme left end of the row. Only two people sit between P and S. T sits to the immediate right of S. Q sits to the immediate left of U. How many people sit between P and T?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the given information, we can determine the arrangement step-by-step from left to right (facing north):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. P sits at the extreme left end: P, _, _, _, _, _</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Only two people sit between P and S: P, _, _, S, _, _</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. T sits to the immediate right of S: P, _, _, S, T, _</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Q sits to the immediate left of U: Q and U must take the only remaining adjacent spots (positions 2 and 3): P, Q, U, S, T, _</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. The remaining position at the extreme right is occupied by R: P, Q, U, S, T, R.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The people sitting between P and T are Q, U, and S, which is a total of 3 people.</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a certain code language, ‘COAT’ is coded as ‘3857’, ‘POST’ is coded as ‘5923’, and ‘SOAP’ is coded as ‘8239’. What is the code for ‘T’ in the given code language?</span></p>", "option1": "<p style=\"margin-top:0pt;mar 12pt\"><span>3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>We need to find the pattern: </span><span style=\"font-weight:bold\">Consonant – Vowel – Consonant</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let us identify each vowel in the given series and check its adjacent letters:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P </span><span style=\"font-weight:bold\">A</span><span> R: 'A' is preceded by consonant P and followed by consonant R. (Valid)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R </span><span style=\"font-weight:bold\">E</span><span> I: 'E' is followed by vowel I. (Invalid)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E </span><span style=\"font-weight:bold\">I</span><span> T: 'I' is preceded by vowel E. (Invalid)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T </span><span style=\"font-weight:bold\">O</span><span> K: 'O' is preceded by consonant T and followed by consonant K. (Valid)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K </span><span style=\"font-weight:bold\">U</span><span> V: 'U' is preceded by consonant K and followed by consonant V. (Valid)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B </span><span style=\"font-weight:bold\">A</span><span> C: 'A' is preceded by consonant B and followed by consonant C. (Valid)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, there are </span><span style=\"font-weight:bold\">4</span><span> such vowels (P</span><span style=\"font-weight:bold\">A</span><span>R, T</span><span style=\"font-weight:bold\">O</span><span>K, K</span><span style=\"font-weight:bold\">U</span><span>V, B</span><span style=\"font-weight:bold\">A</span><span>C).</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">All laptops are computers.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Some computers are tablets.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">No tablet is a phone.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(I) Some laptops are tablets.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(II) Some computers are not phones.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (I) follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (II) follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both conclusions (I) and (II) follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither conclusion (I) nor (II) follows</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. For conclusion (I): There is no direct or definite relationship given between 'laptops' and 'tablets'. Hence, conclusion (I) does not follow.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. For conclusion (II): Since 'some computers are tablets' and 'no tablet is a phone', the portion of computers that are tablets can never be phones. Therefore, 'some computers are not phones' definitely holds true.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, only conclusion (II) follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image005.jpeg\" width=\"472\" height=\"328\" alt ></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a row of 50 students facing north, Aman is 15th from the left end and Rohit is 18th from the right end. How many students are sitting between Aman and Rohit?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>16</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>17</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>19</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total number of students = 50</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Position of Aman from the left end = 15</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Position of Rohit from the right end = 18</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sum of their positions = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image006.png\" width=\"94\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since the sum of positions (33) is less than the total number of students (50), there is no overlapping.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Number of students between Aman and Rohit = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image007.png\" width=\"94\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The position(s) of how many letters will remain unchanged if each letter in the word FORECAST is arranged in alphabetical order from left to right?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>None</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Original Word: F O R E C A S T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Alphabetical Order: A C E F O R S T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing letter by letter:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1st position: F → A (Changed)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2nd position: O → C (Changed)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3rd position: R → E (Changed)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4th position: E → F (Changed)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5th position: C → O (Changed)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6th position: A → R (Changed)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7th position: S → S (Unchanged)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8th position: T → T (Unchanged)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the positions of exactly 2 letters (S and T) remain unchanged.</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Based on the English alphabetical order, three of the following four letter-cluster pairs are alike in a certain way and thus form a group. Which is the one that does not belong to that group?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster pairs.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BE - IL</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PS - VY</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>GJ - NQ</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KN - RU</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let us analyze the positional values of the letters in each letter-cluster pair:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1) BE - IL: B(2) + 3 = E(5); E(5) + 4 = I(9); I(9) + 3 = L(12) → (+3, +4, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2) GJ - NQ: G(7) + 3 = J(10); J(10) + 4 = N(14); N(14) + 3 = Q(17) → (+3, +4, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3) KN - RU: K(11) + 3 = N(14); N(14) + 4 = R(18); R(18) + 3 = U(21) → (+3, +4, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4) PS - VY: P(16) + 3 = S(19); S(19) + 3 = V(22); V(22) + 3 = Y(25) → (+3, +3, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All pairs except 'PS - VY' follow the pattern (+3, +4, +3), whereas 'PS - VY' follows (+3, +3, +3). Therefore, PS - VY is the odd one out.</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which letter-cluster will replace the question mark (?) in the following series based on the English alphabetical order?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">BZD, EWI, HTN, KQS, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MNY</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NNX</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ONW</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NMY</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the given series is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First letter: B (+3) → E (+3) → H (+3) → K (+3) → </span><span style=\"font-weight:bold\">N</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second letter: Z (-3) → W (-3) → T (-3) → Q (-3) → </span><span style=\"font-weight:bold\">N</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Third letter: D (+5) → I (+5) → N (+5) → S (+5) → </span><span style=\"font-weight:bold\">X</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the missing letter-cluster is </span><span style=\"font-weight:bold\">NNX</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the triad that follows the same pattern as that followed by the two sets of triads given below.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">FAST – ASTF – STFA</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">MINT – INTM – NTMI</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BARK – ARKB – RKBA</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ROAD – OARD – ARDO</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PRAY – YPRA – AYPR</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DUST – UDTS – TSDU</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the given triads is a cyclic shift of letters to the left by one position at each step:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1st word: 1-2-3-4</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2nd word: 2-3-4-1 (1st letter moves to the last position)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3rd word: 3-4-1-2 (2nd letter moves to the last position)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying this pattern to the options:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BARK (1-2-3-4) → ARKB (2-3-4-1) → RKBA (3-4-1-2).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, </span><span style=\"font-weight:bold\">BARK – ARKB – RKBA</span><span> is the correct triad.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the triad of letter-clusters that follows the same pattern as followed by the two triads given below.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">KM – OQ – SU</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">NP – RT – VX</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BD – FH – JL</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CE – HK – MP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PR – TW – ZB</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>AC – DF – GI</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the given triads is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Within each letter-cluster, the difference between the letters is +2:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K (+2) = M, O (+2) = Q, S (+2) = U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N (+2) = P, R (+2) = T, V (+2) = X</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. The difference between the first letters of consecutive clusters is +4:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K (+4) = O, O (+4) = S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N (+4) = R, R (+4) = V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Checking the options:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In BD – FH – JL:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B (+2) = D, F (+2) = H, J (+2) = L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First letters: B (+4) = F, F (+4) = J</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, BD – FH – JL follows the same pattern.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">What will come in place of the question mark (?) in the following equation, if ‘+’ and ‘−’ are interchanged and ‘×’ and ‘÷’ are interchanged?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image008.png\" width=\"218\" height=\"21\" alt style=\"vertical-align:middle\" ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>48</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>52</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>64</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>56</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given equation:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image009.png\" width=\"210\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>After interchanging ‘+’ with ‘−’ and ‘×’ with ‘÷’, the equation becomes:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image010.png\" width=\"210\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the BODMAS rule:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Division: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image011.png\" width=\"102\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Multiplication: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image012.png\" width=\"102\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Addition and Subtraction:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image013.png\" width=\"241\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, 52 is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a row of students, Aman is 18ᵗʰ from the left end and Rohit is 25ᵗʰ from the right end. If they interchange their positions, Aman becomes 31ˢᵗ from the left end. How many students are there in the row?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>54</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>55</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>56</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>57</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>After interchanging positions, Aman occupies Rohit's initial position.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, this position is 31ˢᵗ from the left end and 25ᵗʰ from the right end.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total number of students = (Rank from left + Rank from right) - 1</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image014.png\" width=\"201\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Seven people A, B, C, D, E, F, and G are sitting in a row facing north. A sits at the extreme left end of the row. Only three people sit between A and D. F sits second to the right of D. B sits to the immediate left of D. C is an immediate neighbor of neither A nor F. E sits somewhere to the left of G. How many people sit between E and G?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the seven positions from left to right be 1 to 7 facing north:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. A sits at the extreme left end: Position 1 = A.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Only three people sit between A and D: Positions 2, 3, and 4 are between them, so Position 5 = D.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. F sits second to the right of D: Position 7 = F.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. B sits to the immediate left of D: Position 4 = B.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. C is not an immediate neighbor of A (Position 2) or F (Position 6): Therefore, C must sit at Position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. E sits to the left of G: The remaining empty positions are 2 and 6. Thus, Position 2 = E and Position 6 = G.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The final arrangement from left to right is: A, E, C, B, D, G, F.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The people sitting between E (position 2) and G (position 6) are C, B, and D, which is a total of 3 people.</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a certain code language, 'fresh fruits are sweet' is coded as 'ta ma ki zo', 'eat sweet ripe fruits' is coded as 'ki zo lo ra', and 'ripe apples are tasty' is coded as 'lo ma de pe'. How is 'eat' coded in that language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ki</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>lo</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ra</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>zo</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing the first and second statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'fresh fruits are sweet' = 'ta ma ki zo'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'eat sweet ripe fruits' = 'ki zo lo ra'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Common words are 'fruits' and 'sweet', and the common codes are 'ki' and 'zo'. So, {'fruits', 'sweet'} = {'ki', 'zo'}.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing the second and third statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'eat sweet ripe fruits' = 'ki zo lo ra'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'ripe apples are tasty' = 'lo ma de pe'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The common word is 'ripe' and the common code is 'lo'. So, 'ripe' = 'lo'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Now in the second statement ('eat sweet ripe fruits' = 'ki zo lo ra'), the remaining word is 'eat' and the remaining code is 'ra'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, 'eat' is coded as 'ra'.</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Three of the following four letter-clusters are alike in a certain way and thus form a group. Which is the one that does not belong to that group?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BDF</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MOR</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HJL</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PRT</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed by the letter-clusters is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BDF: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image015.png\" width=\"114\" height=\"25\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HJL: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image016.png\" width=\"111\" height=\"25\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PRT: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image017.png\" width=\"110\" height=\"25\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MOR: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image018.png\" width=\"119\" height=\"25\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In all clusters except MOR, each subsequent letter increases by </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image019.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span>. Thus, MOR is the odd one out.</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Some mangoes are fruits.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">All fruits are sweet.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">No sweet is sour.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(I) No fruit is sour.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(II) Some sweet are mangoes.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (I) follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion (II) follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both conclusions (I) and (II) follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither conclusion (I) nor (II) follows</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. All fruits are sweet + No sweet is sour: Since the entire set of fruits lies within sweet, and no part of sweet overlaps with sour, no fruit can be sour. Thus, conclusion (I) logically follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Some mangoes are fruits + All fruits are sweet: The portion of mangoes that are fruits must also be sweet. Thus, some sweet are mangoes. So, conclusion (II) logically follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, both conclusions (I) and (II) follow.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image020.jpeg\" width=\"513\" height=\"351\" alt ></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a certain code language,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'A + B' means 'A is the brother of B',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'A - B' means 'A is the sister of B',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'A × B' means 'A is the father of B' and</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'A ÷ B' means 'A is the mother of B'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">How is P related to S if 'P × Q + R - S'?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Brother</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Father</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Uncle</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Son</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given expression 'P × Q + R - S':</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. P × Q → P is the father of Q.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Q + R → Q is the brother of R.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. R - S → R is the sister of S.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since Q, R, and S are siblings, P is the father of all three.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, P is the father of S.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image021.jpeg\" width=\"330\" height=\"299\" alt ></p>", "question_heading": ""}, {"sr_no": 20, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">What will come in place of ‘?’ in the following equation, if ‘+’ and ‘−’ are interchanged and ‘×’ and ‘÷’ are interchanged?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image022.png\" width=\"180\" height=\"21\" alt style=\"vertical-align:middle\" ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>38</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>42</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>45</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40</span></p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given equation: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image023.png\" width=\"175\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>After interchanging ‘+’ with ‘−’ and ‘×’ with ‘÷’, the equation becomes:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;fon bottom:0pt;font-size:12pt\"><span>Four</span></p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>We need to find the pattern: </span><span style=\"font-weight:bold\">Odd digit – Even digit – Even digit</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given series:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7 </span><span style=\"font-weight:bold\">4</span><span> 6 3 9 8 5 </span><span style=\"font-weight:bold\">2</span><span> 6 1 3 </span><span style=\"font-weight:bold\">4</span><span> 8 7 2 5 8 7 9 6 3 1</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Checking the condition across the series:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 7 – </span><span style=\"font-weight:bold\">4</span><span> – 6 (4 is preceded by odd digit 7 and followed by even digit 6)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 5 – </span><span style=\"font-weight:bold\">2</span><span> – 6 (2 is preceded by odd digit 5 and followed by even digit 6)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 3 – </span><span style=\"font-weight:bold\">4</span><span> – 8 (4 is preceded by odd digit 3 and followed by even digit 8)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, there are </span><span style=\"font-weight:bold\">3</span><span> such even digits.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which letter cluster will replace the question mark (?) in the following series based on the English alphabetical order?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bol -bottom:0pt;font-size:12pt\"><span>8 km to the north</span></p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the starting point X be at the origin </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image038.png\" width=\"35\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Walks 12 km North: position becomes </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image039.png\" width=\"44\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Turns right (East) and walks 8 km: position becomes </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image040.png\" width=\"44\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Turns right (South) and walks 7 km: position becomes </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image041.png\" width=\"127\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Turns right (West) and walks 8 km: position becomes </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image042.png\" width=\"118\" height=\"21\" alt style=\"vertical-align:middle\" ><span>, which is Point Y.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>To reach Point X </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794846769186_image038.png\" width=\"35\" height=\"21\" alt style=\"vertical-align:middle -bottom:0pt;font-size:12pt\"><span>2 + 1 = 3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Subtract 2 from each odd digit:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3 - 2 = 1</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9 - 2 = 7</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7 - 2 = 5</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 - 2 = 3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Arranging the digits in order, the new number formed is 7175353.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In the new number 7175353:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- Digit 1 appears 1 time.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- Digit 3 appears 2 times.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- Digit 5 appears 2 times.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- Digit 7 appears 2 times.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, three digits (3, 5, and 7) appear more than once.</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which number should come in place of the question mark (?) in the following series?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">24, 28, 34, 42, ?, 64</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>50</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>52</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>54</span></p
