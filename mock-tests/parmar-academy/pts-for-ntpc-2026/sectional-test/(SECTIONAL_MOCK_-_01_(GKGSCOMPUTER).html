<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>1.) SECTIONAL MOCK - 01 (GK/GS/COMPUTER - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

const questions = [{"sr_no": 1, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following statements is correct regarding the    principal focus of a convex mirror?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    It lies in front of the reflecting surface and is a real focus</p>", "option2": " <p style=\"orphans:0;widows:0\">    It is a point behind the mirror from which rays parallel to the    principal axis appear to diverge</p>", "option3": " <p style=\"orphans:0;widows:0\">    It is the point through which all reflected rays actually    intersect</p>", "option4": " <p style=\"orphans:0;widows:0\">    It coincides with the center of curvature of the mirror</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In a convex mirror, rays of light that travel parallel to the    principal axis diverge after reflection. When these reflected rays    are produced backwards, they appear to intersect at a specific    point on the principal axis located behind the mirror. This point    is called the principal focus of the convex mirror. Because the    rays only appear to diverge from this point rather than actually    meeting there, the focus of a convex mirror is virtual.</p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0\">    <b>According to Bohr's atomic model, the orbital angular momentum    of an electron revolving in a stable orbit is an integral multiple    of which of the following?</b></p>", "option1": " <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890124975_html_bf46713bb7cf385.gif\" > </p>", "option2": "  <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890124975_html_390672074fd0b964.gif\" > </p>", "option3": "  <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890124975_html_78f9d2949c028d46.gif\" > </p>", "option4": "  <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890124975_html_f84a466f6acd6d3e.gif\" > </p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    According to Bohr's second postulate of the atomic model, an    electron can only revolve in those discrete orbits where its    orbital angular momentum (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890124975_html_c98dbba75d98eb39.gif\" > )    is an integral multiple of     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890124975_html_bf46713bb7cf385.gif\" > ,    mathematically expressed as     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890124975_html_a05cb9d366bd4054.gif\" > ,    where     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890124975_html_bde7198e59531b07.gif\" >     (principal quantum number) and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890124975_html_2edc8155a17f52b0.gif\" >     is Planck's constant.</p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0\">    <b>Which part of a flowering plant develops into a fruit after    fertilisation?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Ovary</p>", "option2": " <p style=\"orphans:0;widows:0\">    Ovule</p>", "option3": " <p style=\"orphans:0;widows:0\">    Stigma</p>", "option4": " <p style=\"orphans:0;widows:0\">    Filament</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    After fertilisation in flowering plants, the ovary enlarges and    matures to develop into a fruit, whereas the ovules develop into    seeds.</p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following physical quantities is a measure of the    inertia of an object?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Velocity</p>", "option2": " <p style=\"orphans:0;widows:0\">    Force</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mass</p>", "option4": " <p style=\"orphans:0;widows:0\">    Momentum</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Inertia is the natural tendency of an object to resist a change in    its state of rest or of uniform motion. The mass of an object is a    quantitative measure of its inertia; heavier objects have greater    inertia than lighter objects.</p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0\">    <b>Who was the first ruler of the Delhi Sultanate to introduce    </b><b>token currency</b><b> on a large scale?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Iltutmish</p>", "option2": " <p style=\"orphans:0;widows:0\">    Alauddin Khalji</p>", "option3": " <p style=\"orphans:0;widows:0\">    Muhammad bin Tughlaq</p>", "option4": " <p style=\"orphans:0;widows:0\">    Firoz Shah Tughlaq</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Muhammad bin Tughlaq</b> introduced token currency, mainly    copper/brass coins, during his reign.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The token    coins were intended to circulate at the value of silver <b>tanka</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    experiment failed largely because counterfeit coins were produced    on a large scale.</p>    <p style=\"orphans:0;widows:0\"><b>Iltutmish</b> is associated    with the introduction of the silver <b>tanka</b> and copper <b>jital</b>.</p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the change of state    of matter:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. During a change of state, the temperature of a substance    remains constant even though heat is continuously supplied or    released.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. The heat energy required to convert a solid into a liquid at    its melting point without a change in temperature is known as the    latent heat of vaporization.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Both 1 and 2</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only 1</p>", "option3": " <p style=\"orphans:0;widows:0\">    Only 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statement 1 is correct: During a phase transition (such as melting    or boiling), the supplied heat is utilized to overcome the    intermolecular forces of attraction rather than increasing the    kinetic energy of the particles, so the temperature remains    constant.</p>    <p style=\"orphans:0;widows:0\">Statement 2 is incorrect: The    amount of heat energy required to change 1 kg of a solid into a    liquid at atmospheric pressure at its melting point is called the    latent heat of fusion, not the latent heat of vaporization (which    is associated with liquid to gas transition). Therefore, only    statement 1 is correct.</p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following hydrocarbons burns with a clean blue    flame in the presence of an adequate supply of air?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Ethyne</p>", "option2": " <p style=\"orphans:0;widows:0\">    Benzene</p>", "option3": " <p style=\"orphans:0;widows:0\">    Propane</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ethene</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    Saturated hydrocarbons (alkanes), such as propane (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890124975_html_2c6e6b67b32da381.gif\" > ),    undergo complete combustion in an adequate supply of oxygen to    produce carbon dioxide and water, burning with a clean blue flame.    In contrast, unsaturated hydrocarbons (like ethene and ethyne) and    aromatic compounds (like benzene) contain a higher percentage of    carbon and generally burn with a yellow, sooty flame due to    incomplete combustion.</p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following pairs consists of depositional landforms    formed by the action of wind?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Yardangs and Zeugens</p>", "option2": " <p style=\"orphans:0;widows:0\">    Barchans and Loess</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mushroom rocks and Inselbergs</p>", "option4": " <p style=\"orphans:0;widows:0\">    Deflation hollows and Pediments</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Barchans (crescent-shaped sand dunes) and Loess (extensive    deposits of wind-blown silt) are classic depositional landforms    formed by wind (aeolian) action. In contrast, yardangs, zeugens,    mushroom rocks, inselbergs, and deflation hollows are erosional    landforms formed by wind abrasion and deflation.</p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following agricultural systems is highly    specialised in the commercial cultivation of citrus fruits and    viticulture (grape farming)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Plantation agriculture</p>", "option2": " <p style=\"orphans:0;widows:0\">    Mediterranean agriculture</p>", "option3": " <p style=\"orphans:0;widows:0\">    Extensive commercial grain farming</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mixed farming</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Mediterranean agriculture is a highly specialised commercial    farming system practiced around the Mediterranean Sea, southern    California, central Chile, and parts of South Africa and    Australia. It is globally renowned for viticulture (grape    cultivation for winemaking and raisins) as well as the commercial    production of citrus fruits, olives, and figs.</p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following Vedas primarily contains magical spells,    charms, and incantations to ward off diseases and evil spirits?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Rigveda</p>", "option2": " <p style=\"orphans:0;widows:0\">    Yajurveda</p>", "option3": " <p style=\"orphans:0;widows:0\">    Samaveda</p>", "option4": " <p style=\"orphans:0;widows:0\">    Atharvaveda</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The <b>Atharvaveda</b> is the fourth Veda and deals primarily with    everyday life, containing magical spells, charms, and incantations    to cure diseases, protect against demons, and bring prosperity. In    contrast, the Rigveda contains hymns to deities, the Samaveda    contains musical melodies, and the Yajurveda contains sacrificial    formulas and rituals.</p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0\">    <b>Under which Article of the Constitution of India is the    provision for a joint sitting of both Houses of Parliament to    resolve a legislative deadlock made?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Article 110</p>", "option2": " <p style=\"orphans:0;widows:0\">    Article 108</p>", "option3": " <p style=\"orphans:0;widows:0\">    Article 112</p>", "option4": " <p style=\"orphans:0;widows:0\">    Article 86</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    According to Article 108 of the Constitution of India, if a    deadlock arises between the Lok Sabha and the Rajya Sabha    regarding the passage of an ordinary bill, the President may    summon a joint sitting of both Houses. The joint sitting is    presided over by the Speaker of the Lok Sabha.</p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following Parliamentary Committees consists    exclusively of members from the Lok Sabha?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Public Accounts Committee</p>", "option2": " <p style=\"orphans:0;widows:0\">    Committee on Public Undertakings</p>", "option3": " <p style=\"orphans:0;widows:0\">    Estimates Committee</p>", "option4": " <p style=\"orphans:0;widows:0\">    Committee on Petitions</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Estimates Committee is the largest Parliamentary Committee of    the Indian Parliament. It consists of 30 members, all of whom are    elected solely from the Lok Sabha (the Lower House). The Rajya    Sabha has no representation on this committee.</p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    <b>A file with the extension “.pptx” is primarily created for    which of the following?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Spreadsheets</p>", "option2": " <p style=\"orphans:0;widows:0\">    Presentations</p>", "option3": " <p style=\"orphans:0;widows:0\">    Audio editing</p>", "option4": " <p style=\"orphans:0;widows:0\">    Web browsing</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The file extension \".pptx\" is the default format for    presentation files created using Microsoft PowerPoint (from Office    2007 onwards). By contrast, \".xlsx\" is used for Excel    spreadsheets, and \".docx\" is used for Word documents.</p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0\">    <b>The famous monolithic rock-cut Kailash Temple at Ellora was    built under the patronage of which of the following dynasties?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Rashtrakuta Dynasty</p>", "option2": " <p style=\"orphans:0;widows:0\">    Chalukya Dynasty</p>", "option3": " <p style=\"orphans:0;widows:0\">    Pallava Dynasty</p>", "option4": " <p style=\"orphans:0;widows:0\">    Chera Dynasty</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The monolithic rock-cut Kailash Temple (Cave 16) at Ellora,    Maharashtra, was built in the 8th century CE under the patronage    of the Rashtrakuta king Krishna I. It is renowned as one of the    largest single rock-cut monuments in the world, carved vertically    down out of a single basalt cliff face.</p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0\">    <b>The Gandikota Canyon, popularly known as the 'Grand Canyon of    India', has been carved out by which of the following rivers?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Godavari</p>", "option2": " <p style=\"orphans:0;widows:0\">    Krishna</p>", "option3": " <p style=\"orphans:0;widows:0\">    Pennar</p>", "option4": " <p style=\"orphans:0;widows:0\">    Kaveri</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Gandikota Canyon is formed by the <b>Pennar River</b> (also    known as the Penna River) cutting through the Erramala Hills in    the YSR Kadapa district of Andhra Pradesh. Due to its striking    resemblance to the Grand Canyon of Arizona (USA), it is widely    known as the 'Grand Canyon of India'.</p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    <b>The Santhal Rebellion (Hul) of 1855–56 in the Rajmahal Hills    was primarily directed against which of the following?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Interference by Christian missionaries in tribal religious customs</p>", "option2": " <p style=\"orphans:0;widows:0\">    Oppressive practices of moneylenders, zamindars, and colonial    revenue policies</p>", "option3": " <p style=\"orphans:0;widows:0\">    Application of the Doctrine of Lapse to tribal chieftaincies</p>", "option4": " <p style=\"orphans:0;widows:0\">    Forced recruitment of tribal youth into the British Indian Army</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Santhal Rebellion of 1855–56, led by brothers Sidhu and    Kanhu Murmu in the Damin-i-koh region (Rajmahal Hills), was an    armed uprising against the intense exploitation by zamindars,    merchants, and moneylenders (collectively called 'Dikus'), which    was actively aided by the British colonial revenue administration.</p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <b>Following the introduction of the 1991 New Economic Policy (LPG    reforms), which sector of the Indian economy witnessed the most    rapid growth and emerged as the largest contributor to the Gross    Domestic Product (GDP)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Agriculture sector</p>", "option2": " <p style=\"orphans:0;widows:0\">    Manufacturing sector</p>", "option3": " <p style=\"orphans:0;widows:0\">    Service sector</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mining sector</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Following the 1991 economic reforms (Liberalisation,    Privatisation, and Globalisation), the <b>Service sector</b>    (tertiary sector) experienced unprecedented acceleration, driven    largely by telecommunications, information technology, banking,    and trade. While the relative share of agriculture declined and    manufacturing grew moderately, the service sector became the    principal engine of India's GDP growth, contributing more than 50%    to the total GDP in the post-reform period.</p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    <b>Through which of the following Constitutional Amendment Acts    was the Anti-Defection Law included in the Constitution of India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    42nd Constitutional Amendment Act, 1976</p>", "option2": " <p style=\"orphans:0;widows:0\">    52nd Constitutional Amendment Act, 1985</p>", "option3": " <p style=\"orphans:0;widows:0\">    61st Constitutional Amendment Act, 1989</p>", "option4": " <p style=\"orphans:0;widows:0\">    44th Constitutional Amendment Act, 1978</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Anti-Defection Law was introduced through the <b>52nd    Constitutional Amendment Act, 1985</b>. It added the Tenth    Schedule to the Indian Constitution, setting the provisions for    disqualification of elected members on grounds of defection from    one political party to another.</p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Article of the Indian Constitution guarantees the freedom    of conscience and the right to freely profess, practise and    propagate religion?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Article 25</p>", "option2": " <p style=\"orphans:0;widows:0\">    Article 28</p>", "option3": " <p style=\"orphans:0;widows:0\">    Article 21</p>", "option4": " <p style=\"orphans:0;widows:0\">    Article 19</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Article 25 of the Indian Constitution guarantees freedom of    conscience and the right to freely profess, practise, and    propagate religion to all persons, subject to public order,    morality, and health.</p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <b>Which command is used in the Windows Command Prompt to display    a list of files and subdirectories contained in the current    directory?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    ls</p>", "option2": " <p style=\"orphans:0;widows:0\">    dir</p>", "option3": " <p style=\"orphans:0;widows:0\">    list</p>", "option4": " <p style=\"orphans:0;widows:0\">    show</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In the Windows Command Prompt (CMD), the <b>dir</b> command is    used to display a list of files and folders (subdirectories)    contained in the current directory. (Note: ls is the equivalent    command in Unix/Linux operating systems).</p>", "question_heading": ""}, {"sr_no": 21, "question": "Dहनing पुध Rधॅियप यी 1857, थुicु नधृिध िधोकधन, ूयूिहोिनद ाnयथn ोौ ैDोnाो Sुोुै, ंयृiिप्रधक ूधयूिध ोnक िधक पुध नधौiौपोncध ोgोinौप पुध Bनiपiौु in Fोप्रोृोक?", "option1": "<p style=\"orphans:0;widows:0\">    Maulvi Ahmadullah Shah</p>", "option2": " <p style=\"orphans:0;widows:0\">    Khan Bahadur Khan</p>", "option3": " <p style=\"orphans:0;widows:0\">    Maulvi Liaquat Ali</p>", "option4": " <p style=\"orphans:0;widows:0\">    Azimullah Khan</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Maulvi Ahmadullah Shah was one of the key leaders of the Revolt of    1857 in Awadh, especially around Faizabad. He travelled in a    palanquin with a drum (danka) beating in front and followers    behind, which earned him the popular moniker 'Danka Shah'. He    played a major role in the famous Battle of Chinhat, where the    British forces led by Henry Lawrence were defeated.</p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <b>In the Windows Task Manager, which of the following tabs    provides real-time graphical monitoring and detailed statistics of    hardware resource utilization, such as CPU, Memory, Disk, and    Network?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Processes</p>", "option2": " <p style=\"orphans:0;widows:0\">    Performance</p>", "option3": " <p style=\"orphans:0;widows:0\">    App history</p>", "option4": " <p style=\"orphans:0;widows:0\">    Startup apps</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The 'Performance' tab in the Windows Task Manager displays    real-time graphs and detailed dynamic metrics for key system    components including the CPU, Memory (RAM), Disk drives, Network    adapters (Ethernet/Wi-Fi), and GPU.</p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following Constitutional Amendment Acts added the    Ninth Schedule and Article 31B to the Indian Constitution to    protect land reform laws from being invalidated on the ground of    violating Fundamental Rights?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    First Amendment Act, 1951</p>", "option2": " <p style=\"orphans:0;widows:0\">    Fourth Amendment Act, 1955</p>", "option3": " <p style=\"orphans:0;widows:0\">    Seventeenth Amendment Act, 1964</p>", "option4": " <p style=\"orphans:0;widows:0\">    Twenty-Fourth Amendment Act, 1971</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The First Constitutional Amendment Act, 1951 added the Ninth    Schedule along with Articles 31A and 31B to the Constitution of    India. Article 31B provides that none of the Acts and Regulations    specified in the Ninth Schedule shall be deemed to be void on the    ground that they are inconsistent with or take away any of the    Fundamental Rights conferred by Part III.</p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <b>In Carnatic music, what are the three primary structural    components of a standard 'Kriti' composition?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Pallavi, Anupallavi, and Charanam</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sthayi, Antara, and Sanchari</p>", "option3": " <p style=\"orphans:0;widows:0\">    Alap, Jod, and Jhala</p>", "option4": " <p style=\"orphans:0;widows:0\">    Vilambit, Madhyalaya, and Drut</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    A standard 'Kriti' in Carnatic music typically consists of three    structural parts: <b>Pallavi</b> (the opening refrain or theme),    <b>Anupallavi</b> (the secondary section that follows the Pallavi,    usually sung in higher octaves), and <b>Charanam</b> (the    concluding stanza which brings together the musical ideas and    often bears the composer's signature or <i>mudra</i>). In    contrast, Sthayi, Antara, and Sanchari are components of    Hindustani compositions (such as Dhrupad).</p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <b>In which battle was the Mughal Emperor Humayun decisively    defeated by Sher Shah Suri in 1540, forcing him to flee from Delhi    into exile?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Battle of Ghaghra</p>", "option2": " <p style=\"orphans:0;widows:0\">    Battle of Kannauj</p>", "option3": " <p style=\"orphans:0;widows:0\">    Battle of Chausa</p>", "option4": " <p style=\"orphans:0;widows:0\">    Battle of Sirhind</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Battle of Kannauj (also known as the Battle of Bilgram) took    place in 1540. Sher Shah Suri decisively defeated Humayun, causing    the collapse of the Mughal rule temporarily and forcing Humayun    into exile for nearly 15 years. Following this victory, Sher Shah    established the Sur Dynasty on the throne of Delhi.</p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0\">    <b>'Cheraw', popularly known as the 'Bamboo Dance', is a prominent    traditional folk dance of which of the following Indian states?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Nagaland</p>", "option2": " <p style=\"orphans:0;widows:0\">    Mizoram</p>", "option3": " <p style=\"orphans:0;widows:0\">    Meghalaya</p>", "option4": " <p style=\"orphans:0;widows:0\">    Manipur</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Cheraw dance is a traditional folk dance of Mizoram, India. It is    characterized by the use of long bamboo staves tapped rhythmically    against each other and on the ground, while dancers step    gracefully in and out of the moving bamboos. It is considered one    of the oldest dances of Mizoram and is popularly referred to as    the 'Bamboo Dance'.</p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following IEEE standards defines the set of    specifications for implementing Wireless Local Area Networks    (WLAN), commonly known as Wi-Fi?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    IEEE 802.3</p>", "option2": " <p style=\"orphans:0;widows:0\">    IEEE 802.11</p>", "option3": " <p style=\"orphans:0;widows:0\">    IEEE 802.5</p>", "option4": " <p style=\"orphans:0;widows:0\">    IEEE 802.16</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    IEEE 802.11 defines the standards and specifications for    implementing Wireless Local Area Networks (WLAN), commercially    known as Wi-Fi. In contrast, IEEE 802.3 specifies wired Ethernet,    IEEE 802.5 specifies Token Ring LANs, and IEEE 802.16 specifies    Broadband Wireless Access (WiMAX).</p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0\">    <b>The Chinese traveller Xuanzang (Hiuen Tsang) visited    Kanchipuram, the capital of the Pallava dynasty, during the reign    of which ruler?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Mahendravarman I</p>", "option2": " <p style=\"orphans:0;widows:0\">    Narasimhavarman I</p>", "option3": " <p style=\"orphans:0;widows:0\">    Simhavishnu</p>", "option4": " <p style=\"orphans:0;widows:0\">    Nandivarman II</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Xuanzang (Hiuen Tsang) visited Kanchipuram, the capital of the    Pallava dynasty, in around 640–642 CE during the reign of    Narasimhavarman I (also known as Mamalla). He described the city    as prosperous and noted the presence of numerous Buddhist    monasteries alongside Hindu temples.</p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0\">    <b>Which commission was appointed by the British Government in    1858 to recommend the reorganisation of the Indian army following    the Revolt of 1857?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Peel Commission</p>", "option2": " <p style=\"orphans:0;widows:0\">    Hunter Commission</p>", "option3": " <p style=\"orphans:0;widows:0\">    Strachey Commission</p>", "option4": " <p style=\"orphans:0;widows:0\">    MacDonnell Commission</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Following the Revolt of 1857, the British Government appointed the    <b>Peel Commission</b> in 1858 under Major General Jonathan Peel    to examine and reorganize the Indian army. Based on its    recommendations, the proportion of European troops to Indian    troops was increased (fixed at 1:2 in Bengal and 1:3 in Madras and    Bombay), artillery was placed almost exclusively under European    control, and recruitment was shifted towards groups classified as    'martial races' such as Sikhs, Gurkhas, and Pathans.</p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0\">    <b>Activities such as agriculture, forestry, and fishing are    categorized under which sector of the economy?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Secondary sector</p>", "option2": " <p style=\"orphans:0;widows:0\">    Primary sector</p>", "option3": " <p style=\"orphans:0;widows:0\">    Tertiary sector</p>", "option4": " <p style=\"orphans:0;widows:0\">    Quaternary sector</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The primary sector of an economy includes activities that are    directly dependent on the environment and involve the extraction    and harvesting of natural resources. Examples include agriculture,    forestry, fishing, and mining.</p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding Exercise NOMADIC    ELEPHANT:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. It is an annual joint military exercise conducted between    India and Mongolia.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. The 18th edition was conducted at the Foreign Training Node    in Pithoragarh, Uttarakhand, from September to October 2026.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. The primary focus of the exercise is on counter-terrorism    operations under a UN mandate in mountainous terrain.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "4", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    NOMADIC ELEPHANT is an annual bilateral military exercise between    India and Mongolia.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Its 18th    edition was held from 21 September to 3 October 2026 at    Pithoragarh, Uttarakhand.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">It focuses on    counter-terrorism and counter-insurgency operations under a UN    mandate.</p>    <p style=\"orphans:0;widows:0\">Troops from both countries    participated in semi-urban and mountainous operational drills.</p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the 22nd edition of    Exercise YUDH ABHYAS (September 2026):</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. It is a bilateral joint exercise conducted between the    Indian Navy and the United States Navy.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. The 2026 edition was conducted simultaneously at Auli    (Uttarakhand) and Mahajan Field Firing Range (Rajasthan).</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. Participating US Army personnel belonged to the 11th    Airborne Division.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statement 1 is incorrect: YUDH ABHYAS is an Army-to-Army bilateral    exercise between India and the USA.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The 22nd    edition was conducted from 15 to 28 September 2026 at Auli    (Uttarakhand) and Mahajan Field Firing Range (Rajasthan).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The US    contingent represented the 11th Airborne Division.</p>    <p style=\"orphans:0;widows:0\">The exercise focused on    high-altitude warfare and Integrated Battle Groups (IBGs).</p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Match List-I with List-II:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>List-I (Observances) List-II (Themes/Focus Areas)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>A. World Ozone Day (16 September) 1. Global Action for a Cooler    Planet</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>B. International Literacy Day (8 September) 2. Literacy for    People, Planet and Prosperity</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>C. World Duchenne Awareness Day (7 September) 3. Access Changes    Lives</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>D. International Day of Clean Air (7 September) 4. Action    against Air Pollution and Health Protection</b></p>    <p style=\"orphans:0;widows:0\"><b>Select the    correct code:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    A-1, B-2, C-3, D-4</p>", "option2": " <p style=\"orphans:0;widows:0\">    A-2, B-1, C-4, D-3</p>", "option3": " <p style=\"orphans:0;widows:0\">    A-1, B-3, C-2, D-4</p>", "option4": " <p style=\"orphans:0;widows:0\">    A-4, B-2, C-3, D-1</p>", "answer": "1", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    World Ozone Day – 16 September – Global Action for a Cooler    Planet.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">International    Literacy Day – 8 September – Literacy for People, Planet and    Prosperity.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">World    Duchenne Awareness Day – 7 September – Access Changes Lives.</p>    <p style=\"orphans:0;widows:0\">International Day of Clean Air    for Blue Skies – 7 September – Focuses on tackling air    pollution and protecting human health.</p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Union Ministry is responsible for implementing the    Pradhan Mantri Viksit Gram Swaraj Yojana, approved by the Union    Cabinet in October 2026?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Ministry of Rural Development</p>", "option2": " <p style=\"orphans:0;widows:0\">    Ministry of Panchayati Raj</p>", "option3": " <p style=\"orphans:0;widows:0\">    Ministry of Housing and Urban Affairs</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ministry of Finance</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The scheme was approved by the Union Cabinet in October 2026.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">It is    implemented by the Ministry of Panchayati Raj.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">It aims to    modernise Gram Panchayat infrastructure, strengthen digital    governance and promote self-reliance in rural areas.</p>    <p style=\"orphans:0;widows:0\">Its implementation period is FY    2026–27 to 2030–31.</p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding recently approved    government schemes in October 2026:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. The Union Cabinet approved an outlay of ₹1,856.67 crore    for the Khelo India Sports Goods Manufacturing Scheme.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. The Container Manufacturing Promotion Scheme (CMPS) was    approved with an outlay of ₹10,000 crore to boost domestic    production.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both 1 and 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2</p>", "answer": "3", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The Khelo India Sports Goods Manufacturing Scheme was approved    with an outlay of ₹1,856.67 crore.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">It aims to    promote domestic sports goods manufacturing and make India a    global export hub.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The Container    Manufacturing Promotion Scheme (CMPS) was approved with an outlay    of ₹10,000 crore.</p>    <p style=\"orphans:0;widows:0\">CMPS aims to strengthen domestic    container manufacturing and reduce dependence on imports.</p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0\">    <b>In September 2026, ISRO conducted testing related to the    propulsion system of its Next Generation Launch Vehicle (NGLV).    What is the designated name of this launch vehicle?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Vikram-S</p>", "option2": " <p style=\"orphans:0;widows:0\">    Soorya</p>", "option3": " <p style=\"orphans:0;widows:0\">    Gaganyaan-1</p>", "option4": " <p style=\"orphans:0;widows:0\">    Astra-X</p>", "answer": "2", "negative_marking": "0.33", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Soorya is the designated name mentioned for India's Next    Generation Launch Vehicle (NGLV).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">It is    designed as a heavy-lift, partially reusable launch vehicle.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Its proposed    payload capacity is up to 30 tonnes to Low Earth Orbit (LEO).</p>    <p style=\"orphans:0;widows:0\">It is intended to support India's    future space station and advanced human spaceflight missions.</p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding major sporting    events:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. The 20th Asian Games were scheduled to be hosted in Nagoya,    Aichi Prefecture, Japan, in September–October 2026.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. India won its maiden gold medal in the Open section at the    45th Chess Olympiad.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are correct?</b></p>", "option1": "<p sty
