<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>10.) MATH + REASONING COMBINED TEST-3 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

const questions = [{"sr_no": 1, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>8 प्रेक्षणों का माध्य 15 है तथा अन्य 12 प्रेक्षणों का माध्य 20 है। सभी 20 प्रेक्षणों का संयुक्त माध्य ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>17</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>18</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>18.5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>19</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Combined mean = (n₁x̄₁ + n₂x̄₂)/(n₁ + n₂).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Sum of the first group = 8 × 15 = 120.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Sum of the second group = 12 × 20 = 240.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Combined mean = (120 + 240)/20 = 360/20 = 18.</span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>वह सबसे छोटी धनात्मक पूर्णांक संख्या ज्ञात कीजिए जिसे क्रमशः 3, 5 और 7 से विभाजित करने पर शेषफल 2, 3 और 4 प्राप्त होते हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>53</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>48</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>104</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>68</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: N = divisor × quotient + remainder; solve the congruences step by step (the numbers in the periodic pattern repeat after LCM(3, 5, 7) = 105).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. N ≡ 4 (mod 7), so N = 7k + 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. N ≡ 3 (mod 5): 7k + 4 ≡ 3, i.e. 2k ≡ 4 (mod 5), so k ≡ 2 (mod 5). Hence N = 18 + 35m.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. N ≡ 2 (mod 3): 18 + 35m ≡ 2m ≡ 2 (mod 3), so m ≡ 1 (mod 3). Least m = 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. N = 18 + 35 = 53.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Check: 53 = 3×17 + 2 = 5×10 + 3 = 7×7 + 4 ✓</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>एक लंब वृत्तीय बेलन तथा एक लंब वृत्तीय शंकु की आधार त्रिज्या और ऊँचाई समान हैं। बेलन के आयतन और शंकु के आयतन का अनुपात ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2 : 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3 : ;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Percentage = (required number / total number) × 100.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Total students = 12 + 18 + 24 + 30 + 16 = 100.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Students with 40 or more marks = 24 + 30 + 16 = 70.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Percentage = 70/100 × 100 = 70%.</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>यदि समीकरण 2x² − 7x + k = 0 के मूलों का अंतर 1 है, तो k का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>51/8</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>49/8</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>47/8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>45/8</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: For roots α, β: α + β = −b/a, αβ = c/a, and (α − β)² = (α + β)² − 4αβ.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. α + β = 7/2 and αβ = k/2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. (α − β)² = 1 gives 49/4 − 2k = 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. 2k = 45/4, so k = 45/8.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Check: roots are 9/4 and 5/4; sum = 7/2 ✓, difference = 1 ✓</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>एक व्यक्ति 8 किमी पूर्व की ओर चलता है, फिर 6 किमी उत्तर की ओर, फिर 3 किमी पश्चिम की ओर तथा अंत में 1 किमी दक्षिण की ओर चलता है। प्रारंभिक बिंदु से उसकी न्यूनतम दूरी ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>5√3 km</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>5√2 km</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>5√5 km</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>10 km</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Shortest distance = √[(net east–west)² + (net north–south)²] (Pythagoras).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Net east = 8 − 3 = 5 km.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Net north = 6 − 1 = 5 km.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Distance = √(5² + 5²) = √50 = 5√2 km.</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2x² − 9x + 7 ≤ 0 को संतुष्ट करने वाले x के पूर्णांक मानों की संख्या ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: A quadratic with positive leading coefficient is ≤ 0 between its roots (inclusive).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Factorise: 2x² − 9x + 7 = (2x − 7)(x − 1).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. The roots are x = 1 and x = 7/2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. So 1 ≤ x ≤ 3.5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Integers: 1, 2, 3, i.e. 3 values.</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>दो वस्तुएँ प्रत्येक ₹1,200 में बेची जाती हैं। एक वस्तु पर विक्रेता को 20% लाभ तथा दूसरी वस्तु पर 20% हानि होती है। कुल प्रतिशत हानि या लाभ ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>No profit, no loss</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2% loss</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4% loss</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2% gain</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: CP = SP × 100 / (100 ± r%); overall % = (total SP − total CP) / total CP × 100.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. CP of the article sold at 20% gain = 1200 × 100/120 = ₹1,000.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. CP of the article sold at 20% loss = 1200 × 100/80 = ₹1,500.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Total CP = ₹2,500; total SP = ₹2,400.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Loss = ₹100, so loss % = 100/2500 × 100 = 4%.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Check (shortcut): equal-SP, equal-% case gives loss = (20)²/100 = 4% ✓</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>14 सेमी त्रिज्या वाले एक वृत्त की एक जीवा केंद्र पर समकोण बनाती है। लघु वृत्तखंड का क्षेत्रफल ज्ञात कीजिए। (π = 22/7 लीजिए)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>56 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>154 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>98 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>42 cm²</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Area of minor segment = area of sector − area of triangle = (θ/360°)πr² − ½r² sin θ.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Sector area = (90/360) × (22/7) × 14 × 14 = 154 cm².</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Triangle area = ½ × 14 × 14 = 98 cm².</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Segment area = 154 − 98 = 56 cm².</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>यदि x + y = 8 तथा x³ + y³ = 224 है, तो xy का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>16</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>14</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>12</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>10</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: x³ + y³ = (x + y)³ − 3xy(x + y).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. 224 = 8³ − 3·xy·8 = 512 − 24xy.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. 24xy = 288.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. xy = 12.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Check: x and y are the roots of t² − 8t + 12 = 0, i.e. 2 and 6; 8 + 216 = 224 ✓</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1 से 100 तक के पूर्णांकों में से एक संख्या यादृच्छिक रूप से चुनी जाती है। उसके 3 या 5 से विभाजित होने, लेकिन दोनों से एक साथ विभाजित न होने की प्रायिकता ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>47/100</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>40/100</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>37/100</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>41/100</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Exactly one of A, B = n(A) + n(B) − 2n(A ∩ B).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Multiples of 3 up to 100: ⌊100/3⌋ = 33.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Multiples of 5: ⌊100/5⌋ = 20.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Multiples of both (i.e. of 15): ⌊100/15⌋ = 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Favourable = 33 + 20 − 2 × 6 = 41.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>5. P = 41/100.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>पाँच प्रेक्षणों का माध्य 18 है। यदि एक प्रेक्षण 24 के स्थान पर 14 रख दिया जाए, तो नया माध्य ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>18</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>16</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>15</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>17</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Mean = (sum of observations)/(number of observations).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Original sum = 5 × 18 = 90.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. New sum = 90 − 24 + 14 = 80.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. New mean = 80/5 = 16.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>एक डिब्बे में 5 सफेद, 4 काली तथा 3 लाल गेंदें हैं। तीन गेंदें एक साथ निकाली जाती हैं। तीनों गेंदों के अलग-अलग रंग की होने की प्रायिकता ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4/11</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3/11</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2/11</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>5/11</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: P = (favourable combinations)/(total combinations), using nCr.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Total ways = 12C3 = 220.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Favourable = 5C1 × 4C1 × 3C1 = 60.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. P = 60/220 = 3/11.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>एक बहुभुज के अंतः कोणों का योग 1,980° है। बहुभुज के विकर्णों की संख्या ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>75</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>90</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>105</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>65</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Sum of interior angles = (n − 2) × 180°; number of diagonals = n(n − 3)/2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. (n − 2) × 180 = 1980, so n − 2 = 11 and n = 13.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Diagonals = 13 × (13 − 3)/2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. = 13 × 10/2 = 65.</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>पाँच प्रेक्षणों 4, 6, 8, 10 तथा 12 का मानक विचलन ज्ञात कीजिए। (इन्हें पूर्ण समष्टि मानिए)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4√2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2√2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: σ = √[Σ(xᵢ − x̄)² / n].</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Mean x̄ = (4 + 6 + 8 + 10 + 12)/5 = 8.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Squared deviations: 16, 4, 0, 4, 16, sum = 40.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Variance = 40/5 = 8.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. σ = √8 = 2√2.</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>60 विद्यार्थियों की एक कक्षा में 35 विद्यार्थी गणित, 30 विद्यार्थी विज्ञान तथा 15 विद्यार्थी दोनों विषय पढ़ते हैं। कितने विद्यार्थी न तो गणित और न ही विज्ञान पढ़ते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>10</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>15</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>20</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: n(M ∪ S) = n(M) + n(S) − n(M ∩ S); neither = total − n(M ∪ S).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. n(M ∪ S) = 35 + 30 − 15 = 50.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Neither = 60 − 50 = 10.</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>यदि tan θ + cot θ = 10/3 है, तो sec²θ + cosec²θ का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>109/9</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>118/9</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>100/9</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>127/9</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: tan θ + cot θ = 1/(sin θ cos θ); sec²θ + cosec²θ = 1/(sin²θ cos²θ).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. 1/(sin θ cos θ) = 10/3, so sin θ cos θ = 3/10.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. sec²θ + cosec²θ = 1/(sin²θ cos²θ) = [1/(sin θ cos θ)]².</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. = (10/3)² = 100/9.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Check: sec²θ + cosec²θ = 1/cos²θ + 1/sin²θ = (sin²θ + cos²θ)/(sin²θ cos²θ) ✓</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>जब बहुपद x³ + ax² + bx + 6 को (x − 1) से विभाजित किया जाता है, तो शेषफल 9 प्राप्त होता है। यदि यह (x + 2) से पूर्णतः विभाजित होता है, तो a + b का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>−2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>−4</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Remainder Theorem: when p(x) is divided by (x − c), the remainder is p(c).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. p(1) = 1 + a + b + 6 = 9, so a + b = 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. p(−2) = −8 + 4a − 2b + 6 = 0, so 2a − b = 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Adding the two equations: 3a = 3, so a = 1 and b = 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. a + b = 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Check: p(x) = x³ + x² + x + 6; p(1) = 9 ✓ and p(−2) = −8 + 4 − 2 + 6 = 0 ✓</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3 सेमी और 4 सेमी त्रिज्या वाले दो ठोस धातु के गोलों को पिघलाकर 6 सेमी बाहरी त्रिज्या वाला एक खोखला गोला बनाया जाता है। खोखले गोले की आंतरिक त्रिज्या ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4.5 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>5 cm</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Volume of a sphere = (4/3)πr³; volume of a hollow sphere = (4/3)π(R³ − r³); volume is conserved on melting.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Total volume melted ∝ 3³ + 4³ = 27 + 64 = 91.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Hollow sphere volume ∝ 6³ − r³ = 216 − r³.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. 216 − r³ = 91, so r³ = 125.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. r = 5 cm.</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>तीन निष्पक्ष सिक्कों को एक साथ उछाला जाता है। कम-से-कम दो चित आने की प्रायिकता ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3/8</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1/4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>5/8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1/2</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Probability = favourable outcomes / total outcomes.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Total outcomes = 2³ = 8.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Exactly 2 heads: 3C2 = 3 ways; exactly 3 heads: 1 way.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Favourable = 3 + 1 = 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Probability = 4/8 = 1/2.</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>यदि sin θ + cos θ = √(3/2) है, तो sin 2θ का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3/4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1/2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1/4</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: (sin θ + cos θ)² = 1 + 2 sin θ cos θ = 1 + sin 2θ.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Square both sides: (sin θ + cos θ)² = 3/2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. 1 + sin 2θ = 3/2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. sin 2θ = 1/2.</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>एक त्रिभुज का केंद्रक (3, 4) है। इसके दो शीर्ष (1, 2) तथा (5, 3) हैं। तीसरा शीर्ष ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>(3, 7)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>(4, 7)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>(3, 8)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>(4, 8)</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Centroid G = ((x₁ + x₂ + x₃)/3, (y₁ + y₂ + y₃)/3).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. (1 + 5 + x)/3 = 3, so 6 + x = 9 and x = 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. (2 + 3 + y)/3 = 4, so 5 + y = 12 and y = 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Third vertex = (3, 7).</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>अंकों 1, 2, 3, 4 और 5 का बिना पुनरावृत्ति उपयोग करके चार अंकों की संख्याएँ बनाई जाती हैं। ऐसी कितनी संख्याएँ 5 से विभाजित होंगी?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>30</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>18</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>24</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: A number is divisible by 5 if its units digit is 0 or 5; arrangements of r items from n = nPr = n!/(n − r)!.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. The units digit must be 5 (0 is not available), so it is fixed in 1 way.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. The remaining 3 places are filled from the digits 1, 2, 3, 4 without repetition.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Number of ways = 4P3 = 4 × 3 × 2 = 24.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>एक लंब वृत्तीय शंकु का वक्र पृष्ठीय क्षेत्रफल 550 सेमी² तथा आधार त्रिज्या 7 सेमी है। इसका आयतन ज्ञात कीजिए। (π = 22/7 लीजिए)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1,386 cm³</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1,540 cm³</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1,694 cm³</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1,232 cm³</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: CSA = πrl; l² = r² + h²; volume = (1/3)πr²h.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. 550 = (22/7) × 7 × l = 22l, so l = 25 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. h = √(25² − 7²) = √(625 − 49) = √576 = 24 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. V = (1/3) × (22/7) × 49 × 24.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. V = 1,232 cm³.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>दो अंकों की एक संख्या के अंकों का योग 11 है। यदि अंकों को आपस में बदल दिया जाए, तो प्राप्त संख्या मूल संख्या से 27 अधिक हो जाती है। मूल संख्या ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>65</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>47</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>56</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>38</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Number = 10a + b; reversed number = 10b + a; difference = 9(b − a).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Let the digits be a (tens) and b (units): a + b = 11.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. (10b + a) − (10a + b) = 9(b − a) = 27, so b − a = 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Adding: 2b = 14, so b = 7 and a = 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Original number = 47.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Check: 74 − 47 = 27 ✓</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>किसी संख्या का 3/7 भाग उसी संख्या के 5/9 भाग से 24 कम है। वह संख्या ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>196</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>189</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>168</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>180</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_te top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पैटर्न लागू करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C (3) + 2 = </span><span style=\"font-weight:bold\">E</span><span> (5), E + 2 = G (7), G + 1 = H (8) → C</span><span style=\"font-weight:bold\">E</span><span>GH</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>H (8) + 2 = J (10), J + 2 = L (12), L + 2 = </span><span style=\"font-weight:bold\">N</span><span> (14), N + 1 = O (15) → JL</span><span style=\"font-weight:bold\">N</span><span>O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O (15) + 2 = </span><span style=\"font-weight:bold\">Q</span><span> (17), Q + 2 = S (19), S + 2 = U (21), U + 1 = V (22) → </span><span style=\"font-weight:bold\">Q</span><span>SUV</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V (22) + 2 = X (24), X + 2 = Z (26), Z + 2 = </span><span style=\"font-weight:bold\">B</span><span> (2), B + 1 = C (3) → XZ</span><span style=\"font-weight:bold\">B</span><span>C</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C (3) + 2 = E (5), E + 2 = </span><span style=\"font-weight:bold\">G</span><span> (7), G + 2 = I (9), I + 1 = J (10) → E</span><span style=\"font-weight:bold\">G</span><span>IJ</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, रिक्त स्थानों को क्रमिक रूप से भरने वाले अक्षर </span><span style=\"font-weight:bold\">ENQBG</span><span> हैं।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">यदि संख्या 48316275 के प्रत्येक अंक को बाएं से दाएं आरोही क्रम में व्यवस्थित किया जाए, तो कितने अंकों का स्थान मूल संख्या के सापेक्ष अपरिवर्तित रहेगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक भी नहीं</span></p>", "option2": " <p style=\"marg dth=\"140\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021672673_image051.png\" width=\"121\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021672673_image052.png\" width=\"132\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, सही उत्तर 237 है।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक प्रश्न दिया गया है, जिसके बाद (I) और (II) से अंकित दो कथन दिए गए हैं। पहचान कीजिए कि कौन-सा/से कथन प्रश्न का उत्तर देने के लिए पर्याप्त है/हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">प्रश्न: छह व्यक्ति A, B, C, D, E और F एक वृत्ताकार मेज के चारों ओर केंद्र की ओर मुख करके बैठे हैं। D के ठीक बाईं ओर कौन बैठा है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कथन:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(I) D, B के दाईं ओर दूसरे स्थान पर बैठा है। B और E के बीच केवल एक व्यक्ति बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(II) A, D के ठीक दाईं ओर बैठा है। F, E का निकटतम पड़ोसी नहीं है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I अकेले पर्याप्त है जबकि कथन II अकेले पर्याप्त नहीं है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन II अकेले पर्याप्त है जबकि कथन I अकेले पर्याप्त नहीं है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों मिलकर भी पर्याप्त नहीं हैं।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों मिलकर पर्याप्त हैं।</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माना केंद्र की ओर मुख करके बैठे व्यक्तियों के लिए वृत्ताकार मेज पर दक्षिणावर्त (क्लॉकवाइज़) दिशा में 1 से 6 तक स्थान हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केंद्र की ओर मुख होने पर दक्षिणावर्त चलना बाईं ओर तथा वामावर्त चलना दाईं ओर होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कथन (I) से:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माना D स्थान 1 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चूँकि D, B के दाईं ओर दूसरे स्थान पर है, इसलिए B स्थान 3 पर होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B और E के बीच केवल एक व्यक्ति बैठा है, जिसका अर्थ है कि E स्थान 1 या स्थान 5 पर हो सकता है। चूँकि स्थान 1 पर D है, इसलिए E स्थान 5 पर होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शेष स्थान (2, 4, 6) A, C और F द्वारा लिए जाएंगे। D के ठीक बाईं ओर (स्थान 2) कौन बैठा है, यह निश्चित रूप से ज्ञात नहीं किया जा सकता।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, केवल कथन (I) पर्याप्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कथन (II) से:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A, D के ठीक दाईं ओर (स्थान 6) बैठा है। अन्य व्यक्तियों के स्थानों के बारे में कोई निश्चित जानकारी नहीं मिलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, केवल कथन (II) पर्याप्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कथन (I) और (II) को मिलाने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D स्थान 1 पर है, B स्थान 3 पर है और E स्थान 5 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (II) से, A स्थान 6 पर है (D के ठीक दाईं ओर)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अब C और F के लिए केवल स्थान 2 और 4 शेष बचते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चूँकि F, E (स्थान 5) का निकटतम पड़ोसी नहीं है, इसलिए F स्थान 4 पर नहीं बैठ सकता। अतः F को स्थान 2 पर बैठना होगा और C स्थान 4 पर बैठेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इस प्रकार, D के ठीक बाईं ओर (स्थान 2 पर) F बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, प्रश्न का उत्तर देने के लिए कथन (I) और (II) दोनों मिलकर पर्याप्त हैं।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित पाँच आकृतियों में से चार एक निश्चित प्रकार से एक समान हैं और इस प्रकार एक समूह बनाती हैं। वह कौन-सी आकृति है जो उस समूह से संबंधित नहीं है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021672673_image053.png\" width=\"500\" height=\"120\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021672673_image054.png\" width=\"100\" height=\"100\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021672673_image055.png\" width=\"100\" height=\"100\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021672673_image056.png\" width=\"100\" height=\"100\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021672673_image057.png\" width=\"100\" height=\"100\" alt ></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आकृति (D) को छोड़कर अन्य सभी आकृतियों में केंद्र में सबसे भीतरी आकृति एक वृत्त है। आकृति (D) में सबसे भीतरी आकृति एक समचतुर्भुज/वर्ग है। अतः आकृति (D) उस समूह से संबंधित नहीं है।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक कथन दिया गया है, जिसके बाद I और II के रूप में संख्यांकित दो निष्कर्ष दिए गए हैं। कथन को पढ़ें और तय करें कि दिए गए कथन के आधार पर कौन-सा/से निष्कर्ष सत्य है/हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कथन: इस वर्ष खाद्यान्न का रिकॉर्ड कृषि उत्पादन होने के बावजूद, घरेलू बाजार में आवश्यक अनाजों की खुदरा कीमतों में लगातार वृद्धि जारी है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. उत्पादन में रिकॉर्ड वृद्धि आवश्यक रूप से खुदरा कीमतों में गिरावट की गारंटी नहीं देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. निजी व्यापारियों द्वारा की जाने वाली जमाखोरी खाद्यान्न की कीमतों में इस वृद्धि का मुख्य कारण है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष I सत्य है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष II सत्य है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निष्कर्ष I और II दोनों सत्य हैं।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो निष्कर्ष I और न ही निष्कर्ष II सत्य है।</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन से यह स्पष्ट है कि रिकॉर्ड पैदावार होने के बावजूद खुदरा कीमतों में वृद्धि जारी रही। इससे सीधे तौर पर यह तार्किक निष्कर्ष निकलता है कि केवल उच्च उत्पादन होना ही खुदरा कीमतों में कमी की गारंटी नहीं देता है, इसलिए निष्कर्ष I सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निष्कर्ष II एक बाहरी कारक (निजी व्यापारियों द्वारा जमाखोरी) को मुख्य कारण बताता है, जिसका कथन में कोई उल्लेख नहीं है और न ही इसे केवल कथन के आधार पर निगमित किया जा सकता है। अतः निष्कर्ष II सत्य नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, केवल निष्कर्ष I सत्य है।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">नीचे दिए गए प्रश्न में एक प्रश्न और उसके बाद दो कथन क्रमांकित (I) और (II) दिए गए हैं। आपको यह तय करना है कि कथनों में दी गई जानकारी प्रश्न का उत्तर देने के लिए पर्याप्त है या नहीं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">प्रश्न: दिव्या का रोहन से क्या संबंध है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(I) रोहन, सुरेश का पुत्र है और सुरेश, कविता का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(II) दिव्या, कविता की पुत्री है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल कथन (I) पर्याप्त है जबकि केवल कथन (II) पर्याप्त नहीं है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल कथन (II) पर्याप्त है जबकि केवल कथन (I) पर्याप्त नहीं है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (I) और (II) दोनों मिलकर आवश्यक हैं।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो कथन (I) और न ही कथन (II) पर्याप्त है।</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (I) से: रोहन, सुरेश का पुत्र है और सुरेश, कविता का भाई है। यहाँ दिव्या के बारे में कोई जानकारी नहीं है, अतः केवल कथन (I) पर्याप्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (II) से: दिव्या, कविता की पुत्री है। यहाँ रोहन के बारे में कोई जानकारी नहीं है, अतः केवल कथन (II) पर्याप्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (I) और (II) दोनों को मिलाने पर: सुरेश, रोहन के पिता हैं, कविता, सुरेश की बहन हैं और दिव्या, कविता की पुत्री है। अतः दिव्या, रोहन की बुआ की पुत्री (फुफेरी बहन) है। इसलिए, प्रश्न का उत्तर देने के लिए दोनों कथन (I) और (II) मिलकर आवश्यक हैं।</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">उस विकल्प का चयन कीजिए जो तीसरे शब्द से उसी प्रकार संबंधित है जिस प्रकार दूसरा शब्द पहले शब्द से संबंधित है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justif rgin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M K N P T R</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई शृंखला में कुल 18 अक्षर हैं। शृंखला को 6-6 अक्षरों के 3 बराबर समूहों में विभाजित करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>_ K T P _ R / M _ T _ N R / M K _ P N _</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रत्येक समूह में दोहराया जाने वाला पैटर्न </span><span style=\"font-weight:bold\">M K T P N R</span><span> है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पहला समूह: </span><span style=\"font-weight:bold\">M</span><span> K T P </span><span style=\"font-weight:bold\">N</span><span> R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दूसरा समूह: M </span><span style=\"font-weight:bold\">K</span><span> T </span><span style=\"font-weight:bold\">P</span><span> N R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीसरा समूह: M K </span><span style=\"font-weight:bold\">T</span><span> P N </span><span style=\"font-weight:bold\">R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः शृंखला को पूरा करने के लिए क्रमिक रूप से आवश्यक अक्षर </span><span style=\"font-weight:bold\">M N K P T R</span><span> हैं।</span></p>", "question_heading": ""}, {"sr_no": 53, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">आकृति A एक निश्चित पैटर्न में B से संबंधित है। उसी पैटर्न का अनुसरण करते हुए, आकृति C, D से संबंधित है। पैटर्न का अध्ययन कीजिए और उस आकृति का चयन कीजिए जिसे D के स्थान पर रखा जाना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021672673_image065.png\" width=\"500\" height=\"139\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021672673_image066.png\" width=\"100\" height=\"100\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021672673_image067.png\" width=\"100\" height=\"100\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021672673_image068.png\" width=\"100\" height=\"100\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021672673_image069.png\" width=\"100\" height=\"100\" alt ></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आकृति A से आकृति B का पैटर्न 180° का पूर्ण घूर्णन (केंद्र के सापेक्ष बिंदु परावर्तन) है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केंद्रीय आकृति 180° घूमती है: शीर्ष पर स्थित वृत्ताकार सिरा नीचे चला जाता है, तथा नीचे स्थित त्रिभुज ऊपर जाकर ऊपर की ओर इंगित करने लगता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ऊपरी-बाएँ कोने का तत्व विकर्णतः निचले-दाएँ कोने में चला जाता है और 180° घूम जाता है (दाएँ इंगित करने वाला त्रिभुज अब बाएँ इंगित करता है)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आकृति D प्राप्त करने के लिए आकृति C पर वही 180° का घूर्णन लागू करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केंद्रीय तीर (जो ऊपर की ओर इंगित करता है और जिसके आधार पर एक रिंग है) 180° घूम जाता है, जिससे रिंग शीर्ष पर आ जाती है और तीर नीचे की ओर इंगित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ऊपरी-बाएँ कोने में स्थित अक्षर 'F' निचले-दाएँ कोने में चला जाता है और 180° घूम जाता है (उल्टा होकर इसकी भुजाएँ बाएँ ओर इंगित करती हैं)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, विकल्प (B) में दी गई आकृति D के स्थान पर सही आएगी।</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">STREAM शब्द के दूसरे, तीसरे, चौथे और छठे अक्षरों (बायें से दायें गणना करने पर) से प्रत्येक शब्द में प्रत्येक अक्षर का केवल एक बार प्रयोग करते हुए कितने सार्थक अंग्रेजी शब्द बनाए जा सकते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शून्य</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिया गया शब्द: STREAM</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बायें से दायें गणना करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दूसरा अक्षर = T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीसरा अक्षर = R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चौथा अक्षर = E</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>छठा अक्षर = M</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्राप्त अक्षर T, R, E और M हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रत्येक अक्षर का केवल एक बार प्रयोग करके बनने वाला एकमा
