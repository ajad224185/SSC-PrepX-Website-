<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>6.) ENGLISH + GK COMBINED TEST-2 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

ening, while    tending his mentor’s shop alone, an elderly traveller entered,    soaking wet and dressed in a frayed, threadbare cloak. The    stranger produced an intricate pocket watch that had stopped    ticking and pleaded for help, lamenting that it was his only    treasured possession. Observing the man’s shivering hands and    despondent expression, Julian felt profound pity for him. Although    his shift had ended and he was eager to return home, Julian spent    two painstaking hours repairing the delicate gears and replacing a    damaged spring. When the stranger reached into his pocket and    admitted that he had no money to pay for the service, Julian    gently waved his hand and insisted on completing the repair free    of charge. The old traveller thanked him with deep sincerity and    departed into the night. The next afternoon, Julian was summoned    to the guildhall. To his astonishment, he discovered that the    traveller was Master Raymond, the Chief Horologist to the King,    who had been travelling incognito to inspect local craftsmanship.    Julian felt intensely anxious, fearing the master would reprimand    him for conducting unofficial work without guild oversight.    However, Master Raymond presented him with an official master’s    charter and paid his registration fee in full, declaring it a    reward from “a destitute wanderer.” The episode highlights the    essence of genuine altruism. Julian had very little time or wealth    to spare, yet he offered his skill wholeheartedly without    anticipating any personal gain. Master Raymond valued the act    precisely because it was performed when no prestige or profit was    at stake. While service performed for public acclaim may satisfy    one’s pride, virtue displayed in obscurity reveals true    character.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">Which inference best explains the    contrast between Julian’s free service and Master Raymond’s    charter gift?</p>", "option1": "<p style=\"orphans:0;widows:0\">    The service represents professional negligence, whereas the gift    represents royal authority.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The service was provided out of naivety, whereas the gift was    presented to flaunt guild power.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The service reflects poor business judgment, whereas the gift    compensates for Julian's lost time.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The service demonstrates altruism through unprompted sacrifice,    whereas the gift rewards that noble character.</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Julian's gesture involved giving his own scarce time and skill    with no expectation of reward, demonstrating pure generosity and    sacrifice, whereas Master Raymond’s substantial gift recognised    and honoured that moral virtue. Thus, option D is the most    appropriate inference.</p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct passive form of the given sentence:</p>    <p style=\"orphans:0;widows:0\"><b>The committee ought not to    have dispensed with the services of the senior consultant.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    The services of the senior consultant ought not to have been    dispensed with by the committee.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The services of the senior consultant ought not to be dispensed    with by the committee.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The services of the senior consultant ought not to have been    dispensed by the committee.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The senior consultant ought not to have been dispensed with the    services of the committee.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the active voice with a modal perfect    construction: <i>Subject + ought not to have + V3 (dispensed) +    preposition (with) + Object</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">When    converting this structure into passive voice:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The object of    the active sentence ('The services of the senior consultant')    becomes the subject.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The verb    changes to: <b>ought not to have been + V3 + preposition</b>    ('ought not to have been dispensed with'). Note that the    preposition 'with' is an integral part of the phrasal verb    'dispense with' and must be retained.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The agent    ('by the committee') is added at the end.</p>    <p style=\"orphans:0;widows:0\">Hence, <b>Option A</b> is the    correct passive form.</p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Rearrange the parts of the sentence in the correct order.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A team of    international scientists</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">P. capable of    predicting seismic events</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Q. has    formulated an advanced algorithm</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R. helping    authorities minimize disaster risks</p>    <p style=\"orphans:0;widows:0\">S. with unprecedented precision    and speed,</p>", "option1": "<p style=\"orphans:0;widows:0\">    QPSR</p>", "option2": " <p style=\"orphans:0;widows:0\">    PQSR</p>", "option3": " <p style=\"orphans:0;widows:0\">    QRPS</p>", "option4": " <p style=\"orphans:0;widows:0\">    SQPR</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sequence is <b>QPSR</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    sentence begins with the subject: 'A team of international    scientists'. It requires a predicate/verb phrase, which is    provided by part <b>Q</b> ('has formulated an advanced    algorithm').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Part <b>P</b>    ('capable of predicting seismic events') is an adjective phrase    modifying the noun 'algorithm'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Part <b>S</b>    ('with unprecedented precision and speed,') is an adverbial phrase    explaining how the algorithm predicts seismic events.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Part <b>R</b>    ('helping authorities minimize disaster risks') acts as a    participial clause showing the outcome/result of this predictive    ability.</p>    <p style=\"orphans:0;widows:0\">Thus, the coherent sentence is:    <i>\"A team of international scientists has formulated an    advanced algorithm capable of predicting seismic events with    unprecedented precision and speed, helping authorities minimize    disaster risks.\"</i></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct passive form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">Does the bank charge additional    fees on international transactions?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Have additional fees been charged on international transactions by    the bank?</p>", "option2": " <p style=\"orphans:0;widows:0\">    Are additional fees charged on international transactions by the    bank?</p>", "option3": " <p style=\"orphans:0;widows:0\">    Were additional fees charged on international transactions by the    bank?</p>", "option4": " <p style=\"orphans:0;widows:0\">    Are additional fees being charged on international transactions by    the bank?</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is an interrogative sentence in the Simple    Present Tense.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The active    voice structure is: <i>Do/Does + Subject + </i>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794421545672_html_6d47a5ab5429ad09.gif\" > <i>    + Object + ...?</i></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The passive    voice structure is: <i>Is/Am/Are + Object (new subject) + </i>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794421545672_html_a2a1051d25850e4a.gif\" > <i>    + by + Subject (new object) + ...?</i></p>    <p style=\"orphans:0;widows:0\">Here, the object 'additional    fees' is plural, so it takes the auxiliary verb 'Are'. Hence, the    correct passive sentence is: <b>\"Are additional fees charged    on international transactions by the bank?\"</b></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate option to substitute the underlined    segment in the given sentence: She <u>arrived here today morning</u>    by the early train.</p>", "option1": "<p style=\"orphans:0;widows:0\">    arrives here this morning</p>", "option2": " <p style=\"orphans:0;widows:0\">    arrived here this morning</p>", "option3": " <p style=\"orphans:0;widows:0\">    had arrived here today morning</p>", "option4": " <p style=\"orphans:0;widows:0\">    was arriving here this morning</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In standard English, the phrase 'today morning' is incorrect and    considered non-standard. The correct time adverbial expression is    'this morning' (just as 'yesterday night' is replaced by 'last    night'). Since the sentence describes a completed past action, the    simple past tense 'arrived' is correct. Therefore, 'arrived here    this morning' is the appropriate substitution.</p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to substitute the underlined    segment in the given sentence.</p>    <p style=\"orphans:0;widows:0\">The coach <u>advised to the    players to remain</u> calm during the final match.</p>", "option1": "<p style=\"orphans:0;widows:0\">    advised the players for remaining</p>", "option2": " <p style=\"orphans:0;widows:0\">    advised to players to remain</p>", "option3": " <p style=\"orphans:0;widows:0\">    advised the players to remain</p>", "option4": " <p style=\"orphans:0;widows:0\">    advised to the players for remain</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    'Advise' is a transitive verb when followed by an object, and it    takes an indirect object directly without the preposition 'to'    (i.e., 'advise somebody to do something'). Therefore, 'advised to    the players' is incorrect and should be replaced by 'advised the    players to remain'. Thus, option C is the correct answer.</p>", "question_heading": ""}, {"sr_no": 11, "question": "Rधोननोngध पुध ीियियथing ौधnपधncधौ पय ीयनं ो cयुधनधnप ूोनोgनोूु: 1. Hयथधॅधन, धीीiciधnप धnधनgद ौपयनोgध नधंोinौ यnध यी पुध ूनiंोनद यृौपोcिधौ पय iपौ थiकधौूनधोक cयnपinहयहौ हौध. 2. Sियोन धnधनgद ुोौ धंधनgधक ोौ ो ूनयंiौing ोिपधनnोपiॅध पय ीयौौiि ीहिधस in पुध पनोnौiपiयn पयथोनक cिधोn ूयथधन. 3. Iप ुोनnधौौधौ नोकiोnप िigुप ोnक ुधोप ीनयं पुध ौहn हौing पधcुnिययgiधौ ौहcु ोौ ूुयपयॅियपोic ूोnिधस. 4. Rधcधnप ृनधोापुनयहgुौ in ृोपपधनद cुधंiौपनद ोनध ौपधोकiिद ोककनधौौing पुiौ inपधनंiपपधnप ौहूूिद cुोििधngध.", "option1": "<p style=\"orphans:0;widows:0\">    2, 3, 1, 4</p>", "option2": " <p style=\"orphans:0;widows:0\">    3, 2, 4, 1</p>", "option3": " <p style=\"orphans:0;widows:0\">    2, 1, 4, 3</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 4, 2, 3</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sequence is <b>2, 3, 1, 4</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Sentence <b>2</b>    is an independent introductory sentence that introduces the main    topic: solar energy as a clean power alternative.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Sentence <b>3</b>    logically follows sentence 2 as the pronoun 'It' refers to solar    energy and elaborates on how it is generated.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Sentence <b>1</b>    introduces a limitation/challenge using the transitional word    'However' regarding the difficulty of continuous energy storage.</p>    <p style=\"orphans:0;widows:0\">- Sentence <b>4</b> concludes the    paragraph by addressing the challenge mentioned in sentence 1 with    the phrase 'this intermittent supply challenge'.</p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Rearrange the following sentences to form a coherent paragraph:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Among    these clean alternatives, solar power has witnessed the most rapid    technological advancement and adoption.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. The global    transition toward renewable energy is driven by the urgent need to    combat climate change.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. This rapid    growth is largely fueled by modern solar panels becoming    significantly cheaper and more efficient.</p>    <p style=\"orphans:0;widows:0\">4. Consequently, solar energy is    poised to play a central role in meeting the world's future power    demands.</p>", "option1": "<p style=\"orphans:0;widows:0\">    1, 3, 2, 4</p>", "option2": " <p style=\"orphans:0;widows:0\">    2, 1, 3, 4</p>", "option3": " <p style=\"orphans:0;widows:0\">    2, 4, 1, 3</p>", "option4": " <p style=\"orphans:0;widows:0\">    3, 2, 1, 4</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Sentence 2 introduces the broad topic of the paragraph—the    global shift toward renewable energy to fight climate change.    Sentence 1 follows directly by focusing on a specific form of    renewable energy, referencing 'these clean alternatives'. Sentence    3 elaborates on the reasons behind the rapid progress mentioned in    sentence 1 ('This rapid growth is largely fueled by...'). Finally,    sentence 4 provides a logical conclusion using the transition word    'Consequently'. Hence, the correct coherent sequence is <b>2, 1,    3, 4</b>.</p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    Select the wrongly spelt word out of the four alternatives.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Inadvertent</p>", "option2": " <p style=\"orphans:0;widows:0\">    Incessant</p>", "option3": " <p style=\"orphans:0;widows:0\">    Indispensible</p>", "option4": " <p style=\"orphans:0;widows:0\">    Inextricable</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The wrongly spelt word is 'Indispensible'. The correct spelling is    <b>'Indispensable'</b> (with an 'a' instead of the second 'i'),    which means absolutely necessary or essential.</p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0\">    Select the correctly spelt word out of the four alternatives.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Picturisque</p>", "option2": " <p style=\"orphans:0;widows:0\">    Pictureasque</p>", "option3": " <p style=\"orphans:0;widows:0\">    Picturesque</p>", "option4": " <p style=\"orphans:0;widows:0\">    Pictoresque</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The correctly spelt word is <b>Picturesque</b>, which means    visually attractive, especially in a quaint or charming way. All    other spellings are incorrect.</p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">The trekker paused to drink from    the ________ mountain spring, so clear that every pebble on the    bed was visible.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Stagnant</p>", "option2": " <p style=\"orphans:0;widows:0\">    Turbid</p>", "option3": " <p style=\"orphans:0;widows:0\">    Limpid</p>", "option4": " <p style=\"orphans:0;widows:0\">    Pungent</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>Limpid</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Limpid</b>    means completely clear and transparent (especially describing    water or eyes). The context of the sentence ('so clear that every    pebble on the bed was visible') clearly indicates that the spring    water was transparent and pure.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Stagnant:</b>    (of water) having no current or flow and often having an    unpleasant smell.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Turbid:</b>    cloudy, muddy, or thick with suspended matter.</p>    <p style=\"orphans:0;widows:0\"><b>Pungent:</b> having a sharply    strong taste or smell.</p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span style=\"font-size:11pt\">Select    the correct option for the Direct Speech conversion of the    sentence below.</span></span></p>    <p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\">She    noted that, had the literary trope not been overused, the metaphor    might still have resonated with the audience.</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">She    said, \"If the literary trope was not overused, the metaphor    may still resonate with the audience.”</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">She    said, \"Had the literary trope not been overused, the metaphor    might still have resonated with the audience.”</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">She    said, \"Had the literary trope not been overused, the metaphor    must still resonate with the audience.”</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">She    said, \"If the literary trope had not been overused, the    metaphor will still resonate with the audience.”</span></span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\">The    correct option is </span></span><span><span style=\"font-size:11pt\"><b>(B)    She said, \"Had the literary trope not been overused, the    metaphor might still have resonated with the audience.\"</b></span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <span><span style=\"font-size:11pt\"><b>Third     Conditional (Unreal Past) Immutability Rule:</b></span></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><span style=\"font-size:11pt\">In      Direct to Indirect speech conversion, </span></span><span><span style=\"font-size:11pt\"><b>Third      Conditional structures</b></span></span><span><span style=\"font-size:11pt\">      (If / Had + Past\\ Perfect \\dots would / might / could + have +      V3) reflect an unchangeable hypothetical past state.</span></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><span style=\"font-size:11pt\">Consequently,      their tense and modal auxiliaries (</span></span><span><span style=\"font-size:11pt\"><b>\"had      ... not been\"</b></span></span><span><span style=\"font-size:11pt\">      and </span></span><span><span style=\"font-size:11pt\"><b>\"might      still have resonated\"</b></span></span><span><span style=\"font-size:11pt\">)      </span></span><span><span style=\"font-size:11pt\"><b>do      NOT backshift further</b></span></span><span><span style=\"font-size:11pt\">      when converted between Direct and Indirect speech.</span></span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><span style=\"font-size:11pt\"><b>Other     Options:</b></span></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><span style=\"font-size:11pt\"><b>Option      (B) [CORRECT]:</b></span></span><span><span style=\"font-size:11pt\">      Retains the exact inverted third conditional structure (</span></span><span><span style=\"font-size:11pt\"><i>\"Had      ... not been overused, ... might still have resonated\"</i></span></span><span><span style=\"font-size:11pt\">).      The indirect sentence accurately mirrors this without altering      tense or mood.</span></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><span style=\"font-size:11pt\"><b>Option      (A) [INCORRECT]:</b></span></span><span><span style=\"font-size:11pt\">      Changes the past perfect conditional to a simple past/present      modal (</span></span><span><span style=\"font-size:11pt\"><i>\"was      not overused\"</i></span></span><span><span style=\"font-size:11pt\">,      </span></span><span><span style=\"font-size:11pt\"><i>\"may      still resonate\"</i></span></span><span><span style=\"font-size:11pt\">),      altering the original meaning.</span></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><span style=\"font-size:11pt\"><b>Option      (C) [INCORRECT]:</b></span></span><span><span style=\"font-size:11pt\">      Introduces </span></span><span><span style=\"font-size:11pt\"><i>\"must      still resonate\"</i></span></span><span><span style=\"font-size:11pt\">,      changing both the modal auxiliary and the tense.</span></span></p>      </li><li><p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\"><b>Option      (D) [INCORRECT]:</b></span></span><span><span style=\"font-size:11pt\">      Switches the result clause to the future tense (</span></span><span><span style=\"font-size:11pt\"><i>\"will      still resonate\"</i></span></span><span><span style=\"font-size:11pt\">),      which breaks the third conditional logic entirely.</span></span></p>     </li></ul>    </li></ul>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span style=\"font-size:11pt\">Convert    the sentence provided below from its passive voice structure to an    active voice structure:</span></span></p>    <p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\">The    evidence is believed to have been tampered with by unknown    individuals.</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">Unknown    individuals believed to have tampered with the evidence.</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">Unknown    individuals have been believed to have tampered with the evidence.</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">Unknown    individuals are believed to have tampered with the evidence.</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">Unknown    individuals are believed to will have tampered with the evidence.</span></span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span style=\"font-size:11pt\"><b>Passive    Voice:</b></span></span><span><span style=\"font-size:11pt\">    The evidence is believed to have been tampered with by unknown    individuals.</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><span style=\"font-size:11pt\"><b>Active    Voice:</b></span></span><span><span style=\"font-size:11pt\">    Unknown individuals are believed to have tampered with the    evidence.</span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><span style=\"font-size:11pt\">When     converting this structure into active voice, remove the passive     construction \"to have been tampered with\" and use \"to     have tampered with\".</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\">Hence,    </span></span><span><span style=\"font-size:11pt\"><b>Option    (C)</b></span></span><span><span style=\"font-size:11pt\">    is correct.</span></span></p>", "question_heading": ""}, {"sr_no": 18, "question": "Wुicु यी पुध giॅधn यूपiयnौ ोननोngधौ पुध ीियियथing ौधnपधncधौ in पुध ंयौप ियgicोि ौधतहधncध पय ीयनं ो ंधोningीिह ूोनोgनोूु? 1. Accयनकing पय Kोnप, inकiॅiकहोिस ंहौप पनधोप यपुधनौ ोौ धnकौ in पुधंौिधॅधौ, nयप ंधनिधद ोौ ंधोnौ पय ोn धnक. 2. Tुध Cोपधgयनicोि Iंूधनोपiॅध iौ ो ंयनोि िोथ पुोप cयंंोnकौ inकiॅiकहोिस पय ोcप in थोदौ पुोप cयिहक ृध ंोकध ो हniॅधनौोि िोथ. 3. Iंंोnहिध Kोnपैौ धपुicोि पुधयनद iौ ृो   Categorical Imperative in deontological ethics.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\">Hence,    </span></span><span><span style=\"font-size:11pt\"><b>Option    (A)</b></span></span><span><span style=\"font-size:11pt\">    is correct.</span></span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span style=\"font-size:11pt\"><b>Fill    in the blank with the most appropriate option:</b></span></span></p>    <p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\">Unable    to handle the sustained pressure, the junior associate    eventually______during the audit.</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">broke    out</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">broke    away</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">broke    off</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">broke    down</span></span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\">The    correct option is </span></span><span><span style=\"font-size:11pt\"><b>broke    down</b></span></span><span><span style=\"font-size:11pt\">.</span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <span><span style=\"font-size:11pt\">The     sentence refers to a junior associate failing     mentally/emotionally or collapsing under </span></span><span><span style=\"font-size:11pt\"><i>\"sustained     pressure\"</i></span></span><span><span style=\"font-size:11pt\">.</span></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\"><span><span style=\"font-size:11pt\"><b>Broke      down:</b></span></span><span><span style=\"font-size:11pt\">      To collapse physically, mentally, or emotionally under strain;      to stop functioning (\\rightarrow </span></span><span><span style=\"font-size:11pt\"><b>Correct</b></span></span><span><span style=\"font-size:11pt\">).</span></span></p>     </li></ul>    </li></ul>    <h3><a name=\"_heading=h.mt60s0z7bycp\"></a>    <span><span><span style=\"font-size:13pt\"><b>Why    Other Options Are Incorrect</b></span></span></span></h3>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <span><span style=\"font-size:11pt\"><b>Broke     out:</b></span></span><span><span style=\"font-size:11pt\">     To escape suddenly (</span></span><span><span style=\"font-size:11pt\"><i>from     prison</i></span></span><span><span style=\"font-size:11pt\">)     or to start abruptly (</span></span><span><span style=\"font-size:11pt\"><i>war,     fire, epidemic</i></span></span><span><span style=\"font-size:11pt\">).</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><span style=\"font-size:11pt\"><b>Broke     away:</b></span></span><span><span style=\"font-size:11pt\">     To escape from captivity or separate from a group/party.</span></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\"><b>Broke     off:</b></span></span><span><span style=\"font-size:11pt\">     To abruptly stop talking or end a relationship/engagement.</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span style=\"font-size:11pt\">Select    the sentence containing the homonym of the highlighted word:</span></span></p>    <p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\">The    </span></span><span><span style=\"font-size:11pt\"><b>gaffe</b></span></span><span><span style=\"font-size:11pt\">    cost the candidate valuable public support.</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">The    sailors hoisted the gaffe to adjust the sail.</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">The    ambassador apologized for the diplomatic gaffe.</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">His    verbal gaffe went viral within hours.</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">The    comedian's gaffe was interpreted as offensive.</span></span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\">The    correct option is </span></span><span><span style=\"font-size:11pt\"><b>A)    The sailors hoisted the gaffe to adjust the sail.</b></span></span></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\"><b>Option    A [CORRECT]:</b></span></span><span><span style=\"font-size:11pt\">    Here, </span></span><span><span style=\"font-size:11pt\"><b>gaffe</b></span></span><span><span style=\"font-size:11pt\">    is used as a variant/homonym for </span></span><span><span style=\"font-size:11pt\"><b>gaff</b></span></span><span><span style=\"font-size:11pt\">    (a spar or pole rising from a mast to support a sail on a ship).    It refers to a physical nautical apparatus, not a blunder.</span></span></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in\"><span><span style=\"font-size:11pt\"><b>Options    B, C, &amp; D [INCORRECT]:</b></span></span><span><span style=\"font-size:11pt\">    In all three sentences, </span></span><span><span style=\"font-size:11pt\"><b>gaffe</b></span></span><span><span style=\"font-size:11pt\">    is used in the exact same sense as the original sentence—meaning    an embarrassing mistake or verbal slip-up.</span></span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span style=\"font-size:11pt\">The    sentence given below is divided into four segments labelled P, Q,    R, and S. Read the sentence carefully to determine which segment    contains a lexical error. Select the letter corresponding to that    specific segment as your answer. (Note: The sentence contains    exactly one error. Ignore errors of punctuation, if any.)</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\">(P)    Despite a lucid awareness of catastrophic epidemiological    outcomes, / (Q) active smokers frequently suffer from severe    confident dissonance, / (R) systematically deploying deeply flawed    psychological defence mechanisms to manipulate their internal    narrative, / (S) minimise perceived vulnerability, and ultimately    preserve the habituated patterns of their addictive behaviour.</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">P</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">Q</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">R</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">S</span></span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\">The    correct option is </span></span><span><span style=\"font-size:11pt\"><b>B)    Q</b></span></span><span><span style=\"font-size:11pt\">.</span></span></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\">The    phrase </span></span><span><span style=\"font-size:11pt\"><i>\"confident    dissonance\"</i></span></span><span><span style=\"font-size:11pt\">    is incorrect.</span></span></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\">The    psychological term for the mental discomfort experienced by a    person who holds contradictory beliefs or behaviors (e.g., knowing    smoking is catastrophic while continuing to smoke) is </span></span><span><span style=\"font-size:11pt\"><b>cognitive    dissonance</b></span></span><span><span style=\"font-size:11pt\">,    not </span></span><span><span style=\"font-size:11pt\"><i>\"confident    dissonance\"</i></span></span><span><span style=\"font-size:11pt\">.</span></span></p>    <ol>     <ul>      <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">      <span><span style=\"font-size:11pt\"><b>Cognitive</b></span></span>      (pertaining to mental processes/intellect)→ <span><span style=\"font-size:11pt\"><b>Correct      term</b></span></span><span><span style=\"font-size:11pt\">.</span></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\"><span><span style=\"font-size:11pt\"><b>Confident</b></span></span>      (self-assured/certain) → <span><span style=\"font-size:11pt\"><b>Incorrect      term</b></span></span><span><span style=\"font-size:11pt\">.</span></span></p>     </li></ul>    </ol>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\"><b>Corrected    Segment (Q):</b></span></span></p>    <ol>     <ul>      <li><p style=\"orphans:0;widows:0;margin-top:0.17in\"><span><span style=\"font-size:11pt\"><i>\"active      smokers frequently suffer from severe </i></span></span><span><span style=\"font-size:11pt\"><i><b>cognitive      dissonance</b></i></span></span><span><span style=\"font-size:11pt\"><i>,\"</i></span></span></p>     </li></ul>    </ol>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Fill in the blank with the correctly spelt word.</p>    <p style=\"orphans:0;widows:0\">The staff received glowing    reviews for their _________ behavior towards the elderly guests.</p>", "option1": "<p style=\"orphans:0;widows:0\">    curteous</p>", "option2": " <p style=\"orphans:0;widows:0\">    courteous</p>", "option3": " <p style=\"orphans:0;widows:0\">    courtious</p>", "option4": " <p style=\"orphans:0;widows:0\">    courteus</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The correctly spelt word to fill in the blank is <b>courteous</b>,    which means polite, respectful, or considerate in manner.    Therefore, option B is the correct answer.</p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Choose the option that best improves the sentence using the    correct collocation highlighted in bold.</p>    <p style=\"orphans:0;widows:0\">The young applicant tried hard to    <b>do a good impression</b> on the interview panel.</p>", "option1": "<p style=\"orphans:0;widows:0\">    build a good impression</p>", "option2": " <p style=\"orphans:0;widows:0\">    make a good impression</p>", "option3": " <p style=\"orphans:0;widows:0\">    put a good impression</p>", "option4": " <p style=\"orphans:0;widows:0\">    draw a good impression</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The correct collocation is <b>make a good impression</b>. The verb    'make' naturally pairs with 'impression' when referring to    producing an effect or opinion on someone (e.g., 'make a good    impression on someone'). In contrast, 'do an impression' means to    imitate or impersonate someone, which does not fit the context.    Therefore, option B is the correct choice.</p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate meaning of the given idiom.</p>    <p style=\"orphans:0;widows:0\"><b>Against the clock</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    In a relaxed and leisurely manner</p>", "option2": " <p style=\"orphans:0;widows:0\">    To waste time on unproductive tasks</p>", "option3": " <p style=\"orphans:0;widows:0\">    In a great hurry to finish something before a deadline</p>", "option4": " <p style=\"orphans:0;widows:0\">    To accurately measure and record the time of an event</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The idiom <b>'against the clock'</b> means working or striving to    do something in a great hurry before a specific deadline or time    limit runs out. Therefore, option C is the correct answer.</p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct passive form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">Cyber experts are investigating    the data breach thoroughly.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The data breach was being thoroughly investigated by cyber    experts.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The data breach is being thoroughly investigated by cyber experts.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The data breach has been thoroughly investigated by cyber experts.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The data breach is thoroughly investigated by cyber experts.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the Present Continuous Tense in active    voice.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Active    voice structure:</b> Subject + is/am/are + V1(-ing) + Object +    Adverb</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Passive    voice structure:</b> Object + is/am/are + being + V3 + by +    Subject</p>    <p style=\"orphans:0;widows:0\">Applying this rule, 'are    investigating' changes to 'is being investigated'. Thus, 'The data    breach is being thoroughly investigated by cyber experts' is the    correct passive form.</p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate synonym of the given word: <b>MOROSE</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Cheerful</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sullen</p>", "option3": " <p style=\"orphans:0;widows:0\">    Confident</p>", "option4": " <p style=\"orphans:0;widows:0\">    Gentle</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>'Morose'</b> means sullen, gloomy, and bad-tempered.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>'Sullen'</b>    means bad-tempered and sulky, which is the most appropriate    synonym.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Cheerful:</b>    noticeably happy and optimistic.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Confident:</b>    feeling or showing certainty about something.</p>    <p style=\"orphans:0;widows:0\"><b>Gentle:</b> having or showing    a mild, kind, or tender temperament.</p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate synonym of the given word: <b>EXONERATE</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Sentence</p>", "option2": " <p style=\"orphans:0;widows:0\">    Absolve</p>", "option3": " <p style=\"orphans:0;widows:0\">    Implicate</p>", "option4": " <p style=\"orphans:0;widows:0\">    Prosecute</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>EXONERATE</b> means to officially absolve someone from    blame, guilt, or wrongdoing. Therefore, the most appropriate    synonym is <b>Absolve</b>, which means to declare someone free    from guilt, obligation, or punishment.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sentence:</b>    to declare the punishment decided for an offender.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Implicate:</b>    to show or suggest that someone is involved in a crime.</p>    <p style=\"orphans:0;widows:0\"><b>Prosecute:</b> to institute    legal proceedings against someone.</p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Fill in the blanks in the following sentence with the most    appropriate set of words to form a grammatically correct and    meaningful sentence.</p>    <p style=\"orphans:0;widows:0\">________ the authorities taken    adequate flood-prevention measures before the monsoon, the    catastrophic deluge that ________ several low-lying districts    could have been minimized, and countless families ________    homeless.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Had, devastated, would not have been rendered</p>", "option2": " <p style=\"orphans:0;widows:0\">    Were, devastated, would not have been rendered</p>", "option3": " <p style=\"orphans:0;widows:0\">    If, had devastated, would not be rendered</p>", "option4": " <p style=\"orphans:0;widows:0\">    Had, devastating, would not have rendered</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The sentence uses an inverted third conditional structure    (expressing an unreal condition in the past without using 'if'):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>Had +    subject + past participle (V3)</b>: The first blank requires 'Had'    to form the inverted conditional clause ('Had the authorities    taken...').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>Simple    Past (V2)</b>: The relative clause refers to a completed past    event that actually took place, requiring the past tense verb    'devastated'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. <b>Third    conditional main clause (Passive voice)</b>: The result clause    follows the structure 'would (not) have been + V3' ('would not    have been rendered homeless') because 'countless families' is the    receiver of the action.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct set of    words is <b>Had, devastated, would not have been rendered</b>.</p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0\">    Select the correct <b>one-word substitute</b> for the given group    of words: '<b>A book that lists words in groups of synonyms and    related concepts</b>'.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Dictionary</p>", "option2": " <p style=\"orphans:0;widows:0\">    Thesaurus</p>", "option3": " <p style=\"orphans:0;widows:0\">    Lexicon</p>", "option4": " <p style=\"orphans:0;widows:0\">    Gazetteer</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitute is <b>Thesaurus</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Thesaurus:</b>    A book or reference resource that lists words grouped together    according to similarity of meaning (synonyms and antonyms).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Dictionary:</b>    A book that lists words in alphabetical order and explains their    meanings, origin, and pronunciation.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Lexicon:</b>    A dictionary of a specific language (especially ancient Greek,    Hebrew, or Latin) or specialized subject vocabulary.</p>    <p style=\"orphans:0;widows:0\"><b>Gazetteer:</b> A geographical    index or directory used in conjunction with a map or atlas.</p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words.</p>    <p style=\"orphans:0;widows:0\"><b>\"A roundabout or indirect    way of speaking.\"</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Circumlocution</p>", "option2": " <p style=\"orphans:0;widows:0\">    Peroration</p>", "option3": " <p style=\"orphans:0;widows:0\">    Eloquence</p>", "option4": " <p style=\"orphans:0;widows:0\">    Soliloquy</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Circumlocution</b> refers to the use of an unnecessarily large    number of words to express an idea; a roundabout, indirect, or    evasive way of speaking.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Peroration:</b>    The concluding part of a speech, intended to inspire or sum up    arguments.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Eloquence:</b>    Fluent or persuasive speaking or writing.</p>    <p style=\"orphans:0;widows:0\"><b>Soliloquy:</b> An act of    speaking one's thoughts aloud when alone or regardless of any    hearers.</p>", "question_heading": ""}, {"sr_no": 31, "question": "In पुध ीियियथing ूोौौोgध, ौयंध थयनकौ ुोॅध ृधधn किधधपधक. Rधोक पुध ूोौौोgध inपधnिपद ोnक cुययौध पुध ंयौप ोूूनयूनiोपध यूपiयn पय ीiिि in धोcु ृिोnा: Tुध cयnपधंूयनोनद ोूूोनोपहौ यी ोिgयनiपुंic gयॅधनnोncध यूधनोपधौ हnकधन पुध gहiौध यी nधहपनोि यूपiंप्रोपiयn, दधप iप ौदौपधंोपicोििद cयकiीiधौ ौपनहcपहनोि ोौदंंधपनiधौ. Bद पनोnौंहपing ंधौौद ौयciोि नधोिiपiधौ inपय cयंंधnौहनोृिध कोपो ौपनधोंौ, ूनधकicपiॅध ौदौपधंौ cिोiं ोn धूiौपधंic [1] _______ पुोप कiौcनधकiपौ nयn-तहोnपiीiोृिध ीयनंौ यी ुहंोn धसूधनiधncध. Fोन ीनयं िधiंinोपing ृiोौ, पुधौध ोहपयंोपधक ंोपनicधौ inौपiपहपiयnोिप्रध ुiौपयनicोि ूनधुहकicध ृधnधोपु ो ॅधnधधन यी ंोपुधंोपicोि यृुधcपiॅiपद. Tुध ौहृुधcप थiपुin पुiौ कigiपोि ोनcुiपधcपहनध iौ nयप ंधनिधद यृौधनॅधके पुधद ोनध cयnपinहयहौिद ूोनपiपiयnधक ोnक नधcयंृinधक inपय ृधुोॅiयहनोि ूनयीiिधौ, नधीिधcपing ोn iकधिययgicोि [2] _______ पुोप पनोcधौ ृोcा पय धोिनद inकहौपनiोि नधgiंधौ यी ौciधnपiीic ंोnोgधंधnप ोnक cोनcधनोि cयnपनिय. Mधोnथुiिध, नधgिहोपयनद कiौcयहनौधौ यौपधnौiृिद ोiंधक ोप नधigning in ौहनॅधiििोncध cोूiपोिiौं ीनधतहधnिपद िोूौध inपय पोcपicोि [3] _______, यीीधनing ूनयcधकहनोि पनोnौूोनधncद थुiिध ूनधौधनॅing पुध ीहnकोंधnपोि ियgic यी ोccहंिहोपiयn. Mधोningीिह कधंयcनोपic ीनicपiयn iौ पुहौ nधहपनोिप्रधक पुनयहgु cयंूिiोncध ीनोंधथयनो पुोप नधiीद cयनूयनोपध ूयथधन नोपुधन पुोn कiौंोnिपध iप. Wुधn कiौौधnप धंधनgधौ ोgोinौप ूिोपीयनं ंयnयूियiधौ, iप iौ नोनिधद ौहूूनधौौधक थiपु यॅधनप ीयनcधे inौपधोक, iप ौहीीधनौ ौधंोnपic [4] _______, थुधनधin नोकicोि कधंोnकौ ीयन ौदौपधंic कध-ूिोपीयनंing ोनध ुियियथधक यहप inपय ृोnोि cोििस ीयन धपुicोि cयnौहंधनiौं. Uिपiंोपिधद, थiपुयहप inपधननयgोपing पुध ूियiपicोि धcयnयंद हnकधनूinning पुधौध ोहपयंोपधक ौदौपधंौ, कigiपोि नigुपौ ोकॅयcोcद नiौो कधgधnधनोपing inपय ोn िधोृयनोपध [5] _______, cिधधृनोपधक in ूियicद ीयनहंौ दधप हपपधिनद iंूयपधnप ोgोinौप पुध निधधnिपधौौ धसूोnौiयn यी cयंूहपोपiयnोि cोूiपोि. Wुोप ौुयिहक cयंध in पुध ूिोcध यी ृिोnा nहंृधन [1] ?", "option1": "<p style=\"orphans:0;widows:0\">    fallibility</p>", "option2": " <p style=\"orphans:0;widows:0\">    supremacy</p>", "option3": " <p style=\"orphans:0;widows:0\">    indeterminacy</p>", "option4": " <p style=\"orphans:0;widows:0\">    ambivalence</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage notes that predictive systems transmute complex    realities into numbers and discredit non-quantifiable forms of    human experience, asserting an overarching authority over truth.    'Supremacy' denotes preeminence or ultimate authority, which    perfectly fits 'epistemic supremacy'. 'Fallibility' (liability to    error), 'indeterminacy' (uncertainty), and 'ambivalence'    (contradictory attitudes) contradict the context of asserting    dominant authority.</p>", "question_heading": ""}, {"sr_no": 32, "question": "In पुध ीियियथing ूोौौोgध, ौयंध थयनकौ ुोॅध ृधधn किधधपधक. Rधोक पुध ूोौौोgध inपधnिपद ोnक cुययौध पुध ंयौप ोूूनयूनiोपध यूपiयn पय ीiिि in धोcु ृिोnा: Tुध cयnपधंूयनोनद ोूूोनोपहौ यी ोिgयनiपुंic gयॅधनnोncध यूधनोपधौ हnकधन पुध gहiौध यी nधहपनोि यूपiंप्रोपiयn, दधप iप ौदौपधंोपicोििद cयकiीiधौ ौपनहcपहनोि ोौदंंधपनiधौ. Bद पनोnौंहपing ंधौौद ौयciोि नधोिiपiधौ inपय cयंंधnौहनोृिध कोपो ौपनधोंौ, ूनधकicपiॅध ौदौपधंौ cिोiं ोn धूiौपधंic [1] _______ पुोप कiौcनधकiपौ nयn-तहोnपiीiोृिध ीयनंौ यी ुहंोn धसूधनiधncध. Fोन ीनयं िधiंinोपing ृiोौ, पुधौध ोहपयंोपधक ंोपनicधौ inौपiपहपiयnोिप्रध ुiौपयनicोि ूनधुहकicध ृधnधोपु ो ॅधnधधन यी ंोपुधंोपicोि यृुधcपiॅiपद. Tुध ौहृुधcप थiपुin पुiौ कigiपोि ोनcुiपधcपहनध iौ nयप ंधनिधद यृौधनॅधके पुधद ोनध cयnपinहयहौिद ूोनपiपiयnधक ोnक नधcयंृinधक inपय ृधुोॅiयहनोि ूनयीiिधौ, नधीिधcपing ोn iकधिययgicोि [2] _______ पुोप पनोcधौ ृोcा पय धोिनद inकहौपनiोि नधgiंधौ यी ौciधnपiीic ंोnोgधंधnप ोnक cोनcधनोि cयnपनिय. Mधोnथुiिध, नधgिहोपयनद कiौcयहनौधौ यौपधnौiृिद ोiंधक ोप नधigning in ौहनॅधiििोncध cोूiपोिiौं ीनधतहधnिपद िोूौध inपय पोcपicोि [3] _______, यीीधनing ूनयcधकहनोि पनोnौूोनधncद थुiिध ूनधौधनॅing पुध ीहnकोंधnपोि ियgic यी ोccहंिहोपiयn. Mधोningीिह कधंयcनोपic ीनicपiयn iौ पुहौ nधहपनोिप्रधक पुनयहgु cयंूिiोncध ीनोंधथयनो पुोप नधiीद cय b>d)    </b><span style=\"font-family:'Nirmala UI'\"><span><b>मुद्राराक्षस</b></span></span>:    <span style=\"font-family:'Nirmala UI'\"><span>चंद्रगुप्त    मौर्य के उत्थान को चाणक्य    की सहायता से चित्रित करने    वाला विशाखदत्त द्वारा लिखित    एक संस्कृत नाटक। </span></span>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>समाहर्ता</b>    मौर्य प्रशासन में मुख्य    राजस्व संग्रहकर्ता था।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>संनिधाता</b>    मुख्य कोषाध्यक्ष और राज्य    भंडारगृहों के रक्षक के रूप    में कार्य करता था।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>सीताध्यक्ष</b>    राज्य के स्वामित्व वाली    कृषि भूमि </span></span>(<span style=\"font-family:'Nirmala UI'\"><span><i>सीता</i></span></span>)    <span style=\"font-family:'Nirmala UI'\"><span>की देखरेख    करता था। </span></span>    </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span><b>पण्याध्यक्ष</b>    राज्य व्यापार और वाणिज्य    का मौर्य अधीक्षक था</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>जो मूल्य    नियंत्रण और बाजार विनियमन    के लिए जिम्मेदार था।</span></span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span><b>मुगल    साम्राज्य के दौरान शुरू की    गई राजस्व प्रशासनिक सुधारों    के संबंध में निम्नलिखित    कथनों पर विचार करें</b></span></span><b>:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. </b><span style=\"font-family:'Nirmala UI'\"><span><b>राजा    टोडर मल ने अकबर के शासनकाल    में </b></span></span><b>1580 </b><span style=\"font-family:'Nirmala UI'\"><span><b>ईस्वी    में दहसाला प्रणाली शुरू    की।</b></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. </b><span style=\"font-family:'Nirmala UI'\"><span><b>दहसाला    प्रणाली के तहत</b></span></span><b>, </b><span style=\"font-family:'Nirmala UI'\"><span><b>राज्य    की मांग को निर्धारित करने    के लिए पिछले दस वर्षों की    फसलों की औसत उपज और औसत कीमतों    की गणना की गई।</b></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. </b><span style=\"font-family:'Nirmala UI'\"><span><b>भूमि    को चार श्रेणियों में वर्गीकृत    किया गया था</b></span></span><b>: </b><span style=\"font-family:'Nirmala UI'\"><span><b>पोलज</b></span></span><b>,    </b><span style=\"font-family:'Nirmala UI'\"><span><b>परौती</b></span></span><b>,    </b><span style=\"font-family:'Nirmala UI'\"><span><b>चाचर और    बंजर।</b></span></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span><b>ऊपर    दिए गए कथनों में से कौन से    सही हैं</b></span></span><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>केवल </span></span>1    <span style=\"font-family:'Nirmala UI'\"><span>और </span></span>2</p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>केवल </span></span>2    <span style=\"font-family:'Nirmala UI'\"><span>और </span></span>3</p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>केवल </span></span>1    <span style=\"font-family:'Nirmala UI'\"><span>और </span></span>3</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 <span style=\"font-family:'Nirmala UI'\"><span>और </span></span>3</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span>अकबर के    वित्त मंत्री <b>राजा टोडर मल</b>    ने <b>जब्ती</b> या <b>दहसाला प्रणाली</b>    </span></span>(1580 <span style=\"font-family:'Nirmala UI'\"><span>ईस्वी</span></span>)    <span style=\"font-family:'Nirmala UI'\"><span>को मानकीकृत    किया। यह </span></span>10-<span style=\"font-family:'Nirmala UI'\"><span>वर्षीय    औसत उपज और बाजार मूल्यों    </span></span>(1570–1580 <span style=\"font-family:'Nirmala UI'\"><span>ईस्वी</span></span>)    <span style=\"font-family:'Nirmala UI'\"><span>के आधार पर    भू</span></span>-<span style=\"font-family:'Nirmala UI'\"><span>राजस्व    की गणना करता था। औसत उत्पाद    का एक तिहाई हिस्सा राज्य    का हिस्सा निर्धारित किया    गया था</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>जिसका    भुगतान नकद में किया जाता    था। </span></span>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>कथन    </b></span></span><b>1</b>: <span style=\"font-family:'Nirmala UI'\"><span>सही।    टोडर मल ने शेर शाह सूरी के    तहत पहले के प्रयोगों के आधार    पर प्रणाली को संहिताबद्ध    किया।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>कथन    </b></span></span><b>2</b>: <span style=\"font-family:'Nirmala UI'\"><span>सही।    राजस्व मांग को वार्षिक मूल्य    उतार</span></span>-<span style=\"font-family:'Nirmala UI'\"><span>चढ़ाव    को खत्म करने के लिए </span></span>10-<span style=\"font-family:'Nirmala UI'\"><span>वर्षीय    औसत पर आधारित किया गया था।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>कथन    </b></span></span><b>3</b>: <span style=\"font-family:'Nirmala UI'\"><span>सही।    भूमि श्रेणियां थीं</span></span>:    <span style=\"font-family:'Nirmala UI'\"><span><b>पोलज</b>    </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>वार्षिक    रूप से खेती की गई</span></span>), <span style=\"font-family:'Nirmala UI'\"><span><b>परौती</b>    </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>थोड़े    समय के लिए परती छोड़ी गई</span></span>),    <span style=\"font-family:'Nirmala UI'\"><span><b>चाचर</b>    </span></span>(3-4 <span style=\"font-family:'Nirmala UI'\"><span>वर्षों    तक परती</span></span>) <span style=\"font-family:'Nirmala UI'\"><span>और    <b>बंजर</b> </span></span>(5+ <span style=\"font-family:'Nirmala UI'\"><span>वर्षों    तक अकृषित</span></span>)<span style=\"font-family:'Nirmala UI'\"><span>।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d)</b>:    <span style=\"font-family:'Nirmala UI'\"><span>तीनों सही    कथनों को जोड़ने वाला सही    विकल्प। </span></span>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>महत्वपूर्ण    बिंदु</span></span>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>भूमि    का मापन <b>बांबू</b></span></span><b>-</b><span style=\"font-family:'Nirmala UI'\"><span><b>गज</b></span></span><b>-</b><span style=\"font-family:'Nirmala UI'\"><span><b>ए</b></span></span><b>-</b><span style=\"font-family:'Nirmala UI'\"><span><b>इलाही</b>    </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>लोहे    के छल्लों से जुड़ी बांस की    छड़ें</span></span>) <span style=\"font-family:'Nirmala UI'\"><span>का    उपयोग करके किया गया था।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>कनकूत    </b>और <b>बटाई</b> </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>फसल    साझाकरण</span></span>) <span style=\"font-family:'Nirmala UI'\"><span>जब्ती    के साथ</span></span>-<span style=\"font-family:'Nirmala UI'\"><span>साथ    उपयोग की जाने वाली राजस्व    अनुमान की वैकल्पिक विधियां    थीं। </span></span>    </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span><b>पोलज</b>    भूमि निरंतर पूर्ण कर देती    थी क्योंकि इसे हर साल बिना    परती छोड़े खेती किया जाता    था।</span></span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-fa
