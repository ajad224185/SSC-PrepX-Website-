an style=\"font-family:'Nirmala UI'\"><span>और    नागपुर </span></span>(1854) <span style=\"font-family:'Nirmala UI'\"><span>को    हड़प लिया।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c) </b><span style=\"font-family:'Nirmala UI'\"><span><b>लॉर्ड    कैनिंग</b></span></span>: <span style=\"font-family:'Nirmala UI'\"><span>अंतिम    गवर्नर</span></span>-<span style=\"font-family:'Nirmala UI'\"><span>जनरल    और पहले वायसराय के रूप में    कार्य किया</span></span>; 1857 <span style=\"font-family:'Nirmala UI'\"><span>के    विद्रोह को संभाला और भारतीय    परिषद अधिनियम </span></span>1861 <span style=\"font-family:'Nirmala UI'\"><span>पारित    किया।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d) </b><span style=\"font-family:'Nirmala UI'\"><span><b>लॉर्ड    मेयो</b></span></span>: <span style=\"font-family:'Nirmala UI'\"><span>वित्तीय    विकेंद्रीकरण शुरू किया और    </span></span>1872 <span style=\"font-family:'Nirmala UI'\"><span>में    भारत की पहली असमकालिक जनगणना    कराई। </span></span>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><u><b>महत्वपूर्ण    बिंदु</b></u></span></span><b>:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>अवध</b>    को </span></span><b>1856</b> <span style=\"font-family:'Nirmala UI'\"><span>में    </span></span>\"<span style=\"font-family:'Nirmala UI'\"><span>कुशासन</span></span>\"    (<i>misgovernance</i>) <span style=\"font-family:'Nirmala UI'\"><span>के    आधार पर लॉर्ड डलहौजी ने हड़प    लिया</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>जो    जेम्स आउट्रम की रिपोर्ट पर    आधारित था।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>सतारा</b>    </span></span>(1848) <span style=\"font-family:'Nirmala UI'\"><span>व्यपगत    का सिद्धांत के तहत हड़पा    गया पहला राज्य था।  </span> r": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span>अप्रैल </span></span>2022    <span style=\"font-family:'Nirmala UI'\"><span>में शुरू    की गई</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>स्थायी    जमा सुविधा </span></span><b>(SDF)</b> <span style=\"font-family:'Nirmala UI'\"><span>ने    निश्चित रिवर्स रेपो दर की    जगह तरलता समायोजन सुविधा    </span></span>(LAF) <span style=\"font-family:'Nirmala UI'\"><span>गलियारे    के फर्श के रूप में ले ली। यह    आरबीआई को सरकारी जमानत    प्रदान किए बिना वाणिज्यिक    बैंकों से तरलता अवशोषित    करने की अनुमति देता है।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><u><b>विकल्प</b></u></span></span><b>-</b><span style=\"font-family:'Nirmala UI'\"><span><b>वार    विश्लेषण</b></span></span><b>:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) MSF </b><span style=\"font-family:'Nirmala UI'\"><span><b>दर</b></span></span>:    LAF <span style=\"font-family:'Nirmala UI'\"><span>गलियारे    की छत जहां बैंक अतिरिक्त    </span></span>SLR <span style=\"font-family:'Nirmala UI'\"><span>प्रतिभूतियों    के खिलाफ आरबीआई से रातोंरात    धन उधार लेते हैं।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B) SDF </b><span style=\"font-family:'Nirmala UI'\"><span><b>दर</b></span></span>:    <span style=\"font-family:'Nirmala UI'\"><span>सही। </span></span>LAF    <span style=\"font-family:'Nirmala UI'\"><span>गलियारे    की बिना जमानत वाली फर्श दर    जिसका उपयोग वाणिज्यिक बैंकों    से अतिरिक्त तरलता अवशोषित    करने के लिए किया जाता है।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c) </b><span style=\"font-family:'Nirmala UI'\"><span><b>बैंक    दर</b></span></span>: <span style=\"font-family:'Nirmala UI'\"><span>वह    दर जिस पर आरबीआई बिना जमानत    आवश्यकता के विनिमय ब king": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span>कार्तीय    चिह्न परिपाटी के अनुसार</span></span>:       </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>वस्तु    की दूरी </span></span>u = -15 cm,     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>अवतल    दर्पण की फोकस दूरी </span></span>f =    -10 cm<span style=\"font-family:'Nirmala UI'\"><span>।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>दर्पण    सूत्र</span></span>: 1/f = 1/v + 1/u</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1/-10 = 1/v +    1/-15 ---&gt; 1/v = -1/10 + 1/15 = {-3 + 2}/30 = -1/30</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>इस    प्रकार</span></span>, v = -30 cm (<span style=\"font-family:'Nirmala UI'\"><span>दर्पण    के सामने</span></span>)<span style=\"font-family:'Nirmala UI'\"><span>।    आवर्धन </span></span>m = -(v/u) = -(-30/-15) = -2<span style=\"font-family:'Nirmala UI'\"><span>।    </span></span>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>ऋणात्मक    चिह्न <b>वास्तविक और उल्टे</b>    प्रतिबिंब को दर्शाता है।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><u><b>विकल्प</b></u></span></span><b>-</b><span style=\"font-family:'Nirmala UI'\"><span><b>वार    विश्लेषण</b></span></span><b>:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)</b>:    <span style=\"font-family:'Nirmala UI'\"><span>सही। प्रतिबिंब    दर्पण के सामने </span></span>30 cm <span style=\"font-family:'Nirmala UI'\"><span>पर    बना</span></span>; <span style=\"font-family:'Nirmala UI'\"><span>वास्तविक</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>उल्टा</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>दोगुना    आवर्धित </span></span>(m = -2)<span style=\"font-family:'Nirmala UI'\"><span>।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b, c, d)</b>:    <span style=\"font-family:'Nirmala UI'\"><span>गणितीय रूप    से गलत मान और चिह्न परिपाटी    की गलत व्याख्या। </span></span>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><u><b>महत्वपूर्ण    बिंदु</b></u></span></span><b>:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>जब    वस्तु फोकस </span></span>(F) <span style=\"font-family:'Nirmala UI'\"><span>और    वक्रता केंद्र </span></span>(C) <span style=\"font-family:'Nirmala UI'\"><span>के    बीच होती है</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>तो    प्रतिबिंब </span></span>C <span style=\"font-family:'Nirmala UI'\"><span>से    आगे बनता है</span></span>; <span style=\"font-family:'Nirmala UI'\"><span>वास्तविक</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>उल्टा और    आवर्धित।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>यदि    </span></span>m <span style=\"font-family:'Nirmala UI'\"><span>ऋणात्मक    है</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>तो    प्रतिबिंब <b>वास्तविक और    उल्टा</b> होता है</span></span>; <span style=\"font-family:'Nirmala UI'\"><span>यदि    </span></span>m <span style=\"font-family:'Nirmala UI'\"><span>धनात्मक    है</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>तो    प्रतिबिंब <b>आभासी और सीधा</b>    होता है।</span></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span>एक    अवतल दर्पण केवल तभी <b>आभासी</b></span></span><b>,    </b><span style=\"font-family:'Nirmala UI'\"><span><b>सीधा और    आवर्धित</b> प्रतिबिंब बनाता    है जब वस्तु को <b>ध्रुव </b></span></span><b>(P)    </b><span style=\"font-family:'Nirmala UI'\"><span><b>और फोकस    </b></span></span><b>(F)</b> <span style=\"font-family:'Nirmala UI'\"><span>के    बीच रखा जाता है।</span></span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span><b>निम्नलिखित    में से कौन सी रासायनिक    अभिक्रिया एक रेडॉक्स अभिक्रिया    का क्लासिक उदाहरण है जिसमें    ऑक्सीकरण और अपचयन एक साथ    होते हैं</b></span></span><b>?</b></p>", "option1": " <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445274739_html_4cba096e165b0ff2.gif\" > </p>", "option2": "  <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445274739_html_f89fdab0b12c9ed0.gif\" > </p>", "option3": "  <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445274739_html_52276155ae3e1940.gif\" > </p>", "option4": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445274739_html_bcb56921f8d19aed.png\" width=\"189\" height=\"27\" > </p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span>एक अपचयोपचय    अभिक्रिया </span></span>(<span style=\"font-family:'Nirmala UI'\"><span><b>रेडॉक्स    अभिक्रिया</b></span></span><b>)</b> <span style=\"font-family:'Nirmala UI'\"><span>में    इलेक्ट्रॉनों का स्थानांतरण    होता है जहां ऑक्सीकरण और    अपचयन एक साथ होते हैं। </span></span>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>अभिक्रिया    </span></span>b) <span style=\"font-family:'Nirmala UI'\"><span>में</span></span>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">CuO <span style=\"font-family:'Nirmala UI'\"><span>ऑक्सीजन    खो देता है </span></span>(Cu <span style=\"font-family:'Nirmala UI'\"><span>की    ऑक्सीकरण अवस्था </span></span>+2 <span style=\"font-family:'Nirmala UI'\"><span>से    </span></span>0 <span style=\"font-family:'Nirmala UI'\"><span>हो    जाती है</span></span>) ---&gt; <span style=\"font-family:'Nirmala UI'\"><span><b>अपचयन</b>।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">H₂ <span style=\"font-family:'Nirmala UI'\"><span>ऑक्सीजन    प्राप्त करता है </span></span>(H <span style=\"font-family:'Nirmala UI'\"><span>की    ऑक्सीकरण अवस्था </span></span>0 <span style=\"font-family:'Nirmala UI'\"><span>से    </span></span>+1 <span style=\"font-family:'Nirmala UI'\"><span>हो    जाती है</span></span>) ---&gt; <span style=\"font-family:'Nirmala UI'\"><span><b>ऑक्सीकरण</b>।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><u><b>विकल्प</b></u></span></span><b>-</b><span style=\"font-family:'Nirmala UI'\"><span><b>वार    विश्लेषण</b></span></span>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) HCl +    NaOH ---&gt; NaCl + H₂O</b>: <span style=\"font-family:'Nirmala UI'\"><span>अम्ल</span></span>-<span style=\"font-family:'Nirmala UI'\"><span>क्षार    उदासीनीकरण अभिक्रिया    </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>ऑक्सीकरण    अवस्था में कोई परिवर्तन    नहीं</span></span>)<span style=\"font-family:'Nirmala UI'\"><span>।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) CuO +    H₂---&gt; Cu + H_2O</b>: <span style=\"font-family:'Nirmala UI'\"><span>सही।    क्लासिक अपचयोपचय अभिक्रिया</span></span>;    CuO <span style=\"font-family:'Nirmala UI'\"><span>ऑक्सीकारक    के रूप में कार्य करता है</span></span>,    H₂ <span style=\"font-family:'Nirmala UI'\"><span>अपचायक    के रूप में।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c) AgNO₃    + NaCl ---&gt; AgCl </b>↓<b> + NaNO₃</b>: <span style=\"font-family:'Nirmala UI'\"><span>द्वि</span></span>-<span style=\"font-family:'Nirmala UI'\"><span>विस्थापन    </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>अवक्षेपण</span></span>)    <span style=\"font-family:'Nirmala UI'\"><span>अभिक्रिया।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d) CaCO₃    ---&gt; CaO + CO₂</b>: <span style=\"font-family:'Nirmala UI'\"><span>ऊष्मीय    अपघटन अभिक्रिया। </span></span>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><u><b>महत्वपूर्ण    बिंदु</b></u></span></span><b>:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>ऑक्सीकरण</b></span></span>:    <span style=\"font-family:'Nirmala UI'\"><span>ऑक्सीजन    की प्राप्ति</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>हाइड्रोजन    की हानि</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>या    इलेक्ट्रॉनों की हानि।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>अपचयन</b></span></span>:    <span style=\"font-family:'Nirmala UI'\"><span>ऑक्सीजन    की हानि</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>हाइड्रोजन    की प्राप्ति</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>या    इलेक्ट्रॉनों की प्राप्ति।    </span></span>    </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span>लोहे    में जंग लगना </span></span>(4Fe + 3O₂ + xH₂O    ----&gt; 2Fe₂O₃. xH₂O) <span style=\"font-family:'Nirmala UI'\"><span>एक    धीमी विद्युत</span></span>-<span style=\"font-family:'Nirmala UI'\"><span>रासायनिक    <b>अपचयोपचय अभिक्रिया</b> है।</span></span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span><b>कौन सा    रक्त वाहिका फेफड़ों से मानव    हृदय के बाएं आलिंद तक ऑक्सीजन    युक्त रक्त को सीधे ले जाता    है</b></span></span><b>, </b><span style=\"font-family:'Nirmala UI'\"><span><b>जो    सामान्य परिसंचरण वाहिका    कार्यों के अपवाद के रूप में    कार्य करता है</b></span></span><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>फुफ्फुस    धमनी</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>फुफ्फुस    शिरा</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>ऊर्ध्व    महाशिरा </span></span>    </p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>महाधमनी </span></span>    </p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span>आम तौर पर</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>धमनियां    हृदय से ऑक्सीजन युक्त रक्त    को ले जाती हैं</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>और    शिराएं विऑक्सीकृत रक्त को    हृदय में वापस ले जाती हैं।    <b>फुफ्फुसीय परिसंचरण तंत्र    </b>इस नियम को उलट देता है</span></span>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>फुफ्फुसीय    धमनी</b></span></span>: <span style=\"font-family:'Nirmala UI'\"><span>दाएं    निलय से फेफड़ों तक विऑक्सीकृत    रक्त ले जाती है।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>फुफ्फुसीय    शिरा</b></span></span>: <span style=\"font-family:'Nirmala UI'\"><span>फेफड़ों    से बाएं आलिंद तक ऑक्सीजन    युक्त रक्त ले जाती है। </span></span>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><u><b>विकल्प</b></u></span></span><b>-</b><span style=\"font-family:'Nirmala UI'\"><span><b>वार    विश्लेषण</b></span></span><b>:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)    </b><span style=\"font-family:'Nirmala UI'\"><span><b>फुफ्फुसीय    धमनी</b></span></span>: <span style=\"font-family:'Nirmala UI'\"><span>धमनियों    के लिए अपवाद</span></span>; <span style=\"font-family:'Nirmala UI'\"><span>फेफड़ों    तक डीऑक्सीजनेटेड रक्त ले    जाती है।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b)    </b><span style=\"font-family:'Nirmala UI'\"><span><b>फुफ्फुसीय    शिरा</b></span></span>: <span style=\"font-family:'Nirmala UI'\"><span>सही।    शिराओं के लिए अपवाद</span></span>;    <span style=\"font-family:'Nirmala UI'\"><span>फेफड़ों    से हृदय तक ऑक्सीजन युक्त    रक्त ले जाती है।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c) </b><span style=\"font-family:'Nirmala UI'\"><span><b>ऊर्ध्व    महाशिरा</b></span></span>: <span style=\"font-family:'Nirmala UI'\"><span>ऊपरी    शरीर के भागों से विऑक्सीकृत    रक्त को दाएं आलिंद में लाती    है।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d)    </b><span style=\"font-family:'Nirmala UI'\"><span><b>महाधमनी</b></span></span>:    <span style=\"font-family:'Nirmala UI'\"><span>सबसे बड़ी    कायिक धमनी</span></span>; <span style=\"font-family:'Nirmala UI'\"><span>बाएं    निलय से पूरे शरीर में ऑक्सीजन    युक्त रक्त वितरित करती है।    </span></span>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><u><b>महत्वपूर्ण    बिंदु</b></u></span></span><b>:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>मानव    हृदय <b>दोहरे परिसंचरण</b> को    प्रदर्शित करता है</span></span>:    <span style=\"font-family:'Nirmala UI'\"><span>फुफ्फुसीय    परिसंचरण </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>हृदय</span></span>-<span style=\"font-family:'Nirmala UI'\"><span>फेफड़े</span></span>-<span style=\"font-family:'Nirmala UI'\"><span>हृदय</span></span>)    <span style=\"font-family:'Nirmala UI'\"><span>और कायिक    परिसंचरण </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>हृदय</span></span>-<span style=\"font-family:'Nirmala UI'\"><span>शरीर</span></span>-<span style=\"font-family:'Nirmala UI'\"><span>हृदय</span></span>)<span style=\"font-family:'Nirmala UI'\"><span>।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>त्रिवलनी    कपाट </b></span></span><b>(Tricuspid Valve / </b><span style=\"font-family:'Nirmala UI'\"><span><b>ट्राइकस्पिड    वाल्व</b></span></span><b>): </b><span style=\"font-family:'Nirmala UI'\"><span>दाएं    आलिंद और दाएं निलय के बीच    स्थित होता है</span></span>; <span style=\"font-family:'Nirmala UI'\"><span><b>द्विवलनी    </b></span></span><b>(</b><span style=\"font-family:'Nirmala UI'\"><span><b>माइट्रल</b></span></span><b>)    </b><span style=\"font-family:'Nirmala UI'\"><span><b>वाल्व</b>    बाएं आलिंद और बाएं निलय के    बीच स्थित होता है।</span></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span><b>साइनो</b></span></span><b>-</b><span style=\"font-family:'Nirmala UI'\"><span><b>एट्रियल    </b></span></span><b>(SA) </b><span style=\"font-family:'Nirmala UI'\"><span><b>नोड</b></span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>जो दाएं    आलिंद की ऊपरी दीवार में    स्थित होता है</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>मानव    हृदय के प्राकृतिक <b>पेसमेकर</b>    के रूप में जाना जाता है।</span></span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span><b>शास्त्रीय    नृत्य कुचिपुड़ी</b></span></span><b>,    </b><span style=\"font-family:'Nirmala UI'\"><span><b>जो अपने    जटिल पीतल की प्लेट पर पैरों    के काम </b></span></span><b>(</b let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);

  } catch (err) {

  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
