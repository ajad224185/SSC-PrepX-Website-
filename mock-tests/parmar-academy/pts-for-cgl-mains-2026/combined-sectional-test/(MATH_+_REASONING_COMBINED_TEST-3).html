ght=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image012.png\" width=\"76\" height=\"21\" alt style=\"vertical-align:middle\" ><span>, we get </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image013.png\" width=\"46\" height=\"21\" alt style=\"vertical-align:middle\" ><span>. Thus, conclusion III is definitely true.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">4. For conclusion IV (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image005.png\" width=\"43\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Between L and N, the relationship is </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image014.png\" width=\"76\" height=\"21\" alt style=\"vertical-align:middle\" ><span>. The opposite inequality signs indicate that no definite relation can be established between L and N. Hence, conclusion IV is not definitely true.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, both conclusions I and III are true.</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Given below is a statement followed by two possible reasons numbered I and II. Read the statement carefully and decide which of the two explains the event/observation given in the statement.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statement:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In recent years, many major IT and tech firms have established their operational branches in Tier-2 cities instead of further expanding in Tier-1 metropolitan hubs.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Reasons:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I) Tier-2 cities offer lower operational and real estate costs along with access to a growing pool of skilled talent.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II) Municipal corporations in Tier-1 cities have completely prohibited the setup of new commercial offices.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I is a possible reason.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only II is a possible reason.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both I and II are possible reasons.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither I nor II is a possible reason.</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Reason I is a valid</span><span> and logically sound explanation. Companies expand into Tier-2 cities primarily to reduce overhead expenditure (real estate, infrastructure, and living costs) and to leverage the increasing availability of qualified talent outside major metropolitan areas.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Reason II is an extreme</span><span> and factually baseless assumption; municipal authorities in Tier-1 cities have not banned the establishment of commercial offices.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, only Reason I is a possible reason.</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which number should replace the question mark (?) in the following series?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">12, 38, 116, 350, 1052, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3154</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3158</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3160</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3164</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the given series is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image015.png\" width=\"112\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image016.png\" width=\"121\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image017.png\" width=\"130\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image018.png\" width=\"139\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image019.png\" width=\"147\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the missing number is 3158.</span></p>", "question_heading": ""}, {"sr_no": 34, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the figure from among the given options that can replace the question mark (?) in the following series.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image020.png\" width=\"500\" height=\"100\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image021.png\" width=\"100\" height=\"100\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image022.png\" width=\"100\" height=\"100\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image023.png\" width=\"100\" height=\"100\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image024.png\" width=\"100\" height=\"100\" alt ></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The series follows two distinct patterns:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. Movement of the Arrow (Top-Left):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Step 1 to 2: Rotates </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image025.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> counter-clockwise (↑ to ←).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Step 2 to 3: Reverses / rotates </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image026.png\" width=\"34\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (← to →).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Step 3 to 4: Rotates </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image025.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> counter-clockwise (→ to ↑).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Step 4 to 5: Reverses / rotates </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image026.png\" width=\"34\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (↑ to ↓).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the arrow in the 5th figure must point downward (↓).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. Movement of the Other Five Symbols:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• The symbol at the 4th (rightmost) position of the middle row moves to the bottom center.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• The symbol at the bottom center moves to the 1st (leftmost) position of the middle row.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• The symbols at positions 1, 2, and 3 each shift one place to the right (to positions 2, 3, and 4).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying this from Frame 4 to Frame 5:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Symbol at position 4 ('D') moves to the bottom center.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Symbol at the bottom ('S') moves to position 1 of the middle row.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 'K', 'V', and '△' shift to positions 2, 3, and 4 respectively.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, the middle row contains </span><span style=\"font-weight:bold\">S, K, V, △</span><span> from left to right, and the bottom center has </span><span style=\"font-weight:bold\">D</span><span>. This correctly matches figure (C).</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the set in which the numbers are related in the same way as are the numbers of the following sets.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g., 13 – Operations on 13 such as adding/subtracting/multiplying etc. to 13 can be performed. Breaking down 13 into e:12pt\"><span style=\"font-weight:bold\">Thus, the correct set is (13, 8, 105).</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the correct option that indicates the arrangement of the given words in a logical and meaningful order.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">1. Paper</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">2. Book</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">3. Tree</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">4. Printing</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">5. Pulp</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3, 5, 1, 4, 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3, 1, 5, 4, 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5, 3, 1, 2, 4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3, 5, 4, 1, 2</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The given words represent the sequential process of producing a book from raw material:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">Tree</span><span> (3) is cut to obtain wood.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. The wood is converted into </span><span style=\"font-weight:bold\">Pulp</span><span> (5).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. The pulp is processed to manufacture </span><span style=\"font-weight:bold\">Paper</span><span> (1).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. </span><span style=\"font-weight:bold\">Printing</span><span> (4) is done on the paper.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Finally, the printed pages are compiled to form a </span><span style=\"font-weight:bold\">Book</span><span> (2).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the logical and meaningful order is </span><span style=\"font-weight:bold\">3, 5, 1, 4, 2</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the combination of letters that when sequentially placed in the blanks of the given series will complete the series.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">C_GH JL_O _SUV XZ_C E_IJ</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FNQAG</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ENQBG</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>EMQBG</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ENRBH</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">The given series consists of 4-letter clusters following a consistent pattern:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Within each cluster:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1st letter to 2nd letter = +2</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2nd letter to 3rd letter = +2</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3rd letter to 4th letter = +1</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Between consecutive clusters (last letter to the first letter of the next cluster):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">+2</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the pattern:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C (3) + 2 = </span><span style=\"font-weight:bold\">E</span><span> (5), E + 2 = G (7), G + 1 = H (8) → C</span><span style=\"font-weight:bold\">E</span><span>GH</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>H (8) + 2 = J (10), J + 2 = L (12), L + 2 = </span><span style=\"font-weight:bold\">N</span><span> (14), N + 1 = O (15) → JL</span><span style=\"font-weight:bold\">N</span><span>O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O (15) + 2 = </span><span style=\"font-weight:bold\">Q</span><span> (17), Q + 2 = S (19), S + 2 = U (21), U + 1 = V (22) → </span><span style=\"font-weight:bold\">Q</span><span>SUV</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V (22) + 2 = X (24), X + 2 = Z (26), Z + 2 = </span><span style=\"font-weight:bold\">B</span><span> (2), B + 1 = C (3) → XZ</span><span style=\"font-weight:bold\">B</span><span>C</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C (3) + 2 = E (5), E + 2 = </span><span style=\"font-weight:bold\">G</span><span> (7), G + 2 = I (9), I + 1 = J (10) → E</span><span style=\"font-weight:bold\">G</span><span>IJ</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the required letters in sequence are </span><span style=\"font-weight:bold\">ENQBG</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If all the digits in the number 48316275 are arranged in ascending order from left to right, the position of how many digits will remain unchanged as compared to their position in the original number?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>None</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Original number: 4 8 3 1 6 2 7 5</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Arranging the digits in ascending order from left to right:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>New arrangement: 1 2 3 4 5 6 7 8</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing the positions of the digits in both numbers:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- 3rd position: 3 remains unchanged</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- 7th position: 7 remains unchanged</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the positions of exactly two digits (3 and 7) remain unchanged.</span></p>", "question_heading": ""}, {"sr_no": 39, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">What will come in the place of the question mark (?) in the following equation if '</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image037.png\" width=\"20\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">' and '</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image038.png\" width=\"19\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">' are interchanged and '</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image039.png\" width=\"20\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">' and '</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image040.png\" width=\"20\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">' are interchanged?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795021488613_image041.png\" width=\"190\" height=\"21\" alt style=\"vertical-align:middle\" ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>73</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>79</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>84</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>92</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given e
