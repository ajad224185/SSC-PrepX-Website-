iीiधक ंधपनicौ यी ूधनीयनंोncध. Tुध हnदiिधकing कधंोnकौ यी पुiौ पधcुnयcनोपic पयहनnोंधnप नधॅधोि पुोप ंधनiपयcनोपic यनपुयकयसद, थुiिध कiौूनयूयनपiयnोपिधद नधथोनकing पुध ूनiॅiिधgधक, धसोcपौ ोn ोिiधnोपing पियि यn थinnधनौ ोnक ियौधनौ ोिiाध. Tधcुnयcनोपic नधीयनंौ, ौcुियोनौुiू ूनयgनोंौ, ोnक तहयपो धसूोnौiयnौ ुोॅध यीीधनधक ौूयनोकic निधiधी, दधप पुधद ीोiि पय कiौंोnिपध पुध ौदौपधंic ीयहnकोपiयnौ यी ूनधौपigध-कनiॅधn cोूiपोिiौं. Lधgiौिोपiॅध inपधनॅधnपiयnौ ोnक पयाधniौपic कiॅधनौiपद iniपiोपiॅधौ ोियnध cोnnयप नधकनधौौ cयंूयहnकing inधतहiपiधौ. Tय gधnहinिधद पनोnौcधnक पुiौ ुiधनोनcुद, ौयciधपद ंहौप हnकधनपोाध ोn यnपिययgicोि नध-धॅोिहोपiयn यी ुहंोn कigniपद—यnध पुोप हncयहूिधौ ciॅic नधौूधcप ोnक धcयnयंic ौधcहनiपद ीनयं ौcुियोौपic cनधकधnपiोिस, नधॅiपोिप्रधौ पुध ौयciधपोि ौपोnकing यी nयn-ोcोकधंic िोृयन, ोnक नधकiौपनiृहपधौ cियिधcपiॅध थधोिपु ोcनयौौ ौपनहcपहनोि िinधौ. Wiपुयहप ौहcु ो नोकicोि नधcोिiृनोपiयn, पुध धपुयौ यी ंधनiप थiिि ंधनिधद ूनयॅiकध ो ंयनोि ॅधnधधन ीयन ूधनौiौपधnप inधतहोिiपद, ियcाing ौयciयधcयnयंic ंयृiिiपद in ोn inपनोcपोृिध cदcिध यी धसcिहौiयn. Wुोप ियng-पधनं ौियहपiयn कयधौ पुध ोहपुयन ूनयूयौध पय कiौंोnिपध ंधनiपयcनोपic inधतहोिiपद?", "option1": "<p style=\"orphans:0;widows:0\">    Imposing harsher legal penalties on private educational    institutions</p>", "option2": " <p style=\"orphans:0;widows:0\">    Decoupling human dignity and economic security from scholastic    credentials</p>", "option3": " <p style=\"orphans:0;widows:0\">    Restricting higher education strictly to state-selected    administrative scholars</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mandating nationwide standardized testing for all service-sector    employment</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage concludes that society must undertake an “ontological    re-evaluation of human dignity—one that uncouples civic respect    and economic security from scholastic credentials, revitalizes the    societal standing of non-academic labor, and redistributes    collective wealth across structural lines.” Therefore, option B    is correct.</p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0\">    <b>Which ancient Indian text on statecraft and economic policy    explicitly details the system of Adhyakshas (departmental    superintendents) responsible for overseeing state monopolies such    as mining (Akaradhyaksha) and minting (Lakshanadhyaksha)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Manusmriti</p>", "option2": " <p style=\"orphans:0;widows:0\">    Arthashastra</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kamandaka Nitisara</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mudrarakshasa</p>", "answer": "2", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The <b>Arthashastra</b>, written by Kautilya (Chanakya), serves as    a comprehensive treatise on governance, economics, and military    strategy. Book II details the functions of state officers called    <i>Adhyakshas</i>, who managed state monopolies including mines,    mints, agriculture, and trade.     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)    Manusmriti</b>: An ancient legal text (Dharmashastra) focusing on    social codes, varna duties, and civil laws.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b)    Arthashastra</b>: Correct. Authored by Kautilya; divided into 15    <i>Adhikaranas</i> (books).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c)    Kamandaka Nitisara</b>: A Gupta-period treatise on statecraft    inspired by Arthashastra, but focusing heavily on foreign policy.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d)    Mudrarakshasa</b>: A Sanskrit play authored by Visakhadatta    depicting Chandragupta Maurya's rise with Chanakya's aid.    Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Samaharta</b>    was the chief revenue collector in Mauryan administration.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sannidhata</b>    served as the chief treasurer and keeper of state storehouses.</p>    <p style=\"orphans:0;widows:0\"><b>Sitadhyaksha</b> supervised    state-owned agricultural lands (<i>Sita</i>). <b>Panyadhyaksha</b>    was the Mauryan superintendent of state trade and commerce,    responsible for price control and market regulation.</p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the revenue    administrative reforms introduced during the Mughal Empire:</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <b>Raja Todar Mal introduced the Dahsala system in 1580 CE under     Akbar's reign.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <b>Under the Dahsala system, the average yield and average prices     of crops over the past ten years were calculated to fix the state     demand.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <b>Land was classified into four categories: Polaj, Parauti,     Chachar, and Banjar.</b></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "4", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Akbar’s finance minister <b>Raja Todar Mal</b> standardized the    <b>Zabti</b> or <b>Dahsala System</b> (1580 CE). It calculated    land revenue based on 10-year average yield and market prices    (1570–1580 CE). One-third of the average produce was fixed as    the state's share, payable in cash.     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    1</b>: Correct. Todar Mal codified the system based on earlier    experiments under Sher Shah Suri.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2</b>: Correct. Revenue demand was based on 10-year averages to    eliminate annual price fluctuations.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    3</b>: Correct. Land categories were: <b>Polaj</b> (annually    cultivated), <b>Parauti</b> (left fallow briefly), <b>Chachar</b>    (fallow 3–4 years), and <b>Banjar</b> (uncultivated 5+ years).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d)</b>:    Correct option combining all three true statements. Important    Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Measurement    of land was carried out using the <b>Bambus-Gaj-i-Ilahi</b>    (bamboo rods connected with iron rings).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Kankut</b>    and <b>Batai</b> (crop sharing) were alternative revenue    estimation methods used alongside Zabti.     </p>    <p style=\"orphans:0;widows:0\"><b>Polaj</b> land paid full    taxation continuously as it was cultivated every year without    remaining fallow.</p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Arrange the following landmark events of the Indian Freedom    Struggle in correct chronological order:</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <b>Passage of the Rowlatt Act,</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <b>Announcement of the Communal Award,</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <b>Formation of the Swaraj Party,</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <b>Chauri Chaura Incident.</b></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><b>Select the    correct answer using the code given below:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 – 4 – 3 – 2</p>", "option2": " <p style=\"orphans:0;widows:0\">    1 – 3 – 4 – 2</p>", "option3": " <p style=\"orphans:0;widows:0\">    4 – 1 – 3 – 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    1 – 4 – 2 – 3</p>", "answer": "1", "negative_marking": "16", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct chronological order is Rowlatt Act (March 1919)     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445162314_html_605f329b16caeae6.gif\" >     Chauri Chaura Incident (Feb 1922)     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445162314_html_605f329b16caeae6.gif\" >     Swaraj Party (Jan 1923) ----&gt; Communal Award (Aug 1932).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    Anarchical and Revolutionary Crimes Act (<b>Rowlatt Act</b>) was    passed in <b>March 1919</b>. The violent <b>Chauri Chaura</b>    clash occurred on <b>February 4, 1922</b>, prompting Gandhi to    suspend Non-Cooperation. C.R. Das and Motilal Nehru formed the    <b>Swaraj Party</b> in <b>January 1923</b>. British PM Ramsay    MacDonald announced the <b>Communal Award</b> in <b>August 1932</b>.       </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)</b>: 1    (March 1919) – 4 (Feb 1922) – 3 (Jan 1923) – 2 (Aug 1932).    Correct.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b, c, d)</b>:    Incorrect timeline arrangements. Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The <b>Poona    Pact</b> (Sept 1932) was signed between M.K. Gandhi and Dr. B.R.    Ambedkar to modify the Communal Award for depressed classes.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C.R. Das</b>    served as the President and <b>Motilal Nehru</b> as one of the    Secretaries of the Swaraj Party.     </p>    <p style=\"orphans:0;widows:0\">The suspension of the    Non-Cooperation Movement post-Chauri Chaura was formally endorsed    by the Congress Working Committee at <b>Bardoli</b> in February    1922.</p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Governor-General of India established the Public Works    Department (PWD), introduced the Telegraph system, and enforced    the controversial Doctrine of Lapse?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Lord William Bentinck</p>", "option2": " <p style=\"orphans:0;widows:0\">    Lord Dalhousie</p>", "option3": " <p style=\"orphans:0;widows:0\">    Lord Canning</p>", "option4": " <p style=\"orphans:0;widows:0\">    Lord Mayo</p>", "answer": "2", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Lord Dalhousie</b> created a separate <b>Public Works    Department (PWD)</b>, opened the first railway line (Bombay to    Thane, 1853), laid the first electric telegraph line (Calcutta to    Agra, 1854), passed the <b>Widow Remarriage Act (1856)</b>, and    annexed native states using the <b>Doctrine of Lapse</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Important    Points:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) Lord    William Bentinck</b>: Abolished Sati (1829), suppressed Thuggee,    and made English the medium of higher education (1835).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) Lord    Dalhousie</b>: Correct. Formulated Doctrine of Lapse; annexed    Satara (1848), Jhansi (1853), and Nagpur (1854).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c) Lord    Canning</b>: Served as the last Governor-General and first    Viceroy; handled the Revolt of 1857 and passed the Indian Councils    Act 1861.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d) Lord    Mayo</b>: Introduced financial decentralization and conducted    India's first non-synchronous Census in 1872. Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Awadh</b>    was annexed by Lord Dalhousie in <b>1856</b> on grounds of    \"maladministration\" (<i>misgovernance</i>), based on    James Outram's report.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Satara</b>    (1848) was the very first state annexed under the Doctrine of    Lapse.     </p>    <p style=\"orphans:0;widows:0\"><b>Wood’s Despatch</b> (1854),    termed the \"Magna Carta of English Education in India,\"    was articulated during <b>Lord Dalhousie's</b> tenure.</p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following mountain passes connects the Kashmir    Valley directly with the Ladakh region across the Zanskar Range?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Shipki La</p>", "option2": " <p style=\"orphans:0;widows:0\">    Nathu La</p>", "option3": " <p style=\"orphans:0;widows:0\">    Zoji La</p>", "option4": " <p style=\"orphans:0;widows:0\">    Lipulekh Pass</p>", "answer": "3", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Zoji La</b> is a high-altitude mountain pass situated at around    3,528 meters (11,575 ft) on National Highway 1 (NH-1). It acts as    the vital terrestrial link connecting the <b>Kashmir Valley</b> to    the cold desert region of <b>Ladakh</b> through Kargil.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option-wise    Analysis:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) Shipki    La</b>: Located in Himachal Pradesh; connects Kinnaur with Tibet;    Sutlej river enters India through this pass.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) Nathu    La</b>: Located in Sikkim; connects Sikkim with Tibet; part of the    ancient Silk Route.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c) Zoji    La</b>: Correct. Connects Srinagar (Kashmir) to Leh (Ladakh).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d)    Lipulekh Pass</b>: Located in Uttarakhand; connects the Kumaon    region with Tibet; used by pilgrims for Kailash-Mansarovar Yatra.    Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Banihal    Pass</b> connects Jammu with Srinagar (contains the Jawahar    Tunnel).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Khar dung    La</b> in Ladakh is one of the world's highest motorable passes    over the Ladakh Range.     </p>    <p style=\"orphans:0;widows:0\"><b>Bara Lacha La</b> pass in    Himachal Pradesh connects Lahaul district directly with Leh in    Ladakh along the Manali-Leh Highway.</p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Assertion (A): The Western Coastal Plains of India do not form    extensive river deltas, unlike the Eastern Coastal Plains.</b></p>    <p style=\"orphans:0;widows:0\"><b>Reason (R):    West-flowing peninsular rivers have short courses, steep    gradients, and flow through hard crystalline bedrock without    carrying heavy sediment loads.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Both A and R are true, and R is the correct explanation of A</p>", "option2": " <p style=\"orphans:0;widows:0\">    Both A and R are true, but R is NOT the correct explanation of A</p>", "option3": " <p style=\"orphans:0;widows:0\">    A is true, but R is false</p>", "option4": " <p style=\"orphans:0;widows:0\">    A is false, but R is true</p>", "answer": "1", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    West-flowing rivers like <b>Narmada</b> and <b>Tapti</b> originate    in central highlands and flow rapidly through fault troughs (rift    valleys) over hard basaltic rocks. Their short length and high    velocity prevent sediment accumulation, causing them to empty into    the Arabian Sea through submerged <b>estuaries</b> rather than    forming broad deltas.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option-wise    Analysis:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)</b>:    Correct. West-flowing streams carry negligible silt and run down    steep Western Ghat slopes, preventing delta formation.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b, c, d)</b>:    Incorrect evaluations of the cause-and-effect relationship.    Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>East-flowing    rivers</b> (Mahanadi, Godavari, Krishna, Kaveri) flow over gentle    slopes, carry huge alluvial loads, and form large arcuate deltas.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sharavati    River</b> forms the famous <b>Jog Falls</b> (Gersoppa), one of    India's highest plunge waterfalls.</p>    <p style=\"orphans:0;widows:0\"> <b>Narmada</b> and <b>Tapti</b>    are the two major west-flowing peninsular rivers in India that    flow through structural <b>rift valleys</b>.</p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"orphans:0;widows:0\">    <b>Which type of natural vegetation dominates the semi-arid    interiors of the Deccan Plateau and the northwestern plains of    India where annual rainfall ranges between 70 cm and 100 cm?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Tropical Wet Evergreen Forests</p>", "option2": " <p style=\"orphans:0;widows:0\">    Tropical Dry Deciduous Forests</p>", "option3": " <p style=\"orphans:0;widows:0\">    Tropical Thorn Forests and Scrubs</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mangrove Forests</p>", "answer": "2", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Tropical Dry Deciduous Forests thrive in regions receiving 70–100    cm annual precipitation.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Forests in    India are categorized based on rainfall. <b>Tropical Dry Deciduous    Forests</b> form a transition between moist deciduous and thorn    forests, covering drier parts of the Deccan plateau, UP, and Bihar    plains where rainfall is between <b>70 cm and 100 cm</b>. Trees    shed leaves during the dry summer.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)    Tropical Wet Evergreen Forests</b>: Require &gt;200 cm annual    rainfall (e.g., Western Ghats slopes, Northeast India).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b)    Tropical Dry Deciduous Forests</b>: Correct. Rainfall range 70–100    cm; key species include Teak, Sal, Neem, Khair, and Palas.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c)    Tropical Thorn Forests</b>: Found in regions receiving &lt;50 to    70 cm rainfall (NW India, parts of Rajasthan, Gujarat).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d)    Mangrove Forests</b>: Coastal tidal forests growing in saline    brackish water deltas (e.g., Sundarbans). Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Moist    Deciduous Forests</b> occur in regions with <b>100–200 cm</b>    rainfall (Teak, Sal, Shisham, Sandalwood).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sandalwood    (<i>Santalum album</i>) is an economically crucial tree native to    dry deciduous forests of South India (Karnataka).     </p>    <p style=\"orphans:0;widows:0\"><b>Tropical Deciduous Forests</b>    (Moist + Dry combined) are the most widespread forest type in    India, often termed \"Monsoon Forests.\"</p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"orphans:0;widows:0\">    <b>Which landmark Supreme Court case laid down the fundamental    principle that the power of Parliament to amend the Constitution    under Article 368 is limited and cannot be exercised to alter or    destroy the \"Basic Structure\" of the Constitution?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Shankari Prasad v. Union of India (1951)</p>", "option2": " <p style=\"orphans:0;widows:0\">    Golaknath v. State of Punjab (1967)</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kesavananda Bharati v. State of Kerala (1973)</p>", "option4": " <p style=\"orphans:0;widows:0\">    Minerva Mills v. Union of India (1980)</p>", "answer": "3", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Kesavananda Bharati case (1973) established the landmark \"Basic    Structure Doctrine.\"</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A 13-judge    Constitutional Bench ruled by a 7–6 majority in <b>Kesavananda    Bharati (1973)</b> that while Parliament has wide power to amend    any part of the Constitution under <b>Article 368</b>, it cannot    destroy basic features such as Judicial Review, Federalism,    Secularism, and Parliamentary Democracy.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)    Shankari Prasad (1951)</b>: Upheld Parliament's power to amend    Fundamental Rights under Article 368.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b)    Golaknath (1967)</b>: Ruled that Fundamental Rights are sacrosanct    and Parliament cannot abridge them through amendments.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c)    Kesavananda Bharati (1973)</b>: Correct. Introduced the <b>Basic    Structure Doctrine</b> overriding the Golaknath verdict.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d) Minerva    Mills (1980)</b>: Reaffirmed basic structure, invalidating clauses    of 42nd Amendment that gave unlimited amending power to    Parliament. Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The 13-judge    bench in Kesavananda Bharati is the largest Constitutional Bench    constituted in Indian judicial history.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Chief Justice    <b>S.M. Sikri</b> headed the bench during the Kesavananda Bharati    verdict.</p>    <p style=\"orphans:0;widows:0\"><b>Judicial Review</b> was    declared an essential part of the Basic Structure of the Indian    Constitution in the <b>Minerva Mills case (1980)</b>.</p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Constitutional Body in India is mandated under Article    280 to make recommendations to the President regarding the    distribution of net proceeds of taxes between the Union and the    States?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    NITI Aayog</p>", "option2": " <p style=\"orphans:0;widows:0\">    Finance Commission</p>", "option3": " <p style=\"orphans:0;widows:0\">    Comptroller and Auditor General of India</p>", "option4": " <p style=\"orphans:0;widows:0\">    Goods and Services Tax Council</p>", "answer": "2", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The Finance Commission is a quasi-judicial constitutional body    constituted under Article 280.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Article    280</b> dictates that the President of India shall constitute a    <b>Finance Commission</b> every 5 years (or earlier). Its primary    duty is to recommend the vertical allocation of central tax    revenues between the Union and States, and horizontal distribution    among States.     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) NITI    Aayog</b>: Non-constitutional, non-statutory executive policy    think tank created in 2015 replacing the Planning Commission.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) Finance    Commission</b>: Correct. Article 280 body comprising a Chairman    and 4 other members appointed by the President.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c)    Comptroller and Auditor General (CAG)</b>: Article 148 authority    that audits public accounts and expenditures.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d) GST    Council</b>: Article 279A constitutional body chaired by the Union    Finance Minister to decide GST tax rates. Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The <b>1st    Finance Commission</b> was set up in 1951 under the chairmanship    of <b>K.C. Neogy</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The <b>16th    Finance Commission</b> was constituted under the chairmanship of    <b>Dr. Arvind Panagariya</b>.</p>    <p style=\"orphans:0;widows:0\">Qualification criteria for    members of the Finance Commission are determined by <b>Parliament</b>    through the Finance Commission Act, 1951.</p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"orphans:0;widows:0\">    <b>Under the provisions of the Sixth Schedule of the Indian    Constitution, Autonomous District Councils (ADCs) enjoy special    administrative autonomy in which group of northeastern states?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Assam, Meghalaya, Tripura, and Mizoram</p>", "option2": " <p style=\"orphans:0;widows:0\">    Assam, Nagaland, Manipur, and Arunachal Pradesh</p>", "option3": " <p style=\"orphans:0;widows:0\">    Manipur, Mizoram, Tripura, and Nagaland</p>", "option4": " <p style=\"orphans:0;widows:0\">    Meghalaya, Arunachal Pradesh, Mizoram, and Sikkim</p>", "answer": "1", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The 6th Schedule applies exclusively to tribal areas in the four    states of Assam, Meghalaya, Tripura, and Mizoram (AMTM).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The <b>Sixth    Schedule</b> under <b>Articles 244(2) and 275(1)</b> provisions    Autonomous District Councils (ADCs) and Regional Councils to    safeguard tribal land, culture, and customs in <b>Assam,    Meghalaya, Tripura, and Mizoram</b> (often remembered via the    mnemonic <b>AMTM</b>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option-wise    Analysis:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) Assam,    Meghalaya, Tripura, Mizoram</b>: Correct. These four states    possess constitutional ADCs under 6th Schedule.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b, c, d)</b>:    Incorrect combinations containing non-6th Schedule states like    Nagaland, Manipur, or Arunachal Pradesh. Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Tribal areas    in other states (outside AMTM) are governed under the <b>Fifth    Schedule</b> (Article 244(1)).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">District    Councils under the 6th Schedule possess legislative power to make    laws on land, forests, and inheritance, subject to Governor    assent.</p>    <p style=\"orphans:0;widows:0\">The <b>Governor</b> has the    constitutional authority to organize, reorganize, alter    boundaries, or create Autonomous Districts under the 6th Schedule.</p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"orphans:0;widows:0\">    <b>Which monetary policy instrument represents the Interest Rate    corridor floor at which commercial banks can park their short-term    surplus funds with the Reserve Bank of India without offering    collateral?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Marginal Standing Facility (MSF) Rate</p>", "option2": " <p style=\"orphans:0;widows:0\">    Standing Deposit Facility (SDF) Rate</p>", "option3": " <p style=\"orphans:0;widows:0\">    Bank Rate</p>", "option4": " <p style=\"orphans:0;widows:0\">    Repo Rate</p>", "answer": "2", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Introduced in April 2022, the <b>Standing Deposit Facility (SDF)</b>    replaced the Fixed Reverse Repo Rate as the floor of the Liquidity    Adjustment Facility (LAF) corridor. It allows the RBI to absorb    liquidity from commercial banks without providing government    collateral.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option-wise    Analysis:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) MSF    Rate</b>: The ceiling of the LAF corridor where banks borrow    overnight funds from RBI against excess SLR securities.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) SDF    Rate</b>: Correct. The uncollateralized floor rate of LAF corridor    used to absorb excess liquidity from commercial banks.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c) Bank    Rate</b>: The rate at which RBI rediscounts bills of exchange or    advances long-term loans without collateral requirement.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d) Repo    Rate</b>: The policy rate at which RBI lends short-term money to    commercial banks against government securities. Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The <b>LAF    Corridor</b> consists of <b>MSF</b> (Ceiling rate), <b>Repo Rate</b>    (Policy rate), and <b>SDF</b> (Floor rate).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">SDF rate is    kept <b>25 basis points below</b> the Repo Rate, while MSF is kept    <b>25 basis points above</b> the Repo Rate.</p>    <p style=\"orphans:0;widows:0\">Unlike Reverse Repo, the <b>Standing    Deposit Facility (SDF)</b> does not require the RBI to transfer    Government Securities to commercial banks.</p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"orphans:0;widows:0\">    <b>What economic phenomenon occurs when high structural inflation    persists alongside sluggish economic growth and high unemployment    in an economy?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Reflation</p>", "option2": " <p style=\"orphans:0;widows:0\">    Deflation</p>", "option3": " <p style=\"orphans:0;widows:0\">    Stagflation</p>", "option4": " <p style=\"orphans:0;widows:0\">    Disinflation</p>", "answer": "3", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Stagflation</b> is an economic anomaly created by combining    stagnant economic output (<b>stagnation</b>) and rising price    levels (<b>inflation</b>). It poses a dilemma for central banks    because monetary tightening to curb inflation worsens    unemployment, while monetary easing worsens inflation. Option-wise    Analysis:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)    Reflation</b>: Deliberate policy actions taken by central    banks/governments to boost economic activity and combat deflation.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b)    Deflation</b>: A persistent decline in the general price level of    goods and services (negative inflation rate).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c)    Stagflation</b>: Correct. Characterized by high inflation + high    unemployment + stagnant GDP growth.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d)    Disinflation</b>: A slowing down in the rate of inflation (e.g.,    inflation falling from 6% to 4%). Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Stagflation    is typically triggered by severe negative <b>supply shocks</b>,    such as sudden global oil price spikes.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The <b>Phillips    Curve</b>, which normally shows an inverse relationship between    inflation and unemployment, fails during Stagflation.</p>    <p style=\"orphans:0;widows:0\"><b>Disinflation</b> means prices    are still rising, but at a slower pace; <b>Deflation</b> means    prices are actually dropping.</p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"orphans:0;widows:0\">    <b>In public finance, which type of non-tax revenue receipt is    generated when the state legally claims the property of a deceased    person who leaves behind no legal heir and no valid will?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Special Assessment</p>", "option2": " <p style=\"orphans:0;widows:0\">    Seigniorage</p>", "option3": " <p style=\"orphans:0;widows:0\">    Escheat</p>", "option4": " <p style=\"orphans:0;widows:0\">    Fine and Forfeiture</p>", "answer": "3", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Escheat</b> is a non-tax revenue source of the government.    Under the legal doctrine of Escheat, if an individual dies    intestate (without a valid will) and leaves no legal heirs, their    land, bank accounts, or estates default to state ownership.    Option-wise Analysis:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) Special    Assessment</b>: A levy imposed on property owners whose land value    increases due to state developmental projects (e.g., Metro rail    construction).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b)    Seigniorage</b>: The profit accrued by a government or central    bank from minting currency (difference between face value and    production cost).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c)    Escheat</b>: Correct. Sovereign acquisition of unclaimed assets of    individuals dying heirless.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d) Fine    and Forfeiture</b>: Penalties imposed by courts or statutory    agencies for law violations. Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Revenue    Receipts are divided into <b>Tax Revenue</b> (Direct/Indirect    Taxes) and <b>Non-Tax Revenue</b> (Fees, Dividends, Escheat,    Grants).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Non-Tax    revenue receipts <b>do not</b> create any liability nor reduce any    assets for the government.</p>    <p style=\"orphans:0;widows:0\">Capital Receipts either <b>create    a liability</b> (e.g., market borrowings) or <b>reduce assets</b>    (e.g., PSU disinvestment, recovery of loans).</p>", "question_heading": ""}, {"sr_no": 59, "question": "  <p style=\"orphans:0;widows:0\">    <b>An object is placed at a distance of </b>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445162314_html_2c494cb3a5d8623a.gif\" > <b>    in front of a concave mirror of focal length </b>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445162314_html_44d06e71c0a52d5.gif\" > <b>.    What is the nature, position, and magnification of the image    formed?</b></p>", "option1": " <p style=\"orphans:0;widows:0\">    Real, inverted, formed at     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445162314_html_15399bb71c75441a.gif\" >     in front of the mirror, magnification     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445162314_html_589de7aba7af40b3.gif\" > </p>", "option2": "  <p style=\"orphans:0;widows:0\">    Virtual, erect, formed at     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445162314_html_15399bb71c75441a.gif\" >     behind the mirror, magnification     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445162314_html_89dcf9be0ede11e4.gif\" > </p>", "option3": "  <p style=\"orphans:0;widows:0\">    Real, inverted, formed at     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445162314_html_2c494cb3a5d8623a.gif\" >     in front of the mirror, magnification     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445162314_html_c5d7e99dfed0f799.gif\" > </p>", "option4": "  <p style=\"orphans:0;widows:0\">    Virtual, erect, formed at     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445162314_html_8774067abfa4e88c.gif\" >     behind the mirror, magnification     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445162314_html_cdcc9a69ecd00093.gif\" > </p>", "answer": "1", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    By Cartesian Sign Convention: Object distance u = -15 cm, Focal    length of concave mirror f = -10 cm.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Mirror    Formula: 1/f = 1/v + 1/u</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1/-10 = 1/v +    1/-15 ---&gt; 1/v = -1/10 + 1/15 = {-3 + 2}/30 = -1/30</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Thus, v = -30    cm (in front of the mirror). Magnification m = -v/u = -30/-15 =    -2. A negative sign signifies a <b>real and inverted</b> image.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option-wise    Analysis:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)</b>:    Correct. Image formed at 30 cm in front of mirror; real, inverted,    magnified twice (m = -2).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b, c, d)</b>:    Mathematically incorrect values and improper sign convention    interpretations. Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">When an    object is between Focus (F) and Center of Curvature (C), the image    is formed beyond C; real, inverted, and magnified.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">If m is    negative, the image is <b>real and inverted</b>; if m is positive,    the image is <b>virtual and erect</b>.</p>    <p style=\"orphans:0;widows:0\">A concave mirror forms a <b>virtual,    erect, and magnified</b> image ONLY when the object is placed    between the <b>Poll (P) and Focus (F)</b>.</p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following chemical reactions represents a classic    example of a Redox Reaction involving simultaneous oxidation and    reduction?</b></p>", "option1": " <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445162314_html_4cba096e165b0ff2.gif\" > </p>", "option2": "  <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445162314_html_f89fdab0b12c9ed0.gif\" > </p>", "option3": "  <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445162314_html_52276155ae3e1940.gif\" > </p>", "option4": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794445162314_html_bcb56921f8d19aed.png\" width=\"189\" height=\"27\" > </p>", "answer": "2", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    A <b>Redox Reaction</b> involves transfer of electrons where    oxidation and reduction occur simultaneously. In reaction b):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">CuO loses    Oxygen (Oxidation state of Cu drops from +2 to 0) ---&gt;    <b>Reduction</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">H₂ gains    Oxygen (Oxidation state of H rises from 0 to +1) ---&gt;    <b>Oxidation</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option-wise    Analysis:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) HCl +    NaOH ---&gt; NaCl + H₂O</b>: Acid-base neutralization reaction    (no change in oxidation states).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) CuO +    H₂---&gt; Cu + H_2O</b>: Correct. Classic redox reaction; CuO    acts as oxidizing agent, H₂ as reducing agent.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c) AgNO₃    + NaCl ---&gt; AgCl </b>↓<b> + NaNO₃</b>: Double displacement    (precipitation) reaction.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d) CaCO₃    ---&gt; CaO + CO₂</b>: Thermal decomposition reaction. Important    Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Oxidation</b>:    Gain of oxygen, loss of hydrogen, or loss of electrons.</p>    <p style=\"orphans:0;widows:0\"><b>Reduction</b>: Loss of oxygen,    gain of hydrogen, or gain of electrons. Rusting of iron (4Fe + 3O₂    + xH₂O ----&gt; 2Fe₂O₃. xH₂O) is a slow electrochemical    <b>redox reaction</b>.</p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"orphans:0;widows:0\">    <b>Which blood vessel carries oxygenated blood directly from the    lungs to the left atrium of the human heart, serving as an    exception to general circulatory vessel functions?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Pulmonary Artery</p>", "option2": " <p style=\"orphans:0;widows:0\">    Pulmonary Vein</p>", "option3": " <p style=\"orphans:0;widows:0\">    Superior Vena Cava</p>", "option4": " <p style=\"orphans:0;widows:0\">    Aorta</p>", "answer": "2", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Generally, arteries carry oxygenated blood away from the heart,    and veins carry deoxygenated blood back to the heart. The    <b>Pulmonary System</b> reverses this rule:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Pulmonary    Artery</b>: Carries deoxygenated blood from right ventricle to    lungs.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Pulmonary    Vein</b>: Carries oxygenated blood from lungs to left atrium.    Option-wise Analysis:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)    Pulmonary Artery</b>: Exception for arteries; carries deoxygenated    blood to lungs.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b)    Pulmonary Vein</b>: Correct. Exception for veins; carries    oxygenated blood from lungs to heart.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c)    Superior Vena Cava</b>: Brings deoxygenated blood from upper body    parts to the right atrium.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d) Aorta</b>:    Largest systemic artery; distributes oxygenated blood from left    ventricle to the entire body. Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The human    heart exhibits <b>double circulation</b>: Pulmonary circulation    (heart-lungs-heart) and Systemic circulation (heart-body-heart).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The <b>Tricuspid    Valve</b> is located between the right atrium and right ventricle;    the <b>Bicuspid (Mitral) Valve</b> lies between the left atrium    and left ventricle.</p>    <p style=\"orphans:0;widows:0\">The <b>Sino-Atrial (SA) Node</b>,    situated in the upper wall of the right atrium, is known as the    natural <b>Pacemaker</b> of the human heart.</p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0\">    <b>The classical dance form Kuchipudi, known for its intricate    brass plate footwork (Tarangam) and expressive solo/group    dance-drama narratives, originated in which Indian state?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Tamil Nadu</p>", "option2": " <p style=\"orphans:0;widows:0\">    Andhra Pradesh</p>", "option3": " <p style=\"orphans:0;widows:0\">    Karnataka</p>", "option4": " <p style=\"orphans:0;widows:0\">    Kerala</p>", "answer": "2", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Kuchipudi</b> is a major classical Indian dance form rooted in    Natya Shastra traditions. Formatted by Saint <b>Siddhendra Yogi</b>    in the 14th century, it combines <i>Nritta</i> (pure dance),    <i>Nritya</i> (expression), and <i>Natya</i> (drama). A unique    highlight is <b>Tarangam</b>, where dancers execute intricate    rhythmic footwork while balancing on the edges of a brass plate.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option-wise    Analysis:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) Tamil    Nadu</b>: Origin state of <b>Bharatanatyam</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) Andhra    Pradesh</b>: Correct. Birthplace of <b>Kuchipudi</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c)    Karnataka</b>: Famous for traditional folk dance-theatre    <b>Yakshagana</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d) Kerala</b>:    Origin state of <b>Kathakali</b> and <b>Mohiniyattam</b>.    Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Prominent    Kuchipudi exponents: <b>Vempati Chinna Satyam</b>, <b>Raja and    Radha Reddy</b>, and <b>Yamini Krishnamurthy</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Performers in    Kuchipudi often balance a pot of water on their head while    executing brass plate footwork (<i>Jala Chitra</i>).</p>    <p style=\"orphans:0;widows:0\"><b>Yamini Krishnamurthy</b> is an    acclaimed classical exponent renowned for her expertise in both    <b>Bharatanatyam</b> and <b>Kuchipudi</b>.</p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"orphans:0;widows:0\">    <b>The world-famous Sun Temple of Konark, designed in the shape of    a colossal chariot with 24 carved stone wheels pulled by seven    horses, was constructed during the 13th century CE by which    monarch?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Rajaraja Chola I</p>", "option2": " <p style=\"orphans:0;widows:0\">    Narasimhadeva I</p>", "option3": " <p style=\"orphans:0;widows:0\">    Anantavarman Chodaganga</p>", "option4": " <p style=\"orphans:0;widows:0\">    Kharavela</p>", "answer": "2", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The <b>Konark Sun Temple</b> (Odisha) was built by King    <b>Narasimhadeva I</b> of the <b>Eastern Ganga Dynasty</b>.    Crafted in Kalinga architectural style using Khondalite rocks, the    temple represents the sun god Surya's chariot. It was inscribed as    a UNESCO World Heritage Site in 1984 and is historically called    the \"Black Pagoda.\"</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option-wise    Analysis:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)    Rajaraja Chola I</b>: Built the famous Brihadisvara Temple (Big    Temple) dedicated to Shiva in Thanjavur (Tamil Nadu).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b)    Narasimhadeva I</b>: Correct. Constructed the Konark Sun Temple.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c)    Anantavarman Chodaganga</b>: Initiated construction of the famous    Jagannath Temple in Puri (Odisha).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d)    Kharavela</b>: Mahameghavahana Dynasty ruler of Kalinga who    inscribed the famous Hathigumpha inscription at Udayagiri caves.    <u><b>Important Points:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">European    sailors referred to Konark Sun Temple as the <b>Black Pagoda</b>    and Puri Jagannath Temple as the <b>White Pagoda</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The 24 carved    stone wheels represent 24 hours of the day (or 12 months),    functioning as accurate sundials.</p>    <p style=\"orphans:0;widows:0\">The <b>Modhera Sun Temple</b> in    Gujarat was built by King <b>Bhimdev I</b> of the Solanki    (Chaulukya) Dynasty in 1026 CE.</p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"orphans:0;widows:0\">    <b>Which international biodiversity conservation agreement,    adopted in 1973 under the aegis of UNEP, regulates international    trade in wild fauna and flora to prevent species extinction?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    CITES</p>", "option2": " <p style=\"orphans:0;widows:0\">    Bonn Convention (CMS)</p>", "option3": " <p style=\"orphans:0;widows:0\">    Convention on Biological Diversity (CBD)</p>", "option4": " <p style=\"orphans:0;widows:0\">    Nagoya Protocol</p>", "answer": "1", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>CITES</b> (Convention on International Trade in Endangered    Species of Wild Fauna and Flora) was drafted in 1973 and entered    into force in 1975. It protects roughly 38,000 species of animals    and plants by regulating international import, export, and    re-export through a system of permits and appendices. Option-wise    Analysis:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) CITES</b>:    Correct. Regulates trade in endangered wildlife; also called the    <b>Washington Convention</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) Bonn    Convention (CMS)</b>: Focuses on conservation of migratory species    of wild animals across their flight/migration corridors.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c) CBD</b>:    Earth Summit (1992) treaty focused on overall conservation,    sustainable use, and equitable benefit-sharing of biological    resources.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d) Nagoya    Protocol</b>: Supplementary agreement to CBD focusing on Access    and Benefit Sharing (ABS) of genetic resources. Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">CITES    categorizes species under three Appendices: <b>Appendix I</b>    (threatened with extinction; trade prohibited), <b>Appendix II</b>    (controlled trade), and <b>Appendix III</b> (protected in at least    one country).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">CITES    Secretariat is administered by <b>UNEP</b> in Geneva, Switzerland.</p>    <p style=\"orphans:0;widows:0\">The <b>Cartagena Protocol on    Biosafety</b> (2000) specifically regulates the safe handling,    transport, and transboundary movement of <b>Living Modified    Organisms (LMOs)</b> resulting from modern biotechnology.</p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"orphans:0;widows:0\">    <b>Which National Park located in the Andaman and Nicobar Islands    protects extensive coral reefs, sea turtles, and the endangered    marine mammal Dugong (Sea Cow)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Gulf of Mannar Marine National Park</p>", "option2": " <p style=\"orphans:0;widows:0\">    Mahatma Gandhi Marine National Park</p>", "option3": " <p style=\"orphans:0;widows:0\">    Similipal National Park</p>", "option4": " <p style=\"orphans:0;widows:0\">    Campbell Bay National Park</p>", "answer": "2", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Mahatma Gandhi Marine National Park</b> (located near Wandoor,    South Andaman) encompasses 15 open sea islands and coral reefs. It    preserves rich marine ecosystems, nesting sea turtle habitats, and    the state animal of Andaman &amp; Nicobar—the <b>Dugong</b>    (<i>Dugong dugon</i>). Option-wise Analysis:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) Gulf of    Mannar Marine NP</b>: Located in Tamil Nadu along the Indian Ocean    corridor; first marine biosphere reserve in South Asia.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) Mahatma    Gandhi Marine NP</b>: Correct. Situated in Andaman &amp; Nicobar    Islands (Wandoor).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c)    Similipal National Park</b>: Located in Mayurbhanj district of    Odisha; famous for tigers, elephants, and waterfalls.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d)    Campbell Bay National Park</b>: Located on Great Nicobar Island,    forming part of the Great Nicobar Biosphere Reserve. Important    Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">India's first    Dugong Conservation Reserve was established along the <b>Palk Bay</b>    coast in Tamil Nadu.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Saddle    Peak National Park</b> is located in North Andaman, containing the    highest peak in the island chain.</p>    <p style=\"orphans:0;widows:0\"><b>Dugong</b> (Sea Cow) is an    herbivorous marine mammal listed as 'Vulnerable' on the IUCN Red    List and protected under <b>Schedule I</b> of India's Wildlife    Protection Act, 1972.</p>", "question_heading": ""}, {"sr_no": 66, "question": "Wुicु ूनधंiधन ूनधंiधन nोपiयnोि नधौधोनcु यनgोnप्रोपiयn in Inकiो, धौपोृिiौुधक in 1942, यूधनोपधौ ो nधपथयना यी 37 nोपiयnोि िोृयनोपयनiधौ ोnक ोथोनकौ पुध ूनधौपigiयहौ Sुोnपi Sथोनहू Bुोपnोgोन Pनप्रध ीयन यहपौपोnकing ौciधnपiीic नधौधोनcु?", "option1": "<p style=\"orphans:0;widows:0\">    Indian Council of Agricultural Research (ICAR)</p>", "option2": " <p style=\"orphans:0;widows:0\">    Council of Scientific and Industrial Research (CSIR)</p>", "option3": " <p style=\"orphans:0;widows:0\">    Defence Research and Development Organisation (DRDO)</p>", "option4": " <p style=\"orphans:0;widows:0\">    Indian Space Research Organisation (ISRO)</p>", "answer": "2", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The <b>Council of Scientific and Industrial Research (CSIR)</b>    was founded in September <b>1942</b>. Dr. <b>Shanti Swarup    Bhatnagar</b> served as its founder-director. CSIR operates 37    national labs across India. The Prime Minister of India serves as    the ex-officio President of CSIR.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option-wise    Analysis:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) ICAR</b>:    Premier apex body for coordinating agricultural education and    research under the Ministry of Agriculture (est. 1929).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) CSIR</b>:    Correct. Est. 1942; awards the Shanti Swarup Bhatnagar Prize in 7    scientific categories to Indian scientists under 45 years.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c) DRDO</b>:    Military research organization established in 1958 under the    Ministry of Defence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d) ISRO</b>:    National space agency founded in 1969 headquartered in Bengaluru.    Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Shanti    Swarup Bhatnagar (SSB) Prize</b> carries a cash reward, citation,    and plaque, awarded across Physical, Chemical, Biological,    Engineering, Medical, Mathematical, and Earth Sciences.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Union    Minister of Science &amp; Technology acts as ex-officio Vice    President of CSIR.</p>    <p style=\"orphans:0;widows:0\">The <b>Prime Minister of India</b>    is the ex-officio President of <b>CSIR</b>.</p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Match List-I (Famous Book) with List-II (Author): </b>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <u><b>List-I: List-II:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>A. Poverty and Un-British Rule in India 1. M. Visvesvaraya</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>B. The Economic History of India 2. Dadabhai Naoroji</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>C. Planned Economy for India 3. Rajendra Prasad</b></p>    <p style=\"orphans:0;widows:0\"><b>D. India    Divided 4. Romesh Chunder Dutt (R.C. Dutt)</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    A-2, B-4, C-1, D-3</p>", "option2": " <p style=\"orphans:0;widows:0\">    A-4, B-2, C-1, D-3</p>", "option3": " <p style=\"orphans:0;widows:0\">    A-2, B-4, C-3, D-1</p>", "option4": " <p style=\"orphans:0;widows:0\">    A-1, B-3, C-4, D-2</p>", "answer": "1", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Poverty and Un-British Rule in India</b>: Authored by <b>Dadabhai    Naoroji</b> (1901), introducing the 'Drain of Wealth' theory.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>The    Economic History of India</b>: Authored by <b>R.C. Dutt</b>    (1902), providing a detailed critique of British economic    exploitation.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Planned    Economy for India</b>: Authored by <b>M. Visvesvaraya</b> (1934),    laying out India's first 10-year economic planning blueprint.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>India    Divided</b>: Authored by Dr. <b>Rajendra Prasad</b> (1946),    presenting a counter-argument to the partition proposal.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option-wise    Analysis:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)</b>:    A-2, B-4, C-1, D-3. Correct matching code.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b, c, d)</b>:    Erroneous pairing of books and respective authors.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u> <b>Important    Points:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Dadabhai    Naoroji</b> was the first Indian to calculate National Income and    Per Capita Income (fixed at ₹20 per year for 1867-68).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sir <b>M.    Visvesvaraya's</b> birthday (September 15) is celebrated in India    as <b>Engineers' Day</b>.</p>    <p style=\"orphans:0;widows:0\"><b>Dadabhai Naoroji</b> was    elected as the first Indian Member of Parliament (MP) in the    British House of Commons representing Central Finsbury (1892).</p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"orphans:0;widows:0\">    <b>Under the recently launched PM-SURYA GHAR: MUFT BIJLI YOJANA,    what is the central financial outlay and target household coverage    to install rooftop solar systems providing up to 300 units of free    electricity per month?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    ₹75,021 Crore outlay targeting 1 Crore (10 million) households</p>", "option2": " <p style=\"orphans:0;widows:0\">    ₹50,000 Crore outlay targeting 50 Lakh households</p>", "option3": " <p style=\"orphans:0;widows:0\">    ₹1,00,000 Crore outlay targeting 2 Crore households</p>", "option4": " <p style=\"orphans:0;widows:0\">    ₹30,000 Crore outlay targeting 25 Lakh households</p>", "answer": "1", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Approved by the Union Cabinet, <b>PM-Surya Ghar: Muft Bijli Yojana</b>    provides Central Financial Assistance (CFA) covering up to 60% of    system cost for 2 kW systems and 40% for additional capacity    between 2 kW to 3 kW. It enables households to obtain up to <b>300    units of free electricity</b> per month and sell surplus power    back to DISCOMs.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option-wise    Analysis:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)</b>:    Correct. Total allocation is <b>₹75,021 crore</b> with a target    of <b>1 crore households</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b, c, d)</b>:    Incorrect figures regarding financial outlay and target    beneficiary limits. Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Nodal    Ministry: <b>Ministry of New and Renewable Energy (MNRE)</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Subsidies:    ₹30,000 per kW for up to 2 kW systems, and ₹18,000 for the 3rd    kW (max total subsidy ₹78,000 for 3 kW).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Beneficiary    households can access low-interest collateral-free loans at around    7% interest rate.</p>    <p style=\"orphans:0;widows:0\">National Portal for Rooftop Solar    handles direct benefit transfer (DBT) of subsidies into    beneficiary bank accounts upon installation verification.</p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"orphans:0;widows:0\">    <b>India’s first indigenously designed and developed high-speed    end-to-end autonomous rail collision avoidance system, deployed to    prevent train collisions due to human error or signal passing at    danger (SPAD), is officially named:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Kavach</p>", "option2": " <p style=\"orphans:0;widows:0\">    Raksha</p>", "option3": " <p style=\"orphans:0;widows:0\">    Netra</p>", "option4": " <p style=\"orphans:0;widows:0\">    Drishti</p>", "answer": "1", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Kavach</b> is an indigenously developed Automatic Train    Protection (ATP) system designed by the <b>Research Designs and    Standards Organisation (RDSO)</b> in collaboration with Indian    industry. It automatically applies brakes if a driver fails to    control speed or passes a signal at red (SPAD), preventing head-on    and rear-end train collisions.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option-wise    Analysis:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) Kavach</b>:    Correct. Indigenous ATP system operating via RFID tags, loco    units, and radio communication.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) Raksha</b>:    Generic term; not the official railway ATP system.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c) Netra</b>:    Airborne Early Warning and Control System (AEW&amp;CS) developed    by DRDO for the Indian Air Force.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d)    Drishti</b>: Refers to Drishti-10 Starliner, an indigenously    manufactured Unmanned Aerial Vehicle (UAV) for Indian Armed    Forces. Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Kavach    functions seamlessly in adverse weather conditions like dense fog.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Operating    Frequency: Uses Ultra High Frequency (UHF) radio communication    between trains and trackside units.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">SIL-4    Certified: Safety Integrity Level 4 (highest level of    international safety certification).</p>    <p style=\"orphans:0;widows:0\"><b>RDSO (Research Designs and    Standards Organisation)</b> is the R&amp;D wing of Indian    Railways, headquartered in <b>Lucknow, Uttar Pradesh</b>.</p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Indian airport achieved the historical landmark of    becoming the world's first airport to operate entirely on 100%    solar power, earning the UN Champions of the Earth Award?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Indira Gandhi International Airport, New Delhi</p>", "option2": " <p style=\"orphans:0;widows:0\">    Cochin International Airport, Kerala</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kempegowda International Airport, Bengaluru</p>", "option4": " <p style=\"orphans:0;widows:0\">    Chhatrapati Shivaji Maharaj International Airport, Mumbai</p>", "answer": "2", "negative_marking": "16", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Cochin International Airport (CIAL)</b> in Kerala achieved    complete green energy independence in August 2015 by commissioning    a 12 MWp solar power plant. Recognizing this pioneering green    initiative, the United Nations Environment Programme (UNEP)    conferred the prestigious <b>Champions of the Earth Award</b> upon    CIAL in 2018.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u><b>Option-wise    Analysis:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) Indira    Gandhi International Airport (Delhi)</b>: First airport in India    to introduce a dedicated hydro-and-solar combination renewable    power arrangement.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) Cochin    International Airport (CIAL)</b>: Correct. World's first 100%    solar-powered airport; operated under PPP model.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c)    Kempegowda International Airport (Bengaluru)</b>: Famous for its    Terminal 2 (\"Terminal in a Garden\") winning UNESCO's    Prix Versailles.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d)    Chhatrapati Shivaji Maharaj International Airport (Mumbai)</b>:    One of India's busiest single-runway operating hubs. Important    Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">CIAL was also    India's first greenfield airport constructed under a    <b>Public-Private Partnership (PPP)</b> model.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Airport Code    for Cochin International Airport is <b>COK</b>.</p>    <p style=\"orphans:0;widows:0\"><b>UNEP Champions of the Earth    Award</b> is the United Nations' highest environmental honor.</p>", "question_heading": ""}];

let currentQuestion = 0;
