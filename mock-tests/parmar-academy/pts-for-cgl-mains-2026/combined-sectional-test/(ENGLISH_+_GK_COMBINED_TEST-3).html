<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>11.) ENGLISH + GK COMBINED TEST-3 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

const questions = [{"sr_no": 1, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the Mauryan    Empire's administration and Ashokan edicts:</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Dhamma     Mahamattas were a special cadre of officials appointed by Emperor     Ashoka in his 13th regnal year to propagate Dhamma and look after     the welfare of various sects.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>The     Rummindei Pillar Inscription at Lumbini records Ashoka's visit to     the birthplace of Gautama Buddha and his reduction of the     village's land revenue (Bhaga) to one-eighth of the produce.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>All     Major Rock Edicts of Ashoka across the Indian subcontinent were     inscribed exclusively in the Brahmi script and Magadhi Prakrit     language.</b></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><b>Which of the statements given    above are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Ashoka’s administrative reforms and inscriptions reflect    welfare-oriented governance. While <b>Brahmi</b> and <b>Prakrit</b>    dominated central and eastern India, northwestern edicts    (Shahbazgarhi and Mansehra) used <b>Kharosthi</b>, and far-western    edicts (Kandahar) used <b>Greek and Aramaic</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    1</b>: Correct. Mentioned in <b>Major Rock Edict V</b>; <i>Dhamma    Mahamattas</i> were created in the 13th year after Ashoka's    coronation.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2</b>: Correct. <b>Rummindei Pillar Edict</b> exempts Lumbini from    <i>Bali</i> (religious tribute) and reduces <i>Bhaga</i> (land    tax) from 1/6th to <b>1/8th</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    3</b>: Incorrect. Four scripts (<b>Brahmi, Kharosthi, Greek,    Aramaic</b>) and three languages (<b>Prakrit, Greek, Aramaic</b>)    were used across Ashokan edicts.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)</b>:    Correct combination of true statements.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u> <b>Important    Points:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>James    Prinsep</b> first deciphered the Ashokan Brahmi script in <b>1837</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Major Rock    Edict XIII</b> gives the most detailed account of the <b>Kalinga    War (261 BCE)</b> and Ashoka’s remorse.</p>    <p style=\"orphans:0;widows:0\"><b>Maski, Gujjara, Nittur, and    Udegolam</b> minor rock edicts explicitly mention Ashoka's    personal name <b>\"Ashoka\"</b> instead of just    <i>Devanampiya Piyadassi</i>.</p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Match List-I (Mughal Administrative / Revenue Term) with    List-II (Meaning / Function):</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u><b>List-I:    List-II: </b></u>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A. Mir    Bakshi 1. Censor of public morals and regulator of weights and    measures</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B.    Sadr-us-Sudur 2. Head of the military department and    paymaster-general</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C.    Muhtasib 3. Revenue collector at the Sarkar (district) level</b></p>    <p style=\"orphans:0;widows:0\"><b>D. Amil-Guzar 4. Head of    ecclesiastical affairs and charitable endowments (Madad-i-Ma'ash)</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    A-2, B-4, C-1, D-3</p>", "option2": " <p style=\"orphans:0;widows:0\">    A-4, B-2, C-1, D-3</p>", "option3": " <p style=\"orphans:0;widows:0\">    A-2, B-1, C-4, D-3</p>", "option4": " <p style=\"orphans:0;widows:0\">    A-3, B-4, C-1, D-2</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Akbar institutionalized a centralized departmental structure in    the Mughal Empire separating revenue, military, religious, and    municipal oversight.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A. Mir    Bakshi (2)</b>: Headed the military administration, supervised the    <b>Mansabdari</b> muster (<i>Dagh</i> branding of horses and    <i>Chehra</i> descriptive rolls), and signed salary bills.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B.    Sadr-us-Sudur (4)</b>: Protected Sharia law, supervised <i>Qazis</i>,    and managed tax-free religious/scholarly land grants (<b>Suyurghal    / Madad-i-Ma'ash</b>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C.    Muhtasib (1)</b>: Appointed prominently under <b>Aurangzeb</b> to    enforce moral codes, curb gambling/intoxicants, and inspect market    weights and measures.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>D.    Amil-Guzar (3)</b>: Chief revenue collector of a <b>Sarkar</b>    (district), tasked with assessing and collecting land revenue    (<i>Mal</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u><b>Important    Points:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Diwan-i-Kul</b>    (Wazir) was the supreme head of the revenue and finance    department.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Mir Saman</b>    (Khan-i-Saman) oversaw the imperial household, royal kitchens, and    state workshops (<b>Karkhanas</b>).</p>    <p style=\"orphans:0;widows:0\"><b>Faujdar</b> was the executive    and military head of a <i>Sarkar</i> responsible for maintaining    law and order.</p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Arrange the following landmark constitutional and political    developments during the British Raj in correct chronological    order:</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Nehru     Report</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Simon     Commission's arrival in India</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Gandhi–Irwin     Pact</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Communal     Award announced by Ramsay MacDonald</b></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><b>Select the correct answer    using the code given below:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    2 – 1 – 3 – 4</p>", "option2": " <p style=\"orphans:0;widows:0\">    1 – 2 – 3 – 4</p>", "option3": " <p style=\"orphans:0;widows:0\">    2 – 3 – 1 – 4</p>", "option4": " <p style=\"orphans:0;widows:0\">    2 – 1 – 4 – 3</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Between 1928 and 1932, constitutional negotiations, boycotts, and    Round Table Conferences reshaped India's freedom struggle.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) 2 – 1    – 3 – 4</b>: Correct sequence:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Simon    Commission Arrival (February 3, 1928)</b>: All-white seven-member    Indian Statutory Commission landed in Bombay; greeted with black    flags and <i>\"Simon Go Back\"</i> slogans.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Nehru    Report (August 1928)</b>: Drafted by an All-Parties Conference    committee chaired by <b>Motilal Nehru</b>, demanding <b>Dominion    Status</b>, joint electorates, and Fundamental Rights.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Gandhi–Irwin    Pact (March 5, 1931)</b>: Delhi Pact suspending Civil Disobedience    and enabling Congress participation in the <b>Second Round Table    Conference</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Communal    Award (August 16, 1932)</b>: Announced by British PM <b>Ramsay    MacDonald</b>, extending separate electorates to the Depressed    Classes, leading to Gandhi's fast and the <b>Poona Pact (September    24, 1932)</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b, c, d)</b>:    Incorrect chronological sequences.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u><b>Important    Points:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Lala    Lajpat Rai</b> succumbed to injuries in November 1928 after a    brutal police lathi-charge led by James Scott in Lahore during    anti-Simon protests.</p>    <p style=\"orphans:0;widows:0\"><b>Subhas Chandra Bose</b> and    <b>Jawaharlal Nehru</b> opposed Dominion Status in the Nehru    Report and founded the <b>Independence for India League</b> (1928)    demanding <i>Purna Swaraj</i>.</p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Assertion (A): The Permanent Settlement of Bengal (1793)    introduced by Lord Cornwallis created a class of loyal zamindars    while severely undermining the customary occupancy rights of the    actual cultivators (ryots).</b></p>    <p style=\"orphans:0;widows:0\"><b>Reason (R): Under the Sunset    Law associated with the Permanent Settlement, if a zamindar failed    to deposit the fixed land revenue by sunset on the specified due    date, his estate was liable to be confiscated and auctioned off by    the British government.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Both A and R are true, and R is the correct explanation of A</p>", "option2": " <p style=\"orphans:0;widows:0\">    Both A and R are true, but R is NOT the correct explanation of A</p>", "option3": " <p style=\"orphans:0;widows:0\">    A is true, but R is false</p>", "option4": " <p style=\"orphans:0;widows:0\">    A is false, but R is true</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Formulated with <b>Sir John Shore</b> (architect of the system)    and implemented by <b>Lord Cornwallis</b> in 1793 across Bengal,    Bihar, and Orissa (~19% of British India), the <b>Permanent    Settlement</b> recognized zamindars as hereditary proprietors of    land while fixing state revenue demand permanently at 10/11ths of    collected rent.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)</b>:    Incorrect causal linkage; R describes the strict revenue recovery    penalty (<i>Sunset Law</i>) imposed on zamindars, whereas A    describes the socio-agrarian consequences of granting proprietary    ownership to zamindars.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b)</b>:    Correct. Both A and R are individually true statements.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c, d)</b>:    Incorrect because both statements are factually true.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u> <b>Important    Points:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Ryotwari    System</b>: Introduced by <b>Thomas Munro</b> and <b>Alexander    Read</b> in Madras and Bombay (~51% of British India), settling    revenue directly with peasant cultivators (<i>ryots</i>).</p>    <p style=\"orphans:0;widows:0\"><b>Mahalwari System</b>:    Introduced by <b>Holt Mackenzie</b> (1822) and revised by <b>R.M.    Bird</b> in North-Western Provinces and Punjab (~30% of British    India), settling revenue with the entire village community    (<i>Mahal</i>).</p>", "question_heading": ""}, {"sr_no": 5, "question": "Cयnौiकधन पुध ीियियथing ौपोपधंधnपौ नधgोनकing ूिोnधपोनद थinक ृिधपौ ोnक ोपंयौूुधनic ूनधौौहनध cिधिस: Tुध Dियकनहंौ (Eतहोपयनiोि Lयथ-Pनधौौहनध Bिधप) iौ cुोनोcपधनप्रधक ृद cोिं, िigुप ॅोनiोृिध थinकौ ोnक inपधnौध ॅधनपicोि cयnॅधcपiयnोि ोiन cहननधnपौ नोपुधन पुोn ौपनयng ुयनप्रयnपोि ौहनीोcध थinकौ. Tुध Rयोनing Fयनपiधौ, Fहनiयहौ Fiीपiधौ, ोnक Sुनiधाing Siसपiधौ ोनध ीiधनcध थधौपधिनद थinकौ ृियथing ूनधकयंinोnिपद in पुध Sयहपुधनn Hधंiौूुधनध कहध पय ंiniंोि cयnपinधnपोि िोnकंोौौ ीनicपiयn. Hयनौध Lोपiपहकधौ cयननधौूयnक पय पुध Sहृ-Pियोन Lयथ-Pनधौौहनध Bिधपौ ियcोपधक ोनयहnक Nयनपु ोnक Sयहपु िोपiपहकधौ. Wुicु यी पुध ौपोपधंधnपौ giॅधn ोृयॅध ोनध cयननधcप?", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Global atmospheric circulation is driven by thermally and    dynamically induced pressure belts. Near the Equator (5° N – 5°    S), intense heating causes air to rise vertically (<b>Doldrums</b>),    whereas at 30° N/S, subsiding dry air creates calm high-pressure    zones (<b>Horse Latitudes</b>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    1</b>: Correct. Vertical upward convection dominates the    ITCZ/Doldrums, creating calm horizontal wind zones feared by    sailing ships.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2</b>: Correct. Vast uninterrupted oceans between 40° S and 60°    S allow Westerlies to reach gale-force speeds.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    3</b>: Incorrect. <b>Horse Latitudes</b> are the <b>Sub-Tropical    High-Pressure Belts (30</b>° <b>– 35</b>° <b>N/S)</b>    characterized by descending air, clear skies, and major hot    deserts.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)</b>:    Correct combination of true statements.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Important    Points:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Coriolis    Force</b>: Deflects moving air to the <b>right</b> in the Northern    Hemisphere and to the <b>left</b> in the Southern Hemisphere    (<b>Ferrel's Law</b>); it is <b>zero at the Equator</b> and    maximum at the Poles.</p>    <p style=\"orphans:0;widows:0\"><b>Chinook</b> (\"snow-eater\")    is a warm, dry katabatic wind descending the eastern slopes of the    Rocky Mountains in North America; <b>Foehn</b> is its counterpart    in the European Alps.</p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Match List-I (Major Indian River Tributary) with List-II    (Principal River System):</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u><b>List-I:    List-II:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A.    Pranhita 1. Krishna River</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B. Kabini    2. Narmada River</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C. Bhima    3. Godavari River</b></p>    <p style=\"orphans:0;widows:0\"><b>D. Tawa 4. Kaveri River</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    A-3, B-4, C-1, D-2</p>", "option2": " <p style=\"orphans:0;widows:0\">    A-1, B-4, C-3, D-2</p>", "option3": " <p style=\"orphans:0;widows:0\">    A-3, B-1, C-4, D-2</p>", "option4": " <p style=\"orphans:0;widows:0\">    A-4, B-3, C-1, D-2</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Peninsular river systems possess distinct drainage networks    originating from the Western Ghats or Central Highlands.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A.    Pranhita (3)</b>: Largest tributary of the <b>Godavari River</b>    (accounting for ~34% of its drainage basin), formed by the    confluence of Wardha, Penganga, and Wainganga rivers.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B. Kabini    (4)</b>: Major right-bank tributary of the <b>Kaveri River</b>    originating in Wayanad (Kerala) and flowing through Karnataka;    other Kaveri tributaries include Hemavati, Shimsha, Arkavathy,    Bhavani, and Amaravati.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C. Bhima    (1)</b>: Longest left-bank tributary of the <b>Krishna River</b>    originating near Bhimashankar in Maharashtra; <b>Tungabhadra</b>    is Krishna's largest right-bank tributary.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>D. Tawa    (2)</b>: Largest left-bank tributary of the <b>Narmada River</b>,    rising in the Satpura Range (Chhindwara, MP).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Important    Points:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Godavari</b>    (1,465 km), rising at <b>Trimbakeshwar</b> (Nashik), is India's    longest Peninsular river and is called <b>Dakshin Ganga / Vridha    Ganga</b>.</p>    <p style=\"orphans:0;widows:0\"><b>Narmada</b> and <b>Tapti</b>    flow westward through structural <b>rift valleys</b> into the    Arabian Sea, forming <b>estuaries</b> rather than deltas.</p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0\">    <b>Which biosphere-rich mangrove forest delta, formed at the    confluence of the Ganga, Brahmaputra, and Meghna rivers in the Bay    of Bengal, derives its name from the dominant Heritiera fomes tree    species whose roots possess specialized breathing pores    (pneumatophores)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Bhitarkanika Mangroves / <span style=\"font-family:'Nirmala UI'\"><span>भितरकनिका    मैंग्रोव</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    Pichavaram Mangroves / <span style=\"font-family:'Nirmala UI'\"><span>पिचावरम    मैंग्रोव</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    Sundarbans Delta / <span style=\"font-family:'Nirmala UI'\"><span>सुंदरबन    डेल्टा</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    Baratang Mangroves / <span style=\"font-family:'Nirmala UI'\"><span>बाराटांग    मैंग्रोव</span></span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Spreading across India (West Bengal) and Bangladesh, the    <b>Sundarbans</b> thrives in saline, oxygen-poor tidal mudflats.    To survive waterlogged anaerobic soils, mangrove trees develop    upward-growing aerial roots called <b>pneumatophores</b>    (breathing roots) and <b>viviparous germination</b> (seeds    germinate while still attached to the parent tree).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)    Bhitarkanika Mangroves</b>: Located in Kendrapara district    (Odisha) at the Brahmani-Baitarani delta; India's second-largest    mangrove ecosystem, famous for <b>Saltwater Crocodiles</b> and    Gahirmatha Olive Ridley nesting beach.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b)    Pichavaram Mangroves</b>: Located near Chidambaram in Cuddalore    district, <b>Tamil Nadu</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c)    Sundarbans Delta</b>: Correct. UNESCO World Heritage Site (1987),    Ramsar Wetland of International Importance (largest in India), and    home to the Royal Bengal Tiger.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d)    Baratang Mangroves</b>: Located in the <b>Andaman Islands</b>,    famous for tidal mangrove creeks and limestone caves.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Important    Points:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">According to    the <i>India State of Forest Report (ISFR)</i>, <b>West Bengal</b>    holds the largest mangrove forest cover in India (~42%), followed    by <b>Gujarat</b> (~23%) and <b>Andaman &amp; Nicobar Islands</b>.</p>    <p style=\"orphans:0;widows:0\"><b>Vivipary</b> and    <b>Pneumatophores</b> are signature physiological adaptations of    halophytic mangrove vegetation.</p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding Money Bills under    Article 110 of the Indian Constitution:</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A     Money Bill can be introduced only in the Lok Sabha and strictly     on the prior recommendation of the President.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>The     Rajya Sabha cannot amend or reject a Money Bill; it must return     the bill within 14 days, failing which the bill is deemed passed     by both Houses.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>There     is a constitutional provision for a Joint Sitting of both Houses     under Article 108 to resolve any deadlock over a Money Bill.</b></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><b>Which of the statements given    above are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only / <span style=\"font-family:'Nirmala UI'\"><span>केवल    </span></span>1 <span style=\"font-family:'Nirmala UI'\"><span>और    </span></span>2</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only / <span style=\"font-family:'Nirmala UI'\"><span>केवल    </span></span>2 <span style=\"font-family:'Nirmala UI'\"><span>और    </span></span>3</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only / <span style=\"font-family:'Nirmala UI'\"><span>केवल    </span></span>1 <span style=\"font-family:'Nirmala UI'\"><span>और    </span></span>3</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3 / 1, 2 <span style=\"font-family:'Nirmala UI'\"><span>और    </span></span>3</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Under <b>Article 110</b>, a bill is a Money Bill if it contains    <i>only</i> provisions dealing with taxation, borrowing by the    Union Government, Consolidated/Contingency Fund custody, or    appropriation of money. The <b>Speaker of the Lok Sabha</b> has    final certifying authority on whether a bill is a Money Bill.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    1</b>: Correct. Governed by <b>Article 109(1)</b> and <b>Article    117(1)</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2</b>: Correct. Rajya Sabha can only suggest recommendations    within <b>14 days</b>, which Lok Sabha may accept or reject.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    3</b>: Incorrect. Since Lok Sabha overrides Rajya Sabha on Money    Bills, a deadlock cannot arise; hence <b>Joint Sitting (Article    108)</b> applies only to <b>Ordinary Bills</b> and <b>Financial    Bills (Category I &amp; II)</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)</b>:    Correct combination of true statements.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Important    Points</b>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Every    Money Bill is a Financial Bill, but not every Financial Bill is a    Money Bill.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Financial    Bill (Category I)</b> under <b>Article 117(1)</b> requires    President's recommendation for introduction in Lok Sabha, <b>but</b>    Rajya Sabha can amend or reject it, and a Joint Sitting can be    called.</p>    <p style=\"orphans:0;widows:0\"><b>President cannot return a    Money Bill</b> for reconsideration under Article 111 (can only    assent or withhold assent, though withholding is rarely exercised    since prior Presidential recommendation was given).</p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the </b><i><b>Amendment    Procedure of the Indian Constitution</b></i><b> under Article 368:</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A     Constitutional Amendment Bill can be introduced in either House     of Parliament by a minister or by a private member without     requiring the prior permission of the President.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>In     case of a deadlock between Lok Sabha and Rajya Sabha over a     Constitutional Amendment Bill, a Joint Sitting of both Houses can     be summoned under Article 108.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Under     the </b><i><b>24th Constitutional Amendment Act, 1971</b></i><b>,     it was made obligatory for the President to give assent to a     Constitutional Amendment Bill duly passed by both Houses of     Parliament.</b></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><b>Which of the statements given    above are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "option3": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Under <b>Article 368</b> (Part XX, borrowed from South Africa),    each House of Parliament must pass a Constitutional Amendment Bill    separately by a <b>Special Majority</b> (majority of total    membership of that House AND a majority of not less than    two-thirds of members present and voting).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    1</b>: Correct. Unlike a Money Bill (Article 110) or State    Reorganization Bill (Article 3), an Article 368 bill needs <b>no    prior Presidential recommendation</b> and cannot be introduced in    a State Legislature.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2</b>: Incorrect. Because each House must pass the bill    independently by a special majority, <b>Joint Sitting under    Article 108 is not permitted</b> for Constitutional Amendment    Bills.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    3</b>: Correct. The <b>24th Amendment Act, 1971</b> amended    Article 368(2) so the President can neither withhold assent nor    return a Constitutional Amendment Bill for reconsideration.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Important    Points:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Amendments    affecting <b>federal provisions</b> (such as Presidential    election, Supreme Court/High Courts, Seventh Schedule lists, or    Article 368 itself) additionally require ratification by <b>at    least half of the State Legislatures</b> by a <b>Simple Majority</b>.</p>    <p style=\"orphans:0;widows:0\">In the <b>Kesavananda Bharati v.    State of Kerala (1973)</b> judgment, the Supreme Court ruled that    Parliament's amending power under Article 368 cannot alter the    <b>Basic Structure</b> of the Constitution.</p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Match List-I (Parliamentary Motion / Device) with List-II    (Purpose / Procedural Rule):</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u> <b>List-I:    List-II: </b></u>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A.    Adjournment Motion 1. Moved against an individual minister or the    entire Council of Ministers for specific policies; does not    require automatic resignation if passed</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B. Censure    Motion 2. Introduced only in Lok Sabha with support of at least 50    members to test the majority of the Council of Ministers</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C.    No-Confidence Motion 3. Moved when a minister breaches    parliamentary privileges by withholding facts or giving distorted    information</b></p>    <p style=\"orphans:0;widows:0\"><b>D. Privilege Motion 4.    Extraordinary device requiring support of 50 members to draw House    attention to a definite matter of urgent public importance,    interrupting normal business</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    A-3, B-1, C-2, D-4</p>", "option2": " <p style=\"orphans:0;widows:0\">    A-1, B-4, C-2, D-3</p>", "option3": " <p style=\"orphans:0;widows:0\">    A-4, B-2, C-1, D-3</p>", "option4": " <p style=\"orphans:0;widows:0\">    A-4, B-1, C-2, D-3</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Parliamentary motions serve as critical legislative instruments    for enforcing executive accountability under <b>Article 75(3)</b>    (collective responsibility of Council of Ministers to Lok Sabha).     </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Adjournment     Motion (4)</b>: Permitted <b>only in Lok Sabha</b> (since it     involves an element of censure against the government); requires     50 members' support and lasts at least 2 hours 30 minutes.</p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B.     Censure Motion (1)</b>: Must state specific reasons for its     adoption; can be moved against an individual minister, a group of     ministers, or the entire Council of Ministers.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C.     No-Confidence Motion (2)</b>: Needs <b>no specific reason</b> for     adoption; moved <b>only in Lok Sabha</b> (Rule 198) with 50     members' support; if passed, the entire Council of Ministers <b>must     resign</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>D.     Privilege Motion (3)</b>: Concerned with breach of parliamentary     privileges by a minister or member. Important Points:</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Zero     Hour</b> is an Indian parliamentary innovation (in existence     since <b>1962</b>) not mentioned in the Rules of Procedure; it     starts immediately after Question Hour at 12 noon.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Guillotine</b> refers to     the Speaker putting all remaining undiscussed Demands for Grants     to vote on the last allotted day of the budget discussion.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 11, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding Inflation and    monetary policy transmission in India:</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Core     Inflation excludes volatile food and fuel components from     headline inflation to reflect underlying long-term price     pressures.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Stagflation     describes a macroeconomic condition characterized simultaneously     by high inflation, stagnant economic growth, and high     unemployment.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Under     the Flexible Inflation Targeting (FIT) framework, the Government     of India in consultation with RBI has fixed the Consumer Price     Index (CPI) inflation target at </b>     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795015811587_html_6a742718fb7c875a.gif\" > <b>     with a tolerance band of </b>     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795015811587_html_d61dbc1eb68b6d6f.gif\" > <b>     (</b><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795015811587_html_3b88524ba9426111.gif\" > <b>     to </b>     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795015811587_html_3ed9345b5afcf9e8.gif\" > <b>).</b></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><b>Which of the statements given    above are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Introduced via the <b>2016 amendment to the RBI Act, 1934</b>    (based on the <b>Urjit Patel Committee</b> recommendations), the    6-member <b>Monetary Policy Committee (MPC)</b> sets the policy    Repo Rate to keep headline <b>CPI-Combined</b> inflation within 4%    ± 2%.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    1</b>: Correct. <b>Core Inflation = Headline Inflation minus Food    and Fuel</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2</b>: Correct. <b>Stagflation</b> (Stagnation + Inflation)    challenges standard Keynesian remedies because raising interest    rates tames inflation but worsens unemployment.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    3</b>: Correct. Target is <b>4%</b> (upper tolerance limit <b>6%</b>,    lower tolerance limit <b>2%</b>); failing to meet this target for    <b>three consecutive quarters</b> constitutes a failure requiring    RBI to submit a formal report to the Central Government.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d)</b>:    Correct combination.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u><b>Important    Points:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Headline    CPI (Combined)</b> is compiled monthly by the <b>National    Statistical Office (NSO)</b> with base year <b>2024</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Wholesale    Price Index (WPI)</b> is compiled monthly by the <b>Office of the    Economic Adviser (DPIIT)</b> with base year <b>2022–23 </b>and    <b>excludes services</b>.</p>    <p style=\"orphans:0;widows:0\"><b>Disinflation</b> means a    <i>slowdown in the rate of inflation</i> (prices still rise, e.g.,    from 7% to 4%), whereas <b>Deflation</b> means an <i>actual fall    in the general price level</i> (negative inflation rate).</p>", "question_heading": ""}, {"sr_no": 12, "question": "  <p style=\"orphans:0;widows:0\">    <b>In National Income Accounting, how is Net National Product at    Factor Cost (</b><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795015811587_html_1509828b16c763bf.gif\" > <b>)—commonly    termed National Income—derived from Gross Domestic Product at    Market Price (</b><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795015811587_html_913a1fd10d5f430d.gif\" > <b>)?</b></p>", "option1": " <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795015811587_html_913a1fd10d5f430d.gif\" >     - Depreciation + Net Factor Income from Abroad (NFIA) - Net    Indirect Taxes</p>", "option2": "  <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795015811587_html_913a1fd10d5f430d.gif\" >     + Depreciation - NFIA + Net Indirect Taxes</p>", "option3": "  <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795015811587_html_913a1fd10d5f430d.gif\" >     - Depreciation - NFIA + Subsidies</p>", "option4": "  <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795015811587_html_913a1fd10d5f430d.gif\" >     - Direct Taxes + NFIA - Depreciation</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Three standard identities bridge macroeconomic aggregates:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Net = Gross}    - Depreciation (Consumption of Fixed Capital)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">National =    Domestic + NFIA</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Factor Cost =    Market Price - Net Indirect Taxes (NIT), where NIT = Indirect    Taxes - Subsidies.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)</b>:    Correct formula yielding NNPFC (National Income).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b, c, d)</b>:    Incorrect signs or inclusion of direct taxes.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u><b>Important    Points:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Per Capita    Income</b> ={ National Income (NNPFC)} / (Total Mid-Year    Population).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Personal    Disposable Income (PDI)</b> = Personal Income - Personal Direct    Taxes - Miscellaneous Fees/Fines paid to Government.</p>    <p style=\"orphans:0;widows:0\"><b>GDP Deflator</b> = (Nominal    GDP) / (Real GDP) * 100 (measures comprehensive price inflation    across all domestically produced goods and services).</p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    <b>Which public finance concept refers to the phenomenon where    high government borrowing in the domestic bond market drives up    market interest rates, thereby reducing or displacing    private-sector capital investment?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Crowding Out Effect</p>", "option2": " <p style=\"orphans:0;widows:0\">    Pump Priming</p>", "option3": " <p style=\"orphans:0;widows:0\">    Fiscal Drag</p>", "option4": " <p style=\"orphans:0;widows:0\">    Helicopter Money</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    When a government runs a large <b>Fiscal Deficit</b> and borrows    heavily from domestic financial markets, demand for loanable funds    rises, pushing up bond yields and lending rates. Higher borrowing    costs make capital projects unprofitable for private corporations,    \"crowding out\" private investment.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)    Crowding Out Effect</b>: Correct. Inverse relationship between    heavy sovereign borrowing and private capital expenditure via    interest rate spikes.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) Pump    Priming</b>: Targeted initial government spending during a    recession designed to stimulate private demand and kickstart    self-sustaining economic recovery.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c) Fiscal    Drag</b>: Automatic restraint on aggregate demand when nominal    income growth pushes taxpayers into higher progressive income tax    brackets without real purchasing power gains.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d)    Helicopter Money</b>: Unconventional monetary policy (coined by    <b>Milton Friedman</b>) involving direct distribution of newly    printed money to citizens to boost spending.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u><b>Important    Points:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Fiscal    Deficit</b> =Total Expenditure - Total Non-Debt Receipts (Revenue    Receipts + Recovery of Loans + Disinvestment Receipts).</p>    <p style=\"orphans:0;widows:0\"><b>Primary Deficit</b> = Fiscal    Deficit - Interest Payments (shows borrowing required strictly for    current-year expenses excluding past debt interest).</p>", "question_heading": ""}, {"sr_no": 14, "question": "Wुधn ो ृधों यी हnूियोनप्रधक िigुप iौ inciकधnप यn ो पनोnौूोनधnप gिोौौ ौिोृ ोप ो ौूधciीic ोngिध ाnयथn ोौ Bनधथौपधनैौ Angिध ( ), पुध नधीिधcपधक िigुप ृधcयंधौ cयंूिधपिधद ूिोnध-ूियोनप्रधक. Wुोप iौ पुध gधयंधपनic निधोपiयnौुiू ृधपथधधn पुध नधीिधcपधक नोद ोnक पुध नधीनोcपधक नोद ोप Bनधथौपधनैौ Angिध?", "option1": " <p style=\"orphans:0;widows:0\">    They are parallel to each other (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795015811587_html_96cbc0ded676e686.gif\" > )</p>", "option2": "  <p style=\"orphans:0;widows:0\">    They are perpendicular to each other (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795015811587_html_c97b8c76882e36f9.gif\" > )</p>", "option3": "  <p style=\"orphans:0;widows:0\">    They form an acute angle of     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795015811587_html_9e344f90df0d2ff0.gif\" > </p>", "option4": "  <p style=\"orphans:0;widows:0\">    They travel in completely opposite directions (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795015811587_html_3e1816f4c0d06552.gif\" > )</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Discovered by Sir David Brewster, when unpolarized light strikes a    dielectric interface at angle θB such that tanθB = μ    (refractive index of the medium), the reflected ray and refracted    ray meet at <b>90</b>°. Consequently, oscillating electrons in    the medium cannot radiate light polarized parallel to the plane of    incidence along the reflected direction, leaving the reflected    beam 100% plane-polarized perpendicular to the plane of incidence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a, c, d)</b>:    Incorrect geometric angles.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b)</b>:    Correct. Reflected ray ⊥ Refracted ray (θB + r = 90°).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u><b>Important    Points:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Polarization</b>    is a phenomenon exhibited <b>exclusively by transverse waves</b>    (such as electromagnetic/light waves); <b>longitudinal waves</b>    (such as sound waves in air) <b>cannot be polarized</b>.</p>    <p style=\"orphans:0;widows:0\"><b>Malus's Law</b>: When    completely plane-polarized light passes through an analyzer,    transmitted intensity varies as I = I₀ cos² θ.</p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0\">    <b>Which synthetic polymer, discovered accidentally by Roy    Plunkett in 1938 and chemically known as Polytetrafluoroethylene    (PTFE), possesses extraordinary thermal stability, chemical    inertness, and an ultra-low coefficient of friction, making it    ideal for non-stick cookware coatings?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Teflon</p>", "option2": " <p style=\"orphans:0;widows:0\">    Bakelite</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kevlar</p>", "option4": " <p style=\"orphans:0;widows:0\">    Melamine</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Strong <b>carbon–fluorine (C–F) bonds</b> in <b>PTFE (Teflon)</b>    resist attack by concentrated acids, alkalis, and organic solvents    while withstanding temperatures above 260° C without sticking to    food surfaces.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) Teflon</b>:    Correct. Thermoplastic fluoropolymer (<b>PTFE</b>) used in    non-stick cookware, plumber's tape, and corrosion-proof chemical    linings.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b)    Bakelite</b>: First synthetic <b>thermosetting plastic</b>    (phenol-formaldehyde resin, invented by Leo Baekeland); used for    electrical switches and utensil handles.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c) Kevlar</b>:    High-strength para-aramid synthetic fiber (invented by Stephanie    Kwolek) used in <b>bulletproof vests</b> and aerospace armor.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d)    Melamine</b>: Hard, heat-resistant thermosetting polymer used in    unbreakable crockery and kitchenware.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Important    Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Thermoplastics</b>    (Polythene, PVC, Polystyrene, Teflon) soften on heating and harden    on cooling repeatedly.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Thermosetting    Plastics</b> (Bakelite, Melamine) undergo irreversible    cross-linking upon molding and cannot be remelted.</p>    <p style=\"orphans:0;widows:0\"><b>Nylon-6,6</b> was the world's    first fully synthetic polyamide fiber made from <b>adipic acid</b>    and <b>hexamethylenediamine</b>.</p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    <b>In human digestion and biochemistry, which enzyme secreted in    pancreatic juice as an inactive proenzyme (trypsinogen) is    activated in the duodenum by the intestinal brush-border enzyme    enterokinase to hydrolyze proteins into peptones and peptides?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Pepsin</p>", "option2": " <p style=\"orphans:0;widows:0\">    Lipase</p>", "option3": " <p style=\"orphans:0;widows:0\">    Amylase</p>", "option4": " <p style=\"orphans:0;widows:0\">    Trypsin</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Pancreatic proteases are secreted as inactive zymogens to prevent    autodigestion of the pancreas itself. Once in the duodenum,    <b>enterokinase</b> cleaves trypsinogen into active <b>Trypsin</b>,    which in turn activates chymotrypsinogen and procarboxypeptidase    to complete protein digestion in an alkaline medium (pH 7.8–8.4).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option-wise    Analysis:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) Pepsin</b>:    Secreted as pepsinogen by gastric chief cells in the <b>stomach</b>;    activated by <b>Hydrochloric Acid (HCl)</b> and functions in a    strongly acidic medium (pH 1.5–2.0).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) Lipase</b>:    Emulsified fats (triglycerides) are hydrolyzed by pancreatic    lipase into fatty acids and glycerol with the aid of <b>Bile    salts</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c)    Amylase</b>: Hydrolyzes starch (carbohydrates) into maltose    (salivary amylase in mouth; pancreatic amylase in duodenum).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d) </b>    <b>Trypsin</b>: Correct. Pancreatic endopeptidase activated by    intestinal <b>enterokinase</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u><b>Important    Points:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Bile Juice</b>    is produced by the <b>liver</b> and stored/concentrated in the    <b>gallbladder</b>; it contains <b>no digestive enzymes</b>, but    bile salts emulsify fats and neutralize acidic chyme.</p>    <p style=\"orphans:0;widows:0\"><b>Rennin (Chymosin)</b> is a    proteolytic enzyme found in the gastric juice of <b>infants</b>    that helps digest milk protein (<b>casein</b>).</p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <b>Which iconic cave temple complex in Maharashtra, carved out of    basaltic Charanandri hills between the 6th and 10th centuries CE,    is world-famous for the monolithic Kailasa Temple (Cave 16)    excavated top-down from a single rock by Rashtrakuta King Krishna    I?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Ajanta Caves</p>", "option2": " <p style=\"orphans:0;widows:0\">    Ellora Caves</p>", "option3": " <p style=\"orphans:0;widows:0\">    Elephanta Caves</p>", "option4": " <p style=\"orphans:0;widows:0\">    Karla Caves</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Excavated under Kalachuri, Chalukya, and <b>Rashtrakuta</b>    patronage, <b>Ellora</b> showcases religious harmony with 12    Buddhist (Caves 1–12), 17 Hindu (Caves 13–29), and 5 Jain    (Caves 30–34, including <i>Indra Sabha</i>) caves. <b>Cave 16    (Kailasanatha Temple)</b> was carved vertically top-down from a    single basalt cliff by <b>Krishna I</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) Ajanta    Caves</b>: 29 exclusively <b>Buddhist</b> rock-cut caves (2nd    century BCE – 5th century CE) along the Waghora River, renowned    for Jatakas mural frescoes (patronized by Satavahanas and    Vakatakas).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) Ellora    Caves</b>: Correct. Tri-religious complex featuring the monolithic    Kailasa Temple; UNESCO World Heritage Site (1983).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c)    Elephanta Caves</b>: Located on Gharapuri Island in Mumbai    Harbour; famous for the colossal three-headed <b>Trimurti    Sadashiva</b> sculpture (UNESCO site, 1987).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d) Karla    Caves</b>: Ancient Hinayana Buddhist rock-cut complex near    Lonavala (Maharashtra) housing India's largest <b>Chaitya hall</b>    (prayer hall).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u><b>Important    Points:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Chaityas</b>    are Buddhist prayer halls containing a stupa at the apsidal end,    whereas <b>Viharas</b> are monastic residential dwellings for    monks.</p>    <p style=\"orphans:0;widows:0\"><b>Badami Cave Temples</b>    (Karnataka) were excavated by the <b>Early Chalukyas</b>    (Mangalesha) in the 6th century CE.</p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Match List-I (Traditional Indian Painting Style) with List-II    (Originating State / Region):</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>List-I:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A. Phad    Painting</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B.    Kalamkari (Srikalahasti &amp; Machilipatnam styles)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C.    Pattachitra</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>D. Warli    Painting</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>List-II:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. Odisha    &amp; West Bengal</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2.    Maharashtra</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3.    Rajasthan</b></p>    <p style=\"orphans:0;widows:0\"><b>4. Andhra Pradesh</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    A-3, B-1, C-4, D-2</p>", "option2": " <p style=\"orphans:0;widows:0\">    A-4, B-3, C-1, D-2</p>", "option3": " <p style=\"orphans:0;widows:0\">    A-3, B-4, C-1, D-2</p>", "option4": " <p style=\"orphans:0;widows:0\">    A-2, B-4, C-1, D-3</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Indigenous Indian scroll, textile, and tribal wall paintings    preserve folk epics, temple narratives, and nature worship using    organic mineral and vegetable pigments.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A. Phad    Painting (3)</b>: Religious scroll painting on cloth from    <b>Bhilwara, Rajasthan</b>, depicting heroic folk deities <b>Pabuji</b>    and <b>Devnarayan</b>, sung aloud by <i>Bhopa</i> priest-singers.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B.    Kalamkari (4)</b>: Hand-painted or block-printed cotton textile    art from <b>Andhra Pradesh</b> using a bamboo pen (<i>kalam</i>)    and natural tamarind/indigo dyes.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C.    Pattachitra (1)</b>: Traditional cloth-based scroll painting of    <b>Odisha</b> (Raghurajpur, centered on Lord Jagannath themes) and    <b>West Bengal</b> (Kalighat/Midnapore).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>D. Warli    Painting (2)</b>: Ancient tribal wall art of the <b>Warli tribe</b>    in <b>Maharashtra</b> (Palghar/Thane), using white rice paste on    red ochre mud walls with geometric circles, triangles, and    squares.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u><b>Important    Points:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Madhubani    (Mithila) Painting</b>: Folk painting from <b>Bihar</b>    characterized by double-line borders, no empty space, and natural    colors (Padma Shri laureate Sita Devi).</p>    <p style=\"orphans:0;widows:0\"><b>Thangka Painting</b>:    Traditional Tibetan Buddhist scroll painting on cotton/silk    practiced in <b>Sikkim, Ladakh, Himachal Pradesh, and Arunachal    Pradesh</b>.</p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding Coral Bleaching and    marine biodiversity hotspots:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. Coral    bleaching occurs when thermal stress or ocean acidification causes    coral polyps to expel their symbiotic photosynthetic algae    (Zooxanthellae), turning the coral skeleton white.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2. Coral    reefs thrive best in deep, cold, turbid waters below 200 meters    where sunlight penetration is minimal.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3. In    India, coral reef formations are naturally found in the Gulf of    Kutch, Gulf of Mannar, Lakshadweep Islands, and Andaman &amp;    Nicobar Islands.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the statements given    above are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Reef-building corals maintain a mutualistic relationship with    <b>Zooxanthellae</b>, which supply up to 90% of the coral's energy    via photosynthesis and impart vibrant colors. Elevated sea surface    temperatures break down this symbiosis, causing <b>coral    bleaching</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    1</b>: Correct. Expulsion of <i>Zooxanthellae</i> exposes the    white calcium carbonate (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795015811587_html_91a61daf8bba3cbd.gif\" > )    exoskeleton underneath.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2</b>: Incorrect. Corals require shallow (generally &lt; 50 m),    warm (20° C–32° C), clear, saline water for <i>Zooxanthellae</i>    to photosynthesize.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    3</b>: Correct. <b>Lakshadweep</b> consists of <b>Atolls</b>,    while <b>Gulf of Mannar, Gulf of Kutch, and Andaman &amp; Nicobar</b>    feature <b>Fringing and Barrier reefs</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b)</b>:    Correct combination of true statements. Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Coral reefs    are dubbed the <b>\"Rainforests of the Sea\"</b> because    they support ~25% of all marine species while covering less than    1% of the ocean floor.</p>    <p style=\"orphans:0;widows:0\">The <b>Great Barrier Reef</b> off    Queensland, Australia, is the world's largest coral reef system.</p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Match List-I (Classical / Traditional Indian Puppetry Form)    with List-II (Type &amp; Native State):</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>List-I:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A.    Kathputli</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B. Tholu    Bommalata</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C.    Pavakoothu</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>D. Yampuri</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>List-II:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. Glove    Puppetry – Kerala</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2. String    Puppetry – Rajasthan</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3. Rod    Puppetry – Bihar</b></p>    <p style=\"orphans:0;widows:0\"><b>4. Shadow Puppetry – Andhra    Pradesh</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    A-2, B-4, C-1, D-3</p>", "option2": " <p style=\"orphans:0;widows:0\">    A-4, B-2, C-1, D-3</p>", "option3": " <p style=\"orphans:0;widows:0\">    A-2, B-1, C-4, D-3</p>", "option4": " <p style=\"orphans:0;widows:0\">    A-3, B-4, C-1, D-2</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Indian traditional puppetry is categorized into four distinct    forms: String, Shadow, Glove, and Rod puppetry.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A.    Kathputli (2)</b>: Traditional <b>String Puppetry</b> of    <b>Rajasthan</b>, carved from mango wood without legs and draped    in bright Rajasthani attire.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B. Tholu    Bommalata (4)</b>: Traditional <b>Shadow Puppetry</b> of <b>Andhra    Pradesh</b>, featuring large translucent colored leather puppets    projected onto a screen.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C.    Pavakoothu (1)</b>: Traditional <b>Glove Puppetry</b> of <b>Kerala</b>,    heavily influenced by Kathakali costumes and headgear.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>D. Yampuri    (3)</b>: Traditional <b>Rod Puppetry</b> of <b>Bihar</b>, carved    from single pieces of wood without joints.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u><b>Important    Points:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Togalu    Gombeyatta</b> (Karnataka) and <b>Ravanachhaya</b> (Odisha) are    famous regional traditions of <b>Shadow Puppetry</b>.</p>    <p style=\"orphans:0;widows:0\"><b>Putul Nautch</b> is the    traditional <b>Rod Puppetry</b> form of <b>West Bengal</b>.</p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <b>Which international treaty adopted in 1971 in an Iranian city    on the Caspian Sea coast provides the global framework for the    conservation and wise use of wetlands and their resources, while    maintaining the Montreux Record for sites facing ecological    degradation?</b></p>", "option1": "<p style=\"orphans:0;widows:0\"
