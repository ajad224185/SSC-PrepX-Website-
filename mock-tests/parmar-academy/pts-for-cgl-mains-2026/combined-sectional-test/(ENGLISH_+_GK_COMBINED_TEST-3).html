>    Basel Convention</p>", "option2": " <p style=\"orphans:0;widows:0\">    Ramsar Convention</p>", "option3": " <p style=\"orphans:0;widows:0\">    Bonn Convention</p>", "option4": " <p style=\"orphans:0;widows:0\">    Stockholm Convention</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The <b>Ramsar Convention</b> is the oldest modern global    intergovernmental environmental treaty dedicated to conserving    wetlands of international importance. Sites experiencing adverse    ecological changes due to technological developments or pollution    are placed on the <b>Montreux Record</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) Basel    Convention (1989)</b>: Regulates transboundary movements of    <b>hazardous wastes</b> and their disposal.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) Ramsar    Convention (1971)</b>: Correct. World Wetlands Day is celebrated    annually on <b>February 2</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c) Bonn    Convention (CMS, 1979)</b>: Convention on the Conservation of    <b>Migratory Species</b> of Wild Animals.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d)    Stockholm Convention (2001)</b>: Global treaty to eliminate or    restrict <b>Persistent Organic Pollutants (POPs)</b> (\"Dirty    Dozen\").</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u><b>Important    Points:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Currently,    <b>only two Indian wetlands</b> are listed on the <b>Montreux    Record</b>: <b>Keoladeo National Park</b> (Rajasthan) and <b>Loktak    Lake</b> (Manipur). <b>Chilika Lake</b> (Odisha) was removed from    the Montreux Record in 2002 after successful restoration.</p>    <p style=\"orphans:0;widows:0\"><b>Tamil Nadu</b> has the highest    number of Ramsar sites among all Indian states.</p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Match List-I (Famous Book / Autobiography) with List-II    (Author):</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>List-I:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A. The    Argumentative Indian</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B. Waiting    for a Visa</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C. Wings    of Fire</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>D. Playing    It My Way</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>List-II:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. Dr.    B.R. Ambedkar</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2. Sachin    Tendulkar</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3. Amartya    Sen</b></p>    <p style=\"orphans:0;widows:0\"><b>4. Dr. A.P.J. Abdul Kalam</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    A-3, B-1, C-4, D-2</p>", "option2": " <p style=\"orphans:0;widows:0\">    A-1, B-3, C-4, D-2</p>", "option3": " <p style=\"orphans:0;widows:0\">    A-3, B-4, C-1, D-2</p>", "option4": " <p style=\"orphans:0;widows:0\">    A-2, B-1, C-4, D-3</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>A. The Argumentative Indian (3)</b>: Collection of essays on    Indian history, culture, and public reasoning written by Nobel    Laureate <b>Amartya Sen</b> (1998 Economics Nobel).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B. Waiting    for a Visa (1)</b>: Autobiographical notes written by <b>Dr. B.R.    Ambedkar</b> (1935–36) recounting his personal experiences with    untouchability.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C. Wings    of Fire (4)</b>: Autobiography of former President and \"Missile    Man of India\" <b>Dr. A.P.J. Abdul Kalam</b>, co-authored with    Arun Tiwari.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>D. Playing    It My Way (2)</b>: Autobiography of cricket legend and Bharat    Ratna laureate <b>Sachin Tendulkar</b> (co-authored with Boria    Majumdar).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u><b>Important    Points:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>An Era of    Darkness</b> and <b>Why I Am a Hindu</b> were authored by <b>Shashi    Tharoor</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>The    Discovery of India</b> (written in Ahmednagar Fort Jail, 1944) and    <b>Glimpses of World History</b> were authored by <b>Jawaharlal    Nehru</b>.</p>    <p style=\"orphans:0;widows:0\"><b>The Test of My Life</b> is the    autobiography of cricketer <b>Yuvraj Singh</b>, while <b>A Century    Is Not Enough</b> is authored by <b>Sourav Ganguly</b>.</p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Indian state launched the </b><b>Mukhyamantri Maiya    Samman Yojana</b><b>, a flagship direct benefit transfer (DBT)    women's welfare scheme providing monthly financial assistance of    ₹2,500 (enhanced from ₹1,000) to eligible women aged 18 to 50    years?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Chhattisgarh</p>", "option2": " <p style=\"orphans:0;widows:0\">    Jharkhand</p>", "option3": " <p style=\"orphans:0;widows:0\">    Madhya Pradesh</p>", "option4": " <p style=\"orphans:0;widows:0\">    Odisha</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Jharkhand</b> launched the <b>Mukhyamantri Maiya Samman Yojana</b>    to provide direct monthly financial assistance to women aged 18–50    years from economically weaker sections. Explanation: Administered    by the <b>Department of Women, Child Development &amp; Social    Security, Government of Jharkhand</b>, the scheme transfers    monthly assistance directly into Aadhaar-linked bank accounts of    eligible women to support household nutrition, healthcare, and    economic autonomy.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)    Chhattisgarh</b>: Implements the <b>Mahtari Vandan Yojana</b>    (providing ₹1,000/month to married women).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b)    Jharkhand</b>: Correct. Implements the <b>Mukhyamantri Maiya    Samman Yojana</b> (covering women aged 18–50 years).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c) Madhya    Pradesh</b>: Implements the <b>Mukhyamantri Ladli Behna Yojana</b>    (providing ₹1,250/month to eligible women).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d) Odisha</b>:    Implements the <b>Subhadra Yojana</b> (providing ₹10,000    annually in two installments of ₹5,000 each to women aged 21–60    years).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Important    Points:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Majhi    Ladki Bahin Yojana</b> is implemented by <b>Maharashtra</b>    (₹1,500/month for eligible women aged 21–65).</p>    <p style=\"orphans:0;widows:0\"><b>Gruha Lakshmi Scheme</b> is    implemented by <b>Karnataka</b> (₹2,000/month to female heads of    households).</p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Match List-I (Traditional Folk Dance / Festival) with List-II    (Associated Indian State):</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>List-I:    List-II: </b>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A.    Hojagiri Dance, 1. Uttarakhand,</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B.    Bathukamma Festival, 2. Tripura,</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C.    Nongkrem Dance Festival, 3. Telangana</b></p>    <p style=\"orphans:0;widows:0\"><b>D. Chholiya Dance 4.    Meghalaya.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    a) A-2, B-3, C-4, D-1</p>", "option2": " <p style=\"orphans:0;widows:0\">    b) A-3, B-2, C-4, D-1</p>", "option3": " <p style=\"orphans:0;widows:0\">    c) A-2, B-4, C-3, D-1</p>", "option4": " <p style=\"orphans:0;widows:0\">    d) A-1, B-3, C-4, D-2</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Each traditional folk dance and regional festival embodies the    indigenous tribal customs, seasonal agricultural cycles, or    martial heritage of its native Indian state.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A.    Hojagiri Dance (2)</b>: Performed by women of the <b>Reang (Bru)    tribe</b> in <b>Tripura</b> during Lakshmi Puja / Hojagiri    festival, balancing earthen pitchers and bottles on their heads    while standing on an inverted earthen pot.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B.    Bathukamma Festival (3)</b>: Iconic floral festival of <b>Telangana</b>    celebrated by women over nine days during Durga Navratri,    arranging seasonal flowers in seven concentric temple-like tiers    (<i>Gopuram</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C.    Nongkrem Dance Festival (4)</b>: Five-day annual religious and    harvest thanksgiving festival of the <b>Khasi tribe</b> held at    Smit near Shillong in <b>Meghalaya</b>, featuring <i>Ka Shad    Nongkrem</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>D.    Chholiya Dance (1)</b>: Traditional martial sword-and-shield folk    dance of the <b>Kumaon region of Uttarakhand</b>, performed during    Rajput wedding processions (<i>Baraat</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><u><b>Important    Points:</b></u></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Cheraw    (Bamboo Dance)</b> is the famous traditional folk dance of    <b>Mizoram</b>, performed by stepping rhythmically between    horizontally clapped bamboo staves.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Bonalu</b>    is another major state festival of <b>Telangana</b> dedicated to    Goddess Mahakali, alongside the biennial tribal <b>Sammakka    Saralamma Jatara (Medaram Jatara)</b>.</p>    <p style=\"orphans:0;widows:0\"><b>Garia Puja</b> and <b>Kharchi    Puja</b> (worship of 14 deities) are major traditional festivals    celebrated in <b>Tripura</b>.</p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <b>Which veteran Indian violinist and Padma Shri/Padma Bhushan    awardee from Uttar Pradesh, celebrated as the pioneer of the    Gayaki Ang (vocal style) on the violin in Hindustani classical    music, was conferred the prestigious Padma Vibhushan in the 2026    Padma Awards?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Dr. N. Rajam</p>", "option2": " <p style=\"orphans:0;widows:0\">    L. Subramaniam</p>", "option3": " <p style=\"orphans:0;widows:0\">    T.N. Krishnan</p>", "option4": " <p style=\"orphans:0;widows:0\">    Kala Ramnath</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Announced on the eve of Republic Day (January 25, 2026), the <b>Padma    Vibhushan 2026</b> honored five distinguished personalities across    Art, Public Affairs, and Literature &amp; Education. <b>Dr. N.    Rajam</b>, trained under Pandit Omkarnath Thakur, revolutionized    Hindustani violin by adapting vocal <i>Khayal</i> nuances (<i>Gayaki    Ang</i>) to the instrument.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) Dr. N.    Rajam</b>: Correct. Recipient of <b>Padma Vibhushan 2026</b> in    the field of Art (Uttar Pradesh).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) L.    Subramaniam</b>: Renowned Carnatic and fusion violinist; received    Padma Bhushan in 2001.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c) T.N.    Krishnan</b>: Legendary Carnatic violinist (part of the Carnatic    violin trinity with Lalgudi Jayaraman and M.S. Gopalakrishnan);    received Padma Vibhushan in 1992.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d) Kala    Ramnath</b>: Noted Hindustani violinist and niece/disciple of Dr.    N. Rajam; Sangeet Natak Akademi awardee.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Important    Points:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>All Five    Padma Vibhushan 2026 Awardees</b>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Dharmendra    Singh Deol</b> (Posthumous) – Art (Maharashtra)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>K.T.    Thomas</b> – Public Affairs (Kerala)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Dr. N.    Rajam</b> – Art (Uttar Pradesh)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>P.    Narayanan</b> – Literature and Education (Kerala)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>V.S.    Achuthanandhan</b> (Posthumous) – Public Affairs (Kerala)</p>    <p style=\"orphans:0;widows:0\"><b>Padma Awards</b> were    instituted in <b>1954</b> and are conferred annually by the    President of India at Rashtrapati Bhavan across three tiers: Padma    Vibhushan, Padma Bhushan, and Padma Shri.</p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, some of the words in the passage have    been left out. Read the passage carefully and choose the correct    word for each blank, out of the four alternatives and fill in the    blanks.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">After lagging    consistently ________ (1) global peers for a major part of the    year, domestic industrial growth has ________ (2) somewhat over    the last quarter. Output has expanded by almost 6% from its lowest    levels ________ (3) in March. Even with this recent resurgence,    overall manufacturing is still below the targets set earlier in    the year. The factory output has been closely ________ (4) to    domestic power supply stability. This makes sense, as thermal    generation accounts for more than 70% of total energy consumption.    Industrial activity stalled when severe coal shortages struck    earlier this year, an issue that persisted until mid-April. Since    then, as coal supplies have improved, industrial production has    ________ (5) across major manufacturing hubs.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">What should come in blank (1) ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    toward</p>", "option2": " <p style=\"orphans:0;widows:0\">    along</p>", "option3": " <p style=\"orphans:0;widows:0\">    into</p>", "option4": " <p style=\"orphans:0;widows:0\">    behind</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The phrasal verb 'lag behind' means to move or develop more slowly    than others. Thus, 'behind' is the most appropriate preposition to    complete blank (1).</p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, some of the words in the passage have    been left out. Read the passage carefully and choose the correct    word for each blank, out of the four alternatives and fill in the    blanks.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">After lagging    consistently ________ (1) global peers for a major part of the    year, domestic industrial growth has ________ (2) somewhat over    the last quarter. Output has expanded by almost 6% from its lowest    levels ________ (3) in March. Even with this recent resurgence,    overall manufacturing is still below the targets set earlier in    the year. The factory output has been closely ________ (4) to    domestic power supply stability. This makes sense, as thermal    generation accounts for more than 70% of total energy consumption.    Industrial activity stalled when severe coal shortages struck    earlier this year, an issue that persisted until mid-April. Since    then, as coal supplies have improved, industrial production has    ________ (5) across major manufacturing hubs.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">What should come in blank (2) ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    hollow</p>", "option2": " <p style=\"orphans:0;widows:0\">    aspect</p>", "option3": " <p style=\"orphans:0;widows:0\">    praise</p>", "option4": " <p style=\"orphans:0;widows:0\">    rebounded</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage describes a recovery in growth following a period of    decline. The verb 'rebounded' correctly fits the present perfect    construction ('has rebounded') and means recovered or bounced    back.</p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, some of the words in the passage have    been left out. Read the passage carefully and choose the correct    word for each blank, out of the four alternatives and fill in the    blanks.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">After lagging    consistently ________ (1) global peers for a major part of the    year, domestic industrial growth has ________ (2) somewhat over    the last quarter. Output has expanded by almost 6% from its lowest    levels ________ (3) in March. Even with this recent resurgence,    overall manufacturing is still below the targets set earlier in    the year. The factory output has been closely ________ (4) to    domestic power supply stability. This makes sense, as thermal    generation accounts for more than 70% of total energy consumption.    Industrial activity stalled when severe coal shortages struck    earlier this year, an issue that persisted until mid-April. Since    then, as coal supplies have improved, industrial production has    ________ (5) across major manufacturing hubs.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">What should come in blank (3) ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    recorded</p>", "option2": " <p style=\"orphans:0;widows:0\">    beyond</p>", "option3": " <p style=\"orphans:0;widows:0\">    display</p>", "option4": " <p style=\"orphans:0;widows:0\">    deliver</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The past participle 'recorded' appropriately modifies 'levels',    indicating the statistical low points observed in March.</p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, some of the words in the passage have    been left out. Read the passage carefully and choose the correct    word for each blank, out of the four alternatives and fill in the    blanks.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">After lagging    consistently ________ (1) global peers for a major part of the    year, domestic industrial growth has ________ (2) somewhat over    the last quarter. Output has expanded by almost 6% from its lowest    levels ________ (3) in March. Even with this recent resurgence,    overall manufacturing is still below the targets set earlier in    the year. The factory output has been closely ________ (4) to    domestic power supply stability. This makes sense, as thermal    generation accounts for more than 70% of total energy consumption.    Industrial activity stalled when severe coal shortages struck    earlier this year, an issue that persisted until mid-April. Since    then, as coal supplies have improved, industrial production has    ________ (5) across major manufacturing hubs.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">What should come in blank (4) ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    politely</p>", "option2": " <p style=\"orphans:0;widows:0\">    formally</p>", "option3": " <p style=\"orphans:0;widows:0\">    linked</p>", "option4": " <p style=\"orphans:0;widows:0\">    loosely</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passive construction 'has been closely ______ to' requires a    past participle indicating connection or association. 'Linked' is    the correct choice, indicating that factory output depends on    power supply stability.</p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, some of the words in the passage have    been left out. Read the passage carefully and choose the correct    word for each blank, out of the four alternatives and fill in the    blanks.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">After lagging    consistently ________ (1) global peers for a major part of the    year, domestic industrial growth has ________ (2) somewhat over    the last quarter. Output has expanded by almost 6% from its lowest    levels ________ (3) in March. Even with this recent resurgence,    overall manufacturing is still below the targets set earlier in    the year. The factory output has been closely ________ (4) to    domestic power supply stability. This makes sense, as thermal    generation accounts for more than 70% of total energy consumption.    Industrial activity stalled when severe coal shortages struck    earlier this year, an issue that persisted until mid-April. Since    then, as coal supplies have improved, industrial production has    ________ (5) across major manufacturing hubs.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">What should come in blank (5) ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    accelerated</p>", "option2": " <p style=\"orphans:0;widows:0\">    concluding</p>", "option3": " <p style=\"orphans:0;widows:0\">    sequence</p>", "option4": " <p style=\"orphans:0;widows:0\">    balance</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In the present perfect tense ('has ______'), a past participle is    needed. 'Accelerated' means sped up or increased in pace, which    fits the context of production picking up after coal shortages    eased.</p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The following sentence has been divided into four parts. Identify    the part which contains a grammatical error.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">If there is    no error in the sentence, then select 'No Error'.</p>    <p style=\"orphans:0;widows:0\">The charity drive has collected    more (A) two million dollars (B) to provide clean drinking water    (C) to remote villages (D).</p>", "option1": "<p style=\"orphans:0;widows:0\">    B</p>", "option2": " <p style=\"orphans:0;widows:0\">    A</p>", "option3": " <p style=\"orphans:0;widows:0\">    D</p>", "option4": " <p style=\"orphans:0;widows:0\">    C</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The error lies in part (A) of the sentence. The prepositional    comparative phrase 'more than' must be used before a numerical    amount to mean 'greater than'. Using just 'more' before a number    without 'than' is grammatically incorrect. Hence, 'more' should be    replaced with 'more than'.</p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Given below are four jumbled parts of a sentence. Select the    option that gives their correct order.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A) across    several emerging economies</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B) has played    a crucial role in improving</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C) the rapid    expansion of public healthcare infrastructure</p>    <p style=\"orphans:0;widows:0\">D) life expectancy rates among    vulnerable populations</p>", "option1": "<p style=\"orphans:0;widows:0\">    CABD</p>", "option2": " <p style=\"orphans:0;widows:0\">    CBAD</p>", "option3": " <p style=\"orphans:0;widows:0\">    ACBD</p>", "option4": " <p style=\"orphans:0;widows:0\">    BCDA</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct order is <b>CABD</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>C</b>    serves as the subject noun phrase: <i>'the rapid expansion of    public healthcare infrastructure'</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>A</b>    acts as the prepositional phrase specifying the location of this    expansion: <i>'across several emerging economies'</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. <b>B</b>    introduces the main predicate/verb phrase: <i>'has played a    crucial role in improving'</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. <b>D</b>    supplies the object of the preposition 'improving': <i>'life    expectancy rates among vulnerable populations'</i>.</p>    <p style=\"orphans:0;widows:0\">When combined, the sentence reads    meaningfully: <i>\"The rapid expansion of public healthcare    infrastructure across several emerging economies has played a    crucial role in improving life expectancy rates among vulnerable    populations.\"</i></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct passive form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The municipal corporation    demolished several illegal structures along the highway. Even the    old boundary wall has been pulled down.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Several illegal structures along the highway had been demolished    by the municipal corporation. Even the old boundary wall had been    pulled down.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Several illegal structures along the highway were demolished by    the municipal corporation. Even the old boundary wall has been    pulled down.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Several illegal structures along the highway have been demolished    by the municipal corporation. Even the old boundary wall was    pulled down.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The municipal corporation, being demolished several illegal    structures along the highway, also pulled down the old boundary    wall.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence contains two parts: the first part is in the    Simple Past tense (Active Voice), and the second part is already    in the Present Perfect tense (Passive Voice).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Rule for    Simple Past Active to Passive: <b>Object + was/were + V3 + by +    Subject</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- In the    first sentence, the object 'several illegal structures along the    highway' is plural, so it takes 'were demolished'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- The second    sentence ('Even the old boundary wall has been pulled down.') is    already in the passive voice, so it remains unchanged.</p>    <p style=\"orphans:0;widows:0\">Combining both correctly yields:    'Several illegal structures along the highway were demolished by    the municipal corporation. Even the old boundary wall has been    pulled down.' Hence, option B is correct.</p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Given below are four jumbled sentences. Select the option that    gives their correct order.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A. Yet, Costa    Rica presents a remarkable contrast, dedicating over a quarter of    its land area to national parks and reserves.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B. Rapid    urban development across the globe has severely threatened natural    habitats.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C. Such    uncontrolled expansion often reduces vast forests into small,    fragmented green zones.</p>    <p style=\"orphans:0;widows:0\">D. In these protected havens,    rich biodiversity continues to flourish without the fear of    encroachment.</p>", "option1": "<p style=\"orphans:0;widows:0\">    BCAD</p>", "option2": " <p style=\"orphans:0;widows:0\">    BCDA</p>", "option3": " <p style=\"orphans:0;widows:0\">    CBAD</p>", "option4": " <p style=\"orphans:0;widows:0\">    ACDB</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct logical order is <b>BCAD</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Sentence <b>B</b>    introduces the general topic and the overarching issue: the threat    posed to natural habitats by rapid urban development.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Sentence <b>C</b>    follows <b>B</b> directly because \"Such uncontrolled    expansion\" refers back to the \"rapid urban development\"    mentioned in B, explaining its negative impact.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Sentence <b>A</b>    introduces an exception using the contrast marker \"Yet\",    presenting Costa Rica as a nation that has preserved its land.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Sentence <b>D</b>    concludes the paragraph by describing what happens \"In these    protected havens\", directly linking back to the \"national    parks and reserves\" introduced in sentence A.</p>    <p style=\"orphans:0;widows:0\">Therefore, the sequence <b>BCAD</b>    forms a coherent paragraph.</p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate antonym of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Gregarious</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Sociable</p>", "option2": " <p style=\"orphans:0;widows:0\">    Affable</p>", "option3": " <p style=\"orphans:0;widows:0\">    Reclusive</p>", "option4": " <p style=\"orphans:0;widows:0\">    Amicable</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>'Gregarious'</b> means fond of company; sociable and    outgoing.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>'Reclusive'</b>    means avoiding the company of other people; solitary. Thus, it is    the exact antonym.</p>    <p style=\"orphans:0;widows:0\">- <b>'Sociable'</b>, <b>'Affable'</b>,    and <b>'Amicable'</b> are synonyms or closely related in meaning    to being friendly and social.</p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, out of the four alternatives, choose    the one which best expresses the meaning of the given idiom.</p>    <p style=\"orphans:0;widows:0\"><b>Tilt at windmills</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    To fight imaginary enemies or pursue impractical and futile goals</p>", "option2": " <p style=\"orphans:0;widows:0\">    To adopt innovative and sustainable methods for modern industries</p>", "option3": " <p style=\"orphans:0;widows:0\">    To confront a powerful adversary with courage and determination</p>", "option4": " <p style=\"orphans:0;widows:0\">    To instigate unnecessary hostility among peaceful neighbors</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The idiom <b>'tilt at windmills'</b> originates from Miguel de    Cervantes' novel <i>Don Quixote</i>, where the protagonist attacks    windmills believing them to be giants. It means to fight against    imaginary enemies or engage in futile, hopelessly impractical    pursuits. Hence, option A is the correct answer.</p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct direct form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The inspector asked the guard    whether he had seen anyone suspicious near the premises the    previous night.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The inspector said to the guard, \"Had you seen anyone    suspicious near the premises last night?\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    The inspector said to the guard, \"Have you seen anyone    suspicious near the premises the previous night?\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    The inspector said to the guard, \"Did you see anyone    suspicious near the premises last night?\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    The inspector said to the guard, \"Did you see anyone    suspicious near the premises the previous night?\"</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the indirect speech into direct speech, we follow these    rules:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    reporting verb <b>asked</b> is replaced by <b>said to</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. The    conjunction <b>whether</b> is removed and replaced by question    word order with inverted auxiliary verb.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. The past    perfect tense (<b>had seen</b>) accompanied by a definite past    time expression corresponds to the simple past tense (<b>Did you    see</b>) in direct speech.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. The time    expression <b>the previous night</b> changes back to <b>last    night</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">5. The    pronoun <b>he</b> changes to the second-person pronoun <b>you</b>.</p>    <p style=\"orphans:0;widows:0\">Hence, option C is the correct    direct form.</p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate synonym of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>SPURIOUS</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Apocryphal</p>", "option2": " <p style=\"orphans:0;widows:0\">    Veritable</p>", "option3": " <p style=\"orphans:0;widows:0\">    Authentic</p>", "option4": " <p style=\"orphans:0;widows:0\">    Legitimate</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>'Spurious'</b> means not being what it purports to be;    false, fake, or of doubtful origin.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>'Apocryphal'</b>    refers to something of doubtful authenticity or spurious nature,    making it the most appropriate synonym.</p>    <p style=\"orphans:0;widows:0\">The other options—<i>Veritable</i>    (true, real), <i>Authentic</i> (genuine), and <i>Legitimate</i>    (valid, genuine)—are antonyms of the given word.</p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to substitute the underlined    segment in the given sentence. If there is no need to substitute    it, select 'No substitution required'.</p>    <p style=\"orphans:0;widows:0\">The enterprise must overhaul its    manufacturing process <u>if it will remain</u> viable in the    international market.</p>", "option1": "<p style=\"orphans:0;widows:0\">    if it would remain</p>", "option2": " <p style=\"orphans:0;widows:0\">    if it is to remain</p>", "option3": " <p style=\"orphans:0;widows:0\">    if it will be remaining</p>", "option4": " <p style=\"orphans:0;widows:0\">    No substitution required</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>if it is to remain</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In English    grammar, the modal auxiliary 'will' is generally avoided in    conditional 'if-clauses'. When the clause expresses a    prerequisite, purpose, or intended goal (meaning 'if the    intention/requirement is to...'), the formal construction <b>'if +    subject + is/are/am + to-infinitive'</b> is used.</p>    <p style=\"orphans:0;widows:0\">Hence, <i>'if it will remain'</i>    should be replaced with <i>'if it is to remain'</i>.</p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0\">    Select the incorrectly spelt word out of the given alternatives.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Connoisseur</p>", "option2": " <p style=\"orphans:0;widows:0\">    Desiccate</p>", "option3": " <p style=\"orphans:0;widows:0\">    Geneology</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sacrilegious</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The incorrectly spelt word is <b>Geneology</b>. The correct    spelling is <b>Genealogy</b>, which means the study of families,    lineage, and ancestry. It is a common error to spell it with    '-ology' (like biology or geology), but it correctly ends in    '-alogy'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the correctly spelt words:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">•    <b>Connoisseur</b>: an expert judge in matters of taste or the    fine arts.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">•    <b>Desiccate</b>: to dry up thoroughly or remove all moisture.</p>    <p style=\"orphans:0;widows:0\">• <b>Sacrilegious</b>:    violating or treating with disrespect what is regarded as sacred.</p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to substitute the underlined    segment in the given sentence. If there is no need to substitute    it, select 'No substitution required'.</p>    <p style=\"orphans:0;widows:0\">The elderly scholar sat <u>besides    the dusty cabinet, beside which was stacked</u> several rare    manuscripts.</p>", "option1": "<p style=\"orphans:0;widows:0\">    beside the dusty cabinet, beside which was stacked</p>", "option2": " <p style=\"orphans:0;widows:0\">    beside the dusty cabinet, beside which were stacked</p>", "option3": " <p style=\"orphans:0;widows:0\">    besides the dusty cabinet, beside which were stacked</p>", "option4": " <p style=\"orphans:0;widows:0\">    No substitution required</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>beside the dusty cabinet, beside which    were stacked</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">There are two    errors in the underlined segment:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Preposition    error:</b> 'Beside' means 'at the side of' or 'next to', whereas    'besides' means 'in addition to' or 'apart from'. Since the    sentence refers to sitting next to the cabinet (physical    position), <b>beside</b> must be used instead of <b>besides</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Subject-verb    agreement in inverted word order:</b> In the relative clause    <i>\"beside which was stacked several rare manuscripts\"</i>,    the prepositional phrase is fronted, causing subject-verb    inversion. The true grammatical subject is the plural noun phrase    <b>several rare manuscripts</b>, which requires the plural    auxiliary verb <b>were</b> rather than the singular <b>was</b>.</p>    <p style=\"orphans:0;widows:0\">Hence, the correct segment is    <i>\"beside the dusty cabinet, beside which were stacked\"</i>.</p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words.</p>    <p style=\"orphans:0;widows:0\">An extreme and irrational fear of    growing old or aging</p>", "option1": "<p style=\"orphans:0;widows:0\">    Chronophobia</p>", "option2": " <p style=\"orphans:0;widows:0\">    Thanatophobia</p>", "option3": " <p style=\"orphans:0;widows:0\">    Gerascophobia</p>", "option4": " <p style=\"orphans:0;widows:0\">    Gerontophobia</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitute is <b>Gerascophobia</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Gerascophobia:</b>    An irrational and persistent fear of growing old or aging (derived    from the Greek 'geras' meaning old age and 'phobos' meaning fear).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Chronophobia:</b>    An irrational fear of time and the passage of time.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Thanatophobia:</b>    An intense or irrational fear of death or dying.</p>    <p style=\"orphans:0;widows:0\"><b>Gerontophobia:</b> An abnormal    fear or dislike of elderly people.</p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0\">    Select the correctly spelt word out of the four alternatives.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Surveilance</p>", "option2": " <p style=\"orphans:0;widows:0\">    Survaillance</p>", "option3": " <p style=\"orphans:0;widows:0\">    Surveillance</p>", "option4": " <p style=\"orphans:0;widows:0\">    Surveillence</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The correctly spelt word is <b>Surveillance</b>, which means close    observation, especially of a suspected spy or criminal.</p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Even in the face of imminent    defeat, the commander maintained an ________ calm that inspired    his weary troops to hold the line.</p>", "option1": "<p style=\"orphans:0;widows:0\">    ephemeral</p>", "option2": " <p style=\"orphans:0;widows:0\">    irascible</p>", "option3": " <p style=\"orphans:0;widows:0\">    imperturbable</p>", "option4": " <p style=\"orphans:0;widows:0\">    ostentatious</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct word is <b>imperturbable</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Imperturbable</b>    means unable to be upset or excited; calm and composed even in    difficult situations. The sentence describes a commander who    remained completely calm and composed despite the threat of    defeat, inspiring his soldiers.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Ephemeral:</b>    lasting for a very short time; fleeting.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Irascible:</b>    having or showing a tendency to be easily angered; irritable.</p>    <p style=\"orphans:0;widows:0\"><b>Ostentatious:</b>    characterized by pretentious or showy display designed to impress.</p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct indirect form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">“Do you really think you can    manage the business better than your uncle?” scoffed his aunt.</p>", "option1": "<p style=\"orphans:0;widows:0\">    His aunt scoffed that did he really think he could manage the    business better than his uncle.</p>", "option2": " <p style=\"orphans:0;widows:0\">    His aunt scoffed and asked if he really thought he could manage    the business better than his uncle.</p>", "option3": " <p style=\"orphans:0;widows:0\">    His aunt scoffed and asked whether he really thinks he can manage    the business better than his uncle.</p>", "option4": " <p style=\"orphans:0;widows:0\">    His aunt scoffed and asked if had he really thought he could    manage the business better than his uncle.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the given direct interrogative sentence into indirect    speech, follow these rules:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    reporting verb 'scoffed' introduces a question, so it is changed    to 'scoffed and asked'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. For a    yes/no question starting with an auxiliary verb ('Do'), the    conjunction 'if' or 'whether' is used.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. The    sentence structure changes from interrogative to assertive    (subject comes before the verb).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Tenses    change from present to past: 'Do you really think' (simple    present) becomes 'he really thought' (simple past), and 'can    manage' becomes 'could manage'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">5. Pronouns    are updated: 'you' becomes 'he', and 'your' becomes 'his'.</p>    <p style=\"orphans:0;widows:0\">Therefore, option B is the    correct indirect form.</p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Choose the option that contains the homonym of the highlighted    word in the given sentence.</p>    <p style=\"orphans:0;widows:0\">The construction crew used a    massive <b>crane</b> to lift the heavy steel beams onto the    high-rise building.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The operator carefully maneuvered the hydraulic crane to avoid    hitting any overhead power lines.</p>", "option2": " <p style=\"orphans:0;widows:0\">    A tall white crane stood motionless in the shallow waters of the    marsh, searching for fish.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The site manager rented an additional mobile crane to speed up the    unloading process.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Before assembling the tower crane, engineers thoroughly inspected    the concrete foundation for safety.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    A <b>homonym</b> is a word that shares the same spelling and    pronunciation as another word but has a completely different    meaning.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In the given    sentence, <b>crane</b> refers to a large machine with a long arm    used for lifting and moving heavy weights.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In <b>Option    B</b>, <b>crane</b> refers to a tall, long-legged and long-necked    wading bird. Since it has the same spelling and pronunciation but    a distinct meaning, it is the homonym of the word in the sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In options A,    C, and D, <b>crane</b> is used in the identical sense of an    industrial lifting machine.</p>    <p style=\"orphans:0;widows:0\">Therefore, <b>Option B</b> is the    correct answer.</p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that gives the most appropriate meaning of the    given idiom.</p>    <p style=\"orphans:0;widows:0\"><b>To sow dragon's teeth</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    To face an insurmountable problem with resilience</p>", "option2": " <p style=\"orphans:0;widows:0\">    To take actions that incite future discord or conflict</p>", "option3": " <p style=\"orphans:0;widows:0\">    To harbor unrealistic ambitions of grandeur</p>", "option4": " <p style=\"orphans:0;widows:0\">    To defeat an enemy by turning their allies against them</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The idiom <b>'To sow dragon's teeth'</b> means to take steps or    act in a way that fosters future trouble, strife, or disastrous    conflict. The phrase originates from Greek mythology (the legends    of Cadmus and Jason), where teeth of a dragon sown into the soil    sprang up as fully armed warriors who immediately fought each    other. Hence, option B correctly expresses the meaning.</p>", "question_heading": ""}, {"sr_no": 48, "question": "Giॅधn ृिधयथ ोनध ीयहन ुहंृिधक ूोनपौ यी ो ौधnपधncध. Sिधधcप पुध यूपiयn पुोप giॅधौ पुधiन cयननधcप यनकधन. A) पय ौदnपुधौप्रध ॅोौप ोंयहnपौ यी हncहनोपधक कोपो B) पुध cहपपing-धकgध कiोgnयौपic ोिgयनiपुं कधंयnौपनोपधक C) ोn हnूनधcधकधnपधक ोृiिiपद nयप यnिद D) ृहप ोिसय पय iकधnपiीद ौहृिपध ूोपुिययgicोि ोnयंोिiधौ", "option1": "<p style=\"orphans:0;widows:0\">    BACD</p>", "option2": " <p style=\"orphans:0;widows:0\">    BCAD</p>", "option3": " <p style=\"orphans:0;widows:0\">    CBDA</p>", "option4": " <p style=\"orphans:0;widows:0\">    ADBC</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct order is <b>BCAD</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Part <b>B</b>    introduces the subject and the main transitive verb: <i>'the    cutting-edge diagnostic algorithm demonstrated'</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Part <b>C</b>    provides the direct object of the verb along with the first part    of the correlative conjunction: <i>'an unprecedented ability not    only'</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Part <b>A</b>    provides the first parallel infinitive phrase: <i>'to synthesize    vast amounts of uncurated data'</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Part <b>D</b>    completes the correlative pair with <i>'but also'</i> and the    second parallel infinitive: <i>'but also to identify subtle    pathological anomalies'</i>.</p>    <p style=\"orphans:0;widows:0\">Thus, the complete coherent    sentence is: <i>'The cutting-edge diagnostic algorithm    demonstrated an unprecedented ability not only to synthesize vast    amounts of uncurated data but also to identify subtle pathological    anomalies.'</i></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct indirect form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The sergeant said to the    soldiers, “Do not advance any further until you receive clear    orders from headquarters.”</p>", "option1": "<p style=\"orphans:0;widows:0\">    The sergeant ordered the soldiers not to advance any further until    they received clear orders from headquarters.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The sergeant forbade the soldiers not to advance any further until    they received clear orders from headquarters.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The sergeant ordered the soldiers to not advance any further until    they receive clear orders from headquarters.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The sergeant told the soldiers that they should not advance any    further until they receive clear orders from headquarters.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Rules for converting negative imperative sentences into indirect    speech:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb ‘said to’ changes to ‘ordered’ or ‘commanded’    depending on the context/authority.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The negative    imperative ‘Do not + verb’ changes to ‘not to + verb’    (‘not to advance’).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">If ‘forbade’    is used, ‘not’ is not used because ‘forbade’ is already    negative; hence, option B is incorrect due to the double negative    (‘forbade ... not to’).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Pronouns and    tenses in the subordinate clause change accordingly: the second    person pronoun ‘you’ changes to ‘they’, and the present    simple verb ‘receive’ changes to the past simple ‘received’.    This eliminates options C and D.</p>    <p style=\"orphans:0;widows:0\">Therefore, option A is the    correct indirect form.</p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct active form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">Could the intricate blueprints of    the suspension bridge have been tampered with by any unauthorized    technician prior to the inspection?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Could any unauthorized technician have tampered with the intricate    blueprints of the suspension bridge prior to the inspection?</p>", "option2": " <p style=\"orphans:0;widows:0\">    Could any unauthorized technician tamper with the intricate    blueprints of the suspension bridge prior to the inspection?</p>", "option3": " <p style=\"orphans:0;widows:0\">    Had any unauthorized technician tampered with the intricate    blueprints of the suspension bridge prior to the inspection?</p>", "option4": " <p style=\"orphans:0;widows:0\">    Would any unauthorized technician have tampered with the intricate    blueprints of the suspension bridge prior to the inspection?</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is an interrogative sentence in the passive    voice using a modal perfect construction: <i>Modal (Could) +    Subject + have + been + V3 (tampered with) + by + Agent...?</i></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">To convert    this structure into the active voice, follow the rule:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Modal    (Could) + Subject (Agent) + have + V3 (tampered with) + Object +    ...?</b></p>    <p style=\"orphans:0;widows:0\">Applying this rule yields: <i>Could    any unauthorized technician have tampered with the intricate    blueprints of the suspension bridge prior to the inspection?</i>    Thus, option A is correct.</p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct direct form of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">The detective asked the stranger    what he was doing behind the bushes at that hour and why he had    not answered when called.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The detective said to the stranger, “What are you doing behind    the bushes at this hour, and why didn't you answer when called?”</p>", "option2": " <p style=\"orphans:0;widows:0\">    The detective said to the stranger, “What were you doing behind    the bushes at that hour, and why hadn't you answered when called?”</p>", "option3": " <p style=\"orphans:0;widows:0\">    The detective asked to the stranger, “What are you doing behind    the bushes at this hour, and why you did not answer when called?”</p>", "option4": " <p style=\"orphans:0;widows:0\">    The detective said to the stranger, “What you are doing behind    the bushes at this hour, and why didn't you answer when called?”</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the indirect sentence into direct speech, follow these    rules:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Reporting    Verb:</b> 'asked the stranger' in indirect speech changes back to    'said to the stranger'. ('asked to' in option C is grammatically    incorrect).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Tense &amp;    Aspect:</b> The past continuous ('what he was doing') converts    back to the present continuous interrogative ('What are you    doing'). The past perfect ('why he had not answered') converts    back to simple past interrogative ('why didn't you answer').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Time/Adverbial    Shift:</b> 'at that hour' changes back to 'at this hour'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Word    Order:</b> Direct interrogative clauses require subject-auxiliary    inversion ('What are you doing...' and 'why didn't you    answer...'). Options C and D fail to maintain correct    interrogative syntax.</p>    <p style=\"orphans:0;widows:0\">Hence, <b>Option A</b> is the    correct direct form.</p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The following sentence has been divided into four parts.    Identify the part which contains a grammatical error. If there is    no error in the sentence, then select 'No Error'.</b></p>    <p style=\"orphans:0;widows:0\">The senior advocate (A)/ took    strong exception of (B)/ the judge's impromptu remarks. (C)/ No    Error (D)</p>", "option1": "<p style=\"orphans:0;widows:0\">    A</p>", "option2": " <p style=\"orphans:0;widows:0\">    C</p>", "option3": " <p style=\"orphans:0;widows:0\">    B</p>", "option4": " <p style=\"orphans:0;widows:0\">    D</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The error lies in part (B) of the sentence. The correct idiomatic    phrase is <b>'take exception to'</b>, which means to object    strongly to something or to be offended by it. The preposition    'of' is incorrect here (often erroneously confused with the phrase    <i>'with the exception of'</i>). Therefore, <b>'took strong    exception of'</b> must be replaced with <b>'took strong exception    to'</b>.</p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct active form of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">How could such crucial evidence    have been overlooked by the investigating officer?</p>", "option1": "<p style=\"orphans:0;widows:0\">    How could the investigating officer overlook such crucial    evidence?</p>", "option2": " <p style=\"orphans:0;widows:0\">    How could the investigating officer have overlooked such crucial    evidence?</p>", "option3": " <p style=\"orphans:0;widows:0\">    How had the investigating officer overlooked such crucial    evidence?</p>", "option4": " <p style=\"orphans:0;widows:0\">    How can the investigating officer have overlooked such crucial    evidence?</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is an interrogative sentence in the passive    voice using a modal perfect construction:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Passive    structure:</b> Wh-word (How) + modal (could) + object (such    crucial evidence) + have been + V3 (overlooked) + by + agent (the    investigating officer)?</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Active    structure:</b> Wh-word (How) + modal (could) + agent/subject (the    investigating officer) + have + V3 (overlooked) + object (such    crucial evidence)?</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option A</b>    incorrectly uses the simple modal base form 'could overlook'    instead of the perfect form 'could have overlooked'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option C</b>    changes the modal verb 'could' to the auxiliary 'had'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option D</b>    changes the modal 'could' to 'can'.</p>    <p style=\"orphans:0;widows:0\">Therefore, <b>Option B</b> is the    correct active form.</p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Given below are four jumbled sentences. Select the option that    gives their correct order.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A. Determined    to overcome this limitation, John Harrison, an English carpenter    and self-taught clockmaker, dedicated decades to crafting a    sea-worthy timepiece.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B. For    centuries, calculating latitude at sea was relatively    straightforward, but determining longitude remained an    insurmountable peril for navigators.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C. His    breakthrough came with the H4, a remarkably compact marine    chronometer that kept accurate time despite the rolling motion and    temperature variations of ocean voyages.</p>    <p style=\"orphans:0;widows:0\">D. This chronic inability to    pinpoint their east-west position led to catastrophic shipwrecks    and staggering losses of life and cargo.</p>", "option1": "<p style=\"orphans:0;widows:0\">    BADC</p>", "option2": " <p style=\"orphans:0;widows:0\">    BDAC</p>", "option3": " <p style=\"orphans:0;widows:0\">    DBAC</p>", "option4": " <p style=\"orphans:0;widows:0\">    ADBC</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct order is <b>BDAC</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>B</b>    serves as the ideal introductory sentence, presenting the    overarching historical dilemma: while latitude could easily be    determined, measuring longitude was a major peril.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>D</b>    directly elaborates on sentence B; 'This chronic inability to    pinpoint their east-west position' links to the failure of    calculating longitude and details its disastrous consequences    (shipwrecks and loss of life). Hence, <b>BD</b> forms an    inseparable pair.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. <b>A</b>    introduces John Harrison, who took on the challenge to overcome    'this limitation' by building a reliable timepiece.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. <b>C</b>    directly follows A; the pronoun 'His' refers to John Harrison,    concluding the narrative with his ultimate triumph (the creation    of the H4 chronometer). Thus, <b>AC</b> forms a mandatory pair.</p>    <p style=\"orphans:0;widows:0\">Combining these pairs gives the    coherent sequence: <b>B - D - A - C</b>.</p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate phrasal verb to fill in the blank    in the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">The forensic evidence produced in    court did not ________ the witness's claim regarding the suspect's    whereabouts.</p>", "option1": "<p style=\"orphans:0;widows:0\">    bear with</p>", "option2": " <p style=\"orphans:0;widows:0\">    bear out</p>", "option3": " <p style=\"orphans:0;widows:0\">    bear up</p>", "option4": " <p style=\"orphans:0;widows:0\">    bear away</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct phrasal verb to fill in the blank is <b>bear out</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Bear    out:</b> means to confirm, substantiate, or support the truth of    something.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Bear    with:</b> means to be patient with someone.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Bear up:</b>    means to remain brave or endure in the face of difficulty.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Bear    away:</b> means to win or carry off as a prize.</p>    <p style=\"orphans:0;widows:0\">In this context, the forensic    evidence did not confirm or support the witness's claim, making    'bear out' the correct choice.</p>", "question_heading": ""}, {"sr_no": 56, "question": "Rधोक पुध ीियियथing ूोौौोgध ोnक ोnौथधन पुध तहधौपiयnौ giॅधn ृिधयथ. Tुध ोccिधधनोपing cोकधncध यी gियृोि पधंूधनोपहनध ोnयंोिiधौ ुोौ ूनयंूपधक ौधनiयहौ ौciधnपiीic cयnौiकधनोपiयn यी ौियोन नोकiोपiयn ंयकi
