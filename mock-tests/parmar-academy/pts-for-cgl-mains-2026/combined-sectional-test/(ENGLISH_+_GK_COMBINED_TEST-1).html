<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>1.) ENGLISH + GK COMBINED TEST-1 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

const questions = [{"sr_no": 1, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate synonym of the underlined word.</b></p>    <p style=\"orphans:0;widows:0\">The supervisor struggled to    manage the <u>recalcitrant</u> worker who consistently refused to    follow safety guidelines.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Submissive</p>", "option2": " <p style=\"orphans:0;widows:0\">    Intractable</p>", "option3": " <p style=\"orphans:0;widows:0\">    Indolent</p>", "option4": " <p style=\"orphans:0;widows:0\">    Benevolent</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (B). <b>Intractable</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Recalcitrant</b>     means having an obstinately uncooperative attitude toward     authority or discipline; stubbornly defiant or disobedient.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Intractable</b>     means very difficult to manage, control, or govern; stubborn.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings     of the other options:</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Submissive:</b>     ready to conform to the authority or will of others; obedient.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Indolent:</b>     wanting to avoid activity or exertion; lazy.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Benevolent:</b>     well-meaning, kindly, and charitable.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate synonym of the underlined word in the    given sentence.</p>    <p style=\"orphans:0;widows:0\">The documentary ended on a    <u>lugubrious</u> note, leaving the entire auditorium in solemn    silence.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Doleful</p>", "option2": " <p style=\"orphans:0;widows:0\">    Exuberant</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sanguine</p>", "option4": " <p style=\"orphans:0;widows:0\">    Frivolous</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>lugubrious</b> means looking or sounding sad, dismal,    or mournful.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Doleful:</b>     expressing sorrow; mournful or melancholy (closest synonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Exuberant:</b>     full of energy, excitement, and cheerfulness.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sanguine:</b>     optimistic or positive, especially in an apparently bad     situation.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Frivolous:</b>     carefree and not serious; lacking purpose or value.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence, <b>Doleful</b> is the    correct synonym.</p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0\">    Select the wrongly spelt word out of the four alternatives.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Convalescence</p>", "option2": " <p style=\"orphans:0;widows:0\">    Inocculate</p>", "option3": " <p style=\"orphans:0;widows:0\">    Surveillance</p>", "option4": " <p style=\"orphans:0;widows:0\">    Acquiescence</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The wrongly spelt word is <b>Inocculate</b>. The correct spelling    is <b>Inoculate</b> (with a single 'c'), which means to introduce    a vaccine or antigen into an organism to produce immunity. All    other options are correctly spelt.</p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Owing to erratic rainfall and    depleting groundwater, the smallholders in this drought-prone    region lead a ________ existence, perpetually vulnerable to crop    failure.</p>", "option1": "<p style=\"orphans:0;widows:0\">    lucrative</p>", "option2": " <p style=\"orphans:0;widows:0\">    resilient</p>", "option3": " <p style=\"orphans:0;widows:0\">    precarious</p>", "option4": " <p style=\"orphans:0;widows:0\">    impervious</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (C). <b>precarious</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The context    clue <i>'perpetually vulnerable to crop failure'</i> indicates    that the farmers live in a state of high uncertainty, danger, or    instability.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Precarious:</b>     not securely held or in position; dangerously uncertain,     insecure, or risky.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Lucrative:</b>     producing a great deal of profit.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Resilient:</b>     able to withstand or recover quickly from difficult conditions.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Impervious:</b>     unable to be affected by something.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, 'precarious' correctly    completes the sentence.</p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    From the given options, select the word that corresponds to both    Definition (P) and Definition (Q).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(P) The legal    action of taking custody of property or assets until a dispute or    debt is resolved.</p>    <p style=\"orphans:0;widows:0\">(Q) The biological or    environmental process of capturing, isolating, and storing a    substance (such as carbon dioxide) to prevent its release or    dispersion.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Expropriation</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sequestration</p>", "option3": " <p style=\"orphans:0;widows:0\">    Invalidation</p>", "option4": " <p style=\"orphans:0;widows:0\">    Amortisation</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>Sequestration</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. In law,    <b>sequestration</b> refers to the act of removing, isolating, or    seizing property from the possession of the owner under legal    process until a claim or debt is satisfied.</p>    <p style=\"orphans:0;widows:0\">2. In environmental and    biological sciences, <b>sequestration</b> (most commonly seen in    'carbon sequestration') refers to the long-term capture, locking    away, and storage of a chemical compound or substance to mitigate    its impact on the biosphere.</p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the following question, some of the words in the passage    have been left out. Read the passage carefully and choose the    correct word for each blank, out of the four alternatives and fill    in the blanks.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">India’s    foreign exchange reserves have displayed remarkable resilience,    scaling unprecedented heights ________ (1) persistent headwinds in    the global macroeconomic landscape. Even as aggressive monetary    tightening across developed markets triggered capital outflows,    prudent interventions by the central bank have ________ (2)    excessive volatility in currency markets. Strategic accumulation    of foreign currency assets, coupled with robust domestic    macroeconomic fundamentals, ________ (3) the external balance    sheet against sudden geopolitical shocks. Analysts observe that    this buffer has significantly ________ (4) foreign investor    confidence, facilitating sustained capital inflows into sovereign    debt and key manufacturing sectors. Consequently, India remains    well ________ (5) to navigate emerging risks in global financial    liquidity.</p>    <p style=\"orphans:0;widows:0\"><b>What should come in blank (1)    ?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    despite</p>", "option2": " <p style=\"orphans:0;widows:0\">    between</p>", "option3": " <p style=\"orphans:0;widows:0\">    towards</p>", "option4": " <p style=\"orphans:0;widows:0\">    upon</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage highlights resilience in the face of difficulties    ('persistent headwinds'). The preposition 'despite' means 'in    spite of' or 'without being affected by', which correctly conveys    that the reserves rose even though there were unfavourable global    conditions. The other options ('between', 'towards', 'upon') are    semantically and syntactically unsuitable.</p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the following question, some of the words in the passage    have been left out. Read the passage carefully and choose the    correct word for each blank, out of the four alternatives and fill    in the blanks.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">India’s    foreign exchange reserves have displayed remarkable resilience,    scaling unprecedented heights ________ (1) persistent headwinds in    the global macroeconomic landscape. Even as aggressive monetary    tightening across developed markets triggered capital outflows,    prudent interventions by the central bank have ________ (2)    excessive volatility in currency markets. Strategic accumulation    of foreign currency assets, coupled with robust domestic    macroeconomic fundamentals, ________ (3) the external balance    sheet against sudden geopolitical shocks. Analysts observe that    this buffer has significantly ________ (4) foreign investor    confidence, facilitating sustained capital inflows into sovereign    debt and key manufacturing sectors. Consequently, India remains    well ________ (5) to navigate emerging risks in global financial    liquidity.</p>    <p style=\"orphans:0;widows:0\"><b>What should come in blank (2)    ?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    aggravated</p>", "option2": " <p style=\"orphans:0;widows:0\">    mitigated</p>", "option3": " <p style=\"orphans:0;widows:0\">    simulated</p>", "option4": " <p style=\"orphans:0;widows:0\">    capitulated</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The blank requires a past participle form following 'have'. The    context refers to 'prudent interventions' designed to curb or    reduce harmful currency market fluctuations. 'Mitigated' means    made less severe or alleviated, which fits precisely. 'Aggravated'    (made worse), 'simulated' (imitated), and 'capitulated'    (surrendered) do not fit the context.</p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the following question, some of the words in the passage    have been left out. Read the passage carefully and choose the    correct word for each blank, out of the four alternatives and fill    in the blanks.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">India’s    foreign exchange reserves have displayed remarkable resilience,    scaling unprecedented heights ________ (1) persistent headwinds in    the global macroeconomic landscape. Even as aggressive monetary    tightening across developed markets triggered capital outflows,    prudent interventions by the central bank have ________ (2)    excessive volatility in currency markets. Strategic accumulation    of foreign currency assets, coupled with robust domestic    macroeconomic fundamentals, ________ (3) the external balance    sheet against sudden geopolitical shocks. Analysts observe that    this buffer has significantly ________ (4) foreign investor    confidence, facilitating sustained capital inflows into sovereign    debt and key manufacturing sectors. Consequently, India remains    well ________ (5) to navigate emerging risks in global financial    liquidity.</p>    <p style=\"orphans:0;widows:0\"><b>What should come in blank (3)    ?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    exposed</p>", "option2": " <p style=\"orphans:0;widows:0\">    imperiled</p>", "option3": " <p style=\"orphans:0;widows:0\">    insulated</p>", "option4": " <p style=\"orphans:0;widows:0\">    dismantled</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The sentence describes protecting the balance sheet against shocks    ('against sudden geopolitical shocks'). 'Insulated' means    protected or shielded from an unpleasant or detrimental influence,    and it correctly collocates with 'against'. The other options    ('exposed', 'imperiled', 'dismantled') express vulnerability or    destruction, contradicting the positive context.</p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the following question, some of the words in the passage    have been left out. Read the passage carefully and choose the    correct word for each blank, out of the four alternatives and fill    in the blanks</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">India’s    foreign exchange reserves have displayed remarkable resilience,    scaling unprecedented heights ________ (1) persistent headwinds in    the global macroeconomic landscape. Even as aggressive monetary    tightening across developed markets triggered capital outflows,    prudent interventions by the central bank have ________ (2)    excessive volatility in currency markets. Strategic accumulation    of foreign currency assets, coupled with robust domestic    macroeconomic fundamentals, ________ (3) the external balance    sheet against sudden geopolitical shocks. Analysts observe that    this buffer has significantly ________ (4) foreign investor    confidence, facilitating sustained capital inflows into sovereign    debt and key manufacturing sectors. Consequently, India remains    well ________ (5) to navigate emerging risks in global financial    liquidity.</p>    <p style=\"orphans:0;widows:0\"><b>What should come in blank (4)    ?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    impaired</p>", "option2": " <p style=\"orphans:0;widows:0\">    bolstered</p>", "option3": " <p style=\"orphans:0;widows:0\">    forfeited</p>", "option4": " <p style=\"orphans:0;widows:0\">    alienated</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The sentence explains that the reserves buffer helped in    'facilitating sustained capital inflows'. Therefore, it must have    strengthened investor confidence. 'Bolstered' means supported or    reinforced. 'Impaired' (damaged), 'forfeited' (lost), and    'alienated' (estranged) convey negative meanings opposite to the    intended sense.</p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the following question, some of the words in the passage    have been left out. Read the passage carefully and choose the    correct word for each blank, out of the four alternatives and fill    in the blanks.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">India’s    foreign exchange reserves have displayed remarkable resilience,    scaling unprecedented heights ________ (1) persistent headwinds in    the global macroeconomic landscape. Even as aggressive monetary    tightening across developed markets triggered capital outflows,    prudent interventions by the central bank have ________ (2)    excessive volatility in currency markets. Strategic accumulation    of foreign currency assets, coupled with robust domestic    macroeconomic fundamentals, ________ (3) the external balance    sheet against sudden geopolitical shocks. Analysts observe that    this buffer has significantly ________ (4) foreign investor    confidence, facilitating sustained capital inflows into sovereign    debt and key manufacturing sectors. Consequently, India remains    well ________ (5) to navigate emerging risks in global financial    liquidity.</p>    <p style=\"orphans:0;widows:0\"><b>What should come in blank (5)    ?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    poised</p>", "option2": " <p style=\"orphans:0;widows:0\">    stranded</p>", "option3": " <p style=\"orphans:0;widows:0\">    marred</p>", "option4": " <p style=\"orphans:0;widows:0\">    waived</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The phrase 'well poised to' is a standard idiom meaning well    positioned, ready, or prepared to take action or handle a    situation. 'Stranded' (abandoned/left helpless), 'marred'    (disfigured/spoiled), and 'waived' (relinquished) make no sense in    this context.</p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The following sentence has been divided into four parts. Identify    the part which contains a grammatical error.</p>    <p style=\"orphans:0;widows:0\">Between the two shortlisted    candidates (A) / for the managerial position, (B) / Nidhi is    undeniably the most qualified (C) / due to her diverse industry    experience. (D)</p>", "option1": "<p style=\"orphans:0;widows:0\">    B</p>", "option2": " <p style=\"orphans:0;widows:0\">    D</p>", "option3": " <p style=\"orphans:0;widows:0\">    C</p>", "option4": " <p style=\"orphans:0;widows:0\">    A</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The error lies in part (C) of the sentence.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">When a     comparison or selection is made between only two persons or     things, the comparative degree of the adjective is used, preceded     by the definite article 'the' (i.e., <i>the + comparative     degree</i>), rather than the superlative degree.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Here,     the comparison is strictly between 'the two shortlisted     candidates'. Therefore, the superlative form <b>'the most     qualified'</b> must be replaced by the comparative form <b>'the     more qualified'</b>.</p>    </li></ul>    <p style=\"orphans:0;widows:0\"><b>Correct sentence:</b> \"Between    the two shortlisted candidates for the managerial position, Nidhi    is undeniably <b>the more qualified</b> due to her diverse    industry experience.\"</p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Given below are four jumbled parts of a sentence. Select the    option that gives their correct order.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A) but it    also accelerates the mass migration of distressed farmers</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B) undermine    food security for vulnerable rural populations</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C) toward    already overburdened urban centers</p>    <p style=\"orphans:0;widows:0\">D) not only does the persistent    degradation of fertile topsoil</p>", "option1": "<p style=\"orphans:0;widows:0\">    DBAC</p>", "option2": " <p style=\"orphans:0;widows:0\">    DABC</p>", "option3": " <p style=\"orphans:0;widows:0\">    BADC</p>", "option4": " <p style=\"orphans:0;widows:0\">    CADB</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct order is <b>DBAC</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>D</b>    introduces the sentence using the inverted structure <i>'Not only    does + subject'</i> ('not only does the persistent degradation of    fertile topsoil...').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Following    the auxiliary verb 'does' in D, the base-form verb is required to    complete the clause. <b>B</b> ('undermine food security for    vulnerable rural populations') provides this verb ('undermine'),    establishing <b>DB</b> as a mandatory pair.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. The    correlative conjunction pair for 'Not only' is 'but also', which    begins part <b>A</b> ('but it also accelerates the mass migration    of distressed farmers').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Part <b>C</b>    ('toward already overburdened urban centers') functions as the    directional prepositional phrase that completes 'the mass    migration of distressed farmers' in part A, forming the pair <b>AC</b>.</p>    <p style=\"orphans:0;widows:0\">Connecting all parts logically    gives: <i>'Not only does the persistent degradation of fertile    topsoil undermine food security for vulnerable rural populations,    but it also accelerates the mass migration of distressed farmers    toward already overburdened urban centers.'</i></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct passive form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The investigator questioned    several witnesses in the office. Even the documents have been    seized.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Several witnesses had been questioned in the office by the    investigator. Even the documents were seized.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Several witnesses in the office were questioned by the    investigator. Even the documents have been seized.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Several witnesses in the office were being questioned by the    investigator. Even the documents have seized.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Even the documents had been seized when the investigator    questioned several witnesses in the office.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given text consists of two sentences: the first sentence is in    the Simple Past tense (Active Voice), and the second sentence is    already in the Present Perfect tense (Passive Voice).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The active    structure of Simple Past is: <i>Subject + V2 + Object</i> ('The    investigator questioned several witnesses...').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Its passive    structure is: <i>Object + was/were + V3 + by + Subject</i>    ('Several witnesses in the office were questioned by the    investigator').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Since the    second sentence ('Even the documents have been seized') is already    in passive voice, it remains unchanged.</p>    <p style=\"orphans:0;widows:0\">Therefore, option B is the    correct passive form.</p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Given below are four jumbled sentences. Select the option that    gives their correct order.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A. Here,    towering skyscrapers coexist seamlessly with centuries-old Shinto    shrines and bustling street markets.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B. In many    rapidly developing nations, relentless urban expansion often leads    to the complete erasure of historical architecture.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C. Ancient    heritage structures are frequently demolished to make way for    high-rise glass-and-steel complexes.</p>    <p style=\"orphans:0;widows:0\">D. Yet, Japan presents a    remarkable harmony between the ancient past and the hyper-modern    present.</p>", "option1": "<p style=\"orphans:0;widows:0\">    BCDA</p>", "option2": " <p style=\"orphans:0;widows:0\">    BDAC</p>", "option3": " <p style=\"orphans:0;widows:0\">    CBDA</p>", "option4": " <p style=\"orphans:0;widows:0\">    BACD</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct logical order is <b>BCDA</b>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sentence B</b>    serves as the introductory statement, establishing the general    problem that urban expansion often erases historical architecture.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sentence C</b>    directly elaborates on sentence B by describing how ancient    heritage structures are demolished for high-rise buildings.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sentence D</b>    introduces a contrasting example using the transition word 'Yet',    bringing in Japan as an exception to the trend mentioned in B and    C.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sentence A</b>    follows D naturally, using the adverb of place 'Here' to refer to    Japan and describing the specific harmony between modern    skyscrapers and traditional shrines.</p>    <p style=\"orphans:0;widows:0\">Hence, the correct sequence is    BCDA.</p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that correctly explains the meaning of the given    idiom/proverb.</p>    <p style=\"orphans:0;widows:0\">Strike while the iron is hot</p>", "option1": "<p style=\"orphans:0;widows:0\">    To ruin something by rushing into it</p>", "option2": " <p style=\"orphans:0;widows:0\">    To take prompt action when an opportunity presents itself</p>", "option3": " <p style=\"orphans:0;widows:0\">    To get angry quickly and lose control</p>", "option4": " <p style=\"orphans:0;widows:0\">    To work continuously without taking any rest</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The proverb <b>'Strike while the iron is hot'</b> means to take    decisive action immediately when conditions or opportunities are    most favorable, just as blacksmiths hammer iron when it is hot and    malleable. Hence, option B is correct.</p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct direct form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The teacher inquired whether the    new student was present.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The teacher asked, \"Is the new student present?\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    The teacher asked, \"Was the new student present?\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    The teacher said, \"Whether the new student was present?\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    The teacher asked, \"The new student is present?\"</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert an indirect speech interrogative sentence into direct    speech, follow these rules:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    reporting verb 'inquired' changes to 'asked' or 'said'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. The    conjunction 'whether' or 'if' is removed.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. The simple    past tense ('was') in indirect speech reverts to the simple    present tense ('is') in direct speech.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. An    inverted word order (Auxiliary verb + Subject) is used to form the    question: \"Is the new student present?\".</p>    <p style=\"orphans:0;widows:0\">Therefore, Option A is the    correct direct form.</p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate synonym of the given word.</p>    <p style=\"orphans:0;widows:0\">Transient</p>", "option1": "<p style=\"orphans:0;widows:0\">    Permanent</p>", "option2": " <p style=\"orphans:0;widows:0\">    Ephemeral</p>", "option3": " <p style=\"orphans:0;widows:0\">    Essential</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ordinary</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The word 'Transient' means lasting only for a short time;    impermanent. 'Ephemeral' also means lasting for a very short time.    Hence, 'Ephemeral' is the correct synonym of 'Transient'.</p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    Select the correctly spelt word out of the four alternatives.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Camoflage</p>", "option2": " <p style=\"orphans:0;widows:0\">    Camouflage</p>", "option3": " <p style=\"orphans:0;widows:0\">    Camoflauge</p>", "option4": " <p style=\"orphans:0;widows:0\">    Cammouflage</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The correctly spelt word is 'Camouflage', which means the    disguising of military personnel, equipment, or installations by    painting or covering them to make them blend in with their    surroundings.</p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct indirect form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">“Do you think you can outsmart    the entire team?” sneered the captain.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The captain sneered that did he think he could outsmart the entire    team.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The captain sneered and asked whether he thought he could outsmart    the entire team.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The captain sneered and asked if you thought you can outsmart the    entire team.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The captain sneered and asked whether he has thought he could    outsmart the entire team.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct indirect form is: <b>The captain sneered and asked    whether he thought he could outsmart the entire team.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Rules for    conversion:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb ‘sneered’ can be expanded to ‘sneered and asked’ to    properly introduce the interrogative clause.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In yes/no    questions, the conjunction ‘if’ or ‘whether’ is used, and    the question form changes into an assertive clause (subject +    verb).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Present    Indefinite tense (‘Do you think’) changes to Past Indefinite    tense (‘he thought’).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The modal    ‘can’ changes to ‘could’.</p>    <p style=\"orphans:0;widows:0\">The second-person pronoun ‘you’    changes to the third-person pronoun ‘he’.</p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Choose the option that contains the homonym of the highlighted    word in the given sentence.</p>    <p style=\"orphans:0;widows:0\">The young author spent over three    years writing his debut historical <b>novel</b>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    She spent the entire weekend reading an intriguing detective novel    by her favorite writer.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The library recently added a wide collection of classic Russian    novels to its literature section.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The research team proposed a novel approach to significantly    reduce industrial carbon emissions.</p>", "option4": " <p style=\"orphans:0;widows:0\">    He bought a vintage fantasy novel from the secondhand bookstore    downtown.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    A homonym is a word that has the same spelling and pronunciation    as another word, but has a different meaning.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In the given    sentence, <b>novel</b> is used as a noun meaning a book of long    narrative fiction (an extended work of prose).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In option C,    <b>novel</b> is used as an adjective meaning 'new, innovative, or    original'.</p>    <p style=\"orphans:0;widows:0\">In options A, B, and D, 'novel'    carries the same meaning as in the prompt sentence (a book/story).    Hence, option C is the correct answer.</p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, out of the four alternatives, choose    the one which gives the meaning of the given idiom or phrase.</p>    <p style=\"orphans:0;widows:0\">To carry coals to Newcastle</p>", "option1": "<p style=\"orphans:0;widows:0\">    To do something that is redundant or completely unnecessary</p>", "option2": " <p style=\"orphans:0;widows:0\">    To undertake an extremely hazardous and difficult journey</p>", "option3": " <p style=\"orphans:0;widows:0\">    To work hard to achieve success in a new business</p>", "option4": " <p style=\"orphans:0;widows:0\">    To exploit workers for one's personal financial gain</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The idiom <b>'To carry coals to Newcastle'</b> means to supply    something that is already abundant, or to do something that is    completely redundant and pointless (as Newcastle was historically    a major coal-producing port in England). Therefore, option A is    the correct answer.</p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Given below are four jumbled parts of a sentence. Select the    option that gives their correct order.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A) over the    rapid depletion of</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B) that    sustain marine ecosystems</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C) natural    resources and habitats</p>    <p style=\"orphans:0;widows:0\">D) the environmentalist expressed    deep concern</p>", "option1": "<p style=\"orphans:0;widows:0\">    ADCB</p>", "option2": " <p style=\"orphans:0;widows:0\">    DACB</p>", "option3": " <p style=\"orphans:0;widows:0\">    DCAB</p>", "option4": " <p style=\"orphans:0;widows:0\">    BCDA</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sequence is <b>DACB</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Part <b>D</b>    introduces the main subject and verb ('the environmentalist    expressed deep concern'), making it the logical starting point.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Part <b>A</b>    ('over the rapid depletion of') correctly follows 'expressed deep    concern' by indicating what the concern is about.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Part <b>C</b>    ('natural resources and habitats') serves as the object of the    preposition 'of'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Part <b>B</b>    ('that sustain marine ecosystems') is a relative clause modifying    the antecedent 'natural resources and habitats'.</p>    <p style=\"orphans:0;widows:0\">Thus, the complete coherent    sentence is: <i>\"The environmentalist expressed deep concern    over the rapid depletion of natural resources and habitats that    sustain marine ecosystems.\"</i></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct indirect form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">“Bring the files to my cabin    immediately,” said the director to his assistant.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The director requested his assistant that he should bring the    files to his cabin immediately.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The director ordered his assistant to bring the files to his cabin    immediately.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The director told his assistant that bring the files to his cabin    immediately.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The director ordered to his assistant to brought the files to his    cabin immediately.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert an imperative sentence into indirect speech:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    reporting verb 'said to' is changed to 'ordered', 'commanded', or    'instructed' depending on the tone of the sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. The    imperative mood is replaced by an infinitive structure ('to' +    base form of the verb, i.e., 'to bring').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. The    first-person possessive pronoun 'my' changes according to the    subject ('the director') to 'his'.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct indirect    form is: \"The director ordered his assistant to bring the    files to his cabin immediately.\"</p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct active form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The confidential documents were    being thoroughly examined by the senior auditor when the fire    alarm rang.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The senior auditor thoroughly examined the confidential documents    when the fire alarm rang.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The senior auditor was thoroughly examining the confidential    documents when the fire alarm rang.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The senior auditor had examined the confidential documents when    the fire alarm rang.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The senior auditor is thoroughly examining the confidential    documents when the fire alarm rang.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the passive voice of the past continuous    tense.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive    Structure: Object + was/were + being +     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793819444229_html_a2a1051d25850e4a.gif\" >     + by + Subject</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Active    Structure: Subject + was/were +     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793819444229_html_6d47a5ab5429ad09.gif\" >     + ing + Object</p>    <p style=\"orphans:0;widows:0\">Here, 'the senior auditor' is a    singular subject, so it takes 'was thoroughly examining'.    Therefore, option B correctly represents the active voice.</p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct direct form of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">Father asked me whether I would    accompany him to the market.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Father said to me, “Can you accompany him to the market?”</p>", "option2": " <p style=\"orphans:0;widows:0\">    Father said to me, “Will you accompany me to the market?”</p>", "option3": " <p style=\"orphans:0;widows:0\">    Father said to me, “Will he accompany me to the market?”</p>", "option4": " <p style=\"orphans:0;widows:0\">    Father asked to me, “Would you accompany me to the market?”</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in indirect speech and needs to be converted    into direct speech.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Rules of    conversion from indirect to direct speech for interrogative    sentences:The reporting verb 'asked' changes back to 'said to'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    conjunction 'whether' is removed, and quotation marks (“...”)    with a question mark (?) are introduced.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The pronoun    'I' (referring to the listener 'me') changes to the second-person    pronoun 'you'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The modal    auxiliary 'would' changes back to 'will' in the direct question    addressing 'you'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The pronoun    'him' (referring to Father) changes to the first-person pronoun    'me'.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct direct    speech is: <b>Father said to me, “Will you accompany me to the    market?”</b></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Choose the most appropriate option to fill in the blank in the    given sentence.</b></p>    <p style=\"orphans:0;widows:0\">The fire department worked    tirelessly to ________ the raging forest fire.</p>", "option1": "<p style=\"orphans:0;widows:0\">    put out</p>", "option2": " <p style=\"orphans:0;widows:0\">    put off</p>", "option3": " <p style=\"orphans:0;widows:0\">    put up</p>", "option4": " <p style=\"orphans:0;widows:0\">    put down</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The phrasal verb <b>'put out'</b> means to extinguish something    that is burning (such as a fire or candle). Hence, 'put out' fits    the context correctly.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>put off</b>:    to postpone or delay.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>put up</b>:    to construct, erect, or accommodate.</p>    <p style=\"orphans:0;widows:0\">- <b>put down</b>: to suppress by    force or to write down.</p>", "question_heading": ""}, {"sr_no": 27, "question": "Rधोक पुध ीियियथing ूोौौोgध ोnक ोnौथधन पुध
