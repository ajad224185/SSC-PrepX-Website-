ystemic danger\"</i>    and push maintenance toward unregulated foreign subcontractors    rather than ensuring fundamental safety. Hence, the tone is    critical of how complex regulations create more risks.</p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct direct form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">Pooja stated that she was cooking    dinner when the guests arrived.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Pooja said, “She was cooking dinner when the guests arrived.”</p>", "option2": " <p style=\"orphans:0;widows:0\">    Pooja said, “I was cooking dinner when the guests arrived.”</p>", "option3": " <p style=\"orphans:0;widows:0\">    Pooja says, “I was cooking dinner when the guests arrived.”</p>", "option4": " <p style=\"orphans:0;widows:0\">    Pooja said, “I am cooking dinner when the guests arrived.”</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the indirect speech into direct speech:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    reporting verb in the past ('stated') changes back to 'said'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. The    conjunction 'that' is removed and replaced by a comma and inverted    commas.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. The    third-person pronoun 'she' refers to the speaker (Pooja), so it    changes to the first-person pronoun 'I'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. In a time    clause indicating an action ongoing when another took place in the    past, the past continuous tense ('was cooking') remains unchanged.</p>    <p style=\"orphans:0;widows:0\">Thus, the correct direct form is:    <b>Pooja said, “I was cooking dinner when the guests arrived.”</b></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to substitute the underlined    segment in the given sentence. If no substitution is required,    select 'No improvement required'.</p>    <p style=\"orphans:0;widows:0\">Had the meteorologist issued the    severe weather alert on time, <u>the coastal villagers would    evacuate</u> to safety before the hurricane struck.</p>", "option1": "<p style=\"orphans:0;widows:0\">    the coastal villagers would evacuated</p>", "option2": " <p style=\"orphans:0;widows:0\">    the coastal villagers will have evacuated</p>", "option3": " <p style=\"orphans:0;widows:0\">    the coastal villagers would have evacuated</p>", "option4": " <p style=\"orphans:0;widows:0\">    No improvement required</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is an inverted third conditional sentence. The    standard structure for such inverted conditionals is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Had +    Subject + V3 (past participle) ..., Subject + would/could/might +    have + V3 (past participle) ...</b></p>    <p style=\"orphans:0;widows:0\">Here, the conditional clause    begins with 'Had the meteorologist issued', so the main clause    must use 'would have evacuated' instead of 'would evacuate'.    Therefore, option C correctly substitutes the underlined segment.</p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words.</p>    <p style=\"orphans:0;widows:0\"><b>An instrument used for    measuring the speed or velocity of the wind</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Altimeter</p>", "option2": " <p style=\"orphans:0;widows:0\">    Chronometer</p>", "option3": " <p style=\"orphans:0;widows:0\">    Anemometer</p>", "option4": " <p style=\"orphans:0;widows:0\">    Odometer</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitute is <b>Anemometer</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">•    <b>Anemometer:</b> An instrument used for measuring the speed and    direction of the wind.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">•    <b>Altimeter:</b> An instrument used to measure the altitude of an    object above a fixed level.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">•    <b>Chronometer:</b> An instrument for measuring time accurately,    typically used at sea.</p>    <p style=\"orphans:0;widows:0\">• <b>Odometer:</b> An    instrument for measuring the distance traveled by a vehicle.</p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to substitute the underlined    segment in the given sentence. If there is no need to substitute    it, select 'No improvement required'.</p>    <p style=\"orphans:0;widows:0\">Following the governor's    directive issued during the Great Plague of 1665, the city    magistrate <u>imposes strict quarantine rules on all merchant    ships who arrived at</u> the dockyard.</p>", "option1": "<p style=\"orphans:0;widows:0\">    imposed strict quarantine rules on all merchant ships arriving at</p>", "option2": " <p style=\"orphans:0;widows:0\">    is imposing strict quarantine rules on every merchant ship who    arrive at</p>", "option3": " <p style=\"orphans:0;widows:0\">    has imposed strict quarantine rules on all merchant ship's arrival    at</p>", "option4": " <p style=\"orphans:0;widows:0\">    No improvement required</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The given sentence refers to a specific past historical event    ('during the Great Plague of 1665'), which requires the simple    past tense (<b>imposed</b> instead of the simple present    'imposes'). Additionally, the relative pronoun 'who' cannot be    used for inanimate objects such as 'merchant ships'; instead, a    present participle modifier like <b>arriving at</b> correctly and    concisely modifies 'merchant ships'. Therefore, option A is the    correct substitution.</p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0\">    <b>Which famous poet, musician, and Sufi mystic of the Delhi    Sultanate era was famously known by the title 'Tuti-e-Hind'    (Parrot of India)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Tansen</p>", "option2": " <p style=\"orphans:0;widows:0\">    Amir Khusrau</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kabir Das</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mirza Ghalib</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Amir Khusrau (1253–1325), an iconic Sufi musician, poet, and    scholar associated with the Delhi Sultanate, was conferred the    title 'Tuti-e-Hind' (Parrot of India) on account of his sweet and    eloquent poetic expression. He is also regarded as the 'Father of    Qawwali' and introduced various Persian and Arabic elements into    Indian classical music.</p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Arrange the following foreign travellers who visited India    during the Medieval period in correct chronological order:</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Abdur     Razzaq</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Jean-Baptiste     Tavernier</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Nicolo     de Conti</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Francois     Bernier </b>     </p>    </li></ol>    <p style=\"orphans:0;widows:0\"><b>Select the correct answer    using the code given below:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    3 – 1 – 2 – 4</p>", "option2": " <p style=\"orphans:0;widows:0\">    1 – 3 – 4 – 2</p>", "option3": " <p style=\"orphans:0;widows:0\">    3 – 1 – 4 – 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    1 – 3 – 2 – 4</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Nicolo de Conti visited Vijayanagara around 1420 CE, Abdur Razzaq    in 1443 CE, Tavernier arrived in the 1630s CE, and Francois    Bernier came in 1658 CE.</p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0\">    <b>The state anthem of Assam, 'O Mur Apunar Desh', was penned by    which of the following literary doyens, who was famously conferred    the honorific title 'Sahityarathi' (Charioteer of Literature)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Hemchandra Barua</p>", "option2": " <p style=\"orphans:0;widows:0\">    Jyoti Prasad Agarwala</p>", "option3": " <p style=\"orphans:0;widows:0\">    Lakshminath Bezbaroa</p>", "option4": " <p style=\"orphans:0;widows:0\">    Bishnu Prasad Rabha</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Lakshminath Bezbaroa (1864–1938) was a celebrated pioneer of    modern Assamese literature. He was conferred the title    'Sahityarathi' (Charioteer of Literature) by the Asam Sahitya    Sabha in 1931 for his immense contributions across poetry, drama,    and fiction. He also composed Assam's state song, 'O Mur Apunar    Desh'.</p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0\">    <b>Which celebrated Indian dramatist, painter, and musician, who    played a pioneering role in modern Assamese culture and arts, is    famously known by the honorific title 'Kalaguru'?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Jyoti Prasad Agarwala</p>", "option2": " <p style=\"orphans:0;widows:0\">    Bishnu Prasad Rabha</p>", "option3": " <p style=\"orphans:0;widows:0\">    Lakshminath Bezbaroa</p>", "option4": " <p style=\"orphans:0;widows:0\">    Phani Sarma</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Bishnu Prasad Rabha (1909–1969) was an acclaimed cultural    stalwart, freedom fighter, and polymath from Assam. He was    bestowed with the title 'Kalaguru' (Master of Arts) by Dr.    Sarvepalli Radhakrishnan at Banaras Hindu University in    appreciation of his mastery over Indian classical arts,    particularly the Tandava dance, music, literature, and painting.    Among other prominent Assamese figures, Jyoti Prasad Agarwala is    known as 'Rupkonwar', Phani Sarma as 'Natasurya', and Lakshminath    Bezbaroa as 'Sahityarathi'.</p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"orphans:0;widows:0\">    <b>The evolutionary transition of temple architecture in South    India—progressing sequentially from rock-cut cave shrines    (mandapas) to monolithic shrines (rathas), and culminating in    freestanding structural stone temples—is most comprehensively    exemplified under the patronage of which dynasty?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Pallava dynasty</p>", "option2": " <p style=\"orphans:0;widows:0\">    Chola dynasty</p>", "option3": " <p style=\"orphans:0;widows:0\">    Hoysala dynasty</p>", "option4": " <p style=\"orphans:0;widows:0\">    Rashtrakuta dynasty</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The architectural evolution of South Indian temples under the    Pallavas occurred across four distinct stages: (1) <b>Mahendra    Group</b> (c. 600–625 CE) characterized by simple rock-cut    pillared halls (mandapas); (2) <b>Mamalla Group</b> under    Narasimhavarman I (c. 625–674 CE) marked by monolithic    free-standing shrines carved out of single boulders, famously    known as the <i>Rathas</i> (e.g., Pancha Rathas at Mahabalipuram);    (3) <b>Rajasimha Group</b> under Narasimhavarman II (c. 700–728    CE) which initiated structural stone masonry temples, such as the    Shore Temple at Mamallapuram and the Kailasanathar Temple at    Kanchipuram; and (4) <b>Nandivarman Group</b> representing mature,    smaller structural temples (e.g., Vaikunta Perumal Temple). Hence,    the Pallavas uniquely capture this entire sequence of    architectural evolution.</p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"orphans:0;widows:0\">    <b>Under Section 106(1) of the Bharatiya Nyaya Sanhita, 2023    (BNS), what is the maximum punishment prescribed if the death of    any person is caused by a registered medical practitioner while    performing a medical procedure through a rash or negligent act?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Imprisonment up to 2 years and a fine</p>", "option2": " <p style=\"orphans:0;widows:0\">    Imprisonment up to 5 years and a fine</p>", "option3": " <p style=\"orphans:0;widows:0\">    Imprisonment up to 3 years, or fine, or both</p>", "option4": " <p style=\"orphans:0;widows:0\">    Imprisonment up to 1 year and a fine</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    According to Section 106(1) of the Bharatiya Nyaya Sanhita, 2023    (BNS), causing death by any rash or negligent act not amounting to    culpable homicide generally attracts imprisonment of either    description for a term that may extend up to 5 years, along with a    fine. However, a specific proviso reduces the maximum punishment    to imprisonment of up to 2 years and a fine if such an act is    committed by a registered medical practitioner while performing a    medical procedure.</p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"orphans:0;widows:0\">    <b>During strenuous exercise, anaerobic respiration leads to the    accumulation of lactic acid in skeletal muscles. Which organ is    primarily responsible for removing this lactic acid from the    bloodstream and converting it back into glucose?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Spleen</p>", "option2": " <p style=\"orphans:0;widows:0\">    Liver</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kidneys</p>", "option4": " <p style=\"orphans:0;widows:0\">    Heart</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    During vigorous muscular exercise, oxygen demand exceeds supply,    causing skeletal muscles to undergo anaerobic glycolysis, which    produces lactic acid. The accumulated lactic acid diffuses into    the bloodstream and is transported to the <b>liver</b>. In the    liver, it is converted back into pyruvate and then into glucose    via gluconeogenesis in a metabolic pathway known as the <b>Cori    cycle</b> (or lactic acid cycle).</p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"orphans:0;widows:0\">    <b>With reference to the British expansionist policy through the    'Subsidiary Alliance' system, which of the following statements is    INCORRECT?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    The French Governor Joseph François Dupleix was the first to    initiate the practice of providing European troops to native    rulers in return for subsidies.</p>", "option2": " <p style=\"orphans:0;widows:0\">    In 1801, the Nawab of Awadh was compelled to surrender more than    half of his territory for failing to pay the maintenance cost of    the subsidiary force.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Yashwantrao Holkar became the first Maratha ruler to accept the    Subsidiary Alliance following his victory at the Battle of    Hadapsar (1802).</p>", "option4": " <p style=\"orphans:0;widows:0\">    An allied Indian ruler was not permitted to declare war or conduct    diplomatic negotiations with any other state without the prior    approval of the British.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statement C is INCORRECT.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">After    Yashwantrao Holkar defeated the combined armies of Peshwa Baji Rao    II and Daulat Rao Scindia at the <b>Battle of Hadapsar</b>    (October 1802), it was <b>Peshwa Baji Rao II</b> who fled to    Bassein and signed the <b>Treaty of Bassein (31 December 1802)</b>,    thereby becoming the first Maratha leader to accept the Subsidiary    Alliance.</p>    <p style=\"orphans:0;widows:0\">Yashwantrao Holkar, far from    accepting the alliance, fiercely resisted British supremacy and    fought against them in the Second Anglo-Maratha War until    concluding the Treaty of Rajghat in December 1805.</p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>With reference to the constitutional provisions governing the    President and the Vice President of India, consider the following    statements:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1.    Nominated members of both Houses of Parliament do not participate    in the election of the President, but they participate in the    impeachment of the President.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2. The    election of a person as Vice President cannot be challenged on the    ground of the existence of any vacancy for whatever reason among    the members of the electoral college.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3. In the    election of the Vice President, the value of the vote of each    Member of Parliament is determined on the basis of the population    of the State they represent, similar to the Presidential election.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the statements given    above is/are </b><b>correct</b><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1 is correct:</b> Under Article 54, only elected    members of Parliament and State Legislative Assemblies form the    Electoral College for the President. However, under Article 61,    the impeachment resolution requires a majority of not less than    two-thirds of the total membership of the House, meaning nominated    members also participate.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2 is correct:</b> Under Article 71(4) (inserted by the 11th    Constitutional Amendment Act, 1961), the election of a person as    President or Vice President cannot be called in question on the    ground of the existence of any vacancy for whatever reason among    the members of the electoral college electing them.</p>    <p style=\"orphans:0;widows:0\"><b>Statement 3 is incorrect:</b>    The weighted system of calculating the value of votes based on    population applies only to the election of the President (Article    55) to ensure uniformity among states and parity between the Union    and the States. In the Vice-Presidential election (Article 66),    each Member of Parliament possesses one vote of equal value (value    = 1).</p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the legislative    powers of Parliament with respect to the State List:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    I:</b><b> Under Article 249, a resolution passed by the Rajya    Sabha empowering Parliament to legislate on a State subject    remains in force for a period not exceeding one year at a time.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    II:</b><b> A law enacted by Parliament on a State subject under    Article 252 (upon the request of two or more States) can    subsequently be amended or repealed by the State Legislature of an    adopting State.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the above statements    is/are </b><b>correct</b><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only Statement I is correct</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only Statement II is correct</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both Statements I and II are correct</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither Statement I nor II is correct</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement I is correct:</b> Under Article 249(2) of the Indian    Constitution, a resolution passed by the Rajya Sabha (by a    majority of not less than two-thirds of the members present and    voting) empowering Parliament to legislate on a State List subject    remains in force for a period not exceeding one year at a time. It    can be extended any number of times, but for not more than one    year at a time.</p>    <p style=\"orphans:0;widows:0\"><b>Statement II is incorrect:</b>    According to Article 252(2), any Act passed by Parliament with    respect to a State matter at the request of two or more States can    be amended or repealed only by an Act of Parliament; it <i>cannot</i>    be amended or repealed by an Act of the Legislature of that State.    The adopting States surrender their legislative competence on that    subject matter to Parliament.</p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Five-Year Plan in India was formulated under the guidance    of D. R. Gadgil with the twin objectives of 'growth with    stability' and 'progressive achievement of self-reliance', and    witnessed both the nationalisation of 14 major commercial banks    and the 1971 Indo-Pak war?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Third Five-Year Plan</p>", "option2": " <p style=\"orphans:0;widows:0\">    Fourth Five-Year Plan</p>", "option3": " <p style=\"orphans:0;widows:0\">    Fifth Five-Year Plan</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sixth Five-Year Plan</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct answer is the <b>Fourth Five-Year Plan</b>    (1969–1974).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Key details    of the Fourth Five-Year Plan:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Leadership    and Model:</b> Formulated under Prime Minister Indira Gandhi and    Planning Commission Deputy Chairman D. R. Gadgil; it also    operationalised the 'Gadgil Formula' for allocating central plan    assistance to states.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Core    Objectives:</b> 'Growth with stability' and 'progressive    achievement of self-reliance'.</p>    <p style=\"orphans:0;widows:0\"><b>Key Events:</b>    Nationalisation of 14 major commercial banks took place in July    1969, the Indo-Pak War of 1971 occurred during this plan, and the    Smiling Buddha (Pokhran-I) nuclear test took place in May 1974.</p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>With reference to the Ganges River Dolphin (</b><i><b>Platanista    gangetica</b></i><b>), consider the following statements:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    1:</b><b> It is granted the highest degree of legal protection    under Schedule I of the Wildlife (Protection) Act, 1972.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2:</b><b> It is officially classified as 'Critically Endangered'    on the IUCN Red List of Threatened Species.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the statements given    above is/are </b><b>correct</b><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only Statement 1</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only Statement 2</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both Statement 1 and Statement 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither Statement 1 nor Statement 2</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1 is correct:</b> The Ganges River Dolphin    (<i>Platanista gangetica</i>) is included under <b>Schedule I</b>    of the Wildlife (Protection) Act, 1972, granting it the highest    level of legal protection in India, with severe penalties    prescribed for poaching or harming it.</p>    <p style=\"orphans:0;widows:0\"><b>Statement 2 is incorrect:</b>    The Ganges River Dolphin is categorized as <b>Endangered (EN)</b>,    not 'Critically Endangered', on the IUCN Red List of Threatened    Species. It is also listed in Appendix I of CITES and was    recognized as the National Aquatic Animal of India in 2009.</p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"orphans:0;widows:0\">    <b>With reference to the Lunar Polar Exploration (LUPEX) mission,    which of the following statements is </b><b>correct</b><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    It is a joint initiative of ISRO and ESA aimed at exploring the    lunar equatorial plains.</p>", "option2": " <p style=\"orphans:0;widows:0\">    ISRO is responsible for the lunar rover, while JAXA is providing    the lander platform.</p>", "option3": " <p style=\"orphans:0;widows:0\">    It is a joint mission of ISRO and JAXA targeting the exploration    of water ice in the Moon's polar regions.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The mission is planned to be launched exclusively using ISRO's    Launch Vehicle Mark-3 (LVM3).</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Lunar Polar Exploration Mission (LUPEX) is a collaborative    robotic space mission between the Indian Space Research    Organisation (ISRO) and the Japan Aerospace Exploration Agency    (JAXA). Its primary objective is to explore the Moon's south pole    region to investigate the availability and quantity of water ice    reserves. Under the mission agreement, JAXA will provide the rover    and the H3 launch vehicle, whereas ISRO will provide the lander    module.</p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Which of the following statements is/are true?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>i. An    indifference curve is typically convex to the origin due to the    diminishing Marginal Rate of Substitution (MRS).</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>ii. The    Law of Variable Proportions operates in the long-run production    function where all inputs are variable.</b></p>    <p style=\"orphans:0;widows:0\"><b>iii. An isocost line shows all    combinations of two inputs that a firm can purchase for a given    total cost.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only i and iii</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only i</p>", "option3": " <p style=\"orphans:0;widows:0\">    Only ii and iii</p>", "option4": " <p style=\"orphans:0;widows:0\">    Only iii</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Statement i is correct because an indifference curve is convex to    the origin as a result of the diminishing Marginal Rate of    Substitution (MRS). Statement ii is incorrect because the Law of    Variable Proportions is a short-run production concept where some    inputs are fixed while others vary; the long run involves Returns    to Scale. Statement iii is correct because an isocost line    represents all combinations of two factors (e.g., labor and    capital) that can be bought with a given total expenditure at    given factor prices.</p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Which of the following statements is/are correct regarding    production theory in economics?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>i. An    isoquant represents all possible combinations of two inputs that    produce the same level of output.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>ii.    Returns to scale describe the behavior of output when all inputs    are increased simultaneously in the same proportion.</b></p>    <p style=\"orphans:0;widows:0\"><b>iii. In the short run, all    inputs of production can be varied freely to adjust the level of    output.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only i and ii</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only ii and iii</p>", "option3": " <p style=\"orphans:0;widows:0\">    Only i and iii</p>", "option4": " <p style=\"orphans:0;widows:0\">    i, ii and iii</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statement i is correct: An isoquant (equal-product curve) shows    various combinations of two inputs (like labour and capital) that    yield the exact same quantity of output.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Statement ii    is correct: Returns to scale examine the proportionate change in    output when all inputs are scaled up simultaneously by the same    proportion (a long-run concept).</p>    <p style=\"orphans:0;widows:0\">Statement iii is incorrect: In    the short run, at least one input of production (such as capital,    plant size, or land) remains fixed and cannot be varied freely;    only variable inputs (such as labour or raw materials) can be    adjusted.</p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate answer from the options given below    regarding Census 2011.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    1. </b><b>As per Census 2011, the population density of India was    382 persons per square kilometre, up from 325 in 2001.</b></p>    <p style=\"orphans:0;widows:0\"><b>Statement 2. </b><b>Among all    Indian states, Bihar recorded the highest population density in    Census 2011.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only statement 1 is correct.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only statement 2 is correct.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Neither statement 1 nor statement 2 is correct.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Both statements 1 and 2 are correct.</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Both statements are correct:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>Statement    1 is correct:</b> According to Census 2011, the population density    of India increased from 325 persons per sq. km in 2001 to 382    persons per sq. km in 2011, registering a growth of 17.5%.</p>    <p style=\"orphans:0;widows:0\">2. <b>Statement 2 is correct:</b>    Among the states, Bihar had the highest population density with    1,106 persons per sq. km, overtaking West Bengal (1,028 persons    per sq. km). Among Union Territories, the NCT of Delhi held the    highest population density (11,320 persons per sq. km).</p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0\">    <b>Under the New Industrial Policy announced in July 1991, the    number of industries reserved exclusively for the public sector    was reduced from 17 to:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    6</p>", "option2": " <p style=\"orphans:0;widows:0\">    8</p>", "option3": " <p style=\"orphans:0;widows:0\">    10</p>", "option4": " <p style=\"orphans:0;widows:0\">    12</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Under the Industrial Policy Resolution (IPR) of 1956, 17    industries were reserved exclusively for the public sector. With    the announcement of the New Industrial Policy on 24 July 1991 as    part of the LPG (Liberalisation, Privatisation, and Globalisation)    reforms, this list was drastically reduced from 17 to 8    industries. Over time, this was pruned further, leaving only    atomic energy and railway operations reserved for the public    sector.</p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"orphans:0;widows:0\">    <b>Inflation caused by a persistent rise in the costs of    production inputs—such as raw material prices, wages, or    imported energy—is classified as:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Demand-Pull Inflation</p>", "option2": " <p style=\"orphans:0;widows:0\">    Cost-Push Inflation</p>", "option3": " <p style=\"orphans:0;widows:0\">    Built-in Creeping Inflation</p>", "option4": " <p style=\"orphans:0;widows:0\">    Hyperinflation</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Cost-Push Inflation</b> is driven by supply-side disruptions.    Increases in input costs (like crude oil spikes or wage hikes)    force producers to raise end-product prices, leading to reduced    overall output alongside inflation (sometimes causing    <b>Stagflation</b>). Important Points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Demand-Pull    Inflation</b>: Triggered by high aggregate demand exceeding    economic capacity (\"too much money chasing too few goods\").</p>    <p style=\"orphans:0;widows:0\"><b>Stagflation</b>: High    inflation combined with stagnant economic growth and high    unemployment. Exam Alert: The <b>Head-line Inflation</b> rate in    India is based on the <b>Consumer Price Index (CPI-Combined)</b>,    with a target of <b>4% ± 2%</b> assigned to the RBI's Monetary    Policy Committee.</p>", "question_heading": ""}, {"sr_no": 64, "question": "  <p style=\"orphans:0;widows:0\">    <b>Which naturally occurring mineral, composed chemically of    lead(II) sulfide (</b><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793823928113_html_94300e2c98034718.gif\" > <b>),    typically crystallizes in the cubic crystal system and serves as    the principal ore of lead?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Cinnabar</p>", "option2": " <p style=\"orphans:0;widows:0\">    Galena</p>", "option3": " <p style=\"orphans:0;widows:0\">    Bauxite</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sphalerite</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    Galena is the primary ore mineral of lead, with the chemical    formula     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793823928113_html_94300e2c98034718.gif\" >     (lead(II) sulfide). It typically forms distinct cubic crystals    with octahedral truncations and exhibits a characteristic metallic    luster and high specific gravity. In contrast, Cinnabar is the ore    of mercury (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793823928113_html_b67d3744086b1f30.gif\" > ),    Sphalerite is the principal ore of zinc (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793823928113_html_602e5676b28d7c53.gif\" > ),    and Bauxite is the primary ore of aluminum.</p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding planetary and local    wind systems:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><i><b>Chinook</b></i><b>    is a warm, dry wind that blows down the eastern slopes of the    Rocky Mountains in North America.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><i><b>Harmattan</b></i><b>    is a dry, dusty trade wind blowing southwestwards from the Sahara    across West Africa, locally called \"The Doctor\".</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the statements given    above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only 1</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only 2</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both 1 and 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Both statements are correct. <b>Chinook</b> winds cause a rapid    rise in winter temperatures across the Canadian Prairies, earning    them the nickname \"<b>snow eaters</b>.\" The <b>Harmattan</b>    provides relief from the humid coastal weather in West Africa,    which is why it is called \"<b>the Doctor</b>.\"<br> <b>Important    points:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sirocco</b>:    A hot, dry, dusty wind that blows northward from the Sahara toward    the Mediterranean Sea.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Mistral:</b>    A cold, dry, northerly katabatic (downslope) wind that blows into    the Gulf of Lion in France.</p>    <p style=\"orphans:0;widows:0\"><b>Loo:</b> A hot and dry local    wind that blows across the northern plains of India during summer    afternoons.</p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Which of the following statements is/are correct?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statements:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1) The    direction of the magnetic field produced by a straight    current-carrying conductor can be determined using the Right-Hand    Thumb Rule.</b></p>    <p style=\"orphans:0;widows:0\"><b>2) The magnetic field inside a    long straight current-carrying solenoid is non-uniform and varies    significantly from point to point.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only Statement 1</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only Statement 2</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both Statements 1 and 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither Statement 1 nor 2</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statement 1 is correct: According to the Right-Hand Thumb Rule, if    you hold a straight current-carrying conductor in your right hand    such that your thumb points in the direction of the electric    current, then your fingers will curl in the direction of the    magnetic field lines.</p>    <p style=\"orphans:0;widows:0\">Statement 2 is incorrect: Inside    a long, straight, current-carrying solenoid, the magnetic field    lines are parallel straight lines, which indicates that the    magnetic field inside the solenoid is uniform (the same at all    points).</p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"orphans:0;widows:0\">    <b>World Social Justice Day is observed globally on 20 February    every year. What is the primary objective of the 2026 theme,    \"Renewed Commitment to Social Development and Social    Justice\"?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    To advocate for universal basic income as the only solution to    global poverty.</p>", "option2": " <p style=\"orphans:0;widows:0\">    To strengthen global solidarity in addressing systemic    inequalities and ensuring equitable access to opportunities.</p>", "option3": " <p style=\"orphans:0;widows:0\">    To focus exclusively on the impact of climate change on coastal    communities.</p>", "option4": " <p style=\"orphans:0;widows:0\">    To promote the privatization of public services as a means to    improve efficiency.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The primary objective of the 2026 theme, \"Renewed Commitment    to Social Development and Social Justice,\" is to translate    high-level political affirmations-specifically those arising from    the Second World Summit for Social Development and the Doha    Political Declaration-into concrete, measurable, and    cross-sectoral policy actions.</p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"orphans:0;widows:0\">    <b>What is the official theme for the International Day of Women    and Girls in Science 2026?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Empowering Women through Digital Literacy and Coding</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sustainable Development Goals: The Role of Women Scientists</p>", "option3": " <p style=\"orphans:0;widows:0\">    Closing the Gender Gap in Science and Technology</p>", "option4": "Sदnधनgप्रing AI, Sयciोि Sciधncध, STEM ोnक Finोncध: Bहiिकing Incिहौiॅध Fहपहनधौ ीयन Wयंधn ोnक Giिनस", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The International Day of Women and Girls in Science (IDWGIS),    observed annually on February 11, focuses on advocating for full    and equal access to and participation in science for women and    girls. The theme for the 2026 observance emphasizes a holistic,    interdisciplinary approach to tackling persistent gender    inequalities in scientific fields.</p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"orphans:0;widows:0\">    <b>The successful qualification level load test of the Drogue    Parachute for the Gaganyaan mission was conducted at which of the    following facilities?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Satish Dhawan Space Centre (SDSC), Sriharikota</p>", "option2": " <p style=\"orphans:0;widows:0\">    Vikram Sarabhai Space Centre (VSSC), Thiruvananthapuram</p>", "option3": " <p style=\"orphans:0;widows:0\">    Rail Track Rocket Sled (RTRS) facility of DRDO, Chandigarh</p>", "option4": " <p style=\"orphans:0;widows:0\">    Liquid Propulsion Systems Centre (LPSC), Mahendragiri</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Rail Track Rocket Sled (RTRS) facility, operated by the    Terminal Ballistics Research Laboratory (TBRL) under the DRDO, is    uniquely suited for such complex tests. It allows for    high-velocity simulation of deployment conditions that are    otherwise impossible to replicate in a wind tunnel.</p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"orphans:0;widows:0\">    <b>The Tetanus and Adult Diphtheria (Td) vaccine was recently    launched by Union Minister Shri J.P. Nadda at which prestigious    institute?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Indian Institute of Science (IISc), Bengaluru</p>", "option2": " <p style=\"orphans:0;widows:0\">    Central Research Institute (CRI), Kasauli</p>", "option3": " <p style=\"orphans:0;widows:0\">    All India Institute of Medical Sciences (AIIMS), New Delhi</p>", "option4": " <p style=\"orphans:0;widows:0\">    National Institute of Virology (NIV), Pune</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Union Minister for Health and Family Welfare, Shri J.P. Nadda,    launched the indigenously manufactured Tetanus and Adult    Diphtheria (Td) vaccine at the Central Research Institute (CRI) in    Kasauli, Himachal Pradesh, on February 21, 2026.</p>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
