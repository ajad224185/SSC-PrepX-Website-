<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>12.) ENGLISH + GK COMBINED TEST-3 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>हेलीकॉप्टर    मनी</span></span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span>जब कोई सरकार    एक बड़ा <b>राजकोषीय घाटा</b>    चलाती है और घरेलू वित्तीय    बाजारों से भारी उधार लेती    है</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>तो    उधार योग्य धन की मांग बढ़    जाती है</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>जिससे    बॉन्ड यील्ड और उधार दरें    बढ़ जाती हैं। उच्च उधार लागत    निजी कंपनियों के लिए पूंजी    परियोजनाओं को लाभहीन बना    देती है</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>जिससे    निजी निवेश </span></span>\"<span style=\"font-family:'Nirmala UI'\"><span>क्राउड    आउट</span></span>\" <span style=\"font-family:'Nirmala UI'\"><span>हो    जाता है।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)    </b><span style=\"font-family:'Nirmala UI'\"><span><b>क्राउडिंग    आउट प्रभाव</b></span></span>: <span style=\"font-family:'Nirmala UI'\"><span>सही।    ब्याज दरों में वृद्धि के    माध्यम से भारी सरकारी उधार    और निजी पूंजी व्यय के बीच    विपरीत संबंध।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) </b><span style=\"font-family:'Nirmala UI'\"><span><b>पंप    प्राइमिंग</b></span></span>: <span style=\"font-family:'Nirmala UI'\"><span>मंदी    के दौरान लक्षित प्रारंभिक    सरकारी खर्च जिसका उद्देश्य    निजी मांग को प्रोत्साहित    करना और आत्मनिर्भर आर्थिक    सुधार को शुरू करना होता है।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c)    </b><span style=\"font-family:'Nirmala UI'\"><span><b>राजकोषीय    खिंचाव</b></span></span>: <span style=\"font-family:'Nirmala UI'\"><span>समग्र    मांग पर स्वचालित अंकुश जब    नाममात्र आय वृद्धि करदाताओं    को उच्च प्रगतिशील आयकर    ब्रैकेट में धकेल देती है    बिना वास्तविक क्रय शक्ति family:'Nirmala UI'\"><span>राजस्थान    की पारंपरिक <b>स्ट्रिंग    कठपुतली</b></span></span>, <span style=\"font-family:'Nirmala UI'\"><span>जो    आम की लकड़ी से बनी होती है    और जिसमें पैर नहीं होते तथा    इसे चमकीले राजस्थानी परिधान    में सजाया जाता है।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B. </b><span style=\"font-family:'Nirmala UI'\"><span><b>थोलू    बोम्मलटा </b></span></span><b>(4)</b>: <span style=\"font-family:'Nirmala UI'\"><span>आंध्र    प्रदेश की पारंपरिक <b>शैडो    कठपुतली</b></span></span>, <span style=\"font-family:'Nirmala UI'\"><span>जिसमें    बड़े पारदर्शी रंगीन चमड़े    की कठपुतलियों को स्क्रीन    पर प्रोजेक्ट किया जाता है।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C.    </b><span style=\"font-family:'Nirmala UI'\"><span><b>पावाकूथु    </b></span></span><b>(1)</b>: <span style=\"font-family:'Nirmala UI'\"><span>केरल    की पारंपरिक <b>ग्लव कठपुतली</b></span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>जो कथकली    वेशभूषा और हेडगियर से प्रभावित    होती है।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>D. </b><span style=\"font-family:'Nirmala UI'\"><span><b>यमपुरी    </b></span></span><b>(3)</b>: <span style=\"font-family:'Nirmala UI'\"><span>बिहार    की पारंपरिक <b>रॉड कठपुतली</b></span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>जो जोड़ों    के बिना लकड़ी के एक ही टुकड़े    से बनी होती है।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><u><b>महत्वपूर्ण    बिंदु</b></u></span></span><b>:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>तोगलु    गोम्बेयट्टा</b> </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>कर्नाटक</span></span>)    <span style=\"font-family:'Nirmala UI'\"><span>और <b>रावणछाया</b>    </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>ओडिशा</span></spa हायता हस्तांतरित करती है    ताकि घरेलू पोषण</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>स्वास्थ्य    देखभाल और आर्थिक स्वायत्तता    को सहायता मिल सके।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a)    </b><span style=\"font-family:'Nirmala UI'\"><span><b>छत्तीसगढ़</b></span></span>:    <span style=\"font-family:'Nirmala UI'\"><span><b>महतारी    वंदन योजना</b> लागू करता है    </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>विवाहित    महिलाओं को ₹</span></span>1,000/<span style=\"font-family:'Nirmala UI'\"><span>माह    प्रदान करना</span></span>)<span style=\"font-family:'Nirmala UI'\"><span>।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) </b><span style=\"font-family:'Nirmala UI'\"><span><b>झारखंड</b></span></span>:    <span style=\"font-family:'Nirmala UI'\"><span>सही।    <b>मुख्यमंत्री मैया सम्मान    योजना</b> लागू करता है </span></span>(18-50    <span style=\"font-family:'Nirmala UI'\"><span>वर्ष की    महिलाओं को कवर करना</span></span>)<span style=\"font-family:'Nirmala UI'\"><span>।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>c) </b><span style=\"font-family:'Nirmala UI'\"><span><b>मध्य    प्रदेश</b></span></span>: <span style=\"font-family:'Nirmala UI'\"><span><b>मुख्यमंत्री    लाडली बहना योजना</b> लागू करता    है </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>पात्र    महिलाओं को ₹</span></span>1,500/<span style=\"font-family:'Nirmala UI'\"><span>माह    प्रदान करना</span></span>)<span style=\"font-family:'Nirmala UI'\"><span>।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>d) </b><span style=\"font-family:'Nirmala UI'\"><span><b>ओडिशा</b></span></span>:    <span style=\"font-family:'Nirmala UI'\"><span><b>सुभद्रा    योजना</b> लागू करता है </span></span>(21-60    <span style=\"font-family:'Nirmala UI'\"><span>वर्ष की    महिलाओं को प्रत्येक ₹</span></span>5,000    <span style=\"font-family:'Nirmala UI'\ font-family:'Nirmala UI'\"><span><b>सूची</b></span></span><b>-II:    </b>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A.    </b><span style=\"font-family:'Nirmala UI'\"><span><b>होजागिरी    नृत्य</b></span></span><b>, 1. </b><span style=\"font-family:'Nirmala UI'\"><span><b>उत्तराखंड</b></span></span><b>,</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B.    </b><span style=\"font-family:'Nirmala UI'\"><span><b>बथुकम्मा    उत्सव</b></span></span><b>, 2. </b><span style=\"font-family:'Nirmala UI'\"><span><b>त्रिपुरा</b></span></span><b>,</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C.    </b><span style=\"font-family:'Nirmala UI'\"><span><b>नोंगक्रेम    नृत्य उत्सव</b></span></span><b>, 3. </b><span style=\"font-family:'Nirmala UI'\"><span><b>तेलंगाना</b></span></span></p>    <p style=\"orphans:0;widows:0\"><b>D. </b><span style=\"font-family:'Nirmala UI'\"><span><b>छोलिया    नृत्य </b></span></span><b>4. </b><span style=\"font-family:'Nirmala UI'\"><span><b>मेघालय</b></span></span><b>.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    A-2, B-3, C-4, D-1</p>", "option2": " <p style=\"orphans:0;widows:0\">    A-3, B-2, C-4, D-1</p>", "option3": " <p style=\"orphans:0;widows:0\">    A-2, B-4, C-3, D-1</p>", "option4": " <p style=\"orphans:0;widows:0\">    A-1, B-3, C-4, D-2</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span>प्रत्येक    पारंपरिक लोक नृत्य और    क्षेत्रीय उत्सव अपने मूल    भारतीय राज्य की स्वदेशी    जनजातीय परंपराओं</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>मौसमी कृषि    चक्रों या मार्शल विरासत को    दर्शाता है।</span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A.    </b><span style=\"font-family:'Nirmala UI'\"><span><b>होजागिरी    नृत्य </b></span></span><b>(2)</b>: <span style=\"font-family:'Nirmala UI'\">< solution_text": " <p style=\"orphans:0;widows:0\">    The phrasal verb 'lag behind' means to move or develop more slowly    than others. Thus, 'behind' is the most appropriate preposition to    complete blank (1).</p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, some of the words in the passage have    been left out. Read the passage carefully and choose the correct    word for each blank, out of the four alternatives and fill in the    blanks.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">After lagging    consistently ________ (1) global peers for a major part of the    year, domestic industrial growth has ________ (2) somewhat over    the last quarter. Output has expanded by almost 6% from its lowest    levels ________ (3) in March. Even with this recent resurgence,    overall manufacturing is still below the targets set earlier in    the year. The factory output has been closely ________ (4) to    domestic power supply stability. This makes sense, as thermal    generation accounts for more than 70% of total energy consumption.    Industrial activity stalled when severe coal shortages struck    earlier this year, an issue that persisted until mid-April. Since    then, as coal supplies have improved, industrial production has    ________ (5) across major manufacturing hubs.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">What should come in blank (2) ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    hollow</p>", "option2": " <p style=\"orphans:0;widows:0\">    aspect</p>", "option3": " <p style=\"orphans:0;widows:0\">    praise</p>", "option4": " <p style=\"orphans:0;widows:0\">    rebounded</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage describes a recovery in growth following a period of    decline. The verb 'rebounded' correctly fits the present perfect    construction ('has rebounded') and means recovered or bounced    back.</p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, some of the words in the passage have    been left out. Read the passage carefully and choose the correct    word for each blank, out of the four alternatives and fill in the    blanks.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">After lagging    consistently ________ (1) global peers for a major part of the    year, domestic industrial growth has ________ (2) somewhat over    the last quarter. Output has expanded by almost 6% from its lowest    levels ________ (3) in March. Even with this recent resurgence,    overall manufacturing is still below the targets set earlier in    the year. The factory output has been closely ________ (4) to    domestic power supply stability. This makes sense, as thermal    generation accounts for more than 70% of total energy consumption.    Industrial activity stalled when severe coal shortages struck    earlier this year, an issue that persisted until mid-April. Since    then, as coal supplies have improved, industrial production has    ________ (5) across major manufacturing hubs.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">What should come in blank (3) ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    recorded</p>", "option2": " <p style=\"orphans:0;widows:0\">    beyond</p>", "option3": " <p style=\"orphans:0;widows:0\">    display</p>", "option4": " <p style=\"orphans:0;widows:0\">    deliver</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The past participle 'recorded' appropriately modifies 'levels',    indicating the statistical low points observed in March.</p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, some of the words in the passage have    been left out. Read the passage carefully and choose the correct    word for each blank, out of the four alternatives and fill in the    blanks.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">After lagging    consistently ________ (1) global peers for a major part of the    year, domestic industrial growth has ________ (2) somewhat over    the last quarter. Output has expanded by almost 6% from its lowest    levels ________ (3) in March. Even with this recent resurgence,    overall manufacturing is still below the targets set earlier in    the year. The factory output has been closely ________ (4) to    domestic power supply stability. This makes sense, as thermal    generation accounts for more than 70% of total energy consumption.    Industrial activity stalled when severe coal shortages struck    earlier this year, an issue that persisted until mid-April. Since    then, as coal supplies have improved, industrial production has    ________ (5) across major manufacturing hubs.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">What should come in blank (4) ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    politely</p>", "option2": " <p style=\"orphans:0;widows:0\">    formally</p>", "option3": " <p style=\"orphans:0;widows:0\">    linked</p>", "option4": " <p style=\"orphans:0;widows:0\">    loosely</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passive construction 'has been closely ______ to' requires a    past participle indicating connection or association. 'Linked' is    the correct choice, indicating that factory output depends on    power supply stability.</p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, some of the words in the passage have    been left out. Read the passage carefully and choose the correct    word for each blank, out of the four alternatives and fill in the    blanks.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">After lagging    consistently ________ (1) global peers for a major part of the    year, domestic industrial growth has ________ (2) somewhat over    the last quarter. Output has expanded by almost 6% from its lowest    levels ________ (3) in March. Even with this recent resurgence,    overall manufacturing is still below the targets set earlier in    the year. The factory output has been closely ________ (4) to    domestic power supply stability. This makes sense, as thermal    generation accounts for more than 70% of total energy consumption.    Industrial activity stalled when severe coal shortages struck    earlier this year, an issue that persisted until mid-April. Since    then, as coal supplies have improved, industrial production has    ________ (5) across major manufacturing hubs.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">What should come in blank (5) ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    accelerated</p>", "option2": " <p style=\"orphans:0;widows:0\">    concluding</p>", "option3": " <p style=\"orphans:0;widows:0\">    sequence</p>", "option4": " <p style=\"orphans:0;widows:0\">    balance</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In the present perfect tense ('has ______'), a past participle is    needed. 'Accelerated' means sped up or increased in pace, which    fits the context of production picking up after coal shortages    eased.</p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The following sentence has been divided into four parts. Identify    the part which contains a grammatical error.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">If there is    no error in the sentence, then select 'No Error'.</p>    <p style=\"orphans:0;widows:0\">The charity drive has collected    more (A) two million dollars (B) to provide clean drinking water    (C) to remote villages (D).</p>", "option1": "<p style=\"orphans:0;widows:0\">    B</p>", "option2": " <p style=\"orphans:0;widows:0\">    A</p>", "option3": " <p style=\"orphans:0;widows:0\">    D</p>", "option4": " <p style=\"orphans:0;widows:0\">    C</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The error lies in part (A) of the sentence. The prepositional    comparative phrase 'more than' must be used before a numerical    amount to mean 'greater than'. Using just 'more' before a number    without 'than' is grammatically incorrect. Hence, 'more' should be    replaced with 'more than'.</p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Given below are four jumbled parts of a sentence. Select the    option that gives their correct order.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A) across    several emerging economies</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B) has played    a crucial role in improving</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C) the rapid    expansion of public healthcare infrastructure</p>    <p style=\"orphans:0;widows:0\">D) life expectancy rates among    vulnerable populations</p>", "option1": "<p style=\"orphans:0;widows:0\">    CABD</p>", "option2": " <p style=\"orphans:0;widows:0\">    CBAD</p>", "option3": " <p style=\"orphans:0;widows:0\">    ACBD</p>", "option4": " <p style=\"orphans:0;widows:0\">    BCDA</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct order is <b>CABD</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>C</b>    serves as the subject noun phrase: <i>'the rapid expansion of    public healthcare infrastructure'</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>A</b>    acts as the prepositional phrase specifying the location of this    expansion: <i>'across several emerging economies'</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. <b>B</b>    introduces the main predicate/verb phrase: <i>'has played a    crucial role in improving'</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. <b>D</b>    supplies the object of the preposition 'improving': <i>'life    expectancy rates among vulnerable populations'</i>.</p>    <p style=\"orphans:0;widows:0\">When combined, the sentence reads    meaningfully: <i>\"The rapid expansion of public healthcare    infrastructure across several emerging economies has played a    crucial role in improving life expectancy rates among vulnerable    populations.\"</i></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct passive form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The municipal corporation    demolished several illegal structures along the highway. Even the    old boundary wall has been pulled down.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Several illegal structures along the highway had been demolished    by the municipal corporation. Even the old boundary wall had been    pulled down.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Several illegal structures along the highway were demolished by    the municipal corporation. Even the old boundary wall has been    pulled down.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Several illegal structures along the highway have been demolished    by the municipal corporation. Even the old boundary wall was    pulled down.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The municipal corporation, being demolished several illegal    structures along the highway, also pulled down the old boundary    wall.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence contains two parts: the first part is in the    Simple Past tense (Active Voice), and the second part is already    in the Present Perfect tense (Passive Voice).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Rule for    Simple Past Active to Passive: <b>Object + was/were + V3 + by +    Subject</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- In the    first sentence, the object 'several illegal structures along the    highway' is plural, so it takes 'were demolished'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- The second    sentence ('Even the old boundary wall has been pulled down.') is    already in the passive voice, so it remains unchanged.</p>    <p style=\"orphans:0;widows:0\">Combining both correctly yields:    'Several illegal structures along the highway were demolished by    the municipal corporation. Even the old boundary wall has been    pulled down.' Hence, option B is correct.</p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Given below are four jumbled sentences. Select the option that    gives their correct order.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A. Yet, Costa    Rica presents a remarkable contrast, dedicating over a quarter of    its land area to national parks and reserves.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B. Rapid    urban development across the globe has severely threatened natural    habitats.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C. Such    uncontrolled expansion often reduces vast forests into small,    fragmented green zones.</p>    <p style=\"orphans:0;widows:0\">D. In these protected havens,    rich biodiversity continues to flourish without the fear of    encroachment.</p>", "option1": "<p style=\"orphans:0;widows:0\">    BCAD</p>", "option2": " <p style=\"orphans:0;widows:0\">    BCDA</p>", "option3": " <p style=\"orphans:0;widows:0\">    CBAD</p>", "option4": " <p style=\"orphans:0;widows:0\">    ACDB</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct logical order is <b>BCAD</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Sentence <b>B</b>    introduces the general topic and the overarching issue: the threat    posed to natural habitats by rapid urban development.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Sentence <b>C</b>    follows <b>B</b> directly because \"Such uncontrolled    expansion\" refers back to the \"rapid urban development\"    mentioned in B, explaining its negative impact.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Sentence <b>A</b>    introduces an exception using the contrast marker \"Yet\",    presenting Costa Rica as a nation that has preserved its land.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Sentence <b>D</b>    concludes the paragraph by describing what happens \"In these    protected havens\", directly linking back to the \"national    parks and reserves\" introduced in sentence A.</p>    <p style=\"orphans:0;widows:0\">Therefore, the sequence <b>BCAD</b>    forms a coherent paragraph.</p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate antonym of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Gregarious</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Sociable</p>", "option2": " <p style=\"orphans:0;widows:0\">    Affable</p>", "option3": " <p style=\"orphans:0;widows:0\">    Reclusive</p>", "option4": " <p style=\"orphans:0;widows:0\">    Amicable</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>'Gregarious'</b> means fond of company; sociable and    outgoing.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>'Reclusive'</b>    means avoiding the company of other people; solitary. Thus, it is    the exact antonym.</p>    <p style=\"orphans:0;widows:0\">- <b>'Sociable'</b>, <b>'Affable'</b>,    and <b>'Amicable'</b> are synonyms or closely related in meaning    to being friendly and social.</p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, out of the four alternatives, choose    the one which best expresses the meaning of the given idiom.</p>    <p style=\"orphans:0;widows:0\"><b>Tilt at windmills</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    To fight imaginary enemies or pursue impractical and futile goals</p>", "option2": " <p style=\"orphans:0;widows:0\">    To adopt innovative and sustainable methods for modern industries</p>", "option3": " <p style=\"orphans:0;widows:0\">    To confront a powerful adversary with courage and determination</p>", "option4": " <p style=\"orphans:0;widows:0\">    To instigate unnecessary hostility among peaceful neighbors</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The idiom <b>'tilt at windmills'</b> originates from Miguel de    Cervantes' novel <i>Don Quixote</i>, where the protagonist attacks    windmills believing them to be giants. It means to fight against    imaginary enemies or engage in futile, hopelessly impractical    pursuits. Hence, option A is the correct answer.</p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct direct form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The inspector asked the guard    whether he had seen anyone suspicious near the premises the    previous night.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The inspector said to the guard, \"Had you seen anyone    suspicious near the premises last night?\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    The inspector said to the guard, \"Have you seen anyone    suspicious near the premises the previous night?\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    The inspector said to the guard, \"Did you see anyone    suspicious near the premises last night?\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    The inspector said to the guard, \"Did you see anyone    suspicious near the premises the previous night?\"</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the indirect speech into direct speech, we follow these    rules:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    reporting verb <b>asked</b> is replaced by <b>said to</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. The    conjunction <b>whether</b> is removed and replaced by question    word order with inverted auxiliary verb.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. The past    perfect tense (<b>had seen</b>) accompanied by a definite past    time expression corresponds to the simple past tense (<b>Did you    see</b>) in direct speech.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. The time    expression <b>the previous night</b> changes back to <b>last    night</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">5. The    pronoun <b>he</b> changes to the second-person pronoun <b>you</b>.</p>    <p style=\"orphans:0;widows:0\">Hence, option C is the correct    direct form.</p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate synonym of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>SPURIOUS</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Apocryphal</p>", "option2": " <p style=\"orphans:0;widows:0\">    Veritable</p>", "option3": " <p style=\"orphans:0;widows:0\">    Authentic</p>", "option4": " <p style=\"orphans:0;widows:0\">    Legitimate</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>'Spurious'</b> means not being what it purports to be;    false, fake, or of doubtful origin.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>'Apocryphal'</b>    refers to something of doubtful authenticity or spurious nature,    making it the most appropriate synonym.</p>    <p style=\"orphans:0;widows:0\">The other options—<i>Veritable</i>    (true, real), <i>Authentic</i> (genuine), and <i>Legitimate</i>    (valid, genuine)—are antonyms of the given word.</p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to substitute the underlined    segment in the given sentence. If there is no need to substitute    it, select 'No substitution required'.</p>    <p style=\"orphans:0;widows:0\">The enterprise must overhaul its    manufacturing process <u>if it will remain</u> viable in the    international market.</p>", "option1": "<p style=\"orphans:0;widows:0\">    if it would remain</p>", "option2": " <p style=\"orphans:0;widows:0\">    if it is to remain</p>", "option3": " <p style=\"orphans:0;widows:0\">    if it will be remaining</p>", "option4": " <p style=\"orphans:0;widows:0\">    No substitution required</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>if it is to remain</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In English    grammar, the modal auxiliary 'will' is generally avoided in    conditional 'if-clauses'. When the clause expresses a    prerequisite, purpose, or intended goal (meaning 'if the    intention/requirement is to...'), the formal construction <b>'if +    subject + is/are/am + to-infinitive'</b> is used.</p>    <p style=\"orphans:0;widows:0\">Hence, <i>'if it will remain'</i>    should be replaced with <i>'if it is to remain'</i>.</p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0\">    Select the incorrectly spelt word out of the given alternatives.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Connoisseur</p>", "option2": " <p style=\"orphans:0;widows:0\">    Desiccate</p>", "option3": " <p style=\"orphans:0;widows:0\">    Geneology</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sacrilegious</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The incorrectly spelt word is <b>Geneology</b>. The correct    spelling is <b>Genealogy</b>, which means the study of families,    lineage, and ancestry. It is a common error to spell it with    '-ology' (like biology or geology), but it correctly ends in    '-alogy'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the correctly spelt words:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">•    <b>Connoisseur</b>: an expert judge in matters of taste or the    fine arts.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">•    <b>Desiccate</b>: to dry up thoroughly or remove all moisture.</p>    <p style=\"orphans:0;widows:0\">• <b>Sacrilegious</b>:    violating or treating with disrespect what is regarded as sacred.</p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to substitute the underlined    segment in the given sentence. If there is no need to substitute    it, select 'No substitution required'.</p>    <p style=\"orphans:0;widows:0\">The elderly scholar sat <u>besides    the dusty cabinet, beside which was stacked</u> several rare    manuscripts.</p>", "option1": "<p style=\"orphans:0;widows:0\">    beside the dusty cabinet, beside which was stacked</p>", "option2": " <p style=\"orphans:0;widows:0\">    beside the dusty cabinet, beside which were stacked</p>", "option3": " <p style=\"orphans:0;widows:0\">    besides the dusty cabinet, beside which were stacked</p>", "option4": " <p style=\"orphans:0;widows:0\">    No substitution required</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>beside the dusty cabinet, beside which    were stacked</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">There are two    errors in the underlined segment:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Preposition    error:</b> 'Beside' means 'at the side of' or 'next to', whereas    'besides' means 'in addition to' or 'apart from'. Since the    sentence refers to sitting next to the cabinet (physical    position), <b>beside</b> must be used instead of <b>besides</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Subject-verb    agreement in inverted word order:</b> In the relative clause    <i>\"beside which was stacked several rare manuscripts\"</i>,    the prepositional phrase is fronted, causing subject-verb    inversion. The true grammatical subject is the plural noun phrase    <b>several rare manuscripts</b>, which requires the plural    auxiliary verb <b>were</b> rather than the singular <b>was</b>.</p>    <p style=\"orphans:0;widows:0\">Hence, the correct segment is    <i>\"beside the dusty cabinet, beside which were stacked\"</i>.</p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words.</p>    <p style=\"orphans:0;widows:0\">An extreme and irrational fear of    growing old or aging</p>", "option1": "<p style=\"orphans:0;widows:0\">    Chronophobia</p>", "option2": " <p style=\"orphans:0;widows:0\">    Thanatophobia</p>", "option3": " <p style=\"orphans:0;widows:0\">    Gerascophobia</p>", "option4": " <p style=\"orphans:0;widows:0\">    Gerontophobia</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitute is <b>Gerascophobia</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Gerascophobia:</b>    An irrational and persistent fear of growing old or aging (derived    from the Greek 'geras' meaning old age and 'phobos' meaning fear).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Chronophobia:</b>    An irrational fear of time and the passage of time.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Thanatophobia:</b>    An intense or irrational fear of death or dying.</p>    <p style=\"orphans:0;widows:0\"><b>Gerontophobia:</b> An abnormal    fear or dislike of elderly people.</p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0\">    Select the correctly spelt word out of the four alternatives.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Surveilance</p>", "option2": " <p style=\"orphans:0;widows:0\">    Survaillance</p>", "option3": " <p style=\"orphans:0;widows:0\">    Surveillance</p>", "option4": " <p style=\"orphans:0;widows:0\">    Surveillence</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The correctly spelt word is <b>Surveillance</b>, which means close    observation, especially of a suspected spy or criminal.</p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Even in the face of imminent    defeat, the commander maintained an ________ calm that inspired    his weary troops to hold the line.</p>", "option1": "<p style=\"orphans:0;widows:0\">    ephemeral</p>", "option2": " <p style=\"orphans:0;widows:0\">    irascible</p>", "option3": " <p style=\"orphans:0;widows:0\">    imperturbable</p>", "option4": " <p style=\"orphans:0;widows:0\">    ostentatious</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct word is <b>imperturbable</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Imperturbable</b>    means unable to be upset or excited; calm and composed even in    difficult situations. The sentence describes a commander who    remained completely calm and composed despite the threat of    defeat, inspiring his soldiers.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Ephemeral:</b>    lasting for a very short time; fleeting.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Irascible:</b>    having or showing a tendency to be easily angered; irritable.</p>    <p style=\"orphans:0;widows:0\"><b>Ostentatious:</b>    characterized by pretentious or showy display designed to impress.</p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct indirect form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">“Do you really think you can    manage the business better than your uncle?” scoffed his aunt.</p>", "option1": "<p style=\"orphans:0;widows:0\">    His aunt scoffed that did he really think he could manage the    business better than his uncle.</p>", "option2": " <p style=\"orphans:0;widows:0\">    His aunt scoffed and asked if he really thought he could manage    the business better than his uncle.</p>", "option3": " <p style=\"orphans:0;widows:0\">    His aunt scoffed and asked whether he really thinks he can manage    the business better than his uncle.</p>", "option4": " <p style=\"orphans:0;widows:0\">    His aunt scoffed and asked if had he really thought he could    manage the business better than his uncle.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the given direct interrogative sentence into indirect    speech, follow these rules:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    reporting verb 'scoffed' introduces a question, so it is changed    to 'scoffed and asked'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. For a    yes/no question starting with an auxiliary verb ('Do'), the    conjunction 'if' or 'whether' is used.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. The    sentence structure changes from interrogative to assertive    (subject comes before the verb).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Tenses    change from present to past: 'Do you really think' (simple    present) becomes 'he really thought' (simple past), and 'can    manage' becomes 'could manage'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">5. Pronouns    are updated: 'you' becomes 'he', and 'your' becomes 'his'.</p>    <p style=\"orphans:0;widows:0\">Therefore, option B is the    correct indirect form.</p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Choose the option that contains the homonym of the highlighted    word in the given sentence.</p>    <p style=\"orphans:0;widows:0\">The construction crew used a    massive <b>crane</b> to lift the heavy steel beams onto the    high-rise building.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The operator carefully maneuvered the hydraulic crane to avoid    hitting any overhead power lines.</p>", "option2": " <p style=\"orphans:0;widows:0\">    A tall white crane stood motionless in the shallow waters of the    marsh, searching for fish.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The site manager rented an additional mobile crane to speed up the    unloading process.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Before assembling the tower crane, engineers thoroughly inspected    the concrete foundation for safety.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    A <b>homonym</b> is a word that shares the same spelling and    pronunciation as another word but has a completely different    meaning.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In the given    sentence, <b>crane</b> refers to a large machine with a long arm    used for lifting and moving heavy weights.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In <b>Option    B</b>, <b>crane</b> refers to a tall, long-legged and long-necked    wading bird. Since it has the same spelling and pronunciation but    a distinct meaning, it is the homonym of the word in the sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In options A,    C, and D, <b>crane</b> is used in the identical sense of an    industrial lifting machine.</p>    <p style=\"orphans:0;widows:0\">Therefore, <b>Option B</b> is the    correct answer.</p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that gives the most appropriate meaning of the    given idiom.</p>    <p style=\"orphans:0;widows:0\"><b>To sow dragon's teeth</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    To face an insurmountable problem with resilience</p>", "option2": " <p style=\"orphans:0;widows:0\">    To take actions that incite future discord or conflict</p>", "option3": " <p style=\"orphans:0;widows:0\">    To harbor unrealistic ambitions of grandeur</p>", "option4": " <p style=\"orphans:0;widows:0\">    To defeat an enemy by turning their allies against them</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The idiom <b>'To sow dragon's teeth'</b> means to take steps or    act in a way that fosters future trouble, strife, or disastrous    conflict. The phrase originates from Greek mythology (the legends    of Cadmus and Jason), where teeth of a dragon sown into the soil    sprang up as fully armed warriors who immediately fought each    other. Hence, option B correctly expresses the meaning.</p>", "question_heading": ""}, {"sr_no": 48, "question": "Giॅधn ृिधयथ ोनध ीयहन ुहंृिधक ूोनपौ यी ो ौधnपधncध. Sिधधcप पुध यूपiयn पुोप giॅधौ पुधiन cयननधcप यनकधन. A) पय ौदnपुधौप्रध ॅोौप ोंयहnपौ यी हncहनोपधक कोपो B) पुध cहपपing-धकgध कiोgnयौपic ोिgयनiपुं कधंयnौपनोपधक C) ोn हnूनधcधकधnपधक ोृiिiपद nयप यnिद D) ृहप ोिसय पय iकधnपiीद ौहृिपध ूोपुिययgicोि ोnयंोिiधौ", "option1": "<p style=\"orphans:0;widows:0\">    BACD</p>", "option2": " <p style=\"orphans:0;widows:0\">    BCAD</p>", "option3": " <p style=\"orphans:0;widows:0\">    CBDA</p>", "option4": " <p style=\"orphans:0;widows:0\">    ADBC</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct order is <b>BCAD</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Part <b>B</b>    introduces the subject and the main transitive verb: <i>'the    cutting-edge diagnostic algorithm demonstrated'</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Part <b>C</b>    provides the direct object of the verb along with the first part    of the correlative conjunction: <i>'an unprecedented ability not    only'</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Part <b>A</b>    provides the first parallel infinitive phrase: <i>'to synthesize    vast amounts of uncurated data'</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Part <b>D</b>    completes the correlative pair with <i>'but also'</i> and the    second parallel infinitive: <i>'but also to identify subtle    pathological anomalies'</i>.</p>    <p style=\"orphans:0;widows:0\">Thus, the complete coherent    sentence is: <i>'The cutting-edge diagnostic algorithm    demonstrated an unprecedented ability not only to synthesize vast    amounts of uncurated data but also to identify subtle pathological    anomalies.'</i></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct indirect form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The sergeant said to the    soldiers, “Do not advance any further until you receive clear    orders from headquarters.”</p>", "option1": "<p style=\"orphans:0;widows:0\">    The sergeant ordered the soldiers not to advance any further until    they received clear orders from headquarters.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The sergeant forbade the soldiers not to advance any further until    they received clear orders from headquarters.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The sergeant ordered the soldiers to not advance any further until    they receive clear orders from headquarters.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The sergeant told the soldiers that they should not advance any    further until they receive clear orders from headquarters.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Rules for converting negative imperative sentences into indirect    speech:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb ‘said to’ changes to ‘ordered’ or ‘commanded’    depending on the context/authority.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The negative    imperative ‘Do not + verb’ changes to ‘not to + verb’    (‘not to advance’).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">If ‘forbade’    is used, ‘not’ is not used because ‘forbade’ is already    negative; hence, option B is incorrect due to the double negative    (‘forbade ... not to’).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Pronouns and    tenses in the subordinate clause change accordingly: the second    person pronoun ‘you’ changes to ‘they’, and the present    simple verb ‘receive’ changes to the past simple ‘received’.    This eliminates options C and D.</p>    <p style=\"orphans:0;widows:0\">Therefore, option A is the    correct indirect form.</p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct active form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">Could the intricate blueprints of    the suspension bridge have been tampered with by any unauthorized    technician prior to the inspection?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Could any unauthorized technician have tampered with the intricate    blueprints of the suspension bridge prior to the inspection?</p>", "option2": " <p style=\"orphans:0;widows:0\">    Could any unauthorized technician tamper with the intricate    blueprints of the suspension bridge prior to the inspection?</p>", "option3": " <p style=\"orphans:0;widows:0\">    Had any unauthorized technician tampered with the intricate    blueprints of the suspension bridge prior to the inspection?</p>", "option4": " <p style=\"orphans:0;widows:0\">    Would any unauthorized technician have tampered with the intricate    blueprints of the suspension bridge prior to the inspection?</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is an interrogative sentence in the passive    voice using a modal perfect construction: <i>Modal (Could) +    Subject + have + been + V3 (tampered with) + by + Agent...?</i></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">To convert    this structure into the active voice, follow the rule:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Modal    (Could) + Subject (Agent) + have + V3 (tampered with) + Object +    ...?</b></p>    <p style=\"orphans:0;widows:0\">Applying this rule yields: <i>Could    any unauthorized technician have tampered with the intricate    blueprints of the suspension bridge prior to the inspection?</i>    Thus, option A is correct.</p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct direct form of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">The detective asked the stranger    what he was doing behind the bushes at that hour and why he had    not answered when called.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The detective said to the stranger, “What are you doing behind    the bushes at this hour, and why didn't you answer when called?”</p>", "option2": " <p style=\"orphans:0;widows:0\">    The detective said to the stranger, “What were you doing behind    the bushes at that hour, and why hadn't you answered when called?”</p>", "option3": " <p style=\"orphans:0;widows:0\">    The detective asked to the stranger, “What are you doing behind    the bushes at this hour, and why you did not answer when called?”</p>", "option4": " <p style=\"orphans:0;widows:0\">    The detective said to the stranger, “What you are doing behind    the bushes at this hour, and why didn't you answer when called?”</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the indirect sentence into direct speech, follow these    rules:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Reporting    Verb:</b> 'asked the stranger' in indirect speech changes back to    'said to the stranger'. ('asked to' in option C is grammatically    incorrect).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Tense &amp;    Aspect:</b> The past continuous ('what he was doing') converts    back to the present continuous interrogative ('What are you    doing'). The past perfect ('why he had not answered') converts    back to simple past interrogative ('why didn't you answer').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Time/Adverbial    Shift:</b> 'at that hour' changes back to 'at this hour'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Word    Order:</b> Direct interrogative clauses require subject-auxiliary    inversion ('What are you doing...' and 'why didn't you    answer...'). Options C and D fail to maintain correct    interrogative syntax.</p>    <p style=\"orphans:0;widows:0\">Hence, <b>Option A</b> is the    correct direct form.</p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The following sentence has been divided into four parts.    Identify the part which contains a grammatical error. If there is    no error in the sentence, then select 'No Error'.</b></p>    <p style=\"orphans:0;widows:0\">The senior advocate (A)/ took    strong exception of (B)/ the judge's impromptu remarks. (C)/ No    Error (D)</p>", "option1": "<p style=\"orphans:0;widows:0\">    A</p>", "option2": " <p style=\"orphans:0;widows:0\">    C</p>", "option3": " <p style=\"orphans:0;widows:0\">    B</p>", "option4": " <p style=\"orphans:0;widows:0\">    D</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The error lies in part (B) of the sentence. The correct idiomatic    phrase is <b>'take exception to'</b>, which means to object    strongly to something or to be offended by it. The preposition    'of' is incorrect here (often erroneously confused with the phrase    <i>'with the exception of'</i>). Therefore, <b>'took strong    exception of'</b> must be replaced with <b>'took strong exception    to'</b>.</p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct active form of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">How could such crucial evidence    have been overlooked by the investigating officer?</p>", "option1": "<p style=\"orphans:0;widows:0\">    How could the investigating officer overlook such crucial    evidence?</p>", "option2": " <p style=\"orphans:0;widows:0\">    How could the investigating officer have overlooked such crucial    evidence?</p>", "option3": " <p style=\"orphans:0;widows:0\">    How had the investigating officer overlooked such crucial    evidence?</p>", "option4": " <p style=\"orphans:0;widows:0\">    How can the investigating officer have overlooked such crucial    evidence?</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is an interrogative sentence in the passive    voice using a modal perfect construction:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Passive    structure:</b> Wh-word (How) + modal (could) + object (such    crucial evidence) + have been + V3 (overlooked) + by + agent (the    investigating officer)?</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Active    structure:</b> Wh-word (How) + modal (could) + agent/subject (the    investigating officer) + have + V3 (overlooked) + object (such    crucial evidence)?</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option A</b>    incorrectly uses the simple modal base form 'could overlook'    instead of the perfect form 'could have overlooked'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option C</b>    changes the modal verb 'could' to the auxiliary 'had'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option D</b>    changes the modal 'could' to 'can'.</p>    <p style=\"orphans:0;widows:0\">Therefore, <b>Option B</b> is the    correct active form.</p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Given below are four jumbled sentences. Select the option that    gives their correct order.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A. Determined    to overcome this limitation, John Harrison, an English carpenter    and self-taught clockmaker, dedicated decades to crafting a    sea-worthy timepiece.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B. For    centuries, calculating latitude at sea was relatively    straightforward, but determining longitude remained an    insurmountable peril for navigators.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C. His    breakthrough came with the H4, a remarkably compact marine    chronometer that kept accurate time despite the rolling motion and    temperature variations of ocean voyages.</p>    <p style=\"orphans:0;widows:0\">D. This chronic inability to    pinpoint their east-west position led to catastrophic shipwrecks    and staggering losses of life and cargo.</p>", "option1": "<p style=\"orphans:0;widows:0\">    BADC</p>", "option2": " <p style=\"orphans:0;widows:0\">    BDAC</p>", "option3": " <p style=\"orphans:0;widows:0\">    DBAC</p>", "option4": " <p style=\"orphans:0;widows:0\">    ADBC</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct order is <b>BDAC</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>B</b>    serves as the ideal introductory sentence, presenting the    overarching historical dilemma: while latitude could easily be    determined, measuring longitude was a major peril.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>D</b>    directly elaborates on sentence B; 'This chronic inability to    pinpoint their east-west position' links to the failure of    calculating longitude and details its disastrous consequences    (shipwrecks and loss of life). Hence, <b>BD</b> forms an    inseparable pair.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. <b>A</b>    introduces John Harrison, who took on the challenge to overcome    'this limitation' by building a reliable timepiece.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. <b>C</b>    directly follows A; the pronoun 'His' refers to John Harrison,    concluding the narrative with his ultimate triumph (the creation    of the H4 chronometer). Thus, <b>AC</b> forms a mandatory pair.</p>    <p style=\"orphans:0;widows:0\">Combining these pairs gives the    coherent sequence: <b>B - D - A - C</b>.</p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate phrasal verb to fill in the blank    in the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">The forensic evidence produced in    court did not ________ the witness's claim regarding the suspect's    whereabouts.</p>", "option1": "<p style=\"orphans:0;widows:0\">    bear with</p>", "option2": " <p style=\"orphans:0;widows:0\">    bear out</p>", "option3": " <p style=\"orphans:0;widows:0\">    bear up</p>", "option4": " <p style=\"orphans:0;widows:0\">    bear away</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct phrasal verb to fill in the blank is <b>bear out</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Bear    out:</b> means to confirm, substantiate, or support the truth of    something.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Bear    with:</b> means to be patient with someone.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Bear up:</b>    means to remain brave or endure in the face of difficulty.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Bear    away:</b> means to win or carry off as a prize.</p>    <p style=\"orphans:0;widows:0\">In this context, the forensic    evidence did not confirm or support the witness's claim, making    'bear out' the correct choice.</p>", "question_heading": ""}, {"sr_no": 56, "question": "Rधोक पुध ीियियथing ूोौौोgध ोnक ोnौथधन पुध तहधौपiयnौ giॅधn ृिधयथ. Tुध ोccिधधनोपing cोकधncध यी gियृोि पधंूधनोपहनध ोnयंोिiधौ ुोौ ूनयंूपधक ौधनiयहौ ौciधnपiीic cयnौiकधनोपiयn यी ौियोन नोकiोपiयn ंयकiीicोपiयn (SRM), ूोनपicिहोिनद पुध किधiृधनोपध inुधcपiयn यी नधीिधcपiॅध ोधनयौियस inपय पुध ौपनोपयौूुधनध. Pनयूयnधnपौ cयnपधnक पुोप किधiृधनोपध ूिोnधपोनद cयियing यीीधनौ ोn inकiौूधnौोृिध, cयौप-धीीधcपiॅध ूोििiोपiॅध cोूोृिध यी ृिहnपing पुध ंयौप cोपोौपनयूुic nधोन-पधनं iंूोcपौ यी cिiंोपध cुोngध थुiिध ंiपigोपiयn ौपनोपधgiधौ ौियिथद ंोपहनध. Tुधयनधपicोि ंयकिधing ौहggधौपौ पुोप कोंूधning incयंing ौियोन iननोकiोncध cयिहक नोूiिकद कधूनधौौ ंधोn ौहनीोcध पधंूधनोपहनधौ ोnक ोििधॅiोपध ौधॅधनध पुधनंोि ौपनधौौ यn ॅिहnधनोृिध धcयौदौपधंौ. Yधप, पुधनंयकदnोंic धीीicोcद cोnnयप ृध cयnीिोपधक थiपु धcिययgicोि यन gधयूियiपicोि ॅiोृiिiपद. Cिiंोपध inपधनॅधnपiयn cोननiधौ ोौदंंधपनic नiौो: ोिपधनधक ूनधciूiपोपiयn नधgiंधौ ंigुप कiौूिोcध ंयnौययnौ, iंूधनiिing ोgनोनiोn धcयnयंiधौ ोcनयौौ पुध Gियृोि Sयहपु धॅधn ोौ ुigु-िोपiपहकध nोपiयnौ धसूधनiधncध nधप cिiंोपic ौपोृiिiपद. Fहनपुधनंयनध, ोnद हniिोपधनोि कधूियदंधnप cनधोपधौ ोcहपध ंयनोि ुोशोनक, ूयपधnपiोििद ौहृॅधनपing ूियiपicोि थiिि पयथोनक ौदौपधंic कधcोनृयnप्रोपiयn. Eॅधn ंयनध ूधनiियहौ iौ पुध ूनयौूधcप यी ैपधनंinोपiयn ौुयcाै—ोn ोृनहूप cधौौोपiयn यी ोधनयौिय कधूियदंधnप कहध पय cयnीिicप यन पधcुnicोि ीोiिहनध, थुicु थयिहक inकहcध हnूनधcधकधnपधिकद नोूiक थोनंing
