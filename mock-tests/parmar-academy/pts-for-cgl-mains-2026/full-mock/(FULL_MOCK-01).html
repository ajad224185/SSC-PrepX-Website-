d, / (S) ultimately stalling further improvements in    predictive accuracy.</p>", "option1": "<p style=\"orphans:0;widows:0\">    P</p>", "option2": " <p style=\"orphans:0;widows:0\">    Q</p>", "option3": " <p style=\"orphans:0;widows:0\">    R</p>", "option4": " <p style=\"orphans:0;widows:0\">    S</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Segment (R) contains a lexical error. The adjective <b>diminutive</b>    means extremely or unusually small in physical size or stature.    However, in the context of production or performance yielding    progressively smaller outputs as investment increases, the correct    idiomatic and economic collocation is <b>diminishing returns</b>.    Therefore, <b>'diminutive returns'</b> should be corrected to    'diminishing returns'.</p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Fill in the blanks with the most appropriate combination of    articles and verb form.</p>    <p style=\"orphans:0;widows:0\">The minister demanded that    ________ safety of the miners ________ prioritized, as this was    ________ urgent matter of public concern.</p>", "option1": "<p style=\"orphans:0;widows:0\">    the, was, a</p>", "option2": " <p style=\"orphans:0;widows:0\">    a, be, the</p>", "option3": " <p style=\"orphans:0;widows:0\">    the, be, an</p>", "option4": " <p style=\"orphans:0;widows:0\">    no article, is, an</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct combination is <b>the, be, an</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>First    blank:</b> The definite article 'the' is used because the noun    'safety' is made specific by the qualifying phrase 'of the    miners'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>Second    blank:</b> The subjunctive mood is required following the verb    'demanded that'. In the present subjunctive, the base form of the    verb ('be') is used regardless of the subject or the tense of the    main clause.</p>    <p style=\"orphans:0;widows:0\">3. <b>Third blank:</b> The    indefinite article 'an' is needed before the singular countable    noun phrase 'urgent matter' because 'urgent' begins with a vowel    sound.</p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the following sentence carefully and focus on the underlined    portion. Choose the option (A, B, or C) that best substitutes the    underlined segment to improve the sentence grammatically or    contextually. If the sentence is correct as written, select Option    D (No improvement required).</p>    <p style=\"orphans:0;widows:0\">The conservation team resolved <u>to    actively monitor the migration of endangered birds</u> across the    wetlands throughout the winter.</p>", "option1": "<p style=\"orphans:0;widows:0\">    to monitor actively the migration of endangered birds across the    wetlands</p>", "option2": " <p style=\"orphans:0;widows:0\">    to monitor the migration actively of endangered birds across the    wetlands</p>", "option3": " <p style=\"orphans:0;widows:0\">    to actively monitor across the wetlands the migration of    endangered birds</p>", "option4": " <p style=\"orphans:0;widows:0\">    No improvement required</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The sentence is <b>grammatically correct</b> and contextually    clear. In modern English, placing an adverb between 'to' and the    base verb (a split infinitive) such as 'to actively monitor' is    natural and accepted, especially when moving the adverb creates    awkward phrasing.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Option A     awkwardly places the adverb 'actively' between the transitive     verb 'monitor' and its direct object 'the migration...'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Option B     disrupts the noun phrase 'the migration of endangered birds'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Option C     separates the verb from its direct object by inserting a     prepositional phrase ('across the wetlands').</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence, <b>no improvement is    required</b>.</p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three statements are given followed by three conclusions numbered I, II and III. Assuming the statements to be true, even if they seem to be at variance with commonly known facts, decide which of the conclusions logically follow(s) from the statements.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>No doctor is a singer.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All doctors are dancers.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Some dancers are actors.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. All dancers can never be singers.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. No doctor is an actor.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>III. Some actors are painters.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion I follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusions I and II follow</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion II follows</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusions II and III follow</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image001.png\" width=\"363\" height=\"179\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. It is impossible for all dancers to be singers (\"All dancers can never be singers\"). </span><span style=\"font-weight:bold\">Hence, conclusion I follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. There is no definite negative relationship established between doctors and actors. </span><span style=\"font-weight:bold\">Hence, conclusion II does not follow.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. The term 'painters' is not mentioned in the statements, </span><span style=\"font-weight:bold\">so conclusion III does not follow.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, only conclusion I follows.</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language, 'apple mango banana' is written as 'xm yb zq'; 'banana cherry grape' is written as 'zq kr wj' and 'mango guava cherry' is written as 'yb pl kr'. How is 'apple' written in that language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>yb</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>zq</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>xm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>kr</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 'apple mango banana' = 'xm yb zq'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 'banana cherry grape' = 'zq kr wj'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 'mango guava cherry' = 'yb pl kr'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing statements 1 and 2, the common word is 'banana' and the common code is 'zq'. So, 'banana' = 'zq'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing statements 1 and 3, the common word is 'mango' and the common code is 'yb'. So, 'mango' = 'yb'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, in statement 1, the remaining word 'apple' is coded as 'xm'.</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following numbers will replace the question mark (?) in the given series?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2, 3, 7, 25, ?, 721</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>118</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>121</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>125</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>116</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The logic followed here is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image002.png\" width=\"96\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image003.png\" width=\"96\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image004.png\" width=\"105\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image005.png\" width=\"122\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image006.png\" width=\"131\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, the required number is 121.</span></p>", "question_heading": ""}, {"sr_no": 94, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the correct mirror image of the given alphanumeric string </span><span style=\"font-weight:bold\">A</span><span> when a vertical mirror is placed to its right at MN.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image007.png\" width=\"325\" height=\"174\" alt ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>bƐTИƎ8q</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>q8ƎИTƐb</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>b3TИE8q</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>dƐTИƎ8p</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>When a vertical mirror is placed to the right of a string, the order of characters reverses from right to left, and each individual character undergoes lateral inversion (horizontal flip):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image008.png\" width=\"450\" height=\"186\" alt ><span> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, the correct mirror image is</span><span> </span><span style=\"font-weight:bold\">bƐTИƎ8q</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the option that is related to the fifth letter-cluster in the same way as the second letter-cluster is related to the first letter-cluster and the fourth letter-cluster is related to the third </span><span> </span><span>letter-cluster.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DFH : WUS :: LNP : OMK :: TVX : ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>GFD</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FEC</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>GEC</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HFD</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed here is that </span><span style=\"font-weight:bold\">each letter is replaced by its opposite letter in the English alphabetical series</span><span> (sum of their positional values is 27):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D (4) → W (23)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F (6) → U (21)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>H (8) → S (19)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L (12) → O (15)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N (14) → M (13)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (16) → K (11)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Following the same pattern for TVX:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T (20) → G (7)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V (22) → E (5)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>X (24) → C (3)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, TVX : GEC.</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the four options will replace the question mark (?) in the following series?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PA 105, QD 98, RG 91, SJ 84, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>TL 77</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>TM 77</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>TN 77</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>UM 70</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the given series is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">First letter increases by 1</span><span>: P (+1) → Q (+1) → R (+1) → S (+1) → </span><span style=\"font-weight:bold\">T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">Second letter increases by 3:</span><span> A (+3) → D (+3) → G (+3) → J (+3) → </span><span style=\"font-weight:bold\">M</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span style=\"font-weight:bold\">Number decreases by 7:</span><span> 105 (-7) → 98 (-7) → 91 (-7) → 84 (-7) → </span><span style=\"font-weight:bold\">77</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, the missing term is</span><span> </span><span style=\"font-weight:bold\">TM 77</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 97, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>What will come in the place of question mark '?' in the following equation if '+' and '÷' are interchanged, and '-' and '×' are interchanged?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image009.png\" width=\"157\" height=\"21\" alt style=\"vertical-align:middle\" ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>After interchanging '+' with '÷', and '-' with '×':</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image010.png\" width=\"157\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the BODMAS rule:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 1: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image011.png\" width=\"76\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 2: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image012.png\" width=\"75\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 3: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image013.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 4: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image014.png\" width=\"76\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, the correct answer is 9.</span></p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The position of how many letters will remain unchanged if each of the letters in the word 'DAUGHTER' is re-arranged in the English alphabetical order from left to right?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Original word: D A U G H T E R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Arranging the letters in alphabetical order from left to right: </span><span style=\"font-weight:bold\">A D E G H R T U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing the position of each letter:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Original: D A U </span><span style=\"font-weight:bold\">G</span><span> </span><span style=\"font-weight:bold\">H</span><span> T E R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Alphabetical: A D E </span><span style=\"font-weight:bold\">G</span><span> </span><span style=\"font-weight:bold\">H</span><span> R T U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">The positions of 2 letters ('G' and 'H') remain unchanged.</span></p>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language, 'BEAM' is written as 'NBFC' and 'BOAT' is written as 'UBPC'. How will 'DUST' be written in that language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>UTEV</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>UTVE</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>VTUE</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>TUVE</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed here is: </span><span style=\"font-weight:bold\">Reverse the order of letters in the given word and then add 1 to each letter (+1 shift).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BEAM → Reverse: MAEB → (+1 to each letter) → NBFC</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BOAT → Reverse: TAOB → (+1 to each letter) → UBPC</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly, for 'DUST':</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Reverse of DUST = TSUD</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T + 1 = U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S + 1 = T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U + 1 = V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D + 1 = E</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, 'DUST' is coded as 'UTVE'.</span></p>", "question_heading": ""}, {"sr_no": 10 le=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2) 18 : 315 </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image017.png\" width=\"191\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3) 16 : 245 </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image018.png\" width=\"238\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4) 12 : 135 </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image019.png\" width=\"191\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, '16 : 245' does not belong to the group.</span></p>", "question_heading": ""}, {"sr_no": 101, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14 is related to 182 following a certain logic. Following the same logic, 22 is related to 286. To which of the following is 33 related, following the same logic?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g., 13 – Operations on 13 such as adding/deleting/multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>419</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>429</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>439</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>449</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed here is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image020.png\" width=\"102\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image021.png\" width=\"102\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image022.png\" width=\"102\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, 33 is related to 429.</span></p>", "question_heading": ""}, {"sr_no": 102, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A + B' means 'A is the sister of B',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A - B' means 'A is the brother of B',</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A * B' means 'A is the mother of B', and</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'A ÷ B' means 'A is the father of B'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following expressions indicates that 'P is the maternal uncle of S'? </span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P + Q * R - S</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P - Q ÷ R * S</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P - Q * R + S</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P * Q - R + S</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let's decode expression iii: P - Q * R + S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 'P - Q' means P is the brother of Q.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 'Q * R' means Q is the mother of R.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 'R + S' means R is the sister of S, which means Q is the mother of both R and S.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Since P is the brother of Q and Q is the mother of S, P is the maternal uncle (mother's brother) of S. Hence, expression iii is correct.</span></p>", "question_heading": ""}, {"sr_no": 103, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Instruction:</span><span> Identify the assumptions that must hold for the statement to be valid, then choose the correct option.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statement:</span><span> Although solar power technology has substantially reduced the cost of electricity generation, the intermittency of sunlight remains a key challenge for continuous energy supply.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Assumptions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. Solar power technology offers the potential for cost-effective electricity generation.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. Solar energy can provide an uninterrupted power supply around the clock without requiring any energy storage systems.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>III. Recent technological advancements have completely overcome the dependence of solar power on sunlight.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I and II are implicit</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only II and III are implicit</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I is implicit</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All I, II, and III are implicit</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Assumption I</span><span> is implicit because the statement notes that solar power technology has substantially reduced generation costs, which assumes that it holds the potential for cost-effective electricity generation.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Assumption II</span><span> is not implicit because the statement explicitly highlights sunlight intermittency as a key challenge for continuous energy supply, implying that 24/7 power without storage is not feasible.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Assumption III</span><span> is not implicit because it directly contradicts the statement, which affirms that sunlight intermittency remains a challenge.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, only assumption I is implicit.</span></p>", "question_heading": ""}, {"sr_no": 104, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the number-set that is different from the rest.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(12, 36, 108)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(16, 48, 144)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(18, 54, 162)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(14, 42, 128)</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the sets is: </span><span style=\"font-weight:bold\">Second number = First number </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image023.png\" width=\"29\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">,</span><span> and </span><span style=\"font-weight:bold\">Third number = Second number </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image023.png\" width=\"29\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(12, 36, 108): </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image024.png\" width=\"84\" height=\"21\" alt style=\"vertical-align:middle\" ><span> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image025.png\" width=\"93\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(16, 48, 144): </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image026.png\" width=\"84\" height=\"21\" alt style=\"vertical-align:middle\" ><span> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image027.png\" width=\"93\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(18, 54, 162): </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image028.png\" width=\"84\" height=\"21\" alt style=\"vertical-align:middle\" ><span> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image029.png\" width=\"93\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(14, 42, 128): </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image030.png\" width=\"84\" height=\"21\" alt style=\"vertical-align:middle\" ><span>, but </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image031.png\" width=\"141\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, (14, 42, 128) is the odd one out.</span></p>", "question_heading": ""}, {"sr_no": 105, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a row of 72 students, Rahul is 24th from the left end and Sunita is 31st from the right end. How many students are sitting between them?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>17</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>19</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>16</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total number of students = 72</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Position of Rahul from left = 24</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Position of Sunita from right = 31</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sum of their positions = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image032.png\" width=\"94\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Since Total (72) &gt; Sum of positions (55), there is no overlap.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Number of students between them = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image033.png\" width=\"98\" height=\"21\" alt style=\"vertical-align:middle\" ></p>", "question_heading": ""}, {"sr_no": 106, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>How many meaningful four-letter English words can be formed using the first, fourth, fifth, and sixth letters of the word \"DETAIL\" (when counted from left to right), using each letter only once in each word?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The 1st, 4th, 5th, and 6th letters of the word \"DETAIL\" from left to right are D, A, I, and L, respectively.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Using these four letters (D, A, I, L) only once in each word, the following 2 meaningful four-letter English words can be formed:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. DIAL</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. LAID</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, exactly 2 such words can be formed.</span></p>", "question_heading": ""}, {"sr_no": 107, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Eight persons A, B, C, D, E, F, G, and H are sitting around a circular table facing the center.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A is sitting opposite to E.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B is second to the left of A.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C is to the immediate right of B.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F is third to the left of E.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D is to the immediate left of E.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>G is not an immediate neighbor of B.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Who is sitting to the immediate right of G?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>H</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the given clues, we can determine the arrangement around the circle facing the center (in clockwise order):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image034.png\" width=\"381\" height=\"333\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since persons are facing the center, immediate right means going counter-clockwise. </span><span style=\"font-weight:bold\">Therefore, D is sitting to the immediate right of G.</span></p>", "question_heading": ""}, {"sr_no": 108, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the set in which the numbers are related in the same way as are the numbers of the following sets.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding / deleting / multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(16, 192, 8)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(12, 132, 7)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(14, 182, 9)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(15, 200, 8)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(11, 150, 6)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(18, 220, 7)</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The logic followed here is</span><span style=\"font-weight:bold\">: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image035.png\" width=\"420\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For (16, 192, 8):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image036.png\" width=\"209\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For (12, 132, 7):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image037.png\" width=\"209\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly, for option A (14, 182, 9):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image038.png\" width=\"209\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, option A is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 109, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three of the following four letter-cluster pairs are alike in a certain way and thus form a group. Which is the letter-cluster pair that does NOT belong to that group?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Note: The odd one out is not based on the number of consonants/vowels or their positions in the letter-cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>AE - HL</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>GK - NR</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LP - SW</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PT - XD</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In AE - HL, GK - NR, and LP - SW, the pattern is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. Within each cluster,</span><span> </span><span style=\"font-weight:bold\">positional value of 2nd letter = 1st letter + 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. Letters of the 2nd cluster = Corresponding letters of the 1st cluster + 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>AE - HL: A(1)+4 = E(5), H(8)+4 = L(12); A(1)+7 = H(8), E(5)+7 = L(12)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>GK - NR: G(7)+4 = K(11), N(14)+4 = R(18); G(7)+7 = N(14), K(11)+7 = R(18)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LP - SW: L(12)+4 = P(16), S(19)+4 = W(23); L(12)+7 = S(19), P(16)+7 = W(23)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">In PT - XD: P(16)+8 = X(24), which breaks the +7 addition rule. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, PT - XD does not belong to the group.</span></p>", "question_heading": ""}, {"sr_no": 110, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the option that when sequentially placed in the blanks of the given letter series will complete the series.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A _ C B A B _ B _ B C _ A B _ B</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B C A B C</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C B A C B</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B C B A C</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A C B B C</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>On placing the letters 'B C A B C' sequentially in the given blanks, we get:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A </span><span style=\"font-weight:bold\">B</span><span> C B / A B </span><span style=\"font-weight:bold\">C</span><span> B / </span><span style=\"font-weight:bold\">A</span><span> B C </span><span style=\"font-weight:bold\">B</span><span> / A B </span><span style=\"font-weight:bold\">C</span><span> B</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern 'A B C B' repeats 4 times to complete the 16-letter series. Hence, option A is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 111, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three of the following four options are alike in a certain way and thus form a group. Which is the one that does NOT belong to that group?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding/subtracting/multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>76 – 48 – 20</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>58 – 72 – 86</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>83 – 57 – 31</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>64 – 42 – 18</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed here is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:14pt\"><span style=\"font-size:12pt\">In each option (except D), the three numbers form an Arithmetic Progression where the difference between consecutive numbers is equal, or </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image039.png\" width=\"359\" height=\"34\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Option A:</span><span> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image040.png\" width=\"94\" height=\"21\" alt style=\"vertical-align:middle\" ><span> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image041.png\" width=\"94\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Option B: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image042.png\" width=\"94\" height=\"21\" alt style=\"vertical-align:middle\" ><span> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image043.png\" width=\"94\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Option C:</span><span> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image044.png\" width=\"94\" height=\"21\" alt style=\"vertical-align:middle\" ><span> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image045.png\" width=\"94\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Option D:</span><span> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image046.png\" width=\"94\" height=\"21\" alt style=\"vertical-align:middle\" ><span> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image047.png\" width=\"94\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (The differences are not equal)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, </span><span style=\"font-weight:bold\">64 – 42 – 18</span><span> does not belong to the group.</span></p>", "question_heading": ""}, {"sr_no": 112, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the position in the English alphabetical order, three of the following four letter-clusters are alike in a certain way and thus form a group. Which is the one that does not belong to that group?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Note: Operations should be performed on the letters as a whole; operations based on consonants/vowels should not be considered.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DGKI</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>JMQO</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NQVT</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PSWU</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The logic followed here is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DGKI: D (+3) = G, G (+4) = K, K (-2) = I</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>JMQO: J (+3) = M, M (+4) = Q, Q (-2) = O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PSWU: P (+3) = S, S (+4) = W, W (-2) = U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NQVT: N (+3) = Q, Q (+5) = V, V (-2) = T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">All options except 'NQVT' follow the pattern (+3, +4, -2).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, </span><span style=\"font-weight:bold\">NQVT</span><span> is the odd letter-cluster.</span></p>", "question_heading": ""}, {"sr_no": 113, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language, 'BANK' is coded as '80' and 'GIFT' is coded as '66'. How will 'POST' be coded in that language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>42</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>38</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>46</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>34</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed here is </span><span style=\"font-weight:bold\">the sum of the reverse positional values (position from the right end of the alphabet) of the letters.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">For 'BANK':</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B = 25, A = 26, N = 13, K = 16</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sum = 25 + 26 + 13 + 16 = 80</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">For 'GIFT':</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>G = 20, I = 18, F = 21, T = 7</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sum = 20 + 18 + 21 + 7 = 66</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Similarly, for 'POST':</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P = 11, O = 12, S = 8, T = 7</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Sum = 11 + 12 + 8 + 7 = 38</span></p>", "question_heading": ""}, {"sr_no": 114, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the option that is related to the fifth letter cluster in the same way as the second letter cluster is related to the first letter cluster and the fourth letter cluster is related to the third letter cluster.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SILENC y required to manage anxious stakeholders and maintain trust. Therefore, assigning Developer P to fix the bug in isolation while Developer Q manages stakeholder communication is the optimal decision.</span><span style=\"color:#9ca3af\"> </span></p>", "question_heading": ""}, {"sr_no": 119, "question": " <p style=\"margin-top:12pt;margin-bottom:4pt;font-size:12pt\"><span>Three of the following four alphanumeric codes are alike in a certain way and thus form a group. Which is the one that does not belong to that group?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C43D</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B33E</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E172G</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D100F</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in each code is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">(Positional value of 1st letter)³ + (Positional value of 2nd letter)² = Middle Number</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">C43D:</span><span> C = 3, D = 4</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image048.png\" width=\"167\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">B33E:</span><span> B = 2, E = 5</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image049.png\" width=\"158\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">D100F:</span><span> D = 4, F = 6</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image050.png\" width=\"176\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">E172G:</span><span> E = 5, G = 7</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image051.png\" width=\"232\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, </span><span style=\"font-weight:bold\">E172G</span><span> does not follow the pattern.</span></p>", "question_heading": ""}, {"sr_no": 120, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the option figure that is related to the third figure in the same way as the second figure is related to the first figure.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image052.png\" width=\"460\" height=\"110\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image053.png\" width=\"110\" height=\"110\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image054.png\" width=\"110\" height=\"110\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image055.png\" width=\"110\" height=\"110\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897838180_image056.png\" width=\"110\" height=\"110\" alt ></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:12pt;margin-bottom:4pt;font-size:12pt\"><span>In the first figure, there are 4 straight line segments radiating from the central point, and the second figure is a polygon with 4 sides (a square). Similarly, in the third figure, there are 5 straight line segments radiating from the central point, so the fourth figure must be a polygon with 5 sides (a pentagon). Therefore, option (C) is the correct figure</span></p>", "question_heading": ""}, {"sr_no": 121, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In an election between two candidates, 15% of the voters on the voters' list did not cast their votes, and 250 votes were declared invalid. The winner secured 55% of the total number of votes enrolled on the voters' list and defeated his opponent by 3,450 votes. Find the total number of enrolled voters.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12,500</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12,800</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13,000</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Valid votes = Votes cast − Invalid votes;</span><span>  </span><span>Winner's lead = Winner's votes − Opponent's votes</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Let the number of enrolled voters be N. Since 15% did not vote, votes cast = 85% of N = 0.85N.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 250 votes were invalid, so valid votes = 0.85N − 250.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Winner's votes = 0.55N, so opponent's votes = (0.85N − 250) − 0.55N = 0.30N − 250.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Lead = 0.55N − (0.30N − 250) = 3450 ⇒ 0.25N + 250 = 3450 ⇒ 0.25N = 3200.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. N = 3200 ÷ 0.25 = 12,800.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. Check: cast = 10,880; valid = 10,630; winner = 7,040; opponent = 3,590; 7,040 − 3,590 = 3,450 ✓</span></p>", "question_heading": ""}, {"sr_no": 122, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A two-digit number is such that the product of its digits is 18. When 63 is subtracted from the number, the digits interchange their places. Find the sum of the cubes of the digits of the original number.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>737</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>736</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>729</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>744</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>A two-digit number with tens digit a and units digit b = 10a + b; with digits interchanged = 10b + a</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Let the number be 10a + b, where ab = 18.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. After subtracting 63 the digits interchange: (10a + b) − 63 = 10b + a.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 9a − 9b = 63 ⇒ 9(a − b) = 63 ⇒ a − b = 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Digit pairs with product 18 are (9,2), (6,3), (3,6), (2,9); only a = 9, b = 2 gives a − b = 7. So the number is 92.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Sum of cubes = 9³ + 2³ = 729 + 8 = 737.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. Check: 92 − 63 = 29 (digits interchanged) ✓ and 9 × 2 = 18 ✓</span></p>", "question_heading": ""}, {"sr_no": 123, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If the polynomial </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image001.png\" width=\"207\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> is exactly divisible by </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image002.png\" width=\"89\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">, find the value of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image003.png\" width=\"66\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>21</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>23</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>27</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Factor Theorem: if (x − c) divides p(x) exactly, then p(c) = 0</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. x² − 3x + 2 = (x − 1)(x − 2). Since p(x) is divisible by this, p(1) = 0 and p(2) = 0.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. p(1) = 1 − 3 + a + b − 6 = 0 ⇒ a + b = 8 ... (i)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. p(2) = 16 − 24 + 4a + 2b − 6 = 0 ⇒ 4a + 2b = 14 ⇒ 2a + b = 7 ... (ii)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. (ii) − (i): a = −1, and then b = 8 − (−1) = 9.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. 2a + 3b = 2(−1) + 3(9) = −2 + 27 = 25.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. Check: p(2) = 16 − 24 − 4 + 18 − 6 = 0 ✓</span></p>", "question_heading": ""}, {"sr_no": 124, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image004.png\" width=\"10\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image005.png\" width=\"10\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> are the roots of the quadratic equation </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image006.png\" width=\"114\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">, find the value of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image007.png\" width=\"47\" height=\"31\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">.</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image008.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image009.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image010.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image011.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>For ax² + bx + c = 0: α + β = −b/a, αβ = c/a;</span><span>  </span><span>α³ + β³ = (α + β)³ − 3αβ(α + β);</span><span>  </span><span>α⁻¹ + β⁻¹ = (α + β)/(αβ)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. For 3x² − 5x + 1 = 0: α + β = 5/3 and αβ = 1/3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. α³ + β³ = (5/3)³ − 3 × (1/3) × (5/3) = 125/27 − 5/3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. = 125/27 − 45/27 = 80/27.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. α⁻¹ + β⁻¹ = (α + β)/(αβ) = (5/3) ÷ (1/3) = 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Required value = (80/27) ÷ 5 = 16/27.</span></p>", "question_heading": ""}, {"sr_no": 125, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image012.png\" width=\"88\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image013.png\" width=\"117\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">, and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image014.png\" width=\"117\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">, find the value of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image015.png\" width=\"25\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>(x + y + z)² = x² + y² + z² + 2(xy + yz + zx);</span><span>  </span><span>x³ + y³ + z³ − 3xyz = (x + y + z)[x² + y² + z² − (xy + yz + zx)]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 6² = 14 + 2(xy + yz + zx) ⇒ 2(xy + yz + zx) = 22 ⇒ xy + yz + zx = 11.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Right side of the identity = 6 × (14 − 11) = 6 × 3 = 18.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 36 − 3xyz = 18 ⇒ 3xyz = 18 ⇒ xyz = 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Check: x, y, z = 1, 2, 3 gives sum 6, sum of squares 14, sum of cubes 36 and product 6 ✓</span></p>", "question_heading": ""}, {"sr_no": 126, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The vertices of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image016.png\" width=\"47\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> are </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image017.png\" width=\"60\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image018.png\" width=\"44\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">, and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image019.png\" width=\"57\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">. If </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image020.png\" width=\"12\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> is the midpoint of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image021.png\" width=\"20\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image022.png\" width=\"10\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> is the centroid of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image016.png\" width=\"47\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">, find the length of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image023.png\" width=\"21\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">.</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image024.png\" width=\"18\" height=\"20\" alt style=\"vertical-align:middle\" ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image025.png\" width=\"26\" height=\"39\" alt style=\"vertical-align:middle\" ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image026.png\" width=\"9\" height=\"19\" alt style=\"vertical-align:middle\" ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image027.png\" width=\"26\" height=\"39\" alt style=\"vertical-align:middle\" ></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Midpoint = ((x₁ + x₂)/2, (y₁ + y₂)/2);</span><span>  </span><span>Centroid = ((x₁ + x₂ + x₃)/3, (y₁ + y₂ + y₃)/3);</span><span>  </span><span>Distance = √[(x₂ − x₁)² + (y₂ − y₁)²]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. D is the midpoint of B(7, 6) and C(−1, 2): D = ((7 − 1)/2, (6 + 2)/2) = (3, 4).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Centroid G = ((3 + 7 − 1)/3, (−2 + 6 + 2)/3) = (9/3, 6/3) = (3, 2).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. GD = √[(3 − 3)² + (4 − 2)²] = √4 = 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Check: AD = distance from (3, −2) to (3, 4) = 6, and the centroid is one-third of the way from D, so GD = AD/3 = 2 ✓</span></p>", "question_heading": ""}, {"sr_no": 127, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The ratio of the measure of an interior angle of a regular polygon with </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image028.png\" width=\"10\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> sides to that of a regular polygon with </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image029.png\" width=\"19\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> sides is </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image030.png\" width=\"22\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">. Find the value of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image028.png\" width=\"10\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Each interior angle of a regular n-sided polygon = 180°(n − 2)/n</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. n-sided polygon: interior angle = 180(n − 2)/n.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 2n-sided polygon: interior angle = 180(2n − 2)/(2n) = 180(n − 1)/n.</span></p><p style=\"marg
