atic RAM (SRAM) does not need periodic refreshing as it stores information using flip-flops.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement 2 is correct: Cache memory is an extremely high-speed memory placed between the CPU and the primary memory (RAM) to store frequently accessed instructions and data, thereby speeding up processing.</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Select which of the given statement(s) is/are True or False regarding the components of the Central Processing Unit (CPU).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">(i) Registers are high-speed temporary storage units located directly inside the CPU to hold data and instructions during processing.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">(ii) The Control Unit (CU) is responsible for performing arithmetic calculations and logical comparisons.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(i) True, (ii) True</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(i) True, (ii) False</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(i) False, (ii) True</span></p>", "option4": "(i) Fोिसध, (ii) Fोिसध", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement (i) is True: Registers are extremely fast, small storage locations located directly inside the CPU used to hold intermediate results, operands, and memory addresses currently in use.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement (ii) is False: The Arithmetic Logic Unit (ALU) performs all arithmetic calculations (addition, subtraction, etc.) and logical comparisons. The Control Unit (CU) coordinates and directs the activities of all other units of the computer system rather than performing calculations.</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">With reference to different types of Read-Only Memory (ROM), which of the following statements is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">I. EPROM content is erased by exposing the chip to ultraviolet (UV) light through a transparent quartz window.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">II. Unlike traditional EEPROM, which allows byte-level modification, Flash memory is typically erased at the block or sector level.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">III. Mask ROM is hardwired during fabrication and cannot be modified or reprogrammed after manufacturing.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I and II only</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II and III only</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I and III only</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I, II and III</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All three statements are correct:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">EPROM (Erasable Programmable ROM):</span><span> It is erased by exposing the chip to strong ultraviolet (UV) light through a quartz window for about 20–40 minutes, which erases all stored data at once.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">EEPROM vs. Flash Memory:</span><span> While standard EEPROM allows individual bytes to be erased and rewritten electrically, Flash memory (an advanced EEPROM variant) erases and writes data in larger chunks known as blocks or sectors, making it faster and more cost-effective for large storage.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span style=\"font-weight:bold\">Mask ROM:</span><span> Its data is physically etched into the integrated circuit during the manufacturing process by using photolithography masks, making it completely non-alterable.</span></p>", "question_heading": ""}, {"sr_no": 44, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Match the Windows system utilities in Column A with their primary functions in Column B.</span></p>\n<table cellspacing=\"0\" cellpadding=\"0\" style=\"width:100%;border:0.75pt solid #d1d5db;border-collapse:collapse\">\n<tr>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Column A</span></p></td>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Column B</span></p></td>\n</tr>\n<tr>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. Disk Cleanup</span></p></td>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">a) Backs up copies of personal files to an external storage</span></p></td>\n</tr>\n<tr>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. Disk Defragmenter</span></p></td>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">b) Removes temporary files to free up disk storage space</span></p></td>\n</tr>\n<tr>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3. File History</span></p></td>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">c) Monitors active processes and system resource utilization</span></p></td>\n</tr>\n<tr>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">4. Task Manager</span></p></td>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">d) Rearranges fragmented data on a drive to improve performance</span></p></td>\n</tr>\n</table>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - b, 2 - d, 3 - a, 4 - c</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - d, 2 - b, 3 - a, 4 - c</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - b, 2 - a, 3 - d, 4 - c</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - c, 2 - d, 3 - b, 4 - a</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The correct matching is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. Disk Cleanup (b):</span><span> It searches for and deletes temporary files, cached files, and system files no longer needed to reclaim storage space.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. Disk Defragmenter (d):</span><span> It consolidates fragmented files on traditional hard drives so that contiguous storage is restored, improving file access speeds.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3. File History (a):</span><span> It is a built-in backup utility in Windows that automatically saves versions of user files to an external drive or network location.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">4. Task Manager (c):</span><span> It displays real-time statistics regarding running programs, background processes, CPU, memory, disk, and network usage.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the correct pair is 1 - b, 2 - d, 3 - a, 4 - c.</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">What is the maximum number of characters that a single cell can contain in MS Excel 2016?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1,024 characters</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>16,384 characters</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>32,767 characters</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>65,536 characters</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In Microsoft Excel 2007 and later versions (including Excel 2016), the total number of characters that a single cell can contain is 32,767 characters. However, only 1,024 characters are displayed in a cell unless formatted properly with text wrapping.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate meaning of the underlined word in the    given sentence.</p>    <p style=\"orphans:0;widows:0\">The manager's <u>mercurial</u>    temperament made it difficult for his team to predict his    reactions.</p>", "option1": "<p style=\"orphans:0;widows:0\">    sluggish and indifferent</p>", "option2": " <p style=\"orphans:0;widows:0\">    volatile and unpredictable</p>", "option3": " <p style=\"orphans:0;widows:0\">    composed and steadfast</p>", "option4": " <p style=\"orphans:0;widows:0\">    obstinate and rigid</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The underlined word <b>mercurial</b> means 'subject to sudden or    unpredictable changes of mood or mind; erratic or volatile'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Therefore,    the most appropriate meaning is <b>volatile and unpredictable</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    other options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sluggish     and indifferent:</b> Slow-moving, lacking energy or enthusiasm.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Composed     and steadfast:</b> Calm, steady, and resolute.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Obstinate and rigid:</b>     Stubbornly refusing to change one's opinion or course of action.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Sentences of a paragraph are given below in jumbled order. Arrange    the sentences in the correct order to form a meaningful and    coherent paragraph.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A. Among    these treasures was an ornate solid gold coffin housing the    pharaoh's mummified remains.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B. In 1922,    British archaeologist Howard Carter made a remarkable discovery in    Egypt's Valley of the Kings.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C. It was the    intact tomb of the young pharaoh Tutankhamun, filled with    thousands of priceless artifacts.</p>    <p style=\"orphans:0;widows:0\">D. This spectacular find    instantly captured the world's imagination and sparked a global    fascination with ancient Egypt.</p>", "option1": "<p style=\"orphans:0;widows:0\">    BCAD</p>", "option2": " <p style=\"orphans:0;widows:0\">    BDCA</p>", "option3": " <p style=\"orphans:0;widows:0\">    CBAD</p>", "option4": " <p style=\"orphans:0;widows:0\">    BACD</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct order is <b>BCAD</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B</b>    introduces the central subject and setting (Howard Carter making a    discovery in 1922 in Egypt's Valley of the Kings), so it is the    opening sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C</b>    follows <b>B</b> directly because the pronoun 'It' refers to the    'remarkable discovery' and identifies it as the tomb of    Tutankhamun containing priceless artifacts.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A</b>    links to <b>C</b> through the phrase 'Among these treasures',    referring back to the 'thousands of priceless artifacts' mentioned    at the end of C.</p>    <p style=\"orphans:0;widows:0\"><b>D</b> concludes the paragraph    by describing the worldwide reaction and enduring impact of this    spectacular find.</p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">The manager remarked that despite    the economic downturn, there were __________ complaints from    clients this quarter than during the same period last year.</p>", "option1": "<p style=\"orphans:0;widows:0\">    far fewer</p>", "option2": " <p style=\"orphans:0;widows:0\">    far less</p>", "option3": " <p style=\"orphans:0;widows:0\">    very few</p>", "option4": " <p style=\"orphans:0;widows:0\">    lesser</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>far fewer</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    presence of the conjunction 'than' indicates that a comparative    degree is required, eliminating 'very few' (which is in the    positive degree).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. The noun    'complaints' is a plural countable noun. Standard grammar requires    'fewer' for countable nouns and 'less' for uncountable nouns.    Hence, 'far less' is incorrect.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. 'Lesser'    refers to lower quality, size, or importance (e.g., 'the lesser of    two evils') and is not used here to compare numerical quantities    with 'than'.</p>    <p style=\"orphans:0;widows:0\">4. 'Far' is appropriately used as    an adverb/intensifier to modify the comparative determiner    'fewer'. Therefore, <b>far fewer</b> is the correct choice.</p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    A sentence has been split up into segments and given below in    jumbled order. While the first and the last segments of the    sentence (1 and 6) are in the correct order, the segments in    between are jumbled up. Arrange the segments in the correct order    to form a meaningful and coherent sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1) True    education does not consist</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">P) merely in    acquiring knowledge</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Q) of facts    and figures,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R) and to    develop the capacity</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">S) but in    training the mind to think</p>    <p style=\"orphans:0;widows:0\">6) for independent judgment.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Q, P, R, S</p>", "option2": " <p style=\"orphans:0;widows:0\">    P, Q, S, R</p>", "option3": " <p style=\"orphans:0;widows:0\">    S, R, P, Q</p>", "option4": " <p style=\"orphans:0;widows:0\">    P, R, Q, S</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sequence is <b>P, Q, S, R</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Segment 1    ends with the verb phrase \"does not consist\", which    naturally takes the prepositional phrase in <b>P</b> (\"merely    in acquiring knowledge\").</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Segment <b>Q</b>    (\"of facts and figures,\") qualifies what kind of    \"knowledge\" is referred to in <b>P</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Following    the \"not merely... but...\" correlative construction,    segment <b>S</b> (\"but in training the mind to think\")    logically follows <b>Q</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Segment <b>R</b>    (\"and to develop the capacity\") parallels the infinitive    phrase \"to think\" in <b>S</b> and connects directly to    segment 6 (\"for independent judgment\").</p>    <p style=\"orphans:0;widows:0\">Hence, the complete sentence is:    <i>\"True education does not consist merely in acquiring    knowledge of facts and figures, but in training the mind to think    and to develop the capacity for independent judgment.\"</i></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in reported    speech.</p>    <p style=\"orphans:0;widows:0\">\"I am confident of    completing this project on time,\" the architect stated    proudly.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The architect proudly stated that he was confident of completing    that project on time.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The architect proudly stated that he is confident of completing    that project on time.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The architect proudly stated that he has been confident of    completing this project on time.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The architect proudly stated that he would be confident of    completing that project on time.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the given assertive sentence into indirect speech,    follow these rules:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     reporting verb 'stated proudly' remains in the past tense,     followed by the conjunction 'that'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     first-person pronoun 'I' changes to the third-person pronoun 'he'     according to the subject ('the architect').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     simple present tense verb 'am' changes to the simple past tense     verb 'was'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     demonstrative adjective 'this' changes to 'that'.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Thus, the correct indirect speech    is: <i>The architect proudly stated that he was confident of    completing that project on time.</i> Therefore, option A is    correct.</p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"orphans:0;widows:0\">    Select the option that can be used as a one-word substitute for    the given group of words: 'A person who dabbles in art,    literature, or science without having serious commitment or deep    knowledge'.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Connoisseur</p>", "option2": " <p style=\"orphans:0;widows:0\">    Dilettante</p>", "option3": " <p style=\"orphans:0;widows:0\">    Polymath</p>", "option4": " <p style=\"orphans:0;widows:0\">    Virtuoso</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitute is <b>Dilettante</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Dilettante:</b>     A person who cultivates an area of interest, such as the arts or     sciences, without real commitment or serious knowledge (an     amateur or dabbler).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Connoisseur:</b>     An expert judge in matters of taste and fine art.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Polymath:</b>     A person of wide-ranging knowledge or learning.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Virtuoso:</b> A person     highly skilled in music or another artistic pursuit.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate homophone from the options to fill in    the blank.</p>    <p style=\"orphans:0;widows:0\">The board of directors decided to    give the new CEO free ________ to overhaul the company's    operational strategy.</p>", "option1": "<p style=\"orphans:0;widows:0\">    reign</p>", "option2": " <p style=\"orphans:0;widows:0\">    rein</p>", "option3": " <p style=\"orphans:0;widows:0\">    rain</p>", "option4": " <p style=\"orphans:0;widows:0\">    rune</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct homophone to fill in the blank is <b>rein</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The idiom    <b>'give free rein'</b> means to give someone complete freedom and    discretion to act or make decisions as they see fit. It originates    from horseback riding, where loosening the 'reins' (the straps    used to guide a horse) allows the horse to move freely without    restraint.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the homophones:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>rein:</b>     a long, narrow strap attached to a horse's bit used to guide or     control it (used in the idiom 'free rein').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>reign:</b>     the period during which a monarch rules, or the act of ruling. A     very common error is mistakenly writing 'free reign'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>rain:</b>     condensed water vapor falling in drops from clouds.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>rune:</b>     a letter of an ancient Germanic alphabet.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, option B is the    correct choice.</p>", "question_heading": ""}, {"sr_no": 53, "question": "Sधnपधncधौ यी ो ूोनोgनोूु ोनध giॅधn ृिधयथ in ुहंृिधक यनकधन. Aननोngध पुध ौधnपधncधौ in पुध cयननधcप यनकधन पय ीयनं ो ंधोningीिह ोnक cयुधनधnप ूोनोgनोूु. A. Oॅधन पiंध, पुध कधcयंूयौiपiयn यी यनgोnic ंोपपधन in पुधौध कहंूing ौiपधौ निधधोौधौ ुोशोनकयहौ gनधधnुयहौध gोौधौ िiाध ंधपुोnध. B. Rोूiक हनृोniौोपiयn ुोौ िधक पय ोn धसूयnधnपiोि incनधोौध in ंहniciूोि ौियiक थोौपध ोcनयौौ ंोुयन ciपiधौ. C. Mधपुोnध nयप यnिद ोccिधधनोपधौ gियृोि थोनंing ृहप ोिसय पनiggधनौ ीनधतहधnप, हncयnपनियिोृिध िोnकीiिि ीiनधौ. D. Mयौप यी पुiौ हnपनधोपधक थोौपध धnकौ हू in यूधn िोnकीiििस ियcोपधक यn पुध यहपौाiनपौ यी ंधपनयूियiपोn ोनधोौ. E. Tुधौध पयसic ीiनधौ ौधॅधनिधद कधgनोकध ोiन तहोिiपद, ूयौing ौधनiयहौ ुधोिपु ुोशोनकौ पय nधोनृद नधौiकधnपौ.", "option1": "<p style=\"orphans:0;widows:0\">    BDACE</p>", "option2": " <p style=\"orphans:0;widows:0\">    DABCE</p>", "option3": " <p style=\"orphans:0;widows:0\">    BCADE</p>", "option4": " <p style=\"orphans:0;widows:0\">    DBACE</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct order is <b>BDACE</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>B</b>    is the opening sentence as it introduces the general topic: the    exponential increase in municipal solid waste due to rapid    urbanisation.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>D</b>    follows B because 'this untreated waste' refers directly to the    'municipal solid waste' introduced in B and mentions where it ends    up (open landfills).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. <b>A</b>    logically comes next as 'these dumping sites' refers back to the    landfills mentioned in D and explains the generation of methane    gas from decomposing waste.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. <b>C</b>    links directly to A by describing the dangers of methane,    including triggering landfill fires.</p>    <p style=\"orphans:0;widows:0\">5. <b>E</b> concludes the    paragraph by explaining the health and environmental consequences    of 'these toxic fires' mentioned in C.</p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct spelling of the incorrectly spelt word in the    given sentence.</p>    <p style=\"orphans:0;widows:0\">Defacing the ancient monument was    condemned as a sacreligious act by the local authorities.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Sacriligious</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sacrilegious</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sacraligious</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sacreligous</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The incorrectly spelt word in the given sentence is    'sacreligious'. The correct spelling is <b>Sacrilegious</b>    (S-A-C-R-I-L-E-G-I-O-U-S), which means involving or guilty of    sacrilege (disrespect toward something considered sacred). A    common error is spelling it with '-religious' instead of    '-legious'. Therefore, option B is correct.</p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in direct    speech.</p>    <p style=\"orphans:0;widows:0\">The manager admitted that he had    rejected the proposal the previous day.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The manager said, \"I have rejected the proposal yesterday.\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    The manager said, \"I rejected the proposal yesterday.\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    The manager said, \"I had rejected the proposal the previous    day.\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    The manager says, \"I rejected the proposal yesterday.\"</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the indirect sentence into direct speech, we follow    these rules:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     reporting verb 'admitted' can be expressed as 'said' in direct     speech.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     pronoun 'he' refers to the manager, so it changes back to the     first-person pronoun 'I'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The past     perfect tense ('had rejected') accompanied by the past time     expression 'the previous day' must convert back to simple past     tense ('rejected') along with 'yesterday'. Note that present     perfect ('have rejected') cannot be used with a specific past     time marker like 'yesterday'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">'The     previous day' changes back to 'yesterday'.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, the correct direct    sentence is: <b>The manager said, \"I rejected the proposal    yesterday.\"</b></p>", "question_heading": ""}, {"sr_no": 56, "question": "Sधnपधncधौ यी ो ूोनोgनोूु ोनध giॅधn ृिधयथ in ुहंृिधक यनकधन. Aननोngध पुध ौधnपधncधौ in पुध cयननधcप यनकधन पय ीयनं ो ंधोningीिह ोnक cयुधनधnप ूोनोgनोूु. A. Tुiौ inपधnौध cयgniपiॅध ौपiंिहोपiयn ौपनधngपुधnौ nधहनोि cयnnधcपiयnौ ोnक ृहiिकौ ीयcहौ यॅधन पiंध. B. Rधोकing iौ थiकिधद नधcयgnप्रधक nयप ंधनिधद ोौ ो िधiौहनध ोcपiॅiपद, ृहप ोौ ोn ोcपiॅध ंधnपोि थयनायहप. C. Tुधनधीयनध, cिहपiॅोपing ो कोiिद नधोकing ुोृiप िहपiंोपिधद cयnपनiृहपधौ पय ौहौपोinधक inपिधिधcपहोि gनयथपु. D. Wुधn ो ूधनौयn नधोकौ, पुध ृनोin iौ नधतहiनधक पय कधciूुधन ौदंृियस, cयnौपनहcप ॅiॅiक iंोgधनद, ोnक inपधनूनधप ोृौपनोcप iकधोौ. E. Wiपु ौपनयngधन nधहनोि nधपथयनो, ोn inकiॅiकहोि कधॅिधयूौ धnुोncधक ंधंयनद नधपधnपiयn ोnक ौुोनूधन ोnोिदपicोि पुinाing.", "option1": "<p style=\"orphans:0;widows:0\">    BDAEC</p>", "option2": " <p style=\"orphans:0;widows:0\">    BDACE</p>", "option3": " <p style=\"orphans:0;widows:0\">    DBAEC</p>", "option4": " <p style=\"orphans:0;widows:0\">    BCDAE</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct logical sequence is <b>BDAEC</b>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>B</b>    is the opening sentence as it introduces the central theme:    reading as an active mental workout.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>D</b>    follows <b>B</b> by detailing what happens during reading    (deciphering symbols, constructing imagery, etc.).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. <b>A</b>    refers back to the actions in <b>D</b> using the phrase \"This    intense cognitive stimulation\" and explains its effect on    neural connections.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. <b>E</b>    directly links with <b>A</b> through \"With stronger neural    networks...\" explaining the cognitive benefits.</p>    <p style=\"orphans:0;widows:0\">5. <b>C</b> begins with the    concluding transition \"Therefore\" and summarizes the    broader outcome of sustaining this habit.</p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Because of the sensitive nature    of the peace talks, the envoy was advised to conduct __________    inquiries rather than attracting public attention.</p>", "option1": "<p style=\"orphans:0;widows:0\">    discrete</p>", "option2": " <p style=\"orphans:0;widows:0\">    discreet</p>", "option3": " <p style=\"orphans:0;widows:0\">    discordant</p>", "option4": " <p style=\"orphans:0;widows:0\">    discursive</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct word to fill in the blank is <b>discreet</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Discreet</b>     (adjective) means careful and circumspect in one's speech or     actions, especially to avoid attracting unwanted attention or to     keep something confidential. The phrase \"sensitive nature of     the peace talks\" clearly indicates that cautious and     confidential inquiries were required.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Discrete</b>:     Individually separate and distinct (a homophone of <i>discreet</i>).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Discordant</b>:     Disagreeing, harsh, or incongruous.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Discursive</b>:     Digressing from subject to subject; rambling.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in passive    voice.</p>    <p style=\"orphans:0;widows:0\">Why did they laugh at the    proposal put forward by the chairman?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Why was the proposal put forward by the chairman laughed at?</p>", "option2": " <p style=\"orphans:0;widows:0\">    Why the proposal put forward by the chairman was laughed at?</p>", "option3": " <p style=\"orphans:0;widows:0\">    Why was the proposal put forward by the chairman laughed?</p>", "option4": " <p style=\"orphans:0;widows:0\">    Why had the proposal put forward by the chairman been laughed at?</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is an interrogative sentence in the Simple Past    Tense containing a prepositional verb (<i>laugh at</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The rules for    converting a Simple Past interrogative sentence into passive voice    are:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Active    structure: <i>Wh-word + did + subject + base verb + preposition +    object?</i></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive    structure: <i>Wh-word + was/were + object + past participle (V3) +    preposition (+ by + subject)?</i></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Here, the    object is the singular noun phrase <b>the proposal put forward by    the chairman</b>, so the auxiliary verb must be <b>was</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option A</b>    is correct because it maintains correct subject-auxiliary    inversion (<i>Why was the proposal...</i>) and correctly retains    the preposition <i>at</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option B</b>    is incorrect due to a lack of inversion (<i>Why the proposal...    was</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option C</b>    is incorrect because it omits the preposition <i>at</i>.</p>    <p style=\"orphans:0;widows:0\"><b>Option D</b> is incorrect    because it changes the tense to the Past Perfect (<i>had been</i>).</p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in direct    speech.</p>    <p style=\"orphans:0;widows:0\">The warden ordered the students    to return to their rooms and switch off those lights.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The warden said to the students, \"Return to their rooms and    switch off these lights.\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    The warden said to the students, \"Return to your rooms and    switch off these lights.\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    The warden said to the students, \"Returned to your rooms and    switch off those lights.\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    The warden said to the students, \"Return to your rooms and    switching off these lights.\"</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert an indirect imperative sentence into direct speech, the    following rules are followed:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     reporting verb 'ordered' is changed to 'said to'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     infinitive 'to return' is replaced by the base verb 'Return'     inside inverted commas to form an imperative sentence.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     third-person possessive pronoun 'their' changes to the     second-person 'your' as the speaker is directly addressing the     students.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     demonstrative adjective 'those' changes to 'these'.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence, option B is the correct    direct speech sentence.</p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate meaning of the underlined idiom.</p>    <p style=\"orphans:0;widows:0\">Instead of delaying the    confrontation, the manager decided to <u><b>take the bull by the    horns</b></u>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    To postpone taking action on a matter</p>", "option2": " <p style=\"orphans:0;widows:0\">    To deal decisively with a difficult situation</p>", "option3": " <p style=\"orphans:0;widows:0\">    To yield completely to the opponent's demands</p>", "option4": " <p style=\"orphans:0;widows:0\">    To behave aggressively without any reason</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The idiom <b>'take the bull by the horns'</b> means to face a    difficult or dangerous situation directly, boldly, and with    determination. Therefore, 'To deal decisively with a difficult    situation' is the correct meaning.</p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in active    voice.</p>    <p style=\"orphans:0;widows:0\">Why has the proposal not been    acceded to by the directors?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Why have the directors not acceded to the proposal?</p>", "option2": " <p style=\"orphans:0;widows:0\">    Why has the directors not acceded to the proposal?</p>", "option3": " <p style=\"orphans:0;widows:0\">    Why have the directors not acceded the proposal?</p>", "option4": " <p style=\"orphans:0;widows:0\">    Why did the directors not accede to the proposal?</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the passive voice and in the present    perfect interrogative form:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Passive    Voice:</b> Wh-word + has/have + subject + not + been + V3 +    preposition + by + agent?</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">To     convert it into the <b>Active Voice</b>, follow the structure:</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Wh-word     + have/has + subject (agent) + not + V3 + preposition + object?</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     agent <i>the directors</i> is plural, so the auxiliary verb must     be <b>have</b> (ruling out option B).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     preposition <b>to</b> must be retained after the verb <i>accede</i>     (ruling out option C).</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The tense    must remain present perfect, not simple past (ruling out option    D).</p>    <p style=\"orphans:0;widows:0\">Hence, <b>Why have the directors    not acceded to the proposal?</b> is the correct active form.</p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Complete the dialogue for Person B using the most appropriate    idiom.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Person A: Our    rival firm launched their product a full month before our    scheduled release and captured the market first.</p>    <p style=\"orphans:0;widows:0\">Person B: I know. They have    definitely managed to __________ us.</p>", "option1": "<p style=\"orphans:0;widows:0\">    steal a march on</p>", "option2": " <p style=\"orphans:0;widows:0\">    throw down the gauntlet to</p>", "option3": " <p style=\"orphans:0;widows:0\">    show a clean pair of heels to</p>", "option4": " <p style=\"orphans:0;widows:0\">    blow hot and cold with</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct idiom is <b>steal a march on</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meaning of    the idiom:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><i>To     steal a march on someone</i> means to gain an advantage over a     competitor or opponent by acting secretly or earlier than they     do.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In the given    context, Person A states that the rival firm launched their    product earlier and captured the market, so Person B confirms that    they managed to 'steal a march on' them.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meanings    of other options:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <i>Throw    down the gauntlet</i>: To issue a challenge or invite someone to    fight/compete.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <i>Show a    clean pair of heels</i>: To run away very fast or outrun someone    in a physical chase.</p>    <p style=\"orphans:0;widows:0\">• <i>Blow hot and cold</i>: To    keep changing one's mind or attitude unpredictably.</p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">It took several rounds of    negotiation before the union could prevail ________ the management    to accept their demands.</p>", "option1": "<p style=\"orphans:0;widows:0\">    over</p>", "option2": " <p style=\"orphans:0;widows:0\">    upon</p>", "option3": " <p style=\"orphans:0;widows:0\">    against</p>", "option4": " <p style=\"orphans:0;widows:0\">    into</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>upon</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Explanation:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     phrasal verb <b>'prevail on/upon somebody (to do something)'</b>     means to persuade or convince someone to do something, usually     after considerable effort or urging.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><i>Example:</i>    We finally prevailed upon him to deliver the keynote address.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In contrast:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>'Prevail    over/against'</b> means to triumph over, conquer, or defeat an    adversary or obstacle (e.g., <i>Truth will always prevail over    falsehood</i>).</p>    <p style=\"orphans:0;widows:0\">Since the sentence speaks about    persuading the management to accept the demands, <b>upon</b> is    the grammatically and contextually correct preposition.</p>", "question_heading": ""}, {"sr_no": 64, "question": "Pोनपौ यी ो ौधnपधncध ोनध giॅधn ृिधयथ in ुहंृिधक यनकधन. Aननोngध पुध ूोनपौ in पुध cयननधcप यनकधन पय ीयनं ो ंधोningीिह ौधnपधncध. ो. ुयथ inकiॅiकहोिस ूधनcधiॅध ोकॅधनौiपद, ृहप ोिसय ृ. पुध ौहृिपध inपधनूिोद ृधपथधधn gधnधपic ूनधकiौूयौiपiयn c. ुयथ धीीधcपiॅिधद पुधद ोकोूप पय ूौदcुिययgicोि पनोहंो क. ोnक धnॅiनयnंधnपोि ौपनधौौयनौ यीपधn कicपोपधौ nयप यnिद", "option1": "<p style=\"orphans:0;widows:0\">    bdac</p>", "option2": " <p style=\"orphans:0;widows:0\">    badc</p>", "option3": " <p style=\"orphans:0;widows:0\">    dbac</p>", "option4": " <p style=\"orphans:0;widows:0\">    bcda</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To arrange the sentence correctly, follow the grammatical links:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>Subject    identification:</b> Part <b>b</b> introduces the main subject    phrase: <i>\"the subtle interplay between genetic    predisposition...\"</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2.    <b>Prepositional pair:</b> The preposition <i>'between'</i>    requires <i>'and'</i> to complete the compound structure (<i>between    X and Y</i>). Part <b>d</b> provides this: <i>\"and    environmental stressors often dictates not only...\"</i>, so <b>b</b>    is followed by <b>d</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3.    <b>Correlative conjunction:</b> Part <b>d</b> ends with <i>\"not    only\"</i>, which must pair with <i>\"but also\"</i>    found in part <b>a</b>: <i>\"how individuals perceive    adversity, but also...\"</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. <b>Parallel    structure:</b> Part <b>a</b> concludes with <i>\"but also\"</i>,    followed smoothly by the parallel subordinate clause in part <b>c</b>:    <i>\"how effectively they adapt to psychological trauma\"</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Combining    these gives the complete sentence: <i>\"The subtle interplay    between genetic predisposition and environmental stressors often    dictates not only how individuals perceive adversity, but also how    effectively they adapt to psychological trauma.\"</i></p>    <p style=\"orphans:0;widows:0\">Therefore, the correct sequence    is <b>bdac</b>.</p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Of the two shortlisted candidates    for the managerial post, Mr. Sharma is definitely the ________    choice.</p>", "option1": "<p style=\"orphans:0;widows:0\">    better</p>", "option2": " <p style=\"orphans:0;widows:0\">    best</p>", "option3": " <p style=\"orphans:0;widows:0\">    more better</p>", "option4": " <p style=\"orphans:0;widows:0\">    well</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>better</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">When a     comparison or selection is made between exactly two persons or     things, the comparative degree of the adjective is used, preceded     by the definite article 'the' (structure: <i>the + comparative     degree + of the two</i>). The superlative degree ('best') is used     only when comparing three or more entities.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Since the sentence explicitly    mentions 'two shortlisted candidates', the comparative form    'better' is grammatically correct.</p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in passive    voice.</p>    <p style=\"orphans:0;widows:0\">Why did the villagers laugh at    the poor traveller when he asked for shelter?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Why had the poor traveller been laughed at by the villagers when    he asked for shelter?</p>", "option2": " <p style=\"orphans:0;widows:0\">    Why was the poor traveller laughed by the villagers when he asked    for shelter?</p>", "option3": " <p style=\"orphans:0;widows:0\">    Why was the poor traveller laughed at by the villagers when he    asked for shelter?</p>", "option4": " <p style=\"orphans:0;widows:0\">    Why was the poor traveller laughed at by the villagers when    shelter was asked by him?</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the simple past tense (interrogative    form) with a prepositional verb (phrasal verb) <b>laugh at</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Active     structure: <i>Wh-word + did + subject + verb (base form) +     preposition + object + adverbial clause?</i></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive     structure: <i>Wh-word + was/were + object + past participle (V3)     + preposition + by + subject + adverbial clause?</i></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     preposition <b>at</b> must not be omitted when converting a     prepositional verb into the passive voice.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     tense remains simple past (<i>was laughed at</i>, not <i>had been     laughed at</i>).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     subordinate time clause (<i>when he asked for shelter</i>)     remains in its natural active form.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, the correct passive    voice sentence is: <b>Why was the poor traveller laughed at by the    villagers when he asked for shelter?</b></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate ANTONYM of the given word.</p>    <p style=\"orphans:0;widows:0\">Recalcitrant</p>", "option1": "<p style=\"orphans:0;widows:0\">    Intractable</p>", "option2": " <p style=\"orphans:0;widows:0\">    Obdurate</p>", "option3": " <p style=\"orphans:0;widows:0\">    Amenable</p>", "option4": " <p style=\"orphans:0;widows:0\">    Pugnacious</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>Recalcitrant</b> refers to someone who has an    obstinately uncooperative attitude toward authority or discipline    (stubborn, defiant, or rebellious).</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Amenable</b>     means open and responsive to suggestion; easily persuaded,     compliant, or cooperative. Therefore, it is the exact opposite     (antonym) of recalcitrant.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings     of other options:</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Intractable:</b>     hard to control or deal with; stubborn (synonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Obdurate:</b>     stubbornly refusing to change one's opinion or course of action     (synonym).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Pugnacious:</b> eager or     quick to argue, quarrel, or fight.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words.</p>    <p style=\"orphans:0;widows:0\"><b>A sudden, violent, and    uncontrollable outburst of emotion, laughter, or physical symptoms</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Catharsis</p>", "option2": " <p style=\"orphans:0;widows:0\">    Epiphany</p>", "option3": " <p style=\"orphans:0;widows:0\">    Paroxysm</p>", "option4": " <p style=\"orphans:0;widows:0\">    Eulogy</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitute is <b>Paroxysm</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Paroxysm:</b>     A sudden, violent outburst or convulsion of an emotion, action,     or physical symptom (e.g., a paroxysm of rage or coughing).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Catharsis:</b>     The process of releasing, and thereby providing relief from,     strong or repressed emotions.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Epiphany:</b>     A moment of sudden, profound revelation or insight.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Eulogy:</b> A speech or     piece of writing that praises someone highly, typically delivered     at a funeral.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate ANTONYM of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>MUNIFICENT</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Altruistic</p>", "option2": " <p style=\"orphans:0;widows:0\">    Parsimonious</p>", "option3": " <p style=\"orphans:0;widows:0\">    Lavish</p>", "option4": " <p style=\"orphans:0;widows:0\">    Bounteous</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>'Munificent'</b> means extremely generous or lavish in    giving.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The word    <b>'Parsimonious'</b> means unwilling to spend money or use    resources; excessively frugal or stingy. Hence, it is the most    appropriate antonym.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meanings    of the other options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Altruistic:</b>     showing selfless concern for the well-being of others (synonymous     in spirit).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Lavish:</b>     given or using in very large amounts; extravagant (synonym).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Bounteous:</b> generously     given or giving in abundance (synonym).</p>    </li></ul>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Parts of the following sentence have been given as options. Select    the option that contains an error.</p>    <p style=\"orphans:0;widows:0\">The team is struggling with the    workload at present, but when the new interns arrive next week, it    be much easier.</p>", "option1": "<p style=\"orphans:0;widows:0\">    with the workload at present</p>", "option2": " <p style=\"orphans:0;widows:0\">    it be much easier</p>", "option3": " <p style=\"orphans:0;widows:0\">    The team is struggling</p>", "option4": " <p style=\"orphans:0;widows:0\">    but when the new interns arrive next week</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The error lies in the segment <b>\"it be much easier\"</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">When a     subordinate time clause begins with words like <i>when, as soon     as, once</i> and refers to a future event using the simple     present tense (<i>when the new interns arrive</i>), the main     clause describing the future outcome must use the future simple     tense (<b>will + base verb</b>).</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Therefore,    <b>\"it be\"</b> should be corrected to <b>\"it will    be\"</b>.</p>    <p style=\"orphans:0;widows:0\"><b>Correct sentence:</b> \"The    team is struggling with the workload at present, but when the new    interns arrive next week, it will be much easier.\"</p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate determiner to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Each of the multinational firms    that participated in the summit presented _______ blueprint for    sustainable growth.</p>", "option1": "<p style=\"orphans:0;widows:0\">    their</p>", "option2": " <p style=\"orphans:0;widows:0\">    its</p>", "option3": " <p style=\"orphans:0;widows:0\">    it's</p>", "option4": " <p style=\"orphans:0;widows:0\">    whose</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct determiner is <b>its</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    subject of the main clause is distributive pronoun <b>'Each'</b>    (in <i>'Each of the multinational firms...'</i>), which is    grammatically singular.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Since the    antecedent refers to a corporate entity/firm (a non-living    thing/organization), the singular neuter possessive determiner    <b>'its'</b> must be used.</p>    <p style=\"orphans:0;widows:0\">3. <i>'Their'</i> is plural and    incorrect because the subject is singular ('Each'). <i>'It's'</i>    is a contraction for 'it is' or 'it has', not a possessive form.</p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate ANTONYM of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Refractory</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Recalcitrant</p>", "option2": " <p style=\"orphans:0;widows:0\">    Compliant</p>", "option3": " <p style=\"orphans:0;widows:0\">    Obstinate</p>", "option4": " <p style=\"orphans:0;widows:0\">    Intractable</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>'Refractory'</b> means stubborn, unmanageable, or    resistant to authority or control.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the given options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Compliant:</b>     disposed or willing to comply with rules or wishes; obedient     (correct antonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Recalcitrant:</b>     stubbornly uncooperative or resistant to authority (synonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Obstinate:</b>     stubbornly refusing to change one's opinion or course of action     (synonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Intractable:</b>     hard to control, manage, or deal with (synonym).</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, the most appropriate    antonym is <b>Compliant</b>.</p>", "question_heading": ""}, {"sr_no": 73, "question": "A ूोौौोgध iौ giॅधn थiपु ीiॅध तहधौपiयnौ ीियियथing iप. Rधोक पुध ूोौौोgध cोनधीिहिद ोnक ौिधधcप पुध ृधौप ोnौथधन पय धोcु तहधौपiयn यहप यी पुध giॅधn ीयहन ोिपधनnोपiॅधौ. Tुध Tुधयनद यी Pिोपध Tधcपयnicौ, ीोन ीनयं ृधing ोn हnौहृौपोnपiोपधक ोcोकधंic ुदूयपुधौiौ, ौधनॅधौ ोौ पुध यॅधनोनcुing ूोनोकigं धसूिोining पुध कदnोंic gधिययgicोि धॅियहपiयn यी Eोनपुैौ िiपुयौूुधनध. Pनयूयौधक cयंूनधुधnौiॅिधद in पुध ंiक-पथधnपiधपु cधnपहनद, पुध पुधयनद ूयौiपौ पुोप Eोनपुैौ नigiक यहपधन cनहौप iौ ीनोcपहनधक inपय nहंधनयहौ ौिोृौ पुोप ीियोप ोपयू पुध कहcपiिध ोौपुधnयौूुधनध. Tुध िोपधनोि ंयपiयn यी पुधौध ंोौौiॅध ूिोपधौ, कनiॅधn ूनiंोनiिद ृद ंोnिपध cयnॅधcपiयn cहननधnपौ ोnक gनोॅiपोपiयnोि ौिोृ ूिहि, cयnपinहयहौिद नधौुोूधौ पधननधौपनiोि पयूयgनोूुद. Aौ पधcपयnic ूिोपधौ cियिiकधक, पुध cनहौप ृहcािधक हूथोनक, cनधोपing ंोgniीicधnप ंयहnपोin नोngधौ ोnक ीयौपधनing inपधnौध यनयgधnद ोियngौiकध ूनयीयहnक ौधiौंic ोcपiॅiपद. Aप कiॅधनgधnप ंोनginौ, पुध ौधूोनोपiयn यी ूिोपधौ थiपnधौौधौ पुध हूथिधिing यी ंोgंो, giॅing नiौध पय ंiक-यcधोn नiकgधौ ोnक ौधो-ीिययन ौूनधोकing. Tनोnौीयनं ृयहnकोनiधौ, थुधनध ूिोपधौ gनinक ूोौप यnध ोnयपुधन
