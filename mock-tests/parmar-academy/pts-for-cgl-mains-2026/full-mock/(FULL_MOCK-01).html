<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>1.) FULL MOCK-01 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

const questions = [{"sr_no": 1, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Which of the following statements is/are correct regarding the    theory of production in microeconomics?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>i. An    isoquant represents all possible combinations of two inputs that    yield the same level of total output.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>ii. The    Law of Variable Proportions applies to long-run production    analysis where all factors are variable.</b></p>    <p style=\"orphans:0;widows:0\"><b>iii. Returns to scale examine    the change in output when all inputs are changed simultaneously in    the same proportion.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only i and ii</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only ii and iii</p>", "option3": " <p style=\"orphans:0;widows:0\">    Only i and iii</p>", "option4": " <p style=\"orphans:0;widows:0\">    Only iii</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statement i is correct: An isoquant (equal product curve) shows    different combinations of two inputs (such as labor and capital)    that result in the same level of total output.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Statement ii    is incorrect: The Law of Variable Proportions operates in the    short run, where at least one input is fixed and other inputs are    varied.</p>    <p style=\"orphans:0;widows:0\">Statement iii is correct: Returns    to scale is a long-run concept that studies the percentage change    in output resulting from a proportionate change in all inputs.</p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following noble gases is the most abundant in the    Earth's atmosphere?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Helium</p>", "option2": " <p style=\"orphans:0;widows:0\">    Neon</p>", "option3": " <p style=\"orphans:0;widows:0\">    Argon</p>", "option4": " <p style=\"orphans:0;widows:0\">    Xenon</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    Argon is the most abundant noble gas (Group 18 element) in the    Earth's atmosphere, constituting approximately 0.93% (by volume)    of dry air. It is the third most abundant gas in the atmosphere    overall, after nitrogen (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890586271_html_2d7eebf1c226798f.gif\" > )    and oxygen (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890586271_html_2aed43dc62125e2d.gif\" > ).    Noble gases exist as monoatomic molecules and are chemically inert    due to their completely filled valence electron shells.</p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>With reference to Census 2027, consider the following    statements:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    1:</b><b> Census 2027 is India's 16th Census overall and the 8th    Census since Independence.</b></p>    <p style=\"orphans:0;widows:0\"><b>Statement 2:</b><b> Ladakh    became the first State/UT in India to complete the entire    population enumeration exercise for Census 2027.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only statement 1 is correct</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only statement 2 is correct</p>", "option3": " <p style=\"orphans:0;widows:0\">    Neither statement 1 nor 2 is correct</p>", "option4": " <p style=\"orphans:0;widows:0\">    Both statements 1 and 2 are correct</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Both statements 1 and 2 are correct.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    1 is correct:</b> Census 2027 is the 16th nationwide Census of    India overall since the first census in 1872, and the 8th Census    conducted since Independence (1951 being the first    post-independence census). It is also India's first-ever digital    census.</p>    <p style=\"orphans:0;widows:0\"><b>Statement 2 is correct:</b> In    October 2026, Ladakh became the first among all States and Union    Territories in India to conclude the complete Census enumeration    exercise (concluded on October 5, 2026), well ahead of the    nationwide synchronous population enumeration scheduled for    February 2027.</p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0\">    <b>When a neutral magnesium atom loses two valence electrons, it    transforms into a/an:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Divalent anion</p>", "option2": " <p style=\"orphans:0;widows:0\">    Divalent cation</p>", "option3": " <p style=\"orphans:0;widows:0\">    Monovalent cation</p>", "option4": " <p style=\"orphans:0;widows:0\">    Monovalent anion</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    When a neutral atom loses electrons, the number of positively    charged protons exceeds the number of negatively charged    electrons, resulting in a positively charged ion called a <b>cation</b>.    Since magnesium (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890586271_html_4fef12b5b0027838.gif\" > )    loses two valence electrons to achieve a stable octet, it acquires    a charge of     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890586271_html_89dcf9be0ede11e4.gif\" >     (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890586271_html_b07a52796d0c130d.gif\" > ),    which is known as a <b>divalent cation</b>.</p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0\">    <b>Under the New Economic Reforms of 1991, the threshold asset    limit for companies was abolished to eliminate pre-entry    investment restrictions by amending which of the following acts?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Foreign Exchange Regulation Act (FERA)</p>", "option2": " <p style=\"orphans:0;widows:0\">    Monopolies and Restrictive Trade Practices (MRTP) Act</p>", "option3": " <p style=\"orphans:0;widows:0\">    Companies Act</p>", "option4": " <p style=\"orphans:0;widows:0\">    Industries (Development and Regulation) Act</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    As part of the New Industrial Policy announced in July 1991, the    Monopolies and Restrictive Trade Practices (MRTP) Act, 1969 was    significantly amended. Under this amendment, the threshold asset    limit (which was ₹100 crore) for MRTP companies was abolished.    Consequently, large firms no longer required prior government    approval for establishing new undertakings, expansions, mergers,    amalgamations, or takeovers.</p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following compounds acts as a Lewis acid due to an    incomplete electron octet around its central atom?</b></p>", "option1": " <p style=\"orphans:0;widows:0\">    Boron trifluoride (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890586271_html_561e4a387b92bc82.gif\" > )</p>", "option2": "  <p style=\"orphans:0;widows:0\">    Ammonia (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890586271_html_7fa0a48e51473a44.gif\" > )</p>", "option3": "  <p style=\"orphans:0;widows:0\">    Water (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890586271_html_17c6905bd7c30046.gif\" > )</p>", "option4": "  <p style=\"orphans:0;widows:0\">    Methane (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890586271_html_d6b9c0b5eb5c5696.gif\" > )</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    According to the Lewis theory of acids and bases, a Lewis acid is    an electron-pair acceptor. In boron trifluoride (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890586271_html_561e4a387b92bc82.gif\" > ),    the central boron atom forms three single covalent bonds with    fluorine atoms and has only six electrons in its valence shell,    resulting in an incomplete octet. Consequently, it readily accepts    an electron pair to attain stable octet configuration, making it a    classic Lewis acid. In contrast,     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890586271_html_7fa0a48e51473a44.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890586271_html_17c6905bd7c30046.gif\" >     possess non-bonding lone pairs and act as Lewis bases, while     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890586271_html_d6b9c0b5eb5c5696.gif\" >     has a complete octet with no tendency to accept electron pairs.</p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0\">    <b>The concept of 'Ecological Pyramids' was first introduced in    1927 by which of the following ecologists?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Ernst Haeckel</p>", "option2": " <p style=\"orphans:0;widows:0\">    Charles Elton</p>", "option3": " <p style=\"orphans:0;widows:0\">    Arthur Tansley</p>", "option4": " <p style=\"orphans:0;widows:0\">    Eugene Odum</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The concept of ecological pyramids was first introduced by British    ecologist Charles Elton in 1927. Because of his pioneering    contribution, ecological pyramids are also commonly known as    'Eltonian pyramids'.</p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0\">    <b>Identify the naturally occurring copper carbonate hydroxide    mineral that has a characteristic bright green colour and is    historically used as an ore of copper and as an ornamental stone.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Azurite</p>", "option2": " <p style=\"orphans:0;widows:0\">    Malachite</p>", "option3": " <p style=\"orphans:0;widows:0\">    Galena</p>", "option4": " <p style=\"orphans:0;widows:0\">    Cinnabar</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    Malachite is a secondary copper mineral with the chemical formula       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890586271_html_36007dd7682904bc.gif\" > .    It is famous for its vibrant green colour and distinctive banded    patterns, making it popular both as a copper ore and as a    decorative gemstone. In comparison, Azurite is deep blue in colour    (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890586271_html_48415647e7ef86c3.gif\" > ),    Galena is a lead sulfide mineral (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890586271_html_94300e2c98034718.gif\" > ),    and Cinnabar is mercury sulfide (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793890586271_html_b67d3744086b1f30.gif\" > ).</p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    <b>The 'Pradhan Mantri Gram Sadak Yojana' (PMGSY), aimed at    providing all-weather road connectivity to unconnected rural    habitations, comes under which of the following Ministries of    India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Ministry of Road Transport and Highways</p>", "option2": " <p style=\"orphans:0;widows:0\">    Ministry of Panchayati Raj</p>", "option3": " <p style=\"orphans:0;widows:0\">    Ministry of Rural Development</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ministry of Agriculture and Farmers Welfare</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Pradhan Mantri Gram Sadak Yojana (PMGSY) was launched in    December 2000 to provide all-weather road connectivity to eligible    unconnected habitations in rural areas. It functions under the    administrative control of the <b>Ministry of Rural Development</b>,    Government of India.</p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    <b>Pratishthana (modern-day Paithan in Maharashtra) was the    primary capital of which of the following ancient dynasties?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Shunga dynasty</p>", "option2": " <p style=\"orphans:0;widows:0\">    Satavahana dynasty</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kanva dynasty</p>", "option4": " <p style=\"orphans:0;widows:0\">    Chedi dynasty</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Pratishthana (modern Paithan, situated on the banks of the    Godavari River in Maharashtra) was the early capital of the    Satavahana dynasty, founded by Simuka. The Satavahanas, also    referred to as the Andhras in the Puranas, later established    Amaravati as an additional administrative center.</p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Which of the following statements is/are correct?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statements:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1) The    magnetic field lines inside a long current-carrying solenoid are    in the form of parallel straight lines, indicating that the    magnetic field is uniform inside it.</b></p>    <p style=\"orphans:0;widows:0\"><b>2) Fleming's Left-Hand Rule is    used to determine the direction of the magnetic field produced    around a straight current-carrying conductor.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only Statement 1</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only Statement 2</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both Statements 1 and 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither Statement 1 nor 2</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statement 1 is correct: Inside a current-carrying solenoid, the    magnetic field lines are parallel straight lines along its axis,    which means the magnetic field is uniform throughout the interior.</p>    <p style=\"orphans:0;widows:0\">Statement 2 is incorrect: The    direction of the magnetic field produced around a straight    current-carrying conductor is determined using the Right-Hand    Thumb Rule (or Maxwell's corkscrew rule). Fleming's Left-Hand Rule    is used to determine the direction of mechanical force experienced    by a current-carrying conductor placed in an external magnetic    field.</p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0\">    <b>Huntington's disease, an inherited neurodegenerative disorder,    is caused by a mutation in the gene located on which human    chromosome?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Chromosome 7</p>", "option2": " <p style=\"orphans:0;widows:0\">    Chromosome 4</p>", "option3": " <p style=\"orphans:0;widows:0\">    Chromosome 11</p>", "option4": " <p style=\"orphans:0;widows:0\">    Chromosome 16</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Huntington's disease is an autosomal dominant neurodegenerative    genetic disorder. It is caused by an abnormal expansion of CAG    trinucleotide repeats in the huntingtin (HTT) gene, which is    located on the short arm of chromosome 4 (specifically at 4p16.3).</p>", "question_heading": ""}, {"sr_no": 13, "question": "In Mोद 2026, पुध Miniौपनद यी Sयciोि Jहौपicध ोnक Eंूयथधनंधnप िोहncुधक थुicु ूयनपोि ोnक ंयृiिध ोूूिicोपiयn पय कigiपप्रध gनोौौनययपौ थयनाीियथौ ोnक धnोृिध नधोि-पiंध ंयniपयनing ोcनयौौ cयंूयnधnपौ ौहcु ोौ Aकोनौु Gनों, Gनोnपौ-in-Aiक, ोnक Hयौपिधस?", "option1": "<p style=\"orphans:0;widows:0\">    PM-AJAY Portal</p>", "option2": " <p style=\"orphans:0;widows:0\">    PM-DAKSH Portal</p>", "option3": " <p style=\"orphans:0;widows:0\">    PM-JANMAN Portal</p>", "option4": " <p style=\"orphans:0;widows:0\">    PM-YASASVI Portal</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In May 2026, Union Minister of Social Justice and Empowerment Dr.    Virendra Kumar launched the <b>PM-AJAY Portal</b> and AJAY Mobile    App in New Delhi. The digital platform was introduced to    transition the implementation of the Pradhan Mantri Anusuchit    Jaati Abhyuday Yojana (PM-AJAY) from manual paper-based processes    to an end-to-end digital system. It provides real-time monitoring,    digital preparation of Village Development Plans (VDPs), and    milestone-linked fund disbursement across its three major    components: Adarsh Gram, Grants-in-Aid (GIA) for skilling and    livelihoods, and Hostels in educational institutions.</p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following was appointed as the first Minister of    Communications in the first Cabinet of Independent India formed in    1947?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Rafi Ahmed Kidwai</p>", "option2": " <p style=\"orphans:0;widows:0\">    C. H. Bhabha</p>", "option3": " <p style=\"orphans:0;widows:0\">    N. V. Gadgil</p>", "option4": " <p style=\"orphans:0;widows:0\">    John Mathai</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Rafi Ahmed Kidwai served as the first Minister of Communications    in the first Cabinet of Independent India formed on 15 August 1947    under Prime Minister Jawaharlal Nehru. Among the other options: C.    H. Bhabha held the Commerce portfolio, N. V. Gadgil held Works,    Mines and Power, and Dr. John Mathai held Railways and Transport.</p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following was a key institutional reform    implemented during the early Five-Year Plans in India to address    agrarian stagnation?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Large-scale distribution of chemical fertilizers</p>", "option2": " <p style=\"orphans:0;widows:0\">    Abolition of intermediaries like the Zamindari system</p>", "option3": " <p style=\"orphans:0;widows:0\">    Introduction of High Yielding Variety (HYV) seeds</p>", "option4": " <p style=\"orphans:0;widows:0\">    Establishment of the National Bank for Agriculture and Rural    Development (NABARD)</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    During the early Five-Year Plans after independence, the Indian    government focused on institutional reforms (land reforms) to    address stagnation in the agricultural sector. The most    significant and successful among these was the abolition of    intermediaries (such as the Zamindari system), which brought    millions of cultivators into direct contact with the state. In    contrast, technological reforms such as High Yielding Variety    (HYV) seeds and chemical fertilizers were introduced in the    mid-1960s (Green Revolution), and NABARD was established in 1982    during the Sixth Five-Year Plan.</p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following scientists coined the term 'Meiosis'    for the reductional cell division in 1905?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Walther Flemming</p>", "option2": " <p style=\"orphans:0;widows:0\">    J. B. Farmer and J. E. S. Moore</p>", "option3": " <p style=\"orphans:0;widows:0\">    Rudolf Virchow</p>", "option4": " <p style=\"orphans:0;widows:0\">    Theodor Schwann</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The term 'Meiosis' was coined by J. B. Farmer and J. E. S. Moore    in 1905. Meiosis is a specialised form of cell division that    reduces the chromosome number by half, leading to the formation of    haploid gametes.</p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following Constitutional Amendment Acts authorized    the President of India to require the Council of Ministers to    reconsider its advice once?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    44th Constitutional Amendment Act, 1978</p>", "option2": " <p style=\"orphans:0;widows:0\">    42nd Constitutional Amendment Act, 1976</p>", "option3": " <p style=\"orphans:0;widows:0\">    52nd Constitutional Amendment Act, 1985</p>", "option4": " <p style=\"orphans:0;widows:0\">    61st Constitutional Amendment Act, 1989</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The 44th Constitutional Amendment Act of 1978 amended Article    74(1) to empower the President to require the Council of Ministers    to reconsider its advice, either generally or otherwise. However,    the President is bound to act in accordance with the advice    tendered after such reconsideration.</p>", "question_heading": ""}, {"sr_no": 18, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Match the books in List 1 with their authors in List 2.</b></p>    <table>     <col>      <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <br>        </p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>List 1 (Book)</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <br>        </p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>List 2 (Author)</b></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>A.</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>Unhappy India</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>1.</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>Dr. Rajendra Prasad</b></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>B.</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>India Divided</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>2.</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>Subhas Chandra Bose</b></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>C.</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>The Indian Struggle</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>3.</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>Lala Lajpat Rai</b></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>D.</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>Poverty and Un-British Rule in India</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>4.</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>Dadabhai Naoroji</b></p>      </td>     </tr>    </table>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">    A - 3, B - 1, C - 2, D - 4</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    A - 1, B - 3, C - 4, D - 2</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    A - 3, B - 2, C - 1, D - 4</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    A - 2, B - 1, C - 4, D - 3</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct matching is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <b>Unhappy India</b> was written by <b>Lala Lajpat Rai</b> in    response to Katherine Mayo's book 'Mother India'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <b>India Divided</b> was written by <b>Dr. Rajendra Prasad</b>,    tracing the historical background of the partition.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <b>The Indian Struggle</b> was written by <b>Subhas Chandra    Bose</b>, covering the Indian independence movement from 1920 to    1942.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <b>Poverty and Un-British Rule in India</b> was authored by    <b>Dadabhai Naoroji</b>, in which he propounded the 'Drain of    Wealth' theory.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Therefore, the correct code is A - 3, B - 1, C - 2, D - 4.</p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <b>The abnormal rise in sea level along a coast caused by low    atmospheric pressure and strong onshore winds of a tropical    cyclone is known as:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Storm surge</p>", "option2": " <p style=\"orphans:0;widows:0\">    Tsunami</p>", "option3": " <p style=\"orphans:0;widows:0\">    Rip current</p>", "option4": " <p style=\"orphans:0;widows:0\">    Spring tide</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    A storm surge is an abnormal rise of water generated by a storm,    over and above the predicted astronomical tides. It is primarily    caused by the strong onshore winds of a tropical cyclone pushing    ocean water toward the coast, combined with the low atmospheric    pressure at the storm's center, making it one of the most    destructive aspects of coastal cyclonic hazards.</p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <b>In which of the following landmark cases did the Supreme Court    of India observe that \"the Indian Constitution is founded on    the bedrock of the balance between Fundamental Rights and    Directive Principles of State Policy\"?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Shankari Prasad Case, 1951</p>", "option2": " <p style=\"orphans:0;widows:0\">    Minerva Mills Case, 1980</p>", "option3": " <p style=\"orphans:0;widows:0\">    A.K. Gopalan Case, 1950</p>", "option4": " <p style=\"orphans:0;widows:0\">    Indira Sawhney Case, 1992</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In the landmark <b>Minerva Mills Case (1980)</b>, the Supreme    Court ruled that the Indian Constitution is founded on the bedrock    of the balance between Fundamental Rights (Part III) and Directive    Principles of State Policy (Part IV). The Court observed that    giving absolute primacy to one over the other disturbs the harmony    of the Constitution and held that this balance is part of the    basic structure of the Constitution.</p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <b>On the occasion of the 16th National Voters' Day in January    2026, who addressed the national gathering in New Delhi and stated    that 'voting is not merely a political expression; it is a    reflection of citizens' faith in the democratic process of    elections'?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Chief Election Commissioner Gyanesh Kumar</p>", "option2": " <p style=\"orphans:0;widows:0\">    President Droupadi Murmu</p>", "option3": " <p style=\"orphans:0;widows:0\">    Prime Minister Narendra Modi</p>", "option4": " <p style=\"orphans:0;widows:0\">    Union Law Minister Arjun Ram Meghwal</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    President Droupadi Murmu graced and addressed the 16th National    Voters' Day celebrations in New Delhi on 25 January 2026. In her    address, she noted that voting is not merely a political    expression but a reflection of citizens' faith in the democratic    process of elections and a means to express their aspirations.    National Voters' Day has been observed annually on January 25    since 2011 to commemorate the founding day of the Election    Commission of India (25 January 1950).</p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <b>In September 2024, the Indian men's chess team won its historic    first-ever gold medal at the 45th FIDE Chess Olympiad held in    Budapest, Hungary. Which Indian Grandmaster won the individual    gold medal on Board 1 with an extraordinary performance rating of    over 3050?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Arjun Erigaisi</p>", "option2": " <p style=\"orphans:0;widows:0\">    R Praggnanandhaa</p>", "option3": " <p style=\"orphans:0;widows:0\">    D Gukesh</p>", "option4": " <p style=\"orphans:0;widows:0\">    Vidit Gujrathi</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    At the 45th FIDE Chess Olympiad held in Budapest, Hungary in    September 2024, India scripted history by winning gold medals in    both the Open and Women's sections. In the Open section,    18-year-old Grandmaster <b>D Gukesh</b> played on Board 1 and    scored an incredible 9 points out of 10 games (performance rating    of 3056), securing the individual gold medal on the top board.    Arjun Erigaisi won the individual gold medal on Board 3.</p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct option regarding the two statements given    below labelled as Assertion (A) and Reason (R).</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Assertion    (A): The Battle of Khanwa (1527) was more decisive than the First    Battle of Panipat in establishing Mughal rule in North India.</b></p>    <p style=\"orphans:0;widows:0\"><b>Reason (R): Babur's victory    over the Rajput confederacy led by Rana Sanga eliminated the most    formidable challenge to his emerging empire in India.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Both (A) and (R) are true, and (R) is the correct explanation of    (A).</p>", "option2": " <p style=\"orphans:0;widows:0\">    Both (A) and (R) are true, but (R) is not the correct explanation    of (A).</p>", "option3": " <p style=\"orphans:0;widows:0\">    (A) is true, but (R) is false.</p>", "option4": " <p style=\"orphans:0;widows:0\">    (A) is false, but (R) is true.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Both (A) and (R) are true, and (R) correctly explains (A). While    the First Battle of Panipat (1526) defeated Ibrahim Lodi and broke    Afghan rule in Delhi, Babur's position in India remained insecure    due to the powerful Rajput confederacy led by Rana Sanga of Mewar.    The Battle of Khanwa (1527) resulted in Babur's decisive victory    over this united front, removing the single greatest threat to his    presence in Hindustan and firmly securing the foundation of the    Mughal Empire.</p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <b>In September 2026, Union Minister of Health and Family Welfare    J.P. Nadda inaugurated which flagship event in New Delhi to mark    eight years of AB PM-JAY and five years of the Ayushman Bharat    Digital Mission (ABDM)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Arogya Manthan 2026</p>", "option2": " <p style=\"orphans:0;widows:0\">    Swasthya Chintan Shivir 2026</p>", "option3": " <p style=\"orphans:0;widows:0\">    Ayushman Bharat Utsav 2026</p>", "option4": " <p style=\"orphans:0;widows:0\">    Digital Swasthya Samagam 2026</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Union Minister for Health and Family Welfare J.P. Nadda    inaugurated <b>Arogya Manthan 2026</b> at Vigyan Bhawan, New    Delhi, on 25 September 2026. The two-day event, organized by the    National Health Authority (NHA), commemorated eight years of    Ayushman Bharat Pradhan Mantri Jan Arogya Yojana (AB PM-JAY,    launched in September 2018) and five years of the Ayushman Bharat    Digital Mission (ABDM, launched nationwide in September 2021).    Several key digital initiatives were launched during the event,    including the National Healthcare Providers Registry (NHPR) Mobile    App and a Secure Data Environment (SDE) developed in collaboration    with IISc Bengaluru.</p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <b>In which of the following regions of India is the diurnal    (daily) range of temperature typically the highest?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Malabar Coast</p>", "option2": " <p style=\"orphans:0;widows:0\">    Thar Desert</p>", "option3": " <p style=\"orphans:0;widows:0\">    Andaman and Nicobar Islands</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sundarbans Delta</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Thar Desert experiences the highest diurnal range of    temperature in India. Because sand absorbs and radiates heat very    rapidly and there is a lack of moisture/cloud cover, daytime    temperatures can surge up to 50°C while night temperatures may    drop significantly to around 15°C. In contrast, coastal and    island regions have very low diurnal ranges due to the moderating    influence of the sea.</p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following application layer protocols is primarily used for initiating, maintaining, and terminating real-time communication sessions involving voice, video, and messaging over IP networks?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SNMP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SMTP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SIP</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FTP</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SIP (Session Initiation Protocol) is a signaling protocol used for initiating, maintaining, modifying, and terminating real-time multimedia sessions such as voice calls, video conferences, and messaging over Internet Protocol (IP) networks. In contrast, SMTP is used for electronic mail transmission, SNMP is used for network management, and FTP is used for transferring computer files between a client and a server.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">In MS PowerPoint, what is the primary purpose of using the 'Hide Slide' feature?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>To permanently delete the slide from the presentation</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>To prevent the slide from being displayed during the slide show without deleting it</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>To protect the slide content with a password</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>To compress media files embedded within the slide</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The 'Hide Slide' feature in MS PowerPoint allows users to prevent selected slides from appearing during a slide show while keeping them intact in the presentation file. This is especially useful when presenting to different audiences without needing to create multiple versions of the same file.</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following protocols is used to ensure secure data transmission between a web browser and a website by encrypting the communication?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HTTP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FTP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HTTPS</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SMTP</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HTTPS (Hypertext Transfer Protocol Secure) is the secure version of HTTP. It uses encryption protocols, such as TLS (Transport Layer Security) or SSL (Secure Sockets Layer), to protect communication and sensitive data transferred between a client's web browser and a web server.</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which function key is used to edit the contents of an active cell in MS Excel?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F7</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F12</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In MS Excel, pressing the </span><span style=\"font-weight:bold\">F2</span><span> key allows the user to edit the active cell and places the cursor at the end of the cell's contents. Other keys include: F4 (repeats the last command or toggles cell reference types), F7 (runs spelling check), and F12 (opens the 'Save As' dialog box).</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">In Microsoft Outlook, which feature allows you to send a response to the original sender as well as all other recipients listed in the 'To' and 'Cc' lines of the received message?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Forward</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Reply</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Reply All</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Resend</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In Microsoft Outlook and other email applications, clicking 'Reply All' sends your response to the original sender plus everyone included in the 'To' and 'Cc' fields. In contrast, 'Reply' sends a response only to the original sender, and 'Forward' is used to pass the message on to someone not involved in the original conversation.</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following is primarily used to block unauthorized access to a computer network by filtering incoming and outgoing traffic?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Firewall</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Antivirus</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Trojan Horse</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Disk Defragmenter</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A </span><span style=\"font-weight:bold\">Firewall</span><span> is a network security system that monitors and controls incoming and outgoing network traffic based on predetermined security rules. It acts as a protective barrier between a trusted internal network and an untrusted external network (such as the Internet) to prevent unauthorized access.</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following keyboard shortcuts is used to change the case (UPPERCASE, lowercase, Title Case) of the selected text in MS Word?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + F3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Shift + F3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Alt + F3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Shift + C</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In Microsoft Word, the </span><span style=\"font-weight:bold\">Shift + F3</span><span> shortcut toggles the selected text between lowercase, UPPERCASE, and Capitalize Each Word (Title Case). In contrast, </span><span style=\"font-style:italic\">Ctrl + F3</span><span> cuts selected content to the Spike, </span><span style=\"font-style:italic\">Alt + F3</span><span> creates a new AutoText entry, and </span><span style=\"font-style:italic\">Ctrl + Shift + C</span><span> copies formatting from the selected text.</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which networking device operates primarily at the Network layer (Layer 3) of the OSI model to connect multiple distinct networks and route data packets based on IP addresses?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hub</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Repeater</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Router</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Bridge</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A </span><span style=\"font-weight:bold\">Router</span><span> is a networking device that operates at Layer 3 (Network Layer) of the OSI model. Its primary function is to forward data packets between different networks (such as connecting a local area network to the internet) using logical addressing (IP addresses) to determine the best path for packet transmission.</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which type of computer memory uses flip-flop circuits to store each bit of data and therefore does not require periodic refreshing?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Dynamic RAM (DRAM)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Static RAM (SRAM)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Synchronous DRAM (SDRAM)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Double Data Rate RAM (DDR RAM)</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Static RAM (SRAM) stores data using bistable latching circuitry (flip-flops, typically made of 4 to 6 transistors). Unlike Dynamic RAM (DRAM), which stores bits as electrical charges on capacitors that leak over time, SRAM does not leak charge and retains its stored information as long as continuous power is supplied, eliminating the need for periodic refreshing cycles. SDRAM and DDR RAM are both subtypes of DRAM and still require periodic refreshing.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which type of computer virus changes its signature or code each time it replicates, making it extremely difficult to detect by traditional signature-based antivirus software?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Macro Virus</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Polymorphic Virus</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Direct Action Virus</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Multipartite Virus</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A </span><span style=\"font-weight:bold\">Polymorphic Virus</span><span> is designed to evade detection by traditional signature-based antivirus programs. Each time it infects a file or replicates, it modifies its internal code or encryption algorithm while keeping its core harmful functionality intact, making it appear different every time.</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which tool in MS Word is used to copy all formatting, such as font style, size, and color, from one piece of text and apply it to another?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Quick Parts</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Format Painter</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mail Merge</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>WordArt</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In MS Word, the </span><span style=\"font-weight:bold\">Format Painter</span><span> tool (found on the Home tab) is used to copy formatting (such as font, color, text effects, and size) from one section of text and quickly apply it to another. The keyboard shortcut to copy formatting is </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793892525849_image001.png\" width=\"114\" height=\"21\" alt style=\"vertical-align:middle\" ><span> and to paste it is </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793892525849_image002.png\" width=\"115\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which feature in MS PowerPoint allows a user to apply universal formatting, such as font styles, logos, and placeholders, across all slides simultaneously without modifying each slide individually?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Slide Sorter</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Slide Master</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Animation Pane</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Presenter View</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The </span><span style=\"font-weight:bold\">Slide Master</span><span> in MS PowerPoint is a top-level slide that controls the theme, layout, background, color, fonts, and positioning of all slides within a presentation. Making changes to the Slide Master automatically applies those design elements across all associated slides, ensuring overall visual consistency and saving time.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following protocols is primarily responsible for transmitting/sending outgoing electronic mail (e-mail) messages across the Internet?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>IMAP (Internet Message Access Protocol)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SMTP (Simple Mail Transfer Protocol)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>POP3 (Post Office Protocol 3)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FTP (File Transfer Protocol)</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SMTP (Simple Mail Transfer Protocol) is an application layer protocol used to send and route outgoing emails between mail servers and from email clients to mail servers. In contrast, POP3 and IMAP are used to retrieve incoming emails from a mail server, and FTP is used for transferring files.</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Match the Windows system utilities in Column A with their primary functions in Column B.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Column A:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. Disk Cleanup</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. Task Scheduler</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3. Event Viewer</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">4. Device Manager</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Column B:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">a) Configures, updates, and troubleshoots hardware components and their drivers</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">b) Automates tasks and programs to execute at predetermined times</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">c) Displays detailed logs of significant system events, application errors, and security audits</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">d) Scans and deletes temporary and unnecessary files to free up storage space</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - b, 2 - d, 3 - a, 4 - c</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - d, 2 - b, 3 - c, 4 - a</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - c, 2 - b, 3 - d, 4 - a</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - d, 2 - a, 3 - c, 4 - b</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The correct match is </span><span style=\"font-weight:bold\">1 - d, 2 - b, 3 - c, 4 - a</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">Disk Cleanup (1 - d):</span><span> A utility designed to free up disk space by searching for and removing temporary, cache, and unnecessary system files.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">Task Scheduler (2 - b):</span><span> A tool that enables users to schedule and automate tasks, scripts, or programs to run automatically at specific times or when certain triggers occur.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">Event Viewer (3 - c):</span><span> A component that displays administrative logs of system events, errors, warnings, and audit logs to help troubleshoot system issues.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">Device Manager (4 - a):</span><span> An administrative tool used to view, configure, and manage installed hardware devices and their device drivers.</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">With reference to the functionalities of File Explorer in Windows 10/11, consider the following statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">I. It allows users to map a shared network folder to a drive letter.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">II. It can be used to shrink or extend disk volume partitions.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">III. It provides built-in options to toggle the visibility of file name extensions and hidden items.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the statements given above are correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I and II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I and III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only II and III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I, II and III</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement I is correct: File Explorer includes a built-in 'Map network drive' feature that allows users to assign a local drive letter (like Z:) to a shared network directory.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement II is incorrect: Modifying, shrinking, or extending hard drive partition sizes cannot be performed through File Explorer; it requires the Disk Management utility (diskmgmt.msc) or command-line tools like diskpart.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement III is correct: Under the 'View' tab in File Explorer, users can directly check or uncheck options to show/hide file name extensions and hidden files/folders.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, only statements I and III are correct.</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following statements regarding computer memory is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. Static RAM (SRAM) requires periodic refreshing to retain stored data.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. Cache memory is a high-speed memory positioned between the CPU and the main memory to reduce access time.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both 1 and 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither 1 nor 2</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement 1 is incorrect: Dynamic RAM (DRAM) requires periodic refreshing because it stores data in capacitors that leak charge over time. St
