in-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Ratio = [180(n − 2)/n] ÷ [180(n − 1)/n] = (n − 2)/(n − 1).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. (n − 2)/(n − 1) = 3/4 ⇒ 4n − 8 = 3n − 3 ⇒ n = 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Check: pentagon angle = 108°, decagon angle = 144°; 108 : 144 = 3 : 4 ✓</span></p>", "question_heading": ""}, {"sr_no": 128, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A rhombus has a perimeter of 100 cm and one of its diagonals is 40 cm. Find the area of the circle inscribed inside this rhombus.</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image031.png\" width=\"34\" height=\"19\" alt style=\"vertical-align:middle\" ><span> cm²</span></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image032.png\" width=\"34\" height=\"19\" alt style=\"vertical-align:middle\" ><span> cm²</span></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image033.png\" width=\"34\" height=\"19\" alt style=\"vertical-align:middle\" ><span> cm²</span></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image034.png\" width=\"34\" height=\"19\" alt style=\"vertical-align:middle\" ><span> cm²</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Diagonals of a rhombus bisect each other at right angles, so side² = (d₁/2)² + (d₂/2)²;</span><span>  </span><span>Area = ½ × d₁ × d₂;</span><span>  </span><span>Inradius r = Area ÷ semi-perimeter</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Side = 100 ÷ 4 = 25 cm. Half of the known diagonal = 40 ÷ 2 = 20 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Half of the other diagonal = √(25² − 20²) = √(625 − 400) = √225 = 15 cm, so the other diagonal = 30 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Area of rhombus = ½ × 40 × 30 = 600 cm².</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Semi-perimeter = 100 ÷ 2 = 50 cm, so inradius r = 600 ÷ 50 = 12 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Area of inscribed circle = πr² = π × 12² = 144π cm².</span></p>", "question_heading": ""}, {"sr_no": 129, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image016.png\" width=\"47\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image020.png\" width=\"12\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image035.png\" width=\"10\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> are points on sides </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image036.png\" width=\"21\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image037.png\" width=\"19\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> respectively such that </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image038.png\" width=\"54\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">. If </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image039.png\" width=\"87\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">, and the area of quadrilateral </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image040.png\" width=\"41\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> is 126 cm², find the area of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image041.png\" width=\"48\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>27 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>24 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>36 cm²</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>If DE ∥ BC, then △ADE ∼ △ABC, and the ratio of their areas = (ratio of corresponding sides)²</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. AD : DB = 2 : 3 ⇒ AD : AB = 2 : 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. ar(△ADE) / ar(△ABC) = (2/5)² = 4/25. Let ar(△ADE) = 4k and ar(△ABC) = 25k.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. ar(DBCE) = ar(△ABC) − ar(△ADE) = 25k − 4k = 21k.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. 21k = 126 ⇒ k = 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. ar(△ADE) = 4k = 4 × 6 = 24 cm².</span></p>", "question_heading": ""}, {"sr_no": 130, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The side of a regular hexagon is 12 cm. A circle is circumscribed around it. Find the area of the region inside the circle but outside the hexagon.</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image042.png\" width=\"89\" height=\"21\" alt style=\"vertical-align:middle\" ><span> cm²</span></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image043.png\" width=\"89\" height=\"21\" alt style=\"vertical-align:middle\" ><span> cm²</span></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image044.png\" width=\"73\" height=\"21\" alt style=\"vertical-align:middle\" ><span> cm²</span></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image045.png\" width=\"89\" height=\"21\" alt style=\"vertical-align:middle\" ><span> cm²</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Regular hexagon: circumradius = side;</span><span>  </span><span>Area = (3√3/2) × side²;</span><span>  </span><span>Area of circle = πR²</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. A regular hexagon is made of 6 equilateral triangles, so the circumradius R = side = 12 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Area of circle = π × 12² = 144π cm².</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Area of hexagon = (3√3/2) × 12² = (3√3/2) × 144 = 216√3 cm².</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Required area = 144π − 216√3 = 72(2π − 3√3) cm².</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Check: 6 × (√3/4) × 144 = 6 × 36√3 = 216√3 ✓</span></p>", "question_heading": ""}, {"sr_no": 131, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The base of a right pyramid is an equilateral triangle of side </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image046.png\" width=\"28\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> cm. If the total surface area of the pyramid is </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image047.png\" width=\"45\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> cm², find its height.</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image048.png\" width=\"26\" height=\"20\" alt style=\"vertical-align:middle\" ><span> cm</span></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image049.png\" width=\"26\" height=\"21\" alt style=\"vertical-align:middle\" ><span> cm</span></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image050.png\" width=\"26\" height=\"20\" alt style=\"vertical-align:middle\" ><span> cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3 cm</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Area of equilateral triangle = (√3/4)a²;</span><span>  </span><span>Lateral surface area = ½ × perimeter × slant height;</span><span>  </span><span>Height h = √(l² − r²), where r = inradius of the base</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Base area = (√3/4) × (8√3)² = (√3/4) × 192 = 48√3 cm².</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Lateral surface area = Total surface area − Base area = 108√3 − 48√3 = 60√3 cm².</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Perimeter of base = 3 × 8√3 = 24√3 cm. So ½ × 24√3 × l = 60√3 ⇒ 12√3 × l = 60√3 ⇒ slant height l = 5 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Inradius of the equilateral base = a/(2√3) = 8√3/(2√3) = 4 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Height h = √(l² − r²) = √(25 − 16) = √9 = 3 cm.</span></p>", "question_heading": ""}, {"sr_no": 132, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A solid metal sphere of radius 6 cm is melted and recast into a hollow cylinder of uniform thickness. If the height of the cylinder is 32 cm and its external radius is 5 cm, find the thickness of the cylinder.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1.5 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2.5 cm</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Volume of sphere = (4/3)πr³;</span><span>  </span><span>Volume of hollow cylinder = πh(R² − r²);</span><span>  </span><span>Volume remains the same on recasting</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Volume of sphere = (4/3)π × 6³ = (4/3)π × 216 = 288π cm³.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Hollow cylinder: external radius R = 5 cm, height h = 32 cm, internal radius r (unknown). Volume = π(25 − r²) × 32.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 32π(25 − r²) = 288π ⇒ 25 − r² = 9 ⇒ r² = 16 ⇒ r = 4 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Thickness = R − r = 5 − 4 = 1 cm.</span></p>", "question_heading": ""}, {"sr_no": 133, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A cube with edge length 12 cm is painted red on all faces and cut into 1 cm³ smaller cubes. How many of these smaller cubes have at least one face painted?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>728</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1152</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1216</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>For an n × n × n cube cut into unit cubes: cubes with no painted face = (n − 2)³;</span><span>  </span><span>cubes with at least one painted face = n³ − (n − 2)³</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Total small cubes = 12³ = 1728.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Cubes with no painted face form the inner cube, one layer removed from every side: (12 − 2)³ = 10³ = 1000.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Cubes with at least one face painted = 1728 − 1000 = 728.</span></p>", "question_heading": ""}, {"sr_no": 134, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A hollow metallic sphere has internal and external radii of 3 cm and 5 cm respectively. It is melted and recast into a solid right circular cone of height 8 cm. Find the radius of the base of the cone.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14 cm</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Volume of hollow sphere = (4/3)π(R³ − r³);</span><span>  </span><span>Volume of cone = (1/3)πr²h</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Volume of hollow sphere = (4/3)π(5³ − 3³) = (4/3)π(125 − 27) = (4/3)π × 98 = 392π/3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Volume of cone = (1/3) × π × r² × 8 = 8πr²/3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Melting does not change volume: 8πr²/3 = 392π/3 ⇒ r² = 392 ÷ 8 = 49.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. r = 7 cm.</span></p>", "question_heading": ""}, {"sr_no": 135, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The mean of 50 observations is 40. Later, it was discovered that two observations were wrongly read as 23 and 45 instead of 32 and 54. Additionally, one observation of 58 was mistakenly added. Find the correct mean of the remaining 49 observations.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>39.8</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40.0</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40.2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40.4</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Sum of observations = Mean × Number of observations;</span><span>  </span><span>Correct sum = Wrong sum + corrections</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Incorrect sum = 50 × 40 = 2000.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Corrections: 23 should be 32 (+9) and 45 should be 54 (+9). Sum becomes 2000 + 9 + 9 = 2018.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. The wrongly added observation 58 is removed: sum = 2018 − 58 = 1960, and the number of observations = 49.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Correct mean = 1960 ÷ 49 = 40.</span></p>", "question_heading": ""}, {"sr_no": 136, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The weighted arithmetic mean of the first </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image028.png\" width=\"10\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> natural numbers, where the weight of each number </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image051.png\" width=\"9\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> is </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image052.png\" width=\"17\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">, is given by:</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image053.png\" width=\"63\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image054.png\" width=\"55\" height=\"36\" alt style=\"vertical-align:middle\" ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image055.png\" width=\"34\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image056.png\" width=\"63\" height=\"38\" alt style=\"vertical-align:middle\" ></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Σk = n(n + 1)/2;</span><span>  </span><span>Σk² = n(n + 1)(2n + 1)/6;</span><span>  </span><span>Σk³ = [n(n + 1)/2]²;</span><span>  </span><span>Weighted mean = Σ(w × x)/Σw</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. The weight of k is k², so weighted mean = Σ(k × k²)/Σk² = Σk³/Σk².</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Σk³ = n²(n + 1)²/4 and Σk² = n(n + 1)(2n + 1)/6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Mean = [n²(n + 1)²/4] × [6/(n(n + 1)(2n + 1))].</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Cancel n(n + 1): Mean = 6n(n + 1)/[4(2n + 1)] = 3n(n + 1)/[2(2n + 1)].</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Check n = 2: (1×1 + 2×4)/(1 + 4) = 9/5, and 3×2×3/(2×5) = 18/10 = 9/5 ✓</span></p>", "question_heading": ""}, {"sr_no": 137, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Three fair dice are rolled simultaneously. What is the probability that the sum of the numbers appearing on the top faces is greater than 15?</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image057.png\" width=\"25\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image058.png\" width=\"25\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image059.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image060.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Probability = Favourable outcomes ÷ Total outcomes</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Total outcomes with three dice = 6³ = 216.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Sum greater than 15 means the sum is 16, 17 or 18.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Sum 16: {6, 6, 4} in 3 arrangements and {6, 5, 5} in 3 arrangements = 6 outcomes.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Sum 17: {6, 6, 5} in 3 arrangements = 3 outcomes. Sum 18: {6, 6, 6} = 1 outcome.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Favourable outcomes = 6 + 3 + 1 = 10, so P = 10/216 = 5/108.</span></p>", "question_heading": ""}, {"sr_no": 138, "question": "A ृोg cयnपोinौ 4 नधक ृोििस, 5 ृिहध ृोििस, ोnक 3 gनधधn ृोििस. Tुनधध ृोििस ोनध कनोथn ोप नोnकयं यnध ोीपधन ोnयपुधन थiपुयहप नधूिोcधंधnप. Finक पुध ूनयृोृiिiपद पुोप पुध ीiनौप ृोिि iौ नधक, पुध ौधcयnक iौ ृिहध, ोnक पुध पुiनक iौ gनधधn.", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image061.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image062.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image063.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image064.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Without replacement: P(A, then B, then C) = P(A) × P(B after A) × P(C after A and B)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Total balls = 4 + 5 + 3 = 12.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. P(first is red) = 4/12.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 11 balls are left: P(second is blue) = 5/11.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. 10 balls are left: P(third is green) = 3/10.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. P = 4/12 × 5/11 × 3/10 = 60/1320 = 1/22.</span></p>", "question_heading": ""}, {"sr_no": 139, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">How many 5-digit even numbers can be formed using the digits 0, 1, 2, 3, 4, 5 without repetition?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>288</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>312</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>336</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>360</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Multiplication principle of counting. For an even number the units digit must be 0, 2 or 4, and the first digit cannot be 0</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. A 5-digit number from {0, 1, 2, 3, 4, 5} without repetition uses 5 of the 6 digits.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Case 1, units digit = 0: the other 4 places are filled from the remaining 5 digits in 5 × 4 × 3 × 2 = 120 ways.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Case 2, units digit = 2 or 4 (2 choices): the first place cannot be 0, so it has 4 choices; the 3 middle places are filled from the remaining 4 digits in 4 × 3 × 2 = 24 ways.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Case 2 total = 2 × 4 × 24 = 192.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Total even numbers = 120 + 192 = 312.</span></p>", "question_heading": ""}, {"sr_no": 140, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">At what time between 5:00 and 6:00 will the hands of a clock be at right angles for the second time?</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image065.png\" width=\"48\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image066.png\" width=\"48\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image067.png\" width=\"48\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image068.png\" width=\"48\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Minute hand moves 6° per minute, hour hand 0.5° per minute, so the minute hand gains 5.5° per minute. At 5:00 the hour hand is 5 × 30° = 150° ahead</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. After m minutes past 5:00, the minute hand gains 5.5m degrees, so the gap changes from 150° to (150 − 5.5m)°.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Hands are at right angles when 5.5m − 150 = ±90.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 5.5m = 60 ⇒ m = 120/11 = 10 10/11 minutes: this is the first right angle (5:10 10/11).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. 5.5m = 240 ⇒ m = 480/11 = 43 7/11 minutes: this is the second right angle.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. So the time is 5:43 7/11.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. Check: minute hand at 43 7/11 × 6 = 261.8°; hour hand at 150° + 0.5 × 43.64 = 171.8°; difference = 90° ✓</span></p>", "question_heading": ""}, {"sr_no": 141, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A can complete a piece of work in 20 days and B in 30 days. They started working together, but A left 4 days before the completion of the work. Find the total number of days taken to complete the work.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14.4 days</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13.6 days</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15.2 days</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>16.0 days</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Work = Efficiency × Time;</span><span>  </span><span>Total work = LCM of the days taken</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Total work = LCM(20, 30) = 60 units. A's efficiency = 60/20 = 3 units/day; B's efficiency = 60/30 = 2 units/day.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Let the total time be x days. B works for all x days, while A works for (x − 4) days.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 3(x − 4) + 2x = 60 ⇒ 5x − 12 = 60 ⇒ 5x = 72.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. x = 72/5 = 14.4 days.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Check: A works 10.4 days × 3 = 31.2; B works 14.4 days × 2 = 28.8; 31.2 + 28.8 = 60 ✓</span></p>", "question_heading": ""}, {"sr_no": 142, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A person walks up a moving escalator (going up) in 30 seconds taking 20 steps. If he doubles his walking speed, he reaches the top in 18 seconds. How many total steps are visible on the stationary escalator?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>45</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>50</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>30</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>60</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Steps visible on the stationary escalator N = steps the person walks + steps the escalator carries him in that time</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Walking speed = 20/30 = 2/3 steps/s. Let the escalator's speed be e steps/s.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Case 1: in 30 s he walks 20 steps and the escalator moves 30e steps, so N = 20 + 30e ... (i)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Case 2: doubled speed = 4/3 steps/s; in 18 s he walks (4/3) × 18 = 24 steps, so N = 24 + 18e ... (ii)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Equate (i) and (ii): 20 + 30e = 24 + 18e ⇒ 12e = 4 ⇒ e = 1/3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. N = 20 + 30 × (1/3) = 30.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. Check with (ii): 24 + 18 × (1/3) = 30 ✓</span></p>", "question_heading": ""}, {"sr_no": 143, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image069.png\" width=\"199\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image070.png\" width=\"97\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">, find the value of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image071.png\" width=\"8\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>If ratios are given, write each quantity as a multiple of a common constant k; adding all three sums gives 2(a + b + c)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Let a + b = 6k, b + c = 7k, c + a = 8k.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Adding: 2(a + b + c) = 21k ⇒ 2 × 14 = 21k ⇒ k = 28/21 = 4/3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. a + b = 6k = 6 × 4/3 = 8.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. c = (a + b + c) − (a + b) = 14 − 8 = 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Check: b + c = 28/3 ⇒ b = 10/3, a = 14/3; c + a = 6 + 14/3 = 32/3 = 8k ✓</span></p>", "question_heading": ""}, {"sr_no": 144, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image072.png\" width=\"130\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image073.png\" width=\"126\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">, find the value of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image074.png\" width=\"50\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">.</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image075.png\" width=\"54\" height=\"19\" alt style=\"vertical-align:middle\" ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image076.png\" width=\"54\" height=\"19\" alt style=\"vertical-align:middle\" ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image077.png\" width=\"21\" height=\"19\" alt style=\"vertical-align:middle\" ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image078.png\" width=\"58\" height=\"19\" alt style=\"vertical-align:middle\" ></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>sin²θ + cos²θ = 1</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Square the first equation: m² = a²cos²θ + b²sin²θ + 2ab sinθ cosθ.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Square the second equation: n² = a²sin²θ + b²cos²θ − 2ab sinθ cosθ.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Add: m² + n² = a²(cos²θ + sin²θ) + b²(sin²θ + cos²θ); the 2ab sinθ cosθ terms cancel.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Using sin²θ + cos²θ = 1: m² + n² = a² + b².</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Check with θ = 0: m = a, n = −b, so m² + n² = a² + b² ✓</span></p>", "question_heading": ""}, {"sr_no": 145, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Evaluate: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image079.png\" width=\"200\" height=\"29\" alt style=\"vertical-align:middle\" ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>11</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>tan60° = √3, cos45° = 1/√2, sec30° = 2/√3, cos90° = 0, csc30° = 2, sec60° = 2, cot30° = √3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. tan²60° = 3; 4cos²45° = 4 × 1/2 = 2; 3sec²30° = 3 × 4/3 = 4; 5cos²90° = 0.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Numerator = 3 + 2 + 4 + 0 = 9.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Denominator = csc30° + sec60° − cot²30° = 2 + 2 − 3 = 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Value = 9/1 = 9.</span></p>", "question_heading": ""}, {"sr_no": 146, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a moderately skewed distribution, the mode and median are 42 and 38 respectively. Find the mean.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>34</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>37</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>36</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Empirical relation for a moderately skewed distribution: Mode = 3 × Median − 2 × Mean</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Substitute Mode = 42 and Median = 38: 42 = 3(38) − 2 × Mean = 114 − 2 × Mean.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 2 × Mean = 114 − 42 = 72.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Mean = 36.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Check: 3 × 38 − 2 × 36 = 114 − 72 = 42 ✓</span></p>", "question_heading": ""}, {"sr_no": 147, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Find the number of trailing zeroes in the product </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image080.png\" width=\"190\" height=\"20\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>350</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>300</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>325</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>375</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Trailing zeros = number of pairs of 2 and 5 = the smaller of (power of 2, power of 5). In kᵏ the power of 5 is k × (power of 5 in k)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Powers of 2 in the product are far more than powers of 5, so count only the factors of 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Only multiples of 5 contribute: k = 5, 10, 15, ..., 50.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. k = 5, 10, 15, 20 (one factor of 5 each): 5 + 10 + 15 + 20 = 50.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. k = 25 (= 5²): 25 × 2 = 50.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. k = 30, 35, 40, 45 (one factor of 5 each): 30 + 35 + 40 + 45 = 150.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. k = 50 (= 2 × 5²): 50 × 2 = 100.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7. Total power of 5 = 50 + 50 + 150 + 100 = 350, so there are 350 trailing zeroes.</span></p>", "question_heading": ""}, {"sr_no": 148, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">What is the remainder when </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image081.png\" width=\"29\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> is divided by 25?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>23</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>If aᵏ ≡ 1 (mod m), then a^(kq + r) ≡ aʳ (mod m)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 7² = 49 ≡ −1 (mod 25).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 7⁴ = (7²)² ≡ (−1)² = 1 (mod 25).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 103 = 4 × 25 + 3, so 7¹⁰³ = (7⁴)²⁵ × 7³ ≡ 1 × 7³ = 343 (mod 25).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. 343 = 13 × 25 + 18, so the remainder is 18.</span></p>", "question_heading": ""}, {"sr_no": 149, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In an examination, the ratio of passed to failed candidates was </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image082.png\" width=\"22\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">. If 30 fewer candidates had appeared and 20 fewer had passed, the ratio of passed to failed candidates would have been </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image083.png\" width=\"22\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">. Find the total number of candidates who originally appeared.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>180</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>200</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>240</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>150</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>Ratio problems: take a common multiplier x;</span><span>  </span><span>Failed = Total − Passed</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Passed : Failed = 4 : 1 ⇒ passed = 4x, failed = x, total = 5x.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. New total = 5x − 30; new passed = 4x − 20; new failed = (5x − 30) − (4x − 20) = x − 10.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. New ratio 5 : 1 ⇒ (4x − 20)/(x − 10) = 5 ⇒ 4x − 20 = 5x − 50 ⇒ x = 30.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Original total = 5 × 30 = 150.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Check: passed 120, failed 30; new passed 100, new failed 20; 100 : 20 = 5 : 1 ✓</span></p>", "question_heading": ""}, {"sr_no": 150, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Solve for </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image084.png\" width=\"9\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image085.png\" width=\"133\" height=\"19\" alt style=\"vertical-align:middle\" ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>0</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808333753_image086.png\" width=\"9\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Formula: </span><span>aˣ⁺¹ = a × aˣ;</span><span>  </span><span>9ˣ⁺¹ = 9 × (3ˣ)². Substitute t = 3ˣ and solve the quadratic (t &gt; 0)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Let 3ˣ = t (t &gt; 0). Then 9^(x+1) = 9t² and 3^(x+1) = 3t.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Equation: 9t² − 6 × 3t = 27 ⇒ 9t² − 18t − 27 = 0 ⇒ t² − 2t − 3 = 0.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. (t − 3)(t + 1) = 0 ⇒ t = 3 or t = −1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. 3ˣ is always positive, so t = −1 is rejected. 3ˣ = 3 ⇒ x = 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Check: 9² − 6 × 3² = 81 − 54 = 27 ✓</span></p>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }

    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }

    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }

  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>

  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
