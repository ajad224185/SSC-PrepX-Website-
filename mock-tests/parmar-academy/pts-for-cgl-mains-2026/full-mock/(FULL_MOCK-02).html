n-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following examples best demonstrates application software depending on system software to perform an operation?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A presentation software utilizing the operating system's file management system to save a file to a solid-state drive</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>An operating system requiring a web browser to manage central processing unit (CPU) scheduling</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A device driver relying on photo-editing software to communicate with the motherboard</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A database application executing tasks directly on the hardware without an underlying operating system</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Application software (such as presentation software, word processors, and spreadsheets) is designed to help users perform specific tasks. However, application software cannot interact directly with the computer's physical hardware. Instead, it must rely on system software—primarily the operating system and device drivers—to perform core tasks like file management, memory allocation, and hardware input/output operations.</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">In Microsoft Word, which of the following keyboard shortcuts is used to decrease or remove a hanging indent from a paragraph?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Shift + M</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Shift + T</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Shift + H</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Alt + T</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In Microsoft Word, </span><span style=\"font-weight:bold\">Ctrl + Shift + T</span><span> is used to decrease or remove a hanging indent. In contrast, </span><span style=\"font-weight:bold\">Ctrl + T</span><span> is used to create or increase a hanging indent. Additionally, </span><span style=\"font-weight:bold\">Ctrl + M</span><span> increases the overall left indent of a paragraph, and </span><span style=\"font-weight:bold\">Ctrl + Shift + M</span><span> decreases the overall left indent.</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following keyboard shortcuts is used to start a slide show from the current slide in MS PowerPoint?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Shift + F5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + F5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Alt + F5</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In MS PowerPoint, pressing </span><span style=\"font-weight:bold\">Shift + F5</span><span> starts the slide show directly from the currently active slide. In contrast, pressing </span><span style=\"font-weight:bold\">F5</span><span> starts the presentation from the very first slide.</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">The process of converting normal readable text (plain text) into an unreadable coded form to protect it from unauthorized access is known as ________.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Encryption</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Decryption</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Compression</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Defragmentation</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Encryption is the process of converting ordinary information (plain text) into an unintelligible format (ciphertext) to ensure data confidentiality and security. Decryption is the reverse process of converting ciphertext back into plain text.</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following navigation paths is used to change the layout of an existing slide in MS PowerPoint?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Insert -&gt; Slides -&gt; Layout</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Home -&gt; Slides -&gt; Layout</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Design -&gt; Page Setup -&gt; Layout</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>View -&gt; Presentation Views -&gt; Layout</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In MS PowerPoint, to change the layout of an already selected slide, go to the </span><span style=\"font-weight:bold\">Home</span><span> tab, locate the </span><span style=\"font-weight:bold\">Slides</span><span> group, and click on the </span><span style=\"font-weight:bold\">Layout</span><span> option to select the desired layout format.</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which paragraph alignment option in MS Word distributes text evenly between both the left and right margins, creating clean and straight edges on both sides?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Align Left</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Justify</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Center</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Align Right</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In MS Word, the </span><span style=\"font-weight:bold\">Justify</span><span> option (shortcut: Ctrl + J) aligns text evenly between both the left and right margins. It adjusts the spacing between words so that each line starts at the left margin and ends exactly at the right margin, giving the document a neat, polished look. Left Align (Ctrl + L), Center (Ctrl + E), and Right Align (Ctrl + R) align text relative to only one side or the center of the page.</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which type of transmission medium is most commonly used to connect computers in a wired Local Area Network (LAN)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Coaxial cable</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Twisted pair cable</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Fiber optic cable</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Power cable</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Twisted pair cable (such as Cat5e and Cat6 Ethernet cables) is the most commonly used guided transmission medium in Local Area Networks (LANs) because it is inexpensive, flexible, and easy to install over short distances.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">In Microsoft Excel, when a user inserts a new column into a worksheet, where is the new column placed relative to the currently selected column?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Immediately to the right of the selected column</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Immediately to the left of the selected column</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>At the end of all populated columns</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Always as Column A, irrespective of the selection</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In Microsoft Excel, when you insert a new column into a worksheet, the new blank column is always placed immediately to the left of the currently selected column, and existing columns from that point onwards shift to the right. Similarly, when a new row is inserted, it is placed directly above the currently selected row, shifting existing rows downwards.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following techniques is used by modern desktop operating systems to execute processes whose combined memory requirements exceed the available physical RAM?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Static allocation</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Virtual memory</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cache coherency</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Direct memory access (DMA)</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Virtual memory is an advanced memory management technique used by general-purpose operating systems. It combines active physical RAM with secondary storage (such as a hard drive or SSD) using paging or segmentation. This allows the OS to run multiple large applications simultaneously even if their memory footprint exceeds the total installed physical RAM.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following functions in MS Excel is used to count the number of non-empty cells in a specified range?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>COUNT</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>COUNTA</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>COUNTIF</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>COUNTBLANK</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The </span><span style=\"font-weight:bold\">COUNTA</span><span> function in MS Excel counts the number of cells that are not empty in a range. It counts cells containing any type of information, including numbers, text, logical values, and error values. In contrast, the </span><span style=\"font-weight:bold\">COUNT</span><span> function only counts cells that contain numeric values.</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following networking devices connects multiple distinct networks and forwards data packets toward their destination based on their IP addresses?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Switch</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Repeater</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Router</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hub</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A </span><span style=\"font-weight:bold\">Router</span><span> is a networking device that operates at Layer 3 (Network Layer) of the OSI model. It connects two or more different networks (such as a LAN to the WAN/Internet) and directs data packets by reading their destination logical (IP) addresses and selecting the most efficient path using routing tables. In contrast, a switch operates primarily at Layer 2 using MAC addresses, while hubs and repeaters operate at Layer 1 (Physical Layer).</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following statements regarding the components of a Central Processing Unit (CPU) is/are correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. Registers are high-speed, temporary storage units located directly inside the CPU.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. The Control Unit (CU) performs arithmetic operations and logical comparisons.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both 1 and 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither 1 nor 2</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement 1 is correct: Registers are small, extremely fast storage locations situated inside the CPU that hold data, memory addresses, and instructions currently being processed.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement 2 is incorrect: Arithmetic operations (such as addition, subtraction) and logical decisions (such as comparison of values) are performed by the Arithmetic Logic Unit (ALU), not the Control Unit (CU). The CU only directs and coordinates the activities of the entire computer system.</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">How many unique characters can be represented using the standard 7-bit ASCII code?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>64</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>128</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>256</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>512</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Standard ASCII (American Standard Code for Information Interchange) is a 7-bit character encoding system. Since each bit has 2 possible states (0 or 1), the total number of unique characters that can be represented is </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794475760935_image001.png\" width=\"65\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (ranging from code 0 to 127). These include control characters, digits, uppercase and lowercase letters, and common symbols.</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following is considered a strong indicator of a malware or spyware infection on a personal computer?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The default browser homepage changes automatically and frequent unwanted pop-up ads appear</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>System files undergo regular automatic disk defragmentation</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The operating system boot time decreases significantly</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The computer shows a sudden increase in free storage space on the hard drive</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Common indicators of malware or spyware infection include unauthorized alterations to system settings (such as changing the default browser homepage or search engine), continuous unexpected pop-up advertisements, unexplained network traffic, and unauthorized software installations running in the background.</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">In MIME (Multipurpose Internet Mail Extensions), which header field is used to specify whether an email component should be displayed directly within the message body or treated as a separate downloadable attachment?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Content-Type</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Content-Disposition</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Content-Transfer-Encoding</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Content-ID</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The </span><span style=\"font-weight:bold\">Content-Disposition</span><span> header field is used in MIME messages to indicate the presentation style of a message part. It typically takes the value inline (to display the content automatically within the message body) or attachment (to treat it as a file that requires user interaction to open or save).</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which feature in the Microsoft Windows operating system helps prevent unauthorized changes by prompting the user for permission or an administrator password?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Disk Defragmenter</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Task Manager</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>User Account Control (UAC)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>File Explorer</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>User Account Control (UAC) is a security feature introduced in Windows to help prevent unauthorized changes to the operating system. When an application or task attempts to make modifications that require administrator rights, UAC prompts the user for confirmation or administrative credentials before proceeding.</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in indirect    speech.</p>    <p style=\"orphans:0;widows:0\">Deepak said, \"I shall    purchase a new laptop for my office.\"</p>", "option1": "<p style=\"orphans:0;widows:0\">    Deepak said that he will purchase a new laptop for his office.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Deepak said that he would purchase a new laptop for his office.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Deepak said that he should purchase a new laptop for his office.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Deepak said that he can purchase a new laptop for his office.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">To convert an    assertive sentence from direct to indirect speech, follow these    rules:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb 'said' remains unchanged and is followed by the conjunction    'that'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    first-person pronoun 'I' changes to 'he' according to the subject    'Deepak', and 'my' changes to 'his'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">When the    reporting verb is in the past tense ('said'), the future auxiliary    'shall' (indicating simple future with 'I') changes to 'would'    because the pronoun changes to the third person ('he'). Note that    'should' indicates obligation or duty, which is not the intended    meaning here.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct indirect    sentence is: <b>Deepak said that he would purchase a new laptop    for his office.</b></p>", "question_heading": ""}, {"sr_no": 22, "question": "Sधnपधncधौ यी ो ूोनोgनोूु ोनध giॅधn ृिधयथ. Wुiिध पुध ीiनौप ोnक पुध िोौप ौधnपधncधौ (1 ोnक 6) ोनध in पुध cयननधcप यनकधन, पुध ौधnपधncधौ in ृधपथधधn ोनध ुहंृिधक हू. Aननोngध पुध ौधnपधncधौ in पुध cयननधcप यनकधन पय ीयनं ो ंधोningीिह ोnक cयुधनधnप ूोनोgनोूु. 1. Rोूiक हनृोnप्रोपiयn ुोौ ूयौधक ौधॅधनध cुोििधngधौ पय हनृोn ंयृiिiपद ोcनयौौ Inकiो. A. Cयnौधतहधnिपद, cयंंहपधनौ ौूधnक ुयहनौ पनोूूधक in पनोीीic ौnोिनस कहनing ूधोा ुयहनौ. B. Bधngोिहनह iौ ो ूनयंinधnप धसोंूिध यी पुiौ gनयथing हनृोn gनiिकयcा. C. Tय ोििधॅiोपध पुiौ कiौपनधौौ, ियcोि ोहपुयनiपiधौ ुोॅध धसूोnकधक पुध ंधपनय नोiि nधपथयना ोnक inपनयकहcधक ीधधकधन ृहौ ौधनॅicधौ. D. Sादनयcाधपing ॅधुicिहोन ूयूिहोपiयn ोnक inोकधतहोपध नयोक inीनोौपनहcपहनध ुोॅध cनiूूिधक पुध ciपदैौ कोiिद cयंंहपध. 6. Tुधौध ूहृिic पनोnौूयनप iniपiोपiॅधौ ोनध कधौignधक पय धncयहनोgध ciपप्रधnौ पय िधोॅध पुधiन ूधनौयnोि ॅधुicिधौ ोप ुयंध.", "option1": "<p style=\"orphans:0;widows:0\">    BDAC</p>", "option2": " <p style=\"orphans:0;widows:0\">    BADC</p>", "option3": " <p style=\"orphans:0;widows:0\">    DBAC</p>", "option4": " <p style=\"orphans:0;widows:0\">    ADBC</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sequence is <b>BDAC</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence 1    introduces the broader issue of challenges to urban mobility in    India.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>B</b>    narrows this down to a specific instance, introducing Bengaluru as    a prominent example of this urban gridlock.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>D</b>    explains the root cause of the problem in Bengaluru (skyrocketing    vehicular population and inadequate infrastructure).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>A</b>    begins with the transition word 'Consequently' to show the direct    outcome of the causes mentioned in D (commuters spending hours    trapped in traffic).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>C</b>    proposes the solution undertaken to resolve this issue ('expanded    the metro rail network and introduced feeder bus services').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence 6    links directly to C by referring to 'These public transport    initiatives'.</p>    <p style=\"orphans:0;widows:0\">Therefore, the coherent order is    1-B-D-A-C-6.</p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option that can substitute the    underlined words in the given sentence.</p>    <p style=\"orphans:0;widows:0\">Critics argued that pervasive    corruption had turned the administration into a <u>government run    by the worst and least qualified citizens</u>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Ochlocracy</p>", "option2": " <p style=\"orphans:0;widows:0\">    Stratocracy</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kakistocracy</p>", "option4": " <p style=\"orphans:0;widows:0\">    Timocracy</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (C)</b> <b>Kakistocracy</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Kakistocracy:</b>     A system of government run by the worst, least qualified, or most     unscrupulous citizens.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Ochlocracy:</b>     Government by a mob or crowd; mob rule.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Stratocracy:</b>     A form of government headed by military chiefs.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Timocracy:</b> A form of     government in which only property owners can participate, or     where rulers are motivated by honour.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Fill in the blank with the correctly spelt word.</p>    <p style=\"orphans:0;widows:0\">The diplomat spoke in    a_______manner, avoiding any inflammatory remarks.     </p>", "option1": "<p style=\"orphans:0;widows:0\">    circumspect</p>", "option2": " <p style=\"orphans:0;widows:0\">    circumpect</p>", "option3": " <p style=\"orphans:0;widows:0\">    circumspeckt</p>", "option4": " <p style=\"orphans:0;widows:0\">    circumspace</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct answer is <b>A. circumspect</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in\"><b>Circumspect    means </b>wary and unwilling to take risks; cautious and prudent    in speech or action.</p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate idiom to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Rather than addressing the    fundamental flaws in the tax policy, the committee merely chose to    ________ by offering temporary rebates.</p>", "option1": "<p style=\"orphans:0;widows:0\">    take the bull by the horns</p>", "option2": " <p style=\"orphans:0;widows:0\">    paper over the cracks</p>", "option3": " <p style=\"orphans:0;widows:0\">    throw down the gauntlet</p>", "option4": " <p style=\"orphans:0;widows:0\">    put the cart before the horse</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The idiom    <b>'paper over the cracks'</b> means to conceal, disguise, or    patch up difficulties, flaws, or disagreements superficially    rather than resolving them effectively.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The sentence    contrasts solving 'fundamental flaws' with merely offering    superficial, temporary rebates, making <b>'paper over the cracks'</b>    the most contextually appropriate choice.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>take     the bull by the horns:</b> to face a challenge or danger boldly     and directly.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>throw     down the gauntlet:</b> to issue a challenge.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>put the cart before the     horse:</b> to do things in the wrong or reverse order.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Of the two strategic alternatives    presented to the board, the committee deemed the second one to be    the ___________ viable for long-term growth.</p>", "option1": "<p style=\"orphans:0;widows:0\">    most</p>", "option2": " <p style=\"orphans:0;widows:0\">    more</p>", "option3": " <p style=\"orphans:0;widows:0\">    much</p>", "option4": " <p style=\"orphans:0;widows:0\">    best</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b></p>    <p style=\"orphans:0;widows:0\">When comparing exactly two    persons or things (as indicated by the phrase 'Of the two    strategic alternatives...'), the comparative degree is used,    preceded by the definite article 'the' (structure: <i>the +    comparative degree</i>). Therefore, the comparative form <b>more</b>    is correct here rather than the superlative degree 'most'.</p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct spelling of the incorrectly spelt word in the    given sentence.</p>    <p style=\"orphans:0;widows:0\">Every citizen should understand    that voting is a valuable privelage as well as a duty.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Priviledge</p>", "option2": " <p style=\"orphans:0;widows:0\">    Previlege</p>", "option3": " <p style=\"orphans:0;widows:0\">    Privilege</p>", "option4": " <p style=\"orphans:0;widows:0\">    Privilage</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (C)</b></p>    <p style=\"orphans:0;widows:0\">The incorrectly spelt word in the    sentence is 'privelage'. The correct spelling is <b>Privilege</b>,    which refers to a special right, advantage, or immunity granted to    a particular person or group.</p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words.</p>    <p style=\"orphans:0;widows:0\">A person who is indifferent to or    unaffected by pleasure or pain</p>", "option1": "<p style=\"orphans:0;widows:0\">    Epicure</p>", "option2": " <p style=\"orphans:0;widows:0\">    Stoic</p>", "option3": " <p style=\"orphans:0;widows:0\">    Hedonist</p>", "option4": " <p style=\"orphans:0;widows:0\">    Cynic</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b> <b>Stoic</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Stoic</b>     refers to a person who can endure pain or hardship without     showing their feelings or complaining (indifferent to pleasure or     pain).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings     of other options:</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Epicure:</b>     A person who takes particular pleasure in fine food and drink.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Hedonist:</b>     A person who believes that the pursuit of pleasure is the most     important thing in life.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Cynic:</b> A person who     believes that people are motivated purely by self-interest.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    A sentence has been split up into segments and given below in    jumbled order. While the first and the last segments of the    sentence (1 and 6) are in the correct order, the segments in    between are jumbled up. Arrange the segments in the correct order    to form a meaningful and coherent sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1) The    primary purpose of environmental education</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">P) to    understand the delicate balance</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Q) is to    enable young minds</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R) and    inspire responsible action</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">S) of our    natural ecosystems</p>    <p style=\"orphans:0;widows:0\">6) for a sustainable future.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Q, P, S, R</p>", "option2": " <p style=\"orphans:0;widows:0\">    P, S, Q, R</p>", "option3": " <p style=\"orphans:0;widows:0\">    Q, S, P, R</p>", "option4": " <p style=\"orphans:0;widows:0\">    S, R, Q, P</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sequence is <b>Q, P, S, R</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    sentence opens with the subject in part (1): <i>'The primary    purpose of environmental education'</i>, which logically requires    a predicate verb. Segment <b>Q</b> (<i>'is to enable young minds'</i>)    provides this verb ('is').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. The verb    'enable' takes the structure 'enable someone + to-infinitive'.    Segment <b>P</b> (<i>'to understand the delicate balance'</i>)    directly complements <b>Q</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Segment <b>S</b>    (<i>'of our natural ecosystems'</i>) completes the prepositional    phrase describing what the 'delicate balance' belongs to.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Segment <b>R</b>    (<i>'and inspire responsible action'</i>) follows parallel to 'to    understand' (to understand ... and inspire), which links smoothly    to segment (6) (<i>'for a sustainable future'</i>).</p>    <p style=\"orphans:0;widows:0\">Thus, the complete coherent    sentence is: <i>'The primary purpose of environmental education is    to enable young minds to understand the delicate balance of our    natural ecosystems and inspire responsible action for a    sustainable future.'</i></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Parts of a sentence are given below in jumbled order. Arrange the    parts in the correct order to form a meaningful and grammatically    correct sentence.</p>    <p style=\"orphans:0;widows:0\">the passengers / waited /    patiently / at the station / for over an hour</p>", "option1": "<p style=\"orphans:0;widows:0\">    The passengers patiently for over an hour waited at the station.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The passengers waited patiently at the station for over an hour.</p>", "option3": " <p style=\"orphans:0;widows:0\">    At the station waited the passengers patiently for over an hour.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Patiently the passengers for over an hour at the station waited.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The correct    order follows the standard grammatical structure: <b>Subject +    Verb + Adverb of Manner + Adverb of Place + Adverb of Time (MPT    rule)</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Here:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Subject:</b>    The passengers</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Verb:</b>    waited</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Manner:</b>    patiently</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Place:</b>    at the station</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Time/Duration:</b>    for over an hour</p>    <p style=\"orphans:0;widows:0\">Therefore, the grammatically    correct sentence is: <i>\"The passengers waited patiently at    the station for over an hour.\"</i></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words.</p>    <p style=\"orphans:0;widows:0\">An acrobat who performs feats of    balancing on a tightrope or wire</p>", "option1": "<p style=\"orphans:0;widows:0\">    Contortionist</p>", "option2": " <p style=\"orphans:0;widows:0\">    Funambulist</p>", "option3": " <p style=\"orphans:0;widows:0\">    Ventriloquist</p>", "option4": " <p style=\"orphans:0;widows:0\">    Somnambulist</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b> <b>Funambulist</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Funambulist:</b>     An acrobat who walks or balances on a tightrope or high wire     (derived from Latin <i>funis</i> meaning 'rope' and <i>ambulare</i>     meaning 'to walk').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Contortionist:</b>     An acrobat or performer who twists their body into strange and     unnatural positions.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Ventriloquist:</b>     A performer who speaks without moving their lips, making the     sound seem to come from a dummy or somewhere else.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Somnambulist:</b> A     person who walks while asleep (sleepwalker).</p>    </li></ul>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate antonym of the given word. <b>Lament</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Celebrate</p>", "option2": " <p style=\"orphans:0;widows:0\">    Mourn</p>", "option3": " <p style=\"orphans:0;widows:0\">    Wail</p>", "option4": " <p style=\"orphans:0;widows:0\">    Grieve</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct answer is <b>A) Celebrate</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Lament</b> means to express passionate grief, sorrow, or     regret about something.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\"><b>Celebrate</b>     means to acknowledge a happy or significant event with an     enjoyable activity or festivity, making it the direct antonym.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Why the other options are incorrect (they are all synonyms of    </b><i><b>Lament</b></i><b>):</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>B) Mourn:</b> To feel or show deep sorrow or regret for     someone or something.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C)     Wail:</b> To give a prolonged high-pitched cry of pain, grief, or     anger.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>D) Grieve:</b> To suffer     intense sorrow or distress.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A white dove    landed softly on the branch of an olive tree.</p>    <p style=\"orphans:0;widows:0\">The denotation of the word ‘dove’    is ___________.</p>", "option1": "<p style=\"orphans:0;widows:0\">    a symbol of peace</p>", "option2": " <p style=\"orphans:0;widows:0\">    an emblem of innocence</p>", "option3": " <p style=\"orphans:0;widows:0\">    a type of bird</p>", "option4": " <p style=\"orphans:0;widows:0\">    a sign of harmony</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (C)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">‘<b>Denotation’</b>    refers to the explicit, primary, or literal dictionary definition    of a word, distinct from its emotional or figurative associations    (connotations).</p>    <p style=\"orphans:0;widows:0\">Literally, a <b>dove</b> is <b>a    type of bird</b> belonging to the pigeon family. Concepts like    ‘peace’, ‘innocence’, and ‘harmony’ are its symbolic    connotations, not its denotative meaning. Hence, the correct    answer is ‘a type of bird’.</p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in reported    speech.</p>    <p style=\"orphans:0;widows:0\">The captain said to the players,    \"I have prepared a new strategy for this match.\"</p>", "option1": "<p style=\"orphans:0;widows:0\">    The captain told the players that he has prepared a new strategy    for that match.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The captain told the players that I had prepared a new strategy    for this match.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The captain told the players that he had prepared a new strategy    for that match.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The captain told the players that he had prepared a new strategy    for this match.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (C)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">To convert an    assertive sentence from direct to indirect speech, follow these    rules:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     reporting verb 'said to' changes to 'told'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     conjunction 'that' is used to connect the reporting clause and     reported speech.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     first-person pronoun 'I' changes to the third-person pronoun 'he'     according to the subject ('The captain').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     present perfect tense ('have prepared') changes to the past     perfect tense ('had prepared').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     demonstrative adjective 'this' changes to 'that'.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, Option C is the    correct reported speech form: <i>\"The captain told the    players that he had prepared a new strategy for that match.\"</i></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate ANTONYM of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Paucity</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Dearth</p>", "option2": " <p style=\"orphans:0;widows:0\">    Scarcity</p>", "option3": " <p style=\"orphans:0;widows:0\">    Plethora</p>", "option4": " <p style=\"orphans:0;widows:0\">    Deficit</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (C)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The word    <b>'Paucity'</b> refers to the presence of something only in small    or insufficient quantities; scarcity or lack.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The word    <b>'Plethora'</b> refers to a large or excessive amount of    something; abundance.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Therefore,    <b>'Plethora'</b> is the most appropriate antonym.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Dearth:</b>     a scarcity or lack of something (synonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Scarcity:</b>     the state of being scarce or in short supply (synonym).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Deficit:</b> an amount by     which something is too small (synonym).</p>    </li></ul>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words.</p>    <p style=\"orphans:0;widows:0\">The practice of buying or selling    sacred things, church offices, or spiritual privileges</p>", "option1": "<p style=\"orphans:0;widows:0\">    Sacrilege</p>", "option2": " <p style=\"orphans:0;widows:0\">    Apostasy</p>", "option3": " <p style=\"orphans:0;widows:0\">    Simony</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sinecure</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (C)</b> <b>Simony</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Simony:</b>     The buying or selling of church offices, benefices, or spiritual     privileges.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sacrilege:</b>     The violation or misuse of what is regarded as sacred.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Apostasy:</b>     The formal abandonment or renunciation of a religious or     political belief.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sinecure:</b>     A position or office requiring little or no work, but providing     status or financial benefit.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence, the correct answer is    <b>Simony</b>.</p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in passive    voice.</p>    <p style=\"orphans:0;widows:0\">Once the committee submits the    report, the government will announce new guidelines.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Once the committee submits the report, new guidelines would be    announced by the government.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Once the committee submits the report, new guidelines will be    announced by the government.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Once the committee submits the report, new guidelines will have    been announced by the government.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Once the committee submits the report, new guidelines are    announced by the government.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The given    sentence contains a time clause (<i>Once the committee submits the    report</i>) and a main clause in the simple future tense (<i>the    government will announce new guidelines</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">When    converting simple future tense from active to passive voice, the    rule is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Active:</b>    Subject + will + V1 + Object</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Passive:</b>    Object + will + be + V3 + (by + Subject)</p>    <p style=\"orphans:0;widows:0\">Hence, \"the government will    announce new guidelines\" becomes \"new guidelines will be    announced by the government\", while the subordinate time    clause remains as it is. Therefore, option B is the correct    passive form.</p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The following sentence has been split into four segments. Identify    the segment that contains a grammatical error.</p>    <p style=\"orphans:0;widows:0\">He, you and I / will represent    the college / in the upcoming national debate competition / next    month.</p>", "option1": "<p style=\"orphans:0;widows:0\">    will represent the college</p>", "option2": " <p style=\"orphans:0;widows:0\">    in the upcoming national debate competition</p>", "option3": " <p style=\"orphans:0;widows:0\">    He, you and I</p>", "option4": " <p style=\"orphans:0;widows:0\">    next month</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (C)</b> <b>'He, you and I'</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In a    standard, positive, or polite context, when singular personal    pronouns of different persons are used together, the correct order    is <b>2-3-1</b> (Second Person → Third Person → First Person).</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct phrasing    should be <b>'You, he and I'</b> instead of <b>'He, you and I'</b>.</p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate synonym of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Perspicacity</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Tenacity</p>", "option2": " <p style=\"orphans:0;widows:0\">    Discernment</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mendacity</p>", "option4": " <p style=\"orphans:0;widows:0\">    Credulity</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b> <b>Discernment</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Perspicacity</b>     means the quality of having a ready insight into things, keen     mental perception, or shrewdness.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Discernment:</b>     The ability to judge well and perceive keen insights (Synonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Tenacity:</b>     The quality or fact of being very determined; persistence.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Mendacity:</b>     Untruthfulness or deceitfulness.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Credulity:</b> A tendency     to be too ready to believe that something is real or true;     gullibility.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in passive    voice.</p>    <p style=\"orphans:0;widows:0\">The archaeological team has    recently excavated an ancient temple in the dense forest.</p>", "option1": "<p style=\"orphans:0;widows:0\">    An ancient temple was recently excavated in the dense forest by    the archaeological team.</p>", "option2": " <p style=\"orphans:0;widows:0\">    An ancient temple had recently been excavated in the dense forest    by the archaeological team.</p>", "option3": " <p style=\"orphans:0;widows:0\">    An ancient temple has recently been excavated in the dense forest    by the archaeological team.</p>", "option4": " <p style=\"orphans:0;widows:0\">    An ancient temple is recently being excavated in the dense forest    by the archaeological team.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (C)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The given    sentence is in the Present Perfect Tense in active voice.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Active     Voice structure: <b>Subject + has/have + V3 + Object</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive     Voice structure: <b>Object + has/have + been + V3 + by + Subject</b></p>    </li></ul>    <p style=\"orphans:0;widows:0\">Here, 'an ancient temple' is    singular, so it takes 'has been excavated'. Therefore, option C is    the correct passive form.</p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option that can substitute the    underlined words in the given sentence.</p>    <p style=\"orphans:0;widows:0\">The soldiers were ordered to    safeguard the <u>place where weapons and military equipment are    stored</u> from enemy infiltrators.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Granary</p>", "option2": " <p style=\"orphans:0;widows:0\">    Hangar</p>", "option3": " <p style=\"orphans:0;widows:0\">    Arsenal</p>", "option4": " <p style=\"orphans:0;widows:0\">    Aviary</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (C)</b> <b>Arsenal</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Arsenal:</b>     A place where weapons, ammunition, and military equipment are     stored.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Granary:</b>     A storehouse for threshed grain.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Hangar:</b>     A large building for housing aircraft.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Aviary:</b> A large cage     or enclosure for keeping birds.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">The minister faced severe    __________ from both the opposition and the public for his    reckless comments on the crisis.</p>", "option1": "<p style=\"orphans:0;widows:0\">    censor</p>", "option2": " <p style=\"orphans:0;widows:0\">    censure</p>", "option3": " <p style=\"orphans:0;widows:0\">    sensor</p>", "option4": " <p style=\"orphans:0;widows:0\">    censer</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b> <b>censure</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Censure</b>     (noun) means harsh criticism, formal reprimand, or severe     disapproval. In the given context, the minister received strong     public and political criticism for his reckless remarks.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Censor</b>     (noun/verb) refers to an official who examines books, films, or     news to suppress unacceptable parts.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sensor</b>     (noun) refers to a device that detects or responds to a physical     stimulus (such as heat, motion, or light).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Censer</b> (noun) refers     to a vessel or container in which incense is burned, especially     in religious ceremonies.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in indirect    speech.</p>    <p style=\"orphans:0;widows:0\">The manager said to the clerk,    \"Why did you not deposit the cash in the bank yesterday?\"</p>", "option1": "<p style=\"orphans:0;widows:0\">    The manager asked the clerk why had he not deposited the cash in    the bank the previous day.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The manager asked the clerk why he had not deposited the cash in    the bank the previous day.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The manager enquired of the clerk that why he had not deposited    the cash in the bank the previous day.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The manager asked the clerk why he did not deposit the cash in the    bank yesterday.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">To convert an    interrogative sentence (Wh-question) from direct to indirect    speech, the following rules are applied:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     reporting verb 'said to' is changed to 'asked' or 'enquired of'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">No     conjunction ('that', 'if', or 'whether') is placed before the     wh-word ('why').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     interrogative structure (Auxiliary verb + Subject) is changed     into an assertive/affirmative structure (Subject + Auxiliary     verb). Hence, 'why did you not deposit' becomes 'why he had not     deposited' (not 'why had he').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     simple past tense ('did not deposit') changes to the past perfect     tense ('had not deposited').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     pronoun 'you' changes to 'he' according to the object 'the     clerk'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The time     adverb 'yesterday' changes to 'the previous day' or 'the day     before'.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, option B correctly    incorporates all these changes.</p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Complete the dialogue for Person B using the correct idiom.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Person A: Are    you going to bring up the issue of the missed deadline in today's    meeting?</p>    <p style=\"orphans:0;widows:0\">Person B: No, the matter has    already been resolved, so I would rather ______.</p>", "option1": "<p style=\"orphans:0;widows:0\">    let sleeping dogs lie</p>", "option2": " <p style=\"orphans:0;widows:0\">    burn the midnight oil</p>", "option3": " <p style=\"orphans:0;widows:0\">    bark up the wrong tree</p>", "option4": " <p style=\"orphans:0;widows:0\">    bite the bullet</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (A)</b></p>    <p style=\"orphans:0;widows:0\">The idiom <b>'let sleeping dogs    lie'</b> means to leave a situation alone to avoid causing trouble    or rekindling an old conflict. Here, Person B does not want to    re-open a settled issue, making 'let sleeping dogs lie' the    correct choice.</p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in passive    voice.</p>    <p style=\"orphans:0;widows:0\">Do not disturb the sleeping baby.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Let the sleeping baby not be disturbed.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Let the sleeping baby not being disturbed.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Let not the sleeping baby disturbed.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Have the sleeping baby not been disturbed.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (A)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The given    sentence is a negative imperative sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The active    voice structure for a negative imperative sentence is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Do not +    V1 + Object</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The passive    voice structure using 'Let' is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Let +    Object + not + be + V3 (past participle)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Applying this    rule:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Object: <i>the    sleeping baby</i></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Verb: <i>disturb</i>    → <i>disturbed</i></p>    <p style=\"orphans:0;widows:0\">Therefore, the passive form is:    <b>Let the sleeping baby not be disturbed.</b></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Of the two alternatives suggested    by the committee to curb inflation, the former is undeniably    ___________.</p>", "option1": "<p style=\"orphans:0;widows:0\">    the more effective</p>", "option2": " <p style=\"orphans:0;widows:0\">    the most effective</p>", "option3": " <p style=\"orphans:0;widows:0\">    more effective</p>", "option4": " <p style=\"orphans:0;widows:0\">    most effective</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (A)</b></p>    <p style=\"orphans:0;widows:0\">When a selection or comparison is    made between exactly two persons or things (indicated here by 'Of    the two alternatives'), the comparative degree is used, and it    must be preceded by the definite article 'the' (Structure: the +    comparative degree). The superlative degree ('the most effective')    is used only when comparing three or more entities. Hence, 'the    more effective' is the grammatically correct choice.</p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate article to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Munshi Premchand, ________    renowned novelist, made immense contributions to Hindi literature.</p>", "option1": "<p style=\"orphans:0;widows:0\">    a</p>", "option2": " <p style=\"orphans:0;widows:0\">    an</p>", "option3": " <p style=\"orphans:0;widows:0\">    the</p>", "option4": " <p style=\"orphans:0;widows:0\">    no article required</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (A)</b></p>    <p style=\"orphans:0;widows:0\">The indefinite article 'a' is    used before a singular countable noun phrase beginning with a    consonant sound (here, 'renowned' begins with the consonant sound    /r/). In this sentence, \"a renowned novelist\" functions    as a noun phrase in apposition providing descriptive information    about Munshi Premchand. Hence, 'a' is the correct choice.</p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is divided into four segments. Identify the    segment that contains a grammatical error.</p>    <p style=\"orphans:0;widows:0\">She realized that / she has left    / her passport at home / only after reaching the airport.</p>", "option1": "<p style=\"orphans:0;widows:0\">    She realized that</p>", "option2": " <p style=\"orphans:0;widows:0\">    she has left</p>", "option3": " <p style=\"orphans:0;widows:0\">    her passport at home</p>", "option4": " <p style=\"orphans:0;widows:0\">    only after reaching the airport</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B).</b> <b>'she has left'</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The sentence    narrates events that occurred in the past. The main clause    contains the past tense verb 'realized'. Since the action of    leaving the passport occurred prior to the moment of realizing it,    the subordinate clause must use the Past Perfect tense (<b>'had    left'</b>) instead of the Present Perfect tense ('has left').</p>    <p style=\"orphans:0;widows:0\"><b>Correct Sentence:</b> She    realized that she <i>had left</i> her passport at home only after    reaching the airport.</p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate ANTONYM of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Despondent</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Dejected</p>", "option2": " <p style=\"orphans:0;widows:0\">    Cheerful</p>", "option3": " <p style=\"orphans:0;widows:0\">    Miserable</p>", "option4": " <p style=\"orphans:0;widows:0\">    Gloomy</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The word    <b>'Despondent'</b> means feeling or showing extreme    discouragement, dejection, or depression (hopeless/sad).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The most    appropriate antonym is <b>'Cheerful'</b>, ty', and 'elegance' are unrelated or    antonymous in context.</p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Read the given passage and answer the questions that follow.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    harvesting of natural rubber begins with tapping the milky fluid,    known as latex, from the bark of the Hevea brasiliensis tree.    Workers make a thin diagonal incision into the outer bark before    dawn, allowing the sap to trickle down into collection cups. Once    collected, the raw latex is strained to remove plant debris and    coagulated by adding dilute formic acid. This causes the rubber    particles to clump together into spongy slabs. These slabs are    then passed through heavy rollers to squeeze out excess moisture    and form uniform sheets. The sheets undergo hanging in smokehouses    for several days, which preserves them from mould and pests.    Finally, the cured rubber sheets are graded and packed for    industrial use. Certain stabilizing agents, such as ammonia, can    be mixed with the raw fluid immediately after collection to    prevent premature clotting.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">In the extraction process    described, what is the purpose of passing the spongy slabs through    heavy rollers?</p>", "option1": "<p style=\"orphans:0;widows:0\">    To impart a distinctive aroma to the rubber sheets</p>", "option2": " <p style=\"orphans:0;widows:0\">    To stimulate the clotting of the remaining raw fluid</p>", "option3": " <p style=\"orphans:0;widows:0\">    To squeeze out excess moisture and form uniform sheets</p>", "option4": " <p style=\"orphans:0;widows:0\">    To promote the growth of rubber tree bark</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (C)</b></p>    <p style=\"orphans:0;widows:0\">The passage explicitly states:    \"These slabs are then passed through heavy rollers to squeeze    out excess moisture and form uniform sheets.\" Hence, option C    is the correct answer.</p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Read the given passage and answer the questions that follow.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    harvesting of natural rubber begins with tapping the milky fluid,    known as latex, from the bark of the Hevea brasiliensis tree.    Workers make a thin diagonal incision into the outer bark before    dawn, allowing the sap to trickle down into collection cups. Once    collected, the raw latex is strained to remove plant debris and    coagulated by adding dilute formic acid. This causes the rubber    particles to clump together into spongy slabs. These slabs are    then passed through heavy rollers to squeeze out excess moisture    and form uniform sheets. The sheets undergo hanging in smokehouses    for several days, which preserves them from mould and pests.    Finally, the cured rubber sheets are graded and packed for    industrial use. Certain stabilizing agents, such as ammonia, can    be mixed with the raw fluid immediately after collection to    prevent premature clotting.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">What is the overall tone of the    passage?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Informative and instructional</p>", "option2": " <p style=\"orphans:0;widows:0\">    Emotional and sentimental</p>", "option3": " <p style=\"orphans:0;widows:0\">    Critical and analytical</p>", "option4": " <p style=\"orphans:0;widows:0\">    Humorous and light-hearted</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in
