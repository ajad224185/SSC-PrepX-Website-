तहोपध ौिधधू iौ धौौधnपiोि nयप यnिद ीयन ूुदौicोि नधुहॅधnोपiयn ृहप ोिसय ूिोदौ ो cनहciोि नियध in cयgniपiॅध ीहncपiयning. Rधौधोनcु inकicोपधौ पुोप कहनing कधधू ौिधधू, पुध ृनोin cयnौियiकोपधौ ंधंयनiधौ, ूनयcधौौing ोnक ौपयनing inीयनंोपiयn ोcतहiनधक पुनयहgुयहप पुध कोद. Fहनपुधनंयनध, cुनयnic ौिधधू कधूनiॅोपiयn ुोौ ृधधn िinाधक पय ो थधोाधnधक iंंहnध ौदौपधं ोnक iंूोiनधक कधciौiयn-ंोाing ोृiिiपiधौ. Cयnपनोनद पय पुध ृिधiधी पुोप यnध cोn धोौiिद ीहncपiयn यn ंiniंोि नधौप, cयnौiौपधnप ोnक तहोिiपद ौिधधू iौ ॅiपोि ीयन धंयपiयnोि नधgिहोपiयn ोnक ंधnपोि ौुोनूnधौौ. Pनiयनiपप्रing ुधोिपुद ौिधधूing ुोृiपौ ुिधूौ inकiॅiकहोिस ंोinपोin यॅधनोिि ुधोिपु ोnक धnुोncधौ कोiिद ूनयकहcपiॅiपद. Sिधधcप पुध ंयौप ोूूनयूनiोपध पiिपध ीयन पुध giॅधn ूोौौोgध.", "option1": "<p style=\"orphans:0;widows:0\">    The Dangers of Modern Technology</p>", "option2": " <p style=\"orphans:0;widows:0\">    The Secrets of High-Intensity Workouts</p>", "option3": " <p style=\"orphans:0;widows:0\">    Nutritional Guidelines for Healthy Living</p>", "option4": " <p style=\"orphans:0;widows:0\">    The Importance of Adequate Sleep</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (D)</b></p>    <p style=\"orphans:0;widows:0\">The central theme of the passage    revolves around the necessity of getting enough quality sleep for    both the body and mind. Therefore, \"The Importance of    Adequate Sleep\" is the most suitable title.</p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"orphans:0;widows:0\">    <b>What was the central theme of Asia’s largest civil aviation    event, 'Wings India 2026', held at Begumpet Airport in Hyderabad    in January 2026?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Indian Aviation: Connecting Skies, Empowering Lives – Towards    Global Leadership</p>", "option2": " <p style=\"orphans:0;widows:0\">    Indian Aviation: Paving the Future – From Design to Deployment,    Manufacturing to Maintenance, Inclusivity to Innovation and Safety    to Sustainability</p>", "option3": " <p style=\"orphans:0;widows:0\">    Indian Civil Aviation @2030: Expanding Horizons, Enhancing    Connectivity and Sustainable Growth</p>", "option4": " <p style=\"orphans:0;widows:0\">    Aerospace Transformation in Amrit Kaal: Advancing Technology,    Infrastructure and Skilling</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    'Wings India 2026', Asia's premier biennial civil aviation event,    was held from 28 to 31 January 2026 at Begumpet Airport,    Hyderabad. Jointly organized by the Ministry of Civil Aviation    (MoCA), Airports Authority of India (AAI), and FICCI, the event    was held under the theme: <i>“Indian Aviation: Paving the Future    – From Design to Deployment, Manufacturing to Maintenance,    Inclusivity to Innovation and Safety to Sustainability”</i>.</p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"orphans:0;widows:0\">    <b>According to Coulomb's law, if the distance between two    stationary point charges is halved while keeping their magnitudes    constant, the electrostatic force between them becomes:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    one-fourth of its original value</p>", "option2": " <p style=\"orphans:0;widows:0\">    half of its original value</p>", "option3": " <p style=\"orphans:0;widows:0\">    two times its original value</p>", "option4": " <p style=\"orphans:0;widows:0\">    four times its original value</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    According to Coulomb's Law, the electrostatic force (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794496995075_html_7501deb8995e2331.gif\" > )    between two point charges is inversely proportional to the square    of the distance (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794496995075_html_394521b6c82dc059.gif\" > )    between them, i.e.,     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794496995075_html_d0df1764a421d63a.gif\" > .    When the distance is halved (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794496995075_html_3e75aa8ff653f526.gif\" > ),    the new force becomes     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794496995075_html_b8e0ac5e049428fa.gif\" > .    Therefore, the electrostatic force becomes four times its original    value.</p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following is NOT a qualification required for    appointment as a Judge of a High Court in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Must be a citizen of India</p>", "option2": " <p style=\"orphans:0;widows:0\">    Must have held a judicial office in the territory of India for at    least ten years</p>", "option3": " <p style=\"orphans:0;widows:0\">    Must have been an advocate of a High Court for at least ten years</p>", "option4": " <p style=\"orphans:0;widows:0\">    Must be a distinguished jurist in the opinion of the President</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    According to Article 217(2) of the Constitution of India, a person    is qualified to be appointed as a Judge of a High Court if they    are a citizen of India and: (a) have held a judicial office in the    territory of India for at least ten years, or (b) have been an    advocate of a High Court for at least ten years. The provision of    being a 'distinguished jurist in the opinion of the President'    applies only to the appointment of judges to the Supreme Court    (Article 124) and is not available for High Court appointments.</p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"orphans:0;widows:0\">    <b>According to the Köppen climate classification system, which    letter code represents the 'Tropical Monsoon' climate?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Af</p>", "option2": " <p style=\"orphans:0;widows:0\">    Am</p>", "option3": " <p style=\"orphans:0;widows:0\">    Aw</p>", "option4": " <p style=\"orphans:0;widows:0\">    BWh</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the Köppen climate classification system, capital letter 'A'    stands for tropical humid climates. The specific climate types    under group A are:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Am:</b>    Tropical Monsoon climate (characterized by heavy seasonal rainfall    with a short dry season).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Af:</b>    Tropical Wet (Rainforest) climate (precipitation occurs all year    round).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Aw:</b>    Tropical Wet and Dry (Savanna) climate (distinct dry season,    usually during winter).</p>    <p style=\"orphans:0;widows:0\"><b>BWh:</b> Subtropical hot    desert climate.</p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following Kushan rulers was the </b><span><b>First    to issue gold on a large scale</b></span><b> coins in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Kujula Kadphises</p>", "option2": " <p style=\"orphans:0;widows:0\">    Vima Kadphises</p>", "option3": " <p style=\"orphans:0;widows:0\">    Vasudeva I</p>", "option4": " <p style=\"orphans:0;widows:0\">    Kanishka I</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Vima Kadphises (Kadphises II), the father of Kanishka I, was the    first Kushan ruler to introduce gold coins in India. These coins    often depicted images of Lord Shiva along with the trident    (Trishula) and Nandi bull.</p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"orphans:0;widows:0\">    <b>The conservation breeding centres at Sam and Ramdevra in    Rajasthan are primarily dedicated to the captive breeding and    recovery of which bird species, classified as 'Critically    Endangered' on the IUCN Red List?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Great Indian Bustard</p>", "option2": " <p style=\"orphans:0;widows:0\">    Lesser Florican</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sarus Crane</p>", "option4": " <p style=\"orphans:0;widows:0\">    Great Hornbill</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct answer is <b>Great Indian Bustard</b> (<i>Ardeotis    nigriceps</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Key Facts:The    Great Indian Bustard (locally known as <i>Godawan</i>) is the    state bird of Rajasthan and is listed as <b>Critically Endangered</b>    on the IUCN Red List and under Schedule I of the Wildlife    (Protection) Act, 1972.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">To prevent    its extinction, conservation breeding centres were set up at <b>Sam</b>    (inside Desert National Park, Jaisalmer) and <b>Ramdevra</b> in    Rajasthan.</p>    <p style=\"orphans:0;widows:0\">Under ongoing conservation and    rewilding programmes in 2025–2026, successful captive breeding    has produced dozens of chicks, with birds being prepared for    release back into their natural desert grassland habitat.</p>", "question_heading": ""}, {"sr_no": 72, "question": "In 1855, थुय ोंयng पुध ीियियथing ौciधnपiौपौ ीiनौप धसूिोinधक पुोप cिधिस कiॅiकध ोnक nधथ cिधिस ोनध ीयनंधक ीनयं ूनध-धसiौपing cिधिस (ैOंniौ cिधििहो-ध cिधििहोै), पुधनधृद ंयकiीदing ोnक cयंूिधपing पुध cिधि पुधयनद?", "option1": "<p style=\"orphans:0;widows:0\">    Rudolf Virchow</p>", "option2": " <p style=\"orphans:0;widows:0\">    Robert Brown</p>", "option3": " <p style=\"orphans:0;widows:0\">    Antonie van Leeuwenhoek</p>", "option4": " <p style=\"orphans:0;widows:0\">    Theodor Schwann</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In 1855, Rudolf Virchow first explained that cells divide and new    cells are formed from pre-existing cells (expressed in Latin as    <i>'Omnis cellula-e cellula'</i>). He modified the hypothesis of    Schleiden and Schwann to give the cell theory its modern and final    shape.</p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"orphans:0;widows:0\">    <b>In macroeconomic comparisons of national income, which of the    following best describes the purpose of using Purchasing Power    Parity (PPP) exchange rates instead of market exchange rates?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    To measure only the export-import balance of nations</p>", "option2": " <p style=\"orphans:0;widows:0\">    To account for differences in local price levels and cost of    living</p>", "option3": " <p style=\"orphans:0;widows:0\">    To eliminate the impact of total population on national output</p>", "option4": " <p style=\"orphans:0;widows:0\">    To adjust for international debt obligations of countries</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Purchasing Power Parity (PPP) is an economic metric used to    compare the economic productivity and standards of living between    countries. When using market exchange rates, GDP figures can be    distorted by currency fluctuations and do not reflect non-traded    goods and services. PPP exchange rates adjust for differences in    domestic price levels and the cost of living, measuring how many    units of a local currency are needed to buy the same basket of    goods and services that one unit of currency (usually the US    dollar) would buy in the reference country.</p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following amino acids serves as the primary    precursor for the synthesis of the neurotransmitters dopamine and    adrenaline (epinephrine)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Alanine</p>", "option2": " <p style=\"orphans:0;widows:0\">    Tyrosine</p>", "option3": " <p style=\"orphans:0;widows:0\">    Lysine</p>", "option4": " <p style=\"orphans:0;widows:0\">    Glycine</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Tyrosine is an amino acid that serves as the precursor for the    synthesis of catecholamines, which include dopamine,    norepinephrine (noradrenaline), and epinephrine (adrenaline).    These neurotransmitters play vital roles in regulating mood, motor    control, and the fight-or-flight stress response.</p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"orphans:0;widows:0\">    <b>Where is the headquarters of the North Western Railway zone of    the Indian Railways located?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Jaipur</p>", "option2": " <p style=\"orphans:0;widows:0\">    Gorakhpur</p>", "option3": " <p style=\"orphans:0;widows:0\">    Jabalpur</p>", "option4": " <p style=\"orphans:0;widows:0\">    Prayagraj</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The headquarters of the North Western Railway (NWR) zone is    located in Jaipur. It was established on 1 October 2002 and    comprises four divisions: Jaipur, Ajmer, Bikaner, and Jodhpur. For    reference, the headquarters of the North Eastern Railway is at    Gorakhpur, West Central Railway is at Jabalpur, and North Central    Railway is at Prayagraj.</p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"orphans:0;widows:0\">    <b>According to the Census of India 2011, what was the decadal    population growth rate recorded for the Muslim community between    2001 and 2011?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    20.8%</p>", "option2": " <p style=\"orphans:0;widows:0\">    24.6%</p>", "option3": " <p style=\"orphans:0;widows:0\">    28.2%</p>", "option4": " <p style=\"orphans:0;widows:0\">    16.8%</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    According to the 2011 Census data on religion released by the    Registrar General and Census Commissioner of India, the decadal    growth rate of the Muslim community was 24.6% during the 2001–2011    period. For comparison, the growth rate of Hindus was 16.8%,    Christians was 15.5%, Sikhs was 8.4%, Buddhists was 6.1%, and    Jains was 5.4%, against the national average decadal growth rate    of 17.7%.</p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0\">    <b>In September 2026, the National Minorities Development and    Finance Corporation (NMDFC) launched its revamped portal (NMDFC    2.0) along with an AI-powered multilingual chatbot to facilitate    easier, citizen-centric access to information and welfare schemes.    What is the name of this chatbot?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    MITRA (Minority Information and Training Resource Assistant)</p>", "option2": " <p style=\"orphans:0;widows:0\">    MIRA (Minority Information and Resource Assistance)</p>", "option3": " <p style=\"orphans:0;widows:0\">    MADAD (Minority Access and Development Assistant)</p>", "option4": " <p style=\"orphans:0;widows:0\">    MARG (Minority Awareness and Resource Guidance)</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In September 2026, the National Minorities Development and Finance    Corporation (NMDFC), operating under the Ministry of Minority    Affairs, launched its upgraded digital platform 'NMDFC 2.0' and an    AI-powered chatbot named <b>MIRA</b> (Minority Information and    Resource Assistance). Powered by the BHASHINI language initiative,    the chatbot is designed to provide multilingual assistance to    beneficiaries seeking information regarding concessional credit    schemes and entrepreneurial support.</p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following rivers of the Himalayan drainage system:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. Arun</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2.    Subansiri</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3. Ravi</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>4. Sutlej</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the rivers given    above are examples of antecedent rivers?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1, 2, and 4 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    1 and 4 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    2, 3, and 4 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2, 3, and 4</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Antecedent rivers are those that existed prior to the upliftment    of the mountain ranges and maintained their original courses by    cutting deep gorges and V-shaped valleys as the land rose.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>Arun</b>    (a tributary of Kosi) originates in Tibet north of Mount Everest    and cuts through the Great Himalayas, making it a classic    antecedent river.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>Subansiri</b>    originates in Tibet and flows through the Himalayas as an    antecedent stream.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. <b>Sutlej</b>    originates near Rakshastal in Tibet and cuts through the Zaskar    and Great Himalayan ranges via deep gorges (e.g., near Shipki La),    making it antecedent.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. <b>Ravi</b>    originates west of Rohtang Pass in Himachal Pradesh and is a    consequent river rather than an antecedent one.</p>    <p style=\"orphans:0;widows:0\">Therefore, 1, 2, and 4 are    antecedent rivers.</p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following acid-base indicators remains colourless    in an acidic solution and turns pink in a basic solution?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Methyl orange</p>", "option2": " <p style=\"orphans:0;widows:0\">    Phenolphthalein</p>", "option3": " <p style=\"orphans:0;widows:0\">    Universal indicator</p>", "option4": " <p style=\"orphans:0;widows:0\">    Bromothymol blue</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Phenolphthalein is a synthetic acid-base indicator commonly used    in titrations. It remains colourless in acidic and neutral    solutions (pH less than 8.3) and turns pink/magenta in basic or    alkaline solutions (pH greater than 8.3).</p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"orphans:0;widows:0\">    <b>With reference to the Ahmedabad Mill Strike of 1918, during    which Mahatma Gandhi undertook his first hunger strike in India,    the dispute between the mill owners and the workers was primarily    regarding the withdrawal of which allowance, and what percentage    of wage hike was ultimately awarded to the workers?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    War Bonus; 25%</p>", "option2": " <p style=\"orphans:0;widows:0\">    Plague Bonus; 35%</p>", "option3": " <p style=\"orphans:0;widows:0\">    Dearness Allowance; 30%</p>", "option4": " <p style=\"orphans:0;widows:0\">    Famine Relief Bonus; 50%</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    During the Ahmedabad Mill Strike (1918), the dispute arose when    mill owners wanted to discontinue the <b>Plague Bonus</b> after    the epidemic subsided, while workers demanded a 50% wage increase    to cope with wartime inflation. Mahatma Gandhi intervened and    asked workers to reduce their demand to a <b>35%</b> wage hike. To    strengthen their resolve, he undertook his first hunger strike in    India. The mill owners eventually agreed to submit the issue to an    arbitration tribunal, which awarded the workers a 35% wage    increase.</p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"orphans:0;widows:0\">    <b>In which of the following landmark cases did the Supreme Court    of India hold that the Indian Constitution is founded on the    bedrock of the balance between Fundamental Rights and Directive    Principles of State Policy?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Golaknath Case (1967)</p>", "option2": " <p style=\"orphans:0;widows:0\">    Minerva Mills Case (1980)</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kesavananda Bharati Case (1973)</p>", "option4": " <p style=\"orphans:0;widows:0\">    Maneka Gandhi Case (1978)</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In the landmark <b>Minerva Mills Case (1980)</b>, the Supreme    Court of India held that the Indian Constitution is founded on the    bedrock of the balance between Fundamental Rights (Part III) and    Directive Principles of State Policy (Part IV). The Court observed    that giving absolute primacy to one over the other is to disturb    the harmony of the Constitution, and both together constitute the    core of commitment to social revolution.</p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following Sultans of the Delhi Sultanate was the    first to participate in the public celebration of Hindu festivals,    particularly Holi?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Alauddin Khalji</p>", "option2": " <p style=\"orphans:0;widows:0\">    Muhammad bin Tughluq</p>", "option3": " <p style=\"orphans:0;widows:0\">    Firoz Shah Tughlaq</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ghiyasuddin Balban</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Muhammad bin Tughluq (reigned 1325–1351) was known for his    open-minded and tolerant religious approach. He was the first    Sultan of Delhi to publicly participate in Hindu festivals,    especially Holi. He also patronised Jain scholars such as    Jinaprabha Suri and visited Hindu yogis and holy places.</p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"orphans:0;widows:0\">    <b>Which international agreement was adopted in 1987 to protect    the Earth's ozone layer by phasing out the production and    consumption of ozone-depleting substances?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Kyoto Protocol</p>", "option2": " <p style=\"orphans:0;widows:0\">    Montreal Protocol</p>", "option3": " <p style=\"orphans:0;widows:0\">    Cartagena Protocol</p>", "option4": " <p style=\"orphans:0;widows:0\">    Nagoya Protocol</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Montreal Protocol on Substances that Deplete the Ozone Layer    is an international treaty designed to protect the ozone layer by    phasing out the production of numerous substances responsible for    ozone depletion, such as chlorofluorocarbons (CFCs). It was agreed    on 16 September 1987 and entered into force on 1 January 1989. In    commemoration of this date, 16 September is observed annually as    World Ozone Day.</p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"orphans:0;widows:0\">    <b>According to the official BWF tournament smash speed data,    which Indian badminton player recorded the fastest smash in    women's singles (clocking 380.1 km/h) at the Indonesia Masters    held in January 2026?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Saina Nehwal</p>", "option2": " <p style=\"orphans:0;widows:0\">    P. V. Sindhu</p>", "option3": " <p style=\"orphans:0;widows:0\">    Ashmita Chaliha</p>", "option4": " <p style=\"orphans:0;widows:0\">    Treesa Jolly</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In January 2026, two-time Olympic medallist P. V. Sindhu recorded    the fastest smash in women's singles at the Indonesia Masters    Super 500 tournament held at Istora Senayan, Jakarta. Sindhu    clocked a top speed of 380.1 km/h, leading the tournament charts    ahead of Thailand's Busanan Ongbamrungphan (373.5 km/h).</p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:0;widows:0\">    <b>In which year did British physicist J. J. Thomson discover the    electron, the first subatomic particle ever identified?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1886</p>", "option2": " <p style=\"orphans:0;widows:0\">    1897</p>", "option3": " <p style=\"orphans:0;widows:0\">    1905</p>", "option4": " <p style=\"orphans:0;widows:0\">    1911</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In 1897, British physicist J. J. Thomson discovered the electron    through his experiments with cathode ray tubes. He demonstrated    that cathode rays were composed of previously unknown negatively    charged particles, which were later named electrons. Thomson was    awarded the Nobel Prize in Physics in 1906 for this groundbreaking    discovery.</p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following was the President of India when the    Pokhran-II nuclear tests (Operation Shakti) were conducted in May    1998?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Shankar Dayal Sharma</p>", "option2": " <p style=\"orphans:0;widows:0\">    K. R. Narayanan</p>", "option3": " <p style=\"orphans:0;widows:0\">    R. Venkataraman</p>", "option4": " <p style=\"orphans:0;widows:0\">    Dr. A. P. J. Abdul Kalam</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In May 1998, India conducted a series of five nuclear bomb test    explosions at the Pokhran Test Range in Rajasthan, code-named    'Operation Shakti' (Pokhran-II). During this historic event, <b>K.    R. Narayanan</b> was serving as the 10th President of India    (tenure: July 1997 – July 2002), and Atal Bihari Vajpayee was    the Prime Minister.</p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"orphans:0;widows:0\">    <b>Which scientist discovered the principle that pressure applied    to an enclosed fluid is transmitted equally in all directions,    forming the basis for hydraulic lifts and brakes?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Blaise Pascal</p>", "option2": " <p style=\"orphans:0;widows:0\">    Daniel Bernoulli</p>", "option3": " <p style=\"orphans:0;widows:0\">    Evangelista Torricelli</p>", "option4": " <p style=\"orphans:0;widows:0\">    Robert Boyle</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Pascal's Principle (or Pascal's Law), stated by French scientist    Blaise Pascal in 1653, states that when pressure is applied to a    confined incompressible fluid, the pressure change is transmitted    equally and undiminished to every part of the fluid and the walls    of its container. This principle is the operational foundation of    hydraulic machines, including hydraulic lifts, hydraulic jacks,    and hydraulic brakes.</p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"orphans:0;widows:0\">    <b>The high-yielding dwarf varieties of wheat that laid the    foundation for the Green Revolution in India were originally    developed in which country?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    United States of America</p>", "option2": " <p style=\"orphans:0;widows:0\">    Mexico</p>", "option3": " <p style=\"orphans:0;widows:0\">    Australia</p>", "option4": " <p style=\"orphans:0;widows:0\">    Philippines</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The high-yielding dwarf varieties of wheat that triggered the    Green Revolution were developed in <b>Mexico</b> by Nobel laureate    Dr. Norman Borlaug at the International Maize and Wheat    Improvement Center (CIMMYT). In the mid-1960s, India imported    varieties such as <i>Lerma Rojo 64-A</i> and <i>Sonora 64</i>,    which dramatically boosted wheat productivity and helped India    achieve food self-sufficiency.</p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following was a key policy measure adopted under    the 'Privatisation' pillar of the New Economic Policy (NEP) of    1991 in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Devaluation of the Indian Rupee against foreign currencies</p>", "option2": " <p style=\"orphans:0;widows:0\">    Disinvestment through the sale of equity of Public Sector    Undertakings (PSUs)</p>", "option3": " <p style=\"orphans:0;widows:0\">    Removal of licensing requirements for most industries</p>", "option4": " <p style=\"orphans:0;widows:0\">    Reduction in customs duties and removal of import quotas</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Under the New Economic Policy (NEP) of 1991, <b>Privatisation</b>    involved reducing the role of the public sector and transferring    the ownership or management of government enterprises to the    private sector. The primary instrument used for this was    <b>disinvestment</b>, which entailed selling government equity in    Public Sector Undertakings (PSUs) to private investors and the    public. In contrast, removing industrial licensing is a measure of    liberalisation, while rupee devaluation and tariff reductions    relate to trade and external sector reforms.</p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:0;widows:0\">    <b>In September 2026, India defeated which country 4–1 in the    final to lift the Men's Junior Asia Cup hockey title held in    China, securing a record-extending sixth crown?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Pakistan</p>", "option2": " <p style=\"orphans:0;widows:0\">    South Korea</p>", "option3": " <p style=\"orphans:0;widows:0\">    Malaysia</p>", "option4": " <p style=\"orphans:0;widows:0\">    Japan</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In September 2026, the Indian Junior Men's hockey team clinched a    record-extending sixth Men's Junior Asia Cup title after defeating    South Korea 4–1 in the final held at Moqi, Hulunbuir City,    China. Pakistan secured the bronze medal by defeating Malaysia 4–2    in the third-place match.</p>", "question_heading": ""}, {"sr_no": 91, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the figure from the options that can replace the question mark (?) to logically complete the given series.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image001.png\" width=\"500\" height=\"110\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image002.png\" width=\"100\" height=\"100\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image003.png\" width=\"100\" height=\"100\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image004.png\" width=\"100\" height=\"100\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image005.png\" width=\"100\" height=\"100\" alt ></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The series follows two distinct rules:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">Central Arrow:</span><span> In each successive step, the arrow rotates </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image006.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> clockwise: Up → Right → Down → Left → </span><span style=\"font-weight:bold\">Up</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">Numbers (1, 2, 3, 4):</span><span> The numbers shift clockwise along the perimeter by </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image007.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> at each step, alternating between corners and edge midpoints:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combining both patterns, the missing figure has an arrow pointing Up and numbers 3, 4, 1, 2 at the top-left, top-right, bottom-right, and bottom-left corners respectively. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">This matches option (B).</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A question is followed by two statements numbered (I) and (II). You have to decide whether the data provided in the statements are sufficient to answer the question.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Question: Among four friends K, L, M, and N, who is the heaviest?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(I) M is heavier than K and L.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(II) N is heavier than M.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in statements (I) and (II) together are sufficient to answer the question.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in statement (I) alone is sufficient to answer the question, whereas data in statement (II) alone is not.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in statement (II) alone is sufficient to answer the question, whereas data in statement (I) alone is not.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in statements (I) and (II) together are not sufficient to answer the question.</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">From statement (I):</span><span> M is heavier than both K and L (M &gt; K and M &gt; L). It does not provide any information about N. </span><span style=\"font-weight:bold\">Thus, statement (I) alone is not sufficient.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">From statement (II):</span><span> N is heavier than M (N &gt; M). It does not provide any information about K and L. </span><span style=\"font-weight:bold\">Thus, statement (II) alone is not sufficient</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Combining statements (I) and (II):</span><span> N &gt; M &gt; K and N &gt; M &gt; L. This clearly shows that N is heavier than all the other three friends (M, K, and L). Therefore, N is the heaviest.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, data in statements (I) and (II) together are sufficient to answer the question.</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Read the given statement and answer the question that follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">“Rohan follows a balanced diet rich in proteins and vitamins to build stamina, which has noticeably boosted his athletic performance on the track.”</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following can be inferred from the given statement?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. The improvement in Rohan's athletic performance is likely linked to his dietary habits.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. Rohan has become the fastest runner in his sports academy.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only (I) can be inferred</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only (II) can be inferred</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both (I) and (II) can be inferred</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither (I) nor (II) can be inferred</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statement, it is clearly indicated that Rohan's balanced diet has boosted his athletic performance, </span><span style=\"font-weight:bold\">which means inference I directly and logically follows. </span><span>However, the statement provides no information comparing him to others or claiming he is the fastest runner in his sports academy, </span><span style=\"font-weight:bold\">so inference II cannot be inferred</span><span>. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, only (I) can be inferred.</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Four number-pairs have been given, out of which three are alike in some manner and one is different. Select the one that is different.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into their constituent digits. E.g. 13 – Operations on 13 such as adding/subtracting/multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>210 - 14</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>342 - 18</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>264 - 16</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>132 - 11</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed here is: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image008.png\" width=\"431\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Option A: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image009.png\" width=\"218\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Option B: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image010.png\" width=\"218\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Option C: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image011.png\" width=\"265\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Option D: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image012.png\" width=\"218\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, 264 - 16 is the odd one out.</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a certain code language, ‘CRANE’ is coded as ‘78214’, ‘TRAIN’ is coded as ‘24957’, and ‘STORM’ is coded as ‘65730’. What is the code for ‘R’ in the given code language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Compare the given coded words:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. In ‘CRANE’ (78214) and ‘TRAIN’ (24957), the common letters are R, A, and N, and the common digits are 2, 4, and 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Now, comparing these with ‘STORM’ (65730):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Among {R, A, N}, the only letter present in ‘STORM’ is R.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Among {2, 4, 7}, the only digit present in ‘STORM’ is 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, the code for ‘R’ is 7.</span></p>", "question_heading": ""}, {"sr_no": 96, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the option figure that will replace the question mark (?) in the figure given below to complete the pattern.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image013.png\" width=\"260\" height=\"260\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image014.png\" width=\"120\" height=\"120\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image015.png\" width=\"120\" height=\"120\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image016.png\" width=\"120\" height=\"120\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image017.png\" width=\"120\" height=\"120\" alt ></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.ak p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image038.png\" width=\"121\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Alternatively, the differences between consecutive terms are:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image039.png\" width=\"67\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image040.png\" width=\"76\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image041.png\" width=\"37\" height=\"21\" alt style=\"vertical-align:middle\" ><span>)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image042.png\" width=\"94\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image043.png\" width=\"46\" height=\"21\" alt style=\"vertical-align:middle\" ><span>)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image044.png\" width=\"83\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image045.png\" width=\"55\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image046.png\" width=\"135\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image047.png\" width=\"102\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image048.png\" width=\"55\" height=\"21\" alt style=\"vertical-align:middle\" ><span>)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, the missing number is 74.</span></p>", "question_heading": ""}, {"sr_no": 100, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">How many six-lettered meaningful words can be formed using all these letters, but using each letter only once in the word?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">D L C</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A E N</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>None</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The given letters are D, L, C, A, E, and N.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Using all these letters exactly once, only </span><span style=\"font-weight:bold\">one</span><span> meaningful six-letter English word can be formed: </span><span style=\"font-weight:bold\">CANDLE</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, only one meaningful word can be formed.</span></p>", "question_heading": ""}, {"sr_no": 101, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the correct option that indicates the arrangement of the following words in a logical and meaningful order.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">1. Treatment</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">2. Symptoms</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">3. Recovery</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">4. Consultation</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">5. Diagnosis</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2, 5, 4, 1, 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2, 4, 5, 1, 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4, 2, 5, 3, 1</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2, 4, 1, 5, 3</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The logical and meaningful sequence represents the stages of dealing with an illness:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. First, an individual experiences </span><span style=\"font-weight:bold\">Symptoms</span><span> (2).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Based on the symptoms, they seek a doctor's </span><span style=\"font-weight:bold\">Consultation</span><span> (4).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. The doctor performs an examination to reach a </span><span style=\"font-weight:bold\">Diagnosis</span><span> (5).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. After the illness is diagnosed, the patient receives </span><span style=\"font-weight:bold\">Treatment</span><span> (1).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Finally, following proper treatment, the patient achieves </span><span style=\"font-weight:bold\">Recovery</span><span> (3).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the correct meaningful order is </span><span style=\"font-weight:bold\">2, 4, 5, 1, 3</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 102, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A question is given, followed by two statements labelled I and II. Identify which of the statements is/are sufficient to answer the question.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Question: Five persons M, N, O, P and Q are sitting in a row facing north. Who sits at the extreme right end of the row?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(I) P sits at one of the extreme ends, and M sits second to the right of P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(II) Q sits second to the left of O, and O is an immediate neighbour of M.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in Statement I alone is sufficient to answer the question while data in Statement II is not</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in Statement II alone is sufficient to answer the question while data in Statement I is not</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in Statements I and II together is not sufficient to answer the question</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in Statements I and II together is sufficient to answer the question</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">From Statement I:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the 5 positions from left to right be 1, 2, 3, 4, 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P sits at an extreme end and M is to the right of P, which means P must be at position 1 (extreme left end).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M sits second to the right of P, so M is at position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Arrangement: P(1), _(2), M(3), _(4), _(5).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The person at the extreme right end (position 5) could be N, O, or Q. </span><span style=\"font-weight:bold\">Thus, Statement I alone is not sufficient.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">From Statement II:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q sits second to the left of O, and O is an immediate neighbour of M. Without knowing the absolute positions, multiple arrangements are possible. Thus, Statement II alone is not sufficient.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combining Statements I and II:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From I, P is at position 1 and M is at position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From II, O is an immediate neighbour of M, so O can be at position 2 or position 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- If O is at position 2, Q would have to sit at position 0, which is impossible.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- If O is at position 4, Q sits second to the left of O, which places Q at position 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The only remaining person, N, must occupy position 5 (the extreme right end).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The complete arrangement from left to right is: P, Q, M, O, N.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, data in Statements I and II together is sufficient to answer the question.</span></p>", "question_heading": ""}, {"sr_no": 103, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a certain code language,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">P + Q means ‘P is the sister of Q’,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">P – Q means ‘P is the husband of Q’,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">P × Q means ‘P is the father of Q’ and</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">P ÷ Q means ‘P is the mother of Q’.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Based on the above, how is A related to E if ‘A + B × C ÷ D – E’?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Husband's father's mother's sister</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Husband's mother's father's sister</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Husband's mother's father's brother</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Husband's father's mother's brother</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Breaking down the expression ‘A + B × C ÷ D – E’ from right to left:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. D – E → D is the husband of E (E is the wife).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. C ÷ D → C is the mother of D (Husband's mother).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. B × C → B is the father of C (Husband's mother's father).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. A + B → A is the sister of B (Husband's mother's father's sister).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, A is E's Husband's mother's father's sister.</span></p>", "question_heading": ""}, {"sr_no": 104, "question": "Giॅधn ृिधयथ iौ ो ौपोपधंधnप (Cोहौध) ीियियथधक ृद पुनधध ूयौौiृिध धीीधcपौ nहंृधनधक I, II ोnक III. Rधोक पुध ‘Cोहौध’ cोनधीिहिद ोnक कधciकध थुicु यी पुध पुनधध cोn ृध ो ूयौौiृिध धीीधcप/धीीधcपौ.Cोहौध: A ंोुयन हnकधनgनयहnक gोौ ूiूिधinध नहूपहनध यccहननधक धोिनद in पुध ंयनning in पुध inकहौपनiोि शयnध यी Ciपद Y, निधधोौing कधnौध पयसic ीहंधौ inपय पुध ौहननयहnकing ोपंयौूुधनध.Eीीधcप I: Lयcोि ोहपुयनiपiधौ यनकधनधक ोn iंंधकiोपध धॅोcहोपiयn ोnक cियौहनध यी ौcुयियस ोnक यीीicधौ ियcोपधक थiपुin ो 3-ां नोकiहौ यी पुध inciकधnप ौiपध.Eीीधcप II: Nधोनृद ुयौूiपोिस नधूयनपधक ो ौहककधn inीिहस यी ूोपiधnपौ cयंूिोining यी ोcहपध नधौूiनोपयनद iननiपोपiयn ोnक ृनधोपुिधौौnधौौ.Eीीधcप III: Tुध cधnपनोि gयॅधनnंधnप iंंधकiोपिधद ोnnयहncधक ो 15% नधकहcपiयn in nोपiयnोि ीहिध iंूयनप कहपiधौ.", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I is a possible effect.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both I and II are possible effects.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both II and III are possible effects.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All I, II and III are possible effects.</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. Effect I is a logical and direct consequence:</span><span> to protect citizens from toxic exposure, authorities typically order evacuations and temporary closures of nearby institutions.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. Effect II is a direct physiological outcome:</span><span> inhalation of hazardous toxic fumes directly causes respiratory complications and distress, leading to a ertical-align:middle\" ><span style=\"font-weight:bold\">.</span></p>", "question_heading": ""}, {"sr_no": 109, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If each of the digits in the number 72495816 is arranged in ascending order from left to right, the position(s) of how many digits will remain unchanged as compared to the original number?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>None</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Arranging the digits in ascending order from left to right: 12456789</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Now comparing the original number with the rearranged number:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Original: 7 </span><span style=\"font-weight:bold\">2</span><span> </span><span style=\"font-weight:bold\">4</span><span> 9 5 8 1 6</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>New: 1 </span><span style=\"font-weight:bold\">2</span><span> </span><span style=\"font-weight:bold\">4</span><span> 5 6 7 8 9</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The positions of two digits, </span><span style=\"font-weight:bold\">2</span><span> and </span><span style=\"font-weight:bold\">4</span><span>, remain unchanged. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, the correct answer is Two.</span></p>", "question_heading": ""}, {"sr_no": 110, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Three of the following four pairs are alike in a certain way and thus form a group. Which is the pair that does not belong to that group?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹, $, €, £ - Currency symbols</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2, 3, 5, 7 - Prime numbers</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>@, #, %, &amp; - Digits</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>+, −, ×, ÷ - Mathematical operators</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In pairs A, B, and D, the group of characters is correctly matched with its category:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• ₹, $, €, £ are currency symbols.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 2, 3, 5, 7 are prime numbers.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• +, −, ×, ÷ are mathematical operators.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>However, in pair C, @, #, %, &amp; are special characters/symbols, not digits. </span><span style=\"font-weight:bold\">Hence, '@, #, %, &amp; - Digits' is the odd pair.</span></p>", "question_heading": ""}, {"sr_no": 111, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Figure A is related to figure B following a certain pattern. Following the same pattern, figure C is related to figure D. Study the pattern and select the figure from the given options that should d 'na' (in any order).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. From the first and third statements: 'fresh' is common, and the common code is 'sa'. Therefore, 'fresh' = 'sa'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. In the first statement ('fresh fruits are sweet' = 'sa pa ta na'), the only remaining word is 'fruits' and the only remaining code is 'ta'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Thus, 'fruits' is coded as 'ta'.</span></p>", "question_heading": ""}, {"sr_no": 117, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the correct option that indicates the arrangement of the following words in a logical and meaningful order.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">1. Fabric</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">2. Cotton</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">3. Shirt</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">4. Yarn</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">5. Tailoring</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2, 4, 1, 5, 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2, 1, 4, 5, 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4, 2, 1, 5, 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2, 4, 5, 1, 3</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The correct meaningful order represents the sequential process of garment making:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First, </span><span style=\"font-weight:bold\">Cotton</span><span> (2) is obtained as a raw material.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Next, it is spun into </span><span style=\"font-weight:bold\">Yarn</span><span> (4).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The yarn is then woven into </span><span style=\"font-weight:bold\">Fabric</span><span> (1).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>After that, </span><span style=\"font-weight:bold\">Tailoring</span><span> (5) is done on the fabric.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Finally, the finished </span><span style=\"font-weight:bold\">Shirt</span><span> (3) is produced.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Thus, the logical order is 2, 4, 1, 5, 3.</span></p>", "question_heading": ""}, {"sr_no": 118, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">P, Q, R, S, T and U are sitting around a circular table facing the centre. R is an immediate neighbour of P. S sits second to the left of R. U is an immediate neighbour of both Q and T. Q is not an immediate neighbour of R. Who sits to the immediate left of P?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Six persons: P, Q, R, S, T and U are sitting around a circular table facing the centre.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. R is an immediate neighbour of P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. S sits second to the left of R.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. U is an immediate neighbour of both Q and T.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Q is not an immediate neighbour of R.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since everyone is facing the centre, left is in the clockwise direction.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794500901030_image084.png\" width=\"334\" height=\"298\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the person sitting to the immediate left of P is </span><span style=\"font-weight:bold\">S</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 119, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a row of people all facing the north, Hira is 12th from the left end.Tisha is 22ⁿd from the left end.Tisha is exactly between Hira and Kashish. If Kashish is 13th from the right end of the line, how many people are there in the row?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>41</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>43</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>42</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><span>44</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Hira's position from the left = 12th</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Tisha's position from the left = 22nd</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Tisha is exactly between Hira and Kashish.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Distance between Hira and Tisha = 22 − 12 = 10</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Distance between Tisha and Kashish = 10</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Kashish's position from the left = 22 + 10 = 32nd</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Now,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total number of persons = Position from left + Position from right − 1</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= 32 + 13 − 1 = 44</span></p>", "question_heading": ""}, {"sr_no": 120, "question": " <p style=\"margin-top:0pt;margin-bottom:4pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Pooja forgot her locker code. She remembered the following details about it: (1) The code begins with the letters 'LCK'. (2) The next part is a three-digit odd number between 450 and 460. (3) The next character is an English vowel other than 'A' and 'E'. (4) The code ends with a two-digit perfect square number. Which of the following could be her correct locker code?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LCK-456-I-49</span></p>"
