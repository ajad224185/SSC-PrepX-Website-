 " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (A). <b>\"whom we believe\"</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Here, the    relative pronoun functions as the subject of the verb <i>'is'</i>    in the clause that follows (<i>'we believe'</i> is an interrupting    parenthetical clause). Therefore, the subjective pronoun <b>'who'</b>    should be used instead of the objective pronoun <b>'whom'</b>.</p>    <p style=\"orphans:0;widows:0\">The correct sentence is: <i>\"He    is the candidate who we believe is most suitable for the    prestigious post.\"</i></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Parts of the following sentence have been given as options. Select    the option that contains an error.</p>    <p style=\"orphans:0;widows:0\">Children should be taught to take    care of those belongings from an early age.</p>", "option1": "<p style=\"orphans:0;widows:0\">    from an early age.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Children should be</p>", "option3": " <p style=\"orphans:0;widows:0\">    of those belongings</p>", "option4": " <p style=\"orphans:0;widows:0\">    taught to take care</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (C)</b> \"of those belongings\".</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In this    context, the sentence refers to the personal possessions of the    children. Therefore, the possessive determiner 'their' should be    used instead of the demonstrative determiner 'those'. The correct    phrase should be \"of their belongings\".</p>    <p style=\"orphans:0;widows:0\">Correct sentence: <i>Children    should be taught to take care of their belongings from an early    age.</i></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The following sentence has been divided into four parts. One of    them contains an error. Select the part that contains the error    from the given options.</p>    <p style=\"orphans:0;widows:0\">Even though he was / well-trained    for the mission, / he behaved cowardly / when confronted by the    enemy.</p>", "option1": "<p style=\"orphans:0;widows:0\">    well-trained for the mission,</p>", "option2": " <p style=\"orphans:0;widows:0\">    he behaved cowardly</p>", "option3": " <p style=\"orphans:0;widows:0\">    Even though he was</p>", "option4": " <p style=\"orphans:0;widows:0\">    when confronted by the enemy.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B)</b> <b>'he behaved cowardly'</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'Cowardly' is    an adjective, not an adverb (just like <i>friendly, miserly,    scholarly, brotherly</i>). To modify the verb 'behaved', we must    use an adverbial phrase rather than an adjective. Therefore,    'cowardly' should be replaced with <b>'in a cowardly manner'</b>    or <b>'in a cowardly way'</b>.</p>    <p style=\"orphans:0;widows:0\">Correct sentence: <i>Even though    he was well-trained for the mission, he behaved in a cowardly    manner when confronted by the enemy.</i></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence has an error which has been underlined. The    underlined word is given as options with some changes. Select the    option that rectifies the error.</p>    <p style=\"orphans:0;widows:0\">The committee demanded    unconditional <u>aquiescence</u> to the new regulatory guidelines.</p>", "option1": "<p style=\"orphans:0;widows:0\">    acquiesence</p>", "option2": " <p style=\"orphans:0;widows:0\">    acquiescence</p>", "option3": " <p style=\"orphans:0;widows:0\">    acquiessence</p>", "option4": " <p style=\"orphans:0;widows:0\">    aquiesence</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The correctly spelled word is <b>acquiescence</b>, which means the    reluctant acceptance of something without protest. It is derived    from the Latin verb <i>acquiescere</i> (combining <i>ad-</i> and    <i>quiescere</i>). Common spelling errors involve omitting the 'c'    before 'q' or omitting the 'c' after 's'. Therefore, option B    correctly rectifies the error.</p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">By next month, the committee    _______ its final report on the project.</p>", "option1": "<p style=\"orphans:0;widows:0\">    will submit</p>", "option2": " <p style=\"orphans:0;widows:0\">    had submitted</p>", "option3": " <p style=\"orphans:0;widows:0\">    will have submitted</p>", "option4": " <p style=\"orphans:0;widows:0\">    will have submit</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (C)</b> <b>will have submitted</b>.</p>    <p style=\"orphans:0;widows:0\">The phrase 'By next month'    indicates a deadline or a specific point in the future by which an    action will be completed. To describe an action that will be    completed prior to a certain future time, the <b>Future Perfect    Tense</b> is used. Its structure is: <i>subject + will/shall +    have + past participle (V3)</i>. Therefore, 'will have submitted'    is the grammatically correct option.</p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate phrasal verb to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">The new regulations are expected    to ________ a positive change in the banking sector.</p>", "option1": "<p style=\"orphans:0;widows:0\">    bring about</p>", "option2": " <p style=\"orphans:0;widows:0\">    bring off</p>", "option3": " <p style=\"orphans:0;widows:0\">    bring round</p>", "option4": " <p style=\"orphans:0;widows:0\">    bring up</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The phrasal verb <b>'bring about'</b> means to cause something to    happen or produce a particular result. In the given sentence, the    regulations are expected to cause a positive change.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>bring off:</b>    to succeed in achieving something difficult</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>bring    round:</b> to restore someone to consciousness or persuade someone    to agree</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>bring up:</b>    to mention a topic or raise a child</p>    <p style=\"orphans:0;widows:0\">Therefore, <b>bring about</b> is    the correct choice.</p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in indirect    speech.</p>    <p style=\"orphans:0;widows:0\">The science teacher said, “Light    travels faster than sound.”</p>", "option1": "<p style=\"orphans:0;widows:0\">    The science teacher said that light travelled faster than sound.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The science teacher said that light travels faster than sound.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The science teacher says that light travels faster than sound.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The science teacher told that light had travelled faster than    sound.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct indirect speech is: <b>The science teacher said that    light travels faster than sound.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rule:</b>    When the reported speech expresses a universal truth, a scientific    fact, or a general law of nature, its tense does not change even    if the reporting verb is in the past tense ('said').</p>    <p style=\"orphans:0;widows:0\">Since “Light travels faster    than sound” is an established scientific fact, the simple    present tense ‘travels’ is retained. The reporting verb ‘said’    remains unchanged as there is no indirect object, and the    conjunction ‘that’ is used to connect the clauses.</p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in active    voice.</p>    <p style=\"orphans:0;widows:0\">A prestigious scholarship was    offered to Ananya by the university.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Ananya offered a prestigious scholarship to the university.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The university had offered a prestigious scholarship to Ananya.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The university offered a prestigious scholarship to Ananya.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The university was offering a prestigious scholarship to Ananya.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (C)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The given    sentence is in the passive voice in the simple past tense (was +    past participle <i>offered</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The rule for    converting passive voice to active voice in the simple past tense    is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Passive    Voice:</b> Object + was/were + V3 + by + Subject</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Active    Voice:</b> Subject + V2 (past tense form of verb) + Object</p>    <p style=\"orphans:0;widows:0\">Here, the subject in the active    voice is 'The university', the simple past verb is 'offered', and    the object is 'a prestigious scholarship to Ananya'. Therefore,    the correct active form is: <i>The university offered a    prestigious scholarship to Ananya.</i></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate synonym of the word given in brackets    to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">The committee was severely    frustrated by the diplomat's _________ attitude, which completely    stalled the bilateral negotiations. (Intransigent)</p>", "option1": "<p style=\"orphans:0;widows:0\">    mercurial</p>", "option2": " <p style=\"orphans:0;widows:0\">    obdurate</p>", "option3": " <p style=\"orphans:0;widows:0\">    facetious</p>", "option4": " <p style=\"orphans:0;widows:0\">    benevolent</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>'Intransigent'</b> means unwilling or refusing to    compromise, yield, or moderate a position (stubborn, unbending).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Obdurate:</b>    stubbornly refusing to change one's opinion or course of action;    unyielding (correct synonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Mercurial:</b>    subject to sudden or unpredictable changes of mood or mind;    volatile.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Facetious:</b>    treating serious issues with deliberately inappropriate humor;    flippant.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Benevolent:</b>    well-meaning, kind, and charitable.</p>    <p style=\"orphans:0;widows:0\">Therefore, <b>obdurate</b> is the    correct synonym to fill in the blank.</p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the underlined part of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The botanical institute preserves    a rare <u>collection of dried and pressed plant specimens arranged    systematically</u>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Arboretum</p>", "option2": " <p style=\"orphans:0;widows:0\">    Herbarium</p>", "option3": " <p style=\"orphans:0;widows:0\">    Vivarium</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sanatorium</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B)</b> <b>Herbarium</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Herbarium:</b>     A systematically arranged collection of dried, pressed, and     preserved plant specimens used for scientific study.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Arboretum:</b>     A botanical garden devoted to the cultivation and exhibition of     trees and shrubs.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Vivarium:</b>     An enclosure or structure adapted for keeping and raising living     animals and plants for observation or research.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Sanatorium:</b> An     establishment providing medical treatment and rest, often for     people with long-term illnesses.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the following sentence in active    voice.</p>    <p style=\"orphans:0;widows:0\">By whom was the secret    information leaked to the media?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Who leaked the secret information to the media?</p>", "option2": " <p style=\"orphans:0;widows:0\">    Who was leaking the secret information to the media?</p>", "option3": " <p style=\"orphans:0;widows:0\">    Who has leaked the secret information to the media?</p>", "option4": " <p style=\"orphans:0;widows:0\">    Whom leaked the secret information to the media?</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (A)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The given    sentence is in the passive voice and in the Simple Past Tense.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive Voice    structure: <i>By whom + was/were + Subject + V3 + ...?</i></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">To convert it    into the Active Voice, the structure becomes: <i>Who + V2 (past    tense verb) + Object + ...?</i></p>    <p style=\"orphans:0;widows:0\">Following this rule, 'By whom was    ... leaked' changes to 'Who leaked ...'. Hence, option A is the    correct active form.</p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate and grammatically correct option in    direct speech.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The doctor said him, \"You need to take complete bed rest for    a week.\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    The doctor told to him, \"You need to take complete bed rest    for a week.\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    The doctor said to him, \"You need to take complete bed rest    for a week.\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    The doctor said to he, \"You need to take complete bed rest    for a week.\"</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (C)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The correct    direct speech sentence is: <b>The doctor said to him, \"You    need to take complete bed rest for a week.\"</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Key    grammatical rules applied here:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In direct    speech, the reporting verb 'said' requires the preposition 'to'    before an indirect object (e.g., 'said to him', not 'said him').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The verb    'told' takes a direct object without 'to' (e.g., 'told him', not    'told to him').</p>    <p style=\"orphans:0;widows:0\">A preposition ('to') must be    followed by an objective pronoun ('him', not subjective 'he').</p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the sentence that gives the most appropriate meaning of the    given idiom.</p>    <p style=\"orphans:0;widows:0\"><b>Leave no stone unturned</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    The workers cleared all the heavy rocks from the highway after the    landslide.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The detective investigated every possible clue and questioned all    witnesses to solve the robbery.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The gardener arranged white pebbles along the pathway in the    courtyard.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The geologist collected various rock samples from the riverbed.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (B)<b> The detective investigated every    possible clue and questioned all witnesses to solve the robbery.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The idiom    <b>'leave no stone unturned'</b> means to do everything possible,    make every effort, or examine all available options in order to    achieve a goal or find something.</p>    <p style=\"orphans:0;widows:0\">Sentence B best reflects this    meaning, as the detective made every possible effort (checking    every clue and interviewing all witnesses) to solve the case.</p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that arranges the given words to form a    grammatically correct and meaningful sentence.</p>    <p style=\"orphans:0;widows:0\">The audience enthusiastically the    applauded remarkable performance.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The remarkable performance enthusiastically applauded the    audience.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The audience enthusiastically applauded the remarkable    performance.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The audience enthusiastically performance applauded the    remarkable.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Enthusiastically applauded the remarkable performance the    audience.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The correct    grammatical structure for a standard declarative sentence is:    <b>Subject + Adverb of manner + Main Verb + Object (Determiner +    Adjective + Noun)</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Here:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Subject:</b>    The audience</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Adverb:</b>    enthusiastically</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Verb:</b>    applauded</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Object:</b>    the remarkable performance</p>    <p style=\"orphans:0;widows:0\">Hence, the correct and meaningful    arrangement is: <i>\"The audience enthusiastically applauded    the remarkable performance.\"</i></p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate option to fill in the blank.</b></p>    <p style=\"orphans:0;widows:0\">Dense clouds of dark smoke    _________ from the burning factory into the afternoon sky.</p>", "option1": "<p style=\"orphans:0;widows:0\">    seeped</p>", "option2": " <p style=\"orphans:0;widows:0\">    billowed</p>", "option3": " <p style=\"orphans:0;widows:0\">    trickled</p>", "option4": " <p style=\"orphans:0;widows:0\">    sprouted</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B)</b> <b>billowed</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'Billow'    means (of smoke, cloud, or steam) to swell outward or rise and    roll in large masses or waves. Hence, it is the most appropriate    verb to describe dense clouds of smoke rising into the sky.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Seeped:</b>     flowed or leaked slowly through small holes or porous material.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Trickled:</b>     flowed in a small stream or drop by drop (used for liquids).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Sprouted:</b> began to     grow or shoot forth (used for plants or seeds).</p>    </li></ul>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option in the superlative degree that    can substitute the underlined segment in the given sentence.</p>    <p style=\"orphans:0;widows:0\">This is by far the <u>fascinate</u>    documentary I have watched this year.</p>", "option1": "<p style=\"orphans:0;widows:0\">    most fascinating</p>", "option2": " <p style=\"orphans:0;widows:0\">    more fascinating</p>", "option3": " <p style=\"orphans:0;widows:0\">    much fascinating</p>", "option4": " <p style=\"orphans:0;widows:0\">    fascinated</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (A)</b></p>    <p style=\"orphans:0;widows:0\">The sentence compares one    documentary against all the documentaries watched this year,    indicated by the definite article 'the' and the phrase 'by far'.    Hence, the superlative degree of the adjective must be used. For a    multi-syllable adjective like 'fascinating', the superlative form    is constructed using 'most' ('most fascinating').</p>", "question_heading": ""}, {"sr_no": 100, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The following sentence has been divided into parts. One of them    may contain an error. Select the part that contains the error from    the given options. If you don’t find any error, mark ‘No    error’ as your answer.</p>    <p style=\"orphans:0;widows:0\">Karan was surprised to learn that    he was first student to complete the assignment.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Karan was surprised</p>", "option2": " <p style=\"orphans:0;widows:0\">    to complete the assignment</p>", "option3": " <p style=\"orphans:0;widows:0\">    that he was first student</p>", "option4": " <p style=\"orphans:0;widows:0\">    No error</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (C)</b> <b>'that he was first student'</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The definite    article <b>'the'</b> must be used before ordinal numbers (such as    <i>first, second, third, etc.</i>) when they qualify a noun.    Therefore, 'first student' should be replaced with <b>'the first    student'</b>.</p>    <p style=\"orphans:0;widows:0\"><b>Correct sentence:</b> Karan    was surprised to learn that he was <i>the first student</i> to    complete the assignment.</p>", "question_heading": ""}, {"sr_no": 101, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the underlined group of words in the following sentence.</p>    <p style=\"orphans:0;widows:0\">The young debater captivated the    judges with her <u>fluent, persuasive, and powerful expression in    speech</u>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Ambiguity</p>", "option2": " <p style=\"orphans:0;widows:0\">    Eloquence</p>", "option3": " <p style=\"orphans:0;widows:0\">    Hesitation</p>", "option4": " <p style=\"orphans:0;widows:0\">    Verbiage</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B)</b> <b>Eloquence</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meaning of    the words:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Eloquence:</b>     Fluent, persuasive, and powerful speaking or writing.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Ambiguity:</b>     The quality of having more than one possible meaning;     unclearness.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Hesitation:</b>     The act of pausing or showing reluctance before saying or doing     something.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Verbiage:</b> The use of     too many words, especially without adding much meaning.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 102, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in indirect    speech.</p>    <p style=\"orphans:0;widows:0\">She said, “I saw this movie    with my cousins yesterday.”</p>", "option1": "<p style=\"orphans:0;widows:0\">    She said that she has seen that movie with her cousins yesterday.</p>", "option2": " <p style=\"orphans:0;widows:0\">    She said that she saw this movie with her cousins the previous    day.</p>", "option3": " <p style=\"orphans:0;widows:0\">    She said that she had seen that movie with her cousins the    previous day.</p>", "option4": " <p style=\"orphans:0;widows:0\">    She said that she had seen this movie with my cousins the day    before.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (C)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">To convert an    assertive sentence from direct to indirect speech:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb 'said' is followed by the conjunction 'that'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Pronouns    change according to the subject: 'I' becomes 'she', and 'my'    becomes 'her'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Simple Past    tense ('saw') changes to Past Perfect tense ('had seen').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Adjective    'this' changes to 'that'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Time    expression 'yesterday' changes to 'the previous day'.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct indirect    form is: <i>She said that she had seen that movie with her cousins    the previous day.</i></p>", "question_heading": ""}, {"sr_no": 103, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in passive    voice.</p>    <p style=\"orphans:0;widows:0\">Preserve these antique coins with    utmost care.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Let these antique coins be preserved with utmost care.</p>", "option2": " <p style=\"orphans:0;widows:0\">    These antique coins are preserving with utmost care.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Let these antique coins preserve with utmost care.</p>", "option4": " <p style=\"orphans:0;widows:0\">    These antique coins have been preserved with utmost care.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (A)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The given    sentence is an imperative sentence expressing an    instruction/command.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The standard    structure for changing an imperative sentence with an object into    passive voice is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Let +    Subject/Object + be + past participle (V3) + remaining words</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Applying this    rule:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'these    antique coins' becomes the object following 'Let'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'be' + V3 of    'preserve' gives 'be preserved'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The adverbial    phrase 'with utmost care' remains at the end.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct passive    form is <b>\"Let these antique coins be preserved with utmost    care.\"</b></p>", "question_heading": ""}, {"sr_no": 104, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The following sentence has been split into four segments. Identify    the segment that contains a grammatical error.</p>    <p style=\"orphans:0;widows:0\">The manager, as well as / his    subordinates, / were praised / for the project's success.</p>", "option1": "<p style=\"orphans:0;widows:0\">    his subordinates,</p>", "option2": " <p style=\"orphans:0;widows:0\">    were praised</p>", "option3": " <p style=\"orphans:0;widows:0\">    The manager, as well as</p>", "option4": " <p style=\"orphans:0;widows:0\">    for the project's success.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B)</b> <b>\"were praised\"</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">When two    subjects are connected by phrases like <i>'as well as', 'along    with', 'together with', 'in addition to'</i>, the verb must agree    with the first subject.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Here, the    first subject is <b>'The manager'</b> (singular noun); therefore,    the singular auxiliary verb <b>'was'</b> should be used instead of    the plural verb <b>'were'</b>.</p>    <p style=\"orphans:0;widows:0\">The correct sentence should read:    <i>\"The manager, as well as his subordinates, was praised for    the project's success.\"</i></p>", "question_heading": ""}, {"sr_no": 105, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that rectifies the underlined part of the given    sentence. In case no correction is needed, select ‘No correction    required’.</p>    <p style=\"orphans:0;widows:0\">Though his intentions were noble,    the young commander was <u>braver than wise</u> in leading his men    into the uncharted valley.</p>", "option1": "<p style=\"orphans:0;widows:0\">    more brave than wise</p>", "option2": " <p style=\"orphans:0;widows:0\">    braver than wiser</p>", "option3": " <p style=\"orphans:0;widows:0\">    more braver than wise</p>", "option4": " <p style=\"orphans:0;widows:0\">    No correction required</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (A)</b> <b>more brave than wise</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rule:</b>    When two different qualities of the same person or thing are    compared, we do not use the comparative suffix <i>-er</i>.    Instead, we use the structure <b>‘more + positive degree    adjective + than + positive degree adjective’</b>, even for    monosyllabic adjectives that normally take <i>-er</i>.</p>    <p style=\"orphans:0;widows:0\">Here, two qualities (bravery and    wisdom) of the same person (the young commander) are being    compared. Hence, “<b>braver than wise</b>” must be corrected    to “<b>more brave than wise</b>”.</p>", "question_heading": ""}, {"sr_no": 106, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence has an error. Choose the option that corrects    the error.</p>    <p style=\"orphans:0;widows:0\">This is a more perfect example of    medieval architecture.</p>", "option1": "<p style=\"orphans:0;widows:0\">    This is a most perfect example of medieval architecture.</p>", "option2": " <p style=\"orphans:0;widows:0\">    This is a perfect example of medieval architecture.</p>", "option3": " <p style=\"orphans:0;widows:0\">    This is a more perfecter example of medieval architecture.</p>", "option4": " <p style=\"orphans:0;widows:0\">    This is a much perfect example of medieval architecture.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B)</b></p>    <p style=\"orphans:0;widows:0\">Certain adjectives such as    <i>perfect, unique, round, complete, square,</i> and <i>universal</i>    represent absolute qualities that cannot be graded or compared.    Therefore, they do not take comparative or superlative modifiers    like 'more' or 'most'. Hence, <b>'more perfect'</b> should be    corrected to <b>'perfect'</b>.</p>", "question_heading": ""}, {"sr_no": 107, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that rectifies the underlined part of the given    sentence. In case no correction is needed, select ‘No correction    required’.</p>    <p style=\"orphans:0;widows:0\">The internship program offers <u>the    most unique</u> experience for budding journalists.</p>", "option1": "<p style=\"orphans:0;widows:0\">    an unique</p>", "option2": " <p style=\"orphans:0;widows:0\">    a unique</p>", "option3": " <p style=\"orphans:0;widows:0\">    the more unique</p>", "option4": " <p style=\"orphans:0;widows:0\">    No correction required</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The adjective    <b>unique</b> is an absolute (non-gradable) adjective meaning 'one    of a kind' or 'unlike anything else'. Therefore, it cannot take    degrees of comparison such as <i>more</i> or <i>most</i>.</p>    <p style=\"orphans:0;widows:0\">Additionally, <b>unique</b>    begins with a consonant sound (/juː/), so the indefinite article    <b>'a'</b> is used before it, not <b>'an'</b>. Thus, ‘a unique’    is the correct substitution.</p>", "question_heading": ""}, {"sr_no": 108, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that will improve the underlined part of the    given sentence.</p>    <p style=\"orphans:0;widows:0\">Rohan is wiser and <u>most    experienced</u> than all the other candidates interviewed today.</p>", "option1": "<p style=\"orphans:0;widows:0\">    very experienced</p>", "option2": " <p style=\"orphans:0;widows:0\">    more experienced</p>", "option3": " <p style=\"orphans:0;widows:0\">    the most experienced</p>", "option4": " <p style=\"orphans:0;widows:0\">    so experienced</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The sentence compares Rohan with other candidates using the    conjunction 'than', requiring adjectives in the comparative    degree. Furthermore, when two adjectives qualifying the same noun    are joined by 'and', both must be in the same degree of    comparison. Since 'wiser' is in the comparative degree, 'most    experienced' must be replaced by the comparative form <b>more    experienced</b>. Hence, the correct answer is <b>option B.</b></p>", "question_heading": ""}, {"sr_no": 109, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate option to fill in the blank.</b></p>    <p style=\"orphans:0;widows:0\">The rescue workers made ________    efforts to locate the survivors trapped under the rubble.</p>", "option1": "<p style=\"orphans:0;widows:0\">    strenuous</p>", "option2": " <p style=\"orphans:0;widows:0\">    trivial</p>", "option3": " <p style=\"orphans:0;widows:0\">    negligent</p>", "option4": " <p style=\"orphans:0;widows:0\">    sluggish</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (A). <b>strenuous</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>'Strenuous'</b>    means requiring or using great exertion or energetic effort (e.g.,    strenuous efforts). In the given context, locating survivors under    rubble requires tireless and intense effort.</p>    <p style=\"orphans:0;widows:0\">The other options are    inappropriate: <b>'trivial'</b> means of little value or    importance, <b>'negligent'</b> means failing to take proper care,    and <b>'sluggish'</b> means slow-moving or lacking energy.</p>", "question_heading": ""}, {"sr_no": 110, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate homophone to fill in the blank.</b></p>    <p style=\"orphans:0;widows:0\">The treacherous trek across the    frozen terrain tested the true ________ of the young mountaineer.</p>", "option1": "<p style=\"orphans:0;widows:0\">    metal</p>", "option2": " <p style=\"orphans:0;widows:0\">    meddle</p>", "option3": " <p style=\"orphans:0;widows:0\">    mettle</p>", "option4": " <p style=\"orphans:0;widows:0\">    medal</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (C). <b>mettle</b>, which means a person's    ability to cope well with difficulties or to face a demanding    situation with resilience and courage.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other confusable words:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Metal</b>:     a hard, solid chemical element (such as iron, copper, or gold).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meddle</b>:     to interfere unwantedly in something that is not one's concern.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Medal</b>: a metal disc     or badge awarded to commemorate an event or honor an achievement.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 111, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate idiom to fill in the blank.</b></p>    <p style=\"orphans:0;widows:0\">Instead of taking responsibility    for the project's failure, the team leader attempted to ________    and blamed his subordinates.</p>", "option1": "<p style=\"orphans:0;widows:0\">    bite the bullet</p>", "option2": " <p style=\"orphans:0;widows:0\">    pass the buck</p>", "option3": " <p style=\"orphans:0;widows:0\">    burn the candle at both ends</p>", "option4": " <p style=\"orphans:0;widows:0\">    let the cat out of the bag</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The idiom <b>'pass the buck'</b> means to shift the responsibility    or blame for something to someone else. The sentence describes a    leader avoiding responsibility and blaming others, which makes    'pass the buck' the correct fit.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Bite     the bullet:</b> To accept something difficult or unpleasant.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Burn     the candle at both ends:</b> To exhaust oneself by doing too     much.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Let the cat out of the     bag:</b> To reveal a secret unintentionally.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 112, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the following passage, some words have been deleted. Read    the passage carefully and select the most appropriate option to    fill in each blank.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The global    transition towards clean and renewable energy has become an urgent    environmental 1. _____________. Nations across the globe are    setting ambitious climate targets to curb carbon emissions, and    investments in green technologies have 2. _____________    considerable pace over the last decade. Policymakers are realizing    the necessity of reforming outdated practices that 3.    ________________ environmental degradation and threaten ecological    balance. To achieve meaningful progress, communities and    industries must 4. __________ in collective climate action,    embrace eco-friendly innovations, and work collaboratively towards    a resilient future.</p>    <p style=\"orphans:0;widows:0\"><b>Select the most appropriate    option to fill in blank no. 1.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    diversion</p>", "option2": " <p style=\"orphans:0;widows:0\">    priority</p>", "option3": " <p style=\"orphans:0;widows:0\">    digression</p>", "option4": " <p style=\"orphans:0;widows:0\">    casualty</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B) priority</b></p>    <p style=\"orphans:0;widows:0\">The context emphasizes that    shifting to clean energy is a matter of critical global    importance. 'Priority' means a thing that is regarded as more    important than others, which fits the phrase 'urgent environmental    priority' appropriately. 'Diversion' (a distraction), 'digression'    (straying from the main subject), and 'casualty' (victim/loss) do    not fit the context.</p>", "question_heading": ""}, {"sr_no": 113, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the following passage, some words have been deleted. Read    the passage carefully and select the most appropriate option to    fill in each blank.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The global    transition towards clean and renewable energy has become an urgent    environmental 1. _____________. Nations across the globe are    setting ambitious climate targets to curb carbon emissions, and    investments in green technologies have 2. _____________    considerable pace over the last decade. Policymakers are realizing    the necessity of reforming outdated practices that 3.    ________________ environmental degradation and threaten ecological    balance. To achieve meaningful progress, communities and    industries must 4. __________ in colle 0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">दिए गए मानदंडों और उम्मीदवार के विवरण को ध्यानपूर्वक पढ़ें और उचित निर्णय लें।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">अनुसंधान सहायक (Research Assistant) के चयन के लिए पात्रता मानदंड (01-11-2024 के अनुसार):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">1. रसायन विज्ञान में न्यूनतम 60% अंकों के साथ स्नातकोत्तर (Master's) डिग्री होनी चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">2. आयु 30 वर्ष से अधिक नहीं होनी चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">3. अनुसंधान प्रयोगशाला में कम से कम 2 वर्ष का अनुभव होना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">4. व्यक्तिगत साक्षात्कार में कम से कम 50% अंक प्राप्त होने चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">अपवाद:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(a) यदि कोई उम्मीदवार (1) को छोड़कर अन्य सभी मानदंडों को पूरा करता है, लेकिन उसने मान्यता प्राप्त पत्रिकाओं में कम से कम दो शोध पत्र प्रकाशित किए हैं, तो उसका मामला अनुसंधान निदेशक (Research Director) को भेजा जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(b) यदि कोई उम्मीदवार (3) को छोड़कर अन्य सभी मानदंडों को पूरा करता है, लेकिन उसके पास एम.फिल. (M.Phil.) की डिग्री है, तो उसका मामला डीन ऑफ एकेडमिक्स (Dean of Academics) को भेजा जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">उम्मीदवार का विवरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">अंकित का जन्म 14 अगस्त 1996 को हुआ था। उसने 65% अंकों के साथ रसायन विज्ञान में स्नातकोत्तर डिग्री पूरी की है। उसके पास अनुसंधान प्रयोगशाला में 1 वर्ष का अनुभव है और उसके पास रसायन विज्ञान में एम.फिल. की डिग्री भी है। उसने व्यक्तिगत साक्षात्कार में 58% अंक प्राप्त किए हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">अंकित के मामले में क्या निर्णय लिया जाना चाहिए?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उम्मीदवार का चयन किया जाना चाहिए</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उम्मीदवार को अस्वीकार किया जाना चाहिए</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मामला डीन ऑफ एकेडमिक्स को भेजा जाना चाहिए</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मामला अनुसंधान निदेशक को भेजा जाना चाहिए</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>01-11-2024 के अनुसार अंकित की पात्रता की जाँच:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. रसायन विज्ञान में स्नातकोत्तर: 65% (≥ 60%) — </span><span style=\"font-weight:bold\">संतुष्ट</span><span>।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. आयु: जन्म 14-08-1996 को हुआ था, अतः 01-11-2024 को आयु लगभग 28 वर्ष 2.5 माह है (≤ 30 वर्ष) — </span><span style=\"font-weight:bold\">संतुष्ट</span><span>।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. प्रयोगशाला अनुभव: केवल 1 वर्ष का अनुभव है (&lt; 2 वर्ष) — </span><span style=\"font-weight:bold\">मानदंड (3) पूरा नहीं करता</span><span>।</span></p><p style=\"marg n><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113938298_image038.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113938298_image039.png\" width=\"57\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (LHS = RHS)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः सही आदान-प्रदान + और -, 3 और 8 है।</span></p>", "question_heading": ""}, {"sr_no": 129, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक निश्चित कूट भाषा में, 'sky is deep blue' को 'ka na ro ta' के रूप में, 'blue sea looks beautiful' को 'ro pa mu de' के रूप में, और 'sea is very deep' को 'ka ta de zo' के रूप में कूटबद्ध किया जाता है। उसी भाषा में 'sky' को किस प्रकार कूटबद्ध किया जाएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ka</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ro</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>na</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ta</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए कथनों की तुलना करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113938298_image040.png\" width=\"490\" height=\"123\" alt ><span> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">अतः, 'sky' को 'na' के रूप में कूटबद्ध किया जाएगा।</span></p>", "question_heading": ""}, {"sr_no": 130, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निर्देश: एक कथन के बाद दो निष्कर्ष I और II दिए गए हैं। आपको कथन को सत्य मानना है भले ही वह सर्वज्ञात तथ्यों से भिन्न प्रतीत होता हो। आपको तय करना है कि दिए गए निष्कर्षों में से कौन-सा निष्कर्ष दिए गए कथन का तार्किक रूप से अनुसरण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कथन:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">वैज्ञानिक अवलोकनों से यह स्थापित होता है कि डिजिटल स्क्रीन से निकलने वाली नीली रोशनी (ब्लू लाइट) मेलाटोनिन के स्राव को दबाती है, जो नींद के चक्र को नियंत्रित करने वाला एक महत्वपूर्ण हार्मोन है, जिससे अनिद्रा की संभावना बढ़ जाती है। फिर भी, एक हालिया सर्वेक्षण से पता चला है कि देर रात तक स्क्रीन का उपयोग करने वाले लगभग 40% लोग नियमित रूप से आरामदायक और निर्बाध नींद की बात कहते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. देर रात तक स्क्रीन का उपयोग करने वाले लगभग 40% लोगों में नीली रोशनी का प्रभाव मेलाटोनिन के उत्पादन को दबाने में विफल रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. स्क्रीन-प्रेरित अनिद्रा के प्रति संवेदनशीलता अलग-अलग होती है, और मेलाटोनिन का दमन अनिवार्य रूप से बाधित नींद का कारण नहीं बनता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष I अनुसरण करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष II अनुसरण करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निष्कर्ष I और II दोनों अनुसरण करते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो निष्कर्ष I और न ही II अनुसरण करता है</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">निष्कर्ष I अनुसरण नहीं करता:</span><span style=\"font-weight:bold\">  </span><span>सर्वेक्षण में लगभग 40% लोगों ने बताया कि उन्हें अच्छी और बिना रुकावट की नींद आती है। इससे उनके मेलाटोनिन के स्तर का पता नहीं चलता।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">निष्कर्ष II अनुसरण करता है:</span><span> मेलाटोनिन का स्राव कम होने से अनिद्रा की संभावना बढ़ती है। फिर भी, देर रात स्क्रीन का उपयोग करने वाले कुछ लोगों को अच्छी नींद आती है। इसलिए इसका असर सभी पर एक जैसा नहीं होता</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">अतः, केवल निष्कर्ष II अनुसरण करता है।</span></p>", "question_heading": ""}, {"sr_no": 131, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निर्देश: चिह्नों #, @, &amp;, $, और % का उपयोग निम्नलिखित अर्थों के साथ किया गया है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'P # Q' का अर्थ है 'P, Q से बड़ा है'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'P @ Q' का अर्थ है 'P, Q से छोटा है'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'P &amp; Q' का अर्थ है 'P, Q के बराबर है'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'P $ Q' का अर्थ है 'P, Q से छोटा नहीं है'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'P % Q' का अर्थ है 'P, Q से बड़ा नहीं है'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">दिए गए कथनों को सत्य मानते हुए ज्ञात कीजिए कि कौन-सा/से निष्कर्ष निश्चित रूप से सत्य है/हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कथन: D $ M, M &amp; K, K % T, T @ W</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. D # T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. D % T</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि केवल निष्कर्ष I सत्य है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि केवल निष्कर्ष II सत्य है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि या तो निष्कर्ष I या निष्कर्ष II सत्य है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि न तो निष्कर्ष I और न ही निष्कर्ष II सत्य है</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई शर्तों के अनुसार चिह्नों को विकोडित करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> </span><span style=\"font-weight:bold\">D ≥ M, M = K, K ≤ T, T &lt; W</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथनों को संयोजित करने पर: D ≥ M = K ≤ T &lt; W</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D और T के बीच संबंध का विश्लेषण करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D ≥ K ≤ T से, D और T के बीच विपरीत दिशा वाले चिह्न हैं। इसलिए, D और T के बीच कोई निश्चित संबंध स्थापित नहीं किया जा सकता है, अर्थात् तीनों संभावनाएँ (D &gt; T, D &lt; T, या D = T) संभव हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अब निष्कर्षों की जाँच करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">निष्कर्ष I:</span><span> D &gt; T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">निष्कर्ष II:</span><span> D ≤ T (अर्थात D &lt; T या D = T)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-style:italic\">दोनों निष्कर्ष मिलकर सभी तीनों संभावित संबंधों (&gt;, &lt;, =) को समाहित करते हैं। </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, या तो निष्कर्ष I या निष्कर्ष II सत्य है।</span></p>", "question_heading": ""}, {"sr_no": 132, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">5:30 और 6:00 के बीच किस समय घड़ी की दोनों सुइयाँ समकोण पर होंगी?</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 बजकर </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113938298_image041.png\" width=\"35\" height=\"29\" alt style=\"vertical-align:middle\" ><span> मिनट</span></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 बजकर </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113938298_image042.png\" width=\"35\" height=\"29\" alt style=\"vertical-align:middle\" ><span> मिनट</span></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 बजकर </span><img src=\"https://static-appxdb-v2.akamai.net.in/websit ont-size:12pt\"><span>3. K या तो Apple में काम करता है या Tesla में। चूँकि Tesla में N काम करता है, इसलिए </span><span style=\"font-weight:bold\">K, Apple में काम करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. अब शेष व्यक्तियों J, M, P और Q के लिए शेष कंपनियाँ Google, Amazon, Netflix और Adobe हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. J, Google, Amazon या Netflix में काम नहीं करता है। अतः, </span><span style=\"font-weight:bold\">J, Adobe में काम करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. P, Google, Amazon, Apple या Tesla में काम नहीं करता है। चूँकि Adobe में J काम करता है, इसलिए </span><span style=\"font-weight:bold\">P को Netflix में काम करना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7. M, Google में काम नहीं करता है। अतः, </span><span style=\"font-weight:bold\">M, Amazon में काम करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8. शेष व्यक्ति </span><span style=\"font-weight:bold\">Q, शेष कंपनी Google में काम करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंतिम व्यवस्था:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113938298_image054.png\" width=\"236\" height=\"429\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">अतः, संयोजन 'M - Amazon' सत्य है।</span></p>", "question_heading": ""}, {"sr_no": 134, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">इस प्रश्न में, एक प्रश्न के बाद दो कथन (I) और (II) दिए गए हैं। आपको यह तय करना है कि कथनों में दी गई जानकारी प्रश्न का उत्तर देने के लिए पर्याप्त है या नहीं। दोनों कथनों को पढ़िए और उपयुक्त उत्तर का चयन कीजिए।</span></p><p style=\"margin-top
