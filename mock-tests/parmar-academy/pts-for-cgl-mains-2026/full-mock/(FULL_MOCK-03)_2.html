<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>6.) FULL MOCK-03 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

amily:'Nirmala UI'\"><span>हुमायूँ</span></span>-<span style=\"font-family:'Nirmala UI'\"><span>नामा</span></span>'    <span style=\"font-family:'Nirmala UI'\"><span>की रचना की    थी। उनके भतीजे सम्राट अकबर    के अनुरोध पर उन्होंने बाबर    और हुमायूँ के संस्मरणों को    लिपिबद्ध किया</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>जो    फ़ारसी भाषा में लिखा गया    एक महत्वपूर्ण ऐतिहासिक    स्रोत है।</span></span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span><b>यदि किसी    आदर्श गैस का परम ताप दोगुना    कर दिया जाए</b></span></span><b>, </b><span style=\"font-family:'Nirmala UI'\"><span><b>तो    उसके अणुओं की औसत गतिज ऊर्जा</b></span></span><b>:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>अपरिवर्तित    रहेगी।</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>आधी हो जाएगी।</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>दोगुनी हो    जाएगी।</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>चार गुना    हो जाएगी।</span></span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>गैसों के    अणुगति सिद्धांत के अनुसार</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>किसी आदर्श    गैस के प्रति अणु की औसत गतिज    ऊर्जा का सूत्र     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794980841900_html_9cb8c4cce845ad2b.gif\" >     होता है</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>जहाँ       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794980841900_html_59bea7d116fc4b70.gif\" >     बोल्ट्जमान नियता la UI'\"><span>की नई    आर्थिक नीति </span></span>(LPG <span style=\"font-family:'Nirmala UI'\"><span>सुधार</span></span>)    <span style=\"font-family:'Nirmala UI'\"><span>की एक प्रमुख    आलोचना कृषि क्षेत्र की    उपेक्षा थी। सुधार काल के    दौरान</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>सिंचाई</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>बिजली</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>परिवहन और    कृषि अनुसंधान जैसे ग्रामीण    बुनियादी ढांचे में सार्वजनिक    निवेश में उल्लेखनीय गिरावट    आई। इसके अलावा</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>उर्वरक    और कृषि इनपुट सब्सिडी में    कटौती से किसानों के लिए    उत्पादन लागत बढ़ गई</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>जिससे कृषि    संकट गहराया और ग्रामीण</span></span>-<span style=\"font-family:'Nirmala UI'\"><span>शहरी    आर्थिक असमानता में वृद्धि    हुई।</span></span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span><b>आधुनिक    आवर्त सारणी के समूह </b></span></span><b>16    </b><span style=\"font-family:'Nirmala UI'\"><span><b>के तत्वों    को सामान्यतः निम्नलिखित    में से किस नाम से जाना जाता    है</b></span></span><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>हैलोजन</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>चाल्कोजन</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>निक्टोजन</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>क्षारीय    मृदा धातुएं</span></span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>आधुनिक    आवर्त सारणी के समूह </span></span>16    <span style=\"font-family:'Nirmala UI'\"><span>के तत्वों    </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>ऑक्सीजन</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>सल्फर</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>सेलेनियम</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>टेल्यूरियम    और पोलोनियम</span></span>) <span style=\"font-family:'Nirmala UI'\"><span>को    सामान्यतः <b>चाल्कोजन    </b></span></span><b>(Chalcogens)</b> <span style=\"font-family:'Nirmala UI'\"><span>के    रूप में जाना जाता है। इस    शब्द का अर्थ </span></span>'<span style=\"font-family:'Nirmala UI'\"><span>अयस्क    निर्माता</span></span>' <span style=\"font-family:'Nirmala UI'\"><span>होता    है</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>क्योंकि    अधिकांश धातुएँ ऑक्साइड या    सल्फाइड अयस्कों के रूप में    पाई जाती हैं। समूह </span></span>15    <span style=\"font-family:'Nirmala UI'\"><span>के तत्वों    को निक्टोजन</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>समूह    </span></span>17 <span style=\"font-family:'Nirmala UI'\"><span>को    हैलोजन और समूह </span></span>2 <span style=\"font-family:'Nirmala UI'\"><span>को    क्षारीय मृदा धातुएं कहा    जाता है।</span></span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span><b>सूची</b></span></span><b>-I    </b><span style=\"font-family:'Nirmala UI'\"><span><b>को सूची</b></span></span><b>-II    </b><span style=\"font-family:'Nirmala UI'\"><span><b>से सुमेलित    कीजिए।</b></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span><b>सूची</b></span></span><b>-I    (</b><span style=\"font-family:'Nirmala UI'\"><span><b>अम्ल</b></span></span><b>)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>A. </b><span style=\"font-family:'Nirmal ">रेफरेंसेज (References)</span><span> टैब के अंतर्गत स्थित होता है। रेफरेंसेज टैब का उपयोग दस्तावेज़ में संदर्भ तत्व जैसे फुटनोट, एंडनोट, उद्धरण, ग्रंथ सूची, कैप्शन और विषय-सूची जोड़ने के लिए किया जाता है।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">ईमेल प्रणाली में, कौन-सा घटक उपयोगकर्ता को ईमेल लिखने (कंपोज़ करने), भेजने और पढ़ने के लिए सीधे इंटरफ़ेस प्रदान करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यूजर एजेंट (UA)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मेल ट्रांसफर एजेंट (MTA)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मेल डिलीवरी एजेंट (MDA)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इंटरनेट प्रोटोकॉल (IP)</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यूजर एजेंट (UA), जिसे आमतौर पर ईमेल क्लाइंट (जैसे, माइक्रोसॉफ्ट आउटलुक, थंडरबर्ड या वेबमेल इंटरफ़ेस) के रूप में जाना जाता है, वह एप्लिकेशन प्रोग्राम है जो उपयोगकर्ता को ईमेल संदेश लिखने, भेजने, पढ़ने और प्रबंधित करने की अनुमति देता है।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">विंडोज ऑपरेटिंग सिस्टम में, फाइल एक्सप्लोरर (File Explorer) खोलने के लिए निम्नलिखित में से किस कीबोर्ड शॉर्टकट का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Windows लोगो कुंजी + E</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Windows लोगो कुंजी + R</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Windows लोगो कुंजी + D</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Windows लोगो कुंजी + L</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>विंडोज ऑपरेटिंग सिस्टम में, </span><span style=\"font-weight:bold\">Windows लोगो कुंजी + E</span><span> दबाने से सीधे फाइल एक्सप्लोरर खुल जाता है। अन्य विकल्पों में: Windows + R से 'रन' (Run) डायलॉग बॉक्स खुलता है, Windows + D से डेस्कटॉप प्रदर्शित/छिपाया जाता है, और Windows + L से कंप्यूटर लॉक होता है।</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित में से कौन-सी मेमोरी एक्सेस विलंबता (latency) को कम करने के लिए सेंट्रल प्रोसेसिंग यूनिट (CPU) और मुख्य मेमोरी (RAM) के बीच एक अत्यंत तीव्र-गति बफर के रूप में कार्य करती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>वर्चुअल मेमोरी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कैश मेमोरी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सेकेंडरी स्टोरेज</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रीड-ओनली मेमोरी (ROM)</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कैश मेमोरी एक छोटे आकार की, अत्यंत तीव्र वोलेटाइल कंप्यूटर मेमोरी है जो CPU और मुख्य मेमोरी (RAM) के बीच एक बफर के रूप में कार्य करती है। यह बार-बार उपयोग किए जाने वाले निर्देशों और डेटा को स्टोर करती है ताकि प्रोसेसर को अपेक्षाकृत धीमी RAM से डेटा प्राप्त करने के लिए प्रतीक्षा न करनी पड़े, जिससे समग्र प्रोसेसिंग गति बढ़ जाती है।</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">माइक्रोसॉफ्ट एक्सेल (Microsoft Excel) इंटरफेस का कौन-सा घटक वर्तमान में सक्रिय सेल (active cell) का सेल संदर्भ या पता प्रदर्शित करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फॉर्मूला बार (Formula Bar)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्टेटस बार (Status Bar)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>नेम बॉक्स (Name Box)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शीट टैब (Sheet Tab)</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माइक्रोसॉफ्ट एक्सेल में, </span><span style=\"font-weight:bold\">नेम बॉक्स (Name Box)</span><span> फॉर्मूला बार के बाईं ओर स्थित होता है और यह वर्तमान में चयनित (सक्रिय) सेल का पता या संदर्भ (जैसे A1, B5 आदि) प्रदर्शित करता है। इसके विपरीत, फॉर्मूला बार सक्रिय सेल में दर्ज डेटा या सूत्र (फार्मूला) को प्रदर्शित करता है।</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कौन सा नेटवर्किंग डिवाइस मुख्य रूप से OSI मॉडल के लेयर 3 (नेटवर्क लेयर) पर काम करता है और IP एड्रेस के आधार पर विभिन्न नेटवर्कों के बीच डेटा पैकेट को रूट करने के लिए जिम्मेदार है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>हब</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रिपीटर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ब्रिज</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>राउटर</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>राउटर OSI मॉडल के लेयर 3 (नेटवर्क लेयर) पर कार्य करता है। यह परस्पर जुड़े कई नेटवर्कों में डेटा पैकेट अग्रेषित (forward) करने के लिए लॉजिकल एड्रेसिंग (IP एड्रेस) का उपयोग करता है। इसके विपरीत, हब और रिपीटर लेयर 1 (फिजिकल लेयर) पर कार्य करते हैं, तथा ब्रिज और स्विच लेयर 2 (डेटा लिंक लेयर) पर कार्य करते हैं।</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित में से कौन-सा कंप्यूटर स्टोरेज डिवाइस डेटा पुनर्प्राप्त (retrieve) करने के लिए प्रत्यक्ष (रैंडम) एक्सेस के बजाय क्रमिक (सीक्वेंशियल) एक्सेस पर निर्भर करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मैग्नेटिक टेप</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>हार्ड डिस्क ड्राइव</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सीडी-रोम (CD-ROM)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सॉलिड-स्टेट ड्राइव</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मैग्नेटिक टेप एक सीक्वेंशियल (क्रमिक) एक्सेस स्टोरेज माध्यम है। किसी विशिष्ट डेटा को पढ़ने के लिए, ड्राइव को उससे पहले के सभी डेटा से होकर गुजरना पड़ता है, जिससे डेटा प्राप्त करने की प्रक्रिया धीमी हो जाती है। इसके विपरीत, हार्ड डिस्क ड्राइव (HDD), सॉलिड-स्टेट ड्राइव (SSD) और ऑप्टिकल डिस्क (जैसे CD-ROM) डायरेक्ट या रैंडम एक्सेस का उपयोग करते हैं, जिससे किसी भी डेटा तक उसके स्थान की परवाह किए बिना तुरंत पहुँचा जा सकता है।</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MS-Excel में, किसी दी गई श्रेणी (रेंज) के भीतर उन सेलों की संख्या की गणना करने के लिए निम्नलिखित में से किस फ़ंक्शन का उपयोग किया जाता है जो खाली नहीं (NOT empty) हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>COUNT</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>COUNTA</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>COUNTBLANK</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>COUNTIF</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MS-Excel में, </span><span style=\"font-weight:bold\">COUNTA</span><span> फ़ंक्शन एक निर्दिष्ट श्रेणी (रेंज) में उन सभी सेलों की संख्या की गणना करता है जो खाली नहीं हैं (इसमें संख्याएं, टेक्स्ट, लॉजिकल मान, त्रुटि मान आदि शामिल हैं)। इसके विपरीत, </span><span style=\"font-weight:bold\">COUNT</span><span> फ़ंक्शन केवल संख्यात्मक मान वाले सेलों की गणना करता है, </span><span style=\"font-weight:bold\">COUNTBLANK</span><span> खाली सेलों की गणना करता है, और </span><span style=\"font-weight:bold\">COUNTIF</span><span> किसी दी गई शर्त के आधार पर सेलों की गणना करता है।</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित में से कौन-सा एक वेब ब्राउज़र नहीं है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मोज़िला फ़ायरफ़ॉक्स</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अपाचे</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माइक्रोसॉफ्ट एज</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>विवाल्डी</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अपाचे (विशेष रूप से अपाचे HTTP सर्वर) एक व्यापक रूप से उपयोग किया जाने वाला ओपन-सोर्स वेब सर्वर सॉफ़्टवेयर है, न कि वेब ब्राउज़र। इसके विपरीत, मोज़िला फ़ायरफ़ॉक्स, माइक्रोसॉफ्ट एज और विवाल्डी वेब ब्राउज़र हैं जिन्हें वर्ल्ड वाइड वेब से सामग्री प्राप्त करने और प्रदर्शित करने के लिए डिज़ाइन किया गया है।</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित में से कौन-सा घटक सेंट्रल प्रोसेसिंग यूनिट (CPU) और मुख्य मेमोरी के बीच गति के अंतर को कम करने के लिए एक अत्यधिक तीव्र बफर के रूप में कार्य करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रीड-ओनली मेमोरी (ROM)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कैश मेमोरी (Cache Memory)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>वर्चुअल मेमोरी (Virtual Memory)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सेकेंडरी मेमोरी (Secondary Memory)</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कैश मेमोरी एक अत्यधिक तीव्र सेमीकंडक्टर मेमोरी है जिसे CPU और मुख्य मेमोरी (RAM) के बीच रखा जाता है। यह उन निर्देशों और डेटा को संग्रहीत करने के लिए एक उच्च-गति बफर के रूप में कार्य करती है जिनका प्रोसेसर द्वारा बार-बार उपयोग करने की संभावना होती है, जिससे तेज़ CPU और अपेक्षाकृत धीमी प्राथमिक मेमोरी के बीच गति का अंतर कम हो जाता है।</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">माइक्रोसॉफ्ट वर्ड में चयनित टेक्स्ट में हाइपरलिंक डालने (इन्सर्ट करने) के लिए निम्नलिखित में से किस कीबोर्ड शॉर्टकट का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + H</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + K</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + L</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + M</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माइक्रोसॉफ्ट वर्ड और अधिकांश टेक्स्ट-संपादन अनुप्रयोगों में, 'इन्सर्ट हाइपरलिंक' (Insert Hyperlink) डायलॉग बॉक्स खोलने के लिए </span><span style=\"font-weight:bold\">Ctrl + K</span><span> शॉर्टकट कुंजी का उपयोग किया जाता है। अन्य विकल्पों में: Ctrl + H 'रिप्लेस' (Replace) विंडो खोलता है, Ctrl + L टेक्स्ट को बाईं ओर संरेखित (left align) करता है, और Ctrl + M पैराग्राफ के इंडेंट को बढ़ाता है।</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित में से कौन-सा नेटवर्क उपकरण या सेवा आंतरिक नेटवर्क और इंटरनेट के बीच एक मध्यस्थ के रूप में कार्य करती है, जो सुरक्षा, गोपनीयता और कैशिंग प्रदान करने के लिए क्लाइंट के अनुरोधों को बाहरी सर्वर पर अग्रेषित करती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रॉक्सी सर्वर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>नेटवर्क स्विच</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रिपीटर हब</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मॉडेम</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">प्रॉक्सी सर्वर (Proxy Server)</span><span> अंतिम उपयोगकर्ताओं (end-users) और इंटरनेट के बीच एक गेटवे या मध्यस्थ के रूप में कार्य करता है। जब कोई उपयोगकर्ता किसी वेब पेज या फ़ाइल के लिए अनुरोध भेजता है, तो यह अनुरोध पहले प्रॉक्सी सर्वर के पास जाता है, जो इसका मूल्यांकन करके गंतव्य सर्वर पर अग्रेषित करता है। यह नेटवर्क सुरक्षा को बढ़ाने, वेब सामग्री को फ़िल्टर करने, गोपनीयता के लिए क्लाइंट के आंतरिक IP पते को छिपाने और प्रतिक्रिया समय को तेज़ करने के लिए अक्सर उपयोग किए जाने वाले डेटा को कैश (cache) करने में मदद करता है।</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">आमतौर पर कैश मेमोरी (Cache memory) बनाने के लिए किस प्रकार की कंप्यूटर मेमोरी का उपयोग किया जाता है क्योंकि इसे समय-समय पर रीफ्रेश करने की आवश्यकता नहीं होती है और यह तीव्र एक्सेस समय प्रदान करती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>डायनेमिक रैंडम एक्सेस मेमोरी (DRAM)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्टैटिक रैंडम एक्सेस मेमोरी (SRAM)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इरेज़ेबल प्रोग्रामेबल रीड-ओनली मेमोरी (EPROM)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इलेक्ट्रिकली इरेज़ेबल प्रोग्रामेबल रीड-ओनली मेमोरी (EEPROM)</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्टैटिक रैंडम एक्सेस मेमोरी (SRAM) का उपयोग कैश मेमोरी बनाने के लिए किया जाता है क्योंकि यह DRAM की तुलना में काफी तेज़ डेटा एक्सेस गति प्रदान करती है और इसमें संग्रहीत डेटा को बनाए रखने के लिए समय-समय पर रीफ्रेश करने की आवश्यकता नहीं होती है। इसके विपरीत, डायनेमिक रैम (DRAM) को डेटा बनाए रखने के लिए लगातार रीफ्रेश करने की आवश्यकता होती है और इसका उपयोग मुख्य मेमोरी (RAM) के रूप में किया जाता है।</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कंप्यूटर आर्किटेक्चर में, MDR का पूर्ण रूप क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मेमोरी डायरेक्शन रजिस्टर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मेमोरी डेटा रजिस्टर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मास्टर डेटा रिकॉर्ड</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मेन डिकोडिंग रजिस्टर</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कंप्यूटर आर्किटेक्चर में, MDR का पूर्ण रूप </span><span style=\"font-weight:bold\">मेमोरी डेटा रजिस्टर (Memory Data Register)</span><span> होता है (इसे मेमोरी बफर रजिस्टर या MBR भी कहा जाता है)। यह CPU का एक रजिस्टर है जो मेमोरी (RAM) से या मेमोरी में स्थानांतरित किए जा रहे डेटा को संग्रहीत करता है।</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित में से कौन-सा मैलवेयर एक स्वतंत्र प्रोग्राम है जो बिना किसी मानवीय हस्तक्षेप या होस्ट फ़ाइल के कंप्यूटर नेटवर्क पर स्वयं को दोहराता (self-replicates) और फैलता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ट्रोजन हॉर्स</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कंप्यूटर वॉर्म</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्पाइवेयर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एडवेयर</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कंप्यूटर वॉर्म (Computer Worm)</span><span> एक स्वतंत्र मैलवेयर प्रोग्राम होता है जो किसी नेटवर्क पर अन्य कंप्यूटरों में फैलने के लिए खुद की प्रतियां बनाता (self-replicate) है। वायरस के विपरीत, इसे किसी मौजूदा प्रोग्राम या होस्ट फ़ाइल से जुड़ने की आवश्यकता नहीं होती है, और यह बिना किसी मानवीय हस्तक्षेप के स्वचालित रूप से फैलता है।</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">माइक्रोसॉफ्ट वर्ड में 'फॉर्मेट पेंटर' (Format Painter) टूल का मुख्य उद्देश्य क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक टेक्स्ट से फॉर्मेटिंग को कॉपी करके दूसरे टेक्स्ट पर लागू करना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दस्तावेज़ में कस्टम आकृतियाँ और चित्र बनाना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>विभिन्न रंगों में व्याकरण और वर्तनी की त्रुटियों को हाइलाइट करना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पूरे दस्तावेज़ का पृष्ठभूमि (बैकग्राउंड) रंग बदलना</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माइक्रोसॉफ्ट वर्ड में 'फॉर्मेट पेंटर' (Format Painter) टूल का उपयोग किसी चयनित टेक्स्ट या ऑब्जेक्ट से सभी फॉर्मेटिंग (जैसे फ़ॉन्ट प्रकार, आकार, रंग और पंक्ति रिक्ति) को तेज़ी से कॉपी करके दस्तावेज़ के किसी अन्य भाग पर लागू करने के लिए किया जाता है।</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">विंडोज 10 फ़ाइल एक्सप्लोरर में, चयनित फ़ाइल या फ़ोल्डर के लिए 'प्रॉपर्टीज' (Properties) डायलॉग बॉक्स खोलने के लिए निम्नलिखित में से किस कीबोर्ड शॉर्टकट का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Shift + P</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Alt + Enter</span></p>",
