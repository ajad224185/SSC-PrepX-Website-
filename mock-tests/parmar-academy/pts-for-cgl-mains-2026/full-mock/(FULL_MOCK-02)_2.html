2pt\"><span>EPROM का पूर्ण रूप 'इरेज़ेबल प्रोग्रामेबल रीड-ओनली मेमोरी' (Erasable Programmable Read-Only Memory) है। यह एक गैर-वाष्पशील (नॉन-वोलेटाइल) मेमोरी चिप है जो बिजली बंद होने पर भी अपना डेटा सुरक्षित रखती है। EPROM में संग्रहीत डेटा को चिप के ऊपर बनी एक पारदर्शी क्वार्ट्ज़ विंडो के माध्यम से तीव्र पराबैंगनी (UV) प्रकाश के संपर्क में लाकर मिटाया जा सकता है, जिसके बाद इसे दोबारा लिखा (पुनः प्रोग्राम) जा सकता है।</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">उपयोगकर्ता खातों के लिए टू-फैक्टर ऑथेंटिकेशन (2FA) लागू करने का प्राथमिक उद्देश्य क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>नेटवर्क पर डेटा ट्रांसमिशन गति को बढ़ाना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पहचान सत्यापित करने के लिए दो स्वतंत्र क्रेडेंशियल्स की आवश्यकता द्वारा सुरक्षा की एक अतिरिक्त परत प्रदान करना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>हार्ड ड्राइव स्थान को अनुकूलित करने के लिए संग्रहीत डेटा को संपीड़ित करना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अस्थायी कैशे को स्वचालित रूप से साफ़ करना और सीपीयू के प्रदर्शन में सुधार करना</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>टू-फैक्टर ऑथेंटिकेशन (2FA) एक्सेस सुरक्षा को मजबूत करता है क्योंकि यह एक्सेस प्रदान करने से पहले पहचान के दो अलग-अलग रूपों की मांग करता है—आमतौर पर कुछ ऐसा जो आप जानते हैं (जैसे पासवर्ड) और कुछ ऐसा जो आपके पास है (जैसे मोबाइल फोन पर भेजा गया ओटीपी) या कुछ ऐसा जो आप हैं (जैसे फिंगरप्रिंट)। यह प्राथमिक पासवर्ड से समझौता होने पर भी अनधिकृत पहुंच के जोखिम को काफी कम कर देता है।</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">किसी ईमेल क्लाइंट (जैसे MS Outlook) में ईमेल संदेश प्रबंधन के संदर्भ में, 'आउटबॉक्स' (Outbox) फ़ोल्डर के संबंध में निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">I. ऑफ़लाइन काम करते समय 'Send' बटन पर क्लिक करने से ईमेल 'Sent Items' फ़ोल्डर के बजाय 'Outbox' में चला जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">II. 'Drafts' फ़ोल्डर के विपरीत, 'Outbox' में मौजूद संदेशों को उपयोगकर्ता द्वारा पुनः खोला, संपादित या हटाया नहीं जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">III. यदि कोई आउटगोइंग ईमेल इसलिए प्रेषित नहीं हो पाता क्योंकि उसका अटैचमेंट SMTP सर्वर की आकार सीमा से अधिक है, तो वह 'Outbox' में ही संगृहीत रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">उपर्युक्त कथनों में से कौन-से सही हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल I और II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल I और III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल II और III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I, II और III</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और III सही हैं, जबकि कथन II गलत है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कथन I सही है:</span><span> जब कोई उपयोगकर्ता ऑफ़लाइन या मेल सर्वर से डिस्कनेक्ट होने के दौरान 'Send' पर क्लिक करता है, तो संदेश आउटबॉक्स में कतारबद्ध (queued) हो जाता है जब तक कि नेटवर्क कनेक्शन फिर से स्थापित न हो जाए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कथन II गलत है:</span><span> आउटबॉक्स में मौजूद संदेशों को सफलतापूर्वक भेजे जाने से पहले उपयोगकर्ता द्वारा खोला, संपादित (edit) या हटाया (delete) जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कथन III सही है:</span><span> यदि कोई ईमेल आउटगोइंग मेल सर्वर (SMTP) द्वारा अनुमत अधिकतम आकार सीमा से अधिक होता है, तो उसका ट्रांसमिशन विफल हो जाता है और वह संदेश आउटबॉक्स में ही अटका रहता है।</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित में से कौन सा उदाहरण किसी कार्य को निष्पादित करने के लिए सिस्टम सॉफ्टवेयर पर निर्भर एप्लीकेशन सॉफ्टवेयर को सबसे बेहतर ढंग से प्रदर्शित करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक प्रेजेंटेशन सॉफ्टवेयर द्वारा सॉलिड-स्टेट ड्राइव पर फ़ाइल सहेजने के लिए ऑपरेटिंग सिस्टम के फ़ाइल प्रबंधन सिस्टम का उपयोग करना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सीपीयू (CPU) शेड्यूलिंग को प्रबंधित करने के लिए ऑपरेटिंग सिस्टम को वेब ब्राउज़र की आवश्यकता होना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मदरबोर्ड के साथ संचार करने के लिए फोटो-संपादन सॉफ्टवेयर पर निर्भर एक डिवाइस ड्राइवर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बिना किसी अंतर्निहित ऑपरेटिंग सिस्टम के सीधे हार्डवेयर पर कार्य निष्पादित करने वाला एक डेटाबेस एप्लीकेशन</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एप्लीकेशन सॉफ्टवेयर (जैसे प्रेजेंटेशन सॉफ्टवेयर, वर्ड प्रोसेसर और स्प्रेडशीट) उपयोगकर्ताओं को विशिष्ट कार्य करने में मदद करने के लिए डिज़ाइन किया गया है। हालाँकि, एप्लीकेशन सॉफ्टवेयर कंप्यूटर के भौतिक हार्डवेयर के साथ सीधे इंटरैक्ट नहीं कर सकता है। इसके बजाय, फ़ाइल प्रबंधन, मेमोरी आवंटन और हार्डवेयर इनपुट/आउटपुट संचालन जैसे मुख्य कार्यों को करने के लिए इसे सिस्टम सॉफ्टवेयर—मुख्य रूप से ऑपरेटिंग सिस्टम और डिवाइस ड्राइवरों—पर निर्भर रहना पड़ता है।</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">माइक्रोसॉफ्ट वर्ड (MS Word) में, किसी पैराग्राफ से हैंगिंग इंडेंट (hanging indent) को घटाने या हटाने के लिए निम्नलिखित में से किस कीबोर्ड शॉर्टकट का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Shift + M</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Shift + T</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Shift + H</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Alt + T</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माइक्रोसॉफ्ट वर्ड में, हैंगिंग इंडेंट को घटाने या हटाने के लिए </span><span style=\"font-weight:bold\">Ctrl + Shift + T</span><span> का उपयोग किया जाता है। इसके विपरीत, </span><span style=\"font-weight:bold\">Ctrl + T</span><span> का उपयोग हैंगिंग इंडेंट को लागू करने या बढ़ाने के लिए किया जाता है। इसके अतिरिक्त, </span><span style=\"font-weight:bold\">Ctrl + M</span><span> पैराग्राफ के समग्र बाएं इंडेंट को बढ़ाता है तथा </span><span style=\"font-weight:bold\">Ctrl + Shift + M</span><span> बाएं इंडेंट को घटाता है।</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MS PowerPoint में वर्तमान स्लाइड से स्लाइड शो शुरू करने के लिए निम्नलिखित में से किस कीबोर्ड शॉर्टकट का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Shift + F5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + F5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Alt + F5</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MS PowerPoint में, वर्तमान में सक्रिय स्लाइड से स्लाइड शो शुरू करने के लिए </span><span style=\"font-weight:bold\">Shift + F5</span><span> शॉर्टकट का उपयोग किया जाता है। जबकि केवल </span><span style=\"font-weight:bold\">F5</span><span> दबाने पर स्लाइड शो पहली स्लाइड से शुरू होता है।</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सामान्य पठनीय टेक्स्ट (प्लेन टेक्स्ट) को अनधिकृत पहुंच से सुरक्षित रखने के लिए एक अपठनीय कोडित रूप में बदलने की प्रक्रिया को ________ कहा जाता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एन्क्रिप्शन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>डिक्रिप्शन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कंप्रेशन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>डिफ्रेग्मेंटेशन</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एन्क्रिप्शन (Encryption) डेटा की गोपनीयता और सुरक्षा सुनिश्चित करने के लिए सामान्य जानकारी (प्लेन टेक्स्ट) को एक अपठनीय प्रारूप (सिफरटेक्स्ट) में बदलने की प्रक्रिया है। डिक्रिप्शन सिफरटेक्स्ट को वापस प्लेन टेक्स्ट में बदलने की विपरीत प्रक्रिया है।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MS PowerPoint में किसी मौजूदा स्लाइड का लेआउट (layout) बदलने के लिए निम्नलिखित में से किस नेविगेशन पथ का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Insert -&gt; Slides -&gt; Layout</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Home -&gt; Slides -&gt; Layout</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Design -&gt; Page Setup -&gt; Layout</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>View -&gt; Presentation Views -&gt; Layout</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MS PowerPoint में किसी पहले से चयनित स्लाइड का लेआउट बदलने के लिए, </span><span style=\"font-weight:bold\">Home</span><span> टैब पर जाएं, </span><span style=\"font-weight:bold\">Slides</span><span> समूह में जाएं, और वांछित लेआउट प्रारूप चुनने के लिए </span><span style=\"font-weight:bold\">Layout</span><span> विकल्प पर क्लिक करें।</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MS Word में कौन सा पैराग्राफ़ एलाइनमेंट विकल्प टेक्स्ट को बाएँ और दाएँ दोनों मार्जिन के बीच समान रूप से वितरित करता है, जिससे दोनों तरफ सीधे और स्पष्ट किनारे बनते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अलाइन लेफ्ट (Align Left)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>जस्टीफ़ाई (Justify)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सेंटर (Center)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अलाइन राइट (Align Right)</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MS Word में, </span><span style=\"font-weight:bold\">जस्टीफ़ाई (Justify)</span><span> विकल्प (शॉर्टकट: Ctrl + J) टेक्स्ट को बाएँ और दाएँ दोनों मार्जिन के बीच समान रूप से वितरित करता है। यह शब्दों के बीच के स्थान (spacing) को इस तरह समायोजित करता है कि प्रत्येक पंक्ति बाएँ मार्जिन से शुरू होकर ठीक दाएँ मार्जिन पर समाप्त होती है। जबकि अलाइन लेफ्ट (Ctrl + L), सेंटर (Ctrl + E) और अलाइन राइट (Ctrl + R) टेक्स्ट को केवल एक तरफ या केंद्र के सापेक्ष संरेखित करते हैं।</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">वायर्ड लोकल एरिया नेटवर्क (LAN) में कंप्यूटरों को जोड़ने के लिए आमतौर पर किस प्रकार के ट्रांसमिशन माध्यम का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कोएक्सियल केबल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ट्विस्टेड पेयर केबल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फाइबर ऑप्टिक केबल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पावर केबल</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ट्विस्टेड पेयर केबल (जैसे Cat5e और Cat6 ईथरनेट केबल) लोकल एरिया नेटवर्क (LAN) में सबसे अधिक उपयोग किया जाने वाला ट्रांसमिशन माध्यम है क्योंकि यह कम खर्चीला, लचीला और कम दूरी के लिए स्थापित करने में आसान होता है।</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">माइक्रोसॉफ्ट एक्सेल (MS Excel) में, जब कोई उपयोगकर्ता वर्कशीट में एक नया कॉलम (column) सम्मिलित (insert) करता है, तो नया कॉलम वर्तमान में चयनित कॉलम के सापेक्ष कहाँ स्थापित होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चयनित कॉलम के ठीक दाईं ओर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चयनित कॉलम के ठीक बाईं ओर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सभी भरे हुए कॉलमों के एकदम अंत में</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चयन पर ध्यान दिए बिना, हमेशा कॉलम A के रूप में</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माइक्रोसॉफ्ट एक्सेल (MS Excel) में, जब आप वर्कशीट में एक नया कॉलम डालते हैं, तो नया रिक्त कॉलम हमेशा वर्तमान में चयनित कॉलम के ठीक बाईं (left) ओर जुड़ता है, और उस स्थान से मौजूदा कॉलम दाईं ओर खिसक जाते हैं। इसी तरह, जब एक नई पंक्ति (row) डाली जाती है, तो वह चयनित पंक्ति के ठीक ऊपर (above) जुड़ती है और मौजूदा पंक्तियाँ नीचे की ओर खिसक जाती हैं।</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">आधुनिक डेस्कटॉप ऑपरेटिंग सिस्टम द्वारा उन प्रक्रियाओं को निष्पादित करने के लिए निम्नलिखित में से किस तकनीक का उपयोग किया जाता है जिनकी कुल मेमोरी आवश्यकताएं उपलब्ध भौतिक रैम (RAM) से अधिक होती हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्टैटिक एलोकेशन (Static allocation)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>वर्चुअल मेमोरी (Virtual memory)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कैश कोहेरेंसी (Cache coherency)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>डायरेक्ट मेमोरी एक्सेस (DMA)</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>वर्चुअल मेमोरी सामान्य-उद्देश्यीय ऑपरेटिंग सिस्टम द्वारा उपयोग की जाने वाली एक उन्नत मेमोरी प्रबंधन तकनीक है। यह पेजिंग या सेगमेंटेशन का उपयोग करके सक्रिय भौतिक रैम (RAM) को सेकेंडरी स्टोरेज (जैसे हार्ड ड्राइव या एसएसडी) के साथ जोड़ती है। यह ऑपरेटिंग सिस्टम को एक साथ कई बड़े एप्लिकेशन चलाने की अनुमति देता है, भले ही उनकी मेमोरी आवश्यकता कुल स्थापित भौतिक रैम से अधिक हो।</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MS Excel में किसी निर्दिष्ट श्रेणी (range) में गैर-रिक्त (non-empty) सेलों की संख्या गिनने के लिए निम्नलिखित में से किस फ़ंक्शन का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>COUNT</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>COUNTA</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>COUNTIF</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>COUNTBLANK</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MS Excel में </span><span style=\"font-weight:bold\">COUNTA</span><span> फ़ंक्शन किसी श्रेणी (range) में उन सेलों की संख्या की गणना करता है जो रिक्त नहीं हैं। यह किसी भी प्रकार की जानकारी रखने वाले सेलों को गिनता है, जिसमें संख्याएं, टेक्स्ट, लॉजिकल मान और त्रुटि मान शामिल हैं। इसके विपरीत, </span><span style=\"font-weight:bold\">COUNT</span><span> फ़ंक्शन केवल उन सेलों को गिनता है जिनमें संख्यात्मक मान होते हैं।</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित में से कौन-सा नेटवर्किंग उपकरण कई अलग-अलग नेटवर्कों को जोड़ता है और IP पते के आधार पर डेटा पैकेटों को उनके गंतव्य की ओर अग्रेषित करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्विच</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रिपीटर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>राउटर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>हब</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">राउटर (Router)</span><span> एक नेटवर्किंग डिवाइस है जो OSI मॉडल की लेयर 3 (नेटवर्क लेयर) पर काम करता है। यह दो या दो से अधिक अलग-अलग नेटवर्कों (जैसे LAN को WAN/इंटरनेट से) को जोड़ता है और गंतव्य लॉजिकल (IP) एड्रेस को पढ़कर तथा राउटिंग टेबल का उपयोग करके सबसे कुशल मार्ग चुनकर डेटा पैकेट को अग्रेषित करता है। इसके विपरीत, स्विच मुख्य रूप से MAC एड्रेस का उपयोग करके लेयर 2 पर काम करता है, जबकि हब और रिपीटर लेयर 1 (फिजिकल लेयर) पर काम करते हैं।</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सेंट्रल प्रोसेसिंग यूनिट (CPU) के घटकों के संबंध में निम्नलिखित में से कौन सा/से कथन सही है/हैं?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. रजिस्टर (Registers) सीधे CPU के अंदर स्थित उच्च-गति वाली अस्थायी स्टोरेज इकाइयाँ हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. कंट्रोल यूनिट (CU) अंकगणितीय संचालन और तार्किक तुलनाओं को निष्पादित करती है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल 1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 और 2 दोनों</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो 1 और न ही 2</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन 1 सही है: रजिस्टर (Registers) CPU के अंदर स्थित अत्यंत तीव्र गति वाली छोटी स्टोरेज इकाइयाँ होती हैं, जो प्रोसेसिंग के दौरान डेटा, मेमोरी एड्रेस और वर्तमान निर्देशों को अस्थायी रूप से रखती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन 2 गलत है: अंकगणितीय गणनाओं (जैसे जोड़, घटाव) और तार्किक निर्णयों (जैसे मानों की तुलना) को निष्पादित करने का कार्य अरिथमेटिक लॉजिक यूनिट (ALU) करता है, न कि कंट्रोल यूनिट (CU)। कंट्रोल यूनिट केवल कंप्यूटर प्रणाली के विभिन्न घटकों के बीच डेटा और निर्देशों के प्रवाह को नियंत्रित और समन्वित करती है।</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">मानक 7-बिट ASCII कोड का उपयोग करके कितने अद्वितीय वर्णों को दर्शाया जा सकता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>64</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>128</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>256</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>512</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मानक ASCII (अमेरिकन स्टैंडर्ड कोड फॉर इंफॉर्मेशन इंटरचेंज) एक 7-बिट वर्ण एन्कोडिंग प्रणाली है। चूँकि प्रत्येक बिट की 2 संभावित स्थितियाँ (0 या 1) होती हैं, इसलिए दर्शाए जा सकने वाले अद्वितीय वर्णों की कुल संख्या </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794475847467_image001.png\" width=\"65\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (कोड 0 से 127 तक) होती है। इनमें नियंत्रण वर्ण, अंक, बड़े और छोटे अक्षर तथा सामान्य प्रतीक शामिल हैं।</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">पर्सनल कंप्यूटर पर मैलवेयर या स्पाइवेयर संक्रमण का एक प्रमुख संकेत निम्नलिखित में से कौन-सा माना जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>डिफ़ॉल्ट ब्राउज़र होमपेज स्वचालित रूप से बदल जाता है और बार-बार अवांछित पॉप-अप विज्ञापन दिखाई देते हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सिस्टम फ़ाइलों का नियमित रूप से स्वचालित डिस्क डीफ़्रैग्मेन्टेशन होता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ऑपरेटिंग सिस्टम का बूट समय काफी कम हो जाता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कंप्यूटर की हार्ड ड्राइव पर खाली स्टोरेज स्पेस में अचानक वृद्धि दिखाई देती है</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मैलवेयर या स्पाइवेयर संक्रमण के सामान्य लक्षणों में सिस्टम सेटिंग्स में अनधिकृत परिवर्तन (जैसे कि डिफ़ॉल्ट ब्राउज़र होमपेज या सर्च इंजन का बदल जाना), लगातार अवांछित पॉप-अप विज्ञापन दिखाई देना, नेटवर्क ट्रैफ़िक में असामान्य वृद्धि और बैकग्राउंड में अज्ञात सॉफ़्टवेयर का चलना शामिल हैं।</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MIME (मल्टीपर्पज इंटरनेट मेल एक्सटेंशन) में, निम्नलिखित में से कौन-सा हेडर फ़ील्ड यह निर्दिष्ट करने के लिए उपयोग किया जाता है कि किसी ईमेल घटक को सीधे संदेश के मुख्य भाग में प्रदर्शित किया जाना चाहिए या एक अलग डाउनलोड करने योग्य अनुलग्नक (attachment) के रूप में माना जाना चाहिए?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Content-Type</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Content-Disposition</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Content-Transfer-Encoding</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Content-ID</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MIME संदेश में </span><span style=\"font-weight:bold\">Content-Disposition</span><span> हेडर फ़ील्ड का उपयोग संदेश के किसी भाग की प्रस्तुति शैली को निर्दिष्ट करने के लिए किया जाता है। इसके मुख्य मान inline (सामग्री को सीधे संदेश के मुख्य भाग में प्रदर्शित करना) या attachment (इसे एक अलग संलग्न फ़ाइल के रूप में दिखाना जिसे उपयोगकर्ता द्वारा सहेजा या खोला जा सके) होते हैं।</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">माइक्रोसॉफ्ट विंडोज़ ऑपरेटिंग सिस्टम में कौन-सा फ़ीचर उपयोगकर्ता से अनुमति या एडमिनिस्ट्रेटर पासवर्ड मांगकर अनधिकृत परिवर्तनों को रोकने में मदद करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>डिस्क डीफ़्रेग्मेंटर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>टास्क मैनेजर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यूज़र अकाउंट कंट्रोल (UAC)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फ़ाइल एक्सप्लोरर</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यूज़र अकाउंट कंट्रोल (UAC) विंडोज़ का एक महत्वपूर्ण सुरक्षा फ़ीचर है जो ऑपरेटिंग सिस्टम में अनधिकृत परिवर्तनों को रोकने में मदद करता है। जब भी कोई एप्लिकेशन या प्रक्रिया ऐसे बदलाव करने का प्रयास करती है जिसके लिए एडमिनिस्ट्रेटर अनुमतियों की आवश्यकता होती है, तो UAC उपयोगकर्ता से पुष्टि या पासवर्ड मांगता है।</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in indirect    speech.</p>    <p style=\"orphans:0;widows:0\">Deepak said, \"I shall    purchase a new laptop for my office.\"</p>", "option1": "<p style=\"orphans:0;widows:0\">    Deepak said that he will purchase a new laptop for his office.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Deepak said that he would purchase a new laptop for his office.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Deepak said that he should purchase a new laptop for his office.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Deepak said that he can purchase a new laptop for his office.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">To convert an    assertive sentence from direct to indirect speech, follow these    rules:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb 'said' remains unchanged and is followed by the conjunction    'that'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    first-person pronoun 'I' changes to 'he' according to the subject    'Deepak', and 'my' changes to 'his'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">When the    reporting verb is in the past tense ('said'), the future auxiliary    'shall' (indicating simple future with 'I') changes to 'would'    because the pronoun changes to the third person ('he'). Note that    'should' indicates obligation or duty, which is not the intended    meaning here.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct indirect    sentence is: <b>Deepak said that he would purchase a new laptop    for his office.</b></p>", "question_heading": ""}, {"sr_no": 22, "question": "Sधnपधncधौ यी ो ूोनोgनोूु ोनध giॅधn ृिधयथ. Wुiिध पुध ीiनौप ोnक पुध िोौप ौधnपधncधौ (1 ोnक 6) ोनध in पुध cयननधcप यनकधन, पुध ौधnपधncधौ in ृधपथधधn ोनध ुहंृिधक हू. Aननोngध पुध ौधnपधncधौ in पुध cयननधcप यनकधन पय ीयनं ो ंधोningीिह ोnक cयुधनधnप ूोनोgनोूु. 1. Rोूiक हनृोnप्रोपiयn ुोौ ूयौधक ौधॅधनध cुोििधngधौ पय हनृोn ंयृiिiपद ोcनयौौ Inकiो. A. Cयnौधतहधnिपद, cयंंहपधनौ ौूधnक ुयहनौ पनोूूधक in पनोीीic ौnोिनस कहनing ूधोा ुयहनौ. B. Bधngोिहनह iौ ो ूनयंinधnप धसोंूिध यी पुiौ gनयथing हनृोn gनiिकयcा. C. Tय ोििधॅiोपध पुiौ कiौपनधौौ, ियcोि ोहपुयनiपiधौ ुोॅध धसूोnकधक पुध ंधपनय नोiि nधपथयना ोnक inपनयकहcधक ीधधकधन ृहौ ौधनॅicधौ. D. Sादनयcाधपing ॅधुicिहोन ूयूिहोपiयn ोnक inोकधतहोपध नयोक inीनोौपनहcपहनध ुोॅध cनiूूिधक पुध ciपदैौ कोiिद cयंंहपध. 6. Tुधौध ूहृिic पनोnौूयनप iniपiोपiॅधौ ोनध कधौignधक पय धncयहनोgध ciपप्रधnौ पय िधोॅध पुधiन ूधनौयnोि ॅधुicिधौ ोप ुयंध.", "option1": "<p style=\"orphans:0;widows:0\">    BDAC</p>", "option2": " <p style=\"orphans:0;widows:0\">    BADC</p>", "option3": " <p style=\"orphans:0;widows:0\">    DBAC</p>", "option4": " <p style=\"orphans:0;widows:0\">    ADBC</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sequence is <b>BDAC</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence 1    introduces the broader issue of challenges to urban mobility in    India.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>B</b>    narrows this down to a specific instance, introducing Bengaluru as    a prominent example of this urban gridlock.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>D</b>    explains the root cause of the problem in Bengaluru (skyrocketing    vehicular population and inadequate infrastructure).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>A</b>    begins with the transition word 'Consequently' to show the direct    outcome of the causes mentioned in D (commuters spending hours    trapped in traffic).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>C</b>    proposes the solution undertaken to resolve this issue ('expanded    the metro rail network and introduced feeder bus services').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence 6    links directly to C by referring to 'These public transport    initiatives'.</p>    <p style=\"orphans:0;widows:0\">Therefore, the coherent order is    1-B-D-A-C-6.</p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option that can substitute the    underlined words in the given sentence.</p>    <p style=\"orphans:0;widows:0\">Critics argued that pervasive    corruption had turned the administration into a <u>government run    by the worst and least qualified citizens</u>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Ochlocracy</p>", "option2": " <p style=\"orphans:0;widows:0\">    Stratocracy</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kakistocracy</p>", "option4": " <p style=\"orphans:0;widows:0\">    Timocracy</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (C)</b> <b>Kakistocracy</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Kakistocracy:</b>     A system of government run by the worst, least qualified, or most     unscrupulous citizens.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Ochlocracy:</b>     Government by a mob or crowd; mob rule.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Stratocracy:</b>     A form of government headed by military chiefs.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Timocracy:</b> A form of     government in which only property owners can participate, or     where rulers are motivated by honour.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Fill in the blank with the correctly spelt word.</p>    <p style=\"orphans:0;widows:0\">The diplomat spoke in    a_______manner, avoiding any inflammatory remarks.     </p>", "option1": "<p style=\"orphans:0;widows:0\">    circumspect</p>", "option2": " <p style=\"orphans:0;widows:0\">    circumpect</p>", "option3": " <p style=\"orphans:0;widows:0\">    circumspeckt</p>", "option4": " <p style=\"orphans:0;widows:0\">    circumspace</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct answer is <b>A. circumspect</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in\"><b>Circumspect    means </b>wary and unwilling to take risks; cautious and prudent    in speech or action.</p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate idiom to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Rather than addressing the    fundamental flaws in the tax policy, the committee merely chose to    ________ by offering temporary rebates.</p>", "option1": "<p style=\"orphans:0;widows:0\">    take the bull by the horns</p>", "option2": " <p style=\"orphans:0;widows:0\">    paper over the cracks</p>", "option3": " <p style=\"orphans:0;widows:0\">    throw down the gauntlet</p>", "option4": " <p style=\"orphans:0;widows:0\">    put the cart before the horse</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The idiom    <b>'paper over the cracks'</b> means to conceal, disguise, or    patch up difficulties, flaws, or disagreements superficially    rather than resolving them effectively.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The sentence    contrasts solving 'fundamental flaws' with merely offering    superficial, temporary rebates, making <b>'paper over the cracks'</b>    the most contextually appropriate choice.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>take     the bull by the horns:</b> to face a challenge or danger boldly     and directly.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>throw     down the gauntlet:</b> to issue a challenge.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>put the cart before the     horse:</b> to do things in the wrong or reverse order.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Of the two strategic alternatives    presented to the board, the committee deemed the second one to be    the ___________ viable for long-term growth.</p>", "option1": "<p style=\"orphans:0;widows:0\">    most</p>", "option2": " <p style=\"orphans:0;widows:0\">    more</p>", "option3": " <p style=\"orphans:0;widows:0\">    much</p>", "option4": " <p style=\"orphans:0;widows:0\">    best</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b></p>    <p style=\"orphans:0;widows:0\">When comparing exactly two    persons or things (as indicated by the phrase 'Of the two    strategic alternatives...'), the comparative degree is used,    preceded by the definite article 'the' (structure: <i>the +    comparative degree</i>). Therefore, the comparative form <b>more</b>    is correct here rather than the superlative degree 'most'.</p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct spelling of the incorrectly spelt word in the    given sentence.</p>    <p style=\"orphans:0;widows:0\">Every citizen should understand    that voting is a valuable privelage as well as a duty.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Priviledge</p>", "option2": " <p style=\"orphans:0;widows:0\">    Previlege</p>", "option3": " <p style=\"orphans:0;widows:0\">    Privilege</p>", "option4": " <p style=\"orphans:0;widows:0\">    Privilage</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (C)</b></p>    <p style=\"orphans:0;widows:0\">The incorrectly spelt word in the    sentence is 'privelage'. The correct spelling is <b>Privilege</b>,    which refers to a special right, advantage, or immunity granted to    a particular person or group.</p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words.</p>    <p style=\"orphans:0;widows:0\">A person who is indifferent to or    unaffected by pleasure or pain</p>", "option1": "<p style=\"orphans:0;widows:0\">    Epicure</p>", "option2": " <p style=\"orphans:0;widows:0\">    Stoic</p>", "option3": " <p style=\"orphans:0;widows:0\">    Hedonist</p>", "option4": " <p style=\"orphans:0;widows:0\">    Cynic</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b> <b>Stoic</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Stoic</b>     refers to a person who can endure pain or hardship without     showing their feelings or complaining (indifferent to pleasure or     pain).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings     of other options:</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Epicure:</b>     A person who takes particular pleasure in fine food and drink.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Hedonist:</b>     A person who believes that the pursuit of pleasure is the most     important thing in life.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Cynic:</b> A person who     believes that people are motivated purely by self-interest.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    A sentence has been split up into segments and given below in    jumbled order. While the first and the last segments of the    sentence (1 and 6) are in the correct order, the segments in    between are jumbled up. Arrange the segments in the correct order    to form a meaningful and coherent sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1) The    primary purpose of environmental education</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">P) to    understand the delicate balance</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Q) is to    enable young minds</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R) and    inspire responsible action</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">S) of our    natural ecosystems</p>    <p style=\"orphans:0;widows:0\">6) for a sustainable future.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Q, P, S, R</p>", "option2": " <p style=\"orphans:0;widows:0\">    P, S, Q, R</p>", "option3": " <p style=\"orphans:0;widows:0\">    Q, S, P, R</p>", "option4": " <p style=\"orphans:0;widows:0\">    S, R, Q, P</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sequence is <b>Q, P, S, R</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    sentence opens with the subject in part (1): <i>'The primary    purpose of environmental education'</i>, which logically requires    a predicate verb. Segment <b>Q</b> (<i>'is to enable young minds'</i>)    provides this verb ('is').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. The verb    'enable' takes the structure 'enable someone + to-infinitive'.    Segment <b>P</b> (<i>'to understand the delicate balance'</i>)    directly complements <b>Q</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Segment <b>S</b>    (<i>'of our natural ecosystems'</i>) completes the prepositional    phrase describing what the 'delicate balance' belongs to.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Segment <b>R</b>    (<i>'and inspire responsible action'</i>) follows parallel to 'to    understand' (to understand ... and inspire), which links smoothly    to segment (6) (<i>'for a sustainable future'</i>).</p>    <p style=\"orphans:0;widows:0\">Thus, the complete coherent    sentence is: <i>'The primary purpose of environmental education is    to enable young minds to understand the delicate balance of our    natural ecosystems and inspire responsible action for a    sustainable future.'</i></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Parts of a sentence are given below in jumbled order. Arrange the    parts in the correct order to form a meaningful and grammatically    correct sentence.</p>    <p style=\"orphans:0;widows:0\">the passengers / waited /    patiently / at the station / for over an hour</p>", "option1": "<p style=\"orphans:0;widows:0\">    The passengers patiently for over an hour waited at the station.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The passengers waited patiently at the station for over an hour.</p>", "option3": " <p style=\"orphans:0;widows:0\">    At the station waited the passengers patiently for over an hour.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Patiently the passengers for over an hour at the station waited.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The correct    order follows the standard grammatical structure: <b>Subject +    Verb + Adverb of Manner + Adverb of Place + Adverb of Time (MPT    rule)</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Here:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Subject:</b>    The passengers</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Verb:</b>    waited</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Manner:</b>    patiently</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Place:</b>    at the station</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Time/Duration:</b>    for over an hour</p>    <p style=\"orphans:0;widows:0\">Therefore, the grammatically    correct sentence is: <i>\"The passengers waited patiently at    the station for over an hour.\"</i></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words.</p>    <p style=\"orphans:0;widows:0\">An acrobat who performs feats of    balancing on a tightrope or wire</p>", "option1": "<p style=\"orphans:0;widows:0\">    Contortionist</p>", "option2": " <p style=\"orphans:0;widows:0\">    Funambulist</p>", "option3": " <p style=\"orphans:0;widows:0\">    Ventriloquist</p>", "option4": " <p style=\"orphans:0;widows:0\">    Somnambulist</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b> <b>Funambulist</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Funambulist:</b>     An acrobat who walks or balances on a tightrope or high wire     (derived from Latin <i>funis</i> meaning 'rope' and <i>ambulare</i>     meaning 'to walk').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Contortionist:</b>     An acrobat or performer who twists their body into strange and     unnatural positions.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Ventriloquist:</b>     A performer who speaks without moving their lips, making the     sound seem to come from a dummy or somewhere else.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Somnambulist:</b> A     person who walks while asleep (sleepwalker).</p>    </li></ul>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate antonym of the given word. <b>Lament</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Celebrate</p>", "option2": " <p style=\"orphans:0;widows:0\">    Mourn</p>", "option3": " <p style=\"orphans:0;widows:0\">    Wail</p>", "option4": " <p style=\"orphans:0;widows:0\">    Grieve</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct answer is <b>A) Celebrate</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Lament</b> means to express passionate grief, sorrow, or     regret about something.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\"><b>Celebrate</b>     means to acknowledge a happy or significant event with an     enjoyable activity or festivity, making it the direct antonym.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Why the other options are incorrect (they are all synonyms of    </b><i><b>Lament</b></i><b>):</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>B) Mourn:</b> To feel or show deep sorrow or regret for     someone or something.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C)     Wail:</b> To give a prolonged high-pitched cry of pain, grief, or     anger.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>D) Grieve:</b> To suffer     intense sorrow or distress.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A white dove    landed softly on the branch of an olive tree.</p>    <p style=\"orphans:0;widows:0\">The denotation of the word ‘dove’    is ___________.</p>", "option1": "<p style=\"orphans:0;widows:0\">    a symbol of peace</p>", "option2": " <p style=\"orphans:0;widows:0\">    an emblem of innocence</p>", "option3": " <p style=\"orphans:0;widows:0\">    a type of bird</p>", "option4": " <p style=\"orphans:0;widows:0\">    a sign of harmony</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (C)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">‘<b>Denotation’</b>    refers to the explicit, primary, or literal dictionary definition    of a word, distinct from its emotional or figurative associations    (connotations).</p>    <p style=\"orphans:0;widows:0\">Literally, a <b>dove</b> is <b>a    type of bird</b> belonging to the pigeon family. Concepts like    ‘peace’, ‘innocence’, and ‘harmony’ are its symbolic    connotations, not its denotative meaning. Hence, the correct    answer is ‘a type of bird’.</p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in reported    speech.</p>    <p style=\"orphans:0;widows:0\">The captain said to the players,    \"I have prepared a new strategy for this match.\"</p>", "option1": "<p style=\"orphans:0;widows:0\">    The captain told the players that he has prepared a new strategy    for that match.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The captain told the players that I had prepared a new strategy    for this match.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The captain told the players that he had prepared a new strategy    for that match.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The captain told the players that he had prepared a new strategy    for this match.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (C)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">To convert an    assertive sentence from direct to indirect speech, follow these    rules:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     reporting verb 'said to' changes to 'told'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     conjunction 'that' is used to connect the reporting clause and     reported speech.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     first-person pronoun 'I' changes to the third-person pronoun 'he'     according to the subject ('The captain').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     present perfect tense ('have prepared') changes to the past     perfect tense ('had prepared').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     demonstrative adjective 'this' changes to 'that'.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, Option C is the    correct reported speech form: <i>\"The captain told the    players that he had prepared a new strategy for that match.\"</i></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate ANTONYM of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Paucity</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Dearth</p>", "option2": " <p style=\"orphans:0;widows:0\">    Scarcity</p>", "option3": " <p style=\"orphans:0;widows:0\">    Plethora</p>", "option4": " <p style=\"orphans:0;widows:0\">    Deficit</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (C)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The word    <b>'Paucity'</b> refers to the presence of something only in small    or insufficient quantities; scarcity or lack.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The word    <b>'Plethora'</b> refers to a large or excessive amount of    something; abundance.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Therefore,    <b>'Plethora'</b> is the most appropriate antonym.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Dearth:</b>     a scarcity or lack of something (synonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Scarcity:</b>     the state of being scarce or in short supply (synonym).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Deficit:</b> an amount by     which something is too small (synonym).</p>    </li></ul>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words.</p>    <p style=\"orphans:0;widows:0\">The practice of buying or selling    sacred things, church offices, or spiritual privileges</p>", "option1": "<p style=\"orphans:0;widows:0\">    Sacrilege</p>", "option2": " <p style=\"orphans:0;widows:0\">    Apostasy</p>", "option3": " <p style=\"orphans:0;widows:0\">    Simony</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sinecure</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (C)</b> <b>Simony</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Simony:</b>     The buying or selling of church offices, benefices, or spiritual     privileges.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sacrilege:</b>     The violation or misuse of what is regarded as sacred.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Apostasy:</b>     The formal abandonment or renunciation of a religious or     political belief.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sinecure:</b>     A position or office requiring little or no work, but providing     status or financial benefit.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence, the correct answer is    <b>Simony</b>.</p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in passive    voice.</p>    <p style=\"orphans:0;widows:0\">Once the committee submits the    report, the government will announce new guidelines.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Once the committee submits the report, new guidelines would be    announced by the government.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Once the committee submits the report, new guidelines will be    announced by the government.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Once the committee submits the report, new guidelines will have    been announced by the government.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Once the committee submits the report, new guidelines are    announced by the government.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The given    sentence contains a time clause (<i>Once the committee submits the    report</i>) and a main clause in the simple future tense (<i>the    government will announce new guidelines</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">When    converting simple future tense from active to passive voice, the    rule is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Active:</b>    Subject + will + V1 + Object</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Passive:</b>    Object + will + be + V3 + (by + Subject)</p>    <p style=\"orphans:0;widows:0\">Hence, \"the government will    announce new guidelines\" becomes \"new guidelines will be    announced by the government\", while the subordinate time    clause remains as it is. Therefore, option B is the correct    passive form.</p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The following sentence has been split into four segments. Identify    the segment that contains a grammatical error.</p>    <p style=\"orphans:0;widows:0\">He, you and I / will represent    the college / in the upcoming national debate competition / next    month.</p>", "option1": "<p style=\"orphans:0;widows:0\">    will represent the college</p>", "option2": " <p style=\"orphans:0;widows:0\">    in the upcoming national debate competition</p>", "option3": " <p style=\"orphans:0;widows:0\">    He, you and I</p>", "option4": " <p style=\"orphans:0;widows:0\">    next month</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (C)</b> <b>'He, you and I'</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In a    standard, positive, or polite context, when singular personal    pronouns of different persons are used together, the correct order    is <b>2-3-1</b> (Second Person → Third Person → First Person).</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct phrasing    should be <b>'You, he and I'</b> instead of <b>'He, you and I'</b>.</p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate synonym of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Perspicacity</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Tenacity</p>", "option2": " <p style=\"orphans:0;widows:0\">    Discernment</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mendacity</p>", "option4": " <p style=\"orphans:0;widows:0\">    Credulity</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b> <b>Discernment</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Perspicacity</b>     means the quality of having a ready insight into things, keen     mental perception, or shrewdness.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Discernment:</b>     The ability to judge well and perceive keen insights (Synonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Tenacity:</b>     The quality or fact of being very determined; persistence.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Mendacity:</b>     Untruthfulness or deceitfulness.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Credulity:</b> A tendency     to be too ready to believe that something is real or true;     gullibility.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in passive    voice.</p>    <p style=\"orphans:0;widows:0\">The archaeological team has    recently excavated an ancient temple in the dense forest.</p>", "option1": "<p style=\"orphans:0;widows:0\">    An ancient temple was recently excavated in the dense forest by    the archaeological team.</p>", "option2": " <p style=\"orphans:0;widows:0\">    An ancient temple had recently been excavated in the dense forest    by the archaeological team.</p>", "option3": " <p style=\"orphans:0;widows:0\">    An ancient temple has recently been excavated in the dense forest    by the archaeological team.</p>", "option4": " <p style=\"orphans:0;widows:0\">    An ancient temple is recently being excavated in the dense forest    by the archaeological team.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (C)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The given    sentence is in the Present Perfect Tense in active voice.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Active     Voice structure: <b>Subject + has/have + V3 + Object</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive     Voice structure: <b>Object + has/have + been + V3 + by + Subject</b></p>    </li></ul>    <p style=\"orphans:0;widows:0\">Here, 'an ancient temple' is    singular, so it takes 'has been excavated'. Therefore, option C is    the correct passive form.</p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option that can substitute the    underlined words in the given sentence.</p>    <p style=\"orphans:0;widows:0\">The soldiers were ordered to    safeguard the <u>place where weapons and military equipment are    stored</u> from enemy infiltrators.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Granary</p>", "option2": " <p style=\"orphans:0;widows:0\">    Hangar</p>", "option3": " <p style=\"orphans:0;widows:0\">    Arsenal</p>", "option4": " <p style=\"orphans:0;widows:0\">    Aviary</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (C)</b> <b>Arsenal</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Arsenal:</b>     A place where weapons, ammunition, and military equipment are     stored.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Granary:</b>     A storehouse for threshed grain.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Hangar:</b>     A large building for housing aircraft.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Aviary:</b> A large cage     or enclosure for keeping birds.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">The minister faced severe    __________ from both the opposition and the public for his    reckless comments on the crisis.</p>", "option1": "<p style=\"orphans:0;widows:0\">    censor</p>", "option2": " <p style=\"orphans:0;widows:0\">    censure</p>", "option3": " <p style=\"orphans:0;widows:0\">    sensor</p>", "option4": " <p style=\"orphans:0;widows:0\">    censer</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b> <b>censure</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Censure</b>     (noun) means harsh criticism, formal reprimand, or severe     disapproval. In the given context, the minister received strong     public and political criticism for his reckless remarks.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Censor</b>     (noun/verb) refers to an official who examines books, films, or     news to suppress unacceptable parts.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sensor</b>     (noun) refers to a device that detects or responds to a physical     stimulus (such as heat, motion, or light).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Censer</b> (noun) refers     to a vessel or container in which incense is burned, especially     in religious ceremonies.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in indirect    speech.</p>    <p style=\"orphans:0;widows:0\">The manager said to the clerk,    \"Why did you not deposit the cash in the bank yesterday?\"</p>", "option1": "<p style=\"orphans:0;widows:0\">    The manager asked the clerk why had he not deposited the cash in    the bank the previous day.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The manager asked the clerk why he had not deposited the cash in    the bank the previous day.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The manager enquired of the clerk that why he had not deposited    the cash in the bank the previous day.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The manager asked the clerk why he did not deposit the cash in the    bank yesterday.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">To convert an    interrogative sentence (Wh-question) from direct to indirect    speech, the following rules are applied:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     reporting verb 'said to' is changed to 'asked' or 'enquired of'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">No     conjunction ('that', 'if', or 'whether') is placed before the     wh-word ('why').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     interrogative structure (Auxiliary verb + Subject) is changed     into an assertive/affirmative structure (Subject + Auxiliary     verb). Hence, 'why did you not deposit' becomes 'why he had not     deposited' (not 'why had he').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     simple past tense ('did not deposit') changes to the past perfect     tense ('had not deposited').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     pronoun 'you' changes to 'he' according to the object 'the     clerk'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The time     adverb 'yesterday' changes to 'the previous day' or 'the day     before'.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, option B correctly    incorporates all these changes.</p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Complete the dialogue for Person B using the correct idiom.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Person A: Are    you going to bring up the issue of the missed deadline in today's    meeting?</p>    <p style=\"orphans:0;widows:0\">Person B: No, the matter has    already been resolved, so I would rather ______.</p>", "option1": "<p style=\"orphans:0;widows:0\">    let sleeping dogs lie</p>", "option2": " <p style=\"orphans:0;widows:0\">    burn the midnight oil</p>", "option3": " <p style=\"orphans:0;widows:0\">    bark up the wrong tree</p>", "option4": " <p style=\"orphans:0;widows:0\">    bite the bullet</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (A)</b></p>    <p style=\"orphans:0;widows:0\">The idiom <b>'let sleeping dogs    lie'</b> means to leave a situation alone to avoid causing trouble    or rekindling an old conflict. Here, Person B does not want to    re-open a settled issue, making 'let sleeping dogs lie' the    correct choice.</p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in passive    voice.</p>    <p style=\"orphans:0;widows:0\">Do not disturb the sleeping baby.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Let the sleeping baby not be disturbed.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Let the sleeping baby not being disturbed.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Let not the sleeping baby disturbed.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Have the sleeping baby not been disturbed.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (A)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The given    sentence is a negative imperative sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The active    voice structure for a negative imperative sentence is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Do not +    V1 + Object</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The passive    voice structure using 'Let' is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Let +    Object + not + be + V3 (past participle)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Applying this    rule:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Object: <i>the    sleeping baby</i></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Verb: <i>disturb</i>    → <i>disturbed</i></p>    <p style=\"orphans:0;widows:0\">Therefore, the passive form is:    <b>Let the sleeping baby not be disturbed.</b></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Of the two alternatives suggested    by the committee to curb inflation, the former is undeniably    ___________.</p>", "option1": "<p style=\"orphans:0;widows:0\">    the more effective</p>", "option2": " <p style=\"orphans:0;widows:0\">    the most effective</p>", "option3": " <p style=\"orphans:0;widows:0\">    more effective</p>", "option4": " <p style=\"orphans:0;widows:0\">    most effective</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (A)</b></p>    <p style=\"orphans:0;widows:0\">When a selection or comparison is    made between exactly two persons or things (indicated here by 'Of    the two alternatives'), the comparative degree is used, and it    must be preceded by the definite article 'the' (Structure: the +    comparative degree). The superlative degree ('the most effective')    is used only when comparing three or more entities. Hence, 'the    more effective' is the grammatically correct choice.</p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate article to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Munshi Premchand, ________    renowned novelist, made immense contributions to Hindi literature.</p>", "option1": "<p style=\"orphans:0;widows:0\">    a</p>", "option2": " <p style=\"orphans:0;widows:0\">    an</p>", "option3": " <p style=\"orphans:0;widows:0\">    the</p>", "option4": " <p style=\"orphans:0;widows:0\">    no article required</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (A)</b></p>    <p style=\"orphans:0;widows:0\">The indefinite article 'a' is    used before a singular countable noun phrase beginning with a    consonant sound (here, 'renowned' begins with the consonant sound    /r/). In this sentence, \"a renowned novelist\" functions    as a noun phrase in apposition providing descriptive information    about Munshi Premchand. Hence, 'a' is the correct choice.</p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is divided into four segments. Identify the    segment that contains a grammatical error.</p>    <p style=\"orphans:0;widows:0\">She realized that / she has left    / her passport at home / only after reaching the airport.</p>", "option1": "<p style=\"orphans:0;widows:0\">    She realized that</p>", "option2": " <p style=\"orphans:0;widows:0\">    she has left</p>", "option3": " <p style=\"orphans:0;widows:0\">    her passport at home</p>", "option4": " <p style=\"orphans:0;widows:0\">    only after reaching the airport</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B).</b> <b>'she has left'</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The sentence    narrates events that occurred in the past. The main clause    contains the past tense verb 'realized'. Since the action of    leaving the passport occurred prior to the moment of realizing it,    the subordinate clause must use the Past Perfect tense (<b>'had    left'</b>) instead of the Present Perfect tense ('has left').</p>    <p style=\"orphans:0;widows:0\"><b>Correct Sentence:</b> She    realized that she <i>had left</i> her passport at home only after    reaching the airport.</p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate ANTONYM of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Despondent</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Dejected</p>", "option2": " <p style=\"orphans:0;widows:0\">    Cheerful</p>", "option3": " <p style=\"orphans:0;widows:0\">    Miserable</p>", "option4": " <p style=\"orphans:0;widows:0\">    Gloomy</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The Correct option is. (B)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The word    <b>'Despondent'</b> means feeling or showing extreme    discouragement, dejection, or depression (hopeless/sad).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The most    appropriate antonym is <b>'Cheerful'</b>, which means noticeably    happy and optimistic.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Dejected:</b>     sad and depressed (synonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Miserable:</b>     wretchedly unhappy or uncomfortable (synonym).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Gloomy:</b> feeling or     causing sadness and depression (synonym).</p>    </li></ul>", "question_heading": ""}, {"sr_no": 50, "question": "In पुध ीियियथing ूोौौोgध, ौयंध थयनकौ ुोॅध ृधधn किधधपधक. Rधोक पुध ूोौौोgध cोनधीिहिद ोnक ौिधधcप पुध ंयौप ोूूनयूनiोपध यूपiयn पय ीiिि in धोcु ृिोnा. Tनहध धकहcोपiयn iौ nयप ंधनिधद ोृयहप ोccहंिहोपing ीोcपौ यन ूनधूोनing ीयन ो िहcनोपiॅध cोनधधने iप iौ ोृयहप cिहपiॅोपing cुोनोcपधन ोnक थiौकयं. Wुiिध ंयकधनn ौcुयियing यीपधn ीयcहौधौ यn ूनयॅiकing (1)........ ौाiििस ीयन पुध थयनाूिोcध, iप पधnकौ पय nधgिधcप पुध क ": " <p style=\"orphans:0;widows:0\">    MARG (<span style=\"font-family:'Nirmala UI'\"><span>माइनॉरिटी    अवेयरनेस एंड रिसोर्स गाइडेंस</span></span>)</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>सितंबर </span></span>2026    <span style=\"font-family:'Nirmala UI'\"><span>में</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>अल्पसंख्यक    कार्य मंत्रालय के तत्वावधान    में कार्यरत राष्ट्रीय    अल्पसंख्यक विकास और वित्त    निगम </span></span>(NMDFC) <span style=\"font-family:'Nirmala UI'\"><span>ने    अपने उन्नत डिजिटल प्लेटफॉर्म    </span></span>'NMDFC 2.0' <span style=\"font-family:'Nirmala UI'\"><span>और    </span></span><b>MIRA</b> (<span style=\"font-family:'Nirmala UI'\"><span>माइनॉरिटी    इंफॉर्मेशन एंड रिसोर्स    असिस्टेंस</span></span>) <span style=\"font-family:'Nirmala UI'\"><span>नामक    एक </span></span>AI-<span style=\"font-family:'Nirmala UI'\"><span>संचालित    चैटबॉट का शुभारंभ किया।    भाषिणी </span></span>(BHASHINI) <span style=\"font-family:'Nirmala UI'\"><span>पहल    द्वारा समर्थित यह चैटबॉट    रियायती ऋण योजनाओं और    स्वरोजगार सहायता से संबंधित    जानकारी प्राप्त करने के    इच्छुक लाभार्थियों को    बहुभाषी सहायता प्रदान करने    के लिए तैयार किया गया है।</span></span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span><b>हिमालयी    अपवाह तंत्र की निम्नलिखित    नदियों पर विचार कीजिए</b></span></span><b>:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. </b><span style=\"font-family:'Nirmala UI'\"><span><b>अरुण</b></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2.    </b><span style=\"font-family:'Nirmala UI'\"><span><b>सुबनसिरी</b></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3. </b><span style=\"font-family:'Nirmala UI'\"><span /b><span style=\"font-family:'Nirmala UI'\"><span><b>की    नई आर्थिक नीति </b></span></span><b>(NEP)    </b><span style=\"font-family:'Nirmala UI'\"><span><b>के </b></span></span><b>'</b><span style=\"font-family:'Nirmala UI'\"><span><b>निजीकरण</b></span></span><b>'    </b><span style=\"font-family:'Nirmala UI'\"><span><b>स्तंभ    के तहत निम्नलिखित में से    कौन</b></span></span><b>-</b><span style=\"font-family:'Nirmala UI'\"><span><b>सा    प्रमुख नीतिगत कदम उठाया    गया था</b></span></span><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>विदेशी    मुद्राओं के मुकाबले भारतीय    रुपये का अवमूल्यन।</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>सार्वजनिक    क्षेत्र के उपक्रमों </span></span>(PSUs)    <span style=\"font-family:'Nirmala UI'\"><span>की इक्विटी    बेचकर विनिवेश करना।</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>अधिकांश    उद्योगों के लिए लाइसेंसिंग    आवश्यकताओं को समाप्त करना।</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>सीमा शुल्क    में कटौती और आयात कोटा को    हटाना।</span></span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    1991 <span style=\"font-family:'Nirmala UI'\"><span>की नई    आर्थिक नीति </span></span>(NEP) <span style=\"font-family:'Nirmala UI'\"><span>के    तहत <b>निजीकरण</b> का उद्देश्य    सार्वजनिक क्षेत्र की भूमिका    को सीमित करना और सरकारी    उद्यमों के स्वामित्व या    प्रबंधन को निजी क्षेत्र को    सौंपना था। इसके लिए मुख्य    साधन <b>विनिवेश </b></span></span><b>(Disinvestment)</b>    <span style=\"font-family:'Nirmala UI'\"><span>था</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>जिसके तहत    सार्वजनिक क्षेत्र के उपक्रमों    </span></span>(PSUs) <span style=\"font-family:'Nirmala UI'\"><span>में    सरकारी इक्विटी</span></span>/<span style=\"font-family:'Nirmala UI'\"><span>शेयरों    को निजी निवेशकों और जनता    को बेचा गया। इसके विपरीत</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>औद्योगिक    लाइसेंसिंग समाप्त करना    उदारीकरण का हिस्सा था</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>जबकि रुपये    का अवमूल्यन और शुल्क कटौती    बाह्य व्यापार सुधारों से    जुड़े थे।</span></span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span><b>सितंबर    </b></span></span><b>2026 </b><span style=\"font-family:'Nirmala UI'\"><span><b>में</b></span></span><b>,    </b><span style=\"font-family:'Nirmala UI'\"><span><b>भारत ने    चीन में आयोजित पुरुष जूनियर    एशिया कप हॉकी के फाइनल में    किस देश को </b></span></span><b>4-1 </b><span style=\"font-family:'Nirmala UI'\"><span><b>से    हराकर रिकॉर्ड छठा खिताब    जीता</b></span></span><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>पाकिस्तान</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>दक्षिण    कोरिया</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>मलेशिया</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>जापान</span></span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>सितंबर </span></span>2026    <span style=\"font-family:'Nirmala UI'\"><span>में</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>भारतीय    जूनियर पुरुष हॉकी टीम ने    चीन के मोकी </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>हुलुनबुइर</span></span>)    <span style=\"font-family:'Nirmala UI'\
