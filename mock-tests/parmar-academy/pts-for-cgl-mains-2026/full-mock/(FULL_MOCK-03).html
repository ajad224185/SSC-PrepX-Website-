te/bulk_uploader_images/1795070289074_image304.png\" width=\"206\" height=\"29\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which among the following servers translates human-readable domain names (such as www.google.com) into machine-readable IP addresses?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Web Server</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Domain Name System (DNS) Server</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mail Server</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>File Transfer Protocol (FTP) Server</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A Domain Name System (DNS) server functions like the phonebook of the Internet. It is responsible for translating human-friendly domain names (e.g., www.google.com) into numeric IP addresses (e.g., 142.250.190.46) that computers and networking devices use to route data to the intended destination.</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following is an example of a GUI (Graphical User Interface) based email client?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Pine</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Elm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mutt</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Microsoft Outlook</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Microsoft Outlook is a popular GUI (Graphical User Interface) based email client that provides visual elements such as windows, icons, buttons, and mouse navigation. On the other hand, Pine, Elm, and Mutt are text-based (command-line) email user agents typically run in terminal environments.</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">In MS Word 365, the option to create and insert a 'Table of Contents' is located under which of the following tabs?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Insert</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>References</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Review</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Layout</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In MS Word 365, the 'Table of Contents' feature is located under the </span><span style=\"font-weight:bold\">References</span><span> tab. The References tab allows users to add various document reference elements such as footnotes, endnotes, citations, bibliography, captions, and tables of contents.</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">In an email system, which component directly interacts with the end user to compose, send, and read email messages?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>User Agent (UA)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mail Transfer Agent (MTA)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mail Delivery Agent (MDA)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Internet Protocol (IP)</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A User Agent (UA), commonly known as an email client (e.g., Microsoft Outlook, Thunderbird, or a webmail interface), is the application program that allows an end user to compose, send, read, and manage email messages.</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">In Windows operating system, which of the following keyboard shortcuts is used to open File Explorer?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Windows logo key + E</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Windows logo key + R</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Windows logo key + D</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Windows logo key + L</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In Windows operating system, pressing the </span><span style=\"font-weight:bold\">Windows logo key + E</span><span> directly opens File Explorer. Among the other options: Windows + R opens the Run dialog box, Windows + D minimizes/restores all windows to show the desktop, and Windows + L locks the PC.</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following types of memory acts as an extremely high-speed buffer between the Central Processing Unit (CPU) and the main memory (RAM) to minimize access latency?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Virtual Memory</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cache Memory</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Secondary Storage</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Read-Only Memory (ROM)</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cache memory is a small-sized, extremely fast volatile computer memory that acts as a buffer between the CPU and the main memory (RAM). It stores frequently used instructions and data so that the processor does not have to wait for the comparatively slower RAM, thereby reducing average access time and speeding up overall system performance.</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which component of the Microsoft Excel interface displays the cell reference or address of the currently active cell?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Formula Bar</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Status Bar</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Name Box</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sheet Tab</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In Microsoft Excel, the </span><span style=\"font-weight:bold\">Name Box</span><span> is located to the left of the Formula Bar and displays the address or reference of the currently selected (active) cell (such as A1, B5, etc.) or the name of a defined range. In contrast, the Formula Bar shows the data or formula entered in the active cell.</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which networking device operates primarily at Layer 3 (Network Layer) of the OSI model and is responsible for routing data packets between different networks based on IP addresses?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hub</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Repeater</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Bridge</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Router</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A router operates at Layer 3 (Network Layer) of the OSI model. It uses logical addressing (IP addresses) to forward data packets across multiple interconnected networks. In contrast, hubs and repeaters operate at Layer 1 (Physical Layer), and bridges and switches operate at Layer 2 (Data Link Layer).</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following computer storage devices relies on sequential access rather than direct (random) access to retrieve data?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Magnetic tape</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hard disk drive</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CD-ROM</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Solid-state drive</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Magnetic tape is a sequential access storage medium. To read a specific piece of data, the drive must physically wind through all the preceding data, which makes the retrieval process slower compared to direct-access media. Devices such as hard disk drives (HDDs), solid-state drives (SSDs), and optical discs (like CD-ROMs) use direct or random access, allowing any block of data to be read almost immediately regardless of its physical location.</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">In MS-Excel, which of the following functions is used to count the number of cells in a given range that are NOT empty?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>COUNT</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>COUNTA</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>COUNTBLANK</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>COUNTIF</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In MS-Excel, the </span><span style=\"font-weight:bold\">COUNTA</span><span> function counts the number of cells in a specified range that are not empty (it includes numbers, text, logical values, error values, etc.). In contrast, the </span><span style=\"font-weight:bold\">COUNT</span><span> function only counts cells that contain numeric values, </span><span style=\"font-weight:bold\">COUNTBLANK</span><span> counts empty cells, and </span><span style=\"font-weight:bold\">COUNTIF</span><span> counts cells based on a given condition.</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following is NOT a web browser?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mozilla Firefox</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Apache</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Microsoft Edge</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Vivaldi</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Apache (specifically the Apache HTTP Server) is a widely used open-source web server software, not a web browser. In contrast, Mozilla Firefox, Microsoft Edge, and Vivaldi are web browsers designed to retrieve and render content from the World Wide Web.</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following components acts as an extremely fast buffer between the Central Processing Unit (CPU) and the main memory to bridge the speed mismatch?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Read-Only Memory (ROM)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cache Memory</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Virtual Memory</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Secondary Memory</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cache memory is an extremely fast semiconductor memory placed between the CPU and the main memory (RAM). It acts as a high-speed buffer to store the instructions and data that the processor is likely to use repeatedly, thereby bridging the speed gap between the fast CPU and the relatively slower primary memory.</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following keyboard shortcuts is used to insert a hyperlink for selected text in Microsoft Word?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + H</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + K</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + L</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + M</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In Microsoft Word and most text-editing applications, the shortcut key </span><span style=\"font-weight:bold\">Ctrl + K</span><span> is used to open the 'Insert Hyperlink' dialog box. Among the other options: Ctrl + H opens the 'Replace' tab, Ctrl + L aligns text to the left, and Ctrl + M increases the paragraph indent.</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following network devices or services acts as an intermediary between an internal network and the internet, forwarding client requests to external servers to provide security, privacy, and caching?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Proxy Server</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Network Switch</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Repeater Hub</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Modem</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A </span><span style=\"font-weight:bold\">Proxy Server</span><span> acts as a gateway or intermediary between end-users and the internet. When a user requests a web page or file, the request goes to the proxy server first, which then evaluates and forwards the request to the destination server. It helps in enhancing network security, filtering web content, masking the client's internal IP address for privacy, and caching frequently accessed data to speed up response times.</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which type of computer memory is typically used to implement Cache memory because it does not require periodic refreshing and offers faster access times?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Dynamic Random Access Memory (DRAM)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Static Random Access Memory (SRAM)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Erasable Programmable Read-Only Memory (EPROM)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Electrically Erasable Programmable Read-Only Memory (EEPROM)</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Static Random Access Memory (SRAM) is used to build cache memory because it provides significantly faster data access compared to DRAM and does not require periodic electrical refreshing to retain stored information. Dynamic RAM (DRAM), on the other hand, consists of capacitors that leak charge, requiring continuous refreshing, and is commonly used for main system memory.</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">In computer architecture, what does MDR stand for?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Memory Direction Register</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Memory Data Register</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Master Data Record</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Main Decoding Register</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In computer architecture, MDR stands for </span><span style=\"font-weight:bold\">Memory Data Register</span><span> (also referred to as Memory Buffer Register or MBR). It is the register in a computer's CPU that stores the data being transferred to or from the memory (RAM).</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which type of malware is a standalone program that self-replicates and spreads to other computers across a network without requiring any human intervention or a host file?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Trojan Horse</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Computer Worm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Spyware</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Adware</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A </span><span style=\"font-weight:bold\">Computer Worm</span><span> is a standalone malicious program that self-replicates in order to spread to other computers across a network. Unlike a virus, it does not need to attach itself to an existing program or host file, and unlike a Trojan horse, it spreads automatically without requiring user action.</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">In Microsoft Word, what is the primary purpose of the 'Format Painter' tool?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>To copy formatting from one piece of text and apply it to another</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>To draw custom shapes and illustrations within the document</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>To highlight grammatical and spelling errors in different colors</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>To change the background color of the entire document</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The 'Format Painter' tool in Microsoft Word is used to quickly copy all formatting (such as font type, size, color, and line spacing) from a selected piece of text or object and apply it to another section of the document.</span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">In Windows 10 File Explorer, which of the following keyboard shortcuts is used to open the Properties dialog box for a selected file or folder?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Shift + P</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Alt + Enter</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Enter</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Shift + F2</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In Windows File Explorer, pressing </span><span style=\"font-weight:bold\">Alt + Enter</span><span> opens the Properties dialog box for the currently selected file or folder. Alternatively, pressing </span><span style=\"font-weight:bold\">Alt + double-clicking</span><span> the item also opens its properties.</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following is an example of an input device in a computer system?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Plotter</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Projector</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Trackball</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0p uestion": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Parts of the following sentence have been given as options. Select    the option that contains an error.</p>    <p style=\"orphans:0;widows:0\">He is the candidate whom we    believe is most suitable for the prestigious post.</p>", "option1": "<p style=\"orphans:0;widows:0\">    whom we believe</p>", "option2": " <p style=\"orphans:0;widows:0\">    He is the candidate</p>", "option3": " <p style=\"orphans:0;widows:0\">    is most suitable</p>", "option4": " <p style=\"orphans:0;widows:0\">    for the prestigious post.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (A). <b>\"whom we believe\"</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Here, the    relative pronoun functions as the subject of the verb <i>'is'</i>    in the clause that follows (<i>'we believe'</i> is an interrupting    parenthetical clause). Therefore, the subjective pronoun <b>'who'</b>    should be used instead of the objective pronoun <b>'whom'</b>.</p>    <p style=\"orphans:0;widows:0\">The correct sentence is: <i>\"He    is the candidate who we believe is most suitable for the    prestigious post.\"</i></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Parts of the following sentence have been given as options. Select    the option that contains an error.</p>    <p style=\"orphans:0;widows:0\">Children should be taught to take    care of those belongings from an early age.</p>", "option1": "<p style=\"orphans:0;widows:0\">    from an early age.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Children should be</p>", "option3": " <p style=\"orphans:0;widows:0\">    of those belongings</p>", "option4": " <p style=\"orphans:0;widows:0\">    taught to take care</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (C)</b> \"of those belongings\".</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In this    context, the sentence refers to the personal possessions of the    children. Therefore, the possessive determiner 'their' should be    used instead of the demonstrative determiner 'those'. The correct    phrase should be \"of their belongings\".</p>    <p style=\"orphans:0;widows:0\">Correct sentence: <i>Children    should be taught to take care of their belongings from an early    age.</i></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The following sentence has been divided into four parts. One of    them contains an error. Select the part that contains the error    from the given options.</p>    <p style=\"orphans:0;widows:0\">Even though he was / well-trained    for the mission, / he behaved cowardly / when confronted by the    enemy.</p>", "option1": "<p style=\"orphans:0;widows:0\">    well-trained for the mission,</p>", "option2": " <p style=\"orphans:0;widows:0\">    he behaved cowardly</p>", "option3": " <p style=\"orphans:0;widows:0\">    Even though he was</p>", "option4": " <p style=\"orphans:0;widows:0\">    when confronted by the enemy.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B)</b> <b>'he behaved cowardly'</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'Cowardly' is    an adjective, not an adverb (just like <i>friendly, miserly,    scholarly, brotherly</i>). To modify the verb 'behaved', we must    use an adverbial phrase rather than an adjective. Therefore,    'cowardly' should be replaced with <b>'in a cowardly manner'</b>    or <b>'in a cowardly way'</b>.</p>    <p style=\"orphans:0;widows:0\">Correct sentence: <i>Even though    he was well-trained for the mission, he behaved in a cowardly    manner when confronted by the enemy.</i></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence has an error which has been underlined. The    underlined word is given as options with some changes. Select the    option that rectifies the error.</p>    <p style=\"orphans:0;widows:0\">The committee demanded    unconditional <u>aquiescence</u> to the new regulatory guidelines.</p>", "option1": "<p style=\"orphans:0;widows:0\">    acquiesence</p>", "option2": " <p style=\"orphans:0;widows:0\">    acquiescence</p>", "option3": " <p style=\"orphans:0;widows:0\">    acquiessence</p>", "option4": " <p style=\"orphans:0;widows:0\">    aquiesence</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The correctly spelled word is <b>acquiescence</b>, which means the    reluctant acceptance of something without protest. It is derived    from the Latin verb <i>acquiescere</i> (combining <i>ad-</i> and    <i>quiescere</i>). Common spelling errors involve omitting the 'c'    before 'q' or omitting the 'c' after 's'. Therefore, option B    correctly rectifies the error.</p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">By next month, the committee    _______ its final report on the project.</p>", "option1": "<p style=\"orphans:0;widows:0\">    will submit</p>", "option2": " <p style=\"orphans:0;widows:0\">    had submitted</p>", "option3": " <p style=\"orphans:0;widows:0\">    will have submitted</p>", "option4": " <p style=\"orphans:0;widows:0\">    will have submit</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (C)</b> <b>will have submitted</b>.</p>    <p style=\"orphans:0;widows:0\">The phrase 'By next month'    indicates a deadline or a specific point in the future by which an    action will be completed. To describe an action that will be    completed prior to a certain future time, the <b>Future Perfect    Tense</b> is used. Its structure is: <i>subject + will/shall +    have + past participle (V3)</i>. Therefore, 'will have submitted'    is the grammatically correct option.</p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate phrasal verb to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">The new regulations are expected    to ________ a positive change in the banking sector.</p>", "option1": "<p style=\"orphans:0;widows:0\">    bring about</p>", "option2": " <p style=\"orphans:0;widows:0\">    bring off</p>", "option3": " <p style=\"orphans:0;widows:0\">    bring round</p>", "option4": " <p style=\"orphans:0;widows:0\">    bring up</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The phrasal verb <b>'bring about'</b> means to cause something to    happen or produce a particular result. In the given sentence, the    regulations are expected to cause a positive change.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>bring off:</b>    to succeed in achieving something difficult</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>bring    round:</b> to restore someone to consciousness or persuade someone    to agree</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>bring up:</b>    to mention a topic or raise a child</p>    <p style=\"orphans:0;widows:0\">Therefore, <b>bring about</b> is    the correct choice.</p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in indirect    speech.</p>    <p style=\"orphans:0;widows:0\">The science teacher said, “Light    travels faster than sound.”</p>", "option1": "<p style=\"orphans:0;widows:0\">    The science teacher said that light travelled faster than sound.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The science teacher said that light travels faster than sound.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The science teacher says that light travels faster than sound.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The science teacher told that light had travelled faster than    sound.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct indirect speech is: <b>The science teacher said that    light travels faster than sound.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rule:</b>    When the reported speech expresses a universal truth, a scientific    fact, or a general law of nature, its tense does not change even    if the reporting verb is in the past tense ('said').</p>    <p style=\"orphans:0;widows:0\">Since “Light travels faster    than sound” is an established scientific fact, the simple    present tense ‘travels’ is retained. The reporting verb ‘said’    remains unchanged as there is no indirect object, and the    conjunction ‘that’ is used to connect the clauses.</p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in active    voice.</p>    <p style=\"orphans:0;widows:0\">A prestigious scholarship was    offered to Ananya by the university.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Ananya offered a prestigious scholarship to the university.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The university had offered a prestigious scholarship to Ananya.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The university offered a prestigious scholarship to Ananya.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The university was offering a prestigious scholarship to Ananya.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (C)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The given    sentence is in the passive voice in the simple past tense (was +    past participle <i>offered</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The rule for    converting passive voice to active voice in the simple past tense    is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Passive    Voice:</b> Object + was/were + V3 + by + Subject</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Active    Voice:</b> Subject + V2 (past tense form of verb) + Object</p>    <p style=\"orphans:0;widows:0\">Here, the subject in the active    voice is 'The university', the simple past verb is 'offered', and    the object is 'a prestigious scholarship to Ananya'. Therefore,    the correct active form is: <i>The university offered a    prestigious scholarship to Ananya.</i></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate synonym of the word given in brackets    to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">The committee was severely    frustrated by the diplomat's _________ attitude, which completely    stalled the bilateral negotiations. (Intransigent)</p>", "option1": "<p style=\"orphans:0;widows:0\">    mercurial</p>", "option2": " <p style=\"orphans:0;widows:0\">    obdurate</p>", "option3": " <p style=\"orphans:0;widows:0\">    facetious</p>", "option4": " <p style=\"orphans:0;widows:0\">    benevolent</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>'Intransigent'</b> means unwilling or refusing to    compromise, yield, or moderate a position (stubborn, unbending).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Obdurate:</b>    stubbornly refusing to change one's opinion or course of action;    unyielding (correct synonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Mercurial:</b>    subject to sudden or unpredictable changes of mood or mind;    volatile.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Facetious:</b>    treating serious issues with deliberately inappropriate humor;    flippant.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Benevolent:</b>    well-meaning, kind, and charitable.</p>    <p style=\"orphans:0;widows:0\">Therefore, <b>obdurate</b> is the    correct synonym to fill in the blank.</p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the underlined part of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The botanical institute preserves    a rare <u>collection of dried and pressed plant specimens arranged    systematically</u>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Arboretum</p>", "option2": " <p style=\"orphans:0;widows:0\">    Herbarium</p>", "option3": " <p style=\"orphans:0;widows:0\">    Vivarium</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sanatorium</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B)</b> <b>Herbarium</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Herbarium:</b>     A systematically arranged collection of dried, pressed, and     preserved plant specimens used for scientific study.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Arboretum:</b>     A botanical garden devoted to the cultivation and exhibition of     trees and shrubs.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Vivarium:</b>     An enclosure or structure adapted for keeping and raising living     animals and plants for observation or research.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Sanatorium:</b> An     establishment providing medical treatment and rest, often for     people with long-term illnesses.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the following sentence in active    voice.</p>    <p style=\"orphans:0;widows:0\">By whom was the secret    information leaked to the media?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Who leaked the secret information to the media?</p>", "option2": " <p style=\"orphans:0;widows:0\">    Who was leaking the secret information to the media?</p>", "option3": " <p style=\"orphans:0;widows:0\">    Who has leaked the secret information to the media?</p>", "option4": " <p style=\"orphans:0;widows:0\">    Whom leaked the secret information to the media?</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (A)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The given    sentence is in the passive voice and in the Simple Past Tense.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive Voice    structure: <i>By whom + was/were + Subject + V3 + ...?</i></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">To convert it    into the Active Voice, the structure becomes: <i>Who + V2 (past    tense verb) + Object + ...?</i></p>    <p style=\"orphans:0;widows:0\">Following this rule, 'By whom was    ... leaked' changes to 'Who leaked ...'. Hence, option A is the    correct active form.</p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate and grammatically correct option in    direct speech.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The doctor said him, \"You need to take complete bed rest for    a week.\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    The doctor told to him, \"You need to take complete bed rest    for a week.\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    The doctor said to him, \"You need to take complete bed rest    for a week.\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    The doctor said to he, \"You need to take complete bed rest    for a week.\"</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (C)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The correct    direct speech sentence is: <b>The doctor said to him, \"You    need to take complete bed rest for a week.\"</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Key    grammatical rules applied here:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In direct    speech, the reporting verb 'said' requires the preposition 'to'    before an indirect object (e.g., 'said to him', not 'said him').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The verb    'told' takes a direct object without 'to' (e.g., 'told him', not    'told to him').</p>    <p style=\"orphans:0;widows:0\">A preposition ('to') must be    followed by an objective pronoun ('him', not subjective 'he').</p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the sentence that gives the most appropriate meaning of the    given idiom.</p>    <p style=\"orphans:0;widows:0\"><b>Leave no stone unturned</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    The workers cleared all the heavy rocks from the highway after the    landslide.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The detective investigated every possible clue and questioned all    witnesses to solve the robbery.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The gardener arranged white pebbles along the pathway in the    courtyard.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The geologist collected various rock samples from the riverbed.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (B)<b> The detective investigated every    possible clue and questioned all witnesses to solve the robbery.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The idiom    <b>'leave no stone unturned'</b> means to do everything possible,    make every effort, or examine all available options in order to    achieve a goal or find something.</p>    <p style=\"orphans:0;widows:0\">Sentence B best reflects this    meaning, as the detective made every possible effort (checking    every clue and interviewing all witnesses) to solve the case.</p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that arranges the given words to form a    grammatically correct and meaningful sentence.</p>    <p style=\"orphans:0;widows:0\">The audience enthusiastically the    applauded remarkable performance.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The remarkable performance enthusiastically applauded the    audience.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The audience enthusiastically applauded the remarkable    performance.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The audience enthusiastically performance applauded the    remarkable.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Enthusiastically applauded the remarkable performance the    audience.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The correct    grammatical structure for a standard declarative sentence is:    <b>Subject + Adverb of manner + Main Verb + Object (Determiner +    Adjective + Noun)</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Here:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Subject:</b>    The audience</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Adverb:</b>    enthusiastically</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Verb:</b>    applauded</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Object:</b>    the remarkable performance</p>    <p style=\"orphans:0;widows:0\">Hence, the correct and meaningful    arrangement is: <i>\"The audience enthusiastically applauded    the remarkable performance.\"</i></p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate option to fill in the blank.</b></p>    <p style=\"orphans:0;widows:0\">Dense clouds of dark smoke    _________ from the burning factory into the afternoon sky.</p>", "option1": "<p style=\"orphans:0;widows:0\">    seeped</p>", "option2": " <p style=\"orphans:0;widows:0\">    billowed</p>", "option3": " <p style=\"orphans:0;widows:0\">    trickled</p>", "option4": " <p style=\"orphans:0;widows:0\">    sprouted</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B)</b> <b>billowed</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'Billow'    means (of smoke, cloud, or steam) to swell outward or rise and    roll in large masses or waves. Hence, it is the most appropriate    verb to describe dense clouds of smoke rising into the sky.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Seeped:</b>     flowed or leaked slowly through small holes or porous material.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Trickled:</b>     flowed in a small stream or drop by drop (used for liquids).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Sprouted:</b> began to     grow or shoot forth (used for plants or seeds).</p>    </li></ul>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option in the superlative degree that    can substitute the underlined segment in the given sentence.</p>    <p style=\"orphans:0;widows:0\">This is by far the <u>fascinate</u>    documentary I have watched this year.</p>", "option1": "<p style=\"orphans:0;widows:0\">    most fascinating</p>", "option2": " <p style=\"orphans:0;widows:0\">    more fascinating</p>", "option3": " <p style=\"orphans:0;widows:0\">    much fascinating</p>", "option4": " <p style=\"orphans:0;widows:0\">    fascinated</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (A)</b></p>    <p style=\"orphans:0;widows:0\">The sentence compares one    documentary against all the documentaries watched this year,    indicated by the definite article 'the' and the phrase 'by far'.    Hence, the superlative degree of the adjective must be used. For a    multi-syllable adjective like 'fascinating', the superlative form    is constructed using 'most' ('most fascinating').</p>", "question_heading": ""}, {"sr_no": 100, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The following sentence has been divided into parts. One of them    may contain an error. Select the part that contains the error from    the given options. If you don’t find any error, mark ‘No    error’ as your answer.</p>    <p style=\"orphans:0;widows:0\">Karan was surprised to learn that    he was first student to complete the assignment.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Karan was surprised</p>", "option2": " <p style=\"orphans:0;widows:0\">    to complete the assignment</p>", "option3": " <p style=\"orphans:0;widows:0\">    that he was first student</p>", "option4": " <p style=\"orphans:0;widows:0\">    No error</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (C)</b> <b>'that he was first student'</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The definite    article <b>'the'</b> must be used before ordinal numbers (such as    <i>first, second, third, etc.</i>) when they qualify a noun.    Therefore, 'first student' should be replaced with <b>'the first    student'</b>.</p>    <p style=\"orphans:0;widows:0\"><b>Correct sentence:</b> Karan    was surprised to learn that he was <i>the first student</i> to    complete the assignment.</p>", "question_heading": ""}, {"sr_no": 101, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the underlined group of words in the following sentence.</p>    <p style=\"orphans:0;widows:0\">The young debater captivated the    judges with her <u>fluent, persuasive, and powerful expression in    speech</u>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Ambiguity</p>", "option2": " <p style=\"orphans:0;widows:0\">    Eloquence</p>", "option3": " <p style=\"orphans:0;widows:0\">    Hesitation</p>", "option4": " <p style=\"orphans:0;widows:0\">    Verbiage</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B)</b> <b>Eloquence</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meaning of    the words:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Eloquence:</b>     Fluent, persuasive, and powerful speaking or writing.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Ambiguity:</b>     The quality of having more than one possible meaning;     unclearness.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Hesitation:</b>     The act of pausing or showing reluctance before saying or doing     something.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Verbiage:</b> The use of     too many words, especially without adding much meaning.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 102, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in indirect    speech.</p>    <p style=\"orphans:0;widows:0\">She said, “I saw this movie    with my cousins yesterday.”</p>", "option1": "<p style=\"orphans:0;widows:0\">    She said that she has seen that movie with her cousins yesterday.</p>", "option2": " <p style=\"orphans:0;widows:0\">    She said that she saw this movie with her cousins the previous    day.</p>", "option3": " <p style=\"orphans:0;widows:0\">    She said that she had seen that movie with her cousins the    previous day.</p>", "option4": " <p style=\"orphans:0;widows:0\">    She said that she had seen this movie with my cousins the day    before.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (C)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">To convert an    assertive sentence from direct to indirect speech:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb 'said' is followed by the conjunction 'that'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Pronouns    change according to the subject: 'I' becomes 'she', and 'my'    becomes 'her'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Simple Past    tense ('saw') changes to Past Perfect tense ('had seen').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Adjective    'this' changes to 'that'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Time    expression 'yesterday' changes to 'the previous day'.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct indirect    form is: <i>She said that she had seen that movie with her cousins    the previous day.</i></p>", "question_heading": ""}, {"sr_no": 103, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in passive    voice.</p>    <p style=\"orphans:0;widows:0\">Preserve these antique coins with    utmost care.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Let these antique coins be preserved with utmost care.</p>", "option2": " <p style=\"orphans:0;widows:0\">    These antique coins are preserving with utmost care.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Let these antique coins preserve with utmost care.</p>", "option4": " <p style=\"orphans:0;widows:0\">    These antique coins have been preserved with utmost care.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (A)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The given    sentence is an imperative sentence expressing an    instruction/command.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The standard    structure for changing an imperative sentence with an object into    passive voice is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Let +    Subject/Object + be + past participle (V3) + remaining words</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Applying this    rule:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'these    antique coins' becomes the object following 'Let'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'be' + V3 of    'preserve' gives 'be preserved'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The adverbial    phrase 'with utmost care' remains at the end.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct passive    form is <b>\"Let these antique coins be preserved with utmost    care.\"</b></p>", "question_heading": ""}, {"sr_no": 104, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The following sentence has been split into four segments. Identify    the segment that contains a grammatical error.</p>    <p style=\"orphans:0;widows:0\">The manager, as well as / his    subordinates, / were praised / for the project's success.</p>", "option1": "<p style=\"orphans:0;widows:0\">    his subordinates,</p>", "option2": " <p style=\"orphans:0;widows:0\">    were praised</p>", "option3": " <p style=\"orphans:0;widows:0\">    The manager, as well as</p>", "option4": " <p style=\"orphans:0;widows:0\">    for the project's success.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B)</b> <b>\"were praised\"</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">When two    subjects are connected by phrases like <i>'as well as', 'along    with', 'together with', 'in addition to'</i>, the verb must agree    with the first subject.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Here, the    first subject is <b>'The manager'</b> (singular noun); therefore,    the singular auxiliary verb <b>'was'</b> should be used instead of    the plural verb <b>'were'</b>.</p>    <p style=\"orphans:0;widows:0\">The correct sentence should read:    <i>\"The manager, as well as his subordinates, was praised for    the project's success.\"</i></p>", "question_heading": ""}, {"sr_no": 105, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that rectifies the underlined part of the given    sentence. In case no correction is needed, select ‘No correction    required’.</p>    <p style=\"orphans:0;widows:0\">Though his intentions were noble,    the young commander was <u>braver than wise</u> in leading his men    into the uncharted valley.</p>", "option1": "<p style=\"orphans:0;widows:0\">    more brave than wise</p>", "option2": " <p style=\"orphans:0;widows:0\">    braver than wiser</p>", "option3": " <p style=\"orphans:0;widows:0\">    more braver than wise</p>", "option4": " <p style=\"orphans:0;widows:0\">    No correction required</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (A)</b> <b>more brave than wise</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rule:</b>    When two different qualities of the same person or thing are    compared, we do not use the comparative suffix <i>-er</i>.    Instead, we use the structure <b>‘more + positive degree    adjective + than + positive degree adjective’</b>, even for    monosyllabic adjectives that normally take <i>-er</i>.</p>    <p style=\"orphans:0;widows:0\">Here, two qualities (bravery and    wisdom) of the same person (the young commander) are being    compared. Hence, “<b>braver than wise</b>” must be corrected    to “<b>more brave than wise</b>”.</p>", "question_heading": ""}, {"sr_no": 106, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence has an error. Choose the option that corrects    the error.</p>    <p style=\"orphans:0;widows:0\">This is a more perfect example of    medieval architecture.</p>", "option1": "<p style=\"orphans:0;widows:0\">    This is a most perfect example of medieval architecture.</p>", "option2": " <p style=\"orphans:0;widows:0\">    This is a perfect example of medieval architecture.</p>", "option3": " <p style=\"orphans:0;widows:0\">    This is a more perfecter example of medieval architecture.</p>", "option4": " <p style=\"orphans:0;widows:0\">    This is a much perfect example of medieval architecture.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B)</b></p>    <p style=\"orphans:0;widows:0\">Certain adjectives such as    <i>perfect, unique, round, complete, square,</i> and <i>universal</i>    represent absolute qualities that cannot be graded or compared.    Therefore, they do not take comparative or superlative modifiers    like 'more' or 'most'. Hence, <b>'more perfect'</b> should be    corrected to <b>'perfect'</b>.</p>", "question_heading": ""}, {"sr_no": 107, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that rectifies the underlined part of the given    sentence. In case no correction is needed, select ‘No correction    required’.</p>    <p style=\"orphans:0;widows:0\">The internship program offers <u>the    most unique</u> experience for budding journalists.</p>", "option1": "<p style=\"orphans:0;widows:0\">    an unique</p>", "option2": " <p style=\"orphans:0;widows:0\">    a unique</p>", "option3": " <p style=\"orphans:0;widows:0\">    the more unique</p>", "option4": " <p style=\"orphans:0;widows:0\">    No correction required</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The adjective    <b>unique</b> is an absolute (non-gradable) adjective meaning 'one    of a kind' or 'unlike anything else'. Therefore, it cannot take    degrees of comparison such as <i>more</i> or <i>most</i>.</p>    <p style=\"orphans:0;widows:0\">Additionally, <b>unique</b>    begins with a consonant sound (/juː/), so the indefinite article    <b>'a'</b> is used before it, not <b>'an'</b>. Thus, ‘a unique’    is the correct substitution.</p>", "question_heading": ""}, {"sr_no": 108, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that will improve the underlined part of the    given sentence.</p>    <p style=\"orphans:0;widows:0\">Rohan is wiser and <u>most    experienced</u> than all the other candidates interviewed today.</p>", "option1": "<p style=\"orphans:0;widows:0\">    very experienced</p>", "option2": " <p style=\"orphans:0;widows:0\">    more experienced</p>", "option3": " <p style=\"orphans:0;widows:0\">    the most experienced</p>", "option4": " <p style=\"orphans:0;widows:0\">    so experienced</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The sentence compares Rohan with other candidates using the    conjunction 'than', requiring adjectives in the comparative    degree. Furthermore, when two adjectives qualifying the same noun    are joined by 'and', both must be in the same degree of    comparison. Since 'wiser' is in the comparative degree, 'most    experienced' must be replaced by the comparative form <b>more    experienced</b>. Hence, the correct answer is <b>option B.</b></p>", "question_heading": ""}, {"sr_no": 109, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate option to fill in the blank.</b></p>    <p style=\"orphans:0;widows:0\">The rescue workers made ________    efforts to locate the survivors trapped under the rubble.</p>", "option1": "<p style=\"orphans:0;widows:0\">    strenuous</p>", "option2": " <p style=\"orphans:0;widows:0\">    trivial</p>", "option3": " <p style=\"orphans:0;widows:0\">    negligent</p>", "option4": " <p style=\"orphans:0;widows:0\">    sluggish</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (A). <b>strenuous</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>'Strenuous'</b>    means requiring or using great exertion or energetic effort (e.g.,    strenuous efforts). In the given context, locating survivors under    rubble requires tireless and intense effort.</p>    <p style=\"orphans:0;widows:0\">The other options are    inappropriate: <b>'trivial'</b> means of little value or    importance, <b>'negligent'</b> means failing to take proper care,    and <b>'sluggish'</b> means slow-moving or lacking energy.</p>", "question_heading": ""}, {"sr_no": 110, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate homophone to fill in the blank.</b></p>    <p style=\"orphans:0;widows:0\">The treacherous trek across the    frozen terrain tested the true ________ of the young mountaineer.</p>", "option1": "<p style=\"orphans:0;widows:0\">    metal</p>", "option2": " <p style=\"orphans:0;widows:0\">    meddle</p>", "option3": " <p style=\"orphans:0;widows:0\">    mettle</p>", "option4": " <p style=\"orphans:0;widows:0\">    medal</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (C). <b>mettle</b>, which means a person's    ability to cope well with difficulties or to face a demanding    situation with resilience and courage.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other confusable words:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Metal</b>:     a hard, solid chemical element (such as iron, copper, or gold).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meddle</b>:     to interfere unwantedly in something that is not one's concern.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Medal</b>: a metal disc     or badge awarded to commemorate an event or honor an achievement.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 111, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate idiom to fill in the blank.</b></p>    <p style=\"orphans:0;widows:0\">Instead of taking responsibility    for the project's failure, the team leader attempted to ________    and blamed his subordinates.</p>", "option1": "<p style=\"orphans:0;widows:0\">    bite the bullet</p>", "option2": " <p style=\"orphans:0;widows:0\">    pass the buck</p>", "option3": " <p style=\"orphans:0;widows:0\">    burn the candle at both ends</p>", "option4": " <p style=\"orphans:0;widows:0\">    let the cat out of the bag</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The idiom <b>'pass the buck'</b> means to shift the responsibility    or blame for something to someone else. The sentence describes a    leader avoiding responsibility and blaming others, which makes    'pass the buck' the correct fit.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Bite     the bullet:</b> To accept something difficult or unpleasant.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Burn     the candle at both ends:</b> To exhaust oneself by doing too     much.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Let the cat out of the     bag:</b> To reveal a secret unintentionally.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 112, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the following passage, some words have been deleted. Read    the passage carefully and select the most appropriate option to    fill in each blank.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The global    transition towards clean and renewable energy has become an urgent    environmental 1. _____________. Nations across the globe are    setting ambitious climate targets to curb carbon emissions, and    investments in green technologies have 2. _____________    considerable pace over the last decade. Policymakers are realizing    the necessity of reforming outdated practices that 3.    ________________ environmental degradation and threaten ecological    balance. To achieve meaningful progress, communities and    industries must 4. __________ in collective climate action,    embrace eco-friendly innovations, and work collaboratively towards    a resilient future.</p>    <p style=\"orphans:0;widows:0\"><b>Select the most appropriate    option to fill in blank no. 1.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    diversion</p>", "option2": " <p style=\"orphans:0;widows:0\">    priority</p>", "option3": " <p style=\"orphans:0;widows:0\">    digression</p>", "option4": " <p style=\"orphans:0;widows:0\">    casualty</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B) priority</b></p>    <p style=\"orphans:0;widows:0\">The context emphasizes that    shifting to clean energy is a matter of critical global    importance. 'Priority' means a thing that is regarded as more    important than others, which fits the phrase 'urgent environmental    priority' appropriately. 'Diversion' (a distraction), 'digression'    (straying from the main subject), and 'casualty' (victim/loss) do    not fit the context.</p>", "question_heading": ""}, {"sr_no": 113, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the following passage, some words have been deleted. Read    the passage carefully and select the most appropriate option to    fill in each blank.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The global    transition towards clean and renewable energy has become an urgent    environmental 1. _____________. Nations across the globe are    setting ambitious climate targets to curb carbon emissions, and    investments in green technologies have 2. _____________    considerable pace over the last decade. Policymakers are realizing    the necessity of reforming outdated practices that 3.    ________________ environmental degradation and threaten ecological    balance. To achieve meaningful progress, communities and    industries must 4. __________ in collective climate action,    embrace eco-friendly innovations, and work collaboratively towards    a resilient future.</p>    <p style=\"orphans:0;widows:0\"><b>Select the most appropriate    option to fill in blank no. 2.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    halted</p>", "option2": " <p style=\"orphans:0;widows:0\">    forfeited</p>", "option3": " <p style=\"orphans:0;widows:0\">    diminished</p>", "option4": " <p style=\"orphans:0;widows:0\">    gathered</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (D) gathered</b></p>    <p style=\"orphans:0;widows:0\">The idiom 'gather pace' means to    increase in speed, force, or rate of development. Thus, 'gathered'    correctly completes the phrase 'gathered considerable pace'.    'Halted' (stopped), 'forfeited' (lost as a penalty), and    'diminished' (reduced) contradict the positive trend described in    the sentence.</p>", "question_heading": ""}, {"sr_no": 114, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the following passage, some words have been deleted. Read    the passage carefully and select the most appropriate option to    fill in each blank.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The global    transition towards clean and renewable energy has become an urgent    environmental 1. _____________. Nations across the globe are    setting ambitious climate targets to curb carbon emissions, and    investments in green technologies have 2. _____________    considerable pace over the last decade. Policymakers are realizing    the necessity of reforming outdated practices that 3.    ________________ environmental degradation and threaten ecological    balance. To achieve meaningful progress, communities and    industries must 4. __________ in collective climate action,    embrace eco-friendly innovations, and work collaboratively towards    a resilient future.</p>    <p style=\"orphans:0;widows:0\"><b>Select the most appropriate    option to fill in blank no. 3.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    curb</p>", "option2": " <p style=\"orphans:0;widows:0\">    exacerbate</p>", "option3": " <p style=\"orphans:0;widows:0\">    appease</p>", "option4": " <p style=\"orphans:0;widows:0\">    extinguish</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B) exacerbate</b></p>    <p style=\"orphans:0;widows:0\">The passage mentions reforming    outdated practices that worsen damage and threaten ecological    balance. 'Exacerbate' means to make a problem or negative    situation worse, which fits the context logically. 'Curb'    (restrain), 'appease' (pacify), and 'extinguish' (put an end to)    do not align with the harmful nature of outdated practices    described here.</p>", "question_heading": ""}, {"sr_no": 115, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the following passage, some words have been deleted. Read    the passage carefully and select the most appropriate option to    fill in each blank</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The glob
