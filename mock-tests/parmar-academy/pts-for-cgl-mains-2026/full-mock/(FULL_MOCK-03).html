<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>5.) FULL MOCK-03 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

const questions = [{"sr_no": 1, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following was the only Vice President of India to    die while in office?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    G. S. Pathak</p>", "option2": " <p style=\"orphans:0;widows:0\">    Krishan Kant</p>", "option3": " <p style=\"orphans:0;widows:0\">    B. D. Jatti</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mohammad Hidayatullah</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Krishan Kant served as the 10th Vice President of India from 21    August 1997 until his death on 27 July 2002. He is the only Vice    President of India to have died in office.</p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Match the characteristics/regional names of the rivers in    List-I with the corresponding rivers in List-II:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>List-I (Characteristic / Regional Name)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>A. Langchen Khambab</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>B. Lifeline of Sikkim</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>C. River crossing the Tropic of Cancer twice</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>D. Lavanavari</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>List-II (River)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Teesta</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. Mahi</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. Sutlej</b></p>    <p style=\"orphans:0;widows:0\"><b>4. Luni</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    A - 3, B - 1, C - 2, D - 4</p>", "option2": " <p style=\"orphans:0;widows:0\">    A - 3, B - 2, C - 1, D - 4</p>", "option3": " <p style=\"orphans:0;widows:0\">    A - 4, B - 1, C - 2, D - 3</p>", "option4": " <p style=\"orphans:0;widows:0\">    A - 1, B - 3, C - 4, D - 2</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct matching is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <b>Langchen Khambab (A - 3)</b>: The Sutlej river originates    near Lake Rakshastal in southwestern Tibet, where it is known by    the Tibetan name 'Langchen Khambab' (meaning Elephant's mouth).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <b>Lifeline of Sikkim (B - 1)</b>: The Teesta river flows    through almost the entire length of Sikkim and is regarded as the    lifeline of the state.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <b>River crossing Tropic of Cancer twice (C - 2)</b>: The Mahi    river originates in Madhya Pradesh, passes through Rajasthan, and    enters Gujarat, cutting the Tropic of Cancer twice.</p>    <p style=\"orphans:0;widows:0\">• <b>Lavanavari    (D - 4)</b>: The Luni river originates in the Pushkar valley of    the Aravalli Range and is known as 'Lavanavari' in Sanskrit, which    means 'Salt River' due to its high salinity in the lower reaches.</p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following aggregates represents the income that is    actually available to households for consumption and saving after    the deduction of direct taxes and other non-tax payments to the    government?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    National Income</p>", "option2": " <p style=\"orphans:0;widows:0\">    Personal Disposable Income</p>", "option3": " <p style=\"orphans:0;widows:0\">    Gross National Product</p>", "option4": " <p style=\"orphans:0;widows:0\">    Net Domestic Product</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Personal Disposable Income (PDI) is the net amount of income    actually available to households to spend on consumption or to    save. It is calculated by subtracting personal direct taxes (like    income tax) and other miscellaneous administrative non-tax    receipts (fines, fees) from Personal Income.</p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following chemical compounds is primarily    responsible for the spicy or pungent taste (heat) of chili    peppers?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Capsaicin</p>", "option2": " <p style=\"orphans:0;widows:0\">    Curcumin</p>", "option3": " <p style=\"orphans:0;widows:0\">    Eugenol</p>", "option4": " <p style=\"orphans:0;widows:0\">    Piperine</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Capsaicin is the chemical compound responsible for the spicy,    pungent sensation and heat produced by chili peppers. Curcumin is    found in turmeric, eugenol is the primary component in clove oil,    and piperine is the active compound found in black pepper.</p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0\">    <b>The Chinese traveller Hiuen Tsang (Xuanzang) visited    Kanchipuram, the capital of the Pallavas, during the reign of    which of the following rulers?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Mahendravarman I</p>", "option2": " <p style=\"orphans:0;widows:0\">    Simhavishnu</p>", "option3": " <p style=\"orphans:0;widows:0\">    Narasimhavarman I</p>", "option4": " <p style=\"orphans:0;widows:0\">    Nandivarman II</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Hiuen Tsang (Xuanzang) visited Kanchipuram, the capital of the    Pallava dynasty, around 640 CE during the reign of King    Narasimhavarman I (popularly known as Mamalla). He praised the    ruler's valour and documented the prosperity of the city, noting    the presence of about 100 Buddhist monasteries with over 10,000    monks.</p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    <b>In February 2024, the Parliament passed the Constitution    (Scheduled Tribes) Order (Amendment) Bill, 2024, which modifies    the list of Scheduled Tribes under the Constitution (Scheduled    Tribes) Order, 1950, in relation to which state?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Andhra Pradesh</p>", "option2": " <p style=\"orphans:0;widows:0\">    Rajasthan</p>", "option3": " <p style=\"orphans:0;widows:0\">    Haryana</p>", "option4": " <p style=\"orphans:0;widows:0\">    Maharashtra</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In February 2024, the Parliament passed the Constitution    (Scheduled Tribes) Order (Amendment) Bill, 2024 to amend the    Constitution (Scheduled Tribes) Order, 1950, in relation to the    State of Andhra Pradesh. The legislation added Particularly    Vulnerable Tribal Groups (PVTGs) namely 'Bondo Porja', 'Khond    Porja', and 'Konda Savaras' to the list of Scheduled Tribes of    Andhra Pradesh.</p>", "question_heading": ""}, {"sr_no": 7, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Match the following constitutional provisions with their    corresponding Articles of the Constitution of India:</b></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>List-I (Constitutional Provision)</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>List-II (Article)</b></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>1. Duties and powers of the Comptroller and Auditor-General</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>A. Article 338B</b></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>2. Recommendations of the Finance Commission</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>B. Article 149</b></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>3. Special Officer for Linguistic Minorities</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>C. Article 281</b></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>4. National Commission for Backward Classes</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>D. Article 350B</b></p>      </td>     </tr>    </table>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">    1 - B, 2 - C, 3 - D, 4 - A</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    1 - B, 2 - A, 3 - D, 4 - C</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    1 - C, 2 - B, 3 - A, 4 - D</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    1 - D, 2 - C, 3 - B, 4 - A</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct match is <b>1 - B, 2 - C, 3 - D, 4 - A</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Article 149:</b> Defines the duties and powers of the    Comptroller and Auditor-General of India regarding the accounts of    the Union and the States (whereas Article 148 provides for the    establishment and appointment of the CAG).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Article 281:</b> Pertains to the recommendations of the Finance    Commission, mandating the President to lay every recommendation    along with an explanatory memorandum before each House of    Parliament (whereas Article 280 governs the constitution of the    Finance Commission).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Article 350B:</b> Provides for the appointment of a Special    Officer for Linguistic Minorities by the President (inserted by    the 7th Constitutional Amendment Act, 1956).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Article 338B:</b> Establishes the National Commission for    Backward Classes (NCBC) with constitutional status, inserted    through the 102nd Constitutional Amendment Act, 2018.</p>", "question_heading": ""}, {"sr_no": 8, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Match the positions in List I with the corresponding State/Team    in List II with respect to the final medal tally of the 38ᵗʰ    National Games held in 2025, and select the correct option.</b></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>List I (Position)</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>List II (State/Team)</b></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>A. 1ˢᵗ Position</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>(i) Maharashtra</b></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>B. 2ⁿᵈ Position</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>(ii) Haryana</b></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>C. 3ʳᵈ Position</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>(iii) Madhya Pradesh</b></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>D. 4ᵗʰ Position</b></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <b>(iv) Services Sports Control Board</b></p>      </td>     </tr>    </table>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">    A - (iv), B - (i), C - (ii), D - (iii)</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    A - (i), B - (iv), C - (ii), D - (iii)</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    A - (iv), B - (ii), C - (i), D - (iii)</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    A - (i), B - (iv), C - (iii), D - (ii)</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The 38ᵗʰ National Games were hosted by Uttarakhand from January    to February 2025. The final top standings in the medal tally were    as follows:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1ˢᵗ Position:</b> Services Sports Control Board (SSCB) –    68 Gold, 26 Silver, 27 Bronze (121 total medals) and won the    prestigious Raja Bhalindra Singh Trophy.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2ⁿᵈ Position:</b> Maharashtra – 54 Gold, 71 Silver, 76    Bronze (201 total medals).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3ʳᵈ Position:</b> Haryana – 48 Gold, 47 Silver, 58 Bronze    (153 total medals).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>4ᵗʰ Position:</b> Madhya Pradesh – 34 Gold, 26 Silver, 22    Bronze (82 total medals).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Therefore, the correct matching is: A - (iv), B - (i), C - (ii), D    - (iii).</p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    <b>Viticulture and the intensive commercial production of citrus    fruits are characteristic features of Mediterranean agriculture.    Which of the following regions does NOT belong to this    agricultural belt?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Central Chile</p>", "option2": " <p style=\"orphans:0;widows:0\">    Pampas of Argentina</p>", "option3": " <p style=\"orphans:0;widows:0\">    Central Valley of California</p>", "option4": " <p style=\"orphans:0;widows:0\">    Cape region of South Africa</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Mediterranean agriculture is highly specialized commercial farming    found in regions with a Mediterranean climate (dry summers and    mild, wet winters). Key regions include the lands around the    Mediterranean Sea, the Central Valley of California, Central    Chile, the Cape region of South Africa, and South/South-Western    Australia. These areas are renowned for viticulture (grape    cultivation), olives, and citrus fruits. In contrast, the Pampas    of Argentina is a temperate grassland region characterized    primarily by extensive mechanized grain farming (especially wheat)    and commercial livestock rearing (cattle ranching), not    Mediterranean agriculture.</p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    <b>According to the Big Bang Theory, the origin of the universe is    estimated to have taken place approximately how many years ago?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    4.6 billion years</p>", "option2": " <p style=\"orphans:0;widows:0\">    8.5 billion years</p>", "option3": " <p style=\"orphans:0;widows:0\">    13.7 billion years</p>", "option4": " <p style=\"orphans:0;widows:0\">    18.2 billion years</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    According to the Big Bang Theory and modern cosmological    measurements, the universe originated approximately 13.7 billion    (or ~13.8 billion) years ago from a singularity of infinite    density and temperature. By comparison, our solar system and the    Earth formed much later, approximately 4.5 to 4.6 billion years    ago.</p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following possesses both kinetic energy and    potential energy simultaneously?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    A book resting on a table</p>", "option2": " <p style=\"orphans:0;widows:0\">    A car moving on a level road</p>", "option3": " <p style=\"orphans:0;widows:0\">    A bird flying in the sky</p>", "option4": " <p style=\"orphans:0;widows:0\">    A stretched rubber band</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    A bird flying in the sky has potential energy due to its height    above the ground (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794980778934_html_6788da5623e3d64d.gif\" > )    and kinetic energy due to its motion (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794980778934_html_27c731203e41dfe1.gif\" > ).    Therefore, it possesses both kinetic and potential energy. In    contrast, a book resting on a table has only potential energy, a    car moving on a level road has only kinetic energy, and a    stretched rubber band possesses only elastic potential energy.</p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Match the following Government Schemes (List-I) with their    respective Nodal Ministries (List-II):</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>List-I (Scheme)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>A. PM SVANidhi</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>B. PM-KUSUM</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>C. PM MITRA</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>D. PM-KISAN</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>List-II (Nodal Ministry)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Ministry of New and Renewable Energy</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. Ministry of Housing and Urban Affairs</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. Ministry of Agriculture and Farmers Welfare</b></p>    <p style=\"orphans:0;widows:0\"><b>4. Ministry of    Textiles</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    A - 2, B - 1, C - 4, D - 3</p>", "option2": " <p style=\"orphans:0;widows:0\">    A - 1, B - 2, C - 3, D - 4</p>", "option3": " <p style=\"orphans:0;widows:0\">    A - 2, B - 4, C - 1, D - 3</p>", "option4": " <p style=\"orphans:0;widows:0\">    A - 3, B - 1, C - 4, D - 2</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct match is <b>A - 2, B - 1, C - 4, D - 3</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <b>PM SVANidhi (PM Street Vendor's AtmaNirbhar Nidhi):</b>    Ministry of Housing and Urban Affairs (provides affordable working    capital loans to street vendors).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <b>PM-KUSUM (Pradhan Mantri Kisan Urja Suraksha evam Utthaan    Mahabhiyan):</b> Ministry of New and Renewable Energy (promotes    solar energy generation among farmers).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <b>PM MITRA (Mega Integrated Textile Region and Apparel):</b>    Ministry of Textiles (develops world-class industrial    infrastructure for the textile sector).</p>    <p style=\"orphans:0;widows:0\">• <b>PM-KISAN    (Pradhan Mantri Kisan Samman Nidhi):</b> Ministry of Agriculture    and Farmers Welfare (provides ₹6,000 per year income support to    eligible landholding farmers).</p>", "question_heading": ""}, {"sr_no": 13, "question": "In Aहgहौप 2026, पुध gयॅधनnंधnप यी थुicु ौपोपध िोहncुधक पुध ौपोपधथiकध ‘Mधनi Bधपi–Mधनो Aृुiंोn’ cोंूोign ोiंधक ोप धnुोncing giिनस’ ौोniपोपiयn ीोciिiपiधौ in ौcुयियस ोnक कधॅिधयूing नहनोि inीनोौपनहcपहनध?", "option1": "<p style=\"orphans:0;widows:0\">    Madhya Pradesh</p>", "option2": " <p style=\"orphans:0;widows:0\">    Rajasthan</p>", "option3": " <p style=\"orphans:0;widows:0\">    Chhattisgarh</p>", "option4": " <p style=\"orphans:0;widows:0\">    Jharkhand</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In August 2026, Chhattisgarh Chief Minister Vishnu Deo Sai    launched the statewide ‘Meri Beti–Mera Abhiman’ campaign.    Scheduled to be conducted from August 15, 2026, to January 26,    2027, the campaign focuses on upholding the dignity of daughters,    developing dedicated toilets for girls across rural government    schools, and boosting rural sanitation and infrastructure.</p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0\">    <b>According to the 2011 Census of India, which of the following    states recorded the lowest gap between male and female literacy    rates?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Kerala</p>", "option2": " <p style=\"orphans:0;widows:0\">    Meghalaya</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mizoram</p>", "option4": " <p style=\"orphans:0;widows:0\">    Nagaland</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    According to the 2011 Census of India, <b>Meghalaya</b> recorded    the lowest gender gap in literacy rates at just around 3.1    percentage points (male literacy: 75.95% and female literacy:    72.89%). It was followed by Kerala (approx. 4.0 percentage points)    and Mizoram (approx. 4.1 percentage points). In contrast,    Rajasthan recorded the highest gap between male and female    literacy rates (27.1 percentage points).</p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Match the Prime Ministers of India in List-1 with the Five-Year    Plans initiated during their tenure in List-2:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>List-1 (Prime Minister)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>i. Indira Gandhi</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>ii. Rajiv Gandhi</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>iii. P. V. Narasimha Rao</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>List-2 (Five-Year Plan)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>a. Seventh Five-Year Plan</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>b. Fourth Five-Year Plan</b></p>    <p style=\"orphans:0;widows:0\"><b>c. Eighth    Five-Year Plan</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    i - b, ii - a, iii - c</p>", "option2": " <p style=\"orphans:0;widows:0\">    i - a, ii - b, iii - c</p>", "option3": " <p style=\"orphans:0;widows:0\">    i - c, ii - a, iii - b</p>", "option4": " <p style=\"orphans:0;widows:0\">    i - b, ii - c, iii - a</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct matching is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <b>Indira Gandhi – Fourth Five-Year Plan (1969–1974):</b>    Initiated under Indira Gandhi's tenure, aiming for growth with    stability and progressive self-reliance.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <b>Rajiv Gandhi – Seventh Five-Year Plan (1985–1990):</b>    Launched under Rajiv Gandhi, with a core focus on food, work, and    productivity through technological upgradation.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <b>P. V. Narasimha Rao – Eighth Five-Year Plan (1992–1997):</b>    Launched under P. V. Narasimha Rao after the introduction of    structural economic reforms (LPG) in 1991.</p>    <p style=\"orphans:0;widows:0\">Thus, the correct    sequence is i - b, ii - a, iii - c.</p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following committees was appointed in 1999 by the    Government of India to identify the existence of legal provisions    for the implementation of some of the Fundamental Duties?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Justice Verma Committee</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sarkaria Commission</p>", "option3": " <p style=\"orphans:0;widows:0\">    Venkatachaliah Commission</p>", "option4": " <p style=\"orphans:0;widows:0\">    Punchhi Commission</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Justice Verma Committee on Fundamental Duties of the Citizens    was set up in 1999. It identified the existence of various legal    provisions for the enforcement and implementation of certain    Fundamental Duties, such as the Prevention of Insults to National    Honour Act (1971), the Protection of Civil Rights Act (1955), and    the Wildlife (Protection) Act (1972).</p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <b>Cancer that originates in connective tissues such as bones,    cartilage, fat, muscles, and blood vessels is classified as which    of the following?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Carcinoma</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sarcoma</p>", "option3": " <p style=\"orphans:0;widows:0\">    Leukemia</p>", "option4": " <p style=\"orphans:0;widows:0\">    Lymphoma</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    A <b>Sarcoma</b> is a broad group of cancers that begin in the    bones and soft (connective) tissues, such as muscles, fat, blood    vessels, lymph vessels, and fibrous tissue (tendons and    ligaments). In contrast, <i>Carcinoma</i> originates in epithelial    tissues (skin and organ linings), <i>Leukemia</i> affects    blood-forming tissues like bone marrow, and <i>Lymphoma</i>    develops in the lymphatic system.</p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    <b>With the addition of </b><b>Sukhna Wetland (Chandigarh)</b><b>    and </b><b>Sauj Jheel (Mainpuri, Uttar Pradesh)</b><b> in October    2026, what is the total number of Ramsar sites in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    98</p>", "option2": " <p style=\"orphans:0;widows:0\">    101</p>", "option3": " <p style=\"orphans:0;widows:0\">    103</p>", "option4": " <p style=\"orphans:0;widows:0\">    105</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Announcement &amp; Date:</b> On <b>October 16, 2026</b>, Union    Minister for Environment, Forest and Climate Change <b>Bhupender    Yadav</b> announced the designation of two new Ramsar sites in    India, raising the country's total tally of Wetlands of    International Importance from 101 to <b>103</b>.</p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sukhna     Wetland (Chandigarh):</b> An artificial, rain-fed lake created in     1958 by damming the Sukhna Choe at the foothills of the Shivalik     Hills; it became <b>Chandigarh's first Ramsar site</b>.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Sauj Jheel (Mainpuri,     Uttar Pradesh):</b> A natural freshwater marsh located in the     Ganga basin in Mainpuri district, serving as an important habitat     for resident and migratory waterbirds (including Sarus cranes).</p>    </li></ol>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following authored 'Humayun-Nama', which provides    a detailed account of the reign of Mughal Emperor Humayun?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Gulbadan Begum</p>", "option2": " <p style=\"orphans:0;widows:0\">    Jahanara Begum</p>", "option3": " <p style=\"orphans:0;widows:0\">    Nur Jahan</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mumtaz Mahal</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <b>Gulbadan Begum</b>, the daughter of Emperor Babur and sister of    Emperor Humayun, authored the 'Humayun-Nama'. She was requested by    her nephew, Emperor Akbar, to record her memories of Babur and    Humayun, resulting in this valuable historical chronicle written    in Persian.</p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <b>If the absolute temperature of an ideal gas is doubled, the    average kinetic energy of its molecules will:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    remain unchanged</p>", "option2": " <p style=\"orphans:0;widows:0\">    be halved</p>", "option3": " <p style=\"orphans:0;widows:0\">    be doubled</p>", "option4": " <p style=\"orphans:0;widows:0\">    become four times</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    According to the kinetic theory of gases, the average    translational kinetic energy per molecule of an ideal gas is given    by the relation     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794980778934_html_9cb8c4cce845ad2b.gif\" > ,    where     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794980778934_html_59bea7d116fc4b70.gif\" >     is the Boltzmann constant and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794980778934_html_eeed4abb2afae95c.gif\" >     is the absolute temperature in Kelvin. This indicates that the    average kinetic energy is directly proportional to the absolute    temperature (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794980778934_html_fc98f27c59698544.gif\" > ).    Therefore, when the absolute temperature is doubled, the average    kinetic energy of the molecules also doubles.</p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following is frequently cited by economists as a    major limitation or criticism of the New Economic Policy of 1991    in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    It caused a severe contraction of the services sector</p>", "option2": " <p style=\"orphans:0;widows:0\">    It led to inadequate public investment and neglect of the    agricultural sector</p>", "option3": " <p style=\"orphans:0;widows:0\">    It completely banned foreign direct investment in core industries</p>", "option4": " <p style=\"orphans:0;widows:0\">    It re-imposed strict industrial licensing on small-scale    enterprises</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    A major criticism of the 1991 New Economic Policy (LPG reforms)    was the relative neglect of the agricultural sector. During the    post-reform period, public investment in rural infrastructure—such    as irrigation, power, transport, and agricultural    research—declined significantly. Furthermore, the reduction of    input subsidies increased production costs for small farmers,    leading to widespread agrarian distress and widening the    rural-urban economic divide.</p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <b>The elements belonging to Group 16 of the Modern Periodic Table    are commonly known as which of the following?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Halogens</p>", "option2": " <p style=\"orphans:0;widows:0\">    Chalcogens</p>", "option3": " <p style=\"orphans:0;widows:0\">    Pnictogens</p>", "option4": " <p style=\"orphans:0;widows:0\">    Alkaline earth metals</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The elements of Group 16 (Oxygen, Sulfur, Selenium, Tellurium, and    Polonium) are commonly known as <b>chalcogens</b>, which derived    from Greek words meaning \"ore-forming\" elements, as many    metals are found in the Earth's crust as oxides or sulfides. Group    15 elements are called pnictogens, Group 17 are halogens, and    Group 2 are alkaline earth metals.</p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Match List-I with List-II.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>List-I (Acid)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>A. Malic acid</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>B. Formic acid</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>C. Tartaric acid</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>D. Oxalic acid</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>List-II (Natural Source)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Spinach</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. Ant sting</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. Tamarind</b></p>    <p style=\"orphans:0;widows:0\"><b>4. Apple</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    A - 4, B - 2, C - 3, D - 1</p>", "option2": " <p style=\"orphans:0;widows:0\">    A - 3, B - 1, C - 4, D - 2</p>", "option3": " <p style=\"orphans:0;widows:0\">    A - 4, B - 1, C - 3, D - 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    A - 2, B - 4, C - 1, D - 3</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct match is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <b>Malic acid</b> is primarily found in <b>apples</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <b>Formic acid</b> (methanoic acid) is present in <b>ant    stings</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <b>Tartaric acid</b> is found naturally in <b>tamarind</b> and    grapes.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <b>Oxalic acid</b> is found in <b>spinach</b> and tomatoes.</p>    <p style=\"orphans:0;widows:0\">Therefore, the    correct combination is A - 4, B - 2, C - 3, D - 1.</p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Identify the INCORRECTLY matched pair(s) of the British    Governor-Generals/Viceroys of India and the events with which they    are associated.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>(i) Lord Cornwallis - Permanent Settlement of Bengal</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>(ii) Lord Dalhousie - Partition of Bengal</b></p>    <p style=\"orphans:0;widows:0\"><b>(iii) Lord    Ripon - Enactment of the Vernacular Press Act</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only (i) and (ii)</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only (ii) and (iii)</p>", "option3": " <p style=\"orphans:0;widows:0\">    Only (i)</p>", "option4": " <p style=\"orphans:0;widows:0\">    (i), (ii) and (iii)</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Pairs (ii) and (iii) are incorrectly matched.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <b>Pair (i) is correctly matched:</b> The Permanent Settlement    of Bengal was introduced by Lord Cornwallis in 1793.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • <b>Pair (ii) is incorrectly matched:</b> The Partition of    Bengal took place in 1905 under Lord Curzon, not Lord Dalhousie.</p>    <p style=\"orphans:0;widows:0\">• <b>Pair (iii)    is incorrectly matched:</b> The Vernacular Press Act was enacted    in 1878 under Lord Lytton (Lord Ripon repealed it in 1882).</p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">
