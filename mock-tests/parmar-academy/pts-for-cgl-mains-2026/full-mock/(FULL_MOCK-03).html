ze:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image028.png\" width=\"111\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image029.png\" width=\"111\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, (265, 230, 185) follows the same pattern.</span></p>", "question_heading": ""}, {"sr_no": 128, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which two signs and two numbers should be interchanged to make the given equation correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image030.png\" width=\"173\" height=\"21\" alt style=\"vertical-align:middle\" ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>+ and -, 9 and 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>+ and -, 3 and 8</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>× and +, 9 and 8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>× and ÷, 8 and 4</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">By interchanging the signs + and - and the numbers 3 and 8:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image031.png\" width=\"173\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the BODMAS rule:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image032.png\" width=\"131\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image033.png\" width=\"113\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image034.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image035.png\" width=\"57\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (LHS = RHS)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, the correct interchange is + and -, 3 and 8.</span></p>", "question_heading": ""}, {"sr_no": 129, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a certain code language, 'sky is deep blue' is coded as 'ka na ro ta', 'blue sea looks beautiful' is coded as 'ro pa mu de', and 'sea is very deep' is coded as 'ka ta de zo'. How is 'sky' coded in that language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ka</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ro</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>na</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ta</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image036.png\" width=\"490\" height=\"123\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, 'sky' is coded as 'na'.</span></p>", "question_heading": ""}, {"sr_no": 130, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Directions: A statement is given followed by two inferences numbered I and II. You have to consider the statement to be true even if it seems to be at variance with commonly known facts. You have to decide which of the given inferences logically follows from the given statement.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statement:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Scientific observations establish that exposure to blue light emitted by digital screens suppresses the secretion of melatonin, a vital hormone regulating sleep cycles, thereby increasing the likelihood of insomnia. Nonetheless, a recent survey revealed that nearly 40% of habitual late-night screen users consistently report restful and uninterrupted sleep.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Inferences:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. Blue light exposure fails to suppress melatonin production in nearly 40% of late-night screen users.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. Susceptibility to screen-induced insomnia varies, and melatonin suppression does not invariably result in disrupted sleep.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only inference I follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only inference II follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both inferences I and II follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither inference I nor II follows</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Inference I does not follow.</span><span> The survey measured reported sleep quality. It gives no information about melatonin levels in the 40% who reported restful sleep.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Inference II follows.</span><span> Melatonin suppression increases the risk of insomnia. Some late-night screen users still report restful sleep, so sleep disruption is not inevitable.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, only inference II follows.</span></p>", "question_heading": ""}, {"sr_no": 131, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Directions: The symbols #, @, &amp;, $, and % are used with the following meanings:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'P # Q' means 'P is greater than Q'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'P @ Q' means 'P is smaller than Q'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'P &amp; Q' means 'P is equal to Q'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'P $ Q' means 'P is not smaller than Q'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'P % Q' means 'P is not greater than Q'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Assuming the given statements to be true, find which of the conclusion(s) is/are definitely true.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statements: D $ M, M &amp; K, K % T, T @ W</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. D # T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. D % T</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If only conclusion I is true</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If only conclusion II is true</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If either conclusion I or conclusion II is true</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If neither conclusion I nor conclusion II is true</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Decoding the symbols according to the given conditions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D ≥ M, M = K, K ≤ T, T &lt; W</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combining the statements: D ≥ M = K ≤ T &lt; W</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Analyzing the relationship between D and T:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From D ≥ K ≤ T, the symbols between D and T face in opposite directions. Therefore, no definite single relationship can be established between D and T, meaning all three possibilities exist: D &gt; T, D &lt; T, or D = T.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Now examining the conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Conclusion I:</span><span> D &gt; T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Conclusion II:</span><span> D ≤ T (i.e., D &lt; T or D = T)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold;font-style:italic\">Together, Conclusions I and II cover all three possible relations (&gt;, &lt;, =).</span><span> </span><span style=\"font-weight:bold\">Hence, either conclusion I or conclusion II is true.</span></p>", "question_heading": ""}, {"sr_no": 132, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">At what time between 5:30 and 6:00 will the hands of a clock be at a right angle?</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image037.png\" width=\"35\" height=\"29\" alt style=\"vertical-align:middle\" ><span> minutes past 5</span></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image038.png\" width=\"35\" height=\"29\" alt style=\"vertical-align:middle\" ><span> minutes past 5</span></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image039.png\" width=\"35\" height=\"29\" alt style=\"vertical-align:middle\" ><span> minutes past 5</span></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image040.png\" width=\"35\" height=\"29\" alt style=\"vertical-align:middle\" ><span> minutes past 5</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">The angle </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image041.png\" width=\"10\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> between the hands of a clock is given by the formula:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image042.png\" width=\"123\" height=\"29\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Here, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image043.png\" width=\"42\" height=\"21\" alt style=\"vertical-align:middle\" ><span> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image044.png\" width=\"54\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since the required time is between 5:30 and 6:00, the minute hand has already crossed the hour hand (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image045.png\" width=\"53\" height=\"21\" alt style=\"vertical-align:middle\" ><span>):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image046.png\" width=\"128\" height=\"29\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image047.png\" width=\"114\" height=\"29\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image048.png\" width=\"78\" height=\"29\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image049.png\" width=\"111\" height=\"29\" alt style=\"vertical-align:middle\" ><span> minutes.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the hands are at a right angle at </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image037.png\" width=\"35\" height=\"29\" alt style=\"vertical-align:middle\" ><span> minutes past 5. (Note: The other right angle occurs at </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image038.png\" width=\"35\" height=\"29\" alt style=\"vertical-align:middle\" ><span> minutes past 5, which is before 5:30).</span></p>", "question_heading": ""}, {"sr_no": 133, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Direction: Read the following information carefully and answer the question given below.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Eight persons J, K, L, M, N, O, P, and Q work in eight different companies namely Apple, Google, Microsoft, Amazon, Meta, Tesla, Netflix, and Adobe, but not necessarily in the same order.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">L works at Microsoft. O works at Meta. K works at either Apple or Tesla. N does not work at Amazon, Google, Adobe, or Netflix. N does not work at Apple either. P does not work at Google, Amazon, Apple, or Tesla. J does not work at Google, Amazon, or Netflix. Neither J nor Q works at Apple. M does not work at Google or Adobe.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following combinations is TRUE?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P - Adobe</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M - Amazon</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>J - Netflix</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q - Tesla</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the given clues, we can deduce the arrangement step-by-step:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">L </span><span>works at </span><span style=\"font-weight:bold\">Microsoft </span><span>and </span><span style=\"font-weight:bold\">O</span><span> works at </span><span style=\"font-weight:bold\">Meta.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. N cannot work at Amazon, Google, Adobe, Netflix, Apple, Microsoft, or Meta. Therefore, </span><span style=\"font-weight:bold\">N must work at Tesla.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. K works at either Apple or Tesla. Since Tesla is occupied by N, </span><span style=\"font-weight:bold\">K works at Apple.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. The remaining companies are Google, Amazon, Netflix, and Adobe for the remaining persons J, M, P, and Q.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. J does not work at Google, Amazon, or Netflix. Thus, </span><span style=\"font-weight:bold\">J works at Adobe.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. P does not work at Google, Amazon, Apple, or Tesla. Since Adobe is taken by J, </span><span style=\"font-weight:bold\">P must work at Netflix</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7. M does not work at Google. Hence, </span><span style=\"font-weight:bold\">M works at Amazon</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8. The remaining person </span><span style=\"font-weight:bold\">Q works at the remaining company, Google.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Final Arrangement:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image050.png\" width=\"236\" height=\"429\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, the combination 'M - Amazon' is TRUE.</span></p>", "question_heading": ""}, {"sr_no": 134, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In this question, a question is followed by two statements numbered (I) and (II). You have to decide whether the data provided in the statements are sufficient to answer the question. Read both the statements and decide the appropriate answer.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Question: How is P related to T?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(I) M is the mother of P and has only two children — one son and one daughter. T is the paternal grandfather of K, who is the son of P's only brother.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(II) T is the husband of M. M is the mother of P. R is the brother of P.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(II) alone is sufficient while (I) alone is not sufficient.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(I) alone is sufficient while (II) alone is not sufficient.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both (I) and (II) together are needed.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Either (I) alone or (II) alone is sufficient.</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statement I:</span><span> M has one son and one daughter. Since P has a brother, P is the daughter. K is the son of P’s brother, so K’s paternal grandfather, T, is the father of P’s brother. Thus, P is T’s daughter.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statement II:</span><span> R is P’s brother, but P’s gender is unspecified. So P could be T’s son or daughter.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, (I) alone is sufficient while (II) alone is not sufficient.</span></p>", "question_heading": ""}, {"sr_no": 135, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A word-and-number arrangement machine, when given an input line of words and numbers, rearranges them following a particular rule in each step. The following is an illustration of input and rearrangement:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Input: victory 84 27 draft 91 silver 45 alert</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Step I: alert victory 84 27 draft silver 45 91</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Step II: alert draft victory 27 silver 45 91 84</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Step III: alert draft silver victory 27 91 84 45</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Step IV: alert draft silver victory 91 84 45 27</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Step IV is the last step of the rearrangement.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">As per the rules followed in the above steps, find out the Step III arrangement for the given input:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Input: 38 honest 74 brave 15 active 92 royal</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>active brave honest royal 15 92 74 38</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>active brave honest 15 royal 92 74 38</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>active brave 38 honest 15 royal 92 74</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>active brave honest 15 royal 92 38 74</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Pattern/Rule:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In each step:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. The alphabetically smallest unarranged word is placed on the left side (immediately following the previously arranged words).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. The largest unarranged number is moved to the extreme right end.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3. The remaining elements retain their relative positions in the middle.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given Input: 38 honest 74 brave 15 active 92 royal</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">Step I:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Smallest word = 'active'; Largest number = 92.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Remaining in order: 38, honest, 74, brave, 15, royal</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Arrangement: active 38 honest 74 brave 15 royal 92</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">Step II:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Next word = 'brave'; Next largest number = 74.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Remaining in order: 38, honest, 15, royal</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Arrangement: active brave 38 honest 15 royal 92 74</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">Step III:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Next word = 'honest'; Next largest number = 38.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Remaining in order: 15, royal</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Arrangement: </span><span style=\"font-weight:bold\">active brave honest 15 royal 92 74 38</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, Option B is correct.</span></p>", "question_heading": ""}, {"sr_no": 136, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Some cameras are lenses.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">All lenses are stands.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">No stand is a drone.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">All drones are sensors.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. Some cameras are stands.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. No lens is a drone.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">III. No sensor is a stand.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusions I and II follow</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusions II and III follow</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All conclusions I, II and III follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion I follows</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements, we can deduce the following:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image051.png\" width=\"429\" height=\"189\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- </span><span style=\"font-weight:bold\">I follows.</span><span> Some cameras are lenses, and all lenses are stands. So those cameras are stands.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- </span><span style=\"font-weight:bold\">II follows.</span><span> All lenses are stands, and no stand is a drone. So no lens is a drone.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- </span><span style=\"font-weight:bold\">III does not follow.</span><span> All drones are sensors, but sensors outside the drone group may be stands.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, only conclusions I and II follow.</span></p>", "question_heading": ""}, {"sr_no": 137, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the option that represents the correct order of the given words as they would appear in an English dictionary.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">1. Inquisitive</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">2. Inquisitorial</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">3. Inquirer</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">4. Inquisition</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">5. Inquire</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">6. Inquiry</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5, 3, 6, 4, 1, 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5, 3, 6, 1, 4, 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5, 6, 3, 4, 2, 1</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3, 5, 6, 4, 1, 2</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>To find the correct dictionary order, compare the words letter by letter from left to right:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Correct order — 5, 3, 6, 4, 1, 2</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Inquire </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold\"> Inquirer </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold\"> Inquiry </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold\"> Inquisition </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold\"> Inquisitive </span><span style=\"font-family:Arial;font-weight:bold\">→</span><span style=\"font-weight:bold\"> Inquisitorial</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Short trick:</span><span> All six words begin with </span><span style=\"font-weight:bold\">Inqui.</span><span> Compare the next letter: r comes before s. When one word is the complete start of another, the shorter word comes first, so </span><span style=\"font-weight:bold\">Inquire</span><span> comes before </span><span style=\"font-weight:bold\">Inquirer.</span><span> </span></p>", "question_heading": ""}, {"sr_no": 138, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Ankit visits a library on the first Monday of every month. Last month, he visited the library on 7th April. Today, he is visiting the library again. What is today's date?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3rd May</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4th May</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5th May</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6th May</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given that 7th April was a Monday.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Number of days in April = 30.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mondays in April fall on:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7th April</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7 + 7 = 14th April</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14 + 7 = 21st April</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>21 + 7 = 28th April</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The next Monday will be after 7 days from 28th April, which is: 28 + 7 = 35th day.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since April has 30 days: 35 - 30 = 5th May.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the first Monday of May falls on 5th May, which is today's date.</span></p>", "question_heading": ""}, {"sr_no": 139, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Four witnesses tried to recall the registration code of a delivery van. Each recorded a slightly different code: BR7KQ9, BR7MQ9, BT7KQ9, and BR2KQ9. When their notes were compared, they found that all four agreed on the first letter and the last two characters, three agreed that the second letter was R, three agreed that the third character was the digit 7, and three agreed that the fourth letter was K. Which of the following is most likely the correct registration code?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BR7MQ9</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BT7KQ9</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BR7KQ9</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BR2KQ9</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Analyzing the consensus among the four witnesses for each position of the 6-character code:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- </span><span style=\"font-weight:bold\">1st character:</span><span> All four agree on 'B'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- </span><span style=\"font-weight:bold\">2nd character:</span><span> Three witnesses agree on 'R' (while one has 'T').</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt 1_image071.png\" width=\"102\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image072.png\" width=\"111\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image073.png\" width=\"111\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image074.png\" width=\"111\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image075.png\" width=\"111\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image076.png\" width=\"111\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the missing number is 288.</span></p>", "question_heading": ""}, {"sr_no": 143, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the set in which the numbers are related in the same way as are the numbers of the following sets. (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding /subtracting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(3, 36, 6) (5, 48, 7)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4, 40, 5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6, 54, 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2, 30, 4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7, 60, 8</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">The logic followed here is: Second number = (First number + Third number) × 4</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For (3, 36, 6): (3 + 6) × 4 = 9 × 4 = 36</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For (5, 48, 7): (5 + 7) × 4 = 12 × 4 = 48</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Checking the options:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A) 4, 40, 5 → (4 + 5) × 4 = 36 ≠ 40</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B) 6, 54, 3 → (6 + 3) × 4 = 36 ≠ 54</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C) 2, 30, 4 → (2 + 4) × 4 = 24 ≠ 30</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D) 7, 60, 8 → (7 + 8) × 4 = 15 × 4 = 60</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, the correct set is (7, 60, 8).</span></p>", "question_heading": ""}, {"sr_no": 144, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">What will come in place of '?' in the dle\" ><span style=\"font-weight:bold\">' with '</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image078.png\" width=\"19\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">' and '</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image079.png\" width=\"20\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">' with '</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image080.png\" width=\"20\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">', the equation becomes:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image082.png\" width=\"199\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the BODMAS rule:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image083.png\" width=\"149\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image084.png\" width=\"121\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image085.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image086.png\" width=\"48\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, 141 will come in place of '?'.</span></p>", "question_heading": ""}, {"sr_no": 145, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Three of the following four word pairs are alike in a certain way and thus form a group. Select the word pair that does NOT belong to that group.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cardiologist - Heart</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Nephrologist - Kidneys</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Orthodontist - Bones</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Dermatologist - Skin</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In all pairs except 'Orthodontist - Bones', the first term is a medical specialist and the second term is the specific organ/body part they treat:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A </span><span style=\"font-weight:bold\">Cardiologist</span><span> specializes in the heart.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A </span><span style=\"font-weight:bold\">Nephrologist</span><span> specializes in the kidneys.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A </span><span style=\"font-weight:bold\">Dermatologist</span><span> specializes in the skin.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>However, an </span><span style=\"font-weight:bold\">Orthodontist</span><span> specializes in the correction and alignment of teeth and jaws. A specialist who treats diseases and injuries of the bones and musculoskeletal system is an </span><span style=\"font-weight:bold\">Orthopedist</span><span> (or Orthopedic surgeon). Hence, 'Orthodontist - Bones' is the odd one out.</span></p>", "question_heading": ""}, {"sr_no": 146, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a class of students, Rohit is ranked 11th from the top and Vikas is ranked 20th from the bottom. Mayank is ranked exactly midway between Rohit and Vikas. If Mayank is ranked 18th from the top, how many students are there in the class?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>42</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>44</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>45</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>46</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Rohit is 11th from the top and Mayank is 18th from the top.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Number of students between Rohit and Mayank = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image087.png\" width=\"113\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Since Mayank is exactly midway between Rohit and Vikas, the number of students between Mayank and Vikas is also 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Position of Vikas from the top = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image088.png\" width=\"113\" height=\"21\" alt style=\"vertical-align:middle\" ><span>th.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Vikas is also ranked 20th from the bottom.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Total number of students = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795113694741_image089.png\" width=\"457\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">.</span></p>", "question_heading": ""}, {"sr_no": 147, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Read the given statement and answer the question that follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statement: To curb rising absenteeism, a manufacturing company introduced a performance-linked monetary bonus for workers who achieve 100% monthly attendance. Although overall monthly attendance improved by 15% over the subsequent quarter, the company's total production volume declined by 8% during the same period.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following can be inferred from the given statement? (An inference is something which is not directly stated but can be logically derived from the given facts.)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I) An improvement in employee attendance does not automatically guarantee an increase in total production volume.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II) The monetary bonus scheme caused workers to deliberately slow down their pace of work.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only (I) can be inferred</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only (II) can be inferred</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both (I) and (II) can be inferred</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither (I) nor (II) can be inferred</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">I follows. </span><span>Attendance improved by 15%, yet production fell by 8%. This shows that better attendance alone does not guarantee higher production.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">II does not follow</span><span>. The statement gives no evidence that workers deliberately slowed down or that the bonus caused the decline in production.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, only (I) can be inferred.</span></p>", "question_heading": ""}, {"sr_no": 148, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Seven persons — P, Q, R, S, T, U, and V — attend a seminar in different months of the same year, namely March, April, May, June, August, September, and November, but not necessarily in the same order. Three persons attend between R and T, where T attends in a month having 30 days. V attends immediately after R. As many persons attend before V as after S. P attends in a month having 31 days but not in March. Only one person attends between P and U. Q attends before U. Which of the following statements is correct?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U attends the seminar in May.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three persons attend between S and Q.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q attends the seminar in June.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T attends the seminar immediately after P.</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three persons attend between R and T, where T attends in a month having 30 days, and V attends immediately after R.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- If T attends in April (30 days), R must attend in September (30 days), and V attends immediately after R in November.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- Since 6 persons attend before V, 6 persons must attend after S, meaning S attends in March.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P attends in a month with 31 days but not in March, so P must attend in May or August.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- Only one person attends between P and U, and Q attends before U. Placing P in May means U attends in August and Q attends in June (satisfying that Q is before U).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(If P were placed in August, U would be in May, placing Q after U, which contradicts the given condition).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The final arrangement is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. March (31) – S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. April (30) – T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3. May (31) – P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">4. June (30) – Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">5. August (31) – U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">6. September (30) – R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">7. November (30) – V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the statement 'Q attends the seminar in June' is correct.</span></p>", "question_heading": ""}, {"sr_no": 149, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Read the following information and answer the question that follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">\"While adopting agile software development methodologies significantly shortens feature release cycles, an organization's overall software delivery performance improves only when cross-functional collaboration between developers and operations teams is seamlessly established.\"</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following can be inferred from the given statement? (An inference is something which is not directly stated but can be derived from the given facts/information in the statement)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. Adopting agile software development methodologies leads to a significant reduction in the duration of feature release cycles.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. Accelerating feature development alone may not guarantee superior overall software delivery outcomes unless inter-departmental operational barriers are addressed.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only (I) can be inferred</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only (II) can be inferred</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both (I) and (II) can be inferred</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither (I) nor (II) can be inferred</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-style:italic\">An inference is a logical deduction derived from the given premises that is not explicitly stated.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">I is directly stated.</span><span> The statement explicitly says that adopting agile methods significantly shortens feature release cycles. I simply restates that point.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">II follows.</span><span> Faster feature releases alone cannot ensure better overall software delivery. The statement makes effective collaboration between developers and operations teams a necessary condition for improvement.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, only (II) can be inferred.</span></p>", "question_heading": ""}, {"sr_no": 150, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the set in which the numbers are related in the same way as are the numbers of the following sets. (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding /subtracting /multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(4, 3, 20) (5, 2, 18)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3, 7, 25</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6, 3, 26</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4, 5, 24</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2, 8, 20</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">The logic followed here is: Third number = (First number × Second number) + 8</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For (4, 3, 20): (4 × 3) + 8 = 12 + 8 = 20</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For (5, 2, 18): (5 × 2) + 8 = 10 + 8 = 18</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Checking the options:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A) 3, 7, 25 → (3 × 7) + 8 = 21 + 8 = 29 ≠ 25</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B) 6, 3, 26 → (6 × 3) + 8 = 18 + 8 = 26</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C) 4, 5, 24 → (4 × 5) + 8 = 20 + 8 = 28 ≠ 24</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D) 2, 8, 20 → (2 × 8) + 8 = 16 + 8 = 24 ≠ 20</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, the correct set is (6, 3, 26).</span></p>", "question_heading": ""}];

  return str && (str.startsWith('http://') || str.startsWith('https://'));

    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;

    if (now - lastTouchEnd <= 300) {

}
