orrect because it omits the preposition <i>at</i>.</p>    <p style=\"orphans:0;widows:0\"><b>Option D</b> is incorrect    because it changes the tense to the Past Perfect (<i>had been</i>).</p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in direct    speech.</p>    <p style=\"orphans:0;widows:0\">The warden ordered the students    to return to their rooms and switch off those lights.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The warden said to the students, \"Return to their rooms and    switch off these lights.\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    The warden said to the students, \"Return to your rooms and    switch off these lights.\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    The warden said to the students, \"Returned to your rooms and    switch off those lights.\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    The warden said to the students, \"Return to your rooms and    switching off these lights.\"</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert an indirect imperative sentence into direct speech, the    following rules are followed:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     reporting verb 'ordered' is changed to 'said to'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     infinitive 'to return' is replaced by the base verb 'Return'     inside inverted commas to form an imperative sentence.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     third-person possessive pronoun 'their' changes to the     second-person 'your' as the speaker is directly addressing the     students.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     demonstrative adjective 'those' changes to 'these'.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence, option B is the correct    direct speech sentence.</p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate meaning of the underlined idiom.</p>    <p style=\"orphans:0;widows:0\">Instead of delaying the    confrontation, the manager decided to <u><b>take the bull by the    horns</b></u>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    To postpone taking action on a matter</p>", "option2": " <p style=\"orphans:0;widows:0\">    To deal decisively with a difficult situation</p>", "option3": " <p style=\"orphans:0;widows:0\">    To yield completely to the opponent's demands</p>", "option4": " <p style=\"orphans:0;widows:0\">    To behave aggressively without any reason</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The idiom <b>'take the bull by the horns'</b> means to face a    difficult or dangerous situation directly, boldly, and with    determination. Therefore, 'To deal decisively with a difficult    situation' is the correct meaning.</p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in active    voice.</p>    <p style=\"orphans:0;widows:0\">Why has the proposal not been    acceded to by the directors?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Why have the directors not acceded to the proposal?</p>", "option2": " <p style=\"orphans:0;widows:0\">    Why has the directors not acceded to the proposal?</p>", "option3": " <p style=\"orphans:0;widows:0\">    Why have the directors not acceded the proposal?</p>", "option4": " <p style=\"orphans:0;widows:0\">    Why did the directors not accede to the proposal?</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the passive voice and in the present    perfect interrogative form:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Passive    Voice:</b> Wh-word + has/have + subject + not + been + V3 +    preposition + by + agent?</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">To     convert it into the <b>Active Voice</b>, follow the structure:</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Wh-word     + have/has + subject (agent) + not + V3 + preposition + object?</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     agent <i>the directors</i> is plural, so the auxiliary verb must     be <b>have</b> (ruling out option B).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     preposition <b>to</b> must be retained after the verb <i>accede</i>     (ruling out option C).</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The tense    must remain present perfect, not simple past (ruling out option    D).</p>    <p style=\"orphans:0;widows:0\">Hence, <b>Why have the directors    not acceded to the proposal?</b> is the correct active form.</p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Complete the dialogue for Person B using the most appropriate    idiom.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Person A: Our    rival firm launched their product a full month before our    scheduled release and captured the market first.</p>    <p style=\"orphans:0;widows:0\">Person B: I know. They have    definitely managed to __________ us.</p>", "option1": "<p style=\"orphans:0;widows:0\">    steal a march on</p>", "option2": " <p style=\"orphans:0;widows:0\">    throw down the gauntlet to</p>", "option3": " <p style=\"orphans:0;widows:0\">    show a clean pair of heels to</p>", "option4": " <p style=\"orphans:0;widows:0\">    blow hot and cold with</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct idiom is <b>steal a march on</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meaning of    the idiom:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><i>To     steal a march on someone</i> means to gain an advantage over a     competitor or opponent by acting secretly or earlier than they     do.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In the given    context, Person A states that the rival firm launched their    product earlier and captured the market, so Person B confirms that    they managed to 'steal a march on' them.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meanings    of other options:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <i>Throw    down the gauntlet</i>: To issue a challenge or invite someone to    fight/compete.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <i>Show a    clean pair of heels</i>: To run away very fast or outrun someone    in a physical chase.</p>    <p style=\"orphans:0;widows:0\">• <i>Blow hot and cold</i>: To    keep changing one's mind or attitude unpredictably.</p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">It took several rounds of    negotiation before the union could prevail ________ the management    to accept their demands.</p>", "option1": "<p style=\"orphans:0;widows:0\">    over</p>", "option2": " <p style=\"orphans:0;widows:0\">    upon</p>", "option3": " <p style=\"orphans:0;widows:0\">    against</p>", "option4": " <p style=\"orphans:0;widows:0\">    into</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>upon</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Explanation:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     phrasal verb <b>'prevail on/upon somebody (to do something)'</b>     means to persuade or convince someone to do something, usually     after considerable effort or urging.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><i>Example:</i>    We finally prevailed upon him to deliver the keynote address.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In contrast:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>'Prevail    over/against'</b> means to triumph over, conquer, or defeat an    adversary or obstacle (e.g., <i>Truth will always prevail over    falsehood</i>).</p>    <p style=\"orphans:0;widows:0\">Since the sentence speaks about    persuading the management to accept the demands, <b>upon</b> is    the grammatically and contextually correct preposition.</p>", "question_heading": ""}, {"sr_no": 64, "question": "Pोनपौ यी ो ौधnपधncध ोनध giॅधn ृिधयथ in ुहंृिधक यनकधन. Aननोngध पुध ूोनपौ in पुध cयननधcप यनकधन पय ीयनं ो ंधोningीिह ौधnपधncध. ो. ुयथ inकiॅiकहोिस ूधनcधiॅध ोकॅधनौiपद, ृहप ोिसय ृ. पुध ौहृिपध inपधनूिोद ृधपथधधn gधnधपic ूनधकiौूयौiपiयn c. ुयथ धीीधcपiॅिधद पुधद ोकोूप पय ूौदcुिययgicोि पनोहंो क. ोnक धnॅiनयnंधnपोि ौपनधौौयनौ यीपधn कicपोपधौ nयप यnिद", "option1": "<p style=\"orphans:0;widows:0\">    bdac</p>", "option2": " <p style=\"orphans:0;widows:0\">    badc</p>", "option3": " <p style=\"orphans:0;widows:0\">    dbac</p>", "option4": " <p style=\"orphans:0;widows:0\">    bcda</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To arrange the sentence correctly, follow the grammatical links:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>Subject    identification:</b> Part <b>b</b> introduces the main subject    phrase: <i>\"the subtle interplay between genetic    predisposition...\"</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2.    <b>Prepositional pair:</b> The preposition <i>'between'</i>    requires <i>'and'</i> to complete the compound structure (<i>between    X and Y</i>). Part <b>d</b> provides this: <i>\"and    environmental stressors often dictates not only...\"</i>, so <b>b</b>    is followed by <b>d</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3.    <b>Correlative conjunction:</b> Part <b>d</b> ends with <i>\"not    only\"</i>, which must pair with <i>\"but also\"</i>    found in part <b>a</b>: <i>\"how individuals perceive    adversity, but also...\"</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. <b>Parallel    structure:</b> Part <b>a</b> concludes with <i>\"but also\"</i>,    followed smoothly by the parallel subordinate clause in part <b>c</b>:    <i>\"how effectively they adapt to psychological trauma\"</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Combining    these gives the complete sentence: <i>\"The subtle interplay    between genetic predisposition and environmental stressors often    dictates not only how individuals perceive adversity, but also how    effectively they adapt to psychological trauma.\"</i></p>    <p style=\"orphans:0;widows:0\">Therefore, the correct sequence    is <b>bdac</b>.</p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Of the two shortlisted candidates    for the managerial post, Mr. Sharma is definitely the ________    choice.</p>", "option1": "<p style=\"orphans:0;widows:0\">    better</p>", "option2": " <p style=\"orphans:0;widows:0\">    best</p>", "option3": " <p style=\"orphans:0;widows:0\">    more better</p>", "option4": " <p style=\"orphans:0;widows:0\">    well</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>better</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">When a     comparison or selection is made between exactly two persons or     things, the comparative degree of the adjective is used, preceded     by the definite article 'the' (structure: <i>the + comparative     degree + of the two</i>). The superlative degree ('best') is used     only when comparing three or more entities.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Since the sentence explicitly    mentions 'two shortlisted candidates', the comparative form    'better' is grammatically correct.</p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in passive    voice.</p>    <p style=\"orphans:0;widows:0\">Why did the villagers laugh at    the poor traveller when he asked for shelter?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Why had the poor traveller been laughed at by the villagers when    he asked for shelter?</p>", "option2": " <p style=\"orphans:0;widows:0\">    Why was the poor traveller laughed by the villagers when he asked    for shelter?</p>", "option3": " <p style=\"orphans:0;widows:0\">    Why was the poor traveller laughed at by the villagers when he    asked for shelter?</p>", "option4": " <p style=\"orphans:0;widows:0\">    Why was the poor traveller laughed at by the villagers when    shelter was asked by him?</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the simple past tense (interrogative    form) with a prepositional verb (phrasal verb) <b>laugh at</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Active     structure: <i>Wh-word + did + subject + verb (base form) +     preposition + object + adverbial clause?</i></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive     structure: <i>Wh-word + was/were + object + past participle (V3)     + preposition + by + subject + adverbial clause?</i></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     preposition <b>at</b> must not be omitted when converting a     prepositional verb into the passive voice.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     tense remains simple past (<i>was laughed at</i>, not <i>had been     laughed at</i>).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     subordinate time clause (<i>when he asked for shelter</i>)     remains in its natural active form.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, the correct passive    voice sentence is: <b>Why was the poor traveller laughed at by the    villagers when he asked for shelter?</b></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate ANTONYM of the given word.</p>    <p style=\"orphans:0;widows:0\">Recalcitrant</p>", "option1": "<p style=\"orphans:0;widows:0\">    Intractable</p>", "option2": " <p style=\"orphans:0;widows:0\">    Obdurate</p>", "option3": " <p style=\"orphans:0;widows:0\">    Amenable</p>", "option4": " <p style=\"orphans:0;widows:0\">    Pugnacious</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>Recalcitrant</b> refers to someone who has an    obstinately uncooperative attitude toward authority or discipline    (stubborn, defiant, or rebellious).</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Amenable</b>     means open and responsive to suggestion; easily persuaded,     compliant, or cooperative. Therefore, it is the exact opposite     (antonym) of recalcitrant.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings     of other options:</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Intractable:</b>     hard to control or deal with; stubborn (synonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Obdurate:</b>     stubbornly refusing to change one's opinion or course of action     (synonym).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Pugnacious:</b> eager or     quick to argue, quarrel, or fight.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words.</p>    <p style=\"orphans:0;widows:0\"><b>A sudden, violent, and    uncontrollable outburst of emotion, laughter, or physical symptoms</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Catharsis</p>", "option2": " <p style=\"orphans:0;widows:0\">    Epiphany</p>", "option3": " <p style=\"orphans:0;widows:0\">    Paroxysm</p>", "option4": " <p style=\"orphans:0;widows:0\">    Eulogy</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitute is <b>Paroxysm</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Paroxysm:</b>     A sudden, violent outburst or convulsion of an emotion, action,     or physical symptom (e.g., a paroxysm of rage or coughing).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Catharsis:</b>     The process of releasing, and thereby providing relief from,     strong or repressed emotions.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Epiphany:</b>     A moment of sudden, profound revelation or insight.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Eulogy:</b> A speech or     piece of writing that praises someone highly, typically delivered     at a funeral.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate ANTONYM of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>MUNIFICENT</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Altruistic</p>", "option2": " <p style=\"orphans:0;widows:0\">    Parsimonious</p>", "option3": " <p style=\"orphans:0;widows:0\">    Lavish</p>", "option4": " <p style=\"orphans:0;widows:0\">    Bounteous</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>'Munificent'</b> means extremely generous or lavish in    giving.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The word    <b>'Parsimonious'</b> means unwilling to spend money or use    resources; excessively frugal or stingy. Hence, it is the most    appropriate antonym.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meanings    of the other options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Altruistic:</b>     showing selfless concern for the well-being of others (synonymous     in spirit).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Lavish:</b>     given or using in very large amounts; extravagant (synonym).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Bounteous:</b> generously     given or giving in abundance (synonym).</p>    </li></ul>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Parts of the following sentence have been given as options. Select    the option that contains an error.</p>    <p style=\"orphans:0;widows:0\">The team is struggling with the    workload at present, but when the new interns arrive next week, it    be much easier.</p>", "option1": "<p style=\"orphans:0;widows:0\">    with the workload at present</p>", "option2": " <p style=\"orphans:0;widows:0\">    it be much easier</p>", "option3": " <p style=\"orphans:0;widows:0\">    The team is struggling</p>", "option4": " <p style=\"orphans:0;widows:0\">    but when the new interns arrive next week</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The error lies in the segment <b>\"it be much easier\"</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">When a     subordinate time clause begins with words like <i>when, as soon     as, once</i> and refers to a future event using the simple     present tense (<i>when the new interns arrive</i>), the main     clause describing the future outcome must use the future simple     tense (<b>will + base verb</b>).</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Therefore,    <b>\"it be\"</b> should be corrected to <b>\"it will    be\"</b>.</p>    <p style=\"orphans:0;widows:0\"><b>Correct sentence:</b> \"The    team is struggling with the workload at present, but when the new    interns arrive next week, it will be much easier.\"</p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate determiner to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Each of the multinational firms    that participated in the summit presented _______ blueprint for    sustainable growth.</p>", "option1": "<p style=\"orphans:0;widows:0\">    their</p>", "option2": " <p style=\"orphans:0;widows:0\">    its</p>", "option3": " <p style=\"orphans:0;widows:0\">    it's</p>", "option4": " <p style=\"orphans:0;widows:0\">    whose</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct determiner is <b>its</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    subject of the main clause is distributive pronoun <b>'Each'</b>    (in <i>'Each of the multinational firms...'</i>), which is    grammatically singular.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Since the    antecedent refers to a corporate entity/firm (a non-living    thing/organization), the singular neuter possessive determiner    <b>'its'</b> must be used.</p>    <p style=\"orphans:0;widows:0\">3. <i>'Their'</i> is plural and    incorrect because the subject is singular ('Each'). <i>'It's'</i>    is a contraction for 'it is' or 'it has', not a possessive form.</p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate ANTONYM of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Refractory</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Recalcitrant</p>", "option2": " <p style=\"orphans:0;widows:0\">    Compliant</p>", "option3": " <p style=\"orphans:0;widows:0\">    Obstinate</p>", "option4": " <p style=\"orphans:0;widows:0\">    Intractable</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>'Refractory'</b> means stubborn, unmanageable, or    resistant to authority or control.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the given options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Compliant:</b>     disposed or willing to comply with rules or wishes; obedient     (correct antonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Recalcitrant:</b>     stubbornly uncooperative or resistant to authority (synonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Obstinate:</b>     stubbornly refusing to change one's opinion or course of action     (synonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Intractable:</b> solate</p>", "option3": " <p style=\"orphans:0;widows:0\">    contradict</p>", "option4": " <p style=\"orphans:0;widows:0\">    harmonize</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The concluding sentences emphasize achieving an 'equilibrium' or    balance between 'ambitious climate targets' and 'practical    economic realities'. To 'harmonize' means to bring different    elements into agreement or a balanced relationship, making it the    most appropriate choice.</p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The sentence given below is divided into four segments labelled P,    Q, R, and S. Read the sentence carefully to determine which    segment contains a lexical error. Select the letter corresponding    to that specific segment as your answer. (Note: The sentence    contains exactly one error. Ignore errors of punctuation, if any.)</p>    <p style=\"orphans:0;widows:0\">(P) While the development team    initially achieved remarkable progress in optimizing the neural    network, / (Q) subsequent rounds of extensive parameter tuning /    (R) yielded diminutive returns as algorithmic complexity    escalated, / (S) ultimately stalling further improvements in    predictive accuracy.</p>", "option1": "<p style=\"orphans:0;widows:0\">    P</p>", "option2": " <p style=\"orphans:0;widows:0\">    Q</p>", "option3": " <p style=\"orphans:0;widows:0\">    R</p>", "option4": " <p style=\"orphans:0;widows:0\">    S</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Segment (R) contains a lexical error. The adjective <b>diminutive</b>    means extremely or unusually small in physical size or stature.    However, in the context of production or performance yielding    progressively smaller outputs as investment increases, the correct    idiomatic and economic collocation is <b>diminishing returns</b>.    Therefore, <b>'diminutive returns'</b> should be corrected to    'diminishing returns'.</p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Fill in the blanks with the most appropriate combination of    articles and verb form.</p>    <p style=\"orphans:0;widows:0\">The minister demanded that    ________ safety of the miners ________ prioritized, as this was    ________ urgent matter of public concern.</p>", "option1": "<p style=\"orphans:0;widows:0\">    the, was, a</p>", "option2": " <p style=\"orphans:0;widows:0\">    a, be, the</p>", "option3": " <p style=\"orphans:0;widows:0\">    the, be, an</p>", "option4": " <p style=\"orphans:0;widows:0\">    no article, is, an</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct combination is <b>the, be, an</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>First    blank:</b> The definite article 'the' is used because the noun    'safety' is made specific by the qualifying phrase 'of the    miners'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>Second    blank:</b> The subjunctive mood is required following the verb    'demanded that'. In the present subjunctive, the base form of the    verb ('be') is used regardless of the subject or the tense of the    main clause.</p>    <p style=\"orphans:0;widows:0\">3. <b>Third blank:</b> The    indefinite article 'an' is needed before the singular countable    noun phrase 'urgent matter' because 'urgent' begins with a vowel    sound.</p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the following sentence carefully and focus on the underlined    portion. Choose the option (A, B, or C) that best substitutes the    underlined segment to improve the sentence grammatically or    contextually. If the sentence is correct as written, select Option    D (No improvement required).</p>    <p style=\"orphans:0;widows:0\">The conservation team resolved <u>to    actively monitor the migration of endangered birds</u> across the    wetlands throughout the winter.</p>", "option1": "<p style=\"orphans:0;widows:0\">    to monitor actively the migration of endangered birds across the    wetlands</p>", "option2": " <p style=\"orphans:0;widows:0\">    to monitor the migration actively of endangered birds across the    wetlands</p>", "option3": " <p style=\"orphans:0;widows:0\">    to actively monitor across the wetlands the migration of    endangered birds</p>", "option4": " <p style=\"orphans:0;widows:0\">    No improvement required</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The sentence is <b>grammatically correct</b> and contextually    clear. In modern English, placing an adverb between 'to' and the    base verb (a split infinitive) such as 'to actively monitor' is    natural and accepted, especially when moving the adverb creates    awkward phrasing.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Option A     awkwardly places the adverb 'actively' between the transitive     verb 'monitor' and its direct object 'the migration...'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Option B     disrupts the noun phrase 'the migration of endangered birds'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Option C     separates the verb from its direct object by inserting a     prepositional phrase ('across the wetlands').</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence, <b>no improvement is    required</b>.</p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन कथन दिए गए हैं, जिनके बाद तीन निष्कर्ष I, II और III द <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चूँकि P, Q का भाई है और Q, S की माता है, इसलिए P, S का मामा (माता का भाई) है। अतः व्यंजक iii सही है।</span></p>", "question_heading": ""}, {"sr_no": 103, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">निर्देश:</span><span> कथन के वैध होने के लिए आवश्यक मान्यताओं की पहचान कीजिए, फिर सही विकल्प का चयन कीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कथन:</span><span> हालाँकि सौर ऊर्जा प्रौद्योगिकी ने बिजली उत्पादन की लागत को काफी हद तक कम कर दिया है, लेकिन सूर्य के प्रकाश की अनिरंतरता (रुक-रुक कर मिलना) निरंतर ऊर्जा आपूर्ति के लिए एक प्रमुख चुनौती बनी हुई है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">मान्यताएँ:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. सौर ऊर्जा प्रौद्योगिकी में लागत प्रभावी बिजली उत्पादन की क्षमता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. सौर ऊर्जा बिना किसी ऊर्जा भंडारण प्रणाली के चौबीसों घंटे निर्बाध बिजली आपूर्ति प्रदान कर सकती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>III. हाल की तकनीकी प्रगतियों ने सौर ऊर्जा की सूर्य के प्रकाश पर निर्भरता को पूरी तरह से समाप्त कर दिया है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल I और II अंतर्निहित हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल II और III अंतर्निहित हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल I अंतर्निहित है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सभी I, II और III अंतर्निहित हैं</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">मान्यता I</span><span> अंतर्निहित है क्योंकि कथन में उल्लेख किया गया है कि सौर ऊर्जा प्रौद्योगिकी ने उत्पादन लागत को काफी कम कर दिया है, जिससे यह माना जाता है कि इसमें लागत प्रभावी बिजली उत्पादन की क्षमता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">मान्यता II</span><span> अंतर्निहित नहीं है क्योंकि कथन स्पष्ट रूप से निरंतर ऊर्जा आपूर्ति के लिए सूर्य के प्रकाश की अनिरंतरता को एक प्रमुख चुनौती के रूप में रेखांकित करता है, जिसका अर्थ है कि बिना भंडारण के चौबीसों घंटे बिजली संभव नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">मान्यता III</span><span> अंतर्निहित नहीं है क्योंकि यह सीधे कथन का खंडन करती है, जिसमें कहा गया है कि सूर्य के प्रकाश पर निर्भरता से जुड़ी समस्या अभी भी बनी हुई है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">इसलिए, केवल मान्यता I अंतर्निहित है।</span></p>", "question_heading": ""}, {"sr_no": 104, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उस संख्या-समूह का चयन करें जो शेष से अलग है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(12, 36, 108)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(16, 48, 144)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(18, 54, 162)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(14, 42, 128)</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>समूहों में अनुसरण किया गया पैटर्न इस प्रकार है: </span><span style=\"font-weight:bold\">दूसरी संख्या = पहली संख्या </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_u ;margin-bottom:0pt;font-size:12pt\"><span>उस विकल्प का चयन कीजिए जो तीसरे शब्द से उसी प्रकार संबंधित है जिस प्रकार दूसरा शब्द पहले शब्द से संबंधित है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मितभाषी : वाणी :: मितव्ययी : ?</span></p>", "option1": "<p style=\"margin-top:12pt;margin-bottom:4pt;font-size:12pt\"><span>आय</span></p>", "option2": " <p style=\"margin-top:12pt;margin-bottom:4pt;font-size:12pt\"><span>धन</span></p>", "option3": " <p style=\"margin-top:12pt;margin-bottom:4pt;font-size:12pt\"><span>व्यय</span></p>", "option4": " <p style=\"margin-top:12pt;margin-bottom:4pt;font-size:12pt\"><span>निवेश</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:12pt;margin-bottom:4pt;font-size:12pt\"><span>'मितभाषी' उस व्यक्ति को कहा जाता है जो अपनी 'वाणी' (बोलने) में संयम बरतता है। उसी प्रकार, 'मितव्ययी' वह व्यक्ति होता है जो अपने 'व्यय' (खर्च) में संयम और मितव्ययिता बरतता है। अतः सही संबंधित शब्द 'व्यय' है।</span></p>", "question_heading": ""}, {"sr_no": 117, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए परिस्थिति को ध्यानपूर्वक पढ़ें और सभी महत्वपूर्ण तथ्यों, शर्तों और सीमाओं पर विचार करें। केवल दी गई जानकारी के आधार पर सबसे उचित, व्यावहारिक और तार्किक निर्णय को दर्शाने वाले विकल्प का चयन करें।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक बायोटेक्नोलॉजी फर्म निम्नलिखित मानदंडों के आधार पर रिसर्च एसोसिएट्स का चयन करती है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(1) न्यूनतम 65% अंकों के साथ बायोटेक्नोलॉजी या बायोकेमिस्ट्री में मास्टर डिग्री होनी चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(2) 1 जुलाई 2025 तक आयु 22 से 28 वर्ष के बीच होनी चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(3) प्रयोगशाला अनुसंधान में कम से कम 1 वर्ष का अनुभव होना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(4) व्यक्तिगत साक्षात्कार में कम से कम 50% अंक प्राप्त करने चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>हालाँकि, यदि कोई उम्मीदवार उपरोक्त शर्त (3) को छोड़कर अन्य सभी मानदंडों को पूरा करता है, लेकिन उसने समकक्ष-समीक्षित (पीयर-रिव्यूड) पत्रिकाओं में कम से कम दो शोध पत्र प्रकाशित किए हैं, तो मामला शोध प्रमुख (हेड ऑफ रिसर्च) को भेजा जाना है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अनन्या ने 72% अंकों के साथ बायोटेक्नोलॉजी में एम.एससी. पूरा किया है। उनका जन्म 15 अक्टूबर 1999 को हुआ था। उनके पास 8 महीने का प्रयोगशाला अनुसंधान अनुभव है और उन्होंने समकक्ष-समीक्षित पत्रिकाओं में तीन शोध पत्र प्रकाशित किए हैं। उन्होंने व्यक्तिगत साक्षात्कार में 64% अंक प्राप्त किए हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उनके आवेदन के संबंध में क्या निर्णय लिया जाना चाहिए?</span></p>", "option1": "<p style=\"margin-top:12pt;margin-bottom:4pt;font-size:12pt\"><span>उम्मीदवार का चयन किया जाना चाहिए।</span></p>", "option2": " <p style=\"margin-top:12pt;margin-bottom:4pt;font-size:12pt\"><span>उम्मीदवार को खारिज कर दिया जाना चाहिए।</span></p>", "option3": " <p style=\"margin-top:12pt;margin-bottom:4pt;font-size:12pt\"><span>मामला शोध प्रमुख को भेजा जाना चाहिए।</span></p>", "option4": " <p style=\"margin-top:12pt;margin-bottom:4pt;font-size:12pt\"><span>निर्णय लेने के लिए प्रदान किया गया डेटा अपर्याप्त है।</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आइए प्रत्येक मानदंड के संदर्भ में अनन्या के विवरण का मूल्यांकन करें:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">मास्टर डिग्री:</span><span> उनके पास 72% अंकों के साथ बायोटेक्नोलॉजी में एम.एससी. है, जो आवश्यक 65% से अधिक है (संतुष्ट)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">आयु:</span><span> 15 अक्टूबर 1999 को जन्मी, 1 जुलाई 2025 को उनकी आयु लगभग 25 वर्ष 8 महीने है, जो कि 22 से 28 वर्ष की निर्धारित सीमा के भीतर है (संतुष्ट)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span style=\"font-weight:bold\">अनुसंधान अनुभव:</span><span> उनके पास केवल 8 महीने का अनुभव है, जो कम से कम 1 वर्ष की प्राथमिक शर्त को पूरा नहीं करता है। हालाँकि, उन्होंने समकक्ष-समीक्षित पत्रिकाओं में तीन शोध पत्र प्रकाशित किए हैं (जो कम से कम दो शोध पत्रों की छूट शर्त को पूरा करता है)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. </span><span style=\"font-weight:bold\">साक्षात्कार:</span><span> उन्होंने 64% अंक प्राप्त किए हैं, जो न्यूनतम आवश्यक 50% से अधिक है (संतुष्ट)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चूँकि वह शर्त (3) को छोड़कर अन्य सभी मानदंडों को पूरा करती हैं और छूट की शर्त को संतुष्ट करती हैं, इसलिए उनके मामले को शोध प्रमुख के पास भेजा जाना चाहिए।</span></p>", "question_heading": ""}, {"sr_no": 118, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">परिदृश्य:</span><span> एक जन-कल्याण पोर्टल के महत्वपूर्ण सार्वजनिक लोकार्पण से ठीक तीस मिनट पहले, एक बड़ी सॉफ्टवेयर गड़बड़ी (बग) के कारण पंजीकरण पृष्ठ क्रैश हो जाता है। प्रोजेक्ट मैनेजर के रूप में, आपके पास दो टीम सदस्य उपलब्ध हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">डेवलपर P</span><span> एक उत्कृष्ट कोडर है जो मिनटों में जटिल तकनीकी समस्याओं को ढूंढकर ठीक कर सकता है, लेकिन जनता या वरिष्ठ अधिकारियों के साथ सीधे संवाद करते समय आक्रामक, चिंतित और रक्षात्मक हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">डेवलपर Q</span><span> के पास केवल बुनियादी कोडिंग कौशल है, लेकिन वह सार्वजनिक संवाद में निपुण है, तनाव में भी सहानुभूतिपूर्ण बना रहता है और लोगों की चिंताओं को सहजता से संभाल सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निम्नलिखित में से कौन-सी कार्रवाई भावनात्मक बुद्धिमत्ता (Emotional Intelligence) और संकट प्रबंधन नेतृत्व के उच्चतम स्तर को दर्शाती है?</span></p>", "option1": "<p style=\"margin-top:12pt;margin-bottom:4pt;font-size:12pt\"><span>डेवलपर P को अधीर जनता को संबोधित करने और बग समझाने के लिए भेजें, जबकि डेवलपर Q मूल कोड को ठीक करने का प्रयास करे।</span></p>", "option2": " <p style=\"margin-top:12pt;margin-bottom:4pt;font-size:12pt\"><span>डेवलपर P को बिना किसी बाहरी हस्तक्षेप के कोड ठीक करने पर पूरी तरह ध्यान केंद्रित करने के लिए कहें, जबकि डेवलपर Q हितधारकों के साथ संवाद संभाले और उन्हें आश्वस्त रखे।</span></p>", "option3": " <p style=\"margin-top:12pt;margin-bottom:4pt;font-size:12pt\"><span>लापरवाही के लिए दोनों डेवलपर्स को औपचारिक फटकार लगाएं और पोर्टल के शुभारंभ को अनिश्चित काल के लिए स्थगित कर दें।</span></p>", "option4": " <p style=\"margin-top:12pt;margin-bottom:4pt;font-size:12pt\"><span>दोनों डेवलपर्स को मीडिया ब्रीफिंग में एक साथ बैठने और पारदर्शिता सुनिश्चित करने के लिए स्क्रीन पर लाइव सॉफ्टवेयर को ठीक करने का निर्देश दें।</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:12pt;margin-bottom:4pt;font-size:12pt\"><span>संकट प्रबंधन में उच्च भावनात्मक बुद्धिमत्ता (EI) टीम के सदस्यों की व्यक्तिगत शक्तियों और भावनात्मक कमजोरियों को पहचानकर सही कार्य सौंपने पर आधारित होती है। डेवलपर P के पास तकनीकी समस्या को तेजी से ठीक करने का कौशल है, लेकिन वह बाहरी दबाव में विचलित हो जाता है। उसे बाहरी दबाव से अलग रखकर शांत वातावरण में काम करने देना सबसे प्रभावी होगा। दूसरी ओर, डेवलपर Q तनावपूर्ण स्थिति में भी सहानुभूतिपूर्वक संवाद कर सकता है, जो हितधारकों को शांत और आश्वस्त रखने के लिए उपयुक्त है। अतः, विकल्प B सही उत्तर है।</span></p>", "question_heading": ""}, {"sr_no": 119, "question": " <p style=\"margin-top:12pt;margin-bottom:4pt;font-size:12pt\"><span>निम्नलिखित चार अल्फ़ान्यूमेरिक कोडों में से तीन एक निश्चित तरीके से समान हैं और इस प्रकार एक समूह बनाते हैं। कौन-सा कोड उस समूह से संबंधित नहीं है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C43D</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B33E</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E172G</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D100F</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रत्येक कोड में अनुसरण किया गया पैटर्न निम्न प्रकार है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">(पहले अक्षर का स्थानीय मान)³ + (दूसरे अक्षर का स्थानीय मान)² = मध्य संख्या</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">C43D:</span><span> C = 3, D = 4</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897912512_image050.png\" width=\"167\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">B33E:</span><span> B = 2, E = 5</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897912512_image051.png\" width=\"158\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">D100F:</span><span> D = 4, F = 6</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897912512_image052.png\" width=\"176\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">E172G:</span><span> E = 5, G = 7</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897912512_image053.png\" width=\"232\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, </span><span style=\"font-weight:bold\">E172G</span><span> इस पैटर्न का पालन नहीं करता है।</span></p>", "question_heading": ""}, {"sr_no": 120, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उस विकल्प आकृति का चयन कीजिए जो तीसरी आकृति से उसी प्रकार संबंधित है जिस प्रकार दूसरी आकृति, पहली आकृति से संबंधित है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897912512_image054.png\" width=\"460\" height=\"110\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897912512_image055.png\" width=\"110\" height=\"110\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897912512_image056.png\" width=\"110\" height=\"110\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897912512_image057.png\" width=\"110\" height=\"110\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793897912512_image058.png\" width=\"110\" height=\"110\" alt ></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:12pt;margin-bottom:4pt;font-size:12pt\"><span>पहली आकृति में, केंद्र से 4 सीधी रेखाएं बाहर की ओर निकल रही हैं, और दूसरी आकृति 4 भुजाओं वाला एक बहुभुज (वर्ग) है। इसी प्रकार, तीसरी आकृति में, केंद्र से 5 सीधी रेखाएं बाहर की ओर निकल रही हैं, इसलिए चौथी आकृति 5 भुजाओं वाला एक बहुभुज (पंचभुज) होनी चाहिए। अतः, विकल्प (C) सही आकृति है।</span></p>", "question_heading": ""}, {"sr_no": 121, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक चुनाव में दो उम्मीदवारों के बीच, मतदाता सूची के 15% मतदाताओं ने वोट नहीं डाला, और 250 वोट अवैध घोषित कर दिए गए। विजेता ने मतदाता सूची में दर्ज कुल वोटों का 55% प्राप्त किया और अपने प्रतिद्वंद्वी को 3,450 वोटों से हराया। नामांकित मतदाताओं की कुल संख्या ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12,500</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12,800</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13,000</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>वैध मत = डाले गए मत − अवैध मत;</span><span>  </span><span>जीत का अंतर = विजेता के मत − प्रतिद्वंद्वी के मत</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. माना मतदाता सूची में कुल मतदाता N हैं। 15% ने वोट नहीं डाला, इसलिए डाले गए मत = N का 85% = 0.85N।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 250 मत अवैध थे, इसलिए वैध मत = 0.85N − 250।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. विजेता के मत = 0.55N, अतः प्रतिद्वंद्वी के मत = (0.85N − 250) − 0.55N = 0.30N − 250।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. अंतर = 0.55N − (0.30N − 250) = 3450 ⇒ 0.25N + 250 = 3450 ⇒ 0.25N = 3200।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. N = 3200 ÷ 0.25 = 12,800।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. जाँच: डाले गए मत = 10,880; वैध = 10,630; विजेता = 7,040; प्रतिद्वंद्वी = 3,590; 7,040 − 3,590 = 3,450 ✓</span></p>", "question_heading": ""}, {"sr_no": 122, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">दो अंकों की एक संख्या ऐसी है कि उसके अंकों का गुणनफल 18 है। जब संख्या में से 63 घटाया जाता है, तो अंकों के स्थान आपस में बदल जाते हैं। मूल संख्या के अंकों के घनों का योग ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>737</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>736</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>729</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>744</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>दो अंकों की संख्या जिसमें दहाई का अंक a और इकाई का अंक b हो = 10a + b; अंक आपस में बदलने पर = 10b + a</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. माना संख्या 10a + b है, जहाँ ab = 18।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 63 घटाने पर अंक आपस में बदल जाते हैं: (10a + b) − 63 = 10b + a।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 9a − 9b = 63 ⇒ 9(a − b) = 63 ⇒ a − b = 7।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. गुणनफल 18 वाले अंक-युग्म (9,2), (6,3), (3,6), (2,9) हैं; इनमें से केवल a = 9, b = 2 पर a − b = 7 होता है। अतः संख्या 92 है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. घनों का योग = 9³ + 2³ = 729 + 8 = 737।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. जाँच: 92 − 63 = 29 (अंक बदल गए) ✓ और 9 × 2 = 18 ✓</span></p>", "question_heading": ""}, {"sr_no": 123, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">यदि बहुपद </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image001.png\" width=\"202\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> व्यंजक </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image002.png\" width=\"88\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> से पूर्णतः विभाजित है, तो </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image003.png\" width=\"65\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>21</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>23</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>27</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>गुणनखंड प्रमेय: यदि (x − c), p(x) को पूर्णतः विभाजित करता है, तो p(c) = 0</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. x² − 3x + 2 = (x − 1)(x − 2)। p(x) इससे विभाजित है, अतः p(1) = 0 और p(2) = 0।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. p(1) = 1 − 3 + a + b − 6 = 0 ⇒ a + b = 8 ... (i)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. p(2) = 16 − 24 + 4a + 2b − 6 = 0 ⇒ 4a + 2b = 14 ⇒ 2a + b = 7 ... (ii)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. (ii) − (i): a = −1, तब b = 8 − (−1) = 9।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. 2a + 3b = 2(−1) + 3(9) = −2 + 27 = 25।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. जाँच: p(2) = 16 − 24 − 4 + 18 − 6 = 0 ✓</span></p>", "question_heading": ""}, {"sr_no": 124, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">यदि </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image004.png\" width=\"10\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> और </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image005.png\" width=\"9\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> द्विघात समीकरण </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image006.png\" width=\"112\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> के मूल हैं, तो </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image007.png\" width=\"46\" height=\"31\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> का मान ज्ञात कीजिए।</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image008.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image009.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image010.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image011.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>ax² + bx + c = 0 के लिए: α + β = −b/a, αβ = c/a;</span><span>  </span><span>α³ + β³ = (α + β)³ − 3αβ(α + β);</span><span>  </span><span>α⁻¹ + β⁻¹ = (α + β)/(αβ)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 3x² − 5x + 1 = 0 के लिए: α + β = 5/3 और αβ = 1/3।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. α³ + β³ = (5/3)³ − 3 × (1/3) × (5/3) = 125/27 − 5/3।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. = 125/27 − 45/27 = 80/27।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. α⁻¹ + β⁻¹ = (α + β)/(αβ) = (5/3) ÷ (1/3) = 5।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. अभीष्ट मान = (80/27) ÷ 5 = 16/27।</span></p>", "question_heading": ""}, {"sr_no": 125, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">यदि </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image012.png\" width=\"86\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image013.png\" width=\"116\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> तथा </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image014.png\" width=\"116\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> है, तो </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image015.png\" width=\"23\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>(x + y + z)² = x² + y² + z² + 2(xy + yz + zx);</span><span>  </span><span>x³ + y³ + z³ − 3xyz = (x + y + z)[x² + y² + z² − (xy + yz + zx)]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 6² = 14 + 2(xy + yz + zx) ⇒ 2(xy + yz + zx) = 22 ⇒ xy + yz + zx = 11।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. सर्वसमिका का दायाँ पक्ष = 6 × (14 − 11) = 6 × 3 = 18।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 36 − 3xyz = 18 ⇒ 3xyz = 18 ⇒ xyz = 6।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. जाँच: x, y, z = 1, 2, 3 लेने पर योग 6, वर्गों का योग 14, घनों का योग 36 और गुणनफल 6 आता है ✓</span></p>", "question_heading": ""}, {"sr_no": 126, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image016.png\" width=\"46\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> के शीर्ष </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image017.png\" width=\"61\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image018.png\" width=\"43\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> तथा </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image019.png\" width=\"56\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> हैं। यदि </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image020.png\" width=\"11\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image021.png\" width=\"19\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> का मध्य बिंदु है तथा </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image022.png\" width=\"10\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image016.png\" width=\"46\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> का केंद्रक है, तो </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image023.png\" width=\"21\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> की लंबाई ज्ञात कीजिए।</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image024.png\" width=\"18\" height=\"20\" alt style=\"vertical-align:middle\" ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image025.png\" width=\"26\" height=\"39\" alt style=\"vertical-align:middle\" ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image026.png\" width=\"9\" height=\"19\" alt style=\"vertical-align:middle\" ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image027.png\" width=\"26\" height=\"39\" alt style=\"vertical-align:middle\" ></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>मध्यबिंदु = ((x₁ + x₂)/2, (y₁ + y₂)/2);</span><span>  </span><span>केंद्रक = ((x₁ + x₂ + x₃)/3, (y₁ + y₂ + y₃)/3);</span><span>  </span><span>दूरी = √[(x₂ − x₁)² + (y₂ − y₁)²]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. D, B(7, 6) और C(−1, 2) का मध्यबिंदु है: D = ((7 − 1)/2, (6 + 2)/2) = (3, 4)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. केंद्रक G = ((3 + 7 − 1)/3, (−2 + 6 + 2)/3) = (9/3, 6/3) = (3, 2)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. GD = √[(3 − 3)² + (4 − 2)²] = √4 = 2।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. जाँच: AD = (3, −2) से (3, 4) की दूरी = 6, और केंद्रक माध्यिका को 2 : 1 में बाँटता है, अतः GD = AD/3 = 2 ✓</span></p>", "question_heading": ""}, {"sr_no": 127, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image028.png\" width=\"10\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> भुजाओं वाले एक समबहुभुज के एक आंतरिक कोण का </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image029.png\" width=\"18\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> भुजाओं वाले एक समबहुभुज के आंतरिक कोण से अनुपात </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image030.png\" width=\"22\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> है। </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image028.png\" width=\"10\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>n भुजाओं वाले सम बहुभुज का प्रत्येक आंतरिक कोण = 180°(n − 2)/n</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. n भुजाओं वाला बहुभुज: आंतरिक कोण = 180(n − 2)/n।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 2n भुजाओं वाला बहुभुज: आंतरिक कोण = 180(2n − 2)/(2n) = 180(n − 1)/n।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. अनुपात = [180(n − 2)/n] ÷ [180(n − 1)/n] = (n − 2)/(n − 1)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. (n − 2)/(n − 1) = 3/4 ⇒ 4n − 8 = 3n − 3 ⇒ n = 5।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. जाँच: पंचभुज का कोण = 108°, दशभुज का कोण = 144°; 108 : 144 = 3 : 4 ✓</span></p>", "question_heading": ""}, {"sr_no": 128, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक समचतुर्भुज का परिमाप 100 सेमी है और इसका एक विकर्ण 40 सेमी है। इस समचतुर्भुज के अंतःनिर्मित वृत्त का क्षेत्रफल ज्ञात कीजिए।</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image031.png\" width=\"34\" height=\"19\" alt style=\"vertical-align:middle\" ><span> सेमी²</span></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image032.png\" width=\"34\" height=\"19\" alt style=\"vertical-align:middle\" ><span> सेमी²</span></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image033.png\" width=\"34\" height=\"19\" alt style=\"vertical-align:middle\" ><span> सेमी²</span></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image034.png\" width=\"34\" height=\"19\" alt style=\"vertical-align:middle\" ><span> सेमी²</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>समचतुर्भुज के विकर्ण एक-दूसरे को समकोण पर समद्विभाजित करते हैं, अतः भुजा² = (d₁/2)² + (d₂/2)²;</span><span>  </span><span>क्षेत्रफल = ½ × d₁ × d₂;</span><span>  </span><span>अंतःत्रिज्या r = क्षेत्रफल ÷ अर्ध-परिमाप</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. भुजा = 100 ÷ 4 = 25 सेमी। दिए गए विकर्ण का आधा = 40 ÷ 2 = 20 सेमी।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. दूसरे विकर्ण का आधा = √(25² − 20²) = √(625 − 400) = √225 = 15 सेमी, अतः दूसरा विकर्ण = 30 सेमी।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. समचतुर्भुज का क्षेत्रफल = ½ × 40 × 30 = 600 सेमी²।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. अर्ध-परिमाप = 100 ÷ 2 = 50 सेमी, अतः अंतःत्रिज्या r = 600 ÷ 50 = 12 सेमी।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. अंतःवृत्त का क्षेत्रफल = πr² = π × 12² = 144π सेमी²।</span></p>", "question_heading": ""}, {"sr_no": 129, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image016.png\" width=\"46\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> में, बिंदु </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image020.png\" width=\"11\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> और </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image035.png\" width=\"9\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> क्रमशः </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image036.png\" width=\"20\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> और </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image037.png\" width=\"19\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> की भुजाओं पर इस प्रकार स्थित हैं कि </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image038.png\" width=\"51\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> है। यदि </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image039.png\" width=\"86\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> है तथा चतुर्भुज </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image040.png\" width=\"38\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> का क्षेत्रफल 126 सेमी² है, तो </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image041.png\" width=\"47\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> का क्षेत्रफल ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18 सेमी²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>27 सेमी²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>24 सेमी²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>36 सेमी²</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>यदि DE ∥ BC, तो △ADE ∼ △ABC और उनके क्षेत्रफलों का अनुपात = (संगत भुजाओं के अनुपात)²</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. AD : DB = 2 : 3 ⇒ AD : AB = 2 : 5।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. ar(△ADE) / ar(△ABC) = (2/5)² = 4/25। माना ar(△ADE) = 4k और ar(△ABC) = 25k।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. ar(DBCE) = ar(△ABC) − ar(△ADE) = 25k − 4k = 21k।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. 21k = 126 ⇒ k = 6।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. ar(△ADE) = 4k = 4 × 6 = 24 सेमी²।</span></p>", "question_heading": ""}, {"sr_no": 130, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक समषट्भुज की भुजा 12 सेमी है। इसके चारों ओर एक वृत्त परिवृत्तित है। वृत्त के अंदर लेकिन षट्भुज के बाहर के क्षेत्र का क्षेत्रफल ज्ञात कीजिए।</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image042.png\" width=\"89\" height=\"21\" alt style=\"vertical-align:middle\" ><span> सेमी²</span></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image043.png\" width=\"89\" height=\"21\" alt style=\"vertical-align:middle\" ><span> सेमी²</span></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image044.png\" width=\"73\" height=\"21\" alt style=\"vertical-align:middle\" ><span> सेमी²</span></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image045.png\" width=\"89\" height=\"21\" alt style=\"vertical-align:middle\" ><span> सेमी²</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>सम षट्भुज: परिवृत्त की त्रिज्या = भुजा;</span><span>  </span><span>क्षेत्रफल = (3√3/2) × भुजा²;</span><span>  </span><span>वृत्त का क्षेत्रफल = πR²</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. सम षट्भुज 6 समबाहु त्रिभ
