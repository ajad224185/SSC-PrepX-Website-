<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2.) FULL MOCK-01 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;
  }

<span>तटीय    और द्वीपीय क्षेत्रों में    समुद्र के समकारी प्रभाव के    कारण दैनिक तापांतर बहुत कम    होता है।</span></span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">आईपी नेटवर्क पर वॉयस, वीडियो और मैसेजिंग से जुड़े रीयल-टाइम संचार सत्रों (sessions) को शुरू करने, बनाए रखने और समाप्त करने के लिए मुख्य रूप से निम्नलिखित में से किस एप्लिकेशन लेयर प्रोटोकॉल का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SNMP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SMTP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SIP</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FTP</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SIP (सेशन इनीशिएशन प्रोटोकॉल) एक सिग्नलिंग प्रोटोकॉल है जिसका उपयोग इंटरनेट प्रोटोकॉल (IP) नेटवर्क पर वॉयस कॉल, वीडियो कॉन्फ्रेंसिंग और मैसेजिंग जैसे रीयल-टाइम मल्टीमीडिया सत्रों को शुरू करने, बनाए रखने, संशोधित करने और समाप्त करने के लिए किया जाता है। इसके विपरीत, SMTP का उपयोग ईमेल भेजने के लिए, SNMP का उपयोग नेटवर्क प्रबंधन के लिए और FTP का उपयोग फ़ाइल स्थानांतरण के लिए किया जाता है।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MS PowerPoint में, 'हाइड स्लाइड' (Hide Slide) सुविधा का उपयोग करने का प्राथमिक उद्देश्य क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रस्तुति से स्लाइड को स्थायी रूप से हटाना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्लाइड को हटाए बिना उसे स्लाइड शो के दौरान प्रदर्शित होने से रोकना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्लाइड की सामग्री को पासवर्ड द्वारा सुरक्षित करना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्लाइड में मौजूद मीडिया फ़ाइलों को संपीड़ित (कंप्रेस) करना</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MS PowerPoint में 'हाइड स्लाइड' (Hide Slide) सुविधा उपयोगकर्ताओं को प्रस्तुति फ़ाइल से हटाए बिना स्लाइड शो के दौरान चयनित स्लाइड्स को प्रदर्शित होने से रोकने की अनुमति देती है। यह एक ही फ़ाइल के कई संस्करण बनाए बिना विभिन्न दर्शकों के सामने प्रस्तुति देते समय विशेष रूप से उपयोगी होती है।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">वेब ब्राउज़र और वेबसाइट के बीच संचार को एन्क्रिप्ट करके सुरक्षित डेटा संचारण सुनिश्चित करने के लिए निम्नलिखित में से किस प्रोटोकॉल का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HTTP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FTP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HTTPS</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SMTP</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HTTPS (हाइपरटेक्स्ट ट्रांसफर प्रोटोकॉल सिक्योर) HTTP का सुरक्षित संस्करण है। यह क्लाइंट के वेब ब्राउज़र और वेब सर्वर के बीच स्थानांतरित होने वाले संचार और संवेदनशील डेटा की सुरक्षा के लिए TLS (ट्रांसपोर्ट लेयर सिक्योरिटी) या SSL (सिक्योर सॉकेट्स लेयर) जैसे एन्क्रिप्शन प्रोटोकॉल का उपयोग करता है।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MS Excel में किसी सक्रिय सेल (active cell) की सामग्री को संपादित करने के लिए किस फंक्शन कुंजी का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F7</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F12</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MS Excel में, </span><span style=\"font-weight:bold\">F2</span><span> कुंजी दबाने से सक्रिय सेल को संपादित (edit) किया जा सकता है और कर्सर सेल की सामग्री के अंत में चला जाता है। अन्य कुंजियों के कार्य: F4 (अंतिम कमांड को दोहराता है या सेल संदर्भ बदलता है), F7 (वर्तनी की जांच करता है), और F12 ('Save As' डायलॉग बॉक्स खोलता है)।</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">माइक्रोसॉफ्ट आउटलुक (Microsoft Outlook) में, कौन सी सुविधा आपको मूल प्रेषक के साथ-साथ प्राप्त संदेश की 'To' और 'Cc' पंक्तियों में सूचीबद्ध अन्य सभी प्राप्तकर्ताओं को उत्तर भेजने की अनुमति देती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फॉरवर्ड (Forward)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रिप्लाई (Reply)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रिप्लाई ऑल (Reply All)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रीसेंड (Resend)</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माइक्रोसॉफ्ट आउटलुक और अन्य ईमेल अनुप्रयोगों में, 'रिप्लाई ऑल' (Reply All) पर क्लिक करने से आपका उत्तर मूल प्रेषक के साथ-साथ 'To' और 'Cc' फ़ील्ड में शामिल सभी व्यक्तियों को भेजा जाता है। इसके विपरीत, 'रिप्लाई' केवल मूल प्रेषक को उत्तर भेजता है, तथा 'फॉरवर्ड' का उपयोग मूल बातचीत में शामिल न होने वाले किसी अन्य व्यक्ति को संदेश भेजने के लिए किया जाता है।</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">इनकमिंग और आउटगोइंग ट्रैफ़िक को फ़िल्टर करके कंप्यूटर नेटवर्क में अनधिकृत पहुंच को रोकने के लिए मुख्य रूप से किसका उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फ़ायरवॉल (Firewall)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एंटीवायरस (Antivirus)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ट्रोजन हॉर्स (Trojan Horse)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>डिस्क डीफ़्रेग्मेंटर (Disk Defragmenter)</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">फ़ायरवॉल</span><span> एक नेटवर्क सुरक्षा प्रणाली है जो पूर्वनिर्धारित सुरक्षा नियमों के आधार पर आने वाले और बाहर जाने वाले नेटवर्क ट्रैफ़िक की निगरानी और नियंत्रण करती है। यह अनधिकृत पहुंच को रोकने के लिए एक सुरक्षित आंतरिक नेटवर्क और बाहरी नेटवर्क (जैसे इंटरनेट) के बीच एक सुरक्षा दीवार के रूप में कार्य करता है।</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MS Word में चयनित टेक्स्ट के केस (अपरकेस, लोअरकेस, टाइटल केस) को बदलने के लिए निम्नलिखित में से किस कीबोर्ड शॉर्टकट का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + F3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Shift + F3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Alt + F3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Shift + C</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माइक्रोसॉफ्ट वर्ड (MS Word) में, </span><span style=\"font-weight:bold\">Shift + F3</span><span> शॉर्टकट चयनित टेक्स्ट को लोअरकेस (lowercase), अपरकेस (UPPERCASE) और प्रत्येक शब्द के पहले अक्षर को बड़ा (Title Case) करने के बीच बदलता है। इसके विपरीत, </span><span style=\"font-style:italic\">Ctrl + F3</span><span> चयनित सामग्री को 'स्पाइक' (Spike) में कट करता है, </span><span style=\"font-style:italic\">Alt + F3</span><span> एक नई ऑटो-टेक्स्ट प्रविष्टि बनाता है, और </span><span style=\"font-style:italic\">Ctrl + Shift + C</span><span> चयनित टेक्स्ट के फॉर्मेटिंग को कॉपी करता है।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कौन-सा नेटवर्किंग उपकरण मुख्य रूप से OSI मॉडल के नेटवर्क लेयर (लेयर 3) पर काम करता है ताकि कई अलग-अलग नेटवर्कों को आपस में जोड़ा जा सके और IP पतों के आधार पर डेटा पैकेट को रूट किया जा सके?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>हब (Hub)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रिपीटर (Repeater)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>राउटर (Router)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ब्रिज (Bridge)</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">राउटर (Router)</span><span> एक नेटवर्किंग उपकरण है जो OSI मॉडल के लेयर 3 (नेटवर्क लेयर) पर काम करता है। इसका मुख्य कार्य विभिन्न नेटवर्कों (जैसे कि लोकल एरिया नेटवर्क को इंटरनेट से जोड़ना) के बीच डेटा पैकेट अग्रेषित करना है, जिसके लिए यह डेटा भेजने के सबसे कुशल मार्ग को निर्धारित करने हेतु IP पते का उपयोग करता है।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कंप्यूटर मेमोरी का कौन-सा प्रकार डेटा के प्रत्येक बिट को संग्रहीत करने के लिए फ्लिप-फ्लॉप सर्किट का उपयोग करता है और इसलिए इसे समय-समय पर रीफ्रेश करने की आवश्यकता नहीं होती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>डायनेमिक रैम (DRAM)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्टैटिक रैम (SRAM)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सिनक्रोनस DRAM (SDRAM)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>डबल डेटा रेट रैम (DDR RAM)</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्टैटिक रैम (SRAM) डेटा को संग्रहीत करने के लिए फ्लिप-फ्लॉप (जो आमतौर पर 4 से 6 ट्रांजिस्टर से बने होते हैं) का उपयोग करता है। डायनेमिक रैम (DRAM) के विपरीत, जो कैपेसिटर में चार्ज के रूप में डेटा संग्रहीत करता है (जिसमें चार्ज का रिसाव होता रहता है), SRAM में चार्ज का रिसाव नहीं होता है और जब तक बिजली की आपूर्ति बनी रहती है, यह डेटा को बनाए रखता है। इसलिए इसे समय-समय पर रीफ्रेश करने की आवश्यकता नहीं होती है। SDRAM और DDR RAM दोनों ही DRAM के प्रकार हैं और इन्हें भी रीफ्रेश करने की आवश्यकता होती है।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">किस प्रकार का कंप्यूटर वायरस हर बार प्रतिकृति (replicate) बनाते समय अपने हस्ताक्षर (signature) या कोड को बदल लेता है, जिससे पारंपरिक एंटीवायरस सॉफ़्टवेयर द्वारा इसका पता लगाना बेहद कठिन हो जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मैक्रो वायरस</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पॉलीमॉर्फिक वायरस</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>डायरेक्ट एक्शन वायरस</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मल्टीपार्टाइट वायरस</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">पॉलीमॉर्फिक वायरस</span><span> को पारंपरिक सिग्नेचर-आधारित एंटीवायरस प्रोग्रामों से बचने के लिए डिज़ाइन किया गया है। हर बार जब यह किसी फ़ाइल को संक्रमित करता है या अपनी प्रतिकृति बनाता है, तो यह अपनी मुख्य हानिकारक कार्यप्रणाली को बनाए रखते हुए अपने आंतरिक कोड या एन्क्रिप्शन एल्गोरिदम को बदल देता है, जिससे यह हर बार अलग दिखाई देता है।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MS Word में किस टूल का उपयोग किसी एक टेक्स्ट से सभी फ़ॉर्मैटिंग (जैसे फ़ॉन्ट शैली, आकार और रंग) को कॉपी करके किसी अन्य टेक्स्ट पर लागू करने के लिए किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>क्विक पार्ट्स (Quick Parts)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फ़ॉर्मैट पेंटर (Format Painter)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मेल मर्ज (Mail Merge)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>वर्डआर्ट (WordArt)</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MS Word में, </span><span style=\"font-weight:bold\">फ़ॉर्मैट पेंटर (Format Painter)</span><span> टूल (होम टैब में उपलब्ध) का उपयोग किसी एक टेक्स्ट से फ़ॉर्मैटिंग (जैसे फ़ॉन्ट, रंग, टेक्स्ट प्रभाव और आकार) को कॉपी करने और उसे तुरंत किसी अन्य टेक्स्ट पर लागू करने के लिए किया जाता है। फ़ॉर्मैटिंग कॉपी करने का शॉर्टकट </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793892616362_image001.png\" width=\"114\" height=\"21\" alt style=\"vertical-align:middle\" ><span> तथा पेस्ट करने का शॉर्टकट </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793892616362_image002.png\" width=\"115\" height=\"21\" alt style=\"vertical-align:middle\" ><span> होता है।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MS PowerPoint में कौन-सी सुविधा उपयोगकर्ता को प्रत्येक स्लाइड को अलग-अलग संशोधित किए बिना, एक साथ सभी स्लाइडों पर फ़ॉन्ट शैलियों, लोगो और प्लेसहोल्डर जैसे सार्वभौमिक फ़ॉर्मेटिंग लागू करने की अनुमति देती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्लाइड सॉर्टर (Slide Sorter)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्लाइड मास्टर (Slide Master)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एनिमेशन पेन (Animation Pane)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रस्तुतकर्ता दृश्य (Presenter View)</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MS PowerPoint में </span><span style=\"font-weight:bold\">स्लाइड मास्टर (Slide Master)</span><span> शीर्ष स्तर की एक ऐसी स्लाइड होती है जो प्रस्तुति के भीतर सभी स्लाइडों की थीम, लेआउट, पृष्ठभूमि, रंग, फ़ॉन्ट और प्लेसहोल्डर की स्थिति को नियंत्रित करती है। स्लाइड मास्टर में परिवर्तन करने से वे सभी संबंधित स्लाइडों पर स्वतः लागू हो जाते हैं, जिससे समय की बचत होती है और पूरी प्रस्तुति में एकरूपता बनी रहती है।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">इंटरनेट पर आउटगोइंग इलेक्ट्रॉनिक मेल (ई-मेल) संदेशों को भेजने/प्रेषित करने के लिए मुख्य रूप से निम्नलिखित में से कौन सा प्रोटोकॉल जिम्मेदार है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आईएमएपी (इंटरनेट मैसेज एक्सेस प्रोटोकॉल)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एसएमटीपी (सिंपल मेल ट्रांसफर प्रोटोकॉल)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पीओपी3 (पोस्ट ऑफिस प्रोटोकॉल 3)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एफटीपी (फाइल ट्रांसफर प्रोटोकॉल)</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एसएमटीपी (Simple Mail Transfer Protocol) एक एप्लीकेशन लेयर प्रोटोकॉल है जिसका उपयोग मेल सर्वरों के बीच और ईमेल क्लाइंट से मेल सर्वर तक आउटगोइंग ईमेल भेजने और अग्रेषित करने के लिए किया जाता है। इसके विपरीत, पीओपी3 (POP3) और आईएमएपी (IMAP) का उपयोग मेल सर्वर से इनकमिंग ईमेल प्राप्त करने के लिए किया जाता है, तथा एफटीपी (FTP) का उपयोग फ़ाइल स्थानांतरण के लिए किया जाता है।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कॉलम A में दिए गए विंडोज़ सिस्टम टूल्स का कॉलम B में उनके प्राथमिक कार्यों के साथ मिलान करें।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कॉलम A:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. डिस्क क्लीनअप (Disk Cleanup)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. टास्क शेड्यूलर (Task Scheduler)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3. इवेंट व्यूअर (Event Viewer)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">4. डिवाइस मैनेजर (Device Manager)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कॉलम B:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">a) हार्डवेयर घटकों और उनके ड्राइवरों को कॉन्फ़िगर, अपडेट और समस्या निवारण करता है</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">b) पूर्वनिर्धारित समय पर निष्पादित होने के लिए कार्यों और प्रोग्रामों को स्वचालित करता है</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">c) महत्वपूर्ण सिस्टम घटनाओं, एप्लिकेशन त्रुटियों और सुरक्षा ऑडिट के विस्तृत लॉग प्रदर्शित करता है</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">d) स्टोरेज स्पेस खाली करने के लिए अस्थायी और अनावश्यक फ़ाइलों को स्कैन और हटाता है</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - b, 2 - d, 3 - a, 4 - c</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - d, 2 - b, 3 - c, 4 - a</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - c, 2 - b, 3 - d, 4 - a</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - d, 2 - a, 3 - c, 4 - b</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सही मिलान </span><span style=\"font-weight:bold\">1 - d, 2 - b, 3 - c, 4 - a</span><span> है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">डिस्क क्लीनअप (1 - d):</span><span> यह अस्थायी, कैशे और अनावश्यक सिस्टम फ़ाइलों को खोजकर और हटाकर डिस्क स्थान खाली करने के लिए उपयोग किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">टास्क शेड्यूलर (2 - b):</span><span> यह उपयोगकर्ताओं को विशिष्ट समय या ट्रिगर्स पर स्वचालित रूप से चलने वाले कार्यों, स्क्रिप्ट या प्रोग्रामों को शेड्यूल करने की सुविधा देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">इवेंट व्यूअर (3 - c):</span><span> यह समस्याओं के निवारण में सहायता के लिए सिस्टम घटनाओं, त्रुटियों, चेतावनियों और सुरक्षा ऑडिट के लॉग प्रदर्शित करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">डिवाइस मैनेजर (4 - a):</span><span> इसका उपयोग स्थापित हार्डवेयर उपकरणों और उनके ड्राइवर सॉफ़्टवेयर को देखने, कॉन्फ़िगर करने और प्रबंधित करने के लिए किया जाता है।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Windows 10/11 में फ़ाइल एक्सप्लोरर (File Explorer) की कार्यक्षमताओं के संदर्भ में, निम्नलिखित कथनों पर विचार कीजिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">I. यह उपयोगकर्ताओं को एक साझा नेटवर्क फ़ोल्डर को ड्राइव लेटर पर मैप करने की अनुमति देता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">II. इसका उपयोग डिस्क वॉल्यूम पार्टीशन को सिकोड़ने (shrink) या विस्तारित (extend) करने के लिए किया जा सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">III. यह फ़ाइल नाम एक्सटेंशन और छिपे हुए आइटम (hidden items) की दृश्यता को टॉगल करने के लिए अंतर्निहित विकल्प प्रदान करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">उपर्युक्त में से कौन-से कथन सही हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल I और II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल I और III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल II और III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I, II और III</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I सही है: फ़ाइल एक्सप्लोरर में 'Map network drive' की अंतर्निहित सुविधा होती है, जो उपयोगकर्ताओं को साझा नेटवर्क डायरेक्टरी को एक स्थानीय ड्राइव लेटर (जैसे Z:) सौंपने की अनुमति देती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन II गलत है: हार्ड ड्राइव पार्टीशन आकारों को संशोधित, छोटा (shrink) या विस्तृत (extend) फ़ाइल एक्सप्लोरर के माध्यम से नहीं किया जा सकता है; इसके लिए 'डिस्क मैनेजमेंट' यूटिलिटी (diskmgmt.msc) या diskpart कमांड-लाइन टूल की आवश्यकता होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन III सही है: फ़ाइल एक्सप्लोरर के 'View' टैब में जाकर फ़ाइल नाम एक्सटेंशन और छिपी हुई फ़ाइलों/फ़ोल्डरों को दिखाने या छिपाने के विकल्प सीधे उपलब्ध होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, केवल कथन I और III सही हैं।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कंप्यूटर मेमोरी के संबंध में निम्नलिखित में से कौन सा/से कथन सही है/हैं?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. स्टैटिक रैम (SRAM) को संग्रहीत डेटा बनाए रखने के लिए समय-समय पर रीफ्रेश (refresh) करने की आवश्यकता होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. कैश मेमोरी, डेटा एक्सेस समय को कम करने के लिए सीपीयू (CPU) और मुख्य मेमोरी के बीच स्थित एक उच्च-गति वाली मेमोरी है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल 1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 और 2 दोनों</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो 1 और न ही 2</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन 1 गलत है: डायनेमिक रैम (DRAM) को समय-समय पर रीफ्रेश करने की आवश्यकता होती है क्योंकि यह डेटा को कैपेसिटर में संग्रहीत करता है जो धीरे-धीरे डिस्चार्ज हो जाते हैं। स्टैटिक रैम (SRAM) को रीफ्रेश करने की आवश्यकता नहीं होती क्योंकि यह फ्लिप-फ्लॉप का उपयोग करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन 2 सही है: कैश मेमोरी सीपीयू (CPU) और मुख्य मेमोरी (RAM) के बीच स्थित एक अत्यंत तेज़ मेमोरी है, जो बार-बार उपयोग होने वाले डेटा और निर्देशों को संग्रहीत करती है ताकि डेटा एक्सेस समय कम हो सके।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सेंट्रल प्रोसेसिंग यूनिट (CPU) के घटकों के संबंध में निम्नलिखित में से कौन सा/से कथन सत्य या असत्य है/हैं, चुनें।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">(i) रजिस्टर CPU के अंदर स्थित उच्च-गति वाले अस्थायी भंडारण इकाइयाँ हैं जो प्रसंस्करण के दौरान डेटा और निर्देशों को रखती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">(ii) कंट्रोल यूनिट (CU) अंकगणितीय गणनाओं और तार्किक तुलनाओं को निष्पादित करने के लिए जिम्मेदार होती है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(i) सत्य, (ii) सत्य</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(i) सत्य, (ii) असत्य</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(i) असत्य, (ii) सत्य</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(i) असत्य, (ii) असत्य</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (i) सत्य है: रजिस्टर CPU के भीतर स्थित अत्यंत तेज़ और छोटी भंडारण इकाइयाँ होती हैं, जिनका उपयोग वर्तमान में संसाधित किए जा रहे डेटा, मध्यवर्ती परिणामों और निर्देशों को अस्थायी रूप से रखने के लिए किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन (ii) असत्य है: अंकगणितीय गणनाओं (जैसे जोड़, घटाव) और तार्किक तुलनाओं को करने का कार्य अर्थमेटिक लॉजिक यूनिट (ALU) द्वारा किया जाता है। कंट्रोल यूनिट (CU) का कार्य कंप्यूटर के सभी घटकों के संचालन का समन्वय और नियंत्रण करना होता है, न कि गणनाएँ करना।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">विभिन्न प्रकार की रीड-ओनली मेमोरी (ROM) के संदर्भ में, निम्नलिखित में से कौन-सा/से कथन सही है/हैं?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">I. EPROM की सामग्री को एक पारदर्शी क्वार्ट्ज विंडो के माध्यम से पराबैंगनी (UV) प्रकाश के संपर्क में लाकर मिटाया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">II. पारंपरिक EEPROM, जिसमें बाइट-स्तरीय संशोधन की अनुमति होती है, के विपरीत फ्लैश मेमोरी को आमतौर पर ब्लॉक या सेक्टर स्तर पर मिटाया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">III. मास्क ROM (Mask ROM) निर्माण के दौरान ही हार्डवायर्ड होता है और निर्माण के बाद इसे संशोधित या पुन: प्रोग्राम नहीं किया जा सकता है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल I और II</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल II और III</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल I और III</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I, II और III</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीनों कथन सही हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">EPROM (इरेज़ेबल प्रोग्रामेबल ROM):</span><span> इसे क्वार्ट्ज विंडो के माध्यम से लगभग 20–40 मिनट तक तीव्र पराबैंगनी (UV) प्रकाश के संपर्क में लाकर मिटाया जाता है, जिससे सारा डेटा एक साथ मिट जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">EEPROM बनाम फ्लैश मेमोरी:</span><span> जहाँ मानक EEPROM में बाइट-दर-बाइट विद्युत रूप से मिटाने और लिखने की अनुमति होती है, वहीं फ्लैश मेमोरी (EEPROM का एक उन्नत रूप) डेटा को ब्लॉक या सेक्टर स्तर पर मिटाती और लिखती है, जिससे यह अधिक तीव्र और बड़े डेटा भंडारण के लिए उपयुक्त होती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span style=\"font-weight:bold\">मास्क ROM:</span><span> इसका डेटा निर्माण प्रक्रिया के दौरान ही मास्क का उपयोग करके चिप में स्थायी रूप से एकीकृत कर दिया जाता है, जिससे इसे बाद में किसी भी प्रकार से संशोधित नहीं किया जा सकता है।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कॉलम A में दी गई विंडोज सिस्टम यूटिलिटीज का मिलान कॉलम B में उनके प्राथमिक कार्यों से करें।</span></p>\n<table cellspacing=\"0\" cellpadding=\"0\" style=\"width:100%;border:0.75pt solid #d1d5db;border-collapse:collapse\">\n<tr>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कॉलम A</span></p></td>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कॉलम B</span></p></td>\n</tr>\n<tr>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. डिस्क क्लीनअप (Disk Cleanup)</span></p></td>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">a) व्यक्तिगत फ़ाइलों की प्रतियों का किसी बाहरी स्टोरेज पर बैकअप लेता है</span></p></td>\n</tr>\n<tr>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. डिस्क डीफ़्रेग्मेंटर (Disk Defragmenter)</span></p></td>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">b) डिस्क स्थान खाली करने के लिए अस्थायी फ़ाइलों को हटाता है</span></p></td>\n</tr>\n<tr>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3. फ़ाइल हिस्ट्री (File History)</span></p></td>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">c) सक्रिय प्रक्रियाओं और सिस्टम संसाधन उपयोग की निगरानी करता है</span></p></td>\n</tr>\n<tr>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">4. टास्क मैनेजर (Task Manager)</span></p></td>\n<td style=\"border: 1px solid black;\"><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">d) प्रदर्शन सुधारने के लिए ड्राइव पर खंडित (fragmented) डेटा को पुनर्व्यवस्थित करता है</span></p></td>\n</tr>\n</table>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - b, 2 - d, 3 - a, 4 - c</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - d, 2 - b, 3 - a, 4 - c</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - b, 2 - a, 3 - d, 4 - c</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - c, 2 - d, 3 - b, 4 - a</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सही मिलान इस प्रकार है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. डिस्क क्लीनअप (b):</span><span> यह स्टोरेज स्पेस खाली करने के लिए अस्थायी फ़ाइलों, कैश्ड फ़ाइलों और सिस्टम फ़ाइलों को हटाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. डिस्क डीफ़्रेग्मेंटर (d):</span><span> यह हार्ड ड्राइव पर बिखरे (खंडित) डेटा को समूहित करता है ताकि डेटा एक्सेस गति में सुधार हो सके।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3. फ़ाइल हिस्ट्री (a):</span><span> यह विंडोज़ की एक इनबिल्ट बैकअप सुविधा है जो किसी बाहरी ड्राइव या नेटवर्क पर उपयोगकर्ता फ़ाइलों के संस्करणों को स्वचालित रूप से सहेजती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">4. टास्क मैनेजर (c):</span><span> यह वर्तमान में चल रहे प्रोग्राम, बैकग्राउंड प्रोसेस, CPU, मेमोरी, डिस्क और नेटवर्क उपयोग की वास्तविक समय में निगरानी करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः सही उत्तर 1 - b, 2 - d, 3 - a, 4 - c है।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MS Excel 2016 में किसी एकल सेल (cell) में अधिकतम कितने वर्ण (characters) हो सकते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1,024 वर्ण</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>16,384 वर्ण</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>32,767 वर्ण</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>65,536 वर्ण</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Microsoft Excel 2007 और उसके बाद के संस्करणों (Excel 2016 सहित) में किसी एकल सेल में अधिकतम 32,767 वर्ण (characters) समाहित हो सकते हैं। हालाँकि, टेक्स्ट रैपिंग के बिना सेल में केवल 1,024 वर्ण ही दिखाई देते हैं।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate meaning of the underlined word in the    given sentence.</p>    <p style=\"orphans:0;widows:0\">The manager's <u>mercurial</u>    temperament made it difficult for his team to predict his    reactions.</p>", "option1": "<p style=\"orphans:0;widows:0\">    sluggish and indifferent</p>", "option2": " <p style=\"orphans:0;widows:0\">    volatile and unpredictable</p>", "option3": " <p style=\"orphans:0;widows:0\">    composed and steadfast</p>", "option4": " <p style=\"orphans:0;widows:0\">    obstinate and rigid</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The underlined word <b>mercurial</b> means 'subject to sudden or    unpredictable changes of mood or mind; erratic or volatile'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Therefore,    the most appropriate meaning is <b>volatile and unpredictable</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    other options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sluggish     and indifferent:</b> Slow-moving, lacking energy or enthusiasm.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Composed     and steadfast:</b> Calm, steady, and resolute.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Obstinate and rigid:</b>     Stubbornly refusing to change one's opinion or course of action.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Sentences of a paragraph are given below in jumbled order. Arrange    the sentences in the correct order to form a meaningful and    coherent paragraph.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A. Among    these treasures was an ornate solid gold coffin housing the    pharaoh's mummified remains.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B. In 1922,    British archaeologist Howard Carter made a remarkable discovery in    Egypt's Valley of the Kings.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C. It was the    intact tomb of the young pharaoh Tutankhamun, filled with    thousands of priceless artifacts.</p>    <p style=\"orphans:0;widows:0\">D. This spectacular find    instantly captured the world's imagination and sparked a global    fascination with ancient Egypt.</p>", "option1": "<p style=\"orphans:0;widows:0\">    BCAD</p>", "option2": " <p style=\"orphans:0;widows:0\">    BDCA</p>", "option3": " <p style=\"orphans:0;widows:0\">    CBAD</p>", "option4": " <p style=\"orphans:0;widows:0\">    BACD</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct order is <b>BCAD</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B</b>    introduces the central subject and setting (Howard Carter making a    discovery in 1922 in Egypt's Valley of the Kings), so it is the    opening sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C</b>    follows <b>B</b> directly because the pronoun 'It' refers to the    'remarkable discovery' and identifies it as the tomb of    Tutankhamun containing priceless artifacts.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A</b>    links to <b>C</b> through the phrase 'Among these treasures',    referring back to the 'thousands of priceless artifacts' mentioned    at the end of C.</p>    <p style=\"orphans:0;widows:0\"><b>D</b> concludes the paragraph    by describing the worldwide reaction and enduring impact of this    spectacular find.</p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">The manager remarked that despite    the economic downturn, there were __________ complaints from    clients this quarter than during the same period last year.</p>", "option1": "<p style=\"orphans:0;widows:0\">    far fewer</p>", "option2": " <p style=\"orphans:0;widows:0\">    far less</p>", "option3": " <p style=\"orphans:0;widows:0\">    very few</p>", "option4": " <p style=\"orphans:0;widows:0\">    lesser</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>far fewer</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    presence of the conjunction 'than' indicates that a comparative    degree is required, eliminating 'very few' (which is in the    positive degree).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. The noun    'complaints' is a plural countable noun. Standard grammar requires    'fewer' for countable nouns and 'less' for uncountable nouns.    Hence, 'far less' is incorrect.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. 'Lesser'    refers to lower quality, size, or importance (e.g., 'the lesser of    two evils') and is not used here to compare numerical quantities    with 'than'.</p>    <p style=\"orphans:0;widows:0\">4. 'Far' is appropriately used as    an adverb/intensifier to modify the comparative determiner    'fewer'. Therefore, <b>far fewer</b> is the correct choice.</p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    A sentence has been split up into segments and given below in    jumbled order. While the first and the last segments of the    sentence (1 and 6) are in the correct order, the segments in    between are jumbled up. Arrange the segments in the correct order    to form a meaningful and coherent sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1) True    education does not consist</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">P) merely in    acquiring knowledge</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Q) of facts    and figures,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R) and to    develop the capacity</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">S) but in    training the mind to think</p>    <p style=\"orphans:0;widows:0\">6) for independent judgment.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Q, P, R, S</p>", "option2": " <p style=\"orphans:0;widows:0\">    P, Q, S, R</p>", "option3": " <p style=\"orphans:0;widows:0\">    S, R, P, Q</p>", "option4": " <p style=\"orphans:0;widows:0\">    P, R, Q, S</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sequence is <b>P, Q, S, R</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Segment 1    ends with the verb phrase \"does not consist\", which    naturally takes the prepositional phrase in <b>P</b> (\"merely    in acquiring knowledge\").</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Segment <b>Q</b>    (\"of facts and figures,\") qualifies what kind of    \"knowledge\" is referred to in <b>P</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Following    the \"not merely... but...\" correlative construction,    segment <b>S</b> (\"but in training the mind to think\")    logically follows <b>Q</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Segment <b>R</b>    (\"and to develop the capacity\") parallels the infinitive    phrase \"to think\" in <b>S</b> and connects directly to    segment 6 (\"for independent judgment\").</p>    <p style=\"orphans:0;widows:0\">Hence, the complete sentence is:    <i>\"True education does not consist merely in acquiring    knowledge of facts and figures, but in training the mind to think    and to develop the capacity for independent judgment.\"</i></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in reported    speech.</p>    <p style=\"orphans:0;widows:0\">\"I am confident of    completing this project on time,\" the architect stated    proudly.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The architect proudly stated that he was confident of completing    that project on time.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The architect proudly stated that he is confident of completing    that project on time.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The architect proudly stated that he has been confident of    completing this project on time.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The architect proudly stated that he would be confident of    completing that project on time.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the given assertive sentence into indirect speech,    follow these rules:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     reporting verb 'stated proudly' remains in the past tense,     followed by the conjunction 'that'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     first-person pronoun 'I' changes to the third-person pronoun 'he'     according to the subject ('the architect').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     simple present tense verb 'am' changes to the simple past tense     verb 'was'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     demonstrative adjective 'this' changes to 'that'.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Thus, the correct indirect speech    is: <i>The architect proudly stated that he was confident of    completing that project on time.</i> Therefore, option A is    correct.</p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"orphans:0;widows:0\">    Select the option that can be used as a one-word substitute for    the given group of words: 'A person who dabbles in art,    literature, or science without having serious commitment or deep    knowledge'.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Connoisseur</p>", "option2": " <p style=\"orphans:0;widows:0\">    Dilettante</p>", "option3": " <p style=\"orphans:0;widows:0\">    Polymath</p>", "option4": " <p style=\"orphans:0;widows:0\">    Virtuoso</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitute is <b>Dilettante</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Dilettante:</b>     A person who cultivates an area of interest, such as the arts or     sciences, without real commitment or serious knowledge (an     amateur or dabbler).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Connoisseur:</b>     An expert judge in matters of taste and fine art.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Polymath:</b>     A person of wide-ranging knowledge or learning.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Virtuoso:</b> A person     highly skilled in music or another artistic pursuit.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate homophone from the options to fill in    the blank.</p>    <p style=\"orphans:0;widows:0\">The board of directors decided to    give the new CEO free ________ to overhaul the company's    operational strategy.</p>", "option1": "<p style=\"orphans:0;widows:0\">    reign</p>", "option2": " <p style=\"orphans:0;widows:0\">    rein</p>", "option3": " <p style=\"orphans:0;widows:0\">    rain</p>", "option4": " <p style=\"orphans:0;widows:0\">    rune</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct homophone to fill in the blank is <b>rein</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The idiom    <b>'give free rein'</b> means to give someone complete freedom and    discretion to act or make decisions as they see fit. It originates    from horseback riding, where loosening the 'reins' (the straps    used to guide a horse) allows the horse to move freely without    restraint.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the homophones:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>rein:</b>     a long, narrow strap attached to a horse's bit used to guide or     control it (used in the idiom 'free rein').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>reign:</b>     the period during which a monarch rules, or the act of ruling. A     very common error is mistakenly writing 'free reign'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>rain:</b>     condensed water vapor falling in drops from clouds.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>rune:</b>     a letter of an ancient Germanic alphabet.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, option B is the    correct choice.</p>", "question_heading": ""}, {"sr_no": 53, "question": "Sधnपधncधौ यी ो ूोनोgनोूु ोनध giॅधn ृिधयथ in ुहंृिधक यनकधन. Aननोngध पुध ौधnपधncधौ in पुध cयननधcप यनकधन पय ीयनं ो ंधोningीिह ोnक cयुधनधnप ूोनोgनोूु. A. Oॅधन पiंध, पुध कधcयंूयौiपiयn यी यनgोnic ंोपपधन in पुधौध कहंूing ौiपधौ निधधोौधौ ुोशोनकयहौ gनधधnुयहौध gोौधौ िiाध ंधपुोnध. B. Rोूiक हनृोniौोपiयn ुोौ िधक पय ोn धसूयnधnपiोि incनधोौध in ंहniciूोि ौियiक थोौपध ोcनयौौ ंोुयन ciपiधौ. C. Mधपुोnध nयप यnिद ोccिधधनोपधौ gियृोि थोनंing ृहप ोिसय पनiggधनौ ीनधतहधnप, हncयnपनियिोृिध िोnकीiिि ीiनधौ. D. Mयौप यी पुiौ हnपनधोपधक थोौपध धnकौ हू in यूधn िोnकीiििस ियcोपधक यn पुध यहपौाiनपौ यी ंधपनयूियiपोn ोनधोौ. E. Tुधौध पयसic ीiनधौ ौधॅधनिधद कधgनोकध ोiन तहोिiपद, ूयौing ौधनiयहौ ुधोिपु ुोशोनकौ पय nधोनृद नधौiकधnपौ.", "option1": "<p style=\"orphans:0;widows:0\">    BDACE</p>", "option2": " <p style=\"orphans:0;widows:0\">    DABCE</p>", "option3": " <p style=\"orphans:0;widows:0\">    BCADE</p>", "option4": " <p style=\"orphans:0;widows:0\">    DBACE</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct order is <b>BDACE</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>B</b>    is the opening sentence as it introduces the general topic: the    exponential increase in municipal solid waste due to rapid    urbanisation.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>D</b>    follows B because 'this untreated waste' refers directly to the    'municipal solid waste' introduced in B and mentions where it ends    up (open landfills).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. <b>A</b>    logically comes next as 'these dumping sites' refers back to the    landfills mentioned in D and explains the generation of methane    gas from decomposing waste.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. <b>C</b>    links directly to A by describing the dangers of methane,    including triggering landfill fires.</p>    <p style=\"orphans:0;widows:0\">5. <b>E</b> concludes the    paragraph by explaining the health and environmental consequences    of 'these toxic fires' mentioned in C.</p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct spelling of the incorrectly spelt word in the    given sentence.</p>    <p style=\"orphans:0;widows:0\">Defacing the ancient monument was    condemned as a sacreligious act by the local authorities.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Sacriligious</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sacrilegious</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sacraligious</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sacreligous</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The incorrectly spelt word in the given sentence is    'sacreligious'. The correct spelling is <b>Sacrilegious</b>    (S-A-C-R-I-L-E-G-I-O-U-S), which means involving or guilty of    sacrilege (disrespect toward something considered sacred). A    common error is spelling it with '-religious' instead of    '-legious'. Therefore, option B is correct.</p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in direct    speech.</p>    <p style=\"orphans:0;widows:0\">The manager admitted that he had    rejected the proposal the previous day.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The manager said, \"I have rejected the proposal yesterday.\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    The manager said, \"I rejected the proposal yesterday.\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    The manager said, \"I had rejected the proposal the previous    day.\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    The manager says, \"I rejected the proposal yesterday.\"</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the indirect sentence into direct speech, we follow    these rules:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     reporting verb 'admitted' can be expressed as 'said' in direct     speech.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     pronoun 'he' refers to the manager, so it changes back to the     first-person pronoun 'I'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The past     perfect tense ('had rejected') accompanied by the past time     expression 'the previous day' must convert back to simple past     tense ('rejected') along with 'yesterday'. Note that present     perfect ('have rejected') cannot be used with a specific past     time marker like 'yesterday'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">'The     previous day' changes back to 'yesterday'.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, the correct direct    sentence is: <b>The manager said, \"I rejected the proposal    yesterday.\"</b></p>", "question_heading": ""}, {"sr_no": 56, "question": "Sधnपधncधौ यी ो ूोनोgनोूु ोनध giॅधn ृिधयथ in ुहंृिधक यनकधन. Aननोngध पुध ौधnपधncधौ in पुध cयननधcप यनकधन पय ीयनं ो ंधोningीिह ोnक cयुधनधnप ूोनोgनोूु. A. Tुiौ inपधnौध cयgniपiॅध ौपiंिहोपiयn ौपनधngपुधnौ nधहनोि cयnnधcपiयnौ ोnक ृहiिकौ ीयcहौ यॅधन पiंध. B. Rधोकing iौ थiकिधद नधcयgnप्रधक nयप ंधनिधद ोौ ो िधiौहनध ोcपiॅiपद, ृहप ोौ ोn ोcपiॅध ंधnपोि थयनायहप. C. Tुधनधीयनध, cिहपiॅोपing ो कोiिद नधोकing ुोृiप िहपiंोपिधद cयnपनiृहपधौ पय ौहौपोinधक inपिधिधcपहोि gनयथपु. D. Wुधn ो ूधनौयn नधोकौ, पुध ृनोin iौ नधतहiनधक पय कधciूुधन ौदंृियस, cयnौपनहcप ॅiॅiक iंोgधनद, ोnक inपधनूनधप ोृौपनोcप iकधोौ. E. Wiपु ौपनयngधन nधहनोि nधपथयनो, ोn inकiॅiकहोि कधॅिधयूौ धnुोncधक ंधंयनद नधपधnपiयn ोnक ौुोनूधन ोnोिदपicोि पुinाing.", "option1": "<p style=\"orphans:0;widows:0\">    BDAEC</p>", "option2": " <p style=\"orphans:0;widows:0\">    BDACE</p>", "option3": " <p style=\"orphans:0;widows:0\">    DBAEC</p>", "option4": " <p style=\"orphans:0;widows:0\">    BCDAE</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct logical sequence is <b>BDAEC</b>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>B</b>    is the opening sentence as it introduces the central theme:    reading as an active mental workout.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>D</b>    follows <b>B</b> by detailing what happens during reading    (deciphering symbols, constructing imagery, etc.).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. <b>A</b>    refers back to the actions in <b>D</b> using the phrase \"This    intense cognitive stimulation\" and explains its effect on    neural connections.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. <b>E</b>    directly links with <b>A</b> through \"With stronger neural    networks...\" explaining the cognitive benefits.</p>    <p style=\"orphans:0;widows:0\">5. <b>C</b> begins with the    concluding transition \"Therefore\" and summarizes the    broader outcome of sustaining this habit.</p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Because of the sensitive nature    of the peace talks, the envoy was advised to conduct __________    inquiries rather than attracting public attention.</p>", "option1": "<p style=\"orphans:0;widows:0\">    discrete</p>", "option2": " <p style=\"orphans:0;widows:0\">    discreet</p>", "option3": " <p style=\"orphans:0;widows:0\">    discordant</p>", "option4": " <p style=\"orphans:0;widows:0\">    discursive</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct word to fill in the blank is <b>discreet</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Discreet</b>     (adjective) means careful and circumspect in one's speech or     actions, especially to avoid attracting unwanted attention or to     keep something confidential. The phrase \"sensitive nature of     the peace talks\" clearly indicates that cautious and     confidential inquiries were required.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Discrete</b>:     Individually separate and distinct (a homophone of <i>discreet</i>).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Discordant</b>:     Disagreeing, harsh, or incongruous.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Discursive</b>:     Digressing from subject to subject; rambling.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in passive    voice.</p>    <p style=\"orphans:0;widows:0\">Why did they laugh at the    proposal put forward by the chairman?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Why was the proposal put forward by the chairman laughed at?</p>", "option2": " <p style=\"orphans:0;widows:0\">    Why the proposal put forward by the chairman was laughed at?</p>", "option3": " <p style=\"orphans:0;widows:0\">    Why was the proposal put forward by the chairman laughed?</p>", "option4": " <p style=\"orphans:0;widows:0\">    Why had the proposal put forward by the chairman been laughed at?</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is an interrogative sentence in the Simple Past    Tense containing a prepositional verb (<i>laugh at</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The rules for    converting a Simple Past interrogative sentence into passive voice    are:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Active    structure: <i>Wh-word + did + subject + base verb + preposition +    object?</i></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive    structure: <i>Wh-word + was/were + object + past participle (V3) +    preposition (+ by + subject)?</i></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Here, the    object is the singular noun phrase <b>the proposal put forward by    the chairman</b>, so the auxiliary verb must be <b>was</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option A</b>    is correct because it maintains correct subject-auxiliary    inversion (<i>Why was the proposal...</i>) and correctly retains    the preposition <i>at</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option B</b>    is incorrect due to a lack of inversion (<i>Why the proposal...    was</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Option C</b>    is inc
