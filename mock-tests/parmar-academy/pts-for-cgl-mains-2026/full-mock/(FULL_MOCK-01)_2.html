2.akamai.net.in/website/bulk_uploader_images/1794808468935_image050.png\" width=\"26\" height=\"20\" alt style=\"vertical-align:middle\" ><span> सेमी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3 सेमी</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>समबाहु त्रिभुज का क्षेत्रफल = (√3/4)a²;</span><span>  </span><span>पार्श्व पृष्ठीय क्षेत्रफल = ½ × परिमाप × तिर्यक ऊँचाई;</span><span>  </span><span>ऊँचाई h = √(l² − r²), जहाँ r = आधार की अंतःत्रिज्या</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. आधार का क्षेत्रफल = (√3/4) × (8√3)² = (√3/4) × 192 = 48√3 सेमी²।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. पार्श्व पृष्ठीय क्षेत्रफल = कुल पृष्ठीय क्षेत्रफल − आधार का क्षेत्रफल = 108√3 − 48√3 = 60√3 सेमी²।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. आधार का परिमाप = 3 × 8√3 = 24√3 सेमी। अतः ½ × 24√3 × l = 60√3 ⇒ 12√3 × l = 60√3 ⇒ तिर्यक ऊँचाई l = 5 सेमी।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. समबाहु आधार की अंतःत्रिज्या = a/(2√3) = 8√3/(2√3) = 4 सेमी।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. ऊँचाई h = √(l² − r²) = √(25 − 16) = √9 = 3 सेमी।</span></p>", "question_heading": ""}, {"sr_no": 132, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">6 सेमी त्रिज्या वाले एक ठोस धातु के गोले को पिघलाकर समान मोटाई का एक खोखला बेलन बनाया जाता है। यदि बेलन की ऊँचाई 32 सेमी और उसकी बाहरी त्रिज्या 5 सेमी है, तो बेलन की मोटाई ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1.5 सेमी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 सेमी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2 सेमी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2.5 सेमी</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>गोले का आयतन = (4/3)πr³;</span><span>  </span><span>खोखले बेलन का आयतन = πh(R² − r²);</span><span>  </span><span>पुनः ढालने पर आयतन समान रहता है</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. गोले का आयतन = (4/3)π × 6³ = (4/3)π × 216 = 288π सेमी³।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. खोखला बेलन: बाह्य त्रिज्या R = 5 सेमी, ऊँचाई h = 32 सेमी, आंतरिक त्रिज्या r (अज्ञात)। आयतन = π(25 − r²) × 32।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 32π(25 − r²) = 288π ⇒ 25 − r² = 9 ⇒ r² = 16 ⇒ r = 4 सेमी।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. मोटाई = R − r = 5 − 4 = 1 सेमी।</span></p>", "question_heading": ""}, {"sr_no": 133, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">12 सेमी भुजा वाले एक घन की सभी सतहों को लाल रंग से रंगा गया है और इसे 1 सेमी³ के छोटे घनों में काटा गया है। इनमें से कितने छोटे घनों की कम से कम एक सतह रंगी हुई है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>728</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1152</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1216</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>n × n × n के घन को इकाई घनों में काटने पर: कोई फलक रंगा न हो ऐसे घन = (n − 2)³;</span><span>  </span><span>कम से कम एक फलक रंगा हो ऐसे घन = n³ − (n − 2)³</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. कुल छोटे घन = 12³ = 1728।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. जिन घनों का कोई फलक रंगा नहीं है वे भीतरी घन बनाते हैं (हर ओर से एक परत हटाने पर): (12 − 2)³ = 10³ = 1000।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. कम से कम एक फलक रंगे घन = 1728 − 1000 = 728।</span></p>", "question_heading": ""}, {"sr_no": 134, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक खोखले धात्विक गोले की आंतरिक और बाहरी त्रिज्याएँ क्रमशः 3 सेमी और 5 सेमी हैं। इसे पिघलाकर 8 सेमी ऊँचाई वाला एक ठोस लंब वृत्तीय शंकु बनाया जाता है। शंकु के आधार की त्रिज्या ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 सेमी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6 सेमी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7 सेमी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14 सेमी</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>खोखले गोले का आयतन = (4/3)π(R³ − r³);</span><span>  </span><span>शंकु का आयतन = (1/3)πr²h</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. खोखले गोले का आयतन = (4/3)π(5³ − 3³) = (4/3)π(125 − 27) = (4/3)π × 98 = 392π/3।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. शंकु का आयतन = (1/3) × π × r² × 8 = 8πr²/3।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. पिघलाने पर आयतन नहीं बदलता: 8πr²/3 = 392π/3 ⇒ r² = 392 ÷ 8 = 49।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. r = 7 सेमी।</span></p>", "question_heading": ""}, {"sr_no": 135, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">50 प्रेक्षणों का माध्य 40 है। बाद में यह पाया गया कि दो प्रेक्षणों को 32 और 54 के स्थान पर गलती से 23 और 45 पढ़ा गया था। इसके अतिरिक्त, 58 का एक प्रेक्षण गलती से जोड़ दिया गया था। शेष 49 प्रेक्षणों का सही माध्य ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>39.8</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40.0</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40.2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40.4</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>प्रेक्षणों का योग = माध्य × प्रेक्षणों की संख्या;</span><span>  </span><span>सही योग = गलत योग + संशोधन</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. गलत योग = 50 × 40 = 2000।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. संशोधन: 23 की जगह 32 (+9) और 45 की जगह 54 (+9)। योग = 2000 + 9 + 9 = 2018।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. गलती से जोड़ा गया प्रेक्षण 58 हटाने पर: योग = 2018 − 58 = 1960 और प्रेक्षणों की संख्या = 49।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. सही माध्य = 1960 ÷ 49 = 40।</span></p>", "question_heading": ""}, {"sr_no": 136, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">प्रथम </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image028.png\" width=\"10\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> प्राकृतिक संख्याओं का भारित समांतर माध्य, जहाँ प्रत्येक संख्या </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image051.png\" width=\"9\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> का भार </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image052.png\" width=\"17\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> है, किसके द्वारा दिया जाता है?</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image053.png\" width=\"63\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image054.png\" width=\"55\" height=\"36\" alt style=\"vertical-align:middle\" ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image055.png\" width=\"34\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image056.png\" width=\"63\" height=\"38\" alt style=\"vertical-align:middle\" ></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>Σk = n(n + 1)/2;</span><span>  </span><span>Σk² = n(n + 1)(2n + 1)/6;</span><span>  </span><span>Σk³ = [n(n + 1)/2]²;</span><span>  </span><span>भारित माध्य = Σ(w × x)/Σw</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. k का भार k² है, अतः भारित माध्य = Σ(k × k²)/Σk² = Σk³/Σk²।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Σk³ = n²(n + 1)²/4 और Σk² = n(n + 1)(2n + 1)/6।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. माध्य = [n²(n + 1)²/4] × [6/(n(n + 1)(2n + 1))]।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. n(n + 1) कटने पर: माध्य = 6n(n + 1)/[4(2n + 1)] = 3n(n + 1)/[2(2n + 1)]।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. जाँच n = 2 के लिए: (1×1 + 2×4)/(1 + 4) = 9/5, और 3×2×3/(2×5) = 18/10 = 9/5 ✓</span></p>", "question_heading": ""}, {"sr_no": 137, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">तीन निष्पक्ष पासे एक साथ फेंके जाते हैं। ऊपरी सतहों पर दिखने वाली संख्याओं का योग 15 से अधिक होने की प्रायिकता क्या है?</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image057.png\" width=\"25\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image058.png\" width=\"25\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image059.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image060.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>प्रायिकता = अनुकूल परिणामों की संख्या ÷ कुल परिणामों की संख्या</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. तीन पासों के कुल परिणाम = 6³ = 216।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. योग 15 से अधिक अर्थात् योग 16, 17 या 18।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. योग 16: {6, 6, 4} के 3 क्रम और {6, 5, 5} के 3 क्रम = 6 परिणाम।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. योग 17: {6, 6, 5} के 3 क्रम = 3 परिणाम। योग 18: {6, 6, 6} = 1 परिणाम।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. अनुकूल परिणाम = 6 + 3 + 1 = 10, अतः P = 10/216 = 5/108।</span></p>", "question_heading": ""}, {"sr_no": 138, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक थैले में 4 लाल, 5 नीली और 3 हरी गेंदें हैं। बिना प्रतिस्थापन के एक के बाद एक तीन गेंदें यादृच्छिक रूप से निकाली जाती हैं। पहली गेंद के लाल, दूसरी के नीले और तीसरी के हरे होने की प्रायिकता ज्ञात कीजिए।</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image061.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image062.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image063.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image064.png\" width=\"17\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>बिना प्रतिस्थापन के: P(A, फिर B, फिर C) = P(A) × P(A के बाद B) × P(A और B के बाद C)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. कुल गेंदें = 4 + 5 + 3 = 12।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. P(पहली लाल) = 4/12।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. अब 11 गेंदें बची हैं: P(दूसरी नीली) = 5/11।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. अब 10 गेंदें बची हैं: P(तीसरी हरी) = 3/10।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. P = 4/12 × 5/11 × 3/10 = 60/1320 = 1/22।</span></p>", "question_heading": ""}, {"sr_no": 139, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">अंकों 0, 1, 2, 3, 4, 5 का बिना पुनरावृत्ति उपयोग करके 5 अंकों की कितनी सम संख्याएँ बनाई जा सकती हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>288</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>312</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>336</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>360</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>गणना का गुणन सिद्धांत। सम संख्या के लिए इकाई का अंक 0, 2 या 4 होना चाहिए और पहला अंक 0 नहीं हो सकता</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. अंकों {0, 1, 2, 3, 4, 5} से बिना पुनरावृत्ति 5 अंकों की संख्या में 6 में से 5 अंक प्रयुक्त होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. स्थिति 1, इकाई का अंक = 0: शेष 4 स्थान बचे 5 अंकों से 5 × 4 × 3 × 2 = 120 तरीकों से भरते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. स्थिति 2, इकाई का अंक = 2 या 4 (2 विकल्प): पहला स्थान 0 से नहीं भर सकता, अतः 4 विकल्प; बीच के 3 स्थान शेष 4 अंकों से 4 × 3 × 2 = 24 तरीकों से भरते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. स्थिति 2 का कुल = 2 × 4 × 24 = 192।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. कुल सम संख्याएँ = 120 + 192 = 312।</span></p>", "question_heading": ""}, {"sr_no": 140, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">5:00 और 6:00 के बीच किस समय घड़ी की सुइयाँ दूसरी बार समकोण पर होंगी?</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image065.png\" width=\"48\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image066.png\" width=\"48\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image067.png\" width=\"48\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:11pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image068.png\" width=\"48\" height=\"35\" alt style=\"vertical-align:middle\" ></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>मिनट की सुई 6° प्रति मिनट और घंटे की सुई 0.5° प्रति मिनट चलती है, अतः मिनट की सुई 5.5° प्रति मिनट आगे बढ़ती है। 5:00 बजे घंटे की सुई 5 × 30° = 150° आगे होती है</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 5:00 के m मिनट बाद मिनट की सुई 5.5m डिग्री बढ़त बनाती है, अतः अंतर 150° से घटकर (150 − 5.5m)° हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. सुइयाँ समकोण पर तब होंगी जब 5.5m − 150 = ±90।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 5.5m = 60 ⇒ m = 120/11 = 10 10/11 मिनट: यह पहला समकोण है (5:10 10/11)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. 5.5m = 240 ⇒ m = 480/11 = 43 7/11 मिनट: यह दूसरा समकोण है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. अतः समय 5:43 7/11 है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. जाँच: 43 7/11 पर मिनट की सुई = 43 7/11 × 6 = 261.8°; घंटे की सुई = 150° + 0.5 × 43.64 = 171.8°; अंतर = 90° ✓</span></p>", "question_heading": ""}, {"sr_no": 141, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A किसी काम को 20 दिनों में तथा B 30 दिनों में पूरा कर सकता है। उन्होंने एक साथ काम करना शुरू किया, लेकिन A ने काम पूरा होने से 4 दिन पहले काम छोड़ दिया। काम पूरा करने में लगे कुल दिनों की संख्या ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14.4 दिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13.6 दिन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15.2 दिन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>16.0 दिन</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>कार्य = क्षमता × समय;</span><span>  </span><span>कुल कार्य = दिनों का ल.स.प.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. कुल कार्य = ल.स.प.(20, 30) = 60 इकाई। A की क्षमता = 60/20 = 3 इकाई/दिन; B की क्षमता = 60/30 = 2 इकाई/दिन।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. माना कुल समय x दिन है। B पूरे x दिन काम करता है, जबकि A (x − 4) दिन काम करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 3(x − 4) + 2x = 60 ⇒ 5x − 12 = 60 ⇒ 5x = 72।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. x = 72/5 = 14.4 दिन।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. जाँच: A ने 10.4 दिन × 3 = 31.2; B ने 14.4 दिन × 2 = 28.8; 31.2 + 28.8 = 60 ✓</span></p>", "question_heading": ""}, {"sr_no": 142, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक व्यक्ति 20 कदम चलते हुए ऊपर जाती हुई एस्केलेटर पर 30 सेकंड में ऊपर पहुँचता है। यदि वह अपनी चलने की गति दोगुनी कर देता है, तो वह 18 सेकंड में शीर्ष पर पहुँच जाता है। स्थिर एस्केलेटर पर कुल कितने कदम दिखाई देते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>45</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>50</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>30</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>60</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>स्थिर एस्केलेटर पर दिखने वाली सीढ़ियाँ N = व्यक्ति द्वारा चली गई सीढ़ियाँ + उस समय में एस्केलेटर द्वारा ऊपर ले जाई गई सीढ़ियाँ</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. चलने की गति = 20/30 = 2/3 सीढ़ी/सेकंड। माना एस्केलेटर की गति e सीढ़ी/सेकंड है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. स्थिति 1: 30 सेकंड में वह 20 सीढ़ियाँ चलता है और एस्केलेटर 30e सीढ़ियाँ चलता है, अतः N = 20 + 30e ... (i)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. स्थिति 2: दोगुनी गति = 4/3 सीढ़ी/सेकंड; 18 सेकंड में वह (4/3) × 18 = 24 सीढ़ियाँ चलता है, अतः N = 24 + 18e ... (ii)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. (i) और (ii) बराबर करने पर: 20 + 30e = 24 + 18e ⇒ 12e = 4 ⇒ e = 1/3।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. N = 20 + 30 × (1/3) = 30।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. (ii) से जाँच: 24 + 18 × (1/3) = 30 ✓</span></p>", "question_heading": ""}, {"sr_no": 143, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">यदि </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image069.png\" width=\"196\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> तथा </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image070.png\" width=\"96\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> है, तो </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image071.png\" width=\"8\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>अनुपात दिए हों तो प्रत्येक राशि को उभयनिष्ठ अचर k के गुणज के रूप में लिखें; तीनों को जोड़ने पर 2(a + b + c) मिलता है</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. माना a + b = 6k, b + c = 7k, c + a = 8k।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. जोड़ने पर: 2(a + b + c) = 21k ⇒ 2 × 14 = 21k ⇒ k = 28/21 = 4/3।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. a + b = 6k = 6 × 4/3 = 8।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. c = (a + b + c) − (a + b) = 14 − 8 = 6।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. जाँच: b + c = 28/3 ⇒ b = 10/3, a = 14/3; c + a = 6 + 14/3 = 32/3 = 8k ✓</span></p>", "question_heading": ""}, {"sr_no": 144, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">यदि </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image072.png\" width=\"128\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> तथा </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image073.png\" width=\"124\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> है, तो </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image074.png\" width=\"49\" h  + cos²θ = 1 से: m² + n² = a² + b²।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. जाँच θ = 0 के लिए: m = a, n = −b, अतः m² + n² = a² + b² ✓</span></p>", "question_heading": ""}, {"sr_no": 145, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">मान ज्ञात कीजिए: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image079.png\" width=\"200\" height=\"29\" alt style=\"vertical-align:middle\" ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>11</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>tan60° = √3, cos45° = 1/√2, sec30° = 2/√3, cos90° = 0, csc30° = 2, sec60° = 2, cot30° = √3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. tan²60° = 3; 4cos²45° = 4 × 1/2 = 2; 3sec²30° = 3 × 4/3 = 4; 5cos²90° = 0।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. अंश = 3 + 2 + 4 + 0 = 9।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. हर = csc30° + sec60° − cot²30° = 2 + 2 − 3 = 1।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. मान = 9/1 = 9।</span></p>", "question_heading": ""}, {"sr_no": 146, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक मध्यम विषम बंटन में, बहुलक और माध्यिका क्रमशः 42 और 38 हैं। माध्य ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>34</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>37</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>36</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>मध्यम विषम बंटन के लिए अनुभवजन्य संबंध: बहुलक = 3 × माध्यिका − 2 × माध्य</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. बहुलक = 42 और माध्यिका = 38 रखने पर: 42 = 3(38) − 2 × माध्य = 114 − 2 × माध्य।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 2 × माध्य = 114 − 42 = 72।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. माध्य = 36।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. जाँच: 3 × 38 − 2 × 36 = 114 − 72 = 42 ✓</span></p>", "question_heading": ""}, {"sr_no": 147, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">गुणनफल </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image080.png\" width=\"190\" height=\"20\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> में अंत में आने वाले शून्यों की संख्या ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>350</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>300</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>325</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>375</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">सूत्र: </span><span>अंत के शून्यों की संख्या = 2 और 5 के युग्मों की संख्या = (2 की घात, 5 की घात) में से छोटी। kᵏ में 5 की घात = k × (k में 5 की घात)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">चरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. गुणनफल में 2 की घात, 5 की घात से बहुत अधिक है, इसलिए केवल 5 के गुणनखंड गिनें।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. केवल 5 के गुणज योगदान देते हैं: k = 5, 10, 15, ..., 50।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. k = 5, 10, 15, 20 (प्रत्येक में 5 एक बार): 5 + 10 + 15 + 20 = 50।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. k = 25 (= 5²): 25 × 2 = 50।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. k = 30, 35, 40, 45 (प्रत्येक में 5 एक बार): 30 + 35 + 40 + 45 = 150।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. k = 50 (= 2 × 5²): 50 × 2 = 100।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7. 5 की कुल घात = 50 + 50 + 150 + 100 = 350, अतः अंत में 350 शून्य हैं।</span></p>", "question_heading": ""}, {"sr_no": 148, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">जब </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794808468935_image081.png\" width=\"29\" height=\"19\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> को 25 से विभाजित let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }

    .review-option.user-selected { border-width: 3px; font-weight: bold; }

    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
