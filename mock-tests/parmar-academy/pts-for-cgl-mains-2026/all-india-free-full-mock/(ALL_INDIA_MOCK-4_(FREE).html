yle=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For (9, 5, 151):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image043.png\" width=\"342\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly, checking the options:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For option (11, 4, 181):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image044.png\" width=\"359\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, (11, 4, 181) follows the same pattern.</span></p>", "question_heading": ""}, {"sr_no": 104, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In the number 47286351 (counting from left to right), 1 is added to each even digit at an odd position and 1 is subtracted from each odd digit at an odd position, while 2 is subtracted from each even digit at an even position and 2 is added to each odd digit at an even position. How many digits will appear more than once in the new number thus formed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let us track each digit of the number 47286351 according to its position (from left to right) and parity:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1st digit (odd position): 4 is even </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image045.png\" width=\"80\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2nd digit (even position): 7 is odd </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image046.png\" width=\"80\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3rd digit (odd position): 2 is even </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image047.png\" width=\"80\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4th digit (even position): 8 is even </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image048.png\" width=\"80\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5th digit (odd position): 6 is even </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image049.png\" width=\"80\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6th digit (even position): 3 is odd </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image050.png\" width=\"80\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7th digit (odd position): 5 is odd </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image051.png\" width=\"80\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8th digit (even position): 1 is odd </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image052.png\" width=\"80\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The newly formed number is 59367543.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Frequencies of digits in the new number:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Digit 3 appears 2 times.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Digit 4 appears 1 time.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Digit 5 appears 2 times.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Digit 6 appears 1 time.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Digit 7 appears 1 time.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Digit 9 appears 1 time.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Thus, exactly two digits (3 and 5) appear more than once.</span></p>", "question_heading": ""}, {"sr_no": 105, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two statements I and II have been given. These statements may be independent causes or effects of independent causes or a common cause. One of the statements may be the effect of the other statement. Read both the statements and select the correct option.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. The sales of domestic air purifiers and prescribed respiratory inhalers witnessed an unprecedented surge across the metropolitan city over the last two weeks.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. The civic authorities in the metropolitan city ordered the immediate suspension of all non-essential construction work and mandated mechanised sweeping of arterial roads.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement I is the cause and statement II is its effect.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement II is the cause and statement I is its effect.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both statements I and II are effects of a common cause.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both statements I and II are effects of independent causes.</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">- Statement I:</span><span> Increased air pollution led to higher demand for air purifiers and respiratory inhalers.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">- Statement II:</span><span> The authorities imposed restrictions on construction and introduced mechanised road sweeping to control air pollution.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, both statements are effects of a common cause, i.e., severe air pollution.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, both statements I and II are effects of a common cause.</span></p>", "question_heading": ""}, {"sr_no": 106, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the figure from the options that can replace the question mark (?) and complete the given series.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image053.png\" width=\"500\" height=\"102\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image054.png\" width=\"130\" height=\"130\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image055.png\" width=\"130\" height=\"130\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image056.png\" width=\"130\" height=\"130\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image057.png\" width=\"130\" height=\"130\" alt ></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The series follows two simultaneous patterns:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. Number and Identity of Elements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In each subsequent frame, one new element is appended at the right end (1, 2, 3, 4, and finally 5 elements in the 5th frame).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The elements repeat in a fixed cycle of three distinct shapes: (1) </span><span style=\"font-weight:bold\">Stem with an Arrowhead</span><span>, (2) </span><span style=\"font-weight:bold\">Stem with a Circle</span><span>, and (3) </span><span style=\"font-weight:bold\">Stem with a Square</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Following this sequence, the 5 elements from left to right in the 5th frame must be: </span><span style=\"font-weight:bold\">Arrow, Circle, Square, Arrow, Circle</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. Vertical Orientation (Inversion) Rule:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Whenever a new element enters the frame, it enters in the upright position (symbol at the top).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>With each step to the next frame, </span><span style=\"font-style:italic\">every existing element flips vertically</span><span> (inverts).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Tracing the orientations for Frame 5:1st element (Arrow): Up (F1) → Down (F2) → Up (F3) → Down (F4) → </span><span style=\"font-weight:bold\">Up (F5)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2nd element (Circle): Up (F2) → Down (F3) → Up (F4) → </span><span style=\"font-weight:bold\">Down (F5)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3rd element (Square): Up (F3) → Down (F4) → </span><span style=\"font-weight:bold\">Up (F5)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4th element (Arrow): Up (F4) → </span><span style=\"font-weight:bold\">Down (F5)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5th element (Circle): Newly added → </span><span style=\"font-weight:bold\">Up (F5)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, the correct figure contains: </span><span style=\"font-weight:bold\">Arrow (up), Circle (down), Square (up), Arrow (down), Circle (up)</span><span>, which matches option (C).</span></p>", "question_heading": ""}, {"sr_no": 107, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language, 'CRAFT' is coded as '26148', 'STARE' is coded as '78163', 'FROST' is coded as '46578', and 'ACTOR' is coded as '12856' (the digits do not necessarily correspond to the order of letters). What is the code for 'F' in that language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CRAFT </span><span style=\"font-family:Arial\">→</span><span> 26148</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FROST </span><span style=\"font-family:Arial\">→</span><span> 46578</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Common letters = R, F, T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Common digits = 4, 6, 8</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>STARE </span><span style=\"font-family:Arial\">→</span><span> 78163</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ACTOR </span><span style=\"font-family:Arial\">→</span><span> 12856</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Comparing the codes and eliminating the digits corresponding to other letters gives F = 4.</span></p>", "question_heading": ""}, {"sr_no": 108, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>How many meaningful English words can be formed using the second, fourth, sixth, and seventh letters of the word 'SECTIONAL', using each letter only once in each word?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>More than three</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The given word is 'SECTIONAL'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The specified letters are:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 2nd letter = E</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 4th letter = T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 6th letter = O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 7th letter = N</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">The available letters are E, T, O, and N.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Meaningful English words that can be formed using each letter exactly once are:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. NOTE</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. TONE</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, </span><span style=\"font-weight:bold\">exactly two meaningful English words can be formed.</span></p>", "question_heading": ""}, {"sr_no": 109, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three of the following word pairs are alike in some manner and hence form a group. Which word pair does not belong to that group?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(The words must be considered as meaningful English words and must not be grouped based on the number of letters/number of consonants/vowels in the word.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mars - Phobos</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Jupiter - Ganymede</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Saturn - Titan</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Uranus - Triton</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In the given word pairs, the second word is a major natural satellite (moon) of the planet mentioned in the first word:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">Mars - Phobos:</span><span> Phobos is a natural satellite of Mars.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">Jupiter - Ganymede:</span><span> Ganymede is a natural satellite of Jupiter.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span style=\"font-weight:bold\">Saturn - Titan:</span><span> Titan is a natural satellite of Saturn.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. </span><span style=\"font-weight:bold\">Uranus - Triton:</span><span> Triton is the largest natural satellite of </span><span style=\"font-weight:bold\">Neptune</span><span>, not Uranus (the largest natural satellite of Uranus is Titania).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, 'Uranus - Triton' does not belong to the group.</span></p>", "question_heading": ""}, {"sr_no": 110, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which of the following letter-clusters should replace # and % so that the pattern and relationship followed between the letter-cluster pair on the left side of :: is the same as that on the right side of :: ?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># : WFKP :: MDTB : %</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># - TKFX, % - PXZT</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># - SKEW, % - QYZU</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># - SKEW, % - RZAV</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># - RJDV, % - QYZU</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">The pattern followed between the letter-clusters is an alternating and increasing shift of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image058.png\" width=\"121\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> from the first letter-cluster to the second letter-cluster:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1st letter: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image059.png\" width=\"26\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2nd letter: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image060.png\" width=\"26\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3rd letter: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image061.png\" width=\"26\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">4th letter: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image062.png\" width=\"26\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For the left pair (# : WFKP):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>To find # from WFKP, reverse the operations (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image063.png\" width=\"118\" height=\"21\" alt style=\"vertical-align:middle\" ><span>):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>W (23) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image064.png\" width=\"63\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (S)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F (6) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image065.png\" width=\"63\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (K)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K (11) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image066.png\" width=\"55\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (E)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (16) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image067.png\" width=\"63\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (W)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, # = </span><span style=\"font-weight:bold\">SKEW</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For the right pair (MDTB : %):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Apply the forward pattern (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image068.png\" width=\"118\" height=\"21\" alt style=\"vertical-align:middle\" ><span>):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M (13) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image069.png\" width=\"63\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (Q)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D (4) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image070.png\" width=\"63\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (Y)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T (20) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image071.png\" width=\"63\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (Z)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B (2) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image072.png\" width=\"63\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (U)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, % = </span><span style=\"font-weight:bold\">QYZU</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, the correct replacement is # - SKEW, % - QYZU.</span></p>", "question_heading": ""}, {"sr_no": 111, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A certain number of persons are sitting in a straight row facing north. E sits at the extreme left end of the row. Only two persons sit between E and D. D sits to the immediate left of A. A sits fourth to the left of B. C sits third to the right of B. F sits at the extreme right end of the row and only one person sits between C and F. If no other person is sitting in the row, what is the total number of persons seated in the row?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- E sits at position 1 (extreme left).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- D sits at position 4 (two persons between E and D).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- A sits at position 5 (immediately right of D).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- B sits at position 9 (fourth right of A).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- C sits at position 12 (third right of B).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- F sits at position 14 (one person between C and F).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, the total number of persons = 14.</span></p>", "question_heading": ""}, {"sr_no": 112, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the correct option that indicates the arrangement of the following words in a logical and meaningful order.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Centimetre</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Kilometre</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Millimetre</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Metre</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Decimetre</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3, 1, 4, 5, 2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3, 1, 5, 4, 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1, 3, 5, 4, 2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3, 5, 1, 4, 2</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The given units represent units of length. Arranging them in increasing order of their magnitude:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Millimetre (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image073.png\" width=\"52\" height=\"21\" alt style=\"vertical-align:middle\" ><span>)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Centimetre (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image074.png\" width=\"52\" height=\"21\" alt style=\"vertical-align:middle\" ><span>)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Decimetre (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image075.png\" width=\"52\" height=\"21\" alt style=\"vertical-align:middle\" ><span>)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Metre (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image076.png\" width=\"26\" height=\"21\" alt style=\"vertical-align:middle\" ><span>)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Kilometre (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image077.png\" width=\"43\" height=\"21\" alt style=\"vertical-align:middle\" ><span>)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, the correct logical and meaningful sequence is 3, 1, 5, 4, 2.</span></p>", "question_heading": ""}, {"sr_no": 113, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the correct mirror image of the given figure when the mirror is placed at MN as shown below.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image078.png\" width=\"320\" height=\"100\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image079.png\" width=\"250\" height=\"70\" alt ></p>", "option2": "  <p style=\"margin-to der_images/1795289310409_image088.png\" width=\"103\" height=\"21\" alt style=\"vertical-align:middle\" ><span>; </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image089.png\" width=\"151\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (Does not follow)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Option C:</span><span> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image090.png\" width=\"103\" height=\"21\" alt style=\"vertical-align:middle\" ><span>; </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image091.png\" width=\"121\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (Follows)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Option D:</span><span> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image092.png\" width=\"103\" height=\"21\" alt style=\"vertical-align:middle\" ><span>; </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image093.png\" width=\"112\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (Follows)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, (7, 23, 92) does not belong to the group.</span></p>", "question_heading": ""}, {"sr_no": 115, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Some rings are bracelets.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>No bracelet is a necklace.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All necklaces are bangles.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. Some bangles are not bracelets.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. Some rings are not necklaces.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>III. No ring is a bangle.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusions I and II follow</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusions II and III follow</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion I follows</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All conclusions follow</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image094.png\" width=\"419\" height=\"176\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">Conclusion I:</span><span> The portion of bangles that are necklaces cannot be bracelets. Thus, 'Some bangles are not bracelets' definitely follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">Conclusion II:</span><span> Those rings which are bracelets can never be necklaces. Thus, 'Some rings are not necklaces' definitely follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span style=\"font-weight:bold\">Conclusion III:</span><span> There is no definite negative relationship established between rings and bangles; they may overlap. Hence, 'No ring is a bangle' does not necessarily follow.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, only conclusions I and II follow.</span></p>", "question_heading": ""}, {"sr_no": 116, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The sequence of folding a piece of paper and the manner in which the folded paper has been cut is shown below. Select the option figure that would most closely resemble the unfolded form of the paper.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image095.png\" width=\"330\" height=\"110\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image096.png\" width=\"100\" height=\"100\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image097.png\" width=\"100\" height=\"100\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image098.png\" width=\"100\" height=\"100\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image099.png\" width=\"100\" height=\"100\" alt ></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image100.png\" width=\"102\" height=\"103\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">This completely matches option (B).</span></p>", "question_heading": ""}, {"sr_no": 117, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>BCED is related to GHJI in a certain way based on the English alphabetical order. In the same way, FGJI is related to KLON. To which of the following is PQTS related, following the same logic?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>UVXY</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>UVYX</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>VUYX</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>UYXW</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">The logic followed here is adding 5 to the alphabetical position of each letter:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B (2) + 5 = G (7)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C (3) + 5 = H (8)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E (5) + 5 = J (10)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D (4) + 5 = I (9)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>So, BCED becomes GHJI.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the same logic to PQTS:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (16) + 5 = U (21)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q (17) + 5 = V (22)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T (20) + 5 = Y (25)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S (19) + 5 = X (24)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, PQTS is related to UVYX.</span></p>", "question_heading": ""}, {"sr_no": 118, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In the question below, a statement is followed by two courses of action numbered I and II. Assuming everything in the statement to be true, decide which of the given courses of action logically follow(s).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Statement:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Despite prominent signboards prohibiting overtaking near a sharp curve on a busy highway, frequent accidents are still being reported from the spot due to reckless overtaking.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Courses of Action:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. Rumble strips and warning blinkers should be installed before the sharp curve to alert drivers and slow down vehicles.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. Highway patrol teams should monitor the stretch regularly and strictly penalize drivers violating the overtaking restriction.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only II follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither I nor II follows</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both I and II follow</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both courses of action logically follow:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1.</span><span> </span><span style=\"font-weight:bold\">Course I is a practical engineering and safety intervention.</span><span> Installing rumble strips and warning blinkers directly helps alert drivers in advance and physically forces them to reduce speed, mitigating accident risks at the sharp curve.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. Course II provides an effective law-enforcement measure</span><span>. Since signboards alone failed to deter reckless drivers, active monitoring and strict penalties will create deterrence against dangerous overtaking.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Thus, both I and II are feasible, relevant, and constructive actions to solve the problem.</span></p>", "question_heading": ""}, {"sr_no": 119, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A number rearrangement machine rearranges a given input of numbers step by step according to a specific rule:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Input: 46, 12, 79, 35, 68, 24</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 1: 12, 46, 79, 35, 68, 24</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 2: 12, 79, 46, 35, 68, 24</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 3: 12, 79, 24, 46, 35, 68</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 4: 12, 79, 24, 68, 46, 35</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 5: 12, 79, 24, 68, 35, 46</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 5 is the final output.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Following the same pattern, what will be the final output for the following input?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Input: 54, 18, 76, 29, 83, 41</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18, 83, 29, 76, 41, 54</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18, 29, 41, 54, 76, 83</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>83, 18, 76, 29, 54, 41</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18, 83, 29, 76, 54, 41</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>By observing the given illustration, the machine arranges the numbers in an alternating pattern from left to right:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1st position: Smallest number</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2nd position: Largest number</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3rd position: 2nd smallest number</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4th position: 2nd largest number</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5th position: 3rd smallest number</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6th position: 3rd largest number (remaining number)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For the given input: 54, 18, 76, 29, 83, 41</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sorted numbers in ascending order: 18, 29, 41, 54, 76, 83</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- 1st position (Smallest) = 18</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- 2nd position (Largest) = 83</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- 3rd position (2nd smallest) = 29</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- 4th position (2nd largest) = 76</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- 5th position (3rd smallest) = 41</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- 6th position (Remaining) = 54</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the final output is: 18, 83, 29, 76, 41, 54.</span></p>", "question_heading": ""}, {"sr_no": 120, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a certain code language:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'P + Q' means 'P is the father of Q'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'P - Q' means 'P is the sister of Q'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'P × Q' means 'P is the brother of Q'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'P ÷ Q' means 'P is the mother of Q'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If U + V × W ÷ X - Y, then how is U related to X?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Maternal Uncle</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Paternal Grandfather</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Maternal Grandfather</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Father</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Decoding the given expression step-by-step:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. U + V → U is the father of V.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. V × W → V is the brother of W. Therefore, U is also the father of W.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. W ÷ X → W is the mother of X.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. X - Y → X is the sister of Y.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since W is the mother of X and U is the father of W, U is the mother's father of X, which means U is the Maternal Grandfather of X.</span></p>", "question_heading": ""}, {"sr_no": 121, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If 10 October 2021 was Sunday, what was the day of the week on 10 October 2014?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thursday</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Friday</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Saturday</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Wednesday</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt; e 'DL'. (ii) The following two-digit number is an odd number between 10 and 15. (iii) The two-letter series consists of two consecutive consonants in alphabetical order starting with 'B'. (iv) The last part is a four-digit number whose digits sum to 14 and which ends with 6. Which of the following is her vehicle registration number?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DL 14 BC 4226</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DL 13 BD 4226</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DL 13 BC 4226</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DL 13 BC 5226</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let us verify the conditions one by one:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. State code is 'DL': All options satisfy this condition.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. A two-digit odd number between 10 and 15: The possible numbers are 11 and 13. Option A has '14' (even), so it is eliminated.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Two consecutive consonants in alphabetical order starting with 'B': The consonants are 'B' and 'C' ('BC'). Option B has 'BD', so it is eliminated.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. A four-digit number whose digits sum to 14 and ends with 6:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In Option C: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image106.png\" width=\"132\" height=\"21\" alt style=\"vertical-align:middle\" ><span> and it ends with 6. (Satisfies)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In Option D: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image107.png\" width=\"170\" height=\"21\" alt style=\"vertical-align:middle\" ><span>. (Eliminated)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the correct registration number is </span><span style=\"font-weight:bold\">DL 13 BC 4226</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 123, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Six boxes, P, Q, R, S, T, and U, are placed one above another in a stack, but not necessarily in the same order. Box U is placed at the bottommost position. Box Q is placed immediately above Box P. Box T is placed immediately below Box P. Only two boxes are placed between Box P and Box S. Box R is placed immediately above Box S. Which box is placed at the third position from the top?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Box P</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Box T</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Box R</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Box S</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given information:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U is at the bottommost position (6th).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q is immediately above P, and T is immediately below P </span><span style=\"font-family:Arial\">→</span><span> Q–P–T.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two boxes are between P and S.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R is immediately above S. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the final stack from top to bottom is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Position 6: Box Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Position 5: Box P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Position 4: Box T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Position 3: Box R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Position 2: Box S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Position 1: Box U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the box placed at the third position from the top is Box T.</span></p>", "question_heading": ""}, {"sr_no": 124, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which number is INCORRECT in the given number series?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2, 5, 14, 41, 124, 365</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>41</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>124</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>365</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern of the given series is:</span></p><p style=\"margi c=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image115.png\" width=\"76\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image116.png\" width=\"94\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image117.png\" width=\"102\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image118.png\" width=\"120\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Therefore, 124 is incorrect and should be replaced by 122.</span></p>", "question_heading": ""}, {"sr_no": 125, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Direction: Three of the following four number triads are alike in a certain way and thus form a group. Which is the number triad that does not belong to that group?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding/subtracting/multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the number triad that does not belong to the group.</span></p>",
