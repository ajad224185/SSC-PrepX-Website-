: " <p style=\"orphans:0;widows:0\">    Plutocracy</p>", "option3": " <p style=\"orphans:0;widows:0\">    Bureaucracy</p>", "option4": " <p style=\"orphans:0;widows:0\">    Autocracy</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitution for 'government by the wealthy'    is <b>Plutocracy</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Definitions    of the other options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Aristocracy:</b>     Government by the nobility or privileged upper class.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Bureaucracy:</b>     Government run by appointed state officials.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Autocracy:</b> Government     by a single individual with unlimited power.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate idiom to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Instead of addressing the    complaints directly, the spokesperson continued to ______ during    the press briefing.</p>", "option1": "<p style=\"orphans:0;widows:0\">    burn the midnight oil</p>", "option2": " <p style=\"orphans:0;widows:0\">    beat around the bush</p>", "option3": " <p style=\"orphans:0;widows:0\">    cry over spilt milk</p>", "option4": " <p style=\"orphans:0;widows:0\">    bite the dust</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B)</b> beat around the bush</p>    <p style=\"orphans:0;widows:0\">The idiom <b>'beat around the    bush'</b> means to discuss a matter without coming to the point or    to deliberately avoid talking about what is important. In the    given context, it contrasts with 'addressing the complaints    directly', making it the most appropriate choice.</p>", "question_heading": ""}, {"sr_no": 35, "question": "A ौधnपधncध ुोौ ृधधn ौूिiप हू inपय ौधgंधnपौ ोnक giॅधn ृिधयथ in ुहंृिधक यनकधन. Wुiिध पुध ीiनौप ोnक पुध िोौप ौधgंधnपौ यी पुध ौधnपधncध (1 ोnक 6) ोनध in पुध cयननधcप यनकधन, पुध ौधgंधnपौ in ृधपथधधn ोनध ुहंृिधक हू. Aननोngध पुध ौधgंधnपौ in पुध cयननधcप यनकधन पय ीयनं ो ंधोningीिह ोnक cयुधनधnप ौधnपधncध. 1) Tुध ूनiंोनद यृुधcपiॅध यी ंयकधनn धकहcोपiयn ौुयिहक ृध P) पय ीयौपधन cनiपicोि पुinाing ोnक Q) नोपुधन पुोn ंधनिधद धncयहनोging R) नयपध ंधंयनप्रोपiयn यी ीोcपौ S) धपुicोि ोथोनधnधौौ in ौपहकधnपौ 6) पय ूोौौ ौपोnकोनकप्रधक धसोंinोपiयnौ.", "option1": "<p style=\"orphans:0;widows:0\">    P, S, Q, R</p>", "option2": " <p style=\"orphans:0;widows:0\">    Q, R, P, S</p>", "option3": " <p style=\"orphans:0;widows:0\">    S, P, R, Q</p>", "option4": " <p style=\"orphans:0;widows:0\">    P, Q, S, R</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sequence is <b>P, S, Q, R</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Segment (1)    ends with \"should be\", which grammatically connects with    the infinitive phrase in (P) \"to foster critical thinking    and\".</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Segment (P)    ends with the conjunction \"and\", which requires a    parallel noun phrase. Segment (S) provides this with \"ethical    awareness in students\". Thus, <b>P-S</b> forms a mandatory    pair.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Segment (Q)    \"rather than merely encouraging\" introduces a    contrasting element to what should be fostered.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Segment (R)    \"rote memorization of facts\" acts as the direct object    of \"encouraging\" in (Q), making <b>Q-R</b> another    mandatory pair.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Finally,    segment (R) logically connects to (6) \"to pass standardized    examinations\", indicating the purpose of the rote    memorization.</p>    <p style=\"orphans:0;widows:0\">Hence, the complete coherent    sentence is: <i>\"The primary objective of modern education    should be to foster critical thinking and ethical awareness in    students rather than merely encouraging rote memorization of facts    to pass standardized examinations.\"</i></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words.</p>    <p style=\"orphans:0;widows:0\">A person who abandons or    renounces a religious or political belief</p>", "option1": "<p style=\"orphans:0;widows:0\">    Agnostic</p>", "option2": " <p style=\"orphans:0;widows:0\">    Apostate</p>", "option3": " <p style=\"orphans:0;widows:0\">    Ascetic</p>", "option4": " <p style=\"orphans:0;widows:0\">    Altruist</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (B) <b>Apostate</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Apostate:</b>    A person who renounces or abandons a religious or political belief    or cause.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Agnostic:</b>    A person who believes that nothing is known or can be known of the    existence of God.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Ascetic:</b>    A person who practices severe self-discipline and abstains from    all physical pleasures, typically for religious reasons.</p>    <p style=\"orphans:0;widows:0\"><b>Altruist:</b> A person who    shows unselfish concern for the welfare of others.</p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the following sentence in passive    voice.</p>    <p style=\"orphans:0;widows:0\">After the municipality approves    the plan, the contractor will construct a community hall.</p>", "option1": "<p style=\"orphans:0;widows:0\">    A community hall should be constructed by the contractor when the    municipality approves the plan.</p>", "option2": " <p style=\"orphans:0;widows:0\">    A community hall will have been constructed by the contractor    after the municipality approves the plan.</p>", "option3": " <p style=\"orphans:0;widows:0\">    A community hall will be constructed by the contractor after the    municipality approves the plan.</p>", "option4": " <p style=\"orphans:0;widows:0\">    A community hall was constructed by the contractor after the    municipality approves the plan.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the active voice and its main clause is    in the Simple Future Tense:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Active    Voice structure:</b> Subject + will + V1 + Object</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Passive    Voice structure:</b> Object + will + be + V3 + by + Subject</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In the main    clause, <b>'the contractor'</b> is the subject, <b>'will    construct'</b> is the verb, and 'a community hall' is the object.    Thus, it becomes 'A community hall will be constructed by the    contractor'. The dependent time clause 'after the municipality    approves the plan' remains unchanged.</p>    <p style=\"orphans:0;widows:0\">Hence, <b>option C</b> is    correct.</p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in passive    voice.</p>    <p style=\"orphans:0;widows:0\">The municipal corporation has    successfully implemented a new waste management policy in the    city.</p>", "option1": "<p style=\"orphans:0;widows:0\">    A new waste management policy was successfully implemented in the    city by the municipal corporation.</p>", "option2": " <p style=\"orphans:0;widows:0\">    A new waste management policy has been successfully implemented in    the city by the municipal corporation.</p>", "option3": " <p style=\"orphans:0;widows:0\">    A new waste management policy had been successfully implemented in    the city by the municipal corporation.</p>", "option4": " <p style=\"orphans:0;widows:0\">    A new waste management policy is being successfully implemented in    the city by the municipal corporation.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the Present Perfect Tense (Active Voice).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Active    Voice structure:</b> Subject + has/have + V3 + Object</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Passive    Voice structure:</b> Object + has/have + been + V3 + (by +    Subject)</p>    <p style=\"orphans:0;widows:0\">Here, the object 'A new waste    management policy' is singular, so 'has been successfully    implemented' is used. Therefore, option B is the correct passive    form.</p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in indirect    speech.</p>    <p style=\"orphans:0;widows:0\">The librarian said to me, “Do    you have a membership card?”</p>", "option1": "<p style=\"orphans:0;widows:0\">    The librarian asked me that whether I had a membership card.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The librarian asked me if I had a membership card.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The librarian asked me if I have a membership card.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The librarian told me whether I had a membership card.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Rules for changing a direct interrogative sentence (Yes/No type)    into indirect speech:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb 'said to' is changed to 'asked'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    conjunction 'if' or 'whether' is used to connect the reporting    verb and reported speech (never use 'that' with 'if/whether').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The question    form is converted into an assertive sentence (subject comes before    the verb).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Simple    present tense ('Do you have') changes to simple past tense    ('had').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    second-person pronoun 'you' changes to first-person 'I' according    to the object 'me'.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct indirect    speech is: <b>The librarian asked me if I had a membership card.</b></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in passive    voice.</p>    <p style=\"orphans:0;widows:0\">Do not touch the wet paint.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Let the wet paint be touched.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Let not the wet paint be touched.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Let the wet paint not be touched.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Have not the wet paint been touched.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is a negative imperative sentence expressing an    order/instruction.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The standard    structure for converting a negative imperative sentence into    passive voice is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Let +    object + not + be + past participle (V3) + (remaining words).</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Here, the    object is 'the wet paint' and the verb is 'touch' (past    participle: 'touched').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Applying the    rule gives: <b>Let the wet paint not be touched.</b></p>    <p style=\"orphans:0;widows:0\">Therefore, option C is the    correct answer.</p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is divided into four segments. Identify the    segment that contains a grammatical error.</p>    <p style=\"orphans:0;widows:0\">By the time the train arrived /    at the platform, / most of the passengers / have already boarded    another train.</p>", "option1": "<p style=\"orphans:0;widows:0\">    By the time the train arrived</p>", "option2": " <p style=\"orphans:0;widows:0\">    most of the passengers</p>", "option3": " <p style=\"orphans:0;widows:0\">    have already boarded another train</p>", "option4": " <p style=\"orphans:0;widows:0\">    at the platform,</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The error lies in the segment <b>\"have already boarded    another train\"</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">When two    actions happen in the past, the action that occurred first is    expressed in the <b>Past Perfect Tense</b> (had + past    participle), and the subsequent action is expressed in the <b>Simple    Past Tense</b> (V2).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Since the    boarding happened before the train arrived (past tense:    'arrived'), the present perfect auxiliary 'have' should be    replaced with the past perfect auxiliary 'had'.</p>    <p style=\"orphans:0;widows:0\"><b>Correct sentence:</b> By the    time the train arrived at the platform, most of the passengers <i>had</i>    already boarded another train.</p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Sentences of a paragraph are given below in jumbled order. Arrange    the sentences in the correct order to form a meaningful and    coherent paragraph.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A. Inside,    they found an astonishing collection of golden treasures,    furniture, and chariots.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B. Howard    Carter was a British archaeologist who spent years searching for    royal tombs in Egypt.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C. Among    these artifacts was the legendary solid gold funerary mask of the    young pharaoh.</p>    <p style=\"orphans:0;widows:0\">D. In November 1922, his    persistent efforts were rewarded when his team uncovered the    entrance to King Tutankhamun's tomb.</p>", "option1": "<p style=\"orphans:0;widows:0\">    BDAC</p>", "option2": " <p style=\"orphans:0;widows:0\">    BADC</p>", "option3": " <p style=\"orphans:0;widows:0\">    DBAC</p>", "option4": " <p style=\"orphans:0;widows:0\">    DABC</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Sentence B introduces the central figure, Howard Carter, and his    mission in Egypt, making it the appropriate opening sentence.    Sentence D logically follows B by describing the culmination of    his efforts with the discovery of Tutankhamun's tomb in 1922.    Sentence A then describes what was found 'inside' the tomb, and    Sentence C connects to A by detailing a specific item among 'these    artifacts'. Therefore, the correct logical sequence is BDAC.</p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">None of the volunteers displayed    as __________ enthusiasm for the relief work as Aarav did.</p>", "option1": "<p style=\"orphans:0;widows:0\">    many</p>", "option2": " <p style=\"orphans:0;widows:0\">    more</p>", "option3": " <p style=\"orphans:0;widows:0\">    much</p>", "option4": " <p style=\"orphans:0;widows:0\">    most</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (C) <b>much</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    correlative structure <b>'as + adjective/adverb/determiner + as'</b>    is used to make comparisons of equality and requires the positive    degree. Therefore, comparative ('more') and superlative ('most')    forms are incorrect.</p>    <p style=\"orphans:0;widows:0\">2. The noun 'enthusiasm' is    uncountable. The determiner <b>'much'</b> is used with uncountable    nouns, whereas <b>'many'</b> is used with plural countable nouns.    Hence, 'much' is the grammatically correct choice.</p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in reported    speech.</p>    <p style=\"orphans:0;widows:0\">'I am eager to present my new    project,' the architect said excitedly.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The architect excitedly said that he is eager to present his new    project.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The architect excitedly said that he would be eager to present his    new project.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The architect excitedly said that he was eager to present his new    project.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The architect excitedly said that he had been eager to present his    new project.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is an assertive sentence in direct speech. To    convert it into reported speech:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    reporting verb 'said excitedly' remains in the past tense (or can    be written as 'excitedly said').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. The    conjunction 'that' is used to connect the reporting clause and the    reported clause.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. The    first-person pronoun 'I' changes to 'he', and 'my' changes to    'his' according to the subject 'the architect'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. The    present tense 'am' changes to past tense 'was'.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct sentence    is: 'The architect excitedly said that he was eager to present his    new project.'</p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in direct    speech.</p>    <p style=\"orphans:0;widows:0\">The coordinator announced that    the workshop had been cancelled.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The coordinator announces, \"The workshop has been cancelled.\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    The coordinator announced, \"The workshop had been cancelled.\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    The coordinator announced, \"The workshop has been cancelled.\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    The coordinator announced, \"The workshop was being    cancelled.\"</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the indirect speech into direct speech, we follow these    rules:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb 'announced' is in the past tense, so it remains 'announced'    (and not 'announces').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    conjunction 'that' is removed and replaced with a comma and    inverted commas.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The past    perfect passive tense ('had been cancelled') in indirect speech    changes back to the present perfect passive tense ('has been    cancelled') in direct speech.</p>    <p style=\"orphans:0;widows:0\">Hence, the correct direct speech    is: <b>The coordinator announced, \"The workshop has been    cancelled.\"</b></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">The texture of the handmade jute    bag was extremely __________ and rough.</p>", "option1": "<p style=\"orphans:0;widows:0\">    course</p>", "option2": " <p style=\"orphans:0;widows:0\">    coarse</p>", "option3": " <p style=\"orphans:0;widows:0\">    curse</p>", "option4": " <p style=\"orphans:0;widows:0\">    corpse</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B) coarse</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>'Coarse'</b>    means rough or harsh in texture, which correctly fits the context    of describing a rough jute bag. <b>'Course'</b> refers to a    direction, path, or a series of lessons. 'Curse' means an appeal    to a supernatural power to inflict harm. 'Corpse' refers to a dead    body.</p>    <p style=\"orphans:0;widows:0\">Therefore, <b>'coarse'</b> is the    correct word.</p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that gives the correct meaning of the given    idiom:</p>    <p style=\"orphans:0;widows:0\"><b>\"To wash dirty linen in    public\"</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    To dry clothes in an open area</p>", "option2": " <p style=\"orphans:0;widows:0\">    To discuss private or embarrassing matters publicly</p>", "option3": " <p style=\"orphans:0;widows:0\">    To blame others for one's own mistakes</p>", "option4": " <p style=\"orphans:0;widows:0\">    To clean up one's house before visitors arrive</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The idiom <b>\"to wash dirty linen in public\"</b> means    to discuss or debate private, embarrassing, or unsavory    personal/family matters in front of others or publicly. Hence,    <b>option B</b> is the correct answer.</p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Fill in the blank with the most appropriate option:</b></p>    <p style=\"orphans:0;widows:0\">Despite his eloquent delivery,    the speaker’s argument lacked the logical ________ necessary to    persuade the analytical audience.</p>", "option1": "<p style=\"orphans:0;widows:0\">    fallacy</p>", "option2": " <p style=\"orphans:0;widows:0\">    cogency</p>", "option3": " <p style=\"orphans:0;widows:0\">    latency</p>", "option4": " <p style=\"orphans:0;widows:0\">    brevity</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (B) <b>cogency</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meaning of    the words:</b></p>    <ul>     <li><p st ", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The entire passage focuses on the contrast between Aethelgard's    serene, radiant facade and the underlying artificiality, control,    and manipulation suspected by the visitors.</p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate antonym of the given word. <b>Contentious</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Combative</p>", "option2": " <p style=\"orphans:0;widows:0\">    Disputatious</p>", "option3": " <p style=\"orphans:0;widows:0\">    Amicable</p>", "option4": " <p style=\"orphans:0;widows:0\">    Belligerent</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>Contentious</b> means causing or likely to cause an    argument; quarrelsome or controversial.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Among the    given options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Amicable</b>     means characterized by friendliness and absence of discord, which     is the exact opposite (antonym) of contentious.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Combative</b>     means ready or eager to fight (synonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Disputatious</b>     means fond of or causing heated arguments (synonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Belligerent</b>     means hostile and aggressive (synonym).</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, <b>Amicable</b> is the    most appropriate antonym.</p>", "question_heading": ""}, {"sr_no": 61, "question": "Rधोक पुध ीियियथing ूोौौोgध cोनधीिहिद ोnक ोnौथधन पुध तहधौपiयnौ पुोप ीियियथ. Higु ोृयॅध पुध ॅोििधद यी Eिकधn, ूधनcुधक हूयn ो ौपधधू cिiीी, ौपययक पुध \">    The librarian asked, \"Have you returned all the borrowed    books and do you need any new ones?\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    The librarian asked, \"Were you returning all the borrowed    books and will you need any new ones?\"</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in Indirect Speech. To convert it into    Direct Speech, follow these rules:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     conjunctions 'whether' and 'if' are omitted, and direct question     forms with question marks are used inside quotation marks.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The past     perfect tense 'had returned' converts back to the present perfect     tense <b>'Have you returned'</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     simple past tense 'needed' converts back to the simple present     tense 'do you need'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     first-person pronoun <b>'I'</b> refers to the listener and     changes to the second-person pronoun <b>'you'</b>.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, the correct direct    speech sentence is: <i>The librarian asked, \"Have you    returned all the borrowed books and do you need any new ones?\"</i></p>", "question_heading": ""}, {"sr_no": 67, "question": "In पुध giॅधn ूोौौोgध, ौयंध थयनकौ ुोॅध ृधधn किधधपधक. Rधोक पुध ूोौौोgध inपधnिपद ोnक cुययौध पुध ंयौप ोूूनयूनiोपध यूपiयn पय ीiिि in धोcु ृिोnा: Tय cयncधूपहोिप्रध पुध कigiपोि ोनcुiॅध ोौ ो nधहपनोि नधूयौiपयनद यी cियिधcपiॅध ंधंयनद iौ पय ंiौहnकधनौपोnक iपौ ीहnकोंधnपोि nोपहनध ोौ ोn ोिgयनiपुंic [1] _____, ो पधcुnयूियiपicोि ोूूोनोपहौ थुयौध ोहपुयनiपद iौ ौहौपोinधक पुनयहgु पुध cयnपinहयहौ cयकiीicोपiयn ोnक धसपनोcपiयn यी ुहंोn धसूधनiधncध. Wiपुin पुiौ ीनोंधथयना, inीयनंोपiयn iौ nयप ंधनिधद gोपुधनधक hans:0;widows:0\">    The dash elaborates on the adjective: 'a radical refusal of    surveillance capital, a definitive retreat from the imperative to    be endlessly quantified and archived.' In critical and    post-structuralist thought, 'fugitive' describes practices of    escape, evasion, and refusal of capture by institutional matrices,    contrasting with 'assimilative'. 'Programmatic', 'normative', and    'codified' all imply submission to predetermined rules and    taxonomic systems.</p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Fill in the blank with the correctly spelt word.</p>    <p style=\"orphans:0;widows:0\">The minister was condemned for    his _________ response to the border crisis, displaying an utter    lack of courage and resolve.</p>", "option1": "<p style=\"orphans:0;widows:0\">    pusilanimous</p>", "option2": " <p style=\"orphans:0;widows:0\">    pusillanemous</p>", "option3": " <p style=\"orphans:0;widows:0\">    pusillanimous</p>", "option4": " <p style=\"orphans:0;widows:0\">    pusilanimeous</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correctly spelt word to fill in the blank is <b>pusillanimous</b>,    which means showing a lack of courage or determination; timid or    cowardly.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Etymological    breakdown: <i>pusillus</i> (very small/weak) + <i>animus</i>    (spirit/courage) + <i>-ous</i>.</p>    <p style=\"orphans:0;widows:0\">Hence, option C is the correct    answer.</p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"orphans:0;widows:0\">    Select the sentence that has NO spelling errors.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The eccentric connoisseur exhibited an idiosyncrasy that intrigued    the ophthalmologist.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The eccentric connoiseur exhibited an idiosyncracy that intrigued    the ophthalmologist.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The eccentric connoisseur exhibited an idiosyncracy that intrigued    the opthalmologist.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The eccentric connoisseur exhibited an idiosyncrasy that intrigued    the opthalmologist.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The sentence with no spelling errors is: <b>\"The eccentric    connoisseur exhibited an idiosyncrasy that intrigued the    ophthalmologist.\"</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Key spelling    points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Connoisseur:</b>    Spelled with a double 'n' and double 's' (c-o-n-n-o-i-s-s-e-u-r).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Idiosyncrasy:</b>    Ends in 'sy', not 'cy' (i-d-i-o-s-y-n-c-r-a-s-y).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Ophthalmologist:</b>    Begins with 'ophth-' containing both 'ph' and 'th'    (o-p-h-t-h-a-l-m-o-l-o-g-i-s-t).</p>    <p style=\"orphans:0;widows:0\">All other options contain errors    in one or more of these challenging words.</p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that best improves the underlined portion of the    given sentence:</p>    <p style=\"orphans:0;widows:0\">The groundbreaking hypotheses    proposed by the astrophysicist, <u>which was initially dismissed    by conventional researchers, they have revolutionized</u> our    understanding of dark matter.</p>", "option1": "<p style=\"orphans:0;widows:0\">    which was initially dismissed by conventional researchers, they    have revolutionized</p>", "option2": " <p style=\"orphans:0;widows:0\">    which was initially dismissed by conventional researchers, have    revolutionized</p>", "option3": " <p style=\"orphans:0;widows:0\">    which were initially dismissed by conventional researchers, have    revolutionized</p>", "option4": " <p style=\"orphans:0;widows:0\">    which were initially dismissed by conventional researchers, they    have revolutionized</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>which were initially dismissed by    conventional researchers, have revolutionized</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">This sentence    contains two grammatical errors:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Subject-Verb    Agreement in the Relative Clause:</b> The antecedent of the    relative pronoun 'which' is the noun 'hypotheses', which is the    plural form of 'hypothesis'. Therefore, the relative clause    requires the plural verb <i>were</i> rather than the singular <i>was</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Redundant    Resumptive Pronoun:</b> The complete subject of the main clause is    'The groundbreaking hypotheses proposed by the astrophysicist'.    Inserting the pronoun <i>they</i> immediately before the predicate    creates a grammatically redundant double subject. The main verb    <i>have revolutionized</i> should directly follow the    non-restrictive clause.</p>    <p style=\"orphans:0;widows:0\"><b>Option C</b> corrects both    issues.</p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that best improves the underlined portion of the    given sentence:</p>    <p style=\"orphans:0;widows:0\">The government's new initiative    <u>not only aims to curb environmental pollution but it also    creates</u> thousands of green jobs.</p>", "option1": "<p style=\"orphans:0;widows:0\">    aims not only to curb environmental pollution but it also creates</p>", "option2": " <p style=\"orphans:0;widows:0\">    not only aims to curb environmental pollution but also creates</p>", "option3": " <p style=\"orphans:0;widows:0\">    not only aims to curb environmental pollution but creates also</p>", "option4": " <p style=\"orphans:0;widows:0\">    not aims to curb environmental pollution but it also creates</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The correlative conjunction pair <b>'not only ... but also'</b>    requires parallel grammatical structures. Here, both parts should    connect the two parallel verbs (<i>aims</i> and <i>creates</i>)    that share the same subject (<i>The government's new initiative</i>).    The inclusion of the pronoun 'it' in <i>'but it also creates'</i>    is redundant and violates parallelism. Removing 'it' leaves <b>'not    only aims to curb environmental pollution but also creates'</b>,    which is grammatically correct and concise.</p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which connector standard enables high-speed data transfer alongside display output and power delivery through a single reversible port on modern laptops?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>VGA interface</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>USB Type-C / Thunderbolt interface</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Serial DB9 port</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Parallel LPT port</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Modern USB Type-C and Thunderbolt interfaces combine high-bandwidth data lanes, video signals, and USB Power Delivery in one compact connector, unlike legacy VGA, serial, or parallel ports.</span></p>", "question_heading": ""}, {"sr_no": 77, "question": "In Micनयौयीप Eसcिध, थुicु ौुयनपcहप ाधद यूधnौ पुध \"Fयनंोप Cिधिस\" कiोियg ृयस ौय दयह cोn cहौपयंप्रध nहंृधन ीयनंोपौ, पधसप ोिignंधnप, ृयनकधनौ, ोnक ीiिि ौपिदधौ?", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + 1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Shift + L</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Shift + F11</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Alt + F1</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Pressing Ctrl + 1 opens the Format Cells dialog box directly in MS Excel, giving quick access to Number, Alignment, Font, Border, Fill, and Protection tabs.</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which protocol allows an email client to download messages for offline reading while letting the user choose whether to keep or remove copies on the mail server?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>POP3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FTP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SNMP</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Telnet</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>POP3 (Post Office Protocol version 3) retrieves email messages from a remote mail server to a local client (often deleting them from the server by default unless configured to leave a copy), whereas IMAP synchronizes folders directly on the server.</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Malware disguised inside an apparently harmless installer, crack, or media file that executes hidden malicious actions when opened is known as a:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Trojan</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Firewall</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Defragmenter</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Load balancer</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A Trojan deceives users by appearing legitimate or desirable while carrying a hidden payload—such as a remote access tool or spyware—without self-replicating like a worm.</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which non-volatile memory technology sits between slower storage drives and main memory to accelerate frequently accessed files and system startup?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SSD / NVMe caching</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Magnetic tape</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Punch card</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Optical CD-R</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Flash-based SSD or NVMe caching stores hot data blocks and OS startup files on fast non-volatile flash memory to reduce latency compared to spinning hard drives.</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">In Microsoft Word, which combination lets you use distinct page numbering styles (such as Roman numerals for a preface and standard numbers for chapters) in separate parts of a document?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Section break with \"Link to Previous\" disabled</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Draft view with auto-hyphenation</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Read mode with print layout</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Word count dialog box</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Inserting a Section Break divides a document into independent formatting sections, and turning off \"Link to Previous\" in the Header &amp; Footer tools stops a section from inheriting the numbering format of the previous section.</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">When sending an email to multiple recipients, how does placing addresses in the BCC field protect recipient privacy?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>It prevents other recipients from viewing the email addresses listed in the BCC field</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>It automatically deletes the sent message from the sender's Sent folder</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>It converts attachments into password-protected ZIP files</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>It blocks incoming replies from external domains</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Addresses placed in Blind Carbon Copy (BCC) are stripped from the visible recipient headers shown to To, CC, and other BCC recipients, preventing mass exposure of contact lists.</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which cyber attack manipulates domain name resolution so a user entering a genuine website address is sent to a fraudulent site without clicking a deceptive link?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DNS spoofing / Pharming</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Keystroke logging</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ransomware encryption</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Packet sniffing on local display</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Pharming or DNS spoofing corrupts DNS resolution (such as poisoning a DNS cache or altering a hosts file) so a legitimate domain name resolves to an attacker-controlled IP address.</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which shortcut key selects the address bar in Windows File Explorer as well as most web browsers so you can immediately type a path or URL?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Alt + D (or Ctrl + L in browsers)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Z</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Shift + Esc</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Pressing Alt + D focuses the address bar in Windows File Explorer and highlights the URL bar in major web browsers (Ctrl + L also focuses the address bar in most browsers).</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">In Microsoft PowerPoint, which animation type moves a slide object along a defined line, curve, loop, or custom-drawn path?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Motion Path</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Slide Sorter</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Speaker Notes</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Slide Master</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Motion Path animations control the trajectory along which a selected shape, icon, or text box travels on a slide, using presets or custom-drawn curves.</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">How do third-party cookies differ from first-party cookies during web browsing?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Third-party cookies are set by an external domain (such as an ad or analytics network) rather than the site shown in the address bar</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Third-party cookies only store local screen brightness settings</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First-party cookies cannot store login or cart preferences</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Third-party cookies permanently disable browser cache</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First-party cookies are created directly by the website you are visiting to maintain sessions or preferences, whereas third-party cookies are placed by other domains embedded on the page, commonly for cross-site tracking and targeted ads.</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which protocol secures web traffic by encrypting data in transit using TLS/SSL?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HTTPS</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Telnet</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>TFTP</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Gopher</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HTTPS (Hypertext Transfer Protocol Secure) layers HTTP over TLS (Transport Layer Security, successor to SSL) to protect confidentiality, integrity, and server authenticity between browser and web server.</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following devices is purely an output device?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Printer</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Light pen</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Trackball</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Optical mark reader (OMR)</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A printer produces human-readable hard copy output from digital documents sent by the computer, whereas a light pen, trackball, and OMR capture input into the system.</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which key combination saves changes made to an open document in MS Word?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + S</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + X</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Y</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + F</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + S is the standard shortcut to save the current document in MS Word (whereas Ctrl + X cuts, Ctrl + Y redoes, and Ctrl + F opens the Find box).</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">In an email message, what does CC indicate when adding an email address?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Carbon Copy — sending an informational copy to additional recipients visible on the message header</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cache Clear — clearing temporary browser data before sending</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Certified Cipher — compressing files into an archive</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Central Cloud — uploading attachments to external storage</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CC (Carbon Copy) sends a copy of the email to secondary recipients whose addresses remain visible to other recipients in the To and CC fields.</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which network device forwards data packets between distinct networks using routing tables and IP addresses?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Router</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Webcam</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Joystick</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Plotter</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A router connects separate networks (such as a home or office LAN and the internet) and determines the best path to forward data packets between them based on network layer (IP) addressing.</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which type of memory is non-volatile and typically holds low-level startup instructions such as BIOS or UEFI firmware?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ROM (Read-Only Memory / Flash/EEPROM)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SRAM cache</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SDRAM main memory</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Register file</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Read-Only Memory (implemented today using rewritable non-volatile technologies like Flash or EEPROM) retains stored firmware and boot code without electrical power, unlike volatile RAM.</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">In Microsoft Excel, which modern lookup function searches a row or column range and returns a matching item from another row or column without requiring a fixed column index number?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>XLOOKUP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>AVERAGEIF</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CONCAT</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NOW</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>XLOOKUP searches a lookup array and returns the corresponding item from a return array in any direction (vertical or horizontal) and supports built-in exact/wildcard matching and default \"not found\" values.</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Why does Two-Factor Authentication (2FA) or an OTP strengthen online banking security beyond a password alone?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>It requires an additional verification factor (such as a time-bound OTP or hardware/app prompt), so a stolen password by itself cannot authorize the action</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>It permanently stops all spam emails from reaching the user's inbox</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>It increases the physical RAM capacity of the user's smartphone</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>It eliminates the need for network connectivity during transfers</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two-factor authentication combines two distinct verification factors—typically something you know (password) and something you have or are (OTP device/authenticator app/biometric)—reducing the risk of account takeover from credential leaks.</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">In a Man-in-the-Middle (MitM) attack, what is the attacker doing between two communicating endpoints?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Secretly intercepting and potentially reading or modifying messages passing between them</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Overloading a single disk drive with local backup files</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Replacing the monitor cable with a USB hub</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Compressing system log files into an archive</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A Man-in-the-Middle attacker positions themselves between two parties—such as a client and server or two devices—to eavesdrop on, drop, or alter communications without their immediate awareness.</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Select the number that can replace the question mark (?) in the following series.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7, 21, 63, 189, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>547</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>567</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>576</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom pan><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image015.png\" width=\"110\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image016.png\" width=\"92\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image017.png\" width=\"55\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image018.png\" width=\"18\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, 68 is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the English alphabetical order, three of the following four letter-cluster pairs are alike in a certain way and thus form a group. Which is the one that does not belong to that group?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(Note: The odd one out is not based on the number of consonants/vowels or their position in the letter-cluster pairs.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CE - HJ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>IK - NQ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LN - QS</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PR - UW</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let us analyze the positional values of the letters in each letter-cluster pair:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1) CE - HJ:</span><span> C(3) + 2 = E(5); E(5) + 3 = H(8); H(8) + 2 = J(10) → (+2, +3, +2)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2) IK - NQ:</span><span> I(9) + 2 = K(11); K(11) + 3 = N(14); N(14) + 3 = Q(17) → (+2, +3, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3) LN - QS:</span><span> L(12) + 2 = N(14); N(14) + 3 = Q(17); Q(17) + 2 = S(19) → (+2, +3, +2)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">4) PR - UW:</span><span> P(16) + 2 = R(18); R(18) + 3 = U(21); U(21) + 2 = W(23) → (+2, +3, +2)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">All pairs except 'IK - NQ' follow the pattern (+2, +3, +2), whereas 'IK - NQ' follows (+2, +3, +3). Therefore, IK - NQ is the odd one out.</span></p>", "question_heading": ""}, {"sr_no": 100, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Introducing a woman, Raman said, \"Her mother is the only daughter of my wife's mother-in-law.\" How is that woman related to Raman?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Daughter</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sister</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Niece</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sister-in-law</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Breaking down Raman's statement step-by-step:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span><span style=\"font-weight:bold\">. \"My wife's mother-in-law\"</span><span> = Raman's mother.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. \"The only daughter of my wife's mother-in-law\"</span><span> = Raman's sister.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3. \"Her mother is Raman's sister</span><span>\" = The woman's mother is Raman's sister.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since the woman is the daughter of Raman's sister, she is Raman's niece.</span></p>", "question_heading": ""}, {"sr_no": 101, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>16 is related to 120 following a certain logic. Following the same logic, 22 is related to 231. To which of the following is 18 related, following the same logic?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into their constituent digits. E.g. 13 – Operations on 13 such as adding /subtracting /multiplying to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>144</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>171</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>153</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>162</span></p>", "answer": "3", "negative_mark
