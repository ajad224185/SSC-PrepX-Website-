795289310409_image122.png\" width=\"209\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Option D: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289310409_image123.png\" width=\"257\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Hence, (15, 216, 18) does not belong to the group.</span></p>", "question_heading": ""}, {"sr_no": 126, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Article of the Constitution of India restricts any    discussion in Parliament with respect to the conduct of any Judge    of the Supreme Court or of a High Court in the discharge of their    duties, except upon a motion for their removal?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Article 119</p>", "option2": " <p style=\"orphans:0;widows:0\">    Article 121</p>", "option3": " <p style=\"orphans:0;widows:0\">    Article 124</p>", "option4": " <p style=\"orphans:0;widows:0\">    Article 126</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Article 121 of the Constitution of India explicitly restricts any    discussion in Parliament regarding the conduct of any Judge of the    Supreme Court or of a High Court in the discharge of his duties,    except upon a motion for presenting an address to the President    praying for the removal of the Judge.</p>", "question_heading": ""}, {"sr_no": 127, "question": " <p style=\"orphans:0;widows:0\">    <b>Which among the following temples is one of the earliest known    surviving examples of the 'Panchayatana' style of architecture in    India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Shore Temple, Mahabalipuram</p>", "option2": " <p style=\"orphans:0;widows:0\">    Dashavatara Temple, Deogarh</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sun Temple, Modhera</p>", "option4": " <p style=\"orphans:0;widows:0\">    Kailasanatha Temple, Kanchipuram</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Dashavatara Temple at Deogarh in Uttar Pradesh, built during    the Gupta period (circa 6th century CE), is one of the earliest    surviving examples of the Panchayatana style of temple    architecture in India. In a Panchayatana layout, the main sanctum    is situated in the center and is flanked by four subsidiary    shrines at the corners.</p>", "question_heading": ""}, {"sr_no": 128, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following ancient Indian playwrights authored the    celebrated Sanskrit drama 'Mrichchhakatika' (The Little Clay    Cart)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Vishakhadatta</p>", "option2": " <p style=\"orphans:0;widows:0\">    Shudraka</p>", "option3": " <p style=\"orphans:0;widows:0\">    Harisena</p>", "option4": " <p style=\"orphans:0;widows:0\">    Banabhatta</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    'Mrichchhakatika' (The Little Clay Cart) is a famous ten-act    Sanskrit play written by Shudraka. Set in the ancient city of    Ujjayini, it depicts the love story of a noble but impoverished    merchant named Charudatta and a wealthy, virtuous courtesan named    Vasantasena, providing rich insight into the social and cultural    life of ancient India.</p>", "question_heading": ""}, {"sr_no": 129, "question": " <p style=\"orphans:0;widows:0\">    <b>The agricultural festival of 'Moatsu', celebrated to mark the    completion of the sowing season with traditional songs, dances,    and the lighting of a ritualistic bonfire called 'Sangpangtu', is    primarily observed by which of the following tribes?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Ao</p>", "option2": " <p style=\"orphans:0;widows:0\">    Angami</p>", "option3": " <p style=\"orphans:0;widows:0\">    Konyak</p>", "option4": " <p style=\"orphans:0;widows:0\">    Lotha</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The 'Moatsu' festival is celebrated annually in the first week of    May by the <b>Ao tribe</b> of Nagaland. It marks the completion of    the clearing of fields and the sowing of seeds. A major feature of    the festival is 'Sangpangtu', where a large bonfire is lit, and    people gather around it in their traditional finery to sing,    dance, and feast.</p>", "question_heading": ""}, {"sr_no": 130, "question": " <p style=\"orphans:0;widows:0\">    <b>Why do equatorial regions receive more intense heat from the    Sun compared to polar regions?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Equatorial regions are significantly closer to the Sun due to    Earth's elliptical orbit</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sun rays fall nearly vertically at the equator, concentrating    energy over a smaller surface area</p>", "option3": " <p style=\"orphans:0;widows:0\">    Polar regions have a much thicker atmosphere that absorbs all    incoming solar radiation</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ocean currents continuously carry all heat away from the poles to    the equator</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    At or near the equator, the Sun's rays strike the Earth's surface    at a nearly direct, vertical angle. This concentrates the incoming    solar radiation (insolation) over a smaller surface area and    minimizes atmospheric absorption, resulting in higher    temperatures. Towards the poles, the angle of incidence decreases    and the rays become slanting (oblique), which spreads the same    amount of energy over a much wider area and passes through a    greater thickness of the atmosphere, leading to lower    temperatures.</p>", "question_heading": ""}, {"sr_no": 131, "question": " <p style=\"orphans:0;widows:0\">    <b>Synthetic Aperture Radar (SAR) sensors onboard Earth    observation satellites are primarily preferred for flood    monitoring and disaster assessment because:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    They can capture imagery through dense cloud cover and operate    during both day and night</p>", "option2": " <p style=\"orphans:0;widows:0\">    They can forecast the exact date of rainfall months in advance</p>", "option3": " <p style=\"orphans:0;widows:0\">    They eliminate the need for telecommunication networks on the    ground</p>", "option4": " <p style=\"orphans:0;widows:0\">    They actively absorb floodwaters using microwave radiation</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Synthetic Aperture Radar (SAR) is an active microwave remote    sensing technology. Unlike optical sensors, which depend on    sunlight and are obstructed by clouds, haze, or smoke, SAR emits    its own radar signals. As a result, it can penetrate dense clouds,    rain, and fog and can operate effectively in both day and night    conditions, making it an invaluable tool for real-time flood    inundation mapping and disaster response.</p>", "question_heading": ""}, {"sr_no": 132, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following was the first woman to be elected as    the President of the United Nations General Assembly?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Sarojini Naidu</p>", "option2": " <p style=\"orphans:0;widows:0\">    Vijaya Lakshmi Pandit</p>", "option3": " <p style=\"orphans:0;widows:0\">    Hansa Mehta</p>", "option4": " <p style=\"orphans:0;widows:0\">    Rajkumari Amrit Kaur</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Vijaya Lakshmi Pandit was an Indian diplomat and politician who    was elected as the President of the United Nations General    Assembly in 1953 for its eighth session, becoming the first woman    to hold this prestigious international post.</p>", "question_heading": ""}, {"sr_no": 133, "question": " <p style=\"orphans:0;widows:0\">    <b>According to World Athletics rules, what is the standard width    of an individual lane on a standard 400-metre outdoor running    track?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1.00 m</p>", "option2": " <p style=\"orphans:0;widows:0\">    1.15 m</p>", "option3": " <p style=\"orphans:0;widows:0\">    1.22 m</p>", "option4": " <p style=\"orphans:0;widows:0\">    1.35 m</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    According to World Athletics Technical Rules, the standard width    of an individual running lane on a 400 m track is 1.22 m (with an    allowable tolerance of ± 0.01 m), including the lane line on the    right side of the runner.</p>", "question_heading": ""}, {"sr_no": 134, "question": " <p style=\"orphans:0;widows:0\">    <b>On which of the following dates is the 'International Day for    Biological Diversity' observed globally every year?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    22 April</p>", "option2": " <p style=\"orphans:0;widows:0\">    22 May</p>", "option3": " <p style=\"orphans:0;widows:0\">    5 June</p>", "option4": " <p style=\"orphans:0;widows:0\">    22 March</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The <b>International Day for Biological Diversity</b> is observed    globally every year on <b>22 May</b> to increase understanding and    awareness of biodiversity issues. This date commemorates the    adoption of the text of the Convention on Biological Diversity on    22 May 1992.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Key related    days:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>22 March:</b>    World Water Day</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>22 April:</b>    Earth Day</p>    <p style=\"orphans:0;widows:0\"><b>5 June:</b> World Environment    Day</p>", "question_heading": ""}, {"sr_no": 135, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following Constitutional Amendment Acts added    Bodo, Dogri, Maithili, and Santhali languages to the Eighth    Schedule of the Indian Constitution?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    21st Constitutional Amendment Act, 1967</p>", "option2": " <p style=\"orphans:0;widows:0\">    71st Constitutional Amendment Act, 1992</p>", "option3": " <p style=\"orphans:0;widows:0\">    92nd Constitutional Amendment Act, 2003</p>", "option4": " <p style=\"orphans:0;widows:0\">    96th Constitutional Amendment Act, 2011</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The 92nd Constitutional Amendment Act of 2003 added four    languages—Bodo, Dogri, Maithili, and Santhali—to the Eighth    Schedule of the Indian Constitution. With this addition, the total    number of officially recognized languages in the Eighth Schedule    increased from 18 to 22. Initially, the Constitution had 14    languages listed in the Eighth Schedule.</p>", "question_heading": ""}, {"sr_no": 136, "question": " <p style=\"orphans:0;widows:0\">    <b>In the taxonomic hierarchy, to which of the following    'Families' do human beings (Homo sapiens) belong?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Primata</p>", "option2": " <p style=\"orphans:0;widows:0\">    Hominidae</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mammalia</p>", "option4": " <p style=\"orphans:0;widows:0\">    Chordata</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Human beings (<i>Homo sapiens</i>) belong to the Family <b>Hominidae</b>.    The complete taxonomic classification of humans is: Kingdom -    Animalia, Phylum - Chordata, Class - Mammalia, Order - Primata,    Family - Hominidae, Genus - <i>Homo</i>, and Species - <i>sapiens</i>.</p>", "question_heading": ""}, {"sr_no": 137, "question": " <p style=\"orphans:0;widows:0\">    <b>Due to the failure of the Third Five-Year Plan and acute    economic crises, the Government of India declared a 'Plan Holiday'    during which of the following periods?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1962–1965</p>", "option2": " <p style=\"orphans:0;widows:0\">    1966–1969</p>", "option3": " <p style=\"orphans:0;widows:0\">    1969–1972</p>", "option4": " <p style=\"orphans:0;widows:0\">    1974–1977</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The period from 1966 to 1969 is known as the 'Plan Holiday' in    Indian planning history. Following the severe setback to the Third    Five-Year Plan (1961–1966) caused by the Sino-Indian War (1962),    the Indo-Pakistani War (1965), and severe droughts, the Fourth    Plan was delayed. During this interim period, three Annual Plans    were formulated for 1966–67, 1967–68, and 1968–69 before the    Fourth Five-Year Plan was finally launched in 1969.</p>", "question_heading": ""}, {"sr_no": 138, "question": " <p style=\"orphans:0;widows:0\">    <b>The landmark report titled 'Our Common Future', which formally    defined and popularized the concept of 'Sustainable Development',    was released in 1987 by which of the following?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Club of Rome</p>", "option2": " <p style=\"orphans:0;widows:0\">    Brundtland Commission</p>", "option3": " <p style=\"orphans:0;widows:0\">    Intergovernmental Panel on Climate Change</p>", "option4": " <p style=\"orphans:0;widows:0\">    United Nations Development Programme</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Brundtland Commission, officially known as the World    Commission on Environment and Development (WCED), published its    report titled 'Our Common Future' in 1987. The report provided the    classic definition of sustainable development as 'development that    meets the needs of the present without compromising the ability of    future generations to meet their own needs.' This report laid the    groundwork for the 1992 Rio Earth Summit.</p>", "question_heading": ""}, {"sr_no": 139, "question": " <p style=\"orphans:0;widows:0\">    <b>In which of the following states of India is primitive    slash-and-burn agriculture (shifting cultivation) locally known as    'Bewar' or 'Dahiya'?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Odisha</p>", "option2": " <p style=\"orphans:0;widows:0\">    Madhya Pradesh</p>", "option3": " <p style=\"orphans:0;widows:0\">    Andhra Pradesh</p>", "option4": " <p style=\"orphans:0;widows:0\">    Rajasthan</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In India, primitive subsistence farming or slash-and-burn    agriculture is known by various local names in different regions:    'Bewar' or 'Dahiya' in Madhya Pradesh, 'Podu' or 'Penda' in Andhra    Pradesh, 'Pama Dabi' or 'Koman' in Odisha, and 'Valre' or 'Waltre'    in south-eastern Rajasthan. Therefore, option B is correct.</p>", "question_heading": ""}, {"sr_no": 140, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following countries hosted the multilateral joint    military exercise 'KHAAN QUEST' 2026, in which the Indian Army    participated?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Kyrgyzstan</p>", "option2": " <p style=\"orphans:0;widows:0\">    Kazakhstan</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mongolia</p>", "option4": " <p style=\"orphans:0;widows:0\">    Uzbekistan</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <b>KHAAN QUEST 2026</b> was conducted from <b>20 June to 3 July    2026</b> at the <b>Five Hills Training Area, Ulaanbaatar,    Mongolia</b>. It is a multinational peacekeeping exercise aimed at    enhancing <b>interoperability and military cooperation</b> among    participating countries.</p>", "question_heading": ""}, {"sr_no": 141, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Kolkata-based shipbuilding company was responsible for    the construction of the naval vessels INS Dunagiri, INS    Sanshodhak, and INS Agray?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Mazagon Dock Shipbuilders Limited (MDL)</p>", "option2": " <p style=\"orphans:0;widows:0\">    Cochin Shipyard Limited (CSL)</p>", "option3": " <p style=\"orphans:0;widows:0\">    Garden Reach Shipbuilders &amp; Engineers (GRSE)</p>", "option4": " <p style=\"orphans:0;widows:0\">    Hindustan Shipyard Limited (HSL)</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <b>Garden Reach Shipbuilders &amp; Engineers (GRSE)</b>, based in    <b>Kolkata</b>, constructed the naval vessels <b>INS Dunagiri, INS    Sanshodhak, and INS Agray</b> for the Indian Navy.</p>", "question_heading": ""}, {"sr_no": 142, "question": " <p style=\"orphans:0;widows:0\">    <b>Recently launched by Avataar, what is the name of the    indigenous, distilled video AI model developed under the IndiaAI    Mission to make frontier-quality video generation affordable and    culturally relevant for India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Varya</p>", "option2": " <p style=\"orphans:0;widows:0\">    BharatGen</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sarvam</p>", "option4": " <p style=\"orphans:0;widows:0\">    Anuvadini</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <i><b>Varya\"</b></i> is India's first distilled video AI    model, launched by Avataar under the IndiaAI Mission. It uses an    advanced distillation technique to reduce generation time <i><b>(from    50 steps to 4)</b></i>, making it significantly more    cost-efficient and capable of generating content that reflects    India's cultural and regional diversity.</p>", "question_heading": ""}, {"sr_no": 143, "question": " <p style=\"orphans:0;widows:0\">    <b>What is the total financial outlay for the newly launched    Bharat Audyogik Vikas Yojana (BHAVYA), for which the BHAVYA Portal    was recently inaugurated?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    ₹25,500 crore</p>", "option2": " <p style=\"orphans:0;widows:0\">    ₹30,000 crore</p>", "option3": " <p style=\"orphans:0;widows:0\">    ₹33,660 crore</p>", "option4": " <p style=\"orphans:0;widows:0\">    ₹35,800 crore</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The BHAVYA (Bharat Audyogik Vikas Yojana) scheme has been launched    with a total financial outlay of <i><b>₹33,660 crore</b></i>,    supported by the newly operationalized BHAVYA portal to streamline    its implementation.</p>", "question_heading": ""}, {"sr_no": 144, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Which of the following statements about the Maratha Empire    is/are correct?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Shivaji was crowned at Raigad Fort in 1674.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. The council of eight ministers was known as the    Ashtapradhan.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. Peshwas were appointed as the commanders of the Maratha    navy.</b></p>    <p style=\"orphans:0;widows:0\"><b>Select the    correct answer using the code given below:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Shivaji was crowned at Raigad Fort in 1674 and assumed the title    of Chhatrapati.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    Ashtapradhan was a council of eight ministers that assisted    Shivaji in administration.</p>    <p style=\"orphans:0;widows:0\">The Maratha navy was headed by    the <b>Sarkhel (Admiral)</b>, not the Peshwa. Kanhoji Angre was a    famous Maratha naval commander.</p>", "question_heading": ""}, {"sr_no": 145, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following words was added to the Preamble of the    Indian Constitution by the 42nd Constitutional Amendment Act,    1976?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Republic, Justice and Liberty</p>", "option2": " <p style=\"orphans:0;widows:0\">    Socialist, Secular and Integrity</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sovereign, Democratic and Republic</p>", "option4": " <p style=\"orphans:0;widows:0\">    Equality, Fraternity and Liberty</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The 42nd Constitutional Amendment Act, 1976 added three words to    the Preamble:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Socialist</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Secular</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Integrity</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The original    Preamble described India as a Sovereign Democratic Republic.</p>    <p style=\"orphans:0;widows:0\">The word 'Integrity' was added to    the phrase \"Unity of the Nation\".</p>", "question_heading": ""}, {"sr_no": 146, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following plant hormones is primarily responsible    for promoting cell elongation and apical dominance in plants?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Cytokinin</p>", "option2": " <p style=\"orphans:0;widows:0\">    Auxin</p>", "option3": " <p style=\"orphans:0;widows:0\">    Gibberellin</p>", "option4": " <p style=\"orphans:0;widows:0\">    Abscisic acid (ABA)</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Auxin:</b> Promotes cell elongation and maintains apical    dominance.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Cytokinin:</b>    Stimulates cell division and delays leaf ageing.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Gibberellin:</b>    Promotes stem elongation and seed germination.</p>    <p style=\"orphans:0;widows:0\"><b>Abscisic acid (ABA):</b>    Inhibits growth and helps plants respond to stress.</p>", "question_heading": ""}, {"sr_no": 147, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>With reference to the Revolt of 1857, consider the following    statements:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Bahadur Shah Zafar was declared the Emperor of India by the    rebellious sepoys.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. Kunwar Singh led the revolt in the region of Bihar.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. Maulvi Ahmadullah Shah played an important role in the    revolt at Kanpur.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>4. Begum Hazrat Mahal led the revolt in Lucknow.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1, 2 and 4 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    1, 2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    2, 3 and 4 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2, 3 and 4</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1 – Correct:</b> Bahadur Shah Zafar was proclaimed    the Emperor of India by the rebels.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2 – Correct:</b> Kunwar Singh led the revolt in Jagdishpur,    Bihar.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    3 – Incorrect:</b> Maulvi Ahmadullah Shah was associated with    Faizabad and Awadh, not Kanpur. Nana Sahib led the revolt at    Kanpur.</p>    <p style=\"orphans:0;widows:0\"><b>Statement 4 – Correct:</b>    Begum Hazrat Mahal led the revolt in Lucknow against British rule.</p>", "question_heading": ""}, {"sr_no": 148, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following rivers flows through a rift valley and    drains into the Arabian Sea?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Godavari</p>", "option2": " <p style=\"orphans:0;widows:0\">    Mahanadi</p>", "option3": " <p style=\"orphans:0;widows:0\">    Narmada</p>", "option4": " <p style=\"orphans:0;widows:0\">    Krishna</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The Narmada River flows westward through a rift valley between the    Vindhya and Satpura ranges.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">It drains    into the Arabian Sea through the Gulf of Khambhat.</p>    <p style=\"orphans:0;widows:0\">The Tapi River also flows through    a rift valley and drains into the Arabian Sea.</p>", "question_heading": ""}, {"sr_no": 149, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following was granted to Panchayati Raj    Institutions through the 73rd Constitutional Amendment Act of    1992?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Full autonomy from State</p>", "option2": " <p style=\"orphans:0;widows:0\">    Direct control over the armed forces in rural areas</p>", "option3": " <p style=\"orphans:0;widows:0\">    Power to override state legislations in matters of local    importance</p>", "option4": " <p style=\"orphans:0;widows:0\">    Constitutional status and protection</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The <b>73rd Constitutional Amendment Act, 1992</b> granted    constitutional status to Panchayati Raj Institutions (PRIs).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">It added <b>Part    IX (Articles 243 to 243-O)</b> and the <b>11th Schedule</b> to the    Indian Constitution.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">It provided    for regular elections to Panchayats every <b>5 years</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Reservation    of seats for <b>Scheduled Castes (SCs), Scheduled Tribes (STs) and    at least one-third of seats for women</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">It provided    for the establishment of a <b>State Finance Commission every 5    years</b> to review the financial position of Panchayats.</p>    <p style=\"orphans:0;widows:0\">Article 243G empowers State    Legislatures to endow Panchayats with powers and responsibilities    for economic development and social justice.</p>", "question_heading": ""}, {"sr_no": 150, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following colour revolutions is NOT correctly    matched with the agricultural sector in which it brought a    significant increase in production in India since Independence?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Green Revolution – Foodgrain production</p>", "option2": " <p style=\"orphans:0;widows:0\">    Yellow Revolution – Oilseeds</p>", "option3": " <p style=\"orphans:0;widows:0\">    White Revolution – Milk</p>", "option4": " <p style=\"orphans:0;widows:0\">    Blue Revolution – Fruits and vegetables</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Blue Revolution (Neel Kranti):</b> Associated with increased    fish and aquatic food production in India.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Green    Revolution:</b> Associated with increased foodgrain production,    particularly wheat and rice.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Yellow    Revolution:</b> Associated with increased oilseed production.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>White    Revolution (Operation Flood):</b> Associated with increased milk    production.</p>    <p style=\"orphans:0;widows:0\"><b>Hiralal Chaudhuri:</b> Known    as the Father of the Blue Revolution in India.</p>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
