<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>6.) ALL INDIA MOCK-3 (FREE - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

"question_heading": ""}, {"sr_no": 32, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कंप्यूटर मेमोरी प्रबंधन में, कौन सा पेज प्रतिस्थापन एल्गोरिदम बेलाडी के विसंगति से ग्रस्त है, जहां आवंटित मेमोरी फ्रेम की संख्या बढ़ने से विरोधाभासी रूप से पेज फॉल्ट की दर बढ़ सकती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LRU (Least Recently Used)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Optimal Page Replacement</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FIFO (First-In, First-Out)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LFU (Least Frequently Used)</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">FIFO (First-In, First-Out)</span><span> कभी-कभी पेज फॉल्ट में वृद्धि का अनुभव कर सकता है जब किसी प्रक्रिया को अधिक भौतिक फ्रेम आवंटित किए जाते हैं—इस घटना को बेलाडी के विसंगति के रूप में जाना जाता है। LRU जैसे स्टैक-आधारित एल्गोरिदम इस व्यवहार को प्रदर्शित नहीं करते हैं।</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">माइक्रोसॉफ्ट एक्सेल में, यदि रेंज A1:C3 में निम्नलिखित मान हैं: पंक्ति 1: [10, 20, 30], पंक्ति 2: [40, 50, 60], पंक्ति 3: [70, 80, 90], तो सूत्र =INDEX(A1:C3, 2, 3) का सटीक आउटपुट क्या होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>50</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>60</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>80</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>INDEX(array, row_num, column_num) फ़ंक्शन दिए गए रेंज के भीतर एक विशिष्ट पंक्ति और स्तंभ के प्रतिच्छेदन से मान प्राप्त करता है। यहां, row_num 2 है (दूसरी पंक्ति: 40, 50, 60) और column_num 3 है (उस पंक्ति में तीसरा स्तंभ), जो </span><span style=\"font-weight:bold\">60</span><span> देता है।</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">किस प्रकार के नेटवर्क साइबर हमले में एक अनधिकृत तीसरा पक्ष दो पक्षों के बीच संचार को गुप्त रूप से रोकता, संशोधित करता और पुनः प्रेषित करता है, जबकि दोनों पक्षों को लगता है कि वे सीधे और सुरक्षित रूप से एक-दूसरे के साथ संचार कर रहे हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Distributed Denial of Service (DDoS)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Man-in-the-Middle (MitM) Attack</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SQL Injection Attack</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cross-Site Scripting (XSS)</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक </span><span style=\"font-weight:bold\">Man-in-the-Middle (MitM)</span><span> हमला तब होता है जब एक हमलावर गुप्त रूप से किसी क्लाइंट और सर्वर या दो उपयोगकर्ताओं के बीच में आ जाता है, संदेशों को रोकता है और संभवतः दोनों छोरों का प्रतिरूपण करते हुए उन्हें परिवर्तित कर देता है।</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">विंडोज़ ओएस में, कौन सी उन्नत फाइल सिस्टम फाइल/फोल्डर स्तर पर सुरक्षा अनुमतियाँ, वॉल्यूम संपीड़न के लिए समर्थन, ईएफएस (एन्क्रिप्टिंग फाइल सिस्टम), और लेन-देन लॉग के माध्यम से पुनर्प्राप्ति क्षमताएँ प्रस्तुत करती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FAT16</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FAT32</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NTFS</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>exFAT</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">NTFS (न्यू टेक्नोलॉजी फाइल सिस्टम)</span><span> आधुनिक विंडोज़ ऑपरेटिंग सिस्टम के लिए मानक मजबूत फाइल सिस्टम है, जो मूल फाइल-स्तरीय सुरक्षा (ACLs), अंतर्निहित फाइल एन्क्रिप्शन (EFS), संपीड़न, और लेन-देन लॉगिंग के माध्यम से दोष सहिष्णुता प्रदान करता है।</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित में से कौन सा लक्षण एक नेटवर्क वाले कंप्यूटर वर्कस्टेशन पर सक्रिय पृष्ठभूमि स्पाइवेयर या एडवेयर मैलवेयर संक्रमण का सबसे विश्वसनीय संकेतक है, न कि सामान्य हार्डवेयर बॉटलनेक का?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कंप्यूटर को बूट होने में अधिक समय लगता है क्योंकि मैकेनिकल हार्ड ड्राइव ब्लॉक खराब हो रहा है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अनचाहे पॉप-अप विज्ञापन लगातार दिखाई देते हैं और डिफ़ॉल्ट ब्राउज़र सर्च इंजन उपयोगकर्ता की सहमति के बिना स्वचालित रूप से बदल जाता है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>भारी वीडियो रेंडरिंग कार्यों के दौरान CPU कूलिंग फैन अधिकतम RPM पर चलता है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फिजिकल RAM में एक साथ कई बड़े डेटाबेस चलाने पर एप्लिकेशन की प्रतिक्रिया धीमी हो जाती है।</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>लगातार अनचाहे पॉप-अप, बदले हुए ब्राउज़र होमपेज और रीडायरेक्टेड सर्च क्वेरीज़ एडवेयर/ब्राउज़र हाइजैकर्स के प्रमुख लक्षण हैं। धीमी बूट टाइम या तेज़ फैन आमतौर पर हार्डवेयर या थर्मल समस्याएं हैं न कि मैलवेयर के लक्षण।</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कंप्यूटर नेटवर्किंग और नेटवर्क सुरक्षा खतरों के संदर्भ में, कंप्यूटर वायरस और नेटवर्क वर्म के बीच प्राथमिक परिचालन अंतर क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक वायरस को संक्रमित होस्ट फ़ाइल के माध्यम से फैलने के लिए उपयोगकर्ता की कार्रवाई की आवश्यकता होती है, जबकि एक वर्म एक स्टैंडअलोन मैलवेयर है जो नेटवर्क पर स्वतंत्र रूप से स्व-प्रतिकृति बनाता है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक वायरस हार्ड ड्राइव जैसे हार्डवेयर घटकों पर हमला करता है, जबकि एक वर्म विशेष रूप से सॉफ्टवेयर एप्लिकेशन पर हमला करता है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक वर्म मैन्युअल यूएसबी फ्लैश ड्राइव ट्रांसफर के बिना किसी भी परिस्थिति में प्रतिकृति नहीं बना सकता।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक वायरस कानूनी ओपन-सोर्स सॉफ्टवेयर है, जबकि एक वर्म एन्क्रिप्टेड वाणिज्यिक स्पाइवेयर है।</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक कंप्यूटर वायरस स्वयं को एक वाहक प्रोग्राम या दस्तावेज़ से जोड़ता है और फैलने के लिए एक होस्ट क्रिया (जैसे फ़ाइल खोलना) की आवश्यकता होती है। इसके विपरीत, एक वर्म एक स्टैंडअलोन प्रोग्राम है जो नेटवर्क कमजोरियों का फायदा उठाकर मानवीय हस्तक्षेप के बिना स्वायत्त रूप से प्रतिकृति बनाता है और मशीन से मशीन में फैलता है।</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">मल्टीपर्पस इंटरनेट मेल एक्सटेंशन (MIME) मानक में, कौन सा विशिष्ट ईमेल हेडर फ़ील्ड यह निर्देशित करने के लिए प्रयोग किया जाता है कि संलग्न फ़ाइल को सीधे ईमेल बॉडी व्यूपोर्ट के अंदर प्रदर्शित किया जाए या एक स्वतंत्र डाउनलोड करने योग्य फ़ाइल के रूप में माना जाए?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Content-Type</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Content-Disposition</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Content-Transfer-Encoding</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Content-ID</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Content-Disposition हेडर फ़ील्ड MIME में संदेश भागों की प्रस्तुति शैली निर्दिष्ट करता है। यह inline (सामग्री को ईमेल देखने वाले क्षेत्र के भीतर सीधे प्रदर्शित करने के लिए) या attachment (उपयोगकर्ता को इसे अलग से डाउनलोड या खोलने के लिए प्रेरित करने के लिए) जैसे पैरामीटर स्वीकार करता है।</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">आधुनिक असममित क्रिप्टोग्राफिक संचार में, यदि उपयोगकर्ता A उपयोगकर्ता B को एक गोपनीय एन्क्रिप्टेड संदेश भेजना चाहता है जिसे केवल उपयोगकर्ता B डिक्रिप्ट करके मूल प्लेनटेक्स्ट पढ़ सके, तो उपयोगकर्ता A को संदेश को एन्क्रिप्ट करने के लिए किस विशिष्ट क्रिप्टोग्राफिक कुंजी का उपयोग करना चाहिए?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उपयोगकर्ता A की अपनी प्राइवेट कुंजी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उपयोगकर्ता B की पब्लिक कुंजी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उपयोगकर्ता B की प्राइवेट कुंजी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक साझा सममित सत्र पासवर्ड</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>असममित (पब्लिक-कुंजी) एन्क्रिप्शन में, प्राप्तकर्ता की </span><span style=\"font-weight:bold\">पब्लिक कुंजी</span><span> से एन्क्रिप्ट किया गया संदेश केवल उस प्राप्तकर्ता की गणितीय रूप से जोड़ी गई </span><span style=\"font-weight:bold\">प्राइवेट कुंजी</span><span> का उपयोग करके डिक्रिप्ट किया जा सकता है। चूंकि केवल उपयोगकर्ता B के पास उपयोगकर्ता B की प्राइवेट कुंजी होती है, इसलिए गोपनीयता की गारंटी होती है। (उपयोगकर्ता A की प्राइवेट कुंजी से एन्क्रिप्ट करने का उपयोग डिजिटल हस्ताक्षर के लिए किया जाता है, गोपनीयता के लिए नहीं)।</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MS PowerPoint में प्रेजेंटेशन डिज़ाइन करते समय, आप एक कस्टम लेआउट को लागू करना चाहते हैं जिसमें दो कंटेंट प्लेसहोल्डर साइड-बाय-साइड हों, बिना नई स्लाइड डाले पहले से बनी स्लाइड पर। कौन सा सटीक रिबन पथ और कमांड अनुक्रम इसे पूरा करता है?</span></p>", "option1": "Dधौign Tोृ -&gपे Cहौपयंप्रध Gनयहू -&gपे Sिiकध Sप्रध -&gपे Tथय Cयnपधnप", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Home Tab -&gt; Slides Group -&gt; Layout -&gt; Two Content</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Insert Tab -&gt; Slides Group -&gt; New Slide -&gt; Two Content</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>View Tab -&gt; Master Views -&gt; Slide Master -&gt; Two Content</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MS PowerPoint में मौजूदा स्लाइड के संरचनात्मक लेआउट को बदलने के लिए बिना डुप्लिकेट स्लाइड जोड़े, </span><span style=\"font-weight:bold\">Home -&gt; Slides -&gt; Layout</span><span> पर नेविगेट करें और वांछित प्रीसेट (जैसे \"Two Content\") चुनें। Insert -&gt; New Slide का उपयोग करने से वर्तमान स्लाइड को बदलने के बजाय एक अतिरिक्त स्लाइड बनती है।</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">एक MS Excel शीट पर विचार करें जहां कॉलम A से E तक डेटा है, और कॉलम C वर्तमान में चयनित है। यदि उपयोगकर्ता एक कॉलम सम्मिलित करने की क्रिया निष्पादित करता है और तुरंत नए बनाए गए सेल में =COLUMN() फॉर्मूला दर्ज करता है, तो कौन सा मान वापस आएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>जब Excel में एक नया कॉलम डाला जाता है, तो यह वर्तमान में चयनित कॉलम के तुरंत </span><span style=\"font-style:italic\">बाईं ओर</span><span> रखा जाता है। चूंकि कॉलम C चयनित था, नया खाली कॉलम C स्थिति पर डाला जाता है, जिससे मूल कॉलम C को D पर स्थानांतरित कर दिया जाता है। इस प्रकार, नया कॉलम कॉलम C बन जाता है, और =COLUMN() 3 का मूल्यांकन करता है।</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">एमएस आउटलुक में सक्रिय ईमेल ड्राफ्टिंग सत्र के दौरान, एक उपयोगकर्ता ऑफ़लाइन कतार-भेजता है एक संदेश जिसमें एक अटैचमेंट होता है जो सर्वर पॉलिसी की अधिकतम फ़ाइल आकार सीमा का उल्लंघन करता है। क्लाइंट एप्लिकेशन के अंदर कौन सी घटनाओं और स्थिति फ्लैग का क्रम होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ईमेल सीधे 'भेजी गई वस्तुएँ' में चला जाता है एक लंबित चेतावनी फ्लैग के साथ।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ईमेल 'आउटबॉक्स' में ले जाया जाता है जहाँ इसे संपादित या हटाया जा सकता है, और यह वहाँ अनिश्चित काल तक अटक जाता है जब तक इसे संशोधित या हटाया नहीं जाता।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ईमेल स्वचालित रूप से डिस्क से हटा दी जाती है बफर ओवरफ्लो को रोकने के लिए।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ईमेल 'ड्राफ्ट' में स्थानांतरित हो जाती है और अटैचमेंट को एक हाइपरलिंक में परिवर्तित कर देती है।</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ऑफ़लाइन भेजते समय, ईमेल आउटबॉक्स में रहती हैं। यदि संचरण सर्वर-साइड आकार सीमा (या प्रोटोकॉल अस्वीकृति) के कारण विफल हो जाता है, तो आइटम आउटबॉक्स कतार में फंसा रहता है, उपयोगकर्ता द्वारा पूरी तरह से संपादन योग्य या हटाने योग्य बना रहता है जब तक कि समस्या का समाधान नहीं हो जाता।</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">विंडोज़ ऑपरेटिंग सिस्टम और अधिकांश सॉफ़्टवेयर एप्लिकेशन में कीबोर्ड शॉर्टकट Ctrl + Z का प्राथमिक कार्य क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंतिम क्रिया को फिर से करें</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंतिम क्रिया को पूर्ववत करें</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कॉपी किए गए टेक्स्ट को पेस्ट करें</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फाइंड डायलॉग बॉक्स खोलें</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Ctrl + Z</span><span> शॉर्टकट का उपयोग सार्वभौमिक रूप से सबसे हाल की क्रिया, कमांड या संपादन को </span><span style=\"font-weight:bold\">पूर्ववत</span><span> करने के लिए किया जाता है। (</span><span style=\"font-weight:bold\">Ctrl + Y</span><span> का उपयोग आमतौर पर फिर से करने के लिए किया जाता है)।</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MS Word में, चयनित पैराग्राफ या टेक्स्ट को सेंटर अलाइन करने के लिए किस शॉर्टकट कुंजी संयोजन का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + L</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + E</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + C</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + J</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Ctrl + E</span><span> MS Word में टेक्स्ट को सेंटर अलाइन करने के लिए मानक शॉर्टकट है। (</span><span style=\"font-weight:bold\">Ctrl + L</span><span> लेफ्ट अलाइनमेंट के लिए, </span><span style=\"font-weight:bold\">Ctrl + R</span><span> राइट अलाइनमेंट के लिए, और </span><span style=\"font-weight:bold\">Ctrl + J</span><span> जस्टिफिकेशन के लिए होता है)।</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">ईमेल भेजते समय, ISP शब्द का क्या अर्थ होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इंटरनेट सुरक्षा प्रोटोकॉल</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आंतरिक सेवा प्रदाता</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इंटरनेट सेवा प्रदाता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सूचना प्रणाली कार्यक्रम</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">ISP</span><span> का अर्थ है इंटरनेट सेवा प्रदाता, जो एक कंपनी (जैसे एयरटेल, जियो, बीएसएनएल) होती है जो व्यक्तियों और संगठनों को इंटरनेट पहुंच प्रदान करती है।</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित में से किसे एप्लिकेशन सॉफ्टवेयर के बजाय सिस्टम सॉफ्टवेयर माना जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Microsoft Word</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Adobe Photoshop</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Linux Operating System</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Google Chrome</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक </span><span style=\"font-weight:bold\">ऑपरेटिंग सिस्टम (जैसे Linux, Windows)</span><span> सिस्टम सॉफ्टवेयर है जो कंप्यूटर हार्डवेयर को प्रबंधित करता है और कंप्यूटर प्रोग्राम्स के लिए सामान्य सेवाए option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>टिल्ड (~)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तारांकन (*)</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>किसी शब्द के ठीक पहले माइनस चिह्न (-) लगाने से (उनके बीच कोई स्थान नहीं होना चाहिए, जैसे -apple), सर्च इंजन को यह निर्देश मिलता है कि वह उन परिणामों को बाहर कर दे जिनमें वह विशिष्ट शब्द शामिल हो।</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कौन सा विशिष्ट प्रकार का मैलवेयर एक वैध दिखने वाले फ़ाइल या प्रोग्राम के अंदर छिपा होता है, लेकिन एक बार निष्पादित होने पर, यह एक गुप्त संचार चैनल खोलता है जो अनधिकृत दूरस्थ उपयोगकर्ताओं को संक्रमित कंप्यूटर पर पूर्ण प्रशासनिक नियंत्रण प्राप्त करने की अनुमति देता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्पाइवेयर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बैकडोर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एडवेयर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>लॉजिक बम</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक </span><span style=\"font-weight:bold\">बैकडोर</span><span> (अक्सर ट्रोजन द्वारा स्थापित) एक सुरक्षा विधि है जिसका उपयोग सामान्य प्रमाणीकरण प्रक्रियाओं को बायपास करने के लिए किया जाता है, जो साइबर अपराधियों को एक सिस्टम पर अनधिकृत दूरस्थ पहुंच प्रदान करता है।</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित में से कौन सा भं
