">    The passage details the individual characteristics and career    roles of solar, wind, and hydroelectric energy, and concludes by    emphasizing that contemporary systems increasingly rely on hybrid    infrastructure to maintain grid reliability, blurring historical    boundaries between them. Thus, option B accurately captures the    main idea.</p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate word to fill in the blank and complete    the collocation.</p>    <p style=\"orphans:0;widows:0\">The audit team was assigned to    ______ the discrepancies between the two financial reports.</p>", "option1": "<p style=\"orphans:0;widows:0\">    reconcile</p>", "option2": " <p style=\"orphans:0;widows:0\">    reciprocate</p>", "option3": " <p style=\"orphans:0;widows:0\">    recuperate</p>", "option4": " <p style=\"orphans:0;widows:0\">    renounce</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct word is <b>reconcile</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Explanation:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Reconcile</b>    means to find a way in which two opposing statements, figures, or    facts can agree or exist together, or to explain inconsistencies    (especially in accounting and auditing). The phrase 'reconcile the    discrepancies' is a standard and formal collocation.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Reciprocate</b>    means to respond to a gesture or action by making a corresponding    one.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Recuperate</b>    means to recover from illness, exhaustion, or loss.</p>    <p style=\"orphans:0;widows:0\"><b>Renounce</b> means to formally    give up or abandon a claim, belief, or right.</p>", "question_heading": ""}, {"sr_no": 82, "question": "Rधोननोngध पुध ूोनपौ यी पुध ौधnपधncध in पुध cयननधcप यनकधन. Dधौूiपध पुध नोूiक धसूोnौiयn यी नधnधथोृिध धnधनgद inीनोौपनहcपहनध, P. ोnक नोiौing कयहृपौ ोृयहप थुधपुधन gियृोि cिiंोपध पोनgधपौ थiिि ृध ंधप Q. ंोnद कधॅिधयूing nोपiयnौ cयnपinहध पय निधद ुधोॅiिद यn ीयौौiि ीहिधस, R. िधोकing पय ौigniीicोnप किधोदौ in पुधiन कधcोनृयniौोपiयn gयोिस S. ोौ ौहनging inकहौपनiोि कधंोnक यहपूोcधौ ोककiपiयnौ पय gनधधn धnधनgद gनiकौ,", "option1": "<p style=\"orphans:0;widows:0\">    SQRP</p>", "option2": " <p style=\"orphans:0;widows:0\">    QSRP</p>", "option3": " <p style=\"orphans:0;widows:0\">    QPRS</p>", "option4": " <p style=\"orphans:0;widows:0\">    RSQP</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The introductory clause 'Despite the rapid expansion of renewable    energy infrastructure,' sets up a contrast and must be followed by    a main clause containing a subject and finite verb. Part <b>Q</b>    ('many developing nations continue to rely heavily on fossil    fuels,') logically and grammatically provides this subject and    verb. Next, Part <b>S</b> ('as surging industrial demand    outpaces...') explains the reason for this continuing reliance.    Part <b>R</b> ('leading to significant delays in their    decarbonisation goals') describes the resulting consequence of    this reliance. Finally, Part <b>P</b> ('and raising doubts...')    connects to R using the conjunction 'and', presenting a parallel    participle phrase ('leading to... and raising doubts...'). Thus,    the coherent and grammatically correct sequence is <b>QSRP</b>.</p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate phrasal verb to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">The committee decided to ________    the outdated rules in order to streamline the admission process.</p>", "option1": "<p style=\"orphans:0;widows:0\">    do down</p>", "option2": " <p style=\"orphans:0;widows:0\">    do away with</p>", "option3": " <p style=\"orphans:0;widows:0\">    do up</p>", "option4": " <p style=\"orphans:0;widows:0\">    do for</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct phrasal verb is <b>do away with</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meaning of    the phrasal verbs:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>do away    with:</b> to abolish, get rid of, or eliminate something (e.g.,    rules, laws, or practices).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>do down:</b>    to criticize or speak ill of someone unfairly.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>do up:</b>    to fasten something (like a coat) or to renovate/decorate a    building or room.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>do for:</b>    to ruin, defeat, or destroy something/someone.</p>    <p style=\"orphans:0;widows:0\">Since the sentence refers to    eliminating or abolishing \"outdated rules,\" <b>do away    with</b> is the contextually appropriate choice.</p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Rearrange the parts of the sentence in the correct order.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    integration of modern technology</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">P. into    traditional educational systems</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Q. has    significantly improved student engagement,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R. preparing    them for future career challenges</p>    <p style=\"orphans:0;widows:0\">S. by promoting interactive and    personalized learning methods,</p>", "option1": "<p style=\"orphans:0;widows:0\">    PQSR</p>", "option2": " <p style=\"orphans:0;widows:0\">    QPSR</p>", "option3": " <p style=\"orphans:0;widows:0\">    PRSQ</p>", "option4": " <p style=\"orphans:0;widows:0\">    SPRQ</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct order is <b>PQSR</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>P</b> must    directly follow the given opening phrase because the prepositional    complement of 'integration' is 'into' (i.e., 'The integration of    modern technology into traditional educational systems'). This    completes the subject noun phrase.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Q</b>    provides the main finite verb phrase ('has significantly improved    student engagement') required by the subject.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>S</b> acts    as an adverbial phrase of manner explaining how engagement is    improved ('by promoting interactive and personalized learning    methods').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>R</b>    functions as a concluding participial clause showing the resulting    outcome ('preparing them for future career challenges').</p>    <p style=\"orphans:0;widows:0\">Hence, the meaningful and    grammatically correct sequence is <b>PQSR</b>.</p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:0;widows:0\">    Select the option that best expresses the meaning of the given    idiom: \"A bolt from the blue\".</p>", "option1": "<p style=\"orphans:0;widows:0\">    A sudden and completely unexpected event</p>", "option2": " <p style=\"orphans:0;widows:0\">    A period of continuous good fortune</p>", "option3": " <p style=\"orphans:0;widows:0\">    A planned and well-prepared event</p>", "option4": " <p style=\"orphans:0;widows:0\">    A thunderstorm with heavy rain</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The idiom \"a bolt from the blue\" refers to something    important or unusual that happens suddenly and completely    unexpectedly, like a flash of lightning from a clear blue sky.    Therefore, option 1 is the correct answer.</p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"orphans:0;widows:0\">    Which of the following options is NOT one of the meanings of the    homonym 'sound'?</p>", "option1": "<p style=\"orphans:0;widows:0\">    In good condition, healthy, or showing good judgment</p>", "option2": " <p style=\"orphans:0;widows:0\">    A narrow stretch of water connecting two larger bodies of water</p>", "option3": " <p style=\"orphans:0;widows:0\">    Vibrations that travel through the air and can be heard</p>", "option4": " <p style=\"orphans:0;widows:0\">    Fragile and easily broken under slight pressure</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The word 'sound' has multiple homonymic meanings: as a noun, it    refers to vibrations perceived by the ear or a geographical    feature (a narrow ocean channel or stretch of water connecting two    bodies of water); as an adjective, it means in good condition,    healthy, reliable, or showing good judgment (e.g., 'sound advice',    'sound health'). It never means 'fragile and easily broken under    slight pressure', which is actually the opposite of its adjectival    sense.</p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Which of the given options arranges the following sentences in    the most logical sequence to form a meaningful paragraph?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">While    behaviorists argued that language is learned through imitation and    reinforcement, nativists posited an innate biological capacity.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The study of    how humans acquire language has long fascinated cognitive    scientists and linguists.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">This ongoing    debate has shaped modern theories, blending cognitive, social, and    biological perspectives.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Central to    this inquiry is the question of whether language ability is an    innate human trait or an acquired skill.</p>    <p style=\"orphans:0;widows:0\">In particular, Noam Chomsky    proposed the concept of a Universal Grammar shared by all human    minds.</p>", "option1": "<p style=\"orphans:0;widows:0\">    2-4-1-5-3</p>", "option2": " <p style=\"orphans:0;widows:0\">    4-2-1-3-5</p>", "option3": " <p style=\"orphans:0;widows:0\">    2-1-4-5-3</p>", "option4": " <p style=\"orphans:0;widows:0\">    4-1-5-2-3</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct logical sequence is <b>2-4-1-5-3</b>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sentence 2</b>    introduces the overarching subject—how humans acquire language    and its interest to cognitive scientists and linguists.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sentence 4</b>    follows directly by stating the central dilemma of \"this    inquiry\" (innate trait vs. acquired skill).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sentence 1</b>    explains the two opposing camps addressing that dilemma    (behaviorists vs. nativists).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sentence 5</b>    provides a specific example/advancement of the nativist view    mentioned in sentence 1 (Chomsky's Universal Grammar).</p>    <p style=\"orphans:0;widows:0\"><b>Sentence 3</b> logically    concludes the paragraph by reflecting on how this entire debate    has shaped modern theories.</p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate synonym of the given word: <b>PERFIDIOUS</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Faithful</p>", "option2": " <p style=\"orphans:0;widows:0\">    Treacherous</p>", "option3": " <p style=\"orphans:0;widows:0\">    Reliable</p>", "option4": " <p style=\"orphans:0;widows:0\">    Honest</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>PERFIDIOUS</b> means deceitful, disloyal, and    untrustworthy. Therefore, its most appropriate synonym is    <b>Treacherous</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Faithful</b>:    Loyal, constant, and steadfast (antonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Reliable</b>:    Consistently good in quality or performance; trustworthy    (antonym).</p>    <p style=\"orphans:0;widows:0\">- <b>Honest</b>: Free of deceit;    truthful and sincere (antonym).</p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate antonym of the given word. <b>Benevolence</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Compassion</p>", "option2": " <p style=\"orphans:0;widows:0\">    Kindness</p>", "option3": " <p style=\"orphans:0;widows:0\">    Malevolence</p>", "option4": " <p style=\"orphans:0;widows:0\">    Generosity</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>Benevolence</b> refers to the quality of being    well-meaning, kind, or charitable.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Malevolence</b>    refers to having or showing a wish to do evil to others (ill will    or malice), making it the most appropriate antonym.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Compassion:</b>    sympathetic pity and concern for others (synonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Kindness:</b>    the quality of being friendly, generous, and considerate    (synonym).</p>    <p style=\"orphans:0;widows:0\"><b>Generosity:</b> the quality of    being kind and giving (synonym).</p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:0;widows:0\">    Select the <b>correct spelling</b> of the word that means    'incapable of being corrected or reformed'.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Incorigible</p>", "option2": " <p style=\"orphans:0;widows:0\">    Incorrigible</p>", "option3": " <p style=\"orphans:0;widows:0\">    Incorrigable</p>", "option4": " <p style=\"orphans:0;widows:0\">    Incurrigible</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The correctly spelt word is <b>Incorrigible</b>. It is an    adjective that refers to a person or their behaviour not being    able to be changed, improved, or reformed.</p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"orphans:0;widows:0\">    Identify the <b>misspelt</b> word.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Resuscitate</p>", "option2": " <p style=\"orphans:0;widows:0\">    Iridescent</p>", "option3": " <p style=\"orphans:0;widows:0\">    Acquiesence</p>", "option4": " <p style=\"orphans:0;widows:0\">    Pseudonym</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The incorrectly spelt word is 'Acquiesence'. The correct spelling    is <b>Acquiescence</b>, which means the reluctant acceptance of    something without protest.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other words:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Resuscitate:</b>    to revive someone from unconsciousness or apparent death.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Iridescent:</b>    showing luminous colours that seem to change when seen from    different angles.</p>    <p style=\"orphans:0;widows:0\"><b>Pseudonym:</b> a fictitious    name, especially one used by an author.</p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to substitute the underlined    segment in the given sentence.</p>    <p style=\"orphans:0;widows:0\">Deepak <u><b>told that he will    finish</b></u> the project on time.</p>", "option1": "<p style=\"orphans:0;widows:0\">    said that he will finish</p>", "option2": " <p style=\"orphans:0;widows:0\">    told that he would finish</p>", "option3": " <p style=\"orphans:0;widows:0\">    said that he would finish</p>", "option4": " <p style=\"orphans:0;widows:0\">    said that he would finished</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    'Said' is used when no indirect personal object is mentioned    (e.g., 'said that...'), whereas 'told' requires an object (e.g.,    'told someone that...'). Additionally, since the reporting verb is    in the past tense, the modal 'will' changes to 'would' in reported    speech, followed by the base form of the verb ('finish').    Therefore, 'said that he would finish' is the correct replacement.</p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate antonym of the underlined word.</p>    <p style=\"orphans:0;widows:0\">His reckless actions brought    severe <u><b>censure</b></u> from the board of directors.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Rebuke</p>", "option2": " <p style=\"orphans:0;widows:0\">    Disapproval</p>", "option3": " <p style=\"orphans:0;widows:0\">    Praise</p>", "option4": " <p style=\"orphans:0;widows:0\">    Reproof</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    'Censure' means the expression of formal or severe disapproval, or    harsh criticism. Its correct antonym is 'Praise', which means the    expression of approval or admiration for someone or something.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rebuke:</b>    an expression of sharp criticism or disapproval (synonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Disapproval:</b>    possession or expression of an unfavourable opinion (synonym).</p>    <p style=\"orphans:0;widows:0\"><b>Reproof:</b> an expression of    blame or disapproval (synonym).</p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct passive form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The fire destroyed several shops    in the market. Even the warehouse has been gutted.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Several shops in the market have been destroyed by the fire. Even    the warehouse is being gutted.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Several shops in the market were destroyed by the fire. Even the    warehouse has been gutted.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Several shops destroyed in the market by the fire, even the    warehouse had gutted.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The fire, having destroyed several shops in the market, also    gutted the warehouse.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence contains two parts:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. 'The fire    destroyed several shops in the market' is in the active voice    (Simple Past Tense). The passive voice structure for Simple Past    Tense is: <b>Object + was/were + V3 + by + Subject</b>. Since    'several shops' is plural, 'were destroyed by the fire' is    correct.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. 'Even the    warehouse has been gutted' is already in the passive voice    (Present Perfect Tense) and remains unchanged.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct passive    sentence is: 'Several shops in the market were destroyed by the    fire. Even the warehouse has been gutted.'</p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that gives the most appropriate meaning of the    given idiom.</p>    <p style=\"orphans:0;widows:0\">To nip in the bud</p>", "option1": "<p style=\"orphans:0;widows:0\">    To plant seeds carefully in a garden</p>", "option2": " <p style=\"orphans:0;widows:0\">    To stop or destroy something at an early stage</p>", "option3": " <p style=\"orphans:0;widows:0\">    To encourage someone to pursue their dreams</p>", "option4": " <p style=\"orphans:0;widows:0\">    To praise someone excessively</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The idiom <b>'to nip in the bud'</b> means to suppress, stop, or    destroy something (especially a problem or bad habit) at an early    stage before it can develop further. Hence, the correct answer is    option B.</p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct direct form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The visitor inquired whether the    museum was open on Mondays.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The visitor asked, \"Was the museum open on Mondays?\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    The visitor asked, \"Is the museum open on Mondays?\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    The visitor asked, \"The museum is open on Mondays?\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    The visitor asked, \"Whether the museum was open on Mondays?\"</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the indirect speech of a yes/no question into direct    speech, follow these rules:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Remove the    conjunction 'whether' or 'if'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Change the    simple past tense ('was') back to the simple present tense ('is').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Form a    direct interrogative structure (Verb + Subject + ...?) within    quotation marks: <i>\"Is the museum open on Mondays?\"</i></p>    <p style=\"orphans:0;widows:0\">Therefore, option B is the    correct direct form.</p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate synonym of the given word.</p>    <p style=\"orphans:0;widows:0\">Spurious</p>", "option1": "<p style=\"orphans:0;widows:0\">    Genuine</p>", "option2": " <p style=\"orphans:0;widows:0\">    Counterfeit</p>", "option3": " <p style=\"orphans:0;widows:0\">    Authentic</p>", "option4": " <p style=\"orphans:0;widows:0\">    Factual</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>'Spurious'</b> means not being what it purports to be;    false or fake.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">•    <b>Counterfeit</b> means made in exact imitation of something    valuable with the intention to deceive or defraud; fake. Hence, it    is the correct synonym.</p>    <p style=\"orphans:0;widows:0\">• <i>Genuine</i>, <i>Authentic</i>,    and <i>Factual</i> all refer to things that are real, true, or    original, making them antonyms of 'Spurious'.</p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"orphans:0;widows:0\">    Select the wrongly spelt word out of the given alternatives.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Magnanimous</p>", "option2": " <p style=\"orphans:0;widows:0\">    Miscellaneous</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mischievious</p>", "option4": " <p style=\"orphans:0;widows:0\">    Miraculous</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The wrongly spelt word is 'Mischievious'. The correct spelling is    <b>'Mischievous'</b>, which means causing or showing a fondness    for causing trouble in a playful way.</p>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to substitute the underlined    segment in the given sentence. If there is no need to substitute    it, select 'No substitution required'.</p>    <p style=\"orphans:0;widows:0\">The little girl was sitting    <u>peacefully besides her grandmother</u> during the ceremony.</p>", "option1": "<p style=\"orphans:0;widows:0\">    peaceful beside her grandmother</p>", "option2": " <p style=\"orphans:0;widows:0\">    peacefully beside her grandmother</p>", "option3": " <p style=\"orphans:0;widows:0\">    peacefully beside to her grandmother</p>", "option4": " <p style=\"orphans:0;widows:0\">    No substitution required</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct substitution is <b>peacefully beside her grandmother</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Explanation:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Beside</b>    is a preposition meaning 'at the side of' or 'next to'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Besides</b>    is a preposition/adverb meaning 'in addition to' or 'apart from'.</p>    <p style=\"orphans:0;widows:0\">In this sentence, the context    indicates physical proximity (sitting next to her grandmother), so    'beside' must be used instead of 'besides'. The adverb    'peacefully' correctly modifies the verb 'was sitting'. Hence,    option B is correct.</p>", "question_heading": ""}, {"sr_no": 100, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, out of the four alternatives, choose    the one which can be substituted for the given words/sentence.</p>    <p style=\"orphans:0;widows:0\">An extreme or irrational fear of    darkness.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Pyrophobia</p>", "option2": " <p style=\"orphans:0;widows:0\">    Cynophobia</p>", "option3": " <p style=\"orphans:0;widows:0\">    Nyctophobia</p>", "option4": " <p style=\"orphans:0;widows:0\">    Xenophobia</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitution is <b>Nyctophobia</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">-    <b>Nyctophobia:</b> An extreme or irrational fear of the night or    darkness.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Pyrophobia:</b>    An irrational fear of fire.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Cynophobia:</b>    An abnormal fear of dogs.</p>    <p style=\"orphans:0;widows:0\">- <b>Xenophobia:</b> Fear or    hatred of strangers or foreigners.</p>", "question_heading": ""}, {"sr_no": 101, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Choose the most appropriate option to fill in the blank in the    given sentence.</p>    <p style=\"orphans:0;widows:0\">The detective was known for his    ________ mind, easily spotting details that others overlooked.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Sluggish</p>", "option2": " <p style=\"orphans:0;widows:0\">    Naive</p>", "option3": " <p style=\"orphans:0;widows:0\">    Astute</p>", "option4": " <p style=\"orphans:0;widows:0\">    Dormant</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    'Astute' means having or showing an ability to accurately assess    situations or people; shrewd and sharp-witted. In this context, a    detective with an astute mind would be perceptive enough to notice    overlooked details.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sluggish:</b>    slow-moving or lacking energy.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Naive:</b>    showing a lack of experience, wisdom, or judgment.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Dormant:</b>    temporarily inactive or in a state of rest.</p>    <p style=\"orphans:0;widows:0\">Therefore, <b>Astute</b> is the    most appropriate choice.</p>", "question_heading": ""}, {"sr_no": 102, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct indirect form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">“Do you believe you can manage    this project without any guidance?” sneered the manager.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The manager sneered and asked whether he believed he could manage    that project without any guidance.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The manager sneered that did he believe he could manage that    project without any guidance.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The manager sneered and asked if he has believed he can manage    this project without any guidance.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The manager sneered and asked whether you believed you could    manage that project without any guidance.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct indirect form is: <b>The manager sneered and asked    whether he believed he could manage that project without any    guidance.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rules for    conversion:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    reporting verb ‘sneered’ can be expanded to ‘sneered and    asked’ because the reported speech is an interrogative sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. For yes/no    questions, the conjunction ‘if’ or ‘whether’ is used, and    the interrogative structure changes to assertive.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Present    tense changes to past tense: ‘Do you believe’ becomes ‘he    believed’, and modal ‘can’ changes to ‘could’.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4.    Demonstrative pronoun/determiner ‘this’ changes to ‘that’.</p>    <p style=\"orphans:0;widows:0\">Hence, option A is the correct    answer.</p>", "question_heading": ""}, {"sr_no": 103, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Choose the option that contains the homonym of the highlighted    word in the given sentence.</p>    <p style=\"orphans:0;widows:0\">The hikers decided to pitch their    tents on the grassy <b>bank</b> of the stream to rest for the    night.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The soil on the river bank had become loose after days of    relentless downpours.</p>", "option2": " <p style=\"orphans:0;widows:0\">    He deposited his quarterly earnings into his commercial bank    account to earn interest.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Trees planted along the canal bank help prevent soil erosion    during flash floods.</p>", "option4": " <p style=\"orphans:0;widows:0\">    We sat near the steep bank of the lake, watching the birds catch    fish in the shallow water.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the given sentence, <b>bank</b> refers to the sloping land    alongside or bordering a body of water (a stream).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In options A,    C, and D, 'bank' is used in the same contextual sense (the    shore/edge of a river, canal, or lake).</p>    <p style=\"orphans:0;widows:0\">In option B, however, 'bank' is    used as a financial institution where money is kept, saved, or    invested. Because a homonym is a word that shares the same    spelling and pronunciation but carries a different meaning, option    B correctly features the homonym of the word.</p>", "question_heading": ""}, {"sr_no": 104, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct indirect form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">\"Open the gates    immediately,\" said the captain to the guards.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The captain requested the guards to open the gates immediately.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The captain ordered the guards to open the gates immediately.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The captain told the guards that open the gates immediately.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The captain ordered the guards that they should open the gates    immediately.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is an imperative sentence expressing a command    or order. In indirect speech:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    reporting verb 'said to' is changed to 'ordered' or 'commanded'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. The    imperative mood is converted into the infinitive form ('to' + base    verb, i.e., 'to open').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3.    Conjunction 'that' is not used to introduce the infinitive clause.</p>    <p style=\"orphans:0;widows:0\">Thus, the correct indirect form    is: <b>The captain ordered the guards to open the gates    immediately.</b></p>", "question_heading": ""}, {"sr_no": 105, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct active form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">A series of complex scientific    experiments was being conducted by the research team when the    power supply failed.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The research team conducted a series of complex scientific    experiments when the power supply failed.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The research team was conducting a series of complex scientific    experiments when the power supply failed.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The research team has been conducting a series of complex    scientific experiments when the power supply failed.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The research team had conducted a series of complex scientific    experiments when the power supply failed.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the passive voice of the past continuous    tense (<b>was being + V3</b>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The rule for    converting past continuous tense from passive to active voice is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive:    Object + was/were + being + V3 + by + Subject</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Active:    Subject + was/were + V-ing + Object</p>    <p style=\"orphans:0;widows:0\">Here, 'the research team' becomes    the subject and takes the singular auxiliary verb 'was' followed    by 'conducting'. Thus, the correct active form is given in option    B.</p>", "question_heading": ""}, {"sr_no": 106, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct direct form of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">He asked me if I would join him    for dinner.</p>", "option1": "<p style=\"orphans:0;widows:0\">    He said to me, \"Would you join him for dinner?\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    He said to me, \"Will you join me for dinner?\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    He said to me, \"Shall I join you for dinner?\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    He asked to me, \"Will you join me for dinner?\"</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the indirect sentence into direct speech, follow these    steps:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb 'asked' is changed back to 'said to' when followed by an    object ('asked to' is grammatically incorrect).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    conjunction 'if' is removed, and inverted word order (Auxiliary    verb + Subject + Main verb) is used for the interrogative sentence    inside inverted commas.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The modal    'would' changes back to 'will' corresponding to the second person    subject 'you'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The pronoun    'I' refers to the listener ('me'), so it becomes 'you'. The    pronoun 'him' refers to the speaker ('He'), so it changes to 'me'.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct direct    form is: <b>He said to me, \"Will you join me for dinner?\"</b></p>", "question_heading": ""}, {"sr_no": 107, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The following sentence has been divided into four parts.    Identify the part which contains a grammatical error. If there is    no error in the sentence, then select 'No Error'.</b></p>    <p style=\"orphans:0;widows:0\">The anxious parents (A)/ heaved a    deep (B)/ sigh for relief. (C)/ No Error (D)</p>", "option1": "<p style=\"orphans:0;widows:0\">    A</p>", "option2": " <p style=\"orphans:0;widows:0\">    B</p>", "option3": " <p style=\"orphans:0;widows:0\">    D</p>", "option4": " <p style=\"orphans:0;widows:0\">    C</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The error lies in part (C) of the sentence. The correct idiomatic    expression is 'a sigh of relief' (meaning a feeling of comfort or    reassurance when something frightening or worrying has ended), not    'a sigh for relief'. Therefore, the preposition 'for' should be    replaced with 'of'.</p>    <p style=\"orphans:0;widows:0\"><b>Correct sentence:</b> The    anxious parents heaved a deep sigh of relief.</p>", "question_heading": ""}, {"sr_no": 108, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct active form of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">Why was the final match postponed    by the authorities?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Why did the authorities postpone the final match?</p>", "option2": " <p style=\"orphans:0;widows:0\">    Why had the authorities postponed the final match?</p>", "option3": " <p style=\"orphans:0;widows:0\">    Why were the authorities postponing the final match?</p>", "option4": " <p style=\"orphans:0;widows:0\">    Why do the authorities postpone the final match?</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the passive voice in the simple past    interrogative form.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive    Structure: <i>Wh-word + was/were + object + V3 + by + subject?</i></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Active    Structure: <i>Wh-word + did + subject + V1 + object?</i></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Following    this rule, 'was postponed' changes to 'did ... postpone'.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct active    sentence is: <b>Why did the authorities postpone the final match?</b></p>", "question_heading": ""}, {"sr_no": 109, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Given below are four jumbled sentences. Select the option that    gives their correct order.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A.    Consequently, European monarchs invested heavily in domestic    research to discover the secret formula of the elusive material.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B. For    centuries, Chinese porcelain was one of the most coveted luxury    goods imported into Europe.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C. This    intense quest finally bore fruit in 1708 when German alchemist    Johann Friedrich Böttger successfully produced hard-paste    porcelain.</p>    <p style=\"orphans:0;widows:0\">D. Its delicate beauty and    exceptional durability made it so rare and expensive that it was    often referred to as 'white gold'.</p>", "option1": "<p style=\"orphans:0;widows:0\">    BDAC</p>", "option2": " <p style=\"orphans:0;widows:0\">    DABC</p>", "option3": " <p style=\"orphans:0;widows:0\">    BCAD</p>", "option4": " <p style=\"orphans:0;widows:0\">    DACB</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct logical order is <b>BDAC</b>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B</b>    introduces the main subject—Chinese porcelain and its high    demand in Europe—making it the ideal opening sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>D</b>    elaborates on the qualities of the porcelain mentioned in B ('Its    delicate beauty...'), explaining why it was called 'white gold'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A</b>    presents the result ('Consequently') of porcelain being rare and    expensive: European rulers funded research to discover how to make    it.</p>    <p style=\"orphans:0;widows:0\"><b>C</b> concludes the sequence    by describing the outcome of that effort ('This intense quest    finally bore fruit in 1708...').</p>", "question_heading": ""}, {"sr_no": 110, "question": "Rधोक पुध ूोौौोgध cोनधीिहिद ोnक ोnौथधन पुध तहधौपiयnौ giॅधn ृिधयथ. Aनपiीiciोि inपिधिigधncध (AI) iौ incनधोौingिद ुोiिधक ोौ ो पनोnौीयनंोपiॅध ीयनcध in ंयकधनn ुधोिपुcोनध, ूनयंiौing पय धnुोncध कiोgnयौपic ोccहनोcद, ौपनधोंिinध cिinicोि थयनाीियथौ, ोnक ोccिधधनोपध पुधनोूधहपic कiौcयॅधनद. Mोcुinध िधोनning ोिgयनiपुंौ, पनोinधक यn धसपधnौiॅध नधूयौiपयनiधौ यी ंधकicोि iंोging ोnक cिinicोि नधcयनकौ, cोn nयथ iकधnपiीद cयंूिधस ूोपुिययgiधौ ौहcु ोौ ंोिignोnप पहंयहनौ ोnक नधपinोि कiौयनकधनौ थiपु नधंोनाोृिध ूनधciौiयn. Hयथधॅधन, पुध inपधgनोपiयn यी cयंूहपोपiयnोि पयियस inपय cिinicोि ौधपपingौ iौ nयप ंधनिधद ो पधcुnicोि ोcुiधॅधंधnपे iप inपनयकहcधौ ूनयीयहnक धपुicोि, यूधनोपiयnोि, ोnक नधgिहोपयनद कiिधंंोौ. Hधोिपुcोनध ूनयीधौौiयnोिस ीनधतहधnिपद धncयहnपधन पुध ैृिोcा ृयसै ूुधnयंधnयn, थुधनधin पुध inपधनnोि नधोौयning यी कधधू nधहनोि nधपथयनो नधंोinौ यूोतहध, ूनधॅधnपing cिiniciोnौ ीनयं ीिहिद हnकधनौपोnकing ुयथ ौूधciीic नधcयंंधnकोपiयnौ ो =\"font-weight:bold\">• राज्य कोड: महाराष्ट्र के लिए 'MH'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">• जिला कोड: संबंधित जिले का 2 अंकों का कोड</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">• परमिट प्रकार: 'P' (यात्री वाहन), 'G' (मालवाहक वाहन), 'T' (पर्यटक वाहन)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">• श्रेणी कोड: वाहन की क्षमता दर्शाने वाली 3 अंकों की संख्या</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">• जारी वर्ष: जारी किए गए वर्ष के अंतिम दो अंक</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">• सत्यापन जांच: जिला कोड, श्रेणी कोड और जारी वर्ष के सभी अलग-अलग अंकों का 2 अंकों का योग</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">यदि महाराष्ट्र ('MH') के जिला 12 में वर्ष 2023 में श्रेणी कोड 458 वाले एक मालवाहक वाहन (Goods vehicle) को परमिट जारी किया गया था, तो इसका पूर्ण और वैध परमिट नंबर क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MH12G4582325</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MH12G4582323</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MH12P4582325</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MH12G4582025</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>वैध परमिट नंबर ज्ञात करने के लिए, दिए गए नियमों के अनुसार प्रत्येक घटक निर्धारित करें:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. राज्य कोड = MH</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. जिला कोड = 12</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. परमिट प्रकार = 'G' (मालवाहक वाहन के लिए)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. श्रेणी कोड = 458</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. जारी वर्ष = 2023 के अंतिम दो अंक = 23</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. सत्यापन जांच = जिला कोड (1, 2), श्रेणी कोड (4, 5, 8) और जारी वर्ष (2, 3) के सभी अलग-अलग अंकों का योग:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image001.png\" width=\"215\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सभी खंडों को क्रमबद्ध संयोजित करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MH + 12 + G + 458 + 23 + 25 = </span><span style=\"font-weight:bold\">MH12G4582325</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, सही विकल्प A है।</span></p>", "question_heading": ""}, {"sr_no": 122, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">किसी निश्चित तर्क के आधार पर 94, 77 से संबंधित है। उसी तर्क का अनुसरण करते हुए 82, 65 से संबंधित है। समान तर्क का अनुसरण करते हुए 63 निम्नलिखित में से किससे संबंधित है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(नोट: संख्याओं को उनके संघटक अंकों में विभाजित किए बिना, पूर्ण संख्याओं पर गणितीय संक्रियाएँ की जानी चाहिए। उदाहरण के लिए 13 - 13 पर विभिन्न संक्रियाएँ जैसे कि जोड़ना/घटाना/गुणा करना आदि किया जा सकता है। 13 को 1 और 3 में विभाजि pt;margin-bottom:0pt;font-size:12pt\"><span>'एनीमोमीटर - तापमान' को छोड़कर अन्य सभी युग्मों में, पहला शब्द एक वैज्ञानिक उपकरण है जिसका उपयोग दूसरे शब्द में दी गई भौतिक राशि या परिघटना को मापने या उसका पता लगाने के लिए किया जाता है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• बैरोमीटर का उपयोग वायुमंडलीय दाब मापने के लिए किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• एमीटर का उपयोग विद्युत धारा मापने के लिए किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• सिस्मोग्राफ का उपयोग भूकंप को रिकॉर्ड करने/मापने के लिए किया जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>जबकि, एनीमोमीटर का उपयोग पवन की गति मापने के लिए किया जाता है (तापमान को थर्मामीटर द्वारा मापा जाता है)। अतः, 'एनीमोमीटर - तापमान' इस समूह से संबंधित नहीं है।</span></p>", "question_heading": ""}, {"sr_no": 132, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कुछ व्यक्ति उत्तर दिशा के सम्मुख एक पंक्ति में बैठे हैं। 'B', 'A' के दाईं ओर से तीसरे स्थान पर बैठा है। 'D', 'A' के ठीक बाईं ओर बैठा है। 'E', 'D' के बाईं ओर से चौथे स्थान पर बैठा है। 'G', 'B' और 'H' दोनों का निकटतम पड़ोसी है, जहाँ 'H', 'G' के दाईं ओर बैठा है। 'H' किसी एक छोर पर बैठा है। 'C' किसी एक छोर पर बैठा है, तथा 'C' और 'E' के बीच केवल दो व्यक्ति बैठे हैं। यदि पंक्ति में कोई अन्य व्यक्ति नहीं बैठा है, तो बैठे हुए व्यक्तियों की कुल संख्या कितनी है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई जानकारी के अनुसार, बाएं से दाएं की ओर व्यक्तियों की स्थितियाँ निर्धारित करते हैं (सभी उत्तर के सम्मुख हैं):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 'D', 'A' के ठीक बाईं ओर है और 'B', 'A' के दाईं ओर तीसरे स्थान पर है: [D, A, _, _, B]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 'E', 'D' के बाईं ओर चौथे स्थान पर है: [E, _, _, _, D, A, _, _, B]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 'G', 'B' और 'H' दोनों का निकटतम पड़ोसी है तथा 'H', 'G' के दाईं ओर है: [E, _, _, _, D, A, _, _, B, G, H]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. चूँकि 'H' कई व्यक्तियों के दाईं ओर है और एक छोर पर बैठा है, अतः 'H' पंक्ति के अंतिम दाएं छोर पर होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. 'C' एक छोर पर बैठा है, इसलिए 'C' अंतिम बाएं छोर पर होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. 'C' और 'E' के बीच केवल दो व्यक्ति बैठे हैं: [C, _, _, E]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पूर्ण व्यवस्था इस प्रकार बनती है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">C _ _ E _ _ _ D A _ _ B G H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः पंक्ति में बैठे व्यक्तियों की कुल संख्या 14 है।</span></p>", "question_heading": ""}, {"sr_no": 133, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">L, P, E और A अक्षरों का उपयोग करके, प्रत्येक अक्षर को प्रत्येक शब्द में केवल एक बार प्रयोग करते हुए, कितने सार्थक चार अक्षर वाले अंग्रेजी शब्द बनाए जा सकते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option2": " <p style=\"margin-top:0pt;ma margin-bottom:0pt;font-size:12pt\"><span>VTHK</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यहाँ प्रयुक्त तर्क इस प्रकार है: प्रत्येक अक्षर को पहले अंग्रेजी वर्णमाला श्रृंखला में उसके विपरीत (reverse) अक्षर से प्रतिस्थापित किया जाता है, और फिर उनके स्थानीय मानों में क्रमशः </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image068.png\" width=\"118\" height=\"21\" alt style=\"vertical-align:middle\" ><span> की संक्रियाएं की जाती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">BGLQ : XVLN</span><span> के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• B का विपरीत Y है; </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image069.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (X)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• G का विपरीत T है; </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image070.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (V)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• L का विपरीत O है; </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image071.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (L)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Q का विपरीत J है; </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image072.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (N)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">DINS : VTJL</span><span> के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• D का विपरीत W है; </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image073.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (V)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• I का विपरीत R है; </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image074.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (T)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• N का विपरीत M है; </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image075.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (J)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• S का विपरीत H है; </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image076.png\" width=\"76\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (L)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उसी तर्क को </span><span style=\"font-weight:bold\">FKPU</span><span> पर लागू करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• F का विपरीत U है; </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image077.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (T)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• K का विपरीत P है; </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image078.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (R)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• P का विपरीत K है; </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image079.png\" width=\"76\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (H)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• U का विपरीत F है; </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image080.png\" width=\"76\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (J)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, FKPU का संबंध </span><span style=\"font-weight:bold\">TRHJ</span><span> से है।</span></p>", "question_heading": ""}, {"sr_no": 137, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">नीचे दिए गए प्रश्न में एक कथन और उसके बाद I और II से संख्यांकित दो कार्यवाहियाँ दी गई हैं। कथन में दी गई सभी बातों को सत्य मानते हुए, तय कीजिए कि सुझाई गई कार्यवाहियों में से कौन-सी कार्यवाही तार्किक रूप से अनुसरण करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कथन:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक प्रमुख सरकारी अस्पताल में औचक निरीक्षण से पता चला कि फार्मेसी के कुछ कर्मचारियों द्वारा कृत्रिम कमी पैदा करने और दवाओं को कालाबाजारी में बेचने के लिए जानबूझकर कई आवश्यक जीवनरक्षक दवाएं मरीजों को उपलब्ध नहीं कराई जा रही थीं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कार्यवाहियाँ:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. जब तक कि संपूर्ण ऑडिट पूरा न हो जाए, अस्पताल प्रशासन को फार्मेसी के सभी कार्यों और जीवनरक्षक दवाओं के वितरण को तत्काल निलंबित कर देना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. दोषी कर्मचारियों के विरुद्ध कानूनी और अनुशासनात्मक कार्यवाही शुरू की जानी चाहिए, साथ ही दवाओं के वितरण की निगरानी के लिए एक पारदर्शी बारकोड-आधारित रियल-टाइम ट्रैकिंग प्रणाली शुरू की जानी चाहिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल कार्यवाही I अनुसरण करती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल कार्यवाही II अनुसरण करती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कार्यवाही I और II दोनों अनुसरण करती हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो कार्यवाही I और न ही II अनुसरण करती है</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक उचित कार्यवाही को समस्या के मूल कारण को हल करना चाहिए तथा किसी अन्य गंभीर संकट को जन्म नहीं देना चाहिए और न ही अत्यधिक अतिवादी होना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">कार्यवाही I अनुसरण नहीं करती है:</span><span> फार्मेसी के सभी कार्यों और जीवनरक्षक दवाओं के वितरण को रोकने से अस्पताल में भर्ती मरीजों की जान को गंभीर खतरा पैदा हो जाएगा। यह एक अत्यंत अनुचित और घातक कदम है जो मौजूदा समस्या से भी बड़ा संकट पैदा कर देगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">कार्यवाही II अनुसरण करती है:</span><span> दोषी कर्मचारियों के खिलाफ अनुशासनात्मक और कानूनी कार्यवाही करना न्यायसंगत है और भविष्य के लिए एक सबक है। साथ ही, मरीजों की देखभाल को बाधित किए बिना रियल-टाइम बारकोड ट्रैकिंग प्रणाली स्थापित करने से कालाबाजारी की समस्या का दीर्घकालिक निवारण होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, केवल कार्यवाही II अनुसरण करती है।</span></p>", "question_heading": ""}, {"sr_no": 138, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">चार आकृति युग्म दिए गए हैं, जिनमें से तीन एक निश्चित तरीके से समान हैं और एक भिन्न है। उस आकृति युग्म का चयन कीजिए जो समूह से संबंधित नहीं है।</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image081.png\" width=\"280\" height=\"130\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image082.png\" width=\"280\" height=\"130\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image083.png\" width=\"280\" height=\"130\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image084.png\" width=\"280\" height=\"130\" alt ></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आकृति युग्म (A), (B) और (D) में, बाएँ वर्ग से दाएँ वर्ग में परिवर्तन एक निश्चित नियम का अनुसरण करता है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">शीर्ष-बायाँ (Top-Left) तत्व:</span><span> विकर्णतः </span><span style=\"font-weight:bold\">नीचे-दाएँ (Bottom-Right)</span><span> कोने में जाता है और </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image085.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> दक्षिणावर्त (clockwise)</span><span> घूम जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">नीचे-बायाँ (Bottom-Left) तत्व:</span><span> लंबवत ऊपर </span><span style=\"font-weight:bold\">शीर्ष-बाएँ (Top-Left)</span><span> कोने में जाता है और इसकी दिशा अपरिवर्तित रहती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">नीचे-दायाँ (Bottom-Right) तत्व:</span><span> लंबवत ऊपर </span><span style=\"font-weight:bold\">शीर्ष-दाएँ (Top-Right)</span><span> कोने में जाता है और </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image086.png\" width=\"34\" height=\"21\" alt style=\"vertical-align:middle\" ><span> उल्टा (inverted) हो जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>युग्म (C) में:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शीर्ष-बाएँ कोने पर स्थित तीर दाईं ओर (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image087.png\" width=\"14\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) इंगित कर रहा है। इसे </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image085.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> दक्षिणावर्त घुमाने पर नीचे-दाएँ कोने में नीचे की ओर (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image088.png\" width=\"8\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) इंगित करना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>परंतु युग्म (C) में तीर ऊपर की ओर (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image089.png\" width=\"8\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) इंगित कर रहा है, जो कि </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image085.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> वामावर्त (counter-clockwise) घूर्णन है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, आकृति युग्म </span><span style=\"font-weight:bold\">(C)</span><span> समूह से संबंधित नहीं है।</span></p>", "question_heading": ""}, {"sr_no": 139, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">नीचे दो कथन, I और II दिए गए हैं। ये कथन या तो स्वतंत्र कारण हो सकते हैं या स्वतंत्र कारणों अथवा किसी सामान्य कारण के प्रभाव हो सकते हैं। इनमें से एक कथन दूसरे कथन का प्रभाव भी हो सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. रेलवे ट्रैक के जलमग्न होने और ओवरहेड बिजली के तार उखड़ने के कारण तटीय रेल मार्ग पर ट्रेनों का परिचालन स्थगित कर दिया गया।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. जिला प्रशासन ने निचले तटीय गांवों से हजारों परिवारों को निकालकर अस्थायी चक्रवात राहत केंद्रों में स्थानांतरित किया।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">दोनों कथनों को पढ़िए और सही विकल्प का चयन कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I कारण है और कथन II इसका प्रभाव है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन II कारण है और कथन I इसका प्रभाव है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों स्वतंत्र कारण हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों एक सामान्य कारण के प्रभाव हैं</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोनों में से कोई भी कथन सीधे दूसरे का कारण नहीं है: रेल सेवाओं के निलंबन से तटीय गांवों से लोगों का विस्थापन नहीं हुआ, और न ही विस्थापन के कारण रेलवे ट्रैक जलमग्न हुए या बिजली के खंभे उखड़े। दोनों घटनाएँ तटीय क्षेत्र में आए एक भीषण चक्रवाती तूफान या भारी बारिश (एक सामान्य कारण) के प्रत्यक्ष परिणाम/प्रभाव हैं। अतः, कथन I और II दोनों एक सामान्य कारण के प्रभाव हैं।</span></p>", "question_heading": ""}, {"sr_no": 140, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">दिए गए कथनों और निष्कर्षों को ध्यानपूर्वक पढ़िए। यह मानते हुए कि कथनों में दी गई जानकारी सत्य है, भले ही वह सामान्यतः ज्ञात तथ्यों से भिन्न प्रतीत होती हो, तय कीजिए कि दिए गए निष्कर्षों में से कौन-सा/से निष्कर्ष तार्किक रूप से कथनों का अनुसरण करता है/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कथन:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कुछ अंगूठियाँ, कंगन हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">सभी कंगन, हार हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कोई भी हार, झुमका नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कुछ झुमके, लॉकेट हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. कुछ अंगूठियाँ, झुमके नहीं हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. कोई भी लॉकेट, कंगन नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">III. कुछ लॉकेट, हार नहीं हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष I अनुसरण करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष I और II अनुसरण करते हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष I और III अनुसरण करते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सभी निष्कर्ष I, II और III अनुसरण करते हैं</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए कथनों के अनुसार:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794680247627_image090.png\" width=\"364\" height=\"106\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. चूँकि कोई भी हार झुमका नहीं है, इसलिए अंगूठियों का वह हिस्सा कभी झुमका नहीं हो सकता। अतः, </span><span style=\"font-weight:bold\">निष्कर्ष I (कुछ अंगूठियाँ, झुमके नहीं हैं) तार्किक रूप से अनुसरण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. लॉकेट केवल झुमके से संबंधित हैं, लेकिन लॉकेट का शेष भाग कंगन हो भी सकता है। अतः, </span><span style=\"font-weight:bold\">निष्कर्ष II (कोई भी लॉकेट, कंगन नहीं है) अनुसरण नहीं करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. लॉकेट का वह हिस्सा जो झुमका है, वह कभी हार नहीं हो सकता। अतः, </span><span style=\"font-weight:bold\">निष्कर्ष III (कुछ लॉकेट, हार नहीं हैं) तार्किक रूप से अनुसरण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, केवल निष्कर्ष I और III अनुसरण करते हैं।</span></p>", "question_heading": ""}, {"sr_no": 141, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक निश्चित कूट भाषा में, ‘TRAIN’ को ‘48129’, ‘STARE’ को ‘72861’, ‘ROAST’ को ‘31827’ और ‘STONE’ को ‘89376’ के रूप में कूटबद्ध किया जाता है। उस भाषा में ‘I’ के लिए कूट क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘TRAIN’ (48129) और ‘STARE’ (72861) की तुलना करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उभयनिष्ठ (कॉमन) अक्षर T, R, A हैं और उभयनिष्ठ अंक 1, 2, 8 हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, {T, R, A} = {1, 2, 8} है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>‘TRAIN’ में शेष अक्षर {I, N} शेष अंकों {4, 9} के संगत हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अब ‘STONE’ (89376) को देखने पर: इसमें अक्षर ‘N’ है लेकिन ‘I’ नहीं है। ‘STONE’ के अंकों में 9 उपस्थित है जबकि 4 नहीं है। अतः, ‘N’ का कूट 9 है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चूँकि {I, N} = {4, 9} और N = 9 है, इसलिए ‘I’ का कूट 4 होगा।</span></p>", "question_heading": ""}, {"sr_no": 142, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">दिए गए मानदंडों और उम्मीदवार के विवरण को ध्यानपूर्वक पढ़ें और दिए गए नियमों के आधार पर उचित कार्रवाई निर्धारित करें।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">सहायक वित्त प्रबंधक (Assistant Finance Manager) पद के लिए पात्रता मानदंड (01-11-2024 को):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">1. न्यूनतम 60% अंकों के साथ वित्त (Finance) में MBA या वाणिज्य (Commerce) में स्नातकोत्तर डिग्री होनी चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">2. 01-11-2024 को आयु 25 से 32 वर्ष के बीच होनी चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">3. लिखित चयन परीक्षा में कम से कम 65% अंक और व्यक्तिगत साक्षात्कार में कम से कम 50% अंक प्राप्त किए होने चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">4. किसी वित्तीय संस्थान में योग्यता के बाद का कम से कम 2 वर्ष का प्रासंगिक कार्य अनुभव होना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">अपवाद:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(a) ऐसा उम्मीदवार जो उपरोक्त (1) को छोड़कर अन्य सभी मानदंडों को पूरा करता है, लेकिन उसने CA/CFA प्रमाणीकरण पूरा किया है, तो उसका मामला कार्यकारी निदेशक (Executive Director) को भेजा जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(b) ऐसा उम्मीदवार जो उपरोक्त (4) को छोड़कर अन्य सभी मानदंडों को पूरा करता है, लेकिन लिखित परीक्षा में कम से कम 75% अंक प्राप्त किए हैं, तो उसे वित्त प्रशिक्षु (Finance Trainee) के रूप में नियुक्त किया जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">उम्मीदवार का विवरण:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">अनन्या का जन्म 14 अगस्त 1996 को हुआ था। उसने 58% अंकों के साथ वित्त में MBA पूरा किया है और वह एक प्रमाणित चार्टर्ड अकाउंटेंट (CA) है। उसने लिखित परीक्षा में 78% अंक और व्यक्तिगत साक्षात्कार में 62% अंक प्राप्त किए हैं। वह पिछले 3 वर्षों से एक अनुसूचित वाणिज्यिक बैंक में कार्यरत है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">अनन्या के मामले में क्या निर्णय लिया जाना चाहिए?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उम्मीदवार का चयन सहायक वित्त प्रबंधक के रूप में किया जाना है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उम्मीदवार का चयन नहीं किया जाना है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मामला कार्यकारी निदेशक को भेजा जाना है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उम्मीदवार को वित्त प्रशिक्षु के रूप में नियुक्त किया जाना है।</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आइए 01-11-2024 के अनुसार प्रत्येक मानदंड के आधार पर अनन्या के विवरण का मूल्यांकन करें:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">शैक्षणिक योग्यता:</span><span> उसके पास 58% अंकों के साथ वित्त में MBA है, जो आवश्यक 60% से कम है। अतः मानदंड (1) सीधे तौर पर पूरा नहीं होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">आयु:</span><span> 14-08-1996 को जन्मी, 01-11-2024 को उसकी आयु 28 वर्ष लगभग 2.5 महीने है, जो 25 से 32 वर्ष के बीच है। अतः मानदंड (2) पूरा होता है।</span></p>
