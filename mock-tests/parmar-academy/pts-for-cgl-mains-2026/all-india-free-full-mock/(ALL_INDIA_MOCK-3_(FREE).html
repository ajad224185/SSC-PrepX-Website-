ont-weight:bold\">In the question below, a statement is given followed by two courses of action numbered I and II. Assuming everything in the statement to be true, decide which of the suggested courses of action logically follow(s) for pursuing.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statement:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A surprise audit at a premier government hospital revealed that several essential life-saving drugs were deliberately withheld from patients by certain pharmacy staff members to artificially trigger shortages and divert the stock to the black market.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Courses of Action:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. The hospital administration should immediately suspend all pharmacy operations and the distribution of life-saving drugs until the complete audit is concluded.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. Legal and disciplinary proceedings should be initiated against the errant staff, while a transparent barcode-based real-time tracking system is introduced for monitoring medicine dispensation.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only course of action I follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only course of action II follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both courses of action I and II follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither course of action I nor II follows</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>An ideal course of action must address the root cause of the problem without creating a more severe crisis or overreacting disproportionately.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">Course I does not follow:</span><span> Halting all pharmacy operations and stopping the supply of critical life-saving medications would severely endanger patients' lives in the hospital. This constitutes an extreme and dangerous measure that creates a bigger problem than the one it seeks to solve.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">Course II follows:</span><span> Taking strict legal and disciplinary action directly punishes the guilty employees and acts as a deterrent. Furthermore, introducing a transparent digital tracking system ensures long-term accountability and prevents diversion of stock without disrupting critical patient care.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, only course of action II follows.</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Four figure pairs are given, out of which three are alike in a certain way and one is different. Select the figure pair that does not belong to the group.</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image077.png\" width=\"280\" height=\"130\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image078.png\" width=\"280\" height=\"130\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image079.png\" width=\"280\" height=\"130\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image080.png\" width=\"280\" height=\"130\" alt ></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In figure pairs (A), (B), and (D), the transformation from the left square to the right square follows a consistent rule:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Top-Left element:</span><span> Moves diagonally to the </span><span style=\"font-weight:bold\">Bottom-Right</span><span> corner and rotates </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image081.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> clockwise</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Bottom-Left element:</span><span> Moves vertically up to the </span><span style=\"font-weight:bold\">Top-Left</span><span> corner with its orientation unchanged.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Bottom-Right element:</span><span> Moves vertically up to the </span><span style=\"font-weight:bold\">Top-Right</span><span> corner and inverts (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image082.png\" width=\"34\" height=\"21\" alt style=\"vertical-align:middle\" ><span> rotation).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In pair (C):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The element at the top-left is an arrow pointing right (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image083.png\" width=\"14\" height=\"21\" alt style=\"vertical-align:middle\" ><span>). Rotating it </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image081.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> clockwise should result in an arrow pointing downwards (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image084.png\" width=\"8\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) at the bottom-right corner.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>However, in pair (C), the arrow points upwards (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image085.png\" width=\"8\" height=\"21\" alt style=\"vertical-align:middle\" ><span>), which is a </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image081.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> counter-clockwise rotation.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, figure pair </span><span style=\"font-weight:bold\">(C)</span><span> does not belong to the group.</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Two statements, I and II, are given below. These statements may be either independent causes or effects of independent causes or a common cause. One of the statements may be the effect of the other statement.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. Train operations along the coastal rail corridor were suspended due to track submergence and uprooted overhead electric cables.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. The district administration evacuated thousands of families from low-lying coastal hamlets to temporary cyclone relief centres.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Read both statements and select the correct option.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement I is the cause and Statement II is its effect</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement II is the cause and Statement I is its effect</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both statements I and II are independent causes</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both statements I and II are effects of a common cause</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither statement directly causes the other: the suspension of rail services did not cause the evacuation of coastal villages, nor did the evacuation lead to railway tracks getting submerged and electric poles being uprooted. Both events are immediate consequences/effects of a common cause — a severe cyclonic storm or severe torrential rainfall hitting the coastal region. Therefore, both statements I and II are effects of a common cause.</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Read the given statements and conclusions carefully. Assuming that the information given in the statements is true, even if it appears to be at variance with commonly known facts, decide which of the given conclusions logically follow(s) from the statements.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Some rings are bracelets.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">All bracelets are necklaces.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">No necklace is an earring.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Some earrings are pendants.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. Some rings are not earrings.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. No pendant is a bracelet.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">III. Some pendants are not necklaces.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion I follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusions I and II follow</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusions I and III follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>All conclusions I, II and III follow</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image086.png\" width=\"364\" height=\"106\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Since no necklace is an earring, those rings that are necklaces can never be earrings. Hence, </span><span style=\"font-weight:bold\">Conclusion I (Some rings are not earrings) logically follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Pendants only overlap with earrings, but the remaining part of pendants can overlap with necklaces or bracelets. Hence, </span><span style=\"font-weight:bold\">Conclusion II (No pendant is a bracelet) does not follow.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. The portion of pendants that are earrings can never be necklaces. Hence, </span><span style=\"font-weight:bold\">Conclusion III (Some pendants are not necklaces) logically follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, only conclusions I and III follow.</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a certain code language, ‘TRAIN’ is coded as ‘48129’, ‘STARE’ is coded as ‘72861’, ‘ROAST’ is coded as ‘31827’, and ‘STONE’ is coded as ‘89376’. What is the code for ‘I’ in that language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Comparing ‘TRAIN’ (48129) and ‘STARE’ (72861):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Common letters are T, R, A and common digits are 1, 2, 8.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, {T, R, A} = {1, 2, 8}.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In ‘TRAIN’, the remaining letters {I, N} must correspond to the remaining digits {4, 9}.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Now looking at ‘STONE’ (89376): it contains the letter ‘N’ but does not contain ‘I’. Among the digits of ‘STONE’, the digit 9 is present while 4 is not. Hence, ‘N’ is coded as 9.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since {I, N} = {4, 9} and N = 9, the code for ‘I’ must be 4.</span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Read the criteria and the candidate's profile carefully, and determine the appropriate course of action based on the given rules.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Eligibility Criteria for the post of Assistant Finance Manager (as of 01-11-2024):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">1. Must hold an MBA in Finance or a Master's degree in Commerce with at least 60% marks.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">2. Must be between 25 and 32 years of age as of 01-11-2024.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">3. Must have secured at least 65% marks in the written selection test and at least 50% marks in the personal interview.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">4. Must possess at least 2 years of relevant post-qualification work experience in a financial institution.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Exceptions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(a) A candidate who satisfies all other criteria except (1) above, but has completed CA/CFA certification, is to be referred to the Executive Director.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(b) A candidate who satisfies all other criteria except (4) above, but has secured at least 75% marks in the written test, is to be appointed as a Finance Trainee.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Candidate's Profile:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Ananya was born on 14th August 1996. She completed her MBA in Finance with 58% marks and is a certified Chartered Accountant (CA). She scored 78% marks in the written test and 62% marks in the personal interview. She has been working in a scheduled commercial bank for the past 3 years.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">What action should be taken in Ananya's case?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The candidate is to be selected as Assistant Finance Manager.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The candidate is not to be selected.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The case is to be referred to the Executive Director.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The candidate is to be appointed as a Finance Trainee.</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let us evaluate Ananya's profile against each criterion as of 01-11-2024:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">Academic Qualification:</span><span> She has an MBA in Finance with 58% marks, which is less than the required 60%. Hence, criterion (1) is not fulfilled directly.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">Age:</span><span> Born on 14-08-1996, her age as of 01-11-2024 is 28 years and ~2.5 months, which lies between 25 and 32 years. Hence, criterion (2) is fulfilled.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span style=\"font-weight:bold\">Test &amp; Interview Scores:</span><span> She scored 78% in the written test (required: minimum 65%) and 62% in the interview (required: minimum 50%). Hence, criterion (3) is fulfilled.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. </span><span style=\"font-weight:bold\">Experience:</span><span> She has 3 years of relevant experience in a bank (required: minimum 2 years). Hence, criterion (4) is fulfilled.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since Ananya satisfies all criteria except criterion (1), but holds a CA certification, she qualifies under exception (a). Therefore, her case must be referred to the Executive Director.</span></p>", "question_heading": ""}, {"sr_no": 98, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A mixture contains alcohol and water in the ratio </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image087.png\" width=\"24\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">. If 18 litres of water is added to the mixture, the ratio of alcohol to water becomes </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image088.png\" width=\"24\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">. What was the initial quantity of alcohol in the mixture?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40 litres</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>48 litres</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>56 litres</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>64 litres</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the initial quantities of alcohol and water be </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image089.png\" width=\"18\" height=\"21\" alt style=\"vertical-align:middle\" ><span> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image090.png\" width=\"18\" height=\"21\" alt style=\"vertical-align:middle\" ><span> litres, respectively.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>When 18 litres of water is added, the new quantity of water becomes </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image091.png\" width=\"55\" height=\"21\" alt style=\"vertical-align:middle\" ><span> litres.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>According to the given condition:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image092.png\" width=\"64\" height=\"29\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image093.png\" width=\"138\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image094.png\" width=\"124\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image095.png\" width=\"79\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image096.png\" width=\"53\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the initial quantity of alcohol = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image097.png\" width=\"114\" height=\"21\" alt style=\"vertical-align:middle\" ><span> litres.</span></p>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Question: Among five friends — K, L, M, N, and O, each having a different age, who is the youngest?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. L is younger than only K and M.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. N is older than O.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only Statement I is sufficient</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only Statement II is sufficient</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both Statements I and II together are sufficient</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither Statement I nor Statement II is sufficient</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">From Statement I:</span><span> L is younger than only K and M. This means only two people (K and M) are older than L, so the other two friends (N and O) must be younger than L. Thus, the order is: (K, M) &gt; L &gt; (N, O). However, it is not clear whether N is younger or O is younger. Hence, Statement I alone is not sufficient.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">From Statement II:</span><span> N is older than O (N &gt; O). This gives no information about K, L, and M. Hence, Statement II alone is not sufficient.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Combining Statements I and II:</span><span> We know that (K, M) &gt; L &gt; (N, O), and since N &gt; O, the full order from oldest to youngest is (K, M) &gt; L &gt; N &gt; O. Therefore, O is definitively the youngest.</span><span style=\"font-weight:bold\"> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Thus, both statements I and II together are sufficient to answer the question.</span></p>", "question_heading": ""}, {"sr_no": 100, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Rohan forgot his 6-character flight booking reference (PNR). He and his travel agent try to recall it based on the following clues: Both agree that the PNR starts with the letters 'AI'. The agent recalls that the third character is an odd digit strictly greater than 5. Rohan remembers that the fourth character is one of the consonants among P, R, or T. The agent confirms that the last two characters form a two-digit number that is a perfect square strictly greater than 40. Rohan distinctly remembers that the third character is not 9, and the fourth character is not P. Which of the following can be Rohan's correct booking reference (PNR)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>AI 9 T 64</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>AI 7 R 64</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>AI 7 P 81</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>AI 5 T 49</span></p>", "answer": "2", "negative_marking": "1", s/1794679357575_image099.png\" width=\"94\" height=\"21\" alt style=\"vertical-align:middle\" ><span>). </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, AI 7 R 64 is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 101, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Ananya starts walking from her office. She walks 7 km towards the South. Then, she takes a left turn and walks 15 km. From there, she turns left and walks 19 km. Finally, she takes a left turn and walks 10 km to reach her house. What is the shortest distance between her office and her house?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>17 km</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13 km</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15 km</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 km</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the office be at the origin </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image100.png\" width=\"35\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Walking 7 km South brings her to </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image101.png\" width=\"54\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Turning left (East) and walking 15 km brings her to </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/17946793 e=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The sports played by P (Hockey), S (Tennis), and T (Cricket) are fixed. The remaining sports are Football and Badminton for Q and R.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since R does not play Football, R must play Badminton, and Q plays Football.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, R plays Badminton.</span></p>", "question_heading": ""}, {"sr_no": 103, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Direction: Answer the question based on the information given below:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'P &amp; Q' means 'P is neither smaller than nor equal to Q'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'P @ Q' means 'P is neither greater than nor smaller than Q'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'P # Q' means 'P is not smaller than Q'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'P $ Q' means 'P is not greater than Q'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'P % Q' means 'P is neither greater than nor equal to Q'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Assuming the given statements to be true, find which of the conclusion(s) is/are definitely true.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-ali an energy    alternatives.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Clean energy frameworks have remained rigidly segregated without    technological overlap.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage details the individual characteristics and career    roles of solar, wind, and hydroelectric energy, and concludes by    emphasizing that contemporary systems increasingly rely on hybrid    infrastructure to maintain grid reliability, blurring historical    boundaries between them. Thus, option B accurately captures the    main idea.</p>", "question_heading": ""}, {"sr_no": 111, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate word to fill in the blank and complete    the collocation.</p>    <p style=\"orphans:0;widows:0\">The audit team was assigned to    ______ the discrepancies between the two financial reports.</p>", "option1": "<p style=\"orphans:0;widows:0\">    reconcile</p>", "option2": " <p style=\"orphans:0;widows:0\">    reciprocate</p>", "option3": " <p style=\"orphans:0;widows:0\">    recuperate</p>", "option4": " <p style=\"orphans:0;widows:0\">    renounce</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct word is <b>reconcile</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Explanation:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Reconcile</b>    means to find a way in which two opposing statements, figures, or    facts can agree or exist together, or to explain inconsistencies    (especially in accounting and auditing). The phrase 'reconcile the    discrepancies' is a standard and formal collocation.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Reciprocate</b>    means to respond to a gesture or action by making a corresponding    one.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Recuperate</b>    means to recover from illness, exhaustion, or loss.</p>    <p style=\"orphans:0;widows:0\"><b>Renounce</b> means to formally    give up or abandon a claim, belief, or right.</p>", "question_heading": ""}, {"sr_no": 112, "question": "Rधोननोngध पुध ूोनपौ यी पुध ौधnपधncध in पुध cयननधcप यनकधन. Dधौूiपध पुध नोूiक धसूोnौiयn यी नधnधथोृिध धnधनgद inीनोौपनहcपहनध, P. ोnक नोiौing कयहृपौ ोृयहप थुधपुधन gियृोि cिiंोपध पोनgधपौ थiिि ृध ंधप Q. ंोnद कधॅिधयूing nोपiयnौ cयnपinहध पय निधद ुधोॅiिद यn ीयौौiि ीहिधस, R. िधोकing पय ौigniीicोnप किधोदौ in पुधiन कधcोनृयniौोपiयn gयोिस S. ोौ ौहनging inकहौपनiोि कधंोnक यहपूोcधौ ोककiपiयnौ पय gनधधn धnधनgद gनiकौ,", "option1": "<p style=\"orphans:0;widows:0\">    SQRP</p>", "option2": " <p style=\"orphans:0;widows:0\">    QSRP</p>", "option3": " <p style=\"orphans:0;widows:0\">    QPRS</p>", "option4": " <p style=\"orphans:0;widows:0\">    RSQP</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The introductory clause 'Despite the rapid expansion of renewable    energy infrastructure,' sets up a contrast and must be followed by    a main clause containing a subject and finite verb. Part <b>Q</b>    ('many developing nations continue to rely heavily on fossil    fuels,') logically and grammatically provides this subject and    verb. Next, Part <b>S</b> ('as surging industrial demand    outpaces...') explains the reason for this continuing reliance.    Part <b>R</b> ('leading to significant delays in their    decarbonisation goals') describes the resulting consequence of    this reliance. Finally, Part <b>P</b> ('and raising doubts...')    connects to R using the conjunction 'and', presenting a parallel    participle phrase ('leading to... and raising doubts...'). Thus,    the coherent and grammatically correct sequence is <b>QSRP</b>.</p>", "question_heading": ""}, {"sr_no": 113, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate phrasal verb to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">The committee decided to ________    the outdated rules in order to streamline the admission process.</p>", "option1": "<p style=\"orphans:0;widows:0\">    do down</p>", "option2": " <p style=\"orphans:0;widows:0\">    do away with</p>", "option3": " <p style=\"orphans:0;widows:0\">    do up</p>", "option4": " <p style=\"orphans:0;widows:0\">    do for</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct phrasal verb is <b>do away with</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meaning of    the phrasal verbs:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>do away    with:</b> to abolish, get rid of, or eliminate something (e.g.,    rules, laws, or practices).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>do down:</b>    to criticize or speak ill of someone unfairly.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>do up:</b>    to fasten something (like a coat) or to renovate/decorate a    building or room.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>do for:</b>    to ruin, defeat, or destroy something/someone.</p>    <p style=\"orphans:0;widows:0\">Since the sentence refers to    eliminating or abolishing \"outdated rules,\" <b>do away    with</b> is the contextually appropriate choice.</p>", "question_heading": ""}, {"sr_no": 114, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Rearrange the parts of the sentence in the correct order.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    integration of modern technology</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">P. into    traditional educational systems</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Q. has    significantly improved student engagement,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R. preparing    them for future career challenges</p>    <p style=\"orphans:0;widows:0\">S. by promoting interactive and    personalized learning methods,</p>", "option1": "<p style=\"orphans:0;widows:0\">    PQSR</p>", "option2": " <p style=\"orphans:0;widows:0\">    QPSR</p>", "option3": " <p style=\"orphans:0;widows:0\">    PRSQ</p>", "option4": " <p style=\"orphans:0;widows:0\">    SPRQ</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct order is <b>PQSR</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>P</b> must    directly follow the given opening phrase because the prepositional    complement of 'integration' is 'into' (i.e., 'The integration of    modern technology into traditional educational systems'). This    completes the subject noun phrase.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Q</b>    provides the main finite verb phrase ('has significantly improved    student engagement') required by the subject.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>S</b> acts    as an adverbial phrase of manner explaining how engagement is    improved ('by promoting interactive and personalized learning    methods').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>R</b>    functions as a concluding participial clause showing the resulting    outcome ('preparing them for future career challenges').</p>    <p style=\"orphans:0;widows:0\">Hence, the meaningful and    grammatically correct sequence is <b>PQSR</b>.</p>", "question_heading": ""}, {"sr_no": 115, "question": " <p style=\"orphans:0;widows:0\">    Select the option that best expresses the meaning of the given    idiom: \"A bolt from the blue\".</p>", "option1": "<p style=\"orphans:0;widows:0\">    A sudden and completely unexpected event</p>", "option2": " <p style=\"orphans:0;widows:0\">    A period of continuous good fortune</p>", "option3": " <p style=\"orphans:0;widows:0\">    A planned and well-prepared event</p>", "option4": " <p style=\"orphans:0;widows:0\">    A thunderstorm with heavy rain</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The idiom \"a bolt from the blue\" refers to something    important or unusual that happens suddenly and completely    unexpectedly, like a flash of lightning from a clear blue sky.    Therefore, option 1 is the correct answer.</p>", "question_heading": ""}, {"sr_no": 116, "question": " <p style=\"orphans:0;widows:0\">    Which of the following options is NOT one of the meanings of the    homonym 'sound'?</p>", "option1": "<p style=\"orphans:0;widows:0\">    In good condition, healthy, or showing good judgment</p>", "option2": " <p style=\"orphans:0;widows:0\">    A narrow stretch of water connecting two larger bodies of water</p>", "option3": " <p style=\"orphans:0;widows:0\">    Vibrations that travel through the air and can be heard</p>", "option4": " <p style=\"orphans:0;widows:0\">    Fragile and easily broken under slight pressure</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The word 'sound' has multiple homonymic meanings: as a noun, it    refers to vibrations perceived by the ear or a geographical    feature (a narrow ocean channel or stretch of water connecting two    bodies of water); as an adjective, it means in good condition,    healthy, reliable, or showing good judgment (e.g., 'sound advice',    'sound health'). It never means 'fragile and easily broken under    slight pressure', which is actually the opposite of its adjectival    sense.</p>", "question_heading": ""}, {"sr_no": 117, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Which of the given options arranges the following sentences in    the most logical sequence to form a meaningful paragraph?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">While    behaviorists argued that language is learned through imitation and    reinforcement, nativists posited an innate biological capacity.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The study of    how humans acquire language has long fascinated cognitive    scientists and linguists.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">This ongoing    debate has shaped modern theories, blending cognitive, social, and    biological perspectives.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Central to    this inquiry is the question of whether language ability is an    innate human trait or an acquired skill.</p>    <p style=\"orphans:0;widows:0\">In particular, Noam Chomsky    proposed the concept of a Universal Grammar shared by all human    minds.</p>", "option1": "<p style=\"orphans:0;widows:0\">    2-4-1-5-3</p>", "option2": " <p style=\"orphans:0;widows:0\">    4-2-1-3-5</p>", "option3": " <p style=\"orphans:0;widows:0\">    2-1-4-5-3</p>", "option4": " <p style=\"orphans:0;widows:0\">    4-1-5-2-3</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct logical sequence is <b>2-4-1-5-3</b>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sentence 2</b>    introduces the overarching subject—how humans acquire language    and its interest to cognitive scientists and linguists.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sentence 4</b>    follows directly by stating the central dilemma of \"this    inquiry\" (innate trait vs. acquired skill).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sentence 1</b>    explains the two opposing camps addressing that dilemma    (behaviorists vs. nativists).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sentence 5</b>    provides a specific example/advancement of the nativist view    mentioned in sentence 1 (Chomsky's Universal Grammar).</p>    <p style=\"orphans:0;widows:0\"><b>Sentence 3</b> logically    concludes the paragraph by reflecting on how this entire debate    has shaped modern theories.</p>", "question_heading": ""}, {"sr_no": 118, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate synonym of the given word: <b>PERFIDIOUS</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Faithful</p>", "option2": " <p style=\"orphans:0;widows:0\">    Treacherous</p>", "option3": " <p style=\"orphans:0;widows:0\">    Reliable</p>", "option4": " <p style=\"orphans:0;widows:0\">    Honest</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>PERFIDIOUS</b> means deceitful, disloyal, and    untrustworthy. Therefore, its most appropriate synonym is    <b>Treacherous</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Faithful</b>:    Loyal, constant, and steadfast (antonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Reliable</b>:    Consistently good in quality or performance; trustworthy    (antonym).</p>    <p style=\"orphans:0;widows:0\">- <b>Honest</b>: Free of deceit;    truthful and sincere (antonym).</p>", "question_heading": ""}, {"sr_no": 119, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate antonym of the given word. <b>Benevolence</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Compassion</p>", "option2": " <p style=\"orphans:0;widows:0\">    Kindness</p>", "option3": " <p style=\"orphans:0;widows:0\">    Malevolence</p>", "option4": " <p style=\"orphans:0;widows:0\">    Generosity</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>Benevolence</b> refers to the quality of being    well-meaning, kind, or charitable.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Malevolence</b>    refers to having or showing a wish to do evil to others (ill will    or malice), making it the most appropriate antonym.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Compassion:</b>    sympathetic pity and concern for others (synonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Kindness:</b>    the quality of being friendly, generous, and considerate    (synonym).</p>    <p style=\"orphans:0;widows:0\"><b>Generosity:</b> the quality of    being kind and giving (synonym).</p>", "question_heading": ""}, {"sr_no": 120, "question": " <p style=\"orphans:0;widows:0\">    Select the <b>correct spelling</b> of the word that means    'incapable of being corrected or reformed'.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Incorigible</p>", "option2": " <p style=\"orphans:0;widows:0\">    Incorrigible</p>", "option3": " <p style=\"orphans:0;widows:0\">    Incorrigable</p>", "option4": " <p style=\"orphans:0;widows:0\">    Incurrigible</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The correctly spelt word is <b>Incorrigible</b>. It is an    adjective that refers to a person or their behaviour not being    able to be changed, improved, or reformed.</p>", "question_heading": ""}, {"sr_no": 121, "question": " <p style=\"orphans:0;widows:0\">    Identify the <b>misspelt</b> word.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Resuscitate</p>", "option2": " <p style=\"orphans:0;widows:0\">    Iridescent</p>", "option3": " <p style=\"orphans:0;widows:0\">    Acquiesence</p>", "option4": " <p style=\"orphans:0;widows:0\">    Pseudonym</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The incorrectly spelt word is 'Acquiesence'. The correct spelling    is <b>Acquiescence</b>, which means the reluctant acceptance of    something without protest.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other words:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Resuscitate:</b>    to revive someone from unconsciousness or apparent death.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Iridescent:</b>    showing luminous colours that seem to change when seen from    different angles.</p>    <p style=\"orphans:0;widows:0\"><b>Pseudonym:</b> a fictitious    name, especially one used by an author.</p>", "question_heading": ""}, {"sr_no": 122, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to substitute the underlined    segment in the given sentence.</p>    <p style=\"orphans:0;widows:0\">Deepak <u><b>told that he will    finish</b></u> the project on time.</p>", "option1": "<p style=\"orphans:0;widows:0\">    said that he will finish</p>", "option2": " <p style=\"orphans:0;widows:0\">    told that he would finish</p>", "option3": " <p style=\"orphans:0;widows:0\">    said that he would finish</p>", "option4": " <p style=\"orphans:0;widows:0\">    said that he would finished</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    'Said' is used when no indirect personal object is mentioned    (e.g., 'said that...'), whereas 'told' requires an object (e.g.,    'told someone that...'). Additionally, since the reporting verb is    in the past tense, the modal 'will' changes to 'would' in reported    speech, followed by the base form of the verb ('finish').    Therefore, 'said that he would finish' is the correct replacement.</p>", "question_heading": ""}, {"sr_no": 123, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate antonym of the underlined word.</p>    <p style=\"orphans:0;widows:0\">His reckless actions brought    severe <u><b>censure</b></u> from the board of directors.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Rebuke</p>", "option2": " <p style=\"orphans:0;widows:0\">    Disapproval</p>", "option3": " <p style=\"orphans:0;widows:0\">    Praise</p>", "option4": " <p style=\"orphans:0;widows:0\">    Reproof</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    'Censure' means the expression of formal or severe disapproval, or    harsh criticism. Its correct antonym is 'Praise', which means the    expression of approval or admiration for someone or something.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rebuke:</b>    an expression of sharp criticism or disapproval (synonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Disapproval:</b>    possession or expression of an unfavourable opinion (synonym).</p>    <p style=\"orphans:0;widows:0\"><b>Reproof:</b> an expression of    blame or disapproval (synonym).</p>", "question_heading": ""}, {"sr_no": 124, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct passive form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The fire destroyed several shops    in the market. Even the warehouse has been gutted.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Several shops in the market have been destroyed by the fire. Even    the warehouse is being gutted.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Several shops in the market were destroyed by the fire. Even the    warehouse has been gutted.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Several shops destroyed in the market by the fire, even the    warehouse had gutted.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The fire, having destroyed several shops in the market, also    gutted the warehouse.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence contains two parts:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. 'The fire    destroyed several shops in the market' is in the active voice    (Simple Past Tense). The passive voice structure for Simple Past    Tense is: <b>Object + was/were + V3 + by + Subject</b>. Since    'several shops' is plural, 'were destroyed by the fire' is    correct.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. 'Even the    warehouse has been gutted' is already in the passive voice    (Present Perfect Tense) and remains unchanged.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct passive    sentence is: 'Several shops in the market were destroyed by the    fire. Even the warehouse has been gutted.'</p>", "question_heading": ""}, {"sr_no": 125, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that gives the most appropriate meaning of the    given idiom.</p>    <p style=\"orphans:0;widows:0\">To nip in the bud</p>", "option1": "<p style=\"orphans:0;widows:0\">    To plant seeds carefully in a garden</p>", "option2": " <p style=\"orphans:0;widows:0\">    To stop or destroy something at an early stage</p>", "option3": " <p style=\"orphans:0;widows:0\">    To encourage someone to pursue their dreams</p>", "option4": " <p style=\"orphans:0;widows:0\">    To praise someone excessively</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The idiom <b>'to nip in the bud'</b> means to suppress, stop, or    destroy something (especially a problem or bad habit) at an early    stage before it can develop further. Hence, the correct answer is    option B.</p>", "question_heading": ""}, {"sr_no": 126, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct direct form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The visitor inquired whether the    museum was open on Mondays.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The visitor asked, \"Was the museum open on Mondays?\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    The visitor asked, \"Is the museum open on Mondays?\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    The visitor asked, \"The museum is open on Mondays?\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    The visitor asked, \"Whether the museum was open on Mondays?\"</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the indirect speech of a yes/no question into direct    speech, follow these rules:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Remove the    conjunction 'whether' or 'if'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Change the    simple past tense ('was') back to the simple present tense ('is').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Form a    direct interrogative structure (Verb + Subject + ...?) within    quotation marks: <i>\"Is the museum open on Mondays?\"</i></p>    <p style=\"orphans:0;widows:0\">Therefore, option B is the    correct direct form.</p>", "question_heading": ""}, {"sr_no": 127, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate synonym of the given word.</p>    <p style=\"orphans:0;widows:0\">Spurious</p>", "option1": "<p style=\"orphans:0;widows:0\">    Genuine</p>", "option2": " <p style=\"orphans:0;widows:0\">    Counterfeit</p>", "option3": " <p style=\"orphans:0;widows:0\">    Authentic</p>", "option4": " <p style=\"orphans:0;widows:0\">    Factual</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>'Spurious'</b> means not being what it purports to be;    false or fake.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">•    <b>Counterfeit</b> means made in exact imitation of something    valuable with the intention to deceive or defraud; fake. Hence, it    is the correct synonym.</p>    <p style=\"orphans:0;widows:0\">• <i>Genuine</i>, <i>Authentic</i>,    and <i>Factual</i> all refer to things that are real, true, or    original, making them antonyms of 'Spurious'.</p>", "question_heading": ""}, {"sr_no": 128, "question": " <p style=\"orphans:0;widows:0\">    Select the wrongly spelt word out of the given alternatives.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Magnanimous</p>", "option2": " <p style=\"orphans:0;widows:0\">    Miscellaneous</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mischievious</p>", "option4": " <p style=\"orphans:0;widows:0\">    Miraculous</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The wrongly spelt word is 'Mischievious'. The correct spelling is    <b>'Mischievous'</b>, which means causing or showing a fondness    for causing trouble in a playful way.</p>", "question_heading": ""}, {"sr_no": 129, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to substitute the underlined    segment in the given sentence. If there is no need to substitute    it, select 'No substitution required'.</p>    <p style=\"orphans:0;widows:0\">The little girl was sitting    <u>peacefully besides her grandmother</u> during the ceremony.</p>", "option1": "<p style=\"orphans:0;widows:0\">    peaceful beside her grandmother</p>", "option2": " <p style=\"orphans:0;widows:0\">    peacefully beside her grandmother</p>", "option3": " <p style=\"orphans:0;widows:0\">    peacefully beside to her grandmother</p>", "option4": " <p style=\"orphans:0;widows:0\">    No substitution required</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct substitution is <b>peacefully beside her grandmother</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Explanation:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Beside</b>    is a preposition meaning 'at the side of' or 'next to'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Besides</b>    is a preposition/adverb meaning 'in addition to' or 'apart from'.</p>    <p style=\"orphans:0;widows:0\">In this sentence, the context    indicates physical proximity (sitting next to her grandmother), so    'beside' must be used instead of 'besides'. The adverb    'peacefully' correctly modifies the verb 'was sitting'. Hence,    option B is correct.</p>", "question_heading": ""}, {"sr_no": 130, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, out of the four alternatives, choose    the one which can be substituted for the given words/sentence.</p>    <p style=\"orphans:0;widows:0\">An extreme or irrational fear of    darkness.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Pyrophobia</p>", "option2": " <p style=\"orphans:0;widows:0\">    Cynophobia</p>", "option3": " <p style=\"orphans:0;widows:0\">    Nyctophobia</p>", "option4": " <p style=\"orphans:0;widows:0\">    Xenophobia</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitution is <b>Nyctophobia</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">-    <b>Nyctophobia:</b> An extreme or irrational fear of the night or    darkness.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Pyrophobia:</b>    An irrational fear of fire.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Cynophobia:</b>    An abnormal fear of dogs.</p>    <p style=\"orphans:0;widows:0\">- <b>Xenophobia:</b> Fear or    hatred of strangers or foreigners.</p>", "question_heading": ""}, {"sr_no": 131, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Choose the most appropriate option to fill in the blank in the    given sentence.</p>    <p style=\"orphans:0;widows:0\">The detective was known for his    ________ mind, easily spotting details that others overlooked.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Sluggish</p>", "option2": " <p style=\"orphans:0;widows:0\">    Naive</p>", "option3": " <p style=\"orphans:0;widows:0\">    Astute</p>", "option4": " <p style=\"orphans:0;widows:0\">    Dormant</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    'Astute' means having or showing an ability to accurately assess    situations or people; shrewd and sharp-witted. In this context, a    detective with an astute mind would be perceptive enough to notice    overlooked details.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sluggish:</b>    slow-moving or lacking energy.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Naive:</b>    showing a lack of experience, wisdom, or judgment.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Dormant:</b>    temporarily inactive or in a state of rest.</p>    <p style=\"orphans:0;widows:0\">Therefore, <b>Astute</b> is the    most appropriate choice.</p>", "question_heading": ""}, {"sr_no": 132, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct indirect form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">“Do you believe you can manage    this project without any guidance?” sneered the manager.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The manager sneered and asked whether he believed he could manage    that project without any guidance.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The manager sneered that did he believe he could manage that    project without any guidance.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The manager sneered and asked if he has believed he can manage    this project without any guidance.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The manager sneered and asked whether you believed you could    manage that project without any guidance.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct indirect form is: <b>The manager sneered and asked    whether he believed he could manage that project without any    guidance.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rules for    conversion:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    reporting verb ‘sneered’ can be expanded to ‘sneered and    asked’ because the reported speech is an interrogative sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. For yes/no    questions, the conjunction ‘if’ or ‘whether’ is used, and    the interrogative structure changes to assertive.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Present    tense changes to past tense: ‘Do you believe’ becomes ‘he    believed’, and modal ‘can’ changes to ‘could’.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4.    Demonstrative pronoun/determiner ‘this’ changes to ‘that’.</p>    <p style=\"orphans:0;widows:0\">Hence, option A is the correct    answer.</p>", "question_heading": ""}, {"sr_no": 133, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Choose the option that contains the homonym of the highlighted    word in the given sentence.</p>    <p style=\"orphans:0;widows:0\">The hikers decided to pitch their    tents on the grassy <b>bank</b> of the stream to rest for the    night.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The soil on the river bank had become loose after days of    relentless downpours.</p>", "option2": " <p style=\"orphans:0;widows:0\">    He deposited his quarterly earnings into his commercial bank    account to earn interest.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Trees planted along the canal bank help prevent soil erosion    during flash floods.</p>", "option4": " <p style=\"orphans:0;widows:0\">    We sat near the steep bank of the lake, watching the birds catch    fish in the shallow water.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the given sentence, <b>bank</b> refers to the sloping land    alongside or bordering a body of water (a stream).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In options A,    C, and D, 'bank' is used in the same contextual sense (the    shore/edge of a river, canal, or lake).</p>    <p style=\"orphans:0;widows:0\">In option B, however, 'bank' is    used as a financial institution where money is kept, saved, or    invested. Because a homonym is a word that shares the same    spelling and pronunciation but carries a different meaning, option    B correctly features the homonym of the word.</p>", "question_heading": ""}, {"sr_no": 134, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct indirect form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">\"Open the gates    immediately,\" said the captain to the guards.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The captain requested the guards to open the gates immediately.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The captain ordered the guards to open the gates immediately.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The captain told the guards that open the gates immediately.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The captain ordered the guards that they should open the gates    immediately.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is an imperative sentence expressing a command    or order. In indirect speech:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    reporting verb 'said to' is changed to 'ordered' or 'commanded'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. The    imperative mood is converted into the infinitive form ('to' + base    verb, i.e., 'to open').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3.    Conjunction 'that' is not used to introduce the infinitive clause.</p>    <p style=\"orphans:0;widows:0\">Thus, the correct indirect form    is: <b>The captain ordered the guards to open the gates    immediately.</b></p>", "question_heading": ""}, {"sr_no": 135, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct active form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">A series of complex scientific    experiments was being conducted by the research team when the    power supply failed.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The research team conducted a series of complex scientific    experiments when the power supply failed.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The research team was conducting a series of complex scientific    experiments when the power supply failed.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The research team has been conducting a series of complex    scientific experiments when the power supply failed.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The research team had conducted a series of complex scientific    experiments when the power supply failed.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the passive voice of the past continuous    tense (<b>was being + V3</b>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The rule for    converting past continuous tense from passive to active voice is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive:    Object + was/were + being + V3 + by + Subject</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Active:    Subject + was/were + V-ing + Object</p>    <p style=\"orphans:0;widows:0\">Here, 'the research team' becomes    the subject and takes the singular auxiliary verb 'was' followed    by 'conducting'. Thus, the correct active form is given in option    B.</p>", "question_heading": ""}, {"sr_no": 136, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct direct form of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">He asked me if I would join him    for dinner.</p>", "option1": "<p style=\"orphans:0;widows:0\">    He said to me, \"Would you join him for dinner?\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    He said to me, \"Will you join me for dinner?\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    He said to me, \"Shall I join you for dinner?\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    He asked to me, \"Will you join me for dinner?\"</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the indirect sentence into direct speech, follow these    steps:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb 'asked' is changed back to 'said to' when followed by an    object ('asked to' is grammatically incorrect).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    conjunction 'if' is removed, and inverted word order (Auxiliary    verb + Subject + Main verb) is used for the interrogative sentence    inside inverted commas.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The modal    'would' changes back to 'will' corresponding to the second person    subject 'you'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The pronoun    'I' refers to the listener ('me'), so it becomes 'you'. The    pronoun 'him' refers to the speaker ('He'), so it changes to 'me'.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct direct    form is: <b>He said to me, \"Will you join me for dinner?\"</b></p>", "question_heading": ""}, {"sr_no": 137, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The following sentence has been divided into four parts.    Identify the part which contains a grammatical error. If there is    no error in the sentence, then select 'No Error'.</b></p>    <p style=\"orphans:0;widows:0\">The anxious parents (A)/ heaved a    deep (B)/ sigh for relief. (C)/ No Error (D)</p>", "option1": "<p style=\"orphans:0;widows:0\">    A</p>", "option2": " <p style=\"orphans:0;widows:0\">    B</p>", "option3": " <p style=\"orphans:0;widows:0\">    D</p>", "option4": " <p style=\"orphans:0;widows:0\">    C</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The error lies in part (C) of the sentence. The correct idiomatic    expression is 'a sigh of relief' (meaning a feeling of comfort or    reassurance when something frightening or worrying has ended), not    'a sigh for relief'. Therefore, the preposition 'for' should be    replaced with 'of'.</p>    <p style=\"orphans:0;widows:0\"><b>Correct sentence:</b> The    anxious parents heaved a deep sigh of relief.</p>", "question_heading": ""}, {"sr_no": 138, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct active form of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">Why was the final match postponed    by the authorities?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Why did the authorities postpone the final match?</p>", "option2": " <p style=\"orphans:0;widows:0\">    Why had the authorities postponed the final match?</p>", "option3": " <p style=\"orphans:0;widows:0\">    Why were the authorities postponing the final match?</p>", "option4": " <p style=\"orphans:0;widows:0\">    Why do the authorities postpone the final match?</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the passive voice in the simple past    interrogative form.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive    Structure: <i>Wh-word + was/were + object + V3 + by + subject?</i></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Active    Structure: <i>Wh-word + did + subject + V1 + object?</i></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Following    this rule, 'was postponed' changes to 'did ... postpone'.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct active    sentence is: <b>Why did the authorities postpone the final match?</b></p>", "question_heading": ""}, {"sr_no": 139, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Given below are four jumbled sentences. Select the option that    gives their correct order.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A.    Consequently, European monarchs invested heavily in domestic    research to discover the secret formula of the elusive material.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B. For    centuries, Chinese porcelain was one of the most coveted luxury    goods imported into Europe.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C. This    intense quest finally bore fruit in 1708 when German alchemist    Johann Friedrich Böttger successfully produced hard-paste    porcelain.</p>    <p style=\"orphans:0;widows:0\">D. Its delicate beauty and    exceptional durability made it so rare and expensive that it was    often referred to as 'white gold'.</p>", "option1": "<p style=\"orphans:0;widows:0\">    BDAC</p>", "option2": " <p style=\"orphans:0;widows:0\">    DABC</p>", "option3": " <p style=\"orphans:0;widows:0\">    BCAD</p>", "option4": " <p style=\"orphans:0;widows:0\">    DACB</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct logical order is <b>BDAC</b>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B</b>    introduces the main subject—Chinese porcelain and its high    demand in Europe—making it the ideal opening sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>D</b>    elaborates on the qualities of the porcelain mentioned in B ('Its    delicate beauty...'), explaining why it was called 'white gold'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A</b>    presents the result ('Consequently') of porcelain being rare and    expensive: European rulers funded research to discover how to make    it.</p>    <p style=\"orphans:0;widows:0\"><b>C</b> concludes the sequence    by describing the outcome of that effort ('This intense quest    finally bore fruit in 1708...').</p>", "question_heading": ""}, {"sr_no": 140, "question": "Rधोक पुध ूोौौोgध cोनधीिहिद ोnक ोnौथधन पुध तहधौपiयnौ giॅधn ृिधयथ. Aनपiीiciोि inपिधिigधncध (AI) iौ incनधोौingिद ुोiिधक ोौ ो पनोnौीयनंोपiॅध ीयनcध in ंयकधनn ुधोिपुcोनध, ूनयंiौing पय धnुोncध कiोgnयौपic ोccहनोcद, ौपनधोंिinध cिinicोि थयनाीियथौ, ोnक ोccिधधनोपध पुधनोूधहपic कiौcयॅधनद. Mोcुinध िधोनning ोिgयनiपुंौ, पनोinधक यn धसपधnौiॅध नधूयौiपयनiधौ यी ंधकicोि iंोging ोnक cिinicोि नधcयनकौ, cोn nयथ iकधnपiीद cयंूिधस ूोपुिययgiधौ ौहcु ोौ ंोिignोnप पहंयहनौ ोnक नधपinोि कiौयनकधनौ थiपु नधंोनाोृिध ूनधciौiयn. Hयथधॅधन, पुध inपधgनोपiयn यी cयंूहपोपiयnोि पयियस inपय cिinicोि ौधपपingौ iौ nयप ंधनिधद ो पध
