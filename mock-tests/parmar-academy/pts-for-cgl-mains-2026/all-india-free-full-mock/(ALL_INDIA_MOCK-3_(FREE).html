+ Y</span><span> is typically used for Redo).</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">In MS Word, which shortcut key combination is used to center align the selected paragraph or text?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + L</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + E</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + C</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + J</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Ctrl + E</span><span> is the standard shortcut to center align text in MS Word. (</span><span style=\"font-weight:bold\">Ctrl + L</span><span> is for left alignment, </span><span style=\"font-weight:bold\">Ctrl + R</span><span> for right, and </span><span style=\"font-weight:bold\">Ctrl + J</span><span> for justification).</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">When sending an email, what does the term ISP stand for?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Internet Security Protocol</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Internal Service Provider</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Internet Service Provider</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Information System Program</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">ISP</span><span> stands for Internet Service Provider, which is a company (like Airtel, Jio, BSNL) that provides individuals and organizations access to the internet.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following is considered system software rather than application software?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Microsoft Word</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Adobe Photoshop</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Linux Operating System</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Google Chrome</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>An </span><span style=\"font-weight:bold\">Operating System (like Linux, Windows)</span><span> is system software that manages computer hardware and provides common services for computer programs. Word, Photoshop, and Chrome are application software designed for end-user tasks.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which type of computer port is universally used to connect a wide variety of external peripheral devices (like flash drives, keyboards, and mice) and supports plug-and-play as well as data/power transmission?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Parallel Port</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>VGA Port</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>USB Port</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PS/2 Port</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">USB (Universal Serial Bus)</span><span> ports have become the industry standard for connecting peripherals, transferring data, and charging devices due to their versatility and plug-and-play capability. (VGA is for monitors, parallel is older for printers, and PS/2 is legacy for old mice/keyboards).</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">When searching for information on a search engine like Google, which operator or punctuation mark can be placed immediately before a specific word to ensure that the search results exclude pages containing that word?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Plus sign (+)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Minus sign (-)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Tilde (~)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Asterisk (*)</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Placing a minus sign (-) immediately before a word (with no space between them, e.g., -apple) tells the search engine to exclude any results that contain that specific term.</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which specific type of malware is hidden inside a legitimate-looking file or program, but once executed, it opens a secret communication channel that allows unauthorized remote users to gain full administrative control over the infected computer?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Spyware</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Backdoor</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Adware</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Logic Bomb</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A </span><span style=\"font-weight:bold\">Backdoor</span><span> (often installed by a Trojan) is a security method used to bypass normal authentication procedures, giving cybercriminals unauthorized remote access to a system.</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following storage mediums is classified as optical storage and uses laser technology to read and write data?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Magnetic Tape</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Solid State Drive</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Blu-ray Disc</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Floppy Disk</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A </span><span style=\"font-weight:bold\">Blu-ray Disc</span><span> (along with CDs and DVDs) is an optical storage device that uses laser light to write and read data. Magnetic tape, SSDs, and floppy disks rely on magnetic or electronic flash memory technology instead.</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"orphans:0;widows:0\">    <b>Which region of the Northern Plains of India lies south of the    Bhabar belt and is characterized as a wet, swampy, and marshy    tract where streams and rivers re-emerge on the surface?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Doab</p>", "option2": " <p style=\"orphans:0;widows:0\">    Tarai</p>", "option3": " <p style=\"orphans:0;widows:0\">    Bhangar</p>", "option4": " <p style=\"orphans:0;widows:0\">    Khadar</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    South of the Bhabar belt lies the <b>Tarai</b> region, which is a    15 to 30 km wide zone.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The streams    and rivers that disappear in the porous pebble deposits of the    Bhabar belt re-emerge in this zone without well-defined channels,    forming a wet, swampy, and marshy tract.</p>    <p style=\"orphans:0;widows:0\">It was traditionally covered with    thick forests and rich wildlife, though large parts of it have now    been cleared for agriculture.</p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"orphans:0;widows:0\">    <b>In the double-helix structure of a DNA molecule, which pair of    nitrogenous bases is joined together by three hydrogen bonds?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Adenine and Thymine</p>", "option2": " <p style=\"orphans:0;widows:0\">    Cytosine and Guanine</p>", "option3": " <p style=\"orphans:0;widows:0\">    Adenine and Uracil</p>", "option4": " <p style=\"orphans:0;widows:0\">    Guanine and Thymine</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In DNA, nitrogenous bases form complementary base pairs held    together by hydrogen bonds:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Cytosine    (C) and Guanine (G):</b> Joined by <b>three</b> hydrogen bonds    (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_8a5bafaf9a8c386d.gif\" > ).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Adenine    (A) and Thymine (T):</b> Joined by <b>two</b> hydrogen bonds (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_98a89a930ba75f37.gif\" > ).</p>    <p style=\"orphans:0;widows:0\">In RNA, Thymine is replaced by    Uracil (U), and Adenine pairs with Uracil via two hydrogen bonds.</p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"orphans:0;widows:0\">    <b>An object of height 6 cm is placed at a distance of 30 cm in    front of a convex lens of focal length 20 cm. Which of the    following correctly gives the position of the image from the lens,    the height of the image, and its nature?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    60 cm, 12 cm, Real and Inverted</p>", "option2": " <p style=\"orphans:0;widows:0\">    60 cm, 12 cm, Virtual and Erect</p>", "option3": " <p style=\"orphans:0;widows:0\">    40 cm, 8 cm, Real and Inverted</p>", "option4": " <p style=\"orphans:0;widows:0\">    15 cm, 3 cm, Virtual and Erect</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Given: Height of object,     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_265fb16fae5762e0.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Object    distance,     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_ebf8e5f931f9c397.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Focal length    of convex lens,     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_f2ca774ea99038e3.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Using the    lens formula:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_9179109973b66149.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_d50b99a5e3f0c945.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_e4dc2b923137c95d.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Thus,     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_70014d3a17932d48.gif\" >     (The image is formed at a distance of 60 cm on the other side of    the lens).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Now,    magnification (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_4d187224ad27976d.gif\" > )    is given by:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_c4073b39d3cff794.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_e8df8080ff9e8b.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Height of the    image:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_bdb1f0f77c5526dd.gif\" > </p>    <p style=\"orphans:0;widows:0\">The negative sign of    magnification and height indicates that the image is <b>Real and    Inverted</b>, having a height of 12 cm at a distance of 60 cm.</p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the Mahalwari    System introduced during British rule and choose the </b><b>correct</b><b>    option:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Under this system, the revenue demand was fixed permanently,    similar to the Permanent Settlement of Bengal.</b></p>    <p style=\"orphans:0;widows:0\"><b>2. In this    system, the village headman was given the responsibility of    collecting revenue and paying it to the Company.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only 1</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only 2</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both 1 and 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1 is incorrect:</b> Unlike the Permanent Settlement    of Bengal, the revenue demand under the Mahalwari system was not    fixed permanently; it was revised periodically.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2 is correct:</b> The unit of revenue assessment was the village    or estate ('Mahal'). The charge of collecting the revenue and    paying it to the Company was given to the village headman    (Lambardar), not the zamindar.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">The Mahalwari system was devised    by Holt Mackenzie in 1822 and later reformed under William    Bentinck and Robert Merttins Bird in 1833. It was implemented in    the North-Western Provinces, parts of Central India, and Punjab.</p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Indian discus thrower, who finished sixth at the Tokyo    2020 Olympics, was handed a three-year ban by the Athletics    Integrity Unit (AIU) in October 2022 after testing positive for a    prohibited substance?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Seema Punia</p>", "option2": " <p style=\"orphans:0;widows:0\">    Kamalpreet Kaur</p>", "option3": " <p style=\"orphans:0;widows:0\">    Navjeet Kaur Dhillon</p>", "option4": " <p style=\"orphans:0;widows:0\">    Annu Rani</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Kamalpreet Kaur, an Indian discus thrower who finished sixth at    the Tokyo 2020 Olympics, was handed a three-year ban by the    Athletics Integrity Unit (AIU) in October 2022 after testing    positive for the banned steroid Stanozolol. She also holds the    Indian national record in women's discus throw with a mark of    66.59 m.</p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the Government of    India Act of 1919 and choose the correct option:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. It introduced dyarchy at the provincial level by dividing    provincial subjects into transferred and reserved categories.</b></p>    <p style=\"orphans:0;widows:0\"><b>2. It    introduced bicameralism and direct elections in the country for    the first time.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only 1</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only 2</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both 1 and 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1 is correct:</b> The Government of India Act of 1919    (Montagu-Chelmsford Reforms) introduced dyarchy at the provincial    level by dividing provincial subjects into 'transferred' and    'reserved' subjects.</p>    <p style=\"orphans:0;widows:0\"><b>Statement 2 is correct:</b>    The Act introduced, for the first time, bicameralism at the Centre    (consisting of the Council of State and the Legislative Assembly)    and direct elections in British India.</p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"orphans:0;widows:0\">    <b>'Hojagiri' dance is a traditional folk dance performed by which    of the following tribal communities of Tripura?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Chakma</p>", "option2": " <p style=\"orphans:0;widows:0\">    Reang</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kuki</p>", "option4": " <p style=\"orphans:0;widows:0\">    Garo</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Hojagiri is a traditional folk dance performed by the Reang (also    known as Bru) community of Tripura. The dance is performed by    women and young girls who balance bottles, earthen pitchers, and    lamps on their heads while gracefully moving the lower half of    their bodies. It is usually performed on the occasion of Hojagiri    festivals (around Laxmi Puja).</p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following pairs of traditional folk dance and its    associated state is </b><b>correctly</b><b> matched?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Nati - Himachal Pradesh</p>", "option2": " <p style=\"orphans:0;widows:0\">    Hojagiri - Nagaland</p>", "option3": " <p style=\"orphans:0;widows:0\">    Danda Nata - Rajasthan</p>", "option4": " <p style=\"orphans:0;widows:0\">    Singhi Chham - Manipur</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Nati</b> – Himachal Pradesh: Correct. Nati is a popular    traditional folk dance of Himachal Pradesh, particularly famous in    the Kullu region.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Hojagiri</b>    – Nagaland: Incorrect. Hojagiri is a traditional folk dance of    Tripura, performed mainly by the Reang (Bru) community.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Danda Nata</b>    – Rajasthan: Incorrect. Danda Nata is a traditional folk dance    and ritual performance of Odisha.</p>    <p style=\"orphans:0;widows:0\"><b>Singhi Chham</b> – Manipur:    Incorrect. Singhi Chham (Snow Lion Dance) is a traditional masked    dance of Sikkim, associated with Tibetan Buddhist culture.</p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"orphans:0;widows:0\">    <b>Renowned Hindi writer Sanjeev was conferred the prestigious    Sahitya Akademi Award 2023 for which of the following novels?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Mujhe Pehchano</p>", "option2": " <p style=\"orphans:0;widows:0\">    Dhuni Tapa Teer</p>", "option3": " <p style=\"orphans:0;widows:0\">    Circus</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sootradhar</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Explanation:</b> Hindi author Sanjeev was awarded the Sahitya    Akademi Award 2023 for his acclaimed novel <i>Mujhe Pehchano</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The Sahitya    Akademi Award was established in 1954.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">It is    presented annually for literary merit in 24 languages (the 22    languages recognized in the 8th Schedule of the Indian    Constitution, along with English and Rajasthani).</p>    <p style=\"orphans:0;widows:0\">The first recipient in the Hindi    category was Makhanlal Chaturvedi in 1955 for his poetry    collection <i>Him Taringini</i>.</p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"orphans:0;widows:0\">    <b>In the human skeletal system, the joint between the carpal and    metacarpal of the thumb is classified as which type of synovial    joint?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Hinge joint</p>", "option2": " <p style=\"orphans:0;widows:0\">    Gliding joint</p>", "option3": " <p style=\"orphans:0;widows:0\">    Saddle joint</p>", "option4": " <p style=\"orphans:0;widows:0\">    Pivot joint</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The joint between the carpal and metacarpal of the thumb is a    <b>saddle joint</b>. This joint allows movement in two planes    (flexion-extension and abduction-adduction) plus circumduction,    providing the thumb with its unique opposable mobility. Other key    examples of synovial joints include: <b>Ball and socket joint:</b>    Between humerus and pectoral girdle; femur and acetabulum.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Hinge    joint:</b> Knee, elbow, and interphalangeal joints.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Pivot    joint:</b> Between atlas and axis vertebrae.</p>    <p style=\"orphans:0;widows:0\"><b>Gliding joint:</b> Between    adjacent carpal bones of the wrist.</p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"orphans:0;widows:0\">    <b>Under the Bharatiya Nyaya Sanhita, 2023, an offender is    sentenced to a fine of ₹10,000 and, in default of payment, to 4    months of imprisonment. After serving 1 month of default    imprisonment, the offender pays ₹5,000. How much additional    default imprisonment must the offender undergo?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 month</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 months</p>", "option3": " <p style=\"orphans:0;widows:0\">    3 months</p>", "option4": " <p style=\"orphans:0;widows:0\">    Immediate release</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    According to Section 8 of the Bharatiya Nyaya Sanhita (BNS), 2023,    imprisonment suffered in default of payment of a fine terminates    when such a proportion of the fine is paid that the term of    imprisonment suffered is not less than proportional to the part of    the fine still unpaid.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Calculation:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Total fine =    ₹10,000 for 4 months of imprisonment (i.e., ₹2,500 per month).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">After paying    ₹5,000, the remaining unpaid fine is ₹5,000.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The total    imprisonment required for the unpaid ₹5,000 is     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_2eddc529cb7136b1.gif\" >     months.</p>    <p style=\"orphans:0;widows:0\">Since the offender has already    undergone 1 month, he needs to serve     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_a5f5b858a0b49fec.gif\" >     additional month before being discharged.</p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following is NOT one of the eight pollutants    considered for calculating the National Air Quality Index (AQI) in    India?</b></p>", "option1": " <p style=\"orphans:0;widows:0\">    Ammonia (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_c37ba8c35aff4759.gif\" > )</p>", "option2": "  <p style=\"orphans:0;widows:0\">    Lead (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_9398cb4c7491cd5.gif\" > )</p>", "option3": "  <p style=\"orphans:0;widows:0\">    Carbon dioxide (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_3798a84b74d573f9.gif\" > )</p>", "option4": "  <p style=\"orphans:0;widows:0\">    Ozone (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_8b3fec3be935eb0a.gif\" > )</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    The National Air Quality Index (AQI) launched in India in October    2014 by the Central Pollution Control Board (CPCB) considers eight    pollutants: Particulate Matter (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_1bb8cdf910505f1e.gif\" > ),    Particulate Matter (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_9de060da64187a24.gif\" > ),    Nitrogen Dioxide (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_caacd6c15be41594.gif\" > ),    Sulphur Dioxide (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_ad1c47d7870d63d2.gif\" > ),    Carbon Monoxide (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_8469c365275aaa93.gif\" > ),    Ozone (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_8b3fec3be935eb0a.gif\" > ),    Ammonia (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_c37ba8c35aff4759.gif\" > ),    and Lead (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_9398cb4c7491cd5.gif\" > ).    Carbon dioxide (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794671160471_html_3798a84b74d573f9.gif\" > )    is a major greenhouse gas, but it is not one of the criteria    pollutants tracked for AQI calculation.</p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"orphans:0;widows:0\">    <b>As an immediate measure to tackle the severe Balance of    Payments (BoP) crisis during the 1991 economic reforms, the Indian    government took which of the following steps regarding the    external sector?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Completely prohibited foreign direct investment (FDI)</p>", "option2": " <p style=\"orphans:0;widows:0\">    Devalued the Indian Rupee against major foreign currencies</p>", "option3": " <p style=\"orphans:0;widows:0\">    Substantially increased import tariffs on all industrial goods</p>", "option4": " <p style=\"orphans:0;widows:0\">    Fixed the exchange rate strictly to gold standard</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In July 1991, to resolve the acute Balance of Payments (BoP)    crisis and curb capital flight, the Indian Rupee was devalued in    two steps (on July 1 and July 3) by nearly 18–19% against major    international currencies. This move aimed to make Indian exports    more competitive, discourage non-essential imports, and increase    the inflow of foreign exchange.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The 1991    reforms were initiated under Prime Minister P. V. Narasimha Rao    and Finance Minister Dr. Manmohan Singh.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Following the    devaluation, India moved toward a market-determined exchange rate    system through the Liberalised Exchange Rate Management System    (LERMS) introduced in 1992.</p>    <p style=\"orphans:0;widows:0\">Prior to the reforms, India's    foreign exchange reserves had dropped to an alarming level    sufficient to finance only about two weeks of imports.</p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"orphans:0;widows:0\">    <b>Total internal reflection can take place only when a light ray    travels from:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    a rarer medium to a denser medium with an angle of incidence    greater than the critical angle</p>", "option2": " <p style=\"orphans:0;widows:0\">    a denser medium to a rarer medium with an angle of incidence    greater than the critical angle</p>", "option3": " <p style=\"orphans:0;widows:0\">    a denser medium to a rarer medium with an angle of incidence less    than the critical angle</p>", "option4": " <p style=\"orphans:0;widows:0\">    a rarer medium to a denser medium with an angle of incidence less    than the critical angle</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    For total internal reflection (TIR) to occur, two essential    conditions must be fulfilled:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The light ray    must travel from an optically denser medium towards an optically    rarer medium.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The angle of    incidence in the denser medium must be strictly greater than the    critical angle for the pair of media.</p>    <p style=\"orphans:0;widows:0\">If the angle of incidence exceeds    the critical angle, the ray cannot undergo refraction and is    reflected entirely back into the denser medium.</p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"orphans:0;widows:0\">    <b>At which of the following Neolithic archaeological sites in    India has prominent evidence of pit-houses (houses dug into the    ground with steps leading into them) been discovered?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Mehrgarh</p>", "option2": " <p style=\"orphans:0;widows:0\">    Burzahom</p>", "option3": " <p style=\"orphans:0;widows:0\">    Daojali Hading</p>", "option4": " <p style=\"orphans:0;widows:0\">    Koldihwa</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Burzahom is a major Neolithic site located in the Kashmir Valley    (Jammu and Kashmir). Archaeological excavations here revealed    unique subterranean pit-dwellings, which were dug into the ground    with steps cut into the earth leading down into them. These    dwellings provided shelter from the region's harsh cold climate.    Additionally, ash, charcoal, and hearths found inside and outside    these pits indicate domestic cooking activities.</p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"orphans:0;widows:0\">    <b>In ancient Indian Buddhist stupa architecture, which of the    following terms refers to the ornamental ceremonial gateway    erected at the cardinal points of the enclosure?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Torana</p>", "option2": " <p style=\"orphans:0;widows:0\">    Harmika</p>", "option3": " <p style=\"orphans:0;widows:0\">    Medhi</p>", "option4": " <p style=\"orphans:0;widows:0\">    Chhatri</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In Buddhist stupa architecture, a <b>Torana</b> is a monumental,    ceremonial gateway marking the entrance to the stupa complex.    These gateways were oriented toward the four cardinal directions    and were elaborately carved with reliefs depicting Jataka tales,    decorative motifs, and guardian figures, most notably seen at    Sanchi and Bharhut during the Post-Mauryan (Sunga and Satavahana)    period.</p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"orphans:0;widows:0\">    <b>In medieval Karnataka, the institution named 'Anubhava Mantapa'    established by the Bhakti reformer Basavanna primarily served as a    platform for:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    conducting Vedic sacrificial rituals under royal patronage</p>", "option2": " <p style=\"orphans:0;widows:0\">    open socio-philosophical dialogues transcending caste and gender    divisions</p>", "option3": " <p style=\"orphans:0;widows:0\">    formulating military strategies for the Kalachuri kingdom</p>", "option4": " <p style=\"orphans:0;widows:0\">    regulating regional trade guilds and collecting commercial taxes</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    'Anubhava Mantapa' (literally, the Hall of Spiritual Experience)    was an egalitarian institution founded by Basavanna in    12th-century Karnataka (Kalyana). It served as an open spiritual    and socio-philosophical forum where people from all sections of    society, irrespective of caste, social status, or gender    (including female saints like Akka Mahadevi), gathered to discuss    spiritual and social issues. These discussions formed the core of    the Kannada Vachana literature.</p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following departments was created by Sultan    Alauddin Khalji to oversee and regulate his market control system?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Diwan-i-Kohi</p>", "option2": " <p style=\"orphans:0;widows:0\">    Diwan-i-Insha</p>", "option3": " <p style=\"orphans:0;widows:0\">    Diwan-i-Riyasat</p>", "option4": " <p style=\"orphans:0;widows:0\">    Diwan-i-Arz</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Sultan Alauddin Khalji established the department of    <b>Diwan-i-Riyasat</b> to implement and supervise his market    control policies and price regulations. Malik Yaqut was appointed    as its first head (Naib-i-Riyasat). Among the other options:    Diwan-i-Arz was created by Balban, Diwan-i-Kohi (agriculture    department) was established by Muhammad bin Tughluq, and    Diwan-i-Insha was the department of state correspondence.</p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following stretches is designated as National    Waterway 3 (NW-3) in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Prayagraj–Haldia stretch</p>", "option2": " <p style=\"orphans:0;widows:0\">    Talcher–Dhamra stretch</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kottapuram–Kollam stretch</p>", "option4": " <p style=\"orphans:0;widows:0\">    Kakinada–Puducherry stretch</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    National Waterway 3 (NW-3) covers the Kottapuram–Kollam stretch    of the West Coast Canal along with the Champakkara and Udyogmandal    canals in Kerala, spanning a length of 205 km. It was declared a    National Waterway in 1993. For reference, the Prayagraj–Haldia    stretch is NW-1, the Sadiya–Dhubri stretch is NW-2, and the    Kakinada–Puducherry stretch is NW-4.</p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"orphans:0;widows:0\">    <b>The Wangala festival, famously known as the 'Festival of    Hundred Drums', is predominantly celebrated in which of the    following Indian states?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Sikkim</p>", "option2": " <p style=\"orphans:0;widows:0\">    Meghalaya</p>", "option3": " <p style=\"orphans:0;widows:0\">    Arunachal Pradesh</p>", "option4": " <p style=\"orphans:0;widows:0\">    Nagaland</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Wangala festival is a prominent post-harvest festival    celebrated predominantly by the Garo tribe in the state of    Meghalaya. It is also known as the 'Festival of Hundred Drums' and    is observed to honor 'Saljong', the Sun God of fertility, marking    the end of the agricultural season.</p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"orphans:0;widows:0\">    <b>Under which Article of the Constitution of India is the    Election Commission vested with the power of superintendence,    direction, and control of elections?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Article 324</p>", "option2": " <p style=\"orphans:0;widows:0\">    Article 280</p>", "option3": " <p style=\"orphans:0;widows:0\">    Article 315</p>", "option4": " <p style=\"orphans:0;widows:0\">    Article 148</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Article 324 of the Constitution of India provides for the    establishment of the Election Commission of India. It vests the    superintendence, direction, and control of the preparation of    electoral rolls and the conduct of elections to Parliament, State    Legislatures, and the offices of the President and Vice-President    in the Election Commission.</p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"orphans:0;widows:0\">    <b>Where did Prime Minister Narendra Modi inaugurate three major    development projects of Banas Dairy worth ₹407.56 crore?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Anand, Gujarat</p>", "option2": " <p style=\"orphans:0;widows:0\">    Bhildi, Banaskantha, Gujarat</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mehsana, Gujarat</p>", "option4": " <p style=\"orphans:0;widows:0\">    Palanpur, Gujarat</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Prime Minister Narendra Modi inaugurated three major development    projects of Banas Dairy worth <b>₹407.56 crore</b> at Bhildi in    Banaskantha district, Gujarat.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The <b>Bharat    Bovine Breeding and Research Centre (BBBRC)</b>, built at a cost    of <b>₹324.77 crore</b> in Bhildi, was inaugurated with support    from the <b>Rashtriya Gokul Mission</b> and <b>AHIDF</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A <b>French    Fries Processing Plant</b> at Sanadar (Deodar) and a modern    <b>Automated Storage and Retrieval System (ASRS) Warehouse</b> at    Palanpur were also inaugurated.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Foundation    stones were laid for <b>two new Bio-CNG plants</b> at Tharad and    Radhanpur to provide additional income to farmers and promote    clean fuel at the rural level.</p>    <p style=\"orphans:0;widows:0\"><b>Banas Dairy</b> (Banaskantha    District Cooperative Milk Producers’ Union) was established in    <b>1969</b> by <b>Galbabhai Nanjibhai Patel</b> and is Asia’s    largest dairy cooperative under the <b>GCMMF (Amul) network</b>.</p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"orphans:0;widows:0\">    <b>Which satellite was recently launched by ISRO aboard the    GSLV-F18 rocket to strengthen India's NavIC navigation system?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    NVS-01</p>", "option2": " <p style=\"orphans:0;widows:0\">    NVS-02</p>", "option3": " <p style=\"orphans:0;widows:0\">    NVS-03</p>", "option4": " <p style=\"orphans:0;widows:0\">    NVS-04</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    ISRO launched the <b>NVS-03 navigation satellite</b> aboard the    <b>GSLV-F18 rocket</b> to strengthen the <b>NavIC constellation</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>NVS-03</b>    is the <b>third satellite of the second-generation NVS series</b>,    featuring an <b>indigenous Rubidium atomic clock</b> and an <b>L1    civilian frequency band</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A minimum of    <b>4 operational satellites</b> in orbit is required for NavIC to    provide accurate <b>Positioning, Navigation and Timing (PNT)</b>    services.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>NavIC    (Navigation with Indian Constellation)</b> was formerly known as    <b>IRNSS</b> and provides coverage over India and up to <b>1,500    km beyond its borders</b>.</p>    <p style=\"orphans:0;widows:0\">The four global navigation    satellite systems are <b>GPS (USA), GLONASS (Russia), Galileo    (EU), and BeiDou (China)</b>. <b>NavIC (India)</b> and <b>QZSS    (Japan)</b> are regional navigation systems.</p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"orphans:0;widows:0\">    <b>The 11th edition of the joint Special Forces exercise 'Garuda    Shakti' was conducted between India and which country?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Thailand</p>", "option2": " <p style=\"orphans:0;widows:0\">    Indonesia</p>", "option3": " <p style=\"orphans:0;widows:0\">    Malaysia</p>", "option4": " <p style=\"orphans:0;widows:0\">    Singapore</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    - The <b>11th edition of the joint special forces exercise 'Garuda    Shakti'</b> between India and Indonesia was held at <b>Banyuwangi,    Indonesia</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- The Indian    contingent was represented by troops from the <b>Parachute    Regiment (Special Forces)</b>. The main objective was to    strengthen joint operational capabilities and interoperability    between the two armies.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- During the    exercise, both countries' forces practised <b>jungle warfare    tactics, combat shooting, rock craft, and heliborne assault    operations</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- India and    Indonesia also conduct the bilateral naval exercise <b>'Samudra    Shakti'</b> and the coordinated maritime patrol <b>'IND-INDO    CORPAT'</b>.</p>    <p style=\"orphans:0;widows:0\">- <b>Nusantara</b>, Indonesia's    new capital, is located in <b>East Kalimantan</b>, while the <b>Great    Channel (6 Degree Channel)</b> separates India's Great Nicobar    Island from Indonesia's Sumatra Island.</p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"orphans:0;widows:0\">    <b>Who has been assigned the additional charge of Director General    (DG) of the Indo-Tibetan Border Police (ITBP)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Shatrujeet Singh Kapoor</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sanjay Singhal</p>", "option3": " <p style=\"orphans:0;widows:0\">    Praveen Kumar</p>", "option4": " <p style=\"orphans:0;widows:0\">    Amrit Mohan Prasad</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The Union Ministry of Home Affairs assigned the <b>additional    charge of Director General (DG) of the Indo-Tibetan Border Police    (ITBP)</b> to <b>Sanjay Singhal</b>, the DG of Sashastra Seema Bal    (SSB).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Sanjay    Singhal</b>, a <b>1993-batch IPS officer of the Uttar Pradesh    cadre</b>, assumed the additional responsibility following the    retirement of incumbent ITBP chief <b>Shatrujeet Singh Kapoor</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Sanjay    Singhal has been serving as the <b>27th Director General of SSB    since September 2025</b>. He previously served as Special Director    General in BSF and as DIG and IG in ITBP.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Sashastra    Seema Bal (SSB)</b> is responsible for guarding India's borders    with <b>Nepal (1,751 km)</b> and <b>Bhutan (699 km)</b>.</p>    <p style=\"orphans:0;widows:0\">- <b>Indo-Tibetan Border Police    (ITBP)</b> was established on <b>24 October 1962</b> during the    Sino-Indian War. It is responsible for guarding the <b>3,488 km    India-China border</b> along the Line of Actual Control (LAC).</p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a Regional Transport Office, vehicle permit numbers are issued in a 12-character format:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">[State Code (2 letters)][District Code (2 digits)][Permit Type (1 letter)][Category Code (3 digits)][Issue Year (2 digits)][Validation Check (2 digits)]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">The rules are as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">• State Code: 'MH' for Maharashtra</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">• District Code: 2-digit code of the respective district</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">• Permit Type: 'P' (Passenger), 'G' (Goods), 'T' (Tourist)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">• Category Code: A 3-digit number representing vehicle capacity</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">• Issue Year: Last two digits of the year of issue</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">• Validation Check: The 2-digit sum of all individual digits of the District Code, Category Code, and Issue Year</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If a goods vehicle with Category Code 458 was issued a permit in the year 2023 in District 12 of Maharashtra ('MH'), what is its complete and valid Permit Number?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MH12G4582325</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MH12G4582323</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MH12P4582325</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MH12G4582025</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>To find the valid permit number, determine each component using the given rules:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. State Code = MH</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. District Code = 12</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Permit Type = 'G' (for Goods vehicle)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Category Code = 458</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Issue Year = Last two digits of 2023 = 23</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. Validation Check = Sum of all individual digits of District Code (1, 2), Category Code (4, 5, 8), and Issue Year (2, 3):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image001.png\" width=\"215\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combining all segments in order:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MH + 12 + G + 458 + 23 + 25 = </span><span style=\"font-weight:bold\">MH12G4582325</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, the correct option is A.</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">94 is related to 77 following a certain logic. Following the same logic, 82 is related to 65. To which of the following is 63 related, following the same logic?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into their constituent digits. E.g. 13 – Operations on 13 such as adding /subtracting /multiplying to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>48</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>46</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>44</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>52</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The logic followed here is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img sr ont-size:12pt\"><span>(13, 9, 82)</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The logic followed here is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image026.png\" width=\"500\" height=\"57\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For (14, 9, 80):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image027.png\" width=\"398\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For (18, 6, 60):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image028.png\" width=\"398\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly, checking the options:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Option A: (15, 8, 74)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image029.png\" width=\"398\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, (15, 8, 74) follows the same pattern.</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If 1 is added to each prime digit, 2 is subtracted from each even composite digit, and 1 is subtracted from each of the remaining digits in the number 583164297, how many digits will appear more than once in the new number thus formed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given number: 583164297</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let us classify each digit according to the given conditions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Prime digits (2, 3, 5, 7): Add 1</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 5 + 1 = 6</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 3 + 1 = 4</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 2 + 1 = 3</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 7 + 1 = 8</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Even composite digits (4, 6, 8): Subtract 2</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 8 - 2 = 6</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 6 - 2 = 4</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 4 - 2 = 2</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Remaining digits (1 is neither prime nor composite, and 9 is an odd composite): Subtract 1</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 1 - 1 = 0</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 9 - 1 = 8</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Arranging the new digits in their original order gives the number: </span><span style=\"font-weight:bold\">664042388</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Frequency of each digit in the new number:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 0 appears 1 time</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 2 appears 1 time</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 3 appears 1 time</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">4 appears 2 times</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">6 appears 2 times</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">8 appears 2 times</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, exactly three digits (4, 6, and 8) appear more than once.</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Directions (Q. 1 – 2): Three of the following four number triads are alike in a certain way and thus form a group. Which is the number triad that does not belong to that group? (NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding/subtracting/multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-ali ulk_uploader_images/1794679357575_image034.png\" width=\"366\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image035.png\" width=\"82\" height=\"21\" alt style=\"vertical-align:middle\" ><span>: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image036.png\" width=\"319\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image037.png\" width=\"82\" height=\"21\" alt style=\"vertical-align:middle\" ><span>: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image038.png\" width=\"319\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image033.png\" width=\"82\" height=\"21\" alt style=\"vertical-align:middle\" ><span> does not follow the rule and is the odd triad.</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Two statements I and II are given below. These statements may be independent causes, effects of independent causes, or a common cause. One statement may be the effect of the other. Read both statements and select the correct option.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. A thick blanket of dense fog engulfed the entire city on Tuesday morning, reducing visibility to below 50 metres.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. Several domestic flights scheduled to land at or depart from the city airport were delayed or diverted on Tuesday morning.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement I is the cause and Statement II is its effect</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Statement II is the cause and Statement I is its effect</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both statements I and II are independent causes</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both statements I and II are effects of independent causes</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A dense blanket of fog reducing visibility to below 50 metres (Statement I) directly creates hazardous and unsafe conditions for air traffic operations. As a result, flights had to be delayed or diverted (Statement II). Therefore, Statement I is the cause and Statement II is its effect.</span></p>", "question_heading": ""}, {"sr_no": 83, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the figure from the options that can replace the question mark (?) and complete the given series.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image039.png\" width=\"500\" height=\"100\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image040.png\" width=\"120\" height=\"120\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image041.png\" width=\"120\" height=\"120\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image042.png\" width=\"120\" height=\"120\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image043.png\" width=\"120\" height=\"120\" alt ></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the series is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In each successive step, one new symbol is added to the right, following a repeating cycle of three symbols:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. First symbol: A vertical line with a circle at the top.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Second symbol: A vertical line with a triangular flag on the right.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Third symbol: A vertical line with a rectangle at the bottom-right.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The sequence of symbols in each frame is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Frame 1: 1 symbol (1st symbol)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Frame 2: 2 symbols (1st, 2nd)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Frame 3: 3 symbols (1st, 2nd, 3rd)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Frame 4: 4 symbols (1st, 2nd, 3rd, 1st)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Frame 5: 5 symbols (1st, 2nd, 3rd, 1st, 2nd)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the missing figure must contain five symbols ending with the triangular flag symbol, as shown in figure (C).</span></p>", "question_heading": ""}, {"sr_no": 84, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">What will come in the place of the question mark (?) in the following equation, if ‘+’ and ‘×’ are interchanged and ‘−’ and ‘÷’ are interchanged?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image044.png\" width=\"180\" height=\"21\" alt style=\"vertical-align:middle\" ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>147</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>159</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>171</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>165</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given equation: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image045.png\" width=\"175\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>After interchanging the signs (‘+’ with ‘×’ and ‘−’ with ‘÷’):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image046.png\" width=\"147\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the BODMAS rule:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 1 (Division): </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image047.png\" width=\"76\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image048.png\" width=\"131\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 2 (Multiplication): </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image049.png\" width=\"93\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image050.png\" width=\"113\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 3 (Addition and Subtraction):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image051.png\" width=\"123\" height=\"21\" alt style=\"vertical-align:middle\" ></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the combination of letters that when sequentially placed in the blanks of the given series, will complete the series.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">P _ Q R _ P P Q _ R P _ P Q Q _ P P</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q P P Q R</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q P Q P R</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P Q P Q R</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q P Q R P</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Dividing the given series of 18 letters into 6 equal groups of 3 letters each:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P _ Q | R _ P | P Q _ | R P _ | P Q Q | _ P P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The series follows an alternating pattern of two repeating 3-letter groups, </span><span style=\"font-weight:bold\">P Q Q</span><span> and </span><span style=\"font-weight:bold\">R P P</span><span>:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1st group: P </span><span style=\"font-weight:bold\">Q</span><span> Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2nd group: R </span><span style=\"font-weight:bold\">P</span><span> P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3rd group: P Q </span><span style=\"font-weight:bold\">Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4th group: R P </span><span style=\"font-weight:bold\">P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5th group: P Q Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6th group: </span><span style=\"font-weight:bold\">R</span><span> P P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the letters sequentially placed in the blanks are </span><span style=\"font-weight:bold\">Q, P, Q, P, R</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Three of the following four word pairs are alike in a certain way and thus form a group. Which is the pair that does not belong to that group?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Barometer - Pressure</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ammeter - Electric current</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Anemometer - Temperature</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Seismograph - Earthquake</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In each pair except 'Anemometer - Temperature', the first term is a scientific instrument used to measure or detect the physical quantity or phenomenon given in the second term:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Barometer is used to measure atmospheric pressure.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Ammeter is used to measure electric current.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Seismograph is used to detect and record earthquakes.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>However, an anemometer is used to measure wind speed and direction, whereas temperature is measured by a thermometer. Therefore, 'Anemometer - Temperature' is the odd one out.</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A certain number of people are sitting in a row facing north. 'B' sits third to the right of 'A'. 'D' sits to the immediate left of 'A'. 'E' sits fourth to the left of 'D'. 'G' is an immediate neighbour of both 'B' and 'H', where 'H' sits to the right of 'G'. 'H' is sitting at one of the extreme ends. 'C' is sitting at one of the extreme ends, and exactly two people sit between 'C' and 'E'. If no other person is sitting in the row, what is the total number of people seated?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Based on the given information, let us determine the positions from left to right (all facing north):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 'D' sits to the immediate left of 'A', and 'B' sits 3rd to the right of 'A': [D, A, _, _, B]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 'E' sits 4th to the left of 'D': [E, _, _, _, D, A, _, _, B]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 'G' is an immediate neighbour of both 'B' and 'H', with 'H' to the right of 'G': [E, _, _, _, D, A, _, _, B, G, H]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Since 'H' is to the right of several persons and sits at an extreme end, 'H' must be at the extreme right end.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. 'C' sits at an extreme end, so 'C' must be at the extreme left end.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. Exactly two people sit between 'C' and 'E': [C, _, _, E]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combining the full arrangement from left to right:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">C _ _ E _ _ _ D A _ _ B G H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the total number of people seated in the row is 14.</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">How many meaningful four-letter English words can be formed using the letters L, P, E, and A, using each letter only once in each word?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The given letters are L, P, E, and A. Using each letter exactly once, the following 4 meaningful four-letter English words can be formed:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">LEAP</span><span> (to jump or spring)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">PALE</span><span> (light in color)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span style=\"font-weight:bold\">PEAL</span><span> (a loud ringing of bells or burst of sound)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. </span><span style=\"font-weight:bold\">PLEA</span><span> (an earnest request or appeal)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, exactly 4 meaningful words can be formed.</span></p>", "question_heading": ""}, {"sr_no": 89, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the correct mirror image of the given figure when the mirror is placed at MN as shown below.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image052.png\" width=\"300\" height=\"80\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image053.png\" width=\"240\" height=\"60\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image054.png\" width=\"240\" height=\"60\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image055.png\" width=\"240\" height=\"60\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794679357575_image056.png\" width=\"240\" height=\"60\" alt ></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>When a vertical mirro
