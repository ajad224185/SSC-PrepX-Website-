S = RHS, option B is correct.</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the set in which the numbers are related in the same way as are the numbers of the following sets.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(NOTE: Operations should be performed on the whole numbers, without breaking down the numbers into its constituent digits. E.g. 13 – Operations on 13 such as adding / subtracting / multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is NOT allowed)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(11, 15, 104), (9, 14, 115)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(12, 17, 150)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(8, 13, 110)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(13, 18, 155)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(14, 19, 170)</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The logic followed here is: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image024.png\" width=\"86\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (or </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image025.png\" width=\"155\" height=\"21\" alt style=\"vertical-align:middle\" ><span>), where the set is </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image026.png\" width=\"51\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First set: (11, 15, 104)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image027.png\" width=\"211\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second set: (9, 14, 115)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image028.png\" width=\"194\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly, checking the options:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Option C: (13, 18, 155)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image029.png\" width=\"211\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, (13, 18, 155) is the correct set.</span></p>", "question_heading": ""}, {"sr_no": 44, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the figure from the given options that can replace the question mark (?) in figure D, following the same pattern as figure A is related to figure B.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image030.png\" width=\"440\" height=\"120\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image031.png\" width=\"100\" height=\"100\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image032.png\" width=\"100\" height=\"100\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image033.png\" width=\"100\" height=\"100\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image034.png\" width=\"100\" height=\"100\" alt ></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Observing the transformation from Figure A to Figure B:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">Positional shifts:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• The element at upper-center (C1) shifts to Top-Left (TL).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• The element at Bottom-Right (BR) shifts to upper-center (C1).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• The element at lower-center (C2) shifts to Bottom-Right (BR).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• The element at Top-Left (TL) shifts to lower-center (C2) and rotates </span><span style=\"font-weight:bold\">90° clockwise</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• The elements at Top-Right (TR) and Bottom-Left (BL) swap places.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• Additionally, the element moving from BL to TR gets </span><span style=\"font-weight:bold\">inverted vertically</span><span> (letter 'T' becomes '⊥').</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">Applying the same rule to Figure C to obtain Figure D:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• C1 (Diamond ◇) moves to TL.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• BR (Plus +) moves to C1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• C2 (Filled circle ●) moves to BR.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• TL (Right arrow →) moves to C2 and rotates 90° clockwise to point DOWN (↓).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• TR ('N') moves to BL.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• BL ('V') moves to TR and inverts vertically to become 'Λ'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, option (B) is the correct figure.</span></p>", "question_heading": ""}, {"sr_no": 45, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the option in which the given figure is embedded. (Rotation is NOT allowed)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image035.png\" width=\"100\" height=\"150\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image036.png\" width=\"160\" height=\"160\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image037.png\" width=\"160\" height=\"160\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image038.png\" width=\"160\" height=\"160\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image039.png\" width=\"160\" height=\"160\" alt ></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>On careful examination of the options without rotating the figure, we observe that the given figure is embedded in </span><span style=\"font-weight:bold\">Option (B)</span><span>:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. The upper diamond (rhombus) is situated along the central vertical axis near the top.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. A vertical stem extends downward from the bottom vertex of the diamond.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. A horizontal line crosses this vertical stem, and from its left endpoint, a diagonal line segment slopes downward and to the right to meet the stem.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. At the bottom of the stem, the line turns right horizontally and then bends vertically downward, forming the lower hook.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In Option (A), the diagonal segment from the left is absent and the bottom hook turns left. In Option (C), the diagonal slants upward. In Option (D), the bottom hook turns upward instead of downward.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the option that represents the letters that, when placed from left to right in the following blanks, will complete the letter-series.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Z _ B Y X C _ W _ E F U T G _ S R _ J Q _ K L O</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A D V H I P</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A E V H J P</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B D U H I P</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A D U G J O</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Divide the given 24-letter series into 6 groups of 4 letters each:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1st group: Z </span><span style=\"font-weight:bold\">A</span><span> B Y</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2nd group: X C </span><span style=\"font-weight:bold\">D</span><span> W</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3rd group: </span><span style=\"font-weight:bold\">V</span><span> E F U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4th group: T G </span><span style=\"font-weight:bold\">H</span><span> S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5th group: R </span><span style=\"font-weight:bold\">I</span><span> J Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6th group: </span><span style=\"font-weight:bold\">P</span><span> K L O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern across the groups for each position is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1st letter: Z (-2) → X (-2) → </span><span style=\"font-weight:bold\">V</span><span> (-2) → T (-2) → R (-2) → </span><span style=\"font-weight:bold\">P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2nd letter: </span><span style=\"font-weight:bold\">A</span><span> (+2) → C (+2) → E (+2) → G (+2) → </span><span style=\"font-weight:bold\">I</span><span> (+2) → K</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3rd letter: B (+2) → </span><span style=\"font-weight:bold\">D</span><span> (+2) → F (+2) → </span><span style=\"font-weight:bold\">H</span><span> (+2) → J (+2) → L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4th letter: Y (-2) → W (-2) → U (-2) → S (-2) → Q (-2) → O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Additionally, in each group of 4, the 1st and 2nd letters are opposite pairs (Z-A, X-C, V-E, T-G, R-I, P-K), as are the 3rd and 4th letters (B-Y, D-W, F-U, H-S, J-Q, L-O).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the required missing letters are </span><span style=\"font-weight:bold\">A D V H I P</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the number from among the given options that can replace the question mark (?) in the following series.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">23, 25, 32, 60, ?, 249</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>118</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>123</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>127</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>135</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the given series is based on adding alternating values of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image040.png\" width=\"46\" height=\"21\" alt style=\"vertical-align:middle\" ><span> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image041.png\" width=\"46\" height=\"21\" alt style=\"vertical-align:middle\" ><span>:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image042.png\" width=\"201\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image043.png\" width=\"201\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image044.png\" width=\"209\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image045.png\" width=\"218\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image046.png\" width=\"245\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the missing number is 123.</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Direction: A statement is given followed by two conclusions numbered I and II. Assuming that the given statement is true even if it seems to be at variance from commonly known facts, decide which of the given conclusions logically follow(s) from the given statement.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statement:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In the latest quarterly performance review of TechSolutions Ltd., out of its 12 regional service centers, the 4 centers that introduced an automated workflow system recorded an average profit increase of 20%, while the remaining 8 centers without the system recorded an average profit decline of 5%.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. Every service center that introduced the automated workflow system recorded a profit increase during that quarter.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. TechSolutions Ltd. recorded a net overall profit increase across all 12 regional service centers combined during that quarter.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion I follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion II follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both conclusions I and II follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither conclusion I nor II follows</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">Conclusion I does not follow:</span><span> The statement provides the </span><span style=\"font-style:italic\">average</span><span> profit increase of 20% for the 4 centers combined. An average increase does not guarantee that every individual center witnessed an increase; for instance, three centers could have had very high profit increases while one center experienced a minor decline or no change, still resulting in an overall positive average.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">Conclusion II does not follow:</span><span> To determine whether the company as a whole saw a net profit increase, we need to know the baseline profits (weights) of each center. If the 8 centers experiencing a 5% decline had significantly larger baseline profits than the 4 centers experiencing a 20% increase, the net profit of the company would decline. Since individual baseline values are not provided, we cannot conclude that total profit increased.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, neither conclusion I nor II follows.</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">‘P # Q’ means ‘P is the sister of Q’.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">‘P @ Q’ means ‘P is the son of Q’.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">‘P % Q’ means ‘P is the wife of Q’.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">‘P * Q’ means ‘P is the brother of Q’.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">‘P &amp; Q’ means ‘P is the father of Q’.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If ‘D # C @ B % A * E % F &amp; G’, then how is B related to G?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Father's sister</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mother's brother's wife</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mother's sister</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Father's brother's wife</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Decoding the expression from left to right:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. D # C → D is the sister of C.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. C @ B → C is the son of B.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. B % A → B is the wife of A (thus, A is the father of C and D).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. A * E → A is the brother of E.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. E % F → E is the wife of F (thus, E is female and the sister of A).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. F &amp; G → F is the father of G.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since E is the wife of F, E is the mother of G.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Now, E's brother is A (G's mother's brother / maternal uncle), and B is A's wife.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, B is G's mother's brother's wife (maternal aunt / mami).</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following letter-clusters should replace # and % so that the pattern and relationship followed between the letter-cluster pair on the left side of :: is the same as that on the right side of ::?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\"># : PCXN :: RGMT : %</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># = RZCG, % = PJHA</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># = NFSU, % = UDRM</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># = NFSU, % = TDRM</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># = MGSV, % = TCRM</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed between the first and second letter-clusters is based on adding and subtracting consecutive prime numbers (+2, -3, +5, -7) to the positional values of the letters:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For the first pair (# : PCXN):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 1st letter: N (14) + 2 = 16 (P)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 2nd letter: F (6) − 3 = 3 (C)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 3rd letter: S (19) + 5 = 24 (X)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 4th letter: U (21) − 7 = 14 (N)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, # = NFSU.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the same logic to the second pair (RGMT : %):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 1st letter: R (18) + 2 = 20 (T)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 2nd letter: G (7) − 3 = 4 (D)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 3rd letter: M (13) + 5 = 18 (R)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• 4th letter: T (20) − 7 = 13 (M)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, % = TDRM.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, # = NFSU and % = TDRM.</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a certain code language, 'STREAM' is written as 'NDHIGH' and 'FLIGHT' is written as 'GSTLOU'. How will 'GOLDEN' be written in that language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MHWORT</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MHWPRT</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MHVORT</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NHWORT</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the code is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Reverse the order of letters of the given word.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Replace each consonant with its opposite letter in the English alphabet (sum of positional values is 27).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Shift each vowel forward by +3 positions.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying this to 'STREAM':</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Reversed word: M - A - E - R - T - S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• M (Consonant) → Opposite letter is N</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• A (Vowel) → A + 3 = D</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• E (Vowel) → E + 3 = H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• R (Consonant) → Opposite letter is I</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• T (Consonant) → Opposite letter is G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• S (Consonant) → Opposite letter is H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Result: </span><span style=\"font-weight:bold\">NDHIGH</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying this to 'FLIGHT':</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Reversed word: T - H - G - I - L - F</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• T (Consonant) → Opposite letter is G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• H (Consonant) → Opposite letter is S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• G (Consonant) → Opposite letter is T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• I (Vowel) → I + 3 = L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• L (Consonant) → Opposite letter is O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• F (Consonant) → Opposite letter is U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Result: </span><span style=\"font-weight:bold\">GSTLOU</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly, for 'GOLDEN':</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Reversed word: N - E - D - L - O - G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• N (Consonant) → Opposite letter is M</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• E (Vowel) → E + 3 = H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• D (Consonant) → Opposite letter is W</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• L (Consonant) → Opposite letter is O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• O (Vowel) → O + 3 = R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• G (Consonant) → Opposite letter is T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Result: </span><span style=\"font-weight:bold\">MHWORT</span></p>", "question_heading": ""}, {"sr_no": 52, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If '+' means '×', '−' means '÷', '×' means '+ nclusion I or II is true</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither conclusion I nor II is true</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements, we can link the relationship between </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image069.png\" width=\"11\" height=\"21\" alt style=\"vertical-align:middle\" ><span> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image070.png\" width=\"10\" height=\"21\" alt style=\"vertical-align:middle\" ><span>:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image071.png\" width=\"42\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image072.png\" width=\"43\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image073.png\" width=\"42\" height=\"21\" alt style=\"vertical-align:middle\" ><span> (since </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image074.png\" width=\"42\" height=\"21\" alt style=\"vertical-align:middle\" ><span>)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combining these gives:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image075.png\" width=\"165\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The relation </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image076.png\" width=\"42\" height=\"21\" alt style=\"vertical-align:middle\" ><span> means either </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image077.png\" width=\"42\" height=\"21\" alt style=\"vertical-align:middle\" ><span> or </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image078.png\" width=\"42\" height=\"21\" alt style=\"vertical-align:middle\" ><span> must be true.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Individually, neither conclusion I (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image077.png\" width=\"42\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) nor conclusion II (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image078.png\" width=\"42\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) is definitely true on its own, but together they form a complementary pair covering all possibilities of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image079.png\" width=\"21\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, either conclusion I or II is true.</span></p>", "question_heading": ""}, {"sr_no": 56, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In this question, a statement is followed by two courses of action, numbered I and II. You must assume everything in the statement to be true and on the basis of the information given in the statement, decide which of the course(s) of action logically follow(s) for pursuing.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statement: Following the introduction of automated production lines, a manufacturing plant experienced an unexpected </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image080.png\" width=\"34\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> decline in quarterly output, accompanied by frequent equipment malfunctions and a sharp rise in worker absenteeism.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Courses of Action:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. The plant management should conduct a comprehensive technical audit of the machinery while organizing structured re-skilling and equipment-handling workshops for the operational staff.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. The management should establish an employee feedback and counseling channel to address ergonomic difficulties and workplace anxiety stemming from the shift to automation.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only I follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only II follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither I nor II follows</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both I and II follow</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both courses of action I and II logically follow.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">Course of Action I:</span><span> The statement points out equipment malfunctions and a fall in output following automation. Conducting a technical audit of the machinery and providing structured re-skilling workshops directly resolves operational incompetence and mechanical failures. Hence, I is a constructive and relevant course of action.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">Course of Action II:</span><span> A simultaneous spike in absenteeism immediately after modernizing workflows indicates psychological friction, fear of redundancy, or ergonomic challenges. Establishing feedback and counseling channels addresses the behavioral root cause constructively rather than resorting to ineffective punitive measures. Hence, II also follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, both I and II follow.</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a row of students all facing north, Rohan is 8th from the left end. Sumit is 18th from the left end. Sumit is sitting exactly halfway between Rohan and Karan. If Karan is 12th from the right end of the row, how many students are there in the row?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>38</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>39</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>41</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Rohan's position from the left end = 8th.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Sumit's position from the left end = 18th.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Number of persons between Rohan and Sumit = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image081.png\" width=\"104\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Since Sumit is exactly in the middle between Rohan and Karan, there must also be 9 persons between Sumit and Karan.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Therefore, Karan's position from the left end = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image082.png\" width=\"113\" height=\"21\" alt style=\"vertical-align:middle\" ><span>th.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. Karan is also 12th from the right end.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7. Total number of students = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image083.png\" width=\"466\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Eight persons P, Q, R, S, T, U, V and W are sitting in a straight line facing north. T sits third to the left of W, and neither of them sits at any of the extreme ends. Only three persons sit between T and P, who sits to the immediate left of R. S sits to the immediate left of W. Q sits fourth to the left of S. U sits somewhere to the left of V. Who sits third to the right of U?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>W</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the eight positions from left to right be numbered 1 to 8.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. T sits third to the left of W, and neither sits at an extreme end. So, the possible pairs for (T, W) are (2, 5), (3, 6), or (4, 7).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. S sits to the immediate left of W, and Q sits fourth to the left of S:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If W = 5, then S = 4, which means Q would be at position 0 (not possible).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If W = 7, then S = 6, Q = 2, and T = 4. Three persons sit between T and P, so P would be at position 8 (leaving no space for R to its immediate right) or position 0 (not possible).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, W = 6, S = 5, T = 3, and Q = 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Three persons sit between T (position 3) and P, so P is at position 7. R sits to the immediate right of P, so R is at position 8.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. The remaining positions are 2 and 4. Since U sits to the left of V, U is at position 2 and V is at position 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The final arrangement from left to right is: </span><span style=\"font-weight:bold\">Q, U, T, V, S, W, P, R</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U is at position 2. The person sitting third to the right of U is at position 2 + 3 = 5, who is </span><span style=\"font-weight:bold\">S</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Given below is a question followed by two statements I and II. Read both statements carefully to decide which statement is sufficient to answer the question.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Six persons - A, B, C, D, E, and F are sitting around a circular table facing the centre. Who sits opposite to C?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(I) A sits second to the left of C. E sits to the immediate right of A. Only one person sits between E and B. B is not an immediate neighbour of C.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(II) D sits second to the right of B. F sits to the immediate left of D. C is not an immediate neighbour of B.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in statement II alone is sufficient to answer the question while data in statement I is not.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in statement I alone is sufficient to answer the question while data in statement II is not.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in statements I and II together are NOT sufficient to answer the question.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data in statements I and II together are sufficient to answer the question.</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Consider 6 positions numbered 1 to 6 in a clockwise direction around the circle facing the centre:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">From Statement I:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Let C be at position 1. Since all face the centre, moving clockwise is to the left.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. A sits second to the left of C, so A is at position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. E sits to the immediate right of A (counter-clockwise), so E is at position 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Exactly one person sits between E and B. Starting from position 2, B can either be at position 4 or position 6. Since B is not an immediate neighbour of C (position 1), B cannot be at position 6. Hence, B must be at position 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. In a 6-person circle, position 4 is directly opposite to position 1. Thus, B sits opposite to C. Hence, Statement I alone is sufficient.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">From Statement II:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Let B be at position 1. D sits second to the right of B (counter-clockwise), so D is at position 5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. F sits to the immediate left of D (clockwise), so F is at position 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. C is not a neighbour of B, so C cannot be at position 2. This leaves position 3 or position 4 for C.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. If C is at position 3, the person opposite to C is at position 6 (F). If C is at position 4, the person opposite to C is at position 1 (B). Since there are two possibilities, Statement II alone is not sufficient.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, data in statement I alone is sufficient to answer the question while data in statement II is not.</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a class, among the students who passed the annual examination, Priya is ranked 15th from the top and Chetan, who is ranked lower than Priya, is 29 from the bottom. If there are 8 students ranked between Priya and Chetan, and the ratio of students who passed to those who failed is 4 : 1, how many total students are there in the class given that 5 students did not appear for the examination?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>65</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>70</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>72</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>68</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 1: Find the number of passed students.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since Priya is ranked higher than Chetan:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total passed students = (Priya's rank from top) + (Students between them) + (Chetan's rank from bottom)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image084.png\" width=\"142\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 2: Find the number of failed students.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ratio of passed to failed students = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image085.png\" width=\"22\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Number of failed students = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image086.png\" width=\"80\" height=\"29\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 3: Calculate the total number of students in the class.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total students = Passed + Failed + Did not appear</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794104992525_image087.png\" width=\"142\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct direct speech form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The employees asked if their    manager would approve their leave.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The employees said, \"Would our manager approve our leave?\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    The employees asked, \"If our manager will approve our leave?\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    The employees said, \"Will our manager approve our leave?\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    The employees said, \"Will their manager approved their    leave?\"</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert an indirect interrogative sentence into direct speech:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb 'asked' changes to 'said' followed by inverted commas.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    conjunction 'if' is removed, and the sentence changes into a    direct interrogative structure starting with the auxiliary verb.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Modal 'would'    changes back to 'will' in direct speech.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    third-person possessive pronoun 'their' changes to the    first-person 'our' to reflect the direct words of 'the employees'.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct direct    speech is: <b>The employees said, \"Will our manager approve    our leave?\"</b></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Rearrange the parts of the sentence in the correct order.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Despite    rigorous measures implemented by the central bank</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">P. thereby    undermining public confidence in monetary policy</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Q. to    stabilize the volatile currency,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R. and    triggering widespread demands for structural economic reforms.</p>    <p style=\"orphans:0;widows:0\">S. persistent inflationary    pressures continued to erode purchasing power,</p>", "option1": "<p style=\"orphans:0;widows:0\">    QSPR</p>", "option2": " <p style=\"orphans:0;widows:0\">    QPSR</p>", "option3": " <p style=\"orphans:0;widows:0\">    SQPR</p>", "option4": " <p style=\"orphans:0;widows:0\">    SPRQ</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sequence is <b>QSPR</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    sentence begins with the prepositional phrase: <i>\"Despite    rigorous measures implemented by the central bank...\"</i>.    The noun phrase 'measures implemented' naturally connects with the    infinitive phrase of purpose in <b>Q</b> (<i>\"to stabilize    the volatile currency,\"</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Following    the dependent concessive clause, the main clause must introduce    the subject and main verb, which is found in <b>S</b> (<i>\"persistent    inflationary pressures continued to erode purchasing power,\"</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Part <b>P</b>    (<i>\"thereby undermining public confidence in monetary    policy\"</i>) is a participial clause describing the    consequence of the eroding purchasing power.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Part <b>R</b>    (<i>\"and triggering widespread demands for structural    economic reforms.\"</i>) provides a parallel participial    phrase joined by the conjunction 'and' (undermining... and    triggering...).</p>    <p style=\"orphans:0;widows:0\">Hence, the coherent sentence is:    <i>\"Despite rigorous measures implemented by the central bank    to stabilize the volatile currency, persistent inflationary    pressures continued to erode purchasing power, thereby undermining    public confidence in monetary policy and triggering widespread    demands for structural economic reforms.\"</i></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that best expresses the meaning of the idiom    highlighted in bold in the given sentence.</p>    <p style=\"orphans:0;widows:0\">The young diplomat was warned    that speaking openly to the press about the covert negotiations    would be <b>sailing close to the wind</b>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Following established official protocol strictly</p>", "option2": " <p style=\"orphans:0;widows:0\">    Acting near the verge of what is safe, permissible, or legal</p>", "option3": " <p style=\"orphans:0;widows:0\">    Causing an accidental revelation without any intention</p>", "option4": " <p style=\"orphans:0;widows:0\">    Gaining an unfair advantage over rivals through deception</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The idiom <b>'sail close to the wind'</b> means to act right on    the edge of what is safe, legal, or socially acceptable, thereby    taking a serious risk.</p>    <p style=\"orphans:0;widows:0\">In the given context, the    diplomat is warned that speaking publicly about covert talks    borders on dangerous or prohibited behavior. Hence, option B    correctly captures this meaning.</p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate antonym of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Peripatetic</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Itinerant</p>", "option2": " <p style=\"orphans:0;widows:0\">    Wayfaring</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sedentary</p>", "option4": " <p style=\"orphans:0;widows:0\">    Nomadic</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>Peripatetic</b> means traveling from place to place,    in particular working or based in various places for relatively    short periods (wandering or nomadic).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Sedentary</b>    means staying in one place, seated, or not moving about, which is    the direct antonym.</p>    <p style=\"orphans:0;widows:0\">• <i>Itinerant</i>, <i>Wayfaring</i>,    and <i>Nomadic</i> are synonyms of peripatetic.</p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"orphans:0;widows:0\">    Select the option with the <b>correct spelling</b> of the medical    instrument used to measure arterial blood pressure.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Sphigmomanometer</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sphygmomanometer</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sphygmamanometer</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sphygmonanometer</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The correctly spelt word is <b>Sphygmomanometer</b>. It is derived    from the Greek root <i>sphygmos</i> (meaning 'pulse') combined    with <i>manometer</i> (an instrument for measuring fluid    pressure). Hence, option B is correct.</p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a <b>one-word substitute</b>    for the given group of words.</p>    <p style=\"orphans:0;widows:0\">'A person who demands strict,    uncompromising adherence to rules and discipline'</p>", "option1": "<p style=\"orphans:0;widows:0\">    Martinet</p>", "option2": " <p style=\"orphans:0;widows:0\">    Dilettante</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sybarite</p>", "option4": " <p style=\"orphans:0;widows:0\">    Truant</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitute is <b>Martinet</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Martinet</b>:    A person who demands complete, strict obedience to regulations and    discipline.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Dilettante</b>:    A person who cultivates an area of interest (such as the arts)    superficially, without real knowledge or commitment.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sybarite</b>:    A person who is devoted to luxury and sensuous pleasure.</p>    <p style=\"orphans:0;widows:0\"><b>Truant</b>: A person    (especially a student) who stays away from school or duties    without permission.</p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate option to fill in the blank:</b></p>    <p style=\"orphans:0;widows:0\">Not until the team leader    intervened ________ to settle their mutual grievances amicably.</p>", "option1": "<p style=\"orphans:0;widows:0\">    were the members able</p>", "option2": " <p style=\"orphans:0;widows:0\">    the members were able</p>", "option3": " <p style=\"orphans:0;widows:0\">    did the members be able</p>", "option4": " <p style=\"orphans:0;widows:0\">    had the members been able</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>were the members able</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rule of    Inversion:</b> When a sentence begins with a negative or    restrictive time adverbial phrase such as <i>Not until...</i>,    <i>Only after...</i>, or <i>Only when...</i>, the main clause that    follows must undergo subject-verb inversion (Auxiliary / Linking    Verb + Subject + Main Verb/Complement).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    subordinate clause (<i>the team leader intervened</i>) retains    normal subject-verb order.</p>    <p style=\"orphans:0;widows:0\">2. The main clause requires    inversion. Since 'able' is an adjective, it requires the    past-tense linking verb 'were' rather than the do-support    auxiliary 'did'. Therefore, the inverted structure is <b>were</b>    (verb) + <b>the members</b> (subject) + <b>able</b> (adjective    complement).</p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Find the part of the sentence that contains an error:</b></p>    <p style=\"orphans:0;widows:0\">The reason why the international    delegation (1)/ cancelled the scheduled bilateral talks (2)/ was    because both nations failed to reach (3)/ a consensus on    territorial disputes. (4)</p>", "option1": "<p style=\"orphans:0;widows:0\">    (1)</p>", "option2": " <p style=\"orphans:0;widows:0\">    (2)</p>", "option3": " <p style=\"orphans:0;widows:0\">    (3)</p>", "option4": " <p style=\"orphans:0;widows:0\">    (4)</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The error lies in part (3) of the sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rule:</b>    The expression <i>'The reason why...'</i> must be followed by the    conjunction <b>'that'</b>, not <b>'because'</b>. Since <i>'The    reason why'</i> already indicates cause, using <i>'because'</i> is    redundant (superfluous).</p>    <p style=\"orphans:0;widows:0\">Therefore, replace <b>'was    because'</b> with <b>'was that'</b> to make the sentence    grammatically correct.</p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in indirect    speech.</p>    <p style=\"orphans:0;widows:0\">The manager said to him, “Why    are you leaving the office so early today?”</p>", "option1": "<p style=\"orphans:0;widows:0\">    The manager asked him why was he leaving the office so early that    day.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The manager asked him why he was leaving the office so early that    day.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The manager told him why he is leaving the office so early today.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The manager asked him that why he was leaving the office so early    that day.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct indirect speech form is: <b>The manager asked him why    he was leaving the office so early that day.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rules of    conversion:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    reporting verb <i>said to</i> changes to <i>asked</i> in an    interrogative sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. For 'Wh-'    questions, no conjunction like <i>that</i> or <i>if/whether</i> is    used; the question word (<i>why</i>) itself acts as the joining    word.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. The    interrogative structure is changed into an assertive structure    (Subject + Verb), so <i>why are you leaving</i> becomes <i>why he    was leaving</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Present    Continuous tense (<i>are leaving</i>) changes to Past Continuous    tense (<i>was leaving</i>).</p>    <p style=\"orphans:0;widows:0\">5. The time expression <i>today</i>    changes to <i>that day</i>.</p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the option that expresses the given sentence in passive    voice:</b></p>    <p style=\"orphans:0;widows:0\">The administration should not    have entertained such frivolous complaints.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Such frivolous complaints should not be entertained by the    administration.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Such frivolous complaints were not to be entertained by the    administration.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Such frivolous complaints should not have been entertained by the    administration.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Such frivolous complaints could not have been entertained by the    administration.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the active voice with a modal perfect    construction: <i>Subject + should not have + V3 (entertained) +    Object</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">To convert    this structure into the passive voice, the rule is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Object +    should not have been + V3 + (by + Subject)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Applying this    rule:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Active: The    administration (Subject) should not have entertained (verb) such    frivolous complaints (Object).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive: Such    frivolous complaints + should not have been + entertained + by the    administration.</p>    <p style=\"orphans:0;widows:0\">Hence, option C is the correct    passive form.</p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>A sentence is provided in indirect speech. From the four given    options, choose the one that most accurately conveys the sentence    in its corresponding direct speech.</b></p>    <p style=\"orphans:0;widows:0\">Rohan said that had he left on    time, he would have caught the train.</p>", "option1": "<p style=\"orphans:0;widows:0\">Had I left on time, I would catch the train,” said Rohan.</p>", "option2": " <p style=\"orphans:0;widows:0\">If I leave on time, I will catch the train,” said Rohan.</p>", "option3": " <p style=\"orphans:0;widows:0\">Had I left on time, I would have caught the train,” said    Rohan.</p>", "option4": " <p style=\"orphans:0;widows:0\">If only I had left on time, I might catch the train,” said    Rohan.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The given sentence in indirect speech contains an unreal past    conditional structure (third conditional with inversion: <i>Had +    subject + V3 ..., subject + would have + V3</i>). When converting    such third conditional sentences into direct speech, the verb    forms and modal combinations remain unchanged; only the    third-person pronoun referring back to the speaker ('he') shifts    to the first-person pronoun ('I'). Therefore, the correct direct    speech is: <b>“Had I left on time, I would have caught the    train,” said Rohan.</b></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the passage carefully and answer the questions that follow.    Julian was articulate and kind-hearted, but possessed little    savings and no established academic standing. He wished to    undertake a prestigious overseas fellowship, yet his mentor    insisted that Julian must first demonstrate genuine selflessness    beyond mere intellectual ambition. One evening, Julian visited an    antiquarian bookshop run by an eccentric collector who was    evaluating a collection of manuscripts. Near the door stood a    frail, dishevelled traveller clutching a battered, water-damaged    journal. The man appeared so worn and wretched from the freezing    rain that Julian felt immediate sympathy for him. Overhearing the    shopkeeper turn the wanderer away without a coin, Julian searched    his coat and drew out his last remaining silver coins. Although he    could scarcely afford to surrender the rent money he desperately    required, he placed the coins into the stranger's hand and    accepted the ruined journal. The old man thanked him with    dignified warmth. The next day, the shopkeeper informed Julian    that the destitute traveller was actually Master Vance, one of the    most prominent scholars and benefactors in the field. Vance had    deliberately wandered in rags to observe how young scholars    treated the vulnerable. Julian was deeply embarrassed. He imagined    that the distinguished master would laugh at his naive attempt to    offer charity. By midday, however, an envoy arrived bearing an    official letter from the fellowship board. It awarded Julian the    research post, accompanied by a personal note from \"an old    traveller.\" The episode reveals that true virtue is defined    not by erudition, but by sacrifice. Julian gave away his only    means of comfort without seeking acclaim, and Vance honoured a    kindness born of unvarnished empathy.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">Why did the mentor hesitate to    approve Julian’s fellowship recommendation?</p>", "option1": "<p style=\"orphans:0;widows:0\">    He doubted Julian’s ability to handle challenging archival work    abroad.</p>", "option2": " <p style=\"orphans:0;widows:0\">    He disliked Julian’s habit of spending time in antiquarian    bookshops.</p>", "option3": " <p style=\"orphans:0;widows:0\">    He expected Julian to demonstrate genuine selflessness beyond    scholarly ambition.</p>", "option4": " <p style=\"orphans:0;widows:0\">    He believed Julian lacked sufficient dedication to ancient    manuscripts.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage explicitly states that Julian's mentor \"insisted    that Julian must first demonstrate genuine selflessness beyond    mere intellectual ambition.\" Hence, Option C is the correct    answer.</p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the passage carefully and answer the questions that follow.    Julian was articulate and kind-hearted, but possessed little    savings and no established academic standing. He wished to    undertake a prestigious overseas fellowship, yet his mentor    insisted that Julian must first demonstrate genuine selflessness    beyond mere intellectual ambition. One evening, Julian visited an    antiquarian bookshop run by an eccentric collector who was    evaluating a collection of manuscripts. Near the door stood a    frail, dishevelled traveller clutching a battered, water-damaged    journal. The man appeared so worn and wretched from the freezing    rain that Julian felt immediate sympathy for him. Overhearing the    shopkeeper turn the wanderer away without a coin, Julian searched    his coat and drew out his last remaining silver coins. Although he    could scarcely afford to surrender the rent money he desperately    required, he placed the coins into the stranger's hand and    accepted the ruined journal. The old man thanked him with    dignified warmth. The next day, the shopkeeper informed Julian    that the destitute traveller was actually Master Vance, one of the    most prominent scholars and benefactors in the field. Vance had    deliberately wandered in rags to observe how young scholars    treated the vulnerable. Julian was deeply embarrassed. He imagined    that the distinguished master would laugh at his naive attempt to    offer charity. By
