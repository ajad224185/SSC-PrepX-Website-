e. Julian was deeply embarrassed. He imagined    that the distinguished master would laugh at his naive attempt to    offer charity. By midday, however, an envoy arrived bearing an    official letter from the fellowship board. It awarded Julian the    research post, accompanied by a personal note from \"an old    traveller.\" The episode reveals that true virtue is defined    not by erudition, but by sacrifice. Julian gave away his only    means of comfort without seeking acclaim, and Vance honoured a    kindness born of unvarnished empathy.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">What made Julian’s gesture    especially meaningful to Master Vance?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Julian offered it despite knowing that Vance was testing    applicants.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Julian intended it to earn a favourable reference from the    shopkeeper.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Julian gave it sincerely while believing the recipient was    destitute.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Julian expected the recipient to return the money once he found    shelter.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage highlights that Vance honoured a kindness \"born    of unvarnished empathy,\" given without seeking acclaim and    under the assumption that the traveller was genuinely helpless.    Hence, Option C is correct.</p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the passage carefully and answer the questions that follow.    Julian was articulate and kind-hearted, but possessed little    savings and no established academic standing. He wished to    undertake a prestigious overseas fellowship, yet his mentor    insisted that Julian must first demonstrate genuine selflessness    beyond mere intellectual ambition. One evening, Julian visited an    antiquarian bookshop run by an eccentric collector who was    evaluating a collection of manuscripts. Near the door stood a    frail, dishevelled traveller clutching a battered, water-damaged    journal. The man appeared so worn and wretched from the freezing    rain that Julian felt immediate sympathy for him. Overhearing the    shopkeeper turn the wanderer away without a coin, Julian searched    his coat and drew out his last remaining silver coins. Although he    could scarcely afford to surrender the rent money he desperately    required, he placed the coins into the stranger's hand and    accepted the ruined journal. The old man thanked him with    dignified warmth. The next day, the shopkeeper informed Julian    that the destitute traveller was actually Master Vance, one of the    most prominent scholars and benefactors in the field. Vance had    deliberately wandered in rags to observe how young scholars    treated the vulnerable. Julian was deeply embarrassed. He imagined    that the distinguished master would laugh at his naive attempt to    offer charity. By midday, however, an envoy arrived bearing an    official letter from the fellowship board. It awarded Julian the    research post, accompanied by a personal note from \"an old    traveller.\" The episode reveals that true virtue is defined    not by erudition, but by sacrifice. Julian gave away his only    means of comfort without seeking acclaim, and Vance honoured a    kindness born of unvarnished empathy.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">Which inference best explains the    contrast between Julian’s silver coins and Master Vance’s    fellowship offer?</p>", "option1": "<p style=\"orphans:0;widows:0\">    The coins represent financial carelessness, whereas the offer    represents calculated patronage.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The coins are spent in ignorance, whereas the offer is made to    display Vance’s influence.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The coins expose Julian’s poor judgment, whereas the offer    corrects his misunderstanding.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The coins reveal generosity through sacrifice, whereas the offer    recognises that moral quality.</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Julian sacrificed his essential living expenses to aid a stranger    without expecting anything, while Vance's fellowship award served    to acknowledge and reward that selfless character. Thus, Option D    is the correct interpretation.</p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Rearrange the parts of the sentence in the correct order.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In a major    advancement for clean energy,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">P. promising    a significant reduction in global carbon emissions,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Q.    researchers at the national laboratory developed a highly    efficient solar cell,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R. capable of    generating electricity even under low-light conditions,</p>    <p style=\"orphans:0;widows:0\">S. although commercial production    on a large scale remains a future challenge.</p>", "option1": "<p style=\"orphans:0;widows:0\">    QSRP</p>", "option2": " <p style=\"orphans:0;widows:0\">    QRPS</p>", "option3": " <p style=\"orphans:0;widows:0\">    RQPS</p>", "option4": " <p style=\"orphans:0;widows:0\">    PSQR</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct order is <b>QRPS</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Following    the introductory prepositional phrase (\"In a major    advancement for clean energy,\"), the sentence requires a    subject and a finite verb. Part <b>Q</b> supplies this main    clause: \"researchers at the national laboratory developed a    highly efficient solar cell\".</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Part <b>R</b>    functions as an adjective phrase directly modifying the noun    \"solar cell\" (\"capable of generating electricity    even under low-light conditions\").</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Part <b>P</b>    is a participial clause indicating the outcome or implication of    this development (\"promising a significant reduction in    global carbon emissions\").</p>    <p style=\"orphans:0;widows:0\">- Part <b>S</b> concludes the    sentence logically by introducing a contrasting reservation with    the conjunction \"although\".</p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate synonym of the given word: <b>LACONIC</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Verbose</p>", "option2": " <p style=\"orphans:0;widows:0\">    Terse</p>", "option3": " <p style=\"orphans:0;widows:0\">    Frugal</p>", "option4": " <p style=\"orphans:0;widows:0\">    Jovial</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct synonym of '<b>LACONIC</b>' is '<b>Terse</b>'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Laconic</b>    means using very few words to express what is meant (brief,    concise).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Terse</b>    means sparing in the use of words; concise and to the point.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Verbose</b>    means using or expressed in more words than are needed (an    antonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Frugal</b>    means sparing or economical with regard to money or food.</p>    <p style=\"orphans:0;widows:0\">• <b>Jovial</b> means cheerful    and friendly.</p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct passive form of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">Why had the committee not    disposed of all the pending complaints before the deadline?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Why had all the pending complaints not been disposed off by the    committee before the deadline?</p>", "option2": " <p style=\"orphans:0;widows:0\">    Why had all the pending complaints not been disposed of by the    committee before the deadline?</p>", "option3": " <p style=\"orphans:0;widows:0\">    Why were all the pending complaints not disposed of by the    committee before the deadline?</p>", "option4": " <p style=\"orphans:0;widows:0\">    Why had all the pending complaints not been disposed by the    committee before the deadline?</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct passive voice structure for a past perfect    interrogative-negative sentence is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Wh-word +    had + new subject + not + been + past participle (V3) +    preposition + by + agent + other complements?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Key rules to    note:The tense is Past Perfect ('had not disposed of'), which    changes to 'had not been disposed of' in the passive voice (ruling    out option C, which changes the tense to simple past).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Phrasal verbs    must retain their original prepositions. The correct expression is    'dispose of' (meaning to settle or deal with), not 'dispose off'    (ruling out option A).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    preposition 'of' cannot be omitted (ruling out option D).</p>    <p style=\"orphans:0;widows:0\">Therefore, option B correctly    follows all grammatical rules.</p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Sentences of a paragraph are given below in jumbled order. Arrange    the sentences in the correct order to form a meaningful and    coherent paragraph.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A. The    company had initially promised an error-free software update.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B.    Consequently, thousands of frustrated users demanded a full    refund.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C. However,    severe glitches caused widespread system crashes immediately after    the release.</p>    <p style=\"orphans:0;widows:0\">D. Tech forums were soon flooded    with screenshots of the malfunctioning devices.</p>", "option1": "<p style=\"orphans:0;widows:0\">    ACDB</p>", "option2": " <p style=\"orphans:0;widows:0\">    CADB</p>", "option3": " <p style=\"orphans:0;widows:0\">    BDAC</p>", "option4": " <p style=\"orphans:0;widows:0\">    ABDC</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct order is <b>ACDB</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Sentence <b>A</b>    introduces the topic with the company's initial promise about the    software update.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Sentence <b>C</b>    provides a contrasting turn of events ('However') where severe    glitches occurred right after the release.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Sentence <b>D</b>    elaborates on the immediate public reaction on online platforms    showing evidence of the failure.</p>    <p style=\"orphans:0;widows:0\">- Sentence <b>B</b> concludes the    sequence with the final outcome ('Consequently'), stating that    users demanded refunds.</p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct direct form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The mentor said that she ought to    have prepared thoroughly for the interview.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The mentor said, \"She ought to have prepared thoroughly for    the interview.\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    The mentor said, \"She should prepare thoroughly for the    interview.\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    The mentor said, \"She ought to prepare thoroughly for the    interview.\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    The mentor said, \"She must have prepared thoroughly for the    interview.\"</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Modals like 'ought to', 'ought to have + V3', 'might', 'should',    and 'would' do not change their form when converting between    direct and indirect speech. Since the indirect speech uses the    modal perfect structure 'ought to have prepared' without any shift    in tense or modal auxiliary, the direct speech retains the exact    same construction inside the quotation marks. Hence, the correct    direct sentence is: The mentor said, \"She ought to have    prepared thoroughly for the interview.\"</p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The sentence given below is divided into four segments labelled P,    Q, R, and S. Read the sentence carefully to determine which    segment contains a grammatical, syntactic, or idiomatic error.    Select the letter corresponding to \">    The passage highlights that public reporting tends to oversimplify    multifaceted ecological challenges into simplistic narratives. The    phrase 'reduces [something] into [something simplistic]'    appropriately conveys this meaning. 'Elevates', 'amplifies', and    'diversifies' do not fit the context of oversimplification.</p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the given sentence carefully and select the most appropriate    option to substitute the underlined segment. If no improvement is    required, select 'No improvement required'.</p>    <p style=\"orphans:0;widows:0\">The municipal corporation faced    immense public backlash after the torrential rain <u>had flooded    the lower suburbs and paralyze the transport network</u>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    flooded the lower suburbs and paralyzed the transport network</p>", "option2": " <p style=\"orphans:0;widows:0\">    had flood the lower suburbs and paralyzed the transport network</p>", "option3": " <p style=\"orphans:0;widows:0\">    flooding the lower suburbs and paralyze the transport network</p>", "option4": " <p style=\"orphans:0;widows:0\">    No improvement required</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct substitution is <b>'flooded the lower suburbs and    paralyzed the transport network'</b>.</p>    <p style=\"orphans:0;widows:0\"><b>Reason:</b> In the given    sentence, two actions are connected by the coordinating    conjunction 'and'. According to the rule of parallelism, verbs    linked by coordinating conjunctions must maintain the same    grammatical form and tense. The original sentence incorrectly    pairs the past participle 'flooded' with the base form 'paralyze'.    In option A, both verbs ('flooded' and 'paralyzed') are correctly    placed in the simple past tense (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794108233529_html_74ddc79ca48662e3.gif\" > ),    maintaining proper parallel structure and consistency with the    main clause verb 'faced'.</p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct active form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">A loud noise was heard in the    basement at midnight.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Someone heard a loud noise in the basement at midnight.</p>", "option2": " <p style=\"orphans:0;widows:0\">    A loud noise heard someone in the basement at midnight.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The neighbors have heard a loud noise in the basement at midnight.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Someone was hearing a loud noise in the basement at midnight.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the passive voice in the simple past    tense (was + V3: <i>was heard</i>), and the agent of the action is    omitted. When converting such passive sentences into the active    voice, an indefinite pronoun such as 'someone' is introduced as    the subject.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Structure of    Simple Past Active Voice: <b>Subject + V2 + Object</b>.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct active    form is: <i>Someone heard a loud noise in the basement at    midnight.</i></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the following passage carefully and answer the questions that    follow.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In the grand    courtyard of the royal palace, mounted upon a pedestal of white    marble, stood an intricate mechanical clock. The clock was housed    in an ornate tower of carved ebony, adorned with delicate gilded    filigree. At its centre, a miniature knight in polished brass    struck the passing hours upon a silver bell. The courtiers and    visitors greatly admired the marvellous invention. “It keeps    time with the exactness of the stars,” observed the Chief    Astrologer, who wished to be celebrated for his scientific acumen.    “Nevertheless, it has no soul,” he added hastily, fearing that    his peers might accuse him of idolatry. A strict governess pointed    towards the silent clock and said to a restless young prince, who    was fretting over his Latin grammar, “Why can’t you behave    like the brass knight? The knight never complains about his duty.”    “How enviable to possess such tireless constancy,” sighed an    exhausted clerk as he hurried past with a towering bundle of    ledgers. The cathedral choirboys, dressed in dark cassocks with    stiff white ruffs, stopped to examine the clock after morning    service. “The brass knight looks just like Saint George    conquering the dragon,” one boy remarked with wide eyes. “What    foolishness!” snapped the Schoolmaster, striking his cane    against the flagstones. “You are comparing a heap of springs and    wheels to a blessed martyr!” The Schoolmaster scowled because he    disapproved of equating earthly machinery with sacred mysteries.    Late that evening, an apprentice horologist lingered in the quiet    courtyard. His companions had already departed for the tavern to    celebrate the harvest festival, but he had remained behind because    he was fascinated by a delicate silver bird hidden within the    clockwork. He had noticed an irregular flutter in its tiny    escapement earlier that day while oiling the gears and could not    rest until he had deciphered its movement.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">Why did the Chief Astrologer add    that the mechanical clock had “no soul”?</p>", "option1": "<p style=\"orphans:0;widows:0\">    He feared that his peers might accuse him of idolatry.</p>", "option2": " <p style=\"orphans:0;widows:0\">    He believed that public clocks should serve only a scientific    purpose.</p>", "option3": " <p style=\"orphans:0;widows:0\">    He considered the clock less accurate than natural planetary    movements.</p>", "option4": " <p style=\"orphans:0;widows:0\">    He wanted the device to be dismantled and moved out of the    courtyard.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage explicitly states that the Chief Astrologer added the    remark \"hastily, fearing that his peers might accuse him of    idolatry.\" Therefore, option A is the correct answer.</p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the following passage carefully and answer the questions that    follow.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In the grand    courtyard of the royal palace, mounted upon a pedestal of white    marble, stood an intricate mechanical clock. The clock was housed    in an ornate tower of carved ebony, adorned with delicate gilded    filigree. At its centre, a miniature knight in polished brass    struck the passing hours upon a silver bell. The courtiers and    visitors greatly admired the marvellous invention. “It keeps    time with the exactness of the stars,” observed the Chief    Astrologer, who wished to be celebrated for his scientific acumen.    “Nevertheless, it has no soul,” he added hastily, fearing that    his peers might accuse him of idolatry. A strict governess pointed    towards the silent clock and said to a restless young prince, who    was fretting over his Latin grammar, “Why can’t you behave    like the brass knight? The knight never complains about his duty.”    “How enviable to possess such tireless constancy,” sighed an    exhausted clerk as he hurried past with a towering bundle of    ledgers. The cathedral choirboys, dressed in dark cassocks with    stiff white ruffs, stopped to examine the clock after morning    service. “The brass knight looks just like Saint George    conquering the dragon,” one boy remarked with wide eyes. “What    foolishness!” snapped the Schoolmaster, striking his cane    against the flagstones. “You are comparing a heap of springs and    wheels to a blessed martyr!” The Schoolmaster scowled because he    disapproved of equating earthly machinery with sacred mysteries.    Late that evening, an apprentice horologist lingered in the quiet    courtyard. His companions had already departed for the tavern to    celebrate the harvest festival, but he had remained behind because    he was fascinated by a delicate silver bird hidden within the    clockwork. He had noticed an irregular flutter in its tiny    escapement earlier that day while oiling the gears and could not    rest until he had deciphered its movement.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">What does the exhausted clerk’s    remark about the brass knight reveal?</p>", "option1": "<p style=\"orphans:0;widows:0\">    He believed that the knight had overcome severe mechanical    failure.</p>", "option2": " <p style=\"orphans:0;widows:0\">    He wished to acquire the precious brass and silver from which the    clock was constructed.</p>", "option3": " <p style=\"orphans:0;widows:0\">    He saw in the knight an unwavering diligence that was absent from    his own weary state.</p>", "option4": " <p style=\"orphans:0;widows:0\">    He doubted whether true dedication could exist anywhere within the    royal court.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The exhausted clerk remarks, \"How enviable to possess such    tireless constancy,\" as he hurries past carrying a heavy load    of work. This indicates that he perceives in the tireless    clockwork figure an enduring constancy and relief from fatigue    that he lacks in his own exhausting life. Hence, option C is    correct.</p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the following passage carefully and answer the questions that    follow.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In the grand    courtyard of the royal palace, mounted upon a pedestal of white    marble, stood an intricate mechanical clock. The clock was housed    in an ornate tower of carved ebony, adorned with delicate gilded    filigree. At its centre, a miniature knight in polished brass    struck the passing hours upon a silver bell. The courtiers and    visitors greatly admired the marvellous invention. “It keeps    time with the exactness of the stars,” observed the Chief    Astrologer, who wished to be celebrated for his scientific acumen.    “Nevertheless, it has no soul,” he added hastily, fearing that    his peers might accuse him of idolatry. A strict governess pointed    towards the silent clock and said to a restless young prince, who    was fretting over his Latin grammar, “Why can’t you behave    like the brass knight? The knight never complains about his duty.”    “How enviable to possess such tireless constancy,” sighed an    exhausted clerk as he hurried past with a towering bundle of    ledgers. The cathedral choirboys, dressed in dark cassocks with    stiff white ruffs, stopped to examine the clock after morning    service. “The brass knight looks just like Saint George    conquering the dragon,” one boy remarked with wide eyes. “What    foolishness!” snapped the Schoolmaster, striking his cane    against the flagstones. “You are comparing a heap of springs and    wheels to a blessed martyr!” The Schoolmaster scowled because he    disapproved of equating earthly machinery with sacred mysteries.    Late that evening, an apprentice horologist lingered in the quiet    courtyard. His companions had already departed for the tavern to    celebrate the harvest festival, but he had remained behind because    he was fascinated by a delicate silver bird hidden within the    clockwork. He had noticed an irregular flutter in its tiny    escapement earlier that day while oiling the gears and could not    rest until he had deciphered its movement.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">Why did the Schoolmaster scowl at    the choirboy’s comparison?</p>", "option1": "<p style=\"orphans:0;widows:0\">    He thought that the boy had neglected his morning prayers at the    cathedral.</p>", "option2": " <p style=\"orphans:0;widows:0\">    He believed that the boy was intentionally mocking the royal    clockmaker.</p>", "option3": " <p style=\"orphans:0;widows:0\">    He suspected that the choirboys were inventing excuses to avoid    their studies.</p>", "option4": " <p style=\"orphans:0;widows:0\">    He disapproved of equating earthly machinery with sacred    mysteries.</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage directly mentions: \"The Schoolmaster scowled    because he disapproved of equating earthly machinery with sacred    mysteries.\" Therefore, option D is the correct choice.</p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the following passage carefully and answer the questions that    follow.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In the grand    courtyard of the royal palace, mounted upon a pedestal of white    marble, stood an intricate mechanical clock. The clock was housed    in an ornate tower of carved ebony, adorned with delicate gilded    filigree. At its centre, a miniature knight in polished brass    struck the passing hours upon a silver bell. The courtiers and    visitors greatly admired the marvellous invention. “It keeps    time with the exactness of the stars,” observed the Chief    Astrologer, who wished to be celebrated for his scientific acumen.    “Nevertheless, it has no soul,” he added hastily, fearing that    his peers might accuse him of idolatry. A strict governess pointed    towards the silent clock and said to a restless young prince, who    was fretting over his Latin grammar, “Why can’t you behave    like the brass knight? The knight never complains about his duty.”    “How enviable to possess such tireless constancy,” sighed an    exhausted clerk as he hurried past with a towering bundle of    ledgers. The cathedral choirboys, dressed in dark cassocks with    stiff white ruffs, stopped to examine the clock after morning    service. “The brass knight looks just like Saint George    conquering the dragon,” one boy remarked with wide eyes. “What    foolishness!” snapped the Schoolmaster, striking his cane    against the flagstones. “You are comparing a heap of springs and    wheels to a blessed martyr!” The Schoolmaster scowled because he    disapproved of equating earthly machinery with sacred mysteries.    Late that evening, an apprentice horologist lingered in the quiet    courtyard. His companions had already departed for the tavern to    celebrate the harvest festival, but he had remained behind because    he was fascinated by a delicate silver bird hidden within the    clockwork. He had noticed an irregular flutter in its tiny    escapement earlier that day while oiling the gears and could not    rest until he had deciphered its movement.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">Which of the following best    describes the irony in the governess’s statement to the young    prince?</p>", "option1": "<p style=\"orphans:0;widows:0\">    She expects a young child to comprehend the technical workings of    an intricate machine.</p>", "option2": " <p style=\"orphans:0;widows:0\">    She holds up an unthinking, inanimate mechanism as a model of    human patience and duty.</p>", "option3": " <p style=\"orphans:0;widows:0\">    She praises the knight’s obedience while ignoring the royal    status of the young prince.</p>", "option4": " <p style=\"orphans:0;widows:0\">    She scolds the boy for fretting while she herself is acting with    visible impatience.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The governess tells the prince to behave like the brass knight    because \"the knight never complains about his duty.\" The    irony lies in the fact that she expects a human child to emulate    the compliance of an unfeeling, inanimate machine that has no    consciousness or choice. Thus, option B is correct.</p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Read the following passage carefully and answer the questions    that follow.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In the grand    courtyard of the royal palace, mounted upon a pedestal of white    marble, stood an intricate mechanical clock. The clock was housed    in an ornate tower of carved ebony, adorned with delicate gilded    filigree. At its centre, a miniature knight in polished brass    struck the passing hours upon a silver bell. The courtiers and    visitors greatly admired the marvellous invention. “It keeps    time with the exactness of the stars,” observed the Chief    Astrologer, who wished to be celebrated for his scientific acumen.    “Nevertheless, it has no soul,” he added hastily, fearing that    his peers might accuse him of idolatry. A strict governess pointed    towards the silent clock and said to a restless young prince, who    was fretting over his Latin grammar, “Why can’t you behave    like the brass knight? The knight never complains about his duty.”    “How enviable to possess such tireless constancy,” sighed an    exhausted clerk as he hurried past with a towering bundle of    ledgers. The cathedral choirboys, dressed in dark cassocks with    stiff white ruffs, stopped to examine the clock after morning    service. “The brass knight looks just like Saint George    conquering the dragon,” one boy remarked with wide eyes. “What    foolishness!” snapped the Schoolmaster, striking his cane    against the flagstones. “You are comparing a heap of springs and    wheels to a blessed martyr!” The Schoolmaster scowled because he    disapproved of equating earthly machinery with sacred mysteries.    Late that evening, an apprentice horologist lingered in the quiet    courtyard. His companions had already departed for the tavern to    celebrate the harvest festival, but he had remained behind because    he was fascinated by a delicate silver bird hidden within the    clockwork. He had noticed an irregular flutter in its tiny    escapement earlier that day while oiling the gears and could not    rest until he had deciphered its movement.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">Which inference can most    reasonably be drawn from the apprentice’s decision to remain    behind?</p>", "option1": "<p style=\"orphans:0;widows:0\">    He had been ordered by the master clockmaker to complete    additional chores as a punishment.</p>", "option2": " <p style=\"orphans:0;widows:0\">    He intended to leave his apprenticeship permanently because he    despised festive gatherings.</p>", "option3": " <p style=\"orphans:0;widows:0\">    His lack of money prevented him from joining his fellow    apprentices at the tavern.</p>", "option4": " <p style=\"orphans:0;widows:0\">    His intense intellectual curiosity led him to postpone taking part    in the evening’s festivities.</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage states that the apprentice stayed behind because \"he    was fascinated by a delicate silver bird hidden within the    clockwork\" and \"could not rest until he had deciphered    its movement.\" This shows that his curiosity and dedication    to understanding the mechanism caused him to forego the harvest    celebration with his peers. Therefore, option D is the correct    inference.</p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate phrasal verb to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">The management decided to ______    the outdated attendance system and adopt a more flexible digital    platform.</p>", "option1": "<p style=\"orphans:0;widows:0\">    do up</p>", "option2": " <p style=\"orphans:0;widows:0\">    do away with</p>", "option3": " <p style=\"orphans:0;widows:0\">    do down</p>", "option4": " <p style=\"orphans:0;widows:0\">    do without</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct phrasal verb to fill in the blank is <b>do away with</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Do     away with</b> means to get rid of, abolish, or stop using     something. Here, it refers to abolishing or discarding the     outdated attendance system.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Do up</b>     means to fasten (e.g., clothes) or to renovate/redecorate a     building.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Do     down</b> means to criticize someone unfairly or belittle them.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Do     without</b> means to manage or survive in the absence of     something.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence, option B is the correct    answer.</p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Had the driver not applied the    brakes immediately, a fatal accident ________.</p>", "option1": "<p style=\"orphans:0;widows:0\">    will occur</p>", "option2": " <p style=\"orphans:0;widows:0\">    would occur</p>", "option3": " <p style=\"orphans:0;widows:0\">    would have occurred</p>", "option4": " <p style=\"orphans:0;widows:0\">    had occurred</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The given sentence is an inverted third conditional sentence (an    unreal past condition starting with 'Had + subject + past    participle'). The standard structure for such inverted    conditionals is: <b>Had + Subject + V3..., Subject + would have +    V3...</b>. Hence, the correct phrase to complete the clause is    <b>would have occurred</b>.</p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the option that expresses the given sentence in passive    voice:</b></p>    <p style=\"orphans:0;widows:0\">The management is expected to    address the employees' grievances soon.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The employees' grievances were expected to be addressed soon by    the management.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Addressing the employees' grievances is expected soon by the    management.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The employees' grievances are expected to be addressed soon by the    management.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The management was expected to have addressed the employees'    grievances.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the active voice containing an infinitive    phrase: <i>Subject + is expected + to + V1 (address) + Object (the    employees' grievances)</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">To convert    this into the passive voice:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     object of the infinitive phrase (<b>the employees' grievances</b>)     becomes the new subject.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Since     the new subject is plural and the tense is simple present, the     helping verb changes from <b>is</b> to <b>are</b> (<i>are     expected</i>).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     active infinitive <b>to address</b> changes to the passive     infinitive <b>to be addressed</b> (<i>to be + V3</i>).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     original subject becomes the agent preceded by 'by': <b>by the     management</b>.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, the correct passive    form is: <i>\"The employees' grievances are expected to be    addressed soon by the management.\"</i></p>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words:</p>    <p style=\"orphans:0;widows:0\"><b>\"A person who pretends to    be someone else in order to deceive others\"</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Mentor</p>", "option2": " <p style=\"orphans:0;widows:0\">    Impostor</p>", "option3": " <p style=\"orphans:0;widows:0\">    Philanthropist</p>", "option4": " <p style=\"orphans:0;widows:0\">    Hermit</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitute is <b>Impostor</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Impostor:</b>    A person who pretends to be someone else in order to deceive    others.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Mentor:</b>    An experienced and trusted adviser.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Philanthropist:</b>    A person who donates money, time, or goods to help others.</p>    <p style=\"orphans:0;widows:0\"><b>Hermit:</b> A person living in    solitude, often for religious reasons.</p>", "question_heading": ""}, {"sr_no": 100, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Fill in the blank with the most appropriate option:</b></p>    <p style=\"orphans:0;widows:0\">The instructions for assembling    the machine were so ________ that even experienced engineers found    them difficult to follow.</p>", "option1": "<p style=\"orphans:0;widows:0\">    lucid</p>", "option2": " <p style=\"orphans:0;widows:0\">    convoluted</p>", "option3": " <p style=\"orphans:0;widows:0\">    explicit</p>", "option4": " <p style=\"orphans:0;widows:0\">    precise</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>convoluted</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'Convoluted'    means extremely complex, intricate, and difficult to follow. The    context clue \"even experienced engineers found them difficult    to follow\" clearly indicates that the instructions were    overly complicated.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>lucid:</b>    clearly expressed and easy to understand.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>explicit:</b>    stated clearly and in detail, leaving no room for confusion.</p>    <p style=\"orphans:0;widows:0\"><b>precise:</b> marked by    exactness and accuracy.</p>", "question_heading": ""}, {"sr_no": 101, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Rearrange the following sentences in correct order to make a    meaningful passage.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Selected    applicants were called for personal interviews.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Job    openings were posted across multiple platforms.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Offer    letters were dispatched to the successful candidates.</p>    <p style=\"orphans:0;widows:0\">4. Hundreds of resumes were    screened by the HR team.</p>", "option1": "<p style=\"orphans:0;widows:0\">    2-4-1-3</p>", "option2": " <p style=\"orphans:0;widows:0\">    2-1-4-3</p>", "option3": " <p style=\"orphans:0;widows:0\">    4-2-1-3</p>", "option4": " <p style=\"orphans:0;widows:0\">    1-2-4-3</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage follows the chronological sequence of a recruitment    process: First, the job openings were posted (2). Following this,    the applications/resumes received were screened by the HR team    (4). Then, the shortlisted candidates were called for interviews    (1). Finally, offer letters were dispatched to the selected    candidates (3). Therefore, the correct order is 2-4-1-3.</p>", "question_heading": ""}, {"sr_no": 102, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can suitably replace the underlined segment    to improve the sentence. If no improvement is required, select 'No    improvement required'.</p>    <p style=\"orphans:0;widows:0\">The architectural features of the    southern temples <u>are distinctively different from that of</u>    the northern shrines.</p>", "option1": "<p style=\"orphans:0;widows:0\">    is distinctively different from that of</p>", "option2": " <p style=\"orphans:0;widows:0\">    are distinctively different from those of</p>", "option3": " <p style=\"orphans:0;widows:0\">    are distinctively different than that of</p>", "option4": " <p style=\"orphans:0;widows:0\">    No improvement required</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct replacement is <b>are distinctively different from    those of</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The head    noun being compared is 'architectural features', which is plural.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. When    comparing plural nouns to avoid repetition, the demonstrative    pronoun <b>'those of'</b> is used instead of the singular 'that    of'.</p>    <p style=\"orphans:0;widows:0\">3. Since the subject is plural    ('features'), the plural auxiliary verb 'are' is grammatically    correct.</p>", "question_heading": ""}, {"sr_no": 103, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct passive form of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">The storm damaged several    residential buildings in the coastal town.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Several residential buildings were damaged by the storm in the    coastal town.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Several residential buildings were being damaged by the storm in    the coastal town.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Several residential buildings have been damaged by the storm in    the coastal town.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Several residential buildings had been damaged by the storm in the    coastal town.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the Simple Past Tense (Active Voice).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rule:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Active:    Subject + V2 + Object</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive:    Object + was/were + V3 + by + Subject</p>    <p style=\"orphans:0;widows:0\">Since the object 'Several    residential buildings' is plural, 'were damaged' is used. Hence,    the correct passive sentence is: 'Several residential buildings    were damaged by the storm in the coastal town.'</p>", "question_heading": ""}, {"sr_no": 104, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Find the part of the sentence that contains an error:</b></p>    <p style=\"orphans:0;widows:0\">The pharmaceutical companies,    despite facing severe regulatory hurdles, (1)/ managed to expand    into emerging markets (2)/ by offering affordable variants of    life-saving drugs (3)/ that significantly enhanced its brand    reputation worldwide. (4)</p>", "option1": "<p style=\"orphans:0;widows:0\">    (1)</p>", "option2": " <p style=\"orphans:0;widows:0\">    (2)</p>", "option3": " <p style=\"orphans:0;widows:0\">    (3)</p>", "option4": " <p style=\"orphans:0;widows:0\">    (4)</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The error lies in part (4) of the sentence. The antecedent is the    plural noun phrase 'The pharmaceutical companies'. Therefore, the    plural possessive pronoun 'their' must be used instead of the    singular possessive pronoun 'its' to maintain pronoun-antecedent    agreement.</p>", "question_heading": ""}, {"sr_no": 105, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate antonym of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Nefarious</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Heinous</p>", "option2": " <p style=\"orphans:0;widows:0\">    Virtuous</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sinister</p>", "option4": " <p style=\"orphans:0;widows:0\">    Wicked</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>'Nefarious'</b> means wicked, villainous, or criminal.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>'Virtuous'</b>    means having or showing high moral standards or goodness, which is    the exact opposite (antonym) of 'Nefarious'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meaning of    other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Heinous:</b>    utterly odious or wicked (synonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Sinister:</b>    giving the impression that something evil or harmful is happening    (synonym).</p>    <p style=\"orphans:0;widows:0\">- <b>Wicked:</b> evil or morally    wrong (synonym).</p>", "question_heading": ""}, {"sr_no": 106, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">What does POST stand for during the computer booting process?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Power-On Self Test (पावर-ऑन सेल्फ टेस्ट)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Program Operation System Terminal (प्रोग्राम ऑपरेशन सिस्टम टर्मिनल)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Primary Online Security Transmission (प्राइमरी ऑनलाइन सिक्योरिटी ट्रांसमिशन)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Pre-Operational System Task (प्री-ऑपरेशनल सिस्टम टास्क)</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>POST is a diagnostic testing sequence run by a computer's firmware right after it is powered on to verify that hardware components are working properly.</span></p>", "question_heading": ""}, {"sr_no": 107, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which network topology features a central controller or hub to which all other peripheral nodes are directly connected?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ring Topology</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Bus Topology</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Star Topology</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mesh Topology</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In a star topology, every node connects to a central hub, switch, or computer, meaning failure of one cable only disconnects that specific node.</span></p>", "question_heading": ""}, {"sr_no": 108, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Who is credited with inventing the World Wide Web (WWW) in the year 1989?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Vint Cerf</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Tim Berners-Lee</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ray Tomlinson</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Marc Andreessen</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Tim Berners-Lee invented the World Wide Web while working at CERN, introducing HTML, URI, and HTTP.</span></p>", "question_heading": ""}, {"sr_no": 109, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which keyboard shortcut is used to center-align text in an active document in MS Word?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + L</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + E</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + R</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + J</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + E is the standard shortcut for center alignment, while Ctrl + L aligns left, Ctrl + R aligns right, and Ctrl + J justifies.</span></p>", "question_heading": ""}, {"sr_no": 110, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">What does 'WYSIWYG' stand for in web editing and graphical design software?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>What You See Is What You Get</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Where You Search Is Where You Go</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Which You Select Is What You Generate</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Web Yielded System In Worldwide Graphics</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>It refers to systems where content displayed during editing closely corresponds to its appearance when printed or displayed as a finished product.</span></p>", "question_heading": ""}, {"sr_no": 111, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">What is the full form of 'GIF', a popular image format used for simple animations on the internet?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Graphics Interchange Format</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Graphical Information File</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Global Image Format</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>General Interface File</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>GIF is a bitmap image format developed by CompuServe that supports static and animated images.</span></p>", "question_heading": ""}, {"sr_no": 112, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which physical computer port is primarily used to transmit uncompressed digital video and audio data from a computer to a high-definition monitor or television?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>VGA Port</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HDMI Port</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Parallel Port</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PS/2 Port</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_
