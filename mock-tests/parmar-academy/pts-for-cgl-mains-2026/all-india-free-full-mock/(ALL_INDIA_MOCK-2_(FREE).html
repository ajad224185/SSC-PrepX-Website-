": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'Reply All' ensures that everyone involved in the original email thread receives your response, unlike a standard 'Reply'.</span></p>", "question_heading": ""}, {"sr_no": 117, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which tool in MS Word is used to copy all formatting, such as font style, size, and color, from one piece of text and apply it to another?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Quick Parts</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Format Painter</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mail Merge</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>WordArt</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Format Painter quickly copies formatting styles to maintain consistent text design across a document.</span></p>", "question_heading": ""}, {"sr_no": 118, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Match the Windows system utilities in Column A with their primary functions in Column B.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Column A:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. Disk Cleanup</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. Task Scheduler</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3. Event Viewer</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">4. Device Manager</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Column B:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">a) Configures, updates, and troubleshoots hardware components and their drivers</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">b) Automates tasks and programs to execute at predetermined times</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">c) Displays detailed logs of significant system events, application errors, and security audits</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">d) Scans and deletes temporary and unnecessary files to free up storage space</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - b, 2 - d, 3 - a, 4 - c</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - d, 2 - b, 3 - c, 4 - a</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - c, 2 - b, 3 - d, 4 - a</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 - d, 2 - a, 3 - c, 4 - b</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Disk Cleanup removes temporary files (d), Task Scheduler automates tasks (b), Event Viewer displays system logs (c), and Device Manager handles hardware drivers (a).</span></p>", "question_heading": ""}, {"sr_no": 119, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">What are 'Cookies' in the context of web browsing and internet usage?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Malicious virus programs that delete system files</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Small text files stored by websites on your computer to track preferences and session data</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Temporary hardware cooling components</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Network encryption algorithms</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cookies help websites remember your login details, preferences, and browsing behavior.</span></p>", "question_heading": ""}, {"sr_no": 120, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">What is the primary purpose of using 'Incognito Mode' or 'Private Browsing' in a web browser?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>To permanently block all computer viruses</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>To prevent the browser from saving local history, cookies, and form data after closing the window</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>To browse the internet completely anonymously without internet service providers seeing traffic</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>To speed up internet download speeds by 50%</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Private browsing keeps local activity hidden from other users of the same device, though it does not make you completely anonymous online.</span></p>", "question_heading": ""}, {"sr_no": 121, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following memory units is equal to 1024 Terabytes (TB)?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Gigabyte</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Exabyte</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Petabyte</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Zettabyte</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The computer storage hierarchy goes: Kilobyte -&gt; Megabyte -&gt; Gigabyte -&gt; Terabyte -&gt; Petabyte (1024 TB) -&gt; Exabyte -&gt; Zettabyte.</span></p>", "question_heading": ""}, {"sr_no": 122, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which register in the CPU holds the memory address of the next instruction to be executed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Accumulator</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Program Counter</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Instruction Register</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Stack Pointer</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The Program Counter (PC) keeps track of the execution flow by pointing to the next instruction's address.</span></p>", "question_heading": ""}, {"sr_no": 123, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which generation of computers used Transistors as their primary electronic component instead of vacuum tubes?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First Generation</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second Generation</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Third Generation</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Fourth Generation</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second-generation computers (circa 1959–1965) replaced bulky, power-hungry vacuum tubes with smaller, faster transistors.</span></p>", "question_heading": ""}, {"sr_no": 124, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which protocol is standardly used for fetching or retrieving emails from a remote mail server to a local client?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SMTP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>POP3 / IMAP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FTP</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HTTP</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>POP3 and IMAP are standard email retrieval protocols (whereas SMTP is used for sending mail).</span></p>", "question_heading": ""}, {"sr_no": 125, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Which transmission media uses light pulses traveling through glass or plastic fibers to transmit data at extremely high speeds?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Twisted-pair cable</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Coaxial cable</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Fiber-optic cable</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Infrared waves</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Fiber optics transmit data as pulses of light over high-bandwidth glass or plastic strands, unaffected by electromagnetic interference.</span></p>", "question_heading": ""}, {"sr_no": 126, "question": "Wुicु यी पुध ीियियथing ौदंृiयपic यनgोniौंौ ूनयॅiकधौ nहपनiधnपौ ोnक cिययन पय cयनोिस, पुध धसूिहसiयn यी थुicु हnकधन पुधनंोि ौपनधौौ cोहौधौ cयनोि ृिधोcुing?", "option1": "<p style=\"orphans:0;widows:0\">    Zooxanthellae</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sargassum</p>", "option3": " <p style=\"orphans:0;widows:0\">    Diatoms</p>", "option4": " <p style=\"orphans:0;widows:0\">    Cyanobacteria</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Coral bleaching occurs when corals are stressed by changes in    conditions such as temperature, light, or nutrients. In response,    they expel the microscopic, photosynthetic algae called    <b>Zooxanthellae</b> that live symbiotically within their tissues.    Since Zooxanthellae provide up to 90% of the coral's energy and    give them their vibrant colors, their loss exposes the coral's    white calcium carbonate skeleton, leading to the phenomenon known    as coral bleaching.</p>", "question_heading": ""}, {"sr_no": 127, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following countries was NOT one of the founding    members of the Association of Southeast Asian Nations (ASEAN) in    1967?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Indonesia</p>", "option2": " <p style=\"orphans:0;widows:0\">    Malaysia</p>", "option3": " <p style=\"orphans:0;widows:0\">    Thailand</p>", "option4": " <p style=\"orphans:0;widows:0\">    Vietnam</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    ASEAN was established on 8 August 1967 in Bangkok, Thailand, by    the signing of the ASEAN Declaration (Bangkok Declaration). The    five founding member countries were Indonesia, Malaysia, the    Philippines, Singapore, and Thailand. Vietnam joined ASEAN much    later, on 28 July 1995, as its seventh member.</p>", "question_heading": ""}, {"sr_no": 128, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following is the author of the novel 'The God of    Small Things'?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Kiran Desai</p>", "option2": " <p style=\"orphans:0;widows:0\">    Arundhati Roy</p>", "option3": " <p style=\"orphans:0;widows:0\">    Jhumpa Lahiri</p>", "option4": " <p style=\"orphans:0;widows:0\">    Anita Desai</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    'The God of Small Things' is the debut novel written by Indian    author Arundhati Roy. It was published in 1997 and won the    prestigious Booker Prize in the same year.</p>", "question_heading": ""}, {"sr_no": 129, "question": " <p style=\"orphans:0;widows:0\">    <b>In India, the three-year 'Plan Holiday' (1966–1969) was    declared following the failure of which Five-Year Plan?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    First Five-Year Plan</p>", "option2": " <p style=\"orphans:0;widows:0\">    Second Five-Year Plan</p>", "option3": " <p style=\"orphans:0;widows:0\">    Third Five-Year Plan</p>", "option4": " <p style=\"orphans:0;widows:0\">    Fourth Five-Year Plan</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The 'Plan Holiday' was observed from 1966 to 1969 following the    failure of the Third Five-Year Plan (1961–1966). The major    reasons for the failure of the Third Plan were the Sino-Indian War    of 1962, the Indo-Pakistani War of 1965, and severe droughts    across the country, which depleted financial resources and led to    three consecutive Annual Plans instead of a regular Five-Year    Plan.</p>", "question_heading": ""}, {"sr_no": 130, "question": " <p style=\"orphans:0;widows:0\">    <b>The 'Santosh Trophy' is a premier national tournament    associated with which of the following sports in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Cricket</p>", "option2": " <p style=\"orphans:0;widows:0\">    Hockey</p>", "option3": " <p style=\"orphans:0;widows:0\">    Football</p>", "option4": " <p style=\"orphans:0;widows:0\">    Badminton</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Santosh Trophy is a prestigious inter-state national football    championship in India organized by the All India Football    Federation (AIFF). It was started in 1941 and named after the    Maharaja of Santosh, Sir Manmatha Nath Roy Chowdhury.</p>", "question_heading": ""}, {"sr_no": 131, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following festivals marks the traditional New Year    in the state of Maharashtra?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Gudi Padwa</p>", "option2": " <p style=\"orphans:0;widows:0\">    Ganesh Chaturthi</p>", "option3": " <p style=\"orphans:0;widows:0\">    Makar Sankranti</p>", "option4": " <p style=\"orphans:0;widows:0\">    Bhaubeej</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Gudi Padwa marks the beginning of the traditional New Year for    Marathi and Konkani Hindus. It is celebrated on the first day of    the Chaitra month according to the lunisolar Hindu calendar.</p>", "question_heading": ""}, {"sr_no": 132, "question": " <p style=\"orphans:0;widows:0\">    <b>Under the Bharatiya Nagarik Suraksha Sanhita (BNSS), 2023,    which replaced the Code of Criminal Procedure, 1973, forensic    investigation has been made mandatory for offences punishable with    imprisonment of at least how many years?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    3 years</p>", "option2": " <p style=\"orphans:0;widows:0\">    5 years</p>", "option3": " <p style=\"orphans:0;widows:0\">    7 years</p>", "option4": " <p style=\"orphans:0;widows:0\">    10 years</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Under Section 176(3) of the Bharatiya Nagarik Suraksha Sanhita    (BNSS), 2023, forensic investigation by a forensic expert and the    videography of the crime scene have been made mandatory for all    offences punishable with imprisonment of 7 years or more.</p>", "question_heading": ""}, {"sr_no": 133, "question": " <p style=\"orphans:0;widows:0\">    <b>Who was the first Indian woman to win an Olympic medal?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    P. T. Usha</p>", "option2": " <p style=\"orphans:0;widows:0\">    Saina Nehwal</p>", "option3": " <p style=\"orphans:0;widows:0\">    Karnam Malleswari</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mary Kom</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Karnam Malleswari became the first Indian woman to win an Olympic    medal when she clinched a bronze medal in the women's 69 kg    weightlifting category at the 2000 Sydney Olympic Games.</p>", "question_heading": ""}, {"sr_no": 134, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following statements is CORRECT regarding 'Loktak    Lake'?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    It is the largest saltwater lagoon in India.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Keibul Lamjao National Park, the world's only floating national    park, is situated on it.</p>", "option3": " <p style=\"orphans:0;widows:0\">    It is located in the state of Mizoram.</p>", "option4": " <p style=\"orphans:0;widows:0\">    It was designated as a Ramsar site in the year 2021.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Loktak Lake is the largest freshwater lake in Northeast India,    located in the state of Manipur. It is internationally famous for    its 'phumdis' (floating masses of vegetation, soil, and organic    matter). The southern part of Loktak Lake hosts the Keibul Lamjao    National Park, which is the world's only floating national park    and the last natural refuge of the endangered Manipur    brow-antlered deer, or Sangai. It was designated as a Ramsar site    in 1990.</p>", "question_heading": ""}, {"sr_no": 135, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following books is an autobiographical memoir    written by former Prime Minister of India, I. K. Gujral?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Matters of Discretion</p>", "option2": " <p style=\"orphans:0;widows:0\">    The Insider</p>", "option3": " <p style=\"orphans:0;widows:0\">    Changing India</p>", "option4": " <p style=\"orphans:0;widows:0\">    The Coalition Years</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    'Matters of Discretion: An Autobiography' is authored by former    Prime Minister of India, Inder Kumar Gujral (I. K. Gujral). It    offers an extensive account of his diplomatic career, political    journey, and foreign policy framework including the 'Gujral    Doctrine'. Among the other options, 'The Insider' was written by    P. V. Narasimha Rao, 'Changing India' by Dr. Manmohan Singh, and    'The Coalition Years' by Pranab Mukherjee.</p>", "question_heading": ""}, {"sr_no": 136, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following writs can be issued by the Supreme Court    or High Courts against both public authorities and private    individuals?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Mandamus</p>", "option2": " <p style=\"orphans:0;widows:0\">    Habeas Corpus</p>", "option3": " <p style=\"orphans:0;widows:0\">    Quo-Warranto</p>", "option4": " <p style=\"orphans:0;widows:0\">    Prohibition</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The writ of <b>Habeas Corpus</b> literally means 'to have the body    of'. It is an order issued by the court to produce a detained    person to examine the legality of detention. It can be issued    against both public authorities and private individuals. In    contrast, other writs like Mandamus, Prohibition, and Quo-Warranto    cannot be issued against private individuals.</p>", "question_heading": ""}, {"sr_no": 137, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Arrange the following rulers of the Delhi Sultanate in the    correct chronological order of their reign:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Alauddin Khalji</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. Ghiyas-ud-din Balban</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. Razia Sultana</b></p>    <p style=\"orphans:0;widows:0\"><b>4. Muhammad    bin Tughlaq</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    3, 2, 1, 4</p>", "option2": " <p style=\"orphans:0;widows:0\">    2, 3, 1, 4</p>", "option3": " <p style=\"orphans:0;widows:0\">    3, 1, 2, 4</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 3, 2, 4</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct chronological order of the reign of these Delhi    Sultanate rulers is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>Razia    Sultana:</b> 1236 – 1240 AD (Mamluk/Slave Dynasty)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2.    <b>Ghiyas-ud-din Balban:</b> 1266 – 1287 AD (Mamluk/Slave    Dynasty)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. <b>Alauddin    Khalji:</b> 1296 – 1316 AD (Khalji Dynasty)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. <b>Muhammad    bin Tughlaq:</b> 1325 – 1351 AD (Tughlaq Dynasty)</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct sequence    is 3, 2, 1, 4.</p>", "question_heading": ""}, {"sr_no": 138, "question": " <p style=\"orphans:0;widows:0\">    <b>The rock-cut caves located at the Barabar Hills in Bihar were    built during the Mauryan period primarily for the ascetics    belonging to which of the following sects?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Buddhism</p>", "option2": " <p style=\"orphans:0;widows:0\">    Jainism</p>", "option3": " <p style=\"orphans:0;widows:0\">    Ajivika</p>", "option4": " <p style=\"orphans:0;widows:0\">    Lokayata</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The rock-cut caves at the Barabar Hills (situated in the Jehanabad    district of Bihar) were excavated during the reign of the Mauryan    Emperor Ashoka in the 3rd century BCE primarily for the ascetics    of the <b>Ajivika</b> sect. These caves, such as the Sudama and    Karan Chaupar caves, are considered the earliest surviving    examples of rock-cut architecture in India.</p>", "question_heading": ""}, {"sr_no": 139, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the </b><b>Bharatiya    Sakshya Adhiniyam, 2023 (BSA)</b><b>:</b></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <b>The BSA formally recognizes electronic and digital records as     \"documents,\" giving them the same legal effect and     validity as traditional physical paper records.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <b>Under Section 63 of the BSA, electronic records stored in     proper custody can be admitted as primary evidence without     requiring a mandatory certificate under Section 63(4) in all     circumstances.</b></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both 1 and 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1 is correct:</b> The BSA, 2023 broadens the    definition of documents to explicitly include electronic and    digital records (such as emails, server logs, and digital logs),    granting them equal legal status.</p>    <p style=\"orphans:0;widows:0\"><b>Statement 2 is incorrect:</b>    While electronic records are admissible, Section 63(4) of the BSA    retains (and clarifies) the requirement for a certificate (similar    to the old Section 65B of the Indian Evidence Act) to make    electronic records admissible as primary/secondary evidence under    specific conditions, ensuring authentication and preventing    tampering.</p>", "question_heading": ""}, {"sr_no": 140, "question": " <p style=\"orphans:0;widows:0\">    <b>A person sitting in a train traveling at a speed of 54 km/h    observes that a goods train coming from the opposite direction    takes 12 seconds to pass him completely. If the length of the    goods train is 420 meters, what is the speed of the goods train?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    64 km/h</p>", "option2": " <p style=\"orphans:0;widows:0\">    72 km/h</p>", "option3": " <p style=\"orphans:0;widows:0\">    80 km/h</p>", "option4": " <p style=\"orphans:0;widows:0\">    90 km/h</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    When a train passes a stationary or moving point observer, the    distance covered equals the length of that train.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Here, the    distance covered =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794120245396_html_f87d1218c99d9188.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Time taken =       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794120245396_html_686b5c5791b8c69a.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Relative    speed =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794120245396_html_917060ffa6bb622c.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Converting    relative speed to km/h:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794120245396_html_135690fa1fd80570.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Since the    trains are moving in opposite directions, their speeds add up:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794120245396_html_6fceab5828dc427d.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794120245396_html_f16afee30075751a.gif\" > </p>    <p style=\"orphans:0;widows:0\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794120245396_html_7d17b2abd654022c.gif\" > </p>", "question_heading": ""}, {"sr_no": 141, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding Mahatma Gandhi’s    movements during the Gandhian Era:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1.The </b><b>Champaran Satyagraha (1917)</b><b> was primarily    directed against the </b><b>Tinkathia system</b><b>, under which    peasants were compelled to cultivate indigo on a fixed portion of    their land.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2.The </b><b>Ahmedabad Mill Strike (1918)</b><b> was associated    with a dispute over the </b><b>plague bonus</b><b>, and Gandhi    used his first public fast in India in this struggle.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3.During the </b><b>Kheda Satyagraha (1918)</b><b>, Gandhi’s    principal demand was the complete abolition of land revenue    throughout Gujarat rather than suspension of revenue collection    due to crop failure.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>4.The </b><b>Non-Cooperation Movement (1920–22)</b><b> was    withdrawn by Gandhi following the </b><b>Chauri Chaura incident</b><b>,    as he considered the outbreak of violence contrary to the    movement’s non-violent objective.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    1, 2 and 4 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    2, 3 and 4 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2, 3 and 4</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1 — Correct:</b> Champaran Satyagraha (1917)    targeted the <b>Tinkathia system</b>, under which peasants were    forced to grow indigo on a portion of their land.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2 — Correct:</b> Ahmedabad Mill Strike (1918) concerned the    <b>plague bonus/wage dispute</b>; Gandhi undertook a fast to    support the workers.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    3 — Incorrect:</b> Kheda Satyagraha demanded    <b>suspension/remission of land revenue</b> because of crop    failure and poor economic conditions, not complete abolition of    land revenue.</p>    <p style=\"orphans:0;widows:0\"><b>Statement 4 — Correct:</b>    Gandhi withdrew the Non-Cooperation Movement in <b>February 1922</b>    after the violent <b>Chauri Chaura incident</b>.</p>", "question_heading": ""}, {"sr_no": 142, "question": " <p style=\"orphans:0;widows:0\">    <b>Along with Bagor in Rajasthan, which of the following sites has    yielded the earliest evidence of the domestication of animals in    India during the Mesolithic period?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Burzahom</p>", "option2": " <p style=\"orphans:0;widows:0\">    Adamgarh</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mehrgarh</p>", "option4": " <p style=\"orphans:0;widows:0\">    Chirand</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The earliest archaeological evidence of the domestication of    animals in the Indian subcontinent during the Mesolithic period    has been discovered at Bagor in Rajasthan (Bhilwara district) and    Adamgarh in Madhya Pradesh (Hoshangabad district). Burzahom (Jammu    &amp; Kashmir) and Chirand (Bihar) are Neolithic sites, while    Mehrgarh (Pakistan) is famous for early Neolithic agriculture.</p>", "question_heading": ""}, {"sr_no": 143, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Indian social reformer founded the 'Sharada Sadan' in    Bombay in 1889 to provide shelter and education to young widows?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Savitribai Phule</p>", "option2": " <p style=\"orphans:0;widows:0\">    Pandita Ramabai</p>", "option3": " <p style=\"orphans:0;widows:0\">    Tarabai Shinde</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ramabai Ranade</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Pandita Ramabai was an eminent Indian social reformer, scholar,    and pioneer in women's education. In March 1889, she established    the 'Sharada Sadan' (Home for Learning) in Bombay to support,    educate, and rehabilitate young Hindu child-widows. Later, she    also established the Ramabai Mukti Mission at Kedgaon near Pune.</p>", "question_heading": ""}, {"sr_no": 144, "question": " <p style=\"orphans:0;widows:0\">    <b>At a constant temperature, if the pressure exerted on a fixed    amount of an ideal gas is increased to four times its initial    pressure, what will be its final volume compared to its initial    volume?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Four times the initial volume</p>", "option2": " <p style=\"orphans:0;widows:0\">    One-fourth of the initial volume</p>", "option3": " <p style=\"orphans:0;widows:0\">    Half of the initial volume</p>", "option4": " <p style=\"orphans:0;widows:0\">    Remains unchanged</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    According to Boyle's Law, for a fixed mass of an ideal gas at    constant temperature, the pressure is inversely proportional to    its volume (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794120245396_html_b40fc1e8eac7cdd2.gif\" >     or     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794120245396_html_db417ec096b8d232.gif\" > ).    When the pressure is increased by a factor of 4 (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794120245396_html_1886cd47780944b7.gif\" > ),    the volume decreases by the same factor:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794120245396_html_fdeba4f191ea3ddf.gif\" > .    Therefore, the final volume becomes one-fourth of the initial    volume.</p>", "question_heading": ""}, {"sr_no": 145, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following factors will cause a rightward shift in    the demand curve for a normal good?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    A decrease in the price of the commodity itself</p>", "option2": " <p style=\"orphans:0;widows:0\">    An increase in the price of a complementary good</p>", "option3": " <p style=\"orphans:0;widows:0\">    An increase in consumer income</p>", "option4": " <p style=\"orphans:0;widows:0\">    A decrease in the price of a substitute good</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    A shift in the demand curve occurs due to changes in non-price    factors such as consumer income, tastes, preferences, and the    prices of related goods. For a normal good, an increase in    consumer income raises purchasing power, leading to an increase in    demand at each price level, which shifts the demand curve to the    right. A change in the commodity's own price causes a movement    along the demand curve, whereas a decrease in the price of a    substitute good or an increase in the price of a complementary    good shifts the demand curve to the left.</p>", "question_heading": ""}, {"sr_no": 146, "question": " <p style=\"orphans:0;widows:0\">    <b>In which of the following modes of heterotrophic nutrition do    organisms break down food material outside the body and then    absorb the nutrients?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Holozoic nutrition</p>", "option2": " <p style=\"orphans:0;widows:0\">    Saprotrophic nutrition</p>", "option3": " <p style=\"orphans:0;widows:0\">    Parasitic nutrition</p>", "option4": " <p style=\"orphans:0;widows:0\">    Symbiotic nutrition</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In saprotrophic nutrition, organisms such as fungi (e.g., bread    moulds, yeast, and mushrooms) secrete digestive enzymes directly    onto dead and decaying organic matter. These enzymes break down    complex food materials into simpler, soluble forms outside the    body, which are subsequently absorbed through the organism's body    surface. In contrast, organisms with holozoic nutrition ingest    solid food and digest it internally.</p>", "question_heading": ""}, {"sr_no": 147, "question": " <p style=\"orphans:0;widows:0\">    <b>Which city hosted the 48th Session of the World Heritage    Committee where the \"Ancient Buddhist Site of Sarnath\"    was inscribed as India's 45th World Heritage property?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Busan, Republic of Korea</p>", "option2": " <p style=\"orphans:0;widows:0\">    Seoul, South Korea</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kyoto, Japan</p>", "option4": " <p style=\"orphans:0;widows:0\">    Bangkok, Thailand</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The <b>Ancient Buddhist Site of Sarnath</b>, including the    <b>Chaukhandi Stupa and Archaeological Remains of Sarnath</b> in    Varanasi, Uttar Pradesh, was inscribed as India’s <b>45th World    Heritage property</b>.</p>    <p style=\"orphans:0;widows:0\">The inscription took place during    the <b>48th Session of the World Heritage Committee</b>, held in    <b>Busan, Republic of Korea</b>.</p>", "question_heading": ""}, {"sr_no": 148, "question": " <p style=\"orphans:0;widows:0\">    <b>Which state has recently become the sixth fully literate State    in the country by achieving adult literacy benchmarks under the    National Education Policy 2020 and the ULLAS New India Literacy    Programme?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Himachal Pradesh</p>", "option2": " <p style=\"orphans:0;widows:0\">    Kerala</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sikkim</p>", "option4": " <p style=\"orphans:0;widows:0\">    Uttarakhand</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Uttarakhand</b> became the <b>sixth fully literate state</b>    after achieving the prescribed adult-literacy benchmark.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The <b>New    India Literacy Programme (NILP)</b>, also known as <b>ULLAS/Nav    Bharat Saaksharta Karyakram</b>, is a centrally sponsored scheme    implemented for <b>FY 2022–2027</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">It is aligned    with the <b>National Education Policy (NEP) 2020</b>.</p>    <p style=\"orphans:0;widows:0\">The programme focuses on    <b>non-literate adults aged 15 years and above</b>, helping them    acquire literacy and integrate into society.</p>", "question_heading": ""}, {"sr_no": 149, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following pairs regarding the winners at the 72nd    National Film Awards:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Best Feature Film: Article 370</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. Best Actor in a Leading Role: Kartik Aaryan (Chandu    Champion) and Mammootty (Bramayugam)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. Best Documentary: Bhangaar</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>4. Best Debut Film of a Director: Randeep Hooda (Swatantrya    Veer Savarkar)</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    pairs given above are correctly matched?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    1, 2 and 4 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 3 and 4 only</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Pair 1 is correct:</b> <i>Article 370</i> won <b>Best Feature    Film</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Pair 2 is    correct:</b> <b>Kartik Aaryan</b> and <b>Mammootty</b> shared the    <b>Best Actor in a Leading Role</b> award.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Pair 4 is    correct:</b> <b>Randeep Hooda</b> won <b>Best Debut Film of a    Director</b> for <i>Swatantrya Veer Savarkar</i>.</p>    <p style=\"orphans:0;widows:0\"><b>Pair 3 is incorrect:</b>    <i>Ram-Nami</i> won <b>Best Documentary</b>, while <i>Bhangaar</i>    won <b>Best Non-Feature Film</b>.</p>", "question_heading": ""}, {"sr_no": 150, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding Mission Aagaman and    the Vikram-1 launch vehicle:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Mission Aagaman marked India's historic first private    sub-orbital flight, launching successfully from the Dr. APJ Abdul    Kalam Island.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. Vikram-1 is India's first government-owned orbital-class    launch vehicle designed exclusively for crewed missions to the    International Space Station.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. The mission successfully placed six payloads into a 450 km    Low Earth Orbit.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above are incorrect?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1 is incorrect:</b> Mission Aagaman was India’s    first <b>private orbital rocket flight</b>, not a sub-orbital    flight, and it was launched from <b>Sriharikota</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Statement    2 is incorrect:</b> <b>Vikram-1</b> is a <b>privately developed    orbital-class launch vehicle</b> developed by <b>Skyroot    Aerospace</b>, not a government-owned vehicle.</p>    <p style=\"orphans:0;widows:0\"><b>Statement 3 is correct:</b>    The mission successfully deployed <b>six payloads into a 450 km    Low Earth Orbit (LEO)</b></p>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>

    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);

  } catch (err) {

  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
