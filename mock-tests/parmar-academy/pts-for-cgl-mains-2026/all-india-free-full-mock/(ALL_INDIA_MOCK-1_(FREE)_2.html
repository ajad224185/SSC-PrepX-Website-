<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>2.) ALL INDIA MOCK-1 (FREE - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

tion_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0\">    <b>'</b><span style=\"font-family:'Nirmala UI'\"><span><b>भारतीय    गणराज्य की विजय</b></span></span><b>:    </b><span style=\"font-family:'Nirmala UI'\"><span><b>मेरा    जीवन</b></span></span><b>, </b><span style=\"font-family:'Nirmala UI'\"><span><b>मेरे    संघर्ष</b></span></span><b>' (Triumph of the Indian    Republic: My Life, My Struggles) </b><span style=\"font-family:'Nirmala UI'\"><span><b>भारत    के किस पूर्व राष्ट्रपति की    आत्मकथा है</b></span></span><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>प्रणब मुखर्जी</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>राम नाथ    कोविंद</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>द्रौपदी    मुर्मू</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>प्रतिभा    पाटिल</span></span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    '<span style=\"font-family:'Nirmala UI'\"><span>भारतीय    गणराज्य की विजय</span></span>: <span style=\"font-family:'Nirmala UI'\"><span>मेरा    जीवन</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>मेरे    संघर्ष</span></span>' <span style=\"font-family:'Nirmala UI'\"><span>भारत    के पूर्व राष्ट्रपति राम    नाथ कोविंद की आत्मकथा है।</span></span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span><b>रामसर    सम्मेलन द्वारा घोषित विश्व    आर्द्रभूमि दिवस </b></span></span><b>2026    </b><span style=\"font-family:'Nirmala UI'\"><span><b>का आधिकारिक    विषय क्या है</b></span></span><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>आर्द्रभूमि    और मानव कल्याण</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>आर्द्रभूमि    और जलवायु परिवर्तन</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>एक सतत शहरी    भविष्य के लिए आर्द्रभूमि    </span></span>    </p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>आर्द्रभूमि    और पारंपरिक ज्ञान</span></span>:    <span style=\"font-family:'Nirmala UI'\"><span>सांस्कृतिक    विरासत का जश्न</span></span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span>विश्व    आर्द्रभूमि दिवस प्रतिवर्ष    </span></span>2 <span style=\"font-family:'Nirmala UI'\"><span>फरवरी    को </span></span>1971 <span style=\"font-family:'Nirmala UI'\"><span>में    आर्द्रभूमि पर रामसर सम्मेलन    को अपनाने की याद में मनाया    जाता है।</span></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span>रामसर    सम्मेलन </span></span>1971 <span style=\"font-family:'Nirmala UI'\"><span>में    ईरान के रामसर में हस्ताक्षरित    एक अंतरसरकारी संधि है। यह    स्थानीय</span></span>, <span style=\"font-family:'Nirmala UI'\"><span>राष्ट्रीय    और अंतर्राष्ट्रीय सहयोग    के माध्यम से आर्द्रभूमि के    संरक्षण और बुद्धिमान उपयोग    पर केंद्रित है।</span></span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span><b>संयुक्त    विशेष बल अभ्यास </b></span></span><b>'</b><span style=\"font-family:'Nirmala UI'\"><span><b>खंजर</b></span></span><b>'    </b><span style=\"font-family:'Nirmala UI'\"><span><b>भारत और    निम्नलिखित में से किस देश    के बीच एक द्विपक्षीय रक्षा    सहयोग पहल है</b></span></span><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>किर्गिज़स्तान</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>ताजिकिस्तान</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>कजाखस्तान</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>उज़्बेकिस्तान</span></span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span>संयुक्त    विशेष बल अभ्यास </span></span>'<span style=\"font-family:'Nirmala UI'\"><span>खंजर</span></span>'    <span style=\"font-family:'Nirmala UI'\"><span>भारत और    किर्गिज़स्तान के बीच एक    द्विपक्षीय रक्षा सहयोग पहल    है।</span></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span>यह    अभ्यास </span></span>2011 <span style=\"font-family:'Nirmala UI'\"><span>से    वार्षिक या द्विवार्षिक रूप    से आयोजित किया जाता रहा है</span></span>,    <span style=\"font-family:'Nirmala UI'\"><span>जो भारत और    किर्गिज़स्तान के बीच रणनीतिक    साझेदारी का एक महत्वपूर्ण    स्तंभ है।</span></span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span><b>अति लघु</b></span></span><b>-</b><span style=\"font-family:'Nirmala UI'\"><span><b>दूरी    वायु रक्षा प्रणाली </b></span></span><b>(VSHORADS)    </b><span style=\"font-family:'Nirmala UI'\"><span><b>का प्राथमिक    कार्य क्या है</b></span></span><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>कम ऊंचाई    पर हवाई खतरों को कम दूरी पर    रोकना और नष्ट करना।</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>लंबी दूरी    की अंतरमहाद  "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित शृंखला में गलत पद कौन-सा है?<br />\r\nC8Y, G19U, L42P, R89I, Y184C</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\">G19U</p>", "option2": "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R89I</span></p>", "option3": "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L42P</span></p>", "option4": "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Y184C</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "<p>श्रृंखला के प्रत्येक पद के तीनों घटकों का विश्लेषण करने पर:<br />\r\n<strong>पहला अक्षर:</strong><br />\r\nC(3) +4 &rarr; G(7) +5 &rarr; L(12) +6 &rarr; R(18) +7 &rarr; Y(25)<br />\r\n<strong>मध्य संख्या:</strong><br />\r\n8 &times; 2 + 3 = 19<br />\r\n19 &times; 2 + 4 = 42<br />\r\n42 &times; 2 + 5 = 89<br />\r\n89 &times; 2 + 6 = 184<br />\r\n<strong>अंतिम अक्षर:</strong><br />\r\nY(25) &minus;4 &rarr; U(21) &minus;5 &rarr; P(16) &minus;6 &rarr; J(10) &minus;7 &rarr; C(3)<br />\r\n<strong>चौथे पद में, अंतिम अक्षर I के स्थान पर J होना चाहिए। अतः सही पद R89J होना चाहिए, इसलिए R89I गलत पद है।</strong></p>", "question_heading": ""}, {"sr_no": 52, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">नीचे दी गई आकृति में, आकृतियों A और B के बीच एक निश्चित संबंध है। उत्तर आकृतियों में से एक उपयुक्त आकृति का चयन करके आकृतियों C और D के बीच एक समान संबंध स्थापित कीजिए, जो आकृति D में प्रश्न चिह्न (?) को प्रतिस्थापित करेगी।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471779630_image017.png\" width=\"517\" height=\"92\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471779630_image018.png\" width=\"237\" height=\"147\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471779630_image019.png\" width=\"242\" height=\"144\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471779630_image020.png\" width=\"239\" height=\"143\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471779630_image021.png\" width=\"241\" height=\"149\" alt ></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आकृति A से आकृति B में परिवर्तन का स्वरूप इस प्रकार है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">B में पहला स्थान:</span><span> आकृति A का दूसरा तत्व क्षैतिज रूप से दर्पण-प्रतिबिंबित होता है ('C' उल्टा होकर 'C' का दर्पण रूप बनता है)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">B में दूसरा स्थान:</span><span> आकृति A का पहला तत्व लंबवत रूप से उल्टा (जल प्रतिबिंब) होता है ('V' बदलकर 'Λ' बनता है)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">B में तीसरा स्थान:</span><span> आकृति A का चौथा तत्व क्षैतिज रूप से दर्पण-प्रतिबिंबित होता है ('P' उल्टा 'P' बनता है)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">B में चौथा स्थान:</span><span> तीसरे तत्व के स्थान पर एक नया ठोस तत्व (ठोस वृत्त '●') आता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यही संबंध आकृति C से आकृति D में लागू करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">D में पहला स्थान:</span><span> दूसरा तत्व ('U') लंबवत उल्टा होकर '∩' बन जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">D में दूसरा स्थान:</span><span> पहला तत्व ('T') लंबवत उल्टा होकर '⊥' बन जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">D में तीसरा स्थान:</span><span> चौथा तत्व ('E') क्षैतिज रूप से दर्पण-प्रतिबिंबित होकर 'Ǝ' बन जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">D में चौथा स्थान:</span><span> तीसरे तत्व के स्थान पर एक नया ठोस तत्व (ठोस त्रिभुज '▲') आता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, उत्तर आकृति 3 प्रश्न चिह्न (?) को सही ढंग से प्रतिस्थापित करती है।</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">D, M का पिता है। M का विवाह J से हुआ है। J, Q की बहन है। T, Q की माता है। S, M का पुत्र है। M का T से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ससुर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दामाद</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>साला</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पुत्र</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई जानकारी के अनुसार:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. J, Q की बहन है और T, Q की माता है। अतः T, J की भी माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. M का विवाह J से हुआ है। चूंकि J महिला (बहन) है, इसलिए M पुरुष (पति) है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. चूंकि M, T की पुत्री (J) का पति है, इसलिए M, T का दामाद है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471779630_image022.jpeg\" width=\"360\" height=\"375\" alt ></p>", "question_heading": ""}, {"sr_no": 54, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">नीचे दी गई आकृति में 12 घंटे के निशानों वाली एक घड़ी दिखाई गई है, जिसके दाईं ओर एक लंबवत दर्पण MN रखा गया है। दर्पण प्रतिबिंब में घंटे की सुई और मिनट की सुई की स्थिति को निम्नलिखित में से कौन सा विकल्प सही ढंग से दर्शाता है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471779630_image023.png\" width=\"152\" height=\"144\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471779630_image024.png\" width=\"125\" height=\"120\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471779630_image025.png\" width=\"117\" height=\"119\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471779630_image026.png\" width=\"112\" height=\"122\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471779630_image027.png\" width=\"110\" height=\"122\" alt ></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>जब किसी वस्तु का प्रतिबिंब उसके दाईं ओर रखे लंबवत दर्पण में देखा जाता है, तो बायां और दायां पक्ष आपस में बदल जाते हैं जबकि ऊपर और नीचे की स्थिति अपरिवर्तित रहती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>घड़ी के डायल पर, 12 और 6 से गुजरने वाली लंबवत रेखा परावर्तन अक्ष का कार्य करती है। किसी भी निशान </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471779630_image028.png\" width=\"9\" height=\"21\" alt style=\"vertical-align:middle\" ><span> का दर्पण प्रतिबिंब निशान </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471779630_image029.png\" width=\"46\" height=\"21\" alt style=\"vertical-align:middle\" ><span> पर बनता है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. दी गई आकृति में, छोटी सुई (घंटे की सुई) 4 की ओर इंगित करती है। इसका प्रतिबिंब </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471779630_image030.png\" width=\"76\" height=\"21\" alt style=\"vertical-align:middle\" ><span> की ओर इंगित करेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. लंबी सुई (मिनट की सुई) 1 की ओर इंगित करती है। इसका प्रतिबिंब </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471779630_image031.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ><span> की ओर इंगित करेगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, दर्पण प्रतिबिंब में घंटे की सुई 8 की ओर और मिनट की सुई 11 की ओर होगी।</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक पुरुष की तस्वीर की ओर इशारा करते हुए, \"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LHS = RHS। अतः, 4 और 8 को आपस में बदलने से समीकरण सही हो जाता है।</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">दिए गए विकल्पों में से, अक्षरों के उस समूह का चयन करें, जिसे अधूरी श्रृंखला के रिक्त स्थानों में बाएं से दाएं क्रम में रखने पर, वह तार्किक रूप से इसे पूरा कर देगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">pq_stp_rstpqrs_pqrst_qrst</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>qrtp</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>rqtp</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>rqpt</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>prtq</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई श्रृंखला में रिक्त स्थानों सहित कुल 25 पद हैं। इसे 5-5 अक्षरों के 5 समूहों में विभाजित करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>pq_st | p_rst | pqrs_ | pqrst | _qrst</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पूर्ण चौथे समूह को देखने पर यह स्पष्ट होता है कि दोहराया जाने वाला पैटर्न </span><span style=\"font-weight:bold\">pqrst</span><span> है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रत्येक समूह के रिक्त स्थान भरने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पहला समूह: pq</span><span style=\"font-weight:bold\">r</span><span>st</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दूसरा समूह: p</span><span style=\"font-weight:bold\">q</span><span>rst</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीसरा समूह: pqrs</span><span style=\"font-weight:bold\">t</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चौथा समूह: pqrst</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पाँचवाँ समूह: </span><span style=\"font-weight:bold\">p</span><span>qrst</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>श्रृंखला को पूरा करने के लिए बाएं से दाएं आवश्यक अक्षर </span><span style=\"font-weight:bold\">r, q, t, p</span><span> (rqtp) हैं।</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निर्देश: निम्नलिखित प्रश्न में, दो कथन दिए गए हैं, जिनके बाद दो निष्कर्ष (I और II) दिए गए हैं। कथनों को सत्य मानें, भले ही वे सामान्य तथ्यों के विपरीत प्रतीत होते हों। निर्धारित करें कि कौन-सा/से निष्कर्ष दिए गए कथनों का तार्किक रूप से अनुसरण करता है/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कथन:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कुछ बाघ, शेर हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कोई शेर, हाथी नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. कुछ हाथी, बाघ हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. कुछ बाघ, हाथी नहीं हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष I अनुसरण करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष II अनुसरण करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निष्कर्ष I और II दोनों अनुसरण करते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो निष्कर्ष I और न ही II अनुसरण करता है</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए कथनों के अनुसार:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471779630_image038.png\" width=\"308\" height=\"96\" alt ><span> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चूँकि बाघों का वह हिस्सा जो शेर है, हाथी नहीं हो सकता (क्योंकि कोई शेर हाथी नहीं है), इसलिए यह निश्चित रूप से सत्य है कि वे बाघ हाथी नहीं हैं। अतः, निष्कर्ष II (\"कुछ बाघ, हाथी नहीं हैं\") तार्किक रूप से अनुसरण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निष्कर्ष I (\"कुछ हाथी, बाघ हैं\") केवल एक संभावना हो सकती है, लेकिन निश्चित रूप से सत्य नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, केवल निष्कर्ष II अनुसरण करता है।</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित में से कौन-सा वर्ग-समूह उस वेन आरेख द्वारा सबसे अच्छी तरह दर्शाया जाता है जिसमें एक वृत्त पूरी तरह से दूसरे वृत्त के अंदर है, और तीसरा वृत्त पहले और दूसरे दोनों वृत्तों को आंशिक रूप से अतिव्याप्त करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बहनें, महिलाएँ, डॉक्टर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पिता, पुरुष, भाई</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्टेशनरी, पेंसिल, रबर (इरेज़र)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>जानवर, मांसाहारी, बाघ</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. सभी </span><span style=\"font-weight:bold\">बहनें</span><span> अनिवार्य रूप से </span><span style=\"font-weight:bold\">महिलाएँ</span><span> होती हैं, इसलिए 'बहनें' को दर्शाने वाला वृत्त पूरी तरह से 'महिलाएँ' वाले वृत्त के अंदर आएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. कुछ बहनें डॉक्टर होती हैं, कुछ महिलाएँ (जो बहनें नहीं हैं) डॉक्टर होती हैं, और कुछ डॉक्टर पुरुष होते हैं (जो महिलाएँ नहीं हैं)। इसलिए, 'डॉक्टर' को दर्शाने वाला वृत्त 'बहनें' और 'महिलाएँ' दोनों वृत्तों को आंशिक रूप से काटता है और इसका एक हिस्सा 'महिलाएँ' वाले वृत्त के बाहर भी रहता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, </span><span style=\"font-weight:bold\">बहनें, महिलाएँ, डॉक्टर</span><span> दिए गए संबंध को सही ढंग से दर्शाता है।</span></p>", "question_heading": ""}, {"sr_no": 60, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">उस विकल्प का चयन करें जो पाँचवीं संख्या से उसी प्रकार संबंधित है जैसे दूसरी संख्या, पहली संख्या से संबंधित है और चौथी संख्या, तीसरी संख्या से संबंधित है: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471779630_image039.png\" width=\"123\" height=\"21\" alt style=\"vertical-align:middle\" ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>496</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>504</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt e=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>G (व्यंजन) → G + 3 = J</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N (व्यंजन) → N + 3 = Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A (स्वर) → विपरीत अक्षर = Z</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I (स्वर) → विपरीत अक्षर = R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R (व्यंजन) → R + 3 = U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T (व्यंजन) → T + 3 = W</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कूट = </span><span style=\"font-weight:bold\">VOJQZRUW</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इसी प्रकार, </span><span style=\"font-weight:bold\">FRACTION</span><span> के लिए (उल्टा क्रम: N - O - I - T - C - A - R - F):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N (व्यंजन) → N + 3 = Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O (स्वर) → विपरीत अक्षर = L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I (स्वर) → विपरीत अक्षर = R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T (व्यंजन) → T + 3 = W</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C (व्यंजन) → C + 3 = F</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A (स्वर) → विपरीत अक्षर = Z</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R (व्यंजन) → R + 3 = U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F (व्यंजन) → F + 3 = I</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कूट = </span><span style=\"font-weight:bold\">QLRWFZUI</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:just :12pt\"><span>केवल मान्यता I निहित है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल मान्यता II निहित है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो मान्यता I और न ही II निहित है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मान्यता I और II दोनों निहित हैं</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">मान्यता I निहित है:</span><span> कोई भी संस्थान जब अपनी सुविधाओं का उन्नयन करता है, तो यह मानकर चलता है कि यह नया बदलाव (यहाँ डिजिटल संसाधन) उसके लक्षित उपयोगकर्ताओं (छात्रों) के लिए लाभकारी सिद्ध होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">मान्यता II निहित नहीं है:</span><span> दान या धन का अनुरोध करना यह दर्शाता है कि पूर्व छात्र योगदान दे सकते हैं, लेकिन यह मान लेना कि वे </span><span style=\"font-style:italic\">निश्चित रूप से</span><span> </span><span style=\"font-style:italic\">पूरी</span><span> धनराशि प्रदान ही कर देंगे, एक अतिवादी और अनुचित धारणा है। अतः केवल मान्यता I निहित है।</span></p>", "question_heading": ""}, {"sr_no": 72, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">किसी पद के लिए दिए गए मानदंडों तथा अपवाद को पढ़िए और फिर दिए गए मामले के लिए उचित निर्णय लीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">सिस्टम्स आर्किटेक्ट पद के लिए मानदंड:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">1. कंप्यूटर साइंस या IT में </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471779630_image070.png\" width=\"55\" height=\"21\" alt style=\
