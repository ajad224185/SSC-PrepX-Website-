words in the given sentence.</p>    <p style=\"orphans:0;widows:0\">The citizens rose in rebellion    against the <u>government by the wealthy</u>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Aristocracy</p>", "option2": " <p style=\"orphans:0;widows:0\">    Plutocracy</p>", "option3": " <p style=\"orphans:0;widows:0\">    Bureaucracy</p>", "option4": " <p style=\"orphans:0;widows:0\">    Autocracy</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitution for 'government by the wealthy'    is <b>Plutocracy</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Definitions    of the other options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Aristocracy:</b>     Government by the nobility or privileged upper class.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Bureaucracy:</b>     Government run by appointed state officials.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Autocracy:</b> Government     by a single individual with unlimited power.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate idiom to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Instead of addressing the    complaints directly, the spokesperson continued to ______ during    the press briefing.</p>", "option1": "<p style=\"orphans:0;widows:0\">    burn the midnight oil</p>", "option2": " <p style=\"orphans:0;widows:0\">    beat around the bush</p>", "option3": " <p style=\"orphans:0;widows:0\">    cry over spilt milk</p>", "option4": " <p style=\"orphans:0;widows:0\">    bite the dust</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B)</b> beat around the bush</p>    <p style=\"orphans:0;widows:0\">The idiom <b>'beat around the    bush'</b> means to discuss a matter without coming to the point or    to deliberately avoid talking about what is important. In the    given context, it contrasts with 'addressing the complaints    directly', making it the most appropriate choice.</p>", "question_heading": ""}, {"sr_no": 35, "question": "A ौधnपधncध ुोौ ृधधn ौूिiप हू inपय ौधgंधnपौ ोnक giॅधn ृिधयथ in ुहंृिधक यनकधन. Wुiिध पुध ीiनौप ोnक पुध िोौप ौधgंधnपौ यी पुध ौधnपधncध (1 ोnक 6) ोनध in पुध cयननधcप यनकधन, पुध ौधgंधnपौ in ृधपथधधn ोनध ुहंृिधक हू. Aननोngध पुध ौधgंधnपौ in पुध cयननधcप यनकधन पय ीयनं ो ंधोningीिह ोnक cयुधनधnप ौधnपधncध. 1) Tुध ूनiंोनद यृुधcपiॅध यी ंयकधनn धकहcोपiयn ौुयिहक ृध P) पय ीयौपधन cनiपicोि पुinाing ोnक Q) नोपुधन पुोn ंधनिधद धncयहनोging R) नयपध ंधंयनप्रोपiयn यी ीोcपौ S) धपुicोि ोथोनधnधौौ in ौपहकधnपौ 6) पय ूोौौ ौपोnकोनकप्रधक धसोंinोपiयnौ.", "option1": "<p style=\"orphans:0;widows:0\">    P, S, Q, R</p>", "option2": " <p style=\"orphans:0;widows:0\">    Q, R, P, S</p>", "option3": " <p style=\"orphans:0;widows:0\">    S, P, R, Q</p>", "option4": " <p style=\"orphans:0;widows:0\">    P, Q, S, R</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sequence is <b>P, S, Q, R</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Segment (1)    ends with \"should be\", which grammatically connects with    the infinitive phrase in (P) \"to foster critical thinking    and\".</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Segment (P)    ends with the conjunction \"and\", which requires a    parallel noun phrase. Segment (S) provides this with \"ethical    awareness in students\". Thus, <b>P-S</b> forms a mandatory    pair.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Segment (Q)    \"rather than merely encouraging\" introduces a    contrasting element to what should be fostered.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Segment (R)    \"rote memorization of facts\" acts as the direct object    of \"encouraging\" in (Q), making <b>Q-R</b> another    mandatory pair.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Finally,    segment (R) logically connects to (6) \"to pass standardized    examinations\", indicating the purpose of the rote    memorization.</p>    <p style=\"orphans:0;widows:0\">Hence, the complete coherent    sentence is: <i>\"The primary objective of modern education    should be to foster critical thinking and ethical awareness in    students rather than merely encouraging rote memorization of facts    to pass standardized examinations.\"</i></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words.</p>    <p style=\"orphans:0;widows:0\">A person who abandons or    renounces a religious or political belief</p>", "option1": "<p style=\"orphans:0;widows:0\">    Agnostic</p>", "option2": " <p style=\"orphans:0;widows:0\">    Apostate</p>", "option3": " <p style=\"orphans:0;widows:0\">    Ascetic</p>", "option4": " <p style=\"orphans:0;widows:0\">    Altruist</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (B) <b>Apostate</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Apostate:</b>    A person who renounces or abandons a religious or political belief    or cause.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Agnostic:</b>    A person who believes that nothing is known or can be known of the    existence of God.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Ascetic:</b>    A person who practices severe self-discipline and abstains from    all physical pleasures, typically for religious reasons.</p>    <p style=\"orphans:0;widows:0\"><b>Altruist:</b> A person who    shows unselfish concern for the welfare of others.</p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the following sentence in passive    voice.</p>    <p style=\"orphans:0;widows:0\">After the municipality approves    the plan, the contractor will construct a community hall.</p>", "option1": "<p style=\"orphans:0;widows:0\">    A community hall should be constructed by the contractor when the    municipality approves the plan.</p>", "option2": " <p style=\"orphans:0;widows:0\">    A community hall will have been constructed by the contractor    after the municipality approves the plan.</p>", "option3": " <p style=\"orphans:0;widows:0\">    A community hall will be constructed by the contractor after the    municipality approves the plan.</p>", "option4": " <p style=\"orphans:0;widows:0\">    A community hall was constructed by the contractor after the    municipality approves the plan.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the active voice and its main clause is    in the Simple Future Tense:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Active    Voice structure:</b> Subject + will + V1 + Object</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Passive    Voice structure:</b> Object + will + be + V3 + by + Subject</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In the main    clause, <b>'the contractor'</b> is the subject, <b>'will    construct'</b> is the verb, and 'a community hall' is the object.    Thus, it becomes 'A community hall will be constructed by the    contractor'. The dependent time clause 'after the municipality    approves the plan' remains unchanged.</p>    <p style=\"orphans:0;widows:0\">Hence, <b>option C</b> is    correct.</p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in passive    voice.</p>    <p style=\"orphans:0;widows:0\">The municipal corporation has    successfully implemented a new waste management policy in the    city.</p>", "option1": "<p style=\"orphans:0;widows:0\">    A new waste management policy was successfully implemented in the    city by the municipal corporation.</p>", "option2": " <p style=\"orphans:0;widows:0\">    A new waste management policy has been successfully implemented in    the city by the municipal corporation.</p>", "option3": " <p style=\"orphans:0;widows:0\">    A new waste management policy had been successfully implemented in    the city by the municipal corporation.</p>", "option4": " <p style=\"orphans:0;widows:0\">    A new waste management policy is being successfully implemented in    the city by the municipal corporation.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the Present Perfect Tense (Active Voice).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Active    Voice structure:</b> Subject + has/have + V3 + Object</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Passive    Voice structure:</b> Object + has/have + been + V3 + (by +    Subject)</p>    <p style=\"orphans:0;widows:0\">Here, the object 'A new waste    management policy' is singular, so 'has been successfully    implemented' is used. Therefore, option B is the correct passive    form.</p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in indirect    speech.</p>    <p style=\"orphans:0;widows:0\">The librarian said to me, “Do    you have a membership card?”</p>", "option1": "<p style=\"orphans:0;widows:0\">    The librarian asked me that whether I had a membership card.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The librarian asked me if I had a membership card.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The librarian asked me if I have a membership card.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The librarian told me whether I had a membership card.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Rules for changing a direct interrogative sentence (Yes/No type)    into indirect speech:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb 'said to' is changed to 'asked'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    conjunction 'if' or 'whether' is used to connect the reporting    verb and reported speech (never use 'that' with 'if/whether').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The question    form is converted into an assertive sentence (subject comes before    the verb).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Simple    present tense ('Do you have') changes to simple past tense    ('had').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    second-person pronoun 'you' changes to first-person 'I' according    to the object 'me'.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct indirect    speech is: <b>The librarian asked me if I had a membership card.</b></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in passive    voice.</p>    <p style=\"orphans:0;widows:0\">Do not touch the wet paint.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Let the wet paint be touched.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Let not the wet paint be touched.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Let the wet paint not be touched.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Have not the wet paint been touched.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is a negative imperative sentence expressing an    order/instruction.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The standard    structure for converting a negative imperative sentence into    passive voice is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Let +    object + not + be + past participle (V3) + (remaining words).</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Here, the    object is 'the wet paint' and the verb is 'touch' (past    participle: 'touched').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Applying the    rule gives: <b>Let the wet paint not be touched.</b></p>    <p style=\"orphans:0;widows:0\">Therefore, option C is the    correct answer.</p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is divided into four segments. Identify the    segment that contains a grammatical error.</p>    <p style=\"orphans:0;widows:0\">By the time the train arrived /    at the platform, / most of the passengers / have already boarded    another train.</p>", "option1": "<p style=\"orphans:0;widows:0\">    By the time the train arrived</p>", "option2": " <p style=\"orphans:0;widows:0\">    most of the passengers</p>", "option3": " <p style=\"orphans:0;widows:0\">    have already boarded another train</p>", "option4": " <p style=\"orphans:0;widows:0\">    at the platform,</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The error lies in the segment <b>\"have already boarded    another train\"</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">When two    actions happen in the past, the action that occurred first is    expressed in the <b>Past Perfect Tense</b> (had + past    participle), and the subsequent action is expressed in the <b>Simple    Past Tense</b> (V2).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Since the    boarding happened before the train arrived (past tense:    'arrived'), the present perfect auxiliary 'have' should be    replaced with the past perfect auxiliary 'had'.</p>    <p style=\"orphans:0;widows:0\"><b>Correct sentence:</b> By the    time the train arrived at the platform, most of the passengers <i>had</i>    already boarded another train.</p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Sentences of a paragraph are given below in jumbled order. Arrange    the sentences in the correct order to form a meaningful and    coherent paragraph.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A. Inside,    they found an astonishing collection of golden treasures,    furniture, and chariots.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B. Howard    Carter was a British archaeologist who spent years searching for    royal tombs in Egypt.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C. Among    these artifacts was the legendary solid gold funerary mask of the    young pharaoh.</p>    <p style=\"orphans:0;widows:0\">D. In November 1922, his    persistent efforts were rewarded when his team uncovered the    entrance to King Tutankhamun's tomb.</p>", "option1": "<p style=\"orphans:0;widows:0\">    BDAC</p>", "option2": " <p style=\"orphans:0;widows:0\">    BADC</p>", "option3": " <p style=\"orphans:0;widows:0\">    DBAC</p>", "option4": " <p style=\"orphans:0;widows:0\">    DABC</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Sentence B introduces the central figure, Howard Carter, and his    mission in Egypt, making it the appropriate opening sentence.    Sentence D logically follows B by describing the culmination of    his efforts with the discovery of Tutankhamun's tomb in 1922.    Sentence A then describes what was found 'inside' the tomb, and    Sentence C connects to A by detailing a specific item among 'these    artifacts'. Therefore, the correct logical sequence is BDAC.</p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">None of the volunteers displayed    as __________ enthusiasm for the relief work as Aarav did.</p>", "option1": "<p style=\"orphans:0;widows:0\">    many</p>", "option2": " <p style=\"orphans:0;widows:0\">    more</p>", "option3": " <p style=\"orphans:0;widows:0\">    much</p>", "option4": " <p style=\"orphans:0;widows:0\">    most</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (C) <b>much</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    correlative structure <b>'as + adjective/adverb/determiner + as'</b>    is used to make comparisons of equality and requires the positive    degree. Therefore, comparative ('more') and superlative ('most')    forms are incorrect.</p>    <p style=\"orphans:0;widows:0\">2. The noun 'enthusiasm' is    uncountable. The determiner <b>'much'</b> is used with uncountable    nouns, whereas <b>'many'</b> is used with plural countable nouns.    Hence, 'much' is the grammatically correct choice.</p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in reported    speech.</p>    <p style=\"orphans:0;widows:0\">'I am eager to present my new    project,' the architect said excitedly.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The architect excitedly said that he is eager to present his new    project.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The architect excitedly said that he would be eager to present his    new project.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The architect excitedly said that he was eager to present his new    project.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The architect excitedly said that he had been eager to present his    new project.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is an assertive sentence in direct speech. To    convert it into reported speech:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    reporting verb 'said excitedly' remains in the past tense (or can    be written as 'excitedly said').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. The    conjunction 'that' is used to connect the reporting clause and the    reported clause.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. The    first-person pronoun 'I' changes to 'he', and 'my' changes to    'his' according to the subject 'the architect'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. The    present tense 'am' changes to past tense 'was'.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct sentence    is: 'The architect excitedly said that he was eager to present his    new project.'</p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in direct    speech.</p>    <p style=\"orphans:0;widows:0\">The coordinator announced that    the workshop had been cancelled.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The coordinator announces, \"The workshop has been cancelled.\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    The coordinator announced, \"The workshop had been cancelled.\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    The coordinator announced, \"The workshop has been cancelled.\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    The coordinator announced, \"The workshop was being    cancelled.\"</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the indirect speech into direct speech, we follow these    rules:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb 'announced' is in the past tense, so it remains 'announced'    (and not 'announces').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    conjunction 'that' is removed and replaced with a comma and    inverted commas.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The past    perfect passive tense ('had been cancelled') in indirect speech    changes back to the present perfect passive tense ('has been    cancelled') in direct speech.</p>    <p style=\"orphans:0;widows:0\">Hence, the correct direct speech    is: <b>The coordinator announced, \"The workshop has been    cancelled.\"</b></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">The texture of the handmade jute    bag was extremely __________ and rough.</p>", "option1": "<p style=\"orphans:0;widows:0\">    course</p>", "option2": " <p style=\"orphans:0;widows:0\">    coarse</p>", "option3": " <p style=\"orphans:0;widows:0\">    curse</p>", "option4": " <p style=\"orphans:0;widows:0\">    corpse</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B) coarse</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>'Coarse'</b>    means rough or harsh in texture, which correctly fits the context    of describing a rough jute bag. <b>'Course'</b> refers to a    direction, path, or a series of lessons. 'Curse' means an appeal    to a supernatural power to inflict harm. 'Corpse' refers to a dead    body.</p>    <p style=\"orphans:0;widows:0\">Therefore, <b>'coarse'</b> is the    correct word.</p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that gives the correct meaning of the given    idiom:</p>    <p style=\"orphans:0;widows:0\"><b>\"To wash dirty linen in    public\"</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    To dry clothes in an open area</p>", "option2": " <p style=\"orphans:0;widows:0\">    To discuss private or embarrassing matters publicly</p>", "option3": " <p style=\"orphans:0;widows:0\">    To blame others for one's own mistakes</p>", "option4": " <p style=\"orphans:0;widows:0\">    To clean up one's house before visitors arrive</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The idiom <b>\"to wash dirty linen in public\"</b> means    to discuss or debate private, embarrassing, or unsavory    personal/family matters in front of others or publicly. Hence,    <b>option B</b> is the correct answer.</p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Fill in the blank with the most appropriate option:</b></p>    <p style=\"orphans:0;widows:0\">Despite his eloquent delivery,    the speaker’s argument lacked the logical ________ necessary to    persuade the analytical audience.</p>", "option1": "<p style=\"orphans:0;widows:0\">    fallacy</p>", "option2": " <p style=\"orphans:0;widows:0\">    cogency</p>", "option3": " <p style=\"orphans:0;widows:0\">    latency</p>", "option4": " <p style=\"orphans:0;widows:0\">    brevity</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (B) <b>cogency</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meaning of    the words:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Cogency:</b>     the quality of being clear, logical, and convincing. The     collocation \"logical cogency\" appropriately fits the     context, describing the compelling power required to persuade an     analytical audience.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Fallacy:</b>     a mistaken belief or a failure in reasoning that renders an     argument invalid.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Latency:</b>     the state of being dormant or not yet manifested.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Brevity:</b> concise and     exact use of words in writing or speech.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate option to substitute the underlined    segment in the given sentence. If no substitution is required,    select 'No substitution required':</b></p>    <p style=\"orphans:0;widows:0\">The hotel provides <u>complementary</u>    breakfast and high-speed Wi-Fi to all its guests.</p>", "option1": "<p style=\"orphans:0;widows:0\">    complimentary</p>", "option2": " <p style=\"orphans:0;widows:0\">    compliant</p>", "option3": " <p style=\"orphans:0;widows:0\">    complementing</p>", "option4": " <p style=\"orphans:0;widows:0\">    No substitution required</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (A) <b>complimentary</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Complimentary</b>     means given or supplied free of charge as a courtesy or favor     (e.g., 'complimentary breakfast').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Complementary</b>     means combining in such a way as to enhance or emphasize the     qualities of each other (serving as a complement).</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Since the sentence refers to a    free breakfast provided by the hotel, <b>'complimentary'</b> is    the correct word.</p>", "question_heading": ""}, {"sr_no": 50, "question": "Rधोक पुध ीियियथing ूोौौोgध cोनधीिहिद ोnक ोnौथधन पुध तहधौपiयnौ पुोप ीियियथ. In पुध cयnपधंूयनोनद कigiपोि िोnकौcोूध, पुध cयंंयकiीicोपiयn यी ुहंोn ोपपधnपiयn ुोौ धंधनgधक ोौ पुध कधीining ृहौinधौौ ंयकिध यी पुध inीयनंोपiयn ोgध. Wुiिध ोकॅधनपiौing in धोिनiधन धनोौ थोौ cयnौपनोinधक ृद ृनयोकcोौप ौcुधकिहधौ ोnक ूुदौicोि ृiििृयोनकौ, ंयकधनn कigiपोि धcयौदौपधंौ यूधनोपध यn हृiतहiपयहौ ूिोपीयनंौ धnginधधनधक ीयन cयnपinहयहौ धngोgधंधnप. Tधcु cयngियंधनोपधौ nय ियngधन ंधनिधद ूनयॅiकध हपiिiपोनiोn पयियसे पुधद कधौign कigiपोि धnॅiनयnंधnपौ धसूिiciिपद यूपiंप्रधक पय cोूपहनध, ंयnधपप्रध, ोnक ंयnयूियप्रध हौधन ीयcहौ. Tुध ूधनॅोौiॅध कधूियदंधnप यी ोिgयनiपुंic nयपiीicोपiयn ौदौपधंौ inपधnौiीiधौ पुiौ धसपनोcपiयn ृद निधदing यn ॅोनiोृिध नधथोनक ौcुधकिहधौ—ो ूौदcुिययgicोि ंधcुोniौं यी inपधनंiपपधnप नधinीयनcधंधnप पुोप पनiggधनौ cयंूिहसiॅध ौcनधधn-cुधcाing ोnक ाधधूौ inकiॅiकहोिस ूधनूधपहोििद पधपुधनधक पय पुधiन कधॅicधौ. Tुध नोंiीicोपiयnौ यी पुiौ कदnोंic धसपधnक थिधि ृधदयnक inकiॅiकहोि थोौपधक ुयहनौ. Tुध यंniूनधौधncध यी ंicनय-पोनgधपधक ौपiंिहi ुोौ ीयौपधनधक थiकधौूनधोक cयgniपiॅध ीनोgंधnपोपiयn, ो ौपोपध थुधनधin पुध cोूोciपद ीयन कधधू cयnपधंूिोपiयn, ौहौपोinधक नधोकing, ोnक ौहौपोinधक inतहiनद iौ ौदौपधंोपicोििद धनयकधक. Wुधn ो ौयciधपद ौहccहंृौ पय cयnपinहयहौ कiौपनोcपiयn, cियिधcपiॅध ूनयृिधं-ौियॅing iौ ौधॅधनिधद iंूोiनधक, ोौ nहोncधक नधीिधcपiयn iौ नधूिोcधक ृद iंूिहसiॅध, ृiपध-ौप्रधक cयnौहंूपiयn. Tय cयnीनयnप पुiौ cनiौiौ कधंोnकौ ीोन ंयनध पुोn inकiॅiकहोि थiििूयथधन यन ौहूधनीiciोि कigiपोि कधपयसधौे iप nधcधौौiपोपधौ नधcोिiृनोपing यहन निधोपiयnौुiू थiपु कigiपोि ोनcुiपधcपहनध पुनयहgु धपुicोि ौयीपथ d the following passage carefully and answer the questions    that follow.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">As Elena and    her fellow scholars entered the secluded valley of Aethelgard,    wonder was overshadowed by suspicion. From the heights of the    mountain pass, the sanctuary’s crystal domes shimmered like    fallen stars, radiating a promise of perpetual harmony. Upon    crossing the outer threshold, however, every visitor was mandated    to ingest an aromatic herbal infusion. The Elders insisted that    the brew merely calmed the senses against the valley’s    intoxicating mountain air, but the scholars suspected an ulterior    motive: the potion might dull critical discernment and make the    sanctuary appear far more serene than it genuinely was. Within the    settlement, an unnatural calm permeated every facet of daily    existence. The stone dwellings were painted entirely in muted    silver, soft chimes echoed continuously through the streets,    residents spoke only in hushed monotones, and even public scrolls    avoided any mention of discord. This pervasive stillness pointed    not merely to spiritual refinement, but to a calculated    suppression of free thought. Yet the serene facade failed to    assuage the visitors’ inner turmoil. Elena sought lost    historical truths, Julian longed to find his exiled mentor, and    Marcus hoped to secure vital medicinal knowledge. Their pressing    personal missions overshadowed the sanctuary’s outward    perfection. Their aspirations depended on the elusive Grand    Archivist, although no resident could confirm his true origins.    When informed that each scholar would be granted an audience in    isolation, they felt distinctly uneasy, as they had counted on    collective resolve to navigate the encounter.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">What did the mandatory    consumption of the herbal infusion lead the s , "option3": " <p style=\"orphans:0;widows:0\">    normative</p>", "option4": " <p style=\"orphans:0;widows:0\">    codified</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The dash elaborates on the adjective: 'a radical refusal of    surveillance capital, a definitive retreat from the imperative to    be endlessly quantified and archived.' In critical and    post-structuralist thought, 'fugitive' describes practices of    escape, evasion, and refusal of capture by institutional matrices,    contrasting with 'assimilative'. 'Programmatic', 'normative', and    'codified' all imply submission to predetermined rules and    taxonomic systems.</p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Fill in the blank with the correctly spelt word.</p>    <p style=\"orphans:0;widows:0\">The minister was condemned for    his _________ response to the border crisis, displaying an utter    lack of courage and resolve.</p>", "option1": "<p style=\"orphans:0;widows:0\">    pusilanimous</p>", "option2": " <p style=\"orphans:0;widows:0\">    pusillanemous</p>", "option3": " <p style=\"orphans:0;widows:0\">    pusillanimous</p>", "option4": " <p style=\"orphans:0;widows:0\">    pusilanimeous</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correctly spelt word to fill in the blank is <b>pusillanimous</b>,    which means showing a lack of courage or determination; timid or    cowardly.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Etymological    breakdown: <i>pusillus</i> (very small/weak) + <i>animus</i>    (spirit/courage) + <i>-ous</i>.</p>    <p style=\"orphans:0;widows:0\">Hence, option C is the correct    answer.</p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"orphans:0;widows:0\">    Select the sentence that has NO spelling errors.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The eccentric connoisseur exhibited an idiosyncrasy that intrigued    the ophthalmologist.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The eccentric connoiseur exhibited an idiosyncracy that intrigued    the ophthalmologist.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The eccentric connoisseur exhibited an idiosyncracy that intrigued    the opthalmologist.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The eccentric connoisseur exhibited an idiosyncrasy that intrigued    the opthalmologist.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The sentence with no spelling errors is: <b>\"The eccentric    connoisseur exhibited an idiosyncrasy that intrigued the    ophthalmologist.\"</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Key spelling    points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Connoisseur:</b>    Spelled with a double 'n' and double 's' (c-o-n-n-o-i-s-s-e-u-r).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Idiosyncrasy:</b>    Ends in 'sy', not 'cy' (i-d-i-o-s-y-n-c-r-a-s-y).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Ophthalmologist:</b>    Begins with 'ophth-' containing both 'ph' and 'th'    (o-p-h-t-h-a-l-m-o-l-o-g-i-s-t).</p>    <p style=\"orphans:0;widows:0\">All other options contain errors    in one or more of these challenging words.</p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that best improves the underlined portion of the    given sentence:</p>    <p style=\"orphans:0;widows:0\">The groundbreaking hypotheses    proposed by the astrophysicist, <u>which was initially dismissed    by conventional researchers, they have revolutionized</u> our    understanding of dark matter.</p>", "option1": "<p style=\"orphans:0;widows:0\">    which was initially dismissed by conventional researchers, they    have revolutionized</p>", "option2": " <p style=\"orphans:0;widows:0\">    which was initially dismissed by conventional researchers, have    revolutionized</p>", "option3": " <p style=\"orphans:0;widows:0\">    which were initially dismissed by conventional researchers, have    revolutionized</p>", "option4": " <p style=\"orphans:0;widows:0\">    which were initially dismissed by conventional researchers, they    have revolutionized</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>which were initially dismissed by    conventional researchers, have revolutionized</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">This sentence    contains two grammatical errors:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Subject-Verb    Agreement in the Relative Clause:</b> The antecedent of the    relative pronoun 'which' is the noun 'hypotheses', which is the    plural form of 'hypothesis'. Therefore, the relative clause    requires the plural verb <i>were</i> rather than the singular <i>was</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Redundant    Resumptive Pronoun:</b> The complete subject of the main clause is    'The groundbreaking hypotheses proposed by the astrophysicist'.    Inserting the pronoun <i>they</i> immediately before the predicate    creates a grammatically redundant double subject. The main verb    <i>have revolutionized</i> should directly follow the    non-restrictive clause.</p>    <p style=\"orphans:0;widows:0\"><b>Option C</b> corrects both    issues.</p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that best improves the underlined portion of the    given sentence:</p>    <p style=\"orphans:0;widows:0\">The government's new initiative    <u>not only aims to curb environmental pollution but it also    creates</u> thousands of green jobs.</p>", "option1": "<p style=\"orphans:0;widows:0\">    aims not only to curb environmental pollution but it also creates</p>", "option2": " <p style=\"orphans:0;widows:0\">    not only aims to curb environmental pollution but also creates</p>", "option3": " <p style=\"orphans:0;widows:0\">    not only aims to curb environmental pollution but creates also</p>", "option4": " <p style=\"orphans:0;widows:0\">    not aims to curb environmental pollution but it also creates</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The correlative conjunction pair <b>'not only ... but also'</b>    requires parallel grammatical structures. Here, both parts should    connect the two parallel verbs (<i>aims</i> and <i>creates</i>)    that share the same subject (<i>The government's new initiative</i>).    The inclusion of the pronoun 'it' in <i>'but it also creates'</i>    is redundant and violates parallelism. Removing 'it' leaves <b>'not    only aims to curb environmental pollution but also creates'</b>,    which is grammatically correct and concise.</p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कौन सा कनेक्टर मानक आधुनिक लैपटॉप पर एकल उलटा पोर्ट के माध्यम से उच्च-गति डेटा स्थानांतरण के साथ डिस्प्ले आउटपुट और पावर डिलीवरी को सक्षम करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>VGA इंटरफेस</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>USB Type-C / Thunderbolt इंटरफेस</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सीरियल DB9 पोर्ट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पैरेलल LPT पोर्ट</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आधुनिक USB Type-C और Thunderbolt इंटरफेस उच्च-बैंडविड्थ डेटा लेन, वीडियो सिग्नल और USB पावर डिलीवरी को एक कॉम्पैक्ट कनेक्टर में जोड़ते हैं, जो पुराने VGA, सीरियल या पैरेलल पोर्ट्स के विपरीत है।</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">माइक्रोसॉफ्ट एक्सेल में, कौन सा शॉर्टकट कुंजी \"फॉर्मेट सेल्स\" डायलॉग बॉक्स खोलता है ताकि आप नंबर फॉर्मेट, टेक्स्ट संरेखण, बॉर्डर और फिल स्टाइल को अनुकूलित कर सकें?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + 1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Shift + L</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Shift + F11</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Alt + F1</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + 1 दबाने से MS एक्सेल में सीधे फॉर्मेट सेल्स डायलॉग बॉक्स खुलता है, जो नंबर, संरेखण, फॉन्ट, बॉर्डर, फिल और सुरक्षा टैब्स तक त्वरित पहुंच प्रदान करता है।</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कौन सा प्रोटोकॉल ईमेल क्लाइंट को मेल सर्वर पर संदेशों की प्रतिलिपि रखने या हटाने का विकल्प देते हुए ऑफ़लाइन पढ़ने के लिए संदेश डाउनलोड करने की अनुमति देता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>POP3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FTP</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SNMP</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Telnet</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>POP3 (पोस्ट ऑफिस प्रोटोकॉल वर्जन 3) एक रिमोट मेल सर्वर से ईमेल संदेशों को स्थानीय क्लाइंट पर प्राप्त करता है (आमतौर पर डिफ़ॉल्ट रूप से सर्वर से हटा देता है जब तक कि एक प्रति छोड़ने के लिए कॉन्फ़िगर न किया गया हो), जबकि IMAP सीधे सर्वर पर फ़ोल्डर्स को सिंक्रनाइज़ करता है।</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">एक स्पष्ट रूप से हानिरहित इंस्टॉलर, क्रैक, या मीडिया फ़ाइल के अंदर छिपा मैलवेयर जो खोले जाने पर छिपी हुई दुर्भावनापूर्ण क्रियाएं निष्पादित करता है, उसे कहा जाता है:</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ट्रोजन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फ़ायरवॉल</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>डीफ़्रैग्मेंटर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>लोड बैलेंसर</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक ट्रोजन उपयोगकर्ताओं को वैध या वांछनीय दिखाकर धोखा देता है जबकि वह एक छिपे हुए पेलोड—जैसे कि रिमोट एक्सेस टूल या स्पाइवेयर—को ले जाता है, बिना स्वयं को वर्म की तरह प्रतिकृति बनाए।</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कौन सी नॉन-वोलेटाइल मेमोरी तकनीक धीमे स्टोरेज ड्राइव्स और मुख्य मेमोरी के बीच स्थित होती है ताकि बार-बार एक्सेस किए जाने वाले फाइल्स और सिस्टम स्टार्टअप को तेज किया जा सके?</span></p>", कर देता है।</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">जब कई प्राप्तकर्ताओं को ईमेल भेजा जाता है, तो BCC फील्ड में पतों को रखने से प्राप्तकर्ताओं की गोपनीयता कैसे सुरक्षित होती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यह अन्य प्राप्तकर्ताओं को BCC फील्ड में सूचीबद्ध ईमेल पतों को देखने से रोकता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यह स्वचालित रूप से भेजे गए संदेश को प्रेषक के Sent फोल्डर से हटा देता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यह अटैचमेंट्स को पासवर्ड-सुरक्षित ZIP फाइलों में बदल देता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यह बाहरी डोमेन से आने वाले जवाबों को ब्लॉक कर देता है</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Blind Carbon Copy (BCC) में रखे गए पते To, CC और अन्य BCC प्राप्तकर्ताओं को दिखाई देने वाले दृश्यमान प्राप्तकर्ता हेडर से हटा दिए जाते हैं, जिससे संपर्क सूचियों का बड़े पैमाने पर एक्सपोजर रोका जाता है।</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कौन सा साइबर हमला डोमेन नाम रिज़ॉल्यूशन को मैनिपुलेट करता है जिससे एक उपयोगकर्ता वास्तविक वेबसाइट एड्रेस डालने पर एक धोखाधड़ी वाली साइट पर भेज दिया जाता है बिना किसी भ्रामक लिंक पर क्लिक किए?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DNS स्पूफिंग / फार्मिंग</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कीस्ट्रोक लॉगिंग</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रैंसमवेयर एन्क्रिप्शन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>लोकल डिस्प्ले पर पैकेट स्निफिंग</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फार्मिंग या DNS स्पूफिंग DNS रिज़ॉल्यूशन को करप्ट कर देती है (जैसे DNS कैश को पॉइज़न करना या होस्ट्स फाइल को बदलना) ताकि एक वैध डोमेन नाम एक अटैकर-कंट्रोल्ड IP एड्रेस पर रिज़ॉल्व हो जाए।</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">विंडोज़ फ़ाइल एक्सप्लोरर और अधिकांश वेब ब्राउज़र में एड्रेस बार को चुनने के लिए कौन सी शॉर्टकट कुंजी है ताकि आप तुरंत एक पथ या URL टाइप कर सकें?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Alt + D (या ब्राउज़र में Ctrl + L)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Z</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Shift + Esc</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Alt + D दबाने से विंडोज़ फ़ाइल एक्सप्लोरर में एड्रेस बार फोकस होता है और प्रमुख वेब ब्राउज़र में URL बार हाइलाइट होता है (Ctrl + L भी अधिकांश ब्राउज़र में एड्रेस बार को फोकस करता है)।</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">माइक्रोसॉफ्ट पावरपॉइंट में, कौन सा एनीमेशन प्रकार स्लाइड ऑब्जेक्ट को परिभाषित रेखा, वक्र, लूप या कस्टम-ड्रॉन पथ के साथ चलाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मोशन पाथ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्लाइड सॉर्टर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्पीकर नोट्स</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्लाइड मास्टर</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मोशन पाथ एनीमेशन चयनित आकृति, आइकन या टेक्स्ट बॉक्स को स्लाइड पर प्रीस्ट या कस्टम-ड्रॉन वक्रों का उपयोग करके यात्रा करने वाले प्रक्षेपवक्र को नियंत्रित करते हैं।</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">वेब ब्राउज़िंग के दौरान थर्ड-पार्टी कुकीज़ फर्स्ट-पार्टी कुकीज़ से कैसे भिन्न होती हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>थर्ड-पार्टी कुकीज़ एड्रेस बार में दिखाए गए साइट के बजाय एक बाहरी डोमेन (जैसे कि विज्ञापन या एनालिटिक्स नेटवर्क) द्वारा सेट की जाती हैं</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>थर्ड-पार्टी कुकीज़ केवल स्थानीय स्क्रीन ब्राइटनेस सेटिंग्स स्टोर करती हैं</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फर्स्ट-पार्टी कुकीज़ लॉगिन या कार्ट प्राथमिकताएँ स्टोर नहीं कर सकतीं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>थर्ड-पार्टी कुकीज़ ब्राउज़र कैश को स्थायी रूप से अक्षम कर देती हैं</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फर्स्ट-पार्टी कुकीज़ सीधे उस वेबसाइट द्वारा बनाई जाती हैं जिसे आप विज़िट कर रहे होते हैं, जो सत्रों या प्राथमिकताओं को बनाए रखने के लिए होती हैं, जबकि थर्ड-पार्टी कुकीज़ पेज पर एम्बेडेड अन्य डोमेन द्वारा रखी जाती हैं, आमतौर पर क्रॉस-साइट ट्रैकिंग और टार्गेटेड विज्ञापनों के लिए।</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कौन सा प्रोटोकॉल TLS/SSL का उपयोग करके ट्रांजिट में डेटा को एन्क्रिप्ट करके वेब ट्रैफ़िक को सुरक्षित करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HTTPS</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Telnet</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>TFTP</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Gopher</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HTTPS (हाइपरटेक्स्ट ट्रांसफर प्रोटोकॉल सिक्योर) ब्राउज़र और वेब सर्वर के बीच गोपनीयता, अखंडता और सर्वर प्रामाणिकता की सुरक्षा के लिए HTTP को TLS (ट्रांसपोर्ट लेयर सिक्योरिटी, SSL का उत्तराधिकारी) पर लेयर करता है।</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित में से कौन सा उपकरण पूरी तरह से एक आउटपुट उपकरण है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रिंटर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>लाइट पेन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ट्रैकबॉल</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ऑप्टिकल मार्क रीडर (OMR)</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक प्रिंटर कंप्यूटर द्वारा भेजे गए डिजिटल दस्तावेज़ों से मानव-पठनीय हार्ड कॉपी आउटपुट उत्पन्न करता है, जबकि एक लाइट पेन, ट्रैकबॉल और OMR सिस्टम में इनपुट कैप्चर करते हैं।</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MS Word में खुले दस्तावेज़ में किए गए परिवर्तनों को सहेजने के लिए कौन सा कुंजी संयोजन उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + S</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + X</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + Y</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + F</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + S MS Word में वर्तमान दस्तावेज़ को सहेजने के लिए मानक शॉर्टकट है (जबकि Ctrl + X काटता है, Ctrl + Y पुन: करता है, और Ctrl + F फाइंड बॉक्स खोलता है)।</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">ईमेल संदेश में, ईमेल पता जोड़ते समय CC क्या दर्शाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कार्बन कॉपी — संदेश हेडर पर दिखाई देने वाले अतिरिक्त प्राप्तकर्ताओं को सूचनात्मक प्रति भेजना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कैश क्लियर — भेजने से पहले अस्थायी ब्राउज़र डेटा साफ़ करना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सर्टिफाइड साइफर — फाइलों को एक संग्रह में संपीड़ित करना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सेंट्रल क्लाउड — अटैचमेंट्स को बाहरी स्टोरेज पर अपलोड करना</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CC (कार्बन कॉपी) ईमेल की एक प्रति सेकेंडरी प्राप्तकर्ताओं को भेजता है जिनके पते To और CC फील्ड्स में अन्य प्राप्तकर्ताओं को दिखाई देते हैं।</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कौन सा नेटवर्क डिवाइस रूटिंग टेबल और आईपी एड्रेस का उपयोग करके अलग-अलग नेटवर्क के बीच डेटा पैकेट फॉरवर्ड करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>राउटर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>वेबकैम</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>जॉयस्टिक</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्लॉटर</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक राउटर अलग-अलग नेटवर्क (जैसे घर या ऑफिस LAN और इंटरनेट) को जोड़ता है और नेटवर्क लेयर (आईपी) एड्रेसिंग के आधार पर उनके बीच डेटा पैकेट फॉरवर्ड करने के लिए सबसे अच्छा रास्ता निर्धारित करता है।</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कौन सा प्रकार की मेमोरी नॉन-वोलेटाइल होती है और आमतौर पर BIOS या UEFI फर्मवेयर जैसे निम्न-स्तरीय स्टार्टअप निर्देशों को रखती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ROM (रीड-ओनली मेमोरी / फ्लैश/EEPROM)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SRAM कैश</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SDRAM मुख्य मेमोरी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रजिस्टर फाइल</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रीड-ओनली मेमोरी (आजकल फ्लैश या EEPROM जैसी पुनर्लेखनीय नॉन-वोलेटाइल तकनीकों का उपयोग करके लागू) विद्युत शक्ति के बिना संग्रहीत फर्मवेयर और बूट कोड को बनाए रखती है, जो वोलेटाइल RAM के विपरीत है।</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">माइक्रोसॉफ्ट एक्सेल में, कौन सा आधुनिक लुकअप फंक्शन एक पंक्ति या स्तंभ रेंज को खोजता है और एक निश्चित स्तंभ इंडेक्स नंबर की आवश्यकता के बिना दूसरी पंक्ति या स्तंभ से मिलान करने वाला आइटम लौटाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>XLOOKUP</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>AVERAGEIF</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CONCAT</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NOW</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>XLOOKUP एक लुकअप ऐरे को खोजता है और किसी भी दिशा (ऊर्ध्वाधर या क्षैतिज) में रिटर्न ऐरे से संबंधित आइटम लौटाता है और इसमें अंतर्निहित सटीक/वाइल्डकार्ड मिलान और डिफ़ॉल्ट \"नहीं मिला\" मान समर्थित हैं।</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">दो-फैक्टर प्रमाणीकरण (2FA) या OTP अकेले पासवर्ड से परे ऑनलाइन बैंकिंग सुरक्षा को कैसे मजबूत करता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इसमें एक अतिरिक्त सत्यापन कारक (जैसे समय-सीमित OTP या हार्डवेयर/ऐप प्रॉम्प्ट) की आवश्यकता होती है, इसलिए चोरी हुआ पासवर्ड स्वयं कार्रवाई को अधिकृत नहीं कर सकता</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यह उपयोगकर्ता के इनबॉक्स में आने वाले सभी स्पैम ईमेलों को स्थायी रूप से रोक देता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यह उपयोगकर्ता के स्मार्टफोन की भौतिक RAM क्षमता को बढ़ाता है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यह ट्रांसफर के दौरान नेटवर्क कनेक्टिविटी की आवश्यकता को समाप्त कर देता है</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो-फैक्टर प्रमाणीकरण दो अलग-अलग सत्यापन कारकों को जोड़ता है—आमतौर पर कुछ जो आप जानते हैं (पासवर्ड) और कुछ जो आपके पास है या हैं (OTP डिवाइस/प्रमाणक ऐप/बायोमेट्रिक)—जिससे क्रेडेंशियल लीक से खाता अधिग्रहण का जोखिम कम होता है।</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">मैन-इन-द-मिडिल (MitM) हमले में, दो संचार करने वाले एंडपॉइंट्स के बीच हमलावर क्या कर रहा होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उनके बीच से गुजरने वाले संदेशों को गुप्त रूप से इंटरसेप्ट करना और संभावित रूप से पढ़ना या संशोधित करना</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>लोकल बैकअप फाइलों के साथ एक सिंगल डिस्क ड्राइव को ओवरलोड करना</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मॉनिटर केबल को USB हब से बदलना</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सिस्टम लॉग फाइलों को एक आर्काइव में कंप्रेस करना</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मैन-इन-द-मिडिल हमलावर खुद को दो पक्षों—जैसे क्लाइंट और सर्वर या दो डिवाइसेस—के बीच स्थित करता है ताकि उनकी तत्काल जागरूकता के बिना संचार को ईव्सड्  उस ग्रुप से संबंधित नहीं है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(नोट: असंगत अक्षर-समूह युग्म, व्यंजनों/स्वरों की संख्या या अक्षर-समूह युग्मों में उनकी स्थिति पर आधारित नहीं है।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CE - HJ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>IK - NQ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LN - QS</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PR - UW</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रत्येक अक्षर-समूह युग्म में अक्षरों के स्थानीय मानों का विश्लेषण करते हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1) CE - HJ:</span><span> C(3) + 2 = E(5); E(5) + 3 = H(8); H(8) + 2 = J(10) → (+2, +3, +2)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2) IK - NQ:</span><span> I(9) + 2 = K(11); K(11) + 3 = N(14); N(14) + 3 = Q(17) → (+2, +3, +3</span><span style=\"font-weight:bold\">)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3) LN - QS:</span><span> L(12) + 2 = N(14); N(14) + 3 = Q(17); Q(17) + 2 = S(19) → (+2, +3, +2)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">4) PR - UW:</span><span> P(16) + 2 = R(18); R(18) + 3 = U(21); U(21) + 2 = W(23) → (+2, +3, +2)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">'IK - NQ' को छोड़कर अन्य सभी युग्म (+2, +3, +2) के पैटर्न का अनुसरण करते हैं, जबकि 'IK - NQ' में (+2, +3, +3) का पैटर्न है। अतः, IK - NQ असंगत है।</span></p>", "question_heading": ""}, {"sr_no": 10  गई शृंखला को पूरा करने के लिए विकल्पों में से वह आकृति चुनिए जो प्रश्न चिह्न (?) को प्रतिस्थापित कर सकती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289379746_image050.png\" width=\"500\" height=\"102\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289379746_image051.png\" width=\"130\" height=\"130\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289379746_image052.png\" width=\"130\" height=\"130\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289379746_image053.png\" width=\"130\" height=\"130\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289379746_image054.png\" width=\"130\" height=\"130\" alt ></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यह शृंखला एक साथ दो नियमों का अनुसरण करती है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. तत्वों की संख्या और प्रकार:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रत्येक अगली आकृति में दाईं ओर एक नया तत्व जुड़ता है (पहली आकृति में 1, फिर 2, 3, 4 और 5वीं आकृति में 5 तत्व होने चाहिए)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तत्व तीन विशिष्ट आकृतियों के एक निश्चित चक्रीय क्रम का अनुसरण करते हैं: (1) </span><span style=\"font-weight:bold\">तीर (Arrow)</span><span>, (2) </span><span style=\"font-weight:bold\">वृत्त (Circle)</span><span>, और (3) </span><span style=\"font-weight:bold\">वर्ग (Square)</span><span>।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इस क्रम के अनुसार, 5वीं आकृति में बाएं से दाएं 5 तत्व होने चाहिए: </span><span style=\"font-weight:bold\">तीर, वृत्त, वर्ग, तीर, वृत्त</span><span>।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. ऊर्ध्वाधर उलटने (Inversion) का नियम:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रत्येक नया जुड़ने वाला तत्व हमेशा सीधी स्थिति (प्रतीक ऊपर) में प्रवेश करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अगली आकृति में जाने पर, </span><span style=\"font-style:italic\">पहले से मौजूद सभी तत्व ऊर्ध्वाधर रूप से उलट जाते हैं</span><span>।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आकृति 5 में प्रत्येक स्थान की स्थिति:पहला तत्व (तीर): ऊपर (F1) → नीचे (F2) → ऊपर (F3) → नीचे (F4) → </span><span style=\"font-weight:bold\">ऊपर (F5)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दूसरा तत्व (वृत्त): ऊपर (F2) → नीचे (F3) → ऊपर (F4) → </span><span style=\"font-weight:bold\">नीचे (F5)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीसरा तत्व (वर्ग): ऊपर (F3) → नीचे (F4) → </span><span style=\"font-weight:bold\">ऊपर (F5)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चौथा तत्व (तीर): ऊपर (F4) → </span><span style=\"font-weight:bold\">नीचे (F5)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पाँचवाँ तत्व (वृत्त): नया जुड़ा तत्व → </span><span style=\"font-weight:bold\">ऊपर (F5)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, सही आकृति में बाएं से दाएं क्रम होगा: </span><span style=\"font-weight:bold\">तीर (ऊपर), वृत्त (नीचे), वर्ग (ऊपर), तीर (नीचे), वृत्त (ऊपर)</span><span>, जो विकल्प (C) में दर्शाया गया है।</span></p>", "question_heading": ""}, {"sr_no": 107, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक निश्चित कूट भाषा में, 'CRAFT' को '26148', 'STARE' को '78163', 'FROST' को '46578' और 'ACTOR' को '12856' के रूप में कूटबद्ध किया जाता है (अंकों का क्रम आवश्यक रूप से अक्षरों के क्रम के अनुसार नहीं है)। उस भाषा में 'F' के लिए कूट क्या है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CRAFT </span><span style=\"font-family:Arial\">→</span><span> 26148</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FROST </span><span style=\"font-family:Arial\">→</span><span> 46578</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">समान अक्षर = R, F, T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">समान अंक = 4, 6, 8</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>STARE </span><span style=\"font-family:Arial\">→</span><span> 78163</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ACTOR </span><span style=\"font-family:Arial\">→</span><span> 12856</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">अन्य शब्दों के कोड से तुलना करने और शेष अक्षरों के अंक हटाने पर F = 4 प्राप्त होता है।</span></p>", "question_heading": ""}, {"sr_no": 108, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शब्द 'SECTIONAL' के दूसरे, चौथे, छठे और सातवें अक्षरों का प्रत्येक शब्द में केवल एक बार उपयोग करके कितने सार्थक अंग्रेजी शब्द बनाए जा सकते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीन से अधिक</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिया गया शब्द 'SECTIONAL' है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निर्दिष्ट अक्षर निम्नलिखित हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• दूसरा अक्षर = E</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• चौथा अक्षर = T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• छठा अक्षर = O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• सातवां अक्षर = N</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">प्राप्त अक्षर E, T, O और N हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रत्येक अक्षर का केवल एक बार उपयोग करके बनाए जा सकने वाले सार्थक अंग्रेजी शब्द हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. NOTE</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. TONE</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, ठीक</span><span style=\"font-weight:bold\"> दो सार्थक अंग्रेजी शब्द </span><span>बनाए जा सकते हैं।</span></p>", "question_heading": ""}, {"sr_no": 109, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निम्नलिखित शब्द युग्मों में से तीन किसी न किसी प्रकार से एक समान हैं और इसलिए एक समूह बनाते हैं। कौन-सा शब्द युग्म उस समूह से संबंधित नहीं है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(शब्दों को सार्थक शब्दों के रूप में माना जाना चाहिए और शब्द के अक्षरों/व्यंजनों/स्वरों की संख्या के आधार पर समूहीकृत नहीं किया जाना चाहिए।)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मंगल - फोबोस</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बृहस्पति - गेनीमेड</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शनि - टाइटन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यूरेनस - ट्राइटन</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए शब्द युग्मों में, दूसरा शब्द पहले शब्द में दिए गए ग्रह का एक प्रमुख प्राकृतिक उपग्रह (चंद्रमा) है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">मंगल - फोबोस:</span><span> फोबोस, मंगल का एक प्राकृतिक उपग्रह है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">बृहस्पति - गेनीमेड:</span><span> गेनीमेड, बृहस्पति का एक प्राकृतिक उपग्रह है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span style=\"font-weight:bold\">शनि - टाइटन:</span><span> टाइटन, शनि का एक प्राकृतिक उपग्रह है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. </span><span style=\"font-weight:bold\">यूरेनस - ट्राइटन:</span><span> ट्राइटन, </span><span style=\"font-weight:bold\">नेपच्यून (वरुण)</span><span> का सबसे बड़ा प्राकृतिक उपग्रह है, न कि यूरेनस (अरुण) का (यूरेनस का सब =\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">अतः, केवल निष्कर्ष I और II अनुसरण करते हैं।</span></p>", "question_heading": ""}, {"sr_no": 116, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>नीचे एक कागज़ को मोड़ने का क्रम और मोड़े गए कागज़ को काटने का तरीका दर्शाया गया है। उस विकल्प आकृति का चयन कीजिए जो कागज़ के खुले हुए रूप से सर्वाधिक मिलती-जुलती होगी।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289379746_image092.png\" width=\"330\" height=\"110\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289379746_image093.png\" width=\"100\" height=\"100\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289379746_image094.png\" width=\"100\" height=\"100\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289379746_image095.png\" width=\"100\" height=\"100\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289379746_image096.png\" width=\"100\" height=\"100\" alt ></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289379746_image097.png\" width=\"102\" height=\"103\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">यह पूरी तरह से विकल्प (B) से मेल खाता है।</span></p>", "question_heading": ""}, {"sr_no": 117, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंग्रेजी वर्णमाला क्रम के आधार पर एक निश्चित तरीके से BCED, GHJI से संबंधित है। उसी प्रकार, FGJI का संबंध KLON से है। उसी तर्क का पालन करते हुए निम्नलिखित में से किससे PQTS का संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>UVXY</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>UVYX</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>VUYX</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>UYXW</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">यहाँ अनुसरण किया गया तर्क प्रत्येक अक्षर के वर्णमाला क्रम में 5 जोड़ने का है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B (2) + 5 = G (7)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C (3) + 5 = H (8)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E (5) + 5 = J (10)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D (4) + 5 = I (9)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">अतः, BCED संबंधित है GHJI से।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यही तर्क PQTS पर लागू करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (16) + 5 = U (21)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q (17) + 5 = V (22)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T (20) + 5 = Y (25)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S (19) + 5 = X (24)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">अतः, PQTS का संबंध UVYX से है।</span></p>", "question_heading": ""}, {"sr_no": 118, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>नीचे दिए गए प्रश्न में एक कथन के बाद दो कार्यवाहियाँ दी गई हैं, जिन्हें I और II के रूप में संख्यांकित किया गया है। कथन में दी गई सभी बातों को सत्य मानते हुए, तय कीजिए कि दी गई कार्यवाहियों में से कौन-सी तार्किक रूप से अनुसरण करती है/हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कथन:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक व्यस्त राजमार्ग पर एक तीखे मोड़ के पास ओवरटेकिंग पर प्रतिबंध लगाने वाले प्रमुख साइनबोर्ड लगे होने के बावजूद, लापरवाही से ओवरटेकिंग के कारण उस स्थान से अक्सर दुर्घटनाओं की सूचना मिल रही है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कार्यवाहियाँ:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. चालकों को सचेत करने और वाहनों की गति कम करने के लिए तीखे मोड़ से पहले रंबल स्ट्रिप्स (गति अवरोधक पट्टियाँ) और चेतावनी ब्लिंकर लगाए जाने चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. हाईवे पेट्रोलिंग टीमों को इस हिस्से की नियमित निगरानी करनी चाहिए और ओवरटेकिंग प्रतिबंध का उल्लंघन करने वाले चालकों पर सख्त जुर्माना लगाना चाहिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल I अनुसरण करती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल II अनुसरण करती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो I और न ही II अनुसरण करती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I और II दोनों अनुसरण करती हैं</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोनों कार्यवाहियाँ तार्किक रूप से अनुसरण करती हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. कार्यवाही I एक व्यावहारिक सुरक्षात्मक उपाय है।</span><span> रंबल स्ट्रिप्स (गति अवरोधक पट्टियाँ) और चेतावनी ब्लिंकर लगाने से चालकों को समय रहते सतर्क करने और वाहनों की गति को नियंत्रित करने में सीधी मदद मिलेगी, जिससे तीखे मोड़ पर दुर्घटनाओं का जोखिम कम होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. कार्यवाही II एक आवश्यक प्रवर्तन उपाय है।</span><span> चूँकि केवल साइनबोर्ड लगाने से लापरवाही बरतने वाले चालकों पर असर नहीं हो रहा है, इसलिए नियमित निगरानी और दंडात्मक कार्रवाई से चालकों में नियम तोड़ने को लेकर डर पैदा होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">अतः, I और II दोनों कार्यवाहियाँ समस्या के समाधान के लिए उचित और प्रभावी हैं।</span></p>", "question_heading": ""}, {"sr_no": 119, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक संख्या पुनर्व्यवस्था मशीन दिए गए इनपुट को एक विशेष नियम के अनुसार चरण-दर-चरण पुनर्व्यवस्थित करती है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इनपुट: 46, 12, 79, 35, 68, 24</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चरण 1: 12, 46, 79, 35, 68, 24</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चरण 2: 12, 79, 46, 35, 68, 24</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चरण 3: 12, 79, 24, 46, 35, 68</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चरण 4: 12, 79, 24, 68, 46, 35</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चरण 5: 12, 79, 24, 68, 35, 46</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चरण 5 अंतिम आउटपुट है।</span></p><p style=\"margin-top:0p जक का चरणबद्ध विश्लेषण करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. U + V → U, V का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. V × W → V, W का भाई है। अतः, U, W का भी पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. W ÷ X → W, X की माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. X - Y → X, Y की बहन है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चूंकि W, X की माता है और U, W का पिता है, इसलिए U, X की माता का पिता अर्थात् नाना है।</span></p>", "question_heading": ""}, {"sr_no": 121, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि 10 अक्टूबर 2021 को रविवार था, तो 10 अक्टूबर 2014 को सप्ताह का कौन-सा दिन था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>गुरुवार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शुक्रवार</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शनिवार</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बुधवार</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10 अक्टूबर 2014 और 10 अक्टूबर 2021 के बीच कुल वर्षों की संख्या = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1795289379746_image098.png\" width=\"120\" height=\"21\" alt style=\"vertical-align:middle\" ><span> वर्ष।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इस अवधि में आने वाले लीप वर्ष = 2016 और 2020 (कुल 2 लीप वर्ष)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>साधारण वर्ष = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/17952
