<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>1.) ALL INDIA MOCK-1 (FREE - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

 Spelling and Grammar    checker dialog box in MS Office applications like Word.</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    <span><b>Which function is used in MS Excel to    find the largest value in a range of cells?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>MIN()</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>MAX()</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>COUNT()</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>SUM()</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>The MAX() function returns the highest value    from a specified set of numeric values or cell ranges.</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0\">    <span><b>Which shortcut key is used in MS    PowerPoint to start a slide show from the current active slide?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>F5</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Shift + F5</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Ctrl + F5</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Alt + F5</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>F5 starts the presentation from the    beginning (first slide), while Shift + F5 starts the slide show    from the current slide.</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0\">    <span><b>Which of the following is considered    system software?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>MS Word</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Operating System (OS)</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>VLC Media Player</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Adobe Photoshop</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>An Operating System is system software that    manages computer hardware, software resources, and provides common    services for computer programs.</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    <span><b>What does 'URL' stand for in the context    of web browsing and internet?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Uniform Resource Locator</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Universal Record Link</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Unified Resource Language</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Unidentified Routing Link</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>A URL is the address of a unique resource    found on the internet (web address).</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    <span><b>In email communication, what does 'BCC'    stand for?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Basic Carbon Copy</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Blind Carbon Copy</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Backup Computer Code</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Broadband Control Channel</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>BCC allows the sender of a message to send a    copy to other people without the main recipient(s) knowing that    they received it.</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0\">    <span><b>Which security protocol is primarily used    to ensure secure encrypted communication over the internet,    especially in e-banking?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>HTTP</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>FTP</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>HTTPS</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>SMTP</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>HTTPS (Hypertext Transfer Protocol Secure)    encrypts network traffic to protect sensitive data during online    transactions and e-banking.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0\">    <span><b>Which networking device operates at the    physical layer and broadcasts incoming data packets to all    connected ports without filtering?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Router</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Switch</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Hub</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Bridge</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>A network hub is a basic networking device    that broadcasts data to every port, unlike a switch which directs    data intelligently.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    <span><b>Which standard internet protocol is used    to fetch web pages from a web server?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>TCP/IP</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>HTTP</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>POP3</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>SNMP</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>HTTP (Hypertext Transfer Protocol) is the    underlying protocol used by the World Wide Web for transferring    web pages.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0\">    <span><b>A malicious program that masquerades as    desirable or useful software (like a game or utility) but carries    out harmful hidden functions is called:</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Worm</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Trojan Horse</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Spyware</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Adware</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>A Trojan looks legitimate to trick users    into downloading and executing it, subsequently opening backdoors    into the system.</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0\">    <span><b>Which malware is self-replicating and    travels across computer networks autonomously without requiring a    host program or human action?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Computer Virus</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Worm</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Logic Bomb</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Keylogger</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>Unlike viruses which need a host file to    spread, computer worms replicate themselves independently to    spread across network vulnerabilities.</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    <span><b>Which of the following hardware items is    strictly classified as an output device?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Barcode Reader</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Plotter</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Microphone</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Touchpad</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>A plotter is an output device that prints    high-quality vector graphics such as blueprints and large    architectural drawings.</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <span><b>Which file system is standard and widely    used in modern versions of Microsoft Windows?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>FAT32</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>NTFS (New Technology File System)</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>ext4</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>HFS+</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>NTFS is the primary file system used by    modern Windows versions, offering improved security, support for    larger files, and file compression.</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    <span><b>The process of copying a file from a    remote server or the internet onto your local computer is called:</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Uploading</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Downloading</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Browsing</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Streaming</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>Downloading refers to receiving data (files)    from a remote system, whereas uploading means sending data from    your system to a remote system.</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <span><b>An IPv4 network address consists of how    many bits?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>16 bits</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>32 bits</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>64 bits</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>128 bits</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>An IPv4 address is a 32-bit numeric address    written in dotted-decimal notation (e.g., 192.168.1.1). IPv6 uses    128 bits.</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <span><b>Which security tool acts as a dedicated    barrier to monitor and control incoming and outgoing network    traffic based on predetermined security rules?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Firewall</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Compiler</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Router</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Gateway</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>A firewall establishes a barrier between a    secure internal network and untrusted external networks (like the    Internet) to block unauthorized access.</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <b>The famous rock-cut 'Trimurti' (Sadashiva) sculpture of Lord    Shiva is located in which of the following caves in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Bhimbetka Caves</p>", "option2": " <p style=\"orphans:0;widows:0\">    Ajanta Caves</p>", "option3": " <p style=\"orphans:0;widows:0\">    Elephanta Caves</p>", "option4": " <p style=\"orphans:0;widows:0\">    Badami Caves</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The colossal rock-cut 'Trimurti' (also known as Maheshmurti)    sculpture representing three aspects of Lord Shiva—the Creator,    the Preserver, and the Destroyer—is located in Cave 1 of the    Elephanta Caves on Gharapuri Island near Mumbai, Maharashtra.    These rock-cut caves were designated as a UNESCO World Heritage    Site in 1987.</p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following renowned literary figures and polymaths    is famously referred to as the 'Bard of Bengal'?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Bankim Chandra Chattopadhyay</p>", "option2": " <p style=\"orphans:0;widows:0\">    Rabindranath Tagore</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kazi Nazrul Islam</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sarat Chandra Chattopadhyay</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Rabindranath Tagore is famously referred to as the 'Bard of    Bengal' (along with titles such as 'Gurudev' and 'Kabiguru'). He    was a prolific poet, writer, composer, and artist who reshaped    Bengali literature and music, and in 1913 became the first    non-European to receive the Nobel Prize in Literature for his    collection <i>Gitanjali</i>.</p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>With reference to the administrative and military reforms    introduced by Alauddin Khilji, which of the following statements    is/are correct?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. He introduced the practices of 'Dagh' (branding of horses)    and 'Chehra' (descriptive roll of soldiers) to prevent corruption    in the army.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. He established a separate department named    'Diwan-i-Mustakhraj' to investigate and collect unpaid revenue    arrears from intermediaries.</b></p>    <p style=\"orphans:0;widows:0\"><b>3. He    introduced the measurement of land ('Masahat') for revenue    assessment, using 'Biswa' as the standard unit of measurement.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "option4": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    All three statements are correct regarding Alauddin Khilji's    administrative, agrarian, and military reforms:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>Military    Reforms:</b> Alauddin was the first Delhi Sultan to maintain a    permanent standing army paid in cash. To prevent military fraud,    false muster, and the substitution of inferior mounts, he    introduced <i>Dagh</i> (branding of cavalry horses with the royal    emblem) and <i>Chehra</i> or <i>Huliya</i> (a detailed descriptive    roll of each soldier).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>Revenue    Department:</b> To eliminate embezzlement and secure maximum    revenue for the treasury, he created the department of    <i>Diwan-i-Mustakhraj</i>. Its primary task was to track down and    recover arrears of revenue from village headmen and revenue    collectors (like <i>Muqaddams</i>, <i>Kuts</i>, and <i>Amils</i>).</p>    <p style=\"orphans:0;widows:0\">3. <b>Agrarian Assessment:</b>    Alauddin instituted the measurement of land under cultivation    (known as <i>Masahat</i>) to determine the state's share of land    revenue (<i>Kharaj</i>, set at 50% of the produce in the fertile    Doab region). The standard unit of measurement adopted for this    purpose was the <i>Biswa</i> (the twentieth part of a bigha).</p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following styles of Indian temple architecture    emerged as a hybrid combining features of both the Nagara and    Dravida traditions?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Kalinga style</p>", "option2": " <p style=\"orphans:0;widows:0\">    Gandhara style</p>", "option3": " <p style=\"orphans:0;widows:0\">    Vesara style</p>", "option4": " <p style=\"orphans:0;widows:0\">    Hemadpanthi style</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The <b>Vesara style</b> of temple architecture developed in the    Deccan region under patronage from dynasties like the Badami    Chalukyas, Rashtrakutas, and Hoysalas. It represents a synthesis    or hybrid of the North Indian <i>Nagara</i> style and the South    Indian <i>Dravida</i> style, prominently seen in temples at    Aihole, Badami, Pattadakal, and Belur.</p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <b>Under Section 106(1) of the Bharatiya Nyaya Sanhita, 2023    (BNS), what is the maximum term of imprisonment prescribed for    causing death by any rash or negligent act not amounting to    culpable homicide (other than by a registered medical    practitioner)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Imprisonment up to 3 years and a fine</p>", "option2": " <p style=\"orphans:0;widows:0\">    Imprisonment up to 5 years and a fine</p>", "option3": " <p style=\"orphans:0;widows:0\">    Imprisonment up to 7 years and a fine</p>", "option4": " <p style=\"orphans:0;widows:0\">    Imprisonment up to 2 years and a fine</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Under Section 106(1) of the Bharatiya Nyaya Sanhita, 2023 (BNS),    causing death of any person by doing any rash or negligent act not    amounting to culpable homicide is punishable with imprisonment of    either description for a term which may extend to five years, and    shall also be liable to fine. (Under the earlier Indian Penal Code    Section 304A, this punishment was up to two years). Note that if    such an act is done by a registered medical practitioner while    performing a medical procedure, the punishment is imprisonment up    to two years and a fine.</p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0\">    <b>During anaerobic respiration in yeast cells, pyruvate is    converted into which of the following compounds?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Lactic acid and Water</p>", "option2": " <p style=\"orphans:0;widows:0\">    Ethanol and Carbon dioxide</p>", "option3": " <p style=\"orphans:0;widows:0\">    Citric acid and Water</p>", "option4": " <p style=\"orphans:0;widows:0\">    Acetic acid and Hydrogen</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In yeast cells, in the absence of oxygen (anaerobic conditions),    glucose is first converted into pyruvate through glycolysis in the    cytoplasm, and then pyruvate is converted into ethanol and carbon    dioxide along with the release of energy. This process is known as    alcoholic fermentation.</p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0\">    <b>Regarding the 'Doctrine of Lapse' enforced by Lord Dalhousie    (1848–1856), which of the following statements is INCORRECT?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Satara was the first princely state to be annexed under this    doctrine in 1848.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The adopted son of an Indian ruler was permitted to inherit the    personal private property of his adoptive father.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Awadh was annexed in 1856 under this doctrine due to the lack of a    natural male heir.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The policy denied Indian rulers the right to pass their kingdom to    an adopted heir without prior British approval.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Statement C is incorrect. Awadh was annexed by Lord Dalhousie in    February 1856 on the grounds of internal misrule and    maladministration (based on the report of British Resident James    Outram), not under the Doctrine of Lapse. Nawab Wajid Ali Shah was    deposed and exiled to Calcutta. The states annexed under the    Doctrine of Lapse included Satara (1848), Jaitpur and Sambalpur    (1849), Baghat (1850), Udaipur (1852), Jhansi (1853), and Nagpur    (1854).</p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the Vice-President    of India:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1:</b><b> Nominated members of both Houses of    Parliament participate in the election of the Vice-President,    whereas they do not participate in the election of the President.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 2:</b><b> A resolution for the removal of the    Vice-President can be introduced in either House of Parliament.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are </b><b>correct</b><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only Statement 1</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only Statement 2</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both Statements 1 and 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither Statement 1 nor Statement 2</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1 is correct:</b> Under Article 66(1) of the Indian    Constitution, the electoral college for the Vice-President    consists of all members (both elected and nominated) of both    Houses of Parliament. In contrast, under Article 54, only the    elected members of Parliament and State Legislative Assemblies    participate in the election of the President; nominated members do    not have voting rights.</p>    <p style=\"orphans:0;widows:0\"><b>Statement 2 is incorrect:</b>    According to Article 67(b), a formal resolution for the removal of    the Vice-President can be initiated <b>only</b> in the Rajya Sabha    (Council of States), not in the Lok Sabha. It must be passed by an    effective majority in the Rajya Sabha and agreed to by a simple    majority in the Lok Sabha, following a mandatory 14 days' advance    notice.</p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0\">    <b>The First Five-Year Plan (1951–1956) was launched to address    the immediate economic challenges of newly independent India.    Which economic model served as its foundation, and what was its    principal sector of focus?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Mahalanobis model; Development of heavy industries and transport</p>", "option2": " <p style=\"orphans:0;widows:0\">    Harrod–Domar model; Agricultural development, irrigation, and    power projects</p>", "option3": " <p style=\"orphans:0;widows:0\">    Gadgil formula; Defence expansion and regional industrial balance</p>", "option4": " <p style=\"orphans:0;widows:0\">    Rao–Manmohan model; Financial sector reforms and foreign direct    investment</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The First Five-Year Plan (1951–1956) was based on the    Harrod–Domar model of economic growth. Due to the severe food    grain shortages, post-partition refugee crisis, and inflation    following Independence, the plan concentrated heavily on the    primary sector—specifically agriculture, irrigation, and power    generation. Major multipurpose river valley projects, such as the    Bhakra-Nangal, Hirakud, and Damodar Valley dams, were initiated    during this plan period.</p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0\">    <b>Under which Schedule of the Wildlife (Protection) Act, 1972 is    the Ganges River Dolphin placed, granting it the highest level of    legal protection in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Schedule IV</p>", "option2": " <p style=\"orphans:0;widows:0\">    Schedule I</p>", "option3": " <p style=\"orphans:0;widows:0\">    Schedule III</p>", "option4": " <p style=\"orphans:0;widows:0\">    Schedule II</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Ganges River Dolphin (Platanista gangetica), which is also the    National Aquatic Animal of India, is listed under Schedule I of    the Wildlife (Protection) Act, 1972. Animals included in Schedule    I receive the highest degree of legal protection against hunting    and poaching, attracting the most severe penalties for violations.</p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following Sultans of the Delhi Sultanate    introduced the Persian customs of 'Sijdah' and 'Paibos' in his    court?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Iltutmish</p>", "option2": " <p style=\"orphans:0;widows:0\">    Ghiyasuddin Balban</p>", "option3": " <p style=\"orphans:0;widows:0\">    Alauddin Khalji</p>", "option4": " <p style=\"orphans:0;widows:0\">    Feroz Shah Tughlaq</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Ghiyasuddin Balban, a ruler of the Slave (Mamluk) Dynasty,    introduced the rigorous Persian court etiquette of 'Sijdah'    (prostration before the king) and 'Paibos' (kissing the monarch's    feet). He instituted these rituals along with celebrating the    Persian festival of 'Navroz' to emphasize the divine status,    supremacy, and prestige of the Sultan.</p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0\">    <b>In the context of the New Economic Policy of 1991 in India,    which of the following terms refers to the transfer of ownership,    management, or control of public sector enterprises to the private    sector?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Liberalisation</p>", "option2": " <p style=\"orphans:0;widows:0\">    Privatisation</p>", "option3": " <p style=\"orphans:0;widows:0\">    Globalisation</p>", "option4": " <p style=\"orphans:0;widows:0\">    Nationalisation</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Privatisation refers to the transfer of ownership, management, and    control of government-run public sector enterprises to the private    sector. It was one of the three main pillars of the New Economic    Policy (NEP) launched in 1991 under the LPG model (Liberalisation,    Privatisation, and Globalisation) to enhance operational    efficiency and reduce the government's fiscal burden.</p>", "question_heading": ""}, {"sr_no": 33, "question": "Mोपcु Liौप-I (Scुधकिहध) थiपु Liौप-II (Sहृुधcप Mोपपधन) ोnक ौिधधcप पुध cयननधcप ोnौथधन हौing पुध cयकधौ giॅधn ृिधयथ: Liौप-I (Scुधकिहध) A. Siसपु Scुधकिहध B. Eigुपु Scुधकिहध C. Tधnपु Scुधकिहध D. Eिधॅधnपु Scुधकिहध Liौप-II (Sहृुधcप Mोपपधन) 1. Lोngहोgधौ नधcयgnप्रधक ृद पुध Cयnौपiपहपiयn 2. Aकंiniौपनोपiयn यी पनiृोि ोनधोौ in Aौौों, Mधgुोिोदो, Tनiूहनो, ोnक Mप्रयनों 3. Pयथधनौ, ोहपुयनiपद, ोnक नधौूयnौiृiिiपiधौ यी Pोncुोदोपौ 4. Diौतहोिiीicोपiयn यn gनयहnक यी कधीधcपiयn", "option1": "<p style=\"orphans:0;widows:0\">    A-2, B-1, C-4, D-3</p>", "option2": " <p style=\"orphans:0;widows:0\">    A-1, B-2, C-3, D-4</p>", "option3": " <p style=\"orphans:0;widows:0\">    A-2, B-4, C-1, D-3</p>", "option4": " <p style=\"orphans:0;widows:0\">    A-3, B-1, C-4, D-2</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct match is A-2, B-1, C-4, D-3.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Sixth    Schedule:</b> Contains provisions related to the administration of    tribal areas in the northeastern states of Assam, Meghalaya,    Tripura, and Mizoram.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Eighth    Schedule:</b> Deals with the official languages recognized by the    Constitution (currently 22 languages).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Tenth    Schedule:</b> Added by the 52nd Constitutional Amendment Act,    1985; contains provisions regarding disqualification on grounds of    defection.</p>    <p style=\"orphans:0;widows:0\">• <b>Eleventh Schedule:</b>    Added by the 73rd Constitutional Amendment Act, 1992; specifies 29    functional items regarding the powers, authority, and    responsibilities of Panchayats.</p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Read the following statements:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement I: The 'Nathu La' pass is located in the state of    Sikkim and serves as an important mountain pass connecting India    with Tibet.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement II: The 'Lipulekh' pass is situated in Himachal    Pradesh and serves as a major route for the Kailash Mansarovar    Yatra.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    above statements is/are </b><b>correct</b><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only Statement I is correct</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only Statement II is correct</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both Statement I and II are correct</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither Statement I nor II is correct</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statement I is correct: Nathu La is a mountain pass in the    Himalayas located in the East Sikkim district of Sikkim. It    connects the Indian state of Sikkim with Tibet and was an ancient    branch of the historic Silk Route.</p>    <p style=\"orphans:0;widows:0\">Statement II is incorrect: The    Lipulekh Pass is located in the Pithoragarh district of    Uttarakhand (not Himachal Pradesh), near the tri-junction of    India, Nepal, and China. It is well-known as a vital Himalayan    route for pilgrims undertaking the Kailash Mansarovar Yatra.</p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following indicators is used to measure the    'Health' dimension in the Human Development Index (HDI)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Infant mortality rate</p>", "option2": " <p style=\"orphans:0;widows:0\">    Maternal mortality ratio</p>", "option3": " <p style=\"orphans:0;widows:0\">    Life expectancy at birth</p>", "option4": " <p style=\"orphans:0;widows:0\">    Crude death rate</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Human Development Index (HDI), published by the United Nations    Development Programme (UNDP), evaluates development across three    key dimensions: 1) Health (Long and healthy life), measured by    <b>Life expectancy at birth</b>; 2) Knowledge (Education),    measured by Mean and Expected years of schooling; and 3) A decent    standard of living, measured by Gross National Income (GNI) per    capita.</p>", "question_heading": ""}, {"sr_no": 36, "question": "  <p style=\"orphans:0;widows:0\">    <b>How much work is done against gravity in lifting a mass of 15    kg vertically upwards through a height of 2 metres? (Take </b>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471713853_html_630bd5dd6026c15c.gif\" > <b>)</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    294 J</p>", "option2": " <p style=\"orphans:0;widows:0\">    147 J</p>", "option3": " <p style=\"orphans:0;widows:0\">    300 J</p>", "option4": " <p style=\"orphans:0;widows:0\">    588 J</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The work done against gravity is equal to the change in    gravitational potential energy of the object:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471713853_html_45191fc15ae69c9.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Given:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Mass (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471713853_html_4d187224ad27976d.gif\" > )    = 15 kg</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Acceleration    due to gravity (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471713853_html_1a7fe57513bafe99.gif\" > )    =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471713853_html_40d0c835fff65684.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Height (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471713853_html_2edc8155a17f52b0.gif\" > )    = 2 m</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Therefore,</p>    <p style=\"orphans:0;widows:0\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471713853_html_d925e00ceb49c7f4.gif\" > .</p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the observation of    cellular components in a temporary mount of an onion epidermal    peel stained with safranin:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. The nucleus absorbs the stain intensely and appears as a    prominent, darkly stained body.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. The cytoplasm takes up the stain lightly and forms a thin    layer along the periphery of the cell.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. The large central vacuole stains deeply and occupies most of    the cell space.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In a temporary mount of onion peel stained with safranin:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>Statement    1 is correct:</b> Safranin is a basic dye that binds strongly to    acidic components like nucleic acids (DNA and RNA) present in the    nucleus, making it appear prominently and darkly stained.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>Statement    2 is correct:</b> Cytoplasm retains only a faint/light stain. Due    to the presence of a large central vacuole, the cytoplasm is    pushed toward the periphery, forming a thin layer just beneath the    cell wall.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. <b>Statement    3 is incorrect:</b> The large central vacuole contains non-living    cell sap and takes up practically no stain (remains    clear/unstained), not deeply stained.</p>    <p style=\"orphans:0;widows:0\">Therefore, only statements 1 and    2 are correct.</p>", "question_heading": ""}, {"sr_no": 38, "question": "  <p style=\"orphans:0;widows:0\">    <b>A person is prescribed a corrective spectacle lens of power </b>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471713853_html_6a44336aa87f4234.gif\" > <b>.    This implies that the person is suffering from _______, the    uncorrected image of a distant object is formed _______ the    retina, and the focal length of the prescribed lens is _______.</b></p>", "option1": " <p style=\"orphans:0;widows:0\">    myopia; behind;     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471713853_html_a416842ec85f587c.gif\" > </p>", "option2": "  <p style=\"orphans:0;widows:0\">    myopia; in front of;     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471713853_html_34db68c594327833.gif\" > </p>", "option3": "  <p style=\"orphans:0;widows:0\">    hypermetropia; in front of;     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471713853_html_34db68c594327833.gif\" > </p>", "option4": "  <p style=\"orphans:0;widows:0\">    hypermetropia; behind;     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471713853_html_a416842ec85f587c.gif\" > </p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    1. <b>Nature of Defect:</b> A lens with negative power is a    concave (diverging) lens. Concave lenses are used to correct    <b>myopia</b> (short-sightedness).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>Position    of Image:</b> In a myopic eye, excessive curvature of the cornea    or elongation of the eyeball causes parallel rays of light from a    distant object to focus <b>in front of the retina</b> rather than    on it.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. <b>Focal    Length Calculation:</b> Power     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471713853_html_f39948f94a6f034d.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471713853_html_a4364d69354f8453.gif\" > .</p>    <p style=\"orphans:0;widows:0\">Thus, the person has myopia, the    image is formed in front of the retina, and the focal length is     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471713853_html_34db68c594327833.gif\" > .</p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0\">    <b>The process of heating a sulphide ore strongly in the presence    of excess air below its melting point to convert it into metal    oxide is known as:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Calcination</p>", "option2": " <p style=\"orphans:0;widows:0\">    Roasting</p>", "option3": " <p style=\"orphans:0;widows:0\">    Smelting</p>", "option4": " <p style=\"orphans:0;widows:0\">    Leaching</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    Roasting is the process in metallurgy where sulphide ores are    converted into metal oxides by heating them strongly below their    melting points in the presence of excess air. For example:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471713853_html_e83534cc4a313df.gif\" > .    In contrast, calcination is used for carbonate or hydrated ores    and is carried out in the absence or a limited supply of air.</p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0\">    <b>National Sports Day 2026 (29 August), marking the birth    anniversary of Major Dhyan Chand, was observed under which theme?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    'Tribute, Play, and Move'</p>", "option2": " <p style=\"orphans:0;widows:0\">    'Fit India, Strong India'</p>", "option3": " <p style=\"orphans:0;widows:0\">    'Khelo India, Jeeto India'</p>", "option4": " <p style=\"orphans:0;widows:0\">    'Sports for All'</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    National Sports Day 2026 was observed on 29 August under the theme    'Tribute, Play, and Move'. It marks the birth anniversary of    legendary Indian hockey player Major Dhyan Chand.</p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0\">    <b>PM-YASASVI provides financial assistance for higher education    to meritorious students from which communities, under the Ministry    of Social Justice &amp; Empowerment?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    SC, ST and Minorities</p>", "option2": " <p style=\"orphans:0;widows:0\">    OBC, EBC and DNT communities</p>", "option3": " <p style=\"orphans:0;widows:0\">    EWS and Divyangjan</p>", "option4": " <p style=\"orphans:0;widows:0\">    Women and Senior Citizens</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    PM Young Achievers' Scholarship Award Scheme for Vibrant India    (PM-YASASVI) aims to provide financial assistance for higher    education to meritorious students belonging to OBC, EBC and DNT    communities. It operates under the Ministry of Social Justice &amp;    Empowerment.</p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0\">    <b>'Triumph of the Indian Republic: My Life, My Struggles' is the    autobiography of which former President of India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Pranab Mukherjee</p>", "option2": " <p style=\"orphans:0;widows:0\">    Ram Nath Kovind</p>", "option3": " <p style=\"orphans:0;widows:0\">    Droupadi Murmu</p>", "option4": " <p style=\"orphans:0;widows:0\">    Pratibha Patil</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    'Triumph of the Indian Republic: My Life, My Struggles' is the    autobiography of former President of India Ram Nath Kovind.</p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0\">    <b>What is the official theme for World Wetlands Day 2026, as    announced by the Ramsar Convention?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Wetlands and Human Wellbeing</p>", "option2": " <p style=\"orphans:0;widows:0\">    Wetlands and Climate Change</p>", "option3": " <p style=\"orphans:0;widows:0\">    Wetlands for a Sustainable Urban Future</p>", "option4": " <p style=\"orphans:0;widows:0\">    Wetlands and Traditional Knowledge: Celebrating Cultural Heritage</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    World Wetlands Day is celebrated annually on 2 February to    commemorate the adoption of the Ramsar Convention on Wetlands in    1971.</p>    <p style=\"orphans:0;widows:0\">The Ramsar Convention is an    intergovernmental treaty signed in 1971 in Ramsar, Iran. It    focuses on the conservation and wise use of wetlands through    local, national and international cooperation.</p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0\">    <b>The Joint Special Forces Exercise 'KHANJAR' is a bilateral    defense cooperation initiative between India and which of the    following countries?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Kyrgyzstan</p>", "option2": " <p style=\"orphans:0;widows:0\">    Tajikistan</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kazakhstan</p>", "option4": " <p style=\"orphans:0;widows:0\">    Uzbekistan</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The Joint Special Forces Exercise 'KHANJAR' is a bilateral defence    cooperation initiative between India and Kyrgyzstan.</p>    <p style=\"orphans:0;widows:0\">The exercise has been conducted    annually or biennially since 2011, serving as an important pillar    of the strategic partnership between India and Kyrgyzstan.</p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0\">    <b>What is the primary function of the Very Short-Range Air    Defence System (VSHORADS)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    To intercept and neutralize low-altitude aerial threats at short    range</p>", "option2": " <p style=\"orphans:0;widows:0\">    To launch long-range intercontinental ballistic missiles</p>", "option3": " <p style=\"orphans:0;widows:0\">    To act as a primary air-to-air refueling system for fighter jets</p>", "option4": " <p style=\"orphans:0;widows:0\">    To provide high-altitude surveillance for satellite monitoring</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The Very Short-Range Air Defence System (VSHORADS) is an advanced,    man-portable air defence system (MANPADS), indigenously designed    and developed by the Defence Research and Development Organisation    (DRDO), specifically by its Research Centre Imarat (RCI) in    Hyderabad.</p>    <p style=\"orphans:0;widows:0\">It is designed to provide    immediate, last-line air defence against low-altitude aerial    threats such as helicopters, unmanned aerial vehicles    (UAVs/drones) and close-range fighter jets.</p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the correct option that indicates the arrangement of the following words in a logical and meaningful order.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">1. Dough</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">2. Flour</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">3. Wheat</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">4. Baking</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">5. Bread</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3, 2, 1, 4, 5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2, 3, 1, 4, 5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3, 1, 2, 5, 4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3, 2, 4, 1, 5</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The correct meaningful sequence follows the process of making bread:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First, </span><span style=\"font-weight:bold\">Wheat</span><span> (3) is obtained, which is ground into </span><span style=\"font-weight:bold\">Flour</span><span> (2). The flour is then mixed with water to form </span><span style=\"font-weight:bold\">Dough</span><span> (1). The dough is then processed through </span><span style=\"font-weight:bold\">Baking</span><span> (4) to finally produce </span><span style=\"font-weight:bold\">Bread</span><span> (5).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the logical order is 3, 2, 1, 4, 5.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If in a certain code language, GOLDEN is written as HQOHJT, which word would be written as TKOZJX?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SLIVER</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SIKVEQ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SILVER</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>RILVES</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The coding pattern adds consecutive positive integers to each letter's positional value:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>G (+1) = H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O (+2) = Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L (+3) = O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D (+4) = H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E (+5) = J</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N (+6) = T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>To find the original word from the given code TKOZJX, we reverse the operation by subtracting the consecutive integers (+1, +2, +3, +4, +5, +6):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T (20) - 1 = S (19)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>K (11) - 2 = I (9)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O (15) - 3 = L (12)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Z (26) - 4 = V (22)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>J (10) - 5 = E (5)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>X (24) - 6 = R (18)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, the required word is </span><span style=\"font-weight:bold\">SILVER</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a certain code language, 'FESTIVAL' is coded as 'TSEFLAVI'. How will 'CALENDAR' be coded in that language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ELACRADN</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ELACRAND</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>EALCRADN</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ELACRDAN</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed here is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The 8-letter word is divided into two equal halves of 4 letters each, and the letters in each half are reversed in order:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FEST → TSEF</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>IVAL → LAVI</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combining them gives: </span><span style=\"font-weight:bold\">TSEFLAVI</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the same pattern to 'CALENDAR':</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CALE → ELAC</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NDAR → RADN</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combining them gives: </span><span style=\"font-weight:bold\">ELACRADN</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the correct answer is option A.</span></p>", "question_heading": ""}, {"sr_no": 49, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">If '</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image001.png\" width=\"20\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">' means 'multiplication', '</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_imag
