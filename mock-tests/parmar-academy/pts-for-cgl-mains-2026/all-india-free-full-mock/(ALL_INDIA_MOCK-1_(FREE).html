tion4": " <p style=\"orphans:0;widows:0\">    Optimistic that bureaucratic checklists will eventually neutralize    all sophisticated cyber threats.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The author argues that overly intricate compliance frameworks can    'inadvertently amplify systemic risk' and urges that requirements    'must be streamlined.' Thus, the author's tone toward complex    regulations is critical, making <b>option C</b> the correct    answer.</p>", "question_heading": ""}, {"sr_no": 121, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.1 The sum of two numbers is 216 and their HCF is 27. How many such pairs of numbers (unordered) are possible?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the numbers be 27a and 27b, where a and b are co-prime.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>27(a + b) = 216 → a + b = 8.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Co-prime pairs (a &lt; b): (1, 7) and (3, 5). [(2, 6) and (4, 4) are not co-prime.]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>So there are 2 such pairs.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 2</span></p>", "question_heading": ""}, {"sr_no": 122, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.2 In an election between two candidates, 20% of the voters on the list did not vote and 5% of the votes cast were invalid. The winner got 55% of the valid votes and won by 1,805 votes. How many voters were on the list?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>21,500</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>22,500</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>23,750</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25,000</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the number of voters on the list = N.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Votes cast = 80% of N = 0.8N; valid votes = 95% of 0.8N = 0.76N.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Winner 55%, loser 45% → margin = 10% of valid votes = 0.076N.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>0.076N = 1,805 → N = 23,750.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 3</span></p>", "question_heading": ""}, {"sr_no": 123, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.3 A trader marks his goods 50% above the cost price and gives a discount of 20% on the marked price. He also uses a weight of 900 g instead of 1 kg while selling. Find his overall profit percentage.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>30%</span></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>33 </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image001.png\" width=\"7\" height=\"29\" alt style=\"vertical-align:middle\" ><span>%</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>35%</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40%</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the cost price of 1 kg = ₹100. Marked price = ₹150; selling price after 20% discount = ₹120.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>But he gives only 900 g for this price, so the actual cost of the goods sold = 90% of 100 = ₹90.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Profit = 120 − 90 = ₹30.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Profit % = (30/90) × 100 = 33⅓%.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 2</span></p>", "question_heading": ""}, {"sr_no": 124, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.4 The difference between the compound interest (compounded annually) and the simple interest on a sum for 3 years at 10% per annum is ₹1,240. Find the sum.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹35,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹38,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹40,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹44,000</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For 3 years: CI − SI = P × (r/100)² × (3 + r/100).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= P × (0.1)² × (3.1) = P × 0.01 × 3.1 = 0.031P.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>0.031P = 1,240 → P = ₹40,000.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 3</span></p>", "question_heading": ""}, {"sr_no": 125, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.5 A and B together can finish a work in 12 days, B and C together in 15 days, and C and A together in 20 days. All three start working together, but A leaves after 4 days. In how many days in total will the work be completed?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>11</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A + B = 1/12, B + C = 1/15, C + A = 1/20 (work per day).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Adding: 2(A + B + C) = (5 + 4 + 3)/60 = 1/5 → A + B + C = 1/10 per day.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Work done in 4 days = 4/10 = 2/5. Remaining = 3/5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>After A leaves, B + C = 1/15 per day → (3/5) ÷ (1/15) = 9 days.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total time = 4 + 9 = 13 days.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 4</span></p>", "question_heading": ""}, {"sr_no": 126, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.6 Pipes A and B can fill an empty tank in 20 minutes and 30 minutes respectively, while pipe C can empty the full tank in 40 minutes. The three pipes are opened one after another for 1 minute each, in the order A, B, C, and this cycle repeats. In how much time will the tank be completely filled?</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>49 </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image002.png\" width=\"7\" height=\"29\" alt style=\"vertical-align:middle\" ><span> minutes</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>50 minutes</span></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>50 </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image002.png\" width=\"7\" height=\"29\" alt style=\"vertical-align:middle\" ><span> minutes</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>51 minutes</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Take tank capacity = 120 units (LCM of 20, 30, 40).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A = +6/min, B = +4/min, C = −3/min. Net per 3-minute cycle = 6 + 4 − 3 = 7 units.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>After 16 cycles (48 min): 16 × 7 = 112 units. Remaining = 8 units.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Minute 49 (A): 112 + 6 = 118. Remaining 2 units, B fills at 4/min → ½ minute.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total time = 49½ minutes.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 1</span></p>", "question_heading": ""}, {"sr_no": 127, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.7 Two trains running in opposite directions cross a pole in 12 seconds and 18 seconds respectively. They cross each other in 14.4 seconds. Find the ratio of their speeds.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2 : 3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3 : 2</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4 : 3</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 : 3</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let speeds be v₁ and v₂. Lengths: L₁ = 12v₁, L₂ = 18v₂.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Crossing each other: (L₁ + L₂)/(v₁ + v₂) = 14.4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12v₁ + 18v₂ = 14.4v₁ + 14.4v₂ → 3.6v₂ = 2.4v₁ → v₁ : v₂ = 3 : 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 2</span></p>", "question_heading": ""}, {"sr_no": 128, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.8 A boat takes 6 hours to go 24 km upstream and 28 km downstream. It takes 6.5 hours to go 30 km upstream and 21 km downstream. Find the speed of the boat in still water.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6 km/h</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8 km/h</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9 km/h</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10 km/h</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let upstream speed = x and downstream speed = y; a = 1/x, b = 1/y.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>24a + 28b = 6 …(i); 30a + 21b = 6.5 …(ii).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(i)×3: 72a + 84b = 18; (ii)×4: 120a + 84b = 26. Subtract: 48a = 8 → a = 1/6 → x = 6 km/h.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From (i): 28b = 6 − 4 = 2 → b = 1/14 → y = 14 km/h.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Speed in still water = (6 + 14)/2 = 10 km/h.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 4</span></p>", "question_heading": ""}, {"sr_no": 129, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.9 A vessel contains 80 litres of pure milk. 8 litres is taken out and replaced with water. This process is repeated two more times (3 times in total). Find the ratio of milk to water in the final mixture.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>729 : 271</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>729 : 1000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>271 : 729</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>81 : 19</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Milk left after 3 operations = 80 × (1 − 8/80)³ = 80 × (9/10)³ = 80 × 0.729 = 58.32 L.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Water = 80 − 58.32 = 21.68 L.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Milk : Water = 58.32 : 21.68 = 729 : 271.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 1</span></p>", "question_heading": ""}, {"sr_no": 130, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.10 The average of 11 numbers is 60. The average of the first six numbers is 58 and the average of the last six numbers is 63. Find the sixth number.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>62</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>64</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>65</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>66</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sum of 11 numbers = 11 × 60 = 660.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sum of first six = 6 × 58 = 348; sum of last six = 6 × 63 = 378.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Adding these counts the sixth number twice: 348 + 378 = 726.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sixth number = 726 − 660 = 66.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 4</span></p>", "question_heading": ""}, {"sr_no": 131, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.11 A invests ₹30,000 in a business. After 4 months, B joins with ₹40,000, and after 3 more months, C joins with ₹60,000. At the end of the year, the total profit is ₹1,47,000. Find B's share.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹45,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹48,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹50,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹52,500</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Investment × time: A = 30,000 × 12 = 3,60,000; B = 40,000 × 8 = 3,20,000; C = 60,000 × 5 = 3,00,000.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ratio = 36 : 32 : 30 = 18 : 16 : 15 (total 49).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B's share = 1,47,000 × 16/49 = ₹48,000.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 2</span></p>", "question_heading": ""}, {"sr_no": 132, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.12 A and B start together from the same point on a circular track of length 600 m, running in the same direction at 8 m/s and 5 m/s respectively. After how many seconds will they meet for the first time at the starting point?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>200</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>300</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>400</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>600</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Time for A to complete one lap = 600/8 = 75 s; for B = 600/5 = 120 s.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>They are together at the starting point when both are at the start, i.e. at LCM(75, 120) = 600 s.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(They meet each other somewhere on the track every 600/3 = 200 s, but first at the starting point only at 600 s.)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 4</span></p>", "question_heading": ""}, {"sr_no": 133, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.13 If x² − 4x + 1 = 0, find the value of x⁴ + </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image003.png\" width=\"12\" height=\"29\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>192</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>194</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>196</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>198</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>x² − 4x + 1 = 0 → x + 1/x = 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Squaring: x² + 1/x² = 16 − 2 = 14.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Squaring again: x⁴ + 1/x⁴ = 196 − 2 = 194.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 2</span></p>", "question_heading": ""}, {"sr_no": 134, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.14 If a + b + c = 9 and a² + b² + c² = 29, find the value of a³ + b³ + c³ − 3abc.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>27</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>54</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(a + b + c)² = 81 = 29 + 2(ab + bc + ca) → ab + bc + ca = 26.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>a³ + b³ + c³ − 3abc = (a + b + c)(a² + b² + c² − ab − bc − ca)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= 9 × (29 − 26) = 27.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 3</span></p>", "question_heading": ""}, {"sr_no": 135, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.15 If α and β are the roots of x² − 5x + 3 = 0, find the value of α⁴ + β⁴.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>313</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>323</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>333</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>343</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>α + β = 5, αβ = 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>α² + β² = 25 − 6 = 19.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>α⁴ + β⁴ = (α² + β²)² − 2(αβ)² = 361 − 18 = 343.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 4</span></p>", "question_heading": ""}, {"sr_no": 136, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.16 If </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image004.png\" width=\"18\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image005.png\" width=\"18\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image006.png\" width=\"17\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">, then </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image007.png\" width=\"7\" height=\"29\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> + </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image008.png\" width=\"8\" height=\"31\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> is equal to:</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image009.png\" width=\"9\" height=\"38\" alt style=\"vertical-align:middle\" ></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>z</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>xyz</span></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image010.png\" width=\"18\" height=\"41\" alt style=\"vertical-align:middle\" ></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let 2ˣ = 3ʸ = 6ᶻ = k. Then 2 = k^(1/x), 3 = k^(1/y), 6 = k^(1/z).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since 2 × 3 = 6: k^(1/x + 1/y) = k^(1/z).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence 1/x + 1/y = 1/z.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 1</span></p>", "question_heading": ""}, {"sr_no": 137, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.17 If </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image011.png\" width=\"27\" height=\"29\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image012.png\" width=\"26\" height=\"27\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image013.png\" width=\"28\" height=\"29\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> = k, then the value(s) of k is/are:</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image002.png\" width=\"7\" height=\"29\" alt style=\"vertical-align:middle\" ><span> only</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>−1 only</span></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image002.png\" width=\"7\" height=\"29\" alt style=\"vertical-align:middle\" ><span> or −1</span></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 or −</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image002.png\" width=\"7\" height=\"29\" alt style=\"vertical-align:middle\" ></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>x/(y + z) = y/(z + x) = z/(x + y) = k → x = k(y + z), y = k(z + x), z = k(x + y).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Adding: x + y + z = 2k(x + y + z).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If x + y + z ≠ 0: k = 1/2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If x + y + z = 0: y + z = −x, so k = x/(−x) = −1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>So k = 1/2 or −1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 3</span></p>", "question_heading": ""}, {"sr_no": 138, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.18 In an acute-angled triangle ABC, I is the incentre and H is the orthocentre. If ∠BIC = 124°, find ∠BHC.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>56°</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>68°</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>112°</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>124°</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>∠BIC = 90° + A/2 = 124° → A/2 = 34° → ∠A = 68°.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>∠BHC = 180° − ∠A = 180° − 68° = 112°.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 3</span></p>", "question_heading": ""}, {"sr_no": 139, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.19 In triangle ABC, D is a point on AB and E is a point on AC such that DE ∥ BC and AD : DB = 2 : 3. If the area of triangle ABC is 150 cm², find the area of trapezium DBCE.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>108 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>126 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>132 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>144 cm²</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DE ∥ BC → △ADE ~ △ABC, AD/AB = 2/5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Area ratio = (2/5)² = 4/25 → Area(ADE) = 150 × 4/25 = 24 cm².</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Area of trapezium DBCE = 150 − 24 = 126 cm².</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 2</span></p>", "question_heading": ""}, {"sr_no": 140, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.20 From an external point P, a tangent PT of length 12 cm and a secant PAB passing through the centre O of the circle are drawn (A is nearer to P). If PA = 8 cm, find the radius of the circle.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7.5 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8 cm</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>By the tangent–secant theorem: PT² = PA × PB → 144 = 8 × PB → PB = 18 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>AB = PB − PA = 18 − 8 = 10 cm. Since the secant passes through the centre, AB is the diameter.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Radius = 10/2 = 5 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 1</span></p>", "question_heading": ""}, {"sr_no": 141, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.21 In a triangle ABC, ∠B = 90°. The medians AD and CE (D on BC, E on AB) are 6 cm and 8 cm long. Find the length of the hypotenuse AC.</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image014.png\" width=\"20\" height=\"22\" alt style=\"vertical-align:middle\" ><span> cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10 cm</span></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image014.png\" width=\"20\" height=\"22\" alt style=\"vertical-align:middle\" ><span> cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 cm</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let AB = c, BC = a (∠B = 90°). D is the midpoint of BC, E is the midpoint of AB.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>AD² = c² + (a/2)² = 36 …(i); CE² = a² + (c/2)² = 64 …(ii).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Adding: (5/4)(a² + c²) = 100 → a² + c² = 80.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>AC² = a² + c² = 80 → AC = 4√5 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 1</span></p>", "question_heading": ""}, {"sr_no": 142, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.22 ABCD is a cyclic quadrilateral in which AB is a diameter of the circle. If ∠ADC = 125°, find ∠BAC.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>35°</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40°</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>45°</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>55°</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>AB is a diameter → ∠ACB = 90°.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ABCD is cyclic → ∠ADC + ∠ABC = 180° → ∠ABC = 180° − 125° = 55°.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In △ABC: ∠BAC = 90° − 55° = 35°.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 1</span></p>", "question_heading": ""}, {"sr_no": 143, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.23 A bucket is in the form of a frustum of a cone with top radius 28 cm, bottom radius 7 cm and height 24 cm. Find its capacity in cm³. (Take π = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image015.png\" width=\"14\" height=\"29\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>24,640</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25,872</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>26,400</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>27,104</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Volume of frustum = (πh/3)(R² + r² + Rr), with R = 28, r = 7, h = 24.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= (22/7) × (24/3) × (784 + 49 + 196)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= (22/7) × 8 × 1029 = 22 × 8 × 147 = 25,872 cm³.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 2</span></p>", "question_heading": ""}, {"sr_no": 144, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.24 Water flows at 7 km/h through a circular pipe of internal diameter 14 cm into a rectangular tank of length 50 m and breadth 44 m. How much time will it take to raise the water level in the tank by 21 cm?</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3 </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image016.png\" width=\"7\" height=\"29\" alt style=\"vertical-align:middle\" ><span> hours</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4 hours</span></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4 </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793593768022_image017.png\" width=\"7\" height=\"29\" alt style=\"vertical-align:middle\" ><span> hours</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4.5 hours</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Pipe radius = 7 cm; speed = 7 km/h = 7,00,000 cm/h.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Water flowing per hour = π r² × speed = (22/7) × 49 × 7,00,000 = 10,78,00,000 cm³ = 107.8 m³.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Volume needed in tank = 50 × 44 × 0.21 = 462 m³.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Time = 462/107.8 = 30/7 = 4 2/7 hours.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 3</span></p>", "question_heading": ""}, {"sr_no": 145, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.25 The diagonal of a cuboid is 13 cm and its total surface area is 120 cm². Find the sum of the lengths of all its edges.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>56 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>68 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>72 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>76 cm</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the edges be l, b, h. Diagonal: l² + b² + h² = 169. TSA: 2(lb + bh + hl) = 120.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(l + b + h)² = 169 + 120 = 289 → l + b + h = 17.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sum of all 12 edges = 4(l + b + h) = 4 × 17 = 68 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 2</span></p>", "question_heading": ""}, {"sr_no": 146, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.26 A sector of a circle of radius 10 cm and central angle 216° is rolled up to form a cone. Find the volume of the cone.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>64π cm³</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>72π cm³</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>80π cm³</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>96π cm³</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;  4 sec²θ + 9 cosec²θ.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>36</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>49</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4 sec²θ + 9 cosec²θ = 4(1 + tan²θ) + 9(1 + cot²θ) = 13 + 4 tan²θ + 9 cot²θ.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>By AM–GM: 4 tan²θ + 9 cot²θ ≥ 2√(4 × 9) = 12 (since tan²θ × cot²θ = 1).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Minimum value = 13 + 12 = 25.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 2</span></p>", "question_heading": ""}, {"sr_no": 149, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Q.29 From the top of a 60 m high building, the angles of depression of the top and the bottom of a tower are 30° and 60° respectively. Find the height of the tower.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>30 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>35 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>45 m</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the building be AB = 60 m and the horizontal distance to the tower = d.</span></p><p style=\" ) = 13.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>So the equality holds only when sin θ = 5/13 and cos θ = 12/13.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>tan θ = 5/12, sec θ = 13/12.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>tan θ + sec θ = 18/12 = 3/2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Answer: Option 2</span></p>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
