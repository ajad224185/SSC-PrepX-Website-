\" width=\"117\" height=\"106\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image014.png\" width=\"118\" height=\"112\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image015.png\" width=\"116\" height=\"108\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image016.png\" width=\"116\" height=\"113\" alt ></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image017.png\" width=\"298\" height=\"142\" alt ></p>", "question_heading": ""}, {"sr_no": 51, "question": "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which is the WRONG term in the following series?<br />\r\nC8Y, G19U, L42P, R89I, Y184C</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>G19U</span></p>", "option2": "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\">R89I</p>", "option3": "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L42P</span></p>", "option4": "\r\n<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Y184C</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "\r\n<p>Let us analyze the three components of each term in the series:</p>\r\n\r\n<p><strong>First Letter:</strong><br />\r\nC(3) +4 &rarr; G(7) +5 &rarr; L(12) +6 &rarr; R(18) +7 &rarr; Y(25)</p>\r\n\r\n<p><strong>Middle Number:</strong><br />\r\n8 &times; 2 + 3 = 19<br />\r\n19 &times; 2 + 4 = 42<br />\r\n42 &times; 2 + 5 = 89<br />\r\n89 &times; 2 + 6 = 184</p>\r\n\r\n<p><strong>Last Letter:</strong><br />\r\nY(25) &minus;4 &rarr; U(21) &minus;5 &rarr; P(16) &minus;6 &rarr; J(10) &minus;7 &rarr; C(3)<br />\r\n<strong>In the fourth term, the last letter should be J instead of I. Hence, the correct term should be R89J, making R89I the wrong term.</strong></p>", "question_heading": ""}, {"sr_no": 52, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">There is a definite relationship between figures A and B. Establish a similar relationship between figures C and D by selecting a suitable figure from the answer figures that would replace the question mark (?) in figure D, as shown in the figure below.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image018.png\" width=\"517\" height=\"92\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image019.png\" width=\"237\" height=\"147\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image020.png\" width=\"242\" height=\"144\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image021.png\" width=\"239\" height=\"143\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image022.png\" width=\"241\" height=\"149\" alt ></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern of transformation from figure A to figure B is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1st position in B:</span><span> The 2nd element of figure A is horizontally mirrored ('C' becomes mirrored 'C').</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2nd position in B:</span><span> The 1st element of figure A is vertically inverted ('V' becomes 'Λ').</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3rd position in B:</span><span> The 4th element of figure A is horizontally mirrored ('P' becomes mirrored 'P').</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">4th position in B:</span><span> A new solid element (solid circle '●') replaces the 3rd element.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the same transformation from figure C to figure D:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1st position in D:</span><span> The 2nd element ('U') is inverted vertically to become '∩'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2nd position in D:</span><span> The 1st element ('T') is inverted vertically to become '⊥'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3rd position in D:</span><span> The 4th element ('E') is horizontally mirrored to become 'Ǝ'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">4th position in D:</span><span> A new solid element (solid triangle '▲') replaces the 3rd element.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, figure 3 correctly replaces the question mark (?).</span></p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">D is the father of M. M is married to J. J is the sister of Q. T is the mother of Q. S is the son of M. How is M related to T?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Father-in-law</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Son-in-law</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Brother-in-law</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Son</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given information:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. J is the sister of Q, and T is the mother of Q. Therefore, T is also the mother of J.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. M is married to J. Since J is female (sister), M must be male (husband).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. As M is the husband of J, and J is the daughter of T, M is the son-in-law of T.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image023.jpeg\" width=\"360\" height=\"375\" alt ></p>", "question_heading": ""}, {"sr_no": 54, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A clock face with 12 hour marks is shown in the figure below, with a vertical mirror MN placed to its right. Which of the following correctly describes the positions of the hour hand and minute hand in the mirror image?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image024.png\" width=\"152\" height=\"144\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image025.png\" width=\"125\" height=\"120\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image026.png\" width=\"117\" height=\"119\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image027.png\" width=\"112\" height=\"122\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image028.png\" width=\"110\" height=\"122\" alt ></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>When an object is reflected across a vertical mirror placed to its right, left and right are inverted while top and bottom remain unchanged.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>On a clock face, the vertical line passing through 12 and 6 acts as the axis of reflection. The mirror image of any mark </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image029.png\" width=\"9\" height=\"21\" alt style=\"vertical-align:middle\" ><span> corresponds to mark </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image030.png\" width=\"46\" height=\"21\" alt style=\"vertical-align:middle\" ><span>:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. In the given figure, the shorter hand (hour hand) points towards 4. Its reflection points towards </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image031.png\" width=\"76\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. The longer hand (minute hand) points towards 1. Its reflection points towards </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image032.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, in the mirror image, the hour hand points to 8 and the minute hand points to 11.</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Pointing to a photograph of a man, Neha said, \"He is the son-in-law of the only son of my paternal grandfather.\" If Neha has no sisters, how is Neha related to the man in the photograph?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sister</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Wife</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mother</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Daughter</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Breaking down the statement given by Neha:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. \"The only son of my paternal grandfather\" = Neha's father.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. \"The son-in-law of Neha's father\" = The husband of Neha's father's daughter.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Since Neha has no sisters, she is the only daughter of her father.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Therefore, the man in the photograph is Neha's husband, and Neha is his </span><span style=\"font-weight:bold\">wife</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 56, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which two numbers need to be swapped to make the following equation correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image033.png\" width=\"174\" height=\"21\" alt style=\"vertical-align:middle\" ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3 and 5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4 and 8</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8 and 5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4 and 5</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given equation: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image034.png\" width=\"168\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>By swapping the numbers 4 and 8, the equation becomes:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image035.png\" width=\"129\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the BODMAS rule:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 1 (Division): </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image036.png\" width=\"76\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 2 (Multiplication): </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image037.png\" width=\"75\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Step 3 (Addition and Subtraction): </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image038.png\" width=\"179\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LHS = RHS. Hence, swapping 4 and 8 makes the equation correct.</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">From the given options, select the group of letters that, when inserted in order from left to right into the blanks of the incomplete series, will logically complete it.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">pq_stp_rstpqrs_pqrst_qrst</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>qrtp</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>rqtp</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>rqpt</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>prtq</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The given series contains 25 elements (letters and blanks). Dividing it into 5 groups of 5 letters each, we get:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>pq_st | p_rst | pqrs_ | pqrst | _qrst</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the complete 4th group, it is clear that the repeating pattern is </span><span style=\"font-weight:bold\">pqrst</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Filling in the blanks in each group:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1st group: pq</span><span style=\"font-weight:bold\">r</span><span>st</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2nd group: p</span><span style=\"font-weight:bold\">q</span><span>rst</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3rd group: pqrs</span><span style=\"font-weight:bold\">t</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4th group: pqrst</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5th group: </span><span style=\"font-weight:bold\">p</span><span>qrst</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The letters required to complete the series, from left to right, are </span><span style=\"font-weight:bold\">r, q, t, p</span><span> (rqtp).</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Directions: In the following question, two statements are given, followed by two conclusions (I and II). Assume the statements to be true even if they appear to contradict general facts. Determine which conclusion(s) logically follow(s) from the given statements.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Some tigers are lions.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">No lion is an elephant.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. Some elephants are tigers.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. Some tigers are not elephants.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion I follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion II follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both conclusions I and II follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither conclusion I nor II follows</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image039.png\" width=\"313\" height=\"87\" alt ><span> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since the portion of tigers that are lions cannot be elephants (as no lion is an elephant), it definitely follows that those tigers are not elephants. Thus, conclusion II (\"Some tigers are not elephants\") logically follows.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Conclusion I (\"Some elephants are tigers\") is a possibility, but does not definitely follow.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, only conclusion II follows.</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which of the following sets of classes is best represented by a Venn diagram in which one circle is completely enclosed inside a second circle, and a third circle partially overlaps both the first and the second circles?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sisters, Females, Doctors</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Fathers, Males, Brothers</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Stationery, Pencil, Eraser</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Animals, Carnivores, Tigers</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. All </span><span style=\"font-weight:bold\">Sisters</span><span> are unconditionally </span><span style=\"font-weight:bold\">Females</span><span>, so the circle representing 'Sisters' lies entirely inside the circle representing 'Females'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Some sisters are doctors, some females (who are not sisters) are doctors, and some doctors are males (neither females nor sisters). Therefore, the circle representing 'Doctors' partially intersects both 'Sisters' and 'Females', with a part of it extending outside 'Females'.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, </span><span style=\"font-weight:bold\">Sisters, Females, Doctors</span><span> correctly fits the given relationship.</span></p>", "question_heading": ""}, {"sr_no": 60, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the option that is related to the fifth number in the same way as the second number is related to the first number and the fourth number is related to the third number: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image040.png\" width=\"123\" height=\"21\" alt style=\"vertical-align:middle\" ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>496</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>504</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>512</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>520</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed here is: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image041.png\" width=\"73\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First pair: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image042.png\" width=\"168\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second pair: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image043.png\" width=\"168\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly, for the third pair: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image044.png\" width=\"168\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hence, the correct answer is 504.</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">From the given options, select the group of letters that, when inserted in order from left to right into the blanks of the incomplete series, will logically complete it.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">C _ M _ N _ D M _ N C _ M P _ C D _ P _</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D P C P D N M N</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D P C M D N P N</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D C P P D M N N</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D P C P N D M N</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The given series consists of 20 letters. Dividing it into 4 equal groups of 5 letters each, we observe a repeating pattern:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C </span><span style=\"font-weight:bold\">D</span><span> M </span><span style=\"font-weight:bold\">P</span><span> N / </span><span style=\"font-weight:bold\">C</span><span> D M </span><span style=\"font-weight:bold\">P</span><span> N / C </span><span style=\"font-weight:bold\">D</span><span> M P </span><span style=\"font-weight:bold\">N</span><span> / C D </span><span style=\"font-weight:bold\">M</span><span> P </span><span style=\"font-weight:bold\">N</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern repeating in every block is </span><span style=\"font-weight:bold\">CDMPN</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The missing letters in order from left to right are </span><span style=\"font-weight:bold\">D, P, C, P, D, N, M, N</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In the following letter sequence, each group follows a specific pattern. Identify the group of letters that should come next in the sequence.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">CZEW, GXJS, LUPN, RQWH, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>YMEA</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>YLEA</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>XKFA</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ZLDB</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Analyzing the pattern position by position based on alphabetical values:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1st letter: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image045.png\" width=\"352\" height=\"29\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2nd letter: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image046.png\" width=\"368\" height=\"28\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3rd letter: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image047.png\" width=\"433\" height=\"29\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4th letter: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image048.png\" width=\"355\" height=\"29\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combining these gives </span><span style=\"font-weight:bold\">YLEA</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In the following, the first two pairs of letter-clusters follow a specific relationship. Apply the same logic to find the missing letter-cluster in the third pair.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">TRIANGLE : VOJQZRUW :: COMPUTER : UVWFSPLF :: FRACTION : ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>QLRWFZUI</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>IUFZWRQL</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>QLOVZFUI</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PLRVYFTH</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The logic followed here is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Step 1:</span><span> The letters of the word are considered in reverse order (from right to left).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Step 2:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If the letter is a </span><span style=\"font-weight:bold\">VOWEL</span><span>, it is replaced by its opposite letter in the alphabet (sum of positional values = 27).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If the letter is a </span><span style=\"font-weight:bold\">CONSONANT</span><span>, its positional value is increased by 3 (+3).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For </span><span style=\"font-weight:bold\">TRIANGLE</span><span> (reversed: E - L - G - N - A - I - R - T):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E (Vowel) → Opposite = V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L (Consonant) → L + 3 = O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>G (Consonant) → G + 3 = J</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N (Consonant) → N + 3 = Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A (Vowel) → Opposite = Z</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I (Vowel) → Opposite = R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R (Consonant) → R + 3 = U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T (Consonant) → T + 3 = W</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Code = </span><span style=\"font-weight:bold\">VOJQZRUW</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly, for </span><span style=\"font-weight:bold\">FRACTION</span><span> (reversed: N - O - I - T - C - A - R - F):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N (Consonant) → N + 3 = Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O (Vowel) → Opposite = L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I (Vowel) → Opposite = R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T (Consonant) → T + 3 = W</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C (Consonant) → C + 3 = F</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A (Vowel) → Opposite = Z</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R (Consonant) → R + 3 = U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F (Consonant) → F + 3 = I</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Code = </span><span style=\"font-weight:bold\">QLRWFZUI</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a row of students facing north, Aman is 9th from the left end. Priya is 16th from the left end and is sitting exactly midway between Aman and Chetan. If Chetan is 12</span><span style=\"font-family:Arial;font-weight:bold\">th</span><span style=\"font-weight:bold\"> from the right end, how many students are there in the row?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>32</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>36</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>34</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>30</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Position of Aman from the left end = 9th</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Position of Priya from the left end = 16th</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Number of students between Aman and Priya = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image049.png\" width=\"104\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since Priya is sitting exactly midway between Aman and Chetan, the number of students between Priya and Chetan is also 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>So, the position of Chetan from the left end = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image050.png\" width=\"128\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Position of Chetan from the right end = 12th</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Total number of students in the row = (Position from left) + (Position from right) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image051.png\" width=\"167\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">This question is based on the five, three-digit numbers given below.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(Left) 628 435 814 297 571 (Right)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(Example: 697 – First digit = 6, second digit = 9 and third digit = 7)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(NOTE: All operations to be done from left to right.)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">What will be the resultant if the first digit of the highest number is multiplied by the second digit of the second lowest number?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>24</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>27</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>32</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The given numbers in ascending order are: 297 &lt; 435 &lt; 571 &lt; 628 &lt; 814.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The highest number is 814, and its first digit is 8.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The second lowest number is 435, and its second digit is 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Required resultant = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image037.png\" width=\"75\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a certain code language, 'FRACTION' is coded as 'CARFNOIT'. How will 'CLOTHING' be coded in that language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>LOTCGNIH</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>TOLCGNHI</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>TOLCGNIH</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>TOLCHIGN</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The 8-letter word is divided into two halves of 4 letters each, and each half is reversed:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FRACTION → FRAC | TION</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Reversing the first half: FRAC → CARF</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Reversing the second half: TION → NOIT</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combining both: CARFNOIT</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the same logic to CLOTHING:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>CLOTHING → CLOT | HING</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Reversing the first half: CLOT → TOLC</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Reversing the second half: HING → GNIH</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combining both: </span><span style=\"font-weight:bold\">TOLCGNIH</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In the following letter sequence, one term is missing. Choose the correct option that will replace the question mark (?).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">BY, EV, IR, NM, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>SH</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>TG</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>UF</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>VE</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the given series is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First letters:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B (2) + 3 = E (5)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E (5) + 4 = I (9)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I (9) + 5 = N (14)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N (14) + 6 = T (20)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The second letter of each pair is the opposite letter (sum of positional values is 27) of the first letter:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B ↔ Y</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E ↔ V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I ↔ R</span></p><p style=\"margin-top:0pt;margin-bottom:0 s the daughter of E. How is B related to E?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mother</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mother-in-law</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sister-in-law</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Daughter-in-law</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given information:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. A is the husband of B, which means A is male and B is female.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. C is the son of A and B.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. D is the sister of C, which means D is the daughter of A and B.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. E is married to D, which means E is the husband of D.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. F is the daughter of E and D.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image064.png\" width=\"321\" height=\"363\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since D is the daughter of B and E is D's husband, B is the mother-in-law of E.</span></p>", "question_heading": ""}, {"sr_no": 70, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which two numbers should be interchanged to make the given equation correct?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image065.png\" width=\"183\" height=\"21\" alt style=\"vertical-align:middle\" ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7 and 12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6 and 4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4 and 12</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6 and 12</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>By interchanging 6 and 4, we get:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image066.png\" width=\"138\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the BODMAS rule:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image067.png\" width=\"122\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image068.png\" width=\"104\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image069.png\" width=\"106\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since LHS = RHS = 34, interchanging 6 and 4 makes the equation correct.</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In the following question, a statement is given followed by two assumptions numbered I and II. Read the statement and assumptions carefully and choose the appropriate option.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statement:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">An educational institute is upgrading its library with digital e-learning resources and requesting its alumni for donations to fund this modernization project.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Assumptions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. Digital e-learning resources are expected to be beneficial for the students.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. The alumni will definitely provide the entire fund required for the project.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only assumption I is implicit</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only assumption II is implicit</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither assumption I nor II is implicit</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both assumptions I and II are implicit</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Assumption I is implicit:</span><span> Any organization upgrading its facilities assumes that the upgrade (here, digital resources) will be beneficial to its target users (the students).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">Assumption II is not implicit:</span><span> Requesting funds or donations assumes that alumni are likely or able to contribute, but assuming that they will </span><span style=\"font-style:italic\">definitely</span><span> provide the </span><span style=\"font-style:italic\">entire</span><span> fund is an extreme and unjustified claim. Hence, only assumption I is implicit.</span></p>", "question_heading": ""}, {"sr_no": 72, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Read the criteria given for a position along with the exception and then decide what decision should be taken for the case given.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Criteria for the post of Systems Architect:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">1. B.E./B.Tech in Computer Science or IT with </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image070.png\" width=\"55\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> marks.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">2. Age between 26 and 35 years as on 1st August 2023.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">3. At least 4 years of work experience in cloud architecture.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Exception: If criterion (1) is not satisfied, but the candidate holds an M.Tech degree in Computer Science, the case is to be referred to the ‘Technical Director’.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Case: Amit, aged 29 years, has a B.Sc. in Electronics with 72% marks and an M.Tech degree in Computer Science. He has 5 years of work experience in cloud architecture. What decision should be taken regarding Amit?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Candidate is to be selected.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Candidate is to be rejected.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Case is to be referred to the Technical Director.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Data is inadequate to take a decision.</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let us evaluate Amit's profile against each criterion:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">Educational Qualification:</span><span> Amit has a B.Sc. in Electronics, not a B.E./B.Tech in Computer Science or IT. Hence, criterion (1) is not satisfied.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">Exception check:</span><span> The exception states that if criterion (1) is not met, but the candidate has an M.Tech in Computer Science, the case should be referred to the 'Technical Director'. Amit holds an M.Tech degree in Computer Science, so the exception applies.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span style=\"font-weight:bold\">Age:</span><span> Amit is 29 years old, which lies between 26 and 35 years. Criterion (2) is satisfied.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. </span><span style=\"font-weight:bold\">Experience:</span><span> Amit has 5 years of experience in cloud architecture (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image071.png\" width=\"30\" height=\"21\" alt style=\"vertical-align:middle\" ><span> years). Criterion (3) is satisfied.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since all other criteria are met and the exception condition for criterion (1) is fulfilled, the case is to be referred to the Technical Director.</span></p>", "question_heading": ""}, {"sr_no": 73, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the figure from the options that can replace the question mark (?) to logically complete the given series.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image072.png\" width=\"540\" height=\"111\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image073.png\" width=\"228\" height=\"231\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image074.png\" width=\"227\" height=\"228\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bu
