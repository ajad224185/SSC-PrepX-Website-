ng down the numbers into their constituent digits. E.g. 13 – Operations on 13 such as adding/subtracting/multiplying etc. to 13 can be performed. Breaking down 13 into 1 and 3 and then performing mathematical operations on 1 and 3 is not allowed.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>276 - 12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>391 - 17</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>365 - 16</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>483 - 21</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed here is:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First number = Second number </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image083.png\" width=\"37\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image084.png\" width=\"102\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image085.png\" width=\"102\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image086.png\" width=\"149\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793471659740_image087.png\" width=\"102\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, '365 - 16' is the odd one out.</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Pointing to a boy, a woman said, \"His mother is the only daughter-in-law of the only son-in-law of my maternal grandfather.\" If the woman's mother is the only child of her parents, how is that woman related to the boy?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Maternal aunt</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Paternal aunt</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mother</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Sister</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>\"My maternal grandfather\" refers to the woman's mother's father.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since the woman's mother is the only child of her parents, the only son-in-law of her maternal grandfather is the woman's father. </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The only daughter-in-law of the woman's father is the wife of the woman's brother (since the woman herself is his daughter). </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The boy's mother is the woman's brother's wife, which makes the boy her brother's son (nephew). </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the woman is the boy's paternal aunt (father's sister).</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the following question, some of the words in the passage    have been left out. Read the passage carefully and choose the    correct word for each blank, out of the four alternatives and fill    in the blanks.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">After rising    steadily ________ (1) major global currencies for the first half    of the year, the euro has ________ (2) somewhat over the last few    weeks. It has dropped by nearly 4% from its highest levels    ________ (3) in July. Even with this recent decline, the euro is    still up about 6% since the start of the year. The euro’s    performance has been closely ________ (4) to interest rate    decisions by the central bank. This makes sense, as monetary    policy directly impacts international investment flows. The value    of the euro surged when rate hikes were aggressive earlier this    year, a trend that persisted until mid-summer. Since then, as    inflationary pressures have cooled, the currency has ________ (5)    against rival assets.</p>    <p style=\"orphans:0;widows:0\"><b>What should come in blank (1)    ?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    over</p>", "option2": " <p style=\"orphans:0;widows:0\">    from</p>", "option3": " <p style=\"orphans:0;widows:0\">    through</p>", "option4": " <p style=\"orphans:0;widows:0\">    against</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>(D). against</b></p>    <p style=\"orphans:0;widows:0\">The preposition ‘against’ is    used when comparing the performance or valuation of one currency    relative to others (e.g., ‘rising/falling against major    currencies’). Therefore, <b>‘against’</b> is the most    appropriate word for blank (1).</p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the following question, some of the words in the passage    have been left out. Read the passage carefully and choose the    correct word for each blank, out of the four alternatives and fill    in the blanks.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">After rising    steadily ________ (1) major global currencies for the first half    of the year, the euro has ________ (2) somewhat over the last few    weeks. It has dropped by nearly 4% from its highest levels    ________ (3) in July. Even with this recent decline, the euro is    still up about 6% since the start of the year. The euro’s    performance has been closely ________ (4) to interest rate    decisions by the central bank. This makes sense, as monetary    policy directly impacts international investment flows. The value    of the euro surged when rate hikes were aggressive earlier this    year, a trend that persisted until mid-summer. Since then, as    inflationary pressures have cooled, the currency has ________ (5)    against rival assets.</p>    <p style=\"orphans:0;widows:0\"><b>What should come in blank (2)    ?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    victory</p>", "option2": " <p style=\"orphans:0;widows:0\">    climate</p>", "option3": " <p style=\"orphans:0;widows:0\">    balance</p>", "option4": " <p style=\"orphans:0;widows:0\">    retreated</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>(D).retreated</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The sentence    requires a past participle verb after <b>‘has’</b> to indicate    a pullback or drop in value after rising.</p>    <p style=\"orphans:0;widows:0\">‘<b>Retreated’</b> means    moved back or dropped from a higher level, fitting the context    accurately. ‘Victory’, ‘climate’, and ‘balance’ are    contextually and grammatically incorrect.</p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the following question, some of the words in the passage    have been left out. Read the passage carefully and choose the    correct word for each blank, out of the four alternatives and fill    in the blanks.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">After rising    steadily ________ (1) major global currencies for the first half    of the year, the euro has ________ (2) somewhat over the last few    weeks. It has dropped by nearly 4% from its highest levels    ________ (3) in July. Even with this recent decline, the euro is    still up about 6% since the start of the year. The euro’s    performance has been closely ________ (4) to interest rate    decisions by the central bank. This makes sense, as monetary    policy directly impacts international investment flows. The value    of the euro surged when rate hikes were aggressive earlier this    year, a trend that persisted until mid-summer. Since then, as    inflationary pressures have cooled, the currency has ________ (5)    against rival assets.</p>    <p style=\"orphans:0;widows:0\"><b>What should come in blank (3)    ?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    attained</p>", "option2": " <p style=\"orphans:0;widows:0\">    ignored</p>", "option3": " <p style=\"orphans:0;widows:0\">    beneath</p>", "option4": " <p style=\"orphans:0;widows:0\">    supply</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>(A).attained</b></p>    <p style=\"orphans:0;widows:0\">The sentence refers to the    highest levels achieved or reached in July. <b>‘Attained’</b>    means reached or succeeded in achieving, making it the most    appropriate choice to describe ‘highest levels attained in    July’.</p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the following question, some of the words in the passage    have been left out. Read the passage carefully and choose the    correct word for each blank, out of the four alternatives and fill    in the blanks.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">After rising    steadily ________ (1) major global currencies for the first half    of the year, the euro has ________ (2) somewhat over the last few    weeks. It has dropped by nearly 4% from its highest levels    ________ (3) in July. Even with this recent decline, the euro is    still up about 6% since the start of the year. The euro’s    performance has been closely ________ (4) to interest rate    decisions by the central bank. This makes sense, as monetary    policy directly impacts international investment flows. The value    of the euro surged when rate hikes were aggressive earlier this    year, a trend that persisted until mid-summer. Since then, as    inflationary pressures have cooled, the currency has ________ (5)    against rival assets.</p>    <p style=\"orphans:0;widows:0\"><b>What should come in blank (4)    ?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    vaguely</p>", "option2": " <p style=\"orphans:0;widows:0\">    seldom</p>", "option3": " <p style=\"orphans:0;widows:0\">    linked</p>", "option4": " <p style=\"orphans:0;widows:0\">    purely</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>(C).linked</b></p>    <p style=\"orphans:0;widows:0\">The phrase ‘closely ________    to’ describes a connection or correlation between the euro’s    performance and interest rate decisions. <b>‘Linked’</b> is a    verb/participle that fits the passive construction ‘has been    closely linked to’.</p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the following question, some of the words in the passage    have been left out. Read the passage carefully and choose the    correct word for each blank, out of the four alternatives and fill    in the blanks.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">After rising    steadily ________ (1) major global currencies for the first half    of the year, the euro has ________ (2) somewhat over the last few    weeks. It has dropped by nearly 4% from its highest levels    ________ (3) in July. Even with this recent decline, the euro is    still up about 6% since the start of the year. The euro’s    performance has been closely ________ (4) to interest rate    decisions by the central bank. This makes sense, as monetary    policy directly impacts international investment flows. The value    of the euro surged when rate hikes were aggressive earlier this    year, a trend that persisted until mid-summer. Since then, as    inflationary pressures have cooled, the currency has ________ (5)    against rival assets.</p>    <p style=\"orphans:0;widows:0\"><b>What should come in blank (5)    ?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    weakened</p>", "option2": " <p style=\"orphans:0;widows:0\">    dynamic</p>", "option3": " <p style=\"orphans:0;widows:0\">    factor</p>", "option4": " <p style=\"orphans:0;widows:0\">    forming</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>(A).</b></p>    <p style=\"orphans:0;widows:0\">Following <b>‘has’</b>, a    past participle verb is required. Since inflationary pressures    cooled and the currency lost ground, <b>‘weakened’</b>    correctly describes the currency’s decline against rival assets.</p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span style=\"font-size:11pt\"><b>Given    below are four jumbled parts of a sentence. Select the option that    gives their correct order.</b></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><span style=\"font-size:11pt\"><b>A)    has been attributed by many climate scientists</b></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><span style=\"font-size:11pt\"><b>B)    the unprecedented frequency of extreme weather events</b></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><span style=\"font-size:11pt\"><b>C)    to the steady rise in global atmospheric temperatures</b></span></span></p>    <p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\"><b>D)    observed across various continents over the last decade</b></span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">BDAC</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">CBAD</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">ABCD</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">ADBC</span></span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\">The    correct order is </span></span><span><span style=\"font-size:11pt\"><b>BDAC</b></span></span><span><span style=\"font-size:11pt\">.</span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <span><span style=\"font-size:11pt\"><b>B</b></span></span><span><span style=\"font-size:11pt\">     introduces the main subject (</span></span><span><span style=\"font-size:11pt\"><i>\"the     unprecedented frequency of extreme weather events\"</i></span></span><span><span style=\"font-size:11pt\">).</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><span style=\"font-size:11pt\"><b>D</b></span></span><span><span style=\"font-size:11pt\">     modifies the subject by specifying where and when these events     occurred (</span></span><span><span style=\"font-size:11pt\"><i>\"observed     across various continents over the last decade\"</i></span></span><span><span style=\"font-size:11pt\">).</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><span style=\"font-size:11pt\"><b>A</b></span></span><span><span style=\"font-size:11pt\">     follows to state what caused it (</span></span><span><span style=\"font-size:11pt\"><i>\"has     been attributed by many climate scientists\"</i></span></span><span><span style=\"font-size:11pt\">).</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\"><span><span style=\"font-size:11pt\"><b>C</b></span></span><span><span style=\"font-size:11pt\">     completes the thought by identifying the cause (</span></span><span><span style=\"font-size:11pt\"><i>\"to     the steady rise in global atmospheric temperatures\"</i></span></span><span><span style=\"font-size:11pt\">).</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in\"><span><span style=\"font-size:11pt\">The    correct option is </span></span><span><span style=\"font-size:11pt\"><b>A)    BDAC</b></span></span><span><span style=\"font-size:11pt\">.</span></span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The following sentence has been divided into four parts.    Identify the part that contains a grammatical error.</b></p>    <p style=\"orphans:0;widows:0\">Of the two meticulously    researched proposals (A) / submitted to the board of directors,    (B) / the second one was undoubtedly (C) / the most viable for    implementation (D).</p>", "option1": "<p style=\"orphans:0;widows:0\">    A</p>", "option2": " <p style=\"orphans:0;widows:0\">    D</p>", "option3": " <p style=\"orphans:0;widows:0\">    B</p>", "option4": " <p style=\"orphans:0;widows:0\">    C</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Part (D) contains a grammatical error</b>.</p>    <p style=\"orphans:0;widows:0\">When comparing or choosing    between exactly two entities, the <b>comparative degree</b> of the    adjective is used preceded by <b>'the'</b> (i.e., 'the +    comparative degree'), rather than the <b>superlative degree</b>.    Since only two proposals are being compared here (\"Of the    two...\"), <b>'the most viable'</b> must be replaced with <b>'the    more viable'</b>.</p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct passive form of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">The flood damaged several bridges    in the valley. Even the railway track has been submerged.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Several bridges in the valley have been damaged by the flood. Even    the railway track was submerged.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Several bridges in the valley were damaged by the flood. Even the    railway track has been submerged.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Several bridges damaged in the valley by the flood and the railway    track is being submerged.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The flood, being damaged several bridges in the valley, also    submerged the railway track.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct option is (B). Several bridges in the valley were    damaged by the flood. Even the railway track has been submerged</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The given    sentence consists of two parts:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. \"The    flood damaged several bridges in the valley.\" — This clause    is in the Simple Past tense (Active Voice: Subject + V2 + Object).    Its passive form is: Object + was/were + V3 + by + Subject →    \"Several bridges in the valley were damaged by the flood.\"</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. \"Even    the railway track has been submerged.\" — This clause is    already in the passive voice (Present Perfect Passive), so it    remains unchanged.</p>    <p style=\"orphans:0;widows:0\">Combining both, the correct    passive sentence is: \"Several bridges in the valley were    damaged by the flood. Even the railway track has been submerged.\"    <b>Hence, option B is the correct answer</b>.</p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span style=\"font-size:11pt\">In    the following question, out of the four alternatives, choose the    one which gives the meaning of the given idiom or phrase.</span></span></p>    <p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\"><b>A    stitch in time saves nine</b></span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">Tailoring    is a valuable skill</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">Drunk    or intoxicated</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">Saving    money for the future</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">Timely    action prevents more work</span></span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\">The    correct option is </span></span><span><span style=\"font-size:11pt\"><b>D)    Timely action prevents more work</b></span></span><span><span style=\"font-size:11pt\">.</span></span></p>    <p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\">The    proverb </span></span><span><b>\"A stitch    in time saves nine\"</b></span><span><span style=\"font-size:11pt\">    means that taking immediate, proactive action to fix a small    problem prevents it from worsening and requiring a lot more effort    or work later on.</span></span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate ANTONYM of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Perspicacious</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Discerning</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sagacious</p>", "option3": " <p style=\"orphans:0;widows:0\">    Obtuse</p>", "option4": " <p style=\"orphans:0;widows:0\">    Astute</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>(C). Obtuse</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The word    <b>Perspicacious</b> means having a ready insight into and    understanding of things; shrewd, sharp-witted, or perceptive.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Obtuse</b>     means slow to understand or perceive; dull-witted or insensitive,     which makes it the exact antonym.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Discerning</b>,     <b>Sagacious</b>, and <b>Astute</b> are all synonyms of     perspicacious, meaning wise, shrewd, or having good judgment.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct direct form of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">The manager inquired whether the    report was complete.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The manager asked, “Was the report complete?”</p>", "option2": " <p style=\"orphans:0;widows:0\">    The manager asked, “Is the report complete?”</p>", "option3": " <p style=\"orphans:0;widows:0\">    The manager asked, “Whether the report was complete?”</p>", "option4": " <p style=\"orphans:0;widows:0\">    The manager asked, “The report is complete?”</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>(B). The manager asked, “Is the report    complete?”</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">To convert an    indirect interrogative sentence into direct speech:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Remove     the conjunction 'whether' or 'if'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Change     the reporting verb 'inquired' to 'asked' (or 'said to').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     indirect statement in the simple past tense ('was complete')     changes back to the simple present tense ('is complete') in     direct speech.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     inverted structure of a question (Auxiliary verb + Subject + ...)     is restored: <i>“Is the report complete?”</i></p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, the correct direct    form is: <b>The manager asked, “Is the report complete?”</b></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\"><b>Select    the correctly spelt word out of the four alternatives</b></span></span><span><span style=\"font-size:11pt\">.</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">Grosteasque</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">Grotesque</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">Growtesque</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">Grostasque</span></span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span style=\"font-size:11pt\">The    correct answer is </span></span><span><span style=\"font-size:11pt\"><b>B)    Grotesque</b></span></span><span><span style=\"font-size:11pt\">.</span></span></p>    <p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\">It    is an </span></span><span><span style=\"font-size:11pt\"><b>adjective</b></span></span><span><span style=\"font-size:11pt\">    that describes something comically or repulsively ugly, distorted,    or bizarre.</span></span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate synonym of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Spurious</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Authentic</p>", "option2": " <p style=\"orphans:0;widows:0\">    Counterfeit</p>", "option3": " <p style=\"orphans:0;widows:0\">    Legitimate</p>", "option4": " <p style=\"orphans:0;widows:0\">    Genuine</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>(B). Counterfeit</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>'Spurious'</b>    refers to something that is not genuine, authentic, or true; it    means false or fake. Therefore, <b>'Counterfeit'</b> is its most    appropriate synonym.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meanings    of other options:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Authentic:    genuine or of undisputed origin</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Legitimate:    conforming to the law or to rules; valid</p>    <p style=\"orphans:0;widows:0\">- Genuine: truly what something    is said to be; authentic</p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to substitute the underlined    segment in the given sentence. If there is no need to substitute    it, select 'No improvement'.</p>    <p style=\"orphans:0;widows:0\"><b>Start revising today </b><u><b>if    you will score</b></u><b> high marks in the final examination</b>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    if you want to score</p>", "option2": " <p style=\"orphans:0;widows:0\">    if you will have scored</p>", "option3": " <p style=\"orphans:0;widows:0\">    if you are scoring</p>", "option4": " <p style=\"orphans:0;widows:0\">    No improvement</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The underlined phrase<b> 'if you will score'</b> is grammatically    incorrect. In conditional clauses expressing intention, wish, or    purpose, we do not use 'will'. Instead, the structure<b> 'if you    want to + base form of the verb'</b> is used to express desire or    intention to achieve an outcome. Therefore,<b> 'if you want to    score'</b> is the correct substitution.</p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span style=\"font-size:11pt\">Choose    the option that contains the homonym of the highlighted word in    the given sentence.</span></span></p>    <p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\">Please    make sure to write your full home </span></span><span><span style=\"font-size:11pt\"><b>address</b></span></span><span><span style=\"font-size:11pt\">,    including the apartment number and zip code, on the top of the    application form.</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">After    living in the city for ten years, Sarah had to notify the post    office that her permanent address was changing to a rural    farmhouse.</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">The    delivery driver called me because he was having trouble finding my    address on the GPS due to the new construction in the    neighborhood.</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">Millions    of people tuned in to watch the president's televised address    regarding the new economic policies.</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">The    celebrity requested that her residential address be kept private    and removed from all public search directories for security    reasons.</span></span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\">The    correct option is: </span></span><span><span style=\"font-size:11pt\"><b>C)    Millions of people tuned in to watch the president's televised    address regarding the new economic policies.</b></span></span></p>    <h3><a name=\"_heading=h.pt6rtda4o4t4\"></a>    <span><span><span style=\"font-size:13pt\"><b>Explanation:</b></span></span></span></h3>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <span><span style=\"font-size:11pt\">Homonyms     are words that share the </span></span><span><span style=\"font-size:11pt\"><b>exact     same spelling and pronunciation</b></span></span><span><span style=\"font-size:11pt\">     but have </span></span><span><span style=\"font-size:11pt\"><b>completely     different meanings</b></span></span><span><span style=\"font-size:11pt\">.</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\"><span><span style=\"font-size:11pt\"><b>\"Address\"</b></span></span><span><span style=\"font-size:11pt\">     (Noun): The location where someone lives or an organization is     situated.</span></span></p>    </li></ul>    <h3><a name=\"_heading=h.feg1lvhvubp\"></a>    <span><span><span style=\"font-size:13pt\"><b>Option    Analysis:</b></span></span></span></h3>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <span><span style=\"font-size:11pt\"><b>Options     A, B, and D:</b></span></span><span><span style=\"font-size:11pt\">     All use </span></span><span><span style=\"font-size:11pt\"><b>\"address\"</b></span></span><span><span style=\"font-size:11pt\">     in the </span></span><span><span style=\"font-size:11pt\"><b>same     sense</b></span></span><span><span style=\"font-size:11pt\">     as the prompt (a physical living or location address).</span></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\"><b>Option     C:</b></span></span><span><span style=\"font-size:11pt\">     Uses </span></span><span><span style=\"font-size:11pt\"><b>\"address\"</b></span></span><span><span style=\"font-size:11pt\">     as a noun meaning a </span></span><span><span style=\"font-size:11pt\"><b>formal     speech or presentation</b></span></span><span><span style=\"font-size:11pt\">     given to an audience. Because the spelling and pronunciation are     identical but the context and meaning are entirely different, it     is the true </span></span><span><span style=\"font-size:11pt\"><b>homonym</b></span></span><span><span style=\"font-size:11pt\">.</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"orphans:0;widows:0\">    <b>Select the wrongly spelt word out of the four alternatives.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Exaggerate</p>", "option2": " <p style=\"orphans:0;widows:0\">    Exhilarate</p>", "option3": " <p style=\"orphans:0;widows:0\">    Exonerate</p>", "option4": " <p style=\"orphans:0;widows:0\">    Exhorbitant</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The wrongly spelt word is <b>Exhorbitant</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The correct    spelling is <b>Exorbitant</b>, which means unreasonably high or    excessive (e.g., exorbitant prices). It does not contain the    letter 'h'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meanings    and correct spellings of other options</b>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Exaggerate:</b>    To represent something as being larger, better, or worse than it    really is.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Exhilarate:</b>    To make someone feel very happy, animated, or elated.</p>    <p style=\"orphans:0;widows:0\"><b>Exonerate:</b> To officially    absolve someone from blame or a criminal charge.</p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to substitute the underlined    segment in the given sentence. If there is no need to substitute    it, select 'No improvement'.</p>    <p style=\"orphans:0;widows:0\"><b>The tourist placed his heavy    backpack </b><u><b>besides the park bench</b></u><b> while he    caught his breath.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    beside the park bench</p>", "option2": " <p style=\"orphans:0;widows:0\">    beside to the park bench</p>", "option3": " <p style=\"orphans:0;widows:0\">    besides of the park bench</p>", "option4": " <p style=\"orphans:0;widows:0\">    No improvement</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (1). <b>beside the park bench</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Explanation:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Beside</b>    is a preposition that means 'next to' or 'at the side of'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Besides</b>    means 'in addition to' or 'apart from'.</p>    <p style=\"orphans:0;widows:0\">In the given context, the tourist    kept his backpack next to the bench, indicating a physical    position. Hence, the preposition 'beside' should be used instead    of 'besides'.</p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words.</p>    <p style=\"orphans:0;widows:0\"><b>An abnormal and persistent    fear of growing old or aging</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Thanatophobia</p>", "option2": " <p style=\"orphans:0;widows:0\">    Gerontophobia</p>", "option3": " <p style=\"orphans:0;widows:0\">    Gerascophobia</p>", "option4": " <p style=\"orphans:0;widows:0\">    Chronophobia</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitute is <b>Gerascophobia</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Gerascophobia</b>:     An irrational or extreme fear of growing old or aging (from Greek     <i>geras</i> meaning 'old age').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Thanatophobia</b>:     An intense fear of death or dying.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Gerontophobia</b>:     A fear or hatred of the elderly or old people.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Chronophobia</b>: An     irrational fear of time and the passage of time.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span style=\"font-size:11pt\"><b>Given    below are four jumbled sentences. Select the option that gives    their correct order.</b></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><span style=\"font-size:11pt\"><b>A.    Here, the picture-perfect French Quarter and heritage laden Tamil    streets blend into one another.</b></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><span style=\"font-size:11pt\"><b>B.    Across many metropolitan cities, there exists a visible conflict    in how the old and the new coexist.</b></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><span style=\"font-size:11pt\"><b>C.    The old and new, like two different worlds, surviving side by side    yet never crossing that chasm.</b></span></span></p>    <p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\"><b>D.    However, Puducherry stands as a striking exception, where these    very contrasts are celebrated rather than endured.</b></span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">BCDA</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">ABCD</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">DABC</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">BACD</span></span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\">The    correct order is </span></span><span><span style=\"font-size:11pt\"><b>BCDA</b></span></span><span><span style=\"font-size:11pt\">.</span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <span><span style=\"font-size:11pt\"><b>B</b></span></span><span><span style=\"font-size:11pt\">     introduces the general context (</span></span><span><span style=\"font-size:11pt\"><i>\"Across     many metropolitan cities, there exists a visible conflict in how     the old and the new coexist\"</i></span></span><span><span style=\"font-size:11pt\">).</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><span style=\"font-size:11pt\"><b>C</b></span></span><span><span style=\"font-size:11pt\">     expands on this conflict (</span></span><span><span style=\"font-size:11pt\"><i>\"The     old and new, like two different worlds, surviving side by     side...\"</i></span></span><span><span style=\"font-size:11pt\">).</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><span style=\"font-size:11pt\"><b>D</b></span></span><span><span style=\"font-size:11pt\">     introduces the counter-example using </span></span><span><span style=\"font-size:11pt\"><i>\"However\"</i></span></span><span><span style=\"font-size:11pt\">     (</span></span><span><span style=\"font-size:11pt\"><i>\"However,     Puducherry stands as a striking exception...\"</i></span></span><span><span style=\"font-size:11pt\">).</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\"><span><span style=\"font-size:11pt\"><b>A</b></span></span><span><span style=\"font-size:11pt\">     describes the specific details of Puducherry mentioned in D     (</span></span><span><span style=\"font-size:11pt\"><i>\"Here,     the picture-perfect French Quarter...\"</i></span></span><span><span style=\"font-size:11pt\">).</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in\"><span><span style=\"font-size:11pt\">The    correct option is </span></span><span><span style=\"font-size:11pt\"><b>A)    BCDA</b></span></span><span><span style=\"font-size:11pt\">.</span></span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Choose the most appropriate option to fill in the blank in the    given sentence.</p>    <p style=\"orphans:0;widows:0\"><b>The night sky in the desert    was exceptionally clear, displaying thousands of ________ stars</b>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Dormant</p>", "option2": " <p style=\"orphans:0;widows:0\">    Barren</p>", "option3": " <p style=\"orphans:0;widows:0\">    Radiant</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sluggish</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (C). <b>Radiant</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Radiant</b>     means shining or glowing brightly with light, which fits     contextually to describe stars shining in a clear night sky.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings     of the other options:</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Dormant:</b>     in a state of temporary inactivity or rest.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Barren:</b>     bleak, lifeless, or unable to produce vegetation.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Sluggish:</b> slow-moving     or lacking energy.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct indirect form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">“<b>Do you believe you are    wiser than your elders?” sneered the old man.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    The old man sneered that did he believe he was wiser than his    elders.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The old man sneered and asked whether he has believed he is wiser    than his elders.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The old man sneered and asked whether he believed he was wiser    than his elders.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The old man sneered and asked if you believed you were wiser than    your elders.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct indirect form of the given sentence is: <b>The old man    sneered and asked whether he believed he was wiser than his    elders.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Rules for    changing interrogative sentences into indirect speech:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     reporting verb 'sneered' indicates tone and inquiry, so it is     expressed as 'sneered and asked'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">For     Yes/No questions starting with an auxiliary verb ('Do'), 'if' or     'whether' is used as the conjunction (not 'that').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     question format changes into assertive structure (Subject +     Verb). Thus, 'Do you believe' changes to 'he believed' (Simple     Present to Simple Past).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The verb     <b>'are'</b> changes to <b>'was'</b>.</p>     </li><li><p style=\"orphans:0;widows:0\">The second-person pronoun     'you' changes to the third-person pronoun 'he'.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that gives the most appropriate meaning of the    given idiom.</p>    <p style=\"orphans:0;widows:0\"><b>Penny-wise and pound-foolish</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Extremely generous with one's wealth</p>", "option2": " <p style=\"orphans:0;widows:0\">    Careless with small expenses but cautious with huge sums</p>", "option3": " <p style=\"orphans:0;widows:0\">    Careful about small amounts of money but wasteful with large    amounts</p>", "option4": " <p style=\"orphans:0;widows:0\">    Wise in business decisions and investments</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>(C). Careful about small amounts of money    but wasteful with large amounts</b></p>    <p style=\"orphans:0;widows:0\">The idiom <b>\"Penny-wise and    pound-foolish\"</b> refers to a person who is overly cautious    about small, trivial amounts of money or minor matters, but    careless and wasteful when dealing with large, substantial sums.</p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Given below are four jumbled parts of a sentence. Select the    option that gives their correct order.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A) into    the mechanisms of</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B)    provided profound insights</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C) the    recent scientific study</b></p>    <p style=\"orphans:0;widows:0\"><b>D) cellular regeneration</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    ACBD</p>", "option2": " <p style=\"orphans:0;widows:0\">    CBAD</p>", "option3": " <p style=\"orphans:0;widows:0\">    BCDA</p>", "option4": " <p style=\"orphans:0;widows:0\">    DBAC</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (B). <b>CBAD</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Part <b>C</b>    (\"the recent scientific study\") acts as the grammatical    subject of the sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Part <b>B</b>    (\"provided profound insights\") follows as the main verb    phrase describing the action of the subject.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Part <b>A</b>    (\"into the mechanisms of\") is a prepositional phrase    connected to the noun \"insights\" (\"insights into    something\").</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Part <b>D</b>    (\"cellular regeneration\") completes the prepositional    phrase as the object of \"of\".</p>    <p style=\"orphans:0;widows:0\">Formed sentence: <i>\"The    recent scientific study provided profound insights into the    mechanisms of cellular regeneration.\"</i></p>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct indirect form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">“<b>Disperse immediately,”    said the officer to the mob.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    The officer said to the mob that they disperse immediately.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The officer commanded the mob that to disperse immediately.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The officer ordered the mob to disperse immediately.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The officer asked the mob whether they would disperse immediately.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>C. The officer ordered the mob to    disperse immediately</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The given    sentence is an imperative sentence expressing an order.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Rules of    conversion from direct to indirect speech for imperative    sentences:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     reporting verb <b>‘said to’</b> changes to<b> ‘ordered’,     ‘commanded’</b>, etc., according to the sense of the     sentence.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     imperative mood is changed into the infinitive form by using ‘to     + verb’ (i.e., ‘to disperse’).</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, the correct indirect    speech is: <b>The officer ordered the mob to disperse immediately.</b></p>", "question_heading": ""}, {"sr_no": 100, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct active form of the given sentence.</p>    <p style=\"orphans:0;widows:0\"><b>The ancient manuscripts were    being carefully restored by the conservators when the fire alarm    rang</b>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The conservators carefully restored the ancient manuscripts when    the fire alarm rang.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The conservators had been carefully restoring the ancient    manuscripts when the fire alarm rang.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The conservators were carefully restoring the ancient manuscripts    when the fire alarm rang.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The conservators are carefully restoring the ancient manuscripts    when the fire alarm rang.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the past continuous passive voice.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive     structure: Object + was/were + being + V3 + by + Subject</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Active     structure: Subject + was/were + V-ing + Object</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Here,     'were being carefully restored' must change to 'were carefully     restoring', and 'the conservators' becomes the subject.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Thus, <b>option C is the correct    active form</b>.</p>", "question_heading": ""}, {"sr_no": 101, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct direct form of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">Rohan asked Amit if he would    share his notes with him.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Rohan said to Amit, “Will you share your notes with me?”</p>", "option2": " <p style=\"orphans:0;widows:0\">    Rohan said to Amit, “Would you share your notes with him?”</p>", "option3": " <p style=\"orphans:0;widows:0\">    Rohan asked to Amit, “Will you share your notes with me?”</p>", "option4": " <p style=\"orphans:0;widows:0\">    Rohan said to Amit, “Can you share his notes with me?”</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>(A). Rohan said to Amit, “Will you    share your notes with me?”</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The given    sentence is in indirect speech. To convert it into direct speech,    follow these rules:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     reporting verb 'asked' changes to 'said to'. Note that 'asked to'     is grammatically incorrect.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     conjunction 'if' is removed, and the sentence inside the     quotation marks takes the inverted interrogative form starting     with the modal auxiliary.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     modal auxiliary <b>'would'</b> changes back to <b>'will'</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     third-person pronouns 'he', 'his', and 'him' change to 'you',     'your', and 'me' respectively, matching the listener (Amit) and     speaker (Rohan).</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, the correct direct    speech is: <b>Rohan said to Amit, “Will you share your notes    with me?”</b></p>", "question_heading": ""}, {"sr_no": 102, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The following sentence has been divided into four parts.    Identify the part which contains a grammatical error. If there is    no error in the sentence, then select 'No Error'.</b></p>    <p style=\"orphans:0;widows:0\">When the missing child returned,    (A)/ the entire family (B)/ heaved a sigh for relief. (C)/ No    Error (D)</p>", "option1": "<p style=\"orphans:0;widows:0\">    A</p>", "option2": " <p style=\"orphans:0;widows:0\">    B</p>", "option3": " <p style=\"orphans:0;widows:0\">    D</p>", "option4": " <p style=\"orphans:0;widows:0\">    C</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The error lies in <b>part (C)</b> of the sentence.The correct    idiomatic phrase is <b>'a sigh of relief'</b> (meaning a feeling    of comfort after worry or fear has passed), not 'a sigh for    relief'. Therefore, the preposition <b>'for'</b> should be    replaced with <b>'of'</b>.</p>    <p style=\"orphans:0;widows:0\"><b>Correct Sentence:</b> \"When    the missing child returned, the entire family heaved a sigh <b>of</b>    relief.\"</p>", "question_heading": ""}, {"sr_no": 103, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct active form of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">Why was the meeting postponed by    the manager?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Why had the manager postponed the meeting?</p>", "option2": " <p style=\"orphans:0;widows:0\">    Why did the manager postpone the meeting?</p>", "option3": " <p style=\"orphans:0;widows:0\">    Why was the manager postponing the meeting?</p>", "option4": " <p style=\"orphans:0;widows:0\">    Why does the manager postpone the meeting?</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the passive voice of the simple past    tense (interrogative form).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Passive    Voice structure:</b> Wh-word + was/were + object + V3 + by +    subject?</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Active    Voice structure:</b> Wh-word + did + subject + V1 + object?</p>    <p style=\"orphans:0;widows:0\">Applying this rule, 'was the    meeting postponed by the manager' changes to 'did the manager    postpone the meeting'. Hence, <b>option B </b>is the correct    active form.</p>", "question_heading": ""}, {"sr_no": 104, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Given below are four jumbled sentences. Select the option that    gives their correct order.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A. European    craftsmen spent centuries trying to decipher the closely guarded    secret of Chinese porcelain.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B. This    breakthrough led directly to the establishment of Europe's first    porcelain manufactory at Meissen.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C. For a long    time, their efforts produced only soft-paste imitations that    lacked the durability and translucency of the original.</p>    <p style=\"orphans:0;widows:0\">D. The mystery was finally solved    in 1708 when German alchemist Johann Friedrich Böttger discovered    the essential ingredient, kaolin.</p>", "option1": "<p style=\"orphans:0;widows:0\">    ACDB</p>", "option2": " <p style=\"orphans:0;widows:0\">    CABD</p>", "option3": " <p style=\"orphans:0;widows:0\">    ADBC</p>", "option4": " <p style=\"orphans:0;widows:0\">    BCDA</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (A). <b>ACDB</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence     <b>A</b> introduces the main subject—the prolonged attempts by     European craftsmen to unlock the secret of Chinese porcelain.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence     <b>C</b> directly follows <b>A</b> by referring to \"their     efforts\" and describing the initial shortcomings of their     imitations.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence     <b>D</b> provides the resolution to the problem stated in A and C     (\"The mystery was finally solved in 1708...\").</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence     <b>B</b> concludes the paragraph, where the phrase \"This     breakthrough\" refers back to the discovery mentioned in <b>D</b>.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, the coherent sequence    is <b>ACDB</b>.</p>", "question_heading": ""}, {"sr_no": 105, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span style=\"font-size:11pt\"><b>Select    the most appropriate phrasal verb to fill in the blank.</b></span></span></p>    <p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\">The    rotten garbage dumped near the residential colony __________ an    unbearable stench that forced the residents to stay indoors.</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">gave    out</span
