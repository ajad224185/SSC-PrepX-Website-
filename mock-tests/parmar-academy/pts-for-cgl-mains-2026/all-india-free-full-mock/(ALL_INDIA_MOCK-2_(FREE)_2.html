, Q, R, S, T, U, V और W एक सीधी पंक्ति में उत्तर के सम्मुख बैठे हैं। T, W के बाईं ओर से तीसरे स्थान पर बैठा है, और उनमें से कोई भी किसी अंतिम छोर पर नहीं बैठा है। T और P के बीच केवल तीन व्यक्ति बैठे हैं, तथा P, R के निकटतम बाईं ओर बैठा है। S, W के निकटतम बाईं ओर बैठा है। Q, S के बाईं ओर से चौथे स्थान पर बैठा है। U, V के बाईं ओर कहीं बैठा है। U के दाईं ओर तीसरे स्थान पर कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>W</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>V</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माना बाईं से दाईं ओर की आठ स्थितियों को 1 से 8 तक क्रमांकित किया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. T, W के बाईं ओर तीसरे स्थान पर है और कोई भी छोर पर नहीं है। अतः (T, W) के संभावित युग्म (2, 5), (3, 6) या (4, 7) हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. S, W के ठीक बाईं ओर है और Q, S के बाईं ओर चौथे स्थान पर है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि W = 5, तो S = 4 होगा, जिससे Q स्थिति 0 पर आ जाएगा (जो संभव नहीं है)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि W = 7, तो S = 6, Q = 2 और T = 4 होगा। T और P के बीच तीन व्यक्ति हैं, तो P स्थिति 8 पर होगा (जिससे R के लिए उसके ठीक दाएँ कोई स्थान नहीं बचेगा) या स्थिति 0 पर (जो संभव नहीं है)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः W = 6, S = 5, T = 3 और Q = 1 होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. T (स्थिति 3) और P के बीच तीन व्यक्ति हैं, इसलिए P स्थिति 7 पर है। P के ठीक दाएँ R है, इसलिए R स्थिति 8 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. रिक्त स्थान 2 और 4 हैं। चूंकि U, V के बाईं ओर है, इसलिए U स्थिति 2 पर और V स्थिति 4 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बाएँ से दाएँ अंतिम व्यवस्था है: </span><span style=\"font-weight:bold\">Q, U, T, V, S, W, P, R</span><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U स्थिति 2 पर बैठा है। U के दाईं ओर तीसरे स्थान (स्थिति 2 + 3 = 5) पर </span><span style=\"font-weight:bold\">S</span><span> बैठा है।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">नीचे एक प्रश्न और उसके बाद दो कथन I और II दिए गए हैं। दोनों कथनों को ध्यानपूर्वक पढ़कर निर्णय कीजिए कि कौन-सा कथन प्रश्न का उत्तर देने के लिए पर्याप्त है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">छह व्यक्ति - A, B, C, D, E और F एक वृत्ताकार मेज के चारों ओर केंद्र के सम्मुख होकर बैठे हैं। C के विपरीत कौन बैठा है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(I) A, C के बाएँ से दूसरे स्थान पर बैठा है। E, A के निकटतम दाएँ बैठा है। E और B के बीच में केवल एक व्यक्ति बैठा है। B, C का निकटतम पड़ोसी नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(II) D, B के दाएँ से दूसरे स्थान पर बैठा है। F, D के निकटतम बाएँ बैठा है। C, B का निकटतम पड़ोसी नहीं है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन II में दी गई जानकारी अकेले प्रश्न का उत्तर देने के लिए पर्याप्त है जबकि कथन I में दी गई जानकारी पर्याप्त नहीं है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I में दी गई जानकारी अकेले प्रश्न का उत्तर देने के लिए पर्याप्त है जबकि कथन II में दी गई जानकारी पर्याप्त नहीं है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों में दी गई जानकारी मिलकर प्रश्न का उत्तर देने के लिए पर्याप्त नहीं है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों में दी गई जानकारी मिलकर प्रश्न का उत्तर देने के लिए पर्याप्त है।</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केंद्र के सम्मुख एक वृत्त में दक्षिणावर्त (clockwise) दिशा में 1 से 6 तक 6 स्थान मान लेते हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कथन I से:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. माना C स्थान 1 पर बैठा है। चूंकि सभी केंद्र के सम्मुख हैं, दक्षिणावर्त दिशा बाएँ की ओर होगी।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. A, C के बाएँ से दूसरे स्थान पर है, इसलिए A स्थान 3 पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. E, A के ठीक दाएँ (वामावर्त दिशा) है, इसलिए E स्थान 2 पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. E और B के बीच केवल एक व्यक्ति है। स्थान 2 से, B या तो स्थान 4 पर हो सकता है या स्थान 6 पर। चूंकि B, C (स्थान 1) का पड़ोसी नहीं है, इसलिए B स्थान 6 पर नहीं हो सकता। अतः B अवश्य ही स्थान 4 पर बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. 6 व्यक्तियों के घेरे में स्थान 1 के ठीक विपरीत स्थान 4 होता है। अतः C के विपरीत B बैठा है। इस प्रकार, कथन I अकेले पर्याप्त है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कथन II से:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. माना B स्थान 1 पर बैठा है। D, B के दाएँ से दूसरे स्थान पर है, इसलिए D स्थान 5 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. F, D के ठीक बाएँ है, इसलिए F स्थान 6 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. C, B का पड़ोसी नहीं है, इसलिए C स्थान 2 पर नहीं बैठ सकता। अतः C के लिए स्थान 3 या स्थान 4 संभावित हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. यदि C स्थान 3 पर है, तो उसके विपरीत F होगा; यदि C स्थान 4 पर है, तो उसके विपरीत B होगा। अतः निश्चित उत्तर नहीं मिल सकता। इस प्रकार, कथन II अकेले पर्याप्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, प्रश्न का उत्तर देने के लिए कथन I में दी गई जानकारी अकेले पर्याप्त है जबकि कथन II में दी गई जानकारी पर्याप्त नहीं है।</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक कक्षा में, वार्षिक परीक्षा उत्तीर्ण करने वाले विद्यार्थियों में, प्रिया शीर्ष से 15वें स्थान पर है और चेतन, जिसका स्थान प्रिया से नीचे है, नीचे से 29वें स्थान पर है। यदि प्रिया और चेतन के बीच 8 विद्यार्थी हैं, तथा परीक्षा उत्तीर्ण करने वाले और अनुत्तीर्ण होने वाले विद्यार्थियों का अनुपात 4 : 1 है, तो कक्षा में कुल कितने विद्यार्थी हैं, यदि 5 विद्यार्थी परीक्षा में सम्मिलित नहीं हुए थे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>65</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>70</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>72</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>68</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चरण 1: उत्तीर्ण विद्यार्थियों की संख्या ज्ञात कीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चूंकि प्रिया का स्थान चेतन से ऊपर है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उत्तीर्ण कुल विद्यार्थी = (प्रिया का शीर्ष से स्थान) + (उनके बीच के विद्यार्थी) + (चेतन का नीचे से स्थान)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image084.png\" width=\"142\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चरण 2: अनुत्तीर्ण विद्यार्थियों की संख्या ज्ञात कीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उत्तीर्ण और अनुत्तीर्ण विद्यार्थियों का अनुपात = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image085.png\" width=\"22\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अनुत्तीर्ण विद्यार्थियों की संख्या = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image086.png\" width=\"80\" height=\"29\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चरण 3: कक्षा में कुल विद्यार्थियों की संख्या ज्ञात कीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कुल विद्यार्थी = उत्तीर्ण + अनुत्तीर्ण + परीक्षा में सम्मिलित न होने वाले</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image087.png\" width=\"142\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct direct speech form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The employees asked if their    manager would approve their leave.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The employees said, \"Would our manager approve our leave?\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    The employees asked, \"If our manager will approve our leave?\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    The employees said, \"Will our manager approve our leave?\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    The employees said, \"Will their manager approved their    leave?\"</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert an indirect interrogative sentence into direct speech:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb 'asked' changes to 'said' followed by inverted commas.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    conjunction 'if' is removed, and the sentence changes into a    direct interrogative structure starting with the auxiliary verb.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Modal 'would'    changes back to 'will' in direct speech.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    third-person possessive pronoun 'their' changes to the    first-person 'our' to reflect the direct words of 'the employees'.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct direct    speech is: <b>The employees said, \"Will our manager approve    our leave?\"</b></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Rearrange the parts of the sentence in the correct order.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Despite    rigorous measures implemented by the central bank</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">P. thereby    undermining public confidence in monetary policy</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Q. to    stabilize the volatile currency,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R. and    triggering widespread demands for structural economic reforms.</p>    <p style=\"orphans:0;widows:0\">S. persistent inflationary    pressures continued to erode purchasing power,</p>", "option1": "<p style=\"orphans:0;widows:0\">    QSPR</p>", "option2": " <p style=\"orphans:0;widows:0\">    QPSR</p>", "option3": " <p style=\"orphans:0;widows:0\">    SQPR</p>", "option4": " <p style=\"orphans:0;widows:0\">    SPRQ</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sequence is <b>QSPR</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    sentence begins with the prepositional phrase: <i>\"Despite    rigorous measures implemented by the central bank...\"</i>.    The noun phrase 'measures implemented' naturally connects with the    infinitive phrase of purpose in <b>Q</b> (<i>\"to stabilize    the volatile currency,\"</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Following    the dependent concessive clause, the main clause must introduce    the subject and main verb, which is found in <b>S</b> (<i>\"persistent    inflationary pressures continued to erode purchasing power,\"</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Part <b>P</b>    (<i>\"thereby undermining public confidence in monetary    policy\"</i>) is a participial clause describing the    consequence of the eroding purchasing power.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Part <b>R</b>    (<i>\"and triggering widespread demands for structural    economic reforms.\"</i>) provides a parallel participial    phrase joined by the conjunction 'and' (undermining... and    triggering...).</p>    <p style=\"orphans:0;widows:0\">Hence, the coherent sentence is:    <i>\"Despite rigorous measures implemented by the central bank    to stabilize the volatile currency, persistent inflationary    pressures continued to erode purchasing power, thereby undermining    public confidence in monetary policy and triggering widespread    demands for structural economic reforms.\"</i></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that best expresses the meaning of the idiom    highlighted in bold in the given sentence.</p>    <p style=\"orphans:0;widows:0\">The young diplomat was warned    that speaking openly to the press about the covert negotiations    would be <b>sailing close to the wind</b>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Following established official protocol strictly</p>", "option2": " <p style=\"orphans:0;widows:0\">    Acting near the verge of what is safe, permissible, or legal</p>", "option3": " <p style=\"orphans:0;widows:0\">    Causing an accidental revelation without any intention</p>", "option4": " <p style=\"orphans:0;widows:0\">    Gaining an unfair advantage over rivals through deception</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The idiom <b>'sail close to the wind'</b> means to act right on    the edge of what is safe, legal, or socially acceptable, thereby    taking a serious risk.</p>    <p style=\"orphans:0;widows:0\">In the given context, the    diplomat is warned that speaking publicly about covert talks    borders on dangerous or prohibited behavior. Hence, option B    correctly captures this meaning.</p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate antonym of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Peripatetic</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Itinerant</p>", "option2": " <p style=\"orphans:0;widows:0\">    Wayfaring</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sedentary</p>", "option4": " <p style=\"orphans:0;widows:0\">    Nomadic</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>Peripatetic</b> means traveling from place to place,    in particular working or based in various places for relatively    short periods (wandering or nomadic).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Sedentary</b>    means staying in one place, seated, or not moving about, which is    the direct antonym.</p>    <p style=\"orphans:0;widows:0\">• <i>Itinerant</i>, <i>Wayfaring</i>,    and <i>Nomadic</i> are synonyms of peripatetic.</p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\">    Select the option with the <b>correct spelling</b> of the medical    instrument used to measure arterial blood pressure.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Sphigmomanometer</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sphygmomanometer</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sphygmamanometer</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sphygmonanometer</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The correctly spelt word is <b>Sphygmomanometer</b>. It is derived    from the Greek root <i>sphygmos</i> (meaning 'pulse') combined    with <i>manometer</i> (an instrument for measuring fluid    pressure). Hence, option B is correct.</p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a <b>one-word substitute</b>    for the given group of words.</p>    <p style=\"orphans:0;widows:0\">'A person who demands strict,    uncompromising adherence to rules and discipline'</p>", "option1": "<p style=\"orphans:0;widows:0\">    Martinet</p>", "option2": " <p style=\"orphans:0;widows:0\">    Dilettante</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sybarite</p>", "option4": " <p style=\"orphans:0;widows:0\">    Truant</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitute is <b>Martinet</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Martinet</b>:    A person who demands complete, strict obedience to regulations and    discipline.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Dilettante</b>:    A person who cultivates an area of interest (such as the arts)    superficially, without real knowledge or commitment.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sybarite</b>:    A person who is devoted to luxury and sensuous pleasure.</p>    <p style=\"orphans:0;widows:0\"><b>Truant</b>: A person    (especially a student) who stays away from school or duties    without permission.</p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate option to fill in the blank:</b></p>    <p style=\"orphans:0;widows:0\">Not until the team leader    intervened ________ to settle their mutual grievances amicably.</p>", "option1": "<p style=\"orphans:0;widows:0\">    were the members able</p>", "option2": " <p style=\"orphans:0;widows:0\">    the members were able</p>", "option3": " <p style=\"orphans:0;widows:0\">    did the members be able</p>", "option4": " <p style=\"orphans:0;widows:0\">    had the members been able</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>were the members able</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rule of    Inversion:</b> When a sentence begins with a negative or    restrictive time adverbial phrase such as <i>Not until...</i>,    <i>Only after...</i>, or <i>Only when...</i>, the main clause that    follows must undergo subject-verb inversion (Auxiliary / Linking    Verb + Subject + Main Verb/Complement).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    subordinate clause (<i>the team leader intervened</i>) retains    normal subject-verb order.</p>    <p style=\"orphans:0;widows:0\">2. The main clause requires    inversion. Since 'able' is an adjective, it requires the    past-tense linking verb 'were' rather than the do-support    auxiliary 'did'. Therefore, the inverted structure is <b>were</b>    (verb) + <b>the members</b> (subject) + <b>able</b> (adjective    complement).</p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Find the part of the sentence that contains an error:</b></p>    <p style=\"orphans:0;widows:0\">The reason why the international    delegation (1)/ cancelled the scheduled bilateral talks (2)/ was    because both nations failed to reach (3)/ a consensus on    territorial disputes. (4)</p>", "option1": "<p style=\"orphans:0;widows:0\">    (1)</p>", "option2": " <p style=\"orphans:0;widows:0\">    (2)</p>", "option3": " <p style=\"orphans:0;widows:0\">    (3)</p>", "option4": " <p style=\"orphans:0;widows:0\">    (4)</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The error lies in part (3) of the sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rule:</b>    The expression <i>'The reason why...'</i> must be followed by the    conjunction <b>'that'</b>, not <b>'because'</b>. Since <i>'The    reason why'</i> already indicates cause, using <i>'because'</i> is    redundant (superfluous).</p>    <p style=\"orphans:0;widows:0\">Therefore, replace <b>'was    because'</b> with <b>'was that'</b> to make the sentence    grammatically correct.</p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in indirect    speech.</p>    <p style=\"orphans:0;widows:0\">The manager said to him, “Why    are you leaving the office so early today?”</p>", "option1": "<p style=\"orphans:0;widows:0\">    The manager asked him why was he leaving the office so early that    day.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The manager asked him why he was leaving the office so early that    day.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The manager told him why he is leaving the office so early today.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The manager asked him that why he was leaving the office so early    that day.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct indirect speech form is: <b>The manager asked him why    he was leaving the office so early that day.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rules of    conversion:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    reporting verb <i>said to</i> changes to <i>asked</i> in an    interrogative sentence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. For 'Wh-'    questions, no conjunction like <i>that</i> or <i>if/whether</i> is    used; the question word (<i>why</i>) itself acts as the joining    word.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. The    interrogative structure is changed into an assertive structure    (Subject + Verb), so <i>why are you leaving</i> becomes <i>why he    was leaving</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Present    Continuous tense (<i>are leaving</i>) changes to Past Continuous    tense (<i>was leaving</i>).</p>    <p style=\"orphans:0;widows:0\">5. The time expression <i>today</i>    changes to <i>that day</i>.</p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the option that expresses the given sentence in passive    voice:</b></p>    <p style=\"orphans:0;widows:0\">The administration should not    have entertained such frivolous complaints.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Such frivolous complaints should not be entertained by the    administration.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Such frivolous complaints were not to be entertained by the    administration.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Such frivolous complaints should not have been entertained by the    administration.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Such frivolous complaints could not have been entertained by the    administration.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the active voice with a modal perfect    construction: <i>Subject + should not have + V3 (entertained) +    Object</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">To convert    this structure into the passive voice, the rule is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Object +    should not have been + V3 + (by + Subject)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Applying this    rule:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Active: The    administration (Subject) should not have entertained (verb) such    frivolous complaints (Object).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive: Such    frivolous complaints + should not have been + entertained + by the    administration.</p>    <p style=\"orphans:0;widows:0\">Hence, option C is the correct    passive form.</p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>A sentence is provided in indirect speech. From the four given    options, choose the one that most accurately conveys the sentence    in its corresponding direct speech.</b></p>    <p style=\"orphans:0;widows:0\">Rohan said that had he left on    time, he would have caught the train.</p>", "option1": "<p style=\"orphans:0;widows:0\">Had I left on time, I would catch the train,” said Rohan.</p>", "option2": " <p style=\"orphans:0;widows:0\">If I leave on time, I will catch the train,” said Rohan.</p>", "option3": " <p style=\"orphans:0;widows:0\">Had I left on time, I would have caught the train,” said    Rohan.</p>", "option4": " <p style=\"orphans:0;widows:0\">If only I had left on time, I might catch the train,” said    Rohan.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The given sentence in indirect speech contains an unreal past    conditional structure (third conditional with inversion: <i>Had +    subject + V3 ..., subject + would have + V3</i>). When converting    such third conditional sentences into direct speech, the verb    forms and modal combinations remain unchanged; only the    third-person pronoun referring back to the speaker ('he') shifts    to the first-person pronoun ('I'). Therefore, the correct direct    speech is: <b>“Had I left on time, I would have caught the    train,” said Rohan.</b></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the passage carefully and answer the questions that follow.    Julian was articulate and kind-hearted, but possessed little    savings and no established academic standing. He wished to    undertake a prestigious overseas fellowship, yet his mentor    insisted that Julian must first demonstrate genuine selflessness    beyond mere intellectual ambition. One evening, Julian visited an    antiquarian bookshop run by an eccentric collector who was    evaluating a collection of manuscripts. Near the door stood a    frail, dishevelled traveller clutching a battered, water-damaged    journal. The man appeared so worn and wretched from the freezing    rain that Julian felt immediate sympathy for him. Overhearing the    shopkeeper turn the wanderer away without a coin, Julian searched    his coat and drew out his last remaining silver coins. Although he    could scarcely afford to surrender the rent money he desperately    required, he placed the coins into the stranger's hand and    accepted the ruined journal. The old man thanked him with    dignified warmth. The next day, the shopkeeper informed Julian    that the destitute traveller was actually Master Vance, one of the    most prominent scholars and benefactors in the field. Vance had    deliberately wandered in rags to observe how young scholars    treated the vulnerable. Julian was deeply embarrassed. He imagined    that the distinguished master would laugh at his naive attempt to    offer charity. By midday, however, an envoy arrived bearing an    official letter from the fellowship board. It awarded Julian the    research post, accompanied by a personal note from \"an old    traveller.\" The episode reveals that true virtue is defined    not by erudition, but by sacrifice. Julian gave away his only    means of comfort without seeking acclaim, and Vance honoured a    kindness born of unvarnished empathy.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">Why did the mentor hesitate to    approve Julian’s fellowship recommendation?</p>", "option1": "<p style=\"orphans:0;widows:0\">    He doubted Julian’s ability to handle challenging archival work    abroad.</p>", "option2": " <p style=\"orphans:0;widows:0\">    He disliked Julian’s habit of spending time in antiquarian    bookshops.</p>", "option3": " <p style=\"orphans:0;widows:0\">    He expected Julian to demonstrate genuine selflessness beyond    scholarly ambition.</p>", "option4": " <p style=\"orphans:0;widows:0\">    He believed Julian lacked sufficient dedication to ancient    manuscripts.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage explicitly states that Julian's mentor \"insisted    that Julian must first demonstrate genuine selflessness beyond    mere intellectual ambition.\" Hence, Option C is the correct    answer.</p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the passage carefully and answer the questions that follow.    Julian was articulate and kind-hearted, but possessed little    savings and no established academic standing. He wished to    undertake a prestigious overseas fellowship, yet his mentor    insisted that Julian must first demonstrate genuine selflessness    beyond mere intellectual ambition. One evening, Julian visited an    antiquarian bookshop run by an eccentric collector who was    evaluating a collection of manuscripts. Near the door stood a    frail, dishevelled traveller clutching a battered, water-damaged    journal. The man appeared so worn and wretched from the freezing    rain that Julian felt immediate sympathy for him. Overhearing the    shopkeeper turn the wanderer away without a coin, Julian searched    his coat and drew out his last remaining silver coins. Although he    could scarcely afford to surrender the rent money he desperately    required, he placed the coins into the stranger's hand and    accepted the ruined journal. The old man thanked him with    dignified warmth. The next day, the shopkeeper informed Julian    that the destitute traveller was actually Master Vance, one of the    most prominent scholars and benefactors in the field. Vance had    deliberately wandered in rags to observe how young scholars    treated the vulnerable. Julian was deeply embarrassed. He imagined    that the distinguished master would laugh at his naive attempt to    offer charity. By midday, however, an envoy arrived bearing an    official letter from the fellowship board. It awarded Julian the    research post, accompanied by a personal note from \"an old    traveller.\" The episode reveals that true virtue is defined    not by erudition, but by sacrifice. Julian gave away his only    means of comfort without seeking acclaim, and Vance honoured a    kindness born of unvarnished empathy.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">What prompted Julian to give his    remaining coins to the elderly traveller?</p>", "option1": "<p style=\"orphans:0;widows:0\">    The traveller’s apparent misery immediately awakened Julian’s    compassion.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The traveller’s dignified bearing suggested that the notebook    was valuable.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The shopkeeper had urged Julian to assist the man in selling his    belongings.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The traveller’s persistent pleading made Julian feel obligated    to intervene.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage states that \"The man appeared so worn and    wretched from the freezing rain that Julian felt immediate    sympathy for him,\" which caused Julian to hand over his last    coins. Therefore, Option A is correct.</p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the passage carefully and answer the questions that follow.    Julian was articulate and kind-hearted, but possessed little    savings and no established academic standing. He wished to    undertake a prestigious overseas fellowship, yet his mentor    insisted that Julian must first demonstrate genuine selflessness    beyond mere intellectual ambition. One evening, Julian visited an    antiquarian bookshop run by an eccentric collector who was    evaluating a collection of manuscripts. Near the door stood a    frail, dishevelled traveller clutching a battered, water-damaged    journal. The man appeared so worn and wretched from the freezing    rain that Julian felt immediate sympathy for him. Overhearing the    shopkeeper turn the wanderer away without a coin, Julian searched    his coat and drew out his last remaining silver coins. Although he    could scarcely afford to surrender the rent money he desperately    required, he placed the coins into the stranger's hand and    accepted the ruined journal. The old man thanked him with    dignified warmth. The next day, the shopkeeper informed Julian    that the destitute traveller was actually Master Vance, one of the    most prominent scholars and benefactors in the field. Vance had    deliberately wandered in rags to observe how young scholars    treated the vulnerable. Julian was deeply embarrassed. He imagined    that the distinguished master would laugh at his naive attempt to    offer charity. By midday, however, an envoy arrived bearing an    official letter from the fellowship board. It awarded Julian the    research post, accompanied by a personal note from \"an old    traveller.\" The episode reveals that true virtue is defined    not by erudition, but by sacrifice. Julian gave away his only    means of comfort without seeking acclaim, and Vance honoured a    kindness born of unvarnished empathy.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">Why did Julian feel embarrassed    after learning the traveller’s true identity?</p>", "option1": "<p style=\"orphans:0;widows:0\">    He feared the shopkeeper would accuse him of meddling in store    business.</p>", "option2": " <p style=\"orphans:0;widows:0\">    He realised his mentor might learn about his irresponsible    spending.</p>", "option3": " <p style=\"orphans:0;widows:0\">    He regretted parting with the funds he urgently needed for his own    rent.</p>", "option4": " <p style=\"orphans:0;widows:0\">    He thought the esteemed scholar might ridicule his naive attempt    at charity.</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    According to the passage, upon discovering the traveller was    Master Vance, Julian \"imagined that the distinguished master    would laugh at his naive attempt to offer charity.\" Thus,    Option D is the correct choice.</p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the passage carefully and answer the questions that follow.    Julian was articulate and kind-hearted, but possessed little    savings and no established academic standing. He wished to    undertake a prestigious overseas fellowship, yet his mentor    insisted that Julian must first demonstrate genuine selflessness    beyond mere intellectual ambition. One evening, Julian visited an    antiquarian bookshop run by an eccentric collector who was    evaluating a collection of manuscripts. Near the door stood a    frail, dishevelled traveller clutching a battered, water-damaged    journal. The man appeared so worn and wretched from the freezing    rain that Julian felt immediate sympathy for him. Overhearing the    shopkeeper turn the wanderer away without a coin, Julian searched    his coat and drew out his last remaining silver coins. Although he    could scarcely afford to surrender the rent money he desperately    required, he placed the coins into the stranger's hand and    accepted the ruined journal. The old man thanked him with    dignified warmth. The next day, the shopkeeper informed Julian    that the destitute traveller was actually Master Vance, one of the    most prominent scholars and benefactors in the field. Vance had    deliberately wandered in rags to observe how young scholars    treated the vulnerable. Julian was deeply embarrassed. He imagined    that the distinguished master would laugh at his naive attempt to    offer charity. By midday, however, an envoy arrived bearing an    official letter from the fellowship board. It awarded Julian the    research post, accompanied by a personal note from \"an old    traveller.\" The episode reveals that true virtue is defined    not by erudition, but by sacrifice. Julian gave away his only    means of comfort without seeking acclaim, and Vance honoured a    kindness born of unvarnished empathy.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">What made Julian’s gesture    especially meaningful to Master Vance?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Julian offered it despite knowing that Vance was testing    applicants.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Julian intended it to earn a favourable reference from the    shopkeeper.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Julian gave it sincerely while believing the recipient was    destitute.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Julian expected the recipient to return the money once he found    shelter.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage highlights that Vance honoured a kindness \"born    of unvarnished empathy,\" given without seeking acclaim and    under the assumption that the traveller was genuinely helpless.    Hence, Option C is correct.</p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the passage carefully and answer the questions that follow.    Julian was articulate and kind-hearted, but possessed little    savings and no established academic standing. He wished to    undertake a prestigious overseas fellowship, yet his mentor    insisted that Julian must first demonstrate genuine selflessness    beyond mere intellectual ambition. One evening, Julian visited an    antiquarian bookshop run by an eccentric collector who was    evaluating a collection of manuscripts. Near the door stood a    frail, dishevelled traveller clutching a battered, water-damaged    journal. The man appeared so worn and wretched from the freezing    rain that Julian felt immediate sympathy for him. Overhearing the    shopkeeper turn the wanderer away without a coin, Julian searched    his coat and drew out his last remaining silver coins. Although he    could scarcely afford to surrender the rent money he desperately    required, he placed the coins into the stranger's hand and    accepted the ruined journal. The old man thanked him with    dignified warmth. The next day, the shopkeeper informed Julian    that the destitute traveller was actually Master Vance, one of the    most prominent scholars and benefactors in the field. Vance had    deliberately wandered in rags to observe how young scholars    treated the vulnerable. Julian was deeply embarrassed. He imagined    that the distinguished master would laugh at his naive attempt to    offer charity. By midday, however, an envoy arrived bearing an    official letter from the fellowship board. It awarded Julian the    research post, accompanied by a personal note from \"an old    traveller.\" The episode reveals that true virtue is defined    not by erudition, but by sacrifice. Julian gave away his only    means of comfort without seeking acclaim, and Vance honoured a    kindness born of unvarnished empathy.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">Which inference best explains the    contrast between Julian’s silver coins and Master Vance’s    fellowship offer?</p>", "option1": "<p style=\"orphans:0;widows:0\">    The coins represent financial carelessness, whereas the offer    represents calculated patronage.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The coins are spent in ignorance, whereas the offer is made to    display Vance’s influence.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The coins expose Julian’s poor judgment, whereas the offer    corrects his misunderstanding.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The coins reveal generosity through sacrifice, whereas the offer    recognises that moral quality.</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Julian sacrificed his essential living expenses to aid a stranger    without expecting anything, while Vance's fellowship award served    to acknowledge and reward that selfless character. Thus, Option D    is the correct interpretation.</p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Rearrange the parts of the sentence in the correct order.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In a major    advancement for clean energy,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">P. promising    a significant reduction in global carbon emissions,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Q.    researchers at the national laboratory developed a highly    efficient solar cell,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R. capable of    generating electricity even under low-light conditions,</p>    <p style=\"orphans:0;widows:0\">S. although commercial production    on a large scale remains a future challenge.</p>", "option1": "<p style=\"orphans:0;widows:0\">    QSRP</p>", "option2": " <p style=\"orphans:0;widows:0\">    QRPS</p>", "option3": " <p style=\"orphans:0;widows:0\">    RQPS</p>", "option4": " <p style=\"orphans:0;widows:0\">    PSQR</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct order is <b>QRPS</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Following    the introductory prepositional phrase (\"In a major    advancement for clean energy,\"), the sentence requires a    subject and a finite verb. Part <b>Q</b> supplies this main    clause: \"researchers at the national laboratory developed a    highly efficient solar cell\".</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Part <b>R</b>    functions as an adjective phrase directly modifying the noun    \"solar cell\" (\"capable of generating electricity    even under low-light conditions\").</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Part <b>P</b>    is a participial clause indicating the outcome or implication of    this development (\"promising a significant reduction in    global carbon emissions\").</p>    <p style=\"orphans:0;widows:0\">- Part <b>S</b> concludes the    sentence logically by introducing a contrasting reservation with    the conjunction \"although\".</p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate synonym of the given word: <b>LACONIC</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Verbose</p>", "option2": " <p style=\"orphans:0;widows:0\">    Terse</p>", "option3": " <p style=\"orphans:0;widows:0\">    Frugal</p>", "option4": " <p style=\"orphans:0;widows:0\">    Jovial</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct synonym of '<b>LACONIC</b>' is '<b>Terse</b>'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Laconic</b>    means using very few words to express what is meant (brief,    concise).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Terse</b>    means sparing in the use of words; concise and to the point.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Verbose</b>    means using or expressed in more words than are needed (an    antonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Frugal</b>    means sparing or economical with regard to money or food.</p>    <p style=\"orphans:0;widows:0\">• <b>Jovial</b> means cheerful    and friendly.</p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct passive form of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">Why had the committee not    disposed of all the pending complaints before the deadline?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Why had all the pending complaints not been disposed off by the    committee before the deadline?</p>", "option2": " <p style=\"orphans:0;widows:0\">    Why had all the pending complaints not been disposed of by the    committee before the deadline?</p>", "option3": " <p style=\"orphans:0;widows:0\">    Why were all the pending complaints not disposed of by the    committee before the deadline?</p>", "option4": " <p style=\"orphans:0;widows:0\">    Why had all the pending complaints not been disposed by the    committee before the deadline?</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct passive voice structure for a past perfect    interrogative-negative sentence is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Wh-word +    had + new subject + not + been + past participle (V3) +    preposition + by + agent + other complements?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Key rules to    note:The tense is Past Perfect ('had not disposed of'), which    changes to 'had not been disposed of' in the passive voice (ruling    out option C, which changes the tense to simple past).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Phrasal verbs    must retain their original prepositions. The correct expression is    'dispose of' (meaning to settle or deal with), not 'dispose off'    (ruling out option A).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    preposition 'of' cannot be omitted (ruling out option D).</p>    <p style=\"orphans:0;widows:0\">Therefore, option B correctly    follows all grammatical rules.</p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Sentences of a paragraph are given below in jumbled order. Arrange    the sentences in the correct order to form a meaningful and    coherent paragraph.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A. The    company had initially promised an error-free software update.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B.    Consequently, thousands of frustrated users demanded a full    refund.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C. However,    severe glitches caused widespread system crashes immediately after    the release.</p>    <p style=\"orphans:0;widows:0\">D. Tech forums were soon flooded    with screenshots of the malfunctioning devices.</p>", "option1": "<p style=\"orphans:0;widows:0\">    ACDB</p>", "option2": " <p style=\"orphans:0;widows:0\">    CADB</p>", "option3": " <p style=\"orphans:0;widows:0\">    BDAC</p>", "option4": " <p style=\"orphans:0;widows:0\">    ABDC</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct order is <b>ACDB</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Sentence <b>A</b>    introduces the topic with the company's initial promise about the    software update.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Sentence <b>C</b>    provides a contrasting turn of events ('However') where severe    glitches occurred right after the release.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Sentence <b>D</b>    elaborates on the immediate public reaction on online platforms    showing evidence of the failure.</p>    <p style=\"orphans:0;widows:0\">- Sentence <b>B</b> concludes the    sequence with the final outcome ('Consequently'), stating that    users demanded refunds.</p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct direct form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The mentor said that she ought to    have prepared thoroughly for the interview.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The mentor said, \"She ought to have prepared thoroughly for    the interview.\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    The mentor said, \"She should prepare thoroughly for the    interview.\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    The mentor said, \"She ought to prepare thoroughly for the    interview.\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    The mentor said, \"She must have prepared thoroughly for the    interview.\"</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Modals like 'ought to', 'ought to have + V3', 'might', 'should',    and 'would' do not change their form when converting between    direct and indirect speech. Since the indirect speech uses the    modal perfect structure 'ought to have prepared' without any shift    in tense or modal auxiliary, the direct speech retains the exact    same construction inside the quotation marks. Hence, the correct    direct sentence is: The mentor said, \"She ought to have    prepared thoroughly for the interview.\"</p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The sentence given below is divided into four segments labelled P,    Q, R, and S. Read the sentence carefully to determine which    segment contains a grammatical, syntactic, or idiomatic error.    Select the letter corresponding to that specific segment as your    answer. (Note: Every sentence contains exactly one error. Ignore    errors of punctuation, if any.)</p>    <p style=\"orphans:0;widows:0\">(P) Following a comprehensive    inquiry conducted by the vigilance department, / (Q) the senior    procurement officer was eventually charged of misappropriating    public funds / (R) allocated for the construction of rural health    centers across the state, / (S) leading to his immediate    suspension and forfeiture of benefits.</p>", "option1": "<p style=\"orphans:0;widows:0\">    P</p>", "option2": " <p style=\"orphans:0;widows:0\">    Q</p>", "option3": " <p style=\"orphans:0;widows:0\">    R</p>", "option4": " <p style=\"orphans:0;widows:0\">    S</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The error lies in segment (Q). The verb 'charged' takes the    preposition 'with' when referring to an accusation of a crime or    offense (i.e., 'charged with something'). In contrast, 'of' is    conventionally paired with 'accused' ('accused of something').    Therefore, 'charged of' should be replaced with 'charged with' to    make the sentence grammatically correct.</p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the sentence thoroughly, with special attention to the    underlined segment. Choose the most appropriate substitution from    the given options. If the sentence is fine as it is, select 'No    improvement required'.</p>    <p style=\"orphans:0;widows:0\">Despite announcing extensive    welfare schemes, the local authorities <u>have been depriving    marginalized communities of basic subsidies</u> for nearly a    decade.</p>", "option1": "<p style=\"orphans:0;widows:0\">    has been depriving marginalized communities from basic subsidies</p>", "option2"
