ve_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage highlights that public reporting tends to oversimplify    multifaceted ecological challenges into simplistic narratives. The    phrase 'reduces [something] into [something simplistic]'    appropriately conveys this meaning. 'Elevates', 'amplifies', and    'diversifies' do not fit the context of oversimplification.</p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the given sentence carefully and select the most appropriate    option to substitute the underlined segment. If no improvement is    required, select 'No improvement required'.</p>    <p style=\"orphans:0;widows:0\">The municipal corporation faced    immense public backlash after the torrential rain <u>had flooded    the lower suburbs and paralyze the transport network</u>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    flooded the lower suburbs and paralyzed the transport network</p>", "option2": " <p style=\"orphans:0;widows:0\">    had flood the lower suburbs and paralyzed the transport network</p>", "option3": " <p style=\"orphans:0;widows:0\">    flooding the lower suburbs and paralyze the transport network</p>", "option4": " <p style=\"orphans:0;widows:0\">    No improvement required</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct substitution is <b>'flooded the lower suburbs and    paralyzed the transport network'</b>.</p>    <p style=\"orphans:0;widows:0\"><b>Reason:</b> In the given    sentence, two actions are connected by the coordinating    conjunction 'and'. According to the rule of parallelism, verbs    linked by coordinating conjunctions must maintain the same    grammatical form and tense. The original sentence incorrectly    pairs the past participle 'flooded' with the base form 'paralyze'.    In option A, both verbs ('flooded' and 'paralyzed') are correctly    placed in the simple past tense (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794108312480_html_74ddc79ca48662e3.gif\" > ),    maintaining proper parallel structure and consistency with the    main clause verb 'faced'.</p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct active form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">A loud noise was heard in the    basement at midnight.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Someone heard a loud noise in the basement at midnight.</p>", "option2": " <p style=\"orphans:0;widows:0\">    A loud noise heard someone in the basement at midnight.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The neighbors have heard a loud noise in the basement at midnight.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Someone was hearing a loud noise in the basement at midnight.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the passive voice in the simple past    tense (was + V3: <i>was heard</i>), and the agent of the action is    omitted. When converting such passive sentences into the active    voice, an indefinite pronoun such as 'someone' is introduced as    the subject.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Structure of    Simple Past Active Voice: <b>Subject + V2 + Object</b>.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct active    form is: <i>Someone heard a loud noise in the basement at    midnight.</i></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the following passage carefully and answer the questions that    follow.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In the grand    courtyard of the royal palace, mounted upon a pedestal of white    marble, stood an intricate mechanical clock. The clock was housed    in an ornate tower of carved ebony, adorned with delicate gilded    filigree. At its centre, a miniature knight in polished brass    struck the passing hours upon a silver bell. The courtiers and    visitors greatly admired the marvellous invention. “It keeps    time with the exactness of the stars,” observed the Chief    Astrologer, who wished to be celebrated for his scientific acumen.    “Nevertheless, it has no soul,” he added hastily, fearing that    his peers might accuse him of idolatry. A strict governess pointed    towards the silent clock and said to a restless young prince, who    was fretting over his Latin grammar, “Why can’t you behave    like the brass knight? The knight never complains about his duty.”    “How enviable to possess such tireless constancy,” sighed an    exhausted clerk as he hurried past with a towering bundle of    ledgers. The cathedral choirboys, dressed in dark cassocks with    stiff white ruffs, stopped to examine the clock after morning    service. “The brass knight looks just like Saint George    conquering the dragon,” one boy remarked with wide eyes. “What    foolishness!” snapped the Schoolmaster, striking his cane    against the flagstones. “You are comparing a heap of springs and    wheels to a blessed martyr!” The Schoolmaster scowled because he    disapproved of equating earthly machinery with sacred mysteries.    Late that evening, an apprentice horologist lingered in the quiet    courtyard. His companions had already departed for the tavern to    celebrate the harvest festival, but he had remained behind because    he was fascinated by a delicate silver bird hidden within the    clockwork. He had noticed an irregular flutter in its tiny    escapement earlier that day while oiling the gears and could not    rest until he had deciphered its movement.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">Why did the Chief Astrologer add    that the mechanical clock had “no soul”?</p>", "option1": "<p style=\"orphans:0;widows:0\">    He feared that his peers might accuse him of idolatry.</p>", "option2": " <p style=\"orphans:0;widows:0\">    He believed that public clocks should serve only a scientific    purpose.</p>", "option3": " <p style=\"orphans:0;widows:0\">    He considered the clock less accurate than natural planetary    movements.</p>", "option4": " <p style=\"orphans:0;widows:0\">    He wanted the device to be dismantled and moved out of the    courtyard.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage explicitly states that the Chief Astrologer added the    remark \"hastily, fearing that his peers might accuse him of    idolatry.\" Therefore, option A is the correct answer.</p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the following passage carefully and answer the questions that    follow.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In the grand    courtyard of the royal palace, mounted upon a pedestal of white    marble, stood an intricate mechanical clock. The clock was housed    in an ornate tower of carved ebony, adorned with delicate gilded    filigree. At its centre, a miniature knight in polished brass    struck the passing hours upon a silver bell. The courtiers and    visitors greatly admired the marvellous invention. “It keeps    time with the exactness of the stars,” observed the Chief    Astrologer, who wished to be celebrated for his scientific acumen.    “Nevertheless, it has no soul,” he added hastily, fearing that    his peers might accuse him of idolatry. A strict governess pointed    towards the silent clock and said to a restless young prince, who    was fretting over his Latin grammar, “Why can’t you behave    like the brass knight? The knight never complains about his duty.”    “How enviable to possess such tireless constancy,” sighed an    exhausted clerk as he hurried past with a towering bundle of    ledgers. The cathedral choirboys, dressed in dark cassocks with    stiff white ruffs, stopped to examine the clock after morning    service. “The brass knight looks just like Saint George    conquering the dragon,” one boy remarked with wide eyes. “What    foolishness!” snapped the Schoolmaster, striking his cane    against the flagstones. “You are comparing a heap of springs and    wheels to a blessed martyr!” The Schoolmaster scowled because he    disapproved of equating earthly machinery with sacred mysteries.    Late that evening, an apprentice horologist lingered in the quiet    courtyard. His companions had already departed for the tavern to    celebrate the harvest festival, but he had remained behind because    he was fascinated by a delicate silver bird hidden within the    clockwork. He had noticed an irregular flutter in its tiny    escapement earlier that day while oiling the gears and could not    rest until he had deciphered its movement.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">What does the exhausted clerk’s    remark about the brass knight reveal?</p>", "option1": "<p style=\"orphans:0;widows:0\">    He believed that the knight had overcome severe mechanical    failure.</p>", "option2": " <p style=\"orphans:0;widows:0\">    He wished to acquire the precious brass and silver from which the    clock was constructed.</p>", "option3": " <p style=\"orphans:0;widows:0\">    He saw in the knight an unwavering diligence that was absent from    his own weary state.</p>", "option4": " <p style=\"orphans:0;widows:0\">    He doubted whether true dedication could exist anywhere within the    royal court.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The exhausted clerk remarks, \"How enviable to possess such    tireless constancy,\" as he hurries past carrying a heavy load    of work. This indicates that he perceives in the tireless    clockwork figure an enduring constancy and relief from fatigue    that he lacks in his own exhausting life. Hence, option C is    correct.</p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the following passage carefully and answer the questions that    follow.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In the grand    courtyard of the royal palace, mounted upon a pedestal of white    marble, stood an intricate mechanical clock. The clock was housed    in an ornate tower of carved ebony, adorned with delicate gilded    filigree. At its centre, a miniature knight in polished brass    struck the passing hours upon a silver bell. The courtiers and    visitors greatly admired the marvellous invention. “It keeps    time with the exactness of the stars,” observed the Chief    Astrologer, who wished to be celebrated for his scientific acumen.    “Nevertheless, it has no soul,” he added hastily, fearing that    his peers might accuse him of idolatry. A strict governess pointed    towards the silent clock and said to a restless young prince, who    was fretting over his Latin grammar, “Why can’t you behave    like the brass knight? The knight never complains about his duty.”    “How enviable to possess such tireless constancy,” sighed an    exhausted clerk as he hurried past with a towering bundle of    ledgers. The cathedral choirboys, dressed in dark cassocks with    stiff white ruffs, stopped to examine the clock after morning    service. “The brass knight looks just like Saint George    conquering the dragon,” one boy remarked with wide eyes. “What    foolishness!” snapped the Schoolmaster, striking his cane    against the flagstones. “You are comparing a heap of springs and    wheels to a blessed martyr!” The Schoolmaster scowled because he    disapproved of equating earthly machinery with sacred mysteries.    Late that evening, an apprentice horologist lingered in the quiet    courtyard. His companions had already departed for the tavern to    celebrate the harvest festival, but he had remained behind because    he was fascinated by a delicate silver bird hidden within the    clockwork. He had noticed an irregular flutter in its tiny    escapement earlier that day while oiling the gears and could not    rest until he had deciphered its movement.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">Why did the Schoolmaster scowl at    the choirboy’s comparison?</p>", "option1": "<p style=\"orphans:0;widows:0\">    He thought that the boy had neglected his morning prayers at the    cathedral.</p>", "option2": " <p style=\"orphans:0;widows:0\">    He believed that the boy was intentionally mocking the royal    clockmaker.</p>", "option3": " <p style=\"orphans:0;widows:0\">    He suspected that the choirboys were inventing excuses to avoid    their studies.</p>", "option4": " <p style=\"orphans:0;widows:0\">    He disapproved of equating earthly machinery with sacred    mysteries.</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage directly mentions: \"The Schoolmaster scowled    because he disapproved of equating earthly machinery with sacred    mysteries.\" Therefore, option D is the correct choice.</p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the following passage carefully and answer the questions that    follow.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In the grand    courtyard of the royal palace, mounted upon a pedestal of white    marble, stood an intricate mechanical clock. The clock was housed    in an ornate tower of carved ebony, adorned with delicate gilded    filigree. At its centre, a miniature knight in polished brass    struck the passing hours upon a silver bell. The courtiers and    visitors greatly admired the marvellous invention. “It keeps    time with the exactness of the stars,” observed the Chief    Astrologer, who wished to be celebrated for his scientific acumen.    “Nevertheless, it has no soul,” he added hastily, fearing that    his peers might accuse him of idolatry. A strict governess pointed    towards the silent clock and said to a restless young prince, who    was fretting over his Latin grammar, “Why can’t you behave    like the brass knight? The knight never complains about his duty.”    “How enviable to possess such tireless constancy,” sighed an    exhausted clerk as he hurried past with a towering bundle of    ledgers. The cathedral choirboys, dressed in dark cassocks with    stiff white ruffs, stopped to examine the clock after morning    service. “The brass knight looks just like Saint George    conquering the dragon,” one boy remarked with wide eyes. “What    foolishness!” snapped the Schoolmaster, striking his cane    against the flagstones. “You are comparing a heap of springs and    wheels to a blessed martyr!” The Schoolmaster scowled because he    disapproved of equating earthly machinery with sacred mysteries.    Late that evening, an apprentice horologist lingered in the quiet    courtyard. His companions had already departed for the tavern to    celebrate the harvest festival, but he had remained behind because    he was fascinated by a delicate silver bird hidden within the    clockwork. He had noticed an irregular flutter in its tiny    escapement earlier that day while oiling the gears and could not    rest until he had deciphered its movement.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">Which of the following best    describes the irony in the governess’s statement to the young    prince?</p>", "option1": "<p style=\"orphans:0;widows:0\">    She expects a young child to comprehend the technical workings of    an intricate machine.</p>", "option2": " <p style=\"orphans:0;widows:0\">    She holds up an unthinking, inanimate mechanism as a model of    human patience and duty.</p>", "option3": " <p style=\"orphans:0;widows:0\">    She praises the knight’s obedience while ignoring the royal    status of the young prince.</p>", "option4": " <p style=\"orphans:0;widows:0\">    She scolds the boy for fretting while she herself is acting with    visible impatience.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The governess tells the prince to behave like the brass knight    because \"the knight never complains about his duty.\" The    irony lies in the fact that she expects a human child to emulate    the compliance of an unfeeling, inanimate machine that has no    consciousness or choice. Thus, option B is correct.</p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Read the following passage carefully and answer the questions    that follow.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In the grand    courtyard of the royal palace, mounted upon a pedestal of white    marble, stood an intricate mechanical clock. The clock was housed    in an ornate tower of carved ebony, adorned with delicate gilded    filigree. At its centre, a miniature knight in polished brass    struck the passing hours upon a silver bell. The courtiers and    visitors greatly admired the marvellous invention. “It keeps    time with the exactness of the stars,” observed the Chief    Astrologer, who wished to be celebrated for his scientific acumen.    “Nevertheless, it has no soul,” he added hastily, fearing that    his peers might accuse him of idolatry. A strict governess pointed    towards the silent clock and said to a restless young prince, who    was fretting over his Latin grammar, “Why can’t you behave    like the brass knight? The knight never complains about his duty.”    “How enviable to possess such tireless constancy,” sighed an    exhausted clerk as he hurried past with a towering bundle of    ledgers. The cathedral choirboys, dressed in dark cassocks with    stiff white ruffs, stopped to examine the clock after morning    service. “The brass knight looks just like Saint George    conquering the dragon,” one boy remarked with wide eyes. “What    foolishness!” snapped the Schoolmaster, striking his cane    against the flagstones. “You are comparing a heap of springs and    wheels to a blessed martyr!” The Schoolmaster scowled because he    disapproved of equating earthly machinery with sacred mysteries.    Late that evening, an apprentice horologist lingered in the quiet    courtyard. His companions had already departed for the tavern to    celebrate the harvest festival, but he had remained behind because    he was fascinated by a delicate silver bird hidden within the    clockwork. He had noticed an irregular flutter in its tiny    escapement earlier that day while oiling the gears and could not    rest until he had deciphered its movement.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\">Which inference can most    reasonably be drawn from the apprentice’s decision to remain    behind?</p>", "option1": "<p style=\"orphans:0;widows:0\">    He had been ordered by the master clockmaker to complete    additional chores as a punishment.</p>", "option2": " <p style=\"orphans:0;widows:0\">    He intended to leave his apprenticeship permanently because he    despised festive gatherings.</p>", "option3": " <p style=\"orphans:0;widows:0\">    His lack of money prevented him from joining his fellow    apprentices at the tavern.</p>", "option4": " <p style=\"orphans:0;widows:0\">    His intense intellectual curiosity led him to postpone taking part    in the evening’s festivities.</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage states that the apprentice stayed behind because \"he    was fascinated by a delicate silver bird hidden within the    clockwork\" and \"could not rest until he had deciphered    its movement.\" This shows that his curiosity and dedication    to understanding the mechanism caused him to forego the harvest    celebration with his peers. Therefore, option D is the correct    inference.</p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate phrasal verb to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">The management decided to ______    the outdated attendance system and adopt a more flexible digital    platform.</p>", "option1": "<p style=\"orphans:0;widows:0\">    do up</p>", "option2": " <p style=\"orphans:0;widows:0\">    do away with</p>", "option3": " <p style=\"orphans:0;widows:0\">    do down</p>", "option4": " <p style=\"orphans:0;widows:0\">    do without</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct phrasal verb to fill in the blank is <b>do away with</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Do     away with</b> means to get rid of, abolish, or stop using     something. Here, it refers to abolishing or discarding the     outdated attendance system.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Do up</b>     means to fasten (e.g., clothes) or to renovate/redecorate a     building.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Do     down</b> means to criticize someone unfairly or belittle them.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Do     without</b> means to manage or survive in the absence of     something.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence, option B is the correct    answer.</p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Had the driver not applied the    brakes immediately, a fatal accident ________.</p>", "option1": "<p style=\"orphans:0;widows:0\">    will occur</p>", "option2": " <p style=\"orphans:0;widows:0\">    would occur</p>", "option3": " <p style=\"orphans:0;widows:0\">    would have occurred</p>", "option4": " <p style=\"orphans:0;widows:0\">    had occurred</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The given sentence is an inverted third conditional sentence (an    unreal past condition starting with 'Had + subject + past    participle'). The standard structure for such inverted    conditionals is: <b>Had + Subject + V3..., Subject + would have +    V3...</b>. Hence, the correct phrase to complete the clause is    <b>would have occurred</b>.</p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the option that expresses the given sentence in passive    voice:</b></p>    <p style=\"orphans:0;widows:0\">The management is expected to    address the employees' grievances soon.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The employees' grievances were expected to be addressed soon by    the management.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Addressing the employees' grievances is expected soon by the    management.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The employees' grievances are expected to be addressed soon by the    management.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The management was expected to have addressed the employees'    grievances.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the active voice containing an infinitive    phrase: <i>Subject + is expected + to + V1 (address) + Object (the    employees' grievances)</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">To convert    this into the passive voice:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     object of the infinitive phrase (<b>the employees' grievances</b>)     becomes the new subject.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Since     the new subject is plural and the tense is simple present, the     helping verb changes from <b>is</b> to <b>are</b> (<i>are     expected</i>).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     active infinitive <b>to address</b> changes to the passive     infinitive <b>to be addressed</b> (<i>to be + V3</i>).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     original subject becomes the agent preceded by 'by': <b>by the     management</b>.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, the correct passive    form is: <i>\"The employees' grievances are expected to be    addressed soon by the management.\"</i></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words:</p>    <p style=\"orphans:0;widows:0\"><b>\"A person who pretends to    be someone else in order to deceive others\"</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Mentor</p>", "option2": " <p style=\"orphans:0;widows:0\">    Impostor</p>", "option3": " <p style=\"orphans:0;widows:0\">    Philanthropist</p>", "option4": " <p style=\"orphans:0;widows:0\">    Hermit</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitute is <b>Impostor</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Impostor:</b>    A person who pretends to be someone else in order to deceive    others.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Mentor:</b>    An experienced and trusted adviser.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Philanthropist:</b>    A person who donates money, time, or goods to help others.</p>    <p style=\"orphans:0;widows:0\"><b>Hermit:</b> A person living in    solitude, often for religious reasons.</p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Fill in the blank with the most appropriate option:</b></p>    <p style=\"orphans:0;widows:0\">The instructions for assembling    the machine were so ________ that even experienced engineers found    them difficult to follow.</p>", "option1": "<p style=\"orphans:0;widows:0\">    lucid</p>", "option2": " <p style=\"orphans:0;widows:0\">    convoluted</p>", "option3": " <p style=\"orphans:0;widows:0\">    explicit</p>", "option4": " <p style=\"orphans:0;widows:0\">    precise</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>convoluted</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'Convoluted'    means extremely complex, intricate, and difficult to follow. The    context clue \"even experienced engineers found them difficult    to follow\" clearly indicates that the instructions were    overly complicated.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>lucid:</b>    clearly expressed and easy to understand.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>explicit:</b>    stated clearly and in detail, leaving no room for confusion.</p>    <p style=\"orphans:0;widows:0\"><b>precise:</b> marked by    exactness and accuracy.</p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Rearrange the following sentences in correct order to make a    meaningful passage.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Selected    applicants were called for personal interviews.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Job    openings were posted across multiple platforms.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Offer    letters were dispatched to the successful candidates.</p>    <p style=\"orphans:0;widows:0\">4. Hundreds of resumes were    screened by the HR team.</p>", "option1": "<p style=\"orphans:0;widows:0\">    2-4-1-3</p>", "option2": " <p style=\"orphans:0;widows:0\">    2-1-4-3</p>", "option3": " <p style=\"orphans:0;widows:0\">    4-2-1-3</p>", "option4": " <p style=\"orphans:0;widows:0\">    1-2-4-3</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The passage follows the chronological sequence of a recruitment    process: First, the job openings were posted (2). Following this,    the applications/resumes received were screened by the HR team    (4). Then, the shortlisted candidates were called for interviews    (1). Finally, offer letters were dispatched to the selected    candidates (3). Therefore, the correct order is 2-4-1-3.</p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can suitably replace the underlined segment    to improve the sentence. If no improvement is required, select 'No    improvement required'.</p>    <p style=\"orphans:0;widows:0\">The architectural features of the    southern temples <u>are distinctively different from that of</u>    the northern shrines.</p>", "option1": "<p style=\"orphans:0;widows:0\">    is distinctively different from that of</p>", "option2": " <p style=\"orphans:0;widows:0\">    are distinctively different from those of</p>", "option3": " <p style=\"orphans:0;widows:0\">    are distinctively different than that of</p>", "option4": " <p style=\"orphans:0;widows:0\">    No improvement required</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct replacement is <b>are distinctively different from    those of</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The head    noun being compared is 'architectural features', which is plural.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. When    comparing plural nouns to avoid repetition, the demonstrative    pronoun <b>'those of'</b> is used instead of the singular 'that    of'.</p>    <p style=\"orphans:0;widows:0\">3. Since the subject is plural    ('features'), the plural auxiliary verb 'are' is grammatically    correct.</p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct passive form of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">The storm damaged several    residential buildings in the coastal town.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Several residential buildings were damaged by the storm in the    coastal town.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Several residential buildings were being damaged by the storm in    the coastal town.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Several residential buildings have been damaged by the storm in    the coastal town.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Several residential buildings had been damaged by the storm in the    coastal town.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the Simple Past Tense (Active Voice).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rule:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Active:    Subject + V2 + Object</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive:    Object + was/were + V3 + by + Subject</p>    <p style=\"orphans:0;widows:0\">Since the object 'Several    residential buildings' is plural, 'were damaged' is used. Hence,    the correct passive sentence is: 'Several residential buildings    were damaged by the storm in the coastal town.'</p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Find the part of the sentence that contains an error:</b></p>    <p style=\"orphans:0;widows:0\">The pharmaceutical companies,    despite facing severe regulatory hurdles, (1)/ managed to expand    into emerging markets (2)/ by offering affordable variants of    life-saving drugs (3)/ that significantly enhanced its brand    reputation worldwide. (4)</p>", "option1": "<p style=\"orphans:0;widows:0\">    (1)</p>", "option2": " <p style=\"orphans:0;widows:0\">    (2)</p>", "option3": " <p style=\"orphans:0;widows:0\">    (3)</p>", "option4": " <p style=\"orphans:0;widows:0\">    (4)</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The error lies in part (4) of the sentence. The antecedent is the    plural noun phrase 'The pharmaceutical companies'. Therefore, the    plural possessive pronoun 'their' must be used instead of the    singular possessive pronoun 'its' to maintain pronoun-antecedent    agreement.</p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate antonym of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Nefarious</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Heinous</p>", "option2": " <p style=\"orphans:0;widows:0\">    Virtuous</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sinister</p>", "option4": " <p style=\"orphans:0;widows:0\">    Wicked</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>'Nefarious'</b> means wicked, villainous, or criminal.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>'Virtuous'</b>    means having or showing high moral standards or goodness, which is    the exact opposite (antonym) of 'Nefarious'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meaning of    other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Heinous:</b>    utterly odious or wicked (synonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Sinister:</b>    giving the impression that something evil or harmful is happening    (synonym).</p>    <p style=\"orphans:0;widows:0\">- <b>Wicked:</b> evil or morally    wrong (synonym).</p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक परीक्षा में 70% परीक्षार्थी गणित में, 65% अंग्रेजी में उत्तीर्ण हुए तथा 15% दोनों विषयों में अनुत्तीर्ण हुए। यदि केवल गणित में उत्तीर्ण होने वाले परीक्षार्थियों की संख्या 480 है, तो कुल परीक्षार्थियों की संख्या ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3,200</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2,400</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1,600</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोनों में उत्तीर्ण = 70 + 65 − (100 − 15) = 50%। केवल गणित में उत्तीर्ण = 70 − 50 = 20% = 480, अतः कुल परीक्षार्थी = 480 ÷ 0.20 = 2,400।</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A एक वस्तु B को 20% लाभ पर बेचता है। B उसे C को 10% हानि पर बेच देता है। यदि C उस वस्तु के लिए ₹2,160 देता है, तो A के लिए वस्तु का क्रय मूल्य ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹2,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹1,800</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹2,100</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹2,400</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C द्वारा दिया गया मूल्य = A का क्रय मूल्य × 1.20 × 0.90 = 1.08 × क्रय मूल्य = 2,160। क्रय मूल्य = 2,160 ÷ 1.08 = ₹2,000।</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक वस्तु का अंकित मूल्य ₹4,000 है। इसे x% और 20% की दो क्रमिक छूट देने के बाद बेचा जाता है। यदि इन दोनों की एक समतुल्य एकल छूट 36% है, तो x का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>22.5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एकल समतुल्य छूट 36% है, अतः 64% मूल्य शेष रहता है। 64% = (100 − x)% × 80%, अतः (100 − x)/100 = 0.64 ÷ 0.8 = 0.8, जिससे x = 20।</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹12,000 की राशि को दो भागों में बाँटकर साधारण ब्याज पर उधार दिया जाता है, एक भाग 6% वार्षिक तथा दूसरा भाग 9% वार्षिक दर पर। यदि 3 वर्ष बाद कुल ब्याज ₹2,790 है, तो 6% वार्षिक दर पर दिया गया भाग ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹4,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹5,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹6,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹7,000</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माना 6% पर दिया गया भाग = P। प्रति वर्ष ब्याज = 0.06P + 0.09(12,000 − P) = 1,080 − 0.03P। 3 वर्ष के लिए: 3,240 − 0.09P = 2,790, अतः 0.09P = 450 और P = ₹5,000।</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹25,000 की राशि 8-मासिक चक्रवृद्धि आधार पर 12% वार्षिक ब्याज दर पर निवेश की जाती है। 2 वर्ष के अंत में प्राप्त कुल चक्रवृद्धि ब्याज कितना होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹6,492.80</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹6,240.00</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹6,516.80</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹6,380.20</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8-मासिक: प्रत्येक अवधि की दर = 12% × 8/12 = 8%; 2 वर्ष में अवधियाँ = 24 ÷ 8 = 3। मिश्रधन = 25,000 × (1.08)³ = 25,000 × 1.259712 = 31,492.80। चक्रवृद्धि ब्याज = 31,492.80 − 25,000 = ₹6,492.80।</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक बर्तन में 120 लीटर दूध और पानी का मिश्रण 5 : 3 के अनुपात में है। यदि इसमें से 40 लीटर मिश्रण निकालकर उसके स्थान पर 16 लीटर शुद्ध पानी मिला दिया जाता है, तो प्राप्त मिश्रण में दूध और पानी का नया अनुपात क्या होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>25 : 23</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5 : 4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20 : 17</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>15 : 11</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दूध = 120 × 5/8 = 75 लीटर, पानी = 45 लीटर। 40 लीटर निकालने पर 25 लीटर दूध और 15 लीटर पानी निकल जाता है, शेष 50 लीटर दूध और 30 लीटर पानी। 16 लीटर पानी मिलाने पर पानी = 46 लीटर। अनुपात = 50 : 46 = 25 : 23।</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रवि एक स्थान से प्रातः 8:00 बजे 40 किमी/घंटा की गति से चलता है। मोहन उसी स्थान से उसी दिशा में प्रातः 9:30 बजे 60 किमी/घंटा की गति से चलता है। मोहन, रवि से कितने बजे आगे निकल जाएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोपहर 12:30 बजे</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोपहर 12:00 बजे</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अपराह्न 1:00 बजे</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अपराह्न 1:30 बजे</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1.5 घंटे (8:00 से 9:30 बजे तक) में रवि 40 × 1.5 = 60 किमी चलता है। सापेक्ष चाल = 60 − 40 = 20 किमी/घंटा। पकड़ने में समय = 60 ÷ 20 = 3 घंटे, 9:30 बजे के बाद, अर्थात दोपहर 12:30 बजे।</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक नाव धारा के प्रतिकूल 24 किमी और धारा के अनुकूल 36 किमी की दूरी 6 घंटे में तय करती है, जबकि धारा के प्रतिकूल 36 किमी और धारा के अनुकूल 24 किमी की दूरी 6½ घंटे में तय करती है। धारा की चाल ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1 किमी/घंटा</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3 किमी/घंटा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4 किमी/घंटा</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2 किमी/घंटा</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माना धारा के प्रतिकूल चाल = u, धारा के अनुकूल चाल = d। 24/u + 36/d = 6 तथा 36/u + 24/d = 6.5। जोड़ने पर: 60/u + 60/d = 12.5, अतः 1/u + 1/d = 5/24। घटाने पर: 12/u − 12/d = 0.5, अतः 1/u − 1/d = 1/24। तब 1/u = 1/8 (u = 8) और 1/d = 1/12 (d = 12)। धारा की चाल = (12 − 8)/2 = 2 किमी/घंटा।</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A और B मिलकर एक कार्य को 12 दिन में पूरा कर सकते हैं। B और C मिलकर इसे 15 दिन में, जबकि A और C मिलकर इसे 20 दिन में पूरा कर सकते हैं। यदि A, B और C 4 दिन तक एक साथ कार्य करते हैं, और फिर A कार्य छोड़ देता है, तो B और C शेष कार्य को कितने और दिनों में पूरा करेंगे?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8 दिन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10 दिन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9 दिन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6 दिन</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A+B+C का 1 दिन का कार्य = (1/12 + 1/15 + 1/20) ÷ 2 = (5 + 4 + 3)/60 ÷ 2 = 1/10। 4 दिन में: 4/10 = 2/5 कार्य पूरा, शेष 3/5। B + C प्रतिदिन 1/15 कार्य करते हैं, अतः समय = (3/5) ÷ (1/15) = 9 दिन।</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो संख्याओं का महत्तम समापवर्तक (HCF) 18 तथा लघुत्तम समापवर्त्य (LCM) 1,080 है। यदि दोनों संख्याओं का योग 414 है, तो उनका अंतर ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>306</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>270</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>288</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>324</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>संख्याएँ = 18a और 18b, जहाँ a, b सह-अभाज्य हैं। ab = 1,080 ÷ 18 = 60 तथा a + b = 414 ÷ 18 = 23, अतः a, b = 20 और 3। संख्याएँ 360 और 54 हैं। अंतर = 306।</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक परीक्षा में 50 विद्यार्थियों का औसत अंक 72 था। बाद में यह पाया गया कि तीन अंकों 48, 65 और 91 को गलती से लिख दिया गया था, जबकि वास्तव में ये क्रमशः 84, 56 और 79 थे। सही औसत अंक ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>72.10</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>72.30</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>72.60</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>72.80</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मूल कुल = 50 × 72 = 3,600। गलत अंकों का योग = 48 + 65 + 91 = 204; सही अंकों का योग = 84 + 56 + 79 = 219। कुल 15 बढ़कर 3,615 हो जाता है। सही औसत = 3,615 ÷ 50 = 72.30।</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि a : b = 3 : 4, b : c = 6 : 5, c : d = 5 : 3 तथा a + b + c + d = 148 है, तो b का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>36</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>48</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>52</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>a : b = 3 : 4 = 9 : 12; b : c = 6 : 5 = 12 : 10; c : d = 5 : 3 = 10 : 6। अतः a : b : c : d = 9 : 12 : 10 : 6, कुल 37 भाग = 148, 1 भाग = 4। b = 12 × 4 = 48।</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3¹⁰⁰ + 4¹⁰⁰ को 7 से भाग देने पर शेषफल क्या होगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>0</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3⁶ ≡ 1 (मॉड 7); 100 = 6 × 16 + 4, अतः 3¹⁰⁰ ≡ 3⁴ = 81 ≡ 4। 4³ = 64 ≡ 1 (मॉड 7); 100 = 3 × 33 + 1, अतः 4¹⁰⁰ ≡ 4। योग ≡ 8 ≡ 1। शेषफल = 1।</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पाँच वर्ष पहले पिता की आयु उसके पुत्र की आयु की 7 गुना थी। दस वर्ष बाद पिता की आयु पुत्र की आयु की दोगुनी हो जाएगी। पिता की वर्तमान आयु ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>30 वर्ष</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>32 वर्ष</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>26 वर्ष</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>34 वर्ष</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माना पुत्र = S, पिता = F। F − 5 = 7(S − 5) से F = 7S − 30। F + 10 = 2(S + 10) से F = 2S + 10। अतः 7S − 30 = 2S + 10, S = 8 और F = 26 वर्ष।</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(0.8³ − 0.2³) ÷ (0.64 + 0.16 + 0.04) का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>0.6</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>0.5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>0.8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1.2</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>a = 0.8, b = 0.2 लेने पर: a² = 0.64, ab = 0.16, b² = 0.04। अतः व्यंजक = (a³ − b³) ÷ (a² + ab + b²) = a − b = 0.8 − 0.2 = 0.6।</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि a + b + c = 6 तथा ab + bc + ca = 11 है, तो a³ + b³ + c³ − 3abc का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>24</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>30</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>36</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>a² + b² + c² = (a + b + c)² − 2(ab + bc + ca) = 36 − 22 = 14। a³ + b³ + c³ − 3abc = (a + b + c)(a² + b² + c² − ab − bc − ca) = 6 × (14 − 11) = 18।</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि x + y = 11, y + z = 13 तथा z + x = 14 है, तो xy + yz + zx का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>112</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>118</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>120</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>124</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीनों समीकरण जोड़ने पर: 2(x + y + z) = 38, अतः x + y + z = 19। तब z = 19 − 11 = 8, x = 19 − 13 = 6, y = 19 − 14 = 5। xy + yz + zx = 30 + 40 + 48 = 118।</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि समीकरण x² − 7x + k = 0 के मूलों का अंतर 3 है, तो k का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>14</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>(α − β)² = (α + β)² − 4αβ = 7² − 4k = 9, अतः 49 − 4k = 9 और k = 10। (मूल 5 और 2 हैं।)</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक न्यूनकोण त्रिभुज ABC में ∠A = 64° है। यदि I त्रिभुज का अंतःकेंद्र तथा H लंबकेंद्र है, तो ∠BIC + ∠BHC ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>174°</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>238°</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>232°</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>244°</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>∠BIC = 90° + A/2 = 90° + 32° = 122°। न्यूनकोण त्रिभुज में ∠BHC = 180° − A = 116°। योग = 122° + 116° = 238°।</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक चक्रीय चतुर्भुज ABCD में भुजाओं AB और DC को आगे बढ़ाने पर वे B और C की ओर बिंदु P पर मिलती हैं, तथा भुजाओं AD और BC को आगे बढ़ाने पर वे D और C की ओर बिंदु Q पर मिलती हैं। यदि ∠P = 30° और ∠Q = 40° है, तो ∠ABC ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>55°</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>95°</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>85°</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>125°</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>त्रिभुज PAD में: ∠A + ∠D = 180° − 30° = 150°। त्रिभुज QAB में: ∠A + ∠B = 180° − 40° = 140°। चक्रीय चतुर्भुज में: ∠B + ∠D = 180°। पहले दो को जोड़ने पर: 2∠A + (∠B + ∠D) = 290°, अतः 2∠A = 110° और ∠A = 55°। तब ∠ABC = 140° − 55° = 85°।</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक बाह्य बिंदु P से 5 सेमी त्रिज्या तथा केंद्र O वाले वृत्त पर दो स्पर्श रेखाएँ PA और PB खींची गई हैं। यदि OP = 13 सेमी है, तो चतुर्भुज OAPB का क्षेत्रफल ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>60 सेमी²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>30 सेमी²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>65 सेमी²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>120 सेमी²</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्पर्श रेखा की लंबाई PA = √(13² − 5²) = 12 सेमी। OAPB का क्षेत्रफल = 2 × (1/2 × 5 × 12) = 60 सेमी²।</span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक शंकु के छिन्नक की आधार त्रिज्याएँ 14 सेमी और 7 सेमी तथा ऊँचाई 24 सेमी है। इसका आयतन ज्ञात कीजिए। (π = 22/7 लीजिए)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6,160 सेमी³</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7,392 सेमी³</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8,624 सेमी³</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9,856 सेमी³</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आयतन = (1/3)πh(R² + Rr + r²) = (1/3) × (22/7) × 24 × (196 + 98 + 49) = (22/7) × 8 × 343 = 8,624 सेमी³।</span></p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>24 सेमी ऊँचाई और 10 सेमी आधार त्रिज्या वाले एक ठोस शंकु को पिघलाकर 4 सेमी व्यास वाले छोटे ठोस गोलों में ढाला जाता है। ऐसे कितने पूर्ण गोले बनाए जा सकते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>60</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>75</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>80</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>90</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शंकु का आयतन = (1/3)π × 10² × 24 = 800π। गोले की त्रिज्या = 2 सेमी, आयतन = (4/3)π × 8 = 32π/3। गोलों की संख्या = 800π ÷ (32π/3) = 75।</span></p>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एक समद्विबाहु समलंब चतुर्भुज की समांतर भुजाएँ 26 सेमी और 10 सेमी हैं तथा प्रत्येक असमांतर भुजा 10 सेमी है। इसका क्षेत्रफल ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>108 सेमी²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>96 सेमी²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>120 सेमी²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>144 सेमी²</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>समांतर भुजाओं का अंतर = 26 − 10 = 16, अतः प्रत्येक ओर का प्रक्षेप = 8 सेमी। ऊँचाई = √(10² − 8²) = 6 सेमी। क्षेत्रफल = (1/2)(26 + 10) × 6 = 108 सेमी²।</span></p>", "question_heading": ""}, {"sr_no": 100, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>9tan²θ + 4cot²θ का न्यूनतम मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>10</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>13</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>AM–GM से, 9tan²θ + 4cot²θ ≥ 2√(9 × 4) = 12, समानता तब जब tan²θ = 2/3। न्यूनतम मान = 12।</span></p>", "question_heading": ""}, {"sr_no": 101, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यदि tan θ + cot θ = 3 है, तो tan³θ + cot³θ का मान ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>18</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>21</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>24</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>27</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>tan³θ + cot³θ = (tanθ + cotθ)³ − 3 tanθ cotθ (tanθ + cotθ) = 27 − 3 × 1 × 3 = 18।</span></p>", "question_heading": ""}, {"sr_no": 102, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>60 मी ऊँची एक इमारत की चोटी से एक मीनार के शीर्ष तथा आधार के अवनमन कोण क्रमशः 30° और 60° हैं। मीनार की ऊँचाई ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>20 मी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>30 मी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>45 मी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>40 मी</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मीनार तक क्षैतिज दूरी = 60 ÷ tan 60° = 20√3 मी। मीनार के शीर्ष तक गिरावट = 20√3 × tan 30° = 20 मी। मीनार की ऊँचाई = 60 − 20 = 40 मी।</span></p>", "question_heading": ""}, {"sr_no": 103, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 संख्याओं का माध्य 40 है। प्रत्येक संख्या को पहले 5 से बढ़ाया जाता है और फिर 2 से गुणा किया जाता है। इसके बाद आँकड़ों में एक और संख्या 116 जोड़ दी जाती है। अब 13 संख्याओं का माध्य ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>85</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>90</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>96</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>92</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>12 संख्याओं का नया माध्य = (40 + 5) × 2 = 90, अतः उनका योग = 1,080। 116 जोड़ने पर: 1,196 ÷ 13 = 92।</span></p>", "question_heading": ""}, {"sr_no": 104, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>किसी परिवार के मासिक बजट को दर्शाने वाले पाई चार्ट में भोजन को 90°, किराये को 72°, शिक्षा को 54° तथा परिवहन को 36° से दर्शाया गया है; शेष भाग बचत है। यदि बचत किराये से ₹12,000 अधिक है, तो परिवार की मासिक आय ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹90,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹1,20,000</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹1,08,000</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>₹1,50,000</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बचत का कोण = 360° − (90° + 72° + 54° + 36°) = 108°। बचत − किराया = 108° − 72° = 36° = ₹12,000। कुल 360° = 12,000 × 10 = ₹1,20,000।</span></p>", "question_heading": ""}, {"sr_no": 105, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दो निष्पक्ष पासों को एक साथ फेंका जाता है। उनके अंकों का योग एक अभाज्य संख्या तथा उनका गुणनफल सम होने की प्रायिकता ज्ञात कीजिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5/12</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1/3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4/9</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7/18</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अभाज्य योग: 2, 3, 5, 7, 11, जिनके परिणाम 1 + 2 + 4 + 6 + 2 = 15 हैं। योग 2 केवल (1,1) से आता है जिसका गुणनफल विषम है, अतः उसे हटाने पर: 36 में से 14 अनुकूल। प्रायिकता = 14/36 = 7/18।</span></p>", "question_heading": ""}, {"sr_no": 106, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कंप्यूटर बूटिंग प्रक्रिया के दौरान POST का क्या अर्थ है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Power-On Self Test (पावर-ऑन सेल्फ टेस्ट)</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Program Operation System Terminal (प्रोग्राम ऑपरेशन सिस्टम टर्मिनल)</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Primary Online Security Transmission (प्राइमरी ऑनलाइन सिक्योरिटी ट्रांसमिशन)</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Pre-Operational System Task (प्री-ऑपरेशनल सिस्टम टास्क)</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>POST एक डायग्नोस्टिक टेस्टिंग सीक्वेंस है जो कंप्यूटर के फर्मवेयर द्वारा पावर ऑन होने के तुरंत बाद चलाई जाती है ताकि हार्डवेयर घटकों के सही ढंग से काम करने की पुष्टि की जा सके।</span></p>", "question_heading": ""}, {"sr_no": 107, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कौन सा नेटवर्क टोपोलॉजी एक केंद्रीय नियंत्रक या हब की विशेषता रखता है जिससे सभी अन्य परिधीय नोड सीधे जुड़े होते हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रिंग टोपोलॉजी</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बस टोपोलॉजी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्टार टोपोलॉजी</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मेश टोपोलॉजी</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्टार टोपोलॉजी में, प्रत्येक नोड एक केंद्रीय हब, स्विच या कंप्यूटर से जुड़ा होता है, जिसका अर्थ है कि एक केबल की विफलता केवल उस विशिष्ट नोड को डिस्कनेक्ट करती है।</span></p>", "question_heading": ""}, {"sr_no": 108, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">वर्ल्ड वाइड वेब (WWW) का आविष्कार सन् 1989 में किसने किया था?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>विंट सर्फ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>टिम बर्नर्स-ली</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रे टॉमलिंसन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मार्क एंड्रीसन</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>टिम बर्नर्स-ली ने सर्न में काम करते हुए वर्ल्ड वाइड वेब का आविष्कार किया, जिसमें HTML, URI और HTTP को पेश किया गया।</span></p>", "question_heading": ""}, {"sr_no": 109, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MS Word में सक्रिय दस्तावेज़ में पाठ को केंद्र-संरेखित करने के लिए किस कीबोर्ड शॉर्टकट का उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + L</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + E</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + R</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + J</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Ctrl + E केंद्र संरेखण के लिए मानक शॉर्टकट है, जबकि Ctrl + L बाएं संरेखित करता है, Ctrl + R दाएं संरेखित करता है, और Ctrl + J जस्टिफाई करता है।</span></p>", "question_heading": ""}, {"sr_no": 110, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">वेब संपादन और ग्राफिकल डिज़ाइन सॉफ़्टवेयर में 'WYSIWYG' का क्या अर्थ है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>व्हाट यू सी इज़ व्हाट यू गेट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>व्हेयर यू सर्च इज़ व्हेयर यू गो</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>व्हिच यू सेलेक्ट इज़ व्हाट यू जेनरेट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>वेब यील्डेड सिस्टम इन वर्ल्डवाइड ग्राफ़िक्स</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यह उन प्रणालियों को संदर्भित करता है जहां संपादन के दौरान प्रदर्शित सामग्री प्रिंट या पूर्ण उत्पाद के रूप में प्रदर्शित होने पर इसकी उपस्थिति से निकटता से मेल खाती है।</span></p>", "question_heading": ""}, {"sr_no": 111, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">'GIF' का पूर्ण रूप क्या है, जो इंटरनेट पर सरल एनिमेशन के लिए उपयोग किया जाने वाला एक लोकप्रिय इमेज फॉर्मेट है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Graphics Interchange Format</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Graphical Information File</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Global Image Format</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>General Interface File</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>GIF एक बिटमैप इमेज फॉर्मेट है जिसे CompuServe द्वारा विकसित किया गया है और यह स्थिर और एनिमेटेड इमेजेस को सपोर्ट करता है।</span></p>", "question_heading": ""}, {"sr_no": 112, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कौन सा भौतिक कंप्यूटर पोर्ट मुख्य रूप से एक कंप्यूटर से हाई-डेफिनिशन मॉनिटर या टेलीविजन तक असंपीडित डिजिटल वीडियो और ऑडियो डेटा संचारित करने के लिए उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>VGA पोर्ट</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>HDMI पोर्ट</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>समानांतर पोर्ट</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PS/2 पोर्ट</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>हाई-डेफिनिशन मल्टीमीडिया इंटरफेस (HDMI) एक केबल के माध्यम से उच्च गुणवत्ता वाले असंपीडित डिजिटल ऑडियो और वीडियो संचारित करता है।</span></p>", "question_heading": ""}, {"sr_no": 113, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कंप्यूटर के ईथरनेट पोर्ट (RJ-45) में वायर्ड LAN कनेक्टिविटी के लिए कौन सा मानक नेटवर्क केबल कनेक्टर प्लग होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कोएक्सियल केबल कनेक्टर</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>RJ-45 कनेक्टर</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फाइबर ऑप्टिक SC कनेक्टर</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>USB Type-C कनेक्टर</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>RJ-45 (रजिस्टर्ड जैक 45) कनेक्टर ईथरनेट नेटवर्किंग केबल्स के लिए उपयोग किया जाने वाला मानक भौतिक कनेक्टर है।</span></p>", "question_heading": ""}, {"sr_no": 114, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MS Word में, पैराग्राफ की शुरुआत में एक बड़े कैपिटल अक्षर के लिए किस शब्द का उपयोग किया जाता है जो टेक्स्ट की दो या अधिक लाइनों में नीचे तक फैला होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>WordArt</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ड्रॉप कैप</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>वॉटरमार्क</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सुपरस्क्रिप्ट</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ड्रॉप कैप एक स्टाइलिश फॉर्मेटिंग विकल्प है जो अक्सर किसी अध्याय या लेख की शुरुआत में पाठक का ध्यान आकर्षित करने के लिए देखा जाता है।</span></p>", "question_heading": ""}, {"sr_no": 115, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MS Excel में कौन सा फीचर आपको एक बड़ी स्प्रेडशीट में स्क्रॉल करते समय विशिष्ट पंक्तियों या स्तंभों को दृश्यमान (स्थान पर लॉक) रखने की अनुमति देता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शीट सुरक्षित करें</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फ्रीज पेन</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ऑटोसम</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फ्लैश फिल</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>फ्रीज पेन हेडर पंक्तियों या मुख्य स्तंभों को स्क्रीन पर लॉक रखता है जब आप शीट में नीचे या आर-पार स्क्रॉल करते हैं।</span></p>", "question_heading": ""}, {"sr_no": 116, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">माइक्रोसॉफ्ट आउटलुक में, कौन सी सुविधा आपको प्राप्त संदेश के 'To' और 'Cc' पंक्तियों में सूचीबद्ध सभी प्राप्तकर्ताओं के साथ-साथ मूल प्रेषक को भी प्रतिक्रिया भेजने की अनुमति देती है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Forward</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Reply</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Reply All</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Resend</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'Reply All' यह सुनिश्चित करता है कि मूल ईमेल थ्रेड में शामिल सभी लोग आपकी प्रतिक्रिया प्राप्त करें, जो कि एक मानक 'Reply' से अलग है।</span></p>", "question_heading": ""}, {"sr_no": 117, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">MS Word में कौन सा टूल फॉन्ट शैली, आकार और रंग जैसे सभी फॉर्मेटिंग को एक टेक्स्ट से कॉपी करके दूसरे पर लागू करने के लिए उपयोग किया जाता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Quick Parts</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Format Painter</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mail Merge</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>WordArt</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Format Painter दस्तावेज़ में सुसंगत टेक्स्ट डिज़ाइन बनाए रखने के लिए फॉर्मेटिंग शैलियों को तेज़ी से कॉपी करता है।</span></p>", "question_heading": ""}, {"sr_no": 118, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कॉलम A में दिए गए Windows सिस्टम यूटिलिटीज़ को कॉलम B में उनके प्राथमिक कार्यों से मिलाएं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कॉलम A:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">1. Disk Cleanup</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">2. Task Scheduler</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">3. Event Viewer</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">4. Device Manager</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:b rmala UI'\"><span>निम्नलिखित    में से कौन सी पुस्तक भारत    के पूर्व प्रधानमंत्री आई</span></span><b>.    </b><span style=\"font-family:'Nirmala UI'\"><span>के</span></span><b>.    </b><span style=\"font-family:'Nirmala UI'\"><span>गुजराल    द्वारा लिखित एक आत्मकथात्मक    संस्मरण है</span></span><b>?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>मैटर्स ऑफ    डिस्क्रीशन </span></span>(Matters of    Discretion)</p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>द इनसाइडर    </span></span>(The Insider)</p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>चेंजिंग    इंडिया </span></span>(Changing India)</p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>द कोएलिशन    इयर्स </span></span>(The Coalition Years)</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    '<span style=\"font-family:'Nirmala UI'\"><span>मैटर्स ऑफ    डिस्क्रीशन</span></span>: <span style=\"font-family:'Nirmala UI'\"><span>एन    ऑटोबायोग्राफी</span></span>' (Matters of    Discretion: An Autobiography) <span style=\"font-family:'Nirmala UI'\"><span>भारत    के पूर्व प्रधानमंत्री इंदर    कुमार गुजराल </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>आई</span></span>.    <span style=\"font-family:'Nirmala UI'\"><span>के</span></span>.    <span style=\"font-family:'Nirmala UI'\"><span>गुजराल</span></span>)    <span style=\"font-family:'Nirmala UI'\"><span>द्वारा लिखी    गई है। यह पुस्तक उनके राजनयिक    और राजनीतिक जीवन तथा </span></span>'<span style=\"font-family:'Nirmala UI'\"><span>गुजराल    सिद्धांत</span></span>' <span style=\"font-family:'Nirmala UI'\"><span>की    पृष्ठभूमि का विस्तृत विवरण    प्रस्तुत करती है। अन्य    विकल्पों में</span></span>, '<span style=\"font-family:'Nirmala UI'\"><span>द    इनसाइडर</span
