<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>4.) ALL INDIA MOCK-2 (FREE - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

ive_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>तीसरी आकृति (विकल्प C) को छोड़कर, अन्य सभी आकृतियों में परस्पर संकेंद्रित दो समान ज्यामितीय आकृतियाँ और एक भिन्न आकृति शामिल है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पहली आकृति: 2 वर्ग और 1 वृत्त</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दूसरी आकृति: 2 त्रिभुज और 1 वृत्त</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चौथी आकृति: 2 वृत्त और 1 त्रिभुज</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पाँचवीं आकृति: 2 वर्ग और 1 त्रिभुज</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इसके विपरीत, तीसरी आकृति में तीनों आकृतियाँ पूरी तरह से भिन्न हैं (एक वृत्त, एक वर्ग और एक त्रिभुज)। अतः विकल्प (C) विषम आकृति है।</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">सात सदस्यों — P, Q, R, S, T, U और V वाले एक परिवार में: U, P का पति है। Q, P का इकलौता पुत्र है, और R, Q की इकलौती बहन है। T, R का पति है, और V, T की पुत्री है। S, P की पुत्रवधू है। S का V से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बुआ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मामी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माता</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दादी</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई जानकारी के आधार पर वंश-वृक्ष (family tree) इस प्रकार है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. U और P एक विवाहित युगल हैं (U पति है और P पत्नी है)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Q, P का इकलौता पुत्र है और R, Q की इकलौती बहन है। इस प्रकार, Q (पुरुष) और R (महिला) दोनों U और P की संतान हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. S, P की पुत्रवधू है। चूँकि Q, P का इकलौता पुत्र है, इसलिए S, Q की पत्नी है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. T, R का पति है और V, T की पुत्री है। अतः V, R और T की पुत्री है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. यहाँ R, V की माता है और Q, R का भाई है। इसलिए, Q, V का मामा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image008.jpeg\" width=\"513\" height=\"337\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चूँकि S, Q की पत्नी है, अतः S, V की </span><span style=\"font-weight:bold\">मामी</span><span> (Maternal aunt) है।</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित प्रश्न में दो कथन I और II दिए गए हैं। ये कथन स्वतंत्र कारण या स्वतंत्र कारणों या किसी उभयनिष्ठ कारण के प्रभाव हो सकते हैं। इनमें से एक कथन दूसरे कथन का प्रभाव हो सकता है। दोनों कथनों को पढ़िए और सही उत्तर का चयन कीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. आज सुबह शहर के हवाई अड्डे से संचालित होने वाली अधिकांश उड़ानें विलंबित हुईं या उनका मार्ग बदल दिया गया।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. आज इस क्षेत्र से होकर गुजरने वाली कई लंबी दूरी की एक्सप्रेस ट्रेनें निर्धारित समय से 4 से 5 घंटे देरी से चल रही थीं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों एक उभयनिष्ठ कारण के प्रभाव हैं।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I कारण है और कथन II इसका प्रभाव है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन II कारण है और कथन I इसका प्रभाव है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों स्वतंत्र कारण हैं।</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोनों कथन एक ही समय में सार्वजनिक परिवहन में आने वाले व्यवधानों को दर्शाते हैं। उड़ानों में देरी के कारण ट्रेनों में देरी नहीं हो सकती है, और न ही ट्रेनों में देरी उड़ानों के विलंबित या डायवर्ट होने का कारण बन सकती है। इसके बजाय, दोनों एक ही उभयनिष्ठ कारण के परिणाम हैं, जैसे कि प्रतिकूल मौसम (जैसे घना कोहरा या भारी तूफान) जिसके कारण क्षेत्र में दृश्यता और संचालन प्रभावित हुआ। अतः, कथन I और II दोनों एक उभयनिष्ठ कारण के प्रभाव हैं।</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">दिए गए विकल्पों में से उस संख्या का चयन कीजिए जो निम्नलिखित शृंखला में प्रश्न चिह्न (?) को प्रतिस्थापित कर सकती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">185, 199, 217, 239, 265, ?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>291</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>293</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>295</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>298</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई शृंखला में निम्नलिखित तर्क का अनुसरण किया गया है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image009.png\" width=\"111\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image010.png\" width=\"111\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image011.png\" width=\"111\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image012.png\" width=\"111\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>क्रमागत पदों के बीच का अंतर प्रत्येक बार </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image013.png\" width=\"9\" height=\"21\" alt style=\"vertical-align:middle\" ><span> बढ़ रहा है (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image014.png\" width=\"97\" height=\"21\" alt style=\"vertical-align:middle\" ><span>)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, अगला अंतर </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image015.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ><span> होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image016.png\" width=\"139\" height=\"21\" alt style=\"vertical-align:middle\" ></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">गद्यांश: \"किसी एथलीट की समग्र फिटनेस रेटिंग का मूल्यांकन दो अलग-अलग मापदंडों का उपयोग करके किया जाता है: एरोबिक सहनशक्ति और मांसपेशियों की ताकत। किसी उम्मीदवार की अंतिम रेटिंग उसके बेहतर प्रदर्शन करने वाले मापदंड के स्कोर के रूप में परिभाषित की जाती है, जिनमें से प्रत्येक को 1 से 50 अंकों के मानक पैमाने पर मापा जाता है। एक शारीरिक मूल्यांकन में, एथलीट X ने केवल एरोबिक सहनशक्ति में उल्लेखनीय प्रदर्शन किया, जबकि एथलीट Y ने केवल मांसपेशियों की ताकत में उल्लेखनीय प्रदर्शन किया।\"</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">प्रश्न: केवल उपरोक्त गद्यांश के आधार पर, निम्नलिखित में से कौन-सा निष्कर्ष तार्किक रूप से निकाला जा सकता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एथलीट X ने उच्च समग्र फिटनेस रेटिंग प्राप्त की क्योंकि एरोबिक सहनशक्ति को सार्वभौमिक रूप से प्राथमिकता दी जाती है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एथलीट Y ने उच्च समग्र फिटनेस रेटिंग प्राप्त की क्योंकि मांसपेशियों की ताकत एक बेहतर आधार प्रदान करती है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>एथलीट X और एथलीट Y की समग्र रेटिंग की तुलना नहीं की जा सकती क्योंकि विशिष्ट संख्यात्मक अंकों का उल्लेख नहीं किया गया है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>किसी भी एथलीट ने वैध रेटिंग प्राप्त नहीं की क्योंकि उम्मीदवार को दोनों मापदंडों में एक साथ दक्षता प्रदर्शित करनी चाहिए।</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>गद्यांश के अनुसार, अंतिम रेटिंग 1-50 के पैमाने पर उस मापदंड के संख्यात्मक मान पर आधारित होती है जिसका स्कोर अधिक होता है। यद्यपि हमें यह ज्ञात है कि प्रत्येक एथलीट ने किस क्षेत्र में श्रेष्ठ प्रदर्शन किया, लेकिन गद्यांश में उनके सटीक संख्यात्मक अंकों का उल्लेख नहीं है। इसलिए, यह निर्धारित करना असंभव है कि किसने उच्च रेटिंग प्राप्त की, जिससे विकल्प C एकमात्र तार्किक निष्कर्ष बनता है।</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित प्रश्न में, एक कथन दिया गया है, जिसके बाद कुछ निष्कर्ष दिए गए हैं। कथन को सत्य मानिए, भले ही वह सामान्यतः ज्ञात तथ्यों का विरोध करता हुआ प्रतीत हो। निष्कर्षों को ध्यानपूर्वक पढ़िए और निर्णय कीजिए कि उनमें से कौन-सा/कौन-से निष्कर्ष दिए गए कथन का तार्किक रूप से अनुसरण करता/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कथन:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">नगर निगम ने एकल-उपयोग वाले प्लास्टिक पर प्रतिबंध लगा दिया है और जैव-निम्नीकरणीय (बायोडिग्रेडेबल) विकल्पों को बढ़ावा देने के लिए एक जागरूकता अभियान शुरू किया है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. शहर से सभी प्रकार की प्लास्टिक वस्तुओं का उपयोग पूरी तरह से समाप्त हो जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. नगर निगम का मानना है कि जागरूकता से पर्यावरण-अनुकूल विकल्पों को अपनाने को बढ़ावा मिल सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">III. प्लास्टिक कचरे से होने वाला पर्यावरण क्षरण नगर निगम के लिए चिंता का विषय है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष I और II अनुसरण करते हैं।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष II और III अनुसरण करते हैं।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष I और III अनुसरण करते हैं।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सभी निष्कर्ष अनुसरण करते हैं।</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">निष्कर्ष I</span><span> अनुसरण नहीं करता है क्योंकि यह दावा करना कि सभी प्रकार के प्लास्टिक का उपयोग 'पूरी तरह से समाप्त' हो जाएगा, एक अतिवादी निष्कर्ष है। कथन में केवल एकल-उपयोग वाले प्लास्टिक पर प्रतिबंध का उल्लेख है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">निष्कर्ष II</span><span> अनुसरण करता है क्योंकि जागरूकता अभियान शुरू करना प्रत्यक्ष रूप से यह दर्शाता है कि प्राधिकरण का मानना है कि इससे पर्यावरण-अनुकूल विकल्पों को बढ़ावा मिल सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span style=\"font-weight:bold\">निष्कर्ष III</span><span> अनुसरण करता है क्योंकि प्रतिबंध लगाने और जागरूकता अभियान चलाने जैसे कदम यह स्पष्ट करते हैं कि प्लास्टिक प्रदूषण नगर निगम के लिए चिंता का विषय है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, केवल निष्कर्ष II और III तार्किक रूप से अनुसरण करते हैं।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">दी गई शीट को मोड़कर एक घन बनाने पर, अक्षर 'P' वाले फलक के विपरीत फलक पर कौन-सा अक्षर होगा?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image017.png\" width=\"300\" height=\"240\" alt ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>घन के दिए गए खुले प्रारूप (net) में:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. तीन फलकों वाली क्षैतिज पंक्ति में एकांतर फलक एक-दूसरे के विपरीत होते हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">Q</span><span>, </span><span style=\"font-weight:bold\">S</span><span> के विपरीत है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. प्रारूप को मोड़कर घन बनाने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">P</span><span> (जो </span><span style=\"font-weight:bold\">R</span><span> के ऊपर जुड़ा है) मुड़कर पीछे का फलक बनाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">T</span><span> (जो </span><span style=\"font-weight:bold\">S</span><span> के नीचे जुड़ा है) मुड़कर सामने का फलक बनाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, </span><span style=\"font-weight:bold\">P</span><span> और </span><span style=\"font-weight:bold\">T</span><span> एक-दूसरे के विपरीत फलक हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. शेष दो फलक परस्पर विपरीत होंगे:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• </span><span style=\"font-weight:bold\">R</span><span>, </span><span style=\"font-weight:bold\">U</span><span> के विपरीत है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, </span><span style=\"font-weight:bold\">P</span><span> के विपरीत फलक पर </span><span style=\"font-weight:bold\">T</span><span> होगा।</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">आठ मित्र A, B, C, D, E, F, G और H एक वृत्ताकार मेज के चारों ओर केंद्र के सम्मुख बैठे हैं। G, A के बाएँ से तीसरे स्थान पर बैठा है। D, G के दाएँ से दूसरे स्थान पर बैठा है। B, D के दाएँ से तीसरे स्थान पर बैठा है। F, न तो A का और न ही G का निकटतम पड़ोसी है। H, F के बाएँ से दूसरे स्थान पर बैठा है। C, D का निकटतम पड़ोसी नहीं है। यदि A, F के साथ अपना स्थान बदलता है और C, H के साथ अपना स्थान बदलता है, तो F के बाएँ से दूसरे स्थान पर कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माना वृत्ताकार मेज के चारों ओर 8 स्थान दक्षिणावर्त (clockwise) क्रम में 1 से 8 तक हैं। चूँकि सभी केंद्र के सम्मुख हैं, इसलिए दक्षिणावर्त दिशा बाएँ को और वामावर्त दिशा दाएँ को दर्शाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image018.jpeg\" width=\"513\" height=\"476\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. A को स्थान 1 पर रखते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. G, A के बाएँ से तीसरे (दक्षिणावर्त) स्थान पर है, अतः G स्थान 4 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. D, G के दाएँ से दूसरे (वामावर्त) स्थान पर है, अतः D स्थान 2 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. B, D के दाएँ से तीसरे स्थान पर है, अतः B स्थान 7 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. F, A के निकट (स्थान 8, 2) या G के निकट (स्थान 3, 5) नहीं बैठ सकता। शेष स्थानों {3, 5, 6, 8} में से F के लिए केवल स्थान 6 बचता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. H, F (स्थान 6) के बाएँ से दूसरे स्थान पर है, अतः H स्थान 8 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7. C, D (स्थान 2) का पड़ोसी नहीं है, इसलिए C स्थान 3 पर नहीं बैठ सकता; अतः C स्थान 5 पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8. शेष व्यक्ति E स्थान 3 पर बैठता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रारंभिक व्यवस्था (स्थान 1 से 8 दक्षिणावर्त): A, D, E, G, C, F, B, H.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्थानों की अदला-बदली के बाद:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- A और F परस्पर स्थान बदलते हैं: F स्थान 1 पर और A स्थान 6 पर आ जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- C और H परस्पर स्थान बदलते हैं: H स्थान 5 पर और C स्थान 8 पर आ जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>नई व्यवस्था (स्थान 1 से 8 दक्षिणावर्त): F, D, E, G, H, A, B, C.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अब F स्थान 1 पर है। केंद्र की ओर देखते हुए बायाँ दक्षिणावर्त है। F के बाएँ से दूसरे स्थान (स्थान 3) पर </span><span style=\"font-weight:bold\">E</span><span> बैठा है।</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">इस प्रश्न में दो कथन I और II दिए गए हैं। ये कथन स्वतंत्र कारण, स्वतंत्र कारणों के प्रभाव या किसी उभयनिष्ठ कारण के प्रभाव हो सकते हैं। एक कथन दूसरे कथन का प्रभाव भी हो सकता है। दोनों कथनों को ध्यानपूर्वक पढ़िए और सही उत्तर का चयन कीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. पिछले छह महीनों में, महानगर के पूर्वी उपनगरों में आवासीय किराये की मांग में 35% से अधिक की वृद्धि हुई है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. महानगरीय परिवहन प्राधिकरण ने हाल ही में पूर्वी उपनगरों को सीधे केंद्रीय वाणिज्यिक क्षेत्र से जोड़ने वाले एक एलिवेटेड रैपिड मेट्रो कॉरिडोर का पूर्ण संचालन शुरू किया है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I कारण है और कथन II इसका प्रभाव है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन II कारण है और कथन I इसका संभावित प्रभाव है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों स्वतंत्र कारण हैं।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों एक उभयनिष्ठ कारण के प्रभाव हैं।</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पूर्वी उपनगरों को सीधे केंद्रीय वाणिज्यिक क्षेत्र से जोड़ने वाले एलिवेटेड रैपिड मेट्रो कॉरिडोर के पूर्ण संचालन (कथन II) से दैनिक आवागमन की कनेक्टिविटी में उल्लेखनीय सुधार हुआ है और यात्रा का समय काफी घट गया है। इस ढांचागत विकास के प्रत्यक्ष परिणाम के रूप में, कार्यस्थलों पर जाने वाले लोगों के लिए उपनगरों में रहना अधिक सुविधाजनक हो गया, जिससे वहां आवासीय किराये की मांग में अचानक भारी वृद्धि (कथन I) हुई। अतः, कथन II कारण है और कथन I इसका संभावित प्रभाव है।</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">दिए गए समीकरण को संतुलित करने के लिए * चिह्नों को क्रमिक रूप से बदलने के लिए गणितीय चिह्नों के सही संयोजन का चयन कीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">68 * 4 * 13 * 225 * 15 * 19 = 217</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>÷, ×, −, ÷, +</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>÷, ×, +, ÷, −</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>×, ÷, +, −, ÷</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>÷, +, ×, −, ÷</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिया गया समीकरण: 68 * 4 * 13 * 225 * 15 * 19 = 217</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>विकल्प B के चिह्नों (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image019.png\" width=\"108\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) को क्रमिक रूप से रखने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bul ng": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आकृति A से आकृति B के परिवर्तन का अध्ययन करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">स्थान परिवर्तन:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• मध्य-ऊपरी (C1) का तत्व शीर्ष-बाएँ (TL) पर जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• निचला-दायाँ (BR) का तत्व मध्य-ऊपरी (C1) पर जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• मध्य-निचला (C2) का तत्व निचला-दायाँ (BR) पर जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• शीर्ष-बाएँ (TL) का तत्व मध्य-निचला (C2) पर जाता है और </span><span style=\"font-weight:bold\">90° दक्षिणावर्त (clockwise)</span><span> घूम जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• शीर्ष-दाएँ (TR) और निचला-बाएँ (BL) के तत्व परस्पर स्थान बदलते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• साथ ही, BL से TR में जाने वाला तत्व </span><span style=\"font-weight:bold\">लंबवत उल्टा</span><span> हो जाता है (अक्षर 'T' उल्टा होकर '⊥' बन जाता है)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">आकृति C पर समान नियम लागू करने पर आकृति D प्राप्त होती है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• C1 (हीरा ◇) शीर्ष-बाएँ (TL) पर आएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• BR (धन चिह्न +) मध्य-ऊपरी (C1) पर आएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• C2 (भरा हुआ वृत्त ●) निचला-दायाँ (BR) पर आएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• TL (दायाँ तीर →) मध्य-निचला (C2) पर जाकर 90° दक्षिणावर्त घूमकर नीचे की ओर (↓) हो जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• TR ('N') निचला-बाएँ (BL) पर जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• BL ('V') शीर्ष-दाएँ (TR) पर जाकर उल्टा होकर 'Λ' बन जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः विकल्प (B) सही आकृति है।</span></p>", "question_heading": ""}, {"sr_no": 15, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">उस विकल्प का चयन कीजिए जिसमें दी गई आकृति सन्निहित है। (घूर्णन की अनुमति नहीं है)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image035.png\" width=\"100\" height=\"150\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image036.png\" width=\"160\" height=\"160\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image037.png\" width=\"160\" height=\"160\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image038.png\" width=\"160\" height=\"160\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image039.png\" width=\"160\" height=\"160\" alt ></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आकृति को बिना घुमाए विकल्पों का ध्यानपूर्वक विश्लेषण करने पर, हम पाते हैं कि दी गई आकृति </span><span style=\"font-weight:bold\">विकल्प (B)</span><span> में सन्निहित है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. शीर्ष पर स्थित समचतुर्भुज (डायमंड) केंद्रीय ऊर्ध्वाधर अक्ष पर ऊपर मौजूद है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. समचतुर्भुज के निचले शीर्ष से एक ऊर्ध्वाधर रेखा नीचे की ओर जाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. एक क्षैतिज रेखा इस ऊर्ध्वाधर रेखा को काटती है, और इसके बाएं सिरे से एक तिरछी रेखा नीचे-दाएं की ओर जाकर केंद्रीय रेखा से मिलती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. ऊर्ध्वाधर रेखा के निचले सिरे पर, रेखा दाईं ओर मुड़ती है और फिर नीचे की ओर जाकर निचला हुक बनाती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>विकल्प (A) में बाईं ओर की तिरछी रेखा गायब है और निचला हुक बाईं ओर मुड़ता है। विकल्प (C) में तिरछी रेखा ऊपर की ओर जाती है। विकल्प (D) में निचला हुक नीचे जाने के बजाय ऊपर मुड़ता है।</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">अक्षरों के उस संयोजन का चयन कीजिए, जिसे निम्नलिखित शृंखला में रिक्त स्थानों पर बाएँ से दाएँ रखने पर शृंखला पूरी हो जाएगी।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Z _ B Y X C _ W _ E F U T G _ S R _ J Q _ K L O</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A D V H I P</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A E V H J P</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B D U H I P</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A D U G J O</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p s  → Q (-2) → O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>साथ ही, प्रत्येक समूह में पहले और दूसरे अक्षर तथा तीसरे और चौथे अक्षर एक-दूसरे के विपरीत (opposite) अक्षर हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः रिक्त स्थानों को भरने वाले सही अक्षर </span><span style=\"font-weight:bold\">A D V H I P</span><span> हैं।</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">दिए गए विकल्पों में से उस संख्या का चयन कीजिए जो निम्नलिखित शृंखला में प्रश्न चिह्न (?) को प्रतिस्थापित कर सकती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">23, 25, 32, 60, ?, 249</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>118</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>123</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>127</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>135</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दी गई शृंखला में एकांतर रूप से </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image040.png\" width=\"46\" height=\"21\" alt style=\"vertical-align:middle\" ><span> और </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image041.png\" width=\"46\" height=\"21\" alt style=\"vertical-align:middle\" ><span> जोड़ने का पैटर्न अनुसरण किया गया है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151 I अनुसरण नहीं करता है:</span><span> सभी 12 केंद्रों को मिलाकर कंपनी के कुल लाभ में वृद्धि हुई है या नहीं, यह जानने के लिए हमें प्रत्येक केंद्र के आधारभूत (आरंभिक) लाभ का पता होना चाहिए। यदि 5% गिरावट वाले 8 केंद्रों का आधारभूत लाभ 20% वृद्धि वाले 4 केंद्रों की तुलना में बहुत अधिक था, तो कंपनी का कुल लाभ घट जाएगा। आधारभूत लाभ की जानकारी के बिना यह निश्चित रूप से नहीं कहा जा सकता।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, न तो निष्कर्ष I और न ही II अनुसरण करता है।</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">‘P # Q’ का अर्थ है ‘P, Q की बहन है’।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">‘P @ Q’ का अर्थ है ‘P, Q का पुत्र है’।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">‘P % Q’ का अर्थ है ‘P, Q की पत्नी है’।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">‘P * Q’ का अर्थ है ‘P, Q का भाई है’।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">‘P &amp; Q’ का अर्थ है ‘P, Q का पिता है’।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">यदि ‘D # C @ B % A * E % F &amp; G’ है, तो B, G से किस प्रकार संबंधित है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पिता की बहन</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माता के भाई की पत्नी</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>माता की बहन</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पिता के भाई की पत्नी</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>व्यंजक को बाएं से दाएं डिकोड करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. D # C → D, C की बहन है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. C @ B → C, B का पुत्र है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. B % A → B, A की पत्नी है (अतः A, C और D का पिता है)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. A * E → A, E का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. E % F → E, F की पत्नी है (अतः E महिला है और A की बहन है)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. F &amp; G → F, G का पिता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चूंकि E, F की पत्नी है, इसलिए E, G की माता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अब, E का भाई A है (अर्थात G के मामा), और B, A की पत्नी है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, B, G के माता के भाई की पत्नी (मामी) है।</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित में से किस अक्षर-समूह को # और % को प्रतिस्थापित करना चाहिए ताकि '::' के बाईं ओर के अक्षर-समूह युग्म के बीच अनुसरित पैटर्न और संबंध वही हो जो '::' के दाईं ओर के अक्षर-समूह युग्म के बीच है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\"># : PCXN :: RGMT : %</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># = RZCG, % = PJHA</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># = NFSU, % = UDRM</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># = NFSU, % = TDRM</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># = MGSV, % = TCRM</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पहले और दूसरे अक्षर-समूह के बीच अनुसरित पैटर्न अक्षरों के स्थानीय मानों में क्रमागत अभाज्य संख्याओं (+2, -3, +5, -7) को एकांतर क्रम में जोड़ने और घटाने पर आधारित है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पहले युग्म (# : PCXN) के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• पहला अक्षर: N (14) + 2 = 16 (P)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• दूसरा अक्षर: F (6) − 3 = 3 (C)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• तीसरा अक्षर: S (19) + 5 = 24 (X)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• चौथा अक्षर: U (21) − 7 = 14 (N)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, # = NFSU प्राप्त होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>यही नियम दूसरे युग्म (RGMT : %) पर लागू करने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• पहला अक्षर: R (18) + 2 = 20 (T)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• दूसरा अक्षर: G (7) − 3 = 4 (D)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• तीसरा अक्षर: M (13) + 5 = 18 (R)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• चौथा अक्षर: T (20) − 7 = 13 (M)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, % = TDRM प्राप्त होता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इस प्रकार, # = NFSU और % = TDRM सही उत्तर है।</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक निश्चित कूट भाषा में, 'STREAM' को 'NDHIGH' और 'FLIGHT' को 'GSTLOU' लिखा जाता है। उसी भाषा में 'GOLDEN' को किस प्रकार लिखा जाएगा?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MHWORT</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MHWPRT</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>MHVORT</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>NHWORT</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कूट में प्रयुक्त पैटर्न निम्नानुसार है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. दिए गए शब्द के अक्षरों को उल्टे क्रम (reverse order) में लिखा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. प्रत्येक व्यंजन (Consonant) को उसके विपरीत वर्णमाला अक्षर (जिनके स्थानीय मानों का योग 27 हो) से बदला जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. प्रत्येक स्वर (Vowel) में +3 जोड़ा जाता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'STREAM' के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उल्टा क्रम: M - A - E - R - T - S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• M (व्यंजन) → विपरीत अक्षर N</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• A (स्वर) → A + 3 = D</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• E (स्वर) → E + 3 = H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• R (व्यंजन) → विपरीत अक्षर I</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• T (व्यंजन) → विपरीत अक्षर G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• S (व्यंजन) → विपरीत अक्षर H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कूट: </span><span style=\"font-weight:bold\">NDHIGH</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'FLIGHT' के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उल्टा क्रम: T - H - G - I - L - F</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• T (व्यंजन) → विपरीत अक्षर G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• H (व्यंजन) → विपरीत अक्षर S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• G (व्यंजन) → विपरीत अक्षर T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• I (स्वर) → I + 3 = L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• L (व्यंजन) → विपरीत अक्षर O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• F (व्यंजन) → विपरीत अक्षर U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कूट: </span><span style=\"font-weight:bold\">GSTLOU</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उसी प्रकार, 'GOLDEN' के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उल्टा क्रम: N - E - D - L - O - G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• N (व्यंजन) → विपरीत अक्षर M</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• E (स्वर) → E + 3 = H</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• D (व्यंजन) → विपरीत अक्षर W</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>• L (व्यंजन) → विपरीत अक्षर O</span></p text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">इस प्रश्न में, एक कथन के बाद दो कार्रवाइयाँ दी गई हैं, जिन्हें I और II क्रमांकित किया गया है। आपको कथन में दी गई सभी बातों को सत्य मानना है और कथन में दी गई जानकारी के आधार पर यह निर्णय लेना है कि कौन-सी कार्रवाई/कार्रवाइयाँ तार्किक रूप से अनुसरण करती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कथन: स्वचालित उत्पादन लाइनों की शुरुआत के बाद, एक विनिर्माण संयंत्र के त्रैमासिक उत्पादन में अप्रत्याशित रूप से </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794105151266_image079.png\" width=\"34\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> की गिरावट दर्ज की गई, साथ ही उपकरणों में बार-बार खराबी और श्रमिकों की अनुपस्थिति में तीव्र वृद्धि देखी गई।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कार्रवाइयाँ:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. संयंत्र प्रबंधन को मशीनरी का व्यापक तकनीकी ऑडिट करना चाहिए और साथ ही परिचालन कर्मचारियों के लिए संरचित पुन: कौशल (री-स्किलिंग) एवं उपकरण-संचालन कार्यशालाओं का आयोजन करना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. प्रबंधन को ऑटोमेशन में बदलाव के कारण उत्पन्न होने वाली व्यावहारिक कठिनाइयों और कार्यस्थल तनाव को दूर करने के लिए कर्मचारी फीडबैक और परामर्श चैनल स्थापित करना चाहिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल I अनुसरण करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल II अनुसरण करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो I और न ही II अनुसरण करता है</span></p>", "option4": " <p sty
