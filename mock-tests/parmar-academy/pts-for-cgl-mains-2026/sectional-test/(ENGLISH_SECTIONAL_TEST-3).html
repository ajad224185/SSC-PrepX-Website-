<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>23.) ENGLISH SECTIONAL TEST-3 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

le=\"font-size:11pt\"><b>\"with\"</b></span></span><span><span style=\"font-size:11pt\">      (</span></span><span><span style=\"font-size:11pt\"><b>fall      out with someone</b></span></span><span><span style=\"font-size:11pt\">).</span></span></p>     </li></ul>    </ol>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\"><b>Corrected    Sentence:</b></span></span><span><span style=\"font-size:11pt\"><i>\"You    must not </i></span></span><span><span style=\"font-size:11pt\"><i><b>fall    out with</b></i></span></span><span><span style=\"font-size:11pt\"><i>    your parents, no matter how angry you are.\"</i></span></span></p>    <h3><a name=\"_heading=h.z827pwd927wr\"></a>    <span><span><span style=\"font-size:13pt\"><b>Why    Other Options Are Incorrect</b></span></span></span></h3>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\"><b>Fall    for:</b></span></span><span><span style=\"font-size:11pt\">    To be deceived by a trick/lie, or to fall in love with someone.</span></span></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\"><b>Fall    on:</b></span></span><span><span style=\"font-size:11pt\">    To attack fiercely, or to be borne as a duty/expense (</span></span><span><span style=\"font-size:11pt\"><i>\"The    responsibility fell on him\"</i></span></span><span><span style=\"font-size:11pt\">).</span></span></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in\"><span><span style=\"font-size:11pt\"><b>Fall    off:</b></span></span><span><span style=\"font-size:11pt\">    To decrease in quantity/quality, or to detach and drop down.</span></span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">Identify    the misspelt word.</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">Reprihensible</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">Idiosyncratic</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">Obstreperous</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">Lamentable</span></span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The misspelt word is <b>A) Reprihensible</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Correct    Spelling</b>: Reprehensible (R-E-P-R-E-H-E-N-S-I-B-L-E — uses    -pre-, not -pri-).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meaning</b>:    Deserving condemnation or severe criticism; morally wrong.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B)    <b>Idiosyncratic</b>: Peculiar or individual to a specific person    (Correct).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C)    <b>Obstreperous</b>: Noisy, unruly, and difficult to control    (Correct).</p>    <p style=\"orphans:0;widows:0\">D) <b>Lamentable</b>: Deplorable,    regrettable, or inspiring grief (Correct).</p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span style=\"font-size:11pt\"><b>Fill    in the blank with the appropriate tense.</b></span></span></p>    <p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\">Were    the data_________earlier, corrective measures could have been    implemented.</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">analyzed    thoroughly</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">had    analyzed thoroughly</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">were    analyzed thoroughly</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">analyze    thoroughly</span></span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\">The    correct option is </span></span><span><span style=\"font-size:11pt\"><b>A)    analyzed thoroughly</b></span></span><span><span style=\"font-size:11pt\">.</span></span></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\">The    main clause uses </span></span><span><span style=\"font-size:11pt\"><b>\"could    have been implemented\"</b></span></span><span><span style=\"font-size:11pt\">    (could + have + been + V3), indicating an unreal past condition    (Third Conditional / Mixed Conditional passive).</span></span></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\">The    conditional clause begins with an inverted auxiliary verb: </span></span><span><span style=\"font-size:11pt\"><b>\"Were    the data...\"</b></span></span><span><span style=\"font-size:11pt\">    (equivalent to </span></span><span><span style=\"font-size:11pt\"><i>\"If    the data were...\"</i></span></span><span><span style=\"font-size:11pt\">    or </span></span><span><span style=\"font-size:11pt\"><i>\"Had    the data been...\"</i></span></span><span><span style=\"font-size:11pt\">    in passive voice).</span></span></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\">Since    </span></span><span><span style=\"font-size:11pt\"><b>\"Were\"</b></span></span><span><span style=\"font-size:11pt\">    (a </span></span><span><span style=\"font-size:11pt\"><i>be</i></span></span><span><span style=\"font-size:11pt\">-verb    auxiliary) is already placed at the beginning of the clause, the    passive voice strictly requires the </span></span><span><span style=\"font-size:11pt\"><b>Past    Participle (V_3)</b></span></span><span><span style=\"font-size:11pt\">    directly after the subject (</span></span><span><span style=\"font-size:11pt\"><b>\"the    data\"</b></span></span><span><span style=\"font-size:11pt\">).</span></span></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\"><b>Completed    Sentence:</b></span></span><span><span style=\"font-size:11pt\"><i>\"Were    the data </i></span></span><span><span style=\"font-size:11pt\"><i><b>analyzed    thoroughly</b></i></span></span><span><span style=\"font-size:11pt\"><i>    earlier, corrective measures could have been implemented.\"</i></span></span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span style=\"font-size:11pt\"><b>Fill    in the blank with the correctly spelt word.</b></span></span></p>    <p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\">The    environmental impact of the project was assessed    using_______models.</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">stocastic</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">stochastic</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">stocchastic</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">stochhastic</span></span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\">The    correct option is </span></span><span><span style=\"font-size:11pt\"><b>B)    stochastic</b></span></span><span><span style=\"font-size:11pt\">.</span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Correct     Spelling: Stochastic (S-T-O-C-H-A-S-T-I-C).</p>     </li><li><p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\"><b>Meaning:</b></span></span><span><span style=\"font-size:11pt\">     Randomly determined; having a random probability distribution or     pattern that can be analyzed statistically but not predicted     precisely.</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><span style=\"font-size:11pt\">Select    the sentence containing the homonym of the highlighted word:</span></span></p>    <p style=\"orphans:0;widows:0\"><span><span style=\"font-size:11pt\">The    choir sang a </span></span><span><span style=\"font-size:11pt\"><b>motet</b></span></span><span><span style=\"font-size:11pt\">    written for Advent.</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">The    motet featured complex polyphonic layering.</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">The    musicologist analyzed a 14th-century motet.</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">The    legal clerk filed a motet to the high court.</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span><span style=\"font-size:11pt\">The    cathedral's motet was accompanied by lute.</span></span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\">The    correct option is </span></span><span><span style=\"font-size:11pt\"><b>C)    The legal clerk filed a motet to the high court.</b></span></span></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\">A    word that shares the exact same spelling and pronunciation as    another word, but carries a completely different meaning.</span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">     <span><span style=\"font-size:11pt\"><b>Motet     (Music):</b></span></span><span><span style=\"font-size:11pt\">     A short piece of sacred choral music, typically polyphonic and     unaccompanied.</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <span><span style=\"font-size:11pt\"><b>Option    C [Correct]:</b></span></span><span><span style=\"font-size:11pt\">    </span></span><span><span style=\"font-size:11pt\"><b>Motet    (Law/Historical Legal Term):</b></span></span><span><span style=\"font-size:11pt\">    Refers to an official legal petition, motion, or written plea    submitted to a court. Because it uses the exact same    spelling/pronunciation in a completely unrelated domain, it is the    </span></span><span><span style=\"font-size:11pt\"><b>homonym</b></span></span><span><span style=\"font-size:11pt\">.</span></span></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in\"><span><span style=\"font-size:11pt\"><b>Options    A, B, &amp; D [incorrect]:</b></span></span><span><span style=\"font-size:11pt\">    All three sentences use </span></span><span><span style=\"font-size:11pt\"><b>motet</b></span></span><span><span style=\"font-size:11pt\">    in the exact same musical sense (choral composition) as the    original sentence.</span></span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate meaning of the given idiom.</p>    <p style=\"orphans:0;widows:0\">\"Weather the storm\"</p>", "option1": "<p style=\"orphans:0;widows:0\">    To successfully deal with a difficult situation</p>", "option2": " <p style=\"orphans:0;widows:0\">    To face extreme and catastrophic failure</p>", "option3": " <p style=\"orphans:0;widows:0\">    To accurately predict future challenges</p>", "option4": " <p style=\"orphans:0;widows:0\">    To evade responsibilities during tough times</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The idiom <b>\"Weather the storm\"</b> means to    successfully survive, endure, or deal with a very difficult period    or problem. Therefore, option A is the correct answer.</p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0\">    Select the correct <b>one-word substitute</b> for: 'The study of    the origin and historical development of words and their    meanings.'</p>", "option1": "<p style=\"orphans:0;widows:0\">    Entomology</p>", "option2": " <p style=\"orphans:0;widows:0\">    Etymology</p>", "option3": " <p style=\"orphans:0;widows:0\">    Epistemology</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ornithology</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (B) <b>Etymology</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Etymology:</b>     The study of the origin of words and the way in which their     meanings have changed throughout history.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Entomology:</b>     The scientific study of insects.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Epistemology:</b>     The branch of philosophy that deals with the theory of knowledge.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Ornithology:</b> The     scientific study of birds.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Find the part of the sentence that contains an error:</b></p>    <p style=\"orphans:0;widows:0\">The meteorological sensors,    installed across the coastal region to monitor atmospheric    changes, (1)/ transmitted reliable data during the initial phases    of the storm (2)/ but suffered severe technical malfunctions (3)/    when its battery reserves were depleted prematurely. (4)</p>", "option1": "<p style=\"orphans:0;widows:0\">    (1)</p>", "option2": " <p style=\"orphans:0;widows:0\">    (2)</p>", "option3": " <p style=\"orphans:0;widows:0\">    (3)</p>", "option4": " <p style=\"orphans:0;widows:0\">    (4)</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The correct answer is option (4)</b></p>    <p style=\"orphans:0;widows:0\">The antecedent is the plural noun    'The meteorological sensors'. Therefore, the plural possessive    pronoun 'their' must be used instead of the singular 'its' to    maintain correct pronoun-antecedent agreement. Hence, the    corrected phrase should be 'when their battery reserves were    depleted prematurely'.</p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>A sentence is provided in indirect speech. From the four given    options, choose the one that most accurately conveys the sentence    in its corresponding direct speech.</b></p>    <p style=\"orphans:0;widows:0\">The economist argued that the    domestic market could have avoided a severe liquidity crisis had    the regulatory board intervened in time.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The economist argued, \"If the regulatory board intervened in    time, the domestic market could avoid a severe liquidity crisis.\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    The economist argued, \"Had the regulatory board intervened in    time, the domestic market could have avoided a severe liquidity    crisis.\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    The economist argued, \"Had the regulatory board intervene in    time, the domestic market could have avoided a severe liquidity    crisis.\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    The economist argued, \"If the regulatory board had intervened    in time, the domestic market can avoid a severe liquidity crisis.\"</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The given sentence is in indirect speech and contains a third    conditional clause with inversion (hypothetical past condition:    <i>Had + subject + past participle ..., subject + could have +    past participle ...</i>). In English grammar, unreal past    conditions (Third Conditional) do not undergo backshifting of    tenses when converted between direct and indirect speech.    Therefore, the direct speech maintains the exact conditional    structure inside quotation marks: <b>The economist argued, \"Had    the regulatory board intervened in time, the domestic market could    have avoided a severe liquidity crisis.\"</b> Hence, option B    is correct.</p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Rearrange the parts of the sentence in the correct order.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">With the    rapid advancement of artificial intelligence in healthcare,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">P. while    regulatory bodies scramble to establish ethical frameworks and    guidelines</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Q. medical    professionals are finding new ways to diagnose complex diseases,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R.    significantly reducing the time required for critical patient    evaluations,</p>    <p style=\"orphans:0;widows:0\">S. thereby improving survival    rates across various critical care units,</p>", "option1": "<p style=\"orphans:0;widows:0\">    PQSR</p>", "option2": " <p style=\"orphans:0;widows:0\">    QRSP</p>", "option3": " <p style=\"orphans:0;widows:0\">    RQPS</p>", "option4": " <p style=\"orphans:0;widows:0\">    SPRQ</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The introductory phrase \"With the rapid advancement of    artificial intelligence in healthcare,\" requires a subject    and a main clause, which is provided by <b>Q</b> (\"medical    professionals are finding new ways to diagnose complex    diseases,\"). Part <b>R</b> acts as a participial phrase    detailing the immediate effect of this action (\"significantly    reducing the time required for critical patient evaluations,\").    Part <b>S</b> continues this positive outcome (\"thereby    improving survival rates across various critical care units,\").    Finally, part <b>P</b> introduces a contrasting subordinate clause    beginning with 'while' (\"while regulatory bodies scramble to    establish ethical frameworks and guidelines\"). Therefore, the    logically coherent and grammatically correct sequence is <b>QRSP</b>.</p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate synonym of the given word: <b>ABATE</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Subside</p>", "option2": " <p style=\"orphans:0;widows:0\">    Increase</p>", "option3": " <p style=\"orphans:0;widows:0\">    Expand</p>", "option4": " <p style=\"orphans:0;widows:0\">    Intensify</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>ABATE</b> means to become less intense or widespread;    to lessen or diminish. Therefore, <b>Subside</b> is its most    appropriate synonym.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Increase:</b>    to become or make greater in size or amount.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Expand:</b>    to become or make larger or more extensive.</p>    <p style=\"orphans:0;widows:0\"><b>Intensify:</b> to become or    make more intense.</p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate antonym of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Acrimonious</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Bitter</p>", "option2": " <p style=\"orphans:0;widows:0\">    Caustic</p>", "option3": " <p style=\"orphans:0;widows:0\">    Cordial</p>", "option4": " <p style=\"orphans:0;widows:0\">    Rancorous</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>'Acrimonious'</b> means angry, bitter, and harsh in    tone or manner.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the given options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Bitter:</b>    feeling or showing anger, hurt, or resentment (Synonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Caustic:</b>    sarcastic in a scathing and bitter way (Synonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Cordial:</b>    warm, friendly, and polite (Antonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rancorous:</b>    characterized by bitterness or resentment (Synonym).</p>    <p style=\"orphans:0;widows:0\">Therefore, the most appropriate    antonym is <b>Cordial</b>.</p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to substitute the underlined    segment in the given sentence. If no substitution is required,    select 'No improvement required'.</p>    <p style=\"orphans:0;widows:0\">The senior diplomat declined to    endorse the joint communique <u>primarily as his delegation had    refused to accepted</u> the proposed amendments.</p>", "option1": "<p style=\"orphans:0;widows:0\">    due to his delegation refusing the accept of</p>", "option2": " <p style=\"orphans:0;widows:0\">    primarily because his delegation had refused to accept</p>", "option3": " <p style=\"orphans:0;widows:0\">    since because his delegation refused in accepting</p>", "option4": " <p style=\"orphans:0;widows:0\">    No improvement required</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>primarily because his delegation had    refused to accept</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    infinitive marker <i>to</i> is followed by the base form of the    verb (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794847173292_html_6d47a5ab5429ad09.gif\" > ),    so 'to accepted' is grammatically incorrect and must be replaced    by 'to accept'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. 'Primarily    because' correctly and clearly introduces the cause or reason.</p>    <p style=\"orphans:0;widows:0\">3. 'Since because' in option C is    redundant, and option A is unidiomatic and grammatically flawed.</p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The following sentence has been divided into four parts (P, Q, R,    and S). The first part (S1) and the last part (S5) are fixed.    Rearrange the remaining parts to form a grammatically correct and    meaningful sentence, and choose the correct sequence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">S1: The    ancient city of Petra in southwestern Jordan is renowned for its    rock-cut architecture and water conduit system,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">P:    transforming this inhospitable desert crossroad into a thriving    commercial hub that controlled</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Q: which    allowed its inhabitants to flourish in the heart of an arid desert    by capturing and storing</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R: the    lucrative trade routes of frankincense and spices connecting    southern Arabia to the Mediterranean world,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">S: scarce    seasonal rainwater through a complex network of cisterns, dams,    and ceramic pipes,</p>    <p style=\"orphans:0;widows:0\">S5: and ultimately establishing    the Nabataeans as masters of desert survival and engineering.</p>", "option1": "<p style=\"orphans:0;widows:0\">    PRSQ</p>", "option2": " <p style=\"orphans:0;widows:0\">    QSPR</p>", "option3": " <p style=\"orphans:0;widows:0\">    SQPR</p>", "option4": " <p style=\"orphans:0;widows:0\">    QPSR</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sequence is <b>QSPR</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>S1</b>    introduces Petra's rock-cut architecture and water conduit system.    Relative pronoun 'which' in <b>Q</b> directly refers back to the    water conduit system, explaining what it allowed the inhabitants    to do ('allowed its inhabitants to flourish... by capturing and    storing').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Part <b>Q</b>    ends with the transitive verbs 'capturing and storing', which    require a direct object. Part <b>S</b> provides this object    ('scarce seasonal rainwater through a complex network...').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Following    the description of the water system in <b>S</b>, the participle    clause in <b>P</b> ('transforming this inhospitable desert    crossroad...') explains the result of this infrastructure.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Part <b>P</b>    ends with the transitive verb 'controlled', which leads directly    to its object in <b>R</b> ('the lucrative trade routes...').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">5. Finally, <b>R</b>    connects smoothly to <b>S5</b> ('and ultimately establishing...'),    maintaining parallelism with 'transforming' in part P.</p>    <p style=\"orphans:0;widows:0\">Thus, the complete meaningful    sentence follows the order: <b>S1 - Q - S - P - R - S5</b>.</p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct passive form of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">The municipal corporation used to    maintain these botanical gardens with utmost care.</p>", "option1": "<p style=\"orphans:0;widows:0\">    These botanical gardens were maintained with utmost care by the    municipal corporation.</p>", "option2": " <p style=\"orphans:0;widows:0\">    These botanical gardens used to be maintained with utmost care by    the municipal corporation.</p>", "option3": " <p style=\"orphans:0;widows:0\">    These botanical gardens were used to be maintained with utmost    care by the municipal corporation.</p>", "option4": " <p style=\"orphans:0;widows:0\">    These botanical gardens had been maintained with utmost care by    the municipal corporation.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in active voice with the semi-modal    construction 'used to + base verb (V1)'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• Active    rule: Subject + used to + V1 + Object</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• Passive    rule: Object + used to + be + V3 (past participle) + by + Subject</p>    <p style=\"orphans:0;widows:0\">Applying this rule, 'used to    maintain' changes to 'used to be maintained', making option B the    correct passive form.</p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Choose the most appropriate antonym of the underlined word.</b></p>    <p style=\"orphans:0;widows:0\">The explanation offered by the    suspect seemed <u><b>plausible</b></u> to the investigating    officer.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Reasonable</p>", "option2": " <p style=\"orphans:0;widows:0\">    Improbable</p>", "option3": " <p style=\"orphans:0;widows:0\">    Credible</p>", "option4": " <p style=\"orphans:0;widows:0\">    Acceptable</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>'plausible'</b> means seeming reasonable or probable    (believable).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Improbable</b>    means not likely to be true or to happen (unlikely/doubtful),    which is the exact antonym.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- <b>Reasonable</b>,    <b>Credible</b>, and <b>Acceptable</b> are synonyms or closely    related in meaning to 'plausible'.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct antonym is    <b>Improbable</b>.</p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    Identify the option in which the underlined idiom has been used    incorrectly.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Despite facing intense resistance from local residents, the    municipal commissioner decided to <u>take the bull by the horns</u>    by addressing the gathering directly and laying out the    rehabilitation plan.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Aware of the critical deadline, the senior architect resolved to    <u>burn the candle at both ends</u>, working late into the night    and arriving early every morning to complete the blueprints.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The managing director chose to <u>pour cold water on</u> the    marketing team's creative campaign by immediately sanctioning a    nationwide rollout and publicly applauding their ingenious    concept.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Instead of acknowledging the severe revenue shortfall, the    corporate board chose to <u>sweep it under the carpet</u>, hoping    that subsequent quarterly profits would conceal the losses.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The idiom <b>'pour cold water on'</b> means <i>to discourage,    criticise, or dampen enthusiasm for an idea, plan, or project</i>.    In option C, the managing director approved an immediate    nationwide rollout and publicly praised the concept, which    represents strong encouragement and approval rather than    discouragement. Therefore, the idiom has been used incorrectly in    this context.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other idioms:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Take the    bull by the horns:</b> To deal with a difficult situation in a    very direct and confident way.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Burn the    candle at both ends:</b> To work excessively hard, especially by    going to bed late and waking up early.</p>    <p style=\"orphans:0;widows:0\"><b>Sweep under the carpet:</b> To    hide or ignore an unpleasant or embarrassing problem rather than    dealing with it.</p>", "question_heading": ""}, {"sr_no": 18, "question": "Tुध ौधnपधncध giॅधn ृिधयथ iौ कiॅ iपद पयथोनक पुध ूिोnधप. Dधूिधपing यहन ीयनधौपौ पुनधोपधnौ पुध ीयहnकोपiयn यी यहन ौहनॅiॅोि, cोहौing ौधॅधनध धcिययgicोि कोंोgध पुोप cोnnयप ृध धोौiिद (5)________ Sिधधcप पुध ंयौप ोूूनयूनiोपध यूपiयn पय ीiिि in पुध ृिोnा Nय. 5", "option1": "<p style=\"orphans:0;widows:0\">    repeated</p>", "option2": " <p style=\"orphans:0;widows:0\">    justified</p>", "option3": " <p style=\"orphans:0;widows:0\">    repaired</p>", "option4": " <p style=\"orphans:0;widows:0\">    concealed</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The blank refers to ecological 'damage'. Physical or environmental    damage is typically restored, corrected, or 'repaired'. Therefore,    'repaired' is the most logical verb to conclude the sentence.</p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct direct form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">Neeta said that she had lost her    keys the previous day.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Neeta said, \"I lose my keys yesterday.\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    Neeta said, \"I lost my keys yesterday.\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    Neeta said, \"I have lost my keys yesterday.\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neeta said, \"I had lost my keys the previous day.\"</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the given sentence from indirect speech to direct    speech, the following rules are applied:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb 'said' remains unchanged and is followed by a comma and    inverted commas.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    conjunction 'that' is removed.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    third-person pronoun 'she' changes back to the first-person    pronoun 'I'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The past    perfect tense 'had lost' in indirect speech changes back to the    simple past tense 'lost' in direct speech when used with the past    time adverb 'yesterday'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The time    expression 'the previous day' changes back to 'yesterday'.</p>    <p style=\"orphans:0;widows:0\">Thus, the correct direct form is:    <b>Neeta said, \"I lost my keys yesterday.\"</b></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in direct    speech.</p>    <p style=\"orphans:0;widows:0\">Meera said that she had been    practicing classical dance since childhood.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Meera said, \"I was practicing classical dance since    childhood.\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    Meera said, \"I am practicing classical dance since    childhood.\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    Meera said, \"I have been practicing classical dance since    childhood.\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    Meera said, \"I had practiced classical dance since    childhood.\"</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert an indirect speech assertive sentence into direct    speech:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    reporting verb 'said' remains unchanged and the conjunction 'that'    is replaced with a comma and inverted commas.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. The    third-person pronoun 'she' changes to the first-person pronoun 'I'    corresponding to the subject 'Meera'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. The past    perfect continuous tense ('had been practicing') in indirect    speech reverts to the present perfect continuous tense ('have been    practicing') in direct speech.</p>    <p style=\"orphans:0;widows:0\">Thus, the correct direct sentence    is: <b>Meera said, \"I have been practicing classical dance    since childhood.\"</b></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct active form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The documents had been verified    by the inspector before the audit commenced.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The inspector verified the documents before the audit commenced.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The inspector has verified the documents before the audit    commenced.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The inspector had verified the documents before the audit    commenced.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The inspector was verifying the documents before the audit    commenced.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the Past Perfect Tense in the Passive    Voice (<b>had been + </b>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794847173292_html_a2a1051d25850e4a.gif\" > ).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The active    voice structure for the Past Perfect Tense is: <b>Subject + had +    </b>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794847173292_html_a2a1051d25850e4a.gif\" > <b>    + Object</b>.</p>    <p style=\"orphans:0;widows:0\">Therefore, 'The inspector had    verified the documents before the audit commenced' is the correct    active form.</p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that arranges the following sentences in a    logical and coherent order to form a meaningful paragraph:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A. Beneath    its shade, elders gathered every evening to share folklore.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B. These    stories had woven the community together for generations.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C. The    ancient banyan tree dominated the village square.</p>    <p style=\"orphans:0;widows:0\">D. Its sprawling branches    provided a cool canopy for tired travelers.</p>", "option1": "<p style=\"orphans:0;widows:0\">    CDAB</p>", "option2": " <p style=\"orphans:0;widows:0\">    CADB</p>", "option3": " <p style=\"orphans:0;widows:0\">    DCAB</p>", "option4": " <p style=\"orphans:0;widows:0\">    BADC</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct order is <b>CDAB</b>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>C</b>    is the introductory sentence as it introduces the central subject,    'The ancient banyan tree'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>D</b>    describes the tree's features, mentioning its 'sprawling branches'    and 'cool canopy'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>A</b>    logically connects to the canopy mentioned in D with 'Beneath its    shade' and introduces the elders sharing 'folklore'.</p>    <p style=\"orphans:0;widows:0\">Sentence <b>B</b> concludes the    paragraph by referencing 'These stories' (linking directly to    'folklore' in A).</p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct option to rearrange the following sentences    into a meaningful and coherent paragraph:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A. Within    minutes, a torrential downpour unleashed its fury.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B. Dark storm    clouds gathered rapidly over the quiet valley.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C. Travelers    scrambled frantically to find whatever shelter they could.</p>    <p style=\"orphans:0;widows:0\">D. Yet, the old stone inn stood    calm and welcoming amidst the chaos.</p>", "option1": "<p style=\"orphans:0;widows:0\">    BADC</p>", "option2": " <p style=\"orphans:0;widows:0\">    BACD</p>", "option3": " <p style=\"orphans:0;widows:0\">    ABCD</p>", "option4": " <p style=\"orphans:0;widows:0\">    BCAD</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sequence is <b>BACD</b>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>B</b>    introduces the setting and the initial event (dark storm clouds    gathering over the valley).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>A</b>    logically follows with the immediate consequence of the clouds    gathering ('Within minutes, a torrential downpour unleashed its    fury').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>C</b>    describes the reaction of the people to this downpour ('Travelers    scrambled frantically to find whatever shelter they could').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>D</b>    concludes the narrative with the contrastive connector 'Yet',    highlighting the refuge provided by the old stone inn amidst the    chaos.</p>    <p style=\"orphans:0;widows:0\">Therefore, the logical and    coherent arrangement is BACD.</p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct indirect form of the given sentence:</p>    <p style=\"orphans:0;widows:0\">The priest said to the gathering,    \"May peace and harmony prevail in our society.\"</p>", "option1": "<p style=\"orphans:0;widows:0\">    The priest prayed that peace and harmony might prevail in their    society.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The priest prayed that peace and harmony may prevail in their    society.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The priest wished that peace and harmony would prevail in our    society.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The priest told the gathering that peace and harmony could prevail    in our society.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is an optative sentence expressing a    prayer/wish. Rules for converting an optative sentence into    indirect speech are:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb 'said to' is changed into 'prayed' or 'wished'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    conjunction 'that' is used to connect the reporting clause and the    reported speech.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The optative    structure changes to an assertive structure: 'May + Subject +     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794847173292_html_6d47a5ab5429ad09.gif\" > '    changes to 'Subject + might +     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794847173292_html_6d47a5ab5429ad09.gif\" > '.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    possessive pronoun 'our' changes to 'their' according to the    speaker and context.</p>    <p style=\"orphans:0;widows:0\">Hence, the correct indirect    speech is: <b>The priest prayed that peace and harmony might    prevail in their society.</b></p>", "question_heading": ""}
