<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>21.) REASONING SECTIONAL TEST-3 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

r_no": 2, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a certain code language, ‘MASTER’ is written as ‘UCOPCR’ and ‘DOCTOR’ is written as ‘EQFPMR’. How will ‘PENCIL’ be written in that language?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PGRJGA</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PGRAGJ</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>RGPJGA</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PGRIFA</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed here is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Divide the 6-letter word into two equal halves of 3 letters each.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. In the first half, reverse the order of letters and add 2 to their positional values:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M A S → Reverse order: S A M</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>S + 2 = U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A + 2 = C</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M + 2 = O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>→ UCO</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. In the second half, reverse the order of letters and subtract 2 from their positional values:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T E R → Reverse order: R E T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>R - 2 = P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E - 2 = C</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T - 2 = R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>→ PCR</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, MASTER is coded as UCOPCR.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Similarly, for DOCTOR:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D O C → C O D → (+2) → EQF</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>T O R → R O T → (-2) → PMR</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, DOCTOR is coded as EQFPMR.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Applying the same logic to ‘PENCIL’:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First half: P E N → Reverse order: N E P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N + 2 = P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E + 2 = G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P + 2 = R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>→ PGR</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Second half: C I L → Reverse order: L I C</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L - 2 = J</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I - 2 = G</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C - 2 = A</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>→ JGA</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, PENCIL is written as </span><span style=\"font-weight:bold\">PGRJGA</span><span>.</span></p>", "question_heading": ""}, {"sr_no": 3, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the correct water image of the given figure.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image006.png\" width=\"200\" height=\"220\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image007.png\" width=\"160\" height=\"160\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image008.png\" width=\"160\" height=\"160\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image009.png\" width=\"160\" height=\"160\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image010.png\" width=\"160\" height=\"160\" alt ></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>When a water image (reflection across a horizontal mirror placed at the bottom) is formed:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The top and bottom rows interchange their positions: the bottom row (T, L) moves to the top row, and the top row (M, F) moves to the bottom row.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The middle row (R, A) remains in the middle.</span></p><p style=\"margin-top:0pt;margin-b tom:0pt;font-size:12pt\"><span>Only Conclusion II follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both Conclusion I and Conclusion II follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither Conclusion I nor Conclusion II follows</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Conclusion I does not follow because introducing an initiative to promote fitness does not imply that none of the students were fit prior to the decision; this is an extreme and unwarranted assumption.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Conclusion II does not follow because promoting fitness is an objective, but it does not guarantee that every single student will attain complete physical fitness.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, neither Conclusion I nor Conclusion II follows.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In this question, a statement followed by two judgements numbered I and II is given. You have to make a logical judgement according to the mentioned circumstances and choose the correct option.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statement: A municipal corporation has made it mandatory for residents to segregate household waste into wet and dry categories before disposal.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Judgement I: This measure will promote better recycling and more efficient waste management.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Judgement II: This measure will immediately make the city completely pollution-free.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only Judgement I follows</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only Judgement II follows</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both Judgements I and II follow</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither Judgement I nor II follows</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Judgement I follows because segregating waste at the source directly aids in scientific processing, composting of organic waste, and recycling of dry materials. Judgement II is an extreme and unrealistic conclusion, as waste segregation alone cannot immediately eradicate all forms of pollution (such as vehicular emissions, industrial waste, or noise pollution). Therefore, only Judgement I follows.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In this question, a scenario is provided. You have to make a logical judgment according to the mentioned circumstances and choose the most appropriate decision.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A software project manager receives complaints from team members about a technical lead's harsh and disrespectful remarks during code reviews, causing low morale among junior developers. However, under this lead's supervision, the team's software release has had the lowest defect rate in the company. How should the manager handle this situation to balance work culture and technical standards?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Immediately replace the technical lead to improve team morale.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Dismiss the team's complaints since maintaining zero-defect software is the ultimate goal.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Advise the junior developers to endure the harsh treatment for the sake of better project outcomes.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Counsel the technical lead on delivering constructive feedback while upholding high technical review standards.</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A balanced and professional administrative decision must resolve interpersonal issues without compromising technical excellence. Immediately replacing the technical lead (Option A) is disproportionate and could jeopardize project quality. Completely ignoring the complaints (Option B) or asking team members to endure harsh treatment (Option C) damages workplace culture and retention. The most logical and effective action is to mentor the technical lead to adopt constructive communication while sustaining rigorous standards (Option D).</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">You have just submitted an important project proposal to a client, but you immediately notice a significant budgeting miscalculation that underestimates the overall project cost. The client meeting to discuss the proposal is scheduled in two hours. What is the most professional and appropriate course of action?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Proceed with the meeting as planned and address the error only if the client identifies it.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Immediately send an updated version with a polite note explaining the revision before the meeting begins.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Cancel the meeting citing a personal emergency and ask for a complete reschedule next week.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Hold the junior team member who drafted the budget responsible and reprimand them during the meeting.</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Professional integrity and transparency are critical in business communication. Promptly acknowledging the mistake, sending the corrected version before the meeting, and being honest about the revision maintains client trust and credibility without causing unnecessary cancellations or shifting blame.</span></p>", "question_heading": ""}, {"sr_no": 16, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Read the given criteria carefully and evaluate the candidate's eligibility for the post of Junior Accounts Officer. Choose the most appropriate option that accurately reflects the candidate's status.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Eligibility Criteria (as on 01-07-2024):</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">1. Must hold a Bachelor's degree in Commerce (B.Com) or Finance with at least </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image049.png\" width=\"34\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> marks.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">2. Must be between 21 and 28 years of age.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">3. Must possess a valid certification in Tally or equivalent accounting software.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Case:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Neha is 24 years old and has graduated with a B.Com degree scoring </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image050.png\" width=\"34\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\"> marks. However, she does not possess any certification in Tally or equivalent accounting software. What should be decided in Neha's case?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neha is eligible for the post.</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neha is not eligible as she does not meet the age requirement.</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neha is not eligible due to the lack of certification in accounting software.</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neha is not eligible because her marks in B.Com are below the required threshold.</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Evaluating Neha's profile against each criterion:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Educational Qualification: She has a B.Com degree with </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image051.png\" width=\"32\" height=\"21\" alt style=\"vertical-align:middle\" ><span> marks, which satisfies the requirement of at least </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image052.png\" width=\"32\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Age: She is 24 years old, which falls between 21 and 28 years (satisfied).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. Certification: She lacks a certification in Tally or equivalent accounting software (not satisfied).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, Neha is not eligible due to the lack of certification in accounting software.</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Which is the WRONG term in the following series?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">C4X, F9U, I16R, L25P, O36L</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>F9U</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>L25P</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I16R</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>O36L</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The pattern followed in the given series is as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>First letter: C (+3) → F (+3) → I (+3) → L (+3) → O</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Middle number: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image053.png\" width=\"47\" height=\"21\" alt style=\"vertical-align:middle\" ><span>, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image054.png\" width=\"47\" height=\"21\" alt style=\"vertical-align:middle\" ><span>, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image055.png\" width=\"56\" height=\"21\" alt style=\"vertical-align:middle\" ><span>, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image056.png\" width=\"56\" height=\"21\" alt style=\"vertical-align:middle\" ><span>, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image057.png\" width=\"56\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Last letter: X (-3) → U (-3) → R (-3) → </span><span style=\"font-weight:bold\">O</span><span> (-3) → L</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, the term should be L25O instead of L25P. Hence, L25P is the wrong term.</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Based on the English alphabetical order, three of the following four letter-clusters are alike in a certain way and thus form a group. Which is the one that does not belong to that group?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(Note: The odd one out is not based on the number of consonants/vowels or their position in the letter cluster.)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KNQ</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FIL</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DGK</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>TWZ</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>According to the positional values of letters in the English alphabet:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>KNQ: K (11) + 3 = N (14); N (14) + 3 = Q (17) [Difference: +3, +3]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>FIL: F (6) + 3 = I (9); I (9) + 3 = L (12) [Difference: +3, +3]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>TWZ: T (20) + 3 = W (23); W (23) + 3 = Z (26) [Difference: +3, +3]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>DGK: D (4) + 3 = G (7); G (7) + 4 = K (11) [Difference: +3, +4]</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In all other clusters, the consecutive letters increase by +3, whereas in DGK, the difference between the second and third letter is +4. Therefore, DGK is the odd one out.</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Select the odd letter-cluster from the given alternatives.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>ZxVt</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>PnLj</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>TrPm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>VtRp</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In all the options except 'TrPm', the letters decrease by 2 in positional value at each step with alternating uppercase and lowercase letters:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A) Z(26) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image058.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> = x(24) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image058.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> = V(22) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image058.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> = t(20)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B) P(16) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image058.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> = n(14) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image058.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> = L(12) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image058.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> = j(10)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D) V(22) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image058.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> = t(20) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image058.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> = R(18) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image058.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> = p(16)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>In option C: T(20) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image058.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> = r(18) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image058.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> = P(16) </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image059.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> = m(13). The last step has a difference of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image059.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span> instead of </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image058.png\" width=\"25\" height=\"21\" alt style=\"vertical-align:middle\" ><span>.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, </span><span style=\"font-weight:bold\">TrPm</span><span> is the odd one.</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In each of the five pairs of letter-clusters, the letters in the second term are a transformed form of the letters in the first term following a particular pattern. In which two pairs has the transformation been done in the same way?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">A. DKR : GPT</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">B. MFW : QIB</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">C. HNV : KSX</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">D. PCL : TGO</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">E. UEY : ZJC</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A and D</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B and E</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A and C</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C and D</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let us check the positional shift between the letters of each pair:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>A. DKR : GPT</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D (+3) = G, K (+5) = P, R (+2) = T → Pattern: (+3, +5, +2)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>B. MFW : QIB</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M (+4) = Q, F (+3) = I, W (+5) = B → Pattern: (+4, +3, +5)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>C. HNV : KSX</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>H (+3) = K, N (+5) = S, V (+2) = X → Pattern: (+3, +5, +2)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D. PCL : TGO</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P (+4) = T, C (+4) = G, L (+3) = O → Pattern: (+4, +4, +3)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>E. UEY : ZJC</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>U (+5) = Z, E (+5) = J, Y (+4) = C → Pattern: (+5, +5, +4)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Thus, pairs A and C follow the exact same pattern of transformation (+3, +5, +2).</span></p>", "question_heading": ""}, {"sr_no": 21, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In the question, assuming the given statements to be true, find which of the conclusion(s) among the given two conclusions is/are definitely true and then give your answer accordingly.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statements: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image060.png\" width=\"108\" height=\"21\" alt style=\"vertical-align:middle\" ><span style=\"font-weight:bold\">; </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image061.png\" width=\"110\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bo ion is TRUE based on the given statements.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">P ≥ Q &gt; R, S &lt; T ≤ Q, U &gt; P, R ≥ V = W</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. U &gt; S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. T &gt; W</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion I is true</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Only conclusion II is true</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Neither conclusion I nor II is true</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Both conclusions I and II are true</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For Conclusion I: Combining the relevant parts, we get </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image074.png\" width=\"134\" height=\"21\" alt style=\"vertical-align:middle\" ><span>, which clearly gives </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image075.png\" width=\"41\" height=\"21\" alt style=\"vertical-align:middle\" ><span>. Hence, conclusion I is true.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>For Conclusion II: Combining the relations for T and W, we get </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image076.png\" width=\"236\" height=\"21\" alt style=\"vertical-align:middle\" ><span>. Since the inequality signs between T and W are in opposite directions, no definite relationship can be established between them. Hence, conclusion II is not true.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, only conclusion I is true.</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Directions: The symbols $, &amp;, %, # and @ are used with different meanings as follows:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'A $ B' means 'A is greater than or equal to B'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'A &amp; B' means 'A is smaller than or equal to B'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'A % B' means 'A is equal to B'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'A # B' means 'A is greater than B'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'A @ B' means 'A is smaller than B'</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Assuming the given statements to be true, find out which of the two conclusions I and II is/are definitely true.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Statements: D &amp; G, G % M, M # K</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. D @ M</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. G # K</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If only conclusion I is true</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If only conclusion II is true</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If either conclusion I or conclusion II is true</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>If both conclusions I and II are true</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Decoding the symbols according to the given meanings:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>$ stands for </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image077.png\" width=\"21\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>&amp; stands for </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image020.png\" width=\"21\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>% stands for </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image078.png\" width=\"21\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span># stands for </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image019.png\" width=\"21\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>@ stands for </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image030.png\" width=\"21\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Given statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>D &amp; G </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image079.png\" width=\"56\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>G % M </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image080.png\" width=\"59\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M # K </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image081.png\" width=\"60\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Combining the statements:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image082.png\" width=\"109\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Evaluating conclusions:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>I. D @ M </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image083.png\" width=\"60\" height=\"21\" alt style=\"vertical-align:middle\" ><span>: From </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image084.png\" width=\"77\" height=\"21\" alt style=\"vertical-align:middle\" ><span>, we get </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image085.png\" width=\"46\" height=\"21\" alt style=\"vertical-align:middle\" ><span>. Thus, </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image086.png\" width=\"46\" height=\"21\" alt style=\"vertical-align:middle\" ><span> is not definitely true.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>II. G # K </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image087.png\" width=\"57\" height=\"21\" alt style=\"vertical-align:middle\" ><span>: Since </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image088.png\" width=\"45\" height=\"21\" alt style=\"vertical-align:middle\" ><span> and </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image089.png\" width=\"46\" height=\"21\" alt style=\"vertical-align:middle\" ><span>, it follows that </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794797811776_image090.png\" width=\"43\" height=\"21\" alt style=\"vertical-align:middle\" ><span>. Thus, conclusion II is definitely true.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Therefore, only conclusion II is true.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In a certain code language,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">‘P + Q’ means ‘P is the son of Q’,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">‘P – Q’ means ‘P is the wife of Q’,</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">‘P × Q’ means ‘P is the brother of Q’, and</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">‘P ÷ Q’ means ‘P is the mother of Q’.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">How is U related to X if 'U ÷ V × W – X'?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Mother's sister</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Wife's mother</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Brother's wife</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Wife's sister</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>From the given expression 'U ÷ V × W – X':</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 'U ÷ V' implies that U is the mother of V.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 'V × W' implies that V is the brother of W (so U is also the mother of W).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. 'W – X' implies that W is the wife of X.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Since W is the wife of X and U is the mother of W, U is the mother of X's wife (Wife's mother).</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Seven people, P, Q, R, S, T, U and V, are sitting in a straight row, facing north. S sits at the extreme right end of the row. Only two people sit between S and P. R sits second to the left of P. V sits to the left of R. Q sits to the immediate right of U. How many people sit between R and Q?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Let the seven positions from left to right be 1, 2, 3, 4, 5, 6, and 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. S sits at the extreme right end, so S is at position 7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. Only two people sit between S and P, which places P at position 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. R sits second to the left of P, so R is at position 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. V sits to the left of R, so V must be at position 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. Q sits to the immediate right of U, so U and Q must occupy adjacent positions. The only adjacent empty spots are 5 and 6, so U is at position 5 and Q is at position 6.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. The remaining person, T, sits at position 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The final arrangement from left to right is: V, R, T, P, U, Q, S.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The people sitting between R (position 2) and Q (position 6) are T, P, and U. Thus, there are </span><span style=\"font-weight:bold\">three</span><span> people between R and Q.</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">Eight persons P, Q, R, S, T, U, V and W are sitting around a square table facing the centre. Four of them sit at the four corners while four sit in the middle of the four sides. R sits in the middle of one of the sides. W sits second to the left of R. Only three persons sit between W and S. T sits to the immediate left of W. P does not sit adjacent to S. Q sits second to the right of P. U is not an immediate neighbour of S. How many persons sit between S and P when counted from the right of S?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>One</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Two</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Three</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Four</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. Let the 8 positions around the square table in clockwise order be 1 to 8, where 1, 3, 5, 7 are corners and 2, 4, 6, 8 are the middle of the sides.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. R sits in the middle of a side, so place R at position 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. W sits second to the left of R (clockwise), so W is at position 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. Only three persons sit between W and S, meaning S sits directly opposite W at position 8.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. T sits to the immediate left of W, so T is at position 5 (corner).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. P does not sit adjacent to S (positions 7 and 1 are ruled out). If P were at position 6, second to the right would be position 4 (already occupied by W). Thus, P must be at position 3 (corner).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7. Q sits second to the right of P (anti-clockwise), so Q is at position 1 (corner).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>8. U is not an immediate neighbour of S, so U sits at position 6 (middle) and V sits at position 7 (corner).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>The arrangement in clockwise order is: Q (corner), R (side), P (corner), W (side), T (corner), U (side), V (corner), S (side).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Counting from the right of S (anti-clockwise) to P, the persons seated in between are V, U, T, and W. Thus, there are 4 persons.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">In the following question, a series of letters is given with some blanks. Select the combination of letters from the given options that, when sequentially inserted into the blanks, will complete the series logically.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">G _ R T B _ L R _ B G L _ T _ _ L R T _</span></p>", "option1":
