<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>28.) QUANT SECTIONAL TEST-4 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

const questions = [{"sr_no": 1, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Two runners start simultaneously from the same point on a circular track 1.44 km long and run in the same direction at 10.8 km/h and 25.2 km/h. How many times will they meet at points other than the starting point before they meet for the first time at the starting point?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Same direction: they meet anywhere every L ÷ (v₂ − v₁); they meet at the starting point at the LCM of their lap times.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. 10.8 km/h = 3 m/s and 25.2 km/h = 7 m/s. Time between meetings anywhere = 1440 ÷ (7 − 3) = 360 s.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Lap times: 1440/3 = 480 s and 1440/7 s. Both are at the start together when 480k = (1440/7)m ⇒ m = 7k/3 ⇒ first at k = 3, i.e. T = 1440 s.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Meetings occur at 360, 720, 1080 and 1440 s; the one at 1440 s is at the starting point.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Meetings at other points before that = 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>5. Check: in 1440 s the faster runner completes 7 laps and the slower 3 laps, a gain of 4 laps ⇒ 4 meetings in all ✓</span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>The average of 9 consecutive odd integers is 53. If the next 4 consecutive odd integers are also included, what is the difference between the new average and the smallest of all 13 integers?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>16</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>14</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>10</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>12</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: The average of consecutive odd integers equals the middle term; consecutive odd integers differ by 2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. For the first 9 integers the middle (5th) term is 53 ⇒ smallest = 53 − 8 = 45 and largest = 61.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. The next 4 integers are 63, 65, 67, 69; all 13 integers run from 45 to 69.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. New average = middle (7th) term = 45 + 12 = 57.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Difference = 57 − 45 = 12.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>5. Check: 9 × 53 + (63 + 65 + 67 + 69) = 477 + 264 = 741 = 13 × 57 ✓</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>A non-leap year and a leap year are selected at random independently. What is the probability that both years have 53 Mondays?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3/49</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>15/49</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1/7</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2/49</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Probability = favourable cases ÷ total equally likely cases; for independent events, multiply the probabilities.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Non-leap year: 365 = 52 weeks + 1 day; the extra day is a Monday with probability 1/7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Leap year: 366 = 52 weeks + 2 days; of the 7 equally likely pairs, those containing Monday are (Sun, Mon) and (Mon, Tue) ⇒ 2/7.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Both years: 1/7 × 2/7 = 2/49.</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>A 50 m long ladder leans against a vertical wall with its foot 14 m from the wall. If the top of the ladder slides down by 8 m, by how much does the foot of the ladder slide away from the wall?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>18 m</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>16 m</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>14 m</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>12 m</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Pythagoras theorem: ladder² = height² + base².</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Initial height = √(50² − 14²) = √2304 = 48 m.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. New height = 48 − 8 = 40 m.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. New base = √(50² − 40²) = √900 = 30 m.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Foot slides away by 30 − 14 = 16 m.</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>The mean and standard deviation of 8 observations are 25 and 4 respectively. If every observation is multiplied by −2.5 and then increased by 15, find the sum of the new mean and the new variance.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>147.5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>62.5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>52.5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>102.5</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: If y = ax + b then mean(y) = a·mean(x) + b, SD(y) = |a|·SD(x) and variance(y) = a²·variance(x).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. New mean = (−2.5)(25) + 15 = −62.5 + 15 = −47.5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Original variance = 4² = 16; adding 15 does not change the spread and the sign of a does not matter.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. New variance = (−2.5)² × 16 = 6.25 × 16 = 100.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Sum = −47.5 + 100 = 52.5.</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Four identical circles of radius 10.5 cm touch each other externally such that their centres form a square. Find the perimeter of the enclosed region between the four circles. (Take π = 22/7)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>42 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>132 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>66 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>84 cm</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: The enclosed region is bounded by four quarter-circle arcs, which together make one full circumference 2πr.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Each arc lies between two touching points and subtends 90° at its centre (the centres form a square).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Four arcs of 90° = 360° = one full circle of radius 10.5 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Perimeter = 2 × (22/7) × 10.5 = 66 cm.</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>How many positive divisors of 2160 are multiples of 6 but not multiples of 15?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>18</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>16</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>24</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>12</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: If N = pᵃ qᵇ rᶜ, every divisor has the form pⁱ qʲ rᵏ with 0 ≤ i ≤ a, 0 ≤ j ≤ b, 0 ≤ k ≤ c.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. 2160 = 2⁴ × 3³ × 5¹.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Multiple of 6 ⇒ power of 2 is 1, 2, 3 or 4 (4 choices) and power of 3 is 1, 2 or 3 (3 choices).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Not a multiple of 15: the factor 3 is already present, so 5 must be absent ⇒ power of 5 is 0 (1 choice).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Total = 4 × 3 × 1 = 12.</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>In △ABC, AB = 18 cm, AC = 24 cm and BC = 28 cm. AD is the internal bisector of ∠BAC meeting BC at D. Find the length of AD.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>12√2 cm</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4√15 cm</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>6√7 cm</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>16 cm</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Angle bisector theorem: BD/DC = AB/AC; bisector length: AD² = AB · AC − BD · DC.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. BD/DC = 18/24 = 3/4 and BC = 28 ⇒ BD = 12 cm and DC = 16 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. AD² = 18 × 24 − 12 × 16 = 432 − 192 = 240.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. AD = √240 = 4√15 cm.</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>A boat takes 7 hours 12 minutes to cover 36 km upstream and 54 km downstream, and 8 hours 6 minutes to cover 48 km upstream and 42 km downstream. Find the speed of the stream (in km/h).</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4.5 km/h</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>7.5 km/h</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>5.0 km/h</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>6.0 km/h</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Time = Distance ÷ Speed; let 1/(upstream speed) = a and 1/(downstream speed) = b.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. 36a + 54b = 7.2 ⇒ 2a + 3b = 0.4 …(i); 48a + 42b = 8.1 ⇒ 16a + 14b = 2.7 …(ii).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. (i) × 8: 16a + 24b = 3.2; subtract (ii): 10b = 0.5 ⇒ b = 1/20 ⇒ downstream speed = 20 km/h.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. 2a = 0.4 − 0.15 = 0.25 ⇒ a = 1/8 ⇒ upstream speed = 8 km/h.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Speed of stream = (20 − 8) ÷ 2 = 6 km/h.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>5. Check: 36/8 + 54/20 = 7.2 h and 48/8 + 42/20 = 8.1 h ✓</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>A solid toy consists of a right circular cone of base radius 10.5 cm mounted on a hemisphere of the same radius. If the total volume of the toy is 4042.5 cm³, find its total surface area. (Take π = 22/7)</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1270.5 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1524.5 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1419.0 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1386.0 cm²</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Volume = (1/3)πr²h + (2/3)πr³ = (1/3)πr²(h + 2r); TSA = πrl + 2πr², where l = √(h² + r²).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. (1/3)(22/7)(10.5)² = 115.5, so 115.5 × (h + 21) = 4042.5 ⇒ h + 21 = 35 ⇒ h = 14 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Slant height l = √(14² + 10.5²) = 17.5 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. TSA = (22/7)(10.5)(17.5) + 2(22/7)(10.5)² = 577.5 + 693 = 1270.5 cm².</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>What is the smallest positive integer k such that 3960 × k is a perfect cube AND divisible by 125?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3,025</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>18,150</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>9,075</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4,125</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: In a perfect cube every prime has an exponent that is a multiple of 3; 125 = 5³.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. 3960 = 2³ × 3² × 5 × 11.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. 2³ is already a cube; 3² needs one more 3; 5¹ must become 5³ (also giving divisibility by 125) so it needs 5²; 11¹ needs 11².</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. k = 3 × 5² × 11² = 3 × 25 × 121 = 9,075.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Check: 3960 × 9075 = 35,937,000 = 330³ ✓</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>In △ABC, D divides BC in the ratio 2 : 3, and E is the midpoint of AD. F is a point on AC such that AF : FC = 1 : 3. If the area of △ABC is 240 cm², find the area of △EFC.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>48 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>60 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>36 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>54 cm²</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Triangles with the same height have areas in the ratio of their bases.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. BD : DC = 2 : 3 ⇒ area(△ADC) = (3/5) × 240 = 144 cm².</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. E is the midpoint of AD ⇒ area(△AEC) = 144 ÷ 2 = 72 cm².</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. △AEC and △FEC share the vertex E and have bases AC and FC with FC = (3/4)AC ⇒ area(△EFC) = (3/4) × 72 = 54 cm².</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Train A (280 m long) overtakes a man walking at 7.2 km/h in the same direction in 20 seconds. How long will Train A take to completely cross Train B (320 m long) approaching from the opposite direction at 50.4 km/h?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>22.5 seconds</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>20 seconds</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>18 seconds</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>24 seconds</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Same direction: relative speed = difference of speeds; opposite direction: relative speed = sum of speeds.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Relative speed with the man = 280 ÷ 20 = 14 m/s; the man's speed = 7.2 × 5/18 = 2 m/s ⇒ speed of A = 16 m/s.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Speed of B = 50.4 × 5/18 = 14 m/s.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Opposite directions: relative speed = 16 + 14 = 30 m/s.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Time = (280 + 320) ÷ 30 = 20 seconds.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>The mean of 10 observations is 24. The mean of the first 6 observations is 22 and the mean of the last 6 observations is 28. Find the mean of the two observations that are common to both groups (the 5th and 6th observations).</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>33</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>27</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>30</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>24</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Sum = mean × number of observations; observations that belong to both groups are counted twice when the two group sums are added.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Sum of all 10 observations = 10 × 24 = 240.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Sum of the first 6 = 6 × 22 = 132; sum of the last 6 = 6 × 28 = 168.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. 6 + 6 − 10 = 2 observations (the 5th and 6th) are common, so 132 + 168 = 240 + (sum of the 2 common observations).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Sum of the 2 common observations = 300 − 240 = 60 ⇒ their mean = 30.</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>A takes 6 days less than B to finish a task, while C takes 18 days more than B. Working together, A and B can complete the task in 7.2 days. In how many days can B and C together complete 75% of the task?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>8 days</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>7.5 days</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>9 days</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>9.6 days</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Work rate = 1 ÷ (days taken); rates of workers who work together add up.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Let B take x days, so A takes (x − 6) days: 1/(x − 6) + 1/x = 1/7.2 = 5/36.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. 36(2x − 6) = 5x(x − 6) ⇒ 5x² − 102x + 216 = 0 ⇒ x = 18 (the other root 2.4 is rejected because A's time x − 6 would be negative).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. B = 18 days, A = 12 days, C = 36 days.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Rate of B + C = 1/18 + 1/36 = 1/12 ⇒ the whole task takes 12 days.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>5. 75% of the task takes 0.75 × 12 = 9 days.</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>A right circular cone of height 24 cm and base radius 18 cm is cut by a plane parallel to its base at a height of 16 cm from the base. Find the ratio of the curved surface area of the smaller cone formed to the total surface area of the frustum.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1 : 14</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1 : 12</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1 : 15</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1 : 16</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: The smaller cone is similar to the whole cone, so its radius, height and slant height are in the same ratio as its height.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Smaller cone height = 24 − 16 = 8 cm ⇒ scale 8/24 = 1/3 ⇒ r₁ = 6 cm and l₁ = 10 cm (whole cone: l = √(24² + 18²) = 30 cm).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. CSA of smaller cone = π(6)(10) = 60π; CSA of whole cone = π(18)(30) = 540π ⇒ CSA of frustum = 480π.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. TSA of frustum = 480π + π(6²) + π(18²) = 480π + 360π = 840π.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Ratio = 60π : 840π = 1 : 14.</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Simplify: [2 + 1/(1 + 2/(3 + 1/4))] ÷ [3 − 2/(2 + 1/(1 + 2/3))]</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>55/29</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>715/609</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>609/715</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>13/11</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Simplify the innermost fractions first and work outwards.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Numerator: 3 + 1/4 = 13/4 ⇒ 2 ÷ (13/4) = 8/13 ⇒ 1 + 8/13 = 21/13 ⇒ 2 + 13/21 = 55/21.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. Denominator: 1 + 2/3 = 5/3 ⇒ 2 + 3/5 = 13/5 ⇒ 3 − 2 ÷ (13/5) = 3 − 10/13 = 29/13.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Value = (55/21) ÷ (29/13) = (55/21) × (13/29) = 715/609.</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>The probabilities that A, B and C independently solve a problem are 2/3, 3/4 and 2/5 respectively. Given that the problem is solved, what is the probability that at most two of them solved it?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>15/19</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>11/19</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>17/20</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3/5</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Conditional probability: P(E | F) = P(E ∩ F) ÷ P(F).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. P(none solves) = (1/3)(1/4)(3/5) = 1/20 ⇒ P(solved) = 19/20.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. P(all three solve) = (2/3)(3/4)(2/5) = 1/5 = 4/20.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. 'Solved and at most two solved it' = solved but not all three = 19/20 − 4/20 = 15/20.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Required probability = (15/20) ÷ (19/20) = 15/19.</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Six years ago, the ratio of the ages of a father and his son was 11 : 3. Four years from now, the ratio of their ages will be 13 : 5. What will be the ratio of their ages 9 years from now?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2 : 1</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>7 : 3</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>14 : 5</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>9 : 4</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: The difference between two ages stays constant with time.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Six years ago the ratio was 11 : 3 (difference = 8 parts); four years later it is 13 : 5 (difference = 8 parts) – the same difference, so one part has the same value in both ratios.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. The son's age: 3 parts + 10 years = 5 parts ⇒ 2 parts = 10 years ⇒ 1 part = 5 years.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Six years ago: father 55 and son 15 ⇒ present ages 61 and 21 years.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. After 9 years: 70 and 30 ⇒ ratio 7 : 3.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>5. Check: four years from now 65 : 25 = 13 : 5 ✓</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Find the minimum value of 16 sec²θ + 25 cosec²θ − 12.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>81</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>31</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>69</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>28</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: sec²θ = 1 + tan²θ and cosec²θ = 1 + cot²θ; then use AM–GM: a + b ≥ 2√(ab).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. 16(1 + tan²θ) + 25(1 + cot²θ) − 12 = 29 + 16 tan²θ + 25 cot²θ.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. 16 tan²θ + 25 cot²θ ≥ 2√(16 × 25) = 40, with equality when tan⁴θ = 25/16 (attainable).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Minimum value = 29 + 40 = 69.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Check with (√16 + √25)² − 12 = 81 − 12 = 69 ✓</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>If x = 9 + 4√5, find the value of x√x − 1/(x√x).</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>80</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>68</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>72</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>76</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: a³ − b³ = (a − b)³ + 3ab(a − b).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. 9 + 4√5 = (2 + √5)² ⇒ √x = 2 + √5 and 1/√x = √5 − 2 (because (√5 + 2)(√5 − 2) = 1).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. √x − 1/√x = (2 + √5) − (√5 − 2) = 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. x√x − 1/(x√x) = (√x)³ − (1/√x)³ = 4³ + 3(1)(4) = 64 + 12 = 76.</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>A man spends 20% of his income on rent, 35% of the remainder on food and utilities, and 30% of what is then left on EMI. From the remaining balance, he donates ₹1,840 to charity and deposits the rest, which equals 30% of his total monthly income, into a savings account. Find his monthly income.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>₹30,000</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>₹27,500</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>₹28,750</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>₹32,500</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Amount left after a p% deduction = previous amount × (1 − p/100).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Let income = I. After rent: 0.8I. After food and utilities: 0.65 × 0.8I = 0.52I. After EMI: 0.7 × 0.52I = 0.364I.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. 0.364I − 1840 = 0.30I ⇒ 0.064I = 1840.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. I = 1840 ÷ 0.064 = ₹28,750.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Check: 0.364 × 28,750 = 10,465; 10,465 − 1,840 = 8,625 = 30% of 28,750 ✓</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>A loan of ₹13,240 is to be repaid in three equal annual instalments at 10% p.a. compound interest. Find the value of each annual instalment.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>₹5,324</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>₹4,840</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>₹5,120</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>₹5,456</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: For three equal instalments x at rate r: P = x/(1 + r) + x/(1 + r)² + x/(1 + r)³.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. P = x(10/11 + 100/121 + 1000/1331) = x(1210 + 1100 + 1000)/1331 = 3310x/1331.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. x = 13,240 × 1331 ÷ 3310 = 4 × 1331 = ₹5,324.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Check: 5324/1.1 = 4840; 5324/1.21 = 4400; 5324/1.331 = 4000; 4840 + 4400 + 4000 = 13,240 ✓</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>A regular octagon is inscribed inside a circle of radius R such that its side length is 8 cm. Find the difference between the area of the regular octagon and the area of the square formed by joining every alternate vertex of the octagon.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>64√2 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>128 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>64 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>128(√2 − 1) cm²</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Area of a regular octagon of side a = 2(1 + √2)a²; its side a = R√(2 − √2); a square inscribed in the circle has diagonal 2R.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Area of octagon = 2(1 + √2) × 64 = 128(1 + √2).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. R² = a² ÷ (2 − √2) = 64(2 + √2)/2 = 32(2 + √2).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. The square joining alternate vertices has diagonal 2R ⇒ area = (2R)²/2 = 2R² = 64(2 + √2) = 128 + 64√2.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Difference = 128 + 128√2 − 128 − 64√2 = 64√2 cm².</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>In an arithmetic progression, the sum of the first 15 terms is 465, and the ratio of the 6th term to the 11th term is 5 : 8. Find the sum of the first 25 terms of this AP.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1,350</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1,150</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1,250</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1,050</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Sₙ = (n/2)[2a + (n − 1)d]; Tₙ = a + (n − 1)d.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. S₁₅ = 15(a + 7d) = 465 ⇒ a + 7d = 31 …(i).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. (a + 5d) ÷ (a + 10d) = 5/8 ⇒ 8a + 40d = 5a + 50d ⇒ 3a = 10d …(ii).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. From (ii): a = 10d/3; in (i): 10d/3 + 7d = 31 ⇒ 31d/3 = 31 ⇒ d = 3 and a = 10.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. S₂₅ = (25/2)[2(10) + 24(3)] = (25/2)(92) = 1,150.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>5. Check: T₆ = 25 and T₁₁ = 40 ⇒ 25 : 40 = 5 : 8 ✓</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Let N be the smallest 4-digit number which when divided by 15, 20 and 24 leaves remainders 11, 16 and 20 respectively, and is divisible by 13. Find the sum of the digits of N.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>15</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>17</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>13</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>19</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: If divisor − remainder is the same constant c each time, N = (LCM × k) − c.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. 15 − 11 = 20 − 16 = 24 − 20 = 4 and LCM(15, 20, 24) = 120 ⇒ N = 120k − 4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. 120 ≡ 3 (mod 13), so 3k − 4 ≡ 0 ⇒ 3k ≡ 4 ⇒ k ≡ 10 (mod 13) (3 × 10 = 30 ≡ 4).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. k = 10 gives N = 1196 = 13 × 92, the smallest 4-digit value (k = 9 gives 1076, which is not divisible by 13).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Sum of digits = 1 + 1 + 9 + 6 = 17.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>For what value of k does the system of equations (k − 2)x + 6y = 3k + 1 and 2x + (k + 2)y = 5k − 3 have no solution?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>−4</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Both 4 and −4</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: No solution exists when a₁/a₂ = b₁/b₂ ≠ c₁/c₂.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. (k − 2)/2 = 6/(k + 2) ⇒ k² − 4 = 12 ⇒ k = ±4.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. For k = 4: a₁/a₂ = b₁/b₂ = 1 but c₁/c₂ = 13/17 ≠ 1 ⇒ no solution.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. For k = −4: a₁/a₂ = b₁/b₂ = −3 but c₁/c₂ = (−11)/(−23) = 11/23 ≠ −3 ⇒ no solution.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. So both 4 and −4 work.</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>PA and PB are tangents from an external point P to a circle with centre O and radius 9 cm. If OP = 15 cm, find the area of △OAB.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>48.6 cm²</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>43.2 cm²</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>38.88 cm²</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>32.4 cm²</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Tangent ⟂ radius at the point of contact; OP is the perpendicular bisector of the chord AB.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. PA = √(15² − 9²) = 12 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. In right △OAP with altitude AM on OP: AM = (OA × AP) ÷ OP = (9 × 12) ÷ 15 = 7.2 cm ⇒ AB = 14.4 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. OM = √(9² − 7.2²) = 5.4 cm.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Area of △OAB = ½ × 14.4 × 5.4 = 38.88 cm².</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Find the value of [log₁₀(tan 1° · tan 2° ⋯ tan 89°) + (cos²5° + cos²10° + ⋯ + cos²85°)] ÷ [sin 15° cos 75° + cos 15° sin 75°].</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>9.5</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>8.5</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>8</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>9</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: tan θ · tan(90° − θ) = 1; cos²θ + cos²(90° − θ) = 1; sin A cos B + cos A sin B = sin(A + B).</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. tan 1° ⋯ tan 89° = 1 ⇒ log₁₀(1) = 0.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. cos²5° + … + cos²85° has 17 terms: 8 complementary pairs (5°, 85°) … (40°, 50°) each giving 1, plus cos²45° = 0.5 ⇒ 8.5.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Denominator = sin(15° + 75°) = sin 90° = 1.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>4. Value = (0 + 8.5) ÷ 1 = 8.5.</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Find the area (in square units) of the triangle whose vertices are A(−2, 3), B(4, −1) and C(6, 7), and also find the length of the altitude from C to AB.</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>28 sq. units, 28/√13 units</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>24 sq. units, 24/√13 units</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>32 sq. units, 32/√13 units</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>28 sq. units, 14/√13 units</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Formula: Area = ½ |x₁(y₂ − y₃) + x₂(y₃ − y₁) + x₃(y₁ − y₂)|; altitude = 2 × Area ÷ base.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>Steps:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>1. Area = ½ |−2(−1 − 7) + 4(7 − 3) + 6(3 + 1)| = ½ |16 + 16 + 24| = 28 square units.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>2. AB = √((4 + 2)² + (−1 − 3)²) = √52 = 2√13.</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;page-break-after:avoid;font-size:12pt\"><span>3. Altitude from C = (2 × 28) ÷ (2√13) = 28/√13 units.</span></p>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
