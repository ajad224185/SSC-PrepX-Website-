<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>15.) REASONING SECTIONAL TEST-2 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image007.jpeg\" width=\"513\" height=\"425\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः S, U के पिता के भाई की पत्नी यानी चाची है।</span></p>", "question_heading": ""}, {"sr_no": 4, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">जब दिए गए आरेख को मोड़कर एक घन बनाया जाता है, तो त्रिभुज (△) वाले फलक के विपरीत फलक पर कौन-सा प्रतीक होगा?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image008.png\" width=\"240\" height=\"280\" alt ></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image009.png\" width=\"100\" height=\"100\" alt ></p>", "option2": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image010.png\" width=\"100\" height=\"100\" alt ></p>", "option3": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image011.png\" width=\"100\" height=\"100\" alt ></p>", "option4": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image012.png\" width=\"100\" height=\"100\" alt ></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>घन के खुले हुए प्रसार (नेट) में, किसी सीधी रेखा (स्तंभ या पंक्ति) में एकांतर फलक एक-दूसरे के विपरीत होते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चार फलकों के ऊर्ध्वाधर स्तंभ को देखने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. पहला फलक (वृत्त), तीसरे फलक (षट्भुज) के विपरीत है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. दूसरा फलक (धन चिह्न '+'), चौथे फलक (त्रिभुज '△') के विपरीत है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. दोनों बाहरी फलक (समचतुर्भुज और वर्ग) मुड़कर एक-दूसरे के विपरीत फलक बनाते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, त्रिभुज (△) के विपरीत फलक पर धन चिह्न (+) होगा, जो विकल्प (B) में है।</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निम्नलिखित प्रश्न में एक कथन दिया गया है, जिसके बाद दो निष्कर्ष दिए गए हैं। कथन को सत्य मानिए, भले ही वह सामान्यतः ज्ञात तथ्यों के विपरीत प्रतीत होता हो। निष्कर्षों को ध्यानपूर्वक पढ़िए और निर्णय कीजिए कि उनमें से कौन-सा/कौन-से निष्कर्ष दिए गए कथन से तार्किक रूप से अनुसरण करता है/करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कथन:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">शहरी परिवहन की एक हालिया रिपोर्ट के अनुसार, लगभग 70% कार्यालय जाने वालों ने कहा कि वे यात्रा में अधिक समय लगने के बावजूद निजी वाहनों की तुलना में सार्वजनिक वातानुकूलित (एसी) बसों का उपयोग करना पसंद करते हैं, मुख्य रूप से इसलिए क्योंकि यह भारी ट्रैफिक में गाड़ी चलाने के तनाव को कम करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. दैनिक शहरी आवागमन के लिए निजी वाहन पूरी तरह से अनुपयुक्त हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. सर्वेक्षण में शामिल अधिकांश कार्यालय जाने वालों के लिए यात्रा के समय की बचत करने की तुलना में वाहन चलाने के तनाव से बचना अधिक महत्वपूर्ण है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष I अनुसरण करता है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष II अनुसरण करता है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निष्कर्ष I और II दोनों अनुसरण करते हैं</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो निष्कर्ष I और न ही निष्कर्ष II अनुसरण करता है</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">निष्कर्ष I अनुसरण नहीं करता है:</span><span> कथन केवल ड्राइविंग के तनाव से बचने के लिए यात्रियों की पसंद को दर्शाता है; यह दावा करना कि निजी वाहन 'पूरी तरह से अनुपयुक्त' हैं, एक अतिशयोक्तिपूर्ण और निराधार निष्कर्ष है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">निष्कर्ष II अनुसरण करता है:</span><span> चूँकि सर्वेक्षण में शामिल लगभग 70% (स्पष्ट बहुमत) लोग यात्रा में अधिक समय लगने के बावजूद ड्राइविंग के तनाव से बचने के लिए सार्वजनिक बस चुनते हैं, इससे सीधा निष्कर्ष निकलता है कि उनके लिए यात्रा के समय की बचत की तुलना में तनाव से बचना अधिक महत्वपूर्ण है।</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">यदि '+' का अर्थ '−', '−' का अर्थ '×', '×' का अर्थ '÷', और '÷' का अर्थ '+' है, तो निम्नलिखित में से कौन-सा समीकरण सही है?</span></p>", "option1": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</ =\"font-weight:bold\">उत्तर की ओर उन्मुख छात्रों की एक पंक्ति में, कुणाल बायें छोर से 17वें स्थान पर है और मोहित दायें छोर से 23वें स्थान पर है। कुणाल अपने दायें 5 स्थान खिसकता है और पाता है कि वह रोहित के बायें 4 स्थान पर है, जो कुणाल के नए स्थान और मोहित के ठीक मध्य में बैठा है। यदि मोहित, कुणाल के दायें स्थित है, तो पंक्ति में कुल कितने छात्र हैं?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>48</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>50</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>52</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>54</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. बायें छोर से कुणाल का प्रारंभिक स्थान = 17वाँ।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. अपने दायें 5 स्थान खिसकने के बाद, बायें छोर से कुणाल का नया स्थान = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image027.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ><span>वाँ।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. कुणाल, रोहित के बायें 4 स्थान पर है, इसलिए बायें छोर से रोहित का स्थान = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image028.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ><span>वाँ।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. चूंकि रोहित, कुणाल के नए स्थान और मोहित के ठीक मध्य में बैठा है, इसलिए रोहित और मोहित के बीच की दूरी भी 4 स्थान होगी। अतः बायें छोर से मोहित का स्थान = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image029.png\" width=\"85\" height=\"21\" alt style=\"vertical-align:middle\" ><span>वाँ।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. मोहित का दायें छोर से स्थान 23वाँ दिया गया है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. पंक्ति में छात्रों की कुल संख्या = बायें से स्थान</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image030.png\" width=\"20\" height=\"21\" alt style=\"vertical-align:middle\" ><span>दायें से स्थान</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image031.png\" width=\"167\" height=\"21\" alt style=\"vertical-align:middle\" ><span>।</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">नीचे तीन कथन और उसके बाद तीन निष्कर्ष I, II और III दिए गए हैं। दिए गए कथनों को सत्य मानकर, भले ही वे ज्ञात तथ्यों से अलग प्रतीत होते हों, निर्णय कीजिए कि दिए गए निष्कर्षों में से कौनसा निष्कर्ष कथनों का तार्किक रूप से अनुसरण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कथन:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कुछ दर्पण, कांच हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कुछ कांच, खिड़कियां हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">सभी खिड़कियां, दरवाजे हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(I) कुछ दरवाजे, कांच हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(II) कुछ दरवाजे, दर्पण हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(III) कुछ खिड़कियां, दर्पण हैं।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निष्कर्ष I और III दोनों अनुसरण करते हैं।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष I अनुसरण करता है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निष्कर्ष I और II दोनों अनुसरण करते हैं।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष III अनुसरण करता है।</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए कथनों से:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. 'कुछ कांच, खिड़कियां हैं' (I-प्रकार) + 'सभी खिड़कियां, दरवाजे हैं' (A-प्रकार) से निष्कर्ष निकलता है कि 'कुछ कांच, दरवाजे हैं' (I-प्रकार)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>'कुछ कांच, दरवाजे हैं' का परिवर्तन करने पर प्राप्त होता है कि 'कुछ दरवाजे, कांच हैं'। अतः, निष्कर्ष I तार्किक रूप से अनुसरण करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. 'दर्पण' केवल 'कांच' से एक आंशिक कथन ('कुछ दर्पण, कांच हैं') द्वारा जुड़ा है। चूंकि मध्य पद 'कांच' व्याप्त (distributed) नहीं है, इसलिए 'दर्पण' और 'दरवाजे' या 'दर्पण' और 'खिड़कियां' के बीच कोई निश्चित संबंध स्थापित नहीं किया जा सकता है। अतः, निष्कर्ष II और III अनुसरण नहीं करते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image032.png\" width=\"396\" height=\"134\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, केवल निष्कर्ष I अनुसरण करता है।</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">सात मित्र — M, N, O, P, Q, R और S — एक वृत्ताकार मेज के चारों ओर केंद्र के सम्मुख होकर बैठे हैं। O, N के निकटतम बाएँ और S के बाएँ तीसरे स्थान पर बैठा है। P, O और Q के बीच में बैठा है। R, Q के निकटतम बाएँ और S के निकटतम दाएँ बैठा है। M, S के निकटतम बाएँ बैठा है। यदि O, R से और N, P से अपना स्थान बदल लेता है, तो R के निकटतम दाएँ कौन बैठा है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>P</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>M</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>Q</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. सभी व्यक्ति केंद्र के सम्मुख बैठे हैं, इसलिए दक्षिणावर्त (क्लॉकवाइज) दिशा बाएँ और वामावर्त (एंटी-क्लॉकवाइज) दिशा दाएँ होगी।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. O, S के बाएँ तीसरे (दक्षिणावर्त) स्थान पर है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. O, N के निकटतम बाएँ है, इसलिए N, O के ठीक पहले बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. M, S के निकटतम बाएँ बैठा है (अर्थात S और N के बीच में)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. P, O और Q के बीच में है, तथा R, Q और S के बीच में है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इस प्रकार, दक्षिणावर्त क्रम में मूल व्यवस्था है: </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image033.jpeg\" width=\"513\" height=\"462\" alt ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span> </span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. अब स्थान बदलने पर:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- O और R आपस में स्थान बदलते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>- N और P आपस में स्थान बदलते हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>नई दक्षिणावर्त व्यवस्था बनती है: </span><span style=\"font-weight:bold\">M → P → R → N → Q → O → S → M</span><span>।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7. इस नई व्यवस्था में, R के निकटतम दाएँ (वामावर्त दिशा में) </span><span style=\"font-weight:bold\">P</span><span> बैठा है।</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">इस प्रश्न में दो कथन I और II दिए गए हैं। ये कथन स्वतंत्र कारण या स्वतंत्र कारणों या एक उभयनिष्ठ कारण के प्रभाव हो सकते हैं। एक कथन, दूसरे कथन का प्रभाव हो सकता है। दोनों कथनों को पढ़िए और सही उत्तर का चयन कीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. मंगलवार को शहर के हवाई अड्डे से उड़ान भरने वाली कई सुबह की उड़ानों में देरी हुई या उनका मार्ग बदल दिया गया।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. मंगलवार की सुबह शहर को जोड़ने वाले सभी प्रमुख एक्सप्रेसवे पर वाहनों के भारी जाम की सूचना मिली।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों एक उभयनिष्ठ कारण के प्रभाव हैं।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I कारण है और कथन II इसका प्रभाव है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन II कारण है और कथन I इसका प्रभाव है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों स्वतंत्र कारण हैं।</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोनों कथन एक ही मंगलवार की सुबह परिवहन में आई बाधाओं का वर्णन करते हैं। उड़ानों में देरी या उनका मार्ग बदलना (कथन I) और एक्सप्रेसवे पर भारी ट्रैफिक जाम (कथन II), दोनों संभवतः एक ही उभयनिष्ठ कारण, जैसे घने कोहरे, गंभीर स्मॉग या प्रतिकूल मौसम के कारण शहर में दृश्यता कम होने के परिणाम हैं। अतः, कथन I और II दोनों एक उभयनिष्ठ कारण के प्रभाव हैं।</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक प्रश्न के बाद (I) और (II) के रूप में संख्यांकित दो कथन दिए गए हैं। आपको यह निर्णय करना है कि कथनों में दी गई जानकारी प्रश्न का उत्तर देने के लिए पर्याप्त है या नहीं। दोनों कथनों को पढ़िए और उपयुक्त उत्तर का चयन कीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">प्रश्न: पाँच व्यक्ति — M, N, O, P और Q — उत्तर दिशा के सम्मुख एक सीधी पंक्ति में बैठे हैं। पंक्ति के दाएँ छोर पर कौन बैठा है?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कथन:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(I) N, M के दाएँ से तीसरे स्थान पर बैठा है; O, N के निकटतम दाएँ बैठा है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(II) Q, P के दाएँ से दूसरे स्थान पर बैठा है; न तो P और न ही Q किसी भी छोर पर बैठा है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I में दी गई जानकारी अकेले प्रश्न का उत्तर देने के लिए पर्याप्त है जबकि कथन II में दी गई जानकारी पर्याप्त नहीं है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन II में दी गई जानकारी अकेले प्रश्न का उत्तर देने के लिए पर्याप्त है जबकि कथन I में दी गई जानकारी पर्याप्त नहीं है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अकेले कथन I या अकेले कथन II में दी गई जानकारी प्रश्न का उत्तर देने के लिए पर्याप्त है।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>प्रश्न का उत्तर देने के लिए कथन I और II दोनों में दी गई जानकारी एक साथ आवश्यक है।</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मान लीजिए बाएँ से दाएँ 5 स्थान 1, 2, 3, 4, 5 हैं (उत्तर दिशा के सम्मुख, इसलिए स्थान 1 बायाँ छोर है और स्थान 5 दायाँ छोर है)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कथन (I) से:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>N, M के दाएँ से तीसरे स्थान पर बैठा है और O, N के निकटतम दाएँ बैठा है। यदि M स्थान 1 पर है, तो N स्थान 4 पर होगा और O स्थान 5 (दाएँ छोर) पर होगा। यदि M स्थान 2 पर होता, तो N स्थान 5 पर होता और O के लिए स्थान 6 की आवश्यकता होती, जो संभव नहीं है। अतः O निश्चित रूप से दाएँ छोर पर बैठा है। इसलिए, केवल कथन I पर्याप्त है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span style=\"font-weight:bold\">कथन (II) से:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो P और न ही Q किसी छोर (स्थान 1 और 5) पर बैठे हैं। चूँकि Q, P के दाएँ से दूसरे स्थान पर है, इसलिए P स्थान 2 पर और Q स्थान 4 पर होना चाहिए। शेष स्थान (1, 3 और 5) M, N या O द्वारा लिए जा सकते हैं, इसलिए दाएँ छोर पर कौन बैठा है यह निर्धारित नहीं किया जा सकता। अतः केवल कथन II पर्याप्त नहीं है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः कथन I में दी गई जानकारी अकेले प्रश्न का उत्तर देने के लिए पर्याप्त है जबकि कथन II में दी गई जानकारी पर्याप्त नहीं है।</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">दिए गए समीकरण को संतुलित करने के लिए * चिह्नों को क्रमिक रूप से बदलने के लिए गणितीय चिह्नों के सही संयोजन का चयन कीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">14 * 6 * 192 * 12 * 45 = 113</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>+ × ÷ −</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>× − ÷ +</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>× + ÷ −</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>+ − × ÷</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिया गया समीकरण: 14 * 6 * 192 * 12 * 45 = 113</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>विकल्प B की जाँच करने पर: ×, −, ÷, +</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>​</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image034.png\" width=\"165\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>= </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image035.png\" width=\"92\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom \"93\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>इसी प्रकार, ‘BASKET’ के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>विपरीत स्थानीय मान: B = 25, A = 26, S = 8, K = 16, E = 22, T = 7</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>योग = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image083.png\" width=\"232\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>स्वरों की संख्या = 2 (A, E)</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कूट = </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image084.png\" width=\"102\" height=\"21\" alt style=\"vertical-align:middle\" ><span>।</span></p>", "question_heading": ""}, {"sr_no": 21, "question": "  <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">दिए गए प्रश्न में, कथन के बाद दो निष्कर्ष दिए गए हैं। दोनों में से कौन-सा/से निष्कर्ष सत्य है/हैं?</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कथन: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image085.png\" width=\"173\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">निष्कर्ष:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image086.png\" width=\"43\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image087.png\" width=\"40\" height=\"21\" alt style=\"vertical-align:middle\" ></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष I सत्य है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल निष्कर्ष II सत्य है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निष्कर्ष I और II दोनों सत्य हैं।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो निष्कर्ष I और न ही II सत्य है।</span></p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिया गया कथन: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image088.png\" width=\"168\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. निष्कर्ष I (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image089.png\" width=\"42\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>H और L के बीच का संबंध </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image090.png\" width=\"101\" height=\"21\" alt style=\"vertical-align:middle\" ><span> है। चूँकि इस क्रम में एक निश्चित बड़ा चिह्न (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image091.png\" width=\"21\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) मौजूद है और कोई विपरीत चिह्न नहीं है, इसलिए </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image089.png\" width=\"42\" height=\"21\" alt style=\"vertical-align:middle\" ><span> निश्चित रूप से सत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. निष्कर्ष II (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image092.png\" width=\"39\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) के लिए:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>J और N के बीच का संबंध </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image093.png\" width=\"135\" height=\"21\" alt style=\"vertical-align:middle\" ><span> है। चूँकि J और N के बीच विपरीत चिह्न (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image091.png\" width=\"21\" height=\"21\" alt style=\"vertical-align:middle\" ><span> और </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image094.png\" width=\"21\" height=\"21\" alt style=\"vertical-align:middle\" ><span>) उपस्थित हैं, इसलिए इनके बीच कोई निश्चित संबंध स्थापित नहीं किया जा सकता है। अतः, निष्कर्ष II असत्य है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, केवल निष्कर्ष I सत्य है।</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">नीचे दिए गए प्रश्न में, एक कथन के बाद दो कार्रवाइयाँ I और II दी गई हैं। कथन में दी गई सभी बातों को सत्य मानते हुए, तय कीजिए कि कौन-सी कार्रवाई/कार्रवाइयाँ तार्किक रूप से अनुसरण करती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कथन: दूषित नल के पानी की आपूर्ति के कारण एक शहर के कई आवासीय क्षेत्रों में जलजनित बीमारियों के अचानक फैलने की सूचना मिली है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">कार्रवाइयाँ:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. नगर निगम को प्रभावित क्षेत्रों में टैंकरों के माध्यम से सुरक्षित पेयजल की आपूर्ति की तत्काल व्यवस्था करनी चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. संदूषण के स्रोत का पता लगाने और उसे ठीक करने के लिए जल आपूर्ति पाइपलाइनों का तुरंत गहन निरीक्षण किया जाना चाहिए।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल कार्रवाई I अनुसरण करती है</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>केवल कार्रवाई II अनुसरण करती है</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>न तो कार्रवाई I और न ही II अनुसरण करती है</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोनों कार्रवाइयाँ I और II अनुसरण करती हैं</span></p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दोनों ही कार्रवाइयाँ तार्किक रूप से अनुसरण करती हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. कार्रवाई I एक त्वरित राहत उपाय है, जिसका उद्देश्य बीमारियों को और फैलने से रोकने के लिए निवासियों को सुरक्षित पेयजल उपलब्ध कराना है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. कार्रवाई II समस्या के मूल कारण पर ध्यान केंद्रित करती है, जिसके तहत संदूषण पैदा करने वाले पाइपलाइन दोषों की पहचान कर उन्हें ठीक किया जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चूँकि दोनों कदम व्यावहारिक, रचनात्मक और समस्या से सीधे संबंधित हैं, इसलिए I और II दोनों अनुसरण करते हैं।</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p sty img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image101.png\" width=\"183\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>विकल्प B: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image102.png\" width=\"192\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>विकल्प C: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image103.png\" width=\"222\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>विकल्प D: </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1794223473803_image104.png\" width=\"183\" height=\"21\" alt style=\"vertical-align:middle\" ></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, 5 : 23 विषम संख्या-युग्म है।</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'A + B' का अर्थ है 'A, B का पुत्र है'।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'A − B' का अर्थ है 'A, B की बहन है'।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'A × B' का अर्थ है 'A, B का भाई है'।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">'A ÷ B' का अर्थ है 'A, B की पत्नी है'।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">यदि 'M ÷ K + R − T × Z' है, तो K का T से क्या संबंध है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>पुत्र</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>भांजा</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>भाई</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मामा</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए व्यंजक 'M ÷ K + R − T × Z' से:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. M ÷ K → M, K की पत्नी है (अतः, K पुरुष है)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. K + R → K, R का पुत्र है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. R − T → R, T की बहन है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. T × Z → T, Z का भाई है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चूंकि R, T की बहन है और K, R का पुत्र है, इसलिए K, T की बहन का पुत्र (भांजा) है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, K का T से संबंध भांजे का है।</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">इस प्रश्न में दो कथन I और II दिए गए हैं। ये कथन स्वतंत्र कारण या स्वतंत्र कारणों के प्रभाव या एक उभयनिष्ठ कारण हो सकते हैं। एक कथन, दूसरे कथन का प्रभाव हो सकता है। दोनों कथनों को पढ़िए और सही उत्तर का चयन कीजिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">I. जिला प्रशासन ने तटीय क्षेत्रों के सभी स्कूलों और कॉलेजों को अस्थायी रूप से बंद करने का आदेश दिया है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">II. अगले 24 घंटों के भीतर तटीय क्षेत्र में एक तीव्र चक्रवाती तूफान के टकराने की आशंका जताई गई है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I कारण है और कथन II इसका प्रभाव है।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन II कारण है और कथन I इसका प्रभाव है।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों स्वतंत्र कारणों के प्रभाव हैं।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>कथन I और II दोनों स्वतंत्र कारण हैं।</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>आगामी तीव्र चक्रवाती तूफान मानव जीवन और सुरक्षा के लिए एक गंभीर खतरा उत्पन्न करता है। प्रत्यक्ष एहतियाती उपाय के रूप में, प्रशासन ने शैक्षणिक संस्थानों को अस्थायी रूप से बंद करने का आदेश दिया। अतः, कथन II कारण है और कथन I इसका प्रभाव है।</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">सात मित्रों P, Q, R, S, T, U और V में से प्रत्येक का सोमवार से शुरू होकर उसी सप्ताह के रविवार को समाप्त होने वाले सप्ताह के अलग-अलग दिनों में साप्ताहिक अवकाश होता है। S का अवकाश बुधवार को होता है। S और U के बीच केवल दो व्यक्तियों का अवकाश होता है। V का अवकाश U के ठीक अगले दिन होता है। S और P के बीच केवल एक व्यक्ति का अवकाश होता है। T का अवकाश P से पहले किसी एक दिन होता है। R का अवकाश Q के ठीक पहले वाले दिन होता है। T का अवकाश किस दिन होता है?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मंगलवार</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>गुरुवार</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शुक्रवार</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सोमवार</span></p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. S का अवकाश बुधवार को है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. S और U के बीच केवल दो व्यक्तियों का अवकाश है, इसलिए U का अवकाश शनिवार को होना चाहिए (क्योंकि बुधवार से पहले दो दिन छोड़कर जाना संभव नहीं है)।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. V का अवकाश U के ठीक अगले दिन है, यानी V का अवकाश रविवार को है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. S और P के बीच केवल एक व्यक्ति का अवकाश है। इसलिए P का अवकाश सोमवार या शुक्रवार को हो सकता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>5. T का अवकाश P से पहले किसी एक दिन है। यदि P का अवकाश सोमवार को होता, तो T के लिए उससे पहले कोई दिन उपलब्ध नहीं होता। अतः P का अवकाश शुक्रवार को है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>6. R का अवकाश Q के ठीक पहले वाले दिन है। खाली दिनों में केवल सोमवार और मंगलवार ही लगातार दिन हैं, इसलिए R का अवकाश सोमवार को और Q का मंगलवार को है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>7. अब केवल गुरुवार बचा है, जो T का अवकाश होगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अंतिम क्रम इस प्रकार है:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>सोमवार: R</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मंगलवार: Q</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>बुधवार: S</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>गुरुवार: T</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शुक्रवार: P</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>शनिवार: U</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>रविवार: V</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>अतः, T का अवकाश गुरुवार को है।</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">दिए गए मानदंडों को ध्यानपूर्वक पढ़ें और सभी संबंधित शर्तों और अपवादों पर विचार करें। केवल दी गई जानकारी के आधार पर सही निर्णय का प्रतिनिधित्व करने वाले विकल्प का चयन करें।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">एक सार्वजनिक क्षेत्र का बैंक निम्नलिखित मानदंडों के आधार पर प्रोबेशनरी अधिकारियों की भर्ती करता है: उम्मीदवार को (i) किसी भी विषय में न्यूनतम 65% अंकों के साथ स्नातक होना चाहिए, (ii) 1 जुलाई 2024 तक उसकी आयु 21 से 30 वर्ष के बीच होनी चाहिए, और (iii) ऑनलाइन लिखित परीक्षा में कम से कम 60% अंक प्राप्त करने चाहिए। हालांकि, यदि कोई उम्मीदवार उपर्युक्त (i) को छोड़कर अन्य सभी शर्तों को पूरा करता है, लेकिन उसने न्यूनतम 60% अंकों के साथ स्नातकोत्तर की डिग्री प्राप्त की है, तो उसका मामला महाप्रबंधक (HR) को भेजा जाना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">पूजा ने 58% अंकों के साथ वाणिज्य में स्नातक और 65% अंकों के साथ वाणिज्य में स्नातकोत्तर पूरा किया है। उनका जन्म 14 मार्च 1998 को हुआ था और उन्होंने ऑनलाइन लिखित परीक्षा में 72% अंक प्राप्त किए हैं। उनके आवेदन के संबंध में क्या निर्णय लिया जाना चाहिए?</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उम्मीदवार का चयन किया जाना चाहिए।</span></p>", "option2": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>उम्मीदवार को अस्वीकार किया जाना चाहिए।</span></p>", "option3": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>मामला महाप्रबंधक (HR) को भेजा जाना चाहिए।</span></p>", "option4": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>निर्णय लेने के लिए दिया गया डेटा अपर्याप्त है।</span></p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>दिए गए मानदंडों के आधार पर पूजा के विवरण का मूल्यांकन करते हैं:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>1. </span><span style=\"font-weight:bold\">स्नातक अंक:</span><span> उन्होंने स्नातक में 58% अंक प्राप्त किए हैं, जो आवश्यक 65% से कम है। अतः वह मानदंड (i) को पूरा नहीं करती हैं।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>2. </span><span style=\"font-weight:bold\">आयु:</span><span> उनका जन्म 14 मार्च 1998 को हुआ था, इसलिए 1 जुलाई 2024 को उनकी आयु 26 वर्ष 3 माह है, जो मानदंड (ii) (21 से 30 वर्ष के बीच) को पूरा करती है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>3. </span><span style=\"font-weight:bold\">लिखित परीक्षा:</span><span> उन्होंने 72% अंक प्राप्त किए हैं, जो मानदंड (iii) (न्यूनतम 60%) को पूरा करता है।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>4. </span><span style=\"font-weight:bold\">अपवाद:</span><span> चूंकि वह मानदंड (i) के अलावा अन्य सभी शर्तों को पूरा करती हैं और उनके स्नातकोत्तर में 65% अंक हैं (न्यूनतम 60% आवश्यक), इसलिए उनका मामला महाप्रबंधक (HR) को भेजा जाना चाहिए।</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">दिए गए मानदंडों को ध्यानपूर्वक पढ़िए और प्रदान किए गए मामले के लिए उपयुक्त निर्णय लीजिए। यदि कोई अपवाद लागू होता है, तो यह भी बताइए कि मामले को किस प्राधिकारी के पास भेजा जाना चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">सहायक लेखा अधिकारी (Assistant Accounts Officer) के चयन के लिए मानदंड:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">1. आयु: 01.07.2024 को 21 से 30 वर्ष के बीच होनी चाहिए।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">2. शैक्षणिक योग्यता: वाणिज्य (Commerce) में न्यूनतम 55% अंकों के साथ स्नातक।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">3. लिखित परीक्षा: लिखित परीक्षा में कम-से-कम 60% अंक प्राप्त किए हों।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">4. अनुभव: लेखांकन (Accounting) में न्यूनतम 1 वर्ष का कार्यानुभव।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">अपवाद:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(i) यदि कोई उम्मीदवार शर्त (1) को छोड़कर अन्य सभी मानदंडों को पूरा करता/करती है, लेकिन उसके पास 3 वर्ष से अधिक का लेखांकन अनुभव है, तो मामला महाप्रबंधक (General Manager) को भेजा जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">(ii) यदि कोई उम्मीदवार शर्त (2) को छोड़कर अन्य सभी मानदंडों को पूरा करता/करती है, लेकिन उसने सीए-इंटर (CA-Inter) उत्तीर्ण किया है, तो मामला वित्त निदेशक (Finance Director) को भेजा जाएगा।</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">मामला:</span></p><p style=\"margin-top:0pt;margin-bottom:0pt;text-align:justify;font-size:12pt\"><span style=\"font-weight:bold\">अनन्या का जन्म 14.04.1992 को हुआ था। उसने 62% अंकों के साथ वाणिज्य में स्नातक किया है और लिखित परीक्षा में 68% अंक प्राप्त किए हैं। उसके पास लेखांकन में 4 वर्ष का कार्यानुभव है।</span></p>", "option1": "<p style=\"margin-top:0pt;margin-bottom:0pt;font-size:12pt\"><span>चयनित किया जाएगा</span></p>", "option
