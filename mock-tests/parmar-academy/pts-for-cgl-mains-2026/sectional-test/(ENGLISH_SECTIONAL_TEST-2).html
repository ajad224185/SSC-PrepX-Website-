<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>16.) ENGLISH SECTIONAL TEST-2 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

hans:0;widows:0\">    at variance with</p>", "option3": " <p style=\"orphans:0;widows:0\">    on variance against</p>", "option4": " <p style=\"orphans:0;widows:0\">    No substitution required</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The correct idiomatic prepositional phrase is <b>'at variance    with'</b>, which means 'not in agreement with' or 'contradicting    something'. The preposition 'to' is incorrect after 'at variance'.    Hence, option B is the correct substitution.</p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Parts of the following sentence have been given as options. Select    the option that contains a grammatical error.</p>    <p style=\"orphans:0;widows:0\">The senior analysts who conducted    the extensive market survey believes that the new regulations will    foster sustainable economic growth.</p>", "option1": "<p style=\"orphans:0;widows:0\">    believes that the new regulations</p>", "option2": " <p style=\"orphans:0;widows:0\">    will foster sustainable economic growth</p>", "option3": " <p style=\"orphans:0;widows:0\">    who conducted the extensive market survey</p>", "option4": " <p style=\"orphans:0;widows:0\">    The senior analysts</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The error lies in the segment <b>'believes that the new    regulations'</b>. The main subject of the sentence is the plural    noun phrase <i>'The senior analysts'</i>, which is separated from    its main verb by the relative clause <i>'who conducted the    extensive market survey'</i>. A plural subject takes a plural    verb, so 'believe' should be used instead of the singular form    'believes'.</p>    <p style=\"orphans:0;widows:0\">Therefore, <b>option A</b> is the    correct answer.</p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate ANTONYM of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Enervation</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Debilitation</p>", "option2": " <p style=\"orphans:0;widows:0\">    Invigoration</p>", "option3": " <p style=\"orphans:0;widows:0\">    Attenuation</p>", "option4": " <p style=\"orphans:0;widows:0\">    Stagnation</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>Enervation</b> refers to a feeling of being drained of    energy or vitality; a state of weakness or mental/physical    exhaustion.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the given options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Invigoration:</b>     The action or state of being filled with life, energy, and     strength (exact antonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Debilitation:</b>     The state of being weakened or infirm (synonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Attenuation:</b>     The reduction of the force, intensity, or value of something;     gradual weakening.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Stagnation:</b>     The state of not flowing, moving, or developing.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence, <b>Invigoration</b> is the    most appropriate antonym.</p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0\">    Select the sentence with the grammatically correct verb form.</p>", "option1": "<p style=\"orphans:0;widows:0\">    By the time the project will be completed, the team will have    spent over ten million dollars.</p>", "option2": " <p style=\"orphans:0;widows:0\">    By the time the project is completed, the team will have spent    over ten million dollars.</p>", "option3": " <p style=\"orphans:0;widows:0\">    By the time the project is completed, the team will spend over ten    million dollars.</p>", "option4": " <p style=\"orphans:0;widows:0\">    By the time the project has completed, the team will be spending    over ten million dollars.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sentence is: <b>By the time the project is completed,    the team will have spent over ten million dollars.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Explanation    of Rules:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In a time    clause introduced by conjunctions such as 'by the time', 'when',    or 'as soon as' referring to a future event, we use the simple    present tense (passive: <i>is completed</i>), not a future tense    auxiliary (<i>will be completed</i>).</p>    <p style=\"orphans:0;widows:0\">The main clause expressing an    action that will be finished prior to that specific future point    requires the future perfect tense (<i>will have spent</i>).</p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate meaning of the given idiom.</p>    <p style=\"orphans:0;widows:0\"><b>Chew the cud</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    To swallow food hastily</p>", "option2": " <p style=\"orphans:0;widows:0\">    To ponder over something deeply</p>", "option3": " <p style=\"orphans:0;widows:0\">    To express extreme anger</p>", "option4": " <p style=\"orphans:0;widows:0\">    To make useless excuses</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The idiom <b>'chew the cud'</b> means to meditate, ponder, or    think deeply and slowly about something. Hence, o ge    someone with a serious crime.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The word    <b>'Exonerate'</b> means to officially clear someone from blame or    a criminal charge, making it the most appropriate antonym.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Accuse:</b>    to claim that someone has done something illegal or wrong    (synonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Arraign:</b>    to call or bring someone before a court to answer a criminal    charge (related term).</p>    <p style=\"orphans:0;widows:0\">• <b>Impeach:</b> to charge a    public official with misconduct (related term).</p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Directions: In the following passage, some words have been    deleted. Fill in the blanks with the help of the alternatives    given. Select the most appropriate option for each number.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The ancient    monastic citadel of Mar Saba, precariously perched on the sheer    cliffs overlooking the Kidron Valley, seems entirely severed from    the modern world. And yet it (1)______ scholars and pilgrims from    across the globe with an enduring magnetic pull. Upon reflection,    (2)______ allure of such an austere sanctuary is hardly    mysterious. Amidst the craggy caves and barren precipices    (3)______ a labyrinthine complex of Byzantine chapels, (4)______    houses priceless theological manuscripts dating back more than a    millennium, serving as an irreplaceable (5)______ of early    Christian erudition.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><b>Select the most appropriate    option to fill in the blank no. 1.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    will beckon</p>", ns:0;widows:0\">    Tanvi said to her colleague, \"We cannot revise the proposal    now because the director has already signed the agreement.\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    Tanvi said to her colleague, \"We could not revise the    proposal now because the director had already signed the    agreement.\"</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the given sentence from indirect to direct speech, the    following rules are applied:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Reporting    verb:</b> 'told her colleague that' is converted back to 'said to    her colleague, \"...\"'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Pronoun    shift:</b> The third-person pronoun 'they' (representing Tanvi and    her colleague together) reverts to the first-person plural pronoun    'We'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Modal    shift:</b> 'could not' in indirect speech reverts to 'cannot' in    direct speech.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Time    expression:</b> The adverb 'then' in indirect speech reverts to    'now' in direct speech.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Tense    shift:</b> The past perfect tense 'had already signed' reverts to    the present perfect tense 'has already signed'.</p>    <p style=\"orphans:0;widows:0\">Combining these changes, Option C    is the correct direct form.</p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">She managed to pass the difficult    entrance examination ________ she had very little time to prepare.</p>", "option1": "<p style=\"orphans:0;widows:0\">    unless</p>", "option2": " <p style=\"orphans:0;widows:0\">    because</p>", "option3": " <p style=\"orphans:0;widows:0\">    although</p>", "option4": " <p style=\"orphans:0;widows:0\">    so that</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct conjunction to fill in the blank is <b>'although'</b>.</p>    <p style=\"orphans:0;widows:0\">'Although' means 'in spite of the    fact that' or 'even though' and is used to introduce a    subordinating clause that contrasts with the main clause. In the    given sentence, passing the difficult exam despite having very    little preparation time creates a contrast. Therefore, 'although'    is the most appropriate choice.</p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Sentences of a paragraph are given below in jumbled order.    Arrange the sentences in the correct order to form a meaningful    and coherent paragraph.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A. This    delicate equilibrium, however, is easily disrupted when external    shocks tilt the balance.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B. For    decades, natural ecosystems have maintained a self-regulating    harmony known as dynamic homeostasis.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C. Once    this threshold is crossed, the resilience mechanisms fail, leading    to irreversible habitat degradation.</b></p>    <p style=\"orphans:0;widows:0\"><b>D. Such disruptions initially    trigger latent feedback loops designed to absorb the disturbance,    but they can only withstand finite stress.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    BADC</p>", "option2": " <p style=\"orphans:0;widows:0\">    BDAC</p>", "option3": " <p style=\"orphans:0;widows:0\">    ABDC</p>", "option4": " <p style=\"orphans:0;widows:0\">    BACD</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct logical order is <b>BADC</b>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B</b> is    the introductory sentence as it introduces the primary theme—the    self-regulating harmony (dynamic homeostasis) of natural    ecosystems.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A</b>    logically follows B because \"This delicate equilibrium\"    directly refers to the \"self-regulating harmony\"    mentioned in B, while \"however\" introduces the    counterpoint of disruption.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>D</b>    connects with A through the noun phrase \"Such disruptions\",    which elaborates on the shocks introduced in A and mentions that    ecosystems can withstand only \"finite stress\".</p>    <p style=\"orphans:0;widows:0\"><b>C</b> concludes the thought;    \"this threshold\" directly refers back to the limit of    \"finite stress\" in D, detailing the irreversible failure    that follows when the threshold is exceeded.</p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to substitute the underlined    segment in the given sentence. If no substitution is required,    select 'No substitution required'.</p>    <p style=\"orphans:0;widows:0\">Scarcely had the exhausted hikers    <u>laid down to rest</u> when an unexpected thunderstorm struck    the valley.</p>", "option1": "<p style=\"orphans:0;widows:0\">    lain down to rest</p>", "option2": " <p style=\"orphans:0;widows:0\">    lie down to rest</p>", "option3": " <p style=\"orphans:0;widows:0\">    laying down to rest</p>", "option4": " <p style=\"orphans:0;widows:0\">    No substitution required</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>lain down to rest</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Explanation:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Lie</b>    (intransitive verb, meaning to recline or rest): forms are <i>lie    – lay – lain</i>. It does not take a direct object.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Lay</b>    (transitive verb, meaning to put or place something down): forms    are <i>lay – laid – laid</i>. It requires a direct object.</p>    <p style=\"orphans:0;widows:0\">In the given sentence, the hikers    are reclining or resting themselves (no direct object), so the    intransitive verb <b>lie</b> must be used. Following the auxiliary    verb 'had' in the past perfect construction ('Scarcely had...'),    we require the third form of the verb (past participle), which is    <b>lain</b>, not 'laid'.</p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>The first sentence is in the correct order, while the rest of    the sentences are jumbled. Pick the option that gives their    correct order.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A. The    cognitive reserve hypothesis posits that engaging in lifelong    mentally stimulating pursuits fosters brain resilience against    neurodegeneration.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B. This    enhanced structural network enables the brain to compensate by    recruiting alternative neural pathways when primary circuits fail.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C.    Consequently, individuals with greater reserve can sustain normal    cognitive faculties despite substantial underlying    neuropathological changes.</p>    <p style=\"orphans:0;widows:0\">D. Such ongoing intellectual    engagement actively stimulates neuroplasticity and the formation    of novel synaptic networks.</p>", "option1": "<p style=\"orphans:0;widows:0\">    ADBC</p>", "option2": " <p style=\"orphans:0;widows:0\">    ABDC</p>", "option3": " <p style=\"orphans:0;widows:0\">    ACDB</p>", "option4": " <p style=\"orphans:0;widows:0\">    ADCB</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sequence is <b>ADBC</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>A</b>    is the introductory sentence defining the premise: engaging in    mentally stimulating pursuits builds brain resilience.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>D</b>    logically follows A because the demonstrative noun phrase <i>'Such    ongoing intellectual engagement'</i> directly refers back to the    <i>'lifelong mentally stimulating pursuits'</i> mentioned in A. It    introduces the biological mechanism: <i>'the formation of novel    synaptic networks'</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. <b>B</b>    follows D because <i>'This enhanced structural network'</i>    directly links to the <i>'novel synaptic networks'</i> formed in    D, describing how the brain utilizes alternative neural pathways.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. <b>C</b>    concludes the paragraph with the cause-and-effect marker    <i>'Consequently'</i>, stating the final real-world outcome    (sustaining normal cognitive function despite neuropathology).</p>    <p style=\"orphans:0;widows:0\">Thus, the correct order is <b>ADBC</b>.</p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct direct narration of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">Rohan told his sister that he    would call her as soon as he reached the station and requested her    to lock all the doors.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Rohan said to his sister, \"I would call you as soon as I    reach the station. Please lock all the doors.\"</p>", "option2": " <p style=\"orphans:0;widows:0\">    Rohan said to his sister, \"I will call you as soon as I    reached the station. You must lock all the doors.\"</p>", "option3": " <p style=\"orphans:0;widows:0\">    Rohan said to his sister, \"I will call you as soon as I reach    the station. Please lock all the doors.\"</p>", "option4": " <p style=\"orphans:0;widows:0\">    Rohan said to his sister, \"He will call you as soon as he    reaches the station. Lock all the doors.\"</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert the indirect speech into direct speech, follow these    rules:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb 'told' changes back to 'said to'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    third-person pronoun 'he' refers to the speaker (Rohan), so it    changes to 'I', and 'her' changes to 'you'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The modal    auxiliary 'would' changes back to 'will' ('I will call').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The past    tense in the conditional/time clause ('reached') changes to the    present tense ('reach').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The clause    'requested her to lock all the doors' indicates an imperative    sentence expressing a polite request, which becomes 'Please lock    all the doors.'</p>    <p style=\"orphans:0;widows:0\">Therefore, the sentence in Option    C correctly reflects these rules.</p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate meaning of the given idiom.</b></p>    <p style=\"orphans:0;widows:0\">Take someone to task</p>", "option1": "<p style=\"orphans:0;widows:0\">    To help someone complete a duty</p>", "option2": " <p style=\"orphans:0;widows:0\">    To praise someone for good performance</p>", "option3": " <p style=\"orphans:0;widows:0\">    To reprimand or criticize someone severely</p>", "option4": " <p style=\"orphans:0;widows:0\">    To assign a difficult project to someone</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The idiom <b>'take someone to task'</b> means to rebuke,    reprimand, or severely criticize someone for making a mistake or    doing something wrong. Hence, <b>'To reprimand or criticize    someone severely'</b> is the most appropriate meaning.</p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct indirect form of the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">Kavita said, \"Several    students from my school participated in the national science    quiz.\"</p>", "option1": "<p style=\"orphans:0;widows:0\">    Kavita said that several students from my school participated in    the national science quiz.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Kavita said that several students from her school had participated    in the national science quiz.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kavita said that several students from her school participated in    the national science quiz.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Kavita said that several students from her school have    participated in the national science quiz.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Rules for changing direct to indirect speech for an assertive    sentence:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb 'said' remains 'said' and is followed by the conjunction    'that'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    first-person possessive pronoun 'my' changes to 'her' referring to    the subject 'Kavita'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The simple    past tense ('participated') changes to the past perfect tense    ('had participated').</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct sentence    is: <b>Kavita said that several students from her school had    participated in the national science quiz.</b></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct active voice of the given sentence.</p>    <p style=\"orphans:0;widows:0\">Are all the terms and conditions    being properly verified by the legal department before signing the    contract?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Has the legal department properly verified all the terms and    conditions before signing the contract?</p>", "option2": " <p style=\"orphans:0;widows:0\">    Is the legal department properly verifying all the terms and    conditions before signing the contract?</p>", "option3": " <p style=\"orphans:0;widows:0\">    Was the legal department properly verifying all the terms and    conditions before signing the contract?</p>", "option4": " <p style=\"orphans:0;widows:0\">    Does the legal department properly verify all the terms and    conditions before signing the contract?</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is an interrogative sentence in the passive    voice of the Present Continuous Tense.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive    interrogative rule: <b>Is/Am/Are + Object + being + V3 + by +    Subject + ...?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Active    interrogative rule: <b>Is/Am/Are + Subject + V-ing + Object + ...?</b></p>    <p style=\"orphans:0;widows:0\">Here, 'the legal department' is a    singular subject, so it takes the auxiliary verb 'Is'. Therefore,    the correct active form is given in option B.</p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate synonym of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>CADAVEROUS</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Corpulent</p>", "option2": " <p style=\"orphans:0;widows:0\">    Emaciated</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sanguine</p>", "option4": " <p style=\"orphans:0;widows:0\">    Robust</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>CADAVEROUS</b> means resembling a corpse in being very    thin, bony, or pale.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Emaciated</b>    means abnormally thin or weak, especially because of illness or a    lack of food, making it the most appropriate synonym.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Corpulent</b>:    excessively fat; obese.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sanguine</b>:    optimistic or positive, especially in an apparently bad or    difficult situation; also having a healthy red/flushed complexion.</p>    <p style=\"orphans:0;widows:0\"><b>Robust</b>: strong and    healthy; vigorous.</p>", "question_heading": ""}, {"sr_no": 34, "question": "Giॅधn ुधनध ोनध ीयहन ौधnपधncधौ. Tुध ीiनौप ौधnपधncध iौ in cयननधcप यनकधन, थुiिध पुध नधौप यी पुध ौधnपधncधौ ोनध ुहंृिधक. Picा पुध यूपiयn पुोप giॅधौ पुधiन cयननधcप यनकधन. A. Sियोन ूोnिधस थधनध नधcधnिपद inौपोििधक ोcनयौौ ोिि ूहृिic ौcुयिय ृहiिकingौ in पुध कiौपनicप. B. Encयहनोgधक ृद पुधौध ौोॅingौ, पुध ियcोि cयहnciि nयथ ूिोnौ पय धसूोnक पुध ूनयुधcप पय gयॅधनnंधnप ुयौूiपोिस. C. Tुiौ gनधधn iniपiोपiॅध थोौ हnकधनपोाधn पय नधकहcध िधधcपनiciपद धसूधnौधौ ोnक ूनयंयपध नधnधथोृिध धnधनgद. D. Aौ ो नधौिहप यी पुiौ पनोnौiपiयn, पुध ौcुयियस ुोॅध ोिनधोकद ौोॅधक nधोिनद पुiनपद ूधनcधnप यn पुधiन ंयnपुिद हपiिiपद ृiििस.", "option1": "<p style=\"orphans:0;widows:0\">    ACBD</p>", "option2": " <p style=\"orphans:0;widows:0\">    ACDB</p>", "option3": " <p style=\"orphans:0;widows:0\">    ADCB</p>", "option4": " <p style=\"orphans:0;widows:0\">    ABDC</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sequence is <b>ACDB</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>A</b>    is the fixed opening sentence, introducing the action of    installing solar panels across schools.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>C</b>    logically follows <b>A</b> because 'This green initiative' refers    directly to the installation mentioned in A and explains the    objective behind it.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>D</b>    follows <b>C</b>, presenting the concrete outcome of this    initiative (saving nearly thirty percent on monthly utility    bills).</p>    <p style=\"orphans:0;widows:0\">Sentence <b>B</b> must follow <b>D</b>    because the phrase 'these savings' refers directly to the 30%    savings mentioned in D.</p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate synonym of the given word.</b></p>    <p style=\"orphans:0;widows:0\">RECONDITE</p>", "option1": "<p style=\"orphans:0;widows:0\">    Superficial</p>", "option2": " <p style=\"orphans:0;widows:0\">    Arcane</p>", "option3": " <p style=\"orphans:0;widows:0\">    Obvious</p>", "option4": " <p style=\"orphans:0;widows:0\">    Manifest</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>RECONDITE</b> refers to knowledge or subjects that are    little known, abstruse, or obscure.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Arcane</b>    means understood by few; mysterious or secret, making it the most    appropriate synonym.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Superficial</b>    means occurring at or on the surface; shallow.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Obvious</b>    means easily perceived or understood; clear.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Manifest</b>    means clear or evident to the eye or mind.</p>    <p style=\"orphans:0;widows:0\">Hence, the correct synonym is    <b>Arcane</b>.</p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that expresses the given sentence in reported    speech.</p>    <p style=\"orphans:0;widows:0\">The investigator said to the    journalist, \"I collected these samples yesterday, but I    cannot test them now as the laboratory is closed.\"</p>", "option1": "<p style=\"orphans:0;widows:0\">    The investigator told the journalist that he had collected those    samples the previous day, but he could not test them then as the    laboratory was closed.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The investigator told the journalist that he collected those    samples yesterday, but he could not test them then as the    laboratory was closed.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The investigator said the journalist that he had collected these    samples the previous day, but he cannot test them then as the    laboratory was closed.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The investigator told the journalist that he had collected those    samples the previous day, but he could not test them now as the    laboratory is closed.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Rules for changing direct speech into indirect speech for this    sentence:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Reporting    verb: 'said to' changes to 'told'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Conjunction    'that' is used.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Pronoun 'I'    changes to 'he' (referring to the investigator).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Tense    changes: Simple Past ('collected') changes to Past Perfect ('had    collected'); 'cannot' changes to 'could not'; Simple Present ('is    closed') changes to Simple Past ('was closed').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Adverbials    and demonstratives change: 'these' becomes 'those', 'yesterday'    becomes 'the previous day', and 'now' becomes 'then'.</p>    <p style=\"orphans:0;widows:0\">Hence, the correct indirect form    is given in option A.</p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to substitute the underlined    segment in the given sentence. If no substitution is required,    select 'No substitution required'.</p>    <p style=\"orphans:0;widows:0\">Ever since the industrial reforms    were introduced, the manufacturing sector <u>is performing quite    better than</u> it did in the previous decade.</p>", "option1": "<p style=\"orphans:0;widows:0\">    has been performing far better than</p>", "option2": " <p style=\"orphans:0;widows:0\">    had performed quite well than</p>", "option3": " <p style=\"orphans:0;widows:0\">    has performed very better than</p>", "option4": " <p style=\"orphans:0;widows:0\">    No substitution required</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct substitution is <b>has been performing far better    than</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">There are two    key grammatical rules involved here:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Tense    rule:</b> When a time clause begins with 'Ever since' followed by    the Simple Past tense ('were introduced'), it indicates an action    starting at a point in the past and continuing up to the present.    The main clause must therefore take the Present Perfect or Present    Perfect Continuous tense (<b>has been performing</b>).</p>    <p style=\"orphans:0;widows:0\"><b>Degree of comparison modifier:</b>    The comparative degree ('better than') cannot be modified by    'quite' or 'very'. Instead, adverbs of degree like <b>far</b> or    <b>much</b> must be used (e.g., 'far better than' or 'much better    than').</p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate option to fill in the blanks.</b></p>    <p style=\"orphans:0;widows:0\">_______ Lake Superior is situated    on the border between Canada and _______ United States.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The, the</p>", "option2": " <p style=\"orphans:0;widows:0\">    No article required, the</p>", "option3": " <p style=\"orphans:0;widows:0\">    A, the</p>", "option4": " <p style=\"orphans:0;widows:0\">    The, no article required</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>No article required, the</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rules:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Individual    Lakes:</b> Names of individual lakes (such as <i>Lake Superior</i>,    <i>Lake Victoria</i>, <i>Lake Michigan</i>) do not take the    definite article 'the'. Therefore, no article is required before    'Lake Superior'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Country    Names with 'United/Kingdom/Republic/Plural':</b> Countries whose    names include words like 'United', 'Kingdom', 'Republic', or are    plural in form take the definite article 'the' (e.g., <i>the    United States</i>, <i>the United Kingdom</i>, <i>the Netherlands</i>).</p>    <p style=\"orphans:0;widows:0\">Hence, the correct sentence is:    <i>\"</i><i><b>Lake Superior</b></i><i> is situated on the    border between Canada and </i><i><b>the</b></i><i> United States.\"</i></p>", "question_heading": ""}, {"sr_no": 39, "question": "Rधोक पुध ीियियथing ूोौौोgध ोnक ोnौथधन पुध तहधौपiयnौ पुोप ीियियथ. Wुधn ो ूुदौiciोn यन cोनकiिययgiौप cयहnौिधस ो ूोपiधnप पय नधौपनicप कोiिद cयीीधध cयnौहंूपiयn, iप iौ cहौपयंोनद पय ोौौहंध पुध ृनधथ iौ inुधनधnिपद ुोनंीिह पय cोनकiयॅोौcिहोन ुधोिपु. Tनोकiपiयnोि cिinicोि gहiकोncध नयहपinिधद निधधgोपधक cयीीधध पय पुध cोहपiयn िiौप ीयन inकiॅiकहोिस थiपु ुदूधनपधnौiयn यन ूोिूiपोपiयnौ, ोnक ुiौपयनicोििद nयप थiपुयहप gनयहnकौ. Hयथधॅधन, धंधनging धूiकधंiिययgicोि ोnक ृiयcुधंicोि धॅiकधncध थोननोnपौ ो पुयनयहgु नध-धॅोिहोपiयn यी पुiौ हृiतहiपयहौ ृधॅधनोgध, ूोनपicिहोिनद नधgोनकing iपौ cयंूिधस ूुदौiिययgicोि iंूोcप यn ॅोौcिहोन ीहncपiयn, ंधपोृियic धतहiिiृनiहं, ोnक cिधििहोन ोging. Iप iौ थिधि धौपोृिiौुधक पुोप cयीीधध iौ ो ूुोनंोcिययgicोििद ोcपiॅध inीहौiयn cयnपोining ौहृौपोnपiोि ोंयहnपौ यी cोीीधinध, ोn ोिाोियiक पुोप ोcपौ ोौ ो cधnपनोि nधनॅयहौ ौदौपधं ौपiंिहोnप ोnक पधंूयनोनiिद िधधॅोपधौ ौदौपियic ृिययक ूनधौौहनध. A ौपोnकोनक cहू किधiॅधनौ ृधपथधधn 80 ोnक 120 ंiििigनोंौ यी cोीीधinध. Fहनपुधनंयनध, ृनधथing ंधपुयकौ ौहृौपोnपiोििद कicपोपध iपौ cुधंicोि ूनयीiिध. Unीiिपधनधक ूनधूोनोपiयnौ, ौहcु ोौ Fनधncु ूनधौौ ोnक ृयiिधक Tहनाiौु cयीीधध, cयnपोin िiूiक cयंूयहnकौ ाnयथn ोौ कiपधनूधnधौ—ौूधciीicोििद cोीधौपिय ोnक ाोुथधिय—थुicु ौigniीicोnिपद िधधॅोपध ियथ-कधnौiपद िiूयूनयपधin (LDL) cुियधौपधनिय िधॅिधस in ुहंोn ूिोौंो. Bधcोहौध कiपधनूधnधौ iंूोiन cुियधौपधनिय cिधोनोncध ृद कयथnनधgिहोपing ुधूोपic नधcधूपयनौ, कयधौ पुiौ iंूिद पुोप cयीीधध ौुयिहक ृध cोपधgयनicोििद ूनयौcनiृधक ीयन inकiॅiकहोिस ौपनiॅing पय ंोinपोin यूपiंोि cोनकiयॅोौcिहोन ुधोिपु? Tुध ोnौथधन iौ nधgोपiॅध, ूनयॅiकधक यnध ोकुहौपौ पुध धसपनो let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }

    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }

  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {

    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
