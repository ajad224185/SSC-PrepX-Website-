const questions = [{"sr_no": 1, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the Chalcolithic    culture in India:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. The    Chalcolithic people were the first to use painted pottery in the    Indian subcontinent.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2.    Daimabad in Maharashtra is a prominent Chalcolithic site known for    the discovery of bronze sculptures.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3. Iron    tools were extensively manufactured and used alongside copper    during the Chalcolithic period.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the statements given    above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statements 1 and 2 are correct, while statement 3 is incorrect.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The people    of the Chalcolithic culture were the first in the Indian    subcontinent to use painted pottery. They produced black-and-red    pottery, which was often painted with white linear designs.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Daimabad,    located in the Ahmednagar district of Maharashtra on the Pravara    River, is the largest Chalcolithic site of the Jorwe culture. It    is famous for the discovery of bronze objects including a chariot    drawn by a pair of bulls, an elephant, a rhinoceros, and a water    buffalo.</p>    <p style=\"orphans:0;widows:0\">3. Statement 3 is incorrect    because the Chalcolithic phase (Copper-Stone Age) was    characterized by the combined use of copper and stone tools. Iron    was completely unknown to the people of this phase; iron    technology emerged later around 1000 BCE in India.</p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the weightage of    items in the Consumer Price Index (Combined) in India:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. 'Food    and Beverages' has the highest weightage in the CPI (Combined)    basket.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2.    'Housing' has a higher weightage than the 'Miscellaneous' group in    the CPI (Combined) basket.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the statements given    above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both 1 and 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the Consumer Price Index (Combined) with base year 2012, the    weights assigned to the major groups are:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Food and    Beverages: 45.86% (highest)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">-    Miscellaneous: 28.32%</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Housing:    10.07%</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Fuel and    Light: 6.84%</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Clothing    and Footwear: 6.53%</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Pan,    Tobacco, and Intoxicants: 2.38%</p>    <p style=\"orphans:0;widows:0\">Therefore, Statement 1 is correct    as 'Food and Beverages' holds the largest weightage. Statement 2    is incorrect because the weightage of the 'Miscellaneous' group    (28.32%) is significantly higher than that of 'Housing' (10.07%).</p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following single membrane-bound cell organelles is    rich in hydrolytic enzymes, such as proteases, lipases, and    carbohydrases, that function optimally at an acidic pH?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Centrosome</p>", "option2": " <p style=\"orphans:0;widows:0\">    Ribosome</p>", "option3": " <p style=\"orphans:0;widows:0\">    Lysosome</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mesosome</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    Lysosomes are single membrane-bound vesicular cell organelles    formed by the Golgi apparatus. They contain an array of digestive    enzymes called hydrolytic enzymes (such as proteases, nucleases,    lipases, and carbohydrases) that break down cellular debris, waste    products, and foreign invaders. These enzymes are optimally active    in an acidic environment (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793722804565_html_9e36c394066d066.gif\" > ),    maintained by proton pumps within the lysosomal membrane.</p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0\">    <b>According to Koeppen’s climatic classification of India,    which letter code represents the 'Monsoon type with dry summer'    climate found predominantly along the Coromandel Coast?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Amw</p>", "option2": " <p style=\"orphans:0;widows:0\">    As</p>", "option3": " <p style=\"orphans:0;widows:0\">    Cwg</p>", "option4": " <p style=\"orphans:0;widows:0\">    Aw</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    According to Koeppen's scheme of climatic regions of India:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>As    (Monsoon type with dry summer):</b> Found predominantly along the    Coromandel Coast of Tamil Nadu and adjoining coastal areas. In    this region, rainfall occurs mostly during the winter    (retreating/northeast monsoon), leaving the summer dry.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Amw:</b>    Monsoon type with a short dry winter season, found along the west    coast of India south of Goa.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Cwg:</b>    Monsoon type with dry winters, found in the northern Ganga plains,    eastern Rajasthan, and parts of Assam.</p>    <p style=\"orphans:0;widows:0\"><b>Aw:</b> Tropical savanna    climate with dry winters, covering most of the peninsular plateau    south of the Tropic of Cancer.</p>", "question_heading": ""}, {"sr_no": 5, "question": "Wुicु inपधनnोपiयnोि पनधोपद ोiंौ पय ौपनधngपुधn पुध gियृोि नधौूयnौध पय पुध पुनधोप यी cिiंोपध cुोngध ृद ाधधूing ो gियृोि पधंूधनोपहनध नiौध पुiौ cधnपहनद थिधि ृिधयथ 2 कधgनधधौ Cिधसiहौ ोृयॅध ूनध-inकहौपनiोि िधॅिधस?", "option1": "<p style=\"orphans:0;widows:0\">    Paris Agreement</p>", "option2": " <p style=\"orphans:0;widows:0\">    Montreal Protocol</p>", "option3": " <p style=\"orphans:0;widows:0\">    Basel Convention</p>", "option4": " <p style=\"orphans:0;widows:0\">    Rotterdam Convention</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Paris Agreement is a legally binding international treaty on    climate change adopted by 196 Parties at COP 21 in Paris on 12    December 2015. Its overarching goal is to hold the increase in the    global average temperature to well below 2°C above pre-industrial    levels and to pursue efforts to limit the temperature increase to    1.5°C.</p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    <b>The 'Living Planet Report', which assesses the state of global    biodiversity and the health of the planet, is published biennially    by which of the following organisations?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    United Nations Environment Programme (UNEP)</p>", "option2": " <p style=\"orphans:0;widows:0\">    World Wide Fund for Nature (WWF)</p>", "option3": " <p style=\"orphans:0;widows:0\">    International Union for Conservation of Nature (IUCN)</p>", "option4": " <p style=\"orphans:0;widows:0\">    Intergovernmental Panel on Climate Change (IPCC)</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The 'Living Planet Report' is published every two years by the    World Wide Fund for Nature (WWF) in collaboration with the    Zoological Society of London. It tracks changes in global    biodiversity using the Living Planet Index (LPI), measuring trends    in vertebrate population abundance worldwide.</p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Which of the following statements about the ICC Under-19 Men's    Cricket World Cup, 2026 is/are correct?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. India    won this title for a record sixth time.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2. The    tournament was jointly hosted by Zimbabwe and Namibia.</b></p>    <p style=\"orphans:0;widows:0\"><b>Select the correct answer    using the code given below.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both 1 and 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Both statements 1 and 2 are correct.</p>    <p style=\"orphans:0;widows:0\">The 16th edition of the ICC    Under-19 Men's Cricket World Cup was held from January to February    2026, co-hosted by Zimbabwe and Namibia. In the final played on 6    February 2026 at the Harare Sports Club in Zimbabwe, India    defeated England by 100 runs to clinch a record-extending sixth    Under-19 World Cup title (previously won in 2000, 2008, 2012,    2018, and 2022).</p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the Fundamental    Rights guaranteed under the Constitution of India:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. The    Supreme Court of India declared the Right to Privacy as an    intrinsic part of the Right to Life and Personal Liberty under    Article 21 in the Justice K.S. Puttaswamy (Retd.) case (2017).</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2. The    Right to Privacy is an absolute right and cannot be subject to any    reasonable restrictions by the State.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3. Article    12 of the Universal Declaration of Human Rights (UDHR) recognizes    protection against arbitrary interference with an individual's    privacy.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the statements given    above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statement 1 is correct: In the landmark case <i>Justice K.S.    Puttaswamy (Retd.) v. Union of India (2017)</i>, a nine-judge    Constitution Bench of the Supreme Court unanimously held that the    Right to Privacy is a Fundamental Right protected under Article 21    and other freedoms in Part III of the Constitution.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Statement 2    is incorrect: Fundamental Rights in India are not absolute. The    Supreme Court explicitly held that the Right to Privacy is subject    to reasonable restrictions by the State, provided the restriction    passes the three-fold test of legality, legitimate state aim, and    proportionality.</p>    <p style=\"orphans:0;widows:0\">Statement 3 is correct: Article    12 of the Universal Declaration of Human Rights (UDHR), 1948,    affirms that \"No one shall be subjected to arbitrary    interference with his privacy, family, home or correspondence...\"    Thus, statements 1 and 3 are correct.</p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following poets was conferred the title of    'Andhra Kavita Pitamaha' (Grandfather of Telugu Poetry) in the    court of Vijayanagara emperor Krishnadevaraya?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Tenali Ramakrishna</p>", "option2": " <p style=\"orphans:0;widows:0\">    Allasani Peddana</p>", "option3": " <p style=\"orphans:0;widows:0\">    Dhurjati</p>", "option4": " <p style=\"orphans:0;widows:0\">    Pingali Surana</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Allasani Peddana was the foremost among the 'Ashtadiggajas' (the    eight legendary Telugu poets) in the court of the Vijayanagara    emperor Krishnadevaraya. He was bestowed with the prestigious    title 'Andhra Kavita Pitamaha' (Grandfather of Telugu Poetry). His    most celebrated work is 'Manucharitram' (also known as Svarochisha    Manu Sambhavamu).</p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Which of the following is/are components of the Liquidity    Adjustment Facility (LAF) corridor of the Reserve Bank of India    (RBI)?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1.    Standing Deposit Facility (SDF) rate</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2.    Marginal Standing Facility (MSF) rate</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3.    Marginal Cost of Funds based Lending Rate (MCLR)</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>4. Policy    Repo Rate</b></p>    <p style=\"orphans:0;widows:0\"><b>Select the correct answer    using the code given below:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    1, 2 and 4 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    2, 3 and 4 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2, 3 and 4</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Liquidity Adjustment Facility (LAF) corridor of the RBI    comprises three key rates: the Standing Deposit Facility (SDF)    rate as the floor, the Policy Repo Rate as the anchor/middle rate,    and the Marginal Standing Facility (MSF) rate as the ceiling. On    the other hand, the Marginal Cost of Funds based Lending Rate    (MCLR) is an internal benchmark used by commercial banks to    determine lending rates on loans and advances, and is not a    component of the RBI's LAF corridor. Hence, statements 1, 2, and 4    are correct.</p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0\">    <b>According to the land-use classification in India, a cultivable    land left uncultivated for more than one year but less than five    years is categorized as:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Current fallow</p>", "option2": " <p style=\"orphans:0;widows:0\">    Culturable wasteland</p>", "option3": " <p style=\"orphans:0;widows:0\">    Fallow other than current fallow</p>", "option4": " <p style=\"orphans:0;widows:0\">    Barren and unculturable land</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    According to land-use classification in India:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>Current    fallow:</b> Land left uncultivated for one or less than one    agricultural year to regain its fertility naturally.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>Fallow    other than current fallow:</b> Cultivable land left uncultivated    for more than one year but less than five years.</p>    <p style=\"orphans:0;widows:0\">3. <b>Culturable wasteland:</b>    Land left fallow for more than five years, which can be brought    under cultivation after reclamation.</p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the Global    Innovation Index (GII) 2026 released by the World Intellectual    Property Organization (WIPO):</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. India    has been ranked 38ᵗʰ among 139 economies.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2.    Switzerland secured the top rank in the index for the 16ᵗʰ    consecutive year.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the statements given    above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both 1 and 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Both statements 1 and 2 are correct.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">According to    the 19th edition of the Global Innovation Index (GII) 2026    published by the World Intellectual Property Organization (WIPO):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">India secured    the <b>38ᵗʰ rank</b> among 139 economies, leading both the    lower middle-income group and the Central and Southern Asia    region.</p>    <p style=\"orphans:0;widows:0\"><b>Switzerland</b> emerged as the    world's most innovative economy for the 16ᵗʰ consecutive year,    followed by Sweden and the United States.</p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>With reference to parallels of latitude, consider the following    statements:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. The    Equator is the only parallel of latitude that is a Great Circle.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2. The    linear distance of one degree of latitude is slightly greater at    the poles than at the Equator due to the Earth's oblateness.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the statements given    above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both 1 and 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Both statements 1 and 2 are correct.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. A Great    Circle is any circle that divides the Earth into two equal    hemispheres and whose center coincides with the center of the    Earth. Among all parallels of latitude, only the Equator (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793722804565_html_96cbc0ded676e686.gif\" > )    passes through the center of the Earth, making it the only    parallel that is a Great Circle; all other parallels are small    circles.</p>    <p style=\"orphans:0;widows:0\">2. Because the Earth is an oblate    spheroid (flattened at the poles and bulging at the equator), the    radius of curvature is larger at the poles than at the equator.    Consequently, the ground distance of     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793722804565_html_62fa8cdfbd3e649.gif\" >     of latitude increases slightly from approximately     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793722804565_html_fc7de6e3def3b342.gif\" >     at the equator to about     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793722804565_html_86b81c64347006f3.gif\" >     at the poles.</p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>With reference to the 'MISHTI' (Mangrove Initiative for    Shoreline Habitats &amp; Tangible Incomes) scheme, consider the    following statements:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. It aims    at mangrove afforestation along the coastline and on salt pan    lands.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2. It was    announced in the Union Budget 2023-24.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3. It is    fully funded by the World Bank.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the statements given    above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statements 1 and 2 are correct, while statement 3 is incorrect.</p>    <p style=\"orphans:0;widows:0\">The MISHTI (Mangrove Initiative    for Shoreline Habitats &amp; Tangible Incomes) scheme was    announced in the Union Budget 2023-24 to promote intensive    mangrove plantation along the coastline and on salt pan lands    across 11 coastal states and 2 Union Territories. It is financed    through the convergence of existing schemes such as MGNREGS, CAMPA    (Compensatory Afforestation Fund Management and Planning    Authority) funds, and other resources, rather than being funded    solely by the World Bank.</p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0\">    <b>Among the monolithic rock-cut shrines known as the 'Pancha    Rathas' at Mamallapuram, which is the largest and most    architecturally elaborate ratha?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Bhima Ratha</p>", "option2": " <p style=\"orphans:0;widows:0\">    Arjuna Ratha</p>", "option3": " <p style=\"orphans:0;widows:0\">    Dharmaraja Ratha</p>", "option4": " <p style=\"orphans:0;widows:0\">    Draupadi Ratha</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Dharmaraja Ratha is the largest, tallest, and most    architecturally sophisticated among the monolithic 'Pancha Rathas'    at Mamallapuram, Tamil Nadu. Built during the reign of the Pallava    king Narasimhavarman I (Mamalla) in the 7th century, it is carved    from a single piece of granite and features a three-tiered    (tritala) pyramidal vimana. In contrast, the Draupadi Ratha is the    smallest of the group.</p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the Pradhan Mantri    Jan Dhan Yojana (PMJDY):</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. It was    launched by the Ministry of Finance to promote financial    inclusion.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2. It    provides an overdraft (OD) facility of up to ₹10,000 to eligible    account holders.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3. It    requires a mandatory minimum balance of ₹1,000 to be maintained    in the account.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the statements given    above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statements 1 and 2 are correct, while statement 3 is incorrect.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Pradhan    Mantri Jan Dhan Yojana (PMJDY) was launched on 28 August 2014 by    the Ministry of Finance (Department of Financial Services) to    ensure comprehensive financial inclusion in India.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Eligible    account holders can avail an overdraft facility of up to ₹10,000    (increased from ₹5,000).</p>    <p style=\"orphans:0;widows:0\">3. PMJDY accounts are    zero-balance accounts (Basic Savings Bank Deposit Accounts), and    there is no requirement to maintain any minimum balance.</p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>How many of the following statements about the Bhakti saint    Ramananda is/are correct?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. He is    credited with popularising the Bhakti movement in North India.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2. He    preached and composed his teachings exclusively in Sanskrit to    preserve orthodoxy.</b></p>    <p style=\"orphans:0;widows:0\"><b>3. His disciples included    people from different social backgrounds and castes, such as Kabir    and Ravidas.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only one</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only two</p>", "option3": " <p style=\"orphans:0;widows:0\">    All three</p>", "option4": " <p style=\"orphans:0;widows:0\">    None</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statements 1 and 3 are correct, while statement 2 is incorrect:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>Statement    1 is correct:</b> Ramananda is traditionally regarded as the    bridge between South Indian and North Indian Bhakti traditions,    famously summarized in the saying: <i>\"Bhakti dravid upji,    laye Ramanand\"</i> (Bhakti arose in the South and was brought    to the North by Ramananda).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>Statement    2 is incorrect:</b> Ramananda discarded the exclusive use of    Sanskrit and chose to preach in the local vernacular language    (Hindi), making his teachings accessible to the common masses.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. <b>Statement    3 is correct:</b> Ramananda was a liberal reformer who admitted    disciples regardless of caste or gender. His diverse disciples    included Kabir (a weaver), Ravidas (a leatherworker), Sena (a    barber), Sadhana (a butcher), and Dhanna (a Jat peasant).</p>    <p style=\"orphans:0;widows:0\">Thus, exactly two statements are    correct.</p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Which of the following are among the core priority themes    outlined for the G20 under the 2026 Presidency of the United    States?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1.    Unleashing economic prosperity by limiting regulatory burdens</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2.    Unlocking affordable and secure energy supply chains</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3.    Pioneering innovations in artificial intelligence and emerging    technologies</b></p>    <p style=\"orphans:0;widows:0\"><b>Select the correct answer    using the code given below:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "option4": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The United States formally assumed the G20 Presidency for 2026 on    December 1, 2025, heading toward the G20 Leaders' Summit in Miami,    Florida. The U.S. G20 Presidency outlined three core priority    themes focused on restoring the forum's foundational economic    mission: (1) unleashing economic prosperity by limiting/removing    regulatory burdens, (2) unlocking affordable and secure energy    supply chains, and (3) pioneering innovations in artificial    intelligence (AI) and emerging technologies. Therefore, statements    1, 2, and 3 are all correct.</p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following was NOT a component of the constructive    programme of the Non-Cooperation Movement launched under Mahatma    Gandhi's leadership?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Promotion of Khadi and hand-spinning</p>", "option2": " <p style=\"orphans:0;widows:0\">    Establishment of national educational institutions</p>", "option3": " <p style=\"orphans:0;widows:0\">    Removal of untouchability and fostering communal unity</p>", "option4": " <p style=\"orphans:0;widows:0\">    Organizing an armed volunteer corps to resist British authorities</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Non-Cooperation Movement (1920–1922) was firmly rooted in    the philosophy of non-violence (Ahimsa) and peaceful Satyagraha.    Its positive or constructive programme included popularizing Khadi    and charkha, opening national schools and colleges, establishing    arbitration panchayats, collecting funds for the Tilak Swaraj    Fund, eradicating untouchability, and promoting Hindu-Muslim    unity. The formation of any armed militia or reliance on violent    methods was completely contrary to Gandhian principles and was    never a part of the movement.</p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <b>The consumption of spurious liquor containing methanol often    leads to permanent blindness. This occurs because the metabolic    byproduct methanal specifically damages the:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    olfactory nerve</p>", "option2": " <p style=\"orphans:0;widows:0\">    auditory nerve</p>", "option3": " <p style=\"orphans:0;widows:0\">    optic nerve</p>", "option4": " <p style=\"orphans:0;widows:0\">    vagus nerve</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    When methanol is consumed, it is metabolized in the liver to    methanal (formaldehyde). Methanal reacts rapidly with cellular    components, coagulating protoplasm and specifically attacking the    optic nerve, which results in permanent blindness.</p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding Nominal GDP and    Real GDP:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. Nominal    GDP is calculated using the constant prices of a selected base    year, thereby adjusting for inflation.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2. Real    GDP provides a better indicator of economic growth than Nominal    GDP because it isolates the effect of price changes and reflects    only changes in output.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the statements given    above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both 1 and 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statement 1 is incorrect: Nominal GDP is evaluated at current    market prices without adjusting for inflation, whereas Real GDP is    calculated using constant prices of a base year.</p>    <p style=\"orphans:0;widows:0\">Statement 2 is correct: Real GDP    eliminates the distorting effect of price-level changes (inflation    or deflation), thereby accurately reflecting the actual increase    or decrease in the volume of goods and services produced in an    economy. Therefore, Real GDP is considered a superior measure of    real economic growth.</p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>With reference to the administrative system of the Mauryan    Empire as described in Kautilya's Arthashastra, consider the    following statements:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1.    'Sitadhyaksha' was the superintendent of crown lands and    agriculture.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2.    'Samaharta' was the chief officer responsible for the collection    of revenue.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3.    'Kupyadhyaksha' was the superintendent of weights and measures.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the statements given    above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct statements are 1 and 2.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Statement    1 is correct:</b> Under the Mauryan administration, the    <i>Sitadhyaksha</i> was the superintendent of agriculture who    managed the state-owned/crown lands (called <i>Sita</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Statement    2 is correct:</b> The <i>Samaharta</i> was the collector-general    of revenue who supervised revenue collection throughout the    empire, while the <i>Sannidhata</i> was the chief treasurer.</p>    <p style=\"orphans:0;widows:0\">• <b>Statement 3 is incorrect:</b>    The <i>Kupyadhyaksha</i> was the superintendent of forest produce    and raw materials. The officer in charge of weights and measures    was called <i>Pautavadhyaksha</i>.</p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding coastal    depositional landforms:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. A spit    is an elongated ridge of sand or shingle that projects into the    sea, attached to the mainland at one end.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2. A    tombolo is a wave-cut platform formed by relentless wave erosion    at the base of coastal sea cliffs.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3. Barrier    bars often enclose shallow bodies of seawater, leading to the    formation of lagoons.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the statements given    above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statements 1 and 3 are correct, while statement 2 is incorrect.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Statement    1 is correct:</b> A spit is an extended coastal depositional    landform formed by longshore drift. It is attached to land at one    end and projects out into the open sea or across a bay mouth.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Statement    2 is incorrect:</b> A tombolo is a depositional feature (a ridge    of sand or shingle) that links an offshore island to the mainland    or another island. A wave-cut platform, on the other hand, is an    erosional coastal landform carved by wave pounding at cliff bases.</p>    <p style=\"orphans:0;widows:0\">• <b>Statement 3 is correct:</b>    Barrier bars and spits built across bays often partially or    completely cut off seawater from the open sea, resulting in calm,    shallow coastal bodies of water called lagoons (e.g., Chilika Lake    in Odisha).</p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following statements is INCORRECT regarding    National Income Accounting?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Depreciation is subtracted from Gross National Product to    calculate Net National Product.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Transfer payments are excluded while estimating the National    Income.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Net Factor Income from Abroad is subtracted from Gross Domestic    Product to obtain Gross National Product.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The value of intermediate goods is excluded from GDP calculation    to avoid double counting.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    Statement C is incorrect because Gross National Product (GNP) is    obtained by <b>adding</b> Net Factor Income from Abroad (NFIA) to    Gross Domestic Product (GDP):     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793722804565_html_89338672cab397ad.gif\" > .    All other statements are correct: Net National Product equals GNP    minus depreciation, transfer payments are unearned receipts and    hence excluded from national income, and intermediate goods are    omitted to prevent the error of double counting.</p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Identify the type of cloud on the basis of the given    characteristics:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. They    are high-level, thin, sheet-like clouds that form a whitish,    transparent veil across large parts of the sky.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2. They    are composed almost entirely of ice crystals.</b></p>    <p style=\"orphans:0;widows:0\"><b>3. They produce a    characteristic optical phenomenon known as a 'halo' around the Sun    or Moon due to the refraction of light.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Altostratus</p>", "option2": " <p style=\"orphans:0;widows:0\">    Cirrostratus</p>", "option3": " <p style=\"orphans:0;widows:0\">    Cumulonimbus</p>", "option4": " <p style=\"orphans:0;widows:0\">    Nimbostratus</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct answer is <b>Cirrostratus</b>.</p>    <p style=\"orphans:0;widows:0\">Cirrostratus clouds are thin,    high-altitude clouds (usually found above 20,000 feet / 6,000    meters) composed of ice crystals. Because they form a thin,    transparent veil across the sky, sunlight and moonlight pass    through them easily. The hexagonal ice crystals in cirrostratus    clouds refract light, creating a distinctive ring or 'halo' of 22    degrees around the Sun or Moon. They often indicate an approaching    warm front and incoming precipitation within 12 to 24 hours.</p>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
