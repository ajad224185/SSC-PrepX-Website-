c 1956 historical novel on the 1947     Partition of India authored by <b>Khushwant Singh</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>The     God of Small Things (4)</b>: Debut novel set in Ayemenem (Kerala)     by <b>Arundhati Roy</b>, who became the <b>first Indian citizen     to win the Booker Prize (1997)</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>A     Suitable Boy (1)</b>: Monumental post-independence Indian novel     authored by <b>Vikram Seth</b> (also author of <i>The Golden     Gate</i>).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>The     White Tiger (2)</b>: Satirical novel by <b>Aravind Adiga</b>,     winner of the <b>2008 Man Booker Prize</b>. Important Facts:</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Midnight's     Children</b> (1981 Booker Prize &amp; Booker of Bookers) was     authored by <b>Salman Rushdie</b>, while <b>The Inheritance of     Loss</b> (2006 Booker Prize) was authored by <b>Kiran Desai</b>.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Tomb of Sand (</b><i><b>Ret     Samadhi</b></i><b>)</b>, written in Hindi by <b>Geetanjali Shree</b>     and translated into English by <b>Daisy Rockwell</b>, won the     <b>2022 International Booker Prize</b> (first Indian-language     book to win it). Exam Alert: <b>R.K. Narayan</b> created the     fictional South Indian town of <b>Malgudi</b> and won the <b>Sahitya     Akademi Award</b> for his novel <b>The Guide (1958)</b>.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <b>Under the </b><b>PM-RAHAT (Road Accident Victim Hospitalization    and Assured Treatment) Scheme</b><b>—launched on </b><b>February    13, 2026</b><b> by the Ministry of Road Transport and Highways    under Section 162 of the Motor Vehicles Act, 1988—what is the    maximum cashless trauma treatment cover provided per road accident    victim for the first 7 days across any road category in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    ₹1 lakh per victim</p>", "option2": " <p style=\"orphans:0;widows:0\">    ₹1.5 lakh per victim</p>", "option3": " <p style=\"orphans:0;widows:0\">    ₹2.5 lakh per victim</p>", "option4": " <p style=\"orphans:0;widows:0\">    ₹5 lakh per victim</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Funded through the <b>Motor Vehicle Accident Fund (MVAF)</b>, the    scheme integrates the Emergency Response Support System (<b>ERSS –    112</b>) with designated trauma-care hospitals to guarantee    immediate life-saving stabilization during the critical <b>\"Golden    Hour\"</b> without upfront payment.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">₹<b>1 lakh</b>:    Incorrect. The statutory cap per victim is ₹1.5 lakh.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">₹<b>1.5    lakh per victim</b>: Correct. Covers cashless stabilization and    hospital treatment up to ₹1.5 lakh for the first 7 days.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">₹<b>2.5    lakh</b>: Incorrect. Not the notified ceiling under PM-RAHAT.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">₹<b>5 lakh</b>:    Annual family health insurance cover under <b>Ayushman Bharat –    PM-JAY</b>, whereas PM-RAHAT provides ₹1.5 lakh specifically for    road accident trauma.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>PM Surya    Sarovar Yojana (PM-SSY)</b> (announced in Union Budget 2026–27    with an outlay of <b>₹5,070 crore</b> for FY 2026–27 to    2030–31, implemented by SECI) targets <b>5,000 MW of floating    solar capacity</b> with co-located battery storage.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Bharat-VISTAAR</b>    (announced in Union Budget 2026–27; Phase 1 launched in <b>March    2026</b>) is a multilingual, voice-first AI platform delivering    customized agricultural advisories to farmers.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Biopharma    SHAKTI</b> (announced in Union Budget 2026–27 with a <b>₹10,000    crore</b> outlay over 5 years) aims to establish India as a global    hub for biologics and biosimilars.</p>    <p style=\"orphans:0;widows:0\">Under <b>Section 161 of the Motor    Vehicles Act, 1988</b> (Hit-and-Run Compensation Scheme),    compensation stands at <b>₹2 lakh in case of death</b> and    <b>₹50,000 in case of grievous hurt</b>, complementing    <b>PM-RAHAT's</b> ₹1.5 lakh immediate cashless hospitalization    cover.</p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <b>How many total Padma Awards were approved by the President of    India on the eve of Republic Day 2026 (January 25, 2026), which    included 5 Padma Vibhushan awardees such as legendary actor    Dharmendra Singh Deol (Posthumous), former Kerala CM V. S.    Achuthanandhan (Posthumous), and Hindustani violinist N. Rajam?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    131 Awards (5 Padma Vibhushan, 13 Padma Bhushan, 113 Padma Shri)</p>", "option2": " <p style=\"orphans:0;widows:0\">    139 Awards (7 Padma Vibhushan, 19 Padma Bhushan, 113 Padma Shri)</p>", "option3": " <p style=\"orphans:0;widows:0\">    128 Awards (4 Padma Vibhushan, 17 Padma Bhushan, 107 Padma Shri)</p>", "option4": " <p style=\"orphans:0;widows:0\">    132 Awards (5 Padma Vibhushan, 17 Padma Bhushan, 110 Padma Shri)</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Announced annually on the eve of Republic Day, the 2026 Padma list    featured <b>19 women awardees</b>, <b>16 posthumous honorees</b>,    <b>6 Foreigners/NRI/PIO/OCI recipients</b>, and <b>2 duo cases</b>    (counted as one award each).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>a) 131    Awards (5–13–113)</b>: Correct. Official Padma Awards tally    for <b>2026</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>b) 139    Awards (7–19–113)</b>: Official Padma Awards tally for the    previous year (<b>2025</b>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>All 5    Padma Vibhushan 2026 Recipients</b>: <b>Dharmendra Singh Deol</b>    (Posthumous, Art – Maharashtra), <b>V. S. Achuthanandhan</b>    (Posthumous, Public Affairs – Kerala), <b>K. T. Thomas</b>    (Public Affairs – Kerala), <b>N. Rajam</b> (Art – Uttar    Pradesh), and <b>P. Narayanan</b> (Literature &amp; Education –    Kerala).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Prominent    Padma Bhushan 2026 Recipients</b>: <b>Mammootty</b> (Art), <b>Alka    Yagnik</b> (Art), <b>Piyush Pandey</b> (Posthumous, Art), <b>Shibu    Soren</b> (Posthumous, Public Affairs), <b>Uday Kotak</b> (Trade &amp;    Industry), and <b>Vijay Amritraj</b> (Sports).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Prominent    Padma Shri 2026 Sports Recipients</b>: Indian cricket captains    <b>Rohit Sharma</b> and <b>Harmanpreet Kaur Bhullar</b>, Indian    women's hockey goalkeeper <b>Savita Punia</b>, and para-high    jumper <b>Praveen Kumar</b>.</p>    <p style=\"orphans:0;widows:0\"><b>Bharat Ratna</b> and <b>Padma    Awards</b> were instituted on <b>January 2, 1954</b>; no Bharat    Ratna was conferred in 2025 or 2026, keeping the total Bharat    Ratna recipient count at <b>53</b>.</p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <b>Who was awarded the 2026 Nobel Peace Prize by the Norwegian    Nobel Committee in October 2026 \"for her efforts to promote    peace and international law\"?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Nihon Hidankyo</p>", "option2": " <p style=\"orphans:0;widows:0\">    María Corina Machado</p>", "option3": " <p style=\"orphans:0;widows:0\">    Anne Carson</p>", "option4": " <p style=\"orphans:0;widows:0\">    Navanethem \"Navi\" Pillay</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    A pioneering anti-apartheid lawyer who served as a judge on the    International Criminal Court (ICC) and President of the    International Criminal Tribunal for Rwanda (ICTR), Navi Pillay was    honored in October 2026.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Nihon    Hidankyo</b>: Japanese organization of atomic-bomb survivors that    won the <b>2024 Nobel Peace Prize</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>María    Corina Machado</b>: Venezuelan pro-democracy leader who won the    <b>2025 Nobel Peace Prize</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Anne    Carson</b>: Canadian poet and classicist who won the <b>2026 Nobel    Prize in Literature</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Navanethem    \"Navi\" Pillay</b>: Correct. Laureate of the <b>2026    Nobel Peace Prize</b>.<b> </b>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Complete    2026 Nobel Prize Laureates</b>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Physics</b>:    <b>Francis Halzen</b> (for contributions to the <b>IceCube    Neutrino Observatory</b> at the South Pole and discovery of    high-energy astrophysical neutrinos).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Chemistry</b>:    <b>Henri B. Kagan</b> and <b>Kenso Soai</b> (for non-linear    effects and autocatalysis in asymmetric organic synthesis).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Physiology    or Medicine</b>: <b>Karl Deisseroth, Peter Hegemann, and Georg    Nagel</b> (for discoveries concerning light-gated ion channels and    <b>optogenetics</b>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Literature</b>:    <b>Anne Carson</b> (Canada).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Economic    Sciences</b>: <b>Robert E. Hall</b> and <b>Michael Woodford</b>    (for microeconomic foundations of macroeconomic stabilization).</p>    <p style=\"orphans:0;widows:0\"><b>Karl Deisseroth, Peter    Hegemann, and Georg Nagel</b> won the <b>2026 Nobel Prize in    Medicine</b> for discovering <b>channelrhodopsins</b>    (light-sensitive algal proteins) and pioneering <b>optogenetics</b>,    which enables controlling specific neurons using light.</p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <b>Which breakthrough astrophysics observatory at the South    Pole—led by 2026 Nobel Prize in Physics laureate Francis    Halzen—embeds thousands of optical sensors deep inside Antarctic    glacial ice to detect high-energy cosmic neutrinos?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Vera C. Rubin Observatory</p>", "option2": " <p style=\"orphans:0;widows:0\">    LIGO-India Observatory</p>", "option3": " <p style=\"orphans:0;widows:0\">    Square Kilometre Array (SKA)</p>", "option4": " <p style=\"orphans:0;widows:0\">    IceCube Neutrino Observatory</p>", "answer": "4", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Because nearly massless, electrically neutral <b>neutrinos</b>    pass straight through galaxies and magnetic fields without    deflection, IceCube uses a cubic kilometer of ultra-clear    Antarctic ice as a Cherenkov radiation detector to pinpoint cosmic    particle accelerators like active galactic nuclei (blazars).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Vera C.    Rubin Observatory</b>: Wide-field optical survey telescope located    on <b>Cerro Pachón in Chile</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>LIGO-India    Observatory</b>: Upcoming gravitational-wave detector being built    in <b>Hingoli district, Maharashtra</b> (in collaboration with    Caltech and MIT).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Square    Kilometre Array (SKA)</b>: World's largest next-generation radio    telescope network being constructed across <b>South Africa and    Australia</b> (with India as a full member).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>IceCube    Neutrino Observatory</b>: Correct. South Pole neutrino telescope    honored with the 2026 Physics Nobel Prize. <b>India-based Neutrino    Observatory (INO)</b> is a proposed underground particle physics    project planned in <b>Bodi West Hills, Theni district (Tamil Nadu)</b>    to study atmospheric neutrinos.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Cherenkov    Radiation</b> is the characteristic blue glow emitted when a    charged particle travels through a dielectric medium (like water    or glacial ice) faster than the phase velocity of light in that    medium.</p>    <p style=\"orphans:0;widows:0\"><b>Neutrinos</b> are subatomic    leptons with <b>zero electric charge</b> and near-zero rest    mass—nicknamed <b>\"Ghost Particles\"</b> because    trillions pass through the human body every second without    interacting.</p>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }

    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);

  } catch (err) {

    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
