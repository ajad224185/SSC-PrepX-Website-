<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>5.) ENGLISH SECTIONAL TEST-1 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

ate    choice.</p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the following passage some words have been deleted.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Fill in    the blanks with the help of the alternatives given. Select the    most appropriate option for each number.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The Svalbard    Global Seed Vault, a secure backup facility for the world's crop    diversity, 1. ______deep inside a sandstone mountain on a remote    Arctic archipelago, has 2. ______witness to unprecedented climatic    shifts. In slightly over a decade 3. ______its formal    commissioning, this fortified repository has safeguarded over one    million distinct seed 4. ______. Dug into permafrost nearly 130    metres above sea level, the world's 5. ______gene bank remains    robust against catastrophic environmental upheavals, offering    humanity an indispensable agricultural insurance policy.</p>    <p style=\"orphans:0;widows:0\"><b>Select the most appropriate    option to fill in the blank No. 4.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    residues</p>", "option2": " <p style=\"orphans:0;widows:0\">    specimens</p>", "option3": " <p style=\"orphans:0;widows:0\">    relics</p>", "option4": " <p style=\"orphans:0;widows:0\">    antiques</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (B). <b>specimens</b>.</p>    <p style=\"orphans:0;widows:0\">In botanical and scientific gene    bank contexts, individual representative samples preserved for    genetic conservation are termed <b>'specimens'</b>. <b>'Residues'</b>    refers to leftover traces; <b>'relics'</b> refers to surviving    objects of historical or religious significance; and <b>'antiques'</b>    refers to valuable old historical items.</p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the following passage some words have been deleted.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Fill in    the blanks with the help of the alternatives given. Select the    most appropriate option for each number.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The Svalbard    Global Seed Vault, a secure backup facility for the world's crop    diversity, 1. ______deep inside a sandstone mountain on a remote    Arctic archipelago, has 2. ______witness to unprecedented climatic    shifts. In slightly over a decade 3. ______its formal    commissioning, this fortified repository has safeguarded over one    million distinct seed 4. ______. Dug into permafrost nearly 130    metres above sea level, the world's 5. ______gene bank remains    robust against catastrophic environmental upheavals, offering    humanity an indispensable agricultural insurance policy.</p>    <p style=\"orphans:0;widows:0\"><b>Select the most appropriate    option to fill in the blank No. 5.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    secure</p>", "option2": " <p style=\"orphans:0;widows:0\">    most secure</p>", "option3": " <p style=\"orphans:0;widows:0\">    most securest</p>", "option4": " <p style=\"orphans:0;widows:0\">    more secure</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (B). <b>most secure</b>.</p>    <p style=\"orphans:0;widows:0\">The superlative degree is    required to describe the gene bank in comparison with all others    globally ('the world's...'). For the adjective <b>'secure'</b>,    the standard superlative form is <b>'most secure'</b>. 'Most    securest' is an incorrect double superlative, 'more secure' is    comparative, and 'secure' is positive.</p>", "question_heading": ""}, {"sr_no": 14, "question": " <p plural     'employees').</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option D    incorrectly changes the tense to simple past ('did... comply').</p>    <p style=\"orphans:0;widows:0\">Therefore, <b>Option A</b> is the    correct answer.</p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Parts of the following sentence have been given as options. One of    them may contain a grammatical error. Select the option that has    the error. If there is no error, select 'No error'.</p>    <p style=\"orphans:0;widows:0\">He seldom visits his hometown    these days, doesn't he?</p>", "option1": "<p style=\"orphans:0;widows:0\">    He seldom visits</p>", "option2": " <p style=\"orphans:0;widows:0\">    his hometown these days</p>", "option3": " <p style=\"orphans:0;widows:0\">    doesn't he?</p>", "option4": " <p style=\"orphans:0;widows:0\">    No error</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The error lies in the segment <b>'doesn't he?'</b>.</p>    <p style=\"orphans:0;widows:0\">The adverb <b>'seldom'</b>    conveys a negative meaning. When a statement contains a    semi-negative word like <i>seldom, rarely, hardly, scarcely,</i>    or <i>barely</i>, it is treated as a negative sentence and must    take a positive (affirmative) question tag. Therefore, <b>'does    he?'</b> should be used instead of <b>'doesn't he?'</b>.</p>", "question_heading": ""}, {"sr_no": 16, "question": "Rधोक पुध ूोौौोgध ोnक ोnौथधन पुध तहधौपiयnौ पुोप ीियियथ. Iप iौ ो cहनiयहौ ूोनोकयस यी ुहंोn nोपहनध पुोप ोंृiपiयn iौ धiपुधन ॅधnधनोपधक यन कiौूोनोgधक कधूधnकing यn पुध ciनcहंौपोncधौ in थुicु iप iौ कiौूिोदधक. A cयनूयनोपध पiपोn थुय निधधnिपधौौिद ूहनौहधौ gनोnक ोcुiधॅधंधnपौ iौ ौुयथधनधक थiपु ूनोiौध ीयन ुiौ ॅiौiयn ोnक कधपधनंinोपiयn. Iी ौहcु ो िधोकधन थधनध पय ौुयथ ुधौiपोपiयn यन cयnपधnपंधnप थiपु ंयकधौप gोinौ, ुiौ ूधधनौ थयिहक कधधं ">    Naveen told his friend that I could not join the football practice    today.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Naveen says to his friend that he could not join the football    practice that day.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The rules for converting an assertive sentence from direct to    indirect speech are:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     reporting verb <b>‘said to’</b> changes to <b>‘told’</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     conjunction <b>‘that’</b> is used to connect the reporting     clause and reported speech.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     pronoun <b>‘I’</b> changes to <b>‘he’</b> according to     the subject (Naveen).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     present modal <b>‘cannot’</b> changes to past modal <b>‘could     not’.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The time     expression <b>‘today’</b> changes to <b>‘that day’.</b></p>    </li></ul>    <p style=\"orphans:0;widows:0\">Thus, the sentence becomes:    “Naveen told his friend that he could not join the football    practice that day.”</p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate antonym of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>EXECRATE</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Abominate</p>", "option2": " <p style=\"orphans:0;widows:0\">    Extol</p>", "option3": " <p style=\"orphans:0;widows:0\">    Berate</p>", "option4": " <p style=\"orphans:0;widows:0\">    Censure</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>B. Extol</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The word    <b>'execrate'</b> means to feel or express great loathing for    someone or something, or to denounce vehemently.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The word    <b>'extol'</b> means to praise enthusiastically and highly.    Therefore, <b>'extol'</b> is the most appropriate antonym.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meanings    of other options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Abominate:</b>     To hate or detest intensely (Synonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Berate:</b>     To scold or criticize angrily (Synonym).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Censure:</b> To express     severe formal disapproval (Synonym).</p>    </li></ul>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">The institute has introduced a    mentoring program ______ senior students guide newcomers through    their first semester.</p>", "option1": "<p style=\"orphans:0;widows:0\">    whereas</p>", "option2": " <p style=\"orphans:0;widows:0\">    whereby</p>", "option3": " <p style=\"orphans:0;widows:0\">    whereof</p>", "option4": " <p style=\"orphans:0;widows:0\">    wherefore</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct word to fill in the blank is <b>whereby</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Explanation:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Whereby</b>     is a formal conjunction meaning 'by which' or 'through which',     used to describe a system, method, or arrangement by which     something is accomplished. Here, it refers to the mechanism of     the mentoring program.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Whereas</b>     means 'in contrast or comparison with the fact that'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Whereof</b>     means 'of what' or 'of which'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Wherefore</b>     means 'for what reason' or 'why'.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, <b>whereby</b> fits    the context appropriately.</p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words.</p>    <p style=\"orphans:0;widows:0\">A person who attacks or destroys    established beliefs, traditions, or institutions</p>", "option1": "<p style=\"orphans:0;widows:0\">    Apostate</p>", "option2": " <p style=\"orphans:0;widows:0\">    Iconoclast</p>", "option3": " <p style=\"orphans:0;widows:0\">    Renegade</p>", "option4": " <p style=\"orphans:0;widows:0\">    Heretic</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitute is <b>Iconoclast</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Iconoclast:</b>     A person who attacks or criticizes settled beliefs, cherished     customs, or traditional institutions.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Apostate:</b>     A person who renounces or abandons a religious or political     belief or principle.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Renegade:</b>     An individual who deserts and betrays an organization, country,     or cause.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Heretic:</b> A person     holding opinions at variance with those of an established     religion or orthodox doctrine.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct direct form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">Rohan told Meera that they could    not submit the project that day because he had not completed the    analysis.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Rohan said to Meera, “We could not submit the project today    because I have not completed the analysis.”</p>", "option2": " <p style=\"orphans:0;widows:0\">    Rohan said to Meera, “They cannot submit the project that day    because he has not completed the analysis.”</p>", "option3": " <p style=\"orphans:0;widows:0\">    Rohan said to Meera, “We cannot submit the project today because    I have not completed the analysis.”</p>", "option4": " <p style=\"orphans:0;widows:0\">    Rohan said to Meera, “We cannot submit the project that day    because I had not completed the analysis.”</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert an indirect speech sentence into direct speech, follow    these rules:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     reporting verb <b>'told'</b> changes back to <b>'said to'</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     conjunction <b>'that'</b> is removed, and inverted commas are     introduced.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     pronoun <b>'they'</b> (referring to Rohan and Meera) changes to     first person plural <b>'we'</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     modal <b>'could not'</b> changes back to present form <b>'cannot'</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     adverb of time <b>'that day'</b> changes back to <b>'today'</b>.</p>
