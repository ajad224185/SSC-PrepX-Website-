   He requested his friend to lend him his camera tomorrow.</p>", "option3": " <p style=\"orphans:0;widows:0\">    He requested his friend to lend him his camera the next day.</p>", "option4": " <p style=\"orphans:0;widows:0\">    He asked his friend if he would lend him his camera the next day.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    To convert an imperative sentence expressing a request into    indirect speech, follow these rules:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     reporting verb <b>'said to'</b> is changed to <b>'requested'</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The word     <b>'Please'</b> is dropped as the sense of request is already     conveyed by <b>'requested'</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     reported verb takes the infinitive form, i.e., 'to lend'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     pronoun 'me' changes to 'him' (referring to the subject 'He'),     and <b>'your'</b> changes to <b>'his'</b> (referring to the     object 'his friend').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The time     adverb 'tomorrow' changes to 'the next day' or 'the following     day'.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence, the correct indirect    sentence is: <b>He requested his friend to lend him his camera the    next day.</b></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Identify the segment in the sentence which contains a grammatical    error.</p>    <p style=\"orphans:0;widows:0\">Before moving to the city, they    use to spend their weekends working in the family orchard.</p>", "option1": "<p style=\"orphans:0;widows:0\">    working in the family orchard</p>", "option2": " <p style=\"orphans:0;widows:0\">    their weekends</p>", "option3": " <p style=\"orphans:0;widows:0\">    they use to spend</p>", "option4": " <p style=\"orphans:0;widows:0\">    Before moving to the city</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The error lies in the segment <b>'they use to spend'</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">To     express a past habit or routine action that no longer happens,     the correct modal construction is <b>'used to + base verb'</b>,     not 'use to'.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Therefore,     <b>'use to'</b> must be replaced with <b>'used to'</b> to make     the sentence grammatically correct.</p>    </li></ul>    <p style=\"orphans:0;widows:0\"><b>Correct sentence:</b> Before    moving to the city, they <i>used to</i> spend their weekends    working in the family orchard.</p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct passive form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">Deliver the parcels before noon.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The parcels should be delivering before noon.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Let the parcels be delivered before noon.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Let the parcels delivered before noon.</p>", "option4": " <p style=\"orphans:0;widows:0\">    You are requested to delivered the parcels before noon.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is an imperative sentence expressing an order    or instruction.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The standard    rule for converting an imperative sentence into passive voice is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Let +    Object + be + </b>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1793637549513_html_a2a1051d25850e4a.gif\" > <b>    (past participle) + remaining words</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Applying this    rule:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Active:    Deliver (Verb) + the parcels (Object) + before noon.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive: Let    + the parcels + be delivered + before noon.</p>    <p style=\"orphans:0;widows:0\">Hence, the correct passive form    is <b>Let the parcels be delivered before noon.</b></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\">    Select the misspelt word.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Idiosyncrasy</p>", "option2": " <p style=\"orphans:0;widows:0\">    Surrepticious</p>", "option3": " <p style=\"orphans:0;widows:0\">    Convalescence</p>", "option4": " <p style=\"orphans:0;widows:0\">    Bureaucracy</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The incorrectly spelt word is <b>Surrepticious</b>. The correct    spelling is <b>Surreptitious</b>, which means kept secret,    especially because it would not be approved of    (stealthy/clandestine).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other correctly spelt words:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Idiosyncrasy:</b>     An unusual or distinct feature or way of behaving peculiar to an     individual.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Convalescence:</b>     Time spent recovering from an illness or medical treatment.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Bureaucracy:</b> A system     of administration run by official departments with excessive     rules and procedures.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct indirect form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The manager said to Rohan, “Do    you know why the client has cancelled the order?”</p>", "option1": "<p style=\"orphans:0;widows:0\">    The manager asked Rohan whether he knows why the client has    cancelled the order.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The manager asked Rohan if he knew why the client had cancelled    the order.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The manager asked Rohan that if he knew why the client had    cancelled the order.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The manager asked Rohan if he had known why the client had    cancelled the order.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct indirect speech form is: <b>The manager asked Rohan if    he knew why the client had cancelled the order.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rules of    conversion:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     reporting verb <b>'said to'</b> changes to <b>'asked'</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">For a     Yes/No question starting with 'Do you...', the conjunction 'if'     or 'whether' is used (not 'that').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     present simple tense <b>'Do you know'</b> changes to the past     simple tense <b>'he knew'.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     present perfect tense <b>'has cancelled'</b> changes to the past     perfect tense <b>'had cancelled'.</b></p>     </li><li><p style=\"orphans:0;widows:0\">The pronoun <b>'you'</b>     changes to <b>'he'</b> corresponding to Rohan.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">Had the rescue team arrived just    an hour earlier, the stranded mountaineers ______ without    suffering severe frostbite.</p>", "option1": "<p style=\"orphans:0;widows:0\">    would be rescued</p>", "option2": " <p style=\"orphans:0;widows:0\">    could have been rescued</p>", "option3": " <p style=\"orphans:0;widows:0\">    will have been rescued</p>", "option4": " <p style=\"orphans:0;widows:0\">    had been rescued</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is a <b>Third Conditional</b> sentence with    inversion, which refers to an impossible past condition and its    hypothetical past result.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Structure of    Third Conditional with inversion:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Conditional     Clause:</b> Had + Subject + past participle (V3) (equivalent to     <i>If + Subject + had + V3</i>)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Main     Clause:</b> Subject + would/could/might + have + past participle     (or <i>have been + past participle</i> in the passive voice)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Since     the stranded mountaineers are the receivers of the action     (passive voice), the correct structure is <b>could have been     rescued</b>.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, <b>Option B</b> is the    correct answer.</p>", "question_heading": ""}, {"sr_no": 38, "question": "Giॅधn ृिधयथ ोनध ौiस ौधnपधncधौ यी ो ूोनोgनोूु. Sधnपधncध A iौ पुध ृधginning थुधनधोौ ौधnपधncध F iौ पुध िोौप ौधnपधncध यी पुध ूोनोgनोूु. Tुध ंiकिकध ीयहन ौधnपधncधौ ोनध ुहंृिधक हू. Sिधधcप पुध यूपiयn पुोप giॅधौ पुधiन cयननधcप यनकधन ीयनंing ो ंधोningीिह ोnक cयुधनधnप ूोनोgनोूु. A. Mयहnप Eॅधनधौप ुोौ ोिथोदौ ोपपनोcपधक ोकॅधnपहनयहौ ंयहnपोinधधनौ ीनयं ोcनयौौ पुध gियृध. B. Tुiौ gनोकहोि ूनयcधौौ ोिियथौ पुधiन ृयकiधौ पय ोकुहौप पय पुध कनोौपicोििद नधकहcधक यसदgधn िधॅिधस. C. Hयथधॅधन, नधोcुing पुध ौहंंiप नधतहiनधौ पनधंधnकयहौ ूुदौicोि ौपोंinो ोnक cोनधीिह ोccिiंोपप्रोपiयn. D. Wiपुयहप ौहीीiciधnप पiंध पय ोकोूप, cिiंृधनौ cोn ीोिि ॅicपiं पय ौधॅधनध ोिपiपहकध ौicाnधौौ. E. Tुधनधीयनध, पुधद ौूधnक ौधॅधनोि थधधो ोप कiीीधनधnप cोंूौ ोियng पुध ंयहnपोin ौियूधौ. F. Onिद ोीपधन पुiौ ूनधूोनोपiयn कय पुधद ंोाध पुधiन ीinोि ूहौु पयथोनक पुध ूधोा.", "option1": "<p style=\"orphans:0;widows:0\">    CDEB</p>", "option2": " <p style=\"orphans:0;widows:0\">    DCBE</p>", "option3": " <p style=\"orphans:0;widows:0\">    CEDB</p>", "option4": " <p style=\"orphans:0;widows:0\">    DBEC</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct logical order is <b>CDEB</b>:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence     <b>A</b> introduces mountaineers' attraction to Mount Everest.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence     <b>C</b> introduces the major challenge: the need for stamina and     acclimatization.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence     <b>D</b> explains what happens if they do not acclimatize (the     risk of altitude sickness).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence     <b>E</b> presents the solution to avoid this risk (spending     several weeks at different camps).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence     <b>B</b> refers directly to sentence E with 'This gradual     process', explaining how it helps their bodies adjust.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Finally,     sentence <b>F</b> naturally follows sentence B, concluding that     only after this preparation do they make the final push to the     summit.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Hence, the correct sequence of    the middle sentences is <b>C-D-E-B</b>.</p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option to fill in the blank.</p>    <p style=\"orphans:0;widows:0\">While your analysis highlights    the potential risks of the merger, ________ focuses predominantly    on the projected long-term gains.</p>", "option1": "<p style=\"orphans:0;widows:0\">    their</p>", "option2": " <p style=\"orphans:0;widows:0\">    their's</p>", "option3": " <p style=\"orphans:0;widows:0\">    theirs</p>", "option4": " <p style=\"orphans:0;widows:0\">    they're</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The blank requires an independent possessive pronoun to act as the    subject of the clause ('________ focuses predominantly...'),    standing in place of 'their analysis'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Key points:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>theirs:</b>     Correct. It is an absolute possessive pronoun that can function     independently as a subject without an accompanying noun.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>their:</b>     Incorrect. It is a possessive determiner (adjective) and must be     followed by a noun (e.g., 'their report').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>their's:</b>     Incorrect. Possessive pronouns (hers, yours, ours, theirs, its)     never take an apostrophe.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>they're:</b>     Incorrect. It is a contraction of 'they are', which is     grammatically incorrect here.</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, <b>theirs</b> is the    correct answer.</p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate option that can substitute the    underlined segment in the given sentence. If no substitution is    required, select ‘No substitution required’.</p>    <p style=\"orphans:0;widows:0\">She seldom goes out without an    umbrella during the monsoon, <u>doesn't she</u>?</p>", "option1": "<p style=\"orphans:0;widows:0\">    does she?</p>", "option2": " <p style=\"orphans:0;widows:0\">    is she?</p>", "option3": " <p style=\"orphans:0;widows:0\">    No substitution required</p>", "option4": " <p style=\"orphans:0;widows:0\">    didn't she?</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is<b> A. does she?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The word    <b>‘seldom’</b> is a negative adverb, which gives the main    clause a negative meaning. According to the rules of question    tags, a negative statement takes a positive question tag. Since    the sentence is in the simple present tense (<b>‘goes’</b>)    with a third-person singular subject (<b>‘she’</b>), the    correct auxiliary verb is <b>‘does’</b>.</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct question    tag is <b>‘does she?</b>’.</p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words.</p>    <p style=\"orphans:0;widows:0\">An extreme or irrational fear of    heights</p>", "option1": "<p style=\"orphans:0;widows:0\">    Claustrophobia</p>", "option2": " <p style=\"orphans:0;widows:0\">    Acrophobia</p>", "option3": " <p style=\"orphans:0;widows:0\">    Agoraphobia</p>", "option4": " <p style=\"orphans:0;widows:0\">    Nyctophobia</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitute for 'an extreme or irrational fear    of heights' is <b>Acrophobia</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Claustrophobia:</b>     Fear of confined or enclosed spaces.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Agoraphobia:</b>     Fear of open or crowded places.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Nyctophobia:</b> Fear of     darkness or night.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate synonym of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>PROSAIC</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Ingenious</p>", "option2": " <p style=\"orphans:0;widows:0\">    Pedestrian</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sublime</p>", "option4": " <p style=\"orphans:0;widows:0\">    Resplendent</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct synonym of <b>PROSAIC</b> is <b>Pedestrian</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Prosaic</b>     means lacking poetic beauty; dull, unimaginative, or commonplace.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Pedestrian</b>     (when used as an adjective) means lacking inspiration or     excitement; dull, ordinary, or commonplace.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meanings    of the other options</b>:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Ingenious</b>:     Clever, original, and inventive.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sublime</b>:     Of very great excellence, grandeur, or beauty.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Resplendent</b>:     Attractive and impressive through being richly colourful or     shining.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct indirect form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">Rohan said to his sister, “I    bought a new laptop yesterday.”</p>", "option1": "<p style=\"orphans:0;widows:0\">    Rohan told his sister that he bought a new laptop the previous    day.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Rohan told his sister that he had bought a new laptop the previous    day.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Rohan told his sister that he has bought a new laptop the day    before.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Rohan told his sister that he had bought a new laptop yesterday.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The rules for converting direct speech to indirect speech in this    context are:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Reporting     verb <b>'said to'</b> changes to <b>'told'</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Inverted     commas are replaced by the conjunction <b>'that'</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     pronoun 'I' refers to the subject 'Rohan', so it changes to <b>'he'</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Simple     <b>past tense</b> ('bought') changes to <b>past perfect tense</b>     ('had bought').</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The time     expression <b>'yesterday'</b> changes to <b>'the previous day'     </b>(or 'the day before').</p>    </li></ul>    <p style=\"orphans:0;widows:0\">Therefore, the correct sentence    is: <i>Rohan told his sister that he had bought a new laptop the    previous day.</i></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Parts of the given sentence have been given as options. One of    them may contain a grammatical error. Select the option that has    the error. If there is no error, select ‘No error’.</p>    <p style=\"orphans:0;widows:0\">The young violinist's performance    was as captivating if not more enthralling than that of the    seasoned maestro.</p>", "option1": "<p style=\"orphans:0;widows:0\">    was as captivating if not</p>", "option2": " <p style=\"orphans:0;widows:0\">    The young violinist's performance</p>", "option3": " <p style=\"orphans:0;widows:0\">    more enthralling than</p>", "option4": " <p style=\"orphans:0;widows:0\">    No error</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The error lies in the part <b>\"was as captivating if not\"</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Rule:</b>    When two degrees of comparison (positive and comparative) are    combined in a single sentence using expressions like <i>'if not'</i>,    both comparative constructions must be grammatically complete. The    positive degree structure requires <b>as + adjective + as</b>,    while the comparative degree requires <b>comparative adjective +    than</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Here, the    second 'as' was omitted. The correct phrasing should be: <i>\"was    </i><i><b>as captivating as</b></i><i>, if not more enthralling    than...\"</i>.</p>    <p style=\"orphans:0;widows:0\">Therefore, <b>option A</b>    contains the error.</p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Identify the segment in the sentence which contains a grammatical    error.</p>    <p style=\"orphans:0;widows:0\">The local residents were deprived    from basic necessities such as clean water and electricity.</p>", "option1": "<p style=\"orphans:0;widows:0\">    such as clean water</p>", "option2": " <p style=\"orphans:0;widows:0\">    were deprived from</p>", "option3": " <p style=\"orphans:0;widows:0\">    The local residents</p>", "option4": " <p style=\"orphans:0;widows:0\">    and electricity</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>B. were deprived from</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The verb    <b>'deprive'</b> is followed by the fixed preposition <b>of</b>,    not 'from' (deprive someone/something of something). Therefore,    <b>'deprived from'</b> should be replaced with <b>'deprived of'</b>    to make the sentence grammatically correct.</p>    <p style=\"orphans:0;widows:0\"><b>Correct sentence:</b> The    local residents were deprived of basic necessities such as clean    water and electricity.</p>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
