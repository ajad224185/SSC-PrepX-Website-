<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>32.) ENGLISH SECTIONAL TEST-4 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

const questions = [{"sr_no": 1, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the idiom that contextually fits the blank to complete the    following sentence most suitably.</p>    <p style=\"orphans:0;widows:0\">During the financial audit, the    chief compliance officer instructed the junior analysts to    ________ and verify that every ledger entry adhered strictly to    the statutory guidelines.</p>", "option1": "<p style=\"orphans:0;widows:0\">    throw in the towel</p>", "option2": " <p style=\"orphans:0;widows:0\">    go by the book</p>", "option3": " <p style=\"orphans:0;widows:0\">    spill the beans</p>", "option4": " <p style=\"orphans:0;widows:0\">    cut corners</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The idiom <b>'go by the book'</b> means to strictly follow    official rules, regulations, or established procedures. In the    given sentence, the junior analysts are required to follow    statutory guidelines meticulously, making 'go by the book' the    most appropriate choice.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other idioms:</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Throw     in the towel:</b> To give up or admit defeat.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Spill     the beans:</b> To reveal a secret, often inadvertently.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Cut corners:</b> To do     something in an easy or careless way, often ignoring rules or     standards to save time or money.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The sentence given below is divided into four segments labelled P,    Q, R, and S. Read the sentence carefully to determine which    segment contains a grammatical, syntactic, or idiomatic error.    Select the letter corresponding to that specific segment as your    answer. (Note: Every sentence contains exactly one error. Ignore    errors of punctuation, if any.)</p>    <p style=\"orphans:0;widows:0\">(P) Although the firm received    several lucrative acquisition offers from foreign conglomerates, /    (Q) the board of directors unanimously resolved to turn down them    / (R) in order to protect the company's proprietary technology /    (S) and preserve its autonomy in the domestic market.</p>", "option1": "<p style=\"orphans:0;widows:0\">    P</p>", "option2": " <p style=\"orphans:0;widows:0\">    Q</p>", "option3": " <p style=\"orphans:0;widows:0\">    R</p>", "option4": " <p style=\"orphans:0;widows:0\">    S</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (B) <b>Q</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The phrasal    verb <i>turn down</i> (meaning to reject or refuse) is a separable    transitive phrasal verb. When the object of a separable phrasal    verb is a personal pronoun (such as <i>it, them, him, her</i>),    the pronoun must be placed between the verb and the particle, not    after the particle.</p>    <p style=\"orphans:0;widows:0\">Therefore, <b>turn down them</b>    is incorrect and must be replaced with <b>turn them down</b>.</p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The sentence given below is divided into four segments labelled P,    Q, R, and S. Read the sentence carefully to determine which    segment contains a grammatical, syntactic, or idiomatic error.    Select the letter corresponding to that specific segment as your    answer. (Note: Every sentence contains exactly one error. Ignore    errors of punctuation, if any.)</p>    <p style=\"orphans:0;widows:0\">(P) Confronted with undeniable    documentary evidence by the audit committee, / (Q) the senior    executive was eventually compelled to own up his involvement / (R)    in the massive financial irregularities / (S) before formal    charges were framed by the regulatory authorities.</p>", "option1": "<p style=\"orphans:0;widows:0\">    P</p>", "option2": " <p style=\"orphans:0;widows:0\">    Q</p>", "option3": " <p style=\"orphans:0;widows:0\">    R</p>", "option4": " <p style=\"orphans:0;widows:0\">    S</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (B) <b>Q</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The phrasal    verb <b>'own up to'</b> means to admit or confess to having done    something wrong or embarrassing. It requires the preposition <b>'to'</b>    before its object (e.g., <i>own up to one's mistake/involvement</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In segment    (Q), the preposition 'to' is missing after 'own up'. The    grammatically correct phrase should be <i>\"compelled to own    up to his involvement\"</i>.</p>    <p style=\"orphans:0;widows:0\">Therefore, segment <b>Q</b>    contains the error.</p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct passive form of the given sentence.</p>    <p style=\"orphans:0;widows:0\">The gardener trimmed the    overgrown hedges before sunset.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The overgrown hedges have been trimmed by the gardener before    sunset.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The overgrown hedges were trimmed by the gardener before sunset.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The overgrown hedges were being trimmed by the gardener before    sunset.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The overgrown hedges had been trimmed by the gardener before    sunset.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the simple past tense (Active Voice:    Subject + V2 + Object).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The rule for    converting simple past tense into passive voice is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Object +    was/were + V3 + by + Subject + other words</b></p>    <p style=\"orphans:0;widows:0\">Here, 'the overgrown hedges' is    plural, so 'were trimmed' is the correct verb form. Hence, option    B is the correct passive form.</p>", "question_heading": ""}, {"sr_no": 5, "question": "In पुध ीियियथing तहधौपiयn, ो ौधnपधncध ुोौ ृधधn कiॅiकधक inपय ूोनपौ. Tुध ीiनौप ूोनप (S1) ोnक पुध िोौप ूोनप (S6) ोनध ीiसधक in पुधiन ूयौiपiयnौ. Rधोननोngध पुध नधंोining ूोनपौ (P, Q, R, ोnक S) पय ीयनं ो gनोंंोपicोििद cयननधcप ोnक ंधोningीिह ौधnपधncध, ोnक cुययौध पुध cयननधcप ौधतहधncध. S1: In पुध ुधोनप यी पुध ोnciधnप ciपद ौपययक पुध gनोnक िiृनोनद, थुicु थोौ नधnयथnधक पुनयहgुयहप पुध धंूiनध P: ंोnहौcनiूपौ ोnक पनधोपiौधौ ूनधौधनॅधक यn ूोूदनहौ ौcनियिस, थुiिध iपौ ॅोिहपधक नधोकing ुोििस थधनध iििहंinोपधक Q: ीयन ुयहौing पुध ंयौप cयंूनधुधnौiॅध ोnक कiॅधनौध cियिधcपiयn यी cिोौौicोि R: ृद ौिधnकधन ोिोृोौपधन िोंूौ ौहौूधnकधक ीनयं ोनcुधक cधiिingौ पुोप धcुयधक S: थiपु पुध तहiधप ंहनंहनौ यी ॅiौiपing ौcुियोनौ ोnक ौcनiृधौ िोृयनing कiिigधnिपद यॅधन नोनध पधसपौ, S6: cनधोपing ोn ोपंयौूुधनध यी नधॅधनधncध ोnक ृयहnिकधौौ inपिधिधcपहोि ूहनौहiप.", "option1": "<p style=\"orphans:0;widows:0\">    QPRS</p>", "option2": " <p style=\"orphans:0;widows:0\">    PQRS</p>", "option3": " <p style=\"orphans:0;widows:0\">    RQPS</p>", "option4": " <p style=\"orphans:0;widows:0\">    QSRP</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sequence is <b>QPRS</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>S1</b>    ends with \"renowned throughout the empire\", which    naturally connects with the prepositional phrase in <b>Q</b>: \"for    housing the most comprehensive and diverse collection of    classical...\".</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Part <b>Q</b>    ends with the adjective \"classical\", which directly    modifies the nouns in <b>P</b>: \"manuscripts and treatises    preserved on papyrus scrolls...\".</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Part <b>P</b>    concludes with the passive verb construction \"were    illuminated\", which links to the agent introduced by \"by\"    in <b>R</b>: \"by slender alabaster lamps suspended from    arched ceilings that echoed...\".</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Part <b>R</b>    ends with the verb \"echoed\", requiring the preposition    \"with\" found in <b>S</b>: \"with the quiet murmurs    of visiting scholars...\".</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">5. Finally, <b>S</b>    smoothly flows into the fixed concluding part <b>S6</b>: \"creating    an atmosphere of reverence and boundless intellectual pursuit.\"</p>    <p style=\"orphans:0;widows:0\">Thus, the coherent sentence is    formed by the order <b>QPRS</b>.</p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The following sentence has been divided into four parts (P, Q, R,    and S). The first part (S1) and the last part (S6) are fixed.    Rearrange the remaining parts to form a grammatically correct and    meaningful sentence, and choose the correct sequence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>S1:</b>    The monumental architecture of ancient Greece reflects a profound    dedication to proportion and symmetry, where temples were designed</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>P:</b> the    visual distortion caused by perspective, ensuring that the    structures appeared perfectly straight and balanced</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Q:</b> not    merely as functional places of worship but as harmonious    embodiments of civic pride and religious devotion, constructed</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>R:</b> to    the human eye, an extraordinary feat that showcased the builders'    mastery over geometry and stonework,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>S:</b>    with meticulously calculated column spacings and subtle optical    refinements known as entasis, which counteracted</p>    <p style=\"orphans:0;widows:0\"><b>S6:</b> ultimately    establishing enduring standards of aesthetic harmony that    influenced Western architecture for centuries.</p>", "option1": "<p style=\"orphans:0;widows:0\">    SQPR</p>", "option2": " <p style=\"orphans:0;widows:0\">    QSPR</p>", "option3": " <p style=\"orphans:0;widows:0\">    PQSR</p>", "option4": " <p style=\"orphans:0;widows:0\">    QPSR</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct sequence is <b>QSPR</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. <b>S1</b>    ends with 'where temples were designed', which is grammatically    continued by <b>Q</b> ('not merely as functional places of worship    but as harmonious embodiments... constructed').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. <b>Q</b>    ends with the participle 'constructed', which naturally pairs with    prepositional phrase in <b>S</b> ('with meticulously calculated    column spacings and subtle optical refinements... which    counteracted').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. <b>S</b>    concludes with the transitive verb 'counteracted', which requires    an object, provided by <b>P</b> ('the visual distortion caused by    perspective, ensuring that the structures appeared perfectly    straight and balanced').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. <b>P</b>    ends with 'balanced', which connects to <b>R</b> ('to the human    eye, an extraordinary feat...').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">5. <b>R</b>    flows seamlessly into the fixed closing segment <b>S6</b>    ('ultimately establishing enduring standards...').</p>    <p style=\"orphans:0;widows:0\">Hence, the coherent sentence    order is <b>QSPR</b>.</p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    A sentence in the Passive Voice is given below. From the four    alternatives, choose the one that best expresses the same sentence    in the Active Voice.</p>    <p style=\"orphans:0;widows:0\">It was suggested by the chairman    that the pending audit be completed by the external accountant    prior to the annual general meeting.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The chairman suggested that the external accountant completed the    pending audit prior to the annual general meeting.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The chairman suggested that the external accountant completes the    pending audit prior to the annual general meeting.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The chairman suggested that the external accountant complete the    pending audit prior to the annual general meeting.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The chairman suggested that the external accountant would complete    the pending audit prior to the annual general meeting.</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct active voice form is <b>\"The chairman suggested    that the external accountant complete the pending audit prior to    the annual general meeting.\"</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Key Rules:</p>    <p ोननोngध पुधं inपय ो ियgicोििद cयुधनधnप ोnक ंधोningीिह ूोनोgनोूु ोnक cुययौध पुध cयननधcप ौधतहधncध ीनयं पुध giॅधn यूपiयnौ. 1. Iप ोिियथौ inकiॅiकहोिस पय ंयniपयन पुधiन कोiिद ोcपiॅiपद, ौिधधू ूोपपधनnौ, ोnक ुधोनप नोपधौ. 2. Wधोनोृिध ीiपnधौौ पधcुnिययgद ुोौ gोinधक iंंधnौध ूयूिहोनiपद in नधcधnप दधोनौ. 3. Tुiौ cयnपinहयहौ ौपनधों यी ुधोिपु कोपो धncयहनोgधौ ूधयूिध पय ोकयूप ुधोिपुiधन िiीधौपिदधौ. 4. Aौ ो नधौिहप, ंयनध हौधनौ ोनध ोcपiॅिधद थयनाing पयथोनकौ ोcुiधॅing पुधiन ूधनौयnोि थिधिnधौौ gयोिस.", "option1": "<p style=\"orphans:0;widows:0\">    2-3-1-4</p>", "option2": " <p style=\"orphans:0;widows:0\">    2-1-3-4</p>", "option3": " <p style=\"orphans:0;widows:0\">    1-2-4-3</p>", "option4": " <p style=\"orphans:0;widows:0\">    3-1-2-4</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct logical sequence is <b>2-1-3-4</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>2</b>    serves as the introductory statement, introducing the central    subject: 'Wearable fitness technology'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>1</b>    follows logically by using the pronoun 'It' to elaborate on what    this wearable technology does (monitoring activity, sleep, and    heart rates).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence <b>3</b>    refers directly to the information mentioned in sentence 1 as    'This continuous stream of health data' and explains its positive    effect.</p>    <p style=\"orphans:0;widows:0\">Sentence <b>4</b> begins with the    concluding transitional phrase 'As a result', summarizing the    overall outcome of using this data.</p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Fill in the blank with the most appropriate option:</b></p>    <p style=\"orphans:0;widows:0\">In his keynote address, the    scholar chose to ________ on the philosophical underpinnings of    modern governance rather than confining himself to routine    procedural matters.</p>", "option1": "<p style=\"orphans:0;widows:0\">    expiate</p>", "option2": " <p style=\"orphans:0;widows:0\">    expatiate</p>", "option3": " <p style=\"orphans:0;widows:0\">    expropriate</p>", "option4": " <p style=\"orphans:0;widows:0\">    expatriate</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>expatiate</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meaning of    the words:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Expatiate:</b>    to speak or write at length or in detail about a subject    (consistently used with the preposition 'on' or 'upon'). In the    sentence, the scholar chose to speak in detail on the    philosophical underpinnings.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Expiate:</b>    to make amends or atone for (guilt, a sin, or wrongdoing).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Expropriate:</b>    to dispossess or confiscate property, especially by an authority    for public use.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Expatriate:</b>    to banish someone or reside outside one's native country.</p>    <p style=\"orphans:0;widows:0\">Therefore, <b>expatiate</b> is    the only contextually and grammatically correct fit.</p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate antonym of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Deleterious</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Baneful</p>", "option2": " <p style=\"orphans:0;widows:0\">    Salubrious</p>", "option3": " <p style=\"orphans:0;widows:0\">    Pernicious</p>", "option4": " <p style=\"orphans:0;widows:0\">    Inimical</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>'Deleterious'</b> means causing harm or damage    (harmful, detrimental, destructive).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">•    <b>'Salubrious'</b> means health-giving, beneficial, or wholesome,    which is the exact opposite (antonym) of deleterious.</p>    <p style=\"orphans:0;widows:0\">• <i>Baneful</i>, <i>Pernicious</i>,    and <i>Inimical</i> are synonyms meaning harmful, destructive, or    hostile.</p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate meaning of the given idiom: <b>\"To    take up the cudgels for\"</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    To defend or champion a cause or person vigorously</p>", "option2": " <p style=\"orphans:0;widows:0\">    To instigate violence against an opponent</p>", "option3": " <p style=\"orphans:0;widows:0\">    To admit defeat after a fierce debate</p>", "option4": " <p style=\"orphans:0;widows:0\">    To remain strictly neutral in a critical dispute</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The idiom <b>\"to take up the cudgels for\"</b> means to    vigorously defend, advocate for, or support someone or a specific    cause. A 'cudgel' is a short, thick stick used as a weapon, so the    metaphor implies picking up a weapon to fight on someone's behalf.</p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate synonym of the given word: <b>OBDURATE</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Intractable</p>", "option2": " <p style=\"orphans:0;widows:0\">    Malleable</p>", "option3": " <p style=\"orphans:0;widows:0\">    Pliant</p>", "option4": " <p style=\"orphans:0;widows:0\">    Ephemeral</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct synonym is <b>Intractable</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Obdurate</b>    refers to someone stubbornly refusing to change one's opinion,    course of action, or unyielding.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Intractable</b>    means not easily governed, managed, or directed; stubborn, making    it the most suitable synonym.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Meanings of    the other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Malleable:</b>    easily influenced, trained, or bent (antonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Pliant:</b>    readily yielding to persuasion or influence; flexible (antonym).</p>    <p style=\"orphans:0;widows:0\"><b>Ephemeral:</b> lasting for a    very short time; transient.</p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate antonym of the underlined word in the    given sentence.</p>    <p style=\"orphans:0;widows:0\">The young scientist's    revolutionary research earned an extravagant <u><b>encomium</b></u>    from the international academic community.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Accolade</p>", "option2": " <p style=\"orphans:0;widows:0\">    Homage</p>", "option3": " <p style=\"orphans:0;widows:0\">    Opprobrium</p>", "option4": " <p style=\"orphans:0;widows:0\">    Panegyric</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The underlined word <b>'encomium'</b> refers to a formal    expression of high praise or warm approval.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Let us look    at the meanings of the given options:<b>Accolade:</b> an    expression of praise, admiration, or an award (synonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Homage:</b>    special honour or respect shown publicly (synonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Opprobrium:</b>    harsh criticism, severe censure, or public disgrace (antonym).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Panegyric:</b>    a formal speech or text in high praise of someone (synonym).</p>    <p style=\"orphans:0;widows:0\">Therefore, <b>'Opprobrium'</b> is    the most appropriate antonym of 'encomium'.</p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Pick out the homonym from the given options that can suitably    complete both Sentence (P) and Sentence (Q) given below.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(P) The swift    and covert ________ of the fugitive financier by Interpol agents    in Zurich effectively dismantled the transnational    money-laundering syndicate.</p>    <p style=\"orphans:0;widows:0\">(Q) A palpable climate of nervous    ________ enveloped the trading floor as institutional investors    anxiously awaited the regulatory agency's antitrust ruling.</p>", "option1": "<p style=\"orphans:0;widows:0\">    extradition</p>", "option2": " <p style=\"orphans:0;widows:0\">    trepidation</p>", "option3": " <p style=\"orphans:0;widows:0\">    apprehension</p>", "option4": " <p style=\"orphans:0;widows:0\">    interception</p>", "answer": "3", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The word <b>apprehension</b> is polysemous (having multiple    distinct meanings):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. In    Sentence (P), <b>apprehension</b> refers to the act of arresting,    seizing, or capturing a criminal suspect or fugitive.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. In    Sentence (Q), <b>apprehension</b> denotes anxiety, dread, or a    fearful anticipation of a future event.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">None of the    other options can appropriately satisfy both contexts:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Extradition</b>    refers exclusively to the legal deportation or handover of an    accused individual; it cannot describe anxiety.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Trepidation</b>    means dread or alarm, but it cannot mean legal capture or arrest.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Interception</b>    refers to seizing or catching something en route and cannot mean    nervous dread.</p>    <p style=\"orphans:0;widows:0\">Therefore, <b>apprehension</b> is    the correct answer.</p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    Select the option that most appropriately expresses the meaning of    the given idiom: <b>'To steal a march on'</b>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    To discreetly gain a tactical advantage over an opponent by    preemptively initiating action before they become aware</p>", "option2": " <p style=\"orphans:0;widows:0\">    To intentionally breach corporate compliance by plagiarizing an    ongoing competitor's project</p>", "option3": "Tय यनcुधौपनोपध ोn हnोहपुयनप्रधक कधंयnौपनोपiयn in कधीiोncध यी धौपोृिiौुधक ोकंiniौपनोपiॅध ूनयपयcियस", "option4": " <p style=\"orphans:0;widows:0\">    To execute a rapid tactical withdrawal from an active engagement    to conserve vital logistical assets</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The idiom <b>'to steal a march on (someone)'</b> originated as a    military expression referring to an army marching secretly, often    by night, to attain an advantageous position over an adversary    before being discovered. In contemporary usage, it means to gain    an advantage over a rival by acting earlier, subtly, or    preemptively. Therefore, option A is the correct interpretation.</p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can suitably substitute the underlined    segment to improve the given sentence. If the sentence is correct    as written, select 'No improvement required'.</p>    <p style=\"orphans:0;widows:0\">The Minister of Foreign Affairs,    in consultation with senior military strategists, <u>have decided    that every one of the border checkpoints need to upgrade their</u>    surveillance protocols immediately.</p>", "option1": "<p style=\"orphans:0;widows:0\">    has decided that every one of the border checkpoints needs to    upgrade its</p>", "option2": " <p style=\"orphans:0;widows:0\">    has decided that every one of the border checkpoints need to    upgrade its</p>", "option3": " <p style=\"orphans:0;widows:0\">    have decided that every one of the border checkpoints needs to    upgrade their</p>", "option4": " <p style=\"orphans:0;widows:0\">    No improvement required</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>has decided that every one of the border    checkpoints needs to upgrade its</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">This sentence    contains three grammatical points:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Parenthetical    phrase:</b> When a singular subject (<i>The Minister of Foreign    Affairs</i>) is followed by parenthetical phrases such as <i>in    consultation with</i>, <i>along with</i>, or <i>as well as</i>,    the verb agrees with the primary subject. Therefore, the singular    verb <b>has decided</b> must be used rather than the plural <i>have    decided</i>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Distributive    pronoun agreement:</b> The construction <i>every one of + plural    noun</i> is grammatically singular and requires a singular verb.    Thus, <b>needs</b> is correct, not <i>need</i>.</p>    <p style=\"orphans:0;widows:0\"><b>Pronoun-antecedent agreement:</b>    The pronoun referring back to <i>every one of the border    checkpoints</i> must be singular and neuter (<b>its</b>), not    plural (<i>their</i>).</p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a one-word substitute for    the given group of words:</p>    <p style=\"orphans:0;widows:0\"><b>\"A clever and plausible,    but fallacious argument used deliberately to deceive or mislead.\"</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Sophism</p>", "option2": " <p style=\"orphans:0;widows:0\">    Aphorism</p>", "option3": " <p style=\"orphans:0;widows:0\">    Truism</p>", "option4": " <p style=\"orphans:0;widows:0\">    Solecism</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitute is <b>Sophism</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sophism:</b>    A clever, plausible, but misleading or fallacious argument    intended to deceive.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Aphorism:</b>    A concise, pithy observation that contains a general truth (e.g.,    \"actions speak louder than words\").</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Truism:</b>    A claim that is so obvious or self-evident that it is hardly worth    mentioning.</p>    <p style=\"orphans:0;widows:0\"><b>Solecism:</b> A grammatical    error in speech or writing, or a breach of good manners.</p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate phrasal verb to fill in the blank:</b></p>    <p style=\"orphans:0;widows:0\">The proposed amendments to the    labor code have ________ sharp criticism from industry experts and    trade unions alike.</p>", "option1": "<p style=\"orphans:0;widows:0\">    come in for</p>", "option2": " <p style=\"orphans:0;widows:0\">    come down to</p>", "option3": " <p style=\"orphans:0;widows:0\">    gone in for</p>", "option4": " <p style=\"orphans:0;widows:0\">    brought round to</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct phrasal verb is <b>come in for</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Meaning    and usage:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Come    in for:</b> to receive or be subjected to something unpleasant,    especially criticism, blame, or scrutiny (e.g., <i>\"The    policy has come in for heavy criticism.\"</i>).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Come    down to:</b> to depend on or be reducible to a particular point or    factor.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Go in    for:</b> to participate in, enjoy, or choose something as a hobby    or career.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• <b>Bring    round to:</b> to persuade someone to accept a particular opinion    or point of view.</p>    <p style=\"orphans:0;widows:0\">Since the sentence discusses    receiving sharp criticism, <b>come in for</b> is the most    appropriate choice.</p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the option that expresses the given sentence in passive    voice.</b></p>    <p style=\"orphans:0;widows:0\">Nobody was looking after the    injured passengers when the rescue team arrived.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The injured passengers were not looked after by anybody when the    rescue team arrived.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The injured passengers were not being looked after by anybody when    the rescue team arrived.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The injured passengers were not being looked by anybody when the    rescue team arrived.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The injured passengers had not been looked after by anybody when    the rescue team arrived.</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is in the <b>Past Continuous Tense</b> with a    negative subject ('Nobody') and a phrasal verb ('look after').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Rules for    conversion:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Active    structure:</b> Subject + was/were + V-ing + preposition + Object</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Passive    structure:</b> Object + was/were + not + being + V3 + preposition    + by + agent</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The    negative subject 'Nobody' changes to 'not ... by anybody' in the    passive voice.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. The object    'the injured passengers' is plural, so it takes the auxiliary verb    'were'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. In passive    voice for continuous tense, 'being' + V3 ('looked') is required.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. The    preposition 'after' associated with the phrasal verb must be    retained.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">5. The    dependent time clause 'when the rescue team arrived' remains    unchanged.</p>    <p style=\"orphans:0;widows:0\">Thus, the correct passive voice    sentence is: <i>\"The injured passengers were not being looked    after by anybody when the rescue team arrived.\"</i></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate option that can substitute the    underlined segment in the given sentence. If there is no need to    substitute it, select 'No substitution required'.</b></p>    <p style=\"orphans:0;widows:0\">Scarcely had the investigator    entered the crime scene when he <u>has noticed that someone    tampered</u> with the locker.</p>", "option1": "<p style=\"orphans:0;widows:0\">    had noticed that someone tampered</p>", "option2": " <p style=\"orphans:0;widows:0\">    noticed that someone had tampered</p>", "option3": " <p style=\"orphans:0;widows:0\">    notices that someone has tampered</p>", "option4": " <p style=\"orphans:0;widows:0\">    No substitution required</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is (B) <b>noticed that someone had tampered</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. In the    correlative structure <i>'Scarcely had + Subject + V3 ... when +    Subject + V2'</i>, the clause following 'when' takes the Simple    Past Tense. Hence, 'has noticed' must be replaced by the past form    <b>'noticed'</b>.</p>    <p style=\"orphans:0;widows:0\">2. Furthermore, the tampering    with the locker occurred prior to the investigator's arrival and    observation (an action completed before another past action).    Therefore, the past perfect tense (<b>'had tampered'</b>) must be    used to express this earlier past action.</p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the option that expresses the given sentence in indirect    speech.</b></p>    <p style=\"orphans:0;widows:0\">The manager said to the intern,    \"Do not share these confidential files with anyone unless you    are explicitly authorised to do so.\"</p>", "option1": "<p style=\"orphans:0;widows:0\">    The manager instructed the intern not to share those confidential    files with anyone unless he was explicitly authorised to do so.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The manager forbade the intern not to share those confidential    files with anyone unless he was explicitly authorised to do so.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The manager instructed the intern not to share these confidential    files with anyone unless he is explicitly authorised to do so.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The manager instructed the intern that not to share those    confidential files with anyone unless he was explicitly authorised    to do so.</p>", "answer": "1", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sentence is a negative imperative sentence containing a    subordinate conditional clause.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Rules for    converting to indirect speech:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The reporting    verb 'said to' is changed to an appropriate verb such as    'instructed', 'ordered', or 'told'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In negative    imperatives, \"Do not + V1\" becomes \"not to + V1\".</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    demonstrative adjective 'these' changes to 'those'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The    second-person pronoun 'you' changes to the third-person 'he'    (referring to 'the intern').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The simple    present tense verb 'are' in the subordinate clause changes to the    simple past 'was'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Note that    'forbade' already carries a negative meaning, so using 'not' with    it (as in option B) creates an incorrect double negative. Also,    'that' is not used before 'not to' in imperative sentences (as in    option D).</p>    <p style=\"orphans:0;widows:0\">Therefore, Option A is the    correct indirect form.</p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a <b>one-word substitute</b>    for the given group of words.</p>    <p style=\"orphans:0;widows:0\">'A bitter and vehement speech or    piece of writing attacking or denouncing someone'</p>", "option1": "<p style=\"orphans:0;widows:0\">    Encomium</p>", "option2": " <p style=\"orphans:0;widows:0\">    Philippic</p>", "option3": " <p style=\"orphans:0;widows:0\">    Accolade</p>", "option4": " <p style=\"orphans:0;widows:0\">    Paean</p>", "answer": "2", "negative_marking": "1", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct one-word substitute is <b>Philippic</b>.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Philippic:</b>    A bitter, vehement speech or written attack denouncing someone or    something (historically derived from speeches by Demosthenes    against Philip II of Macedon).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Encomium:</b>    A formal speech or piece of writing that praises someone or    something highly.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Accolade:</b>    An award, honor, or expression of praise.</p>    <p style=\"orphans:0;widows:0\"><b>Paean:</b> A song or    expression of praise, triumph, or thanksgiving.</p>", "question_heading": ""}, {"sr_no": 28, "question": "Rधोक पुध ीियियथing ूोौौोgध ोnक ोnौथधन पुध तहधौपiयnौ ृोौधक यn पुध ूोौौोgध : Tुध inपधgनोपiयn यी ोिgयनiपुंic कधciौiयn-ंोाing ौदौपधंौ inपय पुध cनiंinोि ुहौपicध ोूूोनोपहौ ुोौ ूनयॅयाधक ो ूनयीयहnक यnपिययgicोि नधोौौधौौंधnप यी ंयकधनn ुहनiौूनहकधnc
