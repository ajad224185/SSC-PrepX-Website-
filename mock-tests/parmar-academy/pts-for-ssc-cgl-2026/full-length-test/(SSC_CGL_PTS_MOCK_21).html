nt-size:12pt\">Article    4</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Article    1 describes India as a \"Union of States\" rather than a    'Federation of States'.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Article    2: Admission or establishment of new states.</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Article    3: Formation of new states and alteration of areas, boundaries, or    names of existing states.</span></span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">What    is the chemical name of Vitamin C?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Retinol</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Ascorbic    Acid</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Calciferol</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Thiamine</span></span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The    chemical name of Vitamin C is Ascorbic Acid. Its deficiency causes    Scurvy.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    Facts:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Vitamin    A: Retinol (Deficiency: Night Blindness)</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Vitamin    D: Calciferol (Deficiency: Rickets)</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Vitamin    B1: Thiamine (Deficiency: Beriberi)</span></span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Exercise    'SURYA KIRAN' is an annual joint military exercise conducted    between the armies of India and which of the following countries?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Sri    Lanka</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Nepal</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Bangladesh</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Bhutan</span></span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Exercise    Surya Kiran is a bilateral joint military exercise conducted    between India and Nepal to enhance counter-insurgency and jungle    warfare interoperability.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    Facts:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">India–Sri    Lanka: Mitra Shakti &amp; SLINEX</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">India–Bangladesh:    Sampriti &amp; BONGO SAGAR</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">India–Mongolia:    Nomadic Elephant</span></span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"page-break-inside:auto;orphans:0;widows:0;margin-bottom:0.19in;page-break-after:auto\">    <span style=\"font-family:'Times New Roman'\">Which of the following    statements with reference to Lake Turkana is/are correct ?</span></p>    <ol>     <li><p style=\"page-break-inside:auto;orphans:0;widows:0;margin-top:0.19in;margin-bottom:0in;page-break-after:auto\">     <span style=\"font-family:'Times New Roman'\">It is the largest desert lake     in the world.</span></p>     </li><li><p style=\"page-break-inside:auto;orphans:0;widows:0;margin-bottom:0in;page-break-after:auto\">     <span style=\"font-family:'Times New Roman'\">The lake is situated in South     Sudan along the eastern fringe of the Sahara desert.</span></p>     </li><li><p style=\"page-break-inside:auto;orphans:0;widows:0;margin-bottom:0.19in;page-break-after:auto\">     <span style=\"font-family:'Times New Roman'\">The lake is listed as a     UNESCO World Heritage Site and is also referred to as the 'Jade     Sea'.</span></p>    </li></ol>    <p style=\"page-break-inside:auto;orphans:0;widows:0;margin-top:0.19in;page-break-after:auto\">    <span style=\"font-family:'Times New Roman'\">Select the answer using the    code given below :</span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Times New Roman'\"><span style=\"font-size:12pt\">1    only</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Times New Roman'\"><span style=\"font-size:12pt\">1    and 3 only</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Times New Roman'\"><span style=\"font-size:12pt\">2    and 3 only</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Times New Roman'\"><span style=\"font-size:12pt\">1,    2 and 3</span></span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"page-break-inside:auto;orphans:0;widows:0;margin-bottom:0.19in;page-break-after:auto\">    <span style=\"font-family:'Times New Roman'\"><span style=\"font-family:'Times New Roman'\"><span style=\"font-weight:normal\">Statement    1 is CORRECT: Lake Turkana (formerly known as Lake Rudolf) is the    world's largest permanent desert lake and the world's largest    alkaline lake.</span></span></span></p>    <p style=\"page-break-inside:auto;orphans:0;widows:0;margin-top:0.19in;margin-bottom:0.19in;page-break-after:auto\">    <span style=\"font-family:'Times New Roman'\"><span style=\"font-family:'Times New Roman'\"><span style=\"font-weight:normal\">Statement    2 is INCORRECT: The lake is located in the Kenyan Rift Valley in    northern Kenya, with its far northern end crossing into Ethiopia.    It is not located in South Sudan or along the Sahara desert.</span></span></span></p>    <p style=\"page-break-inside:auto;orphans:0;widows:0;margin-top:0.19in;page-break-after:auto\">    <span style=\"font-family:'Times New Roman'\"><span style=\"font-family:'Times New Roman'\"><span style=\"font-weight:normal\">Statement    3 is CORRECT: Lake Turkana National Parks are designated as a    UNESCO World Heritage Site. It is popularly called the 'Jade Sea'    due to its striking turquoise-green color caused by algae.</span></span></span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Consider    the following pairs regarding major international sporting events    and their 2026 champions:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Event</span></span><span style=\"font-size:12pt\"><span>    // </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Champion</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A.    Australian Open – Men’s Singles</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Carlos    Alcaraz</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">B.    Australian Open – Women’s Singles</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Elena    Rybakina</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">C.    French Open – Men’s Singles</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Jannik    Sinner</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">D.    Wimbledon – Men’s Singles</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Novak    Djokovic</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the pairs given above is/are correctly matched?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A    and B only</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">B    only</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">B    and C only</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A,    B and D only</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Elena    Rybakina won the 2026 Australian Open Women’s Singles title. The    other pairings are incorrect.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    Facts:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2026    Australian Open Women’s Singles → Elena Rybakina</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2026    Australian Open Men’s Singles → Carlos Alcaraz</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Focus    on event + winner + runner-up + nationality for difficult SSC    questions.</span></span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">With    reference to the Union Budget 2026–27, consider the following    statements:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The    Budget was presented by the Union Finance Minister in February    2026.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The    Budget introduced measures related to taxation, infrastructure and    economic growth.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The    Union Budget is constitutionally referred to as the Annual    Financial Statement.</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the statements given above is/are correct?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 2 only</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2    and 3 only</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 3 only</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1,    2 and 3</span></span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The    Union Budget 2026–27 is the government's annual financial    statement outlining its revenue, expenditure and fiscal policies.    It includes measures for taxation, infrastructure and economic    growth. Under Article 112, the Union Budget is constitutionally    called the Annual Financial Statement (AFS).</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    Facts:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Article    112 → Annual Financial Statement</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Presented    by → Union Finance Minister</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Budget    Year → 1 April to 31 March</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Main    Components → Receipts &amp; Expenditure</span></span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    city hosted the 29th United Nations Climate Change Conference    (COP29)?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Dubai,    UAE</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Baku,    Azerbaijan</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Belem,    Brazil</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Tashkent,    Uzbekistan</span></span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Baku,    Azerbaijan hosted COP29, held from 11–22 November 2024. The    conference focused strongly on climate finance and resulted in a    new climate-finance goal for developing countries.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    Facts:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">COP28    (2023) → Dubai, UAE</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">COP29    (2024) → Baku, Azerbaijan</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">COP30    (2025) → Belém, Brazil</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">COP29    President → Mukhtar Babayev</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Major    Focus → Climate Finance</span></span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Assertion    (A): The 42nd Constitutional Amendment Act of 1976 is often    referred to as a \"Mini-Constitution\".</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Reason    (R): It introduced comprehensive changes, including adding Part    IV-A (Fundamental Duties), changing the Preamble, and curtailing    judicial review powers.</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Both    A and R are true, and R is the correct explanation of A.</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Both    A and R are true, but R is not the correct explanation of A.</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A    is true, but R is false.</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A    is false, but R is true.</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The    42nd Constitutional Amendment Act, 1976 is called the    “Mini-Constitution” because it made wide-ranging changes to    the Constitution, including:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Added    Part IV-A – Fundamental Duties</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Added    “Socialist”, “Secular” and “Integrity” to the Preamble</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Sought    to curtail judicial review</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Made    several changes to the Centre–State relationship and    constitutional provisions.</span></span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Match    the Parliamentary Writs/Motions with their definitions:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">List-I    (Motion): List-II (Definition)</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A.    Adjournment Motion 1. Directs discussion on an urgent matter of    public importance.,</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">B.    Call-Attention Motion 2. Seeks to draw minister's attention to an    urgent matter.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">C.    Privilege Motion 3. Moved against a minister for breach of    parliamentary privilege.,</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">D.    Point of Order 4. Raised when rules of the House are violated    during business.</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-1,    B-2, C-3, D-4</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-2,    B-1, C-4, D-3</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-1,    B-3, C-2, D-4</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-4,    B-2, C-3, D-1</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    Facts – Parliamentary Motions</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Adjournment    Motion → Used for an urgent matter of public importance;    involves an interruption of normal business.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Call-Attention    Motion → A member draws a Minister’s attention to an urgent    public matter.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Privilege    Motion → Raised for breach of parliamentary privilege.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Point    of Order → Raised when rules/procedure of the House are    violated.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Zero    Hour → Time immediately after Question Hour; not mentioned in    the Rules of Procedure.</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">No-Confidence    Motion → Tests whether the Council of Ministers enjoys Lok    Sabha’s confidence.</span></span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    Gupta Emperor established the famous Nalanda University in Bihar?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Samudragupta</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Chandragupta    II</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Kumaragupta    I</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Skandagupta</span></span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Kumaragupta    I is traditionally credited with founding Nalanda Mahavihara    around the 5th century CE. It later became one of the most    important centres of Buddhist learning.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    Facts:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Kumaragupta    I → Founder/patron associated with Nalanda</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Nalanda    → Ancient centre of Buddhist learning</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Chinese    traveller Xuanzang (Hiuen Tsang) → Studied at Nalanda</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Fa-Hien    → Visited India during the reign of Chandragupta II</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Nalanda    → Located in Bihar</span></span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Consider    the following statements regarding the Vijayanagara Empire:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1.    It was founded in 1336 by Harihara I and Bukka Raya I of the    Sangama dynasty.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2.    The greatest ruler Krishnadevaraya belonged to the Tuluva dynasty    and wrote Amuktamalyada in Telugu.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">3.    The famous Battle of Talikota (1565) led to the destruction of    Vijayanagara during the reign of Deva Raya II.</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the statements given above are correct?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 2 only</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2    and 3 only</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 3 only</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1,    2 and 3</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement    1 – Correct: Vijayanagara Empire was founded in 1336 by Harihara    I and Bukka Raya I, founders of the Sangama dynasty.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement    2 – Correct: Krishnadevaraya belonged to the Tuluva dynasty and    wrote Amuktamalyada in Telugu.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement    3 – Incorrect: The Battle of Talikota (1565) occurred during the    reign of Aliya Rama Raya, not Deva Raya II.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    Facts:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Founder:    Harihara I &amp; Bukka Raya I</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Capital:    Vijayanagara (Hampi)</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Greatest    ruler: Krishnadevaraya</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Dynasty:    Tuluva</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Talikota    Battle: 1565</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Talikota:    Also known as the Battle of Rakshasa-Tangadi.</span></span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    British Act ended the trade monopoly of the East India Company in    India (except for trade in tea and trade with China)?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Regulating    Act, 1773</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Charter    Act of 1813</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Charter    Act of 1833</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Pitt's    India Act, 1784</span></span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The    Charter Act of 1813 ended the East India Company’s trade    monopoly in India, except for tea trade and trade with China.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    Facts</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1773    – Regulating Act → First major British parliamentary control    over Company.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1784    – Pitt’s India Act → Established dual control.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1813    – Charter Act → Ended Company’s trade monopoly in India    (exceptions: tea &amp; China).</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1833    – Charter Act → Ended Company’s commercial activities    completely.</span></span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the following countries are members of the European Union?</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Belarus</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Poland</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Germany</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Switzerland</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Select    the answer using the code given below:</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1,    2 and 4</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 4 only</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2    and 3</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2    and 4 only</span></span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Poland    and Germany are members of the European Union. Belarus and    Switzerland are not EU member states.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    acts:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">EU    Member Countries: 27</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Poland    → EU member since 2004</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Germany    → Founding member of the European Communities</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Switzerland    → Not an EU member</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Belarus    → Not an EU member</span></span></p>", "question_heading": ""}, {"sr_no": 90, "question": "  <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    river crosses the Tropic of Cancer (</span></span><span style=\"font-size:10pt\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787934955000_html_8f367505f79caf4e.gif\" > </span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">)    twice in India?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Narmada    River</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Mahi    River</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Tapi    River</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Sabarmati    River</span></span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The    Mahi River is known for crossing the Tropic of Cancer twice in    India.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    Facts:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Mahi    River → Crosses Tropic of Cancer twice</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Origin    → Madhya Pradesh</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Flows    through → Madhya Pradesh, Rajasthan &amp; Gujarat</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Mouth    → Gulf of Khambhat (Arabian Sea)</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Mahi–Kadam    Project → Important irrigation project on the Mahi River</span></span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the following mountain passes is located on the border between    Sikkim and Tibet, through which the historic Silk Route passes?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Shipki    La</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Nathu    La</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-size:12pt\"><span>Bum </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">La</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Zoji    La</span></span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Nathu    La Pass is located in Sikkim, on the India–Tibet (China) border.    It is one of the important passes through which the ancient Silk    Route passed, connecting Tibet with Sikkim and onward to the    Indian plains.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\"><a name=\"_GoBack\"></a>    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Extra    facts:</b></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Nathu    La → Sikkim – Tibet (China) border</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Silk    Route → Historically passed through Nathu La</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Nathu    La means “Listening Pass”</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">It    is one of the three open trading border posts between India and    China.</span></span></p>    <p style=\"page-break-inside:auto;orphans:0;widows:0;margin-top:0.19in;margin-bottom:0.19in;page-break-after:auto\">    <span style=\"font-family:'Times New Roman'\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-weight:normal\">Bum    La</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-weight:normal\">    → Located in </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-weight:normal\">Arunachal    Pradesh on the India–Tibet border</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-weight:normal\">    and is known for its strategic importance. Unlike </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-weight:normal\">Nathu    La</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-weight:normal\">,    it is </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-weight:normal\">not    associated with the historic Silk Route</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-weight:normal\">.</span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Shipki    La → Himachal Pradesh – Tibet border</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Zoji    La → Jammu &amp; Kashmir/Ladakh region; connects Kashmir Valley    with Ladakh</span></span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    organization publishes the Consumer Price Index (CPI) combined for    rural and urban areas in India?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Reserve    Bank of India (RBI)</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">National    Sample Survey Office (NSSO)</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">National    Statistical Office (NSO, MoSPI)</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Office    of Economic Adviser (DPIIT)</span></span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">National    Statistical Office (NSO, MoSPI) publishes the CPI (Combined) for    Rural + Urban areas in India. RBI uses CPI for monetary policy but    does not publish it.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    Facts:-</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">CPI    Publisher: NSO, MoSPI</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">CPI    Base Year: 2012 = 100</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">CPI    → Retail Inflation</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">WPI    Publisher: Office of Economic Adviser, DPIIT</span></span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The    'Garibi Hatao' (Eradicate Poverty) slogan was given during which    Five-Year Plan period in India?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Third    Five-Year Plan</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Fourth    Five-Year Plan</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Fifth    Five-Year Plan</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Sixth    Five-Year Plan</span></span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Fifth    Five-Year Plan — The ‘Garibi Hatao’ (Eradicate Poverty)    slogan was given by Indira Gandhi during the Fifth Five-Year Plan    (1974–197</span></span><span style=\"font-size:12pt\"><span>8</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">)    period.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    Facts:-</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Fifth    Plan: 1974–197</span></span><span style=\"font-size:12pt\"><span>8</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Main    focus: Poverty removal + self-reliance</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Slogan:    Garibi Hatao</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Prime    Minister: Indira Gandhi</span></span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Match    the chemical compounds with their correct commercial names:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">List-I    (Chemical Compound): List-II (Commercial Name)</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A.    Sodium Carbonate Decahydrate, 1. Baking Soda</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">B.    Sodium Bicarbonate, 2. Washing Soda</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">C.    Calcium Oxide, 3. Slaked Lime</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">D.    Calcium Hydroxide 4. Quick Lime</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-2,    B-1, C-4, D-3</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-1,    B-2, C-3, D-4</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-2,    B-3, C-4, D-1</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-4,    B-1, C-2, D-3</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A.    Sodium Carbonate Decahydrate → 2. Washing Soda</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">B.    Sodium Bicarbonate → 1. Baking Soda</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">C.    Calcium Oxide → 4. Quick Lime</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">D.    Calcium Hydroxide → 3. Slaked Lime</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    Facts:-</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Washing    Soda → Na₂CO₃·10H₂O</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Baking    Soda → NaHCO₃</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Quick    Lime → CaO</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Slaked    Lime → Ca(OH)₂</span></span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    instrument is used to measure extremely high temperatures, such as    the temperature of the Sun or molten metals?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Pyrometer</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Bolometer</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hygrometer</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hydrometer</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Pyrometer    — A pyrometer is used to measure very high temperatures without    direct contact, such as the temperature of molten metals,    furnaces, and the Sun.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    Facts:-</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Pyrometer    → Very high temperature</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Bolometer    → Measures radiant energy</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hygrometer    → Humidity</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hydrometer    → Relative density of liquids</span></span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Assertion    (A): The Rock-cut caves of Ajanta mostly contain Buddhist Chaityas    and Viharas created between 2nd century BCE and 6th century CE. </span></span>    </p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Reason    (R): The paintings at Ajanta were executed using the true Fresco    technique on wet plaster.</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Both    A and R are true, and R is the correct explanation of A.</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Both    A and R are true, but R is not the correct explanation of A.</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A    is true, but R is false.</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A    is false, but R is true.</span></span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The    paintings at Ajanta were not made using the true fresco technique    on wet plaster. They were primarily executed using a tempera/secco    technique on dry plaster.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    Facts:-</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Ajanta    Caves → Maharashtra</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Religion    → Buddhism</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Chaitya    → Prayer/worship hall</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Vihara    → Monastery/residential hall</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Painting    technique → Tempera / Fresco-secco</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Ajanta    paintings → Mainly associated with Jataka stories &amp; Buddha's    life</span></span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Consider    the following statements regarding the Pardoning Power of the    President (Article 72) and Governor (Article 161):</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1.    The President can pardon sentences inflicted by a Court Martial    (Military Court), whereas the Governor cannot.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2.    The President can grant pardon in cases of a death sentence,    whereas the Governor has no power to pardon a death sentence.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">3.    Both the President and Governor share concurrent powers regarding    the suspension, remission, or commutation of a death sentence.</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the statements given above are correct?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 2 only</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2    and 3 only</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 3 only</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1,    2 and 3</span></span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement    1 – Correct: The President can pardon sentences awarded by a    Court Martial under Article 72. The Governor does not have this    power.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement    2 – Correct: The President can pardon a death sentence. The    Governor can suspend, remit or commute a death sentence but cannot    pardon it.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><span style=\"font-weight:normal\">Statement    3</span></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><span><span style=\"font-weight:normal\">    -</span></span></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><span style=\"font-weight:normal\">CORRECT:    While the Governor cannot grant a full </span></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><i><span style=\"font-weight:normal\">pardon</span></i></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><span style=\"font-weight:normal\">    to a death sentence, Article 72(3) explicitly preserves the    Governor's power to suspend, remit, or commute a death sentence    under state law. Hence, both the President and Governor share    concurrent powers regarding the suspension, remission, or    commutation of a death sentence.</span></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    Facts:-</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Article    72 → Pardoning power of President</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Article    161 → Pardoning power of Governor</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Court    Martial → President only</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Death    Sentence – Pardon → President only</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Death    Sentence – Suspend/Remit/Commute → Both President &amp;    Governor</span></span></p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Match    the local wind names with their regions of occurrence:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">List-I    (Local Wind): List-II (Region):</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A.    Chinook, 1. Sahara Desert to Mediterranean Sea,</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">B.    Foehn, 2. Rocky Mountains, North America,</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">C.    Sirocco, 3. Alps Mountains, Europe,</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">D.    Harmattan (Doctor Wind) 4. West Africa / Sahara</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-2,    B-3, C-1, D-4</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-3,    B-2, C-1, D-4</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-2,    B-1, C-4, D-3</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-4,    B-3, C-1, D-2</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    Facts:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    • <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Chinook    is a warm, dry local wind that blows down the eastern slopes of    the Rocky Mountains in North America.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    • <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Foehn    is a warm, dry wind associated with the Alps Mountains in Europe.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    • <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Sirocco    originates in the Sahara Desert and blows towards the    Mediterranean Sea.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    • <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Harmattan,    also known as the ‘Doctor Wind’, blows across West Africa from    the Sahara region.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    • <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Therefore,    the correct matching is A–2, B–3, C–1, D–4.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Additional    Information</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    • <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Chinook    → Rocky Mountains → “Snow Eater”</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    • <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Foehn    → Alps → Warm and dry wind</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    • <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Sirocco    → Sahara → Mediterranean → Hot, dry wind</span></span></p>    <p style=\"orphans:2;widows:2\">•    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Harmattan    → West Africa → “Doctor Wind”</span></span></p>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">During    which phase of Meiosis does the division/splitting of centromeres    occur, causing sister chromatids to separate and move toward    opposite poles?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Anaphase    I</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Anaphase    II</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Metaphase    I</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Metaphase    II</span></span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    fact:</span></span></p>    <p style=\"orphans:2;widows:2
