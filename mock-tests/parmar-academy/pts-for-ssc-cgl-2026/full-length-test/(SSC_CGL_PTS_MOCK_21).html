<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>41.) SSC CGL PTS  MOCK 21 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

pan>did / when</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>was / than</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span><b>The correct    option is A) had / when.</b></span></span><span style=\"font-family:'Nirmala UI'\"><span><br> The    sentence is:<br> </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>“Hardly    had the contract been signed when allegations of corruption began    to surface against the firm.”</b></span></span><span style=\"font-family:'Nirmala UI'\"><span><br> Here, </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>“Hardly”</b></span></span><span style=\"font-family:'Nirmala UI'\"><span> at    the beginning requires </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>inversion</b></span></span><span style=\"font-family:'Nirmala UI'\"><span>,    so </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>“had”</b></span></span><span style=\"font-family:'Nirmala UI'\"><span> comes    before the subject. The standard correlative structure is:<br> </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>Hardly    + had + subject + past participle + when + clause</b></span></span><span style=\"font-family:'Nirmala UI'\"><span><br> </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>Meanings/usage    of the other options:</b></span></span><span style=\"font-family:'Nirmala UI'\"><span><br> </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>B)    had / than</b></span></span><span style=\"font-family:'Nirmala UI'\"><span> —    Incorrect. </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>Hardly</b></span></span><span style=\"font-family:'Nirmala UI'\"><span> is    followed by </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>when</b></span></span><span style=\"font-family:'Nirmala UI'\"><span>,    not </span></span><span style=\"font-family:'Nirmala UI'\"><span><i>than</i></span></span><span style=\"font-family:'Nirmala UI'\"><span>.<br> </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>C)    did / when</b></span></span><span style=\"font-family:'Nirmala UI'\"><span> —    Incorrect. The main verb </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>“been    signed”</b></span></span><span style=\"font-family:'Nirmala UI'\"><span> requires    the auxiliary </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>had</b></span></span><span style=\"font-family:'Nirmala UI'\"><span>,    not </span></span><span style=\"font-family:'Nirmala UI'\"><span><i>did</i></span></span><span style=\"font-family:'Nirmala UI'\"><span>.<br> </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>D)    was / than</b></span></span><span style=\"font-family:'Nirmala UI'\"><span> —    Incorrect. Both the auxiliary and conjunction are inappropriate    here.</span></span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span><b>Find the part    of the sentence that contains an error</b></span></span><span style=\"font-family:'Nirmala UI'\"><span>:<br> The    research team was able to neither verify the authenticity of the    ancient artifact (1)/ nor could establish the exact historical    period (2)/ from which it originated despite (3)/ using advanced    carbon dating methods. (4)</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>(1)</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>(2)</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>(3)</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>(4)</span></span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span><b>The correct    option is B) (2).</b></span></span><span style=\"font-family:'Nirmala UI'\"><span><br> The    error lies in </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>“nor    could establish”</b></span></span><span style=\"font-family:'Nirmala UI'\"><span> because    the sentence uses the </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>“neither...nor”</b></span></span><span style=\"font-family:'Nirmala UI'\"><span> structure,    which requires </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>parallel    construction</b></span></span><span style=\"font-family:'Nirmala UI'\"><span>.<br> Remove    the unnecessary auxiliary verb \"could\" so that \"nor\"    is followed directly by the parallel base verb \"establish\":    neither + verify ... nor + establish<br> </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>Corrected    Sentence: </b></span></span><span style=\"font-family:'Nirmala UI'\"><span><i>\"The    research team was able to neither </i></span></span><span style=\"font-family:'Nirmala UI'\"><span><i><b>verify</b></i></span></span><span style=\"font-family:'Nirmala UI'\"><span><i> the    authenticity of the ancient artifact nor </i></span></span><span style=\"font-family:'Nirmala UI'\"><span><i><b>establish</b></i></span></span><span style=\"font-family:'Nirmala UI'\"><span><i> the    exact historical period from which it originated despite using    advanced carbon dating methods.\"</i></span></span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span><b>Find the part    of the sentence that contains an error:</b></span></span><span style=\"font-family:'Nirmala UI'\"><span><br> The    detailed reports compiled by the investigative committee (1)/    regarding the recent financial discrepancies (2)/ provides a    comprehensive analysis (3)/ for the board of directors. (4)</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>(1)</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>(2)</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>(3)</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>(4)</span></span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>The correct    option is </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>C)    (3).</b></span></span><span style=\"font-family:'Nirmala UI'\"><span><br> The    error lies in </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>part    (3)</b></span></span><span style=\"font-family:'Nirmala UI'\"><span> of    the sentence. The subject of the sentence is the </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>plural    noun</b></span></span><span style=\"font-family:'Nirmala UI'\"><span> 'reports'    ('The detailed reports...'), so it requires a </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>plural    verb</b></span></span><span style=\"font-family:'Nirmala UI'\"><span>.    Therefore, </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>'provides'</b></span></span><span style=\"font-family:'Nirmala UI'\"><span> should    be replaced with </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>'provide'</b></span></span><span style=\"font-family:'Nirmala UI'\"><span>.<br> </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>Corrected    sentence:</b></span></span><span style=\"font-family:'Nirmala UI'\"><span> The    detailed reports compiled by the investigative committee regarding    the recent financial discrepancies </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>provide</b></span></span><span style=\"font-family:'Nirmala UI'\"><span> a    comprehensive analysis for the board of directors.</span></span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span><b>Select the    correct passive form of the given sentence</b></span></span><span style=\"font-family:'Nirmala UI'\"><span>.<br> The    auditors had been inspecting the financial records all morning    when the power went out.</span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>The financial    records had been inspected by the auditors all morning when the    power went out.</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>The financial    records had been being inspected by the auditors all morning when    the power went out.</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>The financial    records were being inspected by the auditors all morning when the    power went out.</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>The financial    records had being inspected by the auditors all morning when the    power went out.</span></span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>The correct    option is </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>B)    The financial records had been being inspected by the auditors all ly:'Nirmala UI'\"><span>would be    completed</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>had been    completed</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>would complete</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span><b>The correct    option is A) would have been completed.</b></span></span><span style=\"font-family:'Nirmala UI'\"><span><br> The    sentence follows the structure of an inverted third conditional    (</span></span><span style=\"font-family:'Nirmala UI'\"><span><i>Had    + Subject + V3...</i></span></span><span style=\"font-family:'Nirmala UI'\"><span>),    which expresses an unreal hypothetical condition in the past.<br> In    the main (result) clause, the subject is 'the structural repairs'    which is passive (the repairs do not perform the action of    completing; rather, they are completed). Therefore, the verb must    be in the passive voice of the conditional perfect: </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>would    have been + V3 (past participle)</b></span></span><span style=\"font-family:'Nirmala UI'\"><span>.<br> Hence, </span></span><span style=\"font-family:'Nirmala UI'\"><span><b>'would    have been completed'</b></span></span><span style=\"font-family:'Nirmala UI'\"><span> is    the correct substitution.</span></span></p>", "question_heading": ""}, {"sr_no": 21, "question": "\r\n\r\n<p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span><b>Select the most appropriate option to replace the highlighted segment in the given sentence.</b></span></span><br />\r\n<span style=\"font-family:'Nirmala UI'\"><span>It is high time the committee <strong>should </strong></span></span><span style=\"font-family:'Nirmala UI' margin-bottom:0in\">    Three statements are given followed by three conclusions numbered    I, II and III. Assuming the statements to be true, even if they    seem to be at variance with commonly known facts, decide which of    the conclusions logically follow(s) from the statements.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Statements:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">No doctor is    a singer.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">All doctors    are dancers.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Some dancers    are actors.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Conclusions:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">I. All    dancers can never be singers.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">II. No doctor    is an actor.</p>    <p style=\"orphans:0;widows:0\">III. Some actors are painters.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Only conclusion I follows</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only conclusions I and II follow</p>", "option3": " <p style=\"orphans:0;widows:0\">    Only conclusion II follows</p>", "option4": " <p style=\"orphans:0;widows:0\">    Only conclusions II and III follow</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    From the given statements:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Since all    doctors are dancers and no doctor is a singer, the portion of    dancers that are doctors can never be singers. Thus, it is    impossible for all dancers to be singers (\"All dancers can    never be singers\"). Hence, conclusion I follows.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. There is    no definite negative relationship established between doctors and    actors. Hence, conclusion II does not follow.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. The term    'painters' is not mentioned in the statements, so conclusion III    does not follow.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_f1a7505a7d6f4344.gif\" > </p>    <p style=\"orphans:0;widows:0\">Therefore, only conclusion I    follows.</p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"orphans:0;widows:0\">    In a certain code language, 'apple mango banana' is written as 'xm    yb zq'; 'banana cherry grape' is written as 'zq kr wj' and 'mango    guava cherry' is written as 'yb pl kr'. How is 'apple' written in    that language?</p>", "option1": "<p style=\"orphans:0;widows:0\">    yb</p>", "option2": " <p style=\"orphans:0;widows:0\">    zq</p>", "option3": " <p style=\"orphans:0;widows:0\">    xm</p>", "option4": " <p style=\"orphans:0;widows:0\">    kr</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    From the given statements:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. 'apple    mango banana' = 'xm yb zq'</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. 'banana    cherry grape' = 'zq kr wj'</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. 'mango    guava cherry' = 'yb pl kr'</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Comparing    statements 1 and 2, the common word is 'banana' and the common    code is 'zq'. So, 'banana' = 'zq'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Comparing    statements 1 and 3, the common word is 'mango' and the common code    is 'yb'. So, 'mango' = 'yb'.</p>    <p style=\"orphans:0;widows:0\">Therefore, in statement 1, the    remaining word 'apple' is coded as 'xm'.</p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Which of the following numbers will replace the question mark (?)    in the given series?</p>    <p style=\"orphans:0;widows:0\">2, 3, 7, 25, ?, 721</p>", "option1": "<p style=\"orphans:0;widows:0\">    118</p>", "option2": " <p style=\"orphans:0;widows:0\">    121</p>", "option3": " <p style=\"orphans:0;widows:0\">    125</p>", "option4": " <p style=\"orphans:0;widows:0\">    116</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The logic followed here is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_922261d43895eaad.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_a2347442bf3c611a.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_5c3b9db7cd8f58d4.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_fa74f680e4d61e0c.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_29381faffac2b018.gif\" > </p>    <p style=\"orphans:0;widows:0\">Hence, the required number is    121.</p>", "question_heading": ""}, {"sr_no": 54, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct mirror image of the given alphanumeric string    when a vertical mirror is placed to its right at A.</p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_d9ee8f49496d7856.gif\" > </p>", "option1": "<p style=\"orphans:0;widows:0\">    bƐTИƎ8q</p>", "option2": " <p style=\"orphans:0;widows:0\">    q8ƎИTƐb</p>", "option3": " <p style=\"orphans:0;widows:0\">    b3TИE8q</p>", "option4": " <p style=\"orphans:0;widows:0\">    dƐTИƎ8p</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    When a vertical mirror is placed to the right of a string, the    order of characters’ reverses from right to left, and each    individual character undergoes lateral inversion (horizontal    flip):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'d' (7th)    becomes 'b' (1st)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'3' (6th)    becomes 'Ɛ' (2nd)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'T' (5th)    becomes 'T' (3rd)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'N' (4th)    becomes 'И' (4th)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'E' (3rd)    becomes 'Ǝ' (5th)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'8' (2nd)    becomes '8' (6th)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'p' (1st)    becomes 'q' (7th)</p>    <p style=\"orphans:0;widows:0\">Therefore, the correct mirror    image is bƐTИƎ8q.</p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that is related to the fifth letter-cluster in    the same way as the second letter-cluster is related to the first    letter-cluster and the fourth letter-cluster is related to the    third letter-cluster.</p>    <p style=\"orphans:0;widows:0\">DFH : WUS :: LNP : OMK :: TVX : ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    GFD</p>", "option2": " <p style=\"orphans:0;widows:0\">    FEC</p>", "option3": " <p style=\"orphans:0;widows:0\">    GEC</p>", "option4": " <p style=\"orphans:0;widows:0\">    HFD</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is that each letter is replaced by its    opposite letter in the English alphabetical series (sum of their    positional values is 27):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">D (4) → W    (23)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">F (6) → U    (21)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">H (8) → S    (19)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Similarly,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">L (12) → O    (15)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">N (14) → M    (13)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">P (16) → K    (11)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Following the    same pattern for TVX:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">T (20) → G    (7)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">V (22) → E    (5)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">X (24) → C    (3)</p>    <p style=\"orphans:0;widows:0\">Hence, TVX : GEC.</p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Which of the four options will replace the question mark (?) in    the following series?</p>    <p style=\"orphans:0;widows:0\">PA 105, QD 98, RG 91, SJ 84, ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    TL 77</p>", "option2": " <p style=\"orphans:0;widows:0\">    TM 77</p>", "option3": " <p style=\"orphans:0;widows:0\">    TN 77</p>", "option4": " <p style=\"orphans:0;widows:0\">    UM 70</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed in the given series is as follows:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. First    letter increases by 1: P (+1) → Q (+1) → R (+1) → S (+1) →    T</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Second    letter increases by 3: A (+3) → D (+3) → G (+3) → J (+3) →    M</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Number    decreases by 7: 105 (-7) → 98 (-7) → 91 (-7) → 84 (-7) →    77</p>    <p style=\"orphans:0;widows:0\">Therefore, the missing term is TM    77.</p>", "question_heading": ""}, {"sr_no": 57, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    What will come in the place of question mark '?' in the following    equation if '+' and '÷' are interchanged, and '-' and '×' are    interchanged?</p>    <p style=\"orphans:0;widows:0\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_7da13497465d476.gif\" > </p>", "option1": "<p style=\"orphans:0;widows:0\">    12</p>", "option2": " <p style=\"orphans:0;widows:0\">    9</p>", "option3": " <p style=\"orphans:0;widows:0\">    15</p>", "option4": " <p style=\"orphans:0;widows:0\">    7</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Given equation:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_7da13497465d476.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">After    interchanging '+' with '÷', and '-' with '×':</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_dfc4f96f92c42672.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Applying the    BODMAS rule:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Step 1:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_c17a6c6583725960.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Step 2:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_64568b67d55dbc5.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Step 3:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_305b1ab729ecf86c.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Step 4:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_34a23be597fcd764.gif\" > </p>    <p style=\"orphans:0;widows:0\">Hence, the correct answer is 9.</p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"orphans:0;widows:0\">    The position of how many letters will remain unchanged if each of    the letters in the word 'DAUGHTER' is re-arranged in the English    alphabetical order from left to right?</p>", "option1": "<p style=\"orphans:0;widows:0\">    One</p>", "option2": " <p style=\"orphans:0;widows:0\">    Two</p>", "option3": " <p style=\"orphans:0;widows:0\">    Three</p>", "option4": " <p style=\"orphans:0;widows:0\">    Four</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Original word: D A U G H T E R</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Arranging the    letters in alphabetical order from left to right: A D E G H R T U</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Comparing the    position of each letter:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Original: D A    U G H T E R</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Alphabetical:    A D E G H R T U</p>    <p style=\"orphans:0;widows:0\">The positions of 2 letters ('G'    and 'H') remain unchanged.</p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"orphans:0;widows:0\">    In a certain code language, 'BEAM' is written as 'NBFC' and 'BOAT'    is written as 'UBPC'. How will 'DUST' be written in that language?</p>", "option1": "<p style=\"orphans:0;widows:0\">    UTEV</p>", "option2": " <p style=\"orphans:0;widows:0\">    UTVE</p>", "option3": " <p style=\"orphans:0;widows:0\">    VTUE</p>", "option4": " <p style=\"orphans:0;widows:0\">    TUVE</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is: Reverse the order of letters in the    given word and then add 1 to each letter (+1 shift).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">BEAM →    Reverse: MAEB → (+1 to each letter) → NBFC</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">BOAT →    Reverse: TAOB → (+1 to each letter) → UBPC</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Similarly,    for 'DUST':</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Reverse of    DUST = TSUD</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">T + 1 = U</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">S + 1 = T</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">U + 1 = V</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">D + 1 = E</p>    <p style=\"orphans:0;widows:0\">Therefore, 'DUST' is coded as    'UTVE'.</p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following number-pairs, the second number is obtained by    applying certain mathematical operations to the first number. In    three of the four pairs, the same pattern is applied and hence    they form a group. Select the number-pair that DOES NOT belong to    this group.</p>    <p style=\"orphans:0;widows:0\">(NOTE: Operations should be    performed on the whole numbers, without breaking down the numbers    into their constituent digits. E.g. 13 – Operations on 13 such    as adding/subtracting/multiplying to 13 can be performed. Breaking    down 13 into 1 and 3 and then performing mathematical operations    on 1 and 3 is not allowed.)</p>", "option1": "<p style=\"orphans:0;widows:0\">    14 : 187</p>", "option2": " <p style=\"orphans:0;widows:0\">    18 : 315</p>", "option3": " <p style=\"orphans:0;widows:0\">    16 : 245</p>", "option4": " <p style=\"orphans:0;widows:0\">    12 : 135</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is: Second number = (First number)<sup>2</sup>    - 9</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Let's check    each pair:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1) 14 : 187     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_da4752557e486dcf.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2) 18 : 315     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_7d69842f3cddaf98.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3) 16 : 245     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_92d0a0837cac6a57.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4) 12 : 135     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_1d76b98dbc9605c.gif\" > </p>    <p style=\"orphans:0;widows:0\">Hence, '16 : 245' does not belong    to the group.</p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    14 is related to 182 following a certain logic. Following the same    logic, 22 is related to 286. To which of the following is 33    related, following the same logic?</p>    <p style=\"orphans:0;widows:0\">(NOTE: Operations should be    performed on the whole numbers, without breaking down the numbers    into its constituent digits. E.g., 13 – Operations on 13 such as    adding/deleting/multiplying etc. to 13 can be performed. Breaking    down 13 into 1 and 3 and then performing mathematical operations    on 1 and 3 is not allowed)</p>", "option1": "<p style=\"orphans:0;widows:0\">    419</p>", "option2": " <p style=\"orphans:0;widows:0\">    429</p>", "option3": " <p style=\"orphans:0;widows:0\">    439</p>", "option4": " <p style=\"orphans:0;widows:0\">    449</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_64205b37aade39a1.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_b6c117f2e8e1bf2a.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Similarly,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_6b16f2a631453009.gif\" > </p>    <p style=\"orphans:0;widows:0\">Hence, 33 is related to 429.</p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In a certain code language,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'A + B' means    'A is the sister of B',</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'A - B' means    'A is the brother of B',</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'A * B' means    'A is the mother of B', and</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'A ÷ B'    means 'A is the father of B'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Which of the    following expressions indicates that 'P is the maternal uncle of    S'?</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">i. P + Q * R    - S</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">ii. P - Q ÷    R * S</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">iii. P - Q *    R + S</p>    <p style=\"orphans:0;widows:0\">iv. P * Q - R + S</p>", "option1": "<p style=\"orphans:0;widows:0\">    i</p>", "option2": " <p style=\"orphans:0;widows:0\">    ii</p>", "option3": " <p style=\"orphans:0;widows:0\">    iii</p>", "option4": " <p style=\"orphans:0;widows:0\">    iv</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Let's decode expression iii: P - Q * R + S</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. 'P - Q'    means P is the brother of Q.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. 'Q * R'    means Q is the mother of R.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. 'R + S'    means R is the sister of S, which means Q is the mother of both R    and S.</p>    <p style=\"orphans:0;widows:0\">Since P is the brother of Q and Q    is the mother of S, P is the maternal uncle (mother's brother) of    S. Hence, expression iii is correct.</p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Instruction: Identify the assumptions that must hold for the    statement to be valid, then choose the correct option.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Statement:    Although solar power technology has substantially reduced the cost    of electricity generation, the intermittency of sunlight remains a    key challenge for continuous energy supply.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Assumptions:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">I. Solar    power technology offers the potential for cost-effective    electricity generation.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">II. Solar    energy can provide an uninterrupted power supply around the clock    without requiring any energy storage systems.</p>    <p style=\"orphans:0;widows:0\">III. Recent technological    advancements have completely overcome the dependence of solar    power on sunlight.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Only I and II are implicit</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only II and III are implicit</p>", "option3": " <p style=\"orphans:0;widows:0\">    Only I is implicit</p>", "option4": " <p style=\"orphans:0;widows:0\">    All I, II, and III are implicit</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Assumption I is implicit because the statement notes that solar    power technology has substantially reduced generation costs, which    assumes that it holds the potential for cost-effective electricity    generation.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Assumption II    is not implicit because the statement explicitly highlights    sunlight intermittency as a key challenge for continuous energy    supply, implying that 24/7 power without storage is not feasible.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Assumption    III is not implicit because it directly contradicts the statement,    which affirms that sunlight intermittency remains a challenge.</p>    <p style=\"orphans:0;widows:0\">Therefore, only assumption I is    implicit.</p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"orphans:0;widows:0\">    Select the number-set that is different from the rest.</p>", "option1": "<p style=\"orphans:0;widows:0\">    (12, 36, 108)</p>", "option2": " <p style=\"orphans:0;widows:0\">    (16, 48, 144)</p>", "option3": " <p style=\"orphans:0;widows:0\">    (18, 54, 162)</p>", "option4": " <p style=\"orphans:0;widows:0\">    (14, 42, 128)</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed in the sets is: Second number = First number       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_f5aad9ed62ffbf86.gif\" > ,    and Third number = Second number     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_f5aad9ed62ffbf86.gif\" > .</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(12, 36,    108):     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_13dddceae36e3bec.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_1c3ad325b758e776.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(16, 48,    144):     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_6226aff607a1b645.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_eac06a4ffd2d1de7.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(18, 54,    162):     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_61fba256932d5994.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_224b910b54cd0be6.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(14, 42,    128):     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_abf6879c2c1aa4a6.gif\" > ,    but     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_71cc015628e9e7b1.gif\" > .</p>    <p style=\"orphans:0;widows:0\">Hence, (14, 42, 128) is the odd    one out.</p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"orphans:0;widows:0\">    In a row of 72 students, Rahul is 24th from the left end and    Sunita is 31st from the right end. How many students are sitting    between them?</p>", "option1": "<p style=\"orphans:0;widows:0\">    15</p>", "option2": " <p style=\"orphans:0;widows:0\">    17</p>", "option3": " <p style=\"orphans:0;widows:0\">    19</p>", "option4": " <p style=\"orphans:0;widows:0\">    16</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Total number of students = 72</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Position of    Rahul from left = 24</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Position of    Sunita from right = 31</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sum of their    positions =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_f3bcc1676b021c41.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Since Total    (72) &gt; Sum of positions (55), there is no overlap.</p>    <p style=\"orphans:0;widows:0\">Number of students between them =       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_22d73953a4c6023f.gif\" > </p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"orphans:0;widows:0\">    How many meaningful four-letter English words can be formed using    the first, fourth, fifth, and sixth letters of the word \"DETAIL\"    (when counted from left to right), using each letter only once in    each word?</p>", "option1": "<p style=\"orphans:0;widows:0\">    1</p>", "option2": " <p style=\"orphans:0;widows:0\">    2</p>", "option3": " <p style=\"orphans:0;widows:0\">    3</p>", "option4": " <p style=\"orphans:0;widows:0\">    4</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The 1st, 4th, 5th, and 6th letters of the word \"DETAIL\"    from left to right are D, A, I, and L, respectively.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Using these    four letters (D, A, I, L) only once in each word, the following 2    meaningful four-letter English words can be formed:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. DIAL</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. LAID</p>    <p style=\"orphans:0;widows:0\">Therefore, exactly 2 such words    can be formed.</p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Eight persons A, B, C, D, E, F, G, and H are sitting around a    circular table facing the center.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A is sitting    opposite to E.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B is second    to the left of A.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C is to the    immediate right of B.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">F is third to    the left of E.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">D is to the    immediate left of E.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">G is not an    immediate neighbor of B.</p>    <p style=\"orphans:0;widows:0\">Who is sitting to the immediate    right of G?</p>", "option1": "<p style=\"orphans:0;widows:0\">    H</p>", "option2": " <p style=\"orphans:0;widows:0\">    D</p>", "option3": " <p style=\"orphans:0;widows:0\">    F</p>", "option4": " <p style=\"orphans:0;widows:0\">    C</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Based on the given clues, we can determine the arrangement around    the circle facing the center (in clockwise order):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. A is    sitting opposite E.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. B is 2nd    to the left of A (clockwise from A).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. C is to    the immediate right of B (counter-clockwise from B, i.e., between    A and B).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. F is 3rd    to the left of E (clockwise from E).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">5. D is to    the immediate left of E (clockwise from E).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">6. G is not a    neighbor of B, leaving the position between D and F for G, while H    takes the position between B and E.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The complete    clockwise arrangement is:     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_644302c57f658dae.gif\" > </p>    <p style=\"orphans:0;widows:0\">Since persons are facing the    center, immediate right means going counter-clockwise. Therefore,    D is sitting to the immediate right of G.</p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the set in which the numbers are related in the same way as    are the numbers of the following sets.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(NOTE:    Operations should be performed on the whole numbers, without    breaking down the numbers into its constituent digits. E.g. 13 –    Operations on 13 such as adding / deleting / multiplying etc. to    13 can be performed. Breaking down 13 into 1 and 3 and then    performing mathematical operations on 1 and 3 is not allowed.)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(16, 192, 8)</p>    <p style=\"orphans:0;widows:0\">(12, 132, 7)</p>", "option1": "<p style=\"orphans:0;widows:0\">    (14, 182, 9)</p>", "option2": " <p style=\"orphans:0;widows:0\">    (15, 200, 8)</p>", "option3": " <p style=\"orphans:0;widows:0\">    (11, 150, 6)</p>", "option4": " <p style=\"orphans:0;widows:0\">    (18, 220, 7)</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The logic followed here is: Second number = First number × (third    number + 4)     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">For (16, 192,    8):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_5c951a5f25cfbe72.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">For (12, 132,    7):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_2b7b3906d873ed6.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Similarly,    for option A (14, 182, 9):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_5231ebc046e786d6.gif\" > </p>    <p style=\"orphans:0;widows:0\">Hence, option A is the correct    answer.</p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Three of the following four letter-cluster pairs are alike in a    certain way and thus form a group. Which is the letter-cluster    pair that does NOT belong to that group?</p>    <p style=\"orphans:0;widows:0\">(Note: The odd one out is not    based on the number of consonants/vowels or their positions in the    letter-cluster.)</p>", "option1": "<p style=\"orphans:0;widows:0\">    AE - HL</p>", "option2": " <p style=\"orphans:0;widows:0\">    GK - NR</p>", "option3": " <p style=\"orphans:0;widows:0\">    LP - SW</p>", "option4": " <p style=\"orphans:0;widows:0\">    PT - XD</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In AE - HL, GK - NR, and LP - SW, the pattern is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Within    each cluster, positional value of 2nd letter = 1st letter + 4.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Letters of    the 2nd cluster = Corresponding letters of the 1st cluster + 7.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">AE - HL:    A(1)+4 = E(5), H(8)+4 = L(12); A(1)+7 = H(8), E(5)+7 = L(12)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">GK - NR:    G(7)+4 = K(11), N(14)+4 = R(18); G(7)+7 = N(14), K(11)+7 = R(18)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">LP - SW:    L(12)+4 = P(16), S(19)+4 = W(23); L(12)+7 = S(19), P(16)+7 = W(23)</p>    <p style=\"orphans:0;widows:0\">In PT - XD: P(16)+8 = X(24),    which breaks the +7 addition rule. Hence, PT - XD does not belong    to the group.</p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that when sequentially placed in the blanks of    the given letter series will complete the series.</p>    <p style=\"orphans:0;widows:0\">A _ C B A B _ B _ B C _ A B _ B</p>", "option1": "<p style=\"orphans:0;widows:0\">    B C A B C</p>", "option2": " <p style=\"orphans:0;widows:0\">    C B A C B</p>", "option3": " <p style=\"orphans:0;widows:0\">    B C B A C</p>", "option4": " <p style=\"orphans:0;widows:0\">    A C B B C</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    On placing the letters 'B C A B C' sequentially in the given    blanks, we get:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A B C B / A B    C B / A B C B / A B C B</p>    <p style=\"orphans:0;widows:0\">The pattern 'A B C B' repeats 4    times to complete the 16-letter series. Hence, option A is the    correct answer.</p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Three of the following four options are alike in a certain way and    thus form a group. Which is the one that does NOT belong to that    group?</p>    <p style=\"orphans:0;widows:0\">(NOTE: Operations should be    performed on the whole numbers, without breaking down the numbers    into its constituent digits. E.g. 13 – Operations on 13 such as    adding/subtracting/multiplying etc. to 13 can be performed.    Breaking down 13 into 1 and 3 and then performing mathematical    operations on 1 and 3 is not allowed.)</p>", "option1": "<p style=\"orphans:0;widows:0\">    76 – 48 – 20</p>", "option2": " <p style=\"orphans:0;widows:0\">    58 – 72 – 86</p>", "option3": " <p style=\"orphans:0;widows:0\">    83 – 57 – 31</p>", "option4": " <p style=\"orphans:0;widows:0\">    64 – 42 – 18</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In each    option (except D), the three numbers form an Arithmetic    Progression where the difference between consecutive numbers is    equal, or     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_35dfa969cc941dc5.gif\" > .</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option A:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_42b9847a02844f99.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_af11403c10ba6c04.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option B:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_7ac9d09fcaf1c78.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_a472e65f959b7d76.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option C:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_9d1ec240abc5410.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_452ced2196428a52.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option D:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_a0da285a548ff297.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1787927100502_html_3a0b4983a2567db.gif\" >     (The differences are not equal)</p>    <p style=\"orphans:0;widows:0\">Hence, 64 – 42 – 18 does not    belong to the group.</p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Based on the position in the English alphabetical order, three of    the following four letter-clusters are alike in a certain way and    thus form a group. Which is the one that does not belong to that    group?</p>    <p style=\"orphans:0;widows:0\">Note: Operations should be    performed on the letters as a whole; operations based on    consonants/vowels should not be considered.</p>", "option1": "<p style=\"orphans:0;widows:0\">    DGKI</p>", "option2": " <p style=\"orphans:0;widows:0\">    JMQO</p>", "option3": " <p style=\"orphans:0;widows:0\">    NQVT</p>", "option4": " <p style=\"orphans:0;widows:0\">    PSWU</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The logic followed here is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">DGKI: D (+3)    = G, G (+4) = K, K (-2) = I</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">JMQO: J (+3)    = M, M (+4) = Q, Q (-2) = O</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">PSWU: P (+3)    = S, S (+4) = W, W (-2) = U</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">NQVT: N (+3)    = Q, Q (+5) = V, V (-2) = T</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">All options    except 'NQVT' follow the pattern (+3, +4, -2).</p>    <p style=\"orphans:0;widows:0\">Hence, NQVT is the odd    letter-cluster.</p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"orphans:0;widows:0\">    In a certain code language, 'BANK' is coded as '80' and 'GIFT' is    coded as '66'. How will 'POST' be coded in that language?</p>", "option1": "<p style=\"orphans:0;widows:0\">    42</p>", "option2": " <p style=\"orphans:0;widows:0\">    38</p>", "option3": " <p style=\"orphans:0;widows:0\">    46</p>", "option4": " <p style=\"orphans:0;widows:0\">    34</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is the sum of the reverse positional    values (position from the right end of the alphabet) of the    letters.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">For 'BANK':</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B = 25, A =    26, N = 13, K = 16</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sum = 25 + 26    + 13 + 16 = 80</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">For 'GIFT':</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">G = 20, I =    18, F = 21, T = 7</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sum = 20 + 18    + 21 + 7 = 66</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Similarly,    for 'POST':</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">P = 11, O =    12, S = 8, T = 7</p>    <p style=\"orphans:0;widows:0\">Sum = 11 + 12 + 8 + 7 = 38</p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that is related to the fifth letter cluster in    the same way as the second letter cluster is related to the first    letter cluster and the fourth letter cluster is related to the    third letter cluster.</p>    <p style=\"orphans:0;widows:0\">SILENCE : LISEECN :: TRIUMPH :    IRTUHPM :: PACKAGE : ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    CAPKEGA</p>", "option2": " <p style=\"orphans:0;widows:0\">    CAPKAGE</p>", "option3": " <p style=\"orphans:0;widows:0\">    ACPKEGA</p>", "option4": " <p style=\"orphans:0;widows:0\">    EGAKCAP</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The logic followed here is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Each 7-letter    word is divided into three parts: the first 3 letters, the 4th    letter, and the last 3 letters.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The first    3 letters are reversed.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. The 4th    letter remains unchanged.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. The last 3    letters are reversed.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">For SILENCE:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">SIL → LIS,    E → E, NCE → ECN ⇒ LISEECN</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">For TRIUMPH:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">TRI → IRT,    U → U, MPH → HPM ⇒ IRTUHPM</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Similarly,    for PACKAGE:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">PAC → CAP,    K → K, AGE → EGA ⇒ CAPKEGA</p>    <p style=\"orphans:0;widows:0\">Hence, the correct option is    CAPKEGA.</p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Find the option that is EXACTLY the same as the given address:</p>    <p style=\"orphans:0;widows:0\">Door No. 8-2-293/82/A, Road No.    12, Banjara Hills, Hyderabad, Telangana - 500034</p>", "option1": "<p style=\"orphans:0;widows:0\">    Door No. 8-2-293/82/A, Road No. 12, Banjara Hill, Hyderabad,    Telangana - 500034</p>", "option2": " <p style=\"orphans:0;widows:0\">    Door No. 8-2-293/82/A, Road No. 21, Banjara Hills, Hyderabad,    Telangana - 500034</p>", "option3": " <p style=\"orphans:0;widows:0\">    Door No. 8-2-293/82/A, Road No. 12, Banjara Hills, Hyderabad,    Telangana - 500034</p>", "option4": " <p style=\"orphans:0;widows:0\">    Door No. 8-2-293/82/A, Road No. 12, Banjara Hills, Hyderabad,    Telangana - 500043</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Comparing each option carefully with the given address:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Option A    contains 'Banjara Hill' instead of 'Banjara Hills'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Option B    contains 'Road No. 21' instead of 'Road No. 12'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Option C    matches the given address character-by-character, including    spelling, symbols, and digits.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Option D    contains the PIN code '500043' instead of '500034'.</p>    <p style=\"orphans:0;widows:0\">Therefore, Option C is the exact    match.</p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the following British Viceroys introduced the Permanent    Settlement (Zamindari System) in Bengal, Bihar, and Orissa in    1793?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Lord    Dalhousie</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Lord    Cornwallis</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Lord    Wellesley</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Lord    William Bentinck</span></span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Lord    Cornwallis introduced the Permanent Settlement in 1793. Under this    system, Zamindars were recognized as owners of the land and had to    pay a fixed revenue to the British East India Company.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra    Facts:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Ryotwari    System: Introduced by Thomas Munro &amp; Alexander Read in    Madras/Bombay Presidencies.</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Mahalwari    System: Introduced by Holt Mackenzie in North-West Provinces.</span></span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    Article of the Indian Constitution states that \"India, that    is Bharat, shall be a Union of States\"?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Article    1</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Article    2</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Article    3</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"fo
