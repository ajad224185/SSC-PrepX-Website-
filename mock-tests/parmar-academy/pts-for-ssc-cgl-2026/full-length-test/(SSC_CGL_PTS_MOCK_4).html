ment     of </span><span style=\"font-family:'Nirmala UI'\"><b>Jawaharlal Nehru</b></span></p>    </li></ul>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    </p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">‘Chandanakuda Mahotsavam’ in    Kerala is a festival celebrated in a _____.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">temple</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">church</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">masjid</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">buddhist monastery</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: C) Masjid</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Points</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Chandanakuda     Mahotsavam</b></span><span style=\"font-family:'Nirmala UI'\"> is a     famous festival celebrated at a </span><span style=\"font-family:'Nirmala UI'\"><b>mosque     (masjid)</b></span><span style=\"font-family:'Nirmala UI'\"> in </span><span style=\"font-family:'Nirmala UI'\"><b>Kerala</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     festival is associated with the </span><span style=\"font-family:'Nirmala UI'\"><b>Beemapally     Mosque</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Devotees     offer </span><span style=\"font-family:'Nirmala UI'\"><b>“Chandanakuda”     (sandalwood-smeared pots)</b></span><span style=\"font-family:'Nirmala UI'\"> as     part of the ritual.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Celebrated     to honor </span><span style=\"font-family:'Nirmala UI'\"><b>Bee Umma</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">It     reflects </span><span style=\"font-family:'Nirmala UI'\"><b>communal     harmony</b></span><span style=\"font-family:'Nirmala UI'\">, with people     from different religions participating.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Net Primary Productivity (NPP) of    an ecosystem is best described as:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Total energy fixed by plants</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Energy lost through respiration by    producers</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Energy available to consumers after    plant respiration</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Energy transferred between trophic    levels</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Net     Primary Productivity (NPP)</b></span><span style=\"font-family:'Nirmala UI'\"> represents     the </span><span style=\"font-family:'Nirmala UI'\"><b>rate at which     plants accumulate biomass</b></span><span style=\"font-family:'Nirmala UI'\"> after     accounting for energy used in respiration.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is expressed as:<br> </span><span style=\"font-family:'Nirmala UI'\"><b>NPP     = Gross Primary Productivity (GPP) − Respiration (R)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>NPP     indicates the actual energy/biomass available to:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Herbivores      (primary consumers)</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Higher      trophic levels in the food chain</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Therefore,     NPP reflects the </span><span style=\"font-family:'Nirmala UI'\"><b>energy     that supports ecosystem productivity and food webs</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which chemical fertiliser is most    widely used in agriculture as a concentrated source of nitrogen    for crops?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Urea, CO(NH</span><span style=\"font-family:'Cambria Math'\">₂</span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Cambria Math'\">₂</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gypsum, CaSO</span><span style=\"font-family:'Cambria Math'\">₄</span><span style=\"font-family:'Nirmala UI'\">·2H</span><span style=\"font-family:'Cambria Math'\">₂</span><span style=\"font-family:'Nirmala UI'\">O</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Limestone, CaCO</span><span style=\"font-family:'Cambria Math'\">₃</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Potassium chloride, KCl</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: A) Urea,    CO(NH</b></span><span style=\"font-family:'Cambria Math'\"><b>₂</b></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Cambria Math'\"><b>₂</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Points</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Urea</b></span><span style=\"font-family:'Nirmala UI'\"> is     the </span><span style=\"font-family:'Nirmala UI'\"><b>most widely     used nitrogenous fertilizer</b></span><span style=\"font-family:'Nirmala UI'\"> in     agriculture.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     contains about </span><span style=\"font-family:'Nirmala UI'\"><b>46%     nitrogen</b></span><span style=\"font-family:'Nirmala UI'\">, the </span><span style=\"font-family:'Nirmala UI'\"><b>highest     nitrogen content among solid fertilizers</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Easily </span><span style=\"font-family:'Nirmala UI'\"><b>dissolves     in water</b></span><span style=\"font-family:'Nirmala UI'\">, allowing     plants to absorb nitrogen quickly.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Widely     used to </span><span style=\"font-family:'Nirmala UI'\"><b>increase     crop growth and yield</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Comparison    of Given Fertilisers</b></span></p>    <table>     <col>      <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Fertiliser</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Chemical Formula</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Main Nutrient</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Role</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Urea</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">CO(NH</span><span style=\"font-family:'Cambria Math'\">₂</span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Cambria Math'\">₂</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Nitrogen (46%)</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Promotes leaf and plant growth</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Gypsum</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">CaSO</span><span style=\"font-family:'Cambria Math'\">₄</span><span style=\"font-family:'Nirmala UI'\">·2H</span><span style=\"font-family:'Cambria Math'\">₂</span><span style=\"font-family:'Nirmala UI'\">O</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Calcium &amp; Sulphur</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Soil conditioner</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Limestone</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">CaCO</span><span style=\"font-family:'Cambria Math'\">₃</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Calcium</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Reduces soil acidity</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Potassium Chloride</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">KCl</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Potassium</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Improves plant resistance</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What happens to wavelength if    frequency increases keeping the speed of sound constant?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Increases</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Decreases</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Remains constant</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Becomes zero</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: B) Decreases</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Relationship    between </span><span style=\"font-family:'Nirmala UI'\"><b>wave speed,    frequency, and wavelength</b></span><span style=\"font-family:'Nirmala UI'\">:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1782048883986_html_ec273605fa0c0907.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Where</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>v</b></span><span style=\"font-family:'Nirmala UI'\"> =     wave speed</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>f</b></span><span style=\"font-family:'Nirmala UI'\"> =     frequency</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>λ</b></span><span style=\"font-family:'Nirmala UI'\"><b>     (lambda)</b></span><span style=\"font-family:'Nirmala UI'\"> =     wavelength</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This    is the </span><span style=\"font-family:'Nirmala UI'\"><b>Wave    equation</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">If </span><span style=\"font-family:'Nirmala UI'\"><b>speed     of sound (v)</b></span><span style=\"font-family:'Nirmala UI'\"> is </span><span style=\"font-family:'Nirmala UI'\"><b>constant</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>frequency     (f) increases</b></span><span style=\"font-family:'Nirmala UI'\">,</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Then </span><span style=\"font-family:'Nirmala UI'\"><b>wavelength     (</b></span><span><b>λ</b></span><span style=\"font-family:'Nirmala UI'\"><b>)     must decrease</b></span><span style=\"font-family:'Nirmala UI'\"> to     keep the equation balanced.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1782048883986_html_e22db4325b89f085.gif\" > <span style=\"font-family:'Nirmala UI'\">So </span><span style=\"font-family:'Nirmala UI'\"><b>frequency    </b></span><span><b>↑</b></span><span style=\"font-family:'Nirmala UI'\"><b>    </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    wavelength </b></span><span><b>↓</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The President of India is elected    by which method?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Direct election</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Nomination</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Electoral College</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lottery system</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Option: C.    Electoral College</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    President is </span><span style=\"font-family:'Nirmala UI'\"><b>not    elected directly by the public</b></span><span style=\"font-family:'Nirmala UI'\">.    Instead, an </span><span style=\"font-family:'Nirmala UI'\"><b>Electoral    College</b></span><span style=\"font-family:'Nirmala UI'\"> elects the    President.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">According    to </span><span style=\"font-family:'Nirmala UI'\"><b>Constitution of    India (Article 54)</b></span><span style=\"font-family:'Nirmala UI'\">,    the Electoral College consists of:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Elected     members of both Houses of Parliament</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Lok      Sabha</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Rajya      Sabha</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Elected     members of the Legislative Assemblies of all States</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Elected     members of the Legislative Assemblies of Union Territories</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Delhi</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Puducherry</span></p>     </li></ul>    </li></ol>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Important    Points for Exams</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Nominated     members do NOT participate</b></span><span style=\"font-family:'Nirmala UI'\"> in     the presidential election.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     election is conducted by </span><span style=\"font-family:'Nirmala UI'\"><b>Proportional     Representation system using Single Transferable Vote</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Voting     is done by </span><span style=\"font-family:'Nirmala UI'\"><b>secret     ballot</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Who returned the Padma Vibhushan    award protesting against the treatment of tribals during the    Sardar Sarovar Dam construction?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Medha Patkar</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Baba Amte</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Anna Hazare</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Aruna Roy</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: B) Baba Amte</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Points</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Baba     Amte</b></span><span style=\"font-family:'Nirmala UI'\"> returned     the </span><span style=\"font-family:'Nirmala UI'\"><b>Padma     Vibhushan</b></span><span style=\"font-family:'Nirmala UI'\"> in     protest.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     protest was against the </span><span style=\"font-family:'Nirmala UI'\"><b>displacement     and treatment of tribal communities</b></span><span style=\"font-family:'Nirmala UI'\"> due     to the </span><span style=\"font-family:'Nirmala UI'\"><b>Sardar     Sarovar Dam</b></span><span style=\"font-family:'Nirmala UI'\"> project.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Baba     Amte supported the </span><span style=\"font-family:'Nirmala UI'\"><b>Narmada     Bachao Andolan</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">He     returned the award in </span><span style=\"font-family:'Nirmala UI'\"><b>1991</b></span><span style=\"font-family:'Nirmala UI'\"> as     a mark of solidarity with the affected people.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which Five-Year Plan introduced the    concept of poverty alleviation programs in India?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">First Five-Year Plan</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Third Five-Year Plan</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Fifth Five-Year Plan</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Seventh Five-Year Plan</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: C) Fifth    Five-Year Plan</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Points</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Fifth     Five-Year Plan</b></span><span style=\"font-family:'Nirmala UI'\"> introduced     the concept of </span><span style=\"font-family:'Nirmala UI'\"><b>poverty     alleviation programs</b></span><span style=\"font-family:'Nirmala UI'\"> in     India.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Its     main objective was </span><span style=\"font-family:'Nirmala UI'\"><b>“Garibi     Hatao” (Removal of Poverty)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Launched     during the government of </span><span style=\"font-family:'Nirmala UI'\"><b>Indira     Gandhi</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Focused     on </span><span style=\"font-family:'Nirmala UI'\"><b>employment     generation, poverty reduction, and self-reliance</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Comparison    of Early Five-Year Plans</b></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Plan</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Period</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Main Focus</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>First Plan</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1951–1956</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Agriculture &amp; irrigation</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Third Plan</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1961–1966</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Self-sufficiency in food grains</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Fifth Plan</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1974–1979</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Poverty removal (Garibi       Hatao)</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Seventh Plan</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1985–1990</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Productivity, modernization</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Important Facts:</b></span></p>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>First Five-Year Plan:</b></span><span style=\"font-family:'Nirmala UI'\"> Based     on </span><span style=\"font-family:'Nirmala UI'\"><b>Harrod-Domar     model</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Planning Commission</b></span><span style=\"font-family:'Nirmala UI'\"> established     in </span><span style=\"font-family:'Nirmala UI'\"><b>1950</b></span><span style=\"font-family:'Nirmala UI'\"> (now     replaced by </span><span style=\"font-family:'Nirmala UI'\"><b>NITI     Aayog</b></span><span style=\"font-family:'Nirmala UI'\"> in 2015).</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Fifth     Plan</b></span><span style=\"font-family:'Nirmala UI'\"> was </span><span style=\"font-family:'Nirmala UI'\"><b>terminated     early in 1978</b></span><span style=\"font-family:'Nirmala UI'\"> by     the </span><span style=\"font-family:'Nirmala UI'\"><b>Janata     Government</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the idiom that is closest in    meaning to the underlined idiom.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Despite    many warnings, the company decided to </span><span style=\"font-family:'Nirmala UI'\"><u>stick    its neck out </u></span><span style=\"font-family:'Nirmala UI'\">and    invest heavily in the risky project.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Take a big risk</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Keep a secret</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Follow the crowd</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Avoid responsibility</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Stick     one’s neck out</b></span><span style=\"font-family:'Nirmala UI'\"> –     To take a risk or do something that could bring criticism or     trouble (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>जोखिम     उठाना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>।</span></span></span></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The      idiom comes from the </span><span style=\"font-family:'Nirmala UI'\"><b>idea      of exposing your neck to danger</b></span><span style=\"font-family:'Nirmala UI'\">.      In earlier times, the </span><span style=\"font-family:'Nirmala UI'\"><b>neck      was considered the most vulnerable part of the body</b></span><span style=\"font-family:'Nirmala UI'\">,      especially in </span><span style=\"font-family:'Nirmala UI'\"><b>battles      or executions</b></span><span style=\"font-family:'Nirmala UI'\">. If      someone </span><span style=\"font-family:'Nirmala UI'\"><b>“stuck      their neck out,”</b></span><span style=\"font-family:'Nirmala UI'\"> it      meant they </span><span style=\"font-family:'Nirmala UI'\"><b>put      themselves in a dangerous position</b></span><span style=\"font-family:'Nirmala UI'\"> where      they could easily be attacked or punished.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Over     time, the phrase came to mean </span><span style=\"font-family:'Nirmala UI'\"><b>taking     a bold risk or expressing an opinion that could cause trouble</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Take     a big risk</b></span><span style=\"font-family:'Nirmala UI'\"> – To     do something dangerous or uncertain (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>बड़ा     जोखिम लेना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Keep     a secret</b></span><span style=\"font-family:'Nirmala UI'\"> – To     not tell others about something (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>राज़     छिपाना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Follow     the crowd</b></span><span style=\"font-family:'Nirmala UI'\"> – To     do what everyone else is doing (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>दूसरों     की नकल करना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Avoid     responsibility</b></span><span style=\"font-family:'Nirmala UI'\"> –     To try not to accept duty or blame (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>जिम्मेदारी     से बचना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option A is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate synonym    of the word “Desultory.”</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Systematic</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Aimless</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Careful</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Energetic</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Desultory</b></span><span style=\"font-family:'Nirmala UI'\"> –     Lacking a clear plan, purpose, or direction; jumping from one     thing to another<br> (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>अनियमित     </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/ </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>बिना     किसी उद्देश्य के</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>।</span></span></span></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Synonyms:</b></span><span style=\"font-family:'Nirmala UI'\"> Digressive,      discursive, haphazard, erratic, capricious</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Antonyms:</b></span><span style=\"font-family:'Nirmala UI'\"> Methodical,      systematic, steadfast, unwavering, assiduous</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Aimless     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>उद्देश्यहीन</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     Without purpose or direction.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Systematic     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>व्यवस्थित</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     Done according to a fixed plan or organized method.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Careful     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>सावधान</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     Taking great care to avoid mistakes.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Energetic     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>ऊर्जावान</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     Full of energy and activity.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option B is the correct answer.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the incorrectly spelt word.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Conscientious</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Pronounciation</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Accommodation</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Entrepreneur</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conscientious</b></span><span style=\"font-family:'Nirmala UI'\"> –     careful to do things correctly and responsibly (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>ईमानदार     </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/     </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>कर्तव्यनिष्ठ</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pronounciation</b></span><span style=\"font-family:'Nirmala UI'\"> –     Incorrect spelling<br> Correct spelling- </span><span style=\"font-family:'Nirmala UI'\"><b>Pronunciation</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>उच्चारण</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Accommodation</b></span><span style=\"font-family:'Nirmala UI'\"> –     a place to stay or lodging (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>आवास     </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/ </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>रहने     की व्यवस्था</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Entrepreneur</b></span><span style=\"font-family:'Nirmala UI'\"> –     a person who starts and runs a business (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>उद्यमी     </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/     </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>व्यवसाय     शुरू करने वाला व्यक्ति</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option B is the correct answer.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate synonym    of the word “Clandestine.”</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Surreptitious</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ostentatious</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ubiquitous</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Belligerent</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Clandestine</b></span><span style=\"font-family:'Nirmala UI'\"> –     done secretly or hidden, especially to avoid notice (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>गुप्त     </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/     </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>चोरी</span></span></span></span><span style=\"font-family:'Nirmala UI'\">-</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>छिपे     किया गया</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Synonyms:</b></span><span style=\"font-family:'Nirmala UI'\"> Surreptitious,      covert, furtive, sub-rosa, stealthy</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Antonyms:</b></span><span style=\"font-family:'Nirmala UI'\"> Manifest,      overt, palpable, blatant, undisguised</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Surreptitious     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>गुप्त     </b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>/     </b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>चोरी</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>-</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>छिपे</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     kept secret, especially because it is improper or illegal.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Ostentatious     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=  or damaging, but it </span><span style=\"font-family:'Nirmala UI'\"><b>does     not specifically imply gradual or subtle harm.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Inconsequential     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>महत्त्वहीन</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"><b> –     not important.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Benign     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>हानिरहित</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"><b> –     gentle and not harmful.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option A is the correct answer.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the correct option.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    scientist spoke so </span><span style=\"font-family:'Nirmala UI'\"><b>________</b></span><span style=\"font-family:'Nirmala UI'\"> that    the audience could clearly understand every detail of the    experiment.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">vaguely</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI' pan><span style=\"font-family:'Nirmala UI'\"><b>The     research team prepared the final report after the data had been     thoroughly analyzed.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option A is the correct answer.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate idiom    to fill in the blank.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Even    after the company suffered heavy losses, the CEO refused to admit    his mistake and continued to __________.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">put the cart before the horse</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Give it one’s best shot</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">move heaven and earth</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">bury his head in the sand<br> </span><br>     </p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     sentence suggests that the CEO </span><span style=\"font-family:'Nirmala UI'\"><b>refused     to accept reality or acknowledge the problem</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Bury     one’s head in the sand (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\" ><span style=\"font-family:'Nirmala UI'\"> –     a person who </span><span style=\"font-family:'Nirmala UI'\"><b>betrays     trust</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Trustee     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>न्यासी</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     a person who holds property in trust for another.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Confidant     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>विश्वासपात्र</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     a person with whom secrets are shared.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Custodian     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>संरक्षक</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     a person who takes care of something.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence, Option    C is the correct answer.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 37, "question": "Sधnपधncधौ यी ो ूोनोgनोूु ोनध ुहंृिधक. Aननोngध पुधं in पुध cयननधcप यनकधन. Mोnद ूधयूिध ृिधiधॅध पुोप नधोकing ृययो नधgिहोिनद iंूनयॅधौ ाnयिथधकgध ोnक cनiपicोि पुinाing. Aौ ो नधौिहप, inकiॅiकहोिस थुय नधोक ीनधतहधnिपद यीपधn कधॅिधयू ृधपपधन ोnोिदपicोि ोnक cयंंहnicोपiयn ौाiििस. Rधोकing धसूयौधौ पुध ंinक पय कiीीधनधnप ूधनौूधcपiॅधौ, iकधोौ, ोnक cिहपहनधौ. Tुधनधीयनध, cिहपiॅोपing पुध ुोृiप यी नधोकing iौ ुigुिद ृधnधीiciोि ीयन ूधनौयnोि gनयथपु.", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1-3-2-4</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3-1-4-2</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2-1-3-4<br> </span><br>     </p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1-2-4-3</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence     1</b></span><span style=\"font-family:'Nirmala UI'\"> – Introduces     the </span><span style=\"font-family:'Nirmala UI'\"><b>general idea     about reading and its benefits</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence     3</b></span><span style=\"font-family:'Nirmala UI'\"> – Explains </span><span style=\"font-family:'Nirmala UI'\"><b>how     reading helps</b></span><span style=\"font-family:'Nirmala UI'\"> by     exposing the mind to new ideas.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence     2</b></span><span style=\"font-family:'Nirmala UI'\"> – Shows     the </span><span style=\"font-family:'Nirmala UI'\"><b>result of this     exposure</b></span><span style=\"font-family:'Nirmala UI'\"> (better     analytical and communication skills).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence     4</b></span><span style=\"font-family:'Nirmala UI'\"> – Concludes     with the </span><span style=\"font-family:'Nirmala UI'\"><b>importance     of developing the reading habit</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Logical     flow:</b></span><span style=\"font-family:'Nirmala UI'\"><br> </span><span style=\"font-family:'Nirmala UI'\"><b>Introduction     </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     Explanation </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     Result </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     Conclusion</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option A is the correct answer.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Change the following sentence into    indirect speech:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    teacher said to the students, “You must complete your    assignments today, and you should submit them tomorrow.”</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The teacher told the students that    you must complete your assignments today and should submit them    tomorrow.<br> </span><br>     </p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The teacher said the students that    they had to complete their assignments that day and should submit    them the next day.<br> </span><br>     </p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The teacher told the students that    they must completed their assignments that day and should    submitted them the next day.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The teacher told the students that    they must complete their assignments that day and should submit    them the next day.</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Reporting     verb:</b></span><span style=\"font-family:'Nirmala UI'\"><br> “said to”     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     changes to </span><span style=\"font-family:'Nirmala UI'\"><b>told</b></span><span style=\"font-family:'Nirmala UI'\"> because     the object (</span><span style=\"font-family:'Nirmala UI'\"><b>students</b></span><span style=\"font-family:'Nirmala UI'\">)     is present.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pronoun     change:</b></span><span style=\"font-family:'Nirmala UI'\"><br> “You”     </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>they</b></span><span style=\"font-family:'Nirmala UI'\"> (referring     to the students).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Time     changes:</b></span><span style=\"font-family:'Nirmala UI'\"><br> “today”     </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>that     day</b></span><span style=\"font-family:'Nirmala UI'\"><br> “tomorrow”     </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>the     next day</b></span></p>     </li><li><p style=\" ;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">II.    Increasing production cost is a possible consequence of changing    packaging materials.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">III.    Customers will stop buying the company’s products due to higher    costs.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I and II are implicit.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only II and III are implicit.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I and III are implicit.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">All I, II and III are implicit.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>I.</b></span><span style=\"font-family:'Nirmala UI'\"> If     the company assumes that reducing plastic actually </span><span style=\"font-family:'Nirmala UI'\"><b>helps     environmental sustainability</b></span><span style=\"font-family:'Nirmala UI'\">. </span><span style=\"font-family:'Nirmala UI'\"><b>So,     Assumption I holds.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>II.</b></span><span style=\"font-family:'Nirmala UI'\"> The     statement says that this step may increase production costs,     which implies the assumption that changing packaging materials     can increase costs. </span><span style=\"font-family:'Nirmala UI'\"><b>So,     Assumption II also holds.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>III. </b></span><span style=\"font-family:'Nirmala UI'\">The     statement does not suggest that customers will stop buying the     products. It only mentions a possible increase in cost, not     customer reaction. </span><span style=\"font-family:'Nirmala UI'\"><b>So,     Assumption III does not hold.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence, only    I and II are implicit, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">How many meaningful four-letter    English words can be formed using the second, fifth, seventh and    ninth letters of the word \"TRANSPORT\" (when counted from    left to right), using each letter only once in each word?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">One</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Two</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Three</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">None</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The letters we have to work with    are </span><span style=\"font-family:'Nirmala UI'\"><b>R, S, O, T</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Meaningful    words from these letters are:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>ROTS: </b></span><span style=\"font-family:'Nirmala UI'\">It     is the plural form of “rot.” Rot means to decay, spoil, or     decompose, especially due t estion_heading": ""}, {"sr_no": 66, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In each of the following questions,    a pair of letters is related to a numerical fraction based on    their positions in the English alphabet. Determine the logic    behind the relationship and apply the same rule to the second pair    to find the missing value.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>HK    : 64/3 :: MR : ?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">169/5</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">144/4</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">169/4</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">196/5</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Check the alphabetical position of    H and K,</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">H     = 8 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     8</span><sup><span style=\"font-family:'Nirmala UI'\">2</span></sup><span style=\"font-family:'Nirmala UI'\">=     64</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">K     = 11</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Difference     = 11 - 8 = 3</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Given     fraction = 64/3</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Numerator: </b></span><span style=\"font-family:'Nirmala UI'\">The    numerator is 64, which is the square of the first letter's    position.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Denominator: </b></span><span style=\"font-family:'Nirmala UI'\">The    denominator is 3, which is the difference between the positions of    the two letters.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Apply    this pattern to MR</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">M     = 13, 13</span><sup><span style=\"font-family:'Nirmala UI'\">2</span></sup><span style=\"font-family:'Nirmala UI'\"> =     169</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">R     = 18</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Difference     = 18 − 13 = 5</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">New    relation will be </span><span style=\"font-family:'Nirmala UI'\"><b>MR    : 169/5.</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    169/5 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Refer to the following number,    letter and symbol series and answer the question that    follows. Counting to be done from left to right only.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(Left)    8  # % € $ A &amp; B * 3 C © 4 E 4 € 1 # K ©    (Right)</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">How    many such </span>
