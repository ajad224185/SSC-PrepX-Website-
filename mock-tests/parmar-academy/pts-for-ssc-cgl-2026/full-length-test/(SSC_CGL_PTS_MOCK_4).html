<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>7.) SSC CGL PTS  MOCK 4 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

mily:'Nirmala UI'\">Study climate and atmospheric       composition</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Interior</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Understand tectonic and internal       processes</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Planet Evolution</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Compare Venus with Earth</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1782048883986_html_a623b6d00b037315.png\" width=\"250\" height=\"166\" > </p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In the context of Privatisation,    what is the meaning of total decentralisation?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It implies 100% transfer of    ownership of a public enterprise to private sector.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It implies 51% transfer of    ownership of a private enterprise to public sector.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It implies 51% transfer of    ownership of a public enterprise to private sector.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It implies 100% transfer of    ownership of a private enterprise to public sector.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1782048883986_html_e85003e13338f830.png\" width=\"250\" height=\"166\" > <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1782048883986_html_e85003e13338f830.png\" width=\"250\" height=\"166\" > <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1782048883986_html_e85003e13338f830.png\" width=\"250\" height=\"166\" > <span style=\"font-family:'Nirmala UI'\"><b>Gemini    said</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Correct    answer is </span><span style=\"font-family:'Nirmala UI'\"><b>A) It implies    100% transfer of ownership of a public enterprise to private    sector.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In    the context of reforms and privatization, </span><span style=\"font-family:'Nirmala UI'\"><b>total    disinvestment</b></span><span style=\"font-family:'Nirmala UI'\"> (often    referred to in this specific context as total decentralization of    government control) occurs when the government completely exits a    Public Sector Undertaking (PSU). This results in the full transfer    of assets, management, and control to a private entity.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Characteristics of Total Privatization</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Ownership     Shift:</b></span><span style=\"font-family:'Nirmala UI'\"> The government’s     shareholding drops to </span><span style=\"font-family:'Nirmala UI'\"><b>0%</b></span><span style=\"font-family:'Nirmala UI'\">,     while the private sector acquires </span><span style=\"font-family:'Nirmala UI'\"><b>100%</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Management     Control:</b></span><span style=\"font-family:'Nirmala UI'\"> The government     ceases to have any say in the day-to-day operations or long-term     strategy of the company.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Objective:</b></span><span style=\"font-family:'Nirmala UI'\">     Primarily aimed at improving efficiency, reducing the fiscal     burden on the state, and fostering competition.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Revenue:</b></span><span style=\"font-family:'Nirmala UI'\">     The proceeds from such a sale are used by the government for     social infrastructure or to bridge fiscal deficits.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1782048883986_html_90059c6f5cd30f3e.png\" width=\"250\" height=\"166\" > </p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>Which Country    Hosted ‘AI Impact Summit 2026 ’?   <br> </span></span><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">India</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Switzerland</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">France</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">USA</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">AI Impact Summit 2026 : 1st    Global Artificial Intelligence (AI) Summit Hosted in Global    South<br> </span><span>▪</span><span style=\"font-family:'Nirmala UI'\">Venue    : Bharat Mandapam , New Delhi<br> </span><span>▪</span><span style=\"font-family:'Nirmala UI'\">Inaugurated    By : PM Narendra Modi<br> </span><span>▪</span><span style=\"font-family:'Nirmala UI'\">Organised : Under    IndiaAI Mission  — By The Ministry of Electronics and    Information Technology<br> </span><span>▪</span><span style=\"font-family:'Nirmala UI'\">The    Three Sutras (Pillars): People, Planet, and Progress<br> </span><span>▪</span><span style=\"font-family:'Nirmala UI'\">2027    Summit — Geneva, Switzerland</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Regarding the Preamble of the    Indian Constitution, consider the following statements:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">1.    It is primarily based on the ‘Objectives Resolution’ which was    presented by Dr. B. R. Ambedkar.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">2.    In the Berubari Union case, the Supreme Court held that the    Preamble is a part of the Constitution.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the above statements is/are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 1</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 2</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both 1 and 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither 1 nor 2</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Statement     1 is incorrect: The Preamble is based on the Objectives     Resolution, but it was </span><span style=\"font-family:'Nirmala UI'\"><b>presented     by Pandit Jawaharlal Nehru</b></span><span style=\"font-family:'Nirmala UI'\">,     not Dr. B. R. Ambedkar.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Statement     2 is incorrect: In the </span><span style=\"font-family:'Nirmala UI'\"><b>Berubari     Union case (1960),</b></span><span style=\"font-family:'Nirmala UI'\"> the     Supreme Court held that the Preamble is </span><span style=\"font-family:'Nirmala UI'\"><b>not     a part of the Constitution</b></span><span style=\"font-family:'Nirmala UI'\">.     This decision was later overturned in the </span><span style=\"font-family:'Nirmala UI'\"><b>Kesavananda     Bharati vs. State of Kerala case (1973).</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following statements    correctly applies the weighted voting mechanism under Article    279A(9) of the Indian Constitution?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The Centre holds 75% of the voting    power in the GST Council.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A GST Council decision can be    passed solely with the support of the Centre and one State.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The States collectively have twice    the voting weight of the Centre in the GST Council.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Each State has equal weightage as    the Centre in GST Council voting.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: C) The States    collectively have twice the voting weight of the Centre in the GST    Council.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Points (Article 279A(9) – GST Council Voting)</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article     279A</b></span><span style=\"font-family:'Nirmala UI'\"> of the     Constitution provides for the </span><span style=\"font-family:'Nirmala UI'\"><b>GST     Council</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Weighted     voting system</b></span><span style=\"font-family:'Nirmala UI'\"> is     used for decision making.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Voting     Power Distribution:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Central      Government:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>1/3      of total votes (33.33%)</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>All      States together:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>2/3      of total votes (66.67%)</b></span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Decision     Requirement:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">At      least </span><span style=\"font-family:'Nirmala UI'\"><b>3/4th (75%)      of the weighted votes</b></span><span style=\"font-family:'Nirmala UI'\"> of      members present and voting.</span></p>     </li></ul>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Implication:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Neither </span><span style=\"font-family:'Nirmala UI'\"><b>Centre     alone</b></span><span style=\"font-family:'Nirmala UI'\"> nor </span><span style=\"font-family:'Nirmala UI'\"><b>States     alone</b></span><span style=\"font-family:'Nirmala UI'\"> can pass a     decision.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Both     must agree</b></span><span style=\"font-family:'Nirmala UI'\">, making GST     Council a </span><span style=\"font-family:'Nirmala UI'\"><b>cooperative     federal institution</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Facts</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\" >     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>44th     Constitutional Amendment Act</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>did     not place the election of the Prime Minister beyond judicial     review</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     provision that tried to </span><span style=\"font-family:'Nirmala UI'\"><b>exclude     judicial review of elections of PM, President, Vice-President and     Lok Sabha Speaker</b></span><span style=\"font-family:'Nirmala UI'\"> was     inserted by the </span><span style=\"font-family:'Nirmala UI'\"><b>39th     Constitutional Amendment Act</b></span><span style=\"font-family:'Nirmala UI'\"> through </span><span style=\"font-family:'Nirmala UI'\"><b>Article     329A</b></span><span style=\"font-family:'Nirmala UI'\"> during the     Emergency.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Later,     the </span><span style=\"font-family:'Nirmala UI'\"><b>Indira Nehru     Gandhi v. Raj Narain</b></span><span style=\"font-family:'Nirmala UI'\"> judgment     struck down this provision as </span><span style=\"font-family:'Nirmala UI'\"><b>unconstitutional</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    2 : Correct</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>99th     Constitutional Amendment Act</b></span><span style=\"font-family:'Nirmala UI'\"> created     the </span><span style=\"font-family:'Nirmala UI'\"><b>National     Judicial Appointments Commission (NJAC)</b></span><span style=\"font-family:'Nirmala UI'\"> to     appoint judges.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In </span><span style=\"font-family:'Nirmala UI'\"><b>2015</b></span><span style=\"font-family:'Nirmala UI'\">,     the </span><span style=\"font-family:'Nirmala UI'\"><b>Supreme Court     of India</b></span><span style=\"font-family:'Nirmala UI'\"> struck     down the amendment in the </span><span style=\"font-family:'Nirmala UI'\"><b>Supreme     Court Advocates-on-Record Association v. Union of India</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Reason:     It </span><span style=\"font-family:'Nirmala UI'\"><b>violated the     independence of the judiciary</b></span><span style=\"font-family:'Nirmala UI'\">,     which is part of the </span><span style=\"font-family:'Nirmala UI'\"><b>Basic     Structure Doctrine</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <table>     <col>      <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Amendment</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Year</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Key Provision</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Status</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>39th Amendment</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1975</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Tried to put PM’s election       beyond judicial review (Art. 329A)</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Partly struck down</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>44th Amendment</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1978</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Restored civil liberties after       Emergency</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">In force</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\" which of the following dynasties?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Chera</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Chandela</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Rashtrakuta</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Solanki</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: B) Chandela</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Points</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Kandariya     Mahadeva Temple</b></span><span style=\"font-family:'Nirmala UI'\"> was     built by the </span><span style=\"font-family:'Nirmala UI'\"><b>Chandela     dynasty</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Constructed     around </span><span style=\"font-family:'Nirmala UI'\"><b>1025–1050     CE</b></span><span style=\"font-family:'Nirmala UI'\"> during the     reign of </span><span style=\"font-family:'Nirmala UI'\"><b>Vidyadhara</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Located     in </span><span style=\"font-family:'Nirmala UI'\"><b>Khajuraho</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Dedicated     to </span><span style=\"font-family:'Nirmala UI'\"><b>Shiva</b></span><span style=\"font-family:'Nirmala UI'\"> and     built in the </span><span style=\"font-family:'Nirmala UI'\"><b>Nagara     style</b></span><span style=\"font-family:'Nirmala UI'\"> of North     Indian temple architecture.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is the </span><span style=\"font-family:'Nirmala UI'\"><b>largest and     most elaborate temple</b></span><span style=\"font-family:'Nirmala UI'\"> in     the Khajuraho group.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Khajuraho     Group of Monuments</b></span><span style=\"font-family:'Nirmala UI'\"> was     declared a UNESCO site in </span><span style=\"font-family:'Nirmala UI'\"><b>1986</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Who is known as Sungam Tavirtta    Cholan?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kulottunga I</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Rajendra III</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Rajaraja I</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kulottunga III</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: A) Kulottunga I</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Points</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Kulottunga     I</b></span><span style=\"font-family:'Nirmala UI'\"> was known     as </span><span style=\"font-family:'Nirmala UI'\"><b>“Sungam     Tavirtta Cholan.”</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     title means </span><span style=\"font-family:'Nirmala UI'\"><b>“the     Chola who abolished tolls/taxes (Sungam)”</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">He </span><span style=\"font-family:'Nirmala UI'\"><b>removed     internal customs duties</b></span><span style=\"font-family:'Nirmala UI'\"> to     promote </span><span style=\"font-family:'Nirmala UI'\"><b>trade and     commerce</b></span><span style=\"font-family:'Nirmala UI'\"> in     the </span><span style=\"font-family:'Nirmala UI'\"><b>Chola dynasty</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Ruled     from </span><span style=\"font-family:'Nirmala UI'\"><b>1070–1122     CE</b></span><span style=\"font-family:'Nirmala UI'\"> and     strengthened the </span><span style=\"font-family:'Nirmala UI'\"><b>administration     and economy</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In India, as per the Industrial    Policy Resolution 1956, the second category consisted of    industries in which the _____.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">private sector could supplement the    efforts of public sector</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">only foreign private sector would    be entertained</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">public sector units had no role</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">private sector had sole authority    to start new units</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: A) Private sector    could supplement the efforts of public sector</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Points</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Industrial     Policy Resolution 1956</b></span><span style=\"font-family:'Nirmala UI'\"> classified     industries into </span><span style=\"font-family:'Nirmala UI'\"><b>three     schedules</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Second     Category (Schedule B)</b></span><span style=\"font-family:'Nirmala UI'\"> industries     were </span><span style=\"font-family:'Nirmala UI'\"><b>primarily the     responsibility of the public sector</b></span><span style=\"font-family:'Nirmala UI'\">,     but the </span><span style=\"font-family:'Nirmala UI'\"><b>private     sector could supplement the efforts of the public sector</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Classification    of
