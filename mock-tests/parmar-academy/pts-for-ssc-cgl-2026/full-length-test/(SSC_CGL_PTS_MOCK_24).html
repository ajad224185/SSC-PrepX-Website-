 "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-size:11pt\">When resistors are    connected in series, the equivalent resistance (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717295493_html_1f75d5e6a6d7877b.gif\" > <span style=\"font-size:11pt\">)    is the sum of the individual resistances:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717295493_html_d893c681f96e9315.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-size:11pt\">Using Ohm's law, total    current (</span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717295493_html_b6eafdce8f06e364.gif\" > <span style=\"font-size:11pt\">)    is:</span></p>    <p style=\"orphans:0;widows:0\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717295493_html_58e09b6c3c536c9b.gif\" > </p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\"><b>Which architectural    style is primarily associated with the construction of ancient    temples in South India?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Nagara style</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Dravida style</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Vesara style</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Indo-Saracenic style</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">The ancient temple    architecture of South India is predominantly characterized by the    Dravida style. Key features of this style include pyramid-like    towers called Vimanas and large gateway towers known as Gopurams.</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\"><span><b>Which    advanced Earth Observation Satellite was recently launched by ISRO    aboard the GSLV-F17 rocket to provide continuous, real-time    geo-imaging of the Indian subcontinent from Geostationary Orbit?</b></span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">EOS-05 (Geo-Imaging    Satellite)</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">NISAR</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">SPADEX (Space Docking    Experiment)</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">EOS-08</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\"><span>ISRO    successfully launched EOS-05 using the GSLV-F17 rocket. Placed in    a geostationary transfer orbit (~36,000 km altitude), it acts as    India's dedicated \"eye in the sky,\" offering real-time    continuous monitoring for disaster management, agriculture, and    strategic observation.</span></span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\"><b>Which of the following    statements is INCORRECT regarding plant tissues?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Xylem transports water and    minerals from roots to other parts of the plant</span></p>", "option2": "Scिधनधncुदंो पiौौहध cयnौiौपौ यी िiॅing cिधिस थiपु पुin cिधि थोििस पुोप ूधनीयनं ूुयपयौदnपुधौiौ", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Collenchyma tissue provides    flexibility and mechanical support to young stems</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Phloem transports food    produced in leaves to different parts of the plant</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Statement B is INCORRECT.    Sclerenchyma tissue consists of dead cells with thick, lignified    cell walls that provide mechanical support and strength to the    plant body. It does not perform photosynthesis. In contrast,    parenchyma cells are living with thin cell walls and are involved    in photosynthesis and food storage.</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\"><b>Which Article of the    Indian Constitution directs the State to endeavour to secure a    Uniform Civil Code (UCC) for the citizens throughout the territory    of India?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Article 40</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Article 44</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Article 48</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Article 50</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Article 44 of the Indian    Constitution, under Part IV (Directive Principles of State    Policy), states that the State shall endeavour to secure for the    citizens a Uniform Civil Code throughout the territory of India.    Among the other options: Article 40 relates to the organization of    village panchayats, Article 48 relates to agriculture and animal    husbandry, and Article 50 deals with the separation of the    judiciary from the executive.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\"><b>Who was the first Chief    of Defence Staff (CDS) of India?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">General Bipin Rawat</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">General Manoj Mukund    Naravane</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">General Anil Chauhan</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Admiral Sunil Lanba</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">General Bipin Rawat was    appointed as the first Chief of Defence Staff (CDS) of India in    December 2019 and officially took charge on January 1, 2020.</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\"><b>'Ghoomar' is a famous    traditional folk dance belonging to which of the following Indian    states?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Gujarat</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Rajasthan</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Punjab</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Maharashtra</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Ghoomar is a traditional    folk dance of Rajasthan. It is performed primarily by women    wearing flowing dresses called 'ghaghara' during special occasions    and festivals like Teej and Gangaur.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\"><b>During which of the    following prehistoric periods did human beings first discover and    use fire?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Paleolithic Period</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Mesolithic Period</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Neolithic Period</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Chalcolithic Period</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">The discovery and    controlled use of fire occurred during the Paleolithic Period (Old    Stone Age). Fire provided early humans with warmth, light,    protection from wild animals, and a way to cook food.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-size:11pt\"><b>Consider the following    statements regarding Inland Waterways in India:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-size:11pt\"><b>1. National Waterway 1    (NW-1) is located on the Ganga-Bhagirathi-Hooghly river system    stretching from Prayagraj to Haldia.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-size:11pt\"><b>2. The headquarters of    the Inland Waterways Authority of India (IWAI) is located in    Kolkata.</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-size:11pt\"><b>Which    of the statement(s) given above is/are INCORRECT?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">1 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">2 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Both 1 and 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Neither 1 nor 2</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-size:11pt\">Statement 1 is correct:    National Waterway 1 (NW-1) covers a distance of 1,620 km from    Prayagraj to Haldia along the Ganga-Bhagirathi-Hooghly river    system.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-size:11pt\">Statement    2 is incorrect: The Inland Waterways Authority of India (IWAI) was    constituted in October 1986, and its statutory headquarters is    located in Noida, Uttar Pradesh, not Kolkata.</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\"><b>The seasonal movement of    pastoral nomads along with their livestock between summer and    winter pastures, often leading to the creation of temporary    settlements, is known as:</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Transhumance</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Step migration</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Commuting</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Urban sprawl</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Transhumance refers to the    seasonal movement of people with their livestock between summer    and winter pastures. It is commonly practiced in mountainous or    semi-arid regions where nomads build temporary settlements for    short periods during grazing seasons.</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-size:11pt\"><b>Consider the following    statements regarding the climatic characteristics of India:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-size:11pt\"><b>1. The retreat of the    southwest monsoon is characterized by clear skies and a temporary    rise in temperature, a phenomenon known as 'October Heat'.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-size:11pt\"><b>2. The Tamil Nadu coast    receives very little rainfall from the southwest monsoon because    it lies parallel to the Bay of Bengal branch and in the    rain-shadow region of the Arabian Sea branch.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-size:11pt\"><b>3. The Tropical Easterly    Jet Stream, which plays a key role in steering monsoon    depressions, establishes itself over the Indian peninsula during    the winter season.</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-size:11pt\"><b>Which    of the statements given above are CORRECT?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">1 and 2 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">2 and 3 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">1 and 3 only</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">1, 2 and 3</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-size:11pt\">Statements 1 and 2 are    correct, while Statement 3 is incorrect.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-size:11pt\">1. Statement 1 is correct:    During October-November, the southwest monsoon weakens and    withdraws from northern India. This retreat is marked by clear    skies and high temperatures. Combined with humidity, the weather    becomes oppressive, which is commonly referred to as 'October    Heat'.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-size:11pt\">2. Statement 2 is correct:    The Coromandel/Tamil Nadu coast remains largely dry during the    southwest monsoon because it runs parallel to the Bay of Bengal    branch and falls in the rain-shadow area of the Western Ghats for    the Arabian Sea branch.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-size:11pt\">3.    Statement 3 is incorrect: The Tropical Easterly Jet Stream    establishes itself over the southern Indian peninsula during the    summer season (around June to August), guiding tropical    depressions over India. During winter, it is replaced by the    Subtropical Westerly Jet Stream.</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\"><b>In swimming, which    stroke is characterized by simultaneous arm movements over the    water surface accompanied by a dolphin kick?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Backstroke</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Breaststroke</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Butterfly stroke</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Freestyle</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">The Butterfly stroke is a    swimming stroke performed on the chest, where both arms move    symmetrically and simultaneously over the water surface while the    swimmer executes a dolphin kick with the legs.</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\"><b>What was the main reason    for the British East India Company's early policy of    non-interference in the social and religious customs of the Indian    people during the late 18th and early 19th centuries?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">A desire to respect and    preserve traditional Indian culture</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Fear of provoking popular    unrest that could threaten their trade and territorial control</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Strict orders from the    Mughal Emperor to not interfere in religious affairs</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">A lack of administrative    personnel to enforce social laws</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">During the late 18th and    early 19th centuries, the primary goal of the East India Company    was commercial profit and political expansion. Company authorities    maintained a policy of socio-religious non-interference because    they believed that meddling with local customs, traditions, and    religious beliefs could cause widespread public outrage and    rebellion, thereby threatening their trade operations and colonial    rule.</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\"><b>Who among the following    authors wrote the famous novel 'The God of Small Things', which    won the Booker Prize in 1997?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Arundhati Roy</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Vikram Seth</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Shashi Tharoor</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Chetan Bhagat</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Arundhati Roy won the    Booker Prize for Fiction in 1997 for her debut novel 'The God of    Small Things'.</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-size:11pt\"><span><b>Consider    the following statements regarding the PM E-DRIVE (PM Electric    Drive Revolution in Innovative Vehicle Enhancement) scheme:</b></span></span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-size:11pt\"><span><b>The     scheme is implemented by the Ministry of Heavy Industries with a     budget outlay of ₹10,900 crore over two years.</b></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-size:11pt\"><span><b>Demand-side     financial incentives under the scheme cover privately owned     electric four-wheeler passenger cars.</b></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-size:11pt\"><span><b>Special     emphasis and separate budgetary allocations have been made for     deploying e-ambulances and e-trucks.</b></span></span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-size:11pt\"><span><b>Which    of the statements given above is/are correct?</b></span></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">1 and 2 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">2 and 3 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">1 and 3 only</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">1, 2, and 3</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\"><span>Statements    1 and 3 are correct. Statement 2 is incorrect because PM E-DRIVE    specifically excludes private electric four-wheeler cars from    direct consumer subsidies to prioritize public and commercial    transportation (e-2Ws, e-3Ws, e-buses, e-trucks, and    e-ambulances).</span></span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\"><b>Under which Article of    the Indian Constitution can a Financial Emergency be declared by    the President of India?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Article 352</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Article 356</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Article 360</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Article 368</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Article 360 of the Indian    Constitution empowers the President to proclaim a Financial    Emergency if he is satisfied that a situation has arisen whereby    the financial stability or credit of India or any part of its    territory is threatened.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\"><b>Who among the following    freedom fighters is famously known for hoisting the Indian    National Congress flag at the Gowalia Tank Maidan in Bombay during    the Quit India Movement of 1942?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Aruna Asaf Ali</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Sarojini Naidu</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Sucheta Kripalani</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Usha Mehta</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Aruna Asaf Ali is famously    remembered as the 'Heroine of the 1942 Movement'. She hoisted the    Indian National Congress flag at the Gowalia Tank Maidan in Bombay    during the Quit India Movement on 9 August 1942, following the    arrest of top Congress leaders by the British government.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-size:11pt\"><span><b>Consider    the following statements regarding Indian shooter Manu Bhaker:</b></span></span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-size:11pt\"><span><b>She     became the first athlete from independent India to win two medals     at a single edition of the Olympic Games (Paris 2024).</b></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-size:11pt\"><span><b>She     won her individual medal in the Women's 10m Air Pistol event.</b></span></span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-size:11pt\"><b>Which    of the statements given above is/are correct?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Only 1</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Only 2</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Both 1 and 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Neither 1 nor 2</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\"><span>Both    statements are correct. Manu Bhaker created history at the Paris    2024 Olympics by winning a Bronze medal in the Women's 10m Air    Pistol event (Individual) and another Bronze medal in the 10m Air    Pistol Mixed Team event (alongside Sarabjot Singh). This made her    the first athlete from independent India to claim two medals in a    single edition of the Olympic Games.</span></span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\"><b>Which core objective of    India's Five-Year Plans specifically aimed at promoting the use of    indigenous resources and reducing reliance on foreign goods,    particularly food grains?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Modernisation</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Self-reliance</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Equity</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Economic Growth</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">The four primary goals of    India's Five-Year Plans were Growth, Modernisation, Self-reliance,    and Equity. The objective of Self-reliance meant avoiding foreign    interference and reducing dependence on imports, particularly    regarding essential food supplies and critical capital goods, to    build an economically independent nation.</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\"><b>What does the letter 'P'    stand for in the 'LPG' model of economic reforms introduced in    India in 1991?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Production</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Privatisation</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Promotion</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Protection</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">In the 'LPG' model of    economic reforms introduced in India in 1991, 'LPG' stands for    Liberalisation, Privatisation, and Globalisation. Thus, 'P' stands    for Privatisation.</span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\"><b>Under Article 352 of the    Indian Constitution, on which of the following grounds can the    President proclaim a National Emergency, and within what period    must it be approved by both Houses of Parliament?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">War, External Aggression,    or Internal Disturbance; within two months</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">War, External Aggression,    or Armed Rebellion; within one month</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Armed Rebellion or    Financial Instability; within six months</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">External Aggression or    Failure of Constitutional Machinery; within one month</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-size:11pt\">Under Article 352 of the    Indian Constitution, the President can proclaim a National    Emergency on the grounds of War, External Aggression, or Armed    Rebellion. Originally, the ground was 'internal disturbance',    which was replaced by 'armed rebellion' via the 44th Amendment Act    of 1978. Furthermore, the proclamation must be approved by both    Houses of Parliament within one month from the date of its issue.</span></p>", "question_heading": ""}, {"sr_no": 51, "question": "  <p style=\"orphans:0;widows:0;margin-top:0.1in\">    If     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717345738_html_8449110f9d444eb9.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717345738_html_548aff1ac0c905aa.gif\" > ,    find the exact value of     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717345738_html_ea2215080fba281.gif\" > .</p>", "option1": " <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717345738_html_265c89b7d5c6a2a5.gif\" > </p>", "option2": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717345738_html_cc6264fac11b266a.gif\" > </p>", "option3": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net. .net.in/website/bulk_uploader_images/1788717345738_html_c4cf8fd73a4ff8f0.gif\" > .</p>", "question_heading": ""}, {"sr_no": 56, "question": "  <p style=\"orphans:0;widows:0;margin-top:0.1in\">    Two chords     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717345738_html_360ed9d7de7c69b3.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717345738_html_45ae0ffd9977fcf3.gif\" >     of a circle intersect each other perpendicularly at a point     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717345738_html_26c937c553664419.gif\" >     inside the circle. If     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717345738_html_2f6c5126ffbee95f.gif\" >     cm,     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717345738_html_bf26fefd52514ab7.gif\" >     cm, and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717345738_html_6b4e85677ec36891.gif\" >     cm, find the exact radius of the circle.</p>", "option1": " <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717345738_html_a896dbf98e2d2866.gif\" > cm</p>", "option2": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717345738_html_da7d2c19f2b76d07.gif\" > cm</p>", "option3": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717345738_html_aed235ccc7364dc9.gif\" > cm</p>", "option4": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717345738_html_8b85cde6f7f127eb.gif\" > cm</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-top:0.04in yle=\"orphans:0;widows:0;margin-bottom:0in\">SILENCE →    SIL | E | NCE → LIS | E | ECN → LISEECN</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Similarly,</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">JOURNEY →    JOU | R | NEY → UOJ | R | YEN → UOJRYEN</p>    <p style=\"orphans:0;widows:0\">Hence, the correct answer is    UOJRYEN.</p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct combination of mathematical signs to    sequentially replace the * signs and balance the given equation.</p>    <p style=\"orphans:0;widows:0\">18 * 3 * 5 * 8 * 2 * 36</p>", "option1": " <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_3689f9e1bda9de24.gif\" > </p>", "option2": "  <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_d3afda57bf41643b.gif\" > </p>", "option3": "  <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_b1907202af45c4c1.gif\" > </p>", "option4": "  <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_d8c1d7090c0e1498.gif\" > </p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Given equation: 18 * 3 * 5 * 8 * 2 * 36</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">By    substituting the signs given in option C     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_180fa0f0397e641f.gif\" > :</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_cb278451442aaa5a.gif\" > </p>    <p style=\" ottom:0in\">(NOTE:    Operations should be performed on the whole numbers, without    breaking down the numbers into its constituent digits. E.g. 13 –    Operations on 13 such as adding/subtracting/multiplying etc. to 13    can be performed. Breaking down 13 into 1 and 3 and then    performing mathematical operations on 1 and 3 is not allowed.)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(45, 35, 110)</p>    <p style=\"orphans:0;widows:0\">(60, 25, 120)</p>", "option1": "<p style=\"orphans:0;widows:0\">    (50, 40, 140)</p>", "option2": " <p style=\"orphans:0;widows:0\">    (70, 30, 150)</p>", "option3": " <p style=\"orphans:0;widows:0\">    (55, 45, 160)</p>", "option4": " <p style=\"orphans:0;widows:0\">    (80, 20, 180)</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The logic followed here is:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_1eded7109a149976.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">For (45, 35,    110):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_aa19710e0da98cc9.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">For (60, 25,    120):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_f0486a509ee5e6e1.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Similarly,    checking Option B (70, 30, 150):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_153d0f69bd454fca.gif\" > </p>    <p style=\"orphans:0;widows:0\">Hence, (70, 30, 150) follows the    same pattern.</p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In this question, three statements are given, followed by two    conclusions numbered I and II. Assuming the statements to be true,    even if they seem to be at variance with commonly known facts,    decide which of the conclusions logically follows/follow from the    statements.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Statements:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">I. All trucks    are vehicles.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">II. No    vehicle is a boat.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">III. Some    boats are ships.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Conclusions:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">I. Some ships    are trucks.</p>    <p style=\"orphans:0;widows:0\">II. No boat is a truck.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Only conclusion I follows</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only conclusion II follows</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both conclusions I and II follow</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither conclusion I nor II follows</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_92406b4e342cb5fb.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. From    Statements I and II: All trucks are inside vehicles, and no    vehicle is a boat. Therefore, no truck can be a boat, which    implies 'No boat is a truck'. Thus, conclusion II logically    follows.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. For    Conclusion I: Ships overlap with boats, but there is no definite    relation established between ships and trucks. Thus, conclusion I    does not follow.</p>    <p style=\"orphans:0;widows:0\">Hence, only conclusion II    follows.</p>", "question_heading": ""}, {"sr_no": 83, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    If '@' means '<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_cbf3dd5fdfeb402d.gif\" > ',    '#' means '<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_5b21af84bca2675f.gif\" > ',    '%' means '<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_8b2f9f587ddc202b.gif\" > ',    and '&amp;' means '<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_e95f11b047543be0.gif\" > ',    then what is the value of the following expression?</p>    <p style=\"orphans:0;widows:0\">160 % 180 @ 12 # 3 &amp; 45</p>", "option1": "<p style=\"orphans:0;widows:0\">    160</p>", "option2": " <p style=\"orphans:0;widows:0\">    175</p>", "option3": " <p style=\"orphans:0;widows:0\">    145</p>", "option4": " <p style=\"orphans:0;widows:0\">    190</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Given expression: 160 % 180 @ 12 # 3 &amp; 45</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Replacing the    symbols with mathematical operators:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_4888dc8742e6b36e.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Applying the    BODMAS rule:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">=     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_72d3e8c5a3304390.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">=     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_d10a91bd5104219d.gif\" > </p>    <p style=\"orphans:0;widows:0\">=     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_d61179791556c0d1.gif\" > </p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"orphans:0;widows:0\">    In a certain code language, 'HAMMER' is coded as 'SGPQFN' and    'FILTER' is coded as 'SGWPNL'. How will 'GARDEN' be coded in that    language?</p>", "option1": "<p style=\"orphans:0;widows:0\">    PGHVFN</p>", "option2": " <p style=\"orphans:0;widows:0\">    OGGVFM</p>", "option3": " <p style=\"orphans:0;widows:0\">    OGHWFM</p>", "option4": " <p style=\"orphans:0;widows:0\">    PGGVFM</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">First,    reverse the word, then add +1, +2, +3, +4, +5, +6 to the    positional values of the reversed letters respectively.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">For 'HAMMER':</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Reversed: R,    E, M, M, A, H</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R + 1 = S</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">E + 2 = G</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">M + 3 = P</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">M + 4 = Q</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A + 5 = F</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">H + 6 = N</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">So, 'HAMMER'    = 'SGPQFN'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Similarly,    for 'GARDEN':</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Reversed: N,    E, D, R, A, G</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">N + 1 = O</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">E + 2 = G</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">D + 3 = G</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R + 4 = V</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A + 5 = F</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">G + 6 = M</p>    <p style=\"orphans:0;widows:0\">Therefore, 'GARDEN' is coded as    'OGGVFM'.</p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:0;widows:0\">    The second number in the given number pairs is obtained by    performing certain mathematical operation(s) on the first number.    The same operation(s) are followed in all the number pairs, EXCEPT    one. Find that odd number pair.</p>", "option1": "<p style=\"orphans:0;widows:0\">    (4, 60)</p>", "option2": " <p style=\"orphans:0;widows:0\">    (6, 210)</p>", "option3": " <p style=\"orphans:0;widows:0\">    (5, 120)</p>", "option4": " <p style=\"orphans:0;widows:0\">    (7, 330)</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The logic followed here is: Second number =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_49f03832851b9f74.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(4, 60)     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_82c40184dac6a5bf.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(6, 210)     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_f24b68a14829357d.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(5, 120)     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_cb8c7798f0acfa16.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(7, 330)     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_62faa778ce2e0f31.gif\" > </p>    <p style=\"orphans:0;widows:0\">Hence, (7, 330) is the odd number    pair.</p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Instruction: Read the statement and assumptions below, then choose    the correct option regarding which assumptions are implicit in the    statement.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Statement:    Even though the nationwide adoption of electric vehicles (EVs)    significantly lowers urban air pollution, the current inadequacy    of grid infrastructure and raw material supply chains continues to    impede their full-scale transition.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Assumptions:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">I. Electric    vehicles produce lower urban air emissions than the vehicles    currently in widespread use.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">II. Resolving    infrastructure and supply chain bottlenecks will automatically    guarantee the complete transition to electric vehicles.</p>    <p style=\"orphans:0;widows:0\">III. Infrastructure and supply    chain readiness are necessary prerequisites for a full-scale    transition to electric vehicles.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Only I and II are implicit</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only I and III are implicit</p>", "option3": " <p style=\"orphans:0;widows:0\">    Only II and III are implicit</p>", "option4": " <p style=\"orphans:0;widows:0\">    All I, II, and III are implicit</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    1. Assumption I is implicit: The statement claims that adopting    EVs lowers urban air pollution, which inherently assumes that EVs    generate lower emissions compared to current vehicles.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Assumption    II is NOT implicit: Identifying infrastructure and supply chain    bottlenecks as barriers means they are necessary to fix, but it    does not assume that fixing them alone is a sufficient condition    that automatically guarantees success.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Assumption    III is implicit: Since the statement attributes the inability to    achieve a full-scale transition directly to the inadequacy of    infrastructure and supply chains, it assumes that readiness in    these sectors is a necessary prerequisite for the transition.</p>    <p style=\"orphans:0;widows:0\">Therefore, only assumptions I and    III are implicit.</p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"orphans:0;widows:0\">    If all the letters of the word \"COMPARTMENT\" are    arranged in alphabetical order from left to right, how many    letters will be between the second vowel from the left and the    second consonant from the right?</p>", "option1": "<p style=\"orphans:0;widows:0\">    4</p>", "option2": " <p style=\"orphans:0;widows:0\">    5</p>", "option3": " <p style=\"orphans:0;widows:0\">    6</p>", "option4": " <p style=\"orphans:0;widows:0\">    7</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    First, arrange all the letters of the word \"COMPARTMENT\"    in alphabetical order from left to right:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. A (Vowel)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. C    (Consonant)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. E (Vowel)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. M    (Consonant)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">5. M    (Consonant)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">6. N    (Consonant)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">7. O (Vowel)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">8. P    (Consonant)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">9. R    (Consonant)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">10. T    (Consonant)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">11. T    (Consonant)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Now, identify    the specified positions:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Second    vowel from the left = E (3rd position)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Second    consonant from the right = T (10th position)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The letters    between the 3rd position and the 10th position are at positions 4,    5, 6, 7, 8, and 9 (M, M, N, O, P, R).</p>    <p style=\"orphans:0;widows:0\">Number of letters between them =       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_933c1cbc0773c46b.gif\" > .</p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"orphans:0;widows:0\">    Pointing to a woman, a man said to a person, \"Her    father-in-law is the husband of my mother's only daughter, and    your father is the only son of that woman's husband.\" How is    that woman related to you?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Mother</p>", "option2": " <p style=\"orphans:0;widows:0\">    Paternal Grandmother</p>", "option3": " <p style=\"orphans:0;widows:0\">    Paternal Aunt</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sister-in-law</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Break down the statement step-by-step:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. \"My    mother's only daughter\" = Speaker's sister.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. \"Husband    of my mother's only daughter\" = Speaker's sister's husband.     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. \"Her    father-in-law is the husband of my mother's only daughter\" =    The woman's father-in-law is the speaker's sister's husband. This    means the woman is married to the speaker's sister's son.     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. \"Your    father is the only son of that woman's husband\" = The woman's    husband's son is your father, which means the woman is your    father's mother.     </p>    <p style=\"orphans:0;widows:0\">Therefore, the woman is your    paternal grandmother.</p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Eight friends P, Q, R, S, T, U, V, and W are sitting around a    circular table facing the center.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Q sits third    to the left of P.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R sits second    to the right of Q.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">S sits third    to the left of R.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">T sits second    to the left of S.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">U sits to the    immediate right of T.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">V sits to the    immediate right of Q.</p>    <p style=\"orphans:0;widows:0\">Who sits to the immediate left of    W?</p>", "option1": "<p style=\"orphans:0;widows:0\">    P</p>", "option2": " <p style=\"orphans:0;widows:0\">    S</p>", "option3": " <p style=\"orphans:0;widows:0\">    U</p>", "option4": " <p style=\"orphans:0;widows:0\">    R</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Let us number the 8 positions in clockwise order from 1 to 8    (where clockwise movement represents left, and anticlockwise    movement represents right when facing the center):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Place P at    position 1.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Q sits 3rd    to the left of P (clockwise) → Position 4.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. R sits 2nd    to the right of Q (anticlockwise) → Position 2.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. S sits 3rd    to the left of R (clockwise) → Position 5.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">5. T sits 2nd    to the left of S (clockwise) → Position 7.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">6. U sits to    the immediate right of T (anticlockwise) → Position 6.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">7. V sits to    the immediate right of Q (anticlockwise) → Position 3.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">8. The    remaining person W must occupy Position 8.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><a name=\"_GoBack\"></a>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788717471171_html_cb336151a186d25a.jpg\" width=\"249\" height=\"187\" > </p>    <p style=\"orphans:0;widows:0\">The person sitting to the    immediate left of W (clockwise from position 8) is P.</p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Which of the following addresses are exactly identical to each    other?</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Prof. K.    V. Raman, H.No. 45-A/1, Sree Nagar Colony, Road No. 3,    Visakhapatnam - 530016</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Prof. K.    V. Raman, H.No. 45-A/1, Shree Nagar Colony, Road No. 3,    Visakhapatnam - 530016</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Prof. K.    V. Raman, H.No. 45-A/1, Sree Nagar Colony, Road No. 3,    Visakhapatnam - 530016</p>    <p style=\"o
