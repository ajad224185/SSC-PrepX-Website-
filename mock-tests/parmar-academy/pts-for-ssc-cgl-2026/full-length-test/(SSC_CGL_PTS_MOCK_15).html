3fb9d48cfa60.gif\" > )     =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_26ff45bb6f568760.gif\" > </p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">Find the highest     exponent k such that 3ᵏ exactly divides 100!.</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">44</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">45</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">47</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">48</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     v₃(100!) = ⌊<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_32b90f94447b50b3.gif\" > ⌋     + ⌊<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_d860d86bd9a49d64.gif\" > ⌋     + ⌊<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_e04eb8e2e3823022.gif\" > ⌋     + ⌊<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_94deade86c9a7525.gif\" > ⌋</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     v₃(100!) = 33 + 11 + 3 + 1</p>     <p style=\"orphans:0;widows:0\">k = 48</p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">A trader buys     360 identical glass items at ₹125 each. One-sixth are damaged     and sold at 40% of their original cost price per item. At what     price should each undamaged item be sold to earn an overall     profit of 24% on the complete purchase?</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">₹168</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">₹176</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">₹180</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">₹186</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Total cost = 360 × 125 = ₹45,000</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Required total selling price = 45,000 × 1.24 = ₹55,800</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Damaged items =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_d6032112c50f55a4.gif\" >      = 60</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Selling price per damaged item = 125 × 0.40 = ₹50</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Amount received from damaged items = 60 × 50 = ₹3,000</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Undamaged items = 360 − 60 = 300</p>     <p style=\"orphans:0;widows:0\">Required price     per undamaged item =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_62286c67b68b953c.gif\" >      = ₹176</p>", "question_heading": ""}, {"sr_no": 85, "question": "Tुध कयहृिध ृोन gनोूु ौुयथौ पुध ोॅधनोgध ंोनो यी ृयदौ ोnक giिनस ोप ीयहन cधnपनधौ. Cधnपनध Q ुोौ 250 cोnकiकोपधौ थiपु ृयदौ : giिनस = 3 : 2, थुiिध Cधnपनध S ुोौ 300 cोnकiकोपधौ थiपु ृयदौ : giिनस = 2 : 3. Finक पुध थधigुपधक ोॅधनोgध ंोनो यी ोिि cोnकiकोपधौ यी Cधnपनधौ Q ोnक S पयgधपुधन.", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">72</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">71</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">72.5</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">73.2</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Centre Q: boys = 250 ×      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_4a5be46050a801d9.gif\" >      = 150</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Centre Q: girls = 250 − 150 = 100</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Centre S: boys = 300 ×      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_4f9a68899ee8f482.gif\" >      = 120</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Centre S: girls = 300 − 120 = 180</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Total marks = 150×72 + 100×66 + 120×68 + 180×78 = 39,600</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Total candidates = 250 + 300 = 550</p>     <p style=\"orphans:0;widows:0\">Weighted average     =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_7b8b6edceb693bea.gif\" >      = 72</p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">A line cuts the     x-axis at A(−8, 0) and the positive y-axis at B. If AB = 10     units, which of the following is the equation of the line?</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">3x + 4y = 24</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">−3x + 4y = 24</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">−4x + 3y = 24</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">3x − 4y = 24</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Let B = (0, b), where b &gt; 0.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     AB² = 8² + b² = 10²</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     b² = 36</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     b = 6</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Intercept form:      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_4db2531d178f68a6.gif\" >      +      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_a2679e8715549e29.gif\" >      = 1</p>     <p style=\"orphans:0;widows:0\">−3x + 4y = 24</p>", "question_heading": ""}, {"sr_no": 87, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">A can complete a     work in 18 days and B in 24 days. A defective worker undoes      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_fa2c4a5b27f24eab.gif\" >      of the total work each day. All three work for 6 days. Then B     leaves; A continues daily, while the defective worker works only     on every second day, starting with the second day after B leaves.     In how many days from the start is the work completed?</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">15.75 days</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">16 days</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">16.25 days</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">16.5 days</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Take total work = 72 units</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     A’s rate =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_15e8bc786cc3ce52.gif\" >      = 4 units/day</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     B’s rate =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_6cf76c8a893a80af.gif\" >      = 3 units/day</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Defective worker’s rate = −1 unit/day</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Work done in first 6 days = 6(4 + 3 − 1) = 36 units</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Remaining work = 72 − 36 = 36 units</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Work in each next 2-day cycle = 4 + (4 − 1) = 7 units</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Work in 5 cycles = 5 × 7 = 35 units</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Remaining work = 1 unit</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Time for A to finish =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_66cbd2ad015b6765.gif\" >      day</p>     <p style=\"orphans:0;widows:0\">Total time = 6 +     10 +      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_66cbd2ad015b6765.gif\" >      = 16.25 days</p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">Triangle ABC is     right-angled at A. Altitude AD is drawn to hypotenuse BC. If BD :     DC = 4 : 9 and AD = 12 cm, find BC.</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">24 cm</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">25 cm</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">26 cm</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">28 cm</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-top:0.03in;margin-bottom:0.03in\">     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_61ea66ef847eba45.png\" width=\"442\" height=\"253\" > </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Let BD = 4x and DC = 9x.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     For the altitude to the hypotenuse: AD² = BD × DC</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     12² = (4x)(9x)</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     144 = 36x²</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     x = 2</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     BC = 4x + 9x = 13x</p>     <p style=\"orphans:0;widows:0\">BC = 26 cm</p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">A sum amounts to     ₹13,310 at the end of 2 years and ₹14,641 at the end of 3     years at compound interest, compounded annually. Find the     principal.</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">₹11,000</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">₹10,000</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">₹12,100</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">₹12,000</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     One-year growth factor =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_745aba4cefb7a5e7.gif\" > </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     One-year growth factor = 1.10</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Therefore, the annual rate = 10%</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Amount after 2 years = P(1.10)²</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     13,310 = 1.21P</p>     <p style=\"orphans:0;widows:0\">P = ₹11,000</p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">For a production     process, output varies directly as the number of workers and the     hours worked, and inversely as the difficulty index. If workers     increase by 25%, hours decrease by 20%, and the difficulty index     decreases by 10%, by what percentage does output change?</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">10% increase</p>", "option2": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">11      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_464ec97a735cbcfc.gif\" > %     increase</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">12.5% increase</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">20% increase</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Output factor = 1.25 × 0.80 ÷ 0.90</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Output factor =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_c128f6e9657f5668.gif\" > </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Increase = (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_c128f6e9657f5668.gif\" >      − 1) × 100</p>     <p style=\"orphans:0;widows:0\">Increase =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_d860d86bd9a49d64.gif\" > %     = 11      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_464ec97a735cbcfc.gif\" > %</p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">A right circular     cone has base radius 9 cm and vertical height 12 cm. It is cut     along a generator and opened into a circular sector. Find the     angle of the sector.</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">180°</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">200°</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">225°</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">216°</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-top:0.03in;margin-bottom:0.03in\">     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_c88deac3806c579e.png\" width=\"490\" height=\"279\" > </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Slant height l = √(9² + 12²)</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     l = 15 cm</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     The sector radius = 15 cm</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Sector arc length = circumference of the cone base = 2π×9</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_29fba2f07e2f61b5.gif\" > )     × 2π×15 = 2π×9</p>     <p style=\"orphans:0;widows:0\">θ = 216°</p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">Group A     originally has 20 trainees with an average score of 68. Group B     has an average score of 74. Five new trainees, whose average     score is 80, join Group A. The combined average of the enlarged     Group A and the original Group B becomes 72. Find the original     number of trainees in Group B.</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">20</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">18</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">22</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">25</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Original total score of Group A = 20 × 68 = 1,360</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Score of the 5 new trainees = 5 × 80 = 400</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Enlarged Group A total score = 1,360 + 400 = 1,760</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Enlarged Group A count = 25</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Let the original number in Group B = n</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_f8a14c10c360e2ea.gif\" >      = 72</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     1,760 + 74n = 1,800 + 72n</p>     <p style=\"orphans:0;widows:0\">n = 20</p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">A boat moves at     13 km/h in still water. It covers 72 km downstream and the same     distance upstream. The upstream journey takes 5 hours more than     the downstream journey. Find the speed of the stream.</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">4 km/h</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">5 km/h</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">6 km/h</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">7 km/h</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Let the speed of the stream = v km/h</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Upstream speed = 13 − v</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Downstream speed = 13 + v</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_55a8f4d3ce492612.gif\" >      −      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_707db9071e885187.gif\" >      = 5</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     5v² + 144v − 845 = 0</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     (v − 5)(5v + 169) = 0</p>     <p style=\"orphans:0;widows:0\">v = 5 km/h</p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     The following two quadratic equations have exactly one common     root, and k is an integer. Find k.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     2x² − 9x + 4 = 0</p>     <p style=\"orphans:0;widows:0\">x² + (k − 2)x     − 2k = 0</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">−2</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">−3</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">−1</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">−4</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     2x² − 9x + 4 = (2x − 1)(x − 4)</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Possible common roots are      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_cff39ebd0e0e2452.gif\" >      and 4</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     For x =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_cff39ebd0e0e2452.gif\" > ,     the second equation gives k =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_b0c166aeeccfb9b0.gif\" > ,     not an integer</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     For x = 4: 16 + 4(k − 2) − 2k = 0</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     2k + 8 = 0</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     k = −4</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     At k = −4, the second equation is (x − 2)(x − 4) = 0</p>     <p style=\"orphans:0;widows:0\">Therefore, the     only common root is 4</p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">An article is     sold after successive discounts of 20% and 10%. After adding 8%     GST on the discounted price, the customer pays ₹6,220.80. Find     the marked price of the article.</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">₹7,500</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">₹7,800</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">₹8,000</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">₹8,200</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Price before GST =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_b1d49e4d2c373df9.gif\" > </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Price before GST = ₹5,760</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Price factor after the two discounts = 0.80 × 0.90 = 0.72</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Marked price =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_cfc211aff5313917.gif\" > </p>     <p style=\"orphans:0;widows:0\">Marked price =     ₹8,000</p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">From an external     point P, tangents PA and PB are drawn to a circle with centre O     and radius 6 cm. If ∠APB = 60°, find OP.</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">12 cm</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">10 cm</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">6√3 cm</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">8√3 cm</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-top:0.03in;margin-bottom:0.03in\">     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_f0bf387b5ec45cf8.png\" width=\"461\" height=\"348\" > </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     OP bisects the angle between the two tangents.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Therefore, ∠APO = 30°.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     OA is perpendicular to PA.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     In right triangle OAP: sin 30° = OA/OP</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_cff39ebd0e0e2452.gif\" >      =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_15a2b330f50987ad.gif\" > </p>     <p style=\"orphans:0;widows:0\">OP = 12 cm</p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">The lengths of     the faster and slower trains are in the ratio 3 : 2, and their     total length is 300 m. They move in the same direction. The     faster train completely crosses the slower train in 30 seconds     and crosses a pole in 9 seconds. Find the speed of the slower     train.</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">32.4 km/h</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">36 km/h</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">40 km/h</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">43.2 km/h</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Length of faster train = 300 ×      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_4a5be46050a801d9.gif\" >      = 180 m</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Length of slower train = 300 ×      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_4f9a68899ee8f482.gif\" >      = 120 m</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Speed of faster train =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_87cd70da400ee0c1.gif\" >      = 20 m/s</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Relative speed =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_6d9aed431b79e56c.gif\" >      = 10 m/s</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Speed of slower train = 20 − 10 = 10 m/s</p>     <p style=\"orphans:0;widows:0\">10 m/s = 36 km/h</p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">A salt solution     initially contains 18% salt. After 20 kg of water evaporates, the     concentration of salt becomes 24%. Find the initial mass of the     solution.</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">72 kg</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">75 kg</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">84 kg</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">80 kg</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Let the initial mass of the solution = M kg.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Initial salt = 18% of M = 0.18M kg</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Only water evaporates, so salt remains unchanged.</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Final mass = M − 20 kg</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     0.18M = 0.24(M − 20)</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     0.06M = 4.8</p>     <p style=\"orphans:0;widows:0\">M = 80 kg</p>", "question_heading": ""}, {"sr_no": 99, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">Find the least     positive integer n such that      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_354010cc8b4299f8.gif\" >      has a terminating decimal expansion when written in lowest terms.</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">3</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">6</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">9</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">12</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     360 = 2³ × 3² × 5</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     For a terminating decimal, the reduced denominator can contain     only the prime factors 2 and 5</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Therefore, 3² must be cancelled by the numerator 7n</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Least possible n = 9</p>     <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_8492e007b5bdf662.gif\" >      =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_b2e7c222425cedcb.gif\" >      =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_f789f2c5f53f570e.gif\" > ,     which is terminating</p>", "question_heading": ""}, {"sr_no": 100, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Evaluate the following trigonometric product exactly.</p>     <p style=\"orpha 8461_html_68f189a6ac7ba316.gif\" > </p>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
