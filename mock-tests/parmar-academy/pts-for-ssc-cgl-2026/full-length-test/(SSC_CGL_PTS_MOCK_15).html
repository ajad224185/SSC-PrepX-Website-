   <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(c)    Direct match. CORRECT.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">(d)    Inclusive positivism — a theory of legal validity, not    constitutional interpretation. ELIMINATE.</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><i>Identify the part containing an    error. If no error, choose (d).</i></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    tribunal ordered that the respondent (A) / returns the seized    documents (B) / within fourteen days (C) / of receiving the    notice. (D) No error</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">B</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">C</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">D</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Subjunctive mood after mandative    verbs (order, demand, insist, suggest, recommend):</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Correct:    'ordered that the respondent RETURN' (base form, no -s).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">'Returns'    is indicative mood — grammatically incorrect after 'ordered    that.'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Error    in (B): 'returns' </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    'return'.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Correction</b></span><span style=\"font-family:'Nirmala UI'\">:    'The tribunal ordered that the respondent return the seized    documents...'</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">SSC    frequently tests: 'I suggest that </span><span style=\"font-family:'Nirmala UI'\"><b>he    go' (not 'goes'</b></span><span style=\"font-family:'Nirmala UI'\">); 'She    insisted that he be present' (not 'is').</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Find the error in the following    options fragmented from the question into four parts marked as A,    B, C and D.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Having    been found guilty of embezzlement, (A) / the court sentenced the    accountant (B) / to seven years of imprisonment (C) / and a    substantial fine. (D) No error</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(A)</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(B)</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(C)</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(D)</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Dangling </b></span><span style=\"font-family:'Nirmala UI'\">modifier:    'Having been found guilty' </span><span style=\"font-family:'Nirmala UI'\"><b>must    modify the subject of the main clause</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The    subject of (B) is 'the court' — but the COURT was not found    guilty; the ACCOUNTANT was.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Error    in (A)-(B) structure: misplaced/dangling participial phrase.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    error is in (B) because the wrong noun is made the subject.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Correction</b></span><span style=\"font-family:'Nirmala UI'\">:    'Having been found guilty of embezzlement, the accountant was    sentenced by the court...'</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Trap:    Students check only (C) for 'imprisonment' vs 'imprisoned' — but    'years of imprisonment' is acceptable.</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Find the error in the following    options fragmented from the question into four parts marked as A,    B, C and D.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Not    only did the auditors (A) / expose the accounting irregularities    (B) / but also they discovered (C) / evidence of systematic fraud.    (D) No error</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(A)</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(B)</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(C)</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(D)</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correlative conjunction    parallelism: '</span><span style=\"font-family:'Nirmala UI'\"><b>Not only...    but also..</b></span><span style=\"font-family:'Nirmala UI'\">.'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">With    inversion: 'Not only did the auditors expose... but also they    discovered...'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Problem:    after 'but also,' subject-verb order should mirror structure for    parallelism.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Preferred:    '</span><span style=\"font-family:'Nirmala UI'\"><b>but also discovered'    (without 'they') to parallel 'did... expose</b></span><span style=\"font-family:'Nirmala UI'\">.'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">OR:    'but they also discovered.'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Current    (C): 'but also they discovered' — awkward and breaks parallel    structure.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Error    in (C): 'but also they discovered' </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    'but also discovered' or 'but they also discovered.'</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Improve the underlined part of the    sentence:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    committee </span><span style=\"font-family:'Nirmala UI'\"><u>is    comprised of</u></span><span style=\"font-family:'Nirmala UI'\"> representatives    from all stakeholder ministries.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">comprises of</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">comprises</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">is comprised by </span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">no improvement</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">'Comprise' = consist of (no    preposition needed).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">'Be    comprised of' is widely used but purists reject it; SSC accepts    'comprises' as the fix.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">'Is    comprised of' is considered incorrect in strict SSC marking.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(a)    'comprises of' — still has redundant 'of.' ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(b)    'comprises' — 'The committee comprises representatives.'    CORRECT.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(c)    'comprised by' — non-standard. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">(d)    ELIMINATE.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the most appropriate    Improvement of the underlined part of the sentence:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">No    sooner </span><span style=\"font-family:'Nirmala UI'\"><u>the    whistleblower had disclosed </u></span><span style=\"font-family:'Nirmala UI'\">the    evidence than the investigation commenced.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">had the whistleblower disclosed</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">the whistleblower disclosed</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">did the whistleblower disclose</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">no improvement</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Inversion rule: </span><span style=\"font-family:'Nirmala UI'\"><b>'No    sooner' + had + subject + V3 </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    than + subject + V2.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Correct    opening: 'No sooner HAD the whistleblower disclosed...'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Current    error: missing inversion after 'No sooner.'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(a)    Correct inversion. CORRECT.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(b)    No inversion, wrong tense. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">(c)    'did disclose' — wrong auxiliary for 'no sooner' structure.    ELIMINATE</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate option    to fill in the blank.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    CEO's ______ remarks at the press conference praising austerity    while awarding executives record bonuses struck many observers as    rank hypocrisy.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ingenuous</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">disingenuous</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">perspicacious</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">munificent</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Context: praising austerity +    record bonuses = insincere/deceptive.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(a) </span><span style=\"font-family:'Nirmala UI'\"><b>Ingenuous </b></span><span style=\"font-family:'Nirmala UI'\">=    innocent, sincere. Opposite. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(b) </span><span style=\"font-family:'Nirmala UI'\"><b>Disingenuous </b></span><span style=\"font-family:'Nirmala UI'\">=    not candid; pretending to know less or concealing true motives.    CORRECT.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(c) </span><span style=\"font-family:'Nirmala UI'\"><b>Perspicacious </b></span><span style=\"font-family:'Nirmala UI'\">=    discerning. Positive trait; doesn't fit hypocrisy. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">(d) </span><span style=\"font-family:'Nirmala UI'\"><b>Munificent </b></span><span style=\"font-family:'Nirmala UI'\">=    very generous. Doesn't capture deception. ELIMINATE.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate option    to fill in the blank.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    archaeological findings were so ______ that they compelled    historians to revise long-accepted chronologies.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">anodyne</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">paradigm-shifting</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">derivative</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">quotidian</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Findings compelled revision of    chronologies </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    groundbreaking.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(a) </span><span style=\"font-family:'Nirmala UI'\"><b>Anodyne </b></span><span style=\"font-family:'Nirmala UI'\">=    bland, inoffensive. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(b) </span><span style=\"font-family:'Nirmala UI'\"><b>Paradigm</b></span><span style=\"font-family:'Nirmala UI'\">-</span><span style=\"font-family:'Nirmala UI'\"><b>shifting</b></span><span style=\"font-family:'Nirmala UI'\"> =    fundamentally changing accepted models. CORRECT.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(c) </span><span style=\"font-family:'Nirmala UI'\"><b>Derivative </b></span><span style=\"font-family:'Nirmala UI'\">=    unoriginal. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">(d) </span><span style=\"font-family:'Nirmala UI'\"><b>Quotidian </b></span><span style=\"font-family:'Nirmala UI'\">=    everyday, ordinary. ELIMINATE.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Find the error in the following    options fragmented from the question into four parts marked as A,    B, C and D.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    reason why he was late (A) / for the meeting was because (B) / his    train had been delayed (C) / due to heavy fog. (D) No error</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">B</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">C</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">D</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Grammar Rule: '</span><span style=\"font-family:'Nirmala UI'\"><b>The    reason... is that' (not 'is because').</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Using    'reason' and 'because' together is redundant — both express    causation.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Standard    forms:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  ✓    <span style=\"font-family:'Nirmala UI'\">'The reason why he was late is THAT    his train was delayed.'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  ✓    <span style=\"font-family:'Nirmala UI'\">'He was late BECAUSE his train was    delayed.'</span></p>    <p style=\"orphans:0;widows:0\">  ✗ <span style=\"font-family:'Nirmala UI'\">'The    reason... was because...' — REDUNDANT</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the correct Improvement of     the underlined part of the sentence:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">She    has been</span><span style=\"font-family:'Nirmala UI'\"><u> suffering    with</u></span><span style=\"font-family:'Nirmala UI'\"> malaria for    the past three weeks.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">suffering from</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">suffering by</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">suffering since</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">no improvement</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Error Type: Incorrect preposition    with 'suffer.'</span></p>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Standard    collocations:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  ✓    <span style=\"font-family:'Nirmala UI'\">'suffer FROM a disease/illness' —    e.g., suffer from malaria, suffer from anxiety</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  ✓    <span style=\"font-family:'Nirmala UI'\">'suffer FOR a cause' — e.g.,    suffer for one's beliefs</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  ✗    <span style=\"font-family:'Nirmala UI'\">'suffer WITH' — Non-standard in    formal English</span></p>    <p style=\"orphans:0;widows:0\">  ✗ <span style=\"font-family:'Nirmala UI'\">'suffer    BY' — Incorrect</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the word most similar in    meaning to: PERFIDIOUS</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Loyal</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Treacherous</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Courageous</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Meticulous</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Word: PERFIDIOUS (adjective)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Meaning: </span><span style=\"font-family:'Nirmala UI'\"><b>Deceitful    and untrustworthy; deliberately faithless; violating trust.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Option    Analysis:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(a) </span><span style=\"font-family:'Nirmala UI'\"><b>Loyal </b></span><span style=\"font-family:'Nirmala UI'\">—    Faithful and devoted. ANTONYM, not synonym. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(b) </span><span style=\"font-family:'Nirmala UI'\"><b>Treacherous </b></span><span style=\"font-family:'Nirmala UI'\">—    Guilty of or involving betrayal; likely to betray trust. Direct    synonym of perfidious. KEEP.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(c) </span><span style=\"font-family:'Nirmala UI'\"><b>Courageous </b></span><span style=\"font-family:'Nirmala UI'\">—    Brave. Different meaning entirely. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(d) </span><span style=\"font-family:'Nirmala UI'\"><b>Meticulous </b></span><span style=\"font-family:'Nirmala UI'\">—    Showing great attention to detail. Unrelated. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Usage:    ‘The perfidious ally leaked military secrets to the enemy.’</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Word    Family for SSC:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Synonyms: treacherous, deceitful,    traitorous, faithless, disloyal</span></p>    <p style=\"orphans:0;widows:0\">  <span style=\"font-family:'Nirmala UI'\">Antonyms:    loyal, faithful, trustworthy, steadfast</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the word most opposite in    meaning to: EPHEMERAL</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Transient</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Fleeting</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Perpetual</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Momentary</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Word: EPHEMERAL (adjective)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Meaning: </span><span style=\"font-family:'Nirmala UI'\"><b>Lasting    for a very short time; transitory; short-lived.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">We    need the ANTONYM — something that lasts a LONG time.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Option    Analysis:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(a) </span><span style=\"font-family:'Nirmala UI'\"><b>Transient </b></span><span style=\"font-family:'Nirmala UI'\">—    Lasting only a short time. SYNONYM. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(b) </span><span style=\"font-family:'Nirmala UI'\"><b>Fleeting </b></span><span style=\"font-family:'Nirmala UI'\">—    Passing quickly. SYNONYM. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(c) </span><span style=\"font-family:'Nirmala UI'\"><b>Perpetual </b></span><span style=\"font-family:'Nirmala UI'\">—    Never ending; lasting forever; continuous. ANTONYM. KEEP.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">(d) </span><span style=\"font-family:'Nirmala UI'\"><b>Momentary </b></span><span style=\"font-family:'Nirmala UI'\">—    Lasting a very short time. SYNONYM. ELIMINATE.</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Arrange the following sentences P,    Q, R, S in a logical sequence to form a coherent paragraph.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">P.    Consequently, many species are now listed as critically    endangered.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Q.    Unregulated deforestation has fragmented habitats across the    tropics.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">R.    This loss of canopy cover disrupts breeding and migration    patterns.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">S.    International conservation treaties have struggled to enforce    compliance uniformly.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Q-R-P-S</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">P-Q-R-S</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Q-P-R-S</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">S-Q-R-P</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Step 1 — Identify the opening    sentence.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A    good opening introduces the TOPIC without referring back to    something undefined.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  • <span style=\"font-family:'Nirmala UI'\">P    starts with 'Consequently' — a result connector; something must    come BEFORE it.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  • <span style=\"font-family:'Nirmala UI'\">Q    introduces a clear topic: deforestation fragmenting habitats.    Strong opener.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  • <span style=\"font-family:'Nirmala UI'\">R    has 'This loss of canopy cover' — 'This' refers back to    deforestation in Q. Must follow Q.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  • <span style=\"font-family:'Nirmala UI'\">S    starts with a contrast ('struggled') — likely a concluding or    contrasting statement.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Step    2 — Build the chain.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Q    (cause: deforestation) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    R ('This loss' = deforestation effect on breeding/migration) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    P ('Consequently' = result: endangered species) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    S (contrast: treaties still fail)</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the word that can substitute    the given phrase:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Phrase:    'government by religious leaders'</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Democracy</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Plutocracy</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Autocracy</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Theocracy</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Option Analysis:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(a)    Democracy — Demo (people) + cracy = government by the people.    ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(b)    Plutocracy — Pluto (wealth) + cracy = government by the wealthy.    ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(c)    Autocracy — Auto (self) + cracy = government by one person with    absolute power. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(d)    Theocracy — Theo (god) + cracy = government by religious    leaders. CORRECT.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">SSC    '-cracy' words to memorise:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Democracy — by the people</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Aristocracy — by the    nobility/best</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Bureaucracy — by    officials/administration</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Plutocracy — by the wealthy</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Theocracy — by religious    authority</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Autocracy — by one ruler</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Technocracy — by technical    experts</span></p>    <p style=\"orphans:0;widows:0\">  <span style=\"font-family:'Nirmala UI'\">Oligarchy    — by a small group</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Find the most appropriate meaning    of the idiom: 'To burn the midnight oil'</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To waste resources unnecessarily</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To work or study late into the    night</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To destroy evidence of wrongdoing</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To celebrate a festive occasion    with lamps</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Idiom: ‘To burn the midnight oil’</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Meaning: </span><span style=\"font-family:'Nirmala UI'\"><b>To    work diligently late into the night; to stay up studying or    working.</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Usage:    ‘She burned the midnight oil for weeks to prepare for the civil    services examination.’</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Similar    SSC idioms about hard work:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  •    <span style=\"font-family:'Nirmala UI'\">'To pull one's socks up' — to    make an effort to improve</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  •    <span style=\"font-family:'Nirmala UI'\">'To leave no stone unturned' — to    try every possible means</span></p>    <p style=\"orphans:0;widows:0\">  • <span style=\"font-family:'Nirmala UI'\">'Against    the clock' — in a great hurry to meet a deadline</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate phrase    to replace the underlined segment:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">\"The    minister's explanation for the policy U-turn did not </span><span style=\"font-family:'Nirmala UI'\"><u>hold    water</u></span><span style=\"font-family:'Nirmala UI'\"> with the    opposition.\"</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">carry weight</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">seem credible</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">create waves</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">hold office</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Meaning: </span><span style=\"font-family:'Nirmala UI'\"><b>To    be valid, sound, and convincing; to withstand scrutiny or    criticism.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Context:    The minister's explanation did NOT hold water — it was NOT    convincing to the opposition.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">We    need a phrase meaning 'seem credible/convincing.'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Corrected    sentence: 'The minister's explanation for the policy U-turn did    not seem credible to the opposition.'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Similar    phrase-replacement idioms in SSC:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  •    <span style=\"font-family:'Nirmala UI'\">'Ring hollow' = sound insincere</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  •    <span style=\"font-family:'Nirmala UI'\">'Cut corners' = do something    cheaply or improperly</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  •    <span style=\"font-family:'Nirmala UI'\">'Beat around the bush' = avoid the    main topic</span></p>    <p style=\"orphans:0;widows:0\">  • <span style=\"font-family:'Nirmala UI'\">'Hold    water' = be valid/convincing</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the correctly spelt word    from the given options:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Millenium</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Millennuim</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Millennium</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Milennium</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>DETAILED SOLUTION</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Correct    spelling: MILLENNIUM</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Breakdown:    Millenni + um</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  •    <span style=\"font-family:'Nirmala UI'\">'Milli-' = thousand (Latin 'mille')</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  •    <span style=\"font-family:'Nirmala UI'\">'ennium' = year (from Latin 'annus'    = year)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  •    <span style=\"font-family:'Nirmala UI'\">Double 'n' and double 'l':    millenn-ium</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Commonly    misspelt SSC words:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Accommodation (cc, mm)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Embarrass (rr, ss)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Occurrence (cc, rr)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Millennium (ll, nn)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Privilege (no 'd' — not    'priviledge')</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Separate (e in middle — not    'seperate')</span></p>    <p style=\"orphans:0;widows:0\">  <span style=\"font-family:'Nirmala UI'\">Definitely    (finite in the middle — not 'definately')</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the option that expresses    the given sentence in the Active/Passive voice:</span></p>    <p style=\"orphans:0;widows:0\"> <span style=\"font-family:'Nirmala UI'\">'The    authorities will have implemented the new regulations by next    month.'</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The new regulations will have been    implemented by the authorities by next month.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The new regulations will be    implemented by the authorities by next month.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The new regulations would have been    implemented by the authorities by next month.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The new regulations are implemented    by the authorities by next month.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Step 1 — Identify the tense in    the active voice.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Active:    'will have implemented' = Future Perfect Tense</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Structure:    Subject + will have + V3</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span style=\"font-family:'Nirmala UI'\">Step    2 — Apply the passive conversion rule for Future Perfect.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Active:    will have + V3</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Passive:    will have been + V3 (by agent)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Step    3 — Convert the sentence.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Active    object </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    Passive subject: 'the new regulations'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Verb:    'will have been implemented'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Agent:    'by the authorities'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Time    expression: 'by next month' (retained)</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Result:    'The new regulations will have been implemented by the authorities    by next month.'</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Rearrange the following sentence    parts to form a meaningful and grammatically correct</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>paragraph:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>P.    He started assembling the deck planks, fastening each one in a    neat, even line.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Q.    He made sure that every angle was precisely square when he    constructed the deck wi e (ii) statement to sit </span><span style=\"font-family:'Nirmala UI'\"><b>B</b></span><span style=\"font-family:'Nirmala UI'\"> then  statement (iv) after that only </span><span style=\"font-family:'Nirmala UI'\"><b>A</b></span><span style=\"font-family:'Nirmala UI'\"> , </span><span style=\"font-family:'Nirmala UI'\"><b>K</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>D</b></span><span style=\"font-family:'Nirmala UI'\"> will left. then using statement (iii) we will sit </span><span style=\"font-family:'Nirmala UI'\"><b>A</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>D</b></span><span style=\"font-family:'Nirmala UI'\"> so </span><span style=\"font-family:'Nirmala UI'\"><b>K</b></span><span style=\"font-family:'Nirmala UI'\"> will automatically sit.</span></p>\r\n\r\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><img height=\"423\" src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785514120946_html_21b9415971dea1ca.png\" width=\"384\" /></p>\r\n\r\n<p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence option <b>B</b></span><span style=\"font-family:'Nirmala UI'\"> is correct answer. </span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">If ‘P’ denotes ‘addition’,    ‘Q’ denotes ‘subtraction’, ‘R’ denotes    ‘multiplication’, and ‘S’ denotes ‘division’, then    what will be the value of the following expression?</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">189    P (377 R 6 S 29) Q 345 S 5 P 2</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">196</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">198</span></p>", "option3": " <p style=\"orphans: p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Conclusion    II is also correct as there is no direct relatoion between carrots    and fruits so every possibility will be correct.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>III.    All Carrots can be Vegetables.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It    is also correct as All carrot can be vegetables </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Note</b></span><span style=\"font-family:'Nirmala UI'\">.    All vegetable can never be carrot as it clearly stated in    statement that only few vegetables are carrot.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785514120946_html_8f18dd3b04b97041.png\" width=\"528\" height=\"289\" > </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence    option </span><span style=\"font-family:'Nirmala UI'\"><b>D</b></span><span style=\"font-family:'Nirmala UI'\"> is    a correct answer.</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">‘A+B’ means‘A is the brother    ofB’.<br> ‘A–B’ means‘A is the sister of B’.<br> ‘A×B’    means‘A is the father of B’.<br> ‘A÷B’ means‘ A is the    mother of B’.<br> Using the same meaning of the mathematical    operators as given above, which of the following shows‘P is the    father’s father of S’?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">P–Q+R÷S </span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">P×Q×R+S</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-fam r.</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Two statements are followed by two    conclusions numbered I and II. You have to consider these    statements to be true, even if they seem to be at variance with    commonly known facts. Decide which of the given conclusions    logically follow(s) from the given statements. </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Statements:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span style=\"font-family:'Nirmala UI'\">Q    &lt; X </span><span style=\"font-family:'Cambria Math'\">≤</span><span style=\"font-family:'Nirmala UI'\">    H </span><span style=\"font-family:'Cambria Math'\">≤</span><span style=\"font-family:'Nirmala UI'\">    K </span><span style=\"font-family:'Cambria Math'\">≤</span><span style=\"font-family:'Nirmala UI'\">    M; W </span><span style=\"font-family:'Cambria Math'\">≥</span><span style=\"font-family:'Nirmala UI'\">    L = E </span><span style=\"font-family:'Cambria Math'\">≥</span><span style=\"font-family:'Nirmala UI'\">    M </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Conclusions:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span style=\"font-family:'Nirmala UI'\">I).    X &lt; L</span></p>    <p style=\"orphans:0;widows:0\"> <span style=\"font-family:'Nirmala UI'\">II).    X = L</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">only conclusion I follows.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">only conclusion II follows.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">either conclusion I or II follows</span></p>", "option4": " <p style=\"orphans:0;widow argin-bottom:0.03in\">     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_58ca95f8748b4539.png\" width=\"461\" height=\"461\" > </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     AB + AC = 48 − 12 = 36 cm</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     AB = 36 ×      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_885820af5b89056b.gif\" >      = 15 cm</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     AC = 36 ×      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_f781cfdd827d04b1.gif\" >      = 21 cm</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     By Apollonius’ theorem: AB² + AC² = 2AD² +      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_7c8577298c974e41.gif\" > </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     15² + 21² = 2AD² +      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_f7efc5ce51a7f7db.gif\" > </p>     <p style=\"orphans:0;widows:0\">AD² = 297 cm²</p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">The numerator of     a positive fraction is increased successively by 20% and then     decreased by 10%, while its denominator is decreased by 25% and     then increased by 20%. By what percentage does the value of the     fraction change?</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">16% increase</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">18% increase</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\  1) − 2(5k + 7) + 6 = 0</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     6k − 12 = 0</p>     <p style=\"orphans:0;widows:0\">k = 2</p>", "question_heading": ""}, {"sr_no": 79, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">A vertical tank     of uniform cross-section is initially filled to      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_464ec97a735cbcfc.gif\" >      of its height. An inlet can fill the empty tank in 9 hours. An     outlet, capable of emptying a full tank in 15 hours, is fitted at         <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_d40a3fb9d48cfa60.gif\" >      of the tank height and starts discharging only when the water     reaches that level. How long will the tank take to become full?</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">14 hours 30     minutes</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">15 hours</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">16 hours</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">15 hours 30     minutes</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Inlet rate =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_464ec97a735cbcfc.gif\" >      tank per hour</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Part filled before the outlet starts =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_d40a3fb9d48cfa60.gif\" >      −      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_464ec97a735cbcfc.gif\" >      =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_3a53b47cf27d6123.gif\" > </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     t₁ = (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_3a53b47cf27d6123.gif\" > )     ÷ (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_464ec97a735cbcfc.gif\" > )     = 3 hours</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Net rate after the outlet starts =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_464ec97a735cbcfc.gif\" >      −      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_3938112ec78d0d8e.gif\" >      =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_7fdaed786dd3d14b.gif\" > </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Remaining part = 1 −      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_d40a3fb9d48cfa60.gif\" >      =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_f3f811d8e811854b.gif\" > </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     t₂ = (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_f3f811d8e811854b.gif\" > )     ÷ (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_7fdaed786dd3d14b.gif\" > )     = 12.5 hours</p>     <p style=\"orphans:0;widows:0\">Total time = 3 +     12.5 = 15.5 hours = 15 hours 30 minutes</p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">A rectangular     field is 180 m long and 120 m broad. A 4 m wide road runs through     the field parallel to its length, and a 6 m wide road runs     through it parallel to its breadth. Find the remaining cultivable     area.</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">20,184 m²</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">20,160 m²</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">20,136 m²</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">20,064 m²</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-top:0.03in;margin-bottom:0.03in\">     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_32b08358db37f0c4.png\" width=\"480\" height=\"361\" > </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Total field area = 180 × 120 = 21,600 m²</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Area of the 4 m road = 180 × 4 = 720 m²</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Area of the 6 m road = 120 × 6 = 720 m²</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Common overlap = 4 × 6 = 24 m²</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Total road area = 720 + 720 − 24 = 1,416 m²</p>     <p style=\"orphans:0;widows:0\">Cultivable area     = 21,600 − 1,416 = 20,184 m²</p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">At an annual     simple-interest rate of r%, the interest on ₹6,400 for 3.5     years exceeds the interest on ₹8,000 at (r − 2)% for 2 years     by ₹832. Find r.</p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">6%</p>", "option2": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">8%</p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">10%</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">12%</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     First interest = 6400 × r ×      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_954a5e2942300535.gif\" >      = 224r</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     Second interest = 8000 × (r − 2) ×      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_4eb4e276bea28b22.gif\" >      = 160(r − 2)</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     224r − 160(r − 2) = 832</p>     <p style=\"orphans:0;widows:0;margin-bottom:0in\">     64r = 512</p>     <p style=\"orphans:0;widows:0\">r = 8%</p>", "question_heading": ""}, {"sr_no": 82, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <br>      </p>     <p style=\"orphans:0;widows:0\">For an acute     angle θ, sin θ − cos θ =      <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788952298461_html_3a53b47cf27d6123.gif\" >      Find tan θ + cot θ.</p>", "option1": " <p style=\"orphans:0;
