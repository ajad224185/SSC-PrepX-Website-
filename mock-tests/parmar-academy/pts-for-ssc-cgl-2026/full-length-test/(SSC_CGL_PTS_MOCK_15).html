">    <span style=\"font-family:'Nirmala UI'\">A-4, B-1, C-3, D-2</span></p>", "option2": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">A-1, B-4, C-2, D-3</span></p>", "option3": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">A-4, B-3, C-1, D-2</span></p>", "option4": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">A-2, B-1, C-4, D-3</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n   <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>A)    A-4, B-1, C-3, D-2</b></span></p>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Important facts-</b></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Type of Poverty</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Definition</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Important Point</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Absolute Poverty</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Inability to fulfill minimum       basic needs</b></span><span style=\"font-family:'Nirmala UI'\"> like       food, clothing, and shelter</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Based on fixed poverty line</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Relative Poverty</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Poverty measured</span><span style=\"font-family:'Nirmala UI'\"><b> relative       to the living standards of</b></span><span style=\"font-family:'Nirmala UI'\"> others       in society</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Related to inequality</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Rural Poverty</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Poverty found mainly in villages       and rural regions</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Linked with low agricultural       income</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Multidimensional Poverty</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Poverty involving deprivation in       health, education, and living standards</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Measured by MPI, Developed by       UNDP and Oxford Poverty and Human Development Initiative.</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Cyclical Poverty</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Poverty caused by </span><span style=\"font-family:'Nirmala UI'\"><b>recession       and economic slowdown</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Related to business cycles</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Seasonal Poverty</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Poverty due to </span><span style=\"font-family:'Nirmala UI'\"><b>seasonal       unemployment</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Common among agricultural       labourers</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><u><b>Multidimensional Poverty    Index(MPI)-</b></u></span></p>    <ul>     <li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">It was introduced     in</span><span style=\"font-family:'Nirmala UI'\"><b> 2010</b></span><span style=\"font-family:'Nirmala UI'\"> by </span><span style=\"font-family:'Nirmala UI'\"><b>United     Nations Development Programme(UNDP) and Oxford Poverty and Human     Development Initiative(OPHI).</b></span></p>     </li>\n<li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">It uses </span><span style=\"font-family:'Nirmala UI'\"><b>10     Health Indicators and 3 Key Dimensions</b></span><span style=\"font-family:'Nirmala UI'\">(Standard     of living, Health, and Education).</span></p>     </li>\n<li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>NITI Aayog</b></span><span style=\"font-family:'Nirmala UI'\"> launched     a report in </span><span style=\"font-family:'Nirmala UI'\"><b>November     2021</b></span><span style=\"font-family:'Nirmala UI'\">- National     Multidimensional Poverty Index using </span><span style=\"font-family:'Nirmala UI'\"><b>12     indicators.</b></span></p>    </li>\n</ul>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785514120946_html_a6033ab9e230446c.png\" width=\"602\" height=\"402\"> </p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Read the below statements marked as    Assertion (A) and Reason (R). Mark the correct options:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Assertion(A):    The One Nation One Ration card ensures portability of food grains.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Reason(R):    It uses Aadhar-enabled biometric authentication</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both A and R are true, and R is the    correct explanation of A</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both A and R are true, but R is not    the correct explanation of A</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A is true, but R is false</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A is false, but R is true</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is:</span><span style=\"font-family:'Nirmala UI'\"><b> A)Both    Assertion (A) and Reason (R) are true, and Reason (R) is the    correct explanation of Assertion (A).</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Assertion-    Correct.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>One    Nation One Ration Card (ONORC)</b></span><span style=\"font-family:'Nirmala UI'\"> allows    beneficiaries under the National Food Security Act </span><span style=\"font-family:'Nirmala UI'\"><b>(NFSA)</b></span><span style=\"font-family:'Nirmala UI'\"> to    access subsidized food grains from any Fair Price    Shop </span><span style=\"font-family:'Nirmala UI'\"><b>(FPS)</b></span><span style=\"font-family:'Nirmala UI'\"> across    India.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Important    Points</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Enables     nationwide </span><span style=\"font-family:'Nirmala UI'\"><b>portability     of ration benefits.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Beneficial     for migrant workers and their families.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Implemented     under the </span><span style=\"font-family:'Nirmala UI'\"><b>Public     Distribution System (PDS)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Reason    (R): Correct</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    scheme works through:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Aadhaar     seeding</b></span><span style=\"font-family:'Nirmala UI'\"> of ration     cards</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Electronic     Point of Sale </span><span style=\"font-family:'Nirmala UI'\"><b>(e-PoS)</b></span><span style=\"font-family:'Nirmala UI'\"> devices</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Biometric     authentication</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This    technology allows beneficiaries to verify identity anywhere in the    country and receive ration from any linked FPS shop.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Because    biometric authentication through Aadhaar and e-PoS technology is    the mechanism that enables portability of ration benefits across    states and shops.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    the Reason correctly explains the Assertion.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Public    Distribution System (PDS) -</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Public    Distribution System is a government system that provides    essential food grains like rice and wheat at subsidized rates to    poor people.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Main     aim: </span><span style=\"font-family:'Nirmala UI'\"><b>Food security</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Implemented     through </span><span style=\"font-family:'Nirmala UI'\"><b>ration     shops</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Food     grains procured by </span><span style=\"font-family:'Nirmala UI'\"><b>Food     Corporation of India (FCI)</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Fair     Price Shop</b></span><span style=\"font-family:'Nirmala UI'\"> is a     ration shop that </span><span style=\"font-family:'Nirmala UI'\"><b>distributes     subsidized food </b></span><span style=\"font-family:'Nirmala UI'\">items     under PDS.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following objectives    is envisaged under Article 39 of the Constitution of India as a    Directive Principle of State Policy?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Equal justice and free legal aid</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Promotion of international peace    and security</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Protection of monuments and places    of national importance</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Adequate means of livelihood for    all citizens</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is :</span><span style=\"font-family:'Nirmala UI'\"><b>D)Adequate    means of livelihood for all citizens</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article    39-</b></span><span style=\"font-family:'Nirmala UI'\">It directs the State    to formulate policies that promote </span><span style=\"font-family:'Nirmala UI'\"><b>social    justice, economic welfare, equal opportunities, and protection</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>of    workers and children.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(a)</b></span><span style=\"font-family:'Nirmala UI'\">-Citizens,    both men and women, should have equal right to </span><span style=\"font-family:'Nirmala UI'\"><b>adequate    means of livelihood.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(b)</b></span><span style=\"font-family:'Nirmala UI'\">-Ownership    and control of material resources should be</span><span style=\"font-family:'Nirmala UI'\"><b> distributed    to serve the common good.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(c)</b></span><span style=\"font-family:'Nirmala UI'\">-The    economic system should not lead to</span><span style=\"font-family:'Nirmala UI'\"><b> concentration    of wealth</b></span><span style=\"font-family:'Nirmala UI'\"> and means    of production in a few hands.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(d)</b></span><span style=\"font-family:'Nirmala UI'\">-</span><span style=\"font-family:'Nirmala UI'\"><b>Equal    pay for equal work </b></span><span style=\"font-family:'Nirmala UI'\">for    both men and women.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(e)</b></span><span style=\"font-family:'Nirmala UI'\">-</span><span style=\"font-family:'Nirmala UI'\"><b>Health    and strength </b></span><span style=\"font-family:'Nirmala UI'\">of    workers, men, women, and children should not be abused.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(f)</b></span><span style=\"font-family:'Nirmala UI'\">-</span><span style=\"font-family:'Nirmala UI'\"><b>Children</b></span><span style=\"font-family:'Nirmala UI'\"> should    develop in a</span><span style=\"font-family:'Nirmala UI'\"><b> healthy    manner </b></span><span style=\"font-family:'Nirmala UI'\">with freedom    and dignity.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Additional    facts-</b></u></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article     39A</b></span><span style=\"font-family:'Nirmala UI'\">- directs the State     to ensure </span><span style=\"font-family:'Nirmala UI'\"><b>equal     justice and provide free legal aid</b></span><span style=\"font-family:'Nirmala UI'\"> so     that no citizen is denied justice because of economic or other     disabilities.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Added     by the </span><span style=\"font-family:'Nirmala UI'\"><b>42nd     Constitutional Amendment Act, 1976.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article     49- </b></span><span style=\"font-family:'Nirmala UI'\">directs the     State to</span><span style=\"font-family:'Nirmala UI'\"><b> protect     monuments, places, and objects of national importance</b></span><span style=\"font-family:'Nirmala UI'\"> from     destruction, damage, or removal.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Article     51 </b></span><span style=\"font-family:'Nirmala UI'\">-directs the     State to </span><span style=\"font-family:'Nirmala UI'\"><b>promote     international peace, security,</b></span><span style=\"font-family:'Nirmala UI'\"> and     friendly relations among nations.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following best    describes Lenz's law?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The induced current always flows in    the direction of the applied magnetic field</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The direction of induced current is    such that it opposes the change in magnetic flux producing it</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Electric current flows from higher    potential to lower potential only in conductors</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The magnetic field around a    conductor is directly proportional to resistance</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>B)The    direction of induced current is such that it opposes the change in    magnetic flux producing it</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Lenz's    Law</b></span><span style=\"font-family:'Nirmala UI'\">-</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Lenz’s     Law states that the direction of induced current in a conductor     is always such that it </span><span style=\"font-family:'Nirmala UI'\"><b>opposes     the change in magnetic flux</b></span><span style=\"font-family:'Nirmala UI'\"> that     produces it.</span></p>     </li>\n<li>    </li>\n</ul>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785514120946_html_1b1e1d28488db29f.gif\">  <span style=\"font-family:'Nirmala UI'\">=     induced EMF</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785514120946_html_22c247083c5668fd.gif\"> <span style=\"font-family:'Nirmala UI'\">=     magnetic flux</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Negative     sign shows opposition to change (Lenz’s Law).</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Additional    facts:</b></u></i></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Electromagnetic    Induction-</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It    is the phenomenon in which an</span><span style=\"font-family:'Nirmala UI'\"><b> electric    current is produced</b></span><span style=\"font-family:'Nirmala UI'\"> in    a conductor when there is a </span><span style=\"font-family:'Nirmala UI'\"><b>change    in magnetic flux</b></span><span style=\"font-family:'Nirmala UI'\"> linked    with it.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Important    Points</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Discovered     by </span><span style=\"font-family:'Nirmala UI'\"><b>Michael Faraday.</b></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Basis     of </span><span style=\"font-family:'Nirmala UI'\"><b>generators,     transformers, and induction motors.</b></span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Fleming's    Right-Hand Rule- </b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It    is used to</span><span style=\"font-family:'Nirmala UI'\"><b> find the    direction of induced current in a generator</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Rule:-</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Stretch    the thumb, forefinger, and middle finger of the right hand    mutually perpendicular:</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Thumb     </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     direction of motion of conductor</b></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Forefinger     </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     direction of magnetic field</b></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Middle     finger </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     direction of induced current</b></span></p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding the Population Census in India:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Population Census in India is conducted in three main phases,     including a separate economic enumeration phase.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     forthcoming Census is proposed to be India’s first digital     Census.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the statements given above is/are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both 1 and 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither 1 nor 2</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>B)    2 only</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    1- Incorrect</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    Population Census in India is generally conducted in </span><span style=\"font-family:'Nirmala UI'\"><b>two    main phases</b></span><span style=\"font-family:'Nirmala UI'\">:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>House     Listing and Housing Census</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Information      about houses, amenities, assets, etc. is collected.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Population     Enumeration</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Details      about population such as age, sex, literacy, occupation,      religion, etc. are collected.</span></p>     </li></ul>    </li></ol>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    2- Correct</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    upcoming Census is proposed to be India’s </span><span style=\"font-family:'Nirmala UI'\"><b>first    digital Census</b></span><span style=\"font-family:'Nirmala UI'\">:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Data     collection through mobile applications and digital devices.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Citizens     may also get an option for </span><span style=\"font-family:'Nirmala UI'\"><b>self-enumeration.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Key    takeaways-</b></u></i></span><span style=\"font-family:'Nirmala UI'\"><br>  </span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Census     in India is conducted under the</span><span style=\"font-family:'Nirmala UI'\"><b> Census     Act, 1948.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Conducted     by the </span><span style=\"font-family:'Nirmala UI'\"><b>Office of     the Registrar General and Census Commissioner </b></span><span style=\"font-family:'Nirmala UI'\">of     India under the </span><span style=\"font-family:'Nirmala UI'\"><b>Ministry     of Home Affairs.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">First     complete Census in India: </span><span style=\"font-family:'Nirmala UI'\"><b>1881</b></span><span style=\"font-family:'Nirmala UI'\"> under</span><span style=\"font-family:'Nirmala UI'\"><b> Lord     Ripon</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Census     is a </span><span style=\"font-family:'Nirmala UI'\"><b>Union     Subject</b></span><span style=\"font-family:'Nirmala UI'\"> under </span><span style=\"font-family:'Nirmala UI'\"><b>Article     246 in the Union List.</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Under which of the following    conditions does a real gas show maximum deviation from ideal gas    behaviour?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">High temperature and low density</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Low pressure and low temperature</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Low pressure and high temperature</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">High pressure and low temperature</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>D)    High pressure and Low temperature.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>At    High Pressure: </b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Gas     molecules come very close to each other.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Intermolecular     forces and molecular volume become significant.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Assumption     of ideal gas (negligible molecular volume) fails.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>At    Low Temperature:</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Kinetic     energy of molecules decreases.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Attractive     intermolecular forces become stronger.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Gas     no longer behaves ideally.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Difference    Between Ideal Gas and Real Gas:</b></u></i></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Basis</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Ideal Gas</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Real Gas</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Existence</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Hypothetical</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Actually exists</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Intermolecular Force</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Absent</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Present</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Molecular Volume</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Negligible</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Finite volume</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Follows Gas Laws</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Perfectly at all conditions</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Only at low pressure &amp; high       temperature</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Liquefaction</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Cannot be liquefied</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Can be liquefied</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Equation</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">PV = nRT</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Modified equations like Van der       Waals equation</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Examples</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">No perfect example</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Oxygen, Nitrogen, CO</span><span style=\"font-family:'Cambria Math'\">₂</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What is the primary objective    of Gender Budgeting in India?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To provide financial assistance    only to women entrepreneurs</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To increase tax collection from    female workers</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To reserve a fixed percentage of    the Union Budget exclusively for women</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To assess the impact of government    expenditure and policies on gender equality</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "   <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>D)To    assess the impact of government expenditure and policies on gender    equality.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Gender    Budgeting-</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Gender    Budgeting means analysing government budgets from a gender    perspective to ensure proper allocation of funds for women    empowerment and welfare.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It    is </span><span style=\"font-family:'Nirmala UI'\"><b>not a separate    budget for women</b></span><span style=\"font-family:'Nirmala UI'\">, but a    tool to make the normal budget gender-sensitive</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Introduced    in India in </span><span style=\"font-family:'Nirmala UI'\"><b>2005–06</b></span><span style=\"font-family:'Nirmala UI'\"> through    the </span><span style=\"font-family:'Nirmala UI'\"><b>Gender Budget    Statement (GBS)</b></span><span style=\"font-family:'Nirmala UI'\"> in    the Union Budget</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>About    Budget in India:</b></u></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Article     112 deals with the </span><span style=\"font-family:'Nirmala UI'\"><b>Annual     Financial Statement (Union Budget)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Presented     by the</span><span style=\"font-family:'Nirmala UI'\"><b> Finance     Minister in Parliament</b></span><span style=\"font-family:'Nirmala UI'\">,     on the name of </span><span style=\"font-family:'Nirmala UI'\"><b>President.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is the annual financial statement of </span><span style=\"font-family:'Nirmala UI'\"><b>Estimated     revenue and expenditure</b></span><span style=\"font-family:'Nirmala UI'\"> for     the coming financial year.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Important    Articles-</b></u></i></span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Article</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Related Topic</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Article 112</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Annual Financial Statement       (Budget)</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Article 113</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Procedure in Parliament       regarding esti ></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This     large area of land was demarcated and declared to be the land of     Santhals</span><span style=\"font-family:'Nirmala UI'\"><b>(Santhals is 3rd     largest tribe in India)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Leaders:     Sidhu and Kanhu Murmu</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Additional    facts-</b></u></i></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sanyasi    Revolt (1763)-</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     started in </span><span style=\"font-family:'Nirmala UI'\"><b>Bihar     and Bengal.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Leaders-     Majnu Shah, Bhawani Pathak and Debi Chaudhurani</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Bankim     Chandra Chatterjee's</b></span><span style=\"font-family:'Nirmala UI'\"> novel </span><span style=\"font-family:'Nirmala UI'\"><b>\"Anand     Math\"</b></span><span style=\"font-family:'Nirmala UI'\"> mentions     about Sanyasi Rebellion of 1763.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Indigo    Revolt(1859)-</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     started in</span><span style=\"font-family:'Nirmala UI'\"><b> Nadia(District)     of Bengal.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Leaders-Digambar     Biswas and Bishnucharan Biswas</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     was against the exploitative practices of British planters who     forced Indian farmers to cultivate</span><span style=\"font-family:'Nirmala UI'\"><b> indigo     instead of food crop</b></span><span style=\"font-family:'Nirmala UI'\">s     on their land.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     was successful revolt.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Dinbandhu     Mitra wrote \"Nil Darpan\"</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Under the Public Examinations    (Prevention of Unfair Means) Act, 2024, organised paper leak    crimes involving persons acting in collusion may attract    imprisonment for a term extending up to:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3 years</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">5 years</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">10 years</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">15 years</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>C)10    years</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Public    Examinations (Prevention of Unfair Means) Act, 2024:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This     Act was enacted by the Government of India to prevent unfair     practices such as paper leaks, cheating, impersonation, and     organised exam fraud in public examinations.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     aims to ensure transparency, fairness, and credibility in     recruitment and entrance examinations.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Important    Provisions of the Act: </b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>For    Individuals Using Unfair Means</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Imprisonment: </span><span style=\"font-family:'Nirmala UI'\"><b>3     to 5 years</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Fine:     up to </span><span style=\"font-family:'Nirmala UI'\"><b>₹10 lakh</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>For    Organised Crimes / Paper Leak Syndicates</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Imprisonment: </span><span style=\"font-family:'Nirmala UI'\"><b>5     to 10 years</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Fine:     up to </span><span style=\"font-family:'Nirmala UI'\"><b>₹1 crore</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>If    Service Providers are Involved</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Examination     authority can recover proportional cost from them.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">They     can also be barred from future contracts.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding Article 100 of the Constitution of India:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Article     100 deals with voting procedures in the Houses of Parliament.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Speaker of the Lok Sabha has no casting vote in case of a tie.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the statements given above is/are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both 1 and 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither 1 nor 2</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is:</span><span style=\"font-family:'Nirmala UI'\"><b> A)    1 only</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    1</b></span><span style=\"font-family:'Nirmala UI'\">-Article 100 deals with    voting procedures in the Houses of Parliament. Therefore the    statement is</span><span style=\"font-family:'Nirmala UI'\"><b> Correct</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    2</b></span><span style=\"font-family:'Nirmala UI'\">- The speaker has    casting vote in case of tie, Therefore the statement is </span><span style=\"font-family:'Nirmala UI'\"><b>Incorrect.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article    100- Voting in Houses and Quorum</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>100(1)</b></span><span style=\"font-family:'Nirmala UI'\">-    The Chairman or Speaker shall not vote in the 1st instance but    shall exercise a casting vote in case of tie.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>100(3)</b></span><span style=\"font-family:'Nirmala UI'\">-Quorum    minimum 1/10th of total strength of House is required to carry on    the proceedings.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>100(4)</b></span><span style=\"font-family:'Nirmala UI'\">-If    quorum is not met, house is adjourned by the presiding officer.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The festival of Prakash Parv is    celebrated to commemorate the birth anniversary of which Sikh    Guru?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Guru Arjan Dev</span></p>", "
