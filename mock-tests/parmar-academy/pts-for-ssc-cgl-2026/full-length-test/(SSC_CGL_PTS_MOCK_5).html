<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>9.) SSC CGL PTS  MOCK 5 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

tyle=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Drug      testing</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Disease      modeling (lung diseases)</b></span></p>      </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Future      scope in </span><span style=\"font-family:'Nirmala UI'\"><b>organ      transplantation</b></span></p>     </li></ul>    </li></ul>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In the Constitution of India,    promotion of international peace and security is included in the:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Preamble to the Constitution</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Directive Principles of State    Policy</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Fundamental Duties</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ninth Schedule</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>(b)    Directive Principles of State Policy</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Covered     under </span><span style=\"font-family:'Nirmala UI'\"><b>Article 51</b></span><span style=\"font-family:'Nirmala UI'\"> of     the Constitution</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Directs     the State to:</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Promote      international peace and security</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Maintain </span><span style=\"font-family:'Nirmala UI'\"><b>just      and honorable relations between nations</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Encourage </span><span style=\"font-family:'Nirmala UI'\"><b>settlement      of international disputes by arbitration</b></span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Part     of </span><span style=\"font-family:'Nirmala UI'\"><b>Part IV (DPSP)</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding India’s solar mission, Aditya-L1:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is India’s first dedicated space-based observatory launched to     study the Sun from a Halo orbit around Lagrange Point 1 (L1).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     mission recently provided data on how turbulent regions within     solar storms can compress Earth’s magnetosphere, potentially     exposing geostationary satellites to harsh space plasma.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     spacecraft was launched in 2023 using the GSLV Mk-III (LVM3)     launch vehicle to reach its destination 1.5 million km away.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the statements given above are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 and 2 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 and 3 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 and 3 only</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2, and 3</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Statement     3 is Incorrect: While the launch date and distance are correct,     the launch vehicle used was the PSLV-C57 (in its XL     configuration), not the GSLV Mk-III.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     mission carries seven payloads, categorized into two groups:</span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Remote     Sensing: VELC, SUIT, SoLEXS, HEL1OS</span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">In-situ     ASPEX, PAPA, Magnetometer</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">________ ended the monopoly of the    East India Company in trade with India.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Charter Act of 1813</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Regulating Act of 1773</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Indian Councils Act 1861</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Government of India Act 1935</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>(a)    Charter Act of 1813</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(a)    Charter Act of 1813 — Correct</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Ended     the monopoly of the East India Company over trade with India</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Allowed </span><span style=\"font-family:'Nirmala UI'\"><b>British     private traders</b></span><span style=\"font-family:'Nirmala UI'\"> to     trade with India</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Exception:     Company retained monopoly over </span><span style=\"font-family:'Nirmala UI'\"><b>trade     with China and tea trade</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Marked     beginning of </span><span style=\"font-family:'Nirmala UI'\"><b>free     trade in India</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(b)    Regulating Act of 1773 — Incorrect</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">First     step by </span><span style=\"font-family:'Nirmala UI'\"><b>British     Parliament</b></span><span style=\"font-family:'Nirmala UI'\"> to     control Company</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Introduced </span><span style=\"font-family:'Nirmala UI'\"><b>Governor-General     of Bengal (Warren Hastings)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Focus: </span><span style=\"font-family:'Nirmala UI'\"><b>administrative     control</b></span><span style=\"font-family:'Nirmala UI'\">, not trade     monopoly</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(c)    Indian Councils Act 1861 — Incorrect</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Related     to </span><span style=\"font-family:'Nirmala UI'\"><b>legislative     councils expansion</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Introduced </span><span style=\"font-family:'Nirmala UI'\"><b>Indians     in legislative process (limited role)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">No     relation to Company’s trade monopoly</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(d)    Government of India Act 1935 — Incorrect</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Major     constitutional reform</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Introduced </span><span style=\"font-family:'Nirmala UI'\"><b>provincial     autonomy and federal structure (proposed)</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">No     connection with East India Company trade</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following was a    primary objective of 'Liberalization' within the New Economic    Policy (NEP) of 1991?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Expanding the list of industries    reserved exclusively for the public sector</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Abolishing industrial licensing for    most industries to encourage private entry</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Increasing the peak customs duty on    imports to protect domestic industries</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Strengthening the MRTP Act to    restrict the expansion of large business houses</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>(b)    Abolishing industrial licensing for most industries to encourage    private entry</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    primary objective of </span><span style=\"font-family:'Nirmala UI'\"><b>Liberalization</b></span><span style=\"font-family:'Nirmala UI'\"> in    the 1991 New Economic Policy (NEP) was to end the \"License    Raj\" and reduce government control over the private sector.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Features of Liberalization</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Abolition     of Licensing:</b></span><span style=\"font-family:'Nirmala UI'\"> Requirement     for government licenses was removed for almost all industries,     except for a few like defense and hazardous chemicals.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>De-reservation:</b></span><span style=\"font-family:'Nirmala UI'\"> The     number of industries reserved exclusively for the </span><span style=\"font-family:'Nirmala UI'\"><b>Public     Sector</b></span><span style=\"font-family:'Nirmala UI'\"> was     significantly reduced to allow private competition.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Expansion     Freedom:</b></span><span style=\"font-family:'Nirmala UI'\"> Businesses     no longer needed government permission to expand their production     capacity or diversify products.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>MRTP     Relaxation:</b></span><span style=\"font-family:'Nirmala UI'\"> Restrictions     on large business houses were eased, allowing them to grow     without prior regulatory hurdles.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Price     Decontrol:</b></span><span style=\"font-family:'Nirmala UI'\"> Market     forces (demand and supply) were allowed to determine the prices     of many goods instead of the government.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What is the movement of tectonic    plates that causes earthquakes called?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Erosion</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Plate Tectonics</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Deposition</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Convection</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>(b)    Plate Tectonics</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Movement     of Earth’s lithospheric plates</b></span><span style=\"font-family:'Nirmala UI'\"> is     called </span><span style=\"font-family:'Nirmala UI'\"><b>Plate     Tectonics</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Earthquakes     occur due to:</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Collision      (convergent boundaries)</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Separation      (divergent boundaries)</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sliding      past each other (transform boundaries)</b></span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Energy     released from these movements causes </span><span style=\"font-family:'Nirmala UI'\"><b>earthquakes</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Consider the following pairs:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmal pan><span style=\"font-family:'Nirmala UI'\"><b>-cells):</b></span><span style=\"font-family:'Nirmala UI'\"> Secrete </span><span style=\"font-family:'Nirmala UI'\"><b>glucagon</b></span><span style=\"font-family:'Nirmala UI'\">,     a hormone that </span><span style=\"font-family:'Nirmala UI'\"><b>raises     blood glucose levels</b></span><span style=\"font-family:'Nirmala UI'\"> by     promoting glycogen breakdown in the liver.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Beta     cells (</b></span><span><b>β</b></span><span style=\"font-family:'Nirmala UI'\"><b>-cells):</b></span><span style=\"font-family:'Nirmala UI'\"> Secrete </span><span style=\"font-family:'Nirmala UI'\"><b>insulin</b></span><span style=\"font-family:'Nirmala UI'\">,     which lowers blood glucose levels.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Delta     cells (</b></span><span><b>δ</b></span><span style=\"font-family:'Nirmala UI'\"><b>-cells):</b></span><span style=\"font-family:'Nirmala UI'\"> Secrete </span><span style=\"font-family:'Nirmala UI'\"><b>somatostatin</b></span><span style=\"font-family:'Nirmala UI'\">,     which inhibits other hormones.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>PP     cells:</b></span><span style=\"font-family:'Nirmala UI'\"> Secrete </span><span style=\"font-family:'Nirmala UI'\"><b>pancreatic     polypeptide</b></span><span style=\"font-family:'Nirmala UI'\">, which     regulates pancreatic secretions.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Since </span><span style=\"font-family:'Nirmala UI'\"><b>glucagon</b></span><span style=\"font-family:'Nirmala UI'\"> is     the hormone responsible for </span><span style=\"font-family:'Nirmala UI'\"><b>increasing     blood glucose levels</ ans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Ensures:</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Innovation      in defence sector</b></span></p>      </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Better </span><span style=\"font-family:'Nirmala UI'\"><b>use      of academic research in real-world defence applications</b></span></p>     </li></ul>    </li></ul>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>When you travel in Himalayas,    you will see the following:</b></span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Deep     gorges</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">U-turn     river courses</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Parallel     mountain ranges</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Steep     gradients causing land-sliding</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the above can be said to be the evidence for Himalayas being    young fold mountains?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 and 2 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2 and 4 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3 and 4 only</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2, 3 and 4</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>(d)    1, 2, 3 and 4</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(1)    Deep gorges — Correct</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Rivers     cut </span><span style=\"font-family:'Nirmala UI'\"><b>deep     valleys</b></span><span style=\"font-family:'Nirmala UI'\"> due     to </span><span style=\"font-family:'Nirmala UI'\"><b>active uplift of     Himalayas</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Indicates </span><span style=\"font-family:'Nirmala UI'\"><b>ongoing     geological activity </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     young mountains</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(2)    U-turn river courses — Correct</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Rivers     show </span><span style=\"font-family:'Nirmala UI'\"><b>meandering and     abrupt turns</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Due     to </span><span style=\"font-family:'Nirmala UI'\"><b>tectonic     disturbances and recent formation</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Example:     Indus, Brahmaputra river bends</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(3)    Parallel mountain ranges — Correct</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Himalayas     consist of </span><span style=\"font-family:'Nirmala UI'\"><b>parallel     ranges</b></span><span style=\"font-family:'Nirmala UI'\">:</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Himadri</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Himachal</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Shiwalik</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Typical     feature of </span><span style=\"font-family:'Nirmala UI'\"><b>young     fold mountains formed by compression</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(4)    Steep gradients causing land-sliding — Correct</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Slopes     are </span><span style=\"font-family:'Nirmala UI'\"><b>very steep and     unstable</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Frequent </span><span style=\"font-family:'Nirmala UI'\"><b>landslides</b></span><span style=\"font-family:'Nirmala UI'\"> due     to:</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Unconsolidated      rocks</b></span></p>      </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Recent      formation (geologically young)</b></span></p>     </li></ul>    </li></ul>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family: ", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>(c)    One Hundred Years of Solitude</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>One    Hundred Years of Solitude</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Gabriel     Garcia Marquez</b></span><span style=\"font-family:'Nirmala UI'\"> received     the </span><span style=\"font-family:'Nirmala UI'\"><b>Nobel Prize in     Literature (1982)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Award     largely recognized this novel as his </span><span style=\"font-family:'Nirmala UI'\"><b>masterpiece</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Famous     for:</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Magic      realism</b></span></p>      </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Story      of the </span><span style=\"font-family:'Nirmala UI'\"><b>Buendía      family</b></span><span style=\"font-family:'Nirmala UI'\"> in the      fictional town </span><span style=\"font-family:'Nirmala UI'\"><b>Macondo</b></span></p>     </li></ul>    </li></ul>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">By which Constitutional Amendment    Act was the voting age reduced from 21 years to 18 years?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">61st Amendment Act, 1988</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">62nd Amendment Act, 1989</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">63rd Amendment Act, 1989</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">64th Amendment Act, 1990</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>(a)    61st Amendment Act, 1988</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>61st    Amendment Act, 1988</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Reduced </span><span style=\"font-family:'Nirmala UI'\"><b>voting     age from 21 years to 18 years</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Amended </span><span style=\"font-family:'Nirmala UI'\"><b>Article     326</b></span><span style=\"font-family:'Nirmala UI'\"> of the     Constitution</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Aim:</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Increase      youth participation in democracy</b></span></p>      </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Expand </span><span style=\"font-family:'Nirmala UI'\"><b>electoral      base</b></span></p>     </li></ul>    </li></ul>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following vitamins is    considered a hormone?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Vitamins A</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Vitamins B</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Vitamins C</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Vitamins D</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Vitamin D</b></span><span style=\"font-family:'Nirmala UI'\"> is    considered a </span><span style=\"font-family:'Nirmala UI'\"><b>hormone</b></span><span style=\"font-family:'Nirmala UI'\">.    It </span><span style=\"font-family:'Nirmala UI'\"><b>contains    calciferol</b></span><span style=\"font-family:'Nirmala UI'\">. In animals,    there are two active forms of vitamin D – Cholecalciferol and    Ergocalciferol. Cholecalciferol is synthesized in the animal body    itself, but the process is complex. Ergocalciferol is synthesized    by yeast cells from a substance called ergosterol under the    influence of ultraviolet rays of sunlight</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">An artificial satellite orbiting    around the Earth does not fall down. This is so because the    attraction of Earth:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Does not exist at such distance</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Is neutralized by the attraction of    the moon</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Provides the necessary speed for    its steady motion</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Provides the necessary acceleration    for its motion</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>(d)    Provides the necessary acceleration for its motion</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Provides    the necessary acceleration</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Earth’s     gravity acts as </span><span style=\"font-family:'Nirmala UI'\"><b>centripetal     force</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     provides </span><span style=\"font-family:'Nirmala UI'\"><b>continuous     inward acceleration</b></span><span style=\"font-family:'Nirmala UI'\"> toward     Earth</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This     keeps the satellite in </span><span style=\"font-family:'Nirmala UI'\"><b>circular     orbit</b></span><span style=\"font-family:'Nirmala UI'\"> instead of     falling</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,     satellite is in </span><span style=\"font-family:'Nirmala UI'\"><b>constant     free fall but keeps missing Earth</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Concept</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Satellite     stays in orbit due to centripetal acceleration by gravity</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Not     because gravity is absent</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In which Indian state is the Onam    festival celebrated, and why is it celebrated?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Tamil Nadu – It is celebrated to    mark the homecoming of King Ram.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Karnataka – It is celebrated to    honour the victory of Lord Rama over Ravana.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kerala – It is celebrated to mark    the homecoming of King Mahabali, as per local legends.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Andhra Pradesh – It is celebrated    to mark the arrival of the monsoon season.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>(c)    Kerala – It is celebrated to mark the homecoming of King    Mahabali, as per local legends.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Kerala    — Correct</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Onam</b></span><span style=\"font-family:'Nirmala UI'\"> is     celebrated in </span><span style=\"font-family:'Nirmala UI'\"><b>Kerala</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Marks     the </span><span style=\"font-family:'Nirmala UI'\"><b>annual     homecoming of King Mahabali (Maveli)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Based     on legend:</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Mahabali      was a </span><span style=\"font-family:'Nirmala UI'\"><b>benevolent      Asura king</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Allowed      to visit his people once a year</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Celebrated     with:</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pookalam      (flower rangoli)</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Onam      Sadya (traditional feast)</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Boat      races (Vallam Kali)</b></span></p>     </li></ul>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Important    Facts</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Onam     is a </span><span style=\"font-family:'Nirmala UI'\"><b>harvest     festival</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Celebrated     in </span><span style=\"font-family:'Nirmala UI'\"><b>Malayalam month     Chingam (Aug–Sept)</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Associated     with </span><span style=\"font-family:'Nirmala UI'\"><b>Vamana avatar     of Lord Vishnu and King Mahabali</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Choose the most appropriate word    for the description: <br> <br> A person who is or claims to    be a professional with specialized knowledge but is actually a    fraud or an impostor.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">virtuoso</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">charlatan</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">connoisseur</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">dilettante</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>charlatan</b></span><span style=\"font-family:'Nirmala UI'\">-     refers to a person falsely claiming to have a special knowledge     or skill; a fraud.</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Synonyms</b></span><span style=\"font-family:'Nirmala UI'\">-      Quack, Sham, Fraud, Impostor, Mountebank</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Antonyms</b></span><span style=\"font-family:'Nirmala UI'\">-      Professional, Authority, Expert, Adept, Specialist</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>connoisseur</b></span><span style=\"font-family:'Nirmala UI'\"> -     an expert judge in matters of taste, such as fine art, wine, or     cuisine.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>virtuoso</b></span><span style=\"font-family:'Nirmala UI'\"> -     describes a person highly skilled in music or another artistic     pursuit.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>dilettante</b></span><span style=\"font-family:'Nirmala UI'\"> -     a person who cultivates an area of interest, such as the arts,     without real commitment or knowledge.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    option B is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the option that best    expresses the meaning of the idiom “in the offing” as used in    the sentence below.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><br> Given    the recent diplomatic movements and military mobilization near the    border, it appears that a major geopolitical shift is in the    offing.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Completely abandoned</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Under severe criticism</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Imminent but not yet visible</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Officially declared</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     idiom </span><span style=\"font-family:'Nirmala UI'\"><b>“in the     offing”</b></span><span style=\"font-family:'Nirmala UI'\"> means </span><span style=\"font-family:'Nirmala UI'\"><b>something     that is going to happen soon</b></span><span style=\"font-family:'Nirmala UI'\">,     especially something that can be expected or is likely to occur     in the near future.</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Origin:      In old sailing days, the </span><span style=\"font-family:'Nirmala UI'\"><b>“offing”</b></span><span style=\"font-family:'Nirmala UI'\"> referred      to the </span><span style=\"font-family:'Nirmala UI'\"><b>part of the      sea visible from the shore but still at a distance</b></span><span style=\"font-family:'Nirmala UI'\">.      Ships that were </span><span style=\"font-family:'Nirmala UI'\"><b>in      the offing</b></span><span style=\"font-family:'Nirmala UI'\"> could      be seen coming toward the harbor but had </span><span style=\"font-family:'Nirmala UI'\"><b>not      yet arrived</b></span><span style=\"font-family:'Nirmala UI'\">. So, if a      ship was </span><span style=\"font-family:'Nirmala UI'\"><b>in the      offing</b></span><span style=\"font-family:'Nirmala UI'\">, it meant: It      was </span><span style=\"font-family:'Nirmala UI'\"><b>on the way</b></span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In     the sentence, diplomatic movements and military mobilization     are </span><span style=\"font-family:'Nirmala UI'\"><b>signs</b></span><span style=\"font-family:'Nirmala UI'\">,     which means the geopolitical shift has </span><span style=\"font-family:'Nirmala UI'\"><b>not     happened yet</b></span><span style=\"font-family:'Nirmala UI'\">, but it     is </span><span style=\"font-family:'Nirmala UI'\"><b>likely to happen     soon</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option C is the correct answe      </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Sentences of a paragraph are    jumbled. Arrange them in the correct order.</b></span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">As     a result, productivity declines and the quality of work suffers     significantly.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Many     employees today struggle to maintain a balance between their     professional and personal lives.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Continuous     stress and long working hours often lead to mental and physical     exhaustion.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Therefore,     organizations must adopt policies that promote work-life balance     and employee well-being.</span></p>    </li></ol>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2-3-1-4</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3-2-1-4</span></p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">2-1-3-4</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3-1-2-4</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence     2</b></span><span style=\"font-family:'Nirmala UI'\"> – Introduces     the main topic: employees struggling with work-life balance.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence     3</b></span><span style=\"font-family:'Nirmala UI'\"> – Explains the     reason: stress and long working hours cause exhaustion.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence     1</b></span><span style=\"font-family:'Nirmala UI'\"> – Gives the     result: productivity declines and work quality suffers.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence     4</b></span><span style=\"font-family:'Nirmala UI'\"> – Concludes     with the solution: organizations should promote work-life     balance.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Logical     Flow:</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Problem    </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    Cause </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    Result </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    Solution</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Correct    Order:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>2    </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    3 </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    1 </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    4</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option A is the correct answer.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Change the following sentence    into indirect speech:</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    officer said to the clerk, “If you do not submit the documents    today, the application will not be processed.”</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The officer told the clerk that if    he did not submit the documents that day, the application would    not be processed.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The officer told the clerk that if    you do not submit the documents today, the application will not be    processed.<br> </span><br>     </p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The officer said that if he does    not submit the documents today, the application would not be    processed.<br> </span><br>     </p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The officer told the clerk if he    had not submitted the documents that day, the application would    not be processed.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>reporting     verb:</b></span><span style=\"font-family:'Nirmala UI'\"> \"said     to\" changes into \"told\". (for     statements), </span><span style=\"font-family:'Nirmala UI'\"><b>asked/enquired</b></span><span style=\"font-family:'Nirmala UI'\"> (for     questions), or </span><span style=\"font-family:'Nirmala UI'\"><b>requested/ordered</b></span><span style=\"font-family:'Nirmala UI'\"> (for     imperatives).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>tense     shift:</b></span><span style=\"font-family:'Nirmala UI'\"> move the     tense one step back (e.g., </span><span style=\"font-family:'Nirmala UI'\"><b>is/am/are</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>was/were</b></span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-family:'Nirmala UI'\"><b>will</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>would</b></span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-family:'Nirmala UI'\"><b>do     not</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>did     not</b></span><span style=\"font-family:'Nirmala UI'\">).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>pronoun     change:</b></span><span style=\"font-family:'Nirmala UI'\"> change </span><span style=\"font-family:'Nirmala UI'\"><b>I/me/you</b></span><span style=\"font-family:'Nirmala UI'\"> based     on who is speaking and who is being spoken to (</span><span style=\"font-family:'Nirmala UI'\"><b>s.o.n.</b></span><span style=\"font-family:'Nirmala UI'\"> rule).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>time/place     markers:</b></span><span style=\"font-family:'Nirmala UI'\"> change </span><span style=\"font-family:'Nirmala UI'\"><b>today</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>that     day</b></span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-family:'Nirmala UI'\"><b>tomorrow</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>the     next day</b></span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-family:'Nirmala UI'\"><b>here</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>there</b></span><span style=\"font-family:'Nirmala UI'\">,     and </span><span style=\"font-family:'Nirmala UI'\"><b>now</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>then</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>conditionals:</b></span><span style=\"font-family:'Nirmala UI'\"> in     \"if\" clauses, the tense changes (e.g., </span><span style=\"font-family:'Nirmala UI'\"><b>if     I do</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>if     I did</b></span><span style=\"font-family:'Nirmala UI'\">), but the third     conditional (</span><span style=\"font-family:'Nirmala UI'\"><b>if I had     done</b></span><span style=\"font-family:'Nirmala UI'\">) usually remains     the same.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option A is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Identify the incorrectly spelled    word in the following sentence:</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    scientist’s hypothesis was rigorously tested to ensure its    accurracy before publication.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">scientist’s</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">hypothesis</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">accurracy</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">publication</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Scientist’s</b></span><span style=\"font-family:'Nirmala UI'\"> –     possessive form of scientist (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>वैज्ञानिक     का</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Hypothesis</b></span><span style=\"font-family:'Nirmala UI'\"> –     proposed explanation for a phenomenon (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>परिकल्पना     </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/     </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>अनुमान</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Accurracy</b></span><span style=\"font-family:'Nirmala UI'\"> – </span><span style=\"font-family:'Nirmala UI'\"><b>incorrect     spelling</b></span><span style=\"font-family:'Nirmala UI'\">,</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">correct      form: </span><span style=\"font-family:'Nirmala UI'\"><b>accuracy</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>सटीकता      </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/ </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>सही      होना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Publication</b></span><span style=\"font-family:'Nirmala UI'\"> –     the act of publishing (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>प्रकाशन</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option C is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate word    for the description:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">A    persistent and irrational fear of being in a situation where one    cannot escape, often leading to the avoidance of open spaces or    crowded places.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">claustrophobia</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">acrophobia</span></p>", "option3
