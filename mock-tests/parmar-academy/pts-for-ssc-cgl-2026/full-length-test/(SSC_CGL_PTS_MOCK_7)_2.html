<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>14.) SSC CGL PTS  MOCK 7 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

ms: </b></span><span>Methodical,      systematic, steadfast, unwavering, assiduous</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Aimless     (</b></span><span style=\"font-family:'Nirmala UI'\"><span><b>उद्देश्यहीन</b></span></span><b>)     –</b><span><b> </b></span><span>Without     purpose or direction.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Systematic     (</b></span><span style=\"font-family:'Nirmala UI'\"><span><b>व्यवस्थित</b></span></span><b>)     –</b><span><b> </b></span><span>Done     according to a fixed plan or organized method.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Careful     (</b></span><span style=\"font-family:'Nirmala UI'\"><span><b>सावधान</b></span></span><b>)     –</b><span><b> </b></span><span>Taking     great care to avoid mistakes</span><span><b>.</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span><b>Energetic     (</b></span><span style=\"font-family:'Nirmala UI'\"><span><b>ऊर्जावान</b></span></span><b>)     –</b><span><b> </b></span><span>Full     of energy and activity.<br> Hence, Option B is the correct     answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the most appropriate antonym of the word    \"Antediluvian\".</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Autochthonous</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Primordial</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Voguish</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Superannuated</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Antediluvian:     Extremely old, outdated, ancient, old-fashioned (</b></span><span style=\"font-family:'Nirmala UI'\"><span><b>बहुत     पुराना </b></span></span><b>/ </b><span style=\"font-family:'Nirmala UI'\"><span><b>प्राचीन     </b></span></span><b>/ </b><span style=\"font-family:'Nirmala UI'\"><span><b>पुरातन</b></span></span><b>)</b></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Synonyms:</b></span><span> antiquated,      archaic, obsolete, old-fashioned, ancient, outdated</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Antonyms:</b></span><span> modern,      contemporary, current, fashionable</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Autochthonous</b></span><span> –     native, indigenous, original inhabitant (</span><span style=\"font-family:'Nirmala UI'\"><span>मूल     निवासी</span></span>)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Primordial</b></span><span> –     earliest, primitive, original (</span><span style=\"font-family:'Nirmala UI'\"><span>आदिम     </span></span>/ <span style=\"font-family:'Nirmala UI'\"><span>प्रारंभिक</span></span>)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Voguish </b></span><span>–     trendy, modern, fashionable</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Superannuated</b></span><span> –     outdated, obsolete, too old to be useful (</span><span style=\"font-family:'Nirmala UI'\"><span>पुराना     </span></span>/ <span style=\"font-family:'Nirmala UI'\"><span>अप्रचलित</span></span>)</p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span>Hence, Option    C is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>Select the most appropriate meaning of the    underlined idiom in the given sentence.</b></span></p>    <p style=\"orphans:0;widows:0\"><span>Despite    repeated setbacks and criticism, the young entrepreneur decided    to </span><span><u>weather the storm</u></span><span> and    continue building his startup.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>escape from danger</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>complain loudly about problems</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>face difficulties bravely and patiently</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>give up under pressure</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Weather     the storm</b></span><span> = to endure a     difficult or challenging situation with courage and patience     until it passes</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option C is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the most appropriate synonyms of :    \"Relish\"</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Detest</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Enjoy</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Ignore</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Avoid</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Relish</b></span><span> - </span><span><b>to     enjoy something greatly or take great pleasure in it</b></span><span> (</span><span style=\"font-family:'Nirmala UI'\"><span>आनंद     लेना </span></span>/ <span style=\"font-family:'Nirmala UI'\"><span>पसंद     करना</span></span>)</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Synonyms:</b></span><span> savor,      appreciate, delight in, love</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Antonyms:</b></span><span> detest,      dislike, hate, loathe, abhor</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Detest</b></span><span> –     to hate intensely (</span><span style=\"font-family:'Nirmala UI'\"><span>घृणा     करना</span></span>)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Enjoy</b></span><span> –     to take pleasure in (</span><span style=\"font-family:'Nirmala UI'\"><span>आनंद     लेना</span></span>)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Ignore</b></span><span> –     to pay no attention to (</span><span style=\"font-family:'Nirmala UI'\"><span>अनदेखा     करना</span></span>)</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Avoid</b></span><span> –     to keep away from (</span><span style=\"font-family:'Nirmala UI'\"><span>बचना</span></span>)</p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Directions: Read the sentence to find out    whether there is any grammatical or idiomatic error in it.</span><span><b> </b></span><span>Mark    the parts with the error as your answer</span><span><b>. </b></span><span>(Ignore    errors of punctuation, if any)<br> </span><br>     </p>    <p style=\"orphans:0;widows:0\"><span>The latest    edition was more preferable (A)/ to the previous one (B)/ because    of its updated content (C)/ and improved illustrations. (D)</span></p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>The latest edition was more preferable</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>to the previous one</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>because of its updated content</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>and improved illustrations.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     adjective </span><span><b>\"preferable\"</b></span><span> is     itself a </span><span><b>comparative adjective</b></span><span>,     so it </span><span><b>should not be preceded by     \"more.\"</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>more     preferable (wrong)<br> preferable (correct)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Correct     sentence</b></span><span>- The latest edition was     preferable to the previous one because of its updated content and     improved illustrations.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Some     adjectives already express a comparative meaning and </span><span><b>do     not take \"more.\"</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Examples:</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>more      superior </span><span><span>→</span></span><span>      superior</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>more      preferable </span><span><span>→</span></span><span>       preferable</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>more      unique </span><span><span>→</span></span><span>       unique</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>more      perfect </span><span><span>→</span></span><span>       perfect</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Choose the correct option for the voice change    in the following question</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><span>Why wasn't the    matter brought to my notice ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Why didn’t you bring the matter to my notice?</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Why you did not bring the matter to my notice?</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Why the matter was not brought to my notice ?</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Why the matter had not been brought to my    notice ?</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     sentence \"Why wasn't the matter brought to my notice?\"     is in the passive voice.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>To     change it to the active voice, the focus shifts to who should     have brought the matter forward, resulting in: \"</span><span><b>Why     didn't you bring the matter to my notice?\".</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     passive construction</span><span><b> \"was...     brought\" (to be + past participle) </b></span><span>becomes     the active simple past</span><span><b> \"did...     bring\".</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     implicit subject (you/they) becomes the explicit actor in the     active sentence.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span>Hence, Option    A is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Choose the correct narration change into direct    form for the following question:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><span>She told her    son that she was old and lonely and asked him if he had no pity on    her loneliness.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>She said to her son, “I am old and lonely.    Have you no pity on my loneliness?”</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>She said to her son, “I am old and lonely.    Can't you have pity on my loneliness?”</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>She said to her son, “I am old and lonely.    Hadn't you be pity on my loneliness?”</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>She said to her son, “I am old and lonely.    Don’t you have to be pity on my loneliness?”</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Original     (Indirect)</b></span><span>: She told her son that     she was old and lonely and asked him if he had no pity on her     loneliness.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Direct     Speech</b></span><span>: She said to her son, “I     am old and lonely. Have you no pity on my loneliness?”</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Converted     the declarative statement \"</span><span><b>that     she was old and lonely\" to direct speech \"I am old and     lonely\".</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Converted     the interrogative \"</span><span><b>asked him if     he had no pity\" to \"have you no pity\".</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Find the error in the following options    fragmented from the question into four parts marked as A, B, C and    D.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><span>A collapse of    the deal would not only (A) / exacerbate the Iran nuclear crisis    but also (B)/ set a bad precedence in international diplomacy (C)/    No error (D)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>A collapse of the deal would not only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>exacerbate the Iran nuclear crisis but also</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>set a bad precedence in international diplomacy</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>No error</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     error here is in fragment C as the correct word is </span><span><b>precedent     and not precedence.</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Precedence</b></span><span> </span><span><span>→</span></span><span>      Priority / coming before</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Precedent</b></span><span> </span><span><span>→</span></span><span>      Example / earlier case</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Correct</b></span><span>:     A collapse of the deal would not only exacerbate the Iran nuclear     crisis but also set a bad </span><span><b>precedent</b></span><span> in     international diplomacy.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option C is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Directions: Read the following passage    carefully and answer the questions given below.</span></p>    <p style=\"orphans:0;widows:0\"><span>Many people    believe that success depends mainly on talent, but talent alone    rarely guarantees achievement. A gifted musician who never    practises is unlikely to perform well on stage, while an average    musician who practises regularly can steadily improve. The same    principle applies to almost every field of life. Consistent    effort, discipline, and the willingness to learn from mistakes    often matter more than natural ability. Failure should not always    be viewed as a sign of weakness. Instead, it can serve as a    valuable teacher. Every mistake provides an opportunity to    identify shortcomings and develop better strategies. Many    successful people have admitted that their greatest lessons came    from their failures rather than their victories. At the same time,    success requires patience. In today's fast-paced world, people    often expect immediate results and become discouraged when    progress is slow. However, meaningful achievements usually take    time. Those who remain focused on their goals, despite temporary    setbacks, are more likely to succeed in the long run.<br> <br> What    is the main idea of the passage?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Talent is more important than hard work.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Success depends only on luck.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Consistent effort, learning from failure, and    patience are essential for success.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Success comes quickly if one is naturally    talented.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     passage repeatedly emphasizes that </span><span><b>hard     work, discipline, learning from failures, and patience</b></span><span> contribute     more to success than talent alone.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Option     A</b></span><span> is incorrect because the     passage says talent alone is not enough.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Option     B</b></span><span> is incorrect because luck is     never mentioned as the key factor.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Option     D</b></span><span> is incorrect because the     passage states that success usually takes time.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option C is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Directions: Read the following passage    carefully and answer the questions given below.</span></p>    <p style=\"orphans:0;widows:0\"><span>Many people    believe that success depends mainly on talent, but talent alone    rarely guarantees achievement. A gifted musician who never    practises is unlikely to perform well on stage, while an average    musician who practises regularly can steadily improve. The same    principle applies to almost every field of life. Consistent    effort, discipline, and the willingness to learn from mistakes    often matter more than natural ability. Failure should not always    be viewed as a sign of weakness. Instead, it can serve as a    valuable teacher. Every mistake provides an opportunity to    identify shortcomings and develop better strategies. Many    successful people have admitted that their greatest lessons came    from their failures rather than their victories. At the same time,    success requires patience. In today's fast-paced world, people    often expect immediate results and become discouraged when    progress is slow. However, meaningful achievements usually take    time. Those who remain focused on their goals, despite temporary    setbacks, are more likely to succeed in the long run.<br> <br> According    to the passage, failure should be viewed as:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>A permanent obstacle.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>A reason to quit.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>An opportunity to learn and improve</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Proof of lack of talent</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     passage states: </span><span><b>\"Failure     should not always be viewed as a sign of weakness. Instead, it     can serve as a valuable teacher.\"</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>This     clearly indicates that failure helps people recognize mistakes     and improve.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Option     A</b></span><span> is incorrect because failure     is not described as permanent.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Option     B</b></span><span> is incorrect because the     passage encourages perseverance.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Option     D</b></span><span> is incorrect because failure     does not necessarily indicate lack of talent.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option C is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"orphans:0;widows:0;margi earn from mistakes    often matter more than natural ability. Failure should not always    be viewed as a sign of weakness. Instead, it can serve as a    valuable teacher. Every mistake provides an opportunity to    identify shortcomings and develop better strategies. Many    successful people have admitted that their greatest lessons came    from their failures rather than their victories. At the same time,    success requires patience. In today's fast-paced world, people    often expect immediate results and become discouraged when    progress is slow. However, meaningful achievements usually take    time. Those who remain focused on their goals, despite temporary    setbacks, are more likely to succeed in the long run.<br> <br> Which    of the following best describes the author's attitude?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Humorous</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Pessimistic</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Critical</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Motivational</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     author encourages readers to value </span><span><b>hard     work, patience, perseverance, and learning from mistakes</b></span><span>.     The tone is positive and inspiring.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Humorous</b></span><span> –     The passage is not intended to amuse.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Pessimistic</b></span><span> –     The author expresses hope and encouragement.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Motivational</b></span><span> –     The passage inspires readers to keep trying despite setbacks.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Critical</b></span><span> –     The passage is not mainly criticizing people.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option D is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Choose the correct option for the voice change    of the following question</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><span>I know that he    did the work.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>It is known to me that the work was done by    him.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>That the work was done by him is known by me.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>He did the work is known to me.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>The work done by him is known to me.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     active voice of \"It is known to me that the work was done by     him.\" is \"</span><span><b>I know that he     did the work</b></span><span>\". In this     transformation, the passive structure \"</span><span><b>is     known to me</b></span><span>\" changes to the     active form “I know.”</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Choose the correct option for the narration    change in the following question</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><span>His mother    exclaimed in sorrow that she had not a bit of bread to give him    and that he had eaten up all the provisions she had in the house    the previous day.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>His mother said, “Alas! I have not a bit of    bread to give you. You ate up all the provisions I had in the    house yesterday.”</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>His mother exclaimed with sorrow, “Alas! I    had not a bit of bread to give you. You ate up all the provisions    I had in the house yesterday.”</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>His mother said, “Alas! I have not a bit of    bread to give you. You eat up all the provisions I had in the    house yesterday.”<br> </span><br>     </p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>His mother said, “I have not a bit of bread    to give you. You ate up all the provisions I had in the house    yesterday.”</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Indirect     speech: </b></span><span>His mother exclaimed     in sorrow that she had not a bit of bread to give him and that he     had eaten up all the provisions she had in the house the previous     day\"</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Direct     speech</b></span><span>: His mother said, \"Alas!     I have not a bit of bread to give you. You ate up all the     provisions I had in the house yesterday.\"</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Key     changes made-</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Exclaimed      in sorrow becomes \"Alas!...\"</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>she      </span><span><span>→</span></span><span>      I</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>him      </span><span><span>→</span></span><span>      you</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>previous      day </span><span><span>→</span></span><span>      yesterday</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Past      Perfect changes back to Simple Past because the original speech      occurred in Simple Past.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"orphans:0;widows:0\">    <span>Choose the word which is most opposite in    meaning to the given word:<br> Invective</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Whisper</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Praise</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Explosion</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Silence</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Invective</b></span><span> means </span><span><b>harsh,     abusive, or insulting language</b></span><span> (</span><span style=\"font-family:'Nirmala UI'\"><span>कटु     आलोचना </span></span>/ <span style=\"font-family:'Nirmala UI'\"><span>अपशब्द</span></span>)</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Synonyms</b></span><span>:      Fulmination, obloquy, diatribe, philippic, denunciation</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Antonyms</b></span><span>:      Encomium, panegyric, plaudit, approbation.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Praise </b></span><span>–     Expression of approval or admiration.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Explosion </b></span><span>–     A sudden violent outburst (literal or figurative).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Silence </b></span><span>–     Complete absence of sound.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Whisper </b></span><span>–     Speaking very softly.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Select the most appropriate meaning of the    underlined idiom in the given sentence.</span></p>    <p style=\"orphans:0;widows:0\"><span>The lawyer has    the </span><span><u>gift of the gab</u></span><span>,    which helps him convince the jury with ease.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>The ability to speak persuasively and fluently</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>The habit of speaking without thinking</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>The talent for writing excellent stories</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>The ability to keep secrets</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Gift     of the gab</b></span><span> means </span><span><b>the     natural ability to speak confidently, fluently, and     persuasively</b></span><span> (</span><span style=\"font-family:'Nirmala UI'\"><span>वाक्पटुता     </span></span>/ <span style=\"font-family:'Nirmala UI'\"><span>प्रभावशाली     बोलने की क्षमता</span></span>).</p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Origin-      The idiom </span><span><b>\"gift of the      gab\"</b></
