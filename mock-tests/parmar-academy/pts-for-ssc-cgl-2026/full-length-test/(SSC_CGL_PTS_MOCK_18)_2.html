<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>36.) SSC CGL PTS  MOCK 18 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

estion": "\r\n<p style=\"orphans:0;widows:0\"><span>Select the option that is closest in meaning to the given word.</span></p>\r\n\r\n<p style=\"orphans:0;widows:0\"><span>MORDANT</span></p>", "option1": "<p style=\"orphans:0;widows:0\"><span>Caustic</span></p>", "option2": "\r\n<p style=\"orphans:0;widows:0\"><span>Benign</span></p>", "option3": "\r\n<p style=\"orphans:0;widows:0\"><span>Placid</span></p>", "option4": "\r\n<p style=\"orphans:0;widows:0\"><span>Tactful</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\r\n<p style=\"orphans:0;widows:0\"><span>The correct answer is Option 1.<br />\r\nKey Points<br />\r\n&bull; Mordant describes speech, writing or humour that is sharply critical, biting or sarcastic.<br />\r\nAdditional Information<br />\r\nMeaning:<br />\r\n&bull; Mordant (Adjective): Harshly critical; biting in style or tone; sharply sarcastic.<br />\r\nExplanation:<br />\r\n&bull; Caustic means sarcastic, severely critical or cutting in expression, making it the closest synonym of mordant.<br />\r\nExample:<br />\r\n&bull; The columnist was known for his mordant observations on political hypocrisy.<br />\r\nNearby/Related Vocabulary:<br />\r\n&bull; Acerbic, Sardonic, Scathing, Vitriolic, Cutting<br />\r\nWhy other options are incorrect:<br />\r\n&bull; Benign &ndash; Gentle and harmless; opposite in tone.<br />\r\n&bull; Placid &ndash; Calm and peaceful; unrelated to criticism.<br />\r\n&bull; Tactful &ndash; Careful not to offend others; opposite of biting or sarcastic.</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the option that is closest in meaning to    the given word.LUGUBRIOUS</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Melancholy</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Jubilant</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Capricious</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Resolute</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>The correct answer is Option 1.<br> Key    Points<br> • Lugubrious refers to someone or something that    appears excessively sad, mournful or gloomy.<br> Additional    Information<br> Meaning:<br> • Lugubrious (Adjective): Looking    or sounding sad and dismal; mournful.<br> Explanation:<br> •    Melancholy means deeply sad or sorrowful and is the closest    synonym of lugubrious.<br> Example:<br> • His lugubrious tone    made everyone believe that the situation was    hopeless.<br> Nearby/Related Vocabulary:<br> • Doleful,    Woeful, Gloomy, Mournful, Dismal<br> Why other options are    incorrect:<br> • Jubilant – Extremely joyful; opposite in    meaning.<br> • Capricious – Given to sudden, unpredictable    changes; unrelated.<br> • Resolute – Firm and determined;    unrelated to sadness.</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the option that is opposite in meaning    to the given word.MUNIFICENT</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Benevolent</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Magnanimous</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Penurious</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Charitable</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>The correct answer is Option 3.<br> Key    Points<br> • Munificent refers to someone who is extremely    generous, especially in giving money, gifts or support.<br> Additional    Information<br> Meaning:<br> • Munificent (Adjective): Very    generous; lavish in giving.<br> Explanation:<br> • Penurious    means excessively unwilling to spend money; miserly or stingy.    Hence, it is the opposite of munificent.<br> Example:<br> •    Despite his immense wealth, the businessman remained penurious in    helping charitable causes.<br> Synonyms:<br> • Generous,    Liberal, Bountiful, Lavish, Open-handed<br> Antonyms:<br> •    Penurious, Miserly, Stingy, Parsimonious, Niggardly<br> Why other    options are incorrect:<br> • Benevolent – Kind and generous;    similar in meaning.<br> • Magnanimous – Noble and generous in    spirit; similar in meaning.<br> • Charitable – Generous    towards those in need; similar in meaning.</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the option that best expresses the    meaning of the given idiom.To trim one's sails</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>To adapt one's behaviour according to changing    circumstances</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>To waste time on trivial matters</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>To reveal a closely guarded secret</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>To take unnecessary financial risks</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>The correct answer is Option 1.<br> Key    Points<br> • To trim one's sails means to modify one's    attitude, behaviour or plans in order to suit changing conditions    or circumstances.<br> Additional Information<br> Meaning:<br> •    To trim one's sails: To adapt oneself wisely to a new situation    for advantage or survival.<br> Explanation:<br> • The idiom    originates from sailing, where adjusting the sails according to    the direction of the wind ensures smoother navigation.    Figuratively, it refers to changing one's approach to suit    prevailing conditions.<br> Example:<br> • Realising that    market conditions had changed, the company trimmed its sails by    focusing on affordable products.<br> Similar Idioms:<br> •    Bend with the wind, Go with the flow, Change course, Roll with the    punches<br> Why other options are incorrect:<br> • To waste    time on trivial matters – Unrelated to adaptation.<br> • To    reveal a closely guarded secret – Refers to disclosure, not    adjustment.<br> • To take unnecessary financial risks –    Opposite to the cautious adaptation implied by the idiom.</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the correctly spelt word.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Exhorbitant</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Exorbitent</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Exhorbitent</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Exorbitant</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>The correct answer is Option 4.<br> Key    Points<br> • Exorbitant is the correct spelling.<br> • It is    frequently asked in competitive examinations because of the    confusion between or/hor and -ant/-ent endings.<br> Additional    Information<br> Meaning:<br> • Exorbitant (Adjective):    Excessively high; much more than what is reasonable or    acceptable.<br> Explanation:<br> • The word is derived from    the Latin exorbitare ('to deviate from the proper course'). It is    always spelt Ex-or-bit-ant.<br> Example:<br> • The hotel    charged an exorbitant fee during the holiday    season.<br> Nearby/Related Vocabulary:<br> • Excessive,    Extravagant, Inflated, Outrageous, Prohibitive<br> Why other    options are incorrect:<br> • Exhorbitant – Incorrect    insertion of h.<br> • Exorbitent – Incorrect ending -ent.<br> •    Exhorbitent – Contains both spelling errors.</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the correctly spelt word.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Miscellanious</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Miscellaneous</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Miscellanous</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Miscelaneous</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>The correct answer is Option 2.<br> Key    Points<br> • Miscellaneous is the correct spelling.<br> • It    is commonly misspelt due to the placement of double l, double s,    and the suffix -eous.<br> Additional Information<br> Meaning:<br> •    Miscellaneous (Adjective): Consisting of various kinds; diverse;    mixed.<br> Explanation:<br> • The correct spelling is    Mis-cel-la-ne-ous, containing double l, double s, and ending with    -eous.<br> Example:<br> • The final chapter contains    miscellaneous facts that do not fit into earlier    sections.<br> Nearby/Related Vocabulary:<br> • Assorted,    Diverse, Varied, Heterogeneous, Mixed<br> Why other options are    incorrect:<br> • Miscellanious – Incorrect -ious ending.<br> •    Miscellanous – Missing e before ous.<br> • Miscelaneous –    Missing one l and one s.</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the option that expresses the given    phrase in one word.A person who studies and interprets    inscriptions.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Numismatist</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Epigrapher</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Palaeontologist</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Lexicographer</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>The correct answer is Option 2.<br> Key    Points<br> • An Epigrapher is a specialist who studies,    deciphers and interprets inscriptions engraved on stone, metal,    wood or other durable materials.<br> Additional    Information<br> Meaning:<br> • Epigrapher (Noun): A scholar    who studies and interprets inscriptions.<br> Explanation:<br> •    Epigraphy is an important branch of archaeology and history that    helps reconstruct ancient political, social and cultural    developments through inscriptions.<br> Example:<br> • The    epigrapher successfully deciphered a Gupta-era inscription    discovered at the excavation site.<br> Related Vocabulary:<br> •    Epigraphy, Inscription, Archaeologist, Palaeography,    Decipherment<br> Why other options are incorrect:<br> •    Numismatist – Studies coins and currency.<br> •    Palaeontologist – Studies fossils and prehistoric life.<br> •    Lexicographer – Compiles dictionaries.</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the option that expresses the given    phrase in one word.A speech delivered without prior preparation.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Exposition</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Extempore</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Monologue</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Oration</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>The correct answer is Option 2.<br> Key    Points<br> • An Extempore speech is delivered spontaneously    without advance preparation or written notes.<br> Additional    Information<br> Meaning:<br> • Extempore (Adjective/Noun):    Spoken or performed without prior preparation;    impromptu.<br> Explanation:<br> • In competitive examinations,    extempore specifically refers to an impromptu speech where the    speaker is given a topic and speaks immediately with little or no    preparation.<br> Example:<br> • She impressed the judges with    her confident extempore speech on climate resilience.<br> Related    Vocabulary:<br> • Impromptu, Spontaneous, Unrehearsed,    Off-the-cuff, Improvised<br> Why other options are incorrect:<br> •    Exposition – A detailed<br> Explanation or description of an    idea.<br> • Monologue – A long speech by one person, not    necessarily unprepared.<br> • Oration – A formal and often    ceremonial speech, usually prepared.</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the most appropriate option to fill in    the blank.<br> The committee decided to ______ the proposal after    discovering that several crucial financial projections had been    deliberately exaggerated.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>ratify</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>shelve</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>expedite</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>endorse</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>The correct answer is Option 2.<br> Key    Points<br> • Shelve means to postpone, set aside, or abandon a    plan or proposal, especially because of problems or changed    circumstances.<br> Additional Information<br> Meaning:<br> •    Shelve (Verb): To postpone or abandon something for the time    being.<br> Explanation:<br> • Since the proposal contained    deliberately exaggerated financial projections, the committee    would logically shelve it rather than approve it.<br> Example:<br> •    The government shelved the infrastructure project until    environmental concerns were addressed.<br> Nearby/Related    Vocabulary:<br> • Defer, Postpone, Suspend, Table, Withhold<br> Why    other options are incorrect:<br> • Ratify – To approve    formally; opposite of the context.<br> • Expedite – To speed    up a process.<br> • Endorse – To support or approve    officially.</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:0;widows:0\">    <span>In the following sentence, identify the part    that contains an error.<br> Neither the managing director nor the    senior executives (A)/ was willing to accept (B)/ responsibility    for the losses (C)/ incurred during the audit. (D)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>A</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>B</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>C</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>D</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>The correct answer is Option 2.<br> Key    Points<br> • The sentence violates the Principle of Proximity    (also called the Rule of Nearer Subject) used with    Neither...nor.<br> Additional Information<br> Grammar Rule:<br> •    When two subjects are joined by Neither...nor, the verb agrees    with the subject nearest to it.<br> Explanation:<br> • The    subject nearest to the verb is the senior executives, which is    plural. Therefore, the verb should be were, not was.Correct    Sentence:Neither the managing director nor the senior executives    were willing to accept responsibility for the losses incurred    during the audit.<br> Example:<br> • Neither the teacher nor    the students were aware of the schedule.<br> Why the other parts    are correct:<br> • Part A correctly uses the correlative    conjunction Neither...nor.<br> • Part C is grammatically    correct and functions as the object of the verb.<br> • Part D    correctly modifies losses with the past participial phrase    incurred during the audit.</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the option that expresses the given    sentence in Passive Voice.The jury will have announced the verdict    before the judge arrives.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>The verdict will have announced before the    judge arrives.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>The verdict will have been announced before the    judge arrives.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>The verdict has been announced before the judge    arrives.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>The verdict will be announcing before the judge    arrives.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>The correct answer is Option 2.<br> Key    Points<br> • The given sentence is in the Future Perfect    Tense.<br> • Passive Voice of Future Perfect Tense is formed    as:Object + will have been + Past Participle (V³).<br> Additional    Information<br> Grammar Rule:Active: Subject + will have + V³ +    ObjectPassive: Object + will have been + V³ + (by +    Subject)<br> Explanation:<br> • The verdict becomes the    subject of the passive sentence.<br> • The verb will have    announced changes to will have been announced.<br> • The agent    (the jury) may be omitted because it is not    essential.<br> Example:Active: The committee will have completed    the report by Monday.Passive: The report will have been completed    by Monday.</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"orphans:0;widows:0\">    <span>In the following sentence, identify the part    that contains an error.<br> The report (A)/ is one of the few    official documents (B)/ that contains sufficient evidence (C)/ to    support the allegation. (D)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>A</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>B</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>C</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>D</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>The correct answer is Option 3.<br> Key    Points<br> • The error relates to subject–verb agreement in a    defining relative clause with \"one of the + plural noun +    that...\".<br> Additional Information<br> Grammar Rule:When    a relative clause introduced by that refers to the plural noun    after one of the, the verb in the relative clause must be    plural.<br> Explanation:<br> • In the sentence, that refers to    official documents, not to one.<br> • Therefore, the verb    should be contain, not contains.<br> Correct Sentence:The report    is one of the few official documents that contain sufficient    evidence to support the allegation.<br> Example:<br> • She is    one of the students who deserve recognition.<br> Why the other    parts are correct:<br> • Part A correctly introduces the    subject.<br> • Part B correctly uses the expression one of the    few + plural noun.<br> • Part D is grammatically correct and    completes the infinitive phrase modifying evidence.</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the most appropriate option to fill in    the blank.<br> The regulator warned that any attempt to ______    financial statements would attract severe legal consequences under    the new compliance framework.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>falsify</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>compile</span></p>", "option3": " <p style=\"orphans:0;wi   is only one component of responsible AI governance, not the sole    solution.<br> Why other options are incorrect:<br> • Option 1:    Correctly reflects the passage, which cites healthcare, weather    prediction and transportation as<br> Examples of AI's practical    applications.<br> • Option 2: Correctly states that several    countries are drafting AI governance frameworks focused on    transparency, accountability and human oversight.<br> • Option    4: Correctly reflects the passage's concerns regarding algorithmic    bias and privacy risks associated with AI systems.</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the option that expresses the given    sentence in Indirect Speech.<br> The officer said to the    witnesses, \"Have any of you seen the suspect before?\"</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>The officer asked the witnesses if any of them    had seen the suspect before.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>The officer asked the witnesses had any of them    seen the suspect before.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>The officer asked the witnesses whether had any    of them seen the suspect before.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>The officer told the witnesses whether any of    them have seen the suspect before.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>The correct answer is Option 1.<br> Key    Points<br> • The given sentence is an interrogative sentence    (Yes/No question) in the Present Perfect Tense.<br> • In    indirect speech, said to changes to asked, the conjunction    if/whether is used, the interrogative word order changes to    statement order, and Present Perfect changes to Past Perfect    because the reporting verb is in the past tense.<br> Additional    Information<br> Grammar Rule:<br> • Said to </span><span><span>→</span></span><span>    Asked (for questions)<br> • Use if/whether for Yes/No    questions.<br> • Present Perfect </span><span><span>→</span></span><span>    Past Perfect<br> • Question order </span><span><span>→</span></span><span>    Statement order<br> Explanation:Direct: The officer said to the    witnesses, \"Have any of you seen the suspect    before?\"Indirect: The officer asked the witnesses if any of    them had seen the suspect before.<br> Example:Direct: She said,    \"Have you finished the assignment?\"Indirect: She asked    if I had finished the assignment.</span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the option that expresses the given    sentence in Indirect Speech.<br> The scientist said, \"Alas!    The research data has been permanently lost.\"</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>The scientist exclaimed with sorrow that the    research data had been permanently lost.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>The scientist exclaimed with grief that the    research data has been permanently lost.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>The scientist said with sorrow that the    research data was permanently losing.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>The scientist exclaimed sorrowfully that the    research data is permanently lost.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>The correct answer is Option 1.<br> Key    Points<br> • The given sentence is an exclamatory sentence    expressing sorrow.<br> • The interjection \"Alas!\" is    replaced by \"exclaimed with sorrow\" in indirect    speech.<br> • Since the reporting verb is in the past tense,    Present Perfect Passive changes to Past Perfect    Passive.<br> Additional Information<br> Grammar Rule:<br> •    Alas! </span><span><span>→</span></span><span>    exclaimed with sorrow / grief<br> • Present Perfect Passive    (has been + V³) </span><span><span>→</span></span><span>    Past Perfect Passive (had been + V³)<br> • Remove the    exclamation mark and use that as the    conjunction.<br> Explanation:Direct: The scientist said, \"Alas!    The research data has been permanently lost.\"Indirect: The    scientist exclaimed with sorrow that the research data had been    permanently lost.<br> Example:Direct: She said, \"Alas! My    passport has been stolen.\"Indirect: She exclaimed with sorrow    that her passport had been stolen.</span></p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the option that expresses the given    sentence in Indirect Speech.<br> The coach said to the players,    \"Let us maintain our focus until the final whistle.\"</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>The coach suggested to the players that they    should maintain their focus until the final whistle.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>The coach ordered the players to maintain our    focus until the final whistle.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>The coach suggested the players to maintain    their focus until the final whistle.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>The coach requested the players that let them    maintain their focus until the final whistle.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\"><span>“Let us” expresses a suggestion involving    the speaker and the listeners.<br> In indirect speech, it changes    to “suggested/proposed that + subject + should + base    verb.”<br> Therefore: The coach suggested to the players that    they should maintain their focus until the final whistle.</span></p>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"orphans:0;widows:0\">    <span>In the following question, a sentence has been    divided into four parts. Arrange the parts in the correct order to    form a meaningful and grammatically correct paragraph.<br> A.    enabling organisations to respond more quickly to emerging    threats.<br> B. Modern cyber security increasingly relies on    artificial intelligence for real-time threat detection,<br> C.    yet experts caution that human supervision remains essential to    validate automated decisions,<br> D. especially when critical    infrastructure and sensitive data are involved.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>BADC</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>BCAD</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>BACD</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>BDAC</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>The correct answer is Option 3.<br> Key    Points<br> • B introduces the topic and forms the opening    clause.<br> • A logically follows by explaining the consequence    of AI-based threat detection.<br> • C introduces a contrast    using \"yet\", cautioning against complete reliance on    automation.<br> • D completes the idea by specifying the    situations in which human supervision becomes particularly    important.<br> Additional Information<br> Grammar Rule:<br> •    Introductory statement </span><span><span>→</span></span><span>    Logical consequence </span><span><span>→</span></span><span>    Contrast </span><span><span>→</span></span><span>    Supporting qualifier.<br> Explanation:<br> Correct Order: B </span><span><span>→</span></span><span>    A </span><span><span>→</span></span><span>    C </span><span><span>→</span></span><span>    D<br> Correct Paragraph:<br> Modern cyber security increasingly    relies on artificial intelligence for real-time threat detection,    enabling organisations to respond more quickly to emerging    threats, yet experts caution that human supervision remains    essential to validate automated decisions, especially when    critical infrastructure and sensitive data are involved.</span></p>", "question_heading": ""}, {"sr_no": 100, "question": " <p style=\"orphans:0;widows:0\">    <span>In the following question, a sentence has been    divided into four parts. Arrange the parts in the correct order to    form a meaningful and grammatically correct paragraph.<br> A.    making transparent governance and international cooperation    increasingly important.<br> B. As commercial space exploration    expands rapidly,<br> C. issues such as orbital congestion and    space debris are becoming global concerns,<br> D. requiring    policymakers to establish sustainable regulatory frameworks.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>BCDA</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>BACD</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>BDCA</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>CBDA</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>The correct answer is Option 1.<br> Key    Points<br> • B is the introductory dependent clause beginning    with \"As\".<br> • C presents the main consequence of    expanding commercial space exploration.<br> • D logically    follows, showing the need for regulatory action arising from those    concerns.<br> • A concludes the sentence by expressing the    broader implication of those regulatory needs.<br> Additional    Information<br> Grammar Rule:<br> • Dependent clause </span><span><span>→</span></span><span>    Main clause </span><span><span>→</span></span><span>    Present   initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>

</head>

  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

  } catch (err) {

  }

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
