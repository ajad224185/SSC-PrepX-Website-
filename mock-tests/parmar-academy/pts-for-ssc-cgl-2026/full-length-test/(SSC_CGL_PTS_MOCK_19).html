hat    patient data are protected by stringent privacy safeguards<br> C.    precision medicine has the potential to transform modern    healthcare systems<br> D. by integrating genomic analysis with    artificial intelligence-based diagnostic tools</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">CBDA</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">CDAB</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">BCDA</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">DCBA</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: (B)    CDAB<br> Solution:<br> C is the main clause and introduces the    central idea: precision medicine can transform modern healthcare    systems.<br> D explains the method by which this transformation    can occur: by integrating genomic analysis with AI-based    diagnostic tools.<br> A states the resulting benefit: reducing    unnecessary medical interventions through personalised treatment    strategies.<br> B gives the necessary condition: patient data    must be protected by stringent privacy safeguards.<br> Correct    order: C </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    D </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    A </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    B<br> Hence, the correct answer is Option (B) CDAB.</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The price of an item is first    increased by 20%, then decreased by x%, resulting in no net change    from the original price. Find x.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">14.28%</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">16.67%</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">18.5%</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">20%</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Let the price of an item = 100    units<br> ATQ,<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    100 × 120/100 × (100 - x)/100 = 100<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    (100 - x) = 250/3<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    x = 50/3<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    x = 16.67%</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Two numbers are in the ratio 4:7.    If 6 is added to the smaller and 6 is subtracted from the larger,    the ratio becomes 5:6. Find the sum of the two numbers.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">55</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">64</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">66</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">70</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    (4x + 6)/(7x - 6) = 5/6<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    6 × (4x + 6) = 5 × (7x - 6)<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    24x + 36 = 35x - 30<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    66 = 11x<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    x = 6<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    Sum of the numbers = 11 × 6 = 66</span></p>", "question_heading": ""}, {"sr_no": 53, "question": "  <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The total frequency and mean of the    following distribution are 50 and 52 respectively. Find (3m +    4n).<br> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786723825597_html_b3944de8885d0327.png\" width=\"450\" height=\"47\" > </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">86</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">78</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">82</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">90</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786723825597_html_916ca599ae79c6d5.png\" width=\"440\" height=\"153\" > <span style=\"font-family:'Nirmala UI'\"><br> Now,<br> </span><span style=\"font-family:'Cambria Math'\">∑</span><span style=\"font-family:'Nirmala UI'\">f    = 26 + m + n = 50<br> m + n = 24 ……………. (1)<br> And,    </span><span style=\"font-family:'Cambria Math'\">∑</span><span style=\"font-family:'Nirmala UI'\">fx    = 1280 + 30m + 90n = 50 × 52<br> 1280 + 30m + 90n = 2600<br> 30m    + 90n = 1320<br> m + 3n = 44…………. (2)<br> From equations    (1) &amp; (2),<br> n = 10 &amp; m = 14<br> Now, (3m + 4n) = 3 ×    14 + 4 × 10 = 42 + 40 = 82</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A, B and C invested in the ratio 3    : 4 : 5. After 4 months, A transferred one-third of his capital to    B. C's capital remained unchanged for the rest of the year. Find    the profit ratio.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6 : 13 : 14</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">8 : 15 : 16</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">9 : 16 : 17</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">7 : 14 : 15</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Investment (A : B : C) =    3 : 4 : 5<br> Profit (A : B : C)= (3 × 4 + 3 × 2/3 × 8) : (4 ×    4 + (3 × 1/3 + 4 ) × 8) : 5 × 12<br> = (3 × 4 + 2 × 8) : (4    × 4 + 5 × 8) : 5 × 12<br> = (12 + 16) : (16 + 40) : 60<br> =    28 : 56 : 60<br> = 7 : 14 : 15</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A sum of ₹15,000 was lent partly    at 6% and partly at 9% simple interest. The total interest earned    in 2 years was ₹2160. Find the sum lent at 9%.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">6000</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">5500</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">4000</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">6500</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Let Part = A (6%) and B    (9%)<br> Total rate % = 2160 × 100/(15000 × 2) = 7.2%<br> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786723825597_html_92a234ebac8f2e9e.png\" width=\"135\" height=\"156\" > <span style=\"font-family:'Nirmala UI'\"><br> B    = 15000 × 2/5 = 6000<br> Required amount = ₹6000</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A right triangular prism has a    triangular base with sides 6 cm, 8 cm and 10 cm. The length of the    prism is 15 cm. Find its total surface area.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">408 cm²</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">396 cm²</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">384 cm²</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">420 cm²</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786723825597_html_964439c402d8728c.png\" width=\"148\" height=\"134\" > <span style=\"font-family:'Nirmala UI'\"><br> Area    of triangular base = (1/2) × Base × Height<br> = (1/2) × 6 ×    8<br> = 24 cm²<br> Perimeter of base = (6 + 8 + 10)<br> = 24    cm<br> TSA = 2 × Area of triangular base + Perimeter of base ×    Length<br> = 2 × 24 + 24 × 15<br> = 48 + 360<br> = 408 cm²</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The cost price of 21 pens is equal    to the selling price of 14 pens, and the discount given on 24 pens    is equal to the profit earned on 8 pens. Find the difference    between profit percent and discount percent.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">40%</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">35%</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">45%</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">30%</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> 21 × CP = 14 × SP<br> </span><span style=\"font-family:'Cambria Math'\">⟹</span><span style=\"font-family:'Nirmala UI'\">    CP : SP = 2 : 3 = 6 : 9<br> Profit % = 1/2 × 100% = 50%<br> And    24 × Discount = 8 × Profit<br> </span><span style=\"font-family:'Cambria Math'\">⟹</span><span style=\"font-family:'Nirmala UI'\">    Discount : Profit = 1 : 3<br> </span><span style=\"font-family:'Cambria Math'\">⟹</span><span style=\"font-family:'Nirmala UI'\">    MP = 9 + 1 = 10<br> Discount % = 1/10 × 100% = 10%<br> Required    difference = 50% − 10% = 40%</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Fresh mangoes contain 68 percent    water while dry mangoes contain 20 percent water. How many    kilograms of fresh mangoes are required to obtain 40 kilograms of    dry mangoes?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">110 kg</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">120 kg</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">90 kg</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">100 kg</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Pulp in fresh mangoes =    Pulp in dry mangoes<br> Fresh mangoes × (100 - 68) % = Dry    mangoes × (100 – 20) %<br> Fresh mangoes × 32% = Dry mangoes    × 80%<br> Fresh mangoes × 32% = 40 × 80%<br> Fresh mangoes =    100 kg</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If x + 1/x = </span><span style=\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">3,    Find the value of x</span><span style=\"font-family:'Cambria Math'\">⁵⁴</span><span style=\"font-family:'Nirmala UI'\">    + 1/x</span><span style=\"font-family:'Cambria Math'\">⁴</span><span style=\"font-family:'Nirmala UI'\">²    + x</span><span style=\"font-family:'Cambria Math'\">⁷</span><span style=\"font-family:'Nirmala UI'\">²    + 1/x</span><sup><span style=\"font-family:'Nirmala UI'\">96</span></sup><span style=\"font-family:'Nirmala UI'\">.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">0</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">-2</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">-1</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> x + 1/x = </span><span style=\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">3<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    x</span><span style=\"font-family:'Cambria Math'\">⁶</span><span style=\"font-family:'Nirmala UI'\">    = −1<br> Now,<br> x</span><sup><span style=\"font-family:'Nirmala UI'\">54</span></sup><span style=\"font-family:'Nirmala UI'\"> +    1/x</span><span style=\"font-family:'Cambria Math'\">⁴</span><span style=\"font-family:'Nirmala UI'\">²    + x</span><sup><span style=\"font-family:'Nirmala UI'\">72</span></sup><span style=\"font-family:'Nirmala UI'\"> +    1/x</span><sup><span style=\"font-family:'Nirmala UI'\">96</span></sup><span style=\"font-family:'Nirmala UI'\"> =    (x</span><span style=\"font-family:'Cambria Math'\">⁶</span><span style=\"font-family:'Nirmala UI'\">)</span><sup><span style=\"font-family:'Nirmala UI'\">9</span></sup><span style=\"font-family:'Nirmala UI'\"> +    1/(x</span><span style=\"font-family:'Cambria Math'\">⁶</span><span style=\"font-family:'Nirmala UI'\">)</span><sup><span style=\"font-family:'Nirmala UI'\">7</span></sup><span style=\"font-family:'Nirmala UI'\"> +    (x</span><span style=\"font-family:'Cambria Math'\">⁶</span><span style=\"font-family:'Nirmala UI'\">)</span><sup><span style=\"font-family:'Nirmala UI'\">12</span></sup><span style=\"font-family:'Nirmala UI'\"> +    1/(x</span><span style=\"font-family:'Cambria Math'\">⁶</span><span style=\"font-family:'Nirmala UI'\">)</span><sup><span style=\"font-family:'Nirmala UI'\">16</span></sup><span style=\"font-family:'Nirmala UI'\"><br> =    (-1)</span><sup><span style=\"font-family:'Nirmala UI'\">9</span></sup><span style=\"font-family:'Nirmala UI'\"> +    1/(-1)</span><sup><span style=\"font-family:'Nirmala UI'\">7</span></sup><span style=\"font-family:'Nirmala UI'\"> +    (-1)</span><sup><span style=\"font-family:'Nirmala UI'\">12</span></sup><span style=\"font-family:'Nirmala UI'\"> +    1/(-1)</span><sup><span style=\"font-family:'Nirmala UI'\">16</span></sup><span style=\"font-family:'Nirmala UI'\"><br> =    -1 + 1/(-1) + 1 + 1/(1)<br> = -1 -1 + 1 + 1<br> = -2 + 2<br> =    0</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A can complete a piece of work in a    certain number of days. B can complete two-thirds of the same work    in three-fourths of the time taken by A. Working together, A and B    can complete the work in 24 days. In how many days will B alone    complete the work?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">54 days</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">51 days</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">48 days</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">45 days</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Time (A : B) = 4 : 3 ×    3/2 = 8 : 9<br> Efficiency (A : B) = 9 : 8 <br> Total work    = 17 × 24<br> Required time = (24 × 17)/8 = 51 days</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Two pipes, A and B, can fill a    cistern in 15 minutes and 20 minutes, respectively. Both are    opened together. If the cistern is to be filled in exactly 12    minutes, find after how many minutes pipe B should be closed.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3 minutes</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3.5 minutes</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">4 minutes</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">4.5 minutes</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Total capacity of tank =    LCM (15, 20) = 60<br> Efficiency of A = 4<br> Efficiency of B =    3<br> Let B be closed after t minutes, and A runs the full 12    minutes.<br> Now,<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    4 x 12 + 3 x t = 60<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    48 + 3t = 60<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    3t = 12<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    t = 4 minutes<br> Required time = 4 minutes</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A man covers a certain distance by    scooter. If he had moved 3 km/h faster, he would have taken 40    minutes less. If he had moved 2 km/h slower, he would have taken    40 minutes more. Find the distance.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">36 km</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">38 km</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">40 km</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">42 km</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Let speed = s    km/h.<br> Distance = s × (s + 3)/3 × 40/60 = s × (s - 2)/2 ×    40/60<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    2 × (s + 3) = 3 × (s - 2)<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    2s + 6 = 3s – 6<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    s = 12<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    Distance = 12 × (12 + 3)/3 × 40/60 = 40 km</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If tan</span><span>θ</span><span style=\"font-family:'Nirmala UI'\">    = 5/12, find the value of (2sin</span><span>θ</span><span style=\"font-family:'Nirmala UI'\">cos</span><span>θ</span><span style=\"font-family:'Nirmala UI'\">)/(cos²</span><span>θ</span><span style=\"font-family:'Nirmala UI'\">    − sin²</span><span>θ</span><span style=\"font-family:'Nirmala UI'\">).</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">119/120</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">120/119</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">5/12</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">13/12</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> tan</span><span>θ</span><span style=\"font-family:'Nirmala UI'\">    = 5/12 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    sin</span><span>θ</span><span style=\"font-family:'Nirmala UI'\">    = 5/13, cos</span><span>θ</span><span style=\"font-family:'Nirmala UI'\">    = 12/13 <br> 2sin</span><span>θ</span><span style=\"font-family:'Nirmala UI'\">cos</span><span>θ</span><span style=\"font-family:'Nirmala UI'\">    = 2 × 5/13 × 12/13 = 120/169<br> cos²</span><span>θ</span><span style=\"font-family:'Nirmala UI'\">    − sin²</span><span>θ</span><span style=\"font-family:'Nirmala UI'\">    = 144/169 − 25/169 = 119/169<br> Now,<br> (2sin</span><span>θ</span><span style=\"font-family:'Nirmala UI'\">cos</span><span>θ</span><span style=\"font-family:'Nirmala UI'\">)/(cos²</span><span>θ</span><span style=\"font-family:'Nirmala UI'\">    − sin²</span><span>θ</span><span style=\"font-family:'Nirmala UI'\">)    = 120/119</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In a 200 m race, A can beat B by 20    m and B can beat C by 10 m. Assuming the same relative speeds, by    what distance can A beat C in a 400 m race?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">52 m</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">55 m</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">58 m</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">60 m</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Distance (A : B) = 200 :    180 = 10 : 9<br> Distance (B : C) = 200 : 190 = 20 : 19<br> Distance    (A : B : C) = 200 : 180 : 171<br> = 400 : 360 : 342<br> In a 400    m race, when A runs 400 m, C runs 342 m<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    A beats C by 400 - 342 = 58 m.</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In a quadratic equation, the ratio    of the product of the roots to their sum is 3 : 2. If one root is    6, find the other root.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">4</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Let other root = m<br> ATQ,<br> Product    of roots/Sum of roots = 3/2<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    6m/(6 + m) = 3/2<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    2 × 6m = 3 × (6 + m) <br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    12m = 18 + 3m<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    9m = 18 </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    m = 2</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Six years ago, the ratio of ages of    A and B was 5 : 6. Four years hence, the ratio of their ages will    be 7 : 8. Find the present age of B.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">32 years</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">34 years</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">36 years</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">38 years</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> 6 years ago,<br> Ages (A    : B) = 5 : 6<br> After 4 years,<br> Ages (A : B) = 7 : 8<br> (8    - 6) units = 2 units = 10 years<br> 6 units = 30 years<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    B's present age = 30 + 6 = 36 years</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The average score in an examination    was 60. After correcting for computational errors, the scores of    100 students were changed from 80 to 50, causing the average score    to drop to 45; thus, the total number of students who appeared for    the examination was:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">250</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">450</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">200</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">300</s =\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">[0    + 16]<br> = </span><span style=\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">16<br> =    4 units</span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In </span><span>Δ</span><span style=\"font-family:'Nirmala UI'\">DEF,    P and Q lie on sides DE and DF respectively, PQ || EF, and PQ    divides </span><span>Δ</span><span style=\"font-family:'Nirmala UI'\">DEF    into two regions of equal area. Find the ratio of EP to DP.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(</span><span style=\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">2    – 1) : 1</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 : </span><span style=\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">2</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(</span><span style=\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">2    + 1) : 1</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">5 : </span><span style=\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">2</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786723825597_html_c9f1a3edf22ec068.png\" width=\"168\" height=\"148\" > <span style=\"font-family:'Nirmala UI'\"><br> ATQ,<br> </span><span>Δ</span><span style=\"font-family:'Nirmala UI'\">DPQ    ~ </span><span>Δ</span><span style=\"font-family:'Nirmala UI'\">DEF<br> and    Area(</span><span>Δ</span><span style=\"font-family:'Nirmala UI'\">DPQ)    = 1/2 × Area(</span><span>Δ</span><span style=\"font-family:'Nirmala UI'\">DEF)<br> </span><span style=\"font-family:'Cambria Math'\">⟹</span><span style=\"font-family:'Nirmala UI'\">    (DP/DE)² = 1/2<br> </span><span style=\"font-family:'Cambria Math'\">⟹</span><span style=\"font-family:'Nirmala UI'\">    DP/DE = 1/</span><span style=\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">2<br> </span><span style=\"font-family:'Cambria Math'\">⟹</span><span style=\"font-family:'Nirmala UI'\">    EP/DP = (DE − DP)/DP = (</span><span style=\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">2    – 1) : 1</span></p>", "question_heading": ""}, {"sr_no": 70, "question": "  <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The pie chart below represents the    total annual expenditure (₹48 lakh) of a startup, showing the    percentage of expenses incurred across various departments:    Salaries, Marketing, R&amp;D, Logistics, and Admin. Study the    chart and answer the questions given below:<br> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786723825597_html_a3ff97da5a517ce1.png\" width=\"332\" height=\"163\" > <span style=\"font-family:'Nirmala UI'\"><br> If    logistics expense increases by 20% and marketing expense increases    by 10%, then by how much will the total annual expenditure    increase?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">2.40 lakh</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">2.16 lakh</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">1.86 lakh</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">2.64 lakh</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Marketing expense = 48 ×    25% = ₹12 lakh<br> Increase in marketing = 12 × 10% = ₹1.2    lakh<br> Logistics expense = 48 × 10% = ₹4.8 lakh<br> Increase    in logistics = 4.8 × 20% = ₹0.96 lakh<br> Total increase = 1.2    + 0.96 = ₹2.16 lakh</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If 6A = 45¹</span><span style=\"font-family:'Cambria Math'\">⁰</span><span style=\"font-family:'Nirmala UI'\">¹    + 75¹</span><span style=\"font-family:'Cambria Math'\">⁰</span><span style=\"font-family:'Nirmala UI'\">¹,    then A is divisible by which of the following?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">5</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">All of these</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> 6A = 45¹</span><span style=\"font-family:'Cambria Math'\">⁰</span><span style=\"font-family:'Nirmala UI'\">¹    + 75¹</span><span style=\"font-family:'Cambria Math'\">⁰</span><span style=\"font-family:'Nirmala UI'\">¹<br> 6A    = 15¹</span><span style=\"font-family:'Cambria Math'\">⁰</span><span style=\"font-family:'Nirmala UI'\">¹    × (3¹</span><span style=\"font-family:'Cambria Math'\">⁰</span><span style=\"font-family:'Nirmala UI'\">¹    + 5¹</span><span style=\"font-family:'Cambria Math'\">⁰</span><span style=\"font-family:'Nirmala UI'\">¹)<br> Since    3¹</span><span style=\"font-family:'Cambria Math'\">⁰</span><span style=\"font-family:'Nirmala UI'\">¹    + 5¹</span><span style=\"font-family:'Cambria Math'\">⁰</span><span style=\"font-family:'Nirmala UI'\">¹    is divisible by 4, let 3¹</span><span style=\"font-family:'Cambria Math'\">⁰</span><span style=\"font-family:'Nirmala UI'\">¹    + 5¹</span><span style=\"font-family:'Cambria Math'\">⁰</span><span style=\"font-family:'Nirmala UI'\">¹    = 4k.<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    A = [3¹</span><span style=\"font-family:'Cambria Math'\">⁰</span><span style=\"font-family:'Nirmala UI'\">¹    × 5¹</span><span style=\"font-family:'Cambria Math'\">⁰</span><span style=\"font-family:'Nirmala UI'\">¹    × 4k]/6 = 2 × 3¹</span><span style=\"font-family:'Cambria Math'\">⁰⁰</span><span style=\"font-family:'Nirmala UI'\">    × 5¹</span><span style=\"font-family:'Cambria Math'\">⁰</span><span style=\"font-family:'Nirmala UI'\">¹    × k<br> So A is divisible by 2, 3 and 5.</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In </span><span>Δ</span><span style=\"font-family:'Nirmala UI'\">ABC,    there is a right angle at C. D is a point on AC such that BC = 15    cm, AD = 2 cm, and DC = 6 cm; DE </span><span style=\"font-family:'Cambria Math'\">⊥</span><span style=\"font-family:'Nirmala UI'\">    AB, with E lying on AB. Find the length of AE.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">15/17 cm</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">16/17 cm</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">17/16 cm</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">8/17 cm</span></p>", "answer": "2", "negative_marking": "0.50", "positi <span style=\"font-family:'Nirmala UI'\">    </span><span style=\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">3    = 40</span><span style=\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">3/BP<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    BP = 40<br> Now, y = 100 – x<br> = 100 – 40<br> = 60 m<br> In    </span><span style=\"font-family:'Cambria Math'\">∆</span><span style=\"font-family:'Nirmala UI'\">CDP,<br> tan    30° = CD/PD<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    1/</span><span style=\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">3    = h/y<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    1/</span><span style=\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">3    = h/60<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    h = 20</span><span style=\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">3<br> Height    of the other pole = 20</span><span style=\"font-family:'Cambria Math'\">√</span><span style=\"font-family:'Nirmala UI'\">3    metres</span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">On ₹40,000 at 10% compound    interest per annum, find the difference between the interest    earned in the third year and the first year.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">820</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">800</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">880</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">840</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Interest for 1st year =    40000 × 10/100 = ₹4000<br> Interest for 3rd year = 40000 ×    110/100 × 110/100 × 10/100<br> = ₹4840<br> Required    difference = ₹4840 - ₹4000 = ₹840</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the option that exactly    matches the given original address.<br> Flat No. 402-B, Green    Valley Heights, Sector-62, Noida, Uttar Pradesh – 201309</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Flat No. 402-B, Green Valley    Heights, Sector-62, Noida, Uttar Pradesh – 201309</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Flat No. 402-B, Green Valley    Heights, Sector-26, Noida, Uttar Pradesh – 201309</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Flat No. 402-B, Green Valley    Height, Sector-62, Noida, Uttar Pradesh – 201309</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Flat No. 420-B, Green Valley    Heights, Sector-62, Noida, Uttar Pradesh – 201309</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Flat No. 402-B, Green Valley    Heights, Sector-62, Noida, Uttar Pradesh – 201309<br> Comparing    the options:<br> Option (1) — Is exactly the same as the    original address. </span><span>✅</span><span style=\"font-family:'Nirmala UI'\"><br> Option    (2) — It lists Sector-26 instead of Sector-62. </span><span>❌</span><span style=\"font-family:'Nirmala UI'\"><br> Option    (3) — It reads \"Green Valley Height\" instead of \"Green    Valley Heights\". </span><span>❌</span><span style=\"font-family:'Nirmala UI'\"><br> Option    (4) — It lists Flat No. 420-B instead of Flat No. 402-B.    </span><span>❌</span><span style=\"font-family:'Nirmala UI'\"><br> Therefore,    the option that exactly matches the original address is Option    (1).</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A statement is given, followed by    two conclusions. Decide which conclusion(s) follow(s) from the    statement.<br> Statement:<br> Due to heavy rainfall, the    municipal corporation has advised people to avoid going out unless    necessary.<br> Conclusions:<br> I. People who go out face    inconvenience due to the rain.<br> II. Normal life will be    affected during heavy rainfall.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only conclusion I follows.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only conclusion II follows.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both conclusions I and II follow.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither conclusion I nor II    follows.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: (3) Both    conclusions I and II follow.<br> Solution:<br> The statement    mentions that due to heavy rain, the municipal corporation has    advised people to step out only if necessary. This implies that    venturing out is not as convenient as usual due to the heavy rain    and that people's normal activities could be affected.<br> Conclusion    I: People stepping out face inconvenience due to the rain.<br> This    conclusion follows, because if there were no difficulty or    inconvenience involved in going out, the municipal corporation    would not have advised people against it.<br> Conclusion II:    Normal public life will be affected during heavy rain. This also    follows, because when people are being advised to avoid going out    unnecessarily, their normal movement and daily activities will    inevitably be impacted.<br> Therefore, both conclusions I and II    follow.</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the Venn diagram that best    represents the relationship among the three things:<br> Books,    Novels and Dictionaries.</span></p>", "option1": " <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786723825597_html_5b983f8c29c31e11.png\" width=\"62\" height=\"59\" > </p>", "option2": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786723825597_html_d834b29c69bf82e8.png\" width=\"60\" height=\"59\" > </p>", "option3": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786723825597_html_4575119f59b2a576.png\" width=\"78\" height=\"62\" > </p>", "option4": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786723825597_html_dfd6b39ca5c78622.png\" width=\"73\" height=\"58\" > </p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786723825597_html_895facbfcfd01cda.png\" width=\"169\" height=\"142\" > <span style=\"font-family:'Nirmala UI'\"><br> The    Venn diagr >    <span style=\"font-family:'Nirmala UI'\">In a row, Ram's position from the    left is the same as his position from the right. If there are 53    students in the row, what is his position from the left?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">29</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">25</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">23</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">27</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Total students = Position from the    left + Position from the right − 1<br> 53 = x + x − 1<br> 53    = 2x − 1<br> 2x = 54<br> x = 27<br> Therefore, Ram's position    from the left will be 27th.</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following options    represents the logical sequence of the given words?<br> 1.    Punjab<br> 2. Amritsar<br> 3. World<br> 4. India<br> 5.    Asia<br> 6. Golden Temple</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6, 2, 1, 5, 3, 4</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6, 2, 1, 4, 5, 3</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3, 1, 5, 2, 4, 6</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2, 1, 4, 5, 3, 6</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In increasing ord  or II follows.</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In the question a statement is    given, followed by three courses of action I, II and III. You have    to consider the statements to be true even if they seem to be at    odds with commonly known facts. You have to decide which, if any,    of the given courses of action follows from the given    statements.<br> Statement: The world will have to feed more than    10 billion people in the next century, half of whom will be Asian    and eat rice as their staple diet.<br> Course of action :<br> I.    Funds should be allocated for rice research to help ensure    adequate supplies.<br> II. Asian people should be encouraged to    change their eating habits.<br> III. Other countries should be    encouraged to grow rice to meet the demands.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only II follows</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I and III follow</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">All follow</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I follows</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">I. Follows — Given the rising    demand for rice, funding rice research to ensure adequate supply    is an appropriate course of action.<br> II. Does not follow —    The statement does not suggest a need to change the dietary habits    of Asian people.<br> III. Follows — Increasing rice production    in other countries to meet the growing demand is a suitable    step.<br> Hence, the correct option is: (2) Only I and III    follow.</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If ‘@’ means ‘+’, ‘%’    means ‘÷’, ‘#’ means ‘−’, ‘!’ means ‘=’,    and ‘&amp;’ means ‘×’, then which number will replace ‘?’    in the given equation?<br> 24 % 12 @ 8 # 4 &amp; 4 ! ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">4</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">-6</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">-10</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct answer: (C) −6<br> @ =    +<br> % = ÷<br> # = −<br> ! = =<br> &amp; = ×<br> Therefore,<br> 24    % 12 @ 8 # 4 &amp; 4 ! ?<br> = 24 ÷ 12 + 8 − 4 × 4 =    ?<br> According to BODMAS,<br> = 2 + 8 − 16<br> = 10 − 16<br> =    −6</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Choose the odd number-pair from the    following options.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">61 : 97</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">78 : 127</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">56 : 136</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">25 : 89</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: (3) 56 :    136<br> Solution:<br> In each pair of numbers, the difference    between the second number and the first number is a perfect    square:<br> 97 − 61 = 36 = 6²<br> 127 − 78 = 49 = 7²<br> 89    − 25 = 64 = 8²<br> However,<br> 136 − 56 = 80, which is not    a perfect square.<br> Therefore, 56 : 136 is the odd number pair.</span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A statement is given below,    followed by three conclusions. Assuming the statement to be true,    determine which of the conclusions is/are definitely    true.<br> Statement:<br> F &lt; T, T = J, J &gt;    W<br> Conclusions:<br> I. J = F<br> II. J &gt; F<br> III. W &lt;    T</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I is true.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only II is true.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only III is true.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">only Conclusions II and III are    true.</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">T = J and F &lt; T<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    F &lt; J<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    J &gt; F, so Conclusion II is true.<br> Also,<br> J &gt; W and T    = J<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    T &gt; W<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    W &lt; T, so Conclusion III is also true.<br> But J = F is not    true.<br> Therefore, only Conclusions II and III are true.</span></p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Pointing to a man in a photograph,    a woman says, “He is the father of my only daughter-in-law's    father-in-law.” What is the relationship of the man to the    woman?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Father</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Brother</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Husband</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Father-in-law</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786723825597_html_b98b1c51ff11ff3c.png\" width=\"313\" height=\"121\" > <span style=\"font-family:'Nirmala UI'\"><br> Hence,    the man is her father-in-law.</span></p>", "question_heading": ""}, {"sr_no": 99, "question": "  <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">When the mirror is placed on the    right side of the given figure, select the correct mirror image    from the following options.<br> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786723825597_html_c34eea84ed91d560.png\" width=\"133\" height=\"130\" > </p>", "option1": " <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786723825597_html_f0a89928426e05ad.png\" width=\"109\" height=\"109\" > <span style=\"font-family:'Nirmala UI'\">.</span></p>", "option2": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appx an style=\"font-family:'Nirmala UI'\">The differences in the series are    as follows:<br> 1215 + 1¹ = 1216<br> 1216 + 2² = 1220<br> 1220    + 3³ = 1247<br> 1247 + 4</span><span style=\"font-family:'Cambria Math'\">⁴</span><span style=\"font-family:'Nirmala UI'\">    = 1247 + 256 = 1503<br> Therefore, the final number should be    1503 instead of 1603.</span></p>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }

    .review-option.user-selected { border-width: 3px; font-weight: bold; }

    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>

  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
