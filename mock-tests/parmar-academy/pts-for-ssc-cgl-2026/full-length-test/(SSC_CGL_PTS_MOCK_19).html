<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>37.) SSC CGL PTS  MOCK 19 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

const questions = [{"sr_no": 1, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following cities    hosted the NATO Summit held in 2026?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Washington, D.C. (USA)</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ankara (Türkiye)</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Brussels (Belgium)</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Vilnius (Lithuania)</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Ankara    (Türkiye).<br> The 2026 NATO Summit was held on 7–8 July 2026    at the Be</span><span>ş</span><span style=\"font-family:'Nirmala UI'\">tepe    Presidential Compound in Ankara. It was the second NATO Summit    hosted by Türkiye; the previous one was held in Istanbul in 2004.</span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding NASA’s Artemis II mission:<br> 1. It was the first    crewed flight of NASA’s Orion spacecraft around the Moon.<br> 2.    Its crew included the first woman (Christina Koch) and the first    person of color (Victor Glover) to fly on a lunar mission.<br> Which    of the statements given above is/are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 1</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 2</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both 1 and 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither 1 nor 2</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Both 1 and    2.<br> Artemis II launched on 1 April 2026 and splashed down on    10 April 2026 after a nearly 10-day crewed journey around the Moon    aboard Orion. Its crew consisted of Reid Wiseman, Victor Glover,    Christina Koch and Canadian astronaut Jeremy Hansen. Christina    Koch became the first woman, Victor Glover the first person of    color, and Jeremy Hansen the first Canadian to fly on a lunar    mission.<br> Therefore, both statements are correct.</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding the Immigration and Foreigners (Amendment) Rules,    2026:<br> 1. Foreign nationals whose permitted stay is limited to    180 days and who wish to remain in India beyond that period must    now register before the expiry of the 180-day period.<br> 2.    Earlier, the relevant rule allowed such registration within 14    days after completion of 180 days from arrival.<br> Which of the    statements given above is/are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 1</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 2</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both 1 and 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither 1 nor 2</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Both 1 and 2.<br> The    Immigration and Foreigners (Amendment) Rules, 2026 changed the    registration timeline under Rule 12. Foreign nationals covered by    the 180-day stay condition who intend to remain beyond that period    must register before the 180-day period expires. The earlier    provision allowed registration within 14 days after completion of    180 days from arrival. Delayed registration is now permitted only    in emergent circumstances.<br> Important fact: The amendment was    notified under the Immigration and Foreigners Act, 2025.</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Match the following Korean terms    used in Taekwondo with their meanings:<br> Column A: 1. Tae 2.    Kwon 3. Do 4. Dojang<br> Column B: A. Discipline/way B. Hand or    fist strike C. Foot or kick D. Training hall<br> Choose the    correct code.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1-B, 2-C, 3-A, 4-D</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1-C, 2-B, 3-A, 4-D</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1-A, 2-D, 3-B, 4-C</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1-D, 2-A, 3-C, 4-B</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: 1-C, 2-B, 3-A,    4-D.<br> In the word Taekwondo, Tae refers to the foot or kicking    action, Kwon refers to the hand or fist, and Do means the way,    discipline or path. Dojang is the training hall or practice area    where Taekwondo is taught.<br> Thus, the correct matching is    Tae–C, Kwon–B, Do–A and Dojang–D.</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which edition of the bilateral    diving exercise ‘IN-SLN DIVEX 2026’ was conducted between    India and Sri Lanka?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Second</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Third</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Fourth</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Fifth</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Fourth.<br> IN-SLN    DIVEX 2026 was the fourth edition of the bilateral diving exercise    between the Indian Navy and the Sri Lanka Navy. It was conducted    at Colombo from 21–28 April 2026. INS Nireekshak, the Indian    Navy’s diving support and submarine rescue vessel, participated    in the exercise.<br> Important fact: The exercise focused on    interoperability in deep-sea diving, underwater search, rescue and    salvage operations. Two BHISM cubes were also handed over to Sri    Lanka under India’s Aarogya Maitri initiative.</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following statements    is correct regarding Zero Hour in the Indian Parliament?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is an Indian parliamentary    innovation and has been in practice since 1962.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is explicitly mentioned in the    Rules of Procedure of Parliament.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It begins immediately before    Question Hour.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A notice of at least 10 days is    mandatory for raising a matter during Zero Hour.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: It is an Indian    parliamentary innovation and has been in practice since 1962.<br> Zero    Hour is an informal parliamentary device that developed in India    in 1962. It normally follows Question Hour and is not formally    mentioned in the Constitution or the Rules of Procedure. It    enables members to raise urgent matters of public importance,    subject to the directions and procedure prescribed by the    presiding officer.<br> Therefore, options 2, 3 and 4 are    incorrect.</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which Article of the Constitution    provides that the executive power of a State shall not impede the    exercise of the executive power of the Union and allows the Union    to give necessary directions to a State for this purpose?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 257</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 261</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 247</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 123</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Article    257.<br> Article 257 deals with the control of the Union over    States in certain cases. It requires a State’s executive power    to be exercised so that it does not impede or prejudice the    exercise of the Union’s executive power. The Union may issue    directions to a State for this purpose.<br> Important facts:    Article 261 deals with recognition of public acts, records and    judicial proceedings; Article 247 empowers Parliament to establish    additional courts; Article 123 deals with the President’s    ordinance-making power.</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">By which process can the Chief    Election Commissioner of India be removed from office?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">By a direct order of the President</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">On the recommendation of the Chief    Justice of India</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In the same manner and on the same    grounds as a Judge of the Supreme Court, through a    special-majority address of both Houses of Parliament</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">On the recommendation of the Union    Cabinet</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Option 3.<br> Article    324(5) provides security of tenure to the Chief Election    Commissioner. The CEC can be removed only in the same manner and    on the same grounds as a Judge of the Supreme Court—proved    misbehaviour or incapacity. The parliamentary address must be    supported in each House by a majority of the total membership and    by at least two-thirds of the members present and voting.<br> A    direct presidential order, Cabinet recommendation or    recommendation of the Chief Justice of India is not sufficient.</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What is the effect when the Reserve    Bank of India sells government securities under Open Market    Operations?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Market liquidity increases.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The lending capacity of banks    increases.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Liquidity is absorbed from the    market and the money supply tends to decrease.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The repo rate automatically falls.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Liquidity is    absorbed from the market and the money supply tends to    decrease.<br> When the RBI sells government securities, banks and    investors pay money to the RBI to purchase them. This transfers    funds out of the banking system, reducing available liquidity and    generally restricting banks’ lending capacity.<br> Important    fact: RBI purchase of government securities has the opposite    effect—it injects liquidity into the system. Open Market    Operations are a quantitative instrument of monetary policy.</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following is an    example of a progressive tax, in which the tax rate generally    rises as taxable income rises?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Goods and Services Tax</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Personal Income Tax</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Customs Duty</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Excise Duty</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Personal Income    Tax.<br> A progressive tax imposes a higher tax rate as the    taxable income or tax base rises. Personal income tax is the    standard example because higher income slabs are subject to higher    marginal rates.<br> Important fact: GST, customs duty and excise    duty are indirect taxes. Their burden can be passed on through the    price of goods and services, whereas personal income tax is a    direct tax paid by the taxpayer on income.</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What is the percentage of    unemployed persons who are actively seeking and available for work    in the total labour force called?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Labour Force Participation Rate</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Unemployment Rate</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Worker-Population Ratio</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Disguised Unemployment Coefficient</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Unemployment    Rate.<br> Unemployment Rate = (Number of unemployed persons ÷    Labour force) × 100. The labour force consists of employed    persons plus unemployed persons who are available for work and    seeking employment.<br> Important facts: Labour Force    Participation Rate measures the share of the working-age    population in the labour force, while the Worker-Population Ratio    measures the proportion of employed persons in the population.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">When Pangaea broke apart, what were    its two major northern and southern landmasses called,    respectively?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Angaraland (Laurasia) and    Gondwanaland</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Tethys and Panthalassa</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Eurasia and Zealandia</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Laurasia and Panthalassa</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Angaraland    (Laurasia) and Gondwanaland.<br> According to the    continental-drift framework, the supercontinent Pangaea separated    into a northern landmass, commonly called Laurasia or Angaraland    in Indian geography texts, and a southern landmass called    Gondwanaland. The Tethys Sea lay between these two broad    landmasses, while Panthalassa was the vast ocean surrounding    Pangaea.<br> Thus, option 1 is correct.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which is the longest west-flowing    river of Peninsular India that flows through a rift valley and    drains into the Arabian Sea?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Tapi River</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Narmada River</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sabarmati River</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Luni River</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Narmada River.<br> The    Narmada is the longest west-flowing river of Peninsular India. It    rises near Amarkantak in Madhya Pradesh and flows westward through    a rift valley between the Vindhya and Satpura ranges. Its length    is about 1,312 km, and it empties into the Gulf of Khambhat in the    Arabian Sea near Bharuch, Gujarat.<br> Important fact: The Tapi    also flows westward through a rift valley, but it is shorter than    the Narmada.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The Jaduguda mines in Jharkhand are    famous for the mining of which important mineral?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Copper</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Thorium</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Uranium</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gold</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Uranium.<br> Jaduguda    in East Singhbhum district of Jharkhand is known for uranium    mining and hosts India’s first uranium mine developed for    commercial production by the Uranium Corporation of India Limited.    Uranium is strategically important as a fuel for nuclear-energy    programmes.<br> Important facts: The Singhbhum belt is also known    for copper deposits; monazite sands along parts of the Kerala    coast are an important source of thorium; Hutti in Karnataka is a    major gold-mining centre.</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which Rashtrakuta ruler    commissioned the famous monolithic Kailasa Temple in Cave 16 at    Ellora, Maharashtra?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Dantidurga</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Amoghavarsha I</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Krishna I</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Govinda III</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Krishna I.<br> The    Kailasa Temple at Ellora was commissioned in the 8th century by    the Rashtrakuta ruler Krishna I. It is Cave 16 of the Ellora    complex and is a celebrated example of monolithic rock-cut    architecture, excavated largely from a single mass of basalt from    the top downward.<br> Important fact: The temple is primarily    associated with the Dravidian architectural tradition and is one    of the most important monuments of the Rashtrakuta period.</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The Vaishali region, traditionally    associated with the birth of Mahavira, and Pavapuri, the place of    his nirvana, are located in which present-day Indian state?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Uttar Pradesh</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bihar</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Madhya Pradesh</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gujarat</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Bihar.<br> Mahavira,    the 24th Tirthankara of Jainism, is traditionally associated with    Kundagrama in the Vaishali region for his birth. He attained    nirvana at Pavapuri, which is in present-day Nalanda district of    Bihar. Therefore, both places referred to in the question are in    Bihar.<br> Important fact: Pavapuri is one of the most sacred    Jain pilgrimage centres and is associated with Mahavira’s final    liberation.</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In which year did Akbar open the    Ibadat Khana at Fatehpur Sikri to scholars of different religions?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1578 AD</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1582 AD</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1571 AD</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1585 AD</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: 1578 AD.<br> Akbar    established the Ibadat Khana at Fatehpur Sikri in 1575 for    discussions on religious and philosophical questions. Initially,    the debates were mainly among Muslim scholars. In 1578, Akbar    widened participation to scholars and representatives of other    religions, including Hinduism, Jainism, Zoroastrianism and    Christianity.<br> Important fact: Din-i-Ilahi, or Tauhid-i-Ilahi,    is associated with the year 1582.</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which nationalist leader was    prominently associated with starting the Marathi newspaper Kesari    and the English weekly Mahratta in 1881?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bal Gangadhar Tilak</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lala Lajpat Rai</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bipin Chandra Pal</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gopal Krishna Gokhale</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Bal Gangadhar    Tilak.<br> Bal Gangadhar Tilak was prominently associated with    the launch of two influential newspapers in 1881—Kesari in    Marathi and Mahratta in English. These publications became    important vehicles for political awareness and nationalist    criticism of colonial policies.<br> Important fact: The language    pairing is often tested in exams: Kesari—Marathi;    Mahratta—English.</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which Governor-General enacted    Bengal Sati Regulation XVII in 1829, declaring the practice of    Sati illegal?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lord Canning</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lord William Bentinck</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lord Dalhousie</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lord Ripon</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Lord William    Bentinck.<br> Lord William Bentinck, then Governor-General of    Bengal, enacted Bengal Sati Regulation XVII on 4 December 1829. It    declared the practice of Sati illegal and punishable in the Bengal    Presidency. Raja Rammohan Roy’s sustained social-reform campaign    was an important influence in the movement against Sati.<br> Important    fact: After the Charter Act of 1833, Bentinck became the first    Governor-General of India; in 1829 his office was Governor-General    of Bengal.</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If the velocity of a moving object    is doubled while its mass remains constant, what happens to its    kinetic energy?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It doubles</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It becomes four times</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It becomes half</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It remains unchanged</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: It becomes four    times.<br> Kinetic energy = 1/2 × mass × velocity × velocity.    Therefore, kinetic energy is proportional to the square of    velocity when mass is constant. If velocity changes from v to 2v,    the new kinetic energy becomes 1/2 × m × 2v × 2v = 4 times the    original kinetic energy.<br> Important fact: If velocity is    halved, kinetic energy becomes one-fourth of its original value.</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Fill in the blank:<br> In Teental    of Hindustani classical music, the Khali occurs on the ______    beat.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">5</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">9</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">13</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: 9th beat.<br> Teental    has 16 matras divided into four equal vibhags of 4 matras each: 4    + 4 + 4 + 4. The claps fall on beats 1, 5 and 13, while the khali    is marked on beat 9. The first beat is the sam.<br> Basic theka:    Dha Dhin Dhin Dha | Dha Dhin Dhin Dha | Dha Tin Tin Ta | Ta Dhin    Dhin Dha.<br> Thus, the khali of Teental occurs on the 9th matra.</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which part of the human brain is    mainly responsible for maintaining body balance and coordinating    voluntary muscle movements?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Cerebrum</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Cerebellum</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Medulla Oblongata</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Hypothalamus</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Cerebellum.<br> The    cerebellum is part of the hindbrain and plays a major role in    balance, posture and the fine coordination of voluntary muscular    movements. Activities such as walking steadily, cycling and    writing smoothly require proper cerebellar coordination.<br> Important    facts: The cerebrum is associated with higher mental functions and    voluntary control; the medulla regulates vital involuntary    functions such as heartbeat and breathing; the hypothalamus helps    regulate temperature, hunger, thirst and endocrine control.</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Fill in the blank:<br> The Indian    Olympic Association was formed in ______, with Sir Dorabji Tata as    its founding President and Dr. A.G. Noehren as Secretary.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1920</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1922</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1930</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1927</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: 1927.<br> The    Indian Olympic Association was formed in 1927. Sir Dorabji Tata    was its founding President and Dr. A.G. Noehren served as    Secretary. The IOA became the principal national body coordinating    India’s participation in the Olympic movement and later in other    major multi-sport events.<br> Important fact: A provisional All    India Olympic Committee had existed earlier and helped organise    India’s participation in the 1920 and 1924 Olympic Games.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ustad Faiyaz Khan was one of the    foremost modern exponents of which gharana of Hindustani classical    Khayal vocal music?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gwalior Gharana</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Agra Gharana</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kirana Gharana</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Patiala Gharana</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Agra Gharana.<br> Ustad    Faiyaz Khan, popularly honoured with the title Aftab-e-Mausiqi,    was one of the most celebrated exponents of the Agra gharana in    the 20th century. He greatly strengthened and popularised its    robust Khayal style.<br> Important correction: The roots of the    Agra gharana predate Faiyaz Khan; therefore, it is more accurate    to call him a leading exponent and reviver rather than the founder    of the gharana.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kalaripayattu, an ancient Indian    martial art, originated in which state?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Tamil Nadu</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kerala</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Manipur</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Punjab</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer:    Kerala.<br> Kalaripayattu is an ancient martial tradition    indigenous to Kerala, especially associated historically with the    Malabar region. Its training includes body-conditioning exercises,    unarmed techniques and the use of weapons such as staffs, swords    and shields. Traditional practice is also linked with knowledge of    vital points and healing methods.<br> Important correction: The    exact date of origin is uncertain, so it is better to avoid    claiming a fixed century. State associations often tested in exams    include Silambam—Tamil Nadu, Thang-Ta—Manipur and    Gatka—Punjab.</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Choose the correct words to    complete the sentence:</b></span><span style=\"font-family:'Nirmala UI'\"><br> The    manager asked the staff to maintain complete ______ during the    confidential meeting, as revealing the details could ______ the    company’s reputation.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">discretion, affect</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">discretion, effect</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">discreetion, affect</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">discrete, effect</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Discretion</b></span><span style=\"font-family:'Nirmala UI'\"> =    carefulness in keeping information private.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Affect</b></span><span style=\"font-family:'Nirmala UI'\"> =    to influence or cause a change in something.<br> Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>“discretion,    affect”</b></span><span style=\"font-family:'Nirmala UI'\"> correctly    fits the sentence.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate synonym    of the given word. INCHOATE</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Incipient</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Conclusive</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Immaculate</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Explicit</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: (A)    Incipient<br> Solution:<br> Inchoate means just begun, not fully    formed, or in an early stage of development.<br> Incipient =    beginning to develop </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    Correct synonym<br> Conclusive = final or decisive<br> Immaculate    = perfectly clean or flawless<br> Explicit = clearly    stated<br> Hence, the most appropriate synonym of “INCHOATE”    is “INCIPIENT.”</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate antonym    of the given word. PARSIMONIOUS</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Pragmatic</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Circumspect</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Frivolous</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Munificent</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: (D) Munificent</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Solution:</b></span><span style=\"font-family:'Nirmala UI'\"><br> </span><span style=\"font-family:'Nirma /span><span style=\"font-family:'Nirmala UI'\"><br> A </span><span style=\"font-family:'Nirmala UI'\"><b>Mycologist</b></span><span style=\"font-family:'Nirmala UI'\"> is    a person who specialises in the scientific study of </span><span style=\"font-family:'Nirmala UI'\"><b>fungi</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Bryologist</b></span><span style=\"font-family:'Nirmala UI'\"> =     one who studies mosses</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Lichenologist</b></span><span style=\"font-family:'Nirmala UI'\"> =     one who studies lichens</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Mycologist</b></span><span style=\"font-family:'Nirmala UI'\"> =     one who studies fungi </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Correct</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Entomologist</b></span><span style=\"font-family:'Nirmala UI'\"> =     one who studies insects</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    the correct one-word substitution is “Mycologist.”</b></span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate option    to fill in the blank.<br> The committee refused to endorse the    proposal because its financial projections were found to be    ________ after an independent audit.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">tenable</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">inflated</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">meticulous</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">obligatory</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 2.<br> •    Inflated means exaggerated or overstated.<br> • Since the audit    showed that the financial projections were overstated, “inflated”    correctly completes the sentence.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In the following sentence, some    part of the sentence may have an error. Find the part containing    the error. If there is no error, choose 'No error'.<br> More than    one applicant (A) / were declared eligible (B) / after the final    round of verification. (C) / No error (D)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">C</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">D</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">B</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 4    (Part B).<br> • Rule: “More than one + singular noun” takes    a singular verb.<br> • Therefore, “were declared” should be    “was declared”.<br> Correct sentence: More than one applicant    was declared eligible after the final round of verification.</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate passive    form of the given sentence.<br> The sudden downpour prevented the    rescue team from reaching the stranded villagers before nightfall.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The rescue team was prevented by    the sudden downpour from reaching the stranded villagers before    nightfall.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The rescue team had been prevented    by the sudden downpour from reaching the stranded villagers before    nightfall.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The rescue team was being prevented    by the sudden downpour from reaching the stranded villagers before    nightfall.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The rescue team prevented from    reaching the stranded villagers by the sudden downpour before    nightfall.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 1.<br> •    Active structure: prevent + object + from + V-ing.<br> •    Passive structure: object + was/were prevented + by + subject +    from + V-ing.<br> Correct sentence: The rescue team was prevented    by the sudden downpour from reaching the stranded villagers before    nightfall.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In the following sentence, some    part of the sentence may have an error. Find the part containing    the error. If there is no error, choose 'No error'.<br> Not until    the final manuscript was reviewed (A) / did the editors realise    (B) / that several references had omitted. (C) / No error (D)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">C</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">D</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">B</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 1    (Part C).<br> • Past Perfect Passive = had + been + past    participle.<br> • “Several references had omitted” is    incorrect; it should be “several references had been    omitted”.<br> Correct sentence: Not until the final manuscript    was reviewed did the editors realise that several references had    been omitted.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate option    to fill in the blank.<br> The constitutional bench dismissed the    plea after concluding that the petitioner's interpretation of the    statute was entirely ________ and unsupported by legislative    intent.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">tenacious</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">plausible</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">untenable</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">meticulous</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: (C) untenable</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Solution:</b></span><span style=\"font-family:'Nirmala UI'\"><br> </span><span style=\"font-family:'Nirmala UI'\"><b>Untenable</b></span><span style=\"font-family:'Nirmala UI'\"> means </span><span style=\"font-family:'Nirmala UI'\"><b>not    able to be defended, justified, or supported by valid reasons or    evidence</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In    the sentence, the court dismissed the plea because the    petitioner’s interpretation of the statute was </span><span style=\"font-family:'Nirmala UI'\"><b>unsupported    by legislative intent</b></span><span style=\"font-family:'Nirmala UI'\">.    Therefore, </span><span style=\"font-family:'Nirmala UI'\"><b>untenable</b></span><span style=\"font-family:'Nirmala UI'\"> fits    the context best.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Tenacious</b></span><span style=\"font-family:'Nirmala UI'\"> =     persistent; determined</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Plausible</b></span><span style=\"font-family:'Nirmala UI'\"> =     seemingly reasonable or believable</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Untenable</b></span><span style=\"font-family:'Nirmala UI'\"> =     impossible to defend or justify </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Correct</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Meticulous</b></span><span style=\"font-family:'Nirmala UI'\"> =     very careful and precise</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    the correct answer is (C) untenable.</b></span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate passive    form of the given sentence.<br> Nobody let the visitors enter the    restricted laboratory without biometric verification.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The visitors were not let entering    the restricted laboratory without biometric verification.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The visitors were not allowed to    enter the restricted laboratory without biometric verification.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The visitors had not been allowed    to enter the restricted laboratory without biometric verification.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The visitors were not being allowed    to enter the restricted laboratory without biometric verification.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 2.<br> •    In passive voice, “let + object + verb” is normally expressed    as “be allowed to + verb”.<br> Correct sentence: The visitors    were not allowed to enter the restricted laboratory without    biometric verification.</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In the following sentence, a part ect answer is Option 1.<br> •    An optative sentence beginning with “May” expresses a wish or    prayer.<br> • In indirect speech, “May + subject + verb”    changes to “prayed/wished that + subject + might +    verb”.<br> Correct sentence: The chairperson prayed that the    newly established institute might achieve excellence in scientific    innovation.</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Read the sentence carefully and    answer the question that follows.<br> Although the startup's    valuation attracted considerable media attention, seasoned    investors remained wary because its expansion strategy appeared    quixotic in the prevailing economic climate. What is the most    appropriate meaning of the word quixotic as used in the sentence?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Strictly regulated by financial    authorities</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Extremely practical and    commercially viable</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Idealistic but unrealistic and    impractical</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Carefully planned using statistical    evidence</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 3.<br> •    Quixotic means highly idealistic but unrealistic and    impractical.<br> • Therefore, “Idealistic but unrealistic and    impractical” is the correct meaning in the given context.</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">I
