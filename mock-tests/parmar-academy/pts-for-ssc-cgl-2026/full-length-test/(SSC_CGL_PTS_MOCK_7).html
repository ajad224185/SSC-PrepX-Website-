ottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Explanation:</b></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Lord     Jagannath's Chariot:</b></span><span style=\"font-family:'Nirmala UI'\"> Nandighosh     (also called Garudadhwaja or Kapidhwaja) is the chariot of Lord     Jagannath during Puri's Rath Yatra.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Chariot     Specifications: </b></span><span style=\"font-family:'Nirmala UI'\">45     feet high, 16 wheels (7 ft diameter each), covered in red and     yellow cloth, pulled by rope named Sankhachuda.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Other     Deities' Chariots:</b></span></p>    </li></ul>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Taladhwaja:</b></span><span style=\"font-family:'Nirmala UI'\"> Lord     Balabhadra's chariot (14 wheels, red-green cloth).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Darpadalana     (Devadalana): </b></span><span style=\"font-family:'Nirmala UI'\">Goddess     Subhadra's chariot (12 wheels, red-black cloth).</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Jambunad:</b></span><span style=\"font-family:'Nirmala UI'\"> Not     associated with Rath Yatra chariots.</span></p>    </li></ol>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">How many pairs of Musical    Instruments are correctly mentioned as per their    nature (Chaturvidha Vadya):</span></p>    <ol type=\"i\">     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Dilruba     — Tata Vadya</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Mridangam     — Avanaddha Vadya</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Jalatarang     — Ghana Vadya</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Pungi     — Sushira Vadya</span></p>    </li></ol>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only one pair</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only two pairs</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only three pairs</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">All four pairs</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>All four pairs</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Dilruba     — Tata Vadya (String Instruments)</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Dilruba      is a </span><span style=\"font-family:'Nirmala UI'\"><b>bowed string      instrument (chordophone)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Classified      under </span><span style=\"font-family:'Nirmala UI'\"><b>Tata Vadya</b></span><span style=\"font-family:'Nirmala UI'\">,      which includes instruments producing sound through stretched      strings.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Mridangam     — Avanaddha Vadya (Percussion Instruments)</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Mridangam      is a </span><span style=\"font-family:'Nirmala UI'\"><b>double‑headed      drum</b></span><span style=\"font-family:'Nirmala UI'\"> with      membrane‑covered ends.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Classified      under </span><span style=\"font-family:'Nirmala UI'\"><b>Avanaddha Vadya</b></span><span style=\"font-family:'Nirmala UI'\">,      which includes instruments producing sound through stretched      membranes.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Jalatarang     — Ghana Vadya (Solid/Idiophones)</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Jalatarang      consists of </span><span style=\"font-family:'Nirmala UI'\"><b>porcelain      bowls filled with water</b></span><span style=\"font-family:'Nirmala UI'\">,      struck with sticks to produce sound.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Classified      under </span><span style=\"font-family:'Nirmala UI'\"><b>Ghana Vadya</b></span><span style=\"font-family:'Nirmala UI'\">,      which includes instruments producing sound by striking solid      material (idiophones).</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pungi     — Sushira Vadya (Wind Instruments)</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Pungi      is a </span><span style=\"font-family:'Nirmala UI'\"><b>reed‑based      wind instrument (aerophone)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Classified      under </span><span style=\"font-family:'Nirmala UI'\"><b>Sushira Vadya</b></span><span style=\"font-family:'Nirmala UI'\">,      which includes instruments producing sound through an air      column.</span></p>     </li></ul>    </li></ul>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which cricket bowler became the    first in history to take 700 T20 wickets in his career?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kuldeep Yadav</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Rashid Khan</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Jaspreet Bumrah</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mitchell Starc</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Rashid Khan</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Explanation</b></i></span><span style=\"font-family:'Nirmala UI'\"><i>:</i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Historic     Milestone:</b></span><span style=\"font-family:'Nirmala UI'\"> Rashid     Khan became the first bowler in cricket history to reach 700 T20     wickets during Afghanistan's T20 World Cup 2026 match against UAE     at Arun Jaitley Stadium, Delhi.</span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Landmark     Wicket:</b></span><span style=\"font-family:'Nirmala UI'\"> Dismissed     UAE's Muhammad Arfan (hit wicket attempting reverse sweep) in the     16th over, starting the match on 699 wickets.</span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Career     Stats:</b></span><span style=\"font-family:'Nirmala UI'\"> Leads     all-time T20 wicket-takers (Dwayne Bravo 2nd with 631, Sunil     Narine 3rd with 613); also holds T20I record with 191 wickets for     Afghanistan.</span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Context:</b></span><span style=\"font-family:'Nirmala UI'\"> Achieved     during Group D match on February 16, 2026, solidifying his status     as T20 cricket's most prolific bowler at age 27.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following pairs is    incorrectly matched?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Swadesh Darshan - Ministry of    Culture</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">PM MITRA - Ministry of Textiles</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Beti Bachao Beti Padhao - Ministry    of Women &amp; Child Dev</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">PM JANMAN - Ministry of Tribal    Affairs</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Answer - (a)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><br> </span><span style=\"font-family:'Nirmala UI'\"><b>a)    Swadesh Darshan:</b></span><span style=\"font-family:'Nirmala UI'\"> Handled    by the </span><span style=\"font-family:'Nirmala UI'\"><b>Ministry of    Tourism</b></span><span style=\"font-family:'Nirmala UI'\">, not the    Ministry of Culture. It focuses on developing tourist circuits    across India.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>b)    PM MITRA:</b></span><span style=\"font-family:'Nirmala UI'\"> Managed    by the </span><span style=\"font-family:'Nirmala UI'\"><b>Ministry of    Textiles</b></span><span style=\"font-family:'Nirmala UI'\"> to create    large-scale, integrated textile parks.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>c)    Beti Bachao Beti Padhao:</b></span><span style=\"font-family:'Nirmala UI'\"> Managed    by the </span><span style=\"font-family:'Nirmala UI'\"><b>Ministry of    Women &amp; Child Development</b></span><span style=\"font-family:'Nirmala UI'\"> (with    help from Health and Education ministries) to empower the girl    child.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>d)    PM JANMAN:</b></span><span style=\"font-family:'Nirmala UI'\"> Managed    by the </span><span style=\"font-family:'Nirmala UI'\"><b>Ministry of    Tribal Affairs</b></span><span style=\"font-family:'Nirmala UI'\"> to    uplift Particularly Vulnerable Tribal Groups (PVTGs).</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    about the Comptroller and Auditor General (CAG) of India and    answer which of them is/are correct?</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">1-    The CAG is established under Article 148 of the Indian    Constitution and holds office for a term of 6 years or until age    65, whichever is earlier.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">2-    The CAG is part of the legislative branch of the Government of    India and is directly responsible to the Union Parliament for its    functioning.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">3-    The CAG audits accounts of the Union government, all State    governments, and any body or authority that is substantially    financed by Government grants.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 &amp; 2 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 &amp; 3 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 &amp; 3 only</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2 &amp; 3 All</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">1 &amp; 3 only</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Explanation:</b></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     1 (Correct): </b></span><span style=\"font-family:'Nirmala UI'\">CAG     is established under Article 148 of the Constitution and holds     office for 6 years or till age 65, whichever is earlier.</span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     2 (Incorrect):</b></span><span style=\"font-family:'Nirmala UI'\"> CAG     is an independent constitutional authority, not part of any     government branch (executive, legislature, or judiciary); reports     to President but functionally autonomous.</span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     3 (Correct):</b></span><span style=\"font-family:'Nirmala UI'\"> CAG     audits Union/State government accounts and bodies/authorities     substantially financed by government grants (Article 149).</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">With reference to the human    digestive system, which among the following statements is/are    correct?</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">1-    Pepsin is a protein-digesting enzyme secreted by the stomach in an    active form.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">2-    The small intestine is the primary site of nutrient absorption in    the human body.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both 1 &amp; 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither 1 &amp; 2</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">2 only</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     1 (Incorrect): </b></span><span style=\"font-family:'Nirmala UI'\">Pepsin     is secreted by the stomach's chief cells as inactive pepsinogen,     which gets activated into pepsin by gastric acid (HCl). It is not     secreted in active form to protect stomach lining.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     2 (Correct): </b></span><span style=\"font-family:'Nirmala UI'\">The     small intestine (duodenum, jejunum, ileum) is indeed the primary     site for nutrient absorption, featuring villi/microvilli that     provide massive surface area (~200 m²) for carbohydrates,     proteins, fats, vitamins, and minerals.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Who among the following    personalities was popularly known as 'Lokahitawadi'?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Chittranjan Das</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">C.F. Andrews</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gopal Hari Deshmukh</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mahadev Govind Ranade</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Gopal Hari Deshmukh</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Explanation:</b></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pen     Name Origin:</b></span><span style=\"font-family:'Nirmala UI'\"> Gopal     Hari Deshmukh (1823-1892) wrote 108 influential articles in the     Marathi weekly Prabhakar under the pseudonym \"Lokahitawadi\"     (meaning \"one who works for public welfare\").</span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Social     Reform Contributions: </b></span><span style=\"font-family:'Nirmala UI'\">Advocated     rationalism, women's education, widow remarriage, eradication of     caste discrimination, and Western scientific learning while     critiquing religious orthodoxy.</span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key     Works:</b></span><span style=\"font-family:'Nirmala UI'\"> Lokhitawadinchi     Shatapatre (108 Letters of Lokahitawadi) became cornerstone of     Maharashtra's social reform movement.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Distinction    from Others:</b></span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Chittranjan     Das: Freedom fighter, Swaraj Party founder (\"Deshbandhu\").</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">C.F.     Andrews: British missionary, Gandhi's associate (\"Deenbandhu\").</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Mahadev     Govind Ranade: Moderate leader, social reformer and economist.</span></p>    </li></ol>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Who was appointed as the Secretary    of the Department of Water Resources, River Development &amp;    Ganga Rejuvenation of India in the late 2025?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bhupender Gupta</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Piyush Goyal</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Amrit Lal Meena</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">V.L. Kantha Rao</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">V.L. Kantha Rao</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Explanation:</b></i></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Appointment    Details:</b></span><span style=\"font-family:'Nirmala UI'\"> Shri V.L.    Kantha Rao took charge as Secretary, Department of Water    Resources, River Development &amp; Ganga Rejuvenation (DoWR,    RD&amp;GR), Ministry of Jal Shakti.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Predecessor:</b></span><span style=\"font-family:'Nirmala UI'\"> Replaced    Smt. Debashree Mukherjee, who moved to another position.</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In what way does the Indian    planning process reflect responsiveness to feedback and public    participation?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">By finalizing plans before any    public opinion is considered</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">By completely ignoring public and    expert suggestions</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">By consulting only foreign bodies    while preparing plans</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">By revising plan drafts based on    criticism and recommendations received</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct answer: </b></span><span style=\"font-family:'Nirmala UI'\">d)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Earlier     done by </span><span style=\"font-family:'Nirmala UI'\"><b>Planning     Commission (1950–2014)</b></span><span style=\"font-family:'Nirmala UI'\">,     now by </span><span style=\"font-family:'Nirmala UI'\"><b>NITI Aayog</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Uses </span><span style=\"font-family:'Nirmala UI'\"><b>“Bottom-up     + Cooperative federalism” approach</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Inputs     taken from </span><span style=\"font-family:'Nirmala UI'\"><b>State     governments, experts, and stakeholders</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Focus     on </span><span style=\"font-family:'Nirmala UI'\"><b>inclusive and     evidence-based policy making</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following Biosphere    Reserves in India is NOT recognized as a UNESCO World Heritage    Site?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sundarbans Biosphere Reserve</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Nanda Devi Biosphere Reserve</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Pachmarhi Biosphere Reserve</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Nilgiri Biosphere Reserve</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Pachmarhi Biosphere Reserve</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Explanation:</b></i></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">UNESCO    World Heritage Sites:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sundarbans:</b></span><span style=\"font-family:'Nirmala UI'\"> Designated     1987 for mangrove ecosystem and tiger conservation.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Nanda     Devi:</b></span><span style=\"font-family:'Nirmala UI'\"> Designated     1988 (expanded 1992) for Himalayan biodiversity.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Nilgiri     Biosphere Reserve:</b></span><span style=\"font-family:'Nirmala UI'\"> Designated     as UNESCO Biosphere Reserve in </span><span style=\"font-family:'Nirmala UI'\"><b>1986     (India's first)</b></span><span style=\"font-family:'Nirmala UI'\">, with     core areas part of Western Ghats World Heritage Site (2012).</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Pachmarhi:</b></span><span style=\"font-family:'Nirmala UI'\">Recognized     under UNESCO's Man and Biosphere (MAB) Programme (2009),     but </span><span style=\"font-family:'Nirmala UI'\"><b>not</b></span><span style=\"font-family:'Nirmala UI'\"> a     UNESCO World Heritage Site.</span></p>    </li></ol>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In which year Annexation of Mysore    was done by the British?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1817</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1831</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1837</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1848</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>1831</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Explanation:</b></i></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Direct    Annexation:</b></span><span style=\"font-family:'Nirmala UI'\"> The    British annexed Mysore in 1831 under Governor-General Lord William    Bentinck, citing misrule by Maharaja Krishnaraja Wodeyar III.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Historical    Context:</b></span><span style=\"font-family:'Nirmala UI'\"> Following    Tipu Sultan's defeat in the Fourth Anglo-Mysore War (1799), a    restored Wodeyar dynasty ruled under British oversight until 1831    when direct administration was imposed.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Restoration:</b></span><span style=\"font-family:'Nirmala UI'\"> Mysore    was returned to native rule in 1881 under Lord Ripon after British    administration improved governance.</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In a certain code language, ‘winter    is here’ is coded as xl vp jb, ‘today is a good day’ is    coded as ‘kl vp ds jp dp’, ‘be here today’ is coded as ‘    xp jb ds’ and ‘winter will be good’ is coded as ‘xp kb xl    dp.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">What    is the code of ‘winter is good today’?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">vp xp dp lp</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">xb xp ds dp</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">xl vp dp ds</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">jb vp xp xl</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To find the code of 'winter is good    today', use the logic of </span><span style=\"font-family:'Nirmala UI'\"><b>common    word </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    common code;</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>winter</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    common in 1st &amp; 4th </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>xl</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span style=\"font-family:'Nirmala UI'\"><b>is </b></span><span>→</span><span style=\"font-family:'Nirmala UI'\">    common in 1st &amp; 2nd </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>vp</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>good</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    common in 2nd &amp; 4th </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>dp</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>today </b></span><span>→</span><span style=\"font-family:'Nirmala UI'\">    common in 2nd &amp; 3rd </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>ds</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    xl vp dp ds, will be the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Read the following statements and    conclusions carefully. Assuming that the information given in the    statements is true, even if it appears to be at variance with    commonly known facts, decide which of the given conclusions </span><span style=\"font-family:'Nirmala UI'\"><b>do    NOT logically follow</b></span><span style=\"font-family:'Nirmala UI'\"> from    the statements.</span></p>    <p style=\"orphans:0;widows:0;margin-bot 5c671fa52e93ef.jpg\" width=\"250\" height=\"135\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion    I: </b></span><span style=\"font-family:'Nirmala UI'\">We have: “No    cloud is a stream” and “Some clouds are peaks.” This    establishes no definite relationship between peaks and streams</span><span style=\"font-family:'Nirmala UI'\"><b>.    Conclusion I does not follow.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion    II: </b></span><span style=\"font-family:'Nirmala UI'\">Some part of    mountains which overlaps with cloud cannot be the    peaks.</span><span style=\"font-family:'Nirmala UI'\"><b> Conclusion II    follows.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion    III: </b></span><span style=\"font-family:'Nirmala UI'\">No definite    relationship is given between streams and peaks.</span><span style=\"font-family:'Nirmala UI'\"><b> Conclusion    III does not follow.</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    only I and III, is the correct answers.</b></span></p>", "question_heading": ""}, {"sr_no": 28, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">A square sheet of paper is folded    along the dotted line successively along the line shown and is    punched in the last. How would the paper look when unfolded?</span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783068246765_html_33ae15be1592579b.png\" width=\"344\" height=\"87\" > </p>", "option1": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">a.</span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/webs yle=\"font-family:'Nirmala UI'\">C)    It is the most appropriate and balanced response which shows    responsibility, integrity, and respect for hierarchy.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    option c, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Read the following information to    answer these questions.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(i)    A # B means A is mother of B.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(ii)    A © B means A is sister of B.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(iii)    A * B means A is father of B.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(iv)    A â B means A is brother of B.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the following means K is maternal uncle of M?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">K â J # L * M</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">K © J #M â L</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">M © J * L © K</span></p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">K â J # L © M</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The symbols we have given;</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">#    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    mother</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">©    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    sister</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">*    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    father</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">â    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    brother</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Now,    check the given options;</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Option    a: K is brother of J, J is mother of L, L is father of M. (K    becomes grandfather of M).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Option    b: K is sister of J. (K is female here).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Option    c: M is sister of J, J is father of L, L is sister of K. (No    further information about K).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Option    d: K is brother of J, J is mother of L, L is sister of M.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    option d, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">A \"Security Key\" for a    number is generated by taking the remainders when the number is    divided by 9, 11, and 13 in that specific order.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">What    is the Security Key (Code) for the number 250?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">7, 8, 3</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">7, 8, 5</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 9, 4</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">7, 10, 3</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To find the </span><span style=\"font-family:'Nirmala UI'\"><b>Security    Key</b></span><span style=\"font-family:'Nirmala UI'\"> for the number    250, we need to calculate the remainders when 250 is divided by 9,    11, and 13 in that specific order.<br> 250 ÷ 9; Remainder </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    7</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">250    ÷ 11; Remainder </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    8</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">250    ÷ 13; Remainder </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    3</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Security    code is 7, 8, 3</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    7, 8, 3, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following question, a set of    letters is given, followed by its corresponding product of    alphabetical positions (A = 1, B = 2, …, Z = 26). A second pair    of letters is given without its product. Find the correct product    that follows the same pattern.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">BDF    : 48 :: CEH : ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">105</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">120</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">144</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">160</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">When numbers are compared with    letters, always check the alphabetical positions of the letters.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">BDF    : 48<br> B = 2, D = 4, F = 6</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Product    = 2 × 4 × 6 = </span><span style=\"font-family:'Nirmala UI'\"><b>48</b></span><span style=\"font-family:'Nirmala UI'\"> (matches    given)<br> C = 3, E = 5, H = 8<br> Product = 3 × 5 × 8    = </span><span style=\"font-family:'Nirmala UI'\"><b>120<br> Hence,    120 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If 24 ÷ 6 = A, 15 − 9 = B, 8 + 4    = C, and A # B = 6(A² − B), B $ C = (B × C) + B, A % B = (A #    B) − (B $ C). Then, find the value of A % B.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    −<span style=\"font-family:'Nirmala UI'\">12</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    −<span style=\"font-family:'Nirmala UI'\">18</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    −<span style=\"font-family:'Nirmala UI'\">24</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    −<span style=\"font-family:'Nirmala UI'\">30</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">First find values of A, B, C:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A    = 24 ÷ 6 = 4</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">B    = 15 − 9 = 6</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">C    = 8 + 4 = 12</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Now,    solve the given equations;</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>A    # B = 6(A² − B)</b></span><span style=\"font-family:'Nirmala UI'\"><br> =    6(4² − 6) = 6(16 − 6) = 60</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>B    $ C = (B × C) + B</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">=    (6 × 12) + 6 = 72 + 6 = 78</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Therefore</span><span style=\"font-family:'Nirmala UI'\"><b>,    A % B = (A # B) − (B $ C)</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">=    60 − 78 = −18<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Hence,    -18 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Given below are the number codes    for the given letters. Select the combination of numbers from the    options so that the letters arranged accordingly will form a    meaningful word.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">6    5 4 3 2 1</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">P    E O R R T</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">4, 3, 5, 2, 6, 1</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 3, 5, 2, 4, 6</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">4, 1, 3, 5, 2, 6</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6, 4, 3, 1, 5, 2</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Check the given options;</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Option    a: O R E R P T </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    (Not a word)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Option    b: T R E R O P </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    (Not a word)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Option    c: O T R E R P </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    (Not a word)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Option    d: P O R T E R </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    (A meaningful word; a person employed to carry luggage and other    loads, especially in a railroad station, airport, or hotel.)</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    6, 4, 3, 1, 5, 2, is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A bag contains 4 white, 2 black,    and 4 orange marbles. What is the probability of drawing a    non-orange marble?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">0.4</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">0.5</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">0.6</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">0.8</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To find the probability of drawing    a non-orange marble, we use the basic probability formula:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Total    marbles = 4 (white) + 2 (black) + 4 (orange) = 10</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Non-orange    marbles = white + black = 4 + 2 = 6</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Probability    = Favorable / Total</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">=    6 / 10 = 3 / 5 or 0.6<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Hence,    0.6 is the correct outcome.</b></span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following question, two    statements I and II are given. These statements may be causes or    effects of each other or independent causes. Read both statements    carefully and select the correct option.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statements:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">I.    The government has imposed heavy fines on industries releasing    untreated waste into rivers.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">II.    Several industries have started installing water treatment plants.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Statement I is the cause and    Statement II is its effect.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Statement II is the cause and    Statement I is its effect.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both statements I and II are    independent causes.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both statements I and II are    effects of independent causes.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Imposing heavy fines (Statement I)    creates pressure on industries.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">As    a result, industries take corrective action like installing    treatment plants (Statement II).<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Hence,    Statement I is the cause and Statement II is its effect, is the    correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Six players namely M, N, O, P, Q    and R are sitting around a circular table. Three of them are    facing inside, while the remaining are facing outside. No two    players sitting together face the same direction. Each player    plays a different game, namely Badminton, Golf, Football,    Basketball, Cricket and Tennis, but not necessarily in the    same order. M, who plays Cricket, faces inside. Q sits second to    the right of O, and Q and O play Basketball and Tennis    respectively. O does not sit adjacent to M. N faces inside and one    player sits between N and the player who plays Golf. P, who plays    Football, sits immediately to the right of the player who plays    Golf. Who is sitting third to the left of Q?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">S</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">N</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">R</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">T</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Given that no two players sitting    together face the same direction means all neighbours are facing    opposite direction to each other.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>M     faces inside</b></span><span style=\"font-family:'Nirmala UI'\"> which     sets the pattern of other neighbours face.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Q     (who plays Basketball)</b></span><span style=\"font-family:'Nirmala UI'\"> sits     second to the right of </span><span style=\"font-family:'Nirmala UI'\"><b>O     (who plays Tennis)</b></span><span style=\"font-family:'Nirmala UI'\"> but     O is not immediate neighbour of </span><span style=\"font-family:'Nirmala UI'\"><b>M     who plays Cricket,</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">N     faces inside and sits two places away from the one who place     Golf. The person who plays Golf has </span><span style=\"font-family:'Nirmala UI'\"><b>P     who plays Football </b></span><span style=\"font-family:'Nirmala UI'\">to     its immediate right.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Final    layout will be:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783068246765_html_dbd2e396cc28e35a.jpg\" width=\"250\" height=\"218\" > </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    R is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 42, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Study the Venn diagram carefully    and answer the following question.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783068246765_html_ff6dc299b000f6e6.png\" width=\"250\" height=\"184\" > </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">How    many introverts are creative?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">40</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">20</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">39</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">44</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To find the introverts who are    creative, first check the overlapping part of Venn diagram.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Total    part of introvert which is overlapping with creative is </span><span style=\"font-family:'Nirmala UI'\"><b>11    + 9 = 20</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    20 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If 12 + 18 = X and y/6=24, then x #    y =(x + y)/2 + 5, then the value of x # y?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">88</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">92</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">94</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">86</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Value of X = 12 + 18 = 30</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Value    of Y = y/6=24 = 24 × 6 = 144</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Now,    x # y = 30 + 144 /2 + 5</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">=    174 /2 + 5 = 87 + 5 = 92</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    92 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following questions, the    symbols #, $, @, * and © are used with the having meanings as    given below :</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">‘<span style=\"font-family:'Nirmala UI'\">P    # Q’ means ‘P is not smaller than Q’.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">‘<span style=\"font-family:'Nirmala UI'\">P    $ Q’ means ‘P is neither smaller than nor greater than Q’.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">‘<span style=\"font-family:'Nirmala UI'\">P    @ Q’ means ‘P is neither greater than nor equal to Q’.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">‘<span style=\"font-family:'Nirmala UI'\">P    * Q’ means ‘P is not greater than Q’.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">‘<span style=\"font-family:'Nirmala UI'\">P    © Q’ means ‘P is neither smaller than nor equal to Q’.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statements:</b></span><span style=\"font-family:'Nirmala UI'\"> X    $ K, K @ Z, X # M</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusions:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">I.    X $ M</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">II.    Z @ M</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I follows.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only II follows.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both I and II follow.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither I nor II follow.</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">After decoding, the statement    becomes</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">X    = K &lt; Z, X </span><span style=\"font-family:'Cambria Math'\">≥</span><span style=\"font-family:'Nirmala UI'\">    M</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion    I: X = M.</b></span><span style=\"font-family:'Nirmala UI'\"> We only    know X </span><span style=\"font-family:'Cambria Math'\">≥</span><span style=\"font-family:'Nirmala UI'\">    M, not necessarily equal. So, this conclusion does not follow.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion    II: Z &lt; M.</b></span><span style=\"font-family:'Nirmala UI'\"> We    know Z &gt; X and X </span><span style=\"font-family:'Cambria Math'\">≥</span><span style=\"font-family:'Nirmala UI'\">    M. So, Z &gt; X not less then. So, this conclusion also does not    follow.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    neither I nor II follows, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A two-digit number is 3 times the    sum of its digits. If 45 is added to the number, the digits are    reversed. What is the original number?</span></p>", "option1": "<p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">21</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">27</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">36</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">45</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Let the digit in the tens place be    x and the digit in the units place be y.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    value of the original number is</span><span style=\"font-family:'Nirmala UI'\"><b> 10x    + y.</b></span><span style=\"font-family:'Nirmala UI'\"><br> The value of    the reversed number is </span><span style=\"font-family:'Nirmala UI'\"><b>10y    + x.</b></span><span style=\"font-family:'Nirmala UI'\"><br> The number is    3 times the sum of its digits:<br> </span><br>     </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">10x     + y = 3(x + y)<br> </span><br>      </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">10x     + y = 3x + 3y<br> </span><br>      </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">7x     = 2y<br> </span><br>      </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">y     = 3.5x<br> </span><br>      </p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Adding    45 reverses the digits.<br> </span><br>     </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(10x     + y) + 45 = 10y + x<br> </span><br>      </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">9y     - 9x = 45<br> </span><br>      </p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Divide    the entire equation by 9: </span><span style=\"font-family:'Nirmala UI'\"><b>y    - x = 5</b></span><span style=\"font-family:'Nirmala UI'\"><br> Substitute    the value of y from the first equation (y = 3.5x) into the second    equation:<br> </span><br>     </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">3.5x     - x = 5<br> </span><br>      </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">2.5x     = 5<br> </span><br>      </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>x     = 2</b></span><span style=\"font-family:'Nirmala UI'\"><br> </span><br>      </p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Now,    find y<br> </span><br>     </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">y     = 3.5(2) = 7<br> </span><br>      </p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Tens    digit (x) is 2 and Units digit (y) is 7. </span><span style=\"font-family:'Nirmala UI'\"><b>The    original number is 27</b></span><span style=\"font-family:'Nirmala UI'\"><br> </span><span style=\"font-family:'Nirmala UI'\"><b>Sum    of digits: </b></span><span style=\"font-family:'Nirmala UI'\">2 + 7 =    9. Since 27 = 3 x 9, the first condition is    satisfied.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Reversal: </b></span><span style=\"font-family:'Nirmala UI'\">27    + 45 = 72. Since 72 is the reverse of 27, the second condition is    satisfied.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    27 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Six persons A, B, C, D, E, and F    bought cars on different dates—17th and 18th—of the months    January, March, and April. Each person bought a car on a unique    date. Exactly two persons bought their cars between A and E. A did    not buy a car in January. C and A bought their cars in the same    month.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Exactly    one person bought their car between B and D, with B buying before    D. E did not buy a car in April. B did not buy a car on 17th. D    bought a car on the 18th of one of the given months. F did    not buy a car on 18th. Who buy car on 17</span><sup><span style=\"font-family:'Nirmala UI'\">th</span></sup><span style=\"font-family:'Nirmala UI'\"> march?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">B</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">C</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">D</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">E</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Two     persons bought their cars between A and E and A is not in     January. So, </span><span style=\"font-family:'Nirmala UI'\"><b>A can     be in March and April along with C.</b></span><span style=\"font-family:'Nirmala UI'\"><br> </span><br>      </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">One     person is between B and D. B bought car in 18th of any month but     before D.<br> </span><br>      </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">E     did not bought car in April and F did not bought car in 18th.<br> </span><br>      </p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Final    layout</b></span><span style=\"font-family:'Nirmala UI'\"><br> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783068246765_html_5896dc96e68876b6.jpg\" width=\"250\" height=\"127\" > <span style=\"font-family:'Nirmala UI'\"><b>Hence,    E is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the set in which the numbers    are related in the same way as are the numbers of the following    set:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">(5,    60, 7)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">4, 45, 6</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6, 91, 8</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3, 24, 5</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">7, 120, 9</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">First compare the small numbers to    get the larger one. If we add both small numbers and compare it    with large number,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(5,    60, 7)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">5    + 7 = 12, 12 × 5 = 60</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The    pattern seems to be (1</b></span><sup><span style=\"font-family:'Nirmala UI'\"><b>st</b></span></sup><span style=\"font-family:'Nirmala UI'\"><b> number    +3</b></span><sup><span style=\"font-family:'Nirmala UI'\"><b>rd</b></span></sup><span style=\"font-family:'Nirmala UI'\"><b> number)    × first number = 2</b></span><sup><span style=\"font-family:'Nirmala UI'\"><b>nd</b></span></sup><span style=\"font-family:'Nirmala UI'\"><b> number</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Observe    the given options:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>4,    45, 6:</b></span><span style=\"font-family:'Nirmala UI'\"> 6 + 4 = 10 ×    4 = 40</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>6,    91, 8:</b></span><span style=\"font-family:'Nirmala UI'\"> 6 + 8 = 14 ×    6 = 84</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>3,    24, 5:</b></span><span style=\"font-family:'Nirmala UI'\"> 3 + 5 = 8 ×    3 = 24</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>7,    120, 9:</b></span><span style=\"font-family:'Nirmala UI'\"> 7 + 9 = 16    × 7 = 102<br> Only option c follows the pattern.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence, 3,    24, 5, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following question, a    statement is given followed by two assumptions numbered I and II.    (An assumption is something that is taken for granted or supposed    without proof.) You have to consider the statement and decide    which of the given assumptions is implicit in it.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    Government has introduced new income tax rules, simplifying tax    laws, modifying allowances like HRA and perks, and encouraging    taxpayers to adopt the new tax regime for easier compliance.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Assumptions:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">I.    Simplified tax rules will reduce the complexity faced by    taxpayers.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">II.    Taxpayers prefer ease of compliance over claiming multiple    deductions.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only assumption I is implicit</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only assumption II is implicit</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both I and II are implicit</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither I nor II is implicit</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Assumption I:</b></span><span style=\"font-family:'Nirmala UI'\"> If    govt is simplifying tax rules, it assumes complexity was a problem    and simplification will help. So, this assumption is following the    statement.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Assumption    II:</b></span><span style=\"font-family:'Nirmala UI'\"> Promoting new    tax regime (which removes many deductions) assumes people value    simplicity over tax-saving through deductions. So, this assumption    is following the statement.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    both I and II are implicit, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">84 is related to 40 following a    certain logic.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Following    the same logic, 156 is related to 64.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">To    which of the following is 243 related, following the same logic?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">88</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">70</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">89</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">90</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To find the number related to </span><span style=\"font-family:'Nirmala UI'\"><b>243</b></span><span style=\"font-family:'Nirmala UI'\">,    we first need to identify the pattern used in the given pairs.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Divide     84 by 3 = 84 ÷ 3 = 28</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Difference     between 28 and 40 is 40 – 28 = 12</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>So,    the pattern could be (1</b></span><sup><span style=\"font-family:'Nirmala UI'\"><b>st</b></span></sup><span style=\"font-family:'Nirmala UI'\"><b> ÷    3) + sum of digits of 1</b></span><sup><span style=\"font-family:'Nirmala UI'\"><b>st</b></span></sup><span style=\"font-family:'Nirmala UI'\"><b> number    = 2</b></span><sup><span style=\"font-family:'Nirmala UI'\"><b>nd</b></span></sup><span style=\"font-family:'Nirmala UI'\"><b> number.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Confirm    this pattern with </span><span style=\"font-family:'Nirmala UI'\"><b>156    : 64</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">156     ÷ 3 = 52 (+ 1 + 5 + 6) = 64</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Apply    this pattern to 243:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">243     ÷ 3 = 81</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">81     + (2 + 4 + 3) = 90</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    90 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In a certain number system, there    are only two symbols used to represent numbers: * and $. 0 is    represented as * and 1 is represented as $. The subsequent numbers    are represented in the following manner:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">2    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    $*</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">3    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    $$</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">4    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    $**</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">5    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    $*$ and so on.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">How    would you represent 23 in the given number system?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">$*$$$</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">$$*$$</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">$**$$</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">$$$*$</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The system follows binary    representation:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>0     is represented as *</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1     is represented as $.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">We    convert 23 into binary using repeated division by 2:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">23     ÷ 2 = </span><span style=\"font-family:'Nirmala UI'\"><b>11 remainder     1</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">11     ÷ 2 = </span><span style=\"font-family:'Nirmala UI'\"><b>5 remainder     1</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">5     ÷ 2 = </span><span style=\"font-family:'Nirmala UI'\"><b>2 remainder     1</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">2     ÷ 2 = </span><span style=\"font-family:'Nirmala UI'\"><b>1 remainder     0</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">1     ÷ 2 = </span><span style=\"font-family:'Nirmala UI'\"><b>0 remainder     1</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Now    read the remainders from bottom to top </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>10111</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Now    place: $ in place of 1 and * in place of 0.</span></p>    <p style=\"orphans:0;wido
