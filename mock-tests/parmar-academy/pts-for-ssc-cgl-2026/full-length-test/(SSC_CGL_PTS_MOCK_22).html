ll the pairs except 'PS - VY', the letters of the second    cluster are obtained by adding 7 to the positional values of the    corresponding letters in the first cluster:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">GL - NS: G(7)    + 7 = N(14), L(12) + 7 = S(19)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">EJ - LQ: E(5)    + 7 = L(12), J(10) + 7 = Q(17)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">MR - TY:    M(13) + 7 = T(20), R(18) + 7 = Y(25)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">However, in    PS - VY: P(16) + 6 = V(22) and S(19) + 6 = Y(25), where the    addition is +6 instead of +7.</p>    <p style=\"orphans:0;widows:0\">Hence, PS - VY is the odd one    out.</p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0\">    The position of how many letters will remain unchanged if each of    the letters in the word 'CHARITY' is arranged in English    alphabetical order?</p>", "option1": "<p style=\"orphans:0;widows:0\">    One</p>", "option2": " <p style=\"orphans:0;widows:0\">    Two</p>", "option3": " <p style=\"orphans:0;widows:0\">    Three</p>", "option4": " <p style=\"orphans:0;widows:0\">    Four</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Given word: CHARITY</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Original    positions: C (1), H (2), A (3), R (4), I (5), T (6), Y (7)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Alphabetical    order: A (1), C (2), H (3), I (4), R (5), T (6), Y (7)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Comparing    both orders:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Position 6:    T remains T</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- Position 7:    Y remains Y</p>    <p style=\"orphans:0;widows:0\">Therefore, the positions of 2    letters ('T' and 'Y') remain unchanged.</p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Identify the option that is EXACTLY identical to the given    address:</p>    <p style=\"orphans:0;widows:0\">Plot No. 142/A, Blossom Heights,    M.G. Road, Vijayawada, Andhra Pradesh - 520010</p>", "option1": "<p style=\"orphans:0;widows:0\">    Plot No. 142/A, Blossom Heights, M.G. Road, Vijayawada, Andhra    Pradesh - 520001</p>", "option2": " <p style=\"orphans:0;widows:0\">    Plot No. 142/A, Blossom Heights, M.G. Road, Vijaywada, Andhra    Pradesh - 520010</p>", "option3": " <p style=\"orphans:0;widows:0\">    Plot No. 142/A, Blossom Heights, M.G. Road, Vijayawada, Andhra    Pradesh - 520010</p>", "option4": " <p style=\"orphans:0;widows:0\">    Plot No. 142/A, Blossom Height, M.G. Road, Vijayawada, Andhra    Pradesh - 520010</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Option C is an exact match to the given address in spelling,    capitalization, punctuation, and PIN code.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Errors in    other options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• Option A:    Incorrect PIN code ('520001' instead of '520010').</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• Option B:    Spelling error in city name ('Vijaywada' instead of 'Vijayawada').</p>    <p style=\"orphans:0;widows:0\">• Option D: Word missing 's'    ('Blossom Height' instead of 'Blossom Heights').</p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0\">    In the following question, four groups of letter-number pairs are    given. Three of them are alike in a certain way and one is    different. Select the group that does NOT follow the same pattern    as the others.</p>", "option1": "<p style=\"orphans:0;widows:0\">    C3 : F6 : I9</p>", "option2": " <p style=\"orphans:0;widows:0\">    G7 : J10 : M13</p>", "option3": " <p style=\"orphans:0;widows:0\">    P16 : S19 : V22</p>", "option4": " <p style=\"orphans:0;widows:0\">    D4 : H8 : L12</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In options A, B, and C, the positional value of each successive    letter increases by     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_6b4f68fe261e0288.gif\" > ,    and the accompanying number represents the exact positional value    of the corresponding letter:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option A:    C(3) → F(6) → I(9) (Gap of +3)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option B:    G(7) → J(10) → M(13) (Gap of +3)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option C:    P(16) → S(19) → V(22) (Gap of +3)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option D:    D(4) → H(8) → L(12) (Gap of +4)</p>    <p style=\"orphans:0;widows:0\">In option D, the positional value    increases by     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_821a5d4e6532d792.gif\" >     instead of     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_6b4f68fe261e0288.gif\" > .    Therefore, D4 : H8 : L12 is the odd one out.</p>", "question_heading": ""}, {"sr_no": 45, "question": "Inौपनहcपiयn: Rधोक पुध giॅधn ौपोपधंधnप ोnक कधciकध थुicु यी पुध ोौौहंूपiयnौ iौ/ोनध iंूिiciप in पुध ौपोपधंधnप. Sपोपधंधnप: Wुiिध कigiपोि िधोनning ूिोपीयनंौ यीीधन ीिधसiृिध धकहcोपiयn, iप iौ cनहciोि पय धौपोृिiौु नयृहौप कोपो ूनiॅोcद नधgिहोपiयnौ पय ूनयपधcप ौपहकधnपौै ूधनौयnोि inीयनंोपiयn ीनयं हnोहपुयनप्रधक ोccधौौ. Aौौहंूपiयnौ: I. Digiपोि िधोनning ूिोपीयनंौ ुोnिकध ौपहकधnपौै ूधनौयnोि inीयनंोपiयn. II. Rयृहौप कोपो ूनiॅोcद नधgिहोपiयnौ ोनध nधcधौौोनद पय ौोीधgहोनक ोgोinौप हnोहपुयनप्रधक ोccधौौ. III. Digiपोि िधोनning ूिोपीयनंौ थiिि cयंूिधपिधद नधूिोcध पनोकiपiयnोि cिोौौनययंौ in पुध ीहपहनध.", "option1": "<p style=\"orphans:0;widows:0\">    Only I and II are implicit</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only II and III are implicit</p>", "option3": " <p style=\"orphans:0;widows:0\">    Only I and III are implicit</p>", "option4": " <p style=\"orphans:0;widows:0\">    All I, II and III are implicit</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Assumption I is implicit because recommending data privacy    regulations for digital learning platforms assumes that these    platforms handle or collect students' personal information.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Assumption II    is implicit because the statement highlights that establishing    regulations is essential to protect against unauthorized access.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Assumption    III is not implicit because the statement does not assume or state    that traditional classrooms will be completely replaced.</p>    <p style=\"orphans:0;widows:0\">Therefore, only assumptions I and    II are implicit.</p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Ten persons are sitting in two parallel rows containing five    persons each, such that there is an equal distance between    adjacent persons.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Line 1: Five    persons (A, B, C, D and E) are seated and all of them are facing    South.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Line 2: Five    persons (P, Q, R, S and T) are seated and all of them are facing    North.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Based on the    arrangement, answer the question:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• R sits at    the extreme left end of Line 2.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• T sits    third to the right of R.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• B sits    opposite to T.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• C sits to    the immediate right of B.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• Q sits    opposite to C.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">• P does    not sit adjacent to R.</p>    <p style=\"orphans:0;widows:0\">Who sits to the immediate left of    Q in Line 2?</p>", "option1": "<p style=\"orphans:0;widows:0\">    S</p>", "option2": " <p style=\"orphans:0;widows:0\">    P</p>", "option3": " <p style=\"orphans:0;widows:0\">    T</p>", "option4": " <p style=\"orphans:0;widows:0\">    R</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    1. Line 2 faces North. R sits at the extreme left end, so R is at    Position 1 (from left to right).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. T sits    third to the right of R, so T is at Position 4.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. B is    opposite to T, so B is at Position 4 of Line 1.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Line 1    faces South, so the immediate right of B is towards Position 3.    Thus, C is at Position 3 in Line 1.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">5. Q sits    opposite to C, which puts Q at Position 3 in Line 2.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">6. P does not    sit adjacent to R, so P is at Position 5, leaving S at Position 2    in Line 2.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Line 2    arrangement from left to right: R, S, Q, T, P.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><a name=\"_GoBack\"></a>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_d39073391476f390.gif\" > </p>    <p style=\"orphans:0;widows:0\">Therefore, S sits to the    immediate left of Q.</p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0\">    At a gathering, 5 friends meet each other. If each friend shakes    hands with every other friend exactly once, how many handshakes    take place in total?</p>", "option1": "<p style=\"orphans:0;widows:0\">    10</p>", "option2": " <p style=\"orphans:0;widows:0\">    20</p>", "option3": " <p style=\"orphans:0;widows:0\">    15</p>", "option4": " <p style=\"orphans:0;widows:0\">    25</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The total number of handshakes among     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_91a32e31e2476724.gif\" >     people is given by the formula     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_c994cbafd7e61c27.gif\" > .</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Here,     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_795ba440b13224d.gif\" > .</p>    <p style=\"orphans:0;widows:0\">Total handshakes =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_aabb0b1aff3a7724.gif\" > .</p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Which of the following options will logically complete the given    sequence?</p>    <p style=\"orphans:0;widows:0\">Seed, Sprout, Plant, Flower, ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Fruit</p>", "option2": " <p style=\"orphans:0;widows:0\">    Root</p>", "option3": " <p style=\"orphans:0;widows:0\">    Leaf</p>", "option4": " <p style=\"orphans:0;widows:0\">    Stem</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given sequence represents the logical stages in the growth    cycle of a plant:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Seed</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Sprout</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Plant</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Flower</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">5. Fruit</p>    <p style=\"orphans:0;widows:0\">Therefore, the question mark will    be replaced by 'Fruit'.</p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Read the given statement carefully and decide which of the given    conclusions logically follow(s) from the statement.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Statement:    Every employee in the marketing department attended the annual    meeting.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Conclusions:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">I. No    employee from the marketing department was absent at the annual    meeting.</p>    <p style=\"orphans:0;widows:0\">II. The meeting was mandatory for    all employees of the company.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Only conclusion I follows</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only conclusion II follows</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both conclusions I and II follow</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither conclusion I nor II follows</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Conclusion I directly follows because if every employee in the    marketing department attended the meeting, it logically means no    employee from that department was absent.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Conclusion II    does not follow because the statement only provides information    about the marketing department's attendance, not whether the    meeting was mandatory for the whole company.</p>    <p style=\"orphans:0;widows:0\">Hence, only conclusion I follows.</p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"orphans:0;widows:0\">    Each of the letters in the word BRAIN is arranged in alphabetical    order from left to right. How many letters are there in the    English alphabetical series between the letter which is second    from the left and the letter which is second from the right in the    new letter arrangement?</p>", "option1": "<p style=\"orphans:0;widows:0\">    10</p>", "option2": " <p style=\"orphans:0;widows:0\">    11</p>", "option3": " <p style=\"orphans:0;widows:0\">    9</p>", "option4": " <p style=\"orphans:0;widows:0\">    12</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    When the letters of the word BRAIN are arranged in alphabetical    order from left to right, we get:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A, B, I, N, R</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Letter second    from the left = B (2nd letter of the English alphabet)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Letter second    from the right = N (14th letter of the English alphabet)</p>    <p style=\"orphans:0;widows:0\">Number of letters between B and N    in the alphabetical series = (14 - 2) - 1 = 11 letters (C, D, E,    F, G, H, I, J, K, L, M).</p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the following statements regarding the Ordinance-Making Power    of the President (Article 123) and Governor (Article 213) is/are    correct?</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1.    An Ordinance issued when both Houses of Parliament are in session    is legally valid if approved by the Cabinet.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2.    An Ordinance promulgated by the President can amend or repeal any    Act of Parliament or another Ordinance.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">3.    The Governor cannot promulgate an Ordinance without the    President's prior instruction if a Bill containing the same    provisions would have required the President's previous sanction.</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the above statements are correct?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 2 only</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2    and 3 only</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 3 only</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1,    2 and 3</span></span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     1 is incorrect: An ordinance issued when both Houses are in     session is void. It can only be issued when either or both Houses     are in recess.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statements     2 &amp; 3 are correct: An ordinance has the same force as a     Parliamentary Act and can amend/repeal statutes. Under Article     213, the Governor requires Presidential instructions for specific     reserved matters.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Extra     Facts:</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Maximum     life of an Ordinance: 6 months and 6 weeks.</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Landmark     Case: D.C. Wadhwa v. State of Bihar (1987) ruled that     re-promulgation of ordinances without placing them before the     legislature is unconstitutional.</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Assertion    (A): The writ of Habeas Corpus can be issued against both public    authorities and private individuals.</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Reason    (R): The primary purpose of Habeas Corpus is to enforce a legal    duty when a public official has failed to perform his statutory    obligation.</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Both    A and R are true, and R is the correct explanation of A.</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Both    A and R are true, but R is not the correct explanation of A.</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A    is true, but R is false.</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A    is false, but R is true.</span></span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Assertion    (A) is true: Habeas Corpus (literally \"to have the body of\")    protects against unlawful detention by both state and private    individuals.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Reason    (R) is false: The writ used to command a public official to    perform a statutory duty is Mandamus (\"We Command\"), not    Habeas Corpus.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Extra    Facts:</b></u></span></span></p>    <ul>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Quo-Warranto:     Prevents illegal usurpation of a public office.</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Certiorari:     Issued by a higher court to quash an order of an inferior     court/tribunal due to lack or excess of jurisdiction.</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Match    the Parliamentary Committees and Constitutional Bodies with their    core functions:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">List-I    (Body / Committee) List-II (Core Function / Feature)</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A.    Public Accounts Committee (</span></span><span style=\"font-family:'Nirmala UI'\"><span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">लोक    लेखा समिति</span></span></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">)    1. Examines reports of the CAG and consists of 22 members (15 LS +    7 RS).</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">B.    Estimates Committee (</span></span><span style=\"font-family:'Nirmala UI'\"><span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">प्राकलन    समिति</span></span></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">)    2. Consists of 30 members drawn exclusively from Lok Sabha.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">C.    Finance Commission (</span></span><span style=\"font-family:'Nirmala UI'\"><span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">वित्त    आयोग</span></span></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">)    3. Recommends principles governing Grants-in-Aid under Article    275.</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">D.    GST Council (</span></span><span style=\"font-family:'Nirmala UI'\"><span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">जीएसटी    परिषद</span></span></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">)    4. Constitutional body constituted under Article 279A chaired by    Union FM.</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-1,    B-2, C-3, D-4</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-2,    B-1, C-4, D-3</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-1,    B-3, C-2, D-4</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-4,    B-2, C-3, D-1</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">PAC     -&gt; 22 members; examines CAG audit reports.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Estimates     Committee -&gt; 30 members (all Lok Sabha); largest committee.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Finance     Commission -&gt; Quasi-judicial body under Article 280.</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">GST     Council -&gt; Joint forum of Union &amp; States under Article     279A.</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the following changes was/were introduced by the 44th    Constitutional Amendment Act, 1978?</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1.    Replaced the word 'internal disturbance' with 'armed rebellion' in    Article 352.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2.    Provided that the Fundamental Rights guaranteed under Articles 20    and 21 cannot be suspended even during a National Emergency.</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">3.    Made the advice tendered by the Council of Ministers binding on    the President without any scope for reconsideration.</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 2 only</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2    and 3 only</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 3 only</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1,    2 and 3</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statements     1 &amp; 2 are correct.</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     3 is incorrect: The 44th Amendment authorized the President to     return executive advice for reconsideration once (though the     reconsidered advice is binding). It was the 42nd Amendment (1976)     that originally made advice unconditionally binding.</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Consider    the following statements regarding Emperor Ashoka's Edicts:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1.    The Major Rock Edict XIII describes the Kalinga War and mentions    contemporary Hellenistic kings including Antiochus II of Syria and    Ptolemy II of Egypt.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2.    Major Rock Edict I bans animal sacrifice and prohibits festive    gatherings (Samaja).</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">3.    The inscriptions in the northwestern part of Ashoka's empire (such    as Mansehra and Shahbazgarhi) were written in the Kharosthi script    from right to left.</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the statements given above are correct?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 2 only</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2    and 3 only</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 3 only</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1,    2 and 3</span></span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     1: Major Rock Edict XIII describes the Kalinga War and mentions     contemporary Hellenistic rulers.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     2: Major Rock Edict I prohibits animal sacrifice and restricts     Samaja (festive gatherings).</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     3: Mansehra and Shahbazgarhi inscriptions were written in     Kharosthi script, which is written right to left.</span></span></p>    </li></ul>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Facts:</b></u></span></span></p>    <ul>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Major     Rock Edict I → Animal sacrifice &amp; Samaja.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Major     Rock Edict XIII → Kalinga War &amp; Greek/Hellenistic rulers.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Shahbazgarhi     &amp; Mansehra → Kharosthi script.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Kharosthi     → Written right to left; mainly used in northwestern India.</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Ashoka's     inscriptions → Mainly in Prakrit language and Brahmi script;     Kharosthi was used in the northwest.</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    Sultan of Delhi constructed the Siri Fort, introduced market    reforms under Shahna-i-Mandi, and built the Alai Darwaza    displaying the first true horseshoe arch in India?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Qutb-ud-din    Aibak</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Shams-ud-din    Iltutmish</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Alauddin    Khalji</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Ghiyas-ud-din    Tughlaq</span></span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Alauddin     Khalji constructed Siri Fort, introduced strict market control     reforms under the Shahna-i-Mandi, and built the Alai Darwaza,     famous for its use of the true horseshoe arch.</span></span></p>    </li></ul>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Facts:</b></u></span></span></p>    <ul>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Alauddin     Khalji → Siri Fort + Market Control System</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Shahna-i-Mandi     → Officer supervising the market</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Alai     Darwaza → Built in 1311 AD</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Alai     Darwaza → Noted for true arches, domes and Islamic     architectural features</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Siri     → One of the seven cities of Delhi associated with Alauddin     Khalji.</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 57, "question": "Mोपcु पुध 19पु-cधnपहनद Rधीयनं Oनgोnप्रोपiयnौ, पुधiन Fयहnकधनौ, ोnक ोौौयciोपधक Pहृिicोपiयnौ: Liौप-I (Oनgोnप्रोपiयn) -- Liौप-II (Fयहnकधन) -- Liौप-III (Aौौयciोपधक Jयहनnोि/Bयया) A. Bनोुंय Sोंोु -- 1. Jदयपiनोय Pुिहध -- स. Sोपदोनपु Pनोाोौु B. Aनदो Sोंोु -- 2. Rोुो Rों Mयुोn Rयद -- द. Gिहोंgiनi C. Sोपदोौुयकुोा Sोंोु -- 3. Sथोंi Dोदोnोnक Sोनोौथोपi -- श. Miनोप-िह-Aाृोन", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-2-z,    B-3-x, C-1-y</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-2-x,    B-3-z, C-1-y</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-3-z,    B-2-x, C-1-y</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-1-y,    B-3-x, C-2-z</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Brahmo     Samaj --&gt; Raja Ram Mohan Roy (Mirat-ul-Akbar in Persian,     Sambad Kaumudi in Bengali).</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Arya     Samaj --&gt; Swami Dayanand Saraswati (Satyarth Prakash).</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Satyashodhak     Samaj --&gt; Jyotirao Phule (Gulamgiri, Sarvajanik Satya Dharma).</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Regarding    the Civil Disobedience Movement (1930) and the Dandi March,    consider the following statements:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1.    Gandhiji started the Dandi March from Sabarmati Ashram on March    12, 1930, with 78 chosen followers and reached Dandi on April </span></span><span style=\"font-size:12pt\"><span>6</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">,    1930.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2.    C. Rajagopalachari led a salt march from Trichinopoly to    Vedaranyam on the Tanjore coast.</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">3.    K. Kelappan organized a salt march along the Malabar coast from    Calicut to Payyanur.</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 2 only</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2    and 3 only</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 3 only</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1,    2 and 3</span></span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">I</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>mportant    Facts:</b></u></span></span></p>    <ul>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Civil     Disobedience Movement → Launched in 1930 under Mahatma Gandhi's     leadership.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Dandi     March → 12 March</span></span><span style=\"font-size:12pt\"><span>     </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">–</span></span><span style=\"font-size:12pt\"><span>     6</span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">     April 1930, from Sabarmati Ashram to Dandi.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">78     Satyagrahis → Accompanied Gandhi in the Dandi March.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Main     objective → Protest against and break the British Salt Law.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">C.     Rajagopalachari → Led the Trichinopoly–Vedaranyam Salt March     in Tamil Nadu.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">K.     Kelappan → Led the Calicut–Payyanur Salt March in Malabar.</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Salt     Marches → Became an important method of spreading the Civil     Disobedience Movement across different regions of India.</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><b>Match    the Economic Curves with the parameters they relate:</b></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>List-I    (Economic Curve)</b></u></span></span><span style=\"font-size:12pt\"><span><u><b>    -- </b></u></span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>List-II    (Parameters Related)</b></u></span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A.    Laffer Curve</span></span><span style=\"font-size:12pt\"><span>    -- </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1.    Tax rates vs Government tax revenue</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">B.    Phillips Curve</span></span><span style=\"font-size:12pt\"><span>    -- </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2.    Rate of inflation vs Rate of unemployment</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">C.    Lorenz Curve</span></span><span style=\"font-size:12pt\"><span>    -- </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">3.    Income distribution / Inequality in a population</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">D.    Kuznets Curve</span></span><span style=\"font-size:12pt\"><span>    -- </span></span><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">4.    Per capita income vs Environmental degradation / Inequality</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-1,    B-2, C-3, D-4</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-2,    B-1, C-4, D-3</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-1,    B-3, C-2, D-4</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-4,    B-2, C-3, D-1</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Laffer     Curve → Tax rate ↔ Tax revenue; very high tax rates can     reduce tax revenue.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Phillips     Curve → Inflation ↔ Unemployment; traditionally shows an     inverse relationship in the short run.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Lorenz     Curve → Income/wealth distribution; greater deviation from the     Line of Equality indicates greater inequality.</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Kuznets     Curve → Income inequality generally rises and then falls as     income increases (inverted-U hypothesis). The environmental     version is commonly called the Environmental Kuznets Curve (EKC).</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the following monetary instruments will the Reserve Bank of    India (RBI) use to REDUCE excess liquidity (money supply) in the    market during inflationary pressure?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Lowering    the Cash Reserve Ratio (CRR)</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Purchasing    Government Securities under Open Market Operations (OMO)</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Increasing    the Repo Rate and Marginal Standing Facility (MSF) rate</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Decreasing    the Statutory Liquidity Ratio (SLR)</span></span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">During     inflation, RBI follows a contractionary monetary policy to reduce     excess liquidity. Increasing the Repo Rate and MSF Rate makes     borrowing costlier for banks, reducing credit availability and     money supply in the market.</span></span></p>    </li></ul>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Facts:</b></u></span></span></p>    <ul>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Repo     Rate ↑ → Borrowing by banks becomes expensive → Credit ↓     → Money supply ↓</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">MSF     Rate ↑ → Emergency/overnight borrowing becomes costlier →     Liquidity ↓</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">CRR     ↑ → Banks keep more money with RBI → Lending capacity ↓</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">SLR     ↑ → Banks invest more in liquid assets → Lending capacity ↓</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">OMO     Sale of Government Securities → RBI absorbs liquidity from the     market.</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Inflation     → Contractionary monetary policy → Money supply ↓</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 61, "question": "Cयnौiकधन पुध ीियियथing ौपोपधंधnपौ नधgोनकing Nोपiयnोि Incयंध Accयहnपing: 1. Gनयौौ Nोपiयnोि Pनयकहcप ोप Mोनाधप Pनicध (GNPMP) = Gनयौौ Dयंधौपic Pनयकहcप ोप Mोनाधप Pनicध (GDPMP) + Nधप Fोcपयन Incयंध ीनयं Aृनयोक (NFIA). 2. Nधप Nोपiयnोि Pनयकहcप ोप Fोcपयन Cयौप (NNPFC) iौ ीयनंोििद नधcयgnप्रधक ोौ पुध Nोपiयnोि Incयंध (NI) यी ो cयहnपनद. 3. Pधनौयnोि Incयंध धतहोिस Nोपiयnोि Incयंध ंinहौ हnकiौपनiृहपधक cयनूयनोपध ूनयीiपौ, ंinहौ cयनूयनोपध पोसधौ, ूिहौ ौयciोि ौधcहनiपद पनोnौीधन ूोदंधnपौ.", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 2 only</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2    and 3 only</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 3 only</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1,    2 and 3</span></span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     1 is CORRECT: GNPMP = GDPMP + NFIA. (Net Factor Income from     Abroad = Income earned by domestic residents abroad - Income     earned by foreign residents domestically).</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     2 is CORRECT: Net National Product at Factor Cost (NNPFC) is the     precise technical measure designated as the National Income (NI)     of a nation.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     3 is CORRECT: Personal Income = National Income - Corporate Taxes     - Undistributed Corporate Profits + Transfer Payments(e.g.,     pensions, unemployment allowances).</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Important     Points:</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Key     Conversion Formulas:</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Net     = Gross - Depreciation</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Factor     Cost = Market Price - Net Indirect Taxes (NIT)</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">NIT     = Indirect Taxes - Subsidies</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Consider    the following statements about the Production Linked Incentive    (PLI) scheme :</span></span></p>    <ol>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">It     aims to increase the share of manufacturing sector in India's GDP     to 25% and claims its place among the world's leading industrial     economies.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     scheme extends an incentive of 10% to 14% on incremental sales     for a period of five years subsequent to the base year.</span></span></p>    </li></ol>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the statements given above is/are correct?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    only</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2    only</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Both    1 and 2</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Neither    1 nor 2</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Facts:</b></u></span></span></p>    <ul>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">PLI     Scheme → Launched in 2020 to promote domestic manufacturing and     reduce import dependence.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Covers     14 key sectors, including electronics, pharmaceuticals,     automobiles, telecom, textiles and solar PV modules.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Incentive     is generally linked to incremental production/sales, but the rate     and duration differ across sectors.</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">25%     GDP manufacturing target → Associated with the broader Make in     India/National Manufacturing Policy vision, not a standard PLI     objective.</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">What    does the term ‘Orange Economy’ refer to?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Economic    activities linked to creativity, culture and intellectual property    that generate income and jobs</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Economic    activities linked to desert ecosystems and their unique    socio-environmental characteristics</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Economic    activities linked to the aging population, including health care,    leisure, and services for older adults</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Informal,    unaccounted, or illegal economic activities that evade taxation    and regulation</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Orange    Economy, also called the Creative Economy, refers to economic    activities based on creativity, culture, knowledge and    intellectual property. It includes sectors such as arts, music,    films, publishing, design, advertising, fashion and digital    content.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Facts:</b></u></span></span></p>    <ul>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Orange     Economy = Creative Economy</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Based     on creativity, culture &amp; intellectual property (IP).</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Generates     income, employment and economic value.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Major     areas → Music, films, arts, design, publishing, advertising,     fashion, gaming &amp; digital media.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Colour     Economy terms: Orange → Creative; Blue → Ocean-based economy;     Green → Environmentally sustainable economy.</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Remember:     Orange = Creativity + Culture + Intellectual Property.</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Consider    the following statements:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">I.    Blood of 'A' group has anti-B antibodies in plasma.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">II.    Blood of 'AB' group has both 'A' and 'B' antigens in RBCs.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">III.    Blood of 'AB' group cannot be given to a person having 'A' blood    group.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">IV.    Blood of 'O' group does not possess any antibody in plasma.</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the statements given above are correct?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">II,    III and IV</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">I,    II and IV</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">I,    III and IV</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">I,    II and III</span></span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     I (Correct): Blood group A has A antigens on the surface of RBCs     and anti-B antibodies circulating in the plasma.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     II (Correct): Blood group AB has both A and B antigens on RBCs     and contains no anti-A or anti-B antibodies in plasma.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     III (Correct): Group AB blood carries B antigens. If injected     into an 'A' group recipient, the recipient's anti-B antibodies     will attack the foreign red blood cells. Thus, AB blood cannot be     given to an A recipient.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     IV (Incorrect): Blood group O lacks A and B antigens on RBCs, but     its plasma contains both anti-A and anti-B antibodies.</span></span></p>    </li></ul>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Points:</b></u></span></span></p>    <ul>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Group     A: A antigen | Anti-B antibody | Can receive from A, O</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Group     B: B antigen | Anti-A antibody | Can receive from B, O</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Group     AB: A &amp; B antigens | No antibodies | Universal Recipient (Can     receive from A, B, AB, O)</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Group     O: No antigens | Anti-A &amp; Anti-B antibodies | Universal Donor     (Can donate to A, B, AB, O)</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the following pairs of Bilateral Joint Military Exercises of    India is INCORRECTLY matched?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Dharama    Guardian – India &amp; Japan</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Mitra    Shakti – India &amp; Sri Lanka</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Dustlik    – India &amp; Uzbekistan</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Nomadic    Elephant – India &amp; Kyrgyzstan</span></span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Option     1 is correct: Dharma Guardian is a bilateral military exercise     between India and Japan.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Option     2 is correct: Mitra Shakti is conducted between India and Sri     Lanka.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Option     3 is correct: Dustlik is a bilateral exercise between India and     Uzbekistan.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Option     4 is INCORRECT (and hence the answer): Nomadic Elephant is     conducted between India and Mongolia, not Kyrgyzstan. The     India–Kyrgyzstan exercise is Khanjar.</span></span></p>    </li></ul>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    facts:</b></u></span></span></p>    <ul>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Dharma     Guardian → India–Japan</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Mitra     Shakti → India–Sri Lanka</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Dustlik     → India–Uzbekistan</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Nomadic     Elephant → India–Mongolia</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Khanjar     → India–Kyrgyzstan</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    one of the following statements in respect of Government of    India's tribal development schemes/policies is not correct?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Pradhan    Mantri Janjatiya Unnat Gram Abhiyan (PM JUGA) is the largest    tribal development programme in India's history.</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">PM    JUGA is rooted in Gandhian ideology.</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Pradhan    Mantri Janjati Adivasi Nyaya Maha Abhiyan (PM-JANMAN) is meant for    the holistic development of Particularly Vulnerable Tribal Groups    (PVTGs).</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">PM-JANMAN    builds on PM JUGA.</span></span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     (a) is correct: PM JUGA (outlay of ₹79,156 crore covering     ~63,000 villages across 30 States/UTs) is the largest tribal     development program in India's history.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     (b) is correct: PM JUGA is rooted in Gandhian ideology, aiming     for rural self-reliance and uplifting the last person in society.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     (c) is correct: PM-JANMAN was specifically launched for the     targeted, holistic development of 75 Particularly Vulnerable     Tribal Groups (PVTGs).</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     (d) is INCORRECT (and hence the answer): The timeline is     reversed. PM-JANMAN was launched first in November 2023. PM JUGA     was launched later in October 2024 and builds upon the learnings     and framework of PM-JANMAN to extend saturation coverage to all     Scheduled Tribes across tribal-majority villages.</span></span></p>    </li></ul>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Points:</b></u></span></span></p>    <ul>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">PM-JANMAN:     Launched Nov 2023 | Targeted specifically at PVTGs (28 lakh     population)</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">PM     JUGA: Launched Oct 2024 | Broader mandate covering all Scheduled     Tribes (5+ crore population)</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Key     Concept: PM JUGA builds on PM-JANMAN (not the other way around).</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 67, "question": "  <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Match
