span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-2,    B-1, C-4, D-3</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-1,    B-3, C-2, D-4</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-4,    B-2, C-3, D-1</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Andaman     side → 10° &amp; Duncan</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">10°     Channel → Little Andaman ↔ Car Nicobar</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Duncan     Passage → South Andaman ↔ Little Andaman</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Lakshadweep     side → 9° &amp; 8°</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">9°     Channel → Lakshadweep ↔ Minicoy</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">8°     Channel → Minicoy ↔ Maldives</span></span></p>    </li></ul>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Easy    sequence to remember:</b></u></span></span></p>    <ul>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">8     → Minicoy–Maldives</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">9     → Lakshadweep–Minicoy</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">10     → Andaman–Nicobar</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Duncan     → South Andaman–Little Andaman</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Consider    the following statements regarding Peninsular Indian Rivers:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1.    Godavari is the largest Peninsular river system originating from    Trimbakeshwar in Nashik, Maharashtra.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2.    The Narmada and Tapi rivers flow through rift valleys in a    westward direction and drain into the Gulf of Khambhat without    forming deltas.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">3.    The Majuli Island, the world's largest inhabited riverine island,    is located on the Mahanadi River in Odisha.</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the statements given above are correct?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 2 only</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">2    and 3 only</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1    and 3 only</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">1,    2 and 3</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     1 is CORRECT: The Godavari (1,465 km) is India's second-longest     river and largest peninsular river, originating at Trimbakeshwar     (Nashik, Maharashtra).</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     2 is CORRECT: Narmada and Tapi are west-flowing rivers flowing     through rift valleys created by faulting between mountain ranges     (Narmada between Vindhyas &amp; Satpuras; Tapi south of     Satpuras). They form estuaries rather than deltas.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     3 is INCORRECT: Majuli is the world's largest inhabited riverine     island, located on the Brahmaputra River in Assam, not on the     Mahanadi in Odisha.</span></span></p>    </li></ul>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Points:</b></u></span></span></p>    <ul>     <li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">West-flowing     Peninsular Rivers: Narmada, Tapi, Mahi, Sabarmati, Periyar,     Mandovi, Zuari.</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Assertion    (A): The sky appears blue to an observer on Earth, but appears    dark/black to an astronaut in outer space.</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Reason    (R): Atmospheric scattering of light (Rayleigh Scattering) occurs    due to gas molecules in Earth's atmosphere, whereas outer space    lacks an atmosphere to scatter sunlight.</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Both    A and R are true, and R is the correct explanation of A.</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Both    A and R are true, but R is not the correct explanation of A.</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A    is true, but R is false.</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A    is false, but R is true.</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Points:</b></u></span></span></p>    <ul>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Phenomenon     Responsible: Atmospheric Scattering of Light (specifically     Rayleigh Scattering).</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Color     Wavelength Relation: Shorter wavelength = Higher scattering     (Blue/Violet scatter most; Red scatters least).</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Sun     at Sunrise/Sunset: Appears reddish because blue light scatters     away over longer atmospheric path lengths, leaving mostly red     light to reach the eye.</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Danger     Signals: Colored red because red light scatters the least,     allowing it to travel longer distances through fog and smoke     without losing intensity.</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">During    his recent visit to New Zealand, which tribal art form from    Bastar, Chhattisgarh, did Hon'ble PM Shri Narendra Modi gift to    Hon'ble PM Christopher Luxon?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Gond    Painting</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Dhokra    Tree of Life sculpture</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Bell    Metal Craft</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Terracotta    Horse figurine</span></span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Current     Affairs Context: Prime Minister Narendra Modi presented a Dhokra     Tree of Life metal sculpture originating from Bastar,     Chhattisgarh, to New Zealand Prime Minister Christopher Luxon.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Craft     Profile: Dhokra art is an ancient, 4,000-year-old lost-wax     casting (cire perdue) technique practiced by tribal artisans     (primarily the Ghadwa community) in the Bastar region of     Chhattisgarh.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Key     Feature: Dhokra metal casting carries a Geographical Indication     (GI) tag for Chhattisgarh and relies entirely on non-ferrous     metal casting using brass, bronze, and copper alloys without     pre-existing molds.</span></span></p>    </li></ul>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Points:</b></u></span></span></p>    <ul>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Dhokra     Craft: Lost-wax casting technique | Bastar, Chhattisgarh (GI     Tagged)</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Gond     Painting: Traditional tribal art of Madhya Pradesh / Chhattisgarh</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Terracotta     Art: Associated with Molela (Rajasthan) &amp; Gorakhpur (Uttar     Pradesh)</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Assertion    (A): The Himalayan region of Nepal and Northern India is    exceptionally prone to recurring flash floods, mass wasting, and    landslides.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Reason    (R): The Himalayas are young, geologically active fold mountains    traversed by major active fault zones like the Main Central Thrust    (MCT) and Main Boundary Thrust (MBT).</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Select    the correct option:</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Both    A and R are true, and R is the correct explanation of A.</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Both    A and R are true, but R is not the correct explanation of A.</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A    is true, but R is false.</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A    is false, but R is true.</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Tectonic     Instability: Ongoing collision between the Indian Plate and     Eurasian Plate creates steep slopes, unstable rock strata, and     intense seismic activity along the MCT and MBT.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Impact:     Tectonic weakening makes mountain slopes vulnerable to mass     wasting (landslides) whenever triggered by intense summer monsoon     rains or localized cloudburst events.</span></span></p>    </li></ul>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Points (Nepal Hydro-Geology):-</b></u></span></span></p>    <ul>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Elevation-Dependent     Warming (EDW): High-altitude Himalayan regions warm faster than     surrounding plains, accelerating permafrost thaw and     destabilizing ice-rock faces.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Antecedent     Drainage: Rivers such as the Indus, Sutlej, Kosi, and Gandak     existed prior to the uplift of the Himalayas and have cut deep     transverse gorges across rising ranges.</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Kosi     River System: Composed of 7 upper tributaries (Saptakoshi);     carries one of the highest sediment loads in the world.</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the following planets in our solar system exhibits a retrograde    rotation (rotates from East to West on its axis) and takes longer    to complete one rotation than to revolve around the Sun?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Mars</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Venus</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Mercury</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Jupiter</span></span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Retrograde     Rotation: Most planets in the Solar System rotate on their axis     from West to East (counter-clockwise). However, Venus (and     Uranus) rotates in a retrograde direction, meaning it spins from     East to West (clockwise).</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Day     vs. Year: Venus has an extraordinarily slow rotation speed. It     takes 243 Earth days to complete one axial rotation, but only 225     Earth days to complete one revolution around the Sun. Thus, a     \"day\" on Venus is longer than its \"year.\"</span></span></p>    </li></ul>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Solar System Facts):</b></u></span></span></p>    <ul>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Brightest     &amp; Hottest Planet: Venus (due to a dense atmosphere made up of     ~96% carbon dioxide causing an extreme greenhouse effect).</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Earth's     Twin: Venus (similar in size, mass, and density to Earth).</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Slowest     Rotation: Venus (243 days).</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Fastest     Rotation: Jupiter (~10 hours).</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Fastest     Revolution: Mercury (~88 days).</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Planets     with Retrograde Rotation: Venus and Uranus.</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Consider    the following statements regarding the Kimberley Process (KP)    Chairship 2026:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">I.    India hosted the Kimberley Process Intersessional Meeting in    Mumbai under its term as KP Chair.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">II.    The core theme of India's 2026 Chairship is structured around the    \"3Cs\" framework: Credibility, Compliance, and Consumer    Confidence.</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">III.    The Kimberley Process Certification Scheme (KPCS) was formally    established under UNGA Resolution 55/56 (2000).</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the statements given above are correct?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">I    and II only</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">II    and III only</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">I    and III only</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">I,    II and III</span></span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     I is correct: India hosted the Kimberley Process Intersessional     Meeting in Mumbai in its capacity as the Chair of the Kimberley     Process.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     II is correct: The theme of India's 2026 Chairship focuses on the     \"3Cs\" framework: Credibility, Compliance, and Consumer     Confidence.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     III is correct: The Kimberley Process Certification Scheme (KPCS)     was created to stop the trade of \"blood/conflict diamonds\"     and was formally backed under United Nations General Assembly     (UNGA) Resolution 55/56.</span></span></p>    </li></ul>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Facts:</b></u></span></span></p>    <ul>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Purpose     of KPCS: To prevent \"conflict diamonds\" (rough diamonds     used by rebel movements to fund violence against legitimate     governments) from entering mainstream markets.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Target     Commodity: Rough Diamonds only (not polished/cut diamonds).</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">India's     Significance: India processes/cuts/polishes over 90% of the     world's raw diamonds.</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Match    the traditional folk dances of India with their originating    states:</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">List-I    (Folk Dance): List-II (State)</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A.    Koli &amp; Tarapa Dance 1. Himachal Pradesh</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">B.    Raut Nacha 2. Maharashtra</span></span></p>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">C.    Nati 3. Chhattisgarh</span></span></p>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">D.    Hojagiri 4. Tripura</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-2,    B-3, C-1, D-4</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-1,    B-2, C-3, D-4</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-2,    B-4, C-1, D-3</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">A-3,    B-1, C-4, D-2</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Koli     &amp; Tarapa Dance (Maharashtra): Performed by the fisherman     community (Kolis) of Maharashtra. Tarapa is played using a wind     instrument made of dried gourd by the Warli tribe.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Raut     Nacha (Chhattisgarh): Performed by the Yadavas/Rauts during the     festival of Dev Uthani Ekadashi (Diwali season), depicting the     battle between Krishna and King Kansa.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Nati     (Himachal Pradesh): Listed in the Guinness World Records as the     largest folk dance performance. It is performed during Kullu     Dussehra.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Hojagiri     (Tripura): Performed by the Reang (Bru) community of Tripura.     Young women balance lamps and pitchers on their bodies while     swaying the lower part of the body.</span></span></p>    </li></ul>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Important    Points:</b></u></span></span></p>    <ul>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Fugdi     &amp; Dhalo: Goa</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Chhau     Dance: West Bengal (Purulia), Jharkhand (Seraikella), Odisha     (Mayurbhanj)</span></span></p>     </li><li><p style=\"orphans:2;widows:2\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Padayani:     Kerala (Ritualistic mask dance)</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Consider    the following statements regarding the famous novel \"The    Seven Moons of Maali Almeida\":</span></span></p>    <ol>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">It     was awarded the prestigious Booker Prize in 2022 for its poignant     satire and deep exploration of political turmoil during the Sri     Lankan Civil War.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">The     novel was authored by the celebrated Indian author Geetanjali     Shree and translated into English by Daisy Rockwell.</span></span></p>    </li></ol>    <p style=\"orphans:2;widows:2\"><span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Which    of the statements given above is/are correct?</span></span></p>", "option1": "<p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Only    statement 1 is correct</span></span></p>", "option2": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Only    statement 2 is correct</span></span></p>", "option3": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Both    statements 1 and 2 are correct</span></span></p>", "option4": " <p style=\"orphans:2;widows:2\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Neither    statement 1 nor 2 is correct</span></span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     1 is correct: \"The Seven Moons of Maali Almeida\" won     the 2022 Booker Prize (for fiction written in English). Set in     Colombo in 1990 during the Sri Lankan Civil War, it tells the     story of a war photographer who wakes up dead in what seems to be     a celestial visa office and has \"seven moons\" to solve     his own murder.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Statement     2 is incorrect: The book was authored by Shehan Karunatilaka, a     Sri Lankan writer. Geetanjali Shree (along with translator Daisy     Rockwell) won the International Booker Prize in 2022 for her     Hindi novel \"Tomb of Sand\" (Ret Samadhi).</span></span></p>    </li></ul>    <p style=\"orphans:2;widows:2;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\"><u><b>Extra    Facts:</b></u></span></span></p>    <ul>     <li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Booker     Prize vs. International Booker Prize:</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Booker     Prize: Awarded for a single novel written originally in the     English language and published in the UK or Ireland.</span></span></p>     </li><li><p style=\"orphans:2;widows:2;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">International     Booker Prize: Awarded for a single work of fiction translated     into English and published in the UK or Ireland (the £50,000     prize money is shared equally between the author and the     translator).</span></span></p>     </li><li><p style=\"orphans:2;widows:2\"><a name=\"_GoBack\"></a>     <span style=\"font-family:'Nirmala UI'\"><span style=\"font-size:12pt\">Shehan     Karunatilaka: Became the second Sri Lankan-born author to win the     Booker Prize after Michael Ondaatje (who won in 1992 for \"The     English Patient\").</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 76, "question": "  <p style=\"orphans:0;widows:0\">    Find the remainder when <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788115218162_html_1df484f762c1e720.png\" width=\"210\" height=\"28\" >  is    divided by 48.</p>", "option1": "<p style=\"orphans:0;widows:0\">    24</p>", "option2": " <p style=\"orphans:0;widows:0\"> let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }

    .review-option.user-selected { border-width: 3px; font-weight: bold; }

    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
