<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>43.) SSC CGL PTS  MOCK 22 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

" <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is C. Vigor</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The word <b>lassitude</b> means a state of physical or mental    tiredness, lack of energy, or weariness. The word <b>Vigor</b>    means physical or mental strength, energy, and enthusiasm, making    it the most appropriate antonym.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Exhaustion:</b> A state of extreme physical or mental     tiredness.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Apathy:</b>     Lack of interest, enthusiasm, or concern.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Lethargy:</b> A state of     sluggishness, inactivity, or lack of energy.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate meaning of the given idiom.</b></p>    <p style=\"orphans:0;widows:0\">To steal a march on</p>", "option1": "<p style=\"orphans:0;widows:0\">    To gain an advantage over someone secretly or unexpectedly</p>", "option2": " <p style=\"orphans:0;widows:0\">    To challenge someone to a duel or contest</p>", "option3": " <p style=\"orphans:0;widows:0\">    To follow someone stealthily without being noticed</p>", "option4": " <p style=\"orphans:0;widows:0\">    To make amends for a past mistake</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is A. To gain an advantage over someone    secretly or unexpectedly</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in\">The idiom <b>“To    steal a march on”</b> means to gain an advantage over someone by    acting before they are aware of it, often secretly or    unexpectedly.</p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0\">    Choose the correct meaning of idiom: <b>Came of age</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Understood morality for the first time</p>", "option2": " <p style=\"orphans:0;widows:0\">    Inherited property</p>", "option3": " <p style=\"orphans:0;widows:0\">    Abandoned earlier beliefs</p>", "option4": " <p style=\"orphans:0;widows:0\">    Reached adulthood legally or socially</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is D. Reached adulthood legally or socially</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in\">The idiom    <b>“Came of age”</b> means to reach the age at which a person    is considered an adult, legally or socially.</p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0\">    Select the <b>correctly spelt</b> word that means 'kept secret,    especially because it would not be approved of'.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Surrepticious</p>", "option2": " <p style=\"orphans:0;widows:0\">    Surreptitious</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sureptitious</p>", "option4": " <p style=\"orphans:0;widows:0\">    Surreptitous</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is<b> B. Surreptitious</b></p>    <p style=\"orphans:0;widows:0\">The correctly spelt word is    <b>Surreptitious</b>, which means 'kept secret, especially because    it would not be approved of' (stealthy or furtive).     </p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that can be used as a <b>one-word substitute</b>    for the given group of words.</p>    <p style=\"orphans:0;widows:0\">'A formal speech or piece of    writing that praises someone or something highly, especially    someone who has died'</p>", "option1": "<p style=\"orphans:0;widows:0\">    Epitaph</p>", "option2": " <p style=\"orphans:0;widows:0\">    Elegy</p>", "option3": " <p style=\"orphans:0;widows:0\">    Eulogy</p>", "option4": " <p style=\"orphans:0;widows:0\">    Epilogue</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is C. Eulogy</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Eulogy</b> means a formal speech or piece of writing that    praises someone highly, especially someone who has died.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Meanings of the other options:</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Epitaph:</b> An inscription on a tomb or gravestone in memory    of a person.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Elegy:</b> A poem or piece of writing expressing sorrow,    especially for someone who has died.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in\"><b>Epilogue:</b>    A concluding section of a book, play, or speech.</p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate <b>one-word substitution</b> for the    given group of words.</p>    <p style=\"orphans:0;widows:0\">'A strict disciplinarian who    demands exact adherence to rules and order, especially in a    military or formal setting'</p>", "option1": "<p style=\"orphans:0;widows:0\">    Iconoclast</p>", "option2": " <p style=\"orphans:0;widows:0\">    Martinet</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sycophant</p>", "option4": " <p style=\"orphans:0;widows:0\">    Bohemian</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The correct option is <b>B. Martinet</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Martinet</b>    means a strict disciplinarian who demands exact obedience to rules    and regulations, especially in a military or formal setting.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Iconoclast</b>:    A person who challenges or attacks established beliefs or    traditions.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sycophant</b>:    A person who flatters powerful people to gain favour.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><b>Bohemian</b>: A person with    unconventional artistic or social habits.</p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate phrasal verb to fill in the blank.</b></p>    <p style=\"orphans:0;widows:0\">The experimental results failed    to ________ the researcher's initial hypothesis regarding the new    compound.</p>", "option1": "<p style=\"orphans:0;widows:0\">    bear out</p>", "option2": " <p style=\"orphans:0;widows:0\">    carry over</p>", "option3": " <p style=\"orphans:0;widows:0\">    rule out</p>", "option4": " <p style=\"orphans:0;widows:0\">    bear up</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is A. Bear out</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Bear out</b> means to support, confirm, or prove that something    is true. Here, the experimental results failed to <b>bear out</b>    the researcher's initial hypothesis.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Bear up:</b> To remain cheerful or strong in a difficult     situation.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Carry     over:</b> To continue or transfer something from one situation or     period to another.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Rule out:</b> To     eliminate or exclude something as a possibility.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct preposition to fill in the blank:</b></p>    <p style=\"orphans:0;widows:0\">Due to the unexpected budget    cuts, the department had to dispense _____ the services of several    freelance consultants.</p>", "option1": "<p style=\"orphans:0;widows:0\">    of</p>", "option2": " <p style=\"orphans:0;widows:0\">    off</p>", "option3": " <p style=\"orphans:0;widows:0\">    with</p>", "option4": " <p style=\"orphans:0;widows:0\">    from     </p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>C) with</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     ​The verb <b>\"dispense\"</b> takes the preposition     <b>\"with\"</b> to form the phrasal verb <b>\"dispense     with\"</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">​<i>\"Dispense     with\"</i> means to manage without, do away with, or get rid     of something/someone no longer necessary or feasible.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\">​The     sentence implies that due to budget cuts, the department had to     do away with (terminate) the services of freelance consultants.</p>    </li></ul>    <h3><a name=\"_d471ww4p0t4\"></a>    <span>​<span style=\"font-size:13pt\"><b>Correct    Sentence:</b></span></span></h3>    <p style=\"orphans:0;widows:0;margin-top:0.17in\">​<i>\"Due    to the unexpected budget cuts, the department had to </i><i><b>dispense    with</b></i><i> the services of several freelance consultants.\"</i></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Find the part of the sentence that contains an error:</b></p>    <p style=\"orphans:0;widows:0\">The committee members were not    only averse with (1)/ accepting the newly proposed guidelines (2)/    but also hesitant to allocate (3)/ additional funds for the    project. (4)</p>", "option1": "<p style=\"orphans:0;widows:0\">    (1)</p>", "option2": " <p style=\"orphans:0;widows:0\">    (2)</p>", "option3": " <p style=\"orphans:0;widows:0\">    (3)</p>", "option4": " <p style=\"orphans:0;widows:0\">    (4)</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is A. (1)</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The error is in <b>“averse with”</b>. The correct preposition    is <b>“averse to”</b>, meaning opposed or strongly disinclined    to something.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in\"><b>Correct    sentence:</b> <i>The committee members were not only </i><i><b>averse    to</b></i><i> accepting the newly proposed guidelines but also    hesitant to allocate additional funds for the project.</i></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Find the part of the sentence that contains an error:</b></p>    <p style=\"orphans:0;widows:0\">It was only after the committee    had meticulously reviewed all the audit reports (1)/ when the    chairman decided to suspend the regional manager, (2)/ who was    allegedly involved in financial irregularities (3)/ spanning over    a decade. (4)</p>", "option1": "<p style=\"orphans:0;widows:0\">    (1)</p>", "option2": " <p style=\"orphans:0;widows:0\">    (2)</p>", "option3": " <p style=\"orphans:0;widows:0\">    (3)</p>", "option4": " <p style=\"orphans:0;widows:0\">    (4)</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>B) (2)</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    When a sentence begins with <b>\"It was after...\"</b> or    <b>\"It was only after...\"</b>, the subordinate clause    must be introduced by <b>\"that\"</b>, not <b>\"when\"</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    ​Replace <b>\"when\"</b> with <b>\"that\"</b> in    part <b>(2)</b>.</p>    <p style=\"page-break-inside:auto;orphans:0;widows:0;margin-top:0.19in;page-break-after:auto\">    <span>​<span style=\"font-size:13pt\"><b>Corrected    Sentence:</b></span></span>​<i>\"It was only after the    committee had meticulously reviewed all the audit reports </i><i><b>that</b></i><i>    the chairman decided to suspend the regional manager, who was    allegedly involved in financial irregularities spanning over a    decade.\"</i></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0\">    <b>Change the following from active to passive:</b> The court let    the plaintiff argue the motion without interruption.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The motion was argued by the plaintiff without interruption.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The plaintiff was let to argue the motion without interruption.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The plaintiff was allowed to argue the motion without    interruption.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The court was letting the plaintiff argue the motion.</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>C) The plaintiff was allowed to argue the    motion without interruption.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Here, “the plaintiff” becomes the passive subject.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">When     converting <b>\"let\"</b> into passive voice, standard     English replaces it with <b>\"allow\"</b> followed by a     full infinitive (<i>to + V1</i>).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Let +     object + V1 changes to object + be allowed to + V1 in passive     voice.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Hence, C is grammatically     correct.</b></p>    </li></ul>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the sentence containing the homonym of the highlighted    word used in a different sense:</b></p>    <p style=\"orphans:0;widows:0\">The diplomat warned that the    escalating crisis posed a <b>grave</b> threat to regional    stability.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The situation grew increasingly grave as the storm approached the    coast.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The archaeologists discovered an ancient royal grave beneath the    ruins.</p>", "option3": " <p style=\"orphans:0;widows:0\">    She spoke in a grave tone when discussing the severe financial    losses.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The committee realized the grave consequences of their delayed    decision.</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is B) The archaeologists discovered an    ancient royal grave beneath the ruins.</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The word <b>GRAVE</b> in the given sentence means <b>serious or    severe</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    In option B, <b>grave</b> means <b>a place where a dead person is    buried</b>, which is a different sense of the same word.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    Other options:     </p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>A:</b> Grave means serious or severe.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>C:</b> Grave means serious or solemn.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in\"><b>D:</b>    Grave means serious or severe.</p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Convert the sentence provided below from its passive voice    structure to an active voice structure:</b></p>    <p style=\"orphans:0;widows:0\">The suspect is believed to have    been seen fleeing the crime scene before any alarm could be raised    by the guards.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Guards believed that someone saw the suspect fleeing the crime    scene after raising the alarm.</p>", "option2": " <p style=\"orphans:0;widows:0\">    People believe that someone saw the suspect fleeing the crime    scene before the guards could raise any alarm.</p>", "option3": " <p style=\"orphans:0;widows:0\">    People believed that the suspect had been seen fleeing the crime    scene before guards raised the alarm.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Someone believes that the guards raised the alarm before the    suspect was seen fleeing the crime scene.</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is B) People believe that someone saw the    suspect fleeing the crime scene before the guards could raise any    alarm.</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The given sentence is in the <b>passive voice</b> with the    reporting structure <b>“is believed to have been seen.”</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    In active voice, <b>“is believed”</b> becomes <b>“People    believe”</b> and <b>“to have been seen”</b> becomes <b>“someone    saw.”</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    “<b>Before any alarm could be raised by the guards”</b>    changes to <b>“before the guards could raise any alarm.”</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in\">Therefore, <b>B</b>    is the correct active voice structure.</p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate option to replace the highlighted    segment in the given sentence:</b></p>    <p style=\"orphans:0;widows:0\">After months of struggle, the    retired officer has finally <b>reconciled with the fact that</b>    he cannot regain his former authority.</p>", "option1": "<p style=\"orphans:0;widows:0\">    reconciled to the fact that</p>", "option2": " <p style=\"orphans:0;widows:0\">    reconciled for the fact that</p>", "option3": " <p style=\"orphans:0;widows:0\">    reconciled in the fact that</p>", "option4": " <p style=\"orphans:0;widows:0\">    reconciled on the fact that</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is A) reconciled to the fact that</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct preposition used with <b>“reconcile”</b> in this    sense is <b>“to”</b>, meaning to accept an unpleasant or    difficult situation.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct sentence is <b>“After months of struggle, the    retired officer has finally reconciled to the fact that he cannot    regain his former authority.”</b></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Choose the most suitable option to replace the highlighted part    of the sentence:</b></p>    <p style=\"orphans:0;widows:0\">He was <b>accused for stealing</b>    the documents.</p>", "option1": "<p style=\"orphans:0;widows:0\">    charged for steal</p>", "option2": " <p style=\"orphans:0;widows:0\">    accused to steal</p>", "option3": " <p style=\"orphans:0;widows:0\">    accused with stealing</p>", "option4": " <p style=\"orphans:0;widows:0\">    accused of stealing</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is D) accused of stealing</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct preposition used with <b>“accused”</b> is <b>“of”</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Accused of</b> means formally blamed or charged with having    committed an offence.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in\">The correct    sentence is <b>“He was accused of stealing the documents.”</b></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct option for the Direct Speech conversion of    the sentence below.</b></p>    <p style=\"orphans:0;widows:0\">He confessed that the violin    concerto would have remained fragmentary had the late maestro not    bequeathed his annotated sketches.</p>", "option1": "<p style=\"orphans:0;widows:0\">    He said, \"The violin concerto would have remained fragmentary    had the late maestro not bequeathed his annotated sketches.”</p>", "option2": " <p style=\"orphans:0;widows:0\">    He said, \"The violin concerto would have remained fragmentary    if the late maestro not bequeathed his annotated sketches.”</p>", "option3": " <p style=\"orphans:0;widows:0\">    He said, \"The violin concerto will be remaining fragmentary    had the late maestro not bequeathed his annotated sketches.”</p>", "option4": " <p style=\"orphans:0;widows:0\">    He said, \"The violin concerto would be fragmentary if    sketches had not been bequeathed.”</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is A) He said, \"The violin concerto    would have remained fragmentary had the late maestro not    bequeathed his annotated sketches.\"</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The indirect speech contains a <b>third conditional structure</b>    with <b>“would have remained”</b> and <b>“had … not    bequeathed.”</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    While converting into direct speech, the <b>conditional structure    and tense remain unchanged</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    Other options:     </p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>B:</b> Incorrect because it omits <b>“had”</b> in the    conditional clause.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>C:</b> Incorrect because <b>“will be remaining”</b> changes    the tense and meaning.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>D:</b> Incorrect because it unnecessarily changes the sentence    structure and omits important information.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in\">Therefore, <b>A</b>    is the correct direct speech form.</p>", "question_heading": ""}, {"sr_no": 18, "question": "In पुध giॅधn ूोौौोgध, ौयंध थयनकौ ुोॅध ृधधn किधधपधक. Rधोक पुध ूोौौोgध inपधnिपद ोnक cुययौध पुध ंयौप ोूूनयूनiोपध यूपiयn पय ीiिि in धोcु ृिोnा: Liपधनोपहनध, ीोन ीनयं ृधing ो ौपोपic नधूयौiपयनद यी ोधौपुधपic किधigुप, iौ ो नधौिपधौौ ंधकiहं पुनयहgु थुicु cिहपहनधौ inपधननयgोपध पुधंौिधॅधौ. Tुध nयॅिध, पुध ूयधं, पुध ूिोद—ोिि ोनध nयप ंधनिधद ीयनंौ ृहप ीiिधकौ थुधनधin iकधिययgiधौ (1) _____, ंहपोपध, ोnक ौयंधपiंधौ कiौौियॅध. Tय नधोक कधधूिद iौ पय नiौा कiौयनiधnपोपiयn, ीयन धॅधनद inपधनूनधपोपiयn iंूिiधौ ोn ोcप यी कiौूिोcधंधnप: यी ोहपुयनiोि inपधnप, यी नधोकधन धसूधcपोपiयn, यी ुiौपयनicोि cधनपोinपद. Tुध िiपधनोनद cोnयn iपौिधी iौ िधौौ ो ंयnहंधnप पुोn ो (2) _____—ो ौiपध यी cयnपधौपोपiयn ौुोूधक ृद incिहौiयn, धसcिहौiयn, ोnक नधinॅधnपiयn. A Sुोाधौूधोनधोn ौियiियतहद ंोद ृधोन हniॅधनौोि नधौयnोncध, दधप iप ोिसय धंधनgधौ ीनयं ो ंोपनiस यी Eिप्रोृधपुोn ोnसiधपiधौ ोnक ूयथधन ौपनहcपहनधौ. Tुध iििहौiयn यी पiंिधधौौnधौौ iौ, ंयनध यीपधn पुोn nयप, ो ीहncपiयn यी cनiपicोि धंूुोौiौ नोपुधन पुोn inपनinौic ंधनiप. Pयौपcिययniोि ोnक ीधंiniौप cनiपiतहधौ ुोॅध cुोििधngधक पुiौ ोूूोनधnप nधहपनोिiपद, ीयनधgनयहnकing पुध ॅयicधौ पुोप थधनध यncध ूधनiूुधनोि. Sहcु inपधनॅधnपiयnौ ुोॅध nयप कiंiniौुधक िiपधनोपहनध’ौ ूनधौपigध ृहप inौपधोक (3) _____ iपौ ंयनोि ोnक ूियiपicोि ौपोाधौ. Tधसपौ यncध cयnौiकधनधक ोूियiपicोि ोनध nयथ नधोक ोौ cिहपहनोि ोनपiीोcपौ धnपोngिधक in धंूiनध, ूोपनiोनcुद, ोnक नधौiौपोncध. In पुiौ िigुप, िiपधनोनद cनiपiciौं ृधcयंधौ ोn ोcप nयप यी ुहकgंधnप ृहप यी (4) _____—ोn धसcोॅोपiयn यी ौiिधncधौ ोौ ंहcु ोौ ंधोningौ. Tुध नधोकधन, पुधn, iौ nयप ो ूोौौiॅध cयnौहंधन ृहप ो cय-cनधोपयन, थुयौध inौigुपौ ंहौप ृध (5) _____ थiपु ुहंiिiपद ोnक ुiौपयनicोि ोथोनधnधौौ. W orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is D. tempered</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The word <b>“tempered”</b> means moderated, balanced, or    restrained. Here, the reader’s insights must be <b>tempered with    humility and historical awareness</b>, meaning they should be    balanced by these qualities.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Annotated:</b> Provided with notes or comments.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Imposed:</b> Forced or placed on something without agreement.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in\"><b>Brandished:</b>    Displayed or used something aggressively or ostentatiously.</p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>A sentence is provided in direct speech. From the four given    options, choose the one that most accurately conveys the sentence    in its corresponding indirect speech.</b></p>    <p style=\"orphans:0;widows:0\">She said, \"I didn't see him    at the station.\"</p>", "option1": "<p style=\"orphans:0;widows:0\">    She said that she hasn't seen him at the station.</p>", "option2": " <p style=\"orphans:0;widows:0\">    She said that she had not seen him at the station.</p>", "option3": " <p style=\"orphans:0;widows:0\">    She said she didn't saw him at the station.</p>", "option4": " <p style=\"orphans:0;widows:0\">    She said that she was not seeing him at the station.</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is B) She said that she had not seen him at    the station.</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The reporting verb <b>“said”</b> is in the past tense, so the    simple past <b>“didn't see”</b> changes to the past perfect    <b>“had not seen.”</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    “<b>I”</b> changes to <b>“she”</b> according to the    speaker.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other options:</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>A:</b> Incorrect because <b>“hasn't seen”</b> is present    perfect.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>C:</b> Incorrect because <b>“didn't saw”</b> is    grammatically wrong; after <i>didn't</i>, the base form <i>see</i>    is used.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in\"><b>D:</b>    Incorrect because the continuous form changes the original    meaning.</p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Rearrange the following sentences to form a coherent paragraph:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. This    reliance on historical dataset patterns, however, can    inadvertently perpetuate systemic biases embedded within the    training data.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2.    Consequently, developers must implement rigorous auditing    protocols to ensure that algorithmic predictions remain equitable    and objective.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Machine    learning algorithms in healthcare are increasingly used to predict    patient outcomes by analyzing vast amounts of clinical data.</p>    <p style=\"orphans:0;widows:0\">4. By learning from past records,    these systems identify subtle diagnostic correlations that might    elude even experienced clinicians.</p>", "option1": "<p style=\"orphans:0;widows:0\">    3, 1, 4, 2</p>", "option2": " <p style=\"orphans:0;widows:0\">    3, 4, 1, 2</p>", "option3": " <p style=\"orphans:0;widows:0\">    4, 3, 1, 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 3, 4, 2</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is B) 3, 4, 1, 2</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    Sentence <b>3</b> introduces the topic of machine learning    algorithms in healthcare.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    Sentence <b>4</b> logically follows by explaining how these    systems use past clinical records to identify diagnostic    correlations.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    Sentence <b>1</b> introduces a limitation of this reliance on    historical data, indicated by <b>“This reliance”</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    Sentence <b>2</b> begins with <b>“Consequently”</b>,    presenting the necessary action in response to the potential    biases.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in\">Therefore,    the correct sequence is <b>3, 4, 1, 2</b>.</p>", "question_heading": ""}, {"sr_no": 25, "question": "Rधोननोngध पुध ीियियथing ौधnपधncधौ in cयननधcप यनकधन पय ंोाध ो ियgicोि ूोौौोgध. 1. Tुiौ ौपयनधक थोपधन cोn ृध हौधक ीयन gोनकधning, थोौुing, ोnक नधcुोनging gनयहnकथोपधन िधॅिधस. 2. Rोinथोपधन ुोनॅधौपing iौ ोn धीीधcपiॅध ंधपुयक यी थोपधन cयnौधनॅोपiयn. 3. Iप inॅियॅधौ cियिधcपing ोnक ौपयनing नहnयीी थोपधन ीनयं नययीपयूौ ोnक िोnक ौहनीोcधौ. 4. Iप ोिसय नधकहcधौ ौयiि धनयौiयn ोnक िigुपधnौ पुध ृहनकधn यn ंहniciूोि थोपधन ौहूूिद ौदौपधंौ.", "option1": "<p style=\"orphans:0;widows:0\">    2-1-3-4</p>", "option2": " <p style=\"orphans:0;widows:0\">    3-2-1-4</p>", "option3": " <p style=\"orphans:0;widows:0\">    1-4-2-3</p>", "option4": " <p style=\"orphans:0;widows:0\">    2-3-1-4</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is D) 2-3-1-4</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    Sentence <b>2</b> introduces the topic by stating that rainwater    harvesting is an effective method of water conservation.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    Sentence <b>3</b> explains what rainwater harvesting involves.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    Sentence <b>1</b> describes how the collected water can be used.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    Sentence <b>4</b> adds further benefits of rainwater harvesting.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in\">Therefore,    the correct sequence is <b>2-3-1-4</b>.</p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0\">    In a certain code language, 'BARK' is coded as 'EEUO' and 'LION'    is coded as 'OMRR'. How will 'DUCK' be coded in that language?</p>", "option1": "<p style=\"orphans:0;widows:0\">    GYFO</p>", "option2": " <p style=\"orphans:0;widows:0\">    GZFN</p>", "option3": " <p style=\"orphans:0;widows:0\">    HYFP</p>", "option4": " <p style=\"orphans:0;widows:0\">    GYEP</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is an alternating addition of +3 and +4    to the alphabetical positions of letters:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B (+3) = E, A    (+4) = E, R (+3) = U, K (+4) = O → EEUO</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">L (+3) = O, I    (+4) = M, O (+3) = R, N (+4) = R → OMRR</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Applying the    same rule to 'DUCK':</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">D (+3) = G</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">U (+4) = Y</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C (+3) = F</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">K (+4) = O</p>    <p style=\"orphans:0;widows:0\">Thus, 'DUCK' is coded as 'GYFO'.</p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Which letter-cluster will replace the question mark (?) to    complete the given series?</p>    <p style=\"orphans:0;widows:0\">AZBY, DWFW, GTJU, ?, MNRQ</p>", "option1": "<p style=\"orphans:0;widows:0\">    JQNS</p>", "option2": " <p style=\"orphans:0;widows:0\">    IQMS</p>", "option3": " <p style=\"orphans:0;widows:0\">    JPNS</p>", "option4": " <p style=\"orphans:0;widows:0\">    JQNT</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed in the given series is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">First letter:       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_4b43f5f257ed8911.png\" width=\"215\" height=\"19\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Second    letter:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_f86f3799f5d57423.png\" width=\"220\" height=\"22\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Third letter:       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_c4e6a866efd819e3.png\" width=\"213\" height=\"19\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Fourth    letter:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_b74021ef32a79b25.png\" width=\"216\" height=\"22\" > </p>    <p style=\"orphans:0;widows:0\">Thus, the missing letter-cluster    is JQNS.</p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that represents the letters that, when placed    from left to right in the following blanks, will complete the    letter-series.</p>    <p style=\"orphans:0;widows:0\">G _ A C E G R _ C _ G R C _ E _ R    D C E</p>", "option1": "<p style=\"orphans:0;widows:0\">    R C E C G</p>", "option2": " <p style=\"orphans:0;widows:0\">    R B E D G</p>", "option3": " <p style=\"orphans:0;widows:0\">    R B E C G</p>", "option4": " <p style=\"orphans:0;widows:0\">    S B E C G</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern is formed by dividing the series into 4 groups of 5    letters each:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">G R A C E / G    R B C E / G R C C E / G R D C E</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">In each    5-letter block, the 1st, 2nd, 4th, and 5th letters (G, R, C, E)    remain constant, while the 3rd letter increases alphabetically by    +1 in each successive block (A → B → C → D).</p>    <p style=\"orphans:0;widows:0\">Filling the missing letters from    left to right gives: R B E C G.</p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct combination of mathematical signs to    sequentially replace the * signs and balance the given equation.</p>    <p style=\"orphans:0;widows:0\">24 * 6 * 3 * 4 * 5 * 11</p>", "option1": "<p style=\"orphans:0;widows:0\">    +, −, ÷, ×, =</p>", "option2": " <p style=\"orphans:0;widows:0\">    −, ÷, +, ×, =</p>", "option3": " <p style=\"orphans:0;widows:0\">    ÷, +, −, ×, =</p>", "option4": " <p style=\"orphans:0;widows:0\">    ÷, ×, +, −, =</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Given equation: 24 * 6 * 3 * 4 * 5 * 11</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">By putting    the signs from Option D (÷, ×, +, −, =):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">24 ÷ 6 × 3    + 4 − 5 = 11</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Applying    BODMAS rule:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4 × 3 + 4 −    5 = 11</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">12 + 4 − 5    = 11</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">16 − 5 = 11</p>    <p style=\"orphans:0;widows:0\">11 = 11 (Balanced)</p>", "question_heading": ""}, {"sr_no": 30, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Which two signs should be interchanged to make the given equation    correct?</p>    <p style=\"orphans:0;widows:0\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_6e3f5147b25cfa80.gif\" > </p>", "option1": " <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_cbf3dd5fdfeb402d.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_5b21af84bca2675f.gif\" > </p>", "option2": "  <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_8b2f9f587ddc202b.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_5b21af84bca2675f.gif\" > </p>", "option3": "  <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_e95f11b047543be0.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_8b2f9f587ddc202b.gif\" > </p>", "option4": "  <p style=\"orphans:0;widows:0\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_cbf3dd5fdfeb402d.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_e95f11b047543be0.gif\" > </p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Given equation:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_6e3f5147b25cfa80.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">By    interchanging     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_8b2f9f587ddc202b.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_5b21af84bca2675f.gif\" > ,    the equation becomes:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_82ff6a9e52a4d4d3.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Applying    BODMAS rule:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_bd8601bb293e6e0a.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_bfb98f32e566a9dd.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_e91d8b13a22a7138.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_d2759a05199a3e56.gif\" >     (Correct)</p>    <p style=\"orphans:0;widows:0\">Hence, the correct option is B.</p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the set in which the numbers are related in the same way as    are the numbers of the following sets.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(NOTE:    Operations should be performed on the whole numbers, without    breaking down the numbers into its constituent digits.)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(7, 4, 33)</p>    <p style=\"orphans:0;widows:0\">(9, 2, 33)</p>", "option1": "<p style=\"orphans:0;widows:0\">    (6, 5, 30)</p>", "option2": " <p style=\"orphans:0;widows:0\">    (8, 5, 39)</p>", "option3": " <p style=\"orphans:0;widows:0\">    (7, 3, 28)</p>", "option4": " <p style=\"orphans:0;widows:0\">    (5, 4, 25)</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The logic followed here is: Third number = (First number + Second    number)     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_f5aad9ed62ffbf86.gif\" > .</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">For (7, 4,    33):     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_b4001b176cb45f3.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">For (9, 2,    33):     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_fcc40e64ebe78318.gif\" > </p>    <p style=\"orphans:0;widows:0\">Similarly, for option (8, 5, 39):       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_8aaaeacda098c78.gif\" > .</p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Which of the following numbers will replace the question mark (?)    in the given series?</p>    <p style=\"orphans:0;widows:0\">18, 27, 43, ?, 104, 153</p>", "option1": "<p style=\"orphans:0;widows:0\">    64</p>", "option2": " <p style=\"orphans:0;widows:0\">    68</p>", "option3": " <p style=\"orphans:0;widows:0\">    66</p>", "option4": " <p style=\"orphans:0;widows:0\">    72</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed in the given series is based on adding    consecutive square numbers:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_f31930e218bb502f.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_353f23e9f48cf4.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_8469df78ad229860.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_a1aae1e3c549d469.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_456b4cda03ef18a3.gif\" > </p>    <p style=\"orphans:0;widows:0\">Thus, the number that replaces    the question mark is 68.</p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    'P + Q' means 'P is the husband of Q'</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'P - Q' means    'P is the sister of Q'</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'P × Q'    means 'P is the father of Q'</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'P ÷ Q'    means 'P is the mother of Q'</p>    <p style=\"orphans:0;widows:0\">If 'P + Q ÷ R × S', then how is    Q related to S?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Maternal grandmother</p>", "option2": " <p style=\"orphans:0;widows:0\">    Paternal grandmother</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mother</p>", "option4": " <p style=\"orphans:0;widows:0\">    Aunt</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    From the given expressions:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. 'P + Q'    implies P is the husband of Q (so Q is female).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. 'Q ÷ R'    implies Q is the mother of R.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. 'R × S'    implies R is the father of S.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_9ffb053eab8090f8.gif\" > </p>    <p style=\"orphans:0;widows:0\">Since Q is the mother of R, and R    is the father of S, Q is the mother of S's father, which means Q    is the paternal grandmother of S.</p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0\">    Three of the following four letter-clusters are alike in a certain    way and one is different. Pick the odd one out.</p>", "option1": "<p style=\"orphans:0;widows:0\">    BYCX</p>", "option2": " <p style=\"orphans:0;widows:0\">    DWEV</p>", "option3": " <p style=\"orphans:0;widows:0\">    FUGS</p>", "option4": " <p style=\"orphans:0;widows:0\">    KPLO</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In all the letter-clusters except 'FUGS', the 1st and 2nd letters    are opposite pairs, and the 3rd and 4th letters are also opposite    pairs (sum of their positional values is 27):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- BYCX:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_3e2527f3b3e44341.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_ae114ecd4e63cd7.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- DWEV:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_37b4e333dfc3c44a.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_7982a25c3dc20f7e.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">- KPLO:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_3d8aeea5a0b604bc.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_36ce0eb8b6460baa.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">However, in    FUGS:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">-     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_a9a6e28bf66b317a.gif\" > ,    but     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_315d7bbc326f5ff3.gif\" >     (the opposite of G is T).</p>    <p style=\"orphans:0;widows:0\">Hence, FUGS is the odd one out.</p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\">    Four number pairs have been given, out of which three are alike in    some manner and one is different. Select the number pair that is    different.</p>", "option1": "<p style=\"orphans:0;widows:0\">    (4, 80)</p>", "option2": " <p style=\"orphans:0;widows:0\">    (7, 392)</p>", "option3": " <p style=\"orphans:0;widows:0\">    (9, 810)</p>", "option4": " <p style=\"orphans:0;widows:0\">    (6, 216)</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Second number    =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_768b3054383b3d09.gif\" > ,    where     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_91a32e31e2476724.gif\" >     is the first number.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option A:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_b22ffb49857841ad.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option B:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_ecd972639ba38630.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option C:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_30df4095241199d7.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Option D:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_f3b801ab252b1d4f.gif\" > </p>    <p style=\"orphans:0;widows:0\">Hence, (6, 216) is the odd one    out.</p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0\">    Pointing to a photograph of a woman, David (a man) said, \"Her    mother's only son is the father of my daughter.\" How is the    woman in the photograph related to David?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Sister</p>", "option2": " <p style=\"orphans:0;widows:0\">    Daughter</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mother</p>", "option4": " <p style=\"orphans:0;widows:0\">    Wife</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Break down the statement step-by-step:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. \"The    father of my daughter\" refers to David himself (as David is a    man).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. \"Her    mother's only son\" is David.</p>    <p style=\"orphans:0;widows:0\">Since the woman's mother's only    son is David, David is her brother. Therefore, the woman in the    photograph is David's sister.</p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that is related to the fifth letter-cluster in    the same way as the second letter-cluster is related to the first    letter-cluster and the fourth letter-cluster is related to the    third letter-cluster.</p>    <p style=\"orphans:0;widows:0\">DFK : GDO :: PRS : SPW :: MTN : ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    PRR</p>", "option2": " <p style=\"orphans:0;widows:0\">    PQR</p>", "option3": " <p style=\"orphans:0;widows:0\">    OSR</p>", "option4": " <p style=\"orphans:0;widows:0\">    PRO</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">First letter:    +3</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Second    letter: -2</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Third letter:    +4</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">DFK → GDO:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">D (+3) = G</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">F (-2) = D</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">K (+4) = O</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">PRS → SPW:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">P (+3) = S</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R (-2) = P</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">S (+4) = W</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Similarly,    for MTN:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">M (+3) = P</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">T (-2) = R</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">N (+4) = R</p>    <p style=\"orphans:0;widows:0\">Therefore, the required    letter-cluster is PRR.</p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Three statements are given followed by three conclusions numbered    I, II and III. Assuming the statements to be true, even if they    seem to be at variance with commonly known facts, decide which of    the conclusions logically follow(s) from the statements.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Statements:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Some apples    are grapes.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Some grapes    are mangoes.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">All mangoes    are fruits.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Conclusions:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">I. Some    grapes are fruits.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">II. All    apples being mangoes is a possibility.</p>    <p style=\"orphans:0;widows:0\">III. All apples can never be    fruits.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Both conclusions I and II follow</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only conclusion I follows</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both conclusions II and III follow</p>", "option4": " <p style=\"orphans:0;widows:0\">    Only conclusion III follows</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    From the given statements:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788114006996_html_957cec0792a033a.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Some    grapes are mangoes and all mangoes are fruits, which implies that    the portion of grapes that are mangoes are also fruits. Thus,    'Some grapes are fruits' is definitely true. (Conclusion I    follows)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. There is    no negative relation given between apples and mangoes. Therefore,    'All apples being mangoes is a possibility' is true. (Conclusion    II follows)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Since all    statements are positive, all apples can potentially be fruits.    Thus, 'All apples can never be fruits' is false. (Conclusion III    does not follow)</p>    <p style=\"orphans:0;widows:0\">Hence, both conclusions I and II    follow.</p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the word-pair that best represents a similar relationship    to the one expressed in the pair of words given below.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(The words    must be considered as meaningful English words and must NOT be    related to each other based on the number of letters/number of    consonants/vowels in the word)</p>    <p style=\"orphans:0;widows:0\">China : Yangtze</p>", "option1": "<p style=\"orphans:0;widows:0\">    France : Seine</p>", "option2": " <p style=\"orphans:0;widows:0\">    Canada : Mekong</p>", "option3": " <p style=\"orphans:0;widows:0\">    Egypt : Colorado</p>", "option4": " <p style=\"orphans:0;widows:0\">    Russia : Thames</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Just as Yangtze is a major river located in China, similarly,    Seine is a major river located in France.</p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0\">    In a certain code language, 'books are very useful' is written as    'pa da na ta', 'useful books give knowledge' is written as 'da ma    pa ra', and 'knowledge is very deep' is written as 'ra ta sa ga'.    How will 'are' be written in that language?</p>", "option1": "<p style=\"orphans:0;widows:0\">    pa</p>", "option2": " <p style=\"orphans:0;widows:0\">    na</p>", "option3": " <p style=\"orphans:0;widows:0\">    ta</p>", "option4": " <p style=\"orphans:0;widows:0\">    da</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Comparing the first and second statements, the common words are    'books' and 'useful' and their common codes are 'pa' and 'da'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Comparing the    first and third statements, the common word is 'very' and its    common code is 'ta'.</p>    <p style=\"orphans:0;widows:0\">In the first statement, the only    remaining word is 'are' and the remaining code is 'na'. Therefore,    'are' is coded as 'na'.</p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Three of the following four letter-cluster pairs are alike in a    certain way and thus form a group. Which is the letter-cluster    pair that does NOT belong to that group?</p>    <p style=\"orphans:0;widows:0\">(Note: The odd one out is not    based on the number of consonants/vowels or their positions in the    letter-cluster.)</p>", "option1": "<p style=\"orphans:0;widows:0\">    GL - NS</p>", "option2": " <p style=\"orphans:0;widows:0\">    PS - VY</p>", "option3": " <p style=\"orphans:0;widows:0\">    EJ - LQ</p>", "option4": " <p style=\"orphans:0;widows:0\">    MR - TY</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In a
