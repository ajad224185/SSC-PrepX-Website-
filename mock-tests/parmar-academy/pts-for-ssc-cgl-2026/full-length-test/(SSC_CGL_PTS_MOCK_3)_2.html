<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>6.) SSC CGL PTS  MOCK 3 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

: " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Throw its weight around</span></p>", "option3": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Bend over backwards</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Cry over spilt milk</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Ride     roughshod over</b></span><span style=\"font-family:'Nirmala UI'\"> –     To treat others badly and dominate them (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>दूसरों     पर अत्याचार करना </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/     </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>हावी     होना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>।</span></span></span></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Origin</b></span><span style=\"font-family:'Nirmala UI'\">- The      idiom comes from the old practice of fitting horses with rough      shoes (</span><span style=\"font-family:'Nirmala UI'\"><b>called rough      shoes</b></span><span style=\"font-family:'Nirmala UI'\">) that had sharp      projections to prevent slipping on hard or icy roads. When a      horse rode roughshod, it would trample harshly and cause damage      without care. Over time, this expression came to mean treating      people harshly, dominating them, or ignoring their rights and      feelings </span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Turn     a blind eye</b></span><span style=\"font-family:'Nirmala UI'\"> – To     ignore something deliberately (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>जानबूझकर     अनदेखा करना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>।</span></span></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Throw     its weight around</b></span><span style=\"font-family:'Nirmala UI'\"> –     To use power to control or dominate others (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>अपनी     ताकत का रौब दिखाना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>।</span></span></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Bend     over backwards</b></span><span style=\"font-family:'Nirmala UI'\"> –     To make extra effort to help (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>बहुत     अधिक प्रयास करना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>।</span></span></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Cry     over spilt milk</b></span><span style=\"font-family:'Nirmala UI'\"> –     To feel sad about something that cannot be changed (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>बीती     बात पर पछताना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>।</span></span></span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option B is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate synonym    of the word \"Repatriation\".</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Expatriation</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Restitution</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Homecoming</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Naturalization</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Repatriation</b></span><span style=\"font-family:'Nirmala UI'\"> –     the act of returning someone to their own country. (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>स्वदेश     वापसी </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/     </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>अपने     देश लौटाना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Homecoming     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>घर     वा ><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     becoming a citizen of another country</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option C is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the incorrectly spelt word.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Anesthesiologist</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Synesthesia</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kinesthatic</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Cinematographer</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Anesthesiologist</b></span><span style=\"font-family:'Nirmala UI'\"> –     a doctor who gives anesthesia during surgery (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>बेहोशी     की दवा देने वाला चिकित्सक</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>।</span></span></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Synesthesia</b></span><span style=\"font-family:'Nirmala UI'\"> –     a condition where one sense triggers another (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>इंद्रियों     का मिश्रित अनुभव</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>।</span></span></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Kinesthatic</b></span><span style=\"font-family:'Nirmala UI'\"> –     Incorrect spelling; correct spelling is </span><span style=\"font-family:'Nirmala UI'\"><b>Kinesthetic</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>शारीरिक     गति या संवेदना से संबंधित</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>।</span></span></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Cinematographer</b></span><span style=\"font-family:'Nirmala UI'\"> –     a person responsible for camera work in films (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>फिल्म     का छायाकार</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>।</span></span></span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, Option    C is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate antonym    of the word “Encumbrance.”</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Impediment</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Exoneration</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Liability</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Constraint</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Encumbrance</b></span><span style=\"font-family:'Nirmala UI'\"> –     a burden, obstruction, or legal liability that restricts freedom     or action (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>बोझ     </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/ </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>बाधा     </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/     </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>दायित्व</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>।</span></span></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Impediment     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>रुकावट</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     something that hinders progress </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Exoneration     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>दोषमुक्ति     </b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>/     </b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>बोझ     से मुक्ति</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     the act of freeing someone from blame or burden  (Closest     opposite in sense of release from burden)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Liability     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>दायित्व     </b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>/     </b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>जिम्मेदारी</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     legal responsibility; a burden </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Constraint     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>बंधन     </b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>/     </b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>प्रतिबंध</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     limitation or restriction </span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence, Option    B is the correct answer.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate    one-word substitution for the following:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">To    divide something into portions and share it among people, often    informally.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Allocate</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Divvy up</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Usurp</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Annex</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The phrase refers to dividing    something into parts and sharing it, usually in an informal way.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Divvy     up(</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>अनौपचारिक     रूप से बाँटना</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     to divide and distribute into shares </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Allocate     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>आवंटित     करना</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     to assign officially or formally </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Annex     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>संलग्न     करना </b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>/     </b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>कब्ज़ा     करना</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     to add or attach, often territorially </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Usurp     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>हड़प     लेना</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     to take power or position illegally </span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option B is the correct answer.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the correct option.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    proposal was so ambiguous that it was ______ impossible to    determine its actual implications.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">scarcely</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">utterly</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">virtually</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">faintly</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The sentence suggests that because    the proposal was very unclear, determining its meaning was almost    impossible.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Virtually     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>लगभग     </b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>/     </b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>लगभग     पूरी तरह से</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     almost; nearly (Correct fit: “virtually impossible”)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Scarcely     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>मुश्किल     से</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     barely; not quite</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Utterly     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>पूरी     तरह से</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     completely (would suggest absolutely impossible, not “almost”)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Faintly     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>हल्के     रूप से</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     slightly</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"> “<span style=\"font-family:'Nirmala UI'\">Virtually     impossible” is a common and correct expression meaning nearly     impossible.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option C is the correct answer.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The following sentence has been    split into four segments. Identify the segment that contains a    grammatical error.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">One-third    of the confidential documents / has been misplaced / during the    internal audit / conducted last month.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">One-third of the confidential    documents</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">has been misplaced</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">during the internal audit</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">conducted last month</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781844903210_html_9635ed920889b6d1.jpg\" width=\"362\" height=\"292\" > </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     error is in </span><span style=\"font-family:'Nirmala UI'\"><b>Segment     A</b></span><span style=\"font-family:'Nirmala UI'\"> (because it     affects verb agreement).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Rule:<br> When     a fraction like </span><span style=\"font-family:'Nirmala UI'\"><b>“one-third     of”</b></span><span style=\"font-family:'Nirmala UI'\"> is used, the     verb agrees with the noun that follows it.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Here, </span><span style=\"font-family:'Nirmala UI'\"><b>“documents”</b></span><span style=\"font-family:'Nirmala UI'\"> is    plural, so the verb must also be plural.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">“<span style=\"font-family:'Nirmala UI'\">One-third     of the confidential documents </span><span style=\"font-family:'Nirmala UI'\"><b>have     been misplaced</b></span><span style=\"font-family:'Nirmala UI'\"> …” </span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option B is the correct answer.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Sentences of a paragraph are given    below in jumbled order. Arrange the sentences in the correct order    to form a meaningful and coherent paragraph.</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Artificial     Intelligence is increasingly being integrated into various     sectors, from healthcare to finance.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Nevertheless,     concerns regarding data privacy and job displacement continue to     spark global debate.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">By     automating repetitive tasks and analyzing vast amounts of data,     it enhances efficiency and decision-making.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Therefore,     while its potential is transformative, careful regulation and     ethical considerations are essential.</span></p>    </li></ol>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1-3-2-4</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1-2-3-4</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3-1-4-2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2-1-3-4</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence     1</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Introduces the main topic: AI integration in different sectors.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence     3</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Explains how AI brings benefits (automation and efficiency).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence2</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Introduces contrast using “Nevertheless,” highlighting     concerns.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence     4</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Concludes with a balanced opinion and recommendation.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Logical     flow: Introduction </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Benefits </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Concerns </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Conclusion.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, Option    A is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the option that expresses    the given sentence in active voice.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    proposal had been meticulously reviewed by the panel before it was    submitted to the board.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The panel had meticulously reviewed    the proposal before it was submitted to the board.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The panel had been reviewing the    proposal before submission to the board.<br> </span><br>     </p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The proposal reviewed the panel    before it was submitted to the board.<br> </span><br>     </p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The panel has meticulously reviewed    the proposal before it was submitted to the board.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     given sentence is in </span><span style=\"font-family:'Nirmala UI'\"><b>past     perfect passive</b></span><span style=\"font-family:'Nirmala UI'\"> form:<br> </span><span style=\"font-family:'Nirmala UI'\"><b>had     been + past participle (reviewed)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Structure:<br> Object     + had been + V³ + by + subject</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">“<span style=\"font-family:'Nirmala UI'\">The    proposal had been reviewed by the panel …”</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">To    convert into active voice:</span></p>    <ul>     <ol>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Make </span><span style=\"font-family:'Nirmala UI'\"><b>“the      panel”</b></span><span style=\"font-family:'Nirmala UI'\"> the      subject.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Change      the verb to </span><span style=\"font-family:'Nirmala UI'\"><b>past      perfect active</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><i>had      reviewed</i></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Keep      the time clause unchanged.</span></p>     </li></ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Correct     form:<br> </span><span style=\"font-family:'Nirmala UI'\"><b>The panel had     meticulously reviewed the proposal before it was submitted to the     board.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option A is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate idiom    to fill in the blank.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Despite    several warnings from his friends, Arun chose to __________ and    invest all his savings in the risky venture.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">take the plunge</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">throw caution to the wind</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">go out on a limb</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">cross the Rubicon</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The sentence suggests that Arun    made a bold and risky decision.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Take     the plunge (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>जोखिम     उठाना </b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>/     </b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>साहसिक     कदम उठाना</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     To decide to do something risky after hesitation. </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Cross     the Rubicon (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>वापसी     का रास्ता बंद कर देना </b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>/     </b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>निर्णायक     कदम उठाना</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     To take an irreversible step.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Throw     caution to the wind (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>सावधानी     छोड़ देना</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     To act recklessly without worrying about consequences.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Go     out on a limb (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>जोखिम     लेकर अलग राय रखना</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     To take a risk, often by expressing an unpopular opinion.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">All     options relate to risk, but </span><span style=\"font-family:'Nirmala UI'\"><b>“take     the plunge”</b></span><span style=\"font-family:'Nirmala UI'\"> best     fits the context of investing after hesitation.<br> Hence,     Option A is the correct answer.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate ANTONYM    of the underlined word.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    company’s profits </span><span style=\"font-family:'Nirmala UI'\"><u>plummeted</u></span><span style=\"font-family:'Nirmala UI'\"> after    the unexpected economic downturn.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Soared</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Declined</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Collapsed</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Dwindled</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Plummeted</b></span><span style=\"font-family:'Nirmala UI'\"> –     fell suddenly and sharp   <span style=\"font-family:'Nirmala UI'\">1-3-2-4</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Step     1 – Introduction:</b></span><span style=\"font-family:'Nirmala UI'\"><br> 1     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Introduces the topic of renewable energy.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Step     2 – Explanation:</b></span><span style=\"font-family:'Nirmala UI'\"><br> 3     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Explains why renewable sources are beneficial.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Step     3 – Action Taken:</b></span><span style=\"font-family:'Nirmala UI'\"><br> 2     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Shows government efforts supporting this trend.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Step     4 – Conclusion/Result:</b></span><span style=\"font-family:'Nirmala UI'\"><br> 4     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Concludes with the overall impact.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Logical    flow: Introduction </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    Reason </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    Action </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    Result.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option D is the correct answer.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Change the following sentence into    indirect speech:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Priya    said to her brother, “I completed my project yesterday, and I am    going to submit it tomorrow.”</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Priya told her brother that she had    completed her project the previous day and she was going to submit    it the next day.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Priya told her brother that she    completed her project yesterday and she will submit it tomorrow.<br> </span><br>     </p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Priya said her brother that she had    completed her project the previous day and would submit it the    next day.<br> </span><br>     </p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Priya told her brother that she has    completed her project the previous day and was going to submit it    tomorrow.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Reporting     verb:</b></span><span style=\"font-family:'Nirmala UI'\"> “said to”     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     changes to </span><span style=\"font-family:'Nirmala UI'\"><b>told</b></span><span style=\"font-family:'Nirmala UI'\"> (when     an object is mentioned).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Tense     changes:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Simple      past </span><span>→</span><span style=\"font-family:'Nirmala UI'\">      Past perfect (“completed” </span><span>→</span><span style=\"font-family:'Nirmala UI'\">      “had completed”)</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">“<span style=\"font-family:'Nirmala UI'\">am      going to submit” </span><span>→</span><span style=\"font-family:'Nirmala UI'\">      “was going to submit”</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Time     changes:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">“<span style=\"font-family:'Nirmala UI'\">yesterday”      </span><span>→</span><span style=\"font-family:'Nirmala UI'\">      “the previous day”</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">“<span style=\"font-family:'Nirmala UI'\">tomorrow”      </span><span>→</span><span style=\"font-family:'Nirmala UI'\">      “the next day”</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pronoun     change:</b></span><span style=\"font-family:'Nirmala UI'\"><br> “I” </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     “she” (referring to Priya)</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, Option    A is the correct answer</span><span style=\"font-family:'Nirmala UI'\"><b>.</b></span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the sentence containing the    homonym of the highlighted word:<br> The </span><span style=\"font-family:'Nirmala UI'\"><b>spring</b></span><span style=\"font-family:'Nirmala UI'\"> gushed    out of the mountain cliff.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Every morning, I like to stretch    and do spring exercises.<br> </span><br>     </p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The old mattress has a broken    spring that makes it uncomfortable to sleep.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The spring in her step showed she    was in a cheerful mood.<br> </span><br>     </p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The children played near the    natural spring at the forest edge.</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     word </span><span style=\"font-family:'Nirmala UI'\"><b>“spring”</b></span><span style=\"font-family:'Nirmala UI'\"> has     multiple meanings:</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Spring     (water source)</b></span><span style=\"font-family:'Nirmala UI'\"> –     natural flow of water from the ground.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Spring     (coil)</b></span><span style=\"font-family:'Nirmala UI'\"> – a     mechanical helical device.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Spring     (season)</b></span><span style=\"font-family:'Nirmala UI'\"> – the     season between winter and summer.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Spring     (to jump or leap)</b></span><span style=\"font-family:'Nirmala UI'\"> –     to move suddenly.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In     the original sentence, </span><span style=\"font-family:'Nirmala UI'\"><b>“spring”</b></span><span style=\"font-family:'Nirmala UI'\"> refers     to a </span><span style=\"font-family:'Nirmala UI'\"><b>water source</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Sentence </span><span style=\"font-family:'Nirmala UI'\"><b>D</b></span><span style=\"font-family:'Nirmala UI'\"> also     refers to a </span><span style=\"font-family:'Nirmala UI'\"><b>water     spring</b></span><span style=\"font-family:'Nirmala UI'\">, which is the     homonym.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option D is the correct answer.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the word which is most    similar in meaning to the given word:<br> Consummate</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Incomplete</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Expert</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ordinary</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mediocre</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'N an>→</span><span style=\"font-family:'Nirmala UI'\">     Someone highly skilled; matches the meaning.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Incomplete     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>अधूरा</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Opposite meaning</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Ordinary     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>साधारण</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Not exceptional</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Mediocre     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>सामान्य</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>,     </b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>औसत</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Below excellence</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option B is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the most suitable option to    replace the highlighted words so that the sentence is    grammatically correct and clear:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    professor advised the students </span><span style=\"font-family:'Nirmala UI'\"><b>to    revising their assignments thoroughly before submitting it </b></span><span style=\"font-family:'Nirmala UI'\">to    avoid losing marks for minor errors</span><span style=\"font-family:'Nirmala UI'\"><b>.</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">to revise their assignments    thoroughly before submitting them</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">revising their assignments    thoroughly before submitting it</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">to revising their assignments    thoroughly before submitting them</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">revise their assignments thoroughly    before submitting it</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     verb </span><span style=\"font-family:'Nirmala UI'\"><b>“advise”</b></span><span style=\"font-family:'Nirmala UI'\"> is     followed by </span><span style=\"font-family:'Nirmala UI'\"><b>someone     + to-infinitive</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     “advise someone </span><span style=\"font-family:'Nirmala UI'\"><b>to     do something</b></span><span style=\"font-family:'Nirmala UI'\">.”</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     original sentence uses </span><span style=\"font-family:'Nirmala UI'\"><b>“to     revising”</b></span><span style=\"font-family:'Nirmala UI'\">, which is     incorrect because </span><span style=\"font-family:'Nirmala UI'\"><b>“to”     must be followed by a bare verb</b></span><span style=\"font-family:'Nirmala UI'\">,     not a gerund.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     object </span><span style=\"font-family:'Nirmala UI'\"><b>“assignments”</b></span><span style=\"font-family:'Nirmala UI'\"> is     plural, so the pronoun must also be plural: </span><span style=\"font-family:'Nirmala UI'\"><b>“them”</b></span><span style=\"font-family:'Nirmala UI'\">,     not “it.”</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     A:</b></span><span style=\"font-family:'Nirmala UI'\"> “to revise…     before submitting them” </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     correct </span><span style=\"font-family:'Nirmala UI'\"><b>to-infinitive</b></span><span style=\"font-family:'Nirmala UI'\"> form     + correct plural reference. </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     B:</b></span><span style=\"font-family:'Nirmala UI'\"> “revising…     submitting it” </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     uses gerunds incorrectly after “advise” and wrong pronoun     “it.”</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     C:</b></span><span style=\"font-family:'Nirmala UI'\"> “to revising…     submitting them” </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     “to revising” is ungrammatical; infinitive marker cannot     combine with gerund.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     D:</b></span><span style=\"font-family:'Nirmala UI'\"> “revise…     submitting it” </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     bare infinitive without “to” is incorrect after “advise,”     and “it” wrongly refers to plural assignments.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option A is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Identify the incorrectly spelled    word in the following sentence:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    scientist presented a comprehensive analyzis of the climate change    data at the conference.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">scientist</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">presented</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">analyzis</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">comprehensive</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>scientist</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     a person who studies or practices science.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>presented</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     past tense of “present,” meaning to show or display.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>analyzis</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Incorrect spelling; correct: </span><span style=\"font-family:'Nirmala UI'\"><b>analysis</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     detailed examination of data or information. </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>comprehensive</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     meaning thorough and complete.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Always     remember: singular of “analyses” is </span><span style=\"font-family:'Nirmala UI'\"><b>analysis</b></span><span style=\"font-family:'Nirmala UI'\">,     plural is </span><span style=\"font-family:'Nirmala UI'\"><b>analyses</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option C is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the most appropriate    one-word substitution for the following description:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A    person who travels to unknown places to explore and gather    information.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Explorer</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Adventurer function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';

        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {

}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}
