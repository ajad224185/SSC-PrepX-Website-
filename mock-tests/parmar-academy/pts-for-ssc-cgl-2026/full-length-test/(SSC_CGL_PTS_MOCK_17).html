-family:'Nirmala UI'\">Coming-of-age novel</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Delhi Is Not Far</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Small-town aspirations</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Our Trees Still Grow in Dehra</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Memoirs and nostalgia</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">A Flight of Pigeons</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Revolt of 1857 backdrop</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding Article 252 of the Constitution of India:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Under     Article 252, Parliament can legislate on a State List subject if     two or more State Legislatures pass resolutions requesting it to     do so.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A     law made under Article 252 can be amended or repealed only by     Parliament.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the statements given above is/are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both 1 and 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither 1 nor 2</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>C)    Both 1 and 2</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    1-Correct</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Normally,     subjects in the </span><span style=\"font-family:'Nirmala UI'\"><b>State     List</b></span><span style=\"font-family:'Nirmala UI'\"> are     legislated upon only by State Legislatures.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">However,     under </span><span style=\"font-family:'Nirmala UI'\"><b>Article 252,     if</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>two     or more states</b></span><span style=\"font-family:'Nirmala UI'\"> pass     resolutions requesting Parliament to make a law on a State List     subject, Parliament gets the power to legislate for those states.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    2- Correct </b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Once     Parliament makes such a law:</span></p>     <ul>      <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The      concerned states </span><span style=\"font-family:'Nirmala UI'\"><b>cannot      amend or repeal it individually.</b></span></p>      </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Only      Parliament has the authority</b></span><span style=\"font-family:'Nirmala UI'\"> to      amend or repeal the law.</span></p>     </li>\n</ul>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This     ensures uniformity among participating states.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Other    important Articles-</b></span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Article</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Provision</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Article 249</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Parliament legislates on State       List in national interest (via</span><span style=\"font-family:'Nirmala UI'\"><b> Rajya       Sabha resolution</b></span><span style=\"font-family:'Nirmala UI'\">)</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Article 250</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Parliament legislates       during </span><span style=\"font-family:'Nirmala UI'\"><b>National       Emergency</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Article 253</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Parliament legislates to       implement </span><span style=\"font-family:'Nirmala UI'\"><b>international       treaties</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Article 356</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Parliament can legislate       during </span><span style=\"font-family:'Nirmala UI'\"><b>President's       Rule</b></span><span style=\"font-family:'Nirmala UI'\"> in a state</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A charged particle is moving along    a direction perpendicular to the axis of a circular    current-carrying loop. What will be the magnetic force acting on    the particle?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Always zero</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Parallel to the velocity of the    particle</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Along the axis of the circular loop</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Perpendicular to both the magnetic    field and the velocity</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer    is: </span><span style=\"font-family:'Nirmala UI'\"><b>D) Perpendicular    to both the magnetic field and the velocity.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A    circular current-carrying loop produces a magnetic field along    its </span><span style=\"font-family:'Nirmala UI'\"><b>axis</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">So:</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Magnetic     field (B) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     along the axis of the loop</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Particle     velocity (v) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     perpendicular to the axis</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Therefore:</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">v </span><span style=\"font-family:'Cambria Math'\">⊥</span><span style=\"font-family:'Nirmala UI'\"> B</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Magnetic    force on a moving charged particle is:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>F = qvBsin</b></span><span><b>θ</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>θ</span><span style=\"font-family:'Nirmala UI'\">=90° ;Since    sin90° = 1</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>F = qvB</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Thus,    the magnetic force is </span><span style=\"font-family:'Nirmala UI'\"><b>maximum</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Direction    of Force:</b></u></i></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     direction is determined by </span><span style=\"font-family:'Nirmala UI'\"><b>Fleming’s     Left-Hand Rule.</b></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Force     is perpendicular to both magnetic field and velocity.</b></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,     the particle tends to move in a </span><span style=\"font-family:'Nirmala UI'\"><b>curved     path.</b></span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Fleming’s    Left-Hand Rule:</b></u></i></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Stretch    the </span><span style=\"font-family:'Nirmala UI'\"><b>thumb,    forefinger, and middle finger</b></span><span style=\"font-family:'Nirmala UI'\"> of    the </span><span style=\"font-family:'Nirmala UI'\"><b>left    hand</b></span><span style=\"font-family:'Nirmala UI'\"> mutually    perpendicular to each other.</span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Finger</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Represents</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Forefinger</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Direction of Magnetic Field (B)</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Middle Finger</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Direction of Current (I)</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Thumb</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Direction of Force/Motion (F)</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding an anticyclone:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">An     anticyclone is a region of high atmospheric pressure.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Winds     in an anticyclone converge towards the centre at the surface     level.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the statements given above is/are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both 1 and 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither 1 nor 2</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>A)    1 only</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    1-Correct</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">An     anticyclone is an area where atmospheric pressure is </span><span style=\"font-family:'Nirmala UI'\"><b>higher     than the surrounding regions</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Air     generally descends from upper layers toward the surface.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Features- </span><span style=\"font-family:'Nirmala UI'\"><b>Clear     skies, Stable weather, Low rainfall, Dry conditions.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    2- Incorrect</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In     an anticyclone, winds </span><span style=\"font-family:'Nirmala UI'\"><b>diverge     outward</b></span><span style=\"font-family:'Nirmala UI'\"> from the     center at the surface.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Since </span><span style=\"font-family:'Nirmala UI'\"><b>pressure     is high at the center</b></span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-family:'Nirmala UI'\"><b>air     moves outward</b></span><span style=\"font-family:'Nirmala UI'\"> toward     lower-pressure areas.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Rotation     in  </span><span style=\"font-family:'Nirmala UI'\"><b>Northern     Hemisphere- Clockwise</b></span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Rotation     in </span><span style=\"font-family:'Nirmala UI'\"><b>Southern     Hemisphere- Anticlockwise</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding chemical bonding:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Statement    I: Covalent bonds are formed by the sharing of electrons between    atoms.<br> Statement II: Compounds formed by covalent bonding    generally do not conduct electricity in the solid state.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Select    the correct option:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both Statement I and Statement II    are correct.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both Statement I and Statement II    are incorrect.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Statement I is correct, but    Statement II is incorrect.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Statement I is incorrect, but    Statement II is correct.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>A)    Both statements are correct</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    1- Correct</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In     covalent bonding, atoms achieve stability by </span><span style=\"font-family:'Nirmala UI'\"><b>sharing     valence electrons</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Usually     occurs between non-metals.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    2- Correct</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Covalent     compounds generally lack </span><span style=\"font-family:'Nirmala UI'\"><b>free     electrons and ions,</b></span><span style=\"font-family:'Nirmala UI'\"> therefore     electricity cannot flow through them in solid state.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">These     are</span><span style=\"font-family:'Nirmala UI'\"><b> poor conductors     of electricity.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Important    Exception</b></span><span style=\"font-family:'Nirmala UI'\">-</span><span style=\"font-family:'Nirmala UI'\"><b>Graphite is    a covalent substance</b></span><span style=\"font-family:'Nirmala UI'\"> but    conducts </span><span style=\"font-family:'Nirmala UI'\"><b>electricity</b></span><span style=\"font-family:'Nirmala UI'\"> because    of </span><span style=\"font-family:'Nirmala UI'\"><b>delocalized    electrons.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Additional    information:</b></u></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Covalent    Bond</b></u></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A     covalent bond is formed by the </span><span style=\"font-family:'Nirmala UI'\"><b>sharing     of electrons</b></span><span style=\"font-family:'Nirmala UI'\"> between     atoms.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Atoms     share electrons to complete their </span><span style=\"font-family:'Nirmala UI'\"><b>octet     or duplet configuration</b></span><span style=\"font-family:'Nirmala UI'\"> and     become stable.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">They     are usually </span><span style=\"font-family:'Nirmala UI'\"><b>poor     conductors of electricity</b></span><span style=\"font-family:'Nirmala UI'\"> because     they lack free electrons or ions.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Covalent     compounds generally have </span><span style=\"font-family:'Nirmala UI'\"><b>low     melting and boiling points</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Many     covalent substances exist as </span><span style=\"font-family:'Nirmala UI'\"><b>gases     or liquids</b></span><span style=\"font-family:'Nirmala UI'\"> at room     temperature.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">These     bonds are generally </span><span style=\"font-family:'Nirmala UI'\"><b>directional     in nature</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Covalent     bonds can be single bond, double bond or triple bond.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Read the below statements marked as    Assertion(A) and Reason(R). Mark the correct options:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Assertion    (A)</b></span><span style=\"font-family:'Nirmala UI'\">: Fundamental Rights    in India are not absolute in nature.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Reason    (R): </b></span><span style=\"font-family:'Nirmala UI'\">The State can    impose reasonable restrictions on certain Fundamental Rights in    the interest of public order, morality, and security of the State.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Choose    the correct answer from the options given below:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both A and R are true, and R is the    correct explanation of A.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both A and R are true, but R is not    the correct explanation of A.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A is true, but R is false.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A is false, but R is true</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>A)Both    Assertion (A) and Reason (R) are correct, and Reason (R) is the    correct explanation of Assertion (A).</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Assertion    (A): Correct</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">“<span style=\"font-family:'Nirmala UI'\"><b>Fundamental     Rights in India are not absolute in nature.”</b></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Fundamental     Rights provided under</span><span style=\"font-family:'Nirmala UI'\"><b> Part     III </b></span><span style=\"font-family:'Nirmala UI'\">of the     Constitution are not unlimited.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     government can </span><span style=\"font-family:'Nirmala UI'\"><b>impose     certain restrictions</b></span><span style=\"font-family:'Nirmala UI'\"> on     them under specific conditions.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Reason    (R): Correct</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    Constitution itself allows the State to impose </span><span style=\"font-family:'Nirmala UI'\"><b>reasonable    restrictions</b></span><span style=\"font-family:'Nirmala UI'\"> on    rights like:</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Freedom     of speech and expression</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Freedom     of assembly</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Freedom     of movement</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Restrictions    may be imposed for</b></span><span style=\"font-family:'Nirmala UI'\">:    Public order, Morality, Security of the State, Sovereignty and    integrity of India, Friendly relations with foreign states.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Why    R Correctly Explains A:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Fundamental    Rights are not absolute because the Constitution permits the    State to impose reasonable restrictions under certain    circumstances.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>the    Reason correctly explains the Assertion</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Key    takeaways:</b></u></i></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Fundamental     Rights are given in </span><span style=\"font-family:'Nirmala UI'\"><b>Part     III</b></span><span style=\"font-family:'Nirmala UI'\"> of the     Constitution.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Covered     under </span><span style=\"font-family:'Nirmala UI'\"><b>Articles 12     to 35</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Originally     there were </span><span style=\"font-family:'Nirmala UI'\"><b>7     Fundamental Rights</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Right     to Property</b></span><span style=\"font-family:'Nirmala UI'\"> was     removed from Fundamental Rights by the </span><span style=\"font-family:'Nirmala UI'\"><b>44th     Constitutional Amendment Act, 1978</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Right     to Property is now a </span><span style=\"font-family:'Nirmala UI'\"><b>legal     right under Article 300A</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">B.     R. Ambedkar called </span><span style=\"font-family:'Nirmala UI'\"><b>Article     32</b></span><span style=\"font-family:'Nirmala UI'\"> the </span><span style=\"font-family:'Nirmala UI'\"><b>“Heart     and Soul of the Constitution.”</b></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Article     32 provides the </span><span style=\"font-family:'Nirmala UI'\"><b>Right     to Constitutional Remedies</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Fundamental     Rights are </span><span style=\"font-family:'Nirmala UI'\"><b>not     absolute</b></span><span style=\"font-family:'Nirmala UI'\"> and can     be reasonably restricted.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Fundamental     Rights are </span><span style=\"font-family:'Nirmala UI'\"><b>enforceable     by courts.</b></span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786114062556_html_8268ec496c6fe6bc.png\" width=\"567\" height=\"378\"> </p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding the functions of money:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Money     acts as a unit of account by serving as a common measure of the     value of goods and services.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Money     as a standard of deferred payment is not a significant function     because modern economies rarely use money for future payments.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the statements given above is/are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither 1 nor 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both 1 and 2</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>B)    1 only</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    1-Correct</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Money     provides a </span><span style=\"font-family:'Nirmala UI'\"><b>common     standard to measure value.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Prices     of all goods and services are expressed in terms of money.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    2- Incorrect</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Standard     of deferred payment is actually a </span><span style=\"font-family:'Nirmala UI'\"><b>very     important function</b></span><span style=\"font-family:'Nirmala UI'\"> of     money in modern economies.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Money     is widely used for:</span><span style=\"font-family:'Nirmala UI'\"><b> Loans,     EMIs, Salaries, Credit transactions, and Future contracts.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Important    Functions of Money:</b></u></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Medium     of exchange</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Measure/unit     of value</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Store     of value</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Standard     of deferred payment</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Who among the following scholars    gave reference to the history of Kashmir?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kalidasa</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Banbhatta</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Harsha</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kalhana</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>D)    Kalhana</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">He    wrote the famous historical chronicle: </span><span style=\"font-family:'Nirmala UI'\"><b>Rajatarangini    in Sanskrit.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It    describes the </span><span style=\"font-family:'Nirmala UI'\"><b>rulers    and history of Kashmir in chronological order.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Served    under-</b></span><span style=\"font-family:'Nirmala UI'\">King Jayasimha of    Kashmir.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Kalidasa:</b></u></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Famous     Sanskrit poet and playwright.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Associated     with the</span><span style=\"font-family:'Nirmala UI'\"><b> Gupta     period, </b></span><span style=\"font-family:'Nirmala UI'\">often     called th</span><span style=\"font-family:'Nirmala UI'\"><b>e “Golden     Age”</b></span><span style=\"font-family:'Nirmala UI'\"> of Sanskrit     literature.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Famous     works:</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Abhijnanasakuntalam</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Meghaduta</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Raghuvamsha</b></span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Known     for poetry, drama, and descriptions of nature.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Banabhatta: </b></u></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Court     poet of King </span><span style=\"font-family:'Nirmala UI'\"><b>Harshavardhana.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Famous     for Sanskrit prose style.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Important     works:</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Harshacharita</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Kadambari</b></span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Harshacharita</b></span><span style=\"font-family:'Nirmala UI'\"> provides     information about </span><span style=\"font-family:'Nirmala UI'\"><b>Harsha’s     reign</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Harsha: </b></u></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Ruler     of North India</b></span><span style=\"font-family:'Nirmala UI'\"> during     the 7th century.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Capital: </span><span style=\"font-family:'Nirmala UI'\"><b>Kannauj.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Patron     of art, literature, and Buddhism.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Chinese     traveler </span><span style=\"font-family:'Nirmala UI'\"><b>Xuanzang visited     India </b></span><span style=\"font-family:'Nirmala UI'\">during his     reign.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Harsha     himself also wrote plays:</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Ratnavali</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Nagananda</b></span></p>      </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Priyadarshika</b></span></p>     </li></ul>    </li></ul>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">“BharatGen,” India’s    indigenous multimodal Large Language Model initiative, has been    developed under which of the following missions?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">IndiaAI Mission</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">National Supercomputing Mission</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">National Mission on    Interdisciplinary Cyber-Physical Systems</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Digital India</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>C) National    Mission on Interdisciplinary Cyber-Physical Systems (NM-ICPS).</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>BharatGen</b></span><span style=\"font-family:'Nirmala UI'\"> has     been developed under the: </span><span style=\"font-family:'Nirmala UI'\"><b>NM-ICPS;</b></span><span style=\"font-family:'Nirmala UI'\"> under     the </span><span style=\"font-family:'Nirmala UI'\"><b>Department of     Science and Technology.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">India’s     first government-supported </span><span style=\"font-family:'Nirmala UI'\"><b>multimodal     Large Language Model (LLM)</b></span><span style=\"font-family:'Nirmala UI'\"> initiative.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Spearheaded     by </span><span style=\"font-family:'Nirmala UI'\"><b>Indian Institute     of Technology Bombay.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Focuses     on </span><span style=\"font-family:'Nirmala UI'\"><b>Indian languages     and cultural diversity</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Supports </span><span style=\"font-family:'Nirmala UI'\"><b>multilingual     AI models.</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Aims     to promote </span><span style=\"font-family:'Nirmala UI'\"><b>inclusive     and sovereign AI</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following Articles of    the Constitution of India deals with the discretionary    powers of the Governor in a State?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 153</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 154</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 167</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 163</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>D)    Article 163</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article    163- Council of Ministers to aid and advise the Governor</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     states that there shall be a Council of Ministers to aid and     advise the Governor, except in matters where the Governor is     required to act in his discretion.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Advice     of Council of Ministers is</span><span style=\"font-family:'Nirmala UI'\"><b> not     binding on Governor</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Examples     of Discretionary Powers</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Reserving      bills for President’s consideration</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Recommendation      of President’s Rule in a state</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">While      acting as administrator of Union Territories</span></p>     </li></ul>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article    153-Governors of States</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Provides     that </span><span style=\"font-family:'Nirmala UI'\"><b>there shall be     a Governor for each State</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>One     person can also be appointed Governor for two or more states</b></span><span style=\"font-family:'Nirmala UI'\">(7th     CAA).</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article    154-Executive Power of State</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Executive     power of the State is</span><span style=\"font-family:'Nirmala UI'\"><b> vested     in the Governor.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Governor exercises this power directly or through officers     subordinate to him.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article    167-Duties of Chief Minister</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    Chief Minister must:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Communicate</span><span style=\"font-family:'Nirmala UI'\"><b> decisions     of the Council of Ministers to the Governor.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Provide     information sought by the Governor.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Submit     matters for consideration of the Council if the Governor     requires.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">R. Muthukannammal, who was honored    with the Padma Shri in 2022, is associated with which of the    following dance forms?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Chhau</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sadir</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Garba</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Rouf</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>B)    Sadir</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>R.    Muthukannammal</b></span><span style=\"font-family:'Nirmala UI'\"> was    honored with the </span><span style=\"font-family:'Nirmala UI'\"><b>Padma    Shri in 2022</b></span><span style=\"font-family:'Nirmala UI'\"> for    her contribution to the traditional dance form</span><span style=\"font-family:'Nirmala UI'\"><b> Sadir.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sadi</b></span><span style=\"font-family:'Nirmala UI'\">r     is the ancient form of present-day </span><span style=\"font-family:'Nirmala UI'\"><b>Bharatanatyam</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     was traditionally performed by </span><span style=\"font-family:'Nirmala UI'\"><b>Devadasis</b></span><span style=\"font-family:'Nirmala UI'\"> in     temples of </span><span style=\"font-family:'Nirmala UI'\"><b>Tamil     Nadu.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">R.     Muthukannammal is among the last hereditary dancers preserving     this tradition.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Rouf</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Traditional     folk dance of </span><span style=\"font-family:'Nirmala UI'\"><b>Jammu     and Kashmir.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Usually     performed by</span><span style=\"font-family:'Nirmala UI'\"><b> women     during festivals</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Garba</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Popular     folk dance of </span><span style=\"font-family:'Nirmala UI'\"><b>Gujarat.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Performed     during </span><span style=\"font-family:'Nirmala UI'\"><b>Navratri.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Chhau</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Folk/semi-classical     dance of: </span><span style=\"font-family:'Nirmala UI'\"><b>Odisha     (Mayurbhanj Chhau), Jharkhand (Seraikella Chhau), West Bengal     (Purulia Chhau).</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Known     for </span><span style=\"font-family:'Nirmala UI'\"><b>masks and     martial movements.</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Identify the correct option:</span></p>    <p style=\"orphans:0;widows:0\"> <span style=\"font-family:'Nirmala UI'\">'___    iron is a useful metal, but ___ iron used in this machinery is    imported.'<br>  </span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The, the</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">An, the</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">no article, the</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">no article, no article</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct answer: </span><span style=\"font-family:'Nirmala UI'\"><b>option    C (no article, the)<br> </b></span><span style=\"font-family:'Nirmala UI'\"> </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>First     Blank (No Article):</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Iron</b></span><span style=\"font-family:'Nirmala UI'\"> is     a material noun. Material nouns do not take an article when used     in a general, universal sense (</span><span style=\"font-family:'Nirmala UI'\"><i>\"Iron     is a useful metal\"</i></span><span style=\"font-family:'Nirmala UI'\">).</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Second     Blank (The):</b></span><span style=\"font-family:'Nirmala UI'\"> When     a material noun is specified or restricted by a modifying phrase     (</span><span style=\"font-family:'Nirmala UI'\"><i>\"...iron </i></span><span style=\"font-family:'Nirmala UI'\"><i><b>used     in this machinery</b></i></span><span style=\"font-family:'Nirmala UI'\"><i>\"</i></span><span style=\"font-family:'Nirmala UI'\">),     it becomes definite and requires the definite article </span><span style=\"font-family:'Nirmala UI'\"><b>'the'</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Identify the segment that contains    a grammatical error: </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">He    is getting smarter and smarter every day, but his brother is the    smartest of the two.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">his brother is the smartest</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">every day, but</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">He is getting smarter and smarter</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">of the two</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct answer: </span><span style=\"font-family:'Nirmala UI'\"><b>option    A<br> </b></span><span style=\"font-family:'Nirmala UI'\"> </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    sentence compares exactly </span><span style=\"font-family:'Nirmala UI'\"><b>two</b></span><span style=\"font-family:'Nirmala UI'\"> people    (the subject \"He\" and \"his brother\"), as    indicated by the phrase </span><span style=\"font-family:'Nirmala UI'\"><i>\"of    the two\"</i></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     superlative degree (</span><span style=\"font-family:'Nirmala UI'\"><b>\"the     smartest\"</b></span><span style=\"font-family:'Nirmala UI'\">) is only     used when comparing three or more entities.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">For     exactly two entities, the comparative degree (</span><span style=\"font-family:'Nirmala UI'\"><b>\"the     smarter\"</b></span><span style=\"font-family:'Nirmala UI'\">) must be     used.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Correct    Sentence:</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><i>\"He    is getting smarter and smarter every day, but his brother is </i></span><span style=\"font-family:'Nirmala UI'\"><i><b>the    smarter</b></i></span><span style=\"font-family:'Nirmala UI'\"><i> of    the two.\"</i></span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Transform the following sentence    into the passive voice: </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">'People    say that he is an honest officer.'</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">He was said to be an honest    officer.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It has been said that he is an    honest officer.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">That he is an honest officer is    saying by people.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is said that he is an honest    officer.</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer:</span><span style=\"font-family:'Nirmala UI'\"><b> Option    D</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    original sentence (</span><span style=\"font-family:'Nirmala UI'\"><b>\"People    say that...\"</b></span><span style=\"font-family:'Nirmala UI'\">)    expresses a general belief in the present tense.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">When    changing sentences like this into the passive voice:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     word </span><span style=\"font-family:'Nirmala UI'\"><b>\"People\"</b></span><span style=\"font-family:'Nirmala UI'\"> is     removed.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">We     start the sentence with </span><span style=\"font-family:'Nirmala UI'\"><b>\"It\"</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     present tense verb </span><span style=\"font-family:'Nirmala UI'\"><b>\"say\"</b></span><span style=\"font-family:'Nirmala UI'\"> becomes </span><span style=\"font-family:'Nirmala UI'\"><b>\"is     said\"</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     rest of the sentence (</span><span style=\"font-family:'Nirmala UI'\"><b>\"that     he is an honest officer\"</b></span><span style=\"font-family:'Nirmala UI'\">)     stays exactly the same.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Therefore, </span><span style=\"font-family:'Nirmala UI'\"><b>\"It    is said that he is an honest officer\"</b></span><span style=\"font-family:'Nirmala UI'\"> is    the perfect passive match.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Why    the other options are wrong:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     A:</b></span><span style=\"font-family:'Nirmala UI'\"> Incorrectly     changes the time to the past tense (\"was said\").</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     B:</b></span><span style=\"font-family:'Nirmala UI'\"> Incorrectly     changes the form to the present perfect (\"has been said\").</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Option     C:</b></span><span style=\"font-family:'Nirmala UI'\"> Uses incorrect     grammar (\"is saying by people\").</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Improve the underlined part of the    sentence. If no improvement is needed, select 'No improvement'.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">'Between    you and </span><span style=\"font-family:'Nirmala UI'\"><u>I</u></span><span style=\"font-family:'Nirmala UI'\">,    the management has already decided to downsize the department.'</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">we</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">myself</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">me</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">No improvement</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: Option C (me)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    word </span><span style=\"font-family:'Nirmala UI'\"><b>'between'</b></span><span style=\"font-family:'Nirmala UI'\"> is    a preposition. In English grammar, any pronoun that follows a    preposition must be in the </span><span style=\"font-family:'Nirmala UI'\"><b>objective    case</b></span><span style=\"font-family:'Nirmala UI'\"> (e.g., </span><span style=\"font-family:'Nirmala UI'\"><i>me,    us, him, her, them</i></span><span style=\"font-family:'Nirmala UI'\">), not    the subjective case (</span><span style=\"font-family:'Nirmala UI'\"><i>I,    we, he, she, they</i></span><span style=\"font-family:'Nirmala UI'\">).</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Since    both pronouns follow the preposition \"between,\" they    must both be objective. Therefore, </span><span style=\"font-family:'Nirmala UI'\"><i>\"Between    you and I\"</i></span><span style=\"font-family:'Nirmala UI'\"> is    incorrect, and it must be replaced with </span><span style=\"font-family:'Nirmala UI'\"><b>\"Between    you and me\"</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the closest synonym for the    bolded word: </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">She    tried to remain objective, but her </span><span style=\"font-family:'Nirmala UI'\"><b>predilection</b></span><span style=\"font-family:'Nirmala UI'\"> for    classical architecture influenced her judgment.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ignorance</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">aversion</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">preference</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">indifference</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>Option    C (preference)</b></span><span style=\"font-family:'Nirmala UI'\"><br> <br> </span><span style=\"font-family:'Nirmala UI'\"><b>Explanation</b></span><span style=\"font-family:'Nirmala UI'\">:<br> \"Predilection\"    means a preference or special liking for something; a natural bias    in favor of something.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Synonyms</b></span><span style=\"font-family:'Nirmala UI'\">:    Fondness, Penchant, Inclination, Partiality, Proclivity</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Antonyms: Aversion, Antipathy, Dislike, Indifference<br> Analysis    of Options:<br> • Option A (ignorance): Lack of knowledge or    information. (Incorrect)<br> • Option B (aversion): A strong    dislike or disinclination. This is an antonym of predilection.    (Incorrect)<br> • Option C (preference): A greater liking for    one alternative over another. (Correct Synonym)<br> • Option D    (indifference): Lack of interest, concern, or sympathy.    (Incorrect)</b></span></p>", "question_heading": ""}, {"sr_no": 31, "question": "Rधोननोngध पुध ीियियथing ौधnपधncधौ पय ीयनं ो cयुधनधnप ूोनोgनोूु: A. Tुiौ cुधंicोि cयंूयहnक पनiggधनौ ो नोूiक कधीधnौध नधौूयnौध in nधigुृयनing ीियनो, थोनning पुधं यी nधोनृद ुधनृiॅयनधौ. B. Wुधn ोn ोcोciो पनधधैौ िधोॅधौ ोनध cुधथधक ृद ोn ोniंोि, पुध ूिोnप iंंधकiोपिधद ृधginौ ौदnपुधौप्रing ॅियोपiिध धपुिदधnध gोौ. C. In नधौूयnौध पय पुiौ inॅiौiृिध ौignोि, पुध ौहननयहnकing पनधधौ ूहंू ृiपपधन पोnninौ inपय पुधiन यथn िधोॅधौ, ंोाing पुधं हnूोिोपोृिध. D. Cयnौधतहधnिपद, पुध ृनयथौing ोniंोिस ोनध ीयनcधक पय ंयॅध हूथinक पय ीinक ीययक पुोप ुोौnैप दधप कधूियदधक iपौ cुधंicोि कधीधnौध.", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">BACD</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">BADC<br>  </span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">CABD</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ABCD</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Corre
