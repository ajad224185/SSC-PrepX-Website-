mily:'Nirmala UI'\">profound<br>  </span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: Option C    (banal)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Insipid     (adjective):</b></span><span style=\"font-family:'Nirmala UI'\"> Lacking     flavor, vigor, or interest; dull and boring.(</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>फीका</span></span></span></span><span style=\"font-family:'Nirmala UI'\">/</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>स्वादहीन</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Banal     (adjective):</b></span><span style=\"font-family:'Nirmala UI'\"> So     lacking in originality as to be obvious and boring; trite or     commonplace.(</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>घिसा</span></span></span></span><span style=\"font-family:'Nirmala UI'\">-</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>पिटा</span></span></span></span><span style=\"font-family:'Nirmala UI'\">/</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>साधारण</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Since     both words refer to something that is dull, uninteresting, or     lacks excitement, </span><span style=\"font-family:'Nirmala UI'\"><b>'banal'</b></span><span style=\"font-family:'Nirmala UI'\"> is     the most appropriate synonym.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Options    Analysis:</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>A.     Lively:</b></span><span style=\"font-family:'Nirmala UI'\"> Full of     life and energy; active. (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>ज़िंदादिल     </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/     </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>सक्रिय</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Nirmala UI'\"><i>(Antonym     of Insipid)</i></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>B.     Piquant:</b></span><span style=\"font-family:'Nirmala UI'\"> Having a     pleasantly sharp taste or appetizing flavor; exciting.(</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>चटपटा</span></span></span></span><span style=\"font-family:'Nirmala UI'\">,     </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>दिलचस्प</span></span><span style=\"font-family:'Nirmala UI'\"> </span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Nirmala UI'\"><i>(Antonym     of Insipid)</i></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>D.     Profound:</b></span><span style=\"font-family:'Nirmala UI'\"> Having     or showing great knowledge, insight, or depth.(</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>गहरा</span></span></span></span><span style=\"font-family:'Nirmala UI'\">,     </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>गंभीर</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><i>(Unrelated)</i></span></p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Choose the most appropriate antonym    of the word: IMPETUOUS</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Rash</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Hasty</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Impulsive</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Prudent</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer:</span><span style=\"font-family:'Nirmala UI'\"><b> Option    D (Prudent)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Impetuous:</b></span><span style=\"font-family:'Nirmala UI'\"> Acting    or done quickly and without thought or care. (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>अविवेकी</span></span></span></span><span style=\"font-family:'Nirmala UI'\">,    </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>उतावला</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Synonyms:     Rash, hasty, impulsive, reckless.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Example:     \"He made an impetuous decision to quit his job without     having another one lined up.\"</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Let's    look at the given options:</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     A: Rash </b></span><span style=\"font-family:'Nirmala UI'\">(</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>असावधान</span></span></span></span><span style=\"font-family:'Nirmala UI'\">,     </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>लापरवाह</span></span><span style=\"font-family:'Nirmala UI'\"> </span></span></span><span style=\"font-family:'Nirmala UI'\">)–     Acting or done without careful consideration of the possible     consequences (</span><span style=\"font-family:'Nirmala UI'\"><b>Synonym</b></span><span style=\"font-family:'Nirmala UI'\">).</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     B: Hasty</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>जल्दबाज़</span></span></span></span><span style=\"font-family:'Nirmala UI'\">,     </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>हड़बड़ी     में किया गया</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)–     </span><span style=\"font-family:'Nirmala UI'\">Done with excessive speed     or urgency; hurried (</span><span style=\"font-family:'Nirmala UI'\"><b>Synonym</b></span><span style=\"font-family:'Nirmala UI'\">).</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     C: Impulsive</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>आवेगी</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)     – </span><span style=\"font-family:'Nirmala UI'\">Acting or done without     forethought (</span><span style=\"font-family:'Nirmala UI'\"><b>Synonym</b></span><span style=\"font-family:'Nirmala UI'\">).</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     D: Prudent </b></span><span style=\"font-family:'Nirmala UI'\">(</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>विवेकी</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)     – </span><span style=\"font-family:'Nirmala UI'\">Acting with or showing     care and thought for the future; wise, cautious, and sensible     (</span><span style=\"font-family:'Nirmala UI'\"><b>Antonym</b></span><span style=\"font-family:'Nirmala UI'\">).</span></p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the correct one-word    substitute for: </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">A    person who is primarily concerned with making money at the expense    of ethics <br>  </span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mercenary<br>  </span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Narcissist<br>  </span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Numismatist<br>  </span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Termagant</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>Option    A (Mercenary)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Mercenary     (noun):</b></span><span style=\"font-family:'Nirmala UI'\"> A person     primarily concerned with making money at the expense of ethics or     law. It can also refer to a professional soldier hired to serve     in a foreign army.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Narcissist     (noun):</b></span><span style=\"font-family:'Nirmala UI'\"> A person     who has an excessive interest in or admiration of themselves and     their physical appearance.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Numismatist     (noun):</b></span><span style=\"font-family:'Nirmala UI'\"> A person     who collects or studies coins, paper money, and medals.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Termagant     (noun):</b></span><span style=\"font-family:'Nirmala UI'\"> A     harsh-tempered or overbearing woman.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Fill in the blanks with the most    appropriate pair of words:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Before    you purchase the office ______, make sure that the vehicle    carrying it is ______.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">stationery / stationery</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">stationary / stationery</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">stationary /stationary</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">stationery /stationary</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: Option    D (stationery /stationary)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    sentence requires you to fill in the blanks with the correct    homophones based on their contextual meanings:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>First     Blank (stationery with an 'e'):</b></span><span style=\"font-family:'Nirmala UI'\"> Refers     to writing materials, office supplies, paper, and envelopes.     Since the sentence mentions \"purchasing the office     ______\", </span><span style=\"font-family:'Nirmala UI'\"><b>stationery</b></span><span style=\"font-family:'Nirmala UI'\"> is     the correct fit.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Second     Blank (stationary with an 'a'):</b></span><span style=\"font-family:'Nirmala UI'\"> Means     not moving, staying in one place, or fixed. The sentence refers     to the \"vehicle carrying it\" being completely still or     parked. Therefore, </span><span style=\"font-family:'Nirmala UI'\"><b>stationary</b></span><span style=\"font-family:'Nirmala UI'\"> is     the correct fit.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Complete    Sentence</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Before    you purchase the office </span><span style=\"font-family:'Nirmala UI'\"><b>stationery</b></span><span style=\"font-family:'Nirmala UI'\">,    make sure that the vehicle carrying it is </span><span style=\"font-family:'Nirmala UI'\"><b>stationary</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Change this passive exclamation    into active voice: </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">'What    a magnificent speech was delivered by the president!'</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">How magnificent a speech the    president delivered!</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What a magnificent speech the    president delivered!</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The president delivered what a    magnificent speech!</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What a magnificent speech the    president has delivered!</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: Option B</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Explanation:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Identify     Tense:</b></span><span style=\"font-family:'Nirmala UI'\"> The passive     verb </span><span style=\"font-family:'Nirmala UI'\"><b>\"was     delivered\"</b></span><span style=\"font-family:'Nirmala UI'\"> is     in the </span><span style=\"font-family:'Nirmala UI'\"><i>Simple Past     Tense</i></span><span style=\"font-family:'Nirmala UI'\">. The active voice     must maintain this tense, which gives us </span><span style=\"font-family:'Nirmala UI'\"><b>\"delivered\"</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Subject-Object     Shift:</b></span><span style=\"font-family:'Nirmala UI'\"> The passive     agent </span><span style=\"font-family:'Nirmala UI'\"><b>\"by the     president\"</b></span><span style=\"font-family:'Nirmala UI'\"> becomes     the active subject </span><span style=\"font-family:'Nirmala UI'\"><b>\"the     president\"</b></span><span style=\"font-family:'Nirmala UI'\"> performing     the action.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Structure:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Option     B</b></span><span style=\"font-family:'Nirmala UI'\"> correctly     maintains both the simple past tense and the original exclamatory     structure (</span><span style=\"font-family:'Nirmala UI'\"><i>\"What     a...\"</i></span><span style=\"font-family:'Nirmala UI'\">).</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Given    Passive Voice:</b></span><span style=\"font-family:'Nirmala UI'\">     \"What a magnificent speech </span><span style=\"font-family:'Nirmala UI'\"><b>was    delivered by</b></span><span style=\"font-family:'Nirmala UI'\"> the    president!\"</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Correct    Active Voice (Option B):</b></span><span style=\"font-family:'Nirmala UI'\"> \"What    a magnificent speech </span><span style=\"font-family:'Nirmala UI'\"><b>the    president delivered</b></span><span style=\"font-family:'Nirmala UI'\">!\"</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Identify the correct indirect    speech for the given sentence:</span></p>    <p style=\"orphans:0;widows:0\"> <span style=\"font-family:'Nirmala UI'\">My    grandmother told me, \"I used to wake up at 4 AM when I was    young.\"</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">My grandmother told me that she had    been used to waking up at 4 AM when she had been young.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">My grandmother told me that she    used to wake up at 4 AM when she was young. </span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">My grandmother told me that she    used to wake up at 4 AM when she had been young.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">My grandmother told me that she had    used to wake up at 4 AM when she was young.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: Option B</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Rules    for Indirect Speech:</b></span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Reporting     Verb:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><i>\"told     me\"</i></span><span style=\"font-family:'Nirmala UI'\"> remains     unchanged because it already has an object (</span><span style=\"font-family:'Nirmala UI'\"><i>me</i></span><span style=\"font-family:'Nirmala UI'\">).     The comma and quotation marks are replaced by the     conjunction </span><span style=\"font-family:'Nirmala UI'\"><b>\"that\"</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pronoun     Change:</b></span><span style=\"font-family:'Nirmala UI'\"> The     first-person pronoun </span><span style=\"font-family:'Nirmala UI'\"><b>\"I\"</b></span><span style=\"font-family:'Nirmala UI'\"> refers     to the speaker (</span><span style=\"font-family:'Nirmala UI'\"><i>My     grandmother</i></span><span style=\"font-family:'Nirmala UI'\">), so it     changes to the third-person feminine pronoun </span><span style=\"font-family:'Nirmala UI'\"><b>\"she\"</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Tense     (Past Habit Exception):</b></span><span style=\"font-family:'Nirmala UI'\"> When     converting direct speech to indirect speech, expressions of </span><span style=\"font-family:'Nirmala UI'\"><b>past     habits</b></span><span style=\"font-family:'Nirmala UI'\"> using </span><span style=\"font-family:'Nirmala UI'\"><b>\"used     to\"</b></span><span style=\"font-family:'Nirmala UI'\"> do not     undergo a tense backshift. Therefore, </span><span style=\"font-family:'Nirmala UI'\"><i>\"used     to wake up\"</i></span><span style=\"font-family:'Nirmala UI'\"> and     the background time clause </span><span style=\"font-family:'Nirmala UI'\"><i>\"when     I was young\"</i></span><span style=\"font-family:'Nirmala UI'\"> (except     for the pronoun change to </span><span style=\"font-family:'Nirmala UI'\"><i>\"when     she was young\"</i></span><span style=\"font-family:'Nirmala UI'\">)     remain in their original form.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">This    makes </span><span style=\"font-family:'Nirmala UI'\"><b>Option B</b></span><span style=\"font-family:'Nirmala UI'\"> the    grammatically correct choice.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">What is the direct speech for:</span></p>    <p style=\"orphans:0;widows:0\"> <span style=\"font-family:'Nirmala UI'\">'The    coach commanded the players to run faster.'</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The coach said to the players, \"Run    faster.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The coach said to the players, \"You    can run faster.\"</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The coach said to the players, \"To    run faster.\"</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The coach said to the players,    \"Will you run faster?\"</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Option    A </b></span><span style=\"font-family:'Nirmala UI'\">(The coach said    to the players, \"Run faster)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Identify     the Sentence Type:</b></span><span style=\"font-family:'Nirmala UI'\"> The     phrase </span><span style=\"font-family:'Nirmala UI'\"><i>\"commanded...     to run faster\"</i></span><span style=\"font-family:'Nirmala UI'\"> indicates     an </span><span style=\"font-family:'Nirmala UI'\"><b>imperative     sentence</b></span><span style=\"font-family:'Nirmala UI'\"> (a direct     command).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Reporting     Verb:</b></span><span style=\"font-family:'Nirmala UI'\"> In direct     speech, the commanding verb (</span><span style=\"font-family:'Nirmala UI'\"><i>\"commanded\"</i></span><span style=\"font-family:'Nirmala UI'\">)     reverts back to the standard </span><span style=\"font-family:'Nirmala UI'\"><b>\"said     to\"</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Remove     the Infinitive \"To\":</b></span><span style=\"font-family:'Nirmala UI'\"> When     converting back to direct speech, the infinitive </span><span style=\"font-family:'Nirmala UI'\"><b>\"to\"</b></span><span style=\"font-family:'Nirmala UI'\"> is     dropped, and the verb starts the quote.</span></p>    </li></ol>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Choose the word that is spelt    CORRECTLY.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Superintendant</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Superintendent</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Supperrintendent</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Superintandent</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct spelling    is </span><span style=\"font-family:'Nirmala UI'\"><b>Superintendent</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Root    Words Breakdown:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Super</b></span><span style=\"font-family:'Nirmala UI'\"> (meaning     above or over)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Intend</b></span><span style=\"font-family:'Nirmala UI'\"> (meaning     to plan or have a purpose)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Ent</b></span><span style=\"font-family:'Nirmala UI'\"> (the     noun-forming suffix)</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A </span><span style=\"font-family:'Nirmala UI'\"><b>superintendent</b></span><span style=\"font-family:'Nirmala UI'\"> is    a person who oversees, directs, or manages an organization,    district, or building (such as a school superintendent or a    building \"super\").</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option </span><span style=\"font-family:'Nirmala UI'\"><b>B</b></span><span style=\"font-family:'Nirmala UI'\"> is    the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Identify the sentence with the    CORRECT spelling of the highlighted word.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The intelligence branch issued a    high-priority warning about </span><span style=\"font-family:'Nirmala UI'\"><b>guerrilla</b></span><span style=\"font-family:'Nirmala UI'\"> warfare    tactics in the border region.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The intelligence branch issued a    high-priority warning about </span><span style=\"font-family:'Nirmala UI'\"><b>guerilla</b></span><span style=\"font-family:'Nirmala UI'\"> warfare    tactics in the border region.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The intelligence branch issued a    high-priority warning about </span><span style=\"font-family:'Nirmala UI'\"><b>gorilla</b></span><span style=\"font-family:'Nirmala UI'\"> warfare    tactics in the border region.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The intelligence branch issued a    high-priority warning about </span><span style=\"font-family:'Nirmala UI'\"><b>guerrila</b></span><span style=\"font-family:'Nirmala UI'\"> warfare    tactics in the border region.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Option: Option A</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:' orrect Option:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>B    (Unless you do not give up)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     word </span><span style=\"font-family:'Nirmala UI'\"><b>\"Unless\"</b></span><span style=\"font-family:'Nirmala UI'\"> is     already negative and means </span><span style=\"font-family:'Nirmala UI'\"><b>\"If...     not\"</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Adding </span><span style=\"font-family:'Nirmala UI'\"><b>\"do     not\"</b></span><span style=\"font-family:'Nirmala UI'\"> after </span><span style=\"font-family:'Nirmala UI'\"><i>unless</i></span><span style=\"font-family:'Nirmala UI'\"> creates     an incorrect double negative.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Remove </span><span style=\"font-family:'Nirmala UI'\"><i>\"do     not\"</i></span><span style=\"font-family:'Nirmala UI'\"> to make     the sentence grammatically sound.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Correct    Sentence:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><i>\"</i></span><span style=\"font-family:'Nirmala UI'\"><i><b>Unless    you give up</b></i></span><span style=\"font-family:'Nirmala UI'\"><i> your    bad habits, you cannot achieve anything substantial in life.\"</i></span></p>", "question_heading": ""}, {"sr_no": 42, "question": "\n <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Rearrange the parts to form a    meaningful paragraph.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>P:</b></span><span style=\"font-family:'Nirmala UI'\"> He    spent hours carefully assembling the delicate wooden framework on    his small workbench.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Q:</b></span><span style=\"font-family:'Nirmala UI'\"> A    young boy named Kabir dreamed of winning the annual neighborhood    kite-flying festival.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>R:</b></span><span style=\"font-family:'Nirmala UI'\"> When    he finally launched it into the sky, the vibrant red creation    soared higher than every other competitor's kite.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>S:</b></span><span style=\"font-family:'Nirmala UI'\"> To    achieve this, he saved up his pocket money for weeks to buy the    finest tissue paper and bamboo sticks.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QSPR</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QPSR</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">SPRQ</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QRSP</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>Option    A (QSPR)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Explanation:</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence     Q</b></span><span style=\"font-family:'Nirmala UI'\"> is the ideal     opening sentence as it introduces the main character (</span><span style=\"font-family:'Nirmala UI'\"><b>Kabir</b></span><span style=\"font-family:'Nirmala UI'\">)     and his goal of winning the kite festival.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence     S</b></span><span style=\"font-family:'Nirmala UI'\"> follows     immediately because the phrase </span><span style=\"font-family:'Nirmala UI'\"><i>\"To     achieve this\"</i></span><span style=\"font-family:'Nirmala UI'\"> directly     links to his goal in </span><span style=\"font-family:'Nirmala UI'\"><b>Q</b></span><span style=\"font-family:'Nirmala UI'\">,     explaining how he saved money to buy the raw materials.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence     P</b></span><span style=\"font-family:'Nirmala UI'\"> comes next,     moving chronologically from buying materials to the construction     process of assembling the framework on his workbench.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence     R</b></span><span style=\"font-family:'Nirmala UI'\"> is the perfect     conclusion, describing the final launch of the kite and the     successful outcome.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Therefore,    the correct order is </span><span style=\"font-family:'Nirmala UI'\"><b>Q-S-P-R</b></span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the option that correctly    rectifies the contextual error in the given sentence.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">\"The    continuous rains forced the event planners to </span><span style=\"font-family:'Nirmala UI'\"><b>put    out</b></span><span style=\"font-family:'Nirmala UI'\"> the annual    cultural festival until late October.\"</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">put off</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">put up</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">put down</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">put across</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>Option    A (put off)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    sentence implies delaying or rescheduling the annual cultural    festival to a later date (\"until late October\") due to    continuous rains.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Put     off:</b></span><span style=\"font-family:'Nirmala UI'\"> Means     to </span><span style=\"font-family:'Nirmala UI'\"><b>postpone</b></span><span style=\"font-family:'Nirmala UI'\"> an     event or activity to a later time. </span><span style=\"font-family:'Nirmala UI'\"><i>(Contextually     Correct)</i></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Put     out:</b></span><span style=\"font-family:'Nirmala UI'\"> Means to     extinguish (e.g., a fire) or cause inconvenience.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Put     up:</b></span><span style=\"font-family:'Nirmala UI'\"> Means to     build/erect something or provide accommodation.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Put     across:</b></span><span style=\"font-family:'Nirmala UI'\"> Means to     communicate or express an idea clearly.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Therefore, </span><span style=\"font-family:'Nirmala UI'\"><b>\"put    off\"</b></span><span style=\"font-family:'Nirmala UI'\"> is the    correct phrasal verb to rectify the contextual error.</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the most appropriate option    to fill in the blank:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">'The    committee members were divided ________ their opinions regarding    the new policy.'</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">within</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">among</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">in</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">with</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct answer: </span><span style=\"font-family:'Nirmala UI'\"><b>Option    C (in)</b></span><span style=\"font-family:'Nirmala UI'\"> <br> Explanation:<br> When    the verb 'divided' is used to express a difference or disagreement    regarding thoughts, views, or beliefs, it is followed by the    preposition '</span><span style=\"font-family:'Nirmala UI'\"><b>in</b></span><span style=\"font-family:'Nirmala UI'\">'. <br> <br> Example:    \"The jury were divided in their opinions.\"<br> <br> Conversely,    'divided among' is used when distributing or sharing physical    things among three or more people (e.g., \"The property was    divided among the brothers\"). Since the sentence refers to    'opinions', '</span><span style=\"font-family:'Nirmala UI'\"><b>in</b></span><span style=\"font-family:'Nirmala UI'\">'    is the most appropriate fit.</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the option that correctly    states the meaning of the given idiom.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">\"To    back the wrong horse\"</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To lose a significant amount of    money at a local racetrack due to poor weather.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To support or invest in a person,    plan, or political candidate that ultimately fails.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To purchase an old, inefficient    vehicle for commercial logistics work.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To change your moral stance right    before a critical public debate.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n <p s p, and then adding a multiple of 7 that increases by 7 at    each step:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">40     × 0.5 + 7 = 20 + 7 = 27</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">27     × 1.0 + 14 = 27 + 14 = 41</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">41     × 1.5 + 21 = 61.5 + 21 = 82.5</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">82.5     × 2.0 + 28 = 165 + 28 = 193</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">193     × 2.5 + 35 = 482.5 + 35 = </span><span style=\"font-family:'Nirmala UI'\"><b>517.5</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The following equation is    incorrect. Which two signs should be interchanged to correct the    equation? </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">20    ÷ 8 + 4 × 3 – 5 = 21 </span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">+ and ×</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">× and ÷</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">+ and ÷</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    − <span style=\"font-family:'Nirmala UI'\">and ÷</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">We check each option one by one    using the </span><span style=\"font-family:'Nirmala UI'\"><b>BODMAS</b></span><span style=\"font-family:'Nirmala UI'\"> rule.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A.     (+ and ×) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     20 ÷ 8 × 4 + 3 − 5 = 8 (not 21)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">B.     (× and ÷) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     20 × 8 + 4 ÷ 3 − 5 = not 21</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">C.     (+ and ÷) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     20 + 8 ÷ 4 × 3 − 5 =20 + 6 − 5 = 21</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    Option C is correct. (No need to check Option D.)</b></span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the word-pair that best    represents a similar relationship to the one expressed in the pair    of words given below. </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(The    words must be considered as meaningful English words and must NOT    be related to each other based on the number of letters/number of    consonants/vowels in the word) </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Italy    : Tiber</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">France : Mekong </span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Russia : Volga</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Brazil : Thames</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Japan : Rhine</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Relationship </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    Country : Major River flowing through that country. </b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Mekong</b></span><span style=\"font-family:'Nirmala UI'\"> flows     through </span><span style=\"font-family:'Nirmala UI'\"><b>Southeast     Asia</b></span><span style=\"font-family:'Nirmala UI'\">, not France. </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Volga</b></span><span style=\"font-family:'Nirmala UI'\"> is     the longest and a major river of </span><span style=\"font-family:'Nirmala UI'\"><b>Russia</b></span><span style=\"font-family:'Nirmala UI'\">. </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Thames</b></span><span style=\"font-family:'Nirmala UI'\"> flows     in </span><span style=\"font-family:'Nirmala UI'\"><b>England</b></span><span style=\"font-family:'Nirmala UI'\">. </span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Rhine</b></span><span style=\"font-family:'Nirmala UI'\"> flows     through </span><span style=\"font-family:'Nirmala UI'\"><b>Europe,</b></span><span style=\"font-family:'Nirmala UI'\"> not     Japan.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Directions: Study the following    information carefully and answer the question. </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">P    ÷ Q means P is the son of Q, </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">P    × Q means P is the sister of Q, </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">P    + Q means P is the brother of Q</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">P    − Q means P is the father of Q. </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">How    is A related to D in the expression A × B − C + D ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Aunt</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sister</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mother </span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Grandmother</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>A × B</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    A is the </span><span style=\"font-family:'Nirmala UI'\"><b>sister</b></span><span style=\"font-family:'Nirmala UI'\"> of    B.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>B − C</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    B is the </span><span style=\"font-family:'Nirmala UI'\"><b>father</b></span><span style=\"font-family:'Nirmala UI'\"> of    C.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>C + D</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    C is the </span><span style=\"font-family:'Nirmala UI'\"><b>brother</b></span><span style=\"font-family:'Nirmala UI'\"> of    D.<br> Since C is the brother of D, </span><span style=\"font-family:'Nirmala UI'\"><b>C    and D are siblings</b></span><span style=\"font-family:'Nirmala UI'\">, and    their father is </span><span style=\"font-family:'Nirmala UI'\"><b>B</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">So:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">B     is the father of C. Therefore, B is also the father of D. A is     the sister of B.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>A    is the sister of D's father</b></span><span style=\"font-family:'Nirmala UI'\">,    i.e., </span><span style=\"font-family:'Nirmala UI'\"><b>A is D's    paternal aunt (father's sister).</b></span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The series given below contains a    sequence of numbers. Accordingly identify the incorrect    combination. </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">4,    8, 24, 28, 86, 88, 264 </span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">24, 88 </span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">86, 88</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">28, 86</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">88, 264</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Observe the operations:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">4     + 4 = 8 </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">8     × 3 = 24</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">24     + 4 = 28</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">28     × 3 = </span><span style=\"font-family:'Nirmala UI'\"><b>84, but the     series has 86</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">If    it were 84, then:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">84     + 4 = 88 </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">88     × 3 = 264</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">So    the correct series should be:<br> </span><span style=\"font-family:'Nirmala UI'\"><b>4,    8, 24, 28, 84, 88, 264</b></span><span style=\"font-family:'Nirmala UI'\"><br> </span><span style=\"font-family:'Nirmala UI'\"><b>Hence,    86 is the incorrect number.</b></span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Read the following statement    carefully and identify which course(s) of action should follow.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Statement    : A corporate organization observes that several employees i
