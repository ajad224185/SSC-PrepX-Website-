<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>32.) SSC CGL PTS  MOCK 16 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

/span>(<span style=\"font-family:'Nirmala UI'\"><span><b>सामान्य     ह्रास दर</b> के रूप में जाना     जाता है</span></span>)<span style=\"font-family:'Nirmala UI'\"><span>।</span></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>क्षोभसीमा</b><b> </b></span></span><span>(</span><span style=\"font-family:'Nirmala UI'\"><span>वह     संकीर्ण संक्रमणकालीन सीमा     क्षेत्र है जो सबसे निचली     वायुमंडलीय परत </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>क्षोभमंडल</span></span>)     <span style=\"font-family:'Nirmala UI'\"><span>को समतापमंडल     से अलग करता है।</span></span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>2.    </b></span><span style=\"font-family:'Nirmala UI'\"><span><b>समतापमंडल</b></span></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>ऊंचाई</b></span></span><b>:</b><span> </span><span style=\"font-family:'Nirmala UI'\"><span>क्षोभसीमा     से लगभग </span></span><span>50 </span><span style=\"font-family:'Nirmala UI'\"><span>किमी     तक फैला हुआ है।</span></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>मुख्य     विशेषताएं</b></span></span><b>:</b><span> </span><span style=\"font-family:'Nirmala UI'\"><span>इस     परत में <b>ओजोन परत</b> </span></span><span>(O</span><sub><span>3</span></sub><span>)     </span><span style=\"font-family:'Nirmala UI'\"><span>पाई जाती     है</span></span><span>, </span><span style=\"font-family:'Nirmala UI'\"><span>जो     सूर्य से आने वाली हानिकारक     पराबैंगनी </span></span>(<span>UV)     B </span><span style=\"font-family:'Nirmala UI'\"><span>और </span></span><span>C     </span><span style=\"font-family:'Nirmala UI'\"><span>विकिरणों     को अवशोषित करती है। यह परत     बादलों और अशांत मौसम से     लगभग मुक्त होती है</span></span><span>,     </span><span style=\"font-family:'Nirmala UI'\"><span>जो इसे     व्यावसायिक जेट विमानों को     उड़ाने के लिए आदर्श बनाती     है।</span></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>तापमान</b></span></span><b>:</b><span> </span><span style=\"font-family:'Nirmala UI'\"><span>ऊंचाई     के साथ तापमान बढ़ता है     क्योंकि ओजोन परत पराबैंगनी     विकिरण को अवशोषित करती है।</span></span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>3.    </b></span><span style=\"font-family:'Nirmala UI'\"><span><b>मध्यमंडल</b></span></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>ऊंचाई</b></span></span><b>:</b><span> 50     </span><span style=\"font-family:'Nirmala UI'\"><span>किमी से     लगभग </span></span><span>85 </span><span style=\"font-family:'Nirmala UI'\"><span>किमी     तक फैला हुआ है।</span></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>यह     वायुमंडल की <b>सबसे ठंडी     परत</b> है।</span></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>अंतरिक्ष     से प्रवेश करने वाले <b>उल्कापिंड</b><b> </b>घर्षण     के कारण इसी परत में <b>जलकर     नष्ट</b> हो जाते हैं।</span></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>तापमान</b></span></span><b>:</b><span> </span><span style=\"font-family:'Nirmala UI'\"><span>मध्यमंडल     में ऊंचाई के साथ तापमान     घटता है।</span></span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>4.    </b></span><span style=\"font-family:'Nirmala UI'\"><span><b>तापमंडल</b></span></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>ऊंचाई</b></span></span><b>:</b><span> 80     </span><span style=\"font-family:'Nirmala UI'\"><span>किमी से     लगभग </span></span><span>400 </span><span style=\"font-family:'Nirmala UI'\"><span>किमी     तक फैला हुआ है।</span></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>यह     वायुमंडल की <b>सबसे गर्म</b> परत     है।</span></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>इसमें <b>आयनमंडल</b><b> </b>शामिल     है</span></span><span>, </span><span style=\"font-family:'Nirmala UI'\"><span>जो     विद्युत आवेशित कणों </span></span>(<span style=\"font-family:'Nirmala UI'\"><span>आयनों</span></span>)     <span style=\"font-family:'Nirmala UI'\"><span>से समृद्ध     क्षेत्र है। यह क्षेत्र     रेडियो तरंगों को वापस पृथ्वी     पर परावर्तित करता है</span></span><span>,     </span><span style=\"font-family:'Nirmala UI'\"><span>जिससे<b> </b><b>वायरलेस     रेडियो संचार</b> सक्षम होता     है। अंतर्राष्ट्रीय अंतरिक्ष     स्टेशन </span></span>(<span>ISS) </span><span style=\"font-family:'Nirmala UI'\"><span>इसी     परत में परिक्रमा करता है</span></span><span>,     </span><span style=\"font-family:'Nirmala UI'\"><span>और     शानदार <b>ध्रुवीय ज्योति</b> इसी     परत में दिखाई देती हैं।</span></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>तापमान</b></span></span><b>:</b><span> </span><span style=\"font-family:'Nirmala UI'\"><span>तीव्र     सौर विकिरण के अवशोषण के     कारण ऊंचाई बढ़ने के साथ     तापमान बढ़ता है।</span></span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>5.    </b></span><span style=\"font-family:'Nirmala UI'\"><span><b>बाह्यमंडल</b></span></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>ऊंचाई</b></span></span><b>:</b>   <span style=\"font-family:'Nirmala UI'\"><span>का वर्णन     करता है। भारत एक <b>धर्मनिरपेक्ष</b><b> </b>राज्य     है</span></span><span>, </span><span style=\"font-family:'Nirmala UI'\"><span>जिसका     अर्थ है कि इसका कोई आधिकारिक     राजकीय धर्म नहीं है और यह     सभी धर्मों के साथ समान     व्यवहार करता है।</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>विकल्प     </b></span></span><span><b>B </b></span><span style=\"font-family:'Nirmala UI'\"><span><b>गलत     है</b></span></span><b>:</b><span> </span><span style=\"font-family:'Nirmala UI'\"><span>यह     एक <b>राजतंत्र</b><b> </b></span></span><span>(</span><span style=\"font-family:'Nirmala UI'\"><span>जैसे     ब्रिटिश प्रणाली</span></span>) <span style=\"font-family:'Nirmala UI'\"><span>का     वर्णन करता है</span></span><span>,     </span><span style=\"font-family:'Nirmala UI'\"><span>जो गणराज्य     के बिल्कुल विपरीत है।</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>विकल्प     </b></span></span><span><b>D </b></span><span style=\"font-family:'Nirmala UI'\"><span><b>गलत     है</b></span></span><b>:</b><span> </span><span style=\"font-family:'Nirmala UI'\"><span>यह     एक निरंकुशता या पूर्ण     तानाशाही का वर्णन करता है।     भारत में</span></span><span>, </span><span style=\"font-family:'Nirmala UI'\"><span>संविधान     सर्वोच्च है </span></span>(<span style=\"font-family:'Nirmala UI'\"><span><b>संविधान     की सर्वोच्चता</b></span></span><b>)</b><span>,     </span><span style=\"font-family:'Nirmala UI'\"><span>और     न्यायपालिका के पास कार्यपालिका     या विधायिका द्वारा की गई     किसी भी असंवैधानिक कार्रवाई     पर सवाल उठाने और उसकी जांच     करने के लिए न्यायिक समीक्षा     की शक्ति है।</span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>भारतीय    संविधान के संदर्भ में</s <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     sentence suggests that the philosopher's ideas </span><span><b>challenged     conventional understanding of time and existence</b></span><span>,     so </span><span><b>recondite</b></span><span> fits     the context perfectly.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Pedestrian</b></span><span> means     ordinary or unimaginative.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Literal</b></span><span> means     taking words in their exact meaning.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Didactic</b></span><span> means     intended to teach, often in a moralizing way.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Correct    Sentence:</b></span></p>    <p style=\"orphans:0;widows:0\"><span><b>The    philosopher's ideas were so recondite that they challenged    conventional understanding of time and existence.</b></span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Select the most appropriate option to fill in    the blank.</span></p>    <p style=\"orphans:0;widows:0\"><span>Far from being    ______, the critic's review was a trenchant dismantling of the    author's thesis.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>laudatory</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>censorious</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>scathing</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>vitriolic</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>Logic — 'Far from being X'</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Review    was a dismantling (negative) </span><span><span>→</span></span><span>    it was far from being positive/praising.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Option    Analysis</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(a)    Laudatory — Praising. 'Far from laudatory' = critical. CORRECT.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(b)    Censorious — Critical/harsh. 'Far from critical' would mean    praising — contradicts 'dismantling.' ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(c)    Scathing — Already harsh; 'far from scathing' would mean mild —    wrong. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0\"><span>(d) Vitriolic    — Bitterly harsh; same problem as (c). ELIMINATE.</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"orphans:0;widows:0\">    <span><b>Spot the correct spelling of a 24-hour    biological cycle.</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Circadion</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Circadian</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Circadien</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Circadijan</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>The correct answer is 'Option 2'.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Circadian</b></span><span> is     the correct spelling of the </span><span><b>24-hour     biological cycle</b></span><span> that     regulates sleep, wakefulness, hormone release, body temperature,     and other physiological processes.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     term comes from the Latin words </span><span><b>circa</b></span><span> (\"about\")     and </span><span><b>diem</b></span><span> (\"day\"),     meaning </span><span><b>\"about a day.\"</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>The other     options are incorrect spellings.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the most appropriate synonym of the    given word: </span><span><b>CAPITULATE</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Defend</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Attack</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Resist</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Surrender</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>The correct answer is 'Option 4'.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Capitulate</b></span><span> means </span><span><b>to     surrender or stop resisting an opponent; to yield under pressure</b></span><span>.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Therefore, </span><span><b>Surrender</b></span><span> is     the correct synonym.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span><b>Defend</b></span><span>, </span><span><b>Attack</b></span><span>,     and </span><span><b>Resist</b></span><span> are     antonyms or unrelated in this context.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the most appropriate SYNONYM of the word    given:  INEFFABLE</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Inexpressible</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Articulable</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Vociferous</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Prosaic</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>Option Analysis</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(a)    Inexpressible — too great to be expressed in words.CORRECT.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(b)    Articulable — Opposite. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(c)    Vociferous — Loud. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0\"><span>(d) Prosaic —    Dull. ELIMINATE.</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Select the option that can be used as a    one-word substitute for the given group of words:</span></p>    <p style=\"orphans:0;widows:0\"><span>A government    by the few</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Democracy</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Oligarchy</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Plutocracy</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Theocracy</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>-Cracy Roots</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Oligos    (few) + arcy = oligarchy.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Demo    (people) = democracy.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Pluto    (wealth) = plutocracy.</span></p>    <p style=\"orphans:0;widows:0\"><span>(b) CORRECT.</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Select the option that can be used as a    one-word substitute for the given group of words:</span></p>    <p style=\"orphans:0;widows:0\"><span>One who eats    human flesh</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Carnivore</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Cannibal</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Herbivore</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Omnivore</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>Distinction</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Carnivore    = flesh-eater (animals).</span></p>    <p style=\"orphans:0;widows:0\"><span>Cannibal =    human flesh eater.</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"orphans:0;widows:0\">    <span>Find the most appropriate meaning of the idiom:    ‘To cut the Gordian knot’</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>To complicate a problem</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>To solve a difficult problem boldly and    directly</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>To avoid a decision</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>To tie up loose ends</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Origin:</span></p>    <p style=\"orphans:0;widows:0\"><span>Alexander the    Great cut the intricate Gordian knot with his sword — </span><span><b>solving    an 'impossible' problem by decisive action.</b></span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Find the most appropriate meaning of the idiom:</span></p>    <p style=\"orphans:0;widows:0\"> <span>'To give    someone the benefit of the doubt'</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>To believe them innocent/truthful despite    uncertainty</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>To punish despite lack of evidence</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>To grant a loan</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>To challenge their credibility publicly</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>(a) CORRECT — assume favourable    interpretation when evidence is ambiguous.</span></p>    <p style=\"orphans:0;widows:0\"><span>(b), (c), (d)    — fabricated or opposite meanings.</span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Identify the correct meaning of the underlined    idiom:</span></p>    <p style=\"orphans:0;widows:0\"><span>'The forensic    report </span><span><u>put the nail in the    coffin</u></span><span> of the defence's alibi.'</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>revived</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>sealed the final destruction of</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>gently questioned</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>provided the foundation for</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>'Put the nail in the coffin' = final blow that    destroys an already failing cause.</span></p>    <p style=\"orphans:0;widows:0\"><span>(b) CORRECT.    Others opposite or irrelevant.</span></p>", "question_heading": ""}, {"sr_no": 90, "question": "Sधnपधncधौ यी ो ूोनोgनोूु ोनध giॅधn ृिधयथ in ुहंृिधक यनकधन. Aननोngध पुध ौधnपधncधौ in पुध cयननधcप यनकधन पय ीयनं ो ंधोningीिह ोnक cयुधनधnप ूोनोgनोूु: P. Sहcु ीनोgंधnपोपiयn, in पहनn, धनयकधौ पुध धूiौपधंic ोहपुयनiपद यी ौciधnपiीic cयnौधnौहौ. Q. Tुध कधंयcनोपiौोपiयn यी inीयनंोपiयn ुोौ ूोनोकयसicोििद थधोाधnधक ूहृिic पनहौप in धसूधनपiौध. R. Ciपप्रधnौ inहnकोपधक थiपु cयnपनोकicपयनद cिोiंौ ौपनहggिध पय कiौपingहiौु नigयहन ीनयं ूनयूोgोnको. S. Tुध ूनियiीधनोपiयn यी ूनधकोपयनद ुयहनnोिस ुोौ ीहनपुधन ंहककiधक पुध थोपधनौ. T. Yधप ंोinौपनधों inौपiपहपiयnौ ुोॅध nयप ोककनधौौधक पुध हnकधिनदing ूधकोgयgicोि कधीiciप.", "option1": "<p style=\"orphans:0;widows:0\">    <span>Q-R-P-S-T</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Q-R-S-P-T</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>S-Q-R-P-T</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>R-Q-S-P-T</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Q — Opening (broad claim, no backward    reference).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>R    — Elaborates Q (citizens' struggle).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>P    — 'Such fragmentation' refers to confused information landscape    in R.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>S    — 'Further muddied' adds predatory journals layer.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>T    — 'Yet' contrasts — institutions failed. Strong closer.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Sequence:    Q-R-P-S-T. But check (a) vs (b):</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(a)    Q-R-P-S-T — fragmentation then journals muddy further —    logical.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(b)    Q-R-S-P-T — 'such fragmentation' before establishing    fragmentation in P — S doesn't establish fragmentation as    clearly. (a) better.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Elimination</b></span></p>    <p style=\"orphans:0;widows:0\"><span>(c), (d) —    wrong openings. Answer: (a) Q-R-P-S-T.</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>Given below are four jumbled sentences.    Select the option that gives their correct order.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>A.    Here, the picture-perfect French Quarter and heritage laden Tamil    streets blend into one another.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>B.    Across many metropolitan cities, there exists a visible conflict    in how the old and the new coexist.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>C.    The old and new, like two different worlds, surviving side by side    yet never crossing that chasm.</b></span></p>    <p style=\"orphans:0;widows:0\"><span><b>D. However,    Puducherry stands as a striking exception, where these very    contrasts are celebrated rather than endured.</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>BCDA</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>ABCD</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>DABC</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>BACD</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>The correct answer is 'Option 1'.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>B</b></span><span> introduces     the general idea that many metropolitan cities face a conflict     between the old and the new.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>C</b></span><span> elaborates     on this conflict by describing the old and new as existing side     by side without truly blending.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>D</b></span><span> introduces     the contrast with </span><span><b>\"However,\"</b></span><span> stating     that </span><span><b>Puducherry</b></span><span> is     an exception.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span><b>A</b></span><span> must     follow </span><span><b>D</b></span><span> because </span><span><b>\"Here\"</b></span><span> clearly     refers to </span><span><b>Puducherry</b></span><span>,     explaining how its French Quarter and Tamil streets blend     harmoniously.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"orphans:0;widows:0\">    <span>Choose the correctly spelt word from the given    options:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Acquiescence</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Aqquiescence</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Acquiesence</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Acquiescense</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>Spelling Rule</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Acquiesce    + -ence = Acquiescence (acqui-esce-ence).</span></p>    <p style=\"orphans:0;widows:0\"><span>(a) CORRECT.    (b) double q wrong. (c) missing c. (d) wrong ending.</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Select the option that expresses the given    sentence in the Active/Passive voice.</span></p>    <p style=\"orphans:0;widows:0\"> <span>'The    appellate court might have overturned the lower court's ruling.'</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>The lower court's ruling might be overturned by    the appellate court.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>The lower court's ruling might have been    overturned by the appellate court.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>The lower court's ruling may have been    overturned by the appellate court.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>The lower court's ruling might had been    overturned by the appellate court.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>Rule — Modal Perfect Passive</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Active:    might have + V3 </span><span><span>→</span></span><span>    Passive: might have been + V3</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Option    Analysis</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(a)    Simple modal passive — wrong tense. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(b)    might have been overturned — CORRECT.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(c)    Changes 'might' to 'may' — modal must not change. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0\"><span>(d) 'might had    been' — impossible construction. ELIMINATE.</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>Choose the correct direct speech form of the    following sentence.</b></span></p>    <p style=\"orphans:0;widows:0\"><span><b>They    requested the officer to permit them to go on leave for three    days.</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>They said to the officer, \"Please permit    us going on leave by three days.\"</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>They said to the officer, \"Please permit    us to go on leave for three days.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>They said to the officer, \"Please permit    them to goes on leave for three days.\"</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>They said to the officer, \"Request to    permit us to go on leave for three days.\"</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>The correct answer is 'Option 2'.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     reporting verb </span><span><b>\"requested\"</b></span><span> changes     to the polite request </span><span><b>\"Please...\"</b></span><span> in     direct speech.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>After </span><span><b>permit</b></span><span>,     the correct structure is </span><span><b>permit     + object + to + verb</b></span><span>.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     phrase </span><span><b>\"for three     days\"</b></span><span> correctly expresses     the duration of leave.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>The other     options contain grammatical errors such as </span><span><b>\"permit     us going,\" \"them to goes,\"</b></span><span> and </span><span><b>“Request     to permit.”</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Select the correct indirect/direct form of the    given sentence.</span></p>    <p style=\"orphans:0;widows:0\"> <span>She    said, \"The train leaves at six tomorrow.\"</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>She said that the train left at six the next    day.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>She said that the train leaves at six tomorrow.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>She said that the train would leave at six the    next day.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>She said that the train had left at six the    next day.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>Rule — Universal Truth / Timetable</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>For    scheduled timetables, present can remain OR shift to 'would' with    time change.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Tomorrow    </span><span><span>→</span></span><span>    the next day.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(c)    would leave at six the next day — standard SSC answer. CORRECT.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(a)    'left' implies past departure. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(b)    no backshift of 'tomorrow.' ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0\"><span>(d) past    perfect — wrong.</span></p>", "question_heading": ""}, {"sr_no": 96, "question": "Tुध धूiौपधंic cनiौiौ in ंयकधनn कधंयcनोciधौ cोnnयप ृध नधकहcधक पय ंधनध ैीोाध nधथौैे iप नधीिधcपौ ो कधधूधन (1)______ ृधपथधधn inौपiपहपiयnोि धसूधनपiौध ोnक ूयूिहiौप ौहौूiciयn. Wुधn ciपप्रधnौ (2)______ cयंूिधस ूियicद धॅiकधncध थiपु ूोनपiौोn ोnधcकयपधौ यी धतहोि नुधपयनicोि ीयनcध, किधiृधनोपiॅध कधंयcनोcद ौहीीधनौ. Mधकiो िiपधनोcद ूनयgनोंंधौ यीीधन ो (3)______ नोपुधन पुोn ो cहनध, दधप पुधद नधंोin हnकधनीहnकधक. Scुियोनौ थोनn पुोप थiपुयहप नधौपयनing पनहौप in (4)______ ूनयcधौौधौ — ूधधन नधॅiधथ, ोहकiप, cनयौौ-धसोंinोपiयn — ूहृिic कiौcयहनौध थiिि gनयथ incनधोौingिद (5)______ पय कधंोgयgic ौiंूिiीicोपiयn. Sिधधcप पुध यूपiयn पुोप ीiििस ृिोnा (1)", "option1": "<p style=\"orphans:0;widows:0\">    <span>concord</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>rupture</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>synthesis</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>corroboration</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>Cloze Strategy</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Read    the whole sentence: crisis reflects a deeper ___ between expertise    and suspicion — implies conflict/break.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Option    Analysis</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(a)    Concord — Means agreement/harmony. Opposite of crisis between    opposing forces. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(b)    Rupture — Means break, breach, split. Fits 'between expertise    and suspicion.' CORRECT.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(c)    Synthesis — Means combining into whole. Would suggest merging,    not crisis. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0\"><span>(d)    Corroboration — Means confirmation of evidence. Wrong    collocation with 'between.' ELIMINATE.</span></p>", "question_heading": ""}, {"sr_no": 97, "question": "Tुध धूiौपधंic cनiौiौ in ंयकधनn कधंयcनोciधौ cोnnयप ृध नधकहcधक पय ंधनध ैीोाध nधथौैे iप नधीिधcपौ ो कधधूधन (1)______ ृधपथधधn inौपiपहपiयnोि धसूधनपiौध ोnक ूयूिहiौप ौहौूiciयn. Wुधn ciपप्रधnौ (2)______ cयंूिधस ूियicद धॅiकधncध थiपु ूोनपiौोn ोnधcकयपधौ यी धतहोि नुधपयनicोि ीयनcध, किधiृधनोपiॅध कधंयcनोcद ौहीीधनौ. Mधकiो िiपधनोcद ूनयgनोंंधौ यीीधन ो (3)______ नोपुधन पुोn ो cहनध, दधप पुधद नधंोin हnकधनीहnकधक. Scुियोनौ थोनn पुोप थiपुयहप नधौपयनing पनहौप in (4)______ ूनयcधौौधौ — ूधधन नधॅiधथ, ोहकiप, cनयौौ-धसोंinोपiयn — ूहृिic कiौcयहनौध थiिि gनयथ incनधोौingिद (5)______ पय कधंोgयgi let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
