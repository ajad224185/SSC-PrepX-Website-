<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>22.) SSC CGL PTS  MOCK 11 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

uring the speed of the wind, or of any     current of gas.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">micrometer-     a gauge that measures small distances or thicknesses between its     two faces, one of which can be moved away from or towards the     other by turning a screw with a fine thread.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">manometer-     an instrument for measuring the pressure acting on a column of     fluid, consisting of a U-shaped tube of liquid in which a     difference in the pressures acting in the two of the tube.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Hence,     Option D the correct answer.</p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, a sentence has been given in    Active/Passive Voice. Out of the four alternatives suggested,    select the one which best expresses the same sentence in    Passive/Active Voice.</p>        <p style=\"orphans:0;widows:0;margin-bottom:0in\">Do not    disturb me.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Let me be disturbed not.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Let me not disturbed.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Let me not be disturbed.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Let I not be disturbed.</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Structure:     This is an imperative sentence, so it is changed by starting with     \"Let,\" followed by the object (\"me\"), \"not     be,\" and the past participle of the verb (\"disturbed\").</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Hence,     Option C is the correct answer.</p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, out of the four alternatives, choose    the alternative which best expresses the meaning of the    idiom/Phrase.</p>        <p style=\"orphans:0;widows:0\">A gentleman at large</p>", "option1": "<p style=\"orphans:0;widows:0\">    a man in the crowd</p>", "option2": " <p style=\"orphans:0;widows:0\">    a man without a job</p>", "option3": " <p style=\"orphans:0;widows:0\">    a man who runs around</p>", "option4": " <p style=\"orphans:0;widows:0\">    a man who is generous</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">A     \"gentleman at large\" is an idiom describing a man who     has no serious occupation, fixed employment, or professional     obligations.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Hence,     Option B is the correct answer.</p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>In the following question, the 1st and the last    part of the sentence/passage are numbered 1 and 6. The rest of the    sentence/passage is split into four parts and named P, Q, R and S.    These four parts are not given in their proper order. Read the    sentence/passage and find out which of the four combinations is    correct</span></p>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>1.    I got on a colourful bus filled with all kinds of strange people.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>P.    We arrived at a gate like the one in Salvador Dali's paintings.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Q.    The bus rode across the dirty expanses without roads.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>R.    At first, I wasn't aware that the bus roof was loaded with drugs.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>S.    Everyone was filled with dust and often the wheels would sink into    the soft soil.</span></p>    <p style=\"orphans:0;widows:0\"><span>6. It was a    gate neither separated nor connected anything from or to anything.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>QRSP</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>SPQR</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>RQSP</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>RSPQ</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>As     the statement Q is explaining further about the bus so it will     come after 1 and will be the first sentence.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>As     the statement R starts with 'at first\" is will come after Q.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Statement     P will be the last sentence as it tells about the reaching at the     destination.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>So     we need to keep the part S before P.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Now     the final arrangement will be QRSP so it will be correct.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, some part of the sentence may have    errors. Find out which part of the sentence has an error and    select the appropriate option. If a sentence is free from error,    select 'No Error'.</p>        <p style=\"orphans:0;widows:0\">When Albert stayed at the African    jungle widows:0\">His need for affection (A)/ stem    from his (B)/ father's long absence. (C)/ No Error (D)</p>", "option1": "<p style=\"orphans:0;widows:0\">    His need for affection</p>", "option2": " <p style=\"orphans:0;widows:0\">    stem from his</p>", "option3": " <p style=\"orphans:0;widows:0\">    father's long absence.</p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    No error</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">The     correct answer is option B i.e. stem from his.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">The     error lies in part B of the statement because of the wrong use of     the Verb.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">We need     to replace \"stem\" with \"stems\" for making the     statement grammatically correct.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">As the     subject \"his need\" is singular we need to use a     singular verb.Subject singular- Singular verb. Plural subject-     plural verb.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Hence,     Option B is the correct answer.</p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Fill in the blank with most appropriate options. Four alternatives    are suggested for the question. Choose the correct alternative out    of the four and indicate it by selecting the appropriate option.</p>        <p style=\"orphans:0;widows:0\">The traditional way of saying    that you feel fine is to say that you are _______.</p>", "option1": "<p style=\"orphans:0;widows:0\">    alright</p>", "option2": " <p style=\"orphans:0;widows:0\">    all correct</p>", "option3": " <p style=\"orphans:0;widows:0\">    all good</p>", "option4": " <p style=\"orphans:0;widows:0\">    all right</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     correct answer is option 4 i.e. all right.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">All     right- of satisfactory or acceptable quality.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     chosen option is the correct use of the phrase to say all is     good.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>All     right</b> is the traditional and standard expression     meaning <b>fine, well, or satisfactory</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Alright</b> is     an informal variant of <b>all right</b>.</p>     </li><li><p style=\"orphans:0;widows:0\">Hence, Option D is the     correct answer.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The following sentence has been divided into four parts. Identify    the part which contains a grammatical error. If there is no error    in the sentence, then select 'No Error</p>        <p style=\"orphans:0;widows:0\">The whole family (A)/ would burst    into (B)/ peas for laughter (C)/ No Error (D)</p>", "option1": "<p style=\"orphans:0;widows:0\">    The whole family</p>", "option2": " <p style=\"orphans:0;widows:0\">    would burst into</p>", "option3": " <p style=\"orphans:0;widows:0\">    peas for laughter</p>", "option4": " <p style=\"orphans:0;widows:0\">    No Error</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Error     is related to / concept: Incorrect word usage</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">What is     wrong:\"peas for laughter\" is incorrect.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Grammatical     concept: Correct phrase: \"<b>peals of laughter\"</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Incorrectness     of the concept in context: \"Peas\" (a vegetable) is     wrongly used instead of \"peals\" (loud bursts of sound).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Correct     phrase/ correction: peals of laughter.</p>     </li><li><p style=\"orphans:0;widows:0\">Hence, Option C is the     correct answer.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Given below are four jumbled sentences. Select the option that    gives their correct order.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A. Here, the    picture-perfect French Quarter and heritage laden Tamil streets    blend into one another.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B. Across    many metropolitan cities, there exists a visible conflict in how    the old and the new coexist.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C. The old    and new, like two different worlds, surviving side by side yet    never crossing that chasm.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">D. However,    Puducherry stands at a striking exception, where these very    contrasts are celebrated rather than endured.</p>", "option1": "<p style=\"orphans:0;widows:0\">    BACD</p>", "option2": " <p style=\"orphans:0;widows:0\">    BDAC</p>", "option3": " <p style=\"orphans:0;widows:0\">    ABCD</p>", "option4": " <p style=\"orphans:0;widows:0\">    DABC</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">B     introduces the general idea conflict in cities.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">D gives     contrast <span>→</span> Puducherry as     exception.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">A     describes Puducherry.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">C     concludes with contrast imagery.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Final     Passage: Across many metropolitan cities, there exists a visible     conflict in how the old and the new coexist. However, Puducherry     stands as a striking exception, where these very contrasts are     celebrated rather endured. Here, the picture-perfect French     Quarter and heritage-laden Tamil streets blend into one another.     The old and new, like two different worlds, surviving side by     side yet never crossing that chasm.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Hence,     Option B is the correct answer.</p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, out of the four alternatives, choose    the one which can be substituted for the given words/sentence.</p>        <p style=\"orphans:0;widows:0\">Fear of Ugliness</p>", "option1": "<p style=\"orphans:0;widows:0\">    Hydrophobia</p>", "option2": " <p style=\"orphans:0;widows:0\">    Cacophobia</p>", "option3": " <p style=\"orphans:0;widows:0\">    Acrophobia</p>", "option4": " <p style=\"orphans:0;widows:0\">    Arachnophobia</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Hydrophobia,     or \"fear of water,\" is a late-stage symptom of human     rabies infection.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Cacophobia     is the intense, irrational fear or aversion to ugliness, whether     in people, objects, or environments.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Acrophobia     is an intense, irrational fear of heights.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Arachnophobia     is an intense, irrational, and often paralyzing fear of spiders     and other arachnids.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Hence,     Option B is the correct answer.</p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the correct Indirect form of the given sentence.</p>        <p style=\"orphans:0;widows:0\">\"Do you suppose you know    better than your own father?\" jeered his angry mother.</p>", "option1": "<p style=\"orphans:0;widows:0\">    His angry mother jeered and asked if you suppose you know better    than your own father.</p>", "option2": " <p style=\"orphans:0;widows:0\">    His angry mother jeered that did he suppose he knew better than    his own father.</p>", "option3": " <p style=\"orphans:0;widows:0\">    His angry mother jeered and asked whether he supposed he knew    better than his own father.</p>", "option4": " <p style=\"orphans:0;widows:0\">    His angry mother jeered and asked whether he had supposed he has    known better than his own father.</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     correct answer : His angry mother jeered and asked whether he     supposed he knew better than his own father.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Conjunction:     \"whether\" used for yes/no question.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Pronoun     change: \"you\" <span>→</span> \"he\"     Tense change: \"know\" <span>→</span>     \"knew\" (backshift) Reporting verb: \"jeered and     asked\" (captures tone).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Converted     sentence: His angry mother jeered and asked whether he supposed     he knew better than his own father.</p>     </li><li><p style=\"orphan xterous     - being skillful, clever, or quick in physical movements.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Symmetry     - the balanced, harmonious proportion.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Convolution     - mathematical operation that combines two functions to produce a     third.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Hence,     Option B is the correct answer.</p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, a sentence has been given in    Active/Passive Voice. Out of the four alternatives suggested,    select the one which best expresses the same sentence in    Passive/Active Voice.</p>        <p style=\"orphans:0;widows:0\">Who has destroyed Nagasaki?</p>", "option1": "<p style=\"orphans:0;widows:0\">    By whom Nagasaki have been destroyed ?</p>", "option2": " <p style=\"orphans:0;widows:0\">    By whom has Nagasaki been destroyed ?</p>", "option3": " <p style=\"orphans:0;widows:0\">    By whom Nagasaki had been destroyed ?</p>", "option4": " <p style=\"orphans:0;widows:0\">    By whom Nagasaki has been destroyed ?</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     correct answer is By whom has Nagasaki been destroyed?</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     structure for changing voice, active to passive or passive to     active is given below.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Active     voice- Who + has+ v3+ object + other words?</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Passive     voice- By whom + has+ object + been + v3 + other words?</p>     </li><li><p style=\"orphans:0;widows:0\">Hence, Option B is the     correct answer.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate synonym of the word Fustian.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Bombastic</p>", "option2": " <p style=\"orphans:0;widows:0\">    Rectilinear</p>", "option3": " <p style=\"orphans:0;widows:0\">    Repeal</p>", "option4": " <p style=\"orphans:0;widows:0\">    Hegemony</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Fustian     refers to pompous, pretentious, or bombastic speech or writing</p>     <ul>      <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Synonyms      -bombast, grandiloquence, claptrap, turgidity, pomposity.</p>      </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Antonyms      - plain, unaffected, straightforward, concise.</p>     </li>\n</ul>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Bombastic     -refers to speech or writing that is high-sounding, pompous, and     inflated</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Rectilinear     -moving in, consisting of, or bounded by straight lines.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Repeal -     to officially revoke, cancel, or annul a law, rule, or act by     legislative authority.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Hegemony     - the political, economic, or social dominance.</p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0\">    Choose the incorrectly spelt word.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Potpourri</p>", "option2": " <p style=\"orphans:0;widows:0\">    Predecesser</p>", "option3": " <p style=\"orphans:0;widows:0\">    Assailant</p>", "option4": " <p style=\"orphans:0;widows:0\">    Vacuum</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Potpourri     - a mixture of dried, fragrant plant materials.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Predecessor     -a person who held a position before another.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Assailant     - a person who physically or verbally attacks another person.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Vacuum -     a space devoid of matter, air, or gas, often creating a region of     extremely low pressure.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Hence,     Option B is the correct answer.</p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the following question, out of the four alternatives, choose    the alternative which best expresses the meaning of the    idiom/Phrase.</p>        <p style=\"orphans:0;widows:0\">Fall back on</p>", "option1": "<p style=\"orphans:0;widows:0\">    retreat</p>", "option2": " <p style=\"orphans:0;widows:0\">    overtaken</p>", "option3": " <p style=\"orphans:0;widows:0\">    suffer an accident</p>", "option4": " <p style=\"orphans:0;widows:0\">    resort to something</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">\"Fall     back on\" means to use or rely on something (or someone) as a     reserve, backup plan, or support after other options have failed     or are unavailable.</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Hence,     Option D is the correct answer.</p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"orphans:0;widows:0\">    Which of the following is not a correct interrogative sentence ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Where you are going?</p>", "option2": " <p style=\"orphans:0;widows:0\">    Do you like coffee?</p>", "option3": " <p style=\"orphans:0;widows:0\">    Why did he leave so early?</p>", "option4": " <p style=\"orphans:0;widows:0\">    Is she coming to the party ?</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Option     A is incorrect because it lacks proper subject-verb inversion. In     a standard English interrogative sentence, the auxiliary verb     (like are, do, or is) must come before the subject. The correct     form should be: \"Where are you going?\".</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Option B     is correct as it follows the standard structure for a \"yes/no\"     question by starting with the auxiliary verb \"Do\"     followed by the subject \"you\".</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Option C     is correct because it correctly places the auxiliary verb \"did\"     before the subject \"he\" after the \"Wh-\"     question word \"Why\".</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Option D     is correct because it begins with the auxiliary verb \"Is\"     before the subject \"she,\" which is the required     structure for forming a question with the verb \"to be\".</p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">Hence,     Option A is the correct answer.</p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"orphans:0;widows:0\">    <span>6-</span><span style=\"font-family:'Nirmala UI'\"><span>अंकीय    संख्या </span></span><span>6745k2 </span><span style=\"font-family:'Nirmala UI'\"><span>में    ‘</span></span><span>k’ </span><span style=\"font-family:'Nirmala UI'\"><span>का    अधिकतम मान ज्ञात कीजिए ताकि    यह संख्या </span></span><span>3 </span><span style=\"font-family:'Nirmala UI' let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
