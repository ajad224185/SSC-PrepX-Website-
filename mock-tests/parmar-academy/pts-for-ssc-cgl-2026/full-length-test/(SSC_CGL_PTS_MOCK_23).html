<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>45.) SSC CGL PTS  MOCK 23 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

mpliant</p>", "option3": " <p style=\"orphans:0;widows:0\">    Obdurate</p>", "option4": " <p style=\"orphans:0;widows:0\">    Benevolent</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>The correct option is C. Obdurate.</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The word     <b>\"intransigent\"</b> refers to someone who is     <b>unwilling to change their views, opinions, or behaviour</b>,     especially when faced with opposition or pressure.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>\"Obdurate\"</b>     means <b>stubbornly refusing to change one's opinion or course of     action</b>, making it the most appropriate synonym.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>\"Flexible\"</b>     means willing to change or adapt, which is opposite in meaning.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>\"Compliant\"</b>     means willing to obey or agree with others, which is also     opposite in meaning.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>\"Benevolent\"</b>     means kind, generous, and well-meaning, which is unrelated to the     given word.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate antonym of the given word.</p>    <p style=\"orphans:0;widows:0\"><b>Punctilious</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Fastidious</p>", "option2": " <p style=\"orphans:0;widows:0\">    Remiss</p>", "option3": " <p style=\"orphans:0;widows:0\">    Meticulous</p>", "option4": " <p style=\"orphans:0;widows:0\">    Scrupulous</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is B. Remiss.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Punctilious</b> means <b>very careful and attentive to     details, rules, and proper conduct</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Remiss</b>     means <b>careless, negligent, or failing to do what is required</b>,     making it the most appropriate antonym.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Fastidious</b>,     <b>meticulous</b>, and <b>scrupulous</b> all convey the idea of     being <b>careful, precise, and attentive to details</b>, so they     are synonyms of <i>punctilious</i>.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Therefore, the correct     answer is B. Remiss.</b></p>    </li></ul>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate meaning of the given idiom.</p>    <p style=\"orphans:0;widows:0\"><b>To play ducks and drakes with</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    To handle something with extreme care</p>", "option2": " <p style=\"orphans:0;widows:0\">    To squander or waste money recklessly</p>", "option3": " <p style=\"orphans:0;widows:0\">    To engage in a friendly competition</p>", "option4": " <p style=\"orphans:0;widows:0\">    To solve a dispute amicably</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is B. To squander or waste money recklessly.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in\">The     idiom <b>\"to play ducks and drakes with\"</b> means <b>to     waste or squander something recklessly</b>, especially <b>money     or resources</b>.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the most appropriate meaning of the given idiom<b>.</b></p>    <p style=\"orphans:0;widows:0\"><b>To strain at a gnat and    swallow a camel</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    To fuss over small, insignificant details while ignoring major    faults</p>", "option2": " <p style=\"orphans:0;widows:0\">    To attempt a task that is far beyond one's physical capability</p>", "option3": " <p style=\"orphans:0;widows:0\">    To show extreme generosity to strangers while neglecting one's own    family</p>", "option4": " <p style=\"orphans:0;widows:0\">    To make an irreversible decision that leads to complete failure</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is A. To fuss over small, insignificant    details while ignoring major faults.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in\">The     idiom <b>\"to strain at a gnat and swallow a camel\"</b>     means <b>to focus excessively on minor matters while overlooking     much more serious or important issues</b>.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    Select the <b>correct spelling</b> of a word meaning 'full of    energy and enthusiasm'.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Vibrrant</p>", "option2": " <p style=\"orphans:0;widows:0\">    Vibirant</p>", "option3": " <p style=\"orphans:0;widows:0\">    Vybrant</p>", "option4": " <p style=\"orphans:0;widows:0\">    Vibrant</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is D. Vibrant.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Vibrant</b> means <b>full of energy, enthusiasm, and vitality</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>\"Vibirant,\"     \"Vybrant,\" and \"Vibrrant\"</b> are incorrect     spellings.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Therefore, the correct     answer is D. Vibrant.</b></p>    </li></ul>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0\">    Select the option that can be used as a one-word substitute for    the given group of words:<b> 'An animal or creature that feeds on    blood'</b>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Graminivorous</p>", "option2": " <p style=\"orphans:0;widows:0\">    Piscivorous</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sanguivorous</p>", "option4": " <p style=\"orphans:0;widows:0\">    Frugivorous</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is C. Sanguivorous.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Sanguivorous</b> refers to an animal or creature that <b>feeds     on blood</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Graminivorous</b>     means feeding on <b>grass or grains</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Piscivorous</b>     means feeding on <b>fish</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Frugivorous</b>     means feeding mainly on <b>fruits</b>.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Therefore, the correct     answer is C. Sanguivorous.</b></p>    </li></ul>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0\">    Spot the <b>correct spelling</b> of Aristotelian well-being.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Eudaimania</p>", "option2": " <p style=\"orphans:0;widows:0\">    Eudaimonia</p>", "option3": " <p style=\"orphans:0;widows:0\">    Eudaimonnia</p>", "option4": " <p style=\"orphans:0;widows:0\">    Eudaemonia</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is B. Eudaimonia.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Eudaimonia</b> is the correct spelling of the Aristotelian     concept referring to <b>human flourishing, well-being, or living     well</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>\"Eudaimania,\"     \"Eudaimonnia,\" and \"Eudaemonia\"</b> are not     the standard spelling used for the Aristotelian concept.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Therefore, the correct     answer is B. Eudaimonia.</b></p>    </li></ul>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate option to fill in the blank</b>.</p>    <p style=\"orphans:0;widows:0\">By the time the new manager takes    charge next week, all the pending client grievances ______ by the    support team.</p>", "option1": "<p style=\"orphans:0;widows:0\">    will have been addressed</p>", "option2": " <p style=\"orphans:0;widows:0\">    will be addressing</p>", "option3": " <p style=\"orphans:0;widows:0\">    would have addressed</p>", "option4": " <p style=\"orphans:0;widows:0\">    have been addressed</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is A. will have been addressed.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     The sentence refers to an action that <b>will be completed before     a specific point in the future</b> — <i>\"by the time the     new manager takes charge next week.\"</i></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Therefore,     the <b>future perfect tense</b> is required.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Since     <b>\"all the pending client grievances\"</b> receive the     action from the support team, the <b>passive voice</b> is needed.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>\"Will     have been addressed\"</b> is the correct future perfect     passive form.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>\"Will     be addressing\"</b> is future continuous and does not     indicate completion.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>\"Would     have addressed\"</b> is incorrect because there is no     conditional/past reference requiring <i>would have</i>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>\"Have     been addressed\"</b> is present perfect and does not fit the     future time reference.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Therefore, the correct     answer is A. will have been addressed.</b></p>    </li></ul>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    Choose the correct one-word substitute for:<b> 'A government by    the few, typically for corrupt or selfish purposes'.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Democracy</p>", "option2": " <p style=\"orphans:0;widows:0\">    Oligarchy</p>", "option3": " <p style=\"orphans:0;widows:0\">    Theocracy</p>", "option4": " <p style=\"orphans:0;widows:0\">    Autocracy</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is B. Oligarchy.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Oligarchy</b> refers to a <b>government or ruling system in     which power is held by a small group of people</b>, often for     their own interests.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Democracy</b>     is a system of government in which power is exercised by the     people, directly or through elected representatives.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Theocracy</b>     is a system of government in which religious leaders or religious     principles hold political power.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Autocracy</b>     is a system of government in which <b>one person</b> holds     absolute power.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Therefore, the correct     answer is B. Oligarchy.</b></p>    </li></ul>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0\">    <b>Find the part of the sentence that contains an error:</b> If    the policy were to be implemented nationwide (1)/ it would    necessitate that every regional office (2)/ conducts a    comprehensive audit (3)/ within a period of six months. (4)/</p>", "option1": "<p style=\"orphans:0;widows:0\">    (1)</p>", "option2": " <p style=\"orphans:0;widows:0\">    (2)</p>", "option3": " <p style=\"orphans:0;widows:0\">    (3)</p>", "option4": " <p style=\"orphans:0;widows:0\">    (4)</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is C. 3.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     The error lies in <b>\"conducts\"</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     sentence uses the subjunctive construction <b>\"necessitate     that...\"</b>, which requires the <b>base form of the verb</b>     in formal English.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Therefore,     <b>\"conducts\"</b> should be replaced with <b>\"conduct\"</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     correct structure is: <b>\"it would necessitate that every     regional office conduct a comprehensive audit...\"</b></p>     </li><li><p style=\"orphans:0;widows:0\"><b>Therefore, the correct     answer is C. 3.</b></p>    </li></ul>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0\">    <b>Change the following from active to passive:</b> Has anyone    ever challenged this constitutional clause?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Has this constitutional clause ever challenged?</p>", "option2": " <p style=\"orphans:0;widows:0\">    Has this constitutional clause ever been challenged?</p>", "option3": " <p style=\"orphans:0;widows:0\">    Has this constitutional clause ever be challenged?</p>", "option4": " <p style=\"orphans:0;widows:0\">    Has this constitutional clause ever had been challenged?</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is B. Has this constitutional clause ever    been challenged?</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     The active sentence is in the <b>present perfect tense</b>: <b>\"Has     + subject + past participle...\"</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">In     passive voice, the structure becomes: <b>\"Has + object +     been + past participle...\"</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>\"This     constitutional clause\"</b> becomes the subject of the     passive sentence, while <b>\"anyone\"</b> can be omitted     because it is an indefinite agent.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Therefore,     <b>\"Has anyone ever challenged this constitutional clause?\"</b>     changes to <b>\"Has this constitutional clause ever been     challenged?\"</b></p>     </li><li><p style=\"orphans:0;widows:0\"><b>Therefore, the correct     answer is B. Has this constitutional clause ever been challenged?</b></p>    </li></ul>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    <b>Select the sentence containing the homonym of the highlighted    word:</b><br> The engineering firm prepared a detailed <b>tender</b>    for the municipal highway project.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The municipal corporation invited a fresh tender for waste    management.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The evaluation committee reviewed every bid in the tender.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Three major companies submitted their final tender before noon.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The nurse cared for the injured officer with tender devotion.</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is D. The nurse cared for the injured    officer with tender devotion.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     The highlighted word <b>\"tender\"</b> in the given     sentence means <b>a formal offer or bid submitted for a project</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">In     option D, <b>\"tender\"</b> means <b>gentle, caring, or     affectionate</b>, which is a different meaning of the same word.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Options     A, B, and C use <b>\"tender\"</b> in the same sense as     the given sentence—<b>a bid or formal offer for a project</b>.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Therefore, the correct     answer is D.</b></p>    </li></ul>", "question_heading": ""}, board two    days before.”</p>", "option2": " <p style=\"orphans:0;widows:0\">    The manager stated, \"The report is being sent to the board    two days ago.”</p>", "option3": " <p style=\"orphans:0;widows:0\">    The manager said, \"The report has been sent to the board two    days before.”</p>", "option4": " <p style=\"orphans:0;widows:0\">    The manager stated, \"The report was sent to the board two    days ago.”</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is D. The manager stated, \"The report    was sent to the board two days ago.\"</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     In indirect speech, <b>\"had been sent\"</b> is the past     perfect passive form. When converting back to direct speech, it     changes to the <b>simple past passive: \"was sent.\"</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     expression <b>\"two days before\"</b> changes to <b>\"two     days ago\"</b> in direct speech because the statement is     being presented from the speaker's original time reference.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Therefore, the correct     answer is D. The manager stated, \"The report was sent to the     board two days ago.\"</b></p>    </li></ul>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the option that expresses the given sentence in indirect    speech.</b></p>    <p style=\"orphans:0;widows:0\">She asked him, \"Did you    submit the project report on time?\"</p>", "option1": "<p style=\"orphans:0;widows:0\">    She asked him if he had submitted the project report on time.</p>", "option2": " <p style=\"orphans:0;widows:0\">    She asked him whether he submitted the project report on time.</p>", "option3": " <p style=\"orphans:0;widows:0\">    She asked him that if he had submitted the project report on time.</p>", "option4": " <p style=\"orphans:0;widows:0\">    She asked him did he submit the project report on time.</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is A. She asked him if he had submitted the    project report on time.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     The direct speech is a <b>yes/no question</b>, so <b>\"if\"</b>     or <b>\"whether\"</b> is used in indirect speech.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Since     the reporting verb <b>\"asked\"</b> is in the past tense,     <b>\"did submit\"</b> changes to <b>\"had submitted\"</b>     (past perfect).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     interrogative word order changes to <b>statement word order</b>:     <i>he had submitted</i>, not <i>had he submitted</i>.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Therefore, the correct     answer is A. She asked him if he had submitted the project report     on time.</b></p>    </li></ul>", "question_heading": ""}, {"sr_no": 24, "question": "Rधोननोngध पुध ीियियथing ौधnपधncधौ in cयननधcप यनकधन पय ंोाध ो ियgicोि ूोौौोgध: 1. Hयथधॅधन, iniपiोि पनiोिस नधॅधोिधक ौधॅधनध िiंiपोपiयnौ in ौcोिोृiिiपद हnकधन धसपनधंध ूनधौौहनध. 2. Sciधnपiौपौ ीiनौप ौदnपुधौप्रधक पुध nयॅिध ोिियद धसूधcपing iप पय नधॅियहपiयnप्रध ोधनयौूोcध ंोnहीोcपहनing. 3. Tय यॅधनcयंध पुiौ ुहनिकध, नधौधोनcुधनौ inपनयकहcधक ंicनयौcयूic cोनृयn nोnयपहृधौ inपय पुध cनदौपोििinध िोपपicध. 4. Tुiौ ौपनहcपहनोि ंयकiीicोपiयn ौहccधौौीिहिद नधinीयनcधक पुध ंोपधनiोि, धnोृिing iपौ cयंंधनciोि कधूियदंधnप.", "option1": "<p style=\"orphans:0;widows:0\">    2-1-3-4</p>", "option2": " <p style=\"orphans:0;widows:0\">    2-3-1-4</p>", "option3": " <p style=\"orphans:0;widows:0\">    1-3-2-4</p>", "option4": " <p style=\"orphans:0;widows:0\">    3-1-4-2</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is A. 2-1-3-4.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     Sentence <b>2</b> introduces the scientists' initial action: they     synthesized the novel alloy with high expectations.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence     <b>1</b> logically follows by introducing the <b>problem     discovered during initial trials</b>, signalled by <b>\"However.\"</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence     <b>3</b> presents the <b>solution to this limitation</b>,     introduced by <b>\"To overcome this hurdle.\"</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence     <b>4</b> concludes the passage by explaining the <b>successful     outcome</b> of the structural modification.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Therefore, the correct     sequence is A. 2-1-3-4.</b></p>    </li></ul>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Rearrange the following sentences in the correct order to form    a meaningful and coherent paragraph:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1.    Feedback from beta testers was gathered to fix critical software    bugs.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2. The UI    design team created wireframes for the new mobile application.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3. Once    all issues were resolved, the application was officially launched    on the app store.</b></p>    <p style=\"orphans:0;widows:0\"><b>4. Programmers then wrote the    core code according to those design wireframes.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    2-1-4-3</p>", "option2": " <p style=\"orphans:0;widows:0\">    4-2-1-3</p>", "option3": " <p style=\"orphans:0;widows:0\">    2-4-1-3</p>", "option4": " <p style=\"orphans:0;widows:0\">    1-4-2-3</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>The correct option is C. 2-4-1-3.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     Sentence <b>2</b> introduces the <b>UI design phase</b>, where     wireframes are created for the application.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence     <b>4</b> logically follows, as programmers write the <b>core code     based on those wireframes</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence     <b>1</b> comes next because <b>beta testing and feedback</b>     occur after the application has been developed.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">Sentence     <b>3</b> concludes the process, as the application is <b>officially     launched after all issues are resolved</b>.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Therefore, the correct     sequence is C. 2-4-1-3.</b></p>    </li></ul>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0\">    <b>The vibrant colors and primary nutrient source of healthy coral    reefs are due to a mutualistic symbiotic relationship with    microscopic algae known as:</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Cyanobacteria</p>", "option2": " <p style=\"orphans:0;widows:0\">    Zooxanthellae</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sargassum</p>", "option4": " <p style=\"orphans:0;widows:0\">    Diatoms</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Corals share a mutualistic symbiotic relationship with microscopic    algae called Zooxanthellae. These algae reside within the tissues    of the coral polyps, supplying them with essential organic    nutrients produced through photosynthesis and giving corals their    bright colors. When ocean temperatures rise significantly, corals    expel the zooxanthellae, resulting in coral bleaching.</p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0\">    <b>What primary factor leads to the formation of 'Dead Zones'    (hypoxic areas) in aquatic ecosystems such as seas and lakes?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Excessive nutrient runoff leading to algal blooms and subsequent    oxygen depletion</p>", "option2": " <p style=\"orphans:0;widows:0\">    Depletion of the ozone layer causing increased ultraviolet    radiation</p>", "option3": " <p style=\"orphans:0;widows:0\">    Excessive deposition of heavy metals on the lake bed</p>", "option4": " <p style=\"orphans:0;widows:0\">    Rapid rise in sea levels due to melting glaciers</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Dead zones (hypoxic zones) in aquatic environments are primarily    caused by eutrophication, which occurs when excessive nutrients    (mainly nitrogen and phosphorus from fertilizers and sewage) enter    water bodies. This triggers rapid growth of algae (algal blooms).    When these algae die and decompose, oxygen-consuming bacteria    deplete the dissolved oxygen in the water, making it difficult for    aquatic organisms to survive.</p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0\">    <b>In Indian temple architecture, what does the term \"Garbhagriha\"    refer to?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    The main entrance gateway</p>", "option2": " <p style=\"orphans:0;widows:0\">    The innermost chamber housing the main deity</p>", "option3": " <p style=\"orphans:0;widows:0\">    The pillared assembly hall</p>", "option4": " <p style=\"orphans:0;widows:0\">    The sacred water reservoir</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In Indian temple architecture, the Garbhagriha (sanctum sanctorum)    is the innermost sanctuary or chamber of a temple where the main    deity's idol is installed.</p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0\">    <b>Which is the largest monastery in India (and the second-largest    in the world), located in Arunachal Pradesh and associated with    the Gelug school of Vajrayana Buddhism?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Hemis Monastery</p>", "option2": " <p style=\"orphans:0;widows:0\">    Diskit Monastery</p>", "option3": " <p style=\"orphans:0;widows:0\">    Tawang Monastery</p>", "option4": " <p style=\"orphans:0;widows:0\">    Namdroling Monastery</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Tawang Monastery, located in the Tawang district of Arunachal    Pradesh, is the largest monastery in India and the second-largest    in the world after the Potala Palace in Lhasa, Tibet. It was    founded by Merak Lama Lodre Gyatso in 1680–1681 and belongs to    the Gelugpa (Yellow Hat) sect of Tibetan Buddhism.</p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0\">    <span><b>Which NASA mission, launched in early 2026,    marked humanity's first crewed flight test around the Moon since    Apollo 17 in 1972?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    Artemis I</p>", "option2": " <p style=\"orphans:0;widows:0\">    Artemis II</p>", "option3": " <p style=\"orphans:0;widows:0\">    Lunar Trailblazer</p>", "option4": " <p style=\"orphans:0;widows:0\">    VIPER Moon Express</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    NASA's Artemis II mission carried a crew of four astronauts on a    lunar flyby aboard the Orion spacecraft, establishing the first    crewed lunar mission of the 21st century.</p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following Indian states was the first to accept    the Subsidiary Alliance system introduced by Lord Wellesley in    1798?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Awadh</p>", "option2": " <p style=\"orphans:0;widows:0\">    Hyderabad</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mysore</p>", "option4": " <p style=\"orphans:0;widows:0\">    Tanjore</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Nizam of Hyderabad was the first Indian ruler to accept the    Subsidiary Alliance system in 1798, which was devised by    Governor-General Lord Wellesley. Other states that later joined    included Mysore (1799), Tanjore (1799), and Awadh (1801).</p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0\">    <b>Under the Bharatiya Sakshya Adhiniyam (BSA), 2023, what is the    legal status assigned to electronic or digital records?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    They are completely inadmissible in criminal trials</p>", "option2": " <p style=\"orphans:0;widows:0\">    They have the same legal effect, validity, and enforceability as    paper documents</p>", "option3": " <p style=\"orphans:0;widows:0\">    They are treated as conclusive proof that cannot be challenged in    court</p>", "option4": " <p style=\"orphans:0;widows:0\">    They are classified strictly as secondary evidence under all    conditions</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Under Section 61 of the Bharatiya Sakshya Adhiniyam (BSA), 2023,    an electronic or digital record is given the same legal effect,    validity, and enforceability as any traditional paper document.    Furthermore, the BSA modernizes evidence law by recognizing    electronic records as primary evidence under specified conditions.</p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0\">    <span><b>Who among the following assumed charge as    the 31st Chief of the Army Staff (COAS) of the Indian Army in June    2026?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    General Manoj Pande</p>", "option2": " <p style=\"orphans:0;widows:0\">    General Upendra Dwivedi</p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>General Dhiraj Seth</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    Admiral Dinesh K. Tripathi</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>General Dhiraj Seth assumed charge as the 31st    Chief of the Army Staff (COAS) of the Indian Army on June 30,    2026. He succeeded General Upendra Dwivedi, who retired on the    same day after more than four decades of distinguished service.    Prior to taking over as the COAS, General Seth served as the Vice    Chief of the Army Staff. He is a veteran Armoured Corps officer    and the first from that corps to become Army Chief in 32 years.</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following statements regarding the Indus Valley    Civilization is NOT correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Iron was widely used by the Harappans for making tools and    weapons.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Lothal is known for having a dockyard made of burnt bricks.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The Harappan script is pictographic and remains undeciphered to    date.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Steatite was the most common material used for making seals.</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Iron was NOT known to the people of the Indus Valley Civilization.    The Indus Valley Civilization belonged to the Chalcolithic/Bronze    Age, where copper and bronze were extensively used for making    tools, weapons, and vessels. Iron came into widespread use in    India much later during the Later Vedic period (around 1000 BCE).</p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\">    <span><b>Which city pair officially co-hosted the    25th Winter Olympic Games held in February 2026?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    Paris and Nice, France</p>", "option2": " <p style=\"orphans:0;widows:0\">    Milan and Cortina d'Ampezzo, Italy</p>", "option3": " <p style=\"orphans:0;widows:0\">    Oslo and Bergen, Norway</p>", "option4": " <p style=\"orphans:0;widows:0\">    Davos and Zurich, Switzerland</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>The 25th Winter Olympic Games were hosted    across the Italian cities of Milan and Cortina d'Ampezzo from    February 6 to February 22, 2026.</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the major mineral    belts and deposits in India:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. The South-Western Plateau region is rich in ferrous metals    and bauxite, but mostly lacks major coal deposits except for    lignite at Neyveli.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. The North-Eastern Plateau region, covering the Chota Nagpur    belt, is rich in iron ore and coal but completely lacks bauxite    deposits.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. Badampahar in Odisha and Bailadila in Chhattisgarh are    prominent centers for high-grade hematite iron ore production.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are CORRECT?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1 is correct:</b> The South-Western Plateau belt    (covering Karnataka, Goa, and parts of Tamil Nadu and Kerala) is    rich in metallic minerals like iron ore, manganese, and bauxite,    but lacks bituminous coal deposits, holding mainly lignite coal at    Neyveli in Tamil Nadu.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 2 is incorrect:</b> The North-Eastern Plateau region    (covering Chota Nagpur, Odisha plateau, West Bengal, and    Chhattisgarh) is very rich in bauxite deposits along with coal,    iron ore, manganese, and mica. For instance, Lohardaga in    Jharkhand is a major bauxite producing region.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 3 is correct:</b> Badampahar in the Mayurbhanj    district of Odisha and Bailadila in the Dantewada district of    Chhattisgarh are renowned for high-grade hematite iron ore    reserves.</p>    <p style=\"orphans:0;widows:0\">Hence, statements    1 and 3 are correct.</p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>With reference to the Demographic Transition Theory, consider    the following statements:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. In the first stage, high fertility is balanced by high    mortality, leading to a slow or stable rate of population growth.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. In the second stage, mortality rates drop significantly    while birth rates remain high, resulting in rapid population    growth.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. As a society transitions from a rural, agrarian base to an    urban, industrial one, its fertility rate continuously increases.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>4. Improvements in medical care, sanitation, and food security    are major factors responsible for the decline in mortality in the    second stage.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above are CORRECT?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1, 2 and 3 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    1, 2 and 4 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    2, 3 and 4 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1 and 4 only</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statements 1, 2, and 4 are correct.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1.</b> In Stage 1 of demographic transition, high birth rates    are offset by high death rates, resulting in low or near-zero    population growth.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2.</b> In Stage 2, death rates drop rapidly due to    technological and medical advances, while birth rates stay high,    leading to rapid population expansion.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3.</b> Statement 3 is incorrect: transition to an urban,    industrial society leads to a decline in fertility rates (not an    increase) as children become economic liabilities rather than    assets and female literacy rises.</p>    <p style=\"orphans:0;widows:0\"><b>4.</b>    Improved healthcare, sanitation, and nutrition in Stage 2 directly    reduce mortality rates.</p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0\">    <b>Which country held the presidency and hosted the annual G20    Summit in June 2026?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    South Africa</p>", "option2": " <p style=\"orphans:0;widows:0\">    United States</p>", "option3": " <p style=\"orphans:0;widows:0\">    Brazil</p>", "option4": " <p style=\"orphans:0;widows:0\">    Indonesia</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>Following South Africa's presidency in 2025,    the United States assumed the G20 presidency and hosted the summit    in mid-2026.</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following is considered the oldest gharana of    Hindustani classical music?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Gwalior Gharana</p>", "option2": " <p style=\"orphans:0;widows:0\">    Agra Gharana</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kirana Gharana</p>", "option4": " <p style=\"orphans:0;widows:0\">    Patiala Gharana</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Gwalior Gharana is considered the oldest gharana of Hindustani    classical music. It is often regarded as the mother of all Khayal    gharanas, originating around the 16th century.</p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Which of the following statements about basketball rules and    terminology is/are correct?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1) A successful free throw in basketball is worth 1 point.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2) The 3-second rule restricts an offensive player from    remaining in the opponent's restricted area (key) for more than    three consecutive seconds.</b></p>    <p style=\"orphans:0;widows:0\"><b>3) A backcourt    violation occurs when a defensive player steps into their own    backcourt while guarding an opponent.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only 1 and 2 are correct</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only 2 and 3 are correct</p>", "option3": " <p style=\"orphans:0;widows:0\">    Only 1 and 3 are correct</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3 all are correct</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statements 1 and 2 are correct, while statement 3 is incorrect.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    1) A free throw is an uncontested shot awarded to a player after    certain fouls, worth 1 point.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    2) The 3-second rule prevents offensive players from lingering in    the opponent's key/restricted area for more than 3 consecutive    seconds while their team has control of the ball in the    frontcourt.</p>    <p style=\"orphans:0;widows:0\">3) A backcourt    violation is an offensive violation (not defensive) that occurs    when the team in possession of the ball moves the ball from the    frontcourt back across the mid-court line into the backcourt.</p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0\">    <b>In the context of the Delhi Sultanate, what was 'Jizya'?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    A tax levied on non-Muslim subjects</p>", "option2": " <p style=\"orphans:0;widows:0\">    A land tax paid exclusively by Muslim farmers</p>", "option3": " <p style=\"orphans:0;widows:0\">    A customs duty on foreign trade</p>", "option4": " <p style=\"orphans:0;widows:0\">    A tax paid by military commanders</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Jizya was a per capita tax levied on non-Muslim subjects (known as    Dhimmis) residing in an Islamic state, such as during the Delhi    Sultanate, in exchange for protection of life, property, and    exemption from military service.</p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0\">    <b>Which subatomic particle present in the nucleus of an atom    carries no electric charge?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Proton</p>", "option2": " <p style=\"orphans:0;widows:0\">    Electron</p>", "option3": " <p style=\"orphans:0;widows:0\">    Neutron</p>", "option4": " <p style=\"orphans:0;widows:0\">    Positron</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    A neutron is a subatomic particle found in the nucleus of an atom    that carries no net electric charge (it is neutral). Protons carry    a positive charge, while electrons carry a negative charge.</p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0\">    <b>Bihu is a traditional folk dance of which Indian state?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Assam</p>", "option2": " <p style=\"orphans:0;widows:0\">    Punjab</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kerala</p>", "option4": " <p style=\"orphans:0;widows:0\">    Rajasthan</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Bihu is a popular traditional folk dance of Assam. It is performed    during the Bihu festival, which marks the beginning of the    Assamese New Year and harvest season.</p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0\">    <b>The 'Global Gender Gap Report' is published annually by which    of the following international organizations?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    World Bank</p>", "option2": " <p style=\"orphans:0;widows:0\">    World Economic Forum</p>", "option3": " <p style=\"orphans:0;widows:0\">    United Nations Development Programme</p>", "option4": " <p style=\"orphans:0;widows:0\">    International Labour Organization</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Global Gender Gap Report is published annually by the World    Economic Forum (WEF). It benchmarks the evolution of gender-based    gaps among four key dimensions: Economic Participation and    Opportunity, Educational Attainment, Health and Survival, and    Political Empowerment.</p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding the classification    of government expenditure and choose the correct option:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statement 1: Interest payments on public debt and payment of    subsidies are classified as revenue expenditure.</b></p>    <p style=\"orphans:0;widows:0\"><b>Statement 2:    Loans extended by the Central Government to State Governments are    classified as revenue expenditure.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only Statement 1 is correct</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only Statement 2 is correct</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both Statement 1 and Statement 2 are correct</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither Statement 1 nor Statement 2 is correct</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statement 1 is correct: Revenue expenditure refers to government    expenditure that neither creates physical or financial assets nor    reduces liabilities. Interest payments on public debt and    subsidies fall under revenue expenditure as they are routine    operational costs.</p>    <p style=\"orphans:0;widows:0\">Statement 2 is    incorrect: Loans extended by the Central Government to State    Governments create financial assets (claims for recovery) for the    Central Government, and hence are classified as Capital    Expenditure, not revenue expenditure.</p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0\">    <span><b>India's Union Budget 2026--27 introduced a    major expansion to which national infrastructure initiative aimed    at integrating logistics and transport networks?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    PM Gati Shakti National Master Plan</p>", "option2": " <p style=\"orphans:0;widows:0\">    Bharatmala Pariyojana Phase-3</p>", "option3": " <p style=\"orphans:0;widows:0\">    National Urban Mobility Mission 2.0</p>", "option4": " <p style=\"orphans:0;widows:0\">    Smart Cities Mission Extension</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span>The PM Gati Shakti plan received dedicated    allocations in early 2026 to enhance multi-modal connectivity and    streamline logistics costs across major industrial corridors.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0\">    <b>The famous 'Ulgulan' (Great Tumult) was a major tribal movement    led by Birsa Munda in the late 19th century against British    colonial rule and feudal oppression. In which modern-day Indian    state was this movement primarily centered?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Odisha</p>", "option2": " <p style=\"orphans:0;widows:0\">    Chhattisgarh</p>", "option3": " <p style=\"orphans:0;widows:0\">    Jharkhand</p>", "option4": " <p style=\"orphans:0;widows:0\">    Bihar</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The 'Ulgulan' (Great Tumult) was led by Birsa Munda between 1899    and 1900 in the Chota Nagpur region, located in present-day    Jharkhand. Birsa Munda mobilized the Munda community against the    exploitation by 'Dikus' (outsider landlords and moneylenders) and    British land policies.</p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0\">    <b>What was the primary focus of the First Five-Year Plan    (1951–1956) in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Development of agriculture</p>", "option2": " <p style=\"orphans:0;widows:0\">    Rapid industrialization</p>", "option3": " <p style=\"orphans:0;widows:0\">    Poverty removal</p>", "option4": " <p style=\"orphans:0;widows:0\">    Self-reliance</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The First Five-Year Plan (1951–1956) focused primarily on the    development of the primary sector, especially agriculture,    irrigation, and power projects, to address the severe food    shortages and inflation following India's independence.</p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0\">    <b>Identify the tribal leaders who led the Santhal Rebellion    (1855–1856) against British colonial oppression and the    exploitative zamindari system in the Rajmahal Hills.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Sidhu and Kanhu Murmu mobilized the Santhal community in the    Rajmahal region against British authorities and moneylenders.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Birsa Munda spearheaded the 'Ulgulan' or Great Tumult in the    Chotanagpur region to establish self-rule.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Alluri Sitarama Raju organized tribal people in the Visakhapatnam    Agency area during the Rampa Rebellion.</p>", "option4": "Tiनयप Sing ंयृiिप्रधक पुध Kुोौi पनiृधौ ोgोinौप पुध Bनiपiौु धncनयोcुंधnप in पुध Kुोौi Hiििस.", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Santhal Rebellion (1855–1856) was a major tribal uprising    against the British colonial authorities, oppressive zamindars,    and moneylenders in the Rajmahal Hills (present-day Jharkhand).    The revolt was led by four brothers—Sidhu, Kanhu, Chand, and    Bhairav Murmu. Sidhu and Kanhu Murmu mobilized thousands of    Santhal peasantry to stand against British exploitation before the    rebellion was brutally suppressed.</p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Read the given statements carefully and choose the correct    option regarding Assertion (A) and Reason (R).</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Assertion (A): The New Economic Policy of 1991 led to the    substantial dismantling of the 'License-Permit Raj' in India.</b></p>    <p style=\"orphans:0;widows:0\"><b>Reason (R):    Under the policy of Liberalization, industrial licensing was    abolished for most industries, except a few strategic sectors.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Both A and R are true and R is the correct explanation of A.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Both A and R are true but R is not the correct explanation of A.</p>", "option3": " <p style=\"orphans:0;widows:0\">    A is true but R is false.</p>", "option4": " <p style=\"orphans:0;widows:0\">    A is false but R is true.</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Assertion (A) is correct because the New Economic Policy (NEP)    introduced in 1991 aimed to reduce government controls and    bureaucratic regulations, effectively ending the restrictive    'License-Permit Raj'. Reason (R) is also correct and provides the    exact mechanism for this dismantling: under Liberalization, the    requirement for industrial licensing was abolished for almost all    industries, except a short list of strategic and sensitive sectors    (such as defense equipment, hazardous chemicals, and industrial    explosives). Therefore, both A and R are true, and R is the    correct explanation of A.</p>", "question_heading": ""}, {"sr_no": 51, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The table shows appeared and selected candidates in five branches.    What is the difference between the average selected candidates of    C, D and E and the selected candidates of B?</p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538731691_html_3d717f7f670f6373.png\" width=\"470\" height=\"109\" > </p>", "option1": "<p style=\"orphans:0;widows:0\">    48</p>", "option2": " <p style=\"orphans:0;widows:0\">    60</p>", "option3": " <p style=\"orphans:0;widows:0\">    54</p>", "option4": " <p style=\"orphans:0;widows:0\">    66</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Average selected of C, D and E =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538731691_html_ef585d24433a015a.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Selected in B    =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538731691_html_45638c94c161b36c.gif\"
