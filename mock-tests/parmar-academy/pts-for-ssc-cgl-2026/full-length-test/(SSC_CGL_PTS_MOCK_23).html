o": 77, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    If '+' denotes '<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_cbf3dd5fdfeb402d.gif\" > ',    '-' denotes '<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_5b21af84bca2675f.gif\" > ',    '×' denotes '<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_e95f11b047543be0.gif\" > ',    and '÷' denotes '<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_8b2f9f587ddc202b.gif\" > ',    then evaluate the value of the following expression:</p>    <p style=\"orphans:0;widows:0\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_d21f7bd70b79b02a.gif\" > </p>", "option1": "<p style=\"orphans:0;widows:0\">    22</p>", "option2": " <p style=\"orphans:0;widows:0\">    18</p>", "option3": " <p style=\"orphans:0;widows:0\">    24</p>", "option4": " <p style=\"orphans:0;widows:0\">    15</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    According to the given sign substitutions:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'+' becomes    '<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_cbf3dd5fdfeb402d.gif\" > '</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'-' becomes    '<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_5b21af84bca2675f.gif\" > '</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'×' becomes    '<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_e95f11b047543be0.gif\" > '</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'÷' becomes    '<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_8b2f9f587ddc202b.gif\" > '</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Given    expression:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_d21f7bd70b79b02a.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Substituting    the signs:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_2b3dd0f96d56f3b5.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Using the    BODMAS rule:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">First part:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_7eb776e044ba012e.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_49d3a94bfad4ea5f.gif\" > ,    so     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_66cb274fdf87b97f.gif\" > .</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Second part:       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_b25100aef366b7a1.gif\" > .</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Combining    both parts:</p>    <p style=\"orphans:0;widows:0\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_6e9b077e970a1e0c.gif\" > </p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:0;widows:0\">    You are a Project Director overseeing a major railway bridge    construction. A quality control inspector submits a report    pointing out a structural defect in a secondary support pillar.    The defect does not pose an immediate risk of collapse, but if    left unaddressed, it could significantly reduce the structure's    operational lifespan. Halting the entire project will cause severe    public inconvenience and heavy financial penalties. What is the    most appropriate course of action?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Ignore the report since there is no immediate collapse risk and    complete the project on schedule.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Suspend work selectively on the affected section to carry out    immediate repairs while continuing work on unaffected parts and    reporting the issue to higher authorities.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Halt the entire project indefinitely and wait for a full audit by    the Ministry.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Suppress the report temporarily and address the defect after the    bridge is opened to the public.</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The most balanced and administrative decision accounts for safety,    structural integrity, and project execution efficiency. Ignoring    or suppressing the defect (Options A and D) compromises long-term    safety and ethical responsibility. Halting the entire project    (Option C) is an extreme overreaction that causes unnecessary loss    and delay since the defect is localized to a secondary pillar.    Thus, selectively suspending work on the affected portion to    repair it while keeping other work active and informing superiors    (Option B) is the correct course of action.</p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    What should come in place of the question mark (?) in the    following number series?</p>    <p style=\"orphans:0;widows:0\">10, 13, 21, 45, 93, ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    198</p>", "option2": " <p style=\"orphans:0;widows:0\">    205</p>", "option3": " <p style=\"orphans:0;widows:0\">    213</p>", "option4": " <p style=\"orphans:0;widows:0\">    221</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed in the series is based on adding     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_18d920f24a4df652.gif\" >     to each term, where     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_b9389f3e7c18a1c5.gif\" >     represents consecutive prime numbers (2, 3, 5, 7, 11, ...):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_f2c6bc0e16f0ea35.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_3bd406e223943342.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_f63bbdcd9d7cbbf.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_67fe1331b3a6a410.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_a4c7973fb0e7da6f.gif\" > </p>    <p style=\"orphans:0;widows:0\">Thus, the required number is 213.</p>", "question_heading": ""}, {"sr_no": 80, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Which two signs should be interchanged to make the given equation    correct?</p>    <p style=\"orphans:0;widows:0\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_cd002a4d60cce48a.gif\" > </p>", "option1": " <p style=\"o _uploader_images/1788538949276_html_68ed2d7f75c97665.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">=     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_d728164a12d8a177.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">=     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_bbb8156aee0e13d3.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">=     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_359ab322a7383b0f.gif\" >     = RHS</p>    <p style=\"orphans:0;widows:0\">Hence, option B is correct.</p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the option that is related to the fifth letter-cluster in    the same way as the second letter-cluster is related to the first    letter-cluster and the fourth letter-cluster is related to the    third letter-cluster.</p>    <p style=\"orphans:0;widows:0\">PLANET : UQYSCY :: FLOWER :    KQMBCW :: TARGET : ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    YYWLCY</p>", "option2": " <p style=\"orphans:0;widows:0\">    XZWLCZ</p>", "option3": " <p style=\"orphans:0;widows:0\">    YYXMCY</p>", "option4": " <p style=\"orphans:0;widows:0\">    UYVLCY</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Consonants    are shifted forward by 5 positions (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_66586882ca5d95af.gif\" > ).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Vowels are    shifted backward by 2 positions (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_589de7aba7af40b3.gif\" > ).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Applying this    pattern to PLANET:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">P (16) + 5 =    21 (U)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">L (12) + 5 =    17 (Q)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A (1) - 2 =    25 (Y)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">N (14) + 5 =    19 (S)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">E (5) - 2 = 3    (C)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">T (20) + 5 =    25 (Y)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Similarly,    for TARGET:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">T (20) + 5 =    25 (Y)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A (1) - 2 =    25 (Y)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R (18) + 5 =    23 (W)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">G (7) + 5 =    12 (L)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">E (5) - 2 = 3    (C)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">T (20) + 5 =    25 (Y)</p>    <p style=\"orphans:0;widows:0\">Thus, TARGET is coded as YYWLCY.</p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"orphans:0;widows:0\">    In a certain code language, 'FROG' is coded as 'ITRI' and 'DUCK'    is coded as 'GWFM'. How will 'FISH' be coded in that language?</p>", "option1": "<p style=\"orphans:0;widows:0\">    HKVJ</p>", "option2": " <p style=\"orphans:0;widows:0\">    IKVJ</p>", "option3": " <p style=\"orphans:0;widows:0\">    IKXJ</p>", "option4": " <p style=\"orphans:0;widows:0\">    HLUJ</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is an alternating addition of +3 and +2    to the alphabetical positions of the letters:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">F (+3) → I</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R (+2) → T</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">O (+3) → R</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">G (+2) → I</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Similarly,    for 'FISH':</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">F (+3) → I</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">I (+2) → K</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">S (+3) → V</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">H (+2) → J</p>    <p style=\"orphans:0;widows:0\">Thus, 'FISH' is coded as 'IKVJ'.</p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Study the given pattern carefully and select the number that can    replace the question mark (?) in it.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(12, 84, 9)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(15, 112, 13)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">(18, ?, 14)</p>    <p style=\"orphans:0;widows:0\">(NOTE: Operations should be    performed on the whole numbers, without breaking down the numbers    into its constituent digits. E.g. 13 – Operations on 13 such as    adding/subtracting/multiplying etc. to 13 can be performed.    Breaking down 13 into 1 and 3 and then performing mathematical    operations on 1 and 3 is not allowed)</p>", "option1": "<p style=\"orphans:0;widows:0\">    116</p>", "option2": " <p style=\"orphans:0;widows:0\">    128</p>", "option3": " <p style=\"orphans:0;widows:0\">    132</p>", "option4": " <p style=\"orphans:0;widows:0\">    144</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Second number    = (First number + Third number) × 4</p>    <p style=\"orphans:0;widows  brother.</p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:0;widows:0\">    In a certain code language, 'LAMP' is written as '168', 'DESK' is    written as '156'. How will 'CHAIR' be written in that language?</p>", "option1": "<p style=\"orphans:0;widows:0\">    195</p>", "option2": " <p style=\"orphans:0;widows:0\">    185</p>", "option3": " <p style=\"orphans:0;widows:0\">    190</p>", "option4": " <p style=\"orphans:0;widows:0\">    200</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is: (Sum of positional values of the    letters in English alphabet) × (Number of letters in the word).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">For 'LAMP':</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">L = 12, A =    1, M = 13, P = 16</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sum =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_bf5a7b8d857d88a1.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Number of    letters = 4</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Code =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_935c454a5b8746d1.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">For 'DESK':</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">D = 4, E = 5,    S = 19, K = 11</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Sum =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_2cc5550ef885a153.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Number of    letters = 4</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Code =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_42c4a61d00c10b19.gif\" > </p v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_d211c3d1afb2589.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">After    interchanging:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_65ad9650e90fca08.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Applying    BODMAS:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_1cdc7d4560568e8a.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_5dda4dfe2ce5e692.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Equation II:       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_4c3e3b12de09593d.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">After    interchanging:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_3c25fbd25c5873fc.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Applying    BODMAS:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_b37dd28add549dac.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_959e7be47edfd946.gif\" > </p>    <p style=\"orphans:0;widows:0\">Therefore, the values of    equations (I) and (II) are 29 and 5 respectively.</p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Which of the four options will replace the question mark (?) in    the following series?</p>    <p style=\"orphans:0;widows:0\">WD 8, TG 14, QJ 20, NM 26, ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    KP 32</p>", "option2": " <p style=\"orphans:0;widows:0\">    LO 34</p>", "option3": " <p style=\"orphans:0;widows:0\">    KQ 30</p>", "option4": " <p style=\"orphans:0;widows:0\">    JP 32</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The logic followed here is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1st letter: W    (-3) → T (-3) → Q (-3) → N (-3) → K</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2nd letter: D    (+3) → G (+3) → J (+3) → M (+3) → P</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Number: 8    (+6) → 14 (+6) → 20 (+6) → 26 (+6) → 32</p>    <p style=\"orphans:0;widows:0\">Thus, the missing term is KP 32.</p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the combination of letters that when sequentially placed in    the blanks of the given series will complete the series.</p>    <p style=\"orphans:0;widows:0\">P _ R S _ Q _ S T _ R S _ U V _ T    U _ W</p>", "option1": "<p style=\"orphans:0;widows:0\">    Q T R U T S V</p>", "option2": " <p style=\"orphans:0;widows:0\">    Q T S U T R V</p>", "option3": " <p style=\"orphans:0;widows:0\">    R T Q U T S V</p>", "option4": " <p style=\"orphans:0;widows:0\">    Q T R T U S V</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The given series consists of 20 letters divided into 4 groups of 5    letters each. Each group starts with the consecutive letter of the    alphabet and contains 5 consecutive letters in increasing    alphabetical order:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1st group: P    Q R S T</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2nd group: Q    R S T U</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3rd group: R    S T U V</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4th group: S    T U V W</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Combining    these gives the complete series: P Q R S T Q R S T U R S T U V S T    U V W.</p>    <p style=\"orphans:0;widows:0\">Thus, the missing letters are Q T    R U T S V.</p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    135 is related to 12 following a certain logic. Following the same    logic, 168 is related to 15. To which of the following is 234    related, following the same logic?</p>    <p style=\"orphans:0;widows:0\">(NOTE: Operations should be    performed on the whole numbers, without breaking down the numbers    into its constituent digits. E.g. 13 – Operations on 13 such as    adding /deleting /multiplying etc. to 13 can be performed.    Breaking down 13 into 1 and 3 and then performing mathematical    operations on 1 and 3 is not allowed)</p>", "option1": "<p style=\"orphans:0;widows:0\">    21</p>", "option2": " <p style=\"orphans:0;widows:0\">    23</p>", "option3": " <p style=\"orphans:0;widows:0\">    19</p>", "option4": " <p style=\"orphans:0;widows:0\">    25</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">First number    = (Second number     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_33df3dde628867da.gif\" > )    + 3</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1st pair:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_90a29b4cd81f058b.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2nd pair:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_f7227654ca2197b9.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Similarly,    for 234:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_1cfba4b5ff65b7b3.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_2295ac928877cd95.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_a0ccc1507db24a91.gif\" > </p>    <p style=\"orphans:0;widows:0\">Hence, 234 is related to 21.</p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Select the pattern that will replace the question mark (?) in the    following box sequence.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Box 1: Main    symbol 'B' on the left, subscript '3' at the bottom-right</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Box 2: Main    symbol '7' on the left, subscript 'B' at the bottom-right</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Box 3: Main    symbol 'K' on the left, subscript '7' at the bottom-right</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Box 4: Main    symbol '5' on the left, subscript 'K' at the bottom-right</p>    <p style=\"orphans:0;widows:0\">Box 5: ?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Main symbol 'M' on the left, subscript '5' at the bottom-right</p>", "option2": " <p style=\"orphans:0;widows:0\">    Main symbol '5' on the left, subscript 'M' at the bottom-right</p>", "option3": " <p style=\"orphans:0;widows:0\">    Main symbol 'M' on the left, subscript 'K' at the bottom-right</p>", "option4": " <p style=\"orphans:0;widows:0\">    Main symbol '3' on the left, subscript '5' at the bottom-right</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In each step of the series:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. The main    symbol on the left of the current box shifts to become the    subscript symbol at the bottom-right in the next box.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. The main    symbols alternate between letters and numbers (B [Letter] → 7    [Number] → K [Letter] → 5 [Number] → Letter).</p>    <p style=\"orphans:0;widows:0\">Since Box 4 has '5' as its main    symbol, Box 5 must have '5' as its subscript symbol at the    bottom-right, and a new letter (such as 'M') as its main symbol on    the left.</p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"orphans:0;widows:0\">    Each vowel in the word ‘CREATIVE’ is changed to the next    letter in the English alphabetical order and each consonant is    changed to the previous letter in the English alphabetical order.    How many letters are there in the English alphabetical order    between the letter which is third from the left end and the letter    which is sixth from the left end in the group of letters thus    formed?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Two</p>", "option2": " <p style=\"orphans:0;widows:0\">    Three</p>", "option3": " <p style=\"orphans:0;widows:0\">    Four</p>", "option4": " <p style=\"orphans:0;widows:0\">    Five</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Given word: CREATIVE</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Applying the    rules:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Vowels are    replaced by the next letter (+1):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">E → F, A →    B, I → J, E → F</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Consonants    are replaced by the previous letter (-1):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C → B, R →    Q, T → S, V → U</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">The new    letter group formed is: B Q F B S J U F</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3rd letter    from the left end = F</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">6th letter    from the left end = J</p>    <p style=\"orphans:0;widows:0\">The letters between F and J in    English alphabetical order are G, H, and I. Thus, there are 3    letters between them.</p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Three of the following four word-pairs are alike in a certain way    and thus form a group. Which word-pair DOES NOT belong to that    group?</p>    <p style=\"orphans:0;widows:0\">(The words must be considered as    meaningful English words and must not be related to each other    based on the number of letters/consonants/vowels in the word.)</p>", "option1": "<p style=\"orphans:0;widows:0\">    Heart – Cardiologist</p>", "option2": " <p style=\"orphans:0;widows:0\">    Brain – Neurologist</p>", "option3": " <p style=\"orphans:0;widows:0\">    Liver – Pulmonologist</p>", "option4": " <p style=\"orphans:0;widows:0\">    Kidney – Nephrologist</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is: Organ – Specialist Doctor</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Heart is    treated by a Cardiologist.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Brain is    treated by a Neurologist.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Kidney is    treated by a Nephrologist.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. Liver is    treated by a Hepatologist, whereas a Pulmonologist specializes in    lungs and the respiratory system.</p>    <p style=\"orphans:0;widows:0\">Therefore, 'Liver –    Pulmonologist' does not belong to the group.</p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"orphans:0;widows:0\">    In a certain code language, 'MARKET' is written as '2613622540'    and 'DESIGN' is written as '853891428'. How will 'REPORT' be    written in that language?</p>", "option1": "<p style=\"orphans:0;widows:0\">    36532153640</p>", "option2": " <p style=\"orphans:0;widows:0\">    18516151820</p>", "option3": " <p style=\"orphans:0;widows:0\">    361032303640</p>", "option4": " <p style=\"orphans:0;widows:0\">    181016301840</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1.    Consonants: Positional value in the English alphabet is multiplied    by 2.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Vowels:    Positional value in the English alphabet remains unchanged.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">For 'REPORT':</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R (Consonant)    =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_9aeb5db8b97ee818.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">E (Vowel) =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_aa9336d76ae0f964.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">P (Consonant)    =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_f59bd9664639a8fd.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">O (Vowel) =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_bc10a2e5542876f1.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R (Consonant)    =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_9aeb5db8b97ee818.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">T (Consonant)    =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_2122936ca9a5296d.gif\" > </p>    <p style=\"orphans:0;widows:0\">Combining these numbers gives:    36532153640.</p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Instruction: Read the statement carefully and choose which of the    given assumptions is/are implicit in the statement.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Statement:    The introduction of automated drip irrigation systems has    significantly improved crop yields and water conservation, yet    high installation costs and a lack of technical training among    small farmers limit its large-scale adoption.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Assumptions:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">I. Automated    drip irrigation systems have the potential to enhance agricultural    productivity.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">II. Financial    constraints and insufficient technical knowledge act as barriers    for small farmers in adopting modern irrigation technology.</p>    <p style=\"orphans:0;widows:0\">III. Automated drip irrigation    systems will completely eliminate the need for manual labor in    fields.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Only I and II are implicit</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only II and III are implicit</p>", "option3": " <p style=\"orphans:0;widows:0\">    Only I is implicit</p>", "option4": " <p style=\"orphans:0;widows:0\">    All I, II, and III are implicit</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Assumption I is implicit because the statement clearly mentions    that automated drip irrigation improves crop yields and water    conservation, which implies its positive impact on productivity.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Assumption II    is implicit because high installation costs represent financial    constraints and a lack of technical training represents an    educational/technical barrier.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Assumption    III is not implicit because the statement makes no reference or    implication regarding the total elimination of manual labor.</p>    <p style=\"orphans:0;widows:0\">Hence, only assumptions I and II    are implicit.</p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"orphans:0;widows:0\">    How many meaningful four-letter English words can be formed using    the first, third, fifth, and sixth letters of the word \"TEACHER\"    (when counted from left to right), using each letter only once in    each word?</p>", "option1": "<p style=\"orphans:0;widows:0\">    1</p>", "option2": " <p style=\"orphans:0;widows:0\">    2</p>", "option3": " <p style=\"orphans:0;widows:0\">    3</p>", "option4": " <p style=\"orphans:0;widows:0\">    4</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\"><a name=\"_GoBack\"></a>    The 1st, 3rd, 5th, and 6th letters of the word \"TEACHER\"    are T, A, H, and E, respectively.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Using these    letters (T, A, H, E) only once, the following 2 meaningful English    words can be formed:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. HATE</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. HEAT</p>    <p style=\"orphans:0;widows:0\">Therefore, exactly 2 such words    can be formed.</p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Five friends R, S, P, T and Q are sitting in a row facing the    North direction. Based on the following information, answer the    question.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">R sits at the    extreme left end of the row.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">S sits    immediately to the right of R.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">P sits at the    extreme right end of the row.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">T sits    immediately to the left of P.</p>    <p style=\"orphans:0;widows:0\">Who sits second to the left of P?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Q</p>", "option2": " <p style=\"orphans:0;widows:0\">    R</p>", "option3": " <p style=\"orphans:0;widows:0\">    S</p>", "option4": " <p style=\"orphans:0;widows:0\">    T</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0.19in\">    <span style=\"font-family:'Times New Roman'\">According to the given    information for Row 1 (facing North):</span></p>    <p style=\"orphans:0;widows:0;margin-top:0.19in;margin-bottom:0.19in\">    <span style=\"font-family:'Times New Roman'\">1. R is at the extreme left    end (Position 1).</span></p>    <p style=\"orphans:0;widows:0;margin-top:0.19in;margin-bottom:0.19in\">    <span style=\"font-family:'Times New Roman'\">2. S sits to the immediate    right of R (Position 2).</span></p>    <p style=\"orphans:0;widows:0;margin-top:0.19in;margin-bottom:0.19in\">    <span style=\"font-family:'Times New Roman'\">3. P sits at the extreme right    end (Position 5).</span></p>    <p style=\"orphans:0;widows:0;margin-top:0.19in;margin-bottom:0.19in\">    <span style=\"font-family:'Times New Roman'\">4. T sits to the immediate    left of P (Position 4).</span></p>    <p style=\"orphans:0;widows:0;margin-top:0.19in;margin-bottom:0.19in\">    <span style=\"font-family:'Times New Roman'\">5. Thus, the remaining person    Q must occupy the middle position (Position 3).</span></p>    <p style=\"orphans:0;widows:0;margin-top:0.19in;margin-bottom:0.19in\">    <span style=\"font-family:'Times New Roman'\">The arrangement of Row 1 from    left to right is: <b>R – S – Q – T – P</b></span></p>    <p style=\"orphans:0;widows:0;margin-top:0.19in\"><span style=\"font-family:'Times New Roman'\">Since    persons in Row 1 are facing North, the person sitting second to    the left of P is Q.</span></p>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"orphans:0;widows:0\">    Four groups of letter-number combinations are given below. Three    of them follow a certain pattern and thus form a group. Select the    option that does NOT belong to that group.</p>", "option1": "<p style=\"orphans:0;widows:0\">    B2 : G7 : L12</p>", "option2": " <p style=\"orphans:0;widows:0\">    E5 : J10 : O15</p>", "option3": " <p style=\"orphans:0;widows:0\">    I9 : N14 : S19</p>", "option4": " <p style=\"orphans:0;widows:0\">    K11 : P16 : V22</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In options A, B, and C, each letter's positional value is given    beside it, and the letters increase by 5 positions sequentially:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">A)     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_6d9af99c66c06c7a.png\" width=\"186\" height=\"23\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">B)     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_352d5f62bc0159b7.png\" width=\"195\" height=\"23\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">C)     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_41c2bca53d34e9d3.png\" width=\"192\" height=\"23\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">D)     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1788538949276_html_65cd462813e38a2e.png\" width=\"208\" height=\"23\" > </p>    <p style=\"orphans:0;widows:0\">In option D, the difference    between P and V is +6 instead of +5. Hence, option D is the odd    one out.</p>", "question_heading": ""}, {"sr_no": 100, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Instruction: In a certain coding system:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'apple mango    banana fresh' is coded as 'pr, st, uv, wx'</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'mango sweet    fresh juice' is coded as 'wx, yz, st, ab'</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">'banana juice    taste good' is coded as 'uv, ab, cd, ef'</p>    <p style=\"orphans:0;widows:0\">What is the code for 'apple sweet    juice banana'?</p>", "option1": "<p style=\"orphans:0;widows:0\">    pr, yz, ab, uv</p>", "option2": " <p style=\"orphans:0;widows:0\">    pr, st, ab, cd</p>", "option3": " <p style=\"orphans:0;widows:0\">    wx, yz, uv, ef</p>", "option4": " <p style=\"orphans:0;widows:0\">    st, pr, cd, ab</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Comparing the given statements step-by-step:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. Comparing    1st and 3rd statements: The common word is 'banana' and the common    code is 'uv'. Thus, 'banana' = 'uv'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. Comparing    2nd and 3rd statements: The common word is 'juice' and the common    code is 'ab'. Thus, 'juice' = 'ab'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. Comparing    1st and 2nd statements: The common words are 'mango' and 'fresh',    which correspond to codes 'st' and 'wx'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. From 1st    statement: Removing 'banana' (uv), 'mango' and 'fresh' (st, wx),    the remaining word 'apple' is coded as 'pr'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">5. From 2nd    statement: Removing 'juice' (ab), 'mango' and 'fresh' (st, wx),    the remaining word 'sweet' is coded as 'yz'.</p>    <p style=\"orphans:0;widows:0\">Hence, the code for 'apple sweet    juice banana' is 'pr, yz, ab, uv'.</p>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
