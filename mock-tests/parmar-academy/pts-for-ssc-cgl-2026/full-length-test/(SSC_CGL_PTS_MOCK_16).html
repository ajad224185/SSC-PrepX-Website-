tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Lothal</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Single Fortified Complex</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">No internal wall separating the       citadel and lower town; famous for the</span><span style=\"font-family:'Nirmala UI'\"><b> artificial       dockyard</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Kalibangan</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Dual Fortification</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Both the Citadel and the Lower       Town were independently fortified.</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following orbits is    most commonly used for launching commercial television, radio, and    international telecommunication satellites ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Low Earth Orbit</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Geostationary Earth Orbit (GEO)</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sun-Synchronous Orbit</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Polar Orbit</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: B) Geostationary    Earth Orbit (GEO)</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A </span><span style=\"font-family:'Nirmala UI'\"><b>Geostationary     Orbit</b></span><span style=\"font-family:'Nirmala UI'\"> is a     circular orbit positioned exactly above the Earth's equator at an     altitude of approximately </span><span style=\"font-family:'Nirmala UI'\"><b>35,786     kilometers</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Synchronization:</b></span><span style=\"font-family:'Nirmala UI'\"> A     satellite placed in this orbit travels at the exact </span><span style=\"font-family:'Nirmala UI'\"><b>same     rotational speed as the Earth</b></span><span style=\"font-family:'Nirmala UI'\"> (taking     exactly 24 hours to complete one full orbit). Because it syncs     perfectly with the Earth's rotation, the satellite appears     completely </span><span style=\"font-family:'Nirmala UI'\"><b>stationary     or fixed</b></span><span style=\"font-family:'Nirmala UI'\"> from the     perspective of a ground observer.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Why     for Communication?</b></span><span style=\"font-family:'Nirmala UI'\"> Because     the satellite stays locked over one specific geographic area,     ground-based antenna dishes (like your home DTH/satellite TV     dish) do not need to move or track the satellite across the sky;     they can simply point at a fixed spot in the heavens to receive     an uninterrupted signal.</span></p>    </li>\n</ul>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Common    Orbits and Their Uses:</b></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Orbit Type</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Approximate Altitude</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Primary Applications</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Low Earth Orbit (LEO)</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">160 – 2,000 km</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">International Space Station       (ISS), spy satellites, Hubble Telescope, Starlink internet       fleets.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Geostationary Orbit (GEO)</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>~35,786 km</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Satellite TV (DTH), weather       monitoring, international telecommunications.</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Sun-Synchronous Orbit (SSO)</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">600 – 800 km</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Earth-mapping, environmental       monitoring, agricultural tracking.</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding the GDP Deflator and identify the correct    option:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">1 . The    GDP Deflator is a comprehensive measure of inflation that reflects    the price changes of all domestically produced final goods and    services in an economy.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">2. If    Nominal GDP is exactly equal to Real GDP in a given financial    year, the GDP Deflator for that year will be equal to 100.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Statement I is correct, but    Statement II is incorrect</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Statement I is incorrect, but    Statement II is correct</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both Statement I and Statement II    are correct</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both Statement I and Statement II    are incorrect</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: C) Both    Statement I and Statement II are correct.</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     I is correct: </b></span><span style=\"font-family:'Nirmala UI'\">The     GDP Deflator accounts for every final good and service produced     within the borders of the country, making it a much wider measure     of inflation than the Consumer Price Index (CPI) or Wholesale     Price Index (WPI).</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     II is also</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>correct</b></span><span style=\"font-family:'Nirmala UI'\">.     The mathematical formula for the indicator is:<br> </span><span style=\"font-family:'Nirmala UI'\"><b>GDP     Deflator = Nominal GDP/ Real GDP × 100</b></span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">When    Nominal GDP equals Real GDP, the ratio is 1. Multiplying this by    100 gives a deflator value of exactly 100. This typically    happens in the </span><span style=\"font-family:'Nirmala UI'\"><b>base    year (2022-23)</b></span><span style=\"font-family:'Nirmala UI'\"> of    an economy, because in the base year, goods are valued at current    prices (Nominal) which are identically equal to the constant base    year prices (Real).</span></p>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Interpreting    GDP Deflator Values:</b></span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Deflator Value</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Meaning / Economic Scenario</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Exactly 100</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Represents the </span><span style=\"font-family:'Nirmala UI'\"><b>Base       Year</b></span><span style=\"font-family:'Nirmala UI'\"> or a       scenario where prices have completely stabilized back to base       year levels (No inflation/deflation relative to base).</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Greater than 100 (e.g., 115)</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Indicates </span><span style=\"font-family:'Nirmala UI'\"><b>Inflation</b></span><span style=\"font-family:'Nirmala UI'\">.       Prices have risen overall since the base year.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Less than 100 (e.g., 95)</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Indicates </span><span style=\"font-family:'Nirmala UI'\"><b>Deflation</b></span><span style=\"font-family:'Nirmala UI'\">.       Prices have dropped overall since the base year.</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Who among the following has been    appointed by the Government of India as the 3rd Chief of Defence    Staff (CDS), succeeding General Anil Chauhan?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lt Gen Upendra Dwivedi</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Vice Admiral Krishna Swaminathan</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Air Marshal Amar Preet Singh</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lt Gen N. S. Raja Subramani</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: D) Lt Gen N. S.    Raja Subramani</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In     May 2026, the Appointments Committee of the Cabinet (ACC)     named </span><span style=\"font-family:'Nirmala UI'\"><b>Lieutenant     General N. S. Raja Subramani (Retd.)</b></span><span style=\"font-family:'Nirmala UI'\"> as     India's 3rd Chief of Defence Staff. He officially takes charge of     the office following the completion of General Anil Chauhan's     tenure.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Current    chiefs:</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Chief     of the Army Staff:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>General     Upendra Dwivedi</b></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Chief     of the Naval Staff:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Admiral     Dinesh Kumar Tripathi</b></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Chief     of the Air Staff:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Air     Chief Marshal Amar Preet Singh</b></span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Core    Roles &amp; Mandate of the Chief of Defence Staff (CDS):</b></span><span style=\"font-family:'Nirmala UI'\">The    position of CDS was created based on the recommendations of    the </span><span style=\"font-family:'Nirmala UI'\"><b>Kargil Review    Committee (1999)</b></span><span style=\"font-family:'Nirmala UI'\"> to    reform India's higher defense management. The CDS is a </span><span style=\"font-family:'Nirmala UI'\"><b>four-star    General</b></span><span style=\"font-family:'Nirmala UI'\"> who    performs several crucial roles across the military and    administrative spectrums:</span></p>    <ol>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     CDS acts as the </span><span style=\"font-family:'Nirmala UI'\"><b>Principal     Military Advisor</b></span><span style=\"font-family:'Nirmala UI'\"> to     the Union Defence Minister on all tri-services (Army, Navy, and     Air Force) matters.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     CDS functions as the official </span><span style=\"font-family:'Nirmala UI'\"><b>Secretary     of the Department of Military Affairs (DMA)</b></span><span style=\"font-family:'Nirmala UI'\"> within     the Ministry of Defence. This integrates military professionals     directly into the government's bureaucratic decision-making     structure.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     primary mandate of the CDS is to bring </span><span style=\"font-family:'Nirmala UI'\"><b>jointness     in operation, logistics, transport, training, and     communications</b></span><span style=\"font-family:'Nirmala UI'\"> among     the three services.</span></p>    </li>\n</ol>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Chronology</b></span></p>    <table>     <col>      <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Order</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Chief of Defence Staff</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Branch of Armed Forces</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Status / Rule</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>1st</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">General Bipin Rawat</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Indian Army</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Jan 2020 – Dec 2021 </span><span style=\"font-family:'Nirmala UI'\"><i>(Demised       in office)</i></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>2nd</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">General Anil Chauhan</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Indian Army</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Sep 2022 – May 2026</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>3rd</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Lt Gen N. S. Raja Subramani</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Indian Army</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Appointed in May 2026</b></span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The Sama Chakeva folk dance and    theatre festival is a prominent cultural tradition primarily    celebrated in which of the following states?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Assam</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Punjab</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Haryana</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bihar</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: D) Bihar</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Sama     Chakeva is a traditional folk festival and dance performance     deeply rooted in the </span><span style=\"font-family:'Nirmala UI'\"><b>Mithila     region (Mithilanchal)</b></span><span style=\"font-family:'Nirmala UI'\"> of     northern Bihar, extending into parts of southern Nepal. It is     celebrated by the Maithili-speaking community.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Similar     to Raksha Bandhan, this festival explicitly celebrates the pure     and loving bond between brothers and sisters. It starts the night     after Chhath Puja (in the Hindu month of Kartik, usually     November) and culminates on Kartik Purnima.<br>  </span></p>    </li>\n</ul>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Prominent    Folk Arts &amp; Festivals of Bihar:</b></span><span style=\"font-family:'Nirmala UI'\"><br>  </span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Folk Dance / Theatre /       Festival</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Core Theme</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Sama Chakeva</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">A folk performance celebrating       sibling love through Maithili songs, bird-like movements, and       clay figurines.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Jat-Jatin</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">A popular folk dance performed       by couples, enacting the domestic squabbles, romance, and daily       life of a married pair.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Bidesiya</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">A legendary folk theatre form       popularized by </span><span style=\"font-family:'Nirmala UI'\"><b>Bhikhari       Thakur</b></span><span style=\"font-family:'Nirmala UI'\">, centering on       themes of migration, social reform, and the pain of left-behind       families.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Bihula (Bihula-Bishahari)</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">A prominent ritualistic folk art       and ballad performance of the </span><span style=\"font-family:'Nirmala UI'\"><b>Angika       region</b></span><span style=\"font-family:'Nirmala UI'\"> (around       Bhagalpur), depicting the fierce devotion of Bihula saving her       husband from a snakebite curse by praying to the snake goddess,       Mansa (Bishahari).</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Chhath</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">The most historic and deeply       revered solar festival of Bihar, dedicated to worshiping the       Sun God (Surya) and Chhathi Maiya.</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 24, "question": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Match the major Environmental Acts    passed by the Parliament of India with the year they were enacted,    and select the correct code from the options below:</span></p>    <table>     <col>      <col>      <thead>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>List-I (Environmental Act)</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>List-II (Year of Passing)</b></span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>     </thead>     <tbody>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>p. The Wildlife (Protection)        Act</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">1. 1974</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>q. The Water (Prevention and        Control of Pollution) Act</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">2. 1980</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>r. The Forest (Conservation)        Act</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">3. 1972</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>s. The Environment        (Protection) Act</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">4. 1986</span></p>       </td>      </tr>     </tbody>    </table>", "option1": "<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">p-3, q-1, r-2, s-4</span></p>", "option2": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">p-3, q-2, r-1, s-4</span></p>", "option3": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">p-1, q-3, r-4, s-2</span></p>", "option4": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">p-4, q-1, r-2, s-3</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: A) p-3, q-1,    r-2, s-4</b></span></p>    <ul>     <li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>The Wildlife (Protection) Act     1972:</b></span><span style=\"font-family:'Nirmala UI'\"> Enacted to     protect wild animals, birds, and plants, this landmark act     established schedules of protected plants and animals and gave     legal teeth to the creation of National Parks and Wildlife     Sanctuaries across India.</span></p>     </li>\n<li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>The Water (Prevention and     Control of Pollution) Act 1974:</b></span><span style=\"font-family:'Nirmala UI'\"> This     was India's first comprehensive legislative attempt to deal     directly with an environmental issue. It led to the establishment     of the </span><span style=\"font-family:'Nirmala UI'\"><b>Central     Pollution Control Board (CPCB)</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>State     Pollution Control Boards (SPCBs)</b></span><span style=\"font-family:'Nirmala UI'\"> to     monitor aquatic purity.</span></p>     </li>\n<li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>The Forest (Conservation) Act     1980:</b></span><span style=\"font-family:'Nirmala UI'\"> Enacted to     check rapid deforestation, this act strictly mandates that     non-forest use of forest land (like mining or infrastructure     construction) requires prior approval from the Central     Government.</span></p>     </li>\n<li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>The Environment (Protection)     Act 1986 :</b></span><span style=\"font-family:'Nirmala UI'\"> Passed     under Article 253 of the Constitution, this framework umbrella     legislation was catalyzed by the tragic </span><span style=\"font-family:'Nirmala UI'\"><b>Bhopal     Gas Tragedy (1984)</b></span><span style=\"font-family:'Nirmala UI'\">. It     empowers the Central Government to coordinate actions of state     authorities and set nationwide environmental quality standards.</span></p>    </li>\n</ul>        <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Chronology of Indian Eco-Laws:</b></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Year</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Environmental Legislation /       Rules</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Core Objective</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>1972</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Wildlife (Protection) Act</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Protecting fauna and flora;       regulating hunting and wildlife trade.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>1974 p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">X    × Y means ‘X is the sister of Y’,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">X    ÷ Y means ‘X is the wife of Y’.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Based    on the above, how is H related to L if ‘H × I ÷ J + K − L’?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Brother's father's sister </span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sister-in-law</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mother's Sister</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mother's Mother</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">‘H × I ÷ J + K − L’</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Using    the given instruction we can say that </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">H    is the sister of I and I is the wife of J, J is the father of K    and he is the brother of L</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(+)    means  male </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(-)     means female </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(|)     means generation change</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(=)     means spouse</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(—)    means  same generation</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785688651336_html_584e8790237c284e.png\" width=\"602\" height=\"243\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Above    image we can say that H is the mother's sister of L.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence    option C is  correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the number that will come in    the place of the question mark (?), if ‘+’ and ‘ – ‘ are    interchanged and ‘×’ and ‘÷’ are interchanged.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">960    x 24 ÷ 5 + [140 - {180 x 15 ÷ (65 + 12 ÷ 4)} ÷ 2 ] - 125 </span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">-523</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">-423</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">-323</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">-223</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">960 x 24 ÷ 5 + [140 - {180 x 15 ÷    (65 + 12 ÷ 4)} ÷ 2 ] - 125 </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">After    interchanging the sign we get </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">960    ÷ 24 x 5 - [140 + {180 ÷ 15 x (65 - 12 x 4)} x 2 ] + 125 </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">By    using </span><span style=\"font-family:'Nirmala UI'\"><b>BODMAS </b></span><span style=\"font-family:'Nirmala UI'\"> we    will solve this </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">⇒ <span style=\"font-family:'Nirmala UI'\">40    x 5 - [ 140 + {12 x (65-48)} x 2 ] + 125</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">⇒ <span style=\"font-family:'Nirmala UI'\">200    - [ 140 + {12 x 17} x 2 ] + 125</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">⇒ <span style=\"font-family:'Nirmala UI'\">200    - [ 140 + 204 x 2 ] + 125</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">⇒ <span style=\"font-family:'Nirmala UI'\">200    -[140 + 408] + 125 </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">⇒ <span style=\"font-family:'Nirmala UI'\">200    - 548 + 125 </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">⇒ <span style=\"font-family:'Nirmala UI'\"><b>-    223</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence    option D is correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"orphans:0;widows:0\">     <span style=\"font-family:'Nirmala UI'\">In a certain code language,    ‘bring the black board’ is coded as ‘‘ka na ta da’ and    ‘black chalk is white’ is coded as ‘ja na pa ma’and ‘bring    white chalk board’ is coded as ‘ka pa ja da’. What is code    for ‘the’ in that language?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ka</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">na</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ta</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">da</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">1.  'bring the black board'        means  'ka na ta da'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">2.     'black chalk is white'        means  'ja    na pa ma'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">3.     'bring white chalk board' means  'ka pa ja da'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">We    need the code for </span><span style=\"font-family:'Nirmala UI'\"><b>'the'</b></span><span style=\"font-family:'Nirmala UI'\"> from    the first sentence. Let's eliminate '</span><span style=\"font-family:'Nirmala UI'\"><b>bring',    'black', and 'board'.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>'black':</b></span><span style=\"font-family:'Nirmala UI'\"> Common    between lines 1 and 2 is the code </span><span style=\"font-family:'Nirmala UI'\"><b>'na'</b></span><span style=\"font-family:'Nirmala UI'\">.    So,</span><span style=\"font-family:'Nirmala UI'\"><b> black means na</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span style=\"font-family:'Nirmala UI'\"><b>'bring'    &amp; 'board':</b></span><span style=\"font-family:'Nirmala UI'\"> Both    words are common between lines 1 and 3. The codes common between    lines 1 and 3 are </span><span style=\"font-family:'Nirmala UI'\"><b>'ka'</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>'da'</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">black'    is 'na', and 'bring'/'board' use up 'ka' and 'da'. The only word    left untouched in line 1 is </span><span style=\"font-family:'Nirmala UI'\"><b>'the'</b></span><span style=\"font-family:'Nirmala UI'\">,    and the remaining code is </span><span style=\"font-family:'Nirmala UI'\"><b>'ta'</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence    option C is correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Which of the following terms will    replace the question mark (?) in the given series?</span></p>    <p style=\"orphans:0;widows:0\"> <span style=\"font-family:'Nirmala UI'\">NJAC,    OMFJ, PPKQ, ? , RVUE</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QSQX</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QRPX</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QSPV</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QSPX</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In this series the logic is   </span><span style=\"font-family:'Nirmala UI'\"><b>+1    , +3,  +5,  +7 </b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">N(14)       J(10)      A(1)      C(3)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">   <span style=\"font-family:'Nirmala UI'\">|+1          |+3        |+5          |+7</span></p>    <p style=\"orphans:0;widows:0;margin-b span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span style=\"font-family:'Nirmala UI'\">All    toys are pots.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Conclusions:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(I)    Some car are bike.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">(II)    All pots are toys.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I follows</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only II follows</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both follow.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither I nor II follow.</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Statements:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Some    toys are bike.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span style=\"font-family:'Nirmala UI'\">All    car are toys.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span style=\"font-family:'Nirmala UI'\">All    toys are pots.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">following    the statement we have drawn a venn diagram</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785688651336_html_b6cb829f26a97683.png\" width=\"339\" height=\"246\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Conclusion    (I) Some car are bike</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">There    is no direct relation between both of them so conclusion I does    not true</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Conclusion    (II) All pots are toys</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    statement tells us that ‘all toys are pots’. This cannot be    reversed to mean all pots are toys. so conclusion II also does not    follow.  </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence    option D is correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the option that is related    to the fifth term in the same way as the second term is related to    the first term and the fourth term is related to the third term.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">READER    : TVZFVT  :: SERIAL : UUTRZO :: JUNGLE : ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">LFPINU</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">LFPJNV</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">LGPJNV</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">LFPINV</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Logic: In consonant there is +2 and    in vowel the oppsotie/reverse letter of the given letter is used.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785688651336_html_dafcc088fe637bf.png\" width=\"602\" height=\"276\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Vowel    = Revesre; Consonant = +2</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>READER</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">R(18)       E(5)      A(1)      D(4)           E(5)        R(18)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span style=\"font-family:'Nirmala UI'\">|+2            |opp.    |opp.        |+2          |opp.           |+2</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span style=\"font-family:'Nirmala UI'\">T(20)       V(22)   Z(26)   F(6)             V(22)      T(20)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>SERIAL</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">S(19)        E(5)    R(18)     I(9)            A(1)          L(12)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  <span style=\"font-family:'Nirmala UI'\">|+2           |opp.    |+2          |opp.       |opp.          |+2 </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>JUNGLE</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">J(10)        U(21)    N(14)    G(7)         L(12)       E(5) </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  <span style=\"font-family:'Nirmala UI'\">|+2           |opp.     |+2          |+2         |+2             |opp.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-f ath'\"><b>⇒</b></span><span style=\"font-family:'Nirmala UI'\"><b>    b x 3 = c</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>20-50-150</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>20    x 2.5 = 50 </b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>50    x 3 = 150 </b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>now    for 6-15-45</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>6    x 2.5 = 15</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>15    x 3 = 45</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">now    we will check the all the option to find out which is correct.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Option    (a) 24-60-150</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">24    x 2.5 = 60 </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">60    x 3 =  180</span><span style=\"font-family:'Nirmala UI'\"><b> (incorrect)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Option    (b) 18-36-72</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">18    x 2.5 = 45</span><span style=\"font-family:'Nirmala UI'\"><b> (incorrect) </b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Option    (c) 12-30-90</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">12    x 2.5 = 30</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">30    x 3 = 90</span><span style=\"font-family:'Nirmala UI'\"><b> (correct)</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence    option C is correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 64, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Identify the figure given in the    options which when put in place of the question mark (?) will    loggically complete the series.</span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785688651336_html_ff9fa9e39f4e2024.png\" width=\"602\" height=\"154\" > </p>", "option1": " <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785688651336_html_c1958cf33380b8b.png\" width=\"246\" height=\"219\" > <span style=\"font-family:'Nirmala UI'\">.</span></p>", "option2": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785688651336_html_6e70fed579e11ea6.png\" width=\"246\" height=\"219\" > <span style=\"font-family:'Nirmala UI'\">.</span></p>", "option3": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785688651336_html_6fe686eb1b015298.png\" width=\"246\" height=\"219\" > <span style=\"font-family:'Nirmala UI'\">.</span></p>", "option4": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785688651336_html_75788fe12f6ef302.png\" width=\"246\" height=\"219\" > <span style=\"font-family:'Nirmala UI'\">.</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;m -v2.akamai.net.in/website/bulk_uploader_images/1785688651336_html_b54e8170be0ed250.png\" width=\"516\" height=\"464\" > </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">161</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">115</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">165</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">173</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785688651336_html_b54e8170be0ed250.png\" width=\"516\" height=\"464\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">At    most two, but at least one\" means we will  add everyone    who plays exactly 1 game plus everyone who plays exactly 2 games.    we only exclude the people who play all the three games </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(28    + 48 + 39) + (20 + 17 + 21) = 115 + 58 = 173.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence    option D is correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 69, "question": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the option figure that will    replace the question mark (?) in the figure given below to    complete the pattern</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785688651336_html_ce7d0a86646e9595.png\" width=\"257\" height=\"249\"> </p>", "option1": " <p style=\"orphans:0;widows:0\">    <img src=\"https span style=\"font-family:'Nirmala UI'\">'A    ? B' means ‘A is the mother of B’,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">'A    ! B' means ‘A is the wife of B’,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">'A    &amp; B' means ‘A is the brother of B’ </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">'A    x B' means ‘A is the father of B’.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the following means that Z is the wife's father's mother of L?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Z ? B ! T &amp; J x L</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Z ? B x T &amp; J ! L</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Z &amp; B ! T x J ? L</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Z ! B x T ? J &amp; L</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">'A ? B' means ‘A is the mother of    B’,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">'A    ! B' means ‘A is the wife of B’,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">'A    &amp; B' means ‘A is the brother of B’ </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">'A    x B' means ‘A is the father of B’.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Z    is the wife's father's mother of L</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">We    will solve all option to find the correct option.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>option    (a) Z ? B ! T &amp; J x L</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">means    Z is the mother of B, B is the wife of T, T is the brother of J    and J is the father of L</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785688651336_html_10a64f8f416344.png\" width=\"369\" height=\"417\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The    given relation is not proved by this family tree so this is    incorrect.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option    (b)</b></span><span style=\"font-family:'Nirmala UI'\"> Z ? B x T &amp;    J ! L</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">means     Z is the mother of B, B is the father of T, T is the brother    of J and J is the wife of L</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785688651336_html_89e793b01b1dfe7c.png\" width=\"276\" height=\"299\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This    family tree proves the relation between Z and L. </span></p>    <p style=\"orphans:0;widows:0\"> <span style=\"font-family:'Nirmala UI'\"><b>Hence    option B is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Statements: </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">J    </span><span style=\"font-family:'Cambria Math'\">≥</span><span style=\"font-family:'Nirmala UI'\">    W &gt; Z = B; P &lt; D &lt; B; J &lt; U = X </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Conclusions: </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">I.    X &gt; B </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">II.    J </span><span style=\"font-family:'Cambria Math'\">≥</span><span style=\"font-family:'Nirmala UI'\">    P </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">III.    U = D</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    conclusion is true for the given statement.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">None follow</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only III follows</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only II follows</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I follows</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">J </span><span style=\"font-family:'Cambria Math'\">≥</span><span style=\"font-family:'Nirmala UI'\">    W &gt; Z = B; P &lt; D &lt; B; J &lt; U = X</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">First    we will combine the statement</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  <span style=\"font-family:'Nirmala UI'\">X    = U &gt; J </span><span style=\"font-family:'Cambria Math'\">≥</span><span style=\"font-family:'Nirmala UI'\">    W &gt; Z = B &gt; D &gt; P  </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Now    check conclusion 1 by 1 </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">I.    X &gt; B (</span><span style=\"font-family:'Nirmala UI'\"><b>X = U &gt; J </b></span><span style=\"font-family:'Cambria Math'\"><b>≥</b></span><span style=\"font-family:'Nirmala UI'\"><b>    W &gt; Z = B</b></span><span style=\"font-family:'Nirmala UI'\">  &gt;    D &gt; P ) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    correct  </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">II.    J </span><span style=\"font-family:'Cambria Math'\">≥</span><span style=\"font-family:'Nirmala UI'\">    P (X = U &gt; </span><span style=\"font-family:'Nirmala UI'\"><b>J </b></span><span style=\"font-family:'Cambria Math'\"><b>≥</b></span><span style=\"font-family:'Nirmala UI'\"><b>    W &gt; Z = B  &gt; D &gt; P</b></span><span style=\"font-family:'Nirmala UI'\">)     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    incorrect</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">III.    U = D (X = </span><span style=\"font-family:'Nirmala UI'\"><b>U &gt; J    </b></span><span style=\"font-family:'Cambria Math'\"><b>≥</b></span><span style=\"font-family:'Nirmala UI'\"><b>    W &gt; Z = B  &gt; D</b></span><span style=\"font-family:'Nirmala UI'\"> &gt;    P)  </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    incorrect</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence    option D is correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Assume the statement to be entirely    true and select the inference that is logically guaranteed.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Statement:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A    smartphone manufacturer spent ₹500 crores developing a folding    screen technology. Two months before launch, a competitor released    a significantly cheaper and more durable folding screen. Instead    of scrapping their project, the manufacturer spent an additional    ₹200 crores to rush their inferior screen to the market.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Inferences:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>I.</b></span><span style=\"font-family:'Nirmala UI'\"> The    manufacturer believed that the additional ₹200 crores would make    their product superior to the competitor's screen.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>II.</b></span><span style=\"font-family:'Nirmala UI'\"> The    decision to launch was heavily influenced by the capital already    invested rather than potential future profitability alone.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>III.</b></span><span style=\"font-family:'Nirmala UI'\"> The    manufacturer will fail to recover the total ₹700 crores spent on    the project.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only inference I follows</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only inference II follows</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only inference III  follows</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both II and III follow</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Inference (I) is</span><span style=\"font-family:'Nirmala UI'\"><b> incorrect</b></span><span style=\"font-family:'Nirmala UI'\"> The    text notes the competitor's screen was significantly cheaper and    more durable, and the manufacturer rushed an inferior screen.    Nothing implies they believed they would magically surpass the    competitor with the extra cash.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Inference</span><span style=\"font-family:'Nirmala UI'\"><b> </b></span><span style=\"font-family:'Nirmala UI'\">(II)</span><span style=\"font-family:'Nirmala UI'\"><b> is    Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> The text    explicitly states their screen was inferior and more expensive    than the competitor's, yet they threw more money at it instead of    scrapping it. This is a classic textbook definition of the \"Sunk    Cost Fallacy\"—prioritizing past investments over current    market reality.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Inference    (III) is </span><span style=\"font-family:'Nirmala UI'\"><b>incorrect </b></span><span style=\"font-family:'Nirmala UI'\"> It's    a predictive trap. While it is highly likely they won't recover    the money, the passage doesn't give us market demand data, brand    loyalty data, or sales figures to guarantee a financial loss.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence    option B is correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Assume everything stated in the    statement is 100% true. Determine which of the conclusions    logically follow.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Statement:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">People    who suffer from a lack of Vitamin D frequently experience muscle    fatigue. Doctors found that most software engineers working night    shifts in City X suffer from severe Vitamin D deficiency.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusions:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>I.</b></span><span style=\"font-family:'Nirmala UI'\"> Most    software engineers working night shifts in City X are likely to    experience muscle fatigue.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>II.</b></span><span style=\"font-family:'Nirmala UI'\"> Only    software engineers working night shifts suffer from Vitamin D    deficiency.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only conclusion I follows</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only conclusion II follows</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both conclusions I and II follow</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither conclusion I nor II follow</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Conclusion I follows:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span style=\"font-family:'Nirmala UI'\">The    statement tells us two things: 1) Low Vitamin D links to muscle    fatigue, and 2) Most night-shift software engineers in City X have    low Vitamin D. Combining these two direct facts means these    specific engineers are highly prone to experiencing that fatigue.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion    II does not follows</b></span><span style=\"font-family:'Nirmala UI'\"> </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This    uses the extreme word </span><span style=\"font-family:'Nirmala UI'\"><b>\"Only\"</b></span><span style=\"font-family:'Nirmala UI'\">.    Just because this group suffers from the deficiency doesn't mean    other people (like office workers, students, or drivers) don't    have it as well.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence    option A is correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statement    and choose the option that follows.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Statements:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">I.    Banks have increased staff training on cyber security.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">II.    There has been a surge in cyber attacks.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">I is the cause and II is the    effect.</span hans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(3)</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(4)</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>The correct answer is 'Option    2'.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     sentence follows an </span><span style=\"font-family:'Nirmala UI'\"><b>emphatic     (cleft) sentence</b></span><span style=\"font-family:'Nirmala UI'\"> structure     beginning with </span><span style=\"font-family:'Nirmala UI'\"><b>\"It     was...\"</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In     a </span><span style=\"font-family:'Nirmala UI'\"><b>cleft sentence</b></span><span style=\"font-family:'Nirmala UI'\">,     the correct conjunction after the emphasized element is </span><span style=\"font-family:'Nirmala UI'\"><b>that</b></span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-family:'Nirmala UI'\"><b>not     where</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Structure:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><i>It     is/was + emphasized element + that + remaining clause.</i></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Since </span><span style=\"font-family:'Nirmala UI'\"><b>\"at     the summit in Vienna\"</b></span><span style=\"font-family:'Nirmala UI'\"> is     the emphasized place, it should be followed by </span><span style=
