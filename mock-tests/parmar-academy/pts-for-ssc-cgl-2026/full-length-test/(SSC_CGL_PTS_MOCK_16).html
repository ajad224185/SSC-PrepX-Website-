 style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>North Atlantic       Ocean</b></span><span style=\"font-family:'Nirmala UI'\"> &amp; </span><span style=\"font-family:'Nirmala UI'\"><b>Northeast       Pacific</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Hurricane</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">USA, Caribbean Islands, Mexico,       Central America</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Northwest Pacific Ocean</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Typhoon</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">China, Japan, Philippines,       Vietnam, Taiwan</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Southwest Pacific</b></span><span style=\"font-family:'Nirmala UI'\"> </span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Willy-Willy</b></span><span style=\"font-family:'Nirmala UI'\"> </span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Australia</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following statements    correctly explains the core meaning of the term \"Republic\" as    enshrined in the Preamble to the Indian Constitution?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It means that the country has a    state religion and all laws are made according to religious texts</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It means that the head of the state    is a hereditary monarch who rules for life</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It means that the head of the state    is an elected representative who holds office for a fixed tenure,    and political sovereignty vests in the people rather than a single    ruler</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It means that the Prime Minister    has supreme, absolute power and cannot be questioned by the    judiciary</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "   <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>C)    It means that the head of the state is an elected representative    who holds office for a fixed tenure, and political sovereignty    vests in the people rather than a single ruler</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    term </span><span style=\"font-family:'Nirmala UI'\"><b>\"Republic\"</b></span><span style=\"font-family:'Nirmala UI'\"> indicates    that India has a democratic polity where the ultimate power rests    with the citizens, and there is no place for hereditary rule.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     A is incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> This     describes a </span><span style=\"font-family:'Nirmala UI'\"><b>Theocracy</b></span><span style=\"font-family:'Nirmala UI'\"> (a     state governed by religious authorities or texts). India is     a </span><span style=\"font-family:'Nirmala UI'\"><b>Secular</b></span><span style=\"font-family:'Nirmala UI'\"> state,     meaning it has no official state religion and treats all     religions equally.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     B is incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> This     describes a </span><span style=\"font-family:'Nirmala UI'\"><b>Monarchy</b></span><span style=\"font-family:'Nirmala UI'\"> (such     as the British system), which is the exact opposite of a     Republic.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     D is incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> This     describes an autocracy or absolute dictatorship. In India, the     Constitution is supreme (</span><span style=\"font-family:'Nirmala UI'\"><b>Constitutional     Supremacy</b></span><span style=\"font-family:'Nirmala UI'\">), and the     judiciary holds the power of judicial review to question and     check any unconstitutional actions taken by the executive or the     legislature.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In    the context of the Indian Constitution, </span><span style=\"font-family:'Nirmala UI'\"><b>a    republican system </b></span><span style=\"font-family:'Nirmala UI'\">implies    three vital things:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Elected     Head of State:</b></span><span style=\"font-family:'Nirmala UI'\"> The     head of the state (the </span><span style=\"font-family:'Nirmala UI'\"><b>President     of India</b></span><span style=\"font-family:'Nirmala UI'\">) is elected by     the people indirectly through their elected representatives (MPs     and MLAs). They hold office for a specific, fixed term of </span><span style=\"font-family:'Nirmala UI'\"><b>5     years</b></span><span style=\"font-family:'Nirmala UI'\">. This stands in     direct contrast to a monarchy (like the United Kingdom), where     the head of state inherits the position for life.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sovereignty     in the People:</b></span><span style=\"font-family:'Nirmala UI'\"> Political     sovereignty vests entirely in the collective body of Indian     citizens, not in a single monarch or ruler.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Absence     of Privileged Class:</b></span><span style=\"font-family:'Nirmala UI'\"> In     a republic, all public offices are open to every citizen without     any discrimination. There are no hereditary privileges or     reserved seats of ultimate authority.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Words in the Preamble</b></span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Word</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Core Exam Meaning</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Sovereign</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">India is completely independent;       no foreign power can dictate its internal or external policies.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Socialist</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Democratic socialism aiming to       end poverty, ignorance, disease, and inequality of opportunity.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Secular</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">The state has no official       religion; all religions have equal status and support from the       state.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Democratic</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Government possesses authority       derived from the will of the people (via elections).</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Republic</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Elected Head of State, </b></span><span style=\"font-family:'Nirmala UI'\">hold       office for a fixed term</span><span style=\"font-family:'Nirmala UI'\"><b>;       no hereditary monarch.</b></span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785688651336_html_2e6da18d9fc5d707.png\" width=\"529\" height=\"353\" > </p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following economic    situations causes the Phillips Curve relationship to fail?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">High inflation accompanied by high    economic growth</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">High inflation accompanied by high    unemployment and stagnant growth</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Low inflation accompanied by low    unemployment</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Low inflation accompanied by low    economic growth</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is : </span><span style=\"font-family:'Nirmala UI'\"><b>B)    High inflation accompanied by high unemployment and stagnant    growth</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This    specific economic condition is known as </span><span style=\"font-family:'Nirmala UI'\"><b>Stagflation</b></span><span style=\"font-family:'Nirmala UI'\">.    It directly contradicts the traditional macroeconomic relationship    outlined by the Phillips Curve.</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Phillips     Curve</b></span><span style=\"font-family:'Nirmala UI'\"> postulates     an </span><span style=\"font-family:'Nirmala UI'\"><b>inverse </b></span><span style=\"font-family:'Nirmala UI'\">relationship     between </span><span style=\"font-family:'Nirmala UI'\"><b>inflation     and unemployment .</b></span><span style=\"font-family:'Nirmala UI'\">When     economic growth is strong, businesses expand and hire more     workers, causing </span><span style=\"font-family:'Nirmala UI'\"><b>unemployment     to fall</b></span><span style=\"font-family:'Nirmala UI'\">. As the labor     market tightens, wages rise, increasing production costs and     consumer demand, which drives </span><span style=\"font-family:'Nirmala UI'\"><b>inflation     up</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In     Stagflation,  Instead of inflation and unemployment moving     in opposite directions, </span><span style=\"font-family:'Nirmala UI'\"><b>both     rose simultaneously</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Inflation     : </b></span><span style=\"font-family:'Nirmala UI'\">Inflation is     the </span><span style=\"font-family:'Nirmala UI'\"><b>sustained     increase</b></span><span style=\"font-family:'Nirmala UI'\"> in the     general price level of goods and services in an economy over a     period of time.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Major    Economic Curves:</b></span></p>    <table>     <col>      <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Curve Name</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Relationship / Variables       Plotted</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Central Concept / Core       Message</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Key Associated Terms</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Phillips Curve</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Inflation</b></span><span style=\"font-family:'Nirmala UI'\"> vs. </span><span style=\"font-family:'Nirmala UI'\"><b>Unemployment</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Inverse relationship in the       short run; as inflation rises, unemployment falls.</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Stagflation</b></span><span style=\"font-family:'Nirmala UI'\">,       Short-run vs. Long-run curves.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Lorenz Curve</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Population       Percentile</b></span><span style=\"font-family:'Nirmala UI'\"> vs. </span><span style=\"font-family:'Nirmala UI'\"><b>Cumulative       Income/Wealth</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Graphical representation of       wealth or income distribution within an economy.</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Gini Coefficient</b></span><span style=\"font-family:'Nirmala UI'\">,       Line of Perfect Equality.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Laffer Curve</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Tax Rates</b></span><span style=\"font-family:'Nirmala UI'\"> vs. </span><span style=\"font-family:'Nirmala UI'\"><b>Total       Tax Revenue</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Shows that raising tax rates       beyond a certain point becomes counterproductive and decreases       total revenue.</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Optimal Tax Rate, Tax       Elusion/Evasion.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Kuznets Curve</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Economic Growth       (GDP)</b></span><span style=\"font-family:'Nirmala UI'\"> vs. </span><span style=\"font-family:'Nirmala UI'\"><b>Income       Inequality</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">As an economy develops, market       forces first increase and then decrease economic inequality       (Inverted-U shape).</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Structural transformation,       Trickle-down effect.</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which state emerged as the overall    champion at the inaugural Khelo India Tribal Games (KITG) 2026?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Odisha</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Karnataka</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Jharkhand</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Chhattisgarh</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: B) Karnataka</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Karnataka</b></span><span style=\"font-family:'Nirmala UI'\"> secured     the top position in the final medal tally to become the overall     champion of the first-ever Khelo India Tribal Games, which     concluded on April 3, 2026.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Karnataka     won a total of </span><span style=\"font-family:'Nirmala UI'\"><b>38     medals</b></span><span style=\"font-family:'Nirmala UI'\">, including </span><span style=\"font-family:'Nirmala UI'\"><b>23     gold</b></span><span style=\"font-family:'Nirmala UI'\">, 8 silver, and 7     bronze. </span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Khelo    India Tribal Games 2026 Facts:</b></span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Feature</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Details</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Edition</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>1st / Inaugural Edition</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Host State</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Chhattisgarh</b></span><span style=\"font-family:'Nirmala UI'\"> (Venues       across Raipur, Jagdalpur, and Surguja)</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Official Mascot</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       “<span style=\"font-family:'Nirmala UI'\"><b>Morveer”</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Nirmala UI'\"><i>Mor</i></span><span style=\"font-family:'Nirmala UI'\"> meaning       \"our own\" and </span><span style=\"font-family:'Nirmala UI'\"><i>Veer</i></span><span style=\"font-family:'Nirmala UI'\"> meaning       \"brave\")</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Top 3 States</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1st: </span><span style=\"font-family:'Nirmala UI'\"><b>Karnataka</b></span><span style=\"font-family:'Nirmala UI'\"> |       2nd: </span><span style=\"font-family:'Nirmala UI'\"><b>Odisha</b></span><span style=\"font-family:'Nirmala UI'\"> |       3rd: </span><span style=\"font-family:'Nirmala UI'\"><b>Jharkhand</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Most Successful Athlete</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Swimmer </span><span style=\"font-family:'Nirmala UI'\"><b>Manikanta       L.</b></span><span style=\"font-family:'Nirmala UI'\"> (Karnataka)       with 8 Gold and 1 Silver</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Demonstration Sports</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Traditional       sports </span><span style=\"font-family:'Nirmala UI'\"><b>Mallakhamb</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>Kabaddi</b></span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What is the maximum permissible    percentage of ministers, including the Chief Minister, relative to    the total number of seats in the Delhi Legislative Assembly?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">10%</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">15%</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">7%</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">12%</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: A) 10%</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">For     the National Capital Territory (NCT) of Delhi, the total number     of ministers, including the Chief Minister, cannot exceed </span><span style=\"font-family:'Nirmala UI'\"><b>10%</b></span><span style=\"font-family:'Nirmala UI'\"> of     the total number of members in the Legislative Assembly.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Delhi Legislative Assembly has </span><span style=\"font-family:'Nirmala UI'\"><b>70     seats</b></span><span style=\"font-family:'Nirmala UI'\">. Therefore, the     maximum number of ministers Delhi can have is exactly </span><span style=\"font-family:'Nirmala UI'\"><b>7</b></span><span style=\"font-family:'Nirmala UI'\"> (1     Chief Minister + 6 Cabinet Ministers).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Constitutional Provision:</b></span><span style=\"font-family:'Nirmala UI'\"> This     specific 10% rule for Delhi was introduced via the </span><span style=\"font-family:'Nirmala UI'\"><b>69th     Constitutional Amendment Act of 1991</b></span><span style=\"font-family:'Nirmala UI'\">,     which inserted </span><span style=\"font-family:'Nirmala UI'\"><b>Article     239AA</b></span><span style=\"font-family:'Nirmala UI'\"> into the     Indian Constitution, giving special status to Delhi.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>91st     Constitutional Amendment Act (2003)</b></span><span style=\"font-family:'Nirmala UI'\"> capped     the council of ministers at </span><span style=\"font-family:'Nirmala UI'\"><b>15%</b></span><span style=\"font-family:'Nirmala UI'\"> for     the Union Parliament (Lok Sabha) and all other State Legislative     Assemblies and amended the </span><span style=\"font-family:'Nirmala UI'\"><b>Article     75(1A) &amp; 164(1A).</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Arrange the following major    mountain ranges of the Trans-Himalayas and Himalayas in the    correct geographical order from North to South:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Zaskar     Range</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Karakoram     Range</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Pir     Panjal Range</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Ladakh     Range</span></p>    </li></ol>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 — 4 — 1 — 3</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 — 1 — 4 — 3</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">4 — 2 — 1 — 3</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 — 4 — 3 — 2</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer</span><span style=\"font-family:'Nirmala UI'\"><b>:    A) 2 — 4 — 1 — 3 (Karakoram</b></span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785688651336_html_605f329b16caeae6.gif\" > <span style=\"font-family:'Nirmala UI'\"><b>Ladakh    - Zaskar - Pir Panjal)</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Karakoram     Range (Northernmost):</b></span><span style=\"font-family:'Nirmala UI'\"> This     forms the structural crown of the Trans-Himalayan system. It     houses massive glaciers like Siachen and </span><span style=\"font-family:'Nirmala UI'\"><b>K2     (Mount Godwin-Austen)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Ladakh     Range:</b></span><span style=\"font-family:'Nirmala UI'\"> Located     just south of the Karakoram range, this Trans-Himalayan system     sits directly between two major river valleys: the </span><span style=\"font-family:'Nirmala UI'\"><b>Shyok     River</b></span><span style=\"font-family:'Nirmala UI'\"> to its north     and the </span><span style=\"font-family:'Nirmala UI'\"><b>Indus     River</b></span><span style=\"font-family:'Nirmala UI'\"> to its     south.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Zaskar     Range:</b></span><span style=\"font-family:'Nirmala UI'\"> Moving     further south across the Indus River valley, there is Zaskar     Range. </span><span style=\"font-family:'Nirmala UI'\"><b>Indus</b></span><span style=\"font-family:'Nirmala UI'\"> river     flows between Ladakh and Zanskar range </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pir     Panjal Range :</b></span><span style=\"font-family:'Nirmala UI'\"> Unlike     the first three, Pir Panjal is part of the </span><span style=\"font-family:'Nirmala UI'\"><b>Lesser     (Middle) Himalayas</b></span><span style=\"font-family:'Nirmala UI'\">. It     is located south of the main Great Himalayan range and runs south     of the Kashmir Valley.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Dhauladhar     Range:</b></span><span style=\"font-family:'Nirmala UI'\"> It is also     a vital component of the </span><span style=\"font-family:'Nirmala UI'\"><b>Lesser     (Middle) Himalayas</b></span><span style=\"font-family:'Nirmala UI'\">.     Running predominantly through </span><span style=\"font-family:'Nirmala UI'\"><b>Himachal     Pradesh</b></span><span style=\"font-family:'Nirmala UI'\">, it towers     directly over the beautiful Kangra Valley. The famous hill     station of </span><span style=\"font-family:'Nirmala UI'\"><b>Dharamshala</b></span><span style=\"font-family:'Nirmala UI'\"> sits     on the slopes of this magnificent, snow-capped \"White     Range.\"</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Shiwalik     Range (Southernmost):</b></span><span style=\"font-family:'Nirmala UI'\"> Also     known as the </span><span style=\"font-family:'Nirmala UI'\"><b>Outer     Himalayas</b></span><span style=\"font-family:'Nirmala UI'\">. This is the     youngest, lowest, and southernmost chain of the entire Himalayan     system. It acts as the final geological step before the mountains     drop completely into the Northern Plains of India.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Karakoram,    Ladakh, and Zaskar</b></span><span style=\"font-family:'Nirmala UI'\"> ranges    are geologically part of the </span><span style=\"font-family:'Nirmala UI'\"><b>Trans-Himalayas</b></span><span style=\"font-family:'Nirmala UI'\"> . </span><span style=\"font-family:'Nirmala UI'\"><b>Pir    Panjal</b></span><span style=\"font-family:'Nirmala UI'\">, and </span><span style=\"font-family:'Nirmala UI'\"><b>Dhauladhar    Range</b></span><span style=\"font-family:'Nirmala UI'\"> however,    belongs  to the </span><span style=\"font-family:'Nirmala UI'\"><b>Middle/Lesser    Himalayas</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">During the medieval period in    India, the official translation department established to    translate Sanskrit and other regional texts into Persian was known    as which of the following?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Diwan-i-Insha</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Diwan-i-Arz</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Maktab Khana</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Diwan-i-Rasalat</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: C) Maktab Khana</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Maktab     Khana</b></span><span style=\"font-family:'Nirmala UI'\"> (literally     translating to \"Bureau of Translation\" or \"Writing     House\") was a specialized department institutionalized by     the Mughal Emperor </span><span style=\"font-family:'Nirmala UI'\"><b>Akbar</b></span><span style=\"font-family:'Nirmala UI'\"> in     the late 16th century at his capital, Fatehpur Sikri.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Akbar     established this department to foster cultural integration,     minimize religious misunderstandings, and preserve elite     knowledge. Top-tier scholars, poets, and linguists (both Hindu     and Muslim, such as Faizi, Abu'l-Fazl, and Abdul Qadir Badauni)     worked collaboratively to translate major Sanskrit epics,     mathematical texts, and philosophical treatises into </span><span style=\"font-family:'Nirmala UI'\"><b>Persian</b></span><span style=\"font-family:'Nirmala UI'\">,     the official court language of the Mughals.</span></p>    </li>\n</ul>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Famous    Translations completed here:</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Mahabharata:</b></span><span style=\"font-family:'Nirmala UI'\"> Translated     into Persian and illustrated as the </span><span style=\"font-family:'Nirmala UI'\"><b>Razmnama</b></span><span style=\"font-family:'Nirmala UI'\"> (Book     of War).</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Ramayana:</b></span><span style=\"font-family:'Nirmala UI'\"> Translated     by Abdul Qadir Badauni.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Lilavati:</b></span><span style=\"font-family:'Nirmala UI'\"> A     premier Indian mathematical text written by Bhaskara II,     translated into Persian by Faizi.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Medieval Administrative Departments:</b></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Department Name</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Core Function</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Introduced By</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Maktab Khana</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Translation Bureau</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Akbar (Mughal)</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Diwan-i-Arz</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Military Department</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Balban (Delhi Sultanate)</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Diwan-i-Bandagan</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Department of Slaves</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Firoz Shah Tughlaq</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Diwan-i-Mustakhraj</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Department of Arrears (Revenue       collection)</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Alauddin Khalji</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Diwan-i-Kohi</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Department of Agriculture</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Muhammad bin Tughlaq</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The first phase (Houselisting and    Housing Census) of the upcoming national census 2027 started on:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1st January 2026</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1st April 2026</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1st May 2026</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1st  Feb 2026</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: B) 1st April    2026</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Office of the Registrar General and Census Commissioner of India     officially designated the six-month window from </span><span style=\"font-family:'Nirmala UI'\"><b>1st     April 2026 to 30th September 2026</b></span><span style=\"font-family:'Nirmala UI'\"> for     Phase I of the demographic exercise (officially designated as the     Census of 2027 operations).</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Registrar General and Census Commissioner of India for the     2026/2027 census operations is </span><span style=\"font-family:'Nirmala UI'\"><b>Shri     Mritunjay Kumar Narayan</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This     first phase is known as the </span><span style=\"font-family:'Nirmala UI'\"><b>Houselisting     and Housing Census (HLO)</b></span><span style=\"font-family:'Nirmala UI'\">. While     the overall national window spans six months, each individual     State and Union Territory selects a continuous </span><span style=\"font-family:'Nirmala UI'\"><b>30-day     period</b></span><span style=\"font-family:'Nirmala UI'\"> within this     window to carry out its specific ground operations based on local     convenience.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>For     the first time</b></span><span style=\"font-family:'Nirmala UI'\"> in     Indian history, citizens have a </span><span style=\"font-family:'Nirmala UI'\"><b>15-day     digital Self-Enumeration window</b></span><span style=\"font-family:'Nirmala UI'\"> immediately     preceding their state's designated 30-day house-to-house survey     period.</span></p>    </li>\n</ul>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Census    Phase Layout:</b></span></p>        <table>     <col>      <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Census Phase</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Official Nomenclature</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Scheduled Timeline</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Core Purpose</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Phase I</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Houselisting &amp; Housing       Census (HLO)</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>April 1, 2026 – Sept 30,       2026</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Recording house materials,       amenities, assets, and family structures.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Phase II</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Population Enumeration (PE)</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>February 2027</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><i>(</i></span><span style=\"font-family:'Nirmala UI'\">Sept       2026 for snow-bound regions</span><span style=\"font-family:'Nirmala UI'\"><i>)</i></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Headcount of individuals,       demographic profiles, and caste data.</span></p>      </td>     </tr>    </table>    <ul>     <li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">This exercise marks the </span><span style=\"font-family:'Nirmala UI'\"><b>16th     National Census</b></span><span style=\"font-family:'Nirmala UI'\"> of     India since its inception under British rule (started     non-synchronously in 1872 under Lord Mayo and synchronously in     1881 under Lord Ripon), and the </span><span style=\"font-family:'Nirmala UI'\"><b>8th     National Census</b></span><span style=\"font-family:'Nirmala UI'\"> since     Independence.</span></p>     </li>\n<li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">This is India's first ever </span><span style=\"font-family:'Nirmala UI'\"><b>fully     digital census</b></span><span style=\"font-family:'Nirmala UI'\">, where     field enumerators drop traditional paper forms and collect     real-time data using custom-built mobile applications.</span></p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following question, a    statement of Assertion (A) is followed by a statement of Reason    (R). Mark the correct choice.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Assertion    (A):</b></span><span style=\"font-family:'Nirmala UI'\"> A government    can have a high Fiscal Deficit in a given financial year even if    its Primary Deficit for that same year is zero.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Reason    (R):</b></span><span style=\"font-family:'Nirmala UI'\"> Fiscal Deficit    reflects the total borrowing requirements of the government    including interest payments on past debts, whereas Primary Deficit    isolates current fiscal imbalances by subtracting interest    obligations from the total fiscal deficit.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both (A) and (R) are true and (R)    is the correct explanation of (A)</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both (A) and (R) are true but (R)    is not the correct explanation of (A)</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(A) is true but (R) is false</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(A) is false but (R) is true</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: A) Both (A) and    (R) are true and (R) is the correct explanation of (A).</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Fiscal    Deficit occurs when a government’s total spending on expenses    like infrastructure and salaries exceeds its total revenue from    taxes and fees in a financial year. This shortfall is financed    through borrowing, adding to national debt, and is expressed as a    percentage of GDP, with a higher deficit indicating greater    reliance on borrowed funds.</span></p>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Primary    Deficit = Fiscal Deficit - Interest Payments</b></span></p>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">If    a government's Primary Deficit is zero, it implies that</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">                                   <span style=\"font-family:'Nirmala UI'\"><b>Fiscal    Deficit = Interest Payments.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Therefore,    if the government has a mountain of accumulated historical debt,    its current interest obligations will be very high, forcing a    large Fiscal Deficit even if current-year non-interest    expenditures are perfectly balanced by revenues.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Other    key Fiscal Parameters:</b></span></p>    <table>     <col>      <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Parameter</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Formula</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>What it Measures</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>2026-27 Target (BE)</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Fiscal Deficit</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Total Exp. – (Revenue Receipts       + Non-debt creating Capital Receipts)</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">The total borrowing requirement       of the government.</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>4.3% of GDP</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Revenue Deficit</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Revenue Expenditure – Revenue       Receipts</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Shortfall in daily operational       expenses (salaries, subsidies, interest).</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>1.5% of GDP</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Primary Deficit</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Fiscal Deficit – Interest       Payments</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Current year's fiscal health       without the burden of past debt/interest.</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>0.7% of GDP</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Budget Deficit</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Total Expenditure – Total       Receipts</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Total shortfall (rarely used now       as it's mostly covered by borrowing).</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Neutralized by debt</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The political biography    titled </span><span style=\"font-family:'Nirmala UI'\"><i>Believer’s    Dilemma</i></span><span style=\"font-family:'Nirmala UI'\"> launched in    September 2025, serves as the definitive sequel to the    biographical timeline of which former Indian Prime Minister?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Morarji Desai</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Atal Bihari Vajpayee</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lal Bahadur Shastri</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">P. V. Narasimha Rao</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "   <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: B) Atal Bihari    Vajpayee</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Believer’s     Dilemma: Vajpayee and the Hindu Right’s Path to Power     (1977–2018) </b></span><span style=\"font-family:'Nirmala UI'\">is     the critically acclaimed second and concluding volume of     author </span><span style=\"font-family:'Nirmala UI'\"><b>Abhishek     Choudhary's</b></span><span style=\"font-family:'Nirmala UI'\"> monumental     two-part study of </span><span style=\"font-family:'Nirmala UI'\"><b>Atal     Bihari Vajpayee</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This     volume tracks Vajpayee's political lifecycle from 1977 (starting     with his role as the External Affairs Minister in the     non-Congress Janata Party coalition) through his landmark tenures     as Prime Minister (1998–2004), up to his passing in 2018.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     widely praised first volume, titled </span><span style=\"font-family:'Nirmala UI'\"><i>Vajpayee:     The Ascent of the Hindu Right (1924–1977)</i></span><span style=\"font-family:'Nirmala UI'\">,     was released in 2023 and documented his early life, initial steps     into the RSS, and foundational years building the Bharatiya Jana     Sangh.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Famous    Biographies of Indian PMs:</b></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Book Title</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Subject (Prime Minister)</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Author / Biographer</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Believer’s Dilemma</b></span><span style=\"font-family:'Nirmala UI'\"> (2025)</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Atal Bihari Vajpayee</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Abhishek Choudhary</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Vajpayee: The Ascent of the       Hindu Right</b></span><span style=\"font-family:'Nirmala UI'\"> (2023)</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Atal Bihari Vajpayee</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Abhishek Choudhary</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>The Uncommon Prime Minister</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Inder Kumar Gujral</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Sandeep Bamzai</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>The Insider</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><i>(</i></span><span style=\"font-family:'Nirmala UI'\">Autobiographical       Fiction)</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">P. V. Narasimha Rao</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">P. V. Narasimha Rao</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Half - Lion</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">P. V. Narasimha Rao</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Vinay Sitapati</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>The Accidental Prime Minister</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Dr. Manmohan Singh</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Sanjaya Baru</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Indira: The Life of Indira       Nehru Gandhi</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Indira Gandhi</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Katherine Frank</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785688651336_html_7a6947881545d71a.png\" width=\"529\" height=\"353\" > </p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following pairs of    Articles in the Indian Constitution primarily empower the Supreme    Court and the High Courts, respectively, to punish for contempt    of court?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 32 and Article 226</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 124 and Article 214</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 129 and Article 215</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 142 and Article 144</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: C) Article 129    and Article 215</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     power to punish for contempt is a constitutional power that     cannot be taken away even by a legislative act.</span></p>     <ul>      <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article      129:</b></span><span style=\"font-family:'Nirmala UI'\"> Declares      the </span><span style=\"font-family:'Nirmala UI'\"><b>Supreme      Court</b></span><span style=\"font-family:'Nirmala UI'\"> to be a      \"Court of Record\" and grants it all the powers of such      a court, including the power to punish for contempt of itself.</span></p>      </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article      215:</b></span><span style=\"font-family:'Nirmala UI'\"> Declares      every </span><span style=\"font-family:'Nirmala UI'\"><b>High      Court</b></span><span style=\"font-family:'Nirmala UI'\"> to be a      \"Court of Record\" and grants them the identical power      to punish for contempt of themselves.</span></p>     </li>\n</ul>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">While     the Constitution grants the power, the procedure and boundaries     are regulated by the </span><span style=\"font-family:'Nirmala UI'\"><b>Contempt     of Courts Act, 1971</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Under     Section 10 of the Contempt of Courts Act 1971, a High Court has     the authority to punish for the contempt of </span><span style=\"font-family:'Nirmala UI'\"><b>subordinate     courts</b></span><span style=\"font-family:'Nirmala UI'\"> (like     District Courts) falling under its geographical jurisdiction, not     just itself.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>No     court can initiate contempt</b></span><span style=\"font-family:'Nirmala UI'\"> proceedings     after the expiry of </span><span style=\"font-family:'Nirmala UI'\"><b>one     year</b></span><span style=\"font-family:'Nirmala UI'\"> from the date     on which the contempt is alleged to have been committed.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Civil    vs. Criminal Contempt:</b></span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Type of Contempt</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Definition / Action</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Civil Contempt</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Wilful disobedience to any       judgment, decree, direction, order, writ, or wilful breach of       an undertaking given to a court.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Criminal Contempt</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">       <span style=\"font-family:'Nirmala UI'\">Publication of any matter or       doing any act which:</span></p>       <p style=\"orphans:0;widows:0;margin-bottom:0in\">•       <span style=\"font-family:'Nirmala UI'\">Scandalizes or lowers the       authority of any court.</span></p>       <p style=\"orphans:0;widows:0;margin-bottom:0in\">•       <span style=\"font-family:'Nirmala UI'\">Prejudices or interferes with       due course of any judicial proceeding.</span></p>       <p style=\"orphans:0;widows:0\">• <span style=\"font-family:'Nirmala UI'\">Obstructs       the administration of justice.</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following Indus Valley    Civilization (IVC) sites is unique for being the only fortified    city without a citadel?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kalibangan</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Harappa</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Chanhudaro</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mohenjodaro</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: C) Chanhudaro</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Standard     Indus Valley urban planning typically divided a city into two     fortified sectors: a raised </span><span style=\"font-family:'Nirmala UI'\"><b>Citadel</b></span><span style=\"font-family:'Nirmala UI'\"> (Western     part, meant for public buildings or the ruling elite) and a </span><span style=\"font-family:'Nirmala UI'\"><b>Lower     Town</b></span><span style=\"font-family:'Nirmala UI'\"> (Eastern     part, residential area for common citizens). </span><span style=\"font-family:'Nirmala UI'\"><b>Chanhudaro</b></span><span style=\"font-family:'Nirmala UI'\"> (located     in </span><span style=\"font-family:'Nirmala UI'\"><b>modern Sindh,     Pakistan</b></span><span style=\"font-family:'Nirmala UI'\">) is the     distinct exception to this rule—it is completely devoid of a     citadel division.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Chanhudaro     functioned primarily as a</span><span style=\"font-family:'Nirmala UI'\"><b> manufacturing     and craft-processing town </b></span><span style=\"font-family:'Nirmala UI'\">rather     than an administrative center.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Major    Archeological Finds at Chanhudaro:</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A     massive </span><span style=\"font-family:'Nirmala UI'\"><b>bead-making     factory</b></span><span style=\"font-family:'Nirmala UI'\"> (along     with processing tools and furnaces).</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Evidences     of</span><span style=\"font-family:'Nirmala UI'\"><b> shell-working,     bone-making, and seal-cutter</b></span><span style=\"font-family:'Nirmala UI'\"> crafts.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Small     terracotta models of bullock carts, and traces     of </span><span style=\"font-family:'Nirmala UI'\"><b>lipsticks/cosmetics</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Unique    Layout  in IVC:</b></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Site Name</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Layout Specifics</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Unique Identifier</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Chanhudaro</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>No Citadel</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Only un-citadelized town; bead       factory hub.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Dholavira</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Three-Part Division</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Divided into a Citadel, a Middle       Town, and a Lower Town; </span><span style=\"font-family:'Nirmala UI'\"><b>famous       for water reservoirs</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></
