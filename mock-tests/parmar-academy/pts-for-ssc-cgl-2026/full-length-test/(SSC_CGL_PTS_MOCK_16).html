<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>31.) SSC CGL PTS  MOCK 16 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

an style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     1 is correct: </b></span><span style=\"font-family:'Nirmala UI'\">Silapathikaram was     composed by </span><span style=\"font-family:'Nirmala UI'\"><b>Ilango     Adigal</b></span><span style=\"font-family:'Nirmala UI'\"> (an ascetic     prince, brother of the Chera king Senguttuvan). It is considered     the first and most prominent of the five great Tamil epics. It     tells the tragic story of </span><span style=\"font-family:'Nirmala UI'\"><b>Kovalan</b></span><span style=\"font-family:'Nirmala UI'\">,     his virtuous wife </span><span style=\"font-family:'Nirmala UI'\"><b>Kannagi</b></span><span style=\"font-family:'Nirmala UI'\">,     and the courtesan Madhavi in the city of Puhar.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     2 is correct:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><i>Manimekalai</i></span><span style=\"font-family:'Nirmala UI'\"> was     written by </span><span style=\"font-family:'Nirmala UI'\"><b>Chithalai     Chathanar</b></span><span style=\"font-family:'Nirmala UI'\"> . It     serves as a direct </span><span style=\"font-family:'Nirmala UI'\"><b>sequel     to Silapathikaram</b></span><span style=\"font-family:'Nirmala UI'\">,     following the life of Manimekalai, the daughter of Kovalan and     Madhavi.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     3 is incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> The </span><span style=\"font-family:'Nirmala UI'\"><b>Tolkkappiyam</b></span><span style=\"font-family:'Nirmala UI'\"> is     not a narrative epic about a king becoming an ascetic; it is     the </span><span style=\"   <span style=\"font-family:'Nirmala UI'\">Ilango Adigal</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Love, justice, and the       transformation of Kannagi into a goddess.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Manimekalai</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Seethalai Sattanar</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Social welfare, spiritual       realization.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Civaka Cintamani</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Tirutakkatevar</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">The romantic exploits of Prince       Civakan and his final renunciation.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Valayapathi</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Unknown</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Mostly lost; deals with a       merchant family and virtue.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Kundalakesi</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Nagaguttanar</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Buddhist philosophical       traditions and social practices</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Arrange the layers of the Earth's    atmosphere in the correct order starting from the closest to    Earth's surface to the top </span><span style=\"font-family:'Nirmala UI'\"><b>:</b></span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Mesosphere</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Thermosphere</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Troposphere</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Exosphere</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Stratosphere</span></p>    </li></ol>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3 — 1 — 5 — 2 — 4</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3 — 5 — 1 — 2 — 4</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">5 — 3 — 1 — 4 — 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3 — 5 — 2 — 1 — 4</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is : </span><span style=\"font-family:'Nirmala UI'\"><b>B)    3 — 5 — 1 — 2 — 4</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1.    Troposphere</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Altitude:</b></span><span style=\"font-family:'Nirmala UI'\"> Extends     up to roughly 8 km at the poles and 18 km at the equator.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key     Features:</b></span><span style=\"font-family:'Nirmala UI'\"> It is     the densest layer containing about 80% of the atmosphere's     mass. </span><span style=\"font-family:'Nirmala UI'\"><b>All weather     phenomena</b></span><span style=\"font-family:'Nirmala UI'\"> (clouds,     rain, storms) occur here.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Temperature:</b></span><span style=\"font-family:'Nirmala UI'\"> Decreases     with altitude at an average rate of </span><span style=\"font-family:'Nirmala UI'\"><b>6.5°C     per kilometer</b></span><span style=\"font-family:'Nirmala UI'\"> (known     as the </span><span style=\"font-family:'Nirmala UI'\"><b>Normal Lapse     Rate</b></span><span style=\"font-family:'Nirmala UI'\">).</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>tropopause </b></span><span style=\"font-family:'Nirmala UI'\">is     the narrow transitional boundary zone that separates the lowest     atmospheric layer (the troposphere) from the stratosphere.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>2.    Stratosphere</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Altitude:</b></span><span style=\"font-family:'Nirmala UI'\"> Extends     from the tropopause up to about 50 km.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key     Features:</b></span><span style=\"font-family:'Nirmala UI'\"> This     layer contains the </span><span style=\"font-family:'Nirmala UI'\"><b>Ozone     Layer</b></span><span style=\"font-family:'Nirmala UI'\"> (O</span><sub><span style=\"font-family:'Nirmala UI'\">3</span></sub><span style=\"font-family:'Nirmala UI'\">),     which absorbs harmful ultraviolet (UV) B &amp; C radiation from     the sun. It is almost free from clouds and turbulent weather,     making it ideal for flying </span><span style=\"font-family:'Nirmala UI'\"><b>commercial     jet aircraft</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Temperature:</b></span><span style=\"font-family:'Nirmala UI'\"> Increases     with altitude because the ozone layer absorbs UV radiation.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>3.    Mesosphere</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Altitude:</b></span><span style=\"font-family:'Nirmala UI'\"> Extends     from 50 km to about 85 km.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This     is the </span><span style=\"font-family:'Nirmala UI'\"><b>coldest     layer</b></span><span style=\"font-family:'Nirmala UI'\"> of the     atmosphere.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Meteors     burn up</b></span><span style=\"font-family:'Nirmala UI'\"> in this     layer upon entering from space due to friction.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Temperature:</b></span><span style=\"font-family:'Nirmala UI'\"> Decrease     with altitude in mesosphere</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>4.    Thermosphere</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Altitude:</b></span><span style=\"font-family:'Nirmala UI'\"> Extends     from 80 km to about 400 km.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is the</span><span style=\"font-family:'Nirmala UI'\"><b> hottest </b></span><span style=\"font-family:'Nirmala UI'\">layer     of atmosphere.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     contains the </span><span style=\"font-family:'Nirmala UI'\"><b>Ionosphere</b></span><span style=\"font-family:'Nirmala UI'\">,     a zone rich in electrically charged particles (ions) that reflect     radio waves back to Earth, enabling </span><span style=\"font-family:'Nirmala UI'\"><b>wireless     radio communication</b></span><span style=\"font-family:'Nirmala UI'\">.     The International Space Station (ISS) orbits here, and     spectacular </span><span style=\"font-family:'Nirmala UI'\"><b>Auroras</b></span><span style=\"font-family:'Nirmala UI'\"> occur     in this layer.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Temperature:</b></span><span style=\"font-family:'Nirmala UI'\"> Rises     with increasing height due to the absorption of intense solar     radiation.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>5.    Exosphere</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Altitude:</b></span><span style=\"font-family:'Nirmala UI'\"> The     outermost zone, extending beyond 400 km and gradually merging     with interplanetary space.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key     Features:</b></span><span style=\"font-family:'Nirmala UI'\"> The air     is extremely rarefied (thin) here. Extremely light gases     like </span><span style=\"font-family:'Nirmala UI'\"><b>Hydrogen and     Helium</b></span><span style=\"font-family:'Nirmala UI'\"> dominate     this layer and float off into space.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Summary</b></span></p>    <table>     <col>      <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Order (Bottom to Top)</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Layer Name</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Defining Identification       Feature</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Temperature Trend</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>1st</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Troposphere</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Weather, clouds, highest density</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Decreases</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>2nd</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Stratosphere</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Ozone layer</b></span><span style=\"font-family:'Nirmala UI'\">,       Jet planes fly here</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Increases</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>3rd</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Mesosphere</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Meteors burn up, </span><span style=\"font-family:'Nirmala UI'\"><b>Coldest       layer</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Decreases</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>4th</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Thermosphere</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Ionosphere</b></span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-family:'Nirmala UI'\"><b>hottest</b></span><span style=\"font-family:'Nirmala UI'\"> layer,       Radio communication</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Increases</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>5th</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Exosphere</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Merges with space, light gases</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Increases</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following correctly    explains the definition of the \"State\" as explicitly    mentioned under Article 12 of Part III of the Indian Constitution?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It refers only to the Government    and Parliament of India</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It includes the Government and    Parliament of India, State Governments and Legislatures, all local    authorities, and other statutory/non-statutory authorities within    India or under the control of the Government of India</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It refers only to the State    Governments and State Legislatures</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It refers to any territory    designated as a State or Union Territory under the First Schedule    of the Constitution</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>B).    It includes the Government and Parliament of India, State    Governments and Legislatures, all local authorities, and other    statutory/non-statutory authorities within India or under the    control of the Government of India</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The    Four Components of \"State\" under Article 12:</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Government and Parliament of India:</b></span><span style=\"font-family:'Nirmala UI'\"> The     executive and legislative organs of the Union government (e.g.,     the Prime Minister, Cabinet, Lok Sabha, Rajya Sabha).</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Government and Legislature of each State:</b></span><span style=\"font-family:'Nirmala UI'\"> The     executive and legislative organs of the state governments (e.g.,     Chief Ministers, Governors, Legislative assemblies and     Legislative councils).</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>All     Local Authorities:</b></span><span style=\"font-family:'Nirmala UI'\"> Institutional     bodies like Municipalities, Panchayats, District Boards,     Improvement Trusts, and Port Trusts etc.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>All     Other Authorities:</b></span><span style=\"font-family:'Nirmala UI'\"> Statutory     and non-statutory bodies that perform public or governmental     functions.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Includes    (Are part of the State):</b></span><span style=\"font-family:'Nirmala UI'\"> LIC,    ONGC, SAIL, GAIL, Electricity Boards, International Airport    Authority, and even registered societies heavily financed and    controlled by the government.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Excluded    (Are NOT part of the State):</b></span><span style=\"font-family:'Nirmala UI'\"> Private    entities, </span><span style=\"font-family:'Nirmala UI'\"><b>NCERT</b></span><span style=\"font-family:'Nirmala UI'\"> (as    per Supreme Court rulings, it is an autonomous society not    handling sovereign functions), and </span><span style=\"font-family:'Nirmala UI'\"><b>BCCI</b></span><span style=\"font-family:'Nirmala UI'\"> (Board    of Control for Cricket in India).</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Supreme Court has clarified that when courts     perform </span><span style=\"font-family:'Nirmala UI'\"><b>administrative     actions</b></span><span style=\"font-family:'Nirmala UI'\"> (like     hiring staff), they fall under Article 12. However, when     performing </span><span style=\"font-family:'Nirmala UI'\"><b>judicial     actions</b></span><span style=\"font-family:'Nirmala UI'\"> (hearing     cases and delivering judgments), they do not fall under Article     12.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785688651336_html_271293ea6d3a01c5.png\" width=\"529\" height=\"353\"> </p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The term Washington    Consensus primarily focus on which of the following core    ideas?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Advocating for strict    import-substitution policies to protect domestic markets from    foreign capital</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Implementing state-led socialist    planning and nationalization of key heavy industries</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Establishing a unified global    currency managed by a centralized world bank.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Promoting free-market economic    reforms, structural adjustment, and deregulation for developing    countries</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>D).    Promoting free-market economic reforms, structural adjustment, and    deregulation for developing countries</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Washington    Consensus</b></span><span style=\"font-family:'Nirmala UI'\"> represents    a market-oriented approach to economic development that shifted    global policy away from state-directed economic models toward    free-market capitalism.</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     A is incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> The     Washington Consensus strongly opposed </span><span style=\"font-family:'Nirmala UI'\"><b>Import     Substitution Industrialization (ISI)</b></span><span style=\"font-family:'Nirmala UI'\">,     urging countries instead to open up their domestic markets to     global competition.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     B is incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> This     describes a socialist or command economy (like the early Soviet     or pre-1991 Indian model). The Consensus advocated     for </span><span style=\"font-family:'Nirmala UI'\"><b>privatization</b></span><span style=\"font-family:'Nirmala UI'\"> and     reducing the state's footprint in business.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     C is incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> The     Consensus never suggested a single global currency; it focused on     floating, competitive national currencies.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Washington    Consensus</b></span><span style=\"font-family:'Nirmala UI'\"> : The    term was coined in </span><span style=\"font-family:'Nirmala UI'\"><b>1989</b></span><span style=\"font-family:'Nirmala UI'\"> by    economist </span><span style=\"font-family:'Nirmala UI'\"><b>John    Williamson</b></span><span style=\"font-family:'Nirmala UI'\">. It describes    a set of </span><span style=\"font-family:'Nirmala UI'\"><b>10 specific    economic policy prescriptions</b></span><span style=\"font-family:'Nirmala UI'\"> that    Washington, D.C. - based institutions —namely the </span><span style=\"font-family:'Nirmala UI'\"><b>International    Monetary Fund (IMF)</b></span><span style=\"font-family:'Nirmala UI'\">,    the </span><span style=\"font-family:'Nirmala UI'\"><b>World Bank</b></span><span style=\"font-family:'Nirmala UI'\">,    and the </span><span style=\"font-family:'Nirmala UI'\"><b>US    Department of the Treasury</b></span><span style=\"font-family:'Nirmala UI'\">—believed    were necessary to help developing countries (initially in Latin    America) recover from economic crises.</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">\"Omnis cellula-e cellula\"    cell theory was proposed by which of the following    scientists?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Robert Hooke</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Theodor Schwann</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Matthias Schleiden</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Rudolf Virchow</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>D).    Rudolf Virchow</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    Latin phrase </span><span style=\"font-family:'Nirmala UI'\"><b>\"Omnis    cellula-e cellula\"</b></span><span style=\"font-family:'Nirmala UI'\"> translates    to </span><span style=\"font-family:'Nirmala UI'\"><b>\"All cells    arise from pre-existing cells.\"</b></span><span style=\"font-family:'Nirmala UI'\"> This    was a groundbreaking addition that completed the classical Cell    Theory.</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Rudolf     Virchow (1855):</b></span><span style=\"font-family:'Nirmala UI'\"> He     modified the existing cell theory by explaining for the first     time how new cells are formed. He stated that cells     divide and new cells are derived from the division of     pre-existing cells (</span><span style=\"font-family:'Nirmala UI'\"><b>Omnis     cellula-e cellula</b></span><span style=\"font-family:'Nirmala UI'\">).</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Matthias     Schleiden &amp; Theodor Schwann :</b></span><span style=\"font-family:'Nirmala UI'\"> They     jointly formulated the initial </span><span style=\"font-family:'Nirmala UI'\"><b>Cell     Theory in 1838</b></span><span style=\"font-family:'Nirmala UI'\">. Their     initial theory </span><span style=\"font-family:'Nirmala UI'\"><b>failed     to explain how new cells were formed</b></span><span style=\"font-family:'Nirmala UI'\">,     which Virchow later resolved.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Cell     theory</b></span><span style=\"font-family:'Nirmala UI'\"> as     understood today is:</span></p>    </li>\n</ul>    <ol>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">All     living organisms are composed of cells and products of cells.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">All     cells arise from pre-existing cells.</span></p>    </li>\n</ol>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Scientist-Contribution: </b></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Scientist</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Year</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Milestone Contribution to       Biology</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Robert Hooke</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1665</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Discovered </span><span style=\"font-family:'Nirmala UI'\"><b>dead       cells</b></span><span style=\"font-family:'Nirmala UI'\"> (cork).</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Anton von Leeuwenhoek</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1674</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Discovered </span><span style=\"font-family:'Nirmala UI'\"><b>first       living cell</b></span><span style=\"font-family:'Nirmala UI'\"> in       pond water</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Schleiden &amp; Schwann</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1838</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Formulated the basic </span><span style=\"font-family:'Nirmala UI'\"><b>Cell       Theory</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Robert Brown</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1831</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Discovered the </span><span style=\"font-family:'Nirmala UI'\"><b>Nucleus</b></span><span style=\"font-family:'Nirmala UI'\"> in       a cell.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Rudolf Virchow</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1855</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>\"Omnis cellula-e       cellula\"</b></span><span style=\"font-family:'Nirmala UI'\"> (Cell       division).</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following temples in    India is famously referred to as the \"White Pagoda\" by    European sailors?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sun Temple, Konark</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lingaraj Temple, Bhubaneswar</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Jagannath Temple, Puri</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kamakhya Temple, Guwahati</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is : </span><span style=\"font-family:'Nirmala UI'\"><b>C)    Jagannath Temple, Puri</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">During    the colonial era, European sailors navigating the Bay of Bengal    used the prominent coastal temples of Odisha as landmarks. They    gave them distinct architectural nicknames based on their color    and appearance from the sea.</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     White Pagoda (Jagannath Temple, Puri):</b></span><span style=\"font-family:'Nirmala UI'\"> The     massive, whitewashed </span><span style=\"font-family:'Nirmala UI'\"><i>shikhara</i></span><span style=\"font-family:'Nirmala UI'\"> (tower)     of this 12th-century temple stood out clearly against the dark     coastal horizon, earning it the name </span><span style=\"font-family:'Nirmala UI'\"><b>White     Pagoda</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Black Pagoda (Sun Temple, Konark):</b></span><span style=\"font-family:'Nirmala UI'\"> Conversely,     the Sun Temple at Konark was constructed using dark sandstone and     granite. Its dark silhouette against the sky led sailors to call     it the </span><span style=\"font-family:'Nirmala UI'\"><b>Black     Pagoda</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li>\n</ul>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Facts about Jagannath Temple</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Architects:</b></span><span style=\"font-family:'Nirmala UI'\"> The     construction of the temple was initiated by King </span><span style=\"font-family:'Nirmala UI'\"><b>Anantavarman     Chodaganga Deva</b></span><span style=\"font-family:'Nirmala UI'\"> of     the Eastern Ganga Dynasty in the 12th century.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Deities:</b></span><span style=\"font-family:'Nirmala UI'\"> It     is dedicated to </span><span style=\"font-family:'Nirmala UI'\"><b>Lord     Jagannath (a form of Lord Vishnu</b></span><span style=\"font-family:'Nirmala UI'\">),     along with his siblings </span><span style=\"font-family:'Nirmala UI'\"><b>Balabhadra</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>Subhadra</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Char     Dham:</b></span><span style=\"font-family:'Nirmala UI'\"> It is one of     the highly revered </span><span style=\"font-family:'Nirmala UI'\"><b>Char     Dham</b></span><span style=\"font-family:'Nirmala UI'\"> pilgrimage     sites in India (alongside Badrinath, Dwarka, and Rameswaram).</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Overview    of Other Temples:</b></span></p>        <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Temple</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Location</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Key Feature / Significance</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Sun Temple</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Konark, Odisha</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Built by King Narasimhadeva I;       shaped like a giant cosmic chariot; a UNESCO World Heritage       Site (</span><span style=\"font-family:'Nirmala UI'\"><b>Black Pagoda</b></span><span style=\"font-family:'Nirmala UI'\">).</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Lingaraj Temple</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Bhubaneswar, Odisha</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Dedicated to Lord Shiva;       represents the pinnacle of the </span><span style=\"font-family:'Nirmala UI'\"><b>Kalinga       architectural style</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Kamakhya Temple</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Guwahati, Assam</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Located on the Nilachal Hills;       one of the oldest and most prominent </span><span style=\"font-family:'Nirmala UI'\"><b>Shakti       Peethas</b></span><span style=\"font-family:'Nirmala UI'\"> in       India, famous for the </span><span style=\"font-family:'Nirmala UI'\"><b>Ambubachi       Mela.</b></span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 7, "question": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Match the land revenue systems    introduced during British rule in India with their respective    primary regions of implementation and select the correct code:</span></p>    <table>     <col>      <col>      <thead>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>List-I (Revenue System)</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>List-II (Primary Region)</b></span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>     </thead>     <tbody>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">(a) Permanent Settlement</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">(1) Madras and Bombay </span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">(b) Ryotwari Settlement</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">(2) Punjab, North-West        Provinces, and Awadh</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">(c) Mahalwari Settlement</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">(3) Bengal, Bihar, and Odisha</span></p>       </td>      </tr>     </tbody>    </table>", "option1": "<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">(a)-3, (b)-1, (c)-2</span></p>", "option2": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">(a)-3, (b)-2, (c)-1</span></p>", "option3": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">(a)-1, (b)-3, (c)-2</span></p>", "option4": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">(a)-2, (b)-1, (c)-3</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>A).    (a)-3, (b)-1, (c)-2</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>(a) Permanent Settlement -    Bengal, Bihar, and Odisha</b></span></p>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Introduced by:</b></span><span style=\"font-family:'Nirmala UI'\"> Lord     Cornwallis in </span><span style=\"font-family:'Nirmala UI'\"><b>1793</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Key Feature: </b></span><span style=\"font-family:'Nirmala UI'\">Under     the Zamindari system, the land revenue was collected from the     farmers by the intermediaries known as Zamnidars</span><span style=\"font-family:'Nirmala UI'\"><b>.</b></span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">The revenue demand was fixed in     perpetuity, but the Zamindars had to pay this fixed sum by a     strict deadline on the due date. If landlords (zamindars) failed     to deposit their fixed land revenue to the state treasury by     sunset on the designated due date, their estates would be     confiscated and auctioned off to the highest bidder </span><span style=\"font-family:'Nirmala UI'\"><b>(Sunset     Clause)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>(b) Ryotwari Settlement - Madras    and  Bombay</b></span></p>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Introduced by:</b></span><span style=\"font-family:'Nirmala UI'\"> Thomas     Munro and Alexander Read in </span><span style=\"font-family:'Nirmala UI'\"><b>1820</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Key Feature:</b></span><span style=\"font-family:'Nirmala UI'\"> The     British bypassed middlemen (Zamindars) and made the settlement     directly with the individual cultivators (</span><span style=\"font-family:'Nirmala UI'\"><b>Ryots</b></span><span style=\"font-family:'Nirmala UI'\">). </span></p>    </li></ul>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>(c) Mahalwari Settlement -    Punjab, North-West Provinces, and Awadh</b></span></p>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Introduced by:</b></span><span style=\"font-family:'Nirmala UI'\"> Holt     Mackenzie in </span><span style=\"font-family:'Nirmala UI'\"><b>1822</b></span><span style=\"font-family:'Nirmala UI'\"> (later     reformed under William Bentinck in 1833).</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Key Feature:</b></span><span style=\"font-family:'Nirmala UI'\"> The     unit of revenue assessment was the village or estate (</span><span style=\"font-family:'Nirmala UI'\"><b>Mahal</b></span><span style=\"font-family:'Nirmala UI'\">).     The entire village community was held collectively responsible     for paying the tax, managed via the village headman.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding tropical cyclones and identify which of the following    is/are correct?</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1.</b></span><span style=\"font-family:'Nirmala UI'\"> Tropical    cyclones develop over warm ocean waters with sea surface    temperatures generally above 27°C.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>2. </b></span><span style=\"font-family:'Nirmala UI'\">The    eye of a tropical cyclone is a region of extremely high    atmospheric pressure with calm winds and clear skies.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>3. </b></span><span style=\"font-family:'Nirmala UI'\">Due    to the Coriolis effect, winds rotate in a counter-clockwise    direction around a cyclone in the Northern Hemisphere and    clockwise in the Southern Hemisphere.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">All Statements are correct</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Statement I and II are correct</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Statement II and III are    correct</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Statement I and III are    correct</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>D).    Only Statement I and III are correct</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     1 is correct:</b></span><span style=\"font-family:'Nirmala UI'\"> Tropical     cyclones require a tremendous amount of thermal energy to form     and sustain themselves. They only develop over warm tropical     oceans where the sea surface temperature (SST) is     consistently </span><span style=\"font-family:'Nirmala UI'\"><b>above     27°C</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     2 is incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> While     the </span><span style=\"font-family:'Nirmala UI'\"><b>eye</b></span><span style=\"font-family:'Nirmala UI'\"> of     a tropical cyclone is indeed a calm region with clear skies and     sinking air, it is a area of </span><span style=\"font-family:'Nirmala UI'\"><b>extremely     low atmospheric pressure</b></span><span style=\"font-family:'Nirmala UI'\">,     not high pressure. In fact, the lowest surface pressure of the     entire storm system is found at the very center of the eye.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     3 is correct:</b></span><span style=\"font-family:'Nirmala UI'\"> The </span><span style=\"font-family:'Nirmala UI'\"><b>Coriolis     effect</b></span><span style=\"font-family:'Nirmala UI'\"> (caused by     the Earth's rotation) deflects moving air to the right in the     Northern Hemisphere and to the left in the Southern Hemisphere.     Because winds rush inward toward the low-pressure center, this     deflection causes a </span><span style=\"font-family:'Nirmala UI'\"><b>counter-clockwise</b></span><span style=\"font-family:'Nirmala UI'\"> rotation     in the Northern Hemisphere and a </span><span style=\"font-family:'Nirmala UI'\"><b>clockwise</b></span><span style=\"font-family:'Nirmala UI'\"> rotation     in the Southern Hemisphere.</span></p>    </li>\n</ul>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A </span><span style=\"font-family:'Nirmala UI'\"><b>Tropical    Cyclone </b></span><span style=\"font-family:'Nirmala UI'\">is a large,    non-frontal low-pressure system that forms over tropical or    subtropical waters. It is characterised by organised thunderstorm    activity and a closed cyclonic wind circulation around a central    calm region known as the eye.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Favourable    Conditions for Tropical Cyclone Formation:</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A     warm sea surface (temperature </span><span style=\"font-family:'Nirmala UI'\"><b>&gt;     27°C</b></span><span style=\"font-family:'Nirmala UI'\">).</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Presence     of the </span><span style=\"font-family:'Nirmala UI'\"><b>Coriolis     force</b></span><span style=\"font-family:'Nirmala UI'\"> (cyclones     cannot form at the Equator, between 0° and 5° latitude, because     the Coriolis force is zero there).</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Small     variations in vertical wind speed.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A     pre-existing weak low-pressure area or low-level cyclonic vortex.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Upper-level     divergence (allows the rising air to pump out of the top of the     storm).</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Regional    Names of Tropical Cyclones</b></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Region / Ocean Basin</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Local Name</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Affected Areas</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Indian Ocean</b></span><span style=\"font-family:'Nirmala UI'\"> (Bay       of Bengal &amp; Arabian Sea)</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Cyclone</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">India, Bangladesh, Pakistan, Sri       Lanka, Oman</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td
