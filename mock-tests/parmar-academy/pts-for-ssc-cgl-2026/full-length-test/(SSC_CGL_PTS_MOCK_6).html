pan><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     irrigation + drinking water + hydro power</b></span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Tehri </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     multi-purpose (power, irrigation, flood control)</b></span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Rana Pratap Sagar </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     hydroelectric power generation</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following trees is    typically found outside the tropical evergreen forest ecosystem of    India?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Rosewood</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mahogany</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Amaltas</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ebony</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: (c) Amaltas</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Amaltas     is </span><span style=\"font-family:'Nirmala UI'\"><b>not found in     tropical evergreen forests</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is commonly found in </span><span style=\"font-family:'Nirmala UI'\"><b>tropical     deciduous forests and dry regions</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Rosewood,     Mahogany, and Ebony</b></span><span style=\"font-family:'Nirmala UI'\"> are     typical trees of </span><span style=\"font-family:'Nirmala UI'\"><b>tropical     evergreen forests</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Facts</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Evergreen     trees: Rosewood, Mahogany, Ebony</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Amaltas     </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     Deciduous forest tree</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Evergreen     forests: </span><span style=\"font-family:'Nirmala UI'\"><b>dense,     high rainfall areas (Western Ghats, NE India)</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding the Union Executive of India:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Prime Minister is a part of the Union Executive.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     President is a part of the Union Executive.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Supreme Court is a part of the Union Executive.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Council of Ministers is a part of the Union Executive.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the above statements is/are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 1, 2 and 4 are correct</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 1 and 2 are correct</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 3 and 4 are correct</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">All statements are correct</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Answer: (A) Only 1, 2 and 4 are    correct</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Prime     Minister</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     part of Union Executive because he </span><span style=\"font-family:'Nirmala UI'\"><b>leads     the Council of Ministers and runs the government</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Correct</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>President</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     part of Union Executive because </span><span style=\"font-family:'Nirmala UI'\"><b>all     executive powers are formally vested in him (Articles 52–53)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Correct</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Supreme     Court of India </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>NOT     part of Executive</b></span><span style=\"font-family:'Nirmala UI'\">, it     belongs to </span><span style=\"font-family:'Nirmala UI'\"><b>Judiciary     and interprets laws</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Incorrect</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Council     of Ministers</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     part of Executive because it </span><span style=\"font-family:'Nirmala UI'\"><b>actually     exercises powers on behalf of the President (Article 74)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Correct</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Facts</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Real     executive </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     Prime Minister + Council of Ministers</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Nominal     executive </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     President</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Executive     vs Judiciary </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     law execution vs law interpretation</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Vice     President is also part of Union Executive (constitutional post)</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Under the e-Zero FIR system,    complaints exceeding which amount are automatically registered as    an FIR?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">5 lakh</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">10 lakh</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">50 lakh</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">1 lakh</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Answer: (b) ₹10 lakh</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Under </span><span style=\"font-family:'Nirmala UI'\"><b>e-Zero     FIR system</b></span><span style=\"font-family:'Nirmala UI'\">, complaints     above </span><span style=\"font-family:'Nirmala UI'\"><b>₹10     lakh</b></span><span style=\"font-family:'Nirmala UI'\"> are </span><span style=\"font-family:'Nirmala UI'\"><b>automatically     registered as FIR</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Used     mainly for </span><span style=\"font-family:'Nirmala UI'\"><b>cyber     financial fraud cases</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Ensures </span><span style=\"font-family:'Nirmala UI'\"><b>quick     action without jurisdiction delay</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Facts</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Threshold:     ₹10 lakh</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Linked     with </span><span style=\"font-family:'Nirmala UI'\"><b>Indian Cyber     Crime Coordination Centre</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Helpline: </span><span style=\"font-family:'Nirmala UI'\"><b>1930</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Which of the following statements    is/are correct regarding the Monetary Policy Committee (MPC)?</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     decides the RBI’s benchmark interest rates.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is a 12-member body including the Governor of RBI and is     reconstituted every year.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">It     functions under the chairmanship of the Union Finance Minister.</span></p>    </li></ol>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 1</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 1 and 2</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 3</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 2 and 3</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: (a) Only 1</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    1: Correct</b></span><span style=\"font-family:'Nirmala UI'\"><br> The </span><span style=\"font-family:'Nirmala UI'\"><b>Monetary    Policy Committee (MPC)</b></span><span style=\"font-family:'Nirmala UI'\"> decides    the </span><span style=\"font-family:'Nirmala UI'\"><b>RBI’s    benchmark interest rate (repo rate)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    2: Incorrect</b></span><span style=\"font-family:'Nirmala UI'\"><br> The    MPC is a </span><span style=\"font-family:'Nirmala UI'\"><b>6-member    body</b></span><span style=\"font-family:'Nirmala UI'\">, not 12 members.<br> It    consists of:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>3     members from RBI (including the Governor)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>3     external members appointed by the Government</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It    is </span><span style=\"font-family:'Nirmala UI'\"><b>not reconstituted    every year</b></span><span style=\"font-family:'Nirmala UI'\">; members have    a </span><span style=\"font-family:'Nirmala UI'\"><b>fixed tenure    (generally 4 years for external members)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    3: Incorrect</b></span><span style=\"font-family:'Nirmala UI'\"><br> The    MPC is chaired by the </span><span style=\"font-family:'Nirmala UI'\"><b>Governor    of RBI</b></span><span style=\"font-family:'Nirmala UI'\">, not the Union    Finance Minister.</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In a fixed exchange rate regime,    what is the effect of currency devaluation?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Imports become cheaper while    exports become costlier</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Domestic prices fall automatically</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Exports become cheaper while    imports become costlier</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Trade balance remains unchanged</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Answer: (c) Exports become    cheaper while imports become costlier</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Currency     devaluation</b></span><span style=\"font-family:'Nirmala UI'\"> means     the </span><span style=\"font-family:'Nirmala UI'\"><b>value of     domestic currency falls</b></span><span style=\"font-family:'Nirmala UI'\"> in     a fixed exchange rate system</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">As     a result, </span><span style=\"font-family:'Nirmala UI'\"><b>exports     become cheaper</b></span><span style=\"font-family:'Nirmala UI'\"> for     foreign buyers </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     increase in exports</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Imports     become costlier</b></span><span style=\"font-family:'Nirmala UI'\"> for     domestic consumers </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     decrease in imports</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This     helps in </span><span style=\"font-family:'Nirmala UI'\"><b>improving     trade balance (reducing deficit)</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Facts</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Used     in </span><span style=\"font-family:'Nirmala UI'\"><b>fixed exchange     rate regime (government decision)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Opposite     of </span><span style=\"font-family:'Nirmala UI'\"><b>revaluation</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Aims     to boost </span><span style=\"font-family:'Nirmala UI'\"><b>exports     and reduce imports</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Identify the force that requires    direct contact between objects to operate.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Frictional force</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gravitational force</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Electrostatic force</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Magnetic force</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Answer: (a) Frictional force</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Frictional     force</b></span><span style=\"font-family:'Nirmala UI'\"> acts only     when </span><span style=\"font-family:'Nirmala UI'\"><b>two surfaces     are in direct contact</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     opposes the </span><span style=\"font-family:'Nirmala UI'\"><b>relative     motion</b></span><span style=\"font-family:'Nirmala UI'\"> between     objects</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Gravitational     force, Electrostatic force, and Magnetic force are </span><span style=\"font-family:'Nirmala UI'\"><b>non-contact     forces</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Facts</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Contact     force </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     Friction</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Non-contact     forces </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     Gravitational, Electrostatic, Magnetic</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Friction     always acts </span><span style=\"font-family:'Nirmala UI'\"><b>opposite     to motion</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Which of the following statements    is/are correct regarding haemoglobin in humans?</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In     humans, it is the respiratory pigment.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">It     has very low affinity for oxygen.</span></p>    </li></ol>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 1</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 2</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both 1 and 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither 1 nor 2</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Answer: (A) Only I</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Haemoglobin     is the </span><span style=\"font-family:'Nirmala UI'\"><b>respiratory     pigment in humans</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Statement 1 (Correct)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It </span><span style=\"font-family:'Nirmala UI'\"><b>binds     oxygen in lungs (oxyhaemoglobin)</b></span><span style=\"font-family:'Nirmala UI'\"> and     releases it in tissues</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     has </span><span style=\"font-family:'Nirmala UI'\"><b>high affinity     for oxygen</b></span><span style=\"font-family:'Nirmala UI'\">, not low </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Statement 2 (Incorrect)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Also     helps in </span><span style=\"font-family:'Nirmala UI'\"><b>transport     of carbon dioxide (partially)</b></span><span style=\"font-family:'Nirmala UI'\"> and     maintains </span><span style=\"font-family:'Nirmala UI'\"><b>blood pH     (buffer action)</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Facts</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Location:     Red Blood Cells (RBCs)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Structure:     4 polypeptide chains (globin) + heme (iron Fe²</b></span><span style=\"font-family:'Cambria Math'\"><b>⁺</b></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>One     Hb molecule carries 4 O</b></span><span style=\"font-family:'Cambria Math'\"><b>₂</b></span><span style=\"font-family:'Nirmala UI'\"><b>     molecules</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Deficiency     </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     Anaemia</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The ‘Law of Octaves’ proposed    by John Newlands was based on arranging elements in:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Descending order of atomic mass</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Descending order of atomic number</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ascending order of atomic mass</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ascending order of atomic number</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Answer: (c) Ascending order of    atomic mass</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">John     Newlands arranged elements in </span><span style=\"font-family:'Nirmala UI'\"><b>increasing     atomic mass</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">He     observed that </span><span style=\"font-family:'Nirmala UI'\"><b>every     8th element shows similar properties</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     called </span><span style=\"font-family:'Nirmala UI'\"><b>Law of     Octaves</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Pattern     was similar to </span><span style=\"font-family:'Nirmala UI'\"><b>musical     notes (Sa Re Ga Ma…)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Worked     well only up to </span><span style=\"font-family:'Nirmala UI'\"><b>calcium</b></span><span style=\"font-family:'Nirmala UI'\">,     failed for heavier elements</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Facts</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Basis:     Atomic mass (NOT atomic number)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Repetition:     every 8th element</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Limitation:     failed beyond Ca</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bal Gandharva, originally named    Narayanrao Rajhans, was a prominent figure in the music tradition    of which state?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gujarat</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Haryana</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Maharashtra</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Meghalaya</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Answer: (c) Maharashtra</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Bal     Gandharva (real name: Narayanrao Rajhans) was a legendary figure     of </span><span style=\"font-family:'Nirmala UI'\"><b>Marathi theatre     and music</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">He     was associated with </span><span style=\"font-family:'Nirmala UI'\"><b>Sangeet     Natak (musical drama tradition)</b></span><span style=\"font-family:'Nirmala UI'\"> of     Maharashtra</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Famous     for playing </span><span style=\"font-family:'Nirmala UI'\"><b>female     roles in plays</b></span><span style=\"font-family:'Nirmala UI'\"> during     early theatre period</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Facts</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Field:     Marathi music and theatre</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Known     for: Sangeet Natak tradition</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Nickname     “Bal Gandharva” given by Lokmanya Tilak</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    about the book </span><span style=\"font-family:'Nirmala UI'\"><i>The    Absolutely True Diary of a Part-Time Indian</i></span><span style=\"font-family:'Nirmala UI'\">:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     received the Pulitzer Prize for Fiction due to its unique     narrative style and significant influence on American historical     literature.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     novel won the National Book Award for its depiction of Native     American identity and youth struggles.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the above statements is/are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only statement 1 is correct</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only statement 2 is correct</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both statements 1 and 2 are correct</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither statement 1 nor 2 is    correct</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Answer: (b) Only statement 2 is    correct</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Absolutely True Diary of a Part-Time Indian </span><span style=\"font-family:'Nirmala UI'\"><b>did     NOT receive the Pulitzer Prize</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Statement 1 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Incorrect</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     book </span><span style=\"font-family:'Nirmala UI'\"><b>won the     National Book Award (2007)</b></span><span style=\"font-family:'Nirmala UI'\"> for </span><span style=\"font-family:'Nirmala UI'\"><b>Young     People’s Literature</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Statement 2 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Correct</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     highlights </span><span style=\"font-family:'Nirmala UI'\"><b>Native     American identity, poverty, and youth struggles</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Facts</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Author:     Sherman Alexie</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Award:     National Book Award (2007)</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Pulitzer     Prize: NOT awarded to this book</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following temples is a    prime example of Kalinga architecture, featuring a    tall </span><span style=\"font-family:'Nirmala UI'\"><i>shikhara</i></span><span style=\"font-family:'Nirmala UI'\"> (Rekha    Deul) and elaborate carvings?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Konark Sun Temple</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Khajuraho Temple</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Meenakshi Temple</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lingaraja Temple</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Answer: (d) Lingaraja Temple</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Lingaraja     Temple is a classic example of </span><span style=\"font-family:'Nirmala UI'\"><b>Kalinga     architecture</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     features a </span><span style=\"font-family:'Nirmala UI'\"><b>tall     Rekha Deul (curvilinear shikhara)</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>rich     stone carvings</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Located     in Bhubaneswar, known as the </span><span style=\"font-family:'Nirmala UI'\"><b>“Temple     City of India”</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Represents     the </span><span style=\"font-family:'Nirmala UI'\"><b>mature phase of     Kalinga temple style</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Facts</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Style:     Kalinga architecture (Odisha style)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Main     feature: Rekha Deul (towering shikhara)</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Deity:     Lord Shiva</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Read the following statements    marked as Assertion (A) and Reason (R):</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Assertion    (A):</b></span><span style=\"font-family:'Nirmala UI'\"> Artists of the    period 200 B.C. – 300 A.D. often carved nature-inspired scenes    on stupas.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Reason    (R):</b></span><span style=\"font-family:'Nirmala UI'\"> These carvings    were part of secular artistic expression blended with religious    themes.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the following is correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both A and R are true, and R is the    correct explanation of A</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both A and R are true, but R is not    the correct explanation of A</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A is true, but R is false</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A is false, but R is true</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Answer: (A) Both A and R are    true, and R is the correct explanation of A</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">During </span><span style=\"font-family:'Nirmala UI'\"><b>200     B.C. – 300 A.D.</b></span><span style=\"font-family:'Nirmala UI'\">,     stupa art (like Sanchi Stupa and Bharhut Stupa) included </span><span style=\"font-family:'Nirmala UI'\"><b>nature     scenes, animals, trees, and daily life</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Assertion</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">These     carvings were not purely religious; they reflected </span><span style=\"font-family:'Nirmala UI'\"><b>social     life and secular themes along with Buddhist ideas</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Reason</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>nature-inspired     carvings existed because artists blended secular expression with     religious symbolism</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     correct explanation</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Facts</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Art     period: 200 BCE – 300 CE (early historic/Buddhist art)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Themes:     Jataka tales, flora-fauna, daily life</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Style:     Symbolism (Buddha shown via symbols like Bodhi tree, footprints)</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the option that is closest    in meaning to the underlined idiom.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In    the tense post-merger environment, senior managers were </span><span style=\"font-family:'Nirmala UI'\"><u>walking    on eggshells</u></span><span style=\"font-family:'Nirmala UI'\"> to    prevent further internal conflict.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Trying to dominate the discussion</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Acting with great caution and    diplomacy</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ignoring the internal disputes</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Planning major policy changes</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>to     walk on eggshells (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>अत्यधिक     सावधानी बरतना</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> —     to be extremely cautious about one's words or actions around     someone to avoid offending them or triggering a negative     reaction.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     idiom </span><span style=\"font-family:'Nirmala UI'\"><b>“walk on     eggshells”</b></span><span style=\"font-family:'Nirmala UI'\"> comes     from the </span><span style=\"font-family:'Nirmala UI'\"><b>literal     idea of walking on broken eggshells</b></span><span style=\"font-family:'Nirmala UI'\">,     which would require </span><span style=\"font-family:'Nirmala UI'\"><b>extreme     care and balance</b></span><span style=\"font-family:'Nirmala UI'\"> because     eggshells are very fragile and can easily break or cause you to     slip.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option B is the correct answer.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate synonym    of the word “Imminent.”</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Distant</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Delayed</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Approaching</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Unlikely</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Imminent</b></span><span style=\"font-family:'Nirmala UI'\"> means     about to happen very soon.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Approaching</b></span><span style=\"font-family:'Nirmala UI'\"> matches     this meaning perfectly.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Distant</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     far away</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Delayed</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     postponed</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Unlikely</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     not expected to happen</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option C is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the incorrectly spelt word:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">maintenance</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">questionnaire</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ocurrence</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">paraphernalia</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Maintenance</b></span><span style=\"font-family:'Nirmala UI'\"> –     the act of keeping something in good condition (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>रखरखाव     </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/     </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>देखभाल</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Questionnaire</b></span><span style=\"font-family:'Nirmala UI'\"> –     a set of written questions for collecting information     (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>प्रश्नावली</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Ocurrence</b></span><span style=\"font-family:'Nirmala UI'\"> –     Incorrect spelling<br> Correct spelling </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Occurrence</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>घटना     </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/ </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>घटित     होना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Paraphernalia</b></span><span style=\"font-family:'Nirmala UI'\"> –     a collection of equipment or items used for a particular activity     (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>सामान     </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/     </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>उपकरणों     का समूह</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option C is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate synonym    of the word “Recalcitrant.”</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Obedient</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Defiant</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lucid</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Pragmatic</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Recalcitrant</b></span><span style=\"font-family:'Nirmala UI'\"> –     stubbornly resistant to authority or control; refusing to obey     rules (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>हठी     </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/ </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>आदेश     न मानने वाला </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/     </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>विद्रोही</span></span></span></span><span style=\"font-family:'Nirmala UI'\">).</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Synonyms:</b></span><span style=\"font-family:'Nirmala UI'\"> Defiant,      obstinate, rebellious, intractable, uncooperative</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Antonyms:</b></span><span style=\"font-family:'Nirmala UI'\"> Obedient,      compliant, submissive, cooperative</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Obedient</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>आज्ञाकारी</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)     – </span><span style=\"font-family:'Nirmala UI'\">willing to obey</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Defiant</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>विद्रोही     </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/     </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>अवज्ञाकारी</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)     – </span><span style=\"font-family:'Nirmala UI'\">openly resisting     authority</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Lucid</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>स्पष्ट</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)     – </span><span style=\"font-family:'Nirmala UI'\">clear and easy to     understand</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pragmatic</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>व्यावहारिक</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)     – </span><span style=\"font-family:'Nirmala UI'\">practical</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option B is the correct answer.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriat pan style=\"font-family:'Nirmala UI'\"><b>State     of excitement</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     enthusiasm</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>State     of disuse</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     desuetude</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>State     of confusion</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     perplexity</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>State     of poverty</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     destitution</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option B is the correct answer.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Convert the following active voice    sentence into passive voice:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    committee had rejected the proposal before the board reviewed the    final report.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The proposal had been rejected by    the committee before the final report was reviewed by the board.</span></p>", "option2": " <p style=\"orphan     question mark?</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">12,    36, 9, 45, 7.5, ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">51.2</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">52.5</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">45.5</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">51.5</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Observe the jump between the    numbers in the given series,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1782628654775_html_8a5ae93676b8d190.png\" width=\"250\" height=\"84\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Apply    this pattern to 7.5</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">7.5     × 7 = </span><span style=\"font-family:'Nirmala UI'\"><b>52.5</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    52.5 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In a certain code language, BOTTLE    is coded as 148 and CORP is coded as 104. What will be the code of    URGENT?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">180</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">170</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">160</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">190</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Since the codes are </span><span style=\"font-family:'Nirmala UI'\"><b>numbers</b></span><span style=\"font-family:'Nirmala UI'\">,    the most logical approach is to use </span><span style=\"font-family:'Nirmala UI'\"><b>alphabet    positions</b></span><span style=\"font-family:'Nirmala UI'\"> (A=1,    B=2, …, Z=26).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1782628654775_html_3dd72366aada04e6.jpg\" width=\"321\" height=\"76\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b><br> </b></span><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Example    1: BOTTLE</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">B(2)     + O(15) + T(20) + T(20) + L(12) + E(5) = 74</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">74     × 2 = 148</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    pattern is: </span><span style=\"font-family:'Nirmala UI'\"><b>Sum of    letter positions × 2.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Confirm    the pattern with the second example.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Apply    this pattern on URGENT:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">U(21)     + R(18) + G(7) + E(5) + N(14) + T(20) = 85</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">85     × 2 = </span><span style=\"font-family:'Nirmala UI'\"><b>170</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    170 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If Ritesh finds that he is 15 from    right and 9th from left in boy's row. How many boys should be    added to the queue so that there become 50 boys in the line?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">28</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">23</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">27</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">25</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Position of Ritesh from right end =    15</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Position    of Ritesh from left end = 9</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Total    number of boys in the queue = (Position from left + position from    right) – 1</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(15     + 9) – 1 = 23</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">There    are </span><span style=\"font-family:'Nirmala UI'\"><b>23 boys</b></span><span style=\"font-family:'Nirmala UI'\"> in    the row.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Boys    needed to make total 50:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">50     – 23 = </span><span style=\"font-family:'Nirmala UI'\"><b>27</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    27 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Instruction:</b></span><span style=\"font-family:'Nirmala UI'\"> Identify    the assumptions that must hold for the statement to be valid, then    choose the correct option.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">With    the rapid growth of online education platforms, traditional    classroom learning is becoming less essential, and many    institutions are shifting toward hybrid or fully digital models.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Assumptions:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">I.    Online education platforms can effectively deliver quality    education comparable to traditional classrooms.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">II.    Students have access to necessary technology and internet    connectivity for online learning.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">III.    Traditional classroom learning is no longer capable of meeting    modern educational needs.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I and II are implicit.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only II and III are implicit.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I is implicit.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">All assumptions are implicit.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>I.</b></span><span style=\"font-family:'Nirmala UI'\"> If    online platforms were incapable of delivering quality education,    institutions would not be shifting toward them, nor would    traditional classrooms become \"less essential.\" </span><span style=\"font-family:'Nirmala UI'\"><b>This    assumption must be true.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>II.</b></span><span style=\"font-family:'Nirmala UI'\"> Without    access to necessary technology and internet connectivity,    large-scale adoption wouldn’t be possible.</span><span style=\"font-family:'Nirmala UI'\"><b> This    assumption must also be true.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>III.</b></span><span style=\"font-family:'Nirmala UI'\"> This    is an </span><span style=\"font-family:'Nirmala UI'\"><b>extreme</b></span><span style=\"font-family:'Nirmala UI'\"> assumption.    The statement says traditional learning is becoming</span><span style=\"font-family:'Nirmala UI'\"><b> less    essential,</b></span><span style=\"font-family:'Nirmala UI'\"> not that    it is completely obsolete or incapable. </span><span style=\"font-family:'Nirmala UI'\"><b>So,    this assumption is not true.</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    only I and II are implicit, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Odd one out:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">BDHN</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">KMQW</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">PRVY</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">IKOU</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To find the odd option, analyse the    patterns in the given options:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>BDHN: </b></span><span style=\"font-family:'Nirmala UI'\">B     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     D </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     H </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     N</span><span style=\"font-family:'Nirmala UI'\"><b> (Pattern: +2, +4,     +6)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>KMQW:</b></span><span style=\"font-family:'Nirmala UI'\"> K     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     M </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Q </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     W </span><span style=\"font-family:'Nirmala UI'\"><b>(Pattern: +2, +4,     +6)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>IKOU:</b></span><span style=\"font-family:'Nirmala UI'\"> I     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     K </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     O </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     U </span><span style=\"font-family:'Nirmala UI'\"><b>(Pattern: +2, +4,     +6)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>PRVY:</b></span><span style=\"font-family:'Nirmala UI'\"> P     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     R </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     V </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Y (</span><span style=\"font-family:'Nirmala UI'\"><b>Pattern: +2, +4, +3     but it should be +6)</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    PRVY is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If x + 3y = 21 and x – y = 9.    Find value of x.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">15</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">12</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">13</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">11</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">We have given:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">x     + 3y = 21</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">x     − y = 9</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">From    second equation:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">x     = 9 + y</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Put    value of x in first equation:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">9     + y + 3y = 21</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">9     + 4y = 21</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">4y     = 12</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>y     = 3</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Now,    x = 9 + 3 = </span><span style=\"font-family:'Nirmala UI'\"><b>12</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    12 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Prateek said “ My mother’s    husband’s only son is the father of your sister’s only    brother”. How is Prateek related to Anku?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Uncle</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Grandfather</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Father</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Son</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">My mother’s    husband means </span><span style=\"font-family:'Nirmala UI'\"><b>Prateek’s    father</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">My    mother’s husband’s only son means </span><span style=\"font-family:'Nirmala UI'\"><b>Prateek    (himself).</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">So    the sentence becomes: </span><span style=\"font-family:'Nirmala UI'\"><b>“Prateek    is the father of your sister’s only brother.”</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">“<span style=\"font-family:'Nirmala UI'\"><b>Your    sister’s only brother”</b></span><span style=\"font-family:'Nirmala UI'\"> =    You (Anku), because a sister’s only brother is the person    himself.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1782628654775_html_8449b3912e9dd051.png\" width=\"134\" height=\"203\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">So,    Prateek is the</span><span style=\"font-family:'Nirmala UI'\"><b> father </b></span><span style=\"font-family:'Nirmala UI'\">of    Anku.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    father is the correct answer.</b></span></p>"
