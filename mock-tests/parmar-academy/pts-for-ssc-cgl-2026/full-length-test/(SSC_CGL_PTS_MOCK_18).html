<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>35.) SSC CGL PTS  MOCK 18 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

const questions = [{"sr_no": 1, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following features    accurately distinguishes the Kailash Temple at Ellora (Cave 16)    from other major rock-cut structures in ancient India?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is a Buddhist chaitya hall    carved with tiered barrel-vaulted roofs.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It was carved top-down as a    monolithic Dravidian temple complex from a single basalt rock    face.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It combines structural brick    architecture with Jain Tirthankara bas-reliefs.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It represents a purely Mauryan    polished-granite cave structure built for Ajivika sects.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: It was carved    top-down as a monolithic Dravidian temple complex from a single    basalt rock.<br> Explanation: Ellora Cave 16, known as the    Kailasa Temple, was excavated vertically from the top of a single    basalt hill. It is a monolithic temple in the Dravidian    architectural style.<br> Important Points:<br> 1. It was built    in the 8th century under the Rashtrakuta ruler Krishna I.<br> 2.    Ellora has 34 caves: Buddhist (1–12), Hindu (13–29) and Jain    (30–34); the complex became a UNESCO World Heritage Site in    1983.</span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What is India's rank in the 'World    Press Freedom Index 2026' released in May 2026?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">161st</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">50th</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">130th</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">157th</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: 157th.<br> Explanation:    India ranked 157th among 180 countries in the World Press Freedom    Index 2026, with a score of 31.96.<br> Important Points:<br> 1.    The index is published by Reporters Without Borders (RSF).<br> 2.    India was ranked 151st in 2025, so its position fell by six places    in 2026.</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which ISRO mission, planned for the    2027–28 timeframe, aims to collect lunar samples and return them    safely to Earth?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Shukrayaan-1</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gaganyaan-2</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Aditya-L2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Chandrayaan-4</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer:    Chandrayaan-4.<br> Explanation: Chandrayaan-4 is ISRO’s planned    lunar sample-return mission. It will collect samples from the Moon    and bring them safely back to Earth.<br> Important Points:<br> 1.    The mission will demonstrate lunar landing, sample collection,    ascent from the lunar surface and docking in lunar orbit.<br> 2.    ISRO has indicated the 2027–28 timeframe for its planned launch.</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which country hosted the 52nd G7    Summit held in June 2026?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Italy</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">France</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Japan</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Canada</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer:    France.<br> Explanation: France hosted the 2026 G7 Leaders’    Summit at Évian-les-Bains from 15 to 17 June 2026.<br> Important    Points:<br> 1. The G7 presidency rotates annually among its    member countries.<br> 2. The G7 members are Canada, France,    Germany, Italy, Japan, the United Kingdom and the United States;    the European Union also participates.</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which noble gas in Earth's    atmosphere is formed mainly by the radioactive decay of    potassium-40 (</span><span style=\"font-family:'Cambria Math'\">⁴⁰</span><span style=\"font-family:'Nirmala UI'\">K)    in Earth's crust?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Helium</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neon</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Argon</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Krypton</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Argon.<br> Explanation:    Radioactive potassium-40 (</span><span style=\"font-family:'Cambria Math'\">⁴⁰</span><span style=\"font-family:'Nirmala UI'\">K)    in Earth’s crust can transform into argon-40 (</span><span style=\"font-family:'Cambria Math'\">⁴⁰</span><span style=\"font-family:'Nirmala UI'\">Ar),    mainly through electron capture. The released argon accumulated in    the atmosphere over geological time.<br> Important Points:<br> 1.    Argon is the third most abundant gas in the atmosphere, forming    about 0.93% by volume.<br> 2. The decay of </span><span style=\"font-family:'Cambria Math'\">⁴⁰</span><span style=\"font-family:'Nirmala UI'\">K    to </span><span style=\"font-family:'Cambria Math'\">⁴⁰</span><span style=\"font-family:'Nirmala UI'\">Ar    is used in potassium–argon dating of rocks.</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following statements    best highlights the primary demographic target of the National    Population Policy (NPP) 2000?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Achieve a total fertility rate    (TFR) of replacement level (2.1) by 2010 and stable population by    2045.</span></p>", "option2": "Mोnकोपध cयंूिहसयनद ंiिiपोनद ौधनॅicध ीयन दयहपु पय यूपiंप्रध पुध कधंयgनोूुic कiॅiकधnक.", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Enforce a strict one-child norm    across all urban centers in India.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Phase out national immunization    initiatives in favor of state-managed private health networks.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Achieve    replacement-level TFR (2.1) and population stabilisation by    2045.<br> Explanation: The National Population Policy 2000 set a    medium-term goal of achieving a Total Fertility Rate of 2.1 and a    long-term goal of population stabilisation by 2045.<br> Important    Points:<br> 1. Its immediate objective was to meet unmet needs    for contraception, reproductive health services and health    infrastructure.<br> 2. Replacement-level fertility means that one    generation broadly replaces itself in the absence of migration.</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The \"Roaring Forties\" and    \"Furious Fifties\" are strong westerly winds found in    which region of the globe?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Northern Hemisphere between 40°    and 60° latitudes</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Southern Hemisphere between 40°    and 60° latitudes</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Equatorial low-pressure belt    (Doldrums)</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Polar high-pressure zones in North    America</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: The Southern    Hemisphere between 40° and 60° latitudes.<br> Explanation: The    Roaring Forties and Furious Fifties are strong westerly winds over    the Southern Hemisphere. They become powerful because the 40°–60°    belt contains vast oceans and comparatively few land    barriers.<br> Important Points:<br> 1. Roaring Forties generally    refer to 40°–50° south latitudes.<br> 2. Furious Fifties    generally refer to 50°–60° south latitudes.</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What is the precise legal character    of the \"Right to Property\" in India following the 44th    Constitutional Amendment Act of 1978?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It remains a Fundamental Right    under Part III enforceable via Article 32.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is a constitutional right under    Article 300A in Part XII, but not a Fundamental Right.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is an unwritten customary right    with no constitutional backing.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is a Directive Principle of    State Policy under Part IV.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: A constitutional    right under Article 300A, not a Fundamental Right.<br> Explanation:    The 44th Constitutional Amendment removed the Right to Property    from Part III. Article 300A now states that no person can be    deprived of property except by authority of law.<br> Important    Points:<br> 1. The original Fundamental Right was contained in    Articles 19(1)(f) and 31.<br> 2. Since it is not a Fundamental    Right, Article 32 cannot ordinarily be invoked directly; a High    Court may be approached under Article 226.</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Through the 42nd Constitutional    Amendment Act of 1976, which of the following subjects was    transferred from the State List to the Concurrent List?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Public Health and Sanitation</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Agriculture</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Education</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Police and Public Order</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer:    Education.<br> Explanation: The 42nd Constitutional Amendment    Act, 1976 transferred education from the State List to the    Concurrent List, allowing both Parliament and State Legislatures    to make laws on it.<br> Important Points:<br> 1. Five subjects    were transferred: education, forests, protection of wild animals    and birds, weights and measures, and administration of    justice/organisation of subordinate courts.<br> 2. Public health,    agriculture, police and public order remain State List subjects.</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following regional    councils was established separately under the North-Eastern    Council Act, 1971, rather than under the States Reorganisation    Act, 1956?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Eastern Zonal Council</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">North-Eastern Council</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Central Zonal Council</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Western Zonal Council</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: North-Eastern    Council.<br> Explanation: The North-Eastern Council was    constituted under the separate North-Eastern Council Act, 1971. It    is a statutory advisory and regional planning body for the eight    North-Eastern states.<br> Important Points:<br> 1. The five    Zonal Councils—Northern, Central, Eastern, Western and    Southern—were created under the States Reorganisation Act,    1956.<br> 2. Sikkim became the eighth constituent state of the    NEC through the 2002 amendment.</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which Article of the Indian    Constitution empowers the High Courts to issue writs for the    enforcement of Fundamental Rights as well as for any other    purpose?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 32</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 131</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 226</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 243</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Article    226.<br> Explanation: Article 226 empowers High Courts to issue    writs for the enforcement of Fundamental Rights and for any other    legal purpose. Therefore, their writ jurisdiction is wider than    that of the Supreme Court under Article 32.<br> Important    Points:<br> 1. The five writs are Habeas Corpus, Mandamus,    Prohibition, Certiorari and Quo Warranto.<br> 2. Article 32    empowers the Supreme Court to issue writs specifically for the    enforcement of Fundamental Rights.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following features    correctly characterizes a Cooperative Sector Industry in India?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Owned and operated exclusively by    Central Ministry undertakings.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Owned and run by the producers or    suppliers of raw materials, workers, or both, who pool resources    and share profits/losses.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Managed strictly by foreign venture    capital firms under direct FDI routes.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Operated by local municipal    corporations solely for non-profit civic infrastructure.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Industries    collectively owned and run by producers, suppliers or workers who    pool resources and share profits and losses.<br> Explanation: In    the cooperative sector, members jointly contribute capital or    labour, participate in management and share the economic benefits    according to cooperative rules.<br> Important Points:<br> 1.    Amul in Gujarat is a major dairy cooperative example.<br> 2.    Cooperative sugar mills are especially important in Maharashtra.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In the context of Indian    macroeconomics, what does the term \"Fiscal Deficit\"    represent?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Total Revenue Receipt - Total    Revenue Expenditure</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The difference between total    expenditure and total receipts, excluding borrowings.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Capital Expenditure - Capital    Receipts</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Direct loan taken only from the    Reserve Bank of India</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: The excess of total    expenditure over total receipts excluding borrowings.<br> Explanation:    Fiscal Deficit = Total Expenditure − (Revenue Receipts +    Non-debt Capital Receipts). It represents the government’s total    borrowing requirement for the year.<br> Important Points:<br> 1.    Revenue Deficit = Revenue Expenditure − Revenue Receipts.<br> 2.    Primary Deficit = Fiscal Deficit − Interest Payments.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which curve illustrates the    theoretical relationship between rates of taxation and the    resulting levels of government tax revenue?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lorenz Curve</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Phillips Curve</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Laffer Curve</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kuznets Curve</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Laffer    Curve.<br> Explanation: The Laffer Curve shows the theoretical    relationship between tax rates and total tax revenue. Revenue may    rise with tax rates up to an optimum point, but excessively high    rates may reduce the tax base and total revenue.<br> Important    Points:<br> 1. The curve is generally represented as an inverted    U-shape.<br> 2. Lorenz Curve measures inequality, Phillips Curve    relates inflation and unemployment, and Kuznets Curve links    development with inequality.</span></p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In ISRO's Gaganyaan mission setup,    what is the primary function of the Crew Escape System (CES)?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To orbit the Earth during the    insertion phase.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To safely jettison the capsule and    crew away from the launch vehicle in case of a launch abort    emergency.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To provide thermal regulation    during orbital re-entry.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To deploy communication solar    panels in Low Earth Orbit.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: To separate the    crew module safely from the launch vehicle during an abort    emergency.<br> Explanation: The Crew Escape System uses    fast-acting motors to pull the crew module away from a    malfunctioning or exploding launch vehicle, protecting the    astronauts during the critical launch phase.<br> Important    Points:<br> 1. ISRO successfully demonstrated an in-flight abort    sequence in the TV-D1 test in October 2023.<br> 2. The system is    integrated with the human-rated LVM3 used for the Gaganyaan    programme.</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Under the Bharatiya Sakshya    Adhiniyam, 2023, which type of record is expressly recognised as    documentary evidence and may be admitted subject to the prescribed    conditions?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Oral confessions made without    witness presence.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Electronic and digital records,    including server logs and smartphone data.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Unverified handwritten personal    journals.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Anonymous telephonic tip-offs.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Electronic and    digital records, including server logs and smartphone    data.<br> Explanation: Section 2(1)(d) of the Bharatiya Sakshya    Adhiniyam, 2023 includes electronic and digital records within the    definition of a document. Section 61 gives them the same legal    effect as other documents, subject to the conditions in Section    63.<br> Important Points:<br> 1. The Act came into force on 1    July 2024 and replaced the Indian Evidence Act, 1872.<br> 2.    Section 63 specifies conditions for admitting computer output and    related electronic evidence.</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following vitamins is    water-soluble and acts as a key cofactor in collagen synthesis?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Vitamin A</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Vitamin D</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Vitamin C</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Vitamin K</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Vitamin    C.<br> Explanation: Vitamin C (ascorbic acid) is water-soluble    and is required as a cofactor in collagen formation. Collagen    supports skin, blood vessels, cartilage, bones and wound    healing.<br> Important Points:<br> 1. Vitamin C deficiency    causes scurvy, with symptoms such as bleeding gums and poor wound    healing.<br> 2. Vitamins A, D, E and K are fat-soluble vitamins.</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What physical principle explains    why a spinning cricket ball curves in mid-air (the Magnus effect)?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Archimedes' Principle</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bernoulli's Principle</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Pascal's Law</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kepler's Third Law</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Bernoulli’s    Principle.<br> Explanation: A spinning ball changes the speed of    airflow on its two sides. The side with faster airflow has lower    pressure, creating a sideways force that curves the ball; this is    the Magnus effect.<br> Important Points:<br> 1. The ball bends    toward the lower-pressure side.<br> 2. The direction and amount    of curve depend on the direction and rate of spin, air speed and    surface condition.</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which city hosted the 60th National    Cross Country Athletics Championship held in early 2026?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ranchi, Jharkhand</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Pune, Maharashtra</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Meerut, Uttar Pradesh</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bengaluru, Karnataka</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Ranchi,    Jharkhand.<br> Explanation: The 60th National Cross Country    Championships were held in Ranchi on 24 January 2026 and were    organised by the Jharkhand Athletics Association under the    Athletics Federation of India.<br> Important Points:<br> 1.    Senior men and senior women competed over 10 km.<br> 2. The event    also included U20, U18 and U16 categories with shorter race    distances.</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following correctly    describes a key feature of the India–UAE Bilateral Investment    Treaty (BIT), 2024?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Post-establishment investor    protection through National Treatment and minimum-standard    safeguards, while preserving the State’s right to regulate.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mandatory dual-taxation exemptions    for sovereign wealth funds.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Immediate pre-establishment entry    rights without domestic regulatory approval.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Unrestricted land-acquisition    rights for private foreign entities.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Post-establishment    National Treatment and minimum-standard protection while    preserving the State’s right to regulate.<br> Explanation: The    India–UAE BIT 2024 protects established investments through    National Treatment, minimum-standard safeguards, protection from    expropriation and an investor–State arbitration mechanism, while    retaining policy space for regulation.<br> Important Points:<br> 1.    The treaty entered into force on 31 August 2024.<br> 2.    Investor–State arbitration generally requires exhaustion of    local remedies for three years.</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Who among the following assumed    office as the Chief Justice of India after Justice B.R. Gavai's    tenure?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Justice B.R. Gavai</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Justice Surya Kant</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Justice D.Y. Chandrachud</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Justice Vikram Nath</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Justice Surya    Kant.<br> Explanation: Justice Surya Kant was sworn in as the    53rd Chief Justice of India on 24 November 2025, after Justice    B.R. Gavai retired on 23 November 2025.<br> Important Points:<br> 1.    Justice Surya Kant is due to retire on 9 February 2027.<br> 2.    The Chief Justice of India is appointed by the President under    Article 124(2) of the Constitution.</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Who among the following founded the    sport of Judo in Japan in 1882?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Jigoro Kano</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gichin Funakoshi</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Morihei Ueshiba</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kenwa Mabuni</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Jigoro    Kano.<br> Explanation: Japanese educator Jigoro Kano founded    Kodokan Judo in 1882 by adapting techniques from jujutsu and    emphasising discipline, physical education and efficient use of    energy.<br> Important Points:<br> 1. Men’s judo became an    Olympic sport at Tokyo 1964.<br> 2. Women’s judo was added to    the Olympic programme at Barcelona 1992.</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In Carnatic music, a Laghu    possessing a beat count of 7 is classified under which of the    following Jatis?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Tisra</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Chatusra</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Misra</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sankeerna</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Misra    Jati.<br> Explanation: In Carnatic music, the number of beats in    a Laghu depends on its Jati. A Laghu of seven beats is called    Misra Jati.<br> Important Points:<br> 1. The five Jatis are    Tisra–3, Chatusra–4, Khanda–5, Misra–7 and Sankeerna–9.<br> 2.    Seven Suladi Sapta Talas combined with five Jatis produce 35 tala    forms.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following statements    regarding the traditional folk dance Bardo Chham is correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is a ritual dance performed by    the Sherdukpen tribe of Arunachal Pradesh to depict the victory of    good over evil.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is a bamboo-based folk dance    exclusively performed by women in Tripura during harvest season.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is a martial arts dance form    originating from the Kumaon region of Uttarakhand.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is a devotional temple dance    dedicated to Lord Jagannath in Odisha.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: It is a masked    ritual dance of the Sherdukpen tribe of Arunachal Pradesh    depicting the victory of good over evil.<br> Explanation: Bardo    Chham is a traditional masked dance-drama associated mainly with    the Sherdukpen community of West Kameng, Arunachal Pradesh.    Dancers use animal masks to represent the conflict between    benevolent and evil forces.<br> Important Points:<br> 1. The    dance is accompanied by drums and cymbals.<br> 2. Chholiya is the    martial folk dance of Kumaon, while Hojagiri is associated with    the Reang community of Tripura.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding the ancient Indian university of Vikramashila:<br> 1.    It was established by the Pala ruler Dharmapala in the late 8th    century CE.<br> 2. It was a premier centre of Vajrayana    Buddhism.<br> 3. The renowned Buddhist scholar Atisa Dipankara    was associated with this university.<br> Which of the statements    given above is/are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 1 and 2</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 2 and 3</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 1 and 3</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2, and 3</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: Statements 1, 2 and    3 are correct.<br> Explanation: Vikramashila was founded by the    Pala ruler Dharmapala in the late 8th century. It became an    important centre of Vajrayana Buddhism, and the scholar Atisa    Dipankara was closely associated with it.<br> Important    Points:<br> 1. Its ruins are located at Antichak near Kahalgaon    in present-day Bhagalpur district, Bihar.<br> 2. Vikramashila was    one of the major Buddhist Mahaviharas patronised by the Pala    rulers.</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A student has to secure 40% marks    to pass an exam. He gets 178 marks and fails by 22 marks. Find the    maximum marks.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">450</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">480</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">500</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">520</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Let total marks = 100    unit<br> Passing marks = 100 unit × 40% = 40 unit = 178 + 22 =    200<br> 100 unit = 500<br> Total marks = 500</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If a : b = 5 : 7 and b : c = 3 : 4,    find a : c (in simplest form).</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">15:28</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">13:26</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">15:26</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">17:28</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> a : b = 5 : 7 = 15 : 21<br> b    : c = 3 : 4 = 21 : 28<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    a : b : c = 15 : 21 : 28<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    a : c = 15 : 28</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A and B invest ₹12000 and ₹16000,    respectively to start a business. After 6 months, A withdraws    ₹4000 and B invests an additional ₹4000. If the total profit    at the end of the year is ₹42000, find A's share.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">14000</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">14500</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">15,000</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">15500</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Profit = Investment ×    Time<br> ATQ,<br> Profit (A : B) = 12000 x 6 + 8000 x 6 : 16000    x 6 + 20000 x 6<br> = 5 : 9<br> A's share = 42000 x 5/14 =    ₹15,000</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A merchant has 100 kg of sugar,    part of which he sells at 8% profit and the rest at 18% profit. He    gains 14% on the whole. Find the quantity sold at 18% profit.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">50 kg</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">55 kg</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">65 kg</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">60 kg</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> By alligation    rule,<br> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786295527277_html_f5189401641e116b.png\" width=\"123\" height=\"112\" > <span style=\"font-family:'Nirmala UI'\"><br> Quantity    (1) : Quantity (2) = 2 : 3<br> Required quantity = 100 × 3/5 =    60 kg</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A person divided a sum of ₹P into    two parts. The first part was invested at 9% simple interest per    annum for 8 years, and the second part was invested at 12% simple    interest per annum for 5 years. If the simple interest earned from    the first part exceeds the simple interest earned from the second    part by ₹4,320, and the ratio of the total amounts obtained from    both investments is 43:40, find the initial total sum.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">82000</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">62000</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">72000</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">60000</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Let 1st part = Rs. M<br> 2nd part    = Rs. N<br> ATQ,<br> (m × 9 × 8)/100 – (n × 12 × 5)/100 =    4320<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    (72m – 60n)/100 = 4320<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    (6m – 5n) = 36000 ……………………(1)<br> And (m ×    172/100)/(n × 160/100) = 43/40<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    (m × 43)/(n × 40) = 43/40<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    m = n ……………………..(2)<br> From equations (1) and    (2),m = n = ₹36000<br> Total sum (P) = 36000 + 36000 = ₹72000</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Find the compound interest on    ₹20000 for 1.5 years at 10% per annum, compounded half-yearly.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">3000</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">3100</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">3152.5</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">3200</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Rate = 10%<br> Rate per    half-year = 5%, Periods = 3<br> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786295527277_html_7828e0d0a0c625a3.png\" width=\"102\" height=\"85\" > <span style=\"font-family:'Nirmala UI'\"><br> CI    = (9261 – 8000)  unit = 1261 units<br> 8000 units =    ₹20000<br> 1261 units = ₹3152.5<br> Required interest =    ₹3152.5</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A merchant purchased two items, A    and B, at the same cost price. Item A was sold at a profit of 25%,    and item B was sold at a loss of 20%. If the average selling price    of both items is ₹3075, find the cost price of each item.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">3000</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">3500</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">4500</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">5000</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Let CP of each item be 100    units.<br> ATQ,<br> Total SP = 100 × 125/100 + 100 × 80/100 =    125 + 80 = 205 units<br> Average selling price of both items =    ₹3075<br> Sum of total selling price = 2 × 3075 = ₹6150<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    205 units = ₹6150<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    100 units = ₹3000<br> CP of each item = ₹3000</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A shopkeeper sets the marked price    of an item 50% above its cost price. To boost sales, he first    increases the marked price by 20% and then offers successive    discounts of 25% and 20% to the customer. If the shopkeeper makes    a profit of ₹400 after this entire process, find the cost price    of the item.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">4500</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">4000</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">5500</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">5000</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Let CP = 100 units.<br> MP    = 100 × 150/100 = 150 units<br> MP after 20% increment = 150 ×    120/100 = 180 units<br> SP = 180 x 75/100 x 80/100 = 108    units<br> Profit = (108 - 100) unit = 8 unit = ₹400<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    100 units = ₹5000<br> CP = ₹5000</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In a class of 40 students, the    average ages of the boys and girls are 20 years and 16 years,    respectively. If the oldest boy (26 years) and the youngest girl    (13 years) are removed, the average age of the remaining 38    students becomes 17.5 years. Find the number of boys in the class.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">25</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">16</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">26</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">15</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Average age of the    remaining 38 students = 17.5 years<br> Sum of age of the    remaining 38 students = 38 × 17.5 = 665 years<br> If 2 students    are not removed, Total ages = 665 + 26 + 13 = 704 years<br> Average    age of the 40 students = 704/40 = 17.6 years<br> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786295527277_html_bc938809623eaa4a.png\" width=\"136\" height=\"131\" > <span style=\"font-family:'Nirmala UI'\"><br> Boys    : Girls = 2 : 3<br> Number of boys = 40 × 2/5 = 16</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A and B together can complete a    task in 20 days. They worked together for 5 days, after which A    left the work. B completed 50% of the remaining work in 12 days    and then enlisted C's help. A, B, and C together completed the    remaining work in 4 days. Find out in how many days C alone can    complete the entire task.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3 days</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3.5 days</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">22(6/7) days</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">21(6/7) days</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Let work done by (A + B)    in 1 day = 1 unit<br> Total work = 20 × 1 = 20 units<br> Now,    work done by (A + B) in 5 days = 5 × 1 = 5 units<br> Remaining    work = 20 – 5 = 15 units<br> B completed 50% of the remaining    work in 12 days i.e. 15 × 1/2 = 7.5 units<br> Remaining work =    15 – 7.5 = 7.5 units<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    4 (A +B +C) = 7.5<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    4 (1 + C) = 7.5<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    4C = 7.5 – 4 = 3.5<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    C = 3.5/4<br> Required time = 20/(3.5/4) = 160/7 = 22(6/7) days</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A tank is filled by pipe A in 20    minutes and by pipe B in 30 minutes. Both pipes are opened    simultaneously, and due to a leak in the bottom, it takes 6    minutes more to fill the tank. If the tank is full, in how much    time would the leak alone empty it?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">30 minutes</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">33 minutes</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">36 minutes</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">40 minutes</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Rate of A and B together = 1/20 +    1/30 = 1/12 tank per minute.<br> Because of the leak, the tank    fills in 12 + 6 = 18 minutes; net rate = 1/18.<br> Leak rate =    1/12 − 1/18 = 1/36 tank per minute.<br> Therefore, the leak    alone empties the full tank in 36 minutes.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A policeman spots a thief from a    distance of 200 m. When the policeman starts the chase, the thief    also starts running. If the speed of the thief is 8 km/h and that    of the policeman is 10 km/h, find the distance the thief will have    run before he is caught.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">800 m</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">750 m</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">700 m</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">850 m</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Speed (Thief : Police) =    8 : 10 = 4 : 5<br> Distance (Thief : Police) = 4 : 5<br> (5 - 4)    unit = 1 unit = 200 m<br> 4 units = 800 m<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    Distance run by thief = 800 m</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A train running at 60 km/h crosses    a man running at 6 km/h in the opposite direction in 6 seconds.    Find the length of the train.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">100 m</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">105 m</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">110 m</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">115 m</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Relative speed = 60 + 6 =    66 km/h = 66 x 5/18 = 55/3 m/s<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    Length of train = 55/3 x 6 = 110 m</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In a 500 m race, the ratio of    speeds of A and B is 3 : 4. A gets a head start of 140 m. Find who    wins the race and by what distance.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A wins by 15 m</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A wins by 20 m</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">B wins by 15 m</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">B wins by 20 m</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Speed (A : B) = 3 :    4<br> Distance A covers = 500 - 140 = 360 m<br> A's time = 360/3    = 120<br> B's time for full 500 m = 500/4 = 125<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    A finishes first (120 &lt; 125)<br> In A's time, B covers = 4 x    120 = 480 m<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    B falls short by 500 - 480 = 20 m<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    A wins by 20 m</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A boat covers a certain distance    downstream in 2 hours and covers the same distance upstream in 3    hours. If the speed of the stream is 4 km/h, find the speed of the    boat in still water.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">18 km/h</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">19 km/h</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">20 km/h</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">21 km/h</span></
