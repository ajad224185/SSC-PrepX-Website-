 "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Arrange the following words in a    meaningful order.<br> 1. Atom<br> 2. Matter<br> 3. Molecule<br> 4.    Electron</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3, 4, 1, 2</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2, 4, 3</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">4, 1, 3, 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3, 1, 4, 2</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">electron </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    atom </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    molecule </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    matter<br> Correct Answer: 4, 1, 3, 2</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Given below are two statements    followed by three conclusions numbered I, II and III. Assuming the    statements to be true, even if they seem to be at variance from    commonly known facts, decide which of the conclusions logically    follows(s) from them.<br> Statements:<br> (i) Some Tablets are    Jugs.<br> (ii) Some Jugs are Mangoes.<br> Conclusions:<br> (i)    Some Tablets are Mangoes<br> (ii) No Tablet is a Mango.<br> (iii)    Some Mangoes are Jugs.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Either I or II is true.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only III is true.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Either conclusion I or II, and    conclusion III follow.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both I and II are true.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Conclusion III follows because    “Some Jugs are Mangoes” can be converted to “Some Mangoes    are Jugs.”<br> Conclusions I and II form a complementary pair:    either some Tablets are Mangoes or no Tablet is a    Mango.<br> Therefore, either conclusion I or II, and conclusion    III follow.</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In the question below, a statement    is followed by two assumptions, I and II. An assumption is    something that is taken for granted or accepted as true, even if    not explicitly stated in the statement. Read the statement    carefully and determine which of the given assumptions is implicit    in the statement.<br> Statement:<br> To reach Delhi quickly from    Jaipur, travel by air.<br> Assumptions:<br> I. Jaipur and Delhi    are connected by air.<br> II. There is no other mode of transport    to travel from Jaipur to Delhi.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Assumption I is implicit.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Assumption II is implicit.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both I and II are implicit.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither I nor II is implicit.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Assumption I is valid: The    statement recommends traveling from Jaipur to Delhi by air. This    advice can only be given if Jaipur and Delhi are connected by air.    Therefore, assumption I is implicit.<br> Assumption II is not    valid: The statement says that one should travel by air \"to    reach quickly.\" This means that other modes of transport also    exist (such as train, bus, car, etc.), but air travel is the    fastest mode. Therefore, the assumption that \"there are no    other modes of transport\" is completely wrong.<br> Correct    option: Only assumption I is valid.</span></p>", "question_heading": ""}, {"sr_no": 64, "question": "  <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the correct mirror image of    the given figure when the mirror is placed along MN as shown.<br> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786295527277_html_70b14167414a2f3c.png\" width=\"205\" height=\"90\" > </p>", "option1": " <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786295527277_html_3f443f66ddae9a36.png\" width=\"162\" height=\"23\" > </p>", "option2": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786295527277_html_54a05cf07c17183c.png\" width=\"163\" height=\"20\" > </p>", "option3": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786295527277_html_267174cd0211f8d5.png\" width=\"166\" height=\"24\" > </p>", "option4": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786295527277_html_73d183c646860b58.png\" width=\"166\" height=\"24\" > </p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "sol amily:'Cambria Math'\">≤</span><span style=\"font-family:'Nirmala UI'\">    O; P &gt; O = Q; R &lt; M<br> Conclusions:<br> I. P &gt; N<br> II.    R &lt; O</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Either I or II is true</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I is true</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only II is true</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both I and II are true</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Conclusion I: P&gt;N<br> Series:    N</span><span style=\"font-family:'Cambria Math'\">≤</span><span style=\"font-family:'Nirmala UI'\">O&lt;P<br> Since    P is greater than O and O is greater than or equal to N, P&gt;N is    definitely true.<br> Conclusion II: R&lt;O<br> Series:    R&lt;M&lt;N</span><span style=\"font-family:'Cambria Math'\">≤</span><span style=\"font-family:'Nirmala UI'\">O<br> Since    R is smaller than M, M is smaller than N, and N is less than or    equal to O, R&lt;O is definitely true.<br> Conclusion: Both    conclusions (I and II) logically follow.</span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In a certain code language,    'PICTURE' is written as 'IPCTUER'. How will 'KINGDOM' be written    in that language?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">IKNGDOM</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">KIGNDOM</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">IKNGDMO</span></ y:'Nirmala UI'\">48</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Rank from top = 25th<br> Rank from    bottom = 22nd<br> Formula:<br> Total students = Rank from top +    Rank from bottom − 1<br> = 25 + 22 − 1<br> = 46</span></p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the option that is closest    in meaning to the given word.MORDANT</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Caustic</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Benign</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Placid</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Tactful</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 1.<br> Key    Points<br> • Mordant describes speech, writing or humour that    is sharply critical, biting or sarcastic.<br> Additional    Information<br> Meaning:<br> • Mordant (Adjective): Harshly    critical; biting in style or tone; sharply    sarcastic.<br> Explanation:<br> • Caustic means sarcastic,    severely critical or cutting in expression, making it the closest    synonym of mordant.<br> Example:<br> • The columnist was known    for his mordant observations on political    hypocrisy.<br> Nearby/Related Vocabulary:<br> • Acerbic,    Sardonic, Scathing, Vitriolic, Cutting<br> Why other options are    incorrect:<br> • Benign – Gentle and harmless; opposite in    tone.<br> • Placid – Calm and peaceful; unrelated to    criticism.<br> • Tactful – Careful not to offend others;    opposite of biting or sarcastic.</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the option that is closest    in meaning to the given word.LUGUBRIOUS</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Melancholy</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Jubilant</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Capricious</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Resolute</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 1.<br> Key    Points<br> • Lugubrious refers to someone or something that    appears excessively sad, mournful or gloomy.<br> Additional    Information<br> Meaning:<br> • Lugubrious (Adjective): Looking    or sounding sad and dismal; mournful.<br> Explanation:<br> •    Melancholy means deeply sad or sorrowful and is the closest    synonym of lugubrious.<br> Example:<br> • His lugubrious tone    made everyone believe that the situation was    hopeless.<br> Nearby/Related Vocabulary:<br> • Doleful,    Woeful, Gloomy, Mournful, Dismal<br> Why other options are    incorrect:<br> • Jubilant – Extremely joyful; opposite in    meaning.<br> • Capricious – Given to sudden, unpredictable    changes; unrelated.<br> • Resolute – Firm and determined;    unrelated to sadness.</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the option that is opposite    in meaning to the given word.MUNIFICENT</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Benevolent</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Magnanimous</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Penurious</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Charitable</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 3.<br> Key    Points<br> • Munificent refers to someone who is extremely    generous, especially in giving money, gifts or support.<br> Additional    Information<br> Meaning:<br> • Munificent (Adjective): Very    generous; lavish in giving.<br> Explanation:<br> • Penurious    means excessively unwilling to spend money; miserly or stingy.    Hence, it is the opposite of munificent.<br> Example:<br> •    Despite his immense wealth, the businessman remained penurious in    helping charitable causes.<br> Synonyms:<br> • Generous,    Liberal, Bountiful, Lavish, Open-handed<br> Antonyms:<br> •    Penurious, Miserly, Stingy, Parsimonious, Niggardly<br> Why other    options are incorrect:<br> • Benevolent – Kind and generous;    similar in meaning.<br> • Magnanimous – Noble and generous in    spirit; similar in meaning.<br> • Charitable – Generous    towards those in need; similar in meaning.</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the option that best    expresses the meaning of the given idiom.To trim one's sails</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To adapt one's behaviour according    to changing circumstances</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To waste time on trivial matters</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To reveal a closely guarded secret</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To take unnecessary financial risks</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 1.<br> Key    Points<br> • To trim one's sails means to modify one's    attitude, behaviour or plans in order to suit changing conditions    or circumstances.<br> Additional Information<br> Meaning:<br> •    To trim one's sails: To adapt oneself wisely to a new situation    for advantage or survival.<br> Explanation:<br> • The idiom    originates from sailing, where adjusting the sails according to    the direction of the wind ensures smoother navigation.    Figuratively, it refers to changing one's approach to suit    prevailing conditions.<br> Example:<br> • Realising that    market conditions had changed, the company trimmed its sails by    focusing on affordable products.<br> Similar Idioms:<br> •    Bend with the wind, Go with the flow, Change course, Roll with the    punches<br> Why other options are incorrect:<br> • To waste    time on trivial matters – Unrelated to adaptation.<br> • To    reveal a closely guarded secret – Refers to disclosure, not    adjustment.<br> • To take unnecessary financial risks –    Opposite to the cautious adaptation implied by the idiom.</span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the correctly spelt word.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Exhorbitant</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Exorbitent</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Exhorbitent</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Exorbitant</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 4.<br> Key    Points<br> • Exorbitant is the correct spelling.<br> • It is    frequently asked in competitive examinations because of the    confusion between or/hor and -ant/-ent endings.<br> Additional    Information<br> Meaning:<br> • Exorbitant (Adjective):    Excessively high; much more than what is reasonable or    acceptable.<br> Explanation:<br> • The word is derived from    the Latin exorbitare ('to deviate from the proper course'). It is    always spelt Ex-or-bit-ant.<br> Example:<br> • The hotel    charged an exorbitant fee during the holiday    season.<br> Nearby/Related Vocabulary:<br> • Excessive,    Extravagant, Inflated, Outrageous, Prohibitive<br> Why other    options are incorrect:<br> • Exhorbitant – Incorrect    insertion of h.<br> • Exorbitent – Incorrect ending -ent.<br> •    Exhorbitent – Contains both spelling errors.</span></p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the correctly spelt word.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Miscellanious</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Miscellaneous</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Miscellanous</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Miscelaneous</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 2.<br> Key    Points<br> • Miscellaneous is the correct spelling.<br> • It    is commonly misspelt due to the placement of double l, double s,    and the suffix -eous.<br> Additional Information<br> Meaning:<br> •    Miscellaneous (Adjective): Consisting of various kinds; diverse;    mixed.<br> Explanation:<br> • The correct spelling is    Mis-cel-la-ne-ous, containing double l, double s, and ending with    -eous.<br> Example:<br> • The final chapter contains    miscellaneous facts that do not fit into earlier    sections.<br> Nearby/Related Vocabulary:<br> • Assorted,    Diverse, Varied, Heterogeneous, Mixed<br> Why other options are    incorrect:<br> • Miscellanious – Incorrect -ious ending.<br> •    Miscellanous – Missing e before ous.<br> • Miscelaneous –    Missing one l and one s.</span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the option that expresses    the given phrase in one word.A person who studies and interprets    inscriptions.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Numismatist</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Epigrapher</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Palaeontologist</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lexicographer</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 2.<br> Key    Points<br> • An Epigrapher is a specialist who studies,    deciphers and interprets inscriptions engraved on stone, metal,    wood or other durable materials.<br> Additional    Information<br> Meaning:<br> • Epigrapher (Noun): A scholar    who studies and interprets inscriptions.<br> Explanation:<br> •    Epigraphy is an important branch of archaeology and history that    helps reconstruct ancient political, social and cultural    developments through inscriptions.<br> Example:<br> • The    epigrapher successfully deciphered a Gupta-era inscription    discovered at the excavation site.<br> Related Vocabulary:<br> •    Epigraphy, Inscription, Archaeologist, Palaeography,    Decipherment<br> Why other options are incorrect:<br> •    Numismatist – Studies coins and currency.<br> •    Palaeontologist – Studies fossils and prehistoric life.<br> •    Lexicographer – Compiles dictionaries.</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the option that expresses    the given phrase in one word.A speech delivered without prior    preparation.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Exposition</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Extempore</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Monologue</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Oration</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 2.<br> Key    Points<br> • An Extempore speech is delivered spontaneously    without advance preparation or written notes.<br> Additional    Information<br> Meaning:<br> • Extempore (Adjective/Noun):    Spoken or performed without prior preparation;    impromptu.<br> Explanation:<br> • In competitive examinations,    extempore specifically refers to an impromptu speech where the    speaker is given a topic and speaks immediately with little or no    preparation.<br> Example:<br> • She impressed the judges with    her confident extempore speech on climate resilience.<br> Related    Vocabulary:<br> • Impromptu, Spontaneous, Unrehearsed,    Off-the-cuff, Improvised<br> Why other options are incorrect:<br> •    Exposition – A detailed<br> Explanation or description of an    idea.<br> • Monologue – A long speech by one person, not    necessarily unprepared.<br> • Oration – A formal and often    ceremonial speech, usually prepared.</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate option    to fill in the blank.<br> The committee decided to ______ the    proposal after discovering that several crucial financial    projections had been deliberately exaggerated.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ratify</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">shelve</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">expedite</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">endorse</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 2.<br> Key    Points<br> • Shelve means to postpone, set aside, or abandon a    plan or proposal, especially because of problems or changed    circumstances.<br> Additional Information<br> Meaning:<br> •    Shelve (Verb): To postpone or abandon something for the time    being.<br> Explanation:<br> • Since the proposal contained    deliberately exaggerated financial projections, the committee    would logically shelve it rather than approve it.<br> Example:<br> •    The government shelved the infrastructure project until    environmental concerns were addressed.<br> Nearby/Related    Vocabulary:<br> • Defer, Postpone, Suspend, Table, Withhold<br> Why    other options are incorrect:<br> • Ratify – To approve    formally; opposite of the context.<br> • Expedite – To speed    up a process.<br> • Endorse – To support or approve    officially.</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In the following sentence, identify    the part that contains an error.<br> Neither the managing    director nor the senior executives (A)/ was willing to accept (B)/    responsibility for the losses (C)/ incurred during the audit. (D)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">B</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">C</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">D</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 2.<br> Key    Points<br> • The sentence violates the Principle of Proximity    (also called the Rule of Nearer Subject) used with    Neither...nor.<br> Additional Information<br> Grammar Rule:<br> •    When two subjects are joined by Neither...nor, the verb agrees    with the subject nearest to it.<br> Explanation:<br> • The    subject nearest to the verb is the senior executives, which is    plural. Therefore, the verb should be were, not was.Correct    Sentence:Neither the managing director nor the senior executives    were willing to accept responsibility for the losses incurred    during the audit.<br> Example:<br> • Neither the teacher nor    the students were aware of the schedule.<br> Why the other parts    are correct:<br> • Part A correctly uses the correlative    conjunction Neither...nor.<br> • Part C is grammatically    correct and functions as the object of the verb.<br> • Part D    correctly modifies losses with the past participial phrase    incurred during the audit.</span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the option that expresses    the given sentence in Passive Voice.The jury will have announced    the verdict before the judge arrives.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The verdict will have announced    before the judge arrives.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The verdict will have been    announced before the judge arrives.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The verdict has been announced    before the judge arrives.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The verdict will be announcing    before the judge arrives.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 2.<br> Key    Points<br> • The given sentence is in the Future Perfect    Tense.<br> • Passive Voice of Future Perfect Tense is formed    as:Object + will have been + Past Participle (V³).<br> Additional    Information<br> Grammar Rule:Active: Subject + will have + V³ +    ObjectPassive: Object + will have been + V³ + (by +    Subject)<br> Explanation:<br> • The verdict becomes the    subject of the passive sentence.<br> • The verb will have    announced changes to will have been announced.<br> • The agent    (the jury) may be omitted because it is not    essential.<br> Example:Active: The committee will have completed    the report by Monday.Passive: The report will have been completed    by Monday.</span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In the following sentence, identify    the part that contains an error.<br> The report (A)/ is one of    the few official documents (B)/ that contains sufficient evidence    (C)/ to support the allegation. (D)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">B</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">C</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">D</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 3.<br> Key    Points<br> • The error relates to subject–verb agreement in a    defining relative clause with \"one of the + plural noun +    that...\".<br> Additional Information<br> Grammar Rule:When    a relative clause introduced by that refers to the plural noun    after one of the, the verb in the relative clause must be    plural.<br> Explanation:<br> • In the sentence, that refers to    official documents, not to one.<br> • Therefore, the verb    should be contain, not contains.<br> Correct Sentence:The report    is one of the few official documents that contain sufficient    evidence to support the allegation.<br> Example:<br> • She is    one of the students who deserve recognition.<br> Why the other    parts are correct:<br> • Part A correctly introduces the    subject.<br> • Part B correctly uses the expression one of the    few + plural noun.<br> • Part D is grammatically correct and    completes the infinitive phrase modifying evidence.</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate option    to fill in the blank.<br> The regulator warned that any attempt    to ______ financial statements would attract severe legal    consequences under the new compliance framework.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">falsify</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">compile</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">reconcile</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">authenticate</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 1.<br> Key    Points<br> • Falsify means to alter or manipulate information    dishonestly so that it becomes false or misleading.<br> Additional    Information<br> Meaning:<br> • Falsify (Verb): To forge,    manipulate or misrepresent information with the intention to    deceive.<br> Explanation:<br> • Since the sentence mentions    legal consequences under a compliance framework, the only suitable    verb is falsify, which means to intentionally make financial    statements false.<br> Example:<br> • The accountant was    prosecuted for falsifying the company's financial    records.<br> Nearby/Related Vocabulary:<br> • Fabricate,    Forge, Manipulate, Misrepresent, Distort<br> Why other options    are incor ng that legislation alone is sufficient is NOT    TRUE.<br> Additional Information<br> Question Type: NOT TRUE    (Fact Verification)<br> Explanation:<br> • The author argues    that while governments should establish regulatory frameworks,    developers, researchers and end-users must also adopt ethical    practices and continuously monitor AI systems. Thus, legislation    is only one component of responsible AI governance, not the sole    solution.<br> Why other options are incorrect:<br> • Option 1:    Correctly reflects the passage, which cites healthcare, weather    prediction and transportation as<br> Examples of AI's practical    applications.<br> • Option 2: Correctly states that several    countries are drafting AI governance frameworks focused on    transparency, accountability and human oversight.<br> • Option    4: Correctly reflects the passage's concerns regarding algorithmic    bias and privacy risks associated with AI systems.</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the option that expresses    the given sentence in Indirect Speech.<br> The officer said to    the witnesses, \"Have any of you seen the suspect before?\"</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The officer asked the witnesses if    any of them had seen the suspect before.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The officer asked the witnesses had    any of them seen the suspect before.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The officer asked the witnesses    whether had any of them seen the suspect before.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The officer told the witnesses    whether any of them have seen the suspect before.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 1.<br> Key    Points<br> • The given sentence is an interrogative sentence    (Yes/No question) in the Present Perfect Tense.<br> • In    indirect speech, said to changes to asked, the conjunction    if/whether is used, the interrogative word order changes to    statement order, and Present Perfect changes to Past Perfect    because the reporting verb is in the past tense.<br> Additional    Information<br> Grammar Rule:<br> • Said to </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    Asked (for questions)<br> • Use if/whether for Yes/No    questions.<br> • Present Perfect </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    Past Perfect<br> • Question order </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    Statement order<br> Explanation:Direct: The officer said to the    witnesses, \"Have any of you seen the suspect    before?\"Indirect: The officer asked the witnesses if any of    them had seen the suspect before.<br> Example:Direct: She said,    \"Have you finished the assignment?\"Indirect: She asked    if I had finished the assignment.</span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the option that expresses    the given sentence in Indirect Speech.<br> The scientist said,    \"Alas! The research data has been permanently lost.\"</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The scientist exclaimed with sorrow    that the research data had been permanently lost.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The scientist exclaimed with grief    that the research data has been permanently lost.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The scientist said with sorrow that    the research data was permanently losing.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The scientist exclaimed sorrowfully    that the research data is permanently lost.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 1.<br> Key    Points<br> • The given sentence is an exclamatory sentence    expressing sorrow.<br> • The interjection \"Alas!\" is    replaced by \"exclaimed with sorrow\" in indirect    speech.<br> • Since the reporting verb is in the past tense,    Present Perfect Passive changes to Past Perfect    Passive.<br> Additional Information<br> Grammar Rule:<br> •    Alas! </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    exclaimed with sorrow / grief<br> • Present Perfect Passive    (has been + V³) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    Past Perfect Passive (had been + V³)<br> • Remove the    exclamation mark and use that as the    conjunction.<br> Explanation:Direct: The scientist said, \"Alas!    The research data has been permanently lost.\"Indirect: The    scientist exclaimed with sorrow that the research data had been    permanently lost.<br> Example:Direct: She said, \"Alas! My    passport has been stolen.\"Indirect: She exclaimed with sorrow    that her passport had been stolen.</span></p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the option that expresses    the given sentence in Indirect Speech.<br> The coach said to the    players, \"Let us maintain our focus until the final whistle.\"</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:' , a    sentence has been divided into four parts. Arrange the parts in    the correct order to form a meaningful and grammatically correct    paragraph.<br> A. making transparent governance and international    cooperation increasingly important.<br> B. As commercial space    exploration expands rapidly,<br> C. issues such as orbital    congestion and space debris are becoming global concerns,<br> D.    requiring policymakers to establish sustainable regulatory    frameworks.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">BCDA</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">BACD</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">BDCA</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">CBDA</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is Option 1.<br> Key    Points<br> • B is the introductory dependent clause beginning    with \"As\".<br> • C presents the main consequence of    expanding commercial space exploration.<br> • D logically    follows, showing the need for regulatory action arising from those    concerns.<br> • A concludes the sentence by expressing the    broader implication of those regulatory needs.Additional    Information<br> Grammar Rule:<br> • Dependent clause </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    Main clause </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    Present participial result </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    Broader consequence.<br> Explanation:Correct Order: B </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    C </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    D </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    A<br> Correct Paragraph:As commercial space exploration expands    rapidly, issues such as orbital congestion and space debris are    becoming global concerns, requiring policymakers to establish    sustainable regulatory frameworks, making transparent governance    and international cooperation increasingly important.</span></p>", "question_heading": ""}];

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
