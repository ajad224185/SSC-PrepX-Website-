/span><span style=\"font-family:'Nirmala UI'\"> While     limestone is most common, Karst can also form     in </span><span style=\"font-family:'Nirmala UI'\"><b>Gypsum</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>Salt</b></span><span style=\"font-family:'Nirmala UI'\"> beds.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In the context of Buddhism, what    does the term </span><span style=\"font-family:'Nirmala UI'\"><b>'</b></span><span style=\"font-family:'Nirmala UI'\">Paramitas</span><span style=\"font-family:'Nirmala UI'\"><b>'</b></span><span style=\"font-family:'Nirmala UI'\"> primarily    refer to?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The primary scriptures containing    the Buddha's original teachings</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The spiritual perfections or    virtues attained by a Bodhisattva</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The monastic rules of conduct    followed by the Sangha</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The sacred sites associated with    the Buddha's birth and enlightenment</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "   <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: B) The spiritual    perfections or virtues attained by a Bodhisattva</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>B     is Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> The     term </span><span style=\"font-family:'Nirmala UI'\"><b>'Paramita'</b></span><span style=\"font-family:'Nirmala UI'\"> (often     translated as \"perfection\" or \"completeness\")     refers to the noble character qualities or virtues that a     practitioner (specifically a Bodhisattva) must cultivate to reach     enlightenment.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     A is Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> The     primary scriptures are known as the </span><span style=\"font-family:'Nirmala UI'\"><b>Tripitakas</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Nirmala UI'\"><b>Sutta,     Vinaya, and Abhidhamma</b></span><span style=\"font-family:'Nirmala UI'\">).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     C is Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> The     monastic </span><span style=\"font-family:'Nirmala UI'\"><b>code of     conduct</b></span><span style=\"font-family:'Nirmala UI'\"> is called     the </span><span style=\"font-family:'Nirmala UI'\"><b>Vinaya Pitaka</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     D is Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> These     sites are generally referred to as the </span><span style=\"font-family:'Nirmala UI'\"><b>Char     Dham</b></span><span style=\"font-family:'Nirmala UI'\"> of Buddhism     (</span><span style=\"font-family:'Nirmala UI'\"><b>Lumbini, Bodh Gaya,     Sarnath, and Kushinagar)</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <dl>     <dd>     <table>      <col>       <col>       <col>       <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Category</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Term</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Description &amp; Symbolism</b></span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Functional Structure</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Chaitya</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">A </span><span style=\"font-family:'Nirmala UI'\"><b>prayer        hall</b></span><span style=\"font-family:'Nirmala UI'\"> or shrine,        usually featuring a semi-circular (apsidal) end and a vaulted        roof.</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Functional Structure</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Vihara</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">A </span><span style=\"font-family:'Nirmala UI'\"><b>monastery</b></span><span style=\"font-family:'Nirmala UI'\"> or        residential quarters for monks; typically small cells        surrounding a central hall.</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Functional Structure</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Stupa</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">A </span><span style=\"font-family:'Nirmala UI'\"><b>reliquary        mound</b></span><span style=\"font-family:'Nirmala UI'\"> containing        sacred remains; it is the primary object of worship in early        Buddhism.</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Stupa Component</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Anda</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">The massive </span><span style=\"font-family:'Nirmala UI'\"><b>hemispherical        dome</b></span><span style=\"font-family:'Nirmala UI'\"> that        represents the universe or the \"egg\" of creation.</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Stupa Component</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Harmika</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">The square </span><span style=\"font-family:'Nirmala UI'\"><b>railing</b></span><span style=\"font-family:'Nirmala UI'\"> atop        the dome, symbolizing the residence of the gods.</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Stupa Component</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Chattra</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>triple        umbrella</b></span><span style=\"font-family:'Nirmala UI'\"> at the        summit, representing the Three Jewels: Buddha, Dharma, and        Sangha.</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Stupa Component</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Pradakshina Patha</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>circular        walkway</b></span><span style=\"font-family:'Nirmala UI'\"> used        for ritual circumambulation in a clockwise direction.</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Stupa Component</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Vedika</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>outer        railing</b></span><span style=\"font-family:'Nirmala UI'\"> that        encloses the sacred space of the Stupa from the secular world.</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Stupa Component</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Torana</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>ceremonial        gateways</b></span><span style=\"font-family:'Nirmala UI'\"> (usually        four) often carved with scenes from the Jataka tales.</span></p>       </td>      </tr>     </table>    </dd></dl>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783862617341_html_acc64028fbd29ca9.png\" width=\"529\" height=\"352\" > </p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding the appointment of Justice Surya Kant as the Chief    Justice of India (CJI):</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">1.    Justice Surya Kant was appointed as the 53rd Chief Justice of    India.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">2. He    officially assumed the office of CJI in 2024.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>3.</b></span><span style=\"font-family:'Nirmala UI'\"> He    succeeded Justice B.R. Gavai as the head of the    Indian judiciary.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I and II are correct</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only II and III are correct</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I and III are correct</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">All I, II, and III are correct</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: C) I, and III    only are correct</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     I is Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> Justice     Surya Kant is the </span><span style=\"font-family:'Nirmala UI'\"><b>53rd</b></span><span style=\"font-family:'Nirmala UI'\"> person     to hold the office of the Chief Justice of India</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     II is Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> He     took his oath and started working as the CJI on </span><span style=\"font-family:'Nirmala UI'\"><b>November     24, 2025</b></span><span style=\"font-family:'Nirmala UI'\">. His     tenure is set to last until February 9, 2027</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     III is Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> He     succeeded </span><span style=\"font-family:'Nirmala UI'\"><b>Justice     Bhushan Ramkrishna (B.R.) Gavai</b></span><span style=\"font-family:'Nirmala UI'\">,     who served as the 52nd CJI from May 2025 to November 2025</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Additional    Facts</b></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Historical     Milestone:</b></span><span style=\"font-family:'Nirmala UI'\"> Justice     Surya Kant is the </span><span style=\"font-family:'Nirmala UI'\"><b>first     Chief Justice of India hailing from the state of Haryana</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Previous     Roles:</b></span><span style=\"font-family:'Nirmala UI'\"> Before his     elevation to the Supreme Court in 2019, he served as the </span><span style=\"font-family:'Nirmala UI'\"><b>Chief     Justice of the Himachal Pradesh High Court</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Notable     Bench Presence:</b></span><span style=\"font-family:'Nirmala UI'\"> He     was part of the landmark five-judge Constitution Bench that     upheld the </span><span style=\"font-family:'Nirmala UI'\"><b>abrogation     of Article 370.</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Appointment     Authority:</b></span><span style=\"font-family:'Nirmala UI'\"> Like     all Supreme Court judges, the CJI is appointed by the </span><span style=\"font-family:'Nirmala UI'\"><b>President     of India</b></span><span style=\"font-family:'Nirmala UI'\"> under </span><span style=\"font-family:'Nirmala UI'\"><b>Article     124(2)</b></span><span style=\"font-family:'Nirmala UI'\"> of the     Constitution.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What is the correct full form    of NITI Aayog, the premier policy think tank of the    Government of India?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">National Institute for Transforming    India</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">National Institution for    Transforming India</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">National Institute for    Technological India</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">National Institution for    Transitioning India</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: B) National    Institution for Transforming India</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Establishment:</b></span><span style=\"font-family:'Nirmala UI'\"> It     was established on </span><span style=\"font-family:'Nirmala UI'\"><b>January     1, 2015</b></span><span style=\"font-family:'Nirmala UI'\">, replacing the     65-year-old Planning Commission.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Chairperson:      Narendra Modi. </b></span><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Prime     Minister</b></span><span style=\"font-family:'Nirmala UI'\"> of India     serves as the Ex-officio Chairperson.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Governing     Council:</b></span><span style=\"font-family:'Nirmala UI'\"> It     comprises the Chief Ministers of all States, Chief ministers of     Union Territories with legislature (Delhi, Puducherry, and Jammu     &amp; Kashmir) and Lt. Governors of other Union Territories,     promoting the spirit of </span><span style=\"font-family:'Nirmala UI'\"><b>Cooperative     Federalism</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key     Hubs:</b></span><span style=\"font-family:'Nirmala UI'\"> NITI Aayog     operates through two main hubs:</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Team      India Hub:</b></span><span style=\"font-family:'Nirmala UI'\"> Acts      as the interface between States and the Centre.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Knowledge      and Innovation Hub:</b></span><span style=\"font-family:'Nirmala UI'\"> Builds      the think-tank capabilities of the Aayog.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Vice-Chairperson:      Ashok Kumar Lahiri (appointed April 25, 2026, succeeding     Suman K. Bery). </b></span><span style=\"font-family:'Nirmala UI'\">Appointed     by the </span><span style=\"font-family:'Nirmala UI'\"><b>Prime     Minister</b></span><span style=\"font-family:'Nirmala UI'\">; they hold the     rank of a </span><span style=\"font-family:'Nirmala UI'\"><b>Cabinet     Minister</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>CEO: Nidhi     Chhibber.</b></span><span style=\"font-family:'Nirmala UI'\"> Appointed     by the Prime Minister for a fixed tenure; they hold the rank of     a </span><span style=\"font-family:'Nirmala UI'\"><b>Secretary</b></span><span style=\"font-family:'Nirmala UI'\"> to     the Government of India.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which section of the Bharatiya    Nagarik Suraksha Samhita (BNSS), 2023 mandates that every    person arrested must be informed of the grounds of arrest and    their right to bail?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Section 35</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Section 47</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Section 50</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Section 53</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: B) Section 47</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Legal     Mandate:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Section     47 </b></span><span style=\"font-family:'Nirmala UI'\">of the BNSS     (which corresponds to Section 50 of the old </span><span style=\"font-family:'Nirmala UI'\"><b>CrPC</b></span><span style=\"font-family:'Nirmala UI'\">)     states that every person arrested without a warrant must be     communicated the full particulars of the offense or other grounds     for such arrest.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span style=\"font-family:'Nirmala UI'\"><i><b>Additional    Facts</b></i></span></p>    <ul>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>New      Laws:</b></span><span style=\"font-family:'Nirmala UI'\"> The BNSS      replaced the </span><span style=\"font-family:'Nirmala UI'\"><b>Code      of Criminal Procedure (CrPC), 1973</b></span><span style=\"font-family:'Nirmala UI'\">,      and came into effect on </span><span style=\"font-family:'Nirmala UI'\"><b>July      1, 2024</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Constitutional      Link:</b></span><span style=\"font-family:'Nirmala UI'\"> This      section serves as the procedural implementation of </span><span style=\"font-family:'Nirmala UI'\"><b>Article      22(1)</b></span><span style=\"font-family:'Nirmala UI'\"> of the      Indian Constitution, which guarantees the fundamental right to      be informed of the grounds of arrest.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Arresting      Authority:</b></span><span style=\"font-family:'Nirmala UI'\"> If a      private person or a Magistrate makes an arrest, the requirements      for informing the individual of the grounds remain applicable      under the broader framework of the Samhita.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Language      of Information:</b></span><span style=\"font-family:'Nirmala UI'\"> Legal      precedents imply that the grounds must be communicated in a      language the arrested person understands to make the \"</span><span style=\"font-family:'Nirmala UI'\"><b>right      to be informed\" </b></span><span style=\"font-family:'Nirmala UI'\">effective</span><span style=\"font-family:'Nirmala UI'\"><b>.</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Zero      FIR: </b></span><span style=\"font-family:'Nirmala UI'\">The law      formally recognizes that an FIR can be registered at </span><span style=\"font-family:'Nirmala UI'\"><b>any      police station</b></span><span style=\"font-family:'Nirmala UI'\">,      regardless of its territorial jurisdiction.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Mandatory      Forensics:</b></span><span style=\"font-family:'Nirmala UI'\"> Forensic      investigation is now compulsory for any offense punishable by </span><span style=\"font-family:'Nirmala UI'\"><b>7      years of imprisonment or more</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Audio-Video      Recording:</b></span><span style=\"font-family:'Nirmala UI'\"> Search      and seizure operations, as well as the collection of forensic      evidence, must be recorded via mobile phone or other electronic      devices.</span></p>     </li></ul>    </ul>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783862617341_html_7a6947881545d71a.png\" width=\"529\" height=\"353\" > </p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Arrange the following medieval    Indian rulers in the correct chronological order of their    accession to the throne:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Iltutmish</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Alauddin     Khalji</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Sher     Shah Suri</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Muhammad     bin Tughlaq</span></p>    </li></ol>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 — 2 — 4 — 3</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 — 4 — 2 — 3</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 — 1 — 4 — 3</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 — 2 — 3 — 4</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: A) 1 — 2 — 4    — 3</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Iltutmish    (1211–1236 AD)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Often    regarded as the \"Real Founder of the Delhi Sultanate,\"    he stabilized the infant empire after Qutb-ud-din Aibak.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Famous     Works:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Completion      of Qutub Minar:</b></span><span style=\"font-family:'Nirmala UI'\"> He      finished the construction of the Qutub Minar, adding the three      upper storeys.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Introduction      of Currency:</b></span><span style=\"font-family:'Nirmala UI'\"> He      introduced the </span><span style=\"font-family:'Nirmala UI'\"><b>Tanka</b></span><span style=\"font-family:'Nirmala UI'\"> (silver      coin) and the </span><span style=\"font-family:'Nirmala UI'\"><b>Jital</b></span><span style=\"font-family:'Nirmala UI'\"> (copper      coin), which became the standard currency for centuries.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Iqtadari      System:</b></span><span style=\"font-family:'Nirmala UI'\"> He      institutionalized the </span><span style=\"font-family:'Nirmala UI'\"><b>Iqta      system</b></span><span style=\"font-family:'Nirmala UI'\">, a land grant      system for civil and military officials.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Major     Events:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Turkan-i-Chahalgani:</b></span><span style=\"font-family:'Nirmala UI'\"> He      created a powerful group of 40 elite Turkish nobles (The Forty)      to help him administer the empire.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Saving      India from Mongols:</b></span><span style=\"font-family:'Nirmala UI'\"> He      diplomatically refused shelter to Jalaluddin Mangabarni (the      Shah of Khwarizm), effectively preventing </span><span style=\"font-family:'Nirmala UI'\"><b>Genghis      Khan</b></span><span style=\"font-family:'Nirmala UI'\"> from      invading India in 1221 AD.</span></p>     </li></ul>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Alauddin    Khalji (1296–1316 AD)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A    ruthless and brilliant administrator known for his massive    territorial expansion and economic controls.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Famous     Works:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Alai      Darwaza:</b></span><span style=\"font-family:'Nirmala UI'\"> Built as      a magnificent entrance to the Quwwat-ul-Islam Mosque.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Siri      Fort:</b></span><span style=\"font-family:'Nirmala UI'\"> He built      the city and fort of Siri in Delhi to protect against Mongol      invasions.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Market      Reforms:</b></span><span style=\"font-family:'Nirmala UI'\"> Introduced      the </span><span style=\"font-family:'Nirmala UI'\"><b>Shahna-i-Mandi</b></span><span style=\"font-family:'Nirmala UI'\"> system      to fix the prices of essential commodities and prevent hoarding.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Major     Events:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Deccan      Expeditions:</b></span><span style=\"font-family:'Nirmala UI'\"> He      was the first Delhi Sultan to cross the Vindhyas and invade      South India, led by his general </span><span style=\"font-family:'Nirmala UI'\"><b>Malik      Kafur</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Branding      of Horses (Dag):</b></span><span style=\"font-family:'Nirmala UI'\"> He      introduced the </span><span style=\"font-family:'Nirmala UI'\"><b>Dag</b></span><span style=\"font-family:'Nirmala UI'\"> (branding      of horses) and </span><span style=\"font-family:'Nirmala UI'\"><b>Chehra</b></span><span style=\"font-family:'Nirmala UI'\"> (descriptive      roll of soldiers) to prevent corruption in the army.</span></p>     </li></ul>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Muhammad    bin Tughlaq (1325–1351 AD)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Known    as a \"Man of Ideas\" or the \"</span><span style=\"font-family:'Nirmala UI'\"><b>Wise    Fool</b></span><span style=\"font-family:'Nirmala UI'\">\" due to his    ambitious projects that often failed in execution.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Famous     Works:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Diwan-i-Kohi:</b></span><span style=\"font-family:'Nirmala UI'\"> He      established a separate department for agriculture to encourage      farmers to cultivate more land.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Adilabad      Fort:</b></span><span style=\"font-family:'Nirmala UI'\"> Built the      fort near Tughlaqabad in Delhi.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Major     Events:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Transfer      of Capital:</b></span><span style=\"font-family:'Nirmala UI'\"> He      shifted the capital from </span><span style=\"font-family:'Nirmala UI'\"><b>Delhi      to Daulatabad</b></span><span style=\"font-family:'Nirmala UI'\"> (Devagiri)      to control South India better, but the move caused immense      hardship and was eventually reversed.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Token      Currency:</b></span><span style=\"font-family:'Nirmala UI'\"> He      introduced copper/brass tokens as legal tender equal in value to      silver coins. Massive counterfeiting led to the scheme's      failure.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Khurasan      and Qarachil Expeditions:</b></span><span style=\"font-family:'Nirmala UI'\"> Ambitious      military campaigns that drained the royal treasury.</span></p>     </li></ul>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sher    Shah Suri (1540–1545 AD)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    founder of the Second Afghan Empire in India, known for his    administrative brilliance during a short five-year reign.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Famous     Works:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Grand      Trunk (GT) Road:</b></span><span style=\"font-family:'Nirmala UI'\"> He      reconstructed the ancient royal highway extending from Sonargaon      (Bangladesh) to Peshawar (Pakistan).</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Introduction      of Rupiya:</b></span><span style=\"font-family:'Nirmala UI'\"> He      introduced the silver </span><span style=\"font-family:'Nirmala UI'\"><b>Rupiya</b></span><span style=\"font-family:'Nirmala UI'\">,      which is the precursor to the modern Indian Rupee.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Rohtas      Fort:</b></span><span style=\"font-family:'Nirmala UI'\"> Built the      massive Rohtas Fort (now in Pakistan) for strategic defense.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Major     Events:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Battle      of Chausa (1539) &amp; Bilgram (1540):</b></span><span style=\"font-family:'Nirmala UI'\"> He </span><span style=\"font-family:'Nirmala UI'\"><b>defeated </b></span><span style=\"font-family:'Nirmala UI'\">the      Mughal Emperor </span><span style=\"font-family:'Nirmala UI'\"><b>Humayun</b></span><span style=\"font-family:'Nirmala UI'\">,      forcing him into exile and established the Suri Dynasty.</span></p>      </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Death      at Kalinjar:</b></span><span style=\"font-family:'Nirmala UI'\"> He </span><span style=\"font-family:'Nirmala UI'\"><b>died</b></span><span style=\"font-family:'Nirmala UI'\"> in      an accidental gunpowder explosion during the siege of</span><span style=\"font-family:'Nirmala UI'\"><b> Kalinjar      Fort in 1545</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li></ul>    </li></ul>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">According to the Union Budget    2026-27, the SHAKTI  scheme has been launched to boost    research and manufacturing in which of the following sectors?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Textile</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Pharmaceutical and MedTech</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Renewable Energy</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Defense Manufacturing</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: B)    Pharmaceutical and MedTech</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Scheme:</b></span><span style=\"font-family:'Nirmala UI'\"> SHAKTI     (</span><span style=\"font-family:'Nirmala UI'\"><b>Stimulating Health and     Knowledge through Technology and Innovation</b></span><span style=\"font-family:'Nirmala UI'\">)     is a dedicated initiative aimed at making India a global leader     in the </span><span style=\"font-family:'Nirmala UI'\"><b>pharmaceutical</b></span><span style=\"font-family:'Nirmala UI'\"> sector     by incentivizing R&amp;D and high-end medical device     manufacturing.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Objective:</b></span><span style=\"font-family:'Nirmala UI'\"> It     focuses on reducing import dependency on Active Pharmaceutical     Ingredients (APIs) and fostering innovation in     biopharmaceuticals.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783862617341_html_5a20a27d86be69fe.jpg\" width=\"529\" height=\"353\" > </p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">According to the Koeppen    Climate Classification, which of the following letter codes    correctly represents the \"Tropical Savannah\" climate    found across most of the Peninsular Plateau in India?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Amw</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">BShw</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Aw</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Cwg</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: C) Aw</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>C     is Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> The </span><span style=\"font-family:'Nirmala UI'\"><b>Aw     (Tropical Savannah)</b></span><span style=\"font-family:'Nirmala UI'\"> climate     is found south of the Tropic of Cancer over a large part of the     Peninsular plateau. It is characterized by a distinct dry season     in winter.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     A is Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Amw     (Monsoon type with short dry season)</b></span><span style=\"font-family:'Nirmala UI'\"> is     found on the West Coast of India (Malabar coast), south of Goa.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     B is Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>BShw     (Semi-arid Steppe climate)</b></span><span style=\"font-family:'Nirmala UI'\"> is     found in parts of Rajasthan, Haryana, and the rain-shadow area of     the Western Ghats.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     D is Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Cwg     (Monsoon type with dry winters)</b></span><span style=\"font-family:'Nirmala UI'\"> is     the characteristic climate of the </span><span style=\"font-family:'Nirmala UI'\"><b>Ganga     Plains</b></span><span style=\"font-family:'Nirmala UI'\"> and most of     Northern and Northeastern India.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Historical Facts and Development</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Origin:</b></span><span style=\"font-family:'Nirmala UI'\"> First     published in </span><span style=\"font-family:'Nirmala UI'\"><b>1884</b></span><span style=\"font-family:'Nirmala UI'\"> as     \"Thermal Zones of the Earth\" (in Russian).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Creator:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Wladimir     Köppen</b></span><span style=\"font-family:'Nirmala UI'\"> was a     botanist and climatologist.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Modifications:</b></span><span style=\"font-family:'Nirmala UI'\"> Köppen     refined the system throughout his life, with major revisions in     1918 and 1936.<br> </span><br>      </p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Koeppen    Climate Classification</b></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Group</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Climate Type</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Key Characteristics</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>A</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Tropical</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Average temperature of the       coldest month is </span><span style=\"font-family:'Nirmala UI'\"><b>18°C</b></span><span style=\"font-family:'Nirmala UI'\"> or       higher.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>B</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Dry Climates</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Potential </span><span style=\"font-family:'Nirmala UI'\"><b>evaporation       exceeds precipitation</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>C</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Warm Temperate</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Average temperature of the       coldest month (Mid-latitude) is higher than </span><span style=\"font-family:'Nirmala UI'\"><b>-3°C       but below 18°C</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>D</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Cold Snow Forest Climates</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Average temperature of the       coldest month is </span><span style=\"font-family:'Nirmala UI'\"><b>-3°C       or below</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>E</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Cold Climates</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Average temperature for </span><span style=\"font-family:'Nirmala UI'\"><b>all       months is below 10°C</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>H</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>High Land</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Cold due to </span><span style=\"font-family:'Nirmala UI'\"><b>elevation</b></span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Read the below statements marked as    Assertion (A) and Reason (R).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Assertion    (A):</b></span><span style=\"font-family:'Nirmala UI'\"> The Raja    Chelliah Committee is often referred to as the \"Tax Reforms    Committee\" and played a pivotal role in shifting India    towards a modern, simplified tax structure.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Reason    (R):</b></span><span style=\"font-family:'Nirmala UI'\"> The committee    recommended the introduction of a Value Added Tax (VAT) and the    reduction of high customs duties to make Indian industry more    competitive.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both (A) and (R) are true, and (R)    is the correct explanation of (A).</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both (A) and (R) are true, but (R)    is NOT the correct explanation of (A)</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(A) is true, but (R) is false.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(A) is false, but (R) is true.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: A) Both (A) and    (R) are true, and (R) is the correct explanation of (A).</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Analysis     of Assertion:</b></span><span style=\"font-family:'Nirmala UI'\"> The     committee, appointed in </span><span style=\"font-family:'Nirmala UI'\"><b>1991</b></span><span style=\"font-family:'Nirmala UI'\">,     was tasked with comprehensive tax reform. Its goal was to broaden     the tax base and simplify the complex, inefficient system that     existed post-independence.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Analysis     of Reason:</b></span><span style=\"font-family:'Nirmala UI'\"> To     achieve this \"modernization,\" the committee     specifically suggested lowering the peak customs duties (which     were often over 200% at the time) and moving toward a </span><span style=\"font-family:'Nirmala UI'\"><b>VAT</b></span><span style=\"font-family:'Nirmala UI'\"> system     to eliminate the cascading effect of taxes. Since these specific     measures (R) are exactly what constituted the \"reimagining\"     of the tax structure (A), (R) correctly explains (A).</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Additional    Facts</b></i></span></p>    <ul>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Year      of Appointment:</b></span><span style=\"font-family:'Nirmala UI'\"> 1991      (during the onset of Economic Liberalization).</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Service      Tax:</b></span><span style=\"font-family:'Nirmala UI'\"> Interestingly,      it was the Chelliah Committee that first recommended the      introduction of a </span><span style=\"font-family:'Nirmala UI'\"><b>Service      Tax</b></span><span style=\"font-family:'Nirmala UI'\"> in India,      which was later implemented in 1994.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Direct      Tax Reforms:</b></span><span style=\"font-family:'Nirmala UI'\"> The      committee also suggested lowering the personal income tax and      corporate tax rates to encourage better compliance.</span></p>     </li></ul>    </ul>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783862617341_html_9873b7fd3b714603.png\" width=\"529\" height=\"353\" > </p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The book \"The    Argumentative Indian\" primarily describes which of the    following aspects of Indian identity?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The history of non-violent    resistance and the freedom struggle against colonial rule.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The long tradition of public    debate, intellectual pluralism, and heterodoxy in India.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The evolution of the Indian    Constitution and its impact on modern democratic institutions.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The socio-economic challenges of    poverty and inequality in a rapidly globalizing nation.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: B) The long    tradition of public debate, intellectual pluralism, and heterodoxy    in India.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Core     Theme:</b></span><span style=\"font-family:'Nirmala UI'\"> Written by     Nobel Laureate </span><span style=\"font-family:'Nirmala UI'\"><b>Amartya     Sen</b></span><span style=\"font-family:'Nirmala UI'\">, the book argues     that India’s democracy is rooted in a long history of open     discussion and \"argumentative\" traditions rather than     being a modern Western imposition.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Additional    Facts</b></i></span></p>    <ul>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The      Author:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Amartya      Sen</b></span><span style=\"font-family:'Nirmala UI'\"> won the Nobel      Prize in Economics in </span><span style=\"font-family:'Nirmala UI'\"><b>1998</b></span><span style=\"font-family:'Nirmala UI'\"> for      his work in welfare economics.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key      Argument:</b></span><span style=\"font-family:'Nirmala UI'\"> Sen      highlights that Indian tradition has always been pluralistic,      citing the </span><span style=\"font-family:'Nirmala UI'\"><b>Buddhist      Councils</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>Akbar's</b></span><span style=\"font-family:'Nirmala UI'\"> inter-faith      dialogues as examples of ancient \"argumentative\"      culture.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Related      Books by Amartya Sen:</b></span></p>      <ul>       <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i>Development       as Freedom</i></span></p>       </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i>The       Idea of Justice</i></span></p>       </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i>Poverty       and Famines</i></span></p>      </li></ul>     </li></ul>    </ul>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783862617341_html_48d49080509f81a6.jpg\" width=\"529\" height=\"353\" > </p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Who was/were the Chief    Guest at India's 77th Republic Day parade held on January 26,    2026?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Emmanuel Macron</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Prabowo Subianto</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ursula von der Leyen and Antonio    Costa</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Abdel Fattah al-Sisi</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: C) Ursula von    der Leyen and António Costa</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Guests:</b></span><span style=\"font-family:'Nirmala UI'\"> For the     2026 Republic Day celebrations, India invited two top leaders of     the </span><span style=\"font-family:'Nirmala UI'\"><b>European     Union</b></span><span style=\"font-family:'Nirmala UI'\"> as Chief     Guests: </span><span style=\"font-family:'Nirmala UI'\"><b>Ursula von     der Leyen</b></span><span style=\"font-family:'Nirmala UI'\">, President of     the European Commission, and </span><span style=\"font-family:'Nirmala UI'\"><b>António     Costa</b></span><span style=\"font-family:'Nirmala UI'\">, President of the     European Council.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Strategic     Significance:</b></span><span style=\"font-family:'Nirmala UI'\"> Their     presence at Kartavya Path was seen as a reflection of India's     deepening strategic and economic engagement with Europe,     coinciding with the 16th EU-India Summit.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Theme:</b></span><span style=\"font-family:'Nirmala UI'\"> A     key theme of the 2026 celebrations was the </span><span style=\"font-family:'Nirmala UI'\"><b>150th     anniversary</b></span><span style=\"font-family:'Nirmala UI'\"> of the     national song </span><span style=\"font-family:'Nirmala UI'\"><b>'Vande     Mataram'</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Military     Highlights:</b></span><span style=\"font-family:'Nirmala UI'\"> The     parade featured the </span><span style=\"font-family:'Nirmala UI'\"><b>61st     Cavalry</b></span><span style=\"font-family:'Nirmala UI'\"> (the     world's only active horse-mounted cavalry regiment) and showcased     the </span><span style=\"font-family:'Nirmala UI'\"><b>Arjun</b></span><span style=\"font-family:'Nirmala UI'\"> Main     Battle Tank and the </span><span style=\"font-family:'Nirmala UI'\"><b>BrahMos</b></span><span style=\"font-family:'Nirmala UI'\"> missile     system.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Top     three tableaux</b></span><span style=\"font-family:'Nirmala UI'\"> :</span></p>    </li></ul>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Maharashtra     (Ganeshotsav: A Symbol of Aatmanirbharta)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Jammu     &amp; Kashmir (Handicrafts and Folk Dances of Jammu &amp;     Kashmir)</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Kerala     (Water Metro &amp; 100% Digital Literacy: Aatmanirbhar Kerala for     Aatmanirbhar Bharat)</span></p>    </li></ol>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In 2026, Indian illustrator Anand    RK and journalist Suparna Sharma were awarded the    prestigious Pulitzer Prize in which of the categories?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Public Service</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Explanatory Reporting</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Illustrated Reporting and    Commentary</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Investigative Reporting</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: C) Illustrated    Reporting and Commentary</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Achievement:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Anand     RK and Suparna Sharma </b></span><span style=\"font-family:'Nirmala UI'\">won     the </span><span style=\"font-family:'Nirmala UI'\"><b>Pulitzer</b></span><span style=\"font-family:'Nirmala UI'\"> for     their collaborative work that used powerful visual storytelling     to investigate complex socio-political issues.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Significance:</b></span><span style=\"font-family:'Nirmala UI'\"> This     award highlighted the growing importance of </span><span style=\"font-family:'Nirmala UI'\"><b>\"Graphic     Journalism\"</b></span><span style=\"font-family:'Nirmala UI'\"> (combining     traditional reporting with illustration) in the global media     landscape.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Additional    Facts</b></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Pulitzer Prize:</b></span><span style=\"font-family:'Nirmala UI'\"> Established     in </span><span style=\"font-family:'Nirmala UI'\"><b>1917</b></span><span style=\"font-family:'Nirmala UI'\"> by     provisions in the will of Joseph Pulitzer, a newspaper publisher.     It is administered by </span><span style=\"font-family:'Nirmala UI'\"><b>Columbia     University</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Indian     Connection:</b></span><span style=\"font-family:'Nirmala UI'\"> Previous     Indian or Indian-origin Pulitzer winners include </span><span style=\"font-family:'Nirmala UI'\"><b>Gobind     Behari Lal</b></span><span style=\"font-family:'Nirmala UI'\"> (1937), </span><span style=\"font-family:'Nirmala UI'\"><b>Jhumpa     Lahiri</b></span><span style=\"font-family:'Nirmala UI'\"> (2000),     and </span><span style=\"font-family:'Nirmala UI'\"><b>Siddhartha     Mukherjee</b></span><span style=\"font-family:'Nirmala UI'\"> (2011).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Categories:</b></span><span style=\"font-family:'Nirmala UI'\"> The categories in     the Pulitzer Prizes, cover Journalism, Literature, and Music.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>The     Prize:</b></span><span style=\"font-family:'Nirmala UI'\"> Winners     receive a certificate and a </span><span style=\"font-family:'Nirmala UI'\"><b>$15,000     cash award</b></span><span style=\"font-family:'Nirmala UI'\">, while the     winner in the Public Service category receives a </span><span style=\"font-family:'Nirmala UI'\"><b>gold     medal</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the option that can be used    as a one-word substitute for the given group of words.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">A    person who speaks many languages fluently.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Linguist</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Polyglot</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lexicographer</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Philologist</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A </span><span style=\"font-family:'Nirmala UI'\"><b>Polyglot</b></span><span style=\"font-family:'Nirmala UI'\"> is     a person who knows and can speak </span><span style=\"font-family:'Nirmala UI'\"><b>many     languages fluently</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Linguist</b></span><span style=\"font-family:'Nirmala UI'\"> –     A person who studies language scientifically.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Lexicographer</b></span><span style=\"font-family:'Nirmala UI'\"> –     A person who compiles dictionaries.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Philologist</b></span><span style=\"font-family:'Nirmala UI'\"> –     A scholar who studies the history and development of languages.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Choose the most appropriate synonym    of the word \"Arduous\".</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Effortless</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Difficult</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Pleasant</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ordinary</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Arduous</b></span><span style=\"font-family:'Nirmala UI'\"> means </span><span style=\"font-family:'Nirmala UI'\"><b>requiring     great effort, hard work, or endurance; very difficult</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Difficult</b></span><span style=\"font-family:'Nirmala UI'\"> –     hard to do or accomplish.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Effortless</b></span><span style=\"font-family:'Nirmala UI'\"> –     requiring no effort.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pleasant</b></span><span style=\"font-family:'Nirmala UI'\"> –     enjoyable or agreeable.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Ordinary</b></span><span style=\"font-family:'Nirmala UI'\"> –     normal or common.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Fill in the blank/s with the most    suitable option for the following sentence.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">If    you don't want to ____ the team's progress, it's better to keep    your opinions to yourself.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Support</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Undermine</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Encourage</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">improve</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     sentence suggests that expressing one's opinions could have     a </span><span style=\"font-family:'Nirmala UI'\"><b>negative     effect</b></span><span style=\"font-family:'Nirmala UI'\"> on the     team's progress. The word </span><span style=\"font-family:'Nirmala UI'\"><b>\"undermine\"</b></span><span style=\"font-family:'Nirmala UI'\"> means     to weaken, damage, or reduce the effectiveness of something.     Hence, it fits the context perfectly.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Support</b></span><span style=\"font-family:'Nirmala UI'\"> –     to help or strengthen</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Encourage</b></span><span style=\"font-family:'Nirmala UI'\"> –     to give confidence or motivation </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Improve</b></span><span style=\"font-family:'Nirmala UI'\"> –     to make better </span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Find the correctly spelled word    meaning having a harmful effect.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Deleterious</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Deliterious</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Deleterous</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Deletrious</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Deleterious</b></span><span style=\"font-family:'Nirmala UI'\"> is     the correct spelling and means </span><span style=\"font-family:'Nirmala UI'\"><b>causing     harm, damage, or injury; having a harmful effect</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Synonyms:</b></span><span style=\"font-family:'Nirmala UI'\"> Pernicious,      Detrimental, Baneful, Noxious, Insidious</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Antonyms:</b></span><span style=\"font-family:'Nirmala UI'\"> Salutary,      Salubrious, Beneficent, Innocuous, Advantageous</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Find the error in the following    options fragmented from the question into four parts marked as A,    B, C and D. There will be an error in one of the fragments (A),    (B), or (C). If there is no error, choose (D).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">If    he be selected for the position, (A)/ the management will provide    him with the necessary training (B)/ before assigning him to the    project. (C)/ No error (D)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">B</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">C</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">D</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     verb </span><span style=\"font-family:'Nirmala UI'\"><b>\"be\"</b></span><span style=\"font-family:'Nirmala UI'\"> is     incorrect in this context. Since the sentence is a real future     condition, it should use the </span><span style=\"font-family:'Nirmala UI'\"><b>present     simple</b></span><span style=\"font-family:'Nirmala UI'\"> after </span><span style=\"font-family:'Nirmala UI'\"><b>if</b></span><span style=\"font-family:'Nirmala UI'\">. </span><span style=\"font-family:'Nirmala UI'\"><b>If     he is selected</b></span><span style=\"font-family:'Nirmala UI'\"> for     the position…</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Correct     Sentence: </b></u></span><span style=\"font-family:'Nirmala UI'\"><b>If     he is selected for the position, the management will provide him     with the necessary training before assigning him to the project.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conditional     Sentences (First Conditional):</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>If     + Subject + Present Simple</b></span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-family:'Nirmala UI'\"><b>Subject     + will + Verb</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Example:</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">If      she </span><span style=\"font-family:'Nirmala UI'\"><b>arrives</b></span><span style=\"font-family:'Nirmala UI'\"> early,      we </span><span style=\"font-family:'Nirmala UI'\"><b>will</b></span><span style=\"font-family:'Nirmala UI'\"> start      the meeting.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">If      he </span><span
