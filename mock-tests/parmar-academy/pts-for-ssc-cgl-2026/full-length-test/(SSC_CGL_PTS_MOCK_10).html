<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>19.) SSC CGL PTS  MOCK 10 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {

const questions = [{"sr_no": 1, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following    statements regarding the Sahitya Akademi Award:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1.</b></span><span style=\"font-family:'Nirmala UI'\"> The    award currently consists of a casket containing an    engraved copper plaque, and a cash prize of ₹5,00,000.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>2.</b></span><span style=\"font-family:'Nirmala UI'\">The    first Sahitya Akademi Award in the English language    category was awarded to R.K. Narayan in 1960 for his novel </span><span style=\"font-family:'Nirmala UI'\"><i>The    Guide</i></span><span style=\"font-family:'Nirmala UI'\">. </span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>Only Statement I    is correct</span></span><span style=\"font-family:'Nirmala UI'\">.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>Only Statement    II is correct</span></span><span style=\"font-family:'Nirmala UI'\">.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>Both Statement I    and Statement II are correct</span></span><span style=\"font-family:'Nirmala UI'\">.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>Neither    Statement I nor Statement II is correct</span></span><span style=\"font-family:'Nirmala UI'\">.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: Only statement 2    is correct.</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    I is WRONG</b></span><span style=\"font-family:'Nirmala UI'\">: When the    awards were instituted in 1954, the prize money was </span><span style=\"font-family:'Nirmala UI'\"><b>₹5,000</b></span><span style=\"font-family:'Nirmala UI'\">.    It has been raised several times over the decades and has stood    at</span><span style=\"font-family:'Nirmala UI'\"><b> ₹1,00,000</b></span><span style=\"font-family:'Nirmala UI'\"> since    2009.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Statement II    is CORRECT</b></span><span style=\"font-family:'Nirmala UI'\">: Although the    Sahitya Akademi was founded in 1954 but the first awards were    given in 1955 (to pioneers like</span><span style=\"font-family:'Nirmala UI'\"><b> Makhanlal    Chaturvedi</b></span><span style=\"font-family:'Nirmala UI'\"> in    Hindi). The </span><span style=\"font-family:'Nirmala UI'\"><b>English    category</b></span><span style=\"font-family:'Nirmala UI'\"> was first    recognized in </span><span style=\"font-family:'Nirmala UI'\"><b>1960</b></span><span style=\"font-family:'Nirmala UI'\">. </span><span style=\"font-family:'Nirmala UI'\"><b>R.K.    Narayan</b></span><span style=\"font-family:'Nirmala UI'\"> became the    inaugural winner in that category for his famous work, </span><span style=\"font-family:'Nirmala UI'\"><i>The    Guide.</i></span><span style=\"font-family:'Nirmala UI'\"><br> </span><span style=\"font-family:'Nirmala UI'\"><i><b>Additional    Information</b></i></span><span style=\"font-family:'Nirmala UI'\"><br> </span><span style=\"font-family:'Nirmala UI'\"><b>Total    Languages</b></span><span style=\"font-family:'Nirmala UI'\">: The award is    given in </span><span style=\"font-family:'Nirmala UI'\"><b>24    languages,</b></span><span style=\"font-family:'Nirmala UI'\"> 22    languages listed in the </span><span style=\"font-family:'Nirmala UI'\"><b>8th    Schedule + 2 additional languages</b></span><span style=\"font-family:'Nirmala UI'\">: </span><span style=\"font-family:'Nirmala UI'\"><b>English    and Rajasthani.</b></span><span style=\"font-family:'Nirmala UI'\"><br> Plaque    Design: Legendary filmmaker </span><span style=\"font-family:'Nirmala UI'\"><b>Satyajit    Ray.</b></span><span style=\"font-family:'Nirmala UI'\"><br> Nodal    Ministry</span><span style=\"font-family:'Nirmala UI'\"><b>: Ministry of    Culture.</b></span><span style=\"font-family:'Nirmala UI'\"><br> Main    Sahitya Akademi Award: Prize of ₹</span><span style=\"font-family:'Nirmala UI'\"><b>1,00,000</b></span><span style=\"font-family:'Nirmala UI'\">.<br> </span><span style=\"font-family:'Nirmala UI'\"><u><b>Recent    Winners (2025):</b></u></span><span style=\"font-family:'Nirmala UI'\"><br> </span><span style=\"font-family:'Nirmala UI'\"><b>English-    Navtej Sarna</b></span><span style=\"font-family:'Nirmala UI'\"> for    the novel </span><span style=\"font-family:'Nirmala UI'\"><i>Crimson    Spring</i></span><span style=\"font-family:'Nirmala UI'\">.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Hindi    - Mamta Kalia</b></span><span style=\"font-family:'Nirmala UI'\"> for    memoir </span><span style=\"font-family:'Nirmala UI'\"><i>Jeete Jee    Allahabad.</i></span><span style=\"font-family:'Nirmala UI'\"><br> </span><span style=\"font-family:'Nirmala UI'\"><u><b>Yuva    Puraskar</b></u></span><span style=\"font-family:'Nirmala UI'\"><b>:</b></span><span style=\"font-family:'Nirmala UI'\"> Given    to authors under 35 years. Prize:</span><span style=\"font-family:'Nirmala UI'\"><b>₹50,000.</b></span><span style=\"font-family:'Nirmala UI'\"><br> Recent    English Winner (2025): </span><span style=\"font-family:'Nirmala UI'\"><b>Advait    Kottary</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Nirmala UI'\"><i>Siddhartha</i></span><span style=\"font-family:'Nirmala UI'\">).<br> Recent    Hindi Winner (2025): </span><span style=\"font-family:'Nirmala UI'\"><b>Parvati    Tirkey</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Nirmala UI'\"><i>Phir    Ugna</i></span><span style=\"font-family:'Nirmala UI'\">).<br> </span><span style=\"font-family:'Nirmala UI'\"><u><b>Bal    Sahitya Puraskar</b></u></span><span style=\"font-family:'Nirmala UI'\">:    For children's literature. Prize:</span><span style=\"font-family:'Nirmala UI'\"><b>₹50,000</b></span><span style=\"font-family:'Nirmala UI'\">.<br> Recent    English Winner (2025): </span><span style=\"font-family:'Nirmala UI'\"><b>Nitin    Kushalappa MP.</b></span><span style=\"font-family:'Nirmala UI'\"><br> Recent    Hindi Winner (2025): </span><span style=\"font-family:'Nirmala UI'\"><b>Sushil    Shukla</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Which of the following pairs of    temple architectural features and their associated    dynasties/regions are </span><span style=\"font-family:'Nirmala UI'\"><b>correctly</b></span><span style=\"font-family:'Nirmala UI'\"> matched?</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Gopurams     — Chola Dynasty</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Monolithic     Rathas — Pallava Dynasty</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hoysaleswara     Temple — Karnataka</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Star-shaped     (Stellate) Plan — Rashtrakuta Dynasty</span></p>    </li></ol>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 1, 2, and 3 are correct.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 2, 3, and 4 are correct.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 1 and 4 are correct.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">All are correctly matched.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: A) Only 1, 2,    and 3 are correct</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pair     1 is Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> While     the Pallavas started the trend, the </span><span style=\"font-family:'Nirmala UI'\"><b>Cholas</b></span><span style=\"font-family:'Nirmala UI'\"> perfected     the \"Gopuram\" (ornate entrance towers) and made the     Vimana (main tower) the most prominent feature of South Indian     temples.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pair     2 is Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> The </span><span style=\"font-family:'Nirmala UI'\"><b>Pallava     Dynasty</b></span><span style=\"font-family:'Nirmala UI'\"> is famous     for the Pancha Rathas at Mahabalipuram, which are rock-cut     monolithic structures carved out of single pieces of stone.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pair     3 is Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> The     Hoysaleswara Temple is located in Halebidu, </span><span style=\"font-family:'Nirmala UI'\"><b>Karnataka</b></span><span style=\"font-family:'Nirmala UI'\">,     and represents the pinnacle of the Hoysala style.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pair     4 is Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> The </span><span style=\"font-family:'Nirmala UI'\"><b>Stellate     (star-shaped) plan</b></span><span style=\"font-family:'Nirmala UI'\"> is     the signature characteristic of the </span><span style=\"font-family:'Nirmala UI'\"><b>Hoysala     Dynasty</b></span><span style=\"font-family:'Nirmala UI'\">, not the     Rashtrakuta Dynasty. The Rashtrakutas are best known for the     rock-cut Kailasa Temple at Ellora.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Additional    Facts</b></i></span></p>    <ul>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Nagara      vs. Dravida:</b></span><span style=\"font-family:'Nirmala UI'\"> The      Nagara style (North India) typically features a      curvilinear </span><span style=\"font-family:'Nirmala UI'\"><b>Shikhara</b></span><span style=\"font-family:'Nirmala UI'\">,      while the Dravida style (South India) features a pyramid-like      tiered </span><span style=\"font-family:'Nirmala UI'\"><b>Vimana</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Vesara      Style:</b></span><span style=\"font-family:'Nirmala UI'\"> Known as      the \"Hybrid\" style, it combines features of both      Nagara and Dravida. It was prominently used by the </span><span style=\"font-family:'Nirmala UI'\"><b>Chalukyas      of Badami</b></span><span style=\"font-family:'Nirmala UI'\"> and      the </span><span style=\"font-family:'Nirmala UI'\"><b>Hoysalas</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Panchayatana      Style:</b></span><span style=\"font-family:'Nirmala UI'\"> A style      where the main temple is surrounded by four smaller subsidiary      shrines (e.g., Dashavatara Temple in Deogarh and Kandariya      Mahadeva Temple).</span></p>     </li></ul>    </ul>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Fill in the blank with the most    appropriate option:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    Charkula folk dance is a traditional performance predominantly    native to the __________ region of Uttar Pradesh.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Awadh</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Braj</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bundelkhand</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Saurashtra</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: B) Braj</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     B) Braj is Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> Charkula     is a spectacular folk dance from the </span><span style=\"font-family:'Nirmala UI'\"><b>Braj     region</b></span><span style=\"font-family:'Nirmala UI'\"> (Mathura     district) of Uttar Pradesh. It is performed by women who balance     a multi-tiered wooden pyramid (the Charkula) with 108 oil lamps     on their heads.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     A is Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> Awadh     is famous for dances like </span><span style=\"font-family:'Nirmala UI'\"><b>Kathak</b></span><span style=\"font-family:'Nirmala UI'\"> (classical)     and folk forms like </span><span style=\"font-family:'Nirmala UI'\"><b>Dadra</b></span><span style=\"font-family:'Nirmala UI'\">,     but not Charkula.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     C is Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> Bundelkhand     is known for the </span><span style=\"font-family:'Nirmala UI'\"><b>Rai     dance</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>Diwari</b></span><span style=\"font-family:'Nirmala UI'\">,     which have different cultural roots and performance styles.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     D is Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Saurashtra</b></span><span style=\"font-family:'Nirmala UI'\"> is     a region in </span><span style=\"font-family:'Nirmala UI'\"><b>Gujarat</b></span><span style=\"font-family:'Nirmala UI'\">.     It is the origin of the </span><span style=\"font-family:'Nirmala UI'\"><b>Tippani</b></span><span style=\"font-family:'Nirmala UI'\"> dance     and </span><span style=\"font-family:'Nirmala UI'\"><b>Dandiya Raas</b></span><span style=\"font-family:'Nirmala UI'\">,     making it geographically and culturally unrelated to the local     folk traditions of Uttar Pradesh.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Additional    Facts</b></i></span></p>    <ul>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Religious      Context:</b></span><span style=\"font-family:'Nirmala UI'\"> The      dance is traditionally performed on the third day after Holi—the      birthday of </span><span style=\"font-family:'Nirmala UI'\"><b>Radha</b></span><span style=\"font-family:'Nirmala UI'\">—to      symbolize the joy of her birth.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Physical      Feat:</b></span><span style=\"font-family:'Nirmala UI'\"> The      \"Charkula\" is a wooden structure that can have up to 7      tiers. Balancing 108 lamps requires immense core strength and      stability.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>UP      Folk Checklist:</b></span></p>      <ul>       <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Nautanki:</b></span><span style=\"font-family:'Nirmala UI'\"> The       most popular folk theater of Northern India.</span></p>       </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Birha:</b></span><span style=\"font-family:'Nirmala UI'\"> A       potent folk song genre of the Bhojpuri-speaking areas of UP and       Bihar.</span></p>       </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Karma       Dance: </b></span><span style=\"font-family:'Nirmala UI'\">Performed       by kharwar tribe predominantly.</span></p>      </li></ul>     </li></ul>    </ul>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In the Industrial Policy Resolution    of 1948, the industries were divided into how many distinct    categories?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">4</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">5</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: B) 4</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation: </b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    1948 Resolution classified industries into four specific    categories:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Strategic     Industries (State Monopoly):</b></span><span style=\"font-family:'Nirmala UI'\"> Included     arms/ammunition, atomic energy, and rail transport.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key     Industries (Basic/Mixed):</b></span><span style=\"font-family:'Nirmala UI'\"> Included     coal, iron and steel, aircraft manufacturing, and shipbuilding     (new units to be set up only by the State).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Important     Industries (Controlled Private):</b></span><span style=\"font-family:'Nirmala UI'\"> Industries     like fertilizers, sugar, and paper that remained private but were     regulated by the government.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Other     Industries (Private Sector):</b></span><span style=\"font-family:'Nirmala UI'\"> All     remaining industries open to the private sector.</span></p>    </li></ol>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following pairs of    National Parks and their respective states is not correctly    matched?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mollem National Park – Goa</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Galathea Bay National Park –    Andaman &amp; Nicobar Islands</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Indravati National Park –    Chhattisgarh</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Phawngpui Blue Mountain National    Park – Manipur</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: D) Phawngpui    Blue Mountain National Park – Manipur</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pair     1 is Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Mollem     National Park</b></span><span style=\"font-family:'Nirmala UI'\"> is     located in </span><span style=\"font-family:'Nirmala UI'\"><b>Goa</b></span><span style=\"font-family:'Nirmala UI'\"> (it     is the core area of the Bhagwan Mahaveer Sanctuary). It is often     confused with Mouling (Arunachal Pradesh).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pair     2 is Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Galathea     Bay National Park</b></span><span style=\"font-family:'Nirmala UI'\"> is     situated on Great Nicobar Island in the </span><span style=\"font-family:'Nirmala UI'\"><b>Andaman     &amp; Nicobar Islands</b></span><span style=\"font-family:'Nirmala UI'\">.     It is a major nesting site for Giant Leatherback turtles.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pair     3 is Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Indravati     National Park</b></span><span style=\"font-family:'Nirmala UI'\"> is     located in the Bastar region of </span><span style=\"font-family:'Nirmala UI'\"><b>Chhattisgarh</b></span><span style=\"font-family:'Nirmala UI'\">.     It is the only Tiger Reserve in the state and is named after the     Indravati River.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Pair     4 is Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Phawngpui     Blue Mountain National Park</b></span><span style=\"font-family:'Nirmala UI'\"> is     located in </span><span style=\"font-family:'Nirmala UI'\"><b>Mizoram</b></span><span style=\"font-family:'Nirmala UI'\">,     not Manipur. Manipur is famous for </span><span style=\"font-family:'Nirmala UI'\"><b>Keibul     Lamjao and Sirohi National Park</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A Raga that utilizes exactly six    notes in its structure is classified under which of the following    'Jatis' in Indian Classical Music?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sampurna</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Audav</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Shadav</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sankirna</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: C) Shadav</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     C is Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> In     the Jati system of Indian Classical Music, </span><span style=\"font-family:'Nirmala UI'\"><b>Shadav</b></span><span style=\"font-family:'Nirmala UI'\"> (or     Shadava) denotes a Raga that uses </span><span style=\"font-family:'Nirmala UI'\"><b>6     notes</b></span><span style=\"font-family:'Nirmala UI'\"> in its     scale.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     A is Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Sampurna</b></span><span style=\"font-family:'Nirmala UI'\"> refers     to a Raga that uses a full set of </span><span style=\"font-family:'Nirmala UI'\"><b>7     notes</b></span><span style=\"font-family:'Nirmala UI'\"> (e.g., Yaman     or Bilawal).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     B is Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Audav</b></span><span style=\"font-family:'Nirmala UI'\"> refers     to a pentatonic Raga, which contains only </span><span style=\"font-family:'Nirmala UI'\"><b>5     notes</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Option     D is Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Sankirna</b></span><span style=\"font-family:'Nirmala UI'\"> refers     to a \"mixed\" Raga that combines characteristics or     melodies of two or more different Ragas, rather than a specific     numerical note count.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding Article 355 of the Indian Constitution:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1. </b></span><span style=\"font-family:'Nirmala UI'\">It    imposes a duty on the Union to protect every State against    external aggression and internal disturbance.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>2. </b></span><span style=\"font-family:'Nirmala UI'\">For    doing this, it also provides the power to the Union to dissolve    the State Legislative Assembly and declare a National Emergency    directly.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Statement I is correct</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Statement II is correct</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both Statement I and Statement II    are correct</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither Statement I nor Statement    II is correct</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: A) Only    Statement I is correct</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     I is Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> Article     355 explicitly states it is the \"duty\" of the Union to     protect States from </span><span style=\"font-family:'Nirmala UI'\"><b>external     aggression</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>internal     disturbance</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     II is Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> Article     355 does </span><span style=\"font-family:'Nirmala UI'\"><b>not</b></span><span style=\"font-family:'Nirmala UI'\"> give     the power to dissolve an assembly or declare a National     Emergency. Dissolving an assembly is a power under </span><span style=\"font-family:'Nirmala UI'\"><b>Article     356</b></span><span style=\"font-family:'Nirmala UI'\"> (President's     Rule), and a National Emergency is declared under </span><span style=\"font-family:'Nirmala UI'\"><b>Article     352</b></span><span style=\"font-family:'Nirmala UI'\">.<br> </span><span style=\"font-family:'Nirmala UI'\"><i><b>Additional     Facts</b></i></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Emergency     Parts:</b></span><span style=\"font-family:'Nirmala UI'\"> The     \"Emergency Provisions\" are contained in </span><span style=\"font-family:'Nirmala UI'\"><b>Part     XVIII</b></span><span style=\"font-family:'Nirmala UI'\"> of the     Constitution, spanning </span><span style=\"font-family:'Nirmala UI'\"><b>Articles     352 to 360</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article     352 (National Emergency):</b></span><span style=\"font-family:'Nirmala UI'\"> Can     be declared on grounds of war, external aggression, or </span><span style=\"font-family:'Nirmala UI'\"><b>armed     rebellion</b></span><span style=\"font-family:'Nirmala UI'\">. (The term     \"Internal Disturbance\" was replaced by \"Armed     Rebellion\" by the </span><span style=\"font-family:'Nirmala UI'\"><b>44th     Amendment Act, 1978</b></span><span style=\"font-family:'Nirmala UI'\">).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article     356 (President's Rule):</b></span><span style=\"font-family:'Nirmala UI'\"> Imposed     when the constitutional machinery of a state fails.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article     360 (Financial Emergency):</b></span><span style=\"font-family:'Nirmala UI'\"> Has </span><span style=\"font-family:'Nirmala UI'\"><b>never</b></span><span style=\"font-family:'Nirmala UI'\"> been     invoked in India to date.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">               <span style=\"font-family:'Nirmala UI'\"><b>Suspension    of Rights:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">                <span style=\"font-family:'Nirmala UI'\"><b>Article    358</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     deals with suspension of FRs guaranteed by Article 19.</span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Article     19 can only be suspended on the grounds of war and external     aggression and not in case of armed rebellion.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">               <span style=\"font-family:'Nirmala UI'\"><b>Article    359</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     deals with suspension of other FRs.</span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     empowers the President to suspend \"Right to move any court\"     for enforcement of FRs except Article 20 and 21. (Can never be     suspended.)</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783862617341_html_56ce926301cd63d0.png\" width=\"529\" height=\"353\" > </p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Read the below statements marked as    Assertion (A) and Reason (R).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Assertion    (A):</b></span><span style=\"font-family:'Nirmala UI'\"> The    Mekong-Ganga Cooperation (MGC) was established in 2000 to    facilitate closer cultural and educational ties between India and    five Southeast Asian nations.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Reason    (R):</b></span><span style=\"font-family:'Nirmala UI'\"> The project    specifically excludes cooperation in the field of transport and    communication to focus solely on tourism and traditional medicine.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both (A) and (R) are true and (R)    is the correct explanation of (A).</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both (A) and (R) are true but (R)    is NOT the correct explanation of (A)</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(A) is true but (R) is false.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(A) is false but (R) is true.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: C) (A) is true    but (R) is false.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Assertion     (A) is True:</b></span><span style=\"font-family:'Nirmala UI'\"> The     MGC was launched in November </span><span style=\"font-family:'Nirmala UI'\"><b>2000</b></span><span style=\"font-family:'Nirmala UI'\"> at     Vientiane, Laos. It involves India and the five Mekong     countries: </span><span style=\"font-family:'Nirmala UI'\"><b>Cambodia,     Laos, Myanmar, Thailand, and Vietnam</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Reason     (R) is Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> The     MGC is built on four pillars: </span><span style=\"font-family:'Nirmala UI'\"><b>Tourism,     Culture, Education,</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>Transport     &amp; Communication</b></span><span style=\"font-family:'Nirmala UI'\">. It     does not exclude transport; in fact, it aims to improve regional     connectivity.<br> <br> </span><span style=\"font-family:'Nirmala UI'\"><i><b>Additional      Facts</b></i></span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Member     Countries:</b></span><span style=\"font-family:'Nirmala UI'\"> Laos,     India, Myanmar, Thailand, Vietnam, and </span><span style=\"font-family:'Nirmala UI'\"><b>Cambodia</b></span><span style=\"font-family:'Nirmala UI'\">.     China is NOT a member of MGC.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Rivers:</b></span><span style=\"font-family:'Nirmala UI'\"> It is     named after two major civilizational rivers: the </span><span style=\"font-family:'Nirmala UI'\"><b>Ganga</b></span><span style=\"font-family:'Nirmala UI'\"> and     the </span><span style=\"font-family:'Nirmala UI'\"><b>Mekong</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Connectivity     Project:</b></span><span style=\"font-family:'Nirmala UI'\"> The </span><span style=\"font-family:'Nirmala UI'\"><b>India-Myanmar-Thailand     Trilateral Highway</b></span><span style=\"font-family:'Nirmala UI'\"> is     a key project often discussed within the broader context of MGC     and </span><span style=\"font-family:'Nirmala UI'\"><b>\"Act     East\"</b></span><span style=\"font-family:'Nirmala UI'\"> policy.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Recent     Focus:</b></span><span style=\"font-family:'Nirmala UI'\"> In recent     ministerial meetings, the scope has expanded to include     agriculture, health, and science &amp; technology.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Headquarters:</b></span><span style=\"font-family:'Nirmala UI'\"> Unlike     ASEAN or SAARC, the MGC functions through annual ministerial     meetings; it does not have a single permanent central secretariat     building in a specific city.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783862617341_html_4eb62004ee8e37f8.png\" width=\"529\" height=\"353\" > </p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following countries    currently holds the position of the largest economy (by GDP)    within the Association of Southeast Asian Nations (ASEAN)?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Vietnam</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Thailand</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Indonesia</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Singapore</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: C) Indonesia</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     C is Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> Indonesia     is the largest economy in Southeast Asia and is the </span><span style=\"font-family:'Nirmala UI'\"><b>only     member of ASEAN</b></span><span style=\"font-family:'Nirmala UI'\"> that     is also a </span><span style=\"font-family:'Nirmala UI'\"><b>member of     the G20.</b></span><span style=\"font-family:'Nirmala UI'\"> Its     massive population and abundant natural resources contribute to     its leading GDP in the region.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Additional    Facts</b></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>ASEAN     Headquarters:</b></span><span style=\"font-family:'Nirmala UI'\"> Located     in </span><span style=\"font-family:'Nirmala UI'\"><b>Jakarta,     Indonesia</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Establishment:</b></span><span style=\"font-family:'Nirmala UI'\"> ASEAN     was established on August 8, 1967, with the signing of     the </span><span style=\"font-family:'Nirmala UI'\"><b>Bangkok     Declaration</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Founding     Members:</b></span><span style=\"font-family:'Nirmala UI'\"> Indonesia,     Malaysia, Philippines, Singapore, and Thailand.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Latest     Member: Timor-Leste</b></span><span style=\"font-family:'Nirmala UI'\"> became     the </span><span style=\"font-family:'Nirmala UI'\"><b>11th member </b></span><span style=\"font-family:'Nirmala UI'\">of     ASEAN on October 26, 2025, during the 47th ASEAN Summit in Kuala     Lumpur, Malaysia.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>India-ASEAN:</b></span><span style=\"font-family:'Nirmala UI'\"> India     is not a member of ASEAN but is a </span><span style=\"font-family:'Nirmala UI'\"><b>Dialogue     Partner</b></span><span style=\"font-family:'Nirmala UI'\">. The \"Act     East Policy\" is the primary framework for India's engagement     with this bloc.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>RCEP:</b></span><span style=\"font-family:'Nirmala UI'\"> The     Regional Comprehensive Economic Partnership is a massive free     trade agreement that includes all ASEAN members plus China,     Japan, South Korea, Australia, and New Zealand (India opted out     in 2019).</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following dynasties    established the first Afghan empire in India?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Khilji Dynasty</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lodi Dynasty</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Suri Dynasty</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sayyid Dynasty</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: B) Lodi Dynasty</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     First Afghan Empire:</b></span><span style=\"font-family:'Nirmala UI'\"> The </span><span style=\"font-family:'Nirmala UI'\"><b>Lodi     Dynasty (1451–1526 AD)</b></span><span style=\"font-family:'Nirmala UI'\"> was     the first Afghan (Pashtun) dynasty to rule the Delhi Sultanate.     It was founded by </span><span style=\"font-family:'Nirmala UI'\"><b>Bahlul     Lodi</b></span><span style=\"font-family:'Nirmala UI'\">, who replaced the     Sayyid Dynasty.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Second Afghan Empire:</b></span><span style=\"font-family:'Nirmala UI'\"> The </span><span style=\"font-family:'Nirmala UI'\"><b>Suri     Dynasty (1540–1556 AD)</b></span><span style=\"font-family:'Nirmala UI'\">,     founded by </span><span style=\"font-family:'Nirmala UI'\"><b>Sher     Shah Suri</b></span><span style=\"font-family:'Nirmala UI'\">, is     considered the </span><span style=\"font-family:'Nirmala UI'\"><b>Second     Afghan Empire</b></span><span style=\"font-family:'Nirmala UI'\"> in     India.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Additional    Facts</b></i></span></p>    <ul>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Founder:</b></span><span style=\"font-family:'Nirmala UI'\"> Bahlul      Lodi was the founder, but </span><span style=\"font-family:'Nirmala UI'\"><b>Sikandar      Lodi</b></span><span style=\"font-family:'Nirmala UI'\"> is      considered the most capable ruler of the dynasty.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Agra:</b></span><span style=\"font-family:'Nirmala UI'\"> Sikandar      Lodi founded the city of </span><span style=\"font-family:'Nirmala UI'\"><b>Agra</b></span><span style=\"font-family:'Nirmala UI'\"> in      1504 and made it his capital in 1506.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>End      of the Dynasty:</b></span><span style=\"font-family:'Nirmala UI'\"> The      last Lodi ruler, </span><span style=\"font-family:'Nirmala UI'\"><b>Ibrahim      Lodi</b></span><span style=\"font-family:'Nirmala UI'\">, was defeated and      killed by Babur in the </span><span style=\"font-family:'Nirmala UI'\"><b>First      Battle of Panipat (1526)</b></span><span style=\"font-family:'Nirmala UI'\">,      marking the end of the Delhi Sultanate and the beginning of the      Mughal Empire.</span></p>     </li></ul>    </ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </    <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Civil Aviation</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Samir Kumar Sinha</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Parliamentary Affairs</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Nikunja Bihari Dhal</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Administrative Reforms and       Public Grievances</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Nivedita Shukla Verma</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In which year was the Punchhi    Commission on Centre-State Relations officially established by the    Government of India?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2004</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2005</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2007</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2010</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: C) 2007</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Establishment:</b></span><span style=\"font-family:'Nirmala UI'\"> The     Commission was constituted by the Government of India in </span><span style=\"font-family:'Nirmala UI'\"><b>April     2007</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Leadership:</b></span><span style=\"font-family:'Nirmala UI'\"> It     was chaired by </span><span style=\"font-family:'Nirmala UI'\"><b>Madan     Mohan Punchhi</b></span><span style=\"font-family:'Nirmala UI'\">, the     former Chief Justice of India.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Objective:</b></span><span style=\"font-family:'Nirmala UI'\"> Its     mandate was to take a fresh look at the relative roles and     responsibilities of the various levels of Government and their     interactions after the changes that had occurred in the Indian     economy and polity since the </span><span style=\"font-family:'Nirmala UI'\"><b>Sarkaria     Commission</b></span><span style=\"font-family:'Nirmala UI'\"> (which     was set up in 1983).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Submission:</b></span><span style=\"font-family:'Nirmala UI'\"> The     Commission submitted its multi-volume report to the government     in </span><span style=\"font-family:'Nirmala UI'\"><b>2010</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Additional     Facts:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key     Recommendations:</b></span><span style=\"font-family:'Nirmala UI'\"> The     commission is famous for its suggestions regarding the </span><span style=\"font-family:'Nirmala UI'\"><b>Governor’s     role</b></span><span style=\"font-family:'Nirmala UI'\">, the </span><span style=\"font-family:'Nirmala UI'\"><b>tenure     of Governors</b></span><span style=\"font-family:'Nirmala UI'\">, and the     use of </span><span style=\"font-family:'Nirmala UI'\"><b>Article 355     and 356</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Comparison:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sarkaria      Commission:</b></span><span style=\"font-family:'Nirmala UI'\"> 1983      (Submitted 1988).</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Punchhi      Commission:</b></span><span style=\"font-family:'Nirmala UI'\"> 2007      (Submitted 2010).</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Governor's     Tenure:</b></span><span style=\"font-family:'Nirmala UI'\"> One of its     notable suggestions was that Governors should be given a </span><span style=\"font-family:'Nirmala UI'\"><b>fixed     tenure of five years</b></span><span style=\"font-family:'Nirmala UI'\"> and     their removal should not be at the sweet will of the Government     at the Centre.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Pocket     Veto:</b></span><span style=\"font-family:'Nirmala UI'\"> It also     recommended that the President should decide on the assent of     bills within a period of </span><span style=\"font-family:'Nirmala UI'\"><b>six     months.</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 13, "question": "Wुicु यी पुध ीियियथing यनgोnिधिधौ iौ ूनधौधnप in धहाोनदयपic cिधिस ृहप ोृौधnप in ूनयाोनदयपic cिधिस?", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ribosomes</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Plasma Membrane</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mitochondria</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Cytoplasm</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: C) Mitochondria</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     C is Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> Mitochondria     are membrane-bound organelles. One of the defining features     of </span><span style=\"font-family:'Nirmala UI'\"><b>prokaryotes</b></span><span style=\"font-family:'Nirmala UI'\"> (like     bacteria) is that they lack a nucleus and all membrane-bound     organelles, including </span><span style=\"font-family:'Nirmala UI'\"><b>mitochondria,     chloroplasts, and the endoplasmic reticulum</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Ribosomes:</b></span><span style=\"font-family:'Nirmala UI'\"> Both     cell types require ribosomes to synthesize proteins, though they     differ in size.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Plasma     Membrane:</b></span><span style=\"font-family:'Nirmala UI'\"> All     living cells have a phospholipid bilayer that acts as a selective     barrier. </span><span style=\"font-family:'Nirmala UI'\"><b>Composition     -</b></span><span style=\"font-family:'Nirmala UI'\"> Protein (50%)     and Lipids (50%)</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Cytoplasm:</b></span><span style=\"font-family:'Nirmala UI'\"> Both     types contain this jelly-like substance where metabolic reactions     occur.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding Karst Topography:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1.</b></span><span style=\"font-family:'Nirmala UI'\"> Karst    topography is primarily formed through the chemical weathering    process of carbonation on rocks such as limestone and dolomite.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>2. </b></span><span style=\"font-family:'Nirmala UI'\">Features    like Stalactites and Stalagmites are erosional landforms created    by the action of running water on the surface.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Statement I is correct</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Statement II is correct</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both Statement I and Statement II    are correct</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither Statement I nor Statement    II is correct</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: A) Only    Statement I is correct</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     I is Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> Karst     regions are shaped by the dissolution of soluble rocks. Rainwater     picks up carbon dioxide to form a weak carbonic acid, which     dissolves the calcium carbonate in limestone.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     II is Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> While </span><span style=\"font-family:'Nirmala UI'\"><b>Stalactites     and Stalagmites</b></span><span style=\"font-family:'Nirmala UI'\"> are     indeed </span><span style=\"font-family:'Nirmala UI'\"><b>Karst     features</b></span><span style=\"font-family:'Nirmala UI'\">, they     are </span><span style=\"font-family:'Nirmala UI'\"><b>depositional</b></span><span style=\"font-family:'Nirmala UI'\"> landforms     (formed by the dripping of mineral-rich water), not erosional.     Furthermore, they are underground (depositional) features rather     than surface features.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Additional    Facts</b></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Surface     Features:</b></span><span style=\"font-family:'Nirmala UI'\"> Common     surface landforms include </span><span style=\"font-family:'Nirmala UI'\"><b>Sinkholes</b></span><span style=\"font-family:'Nirmala UI'\"> (Doline), </span><span style=\"font-family:'Nirmala UI'\"><b>Lapis</b></span><span style=\"font-family:'Nirmala UI'\"> (irregular     grooves), and </span><span style=\"font-family:'Nirmala UI'\"><b>Uvalas</b></span><span style=\"font-family:'Nirmala UI'\"> (a     cluster of sinkholes).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Underground     Features:</b></span><span style=\"font-family:'Nirmala UI'\"> Caves,     Caverns, and the pillars formed when a stalactite and stalagmite     meet.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Blind     Valley:</b></span><span style=\"font-family:'Nirmala UI'\"> A valley     that ends abruptly when a surface stream disappears underground     into a sinkhole or \"ponor.\"</span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Global     Examples:</b></span><span style=\"font-family:'Nirmala UI'\"> The term     \"Karst\" comes from the </span><span style=\"font-family:'Nirmala UI'\"><b>Karst     region of the Balkans (Slovenia/Croatia).</b></span><span style=\"font-family:'Nirmala UI'\"> In     India, prominent karst topography can be found in the </span><span style=\"font-family:'Nirmala UI'\"><b>Bora     Caves</b></span><span style=\"font-family:'Nirmala UI'\"> (Andhra     Pradesh) and parts of </span><span style=\"font-family:'Nirmala UI'\"><b>Meghalaya</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Rock     Type:</b><
