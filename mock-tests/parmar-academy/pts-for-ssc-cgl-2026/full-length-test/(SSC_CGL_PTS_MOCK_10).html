style=\"font-family:'Nirmala UI'\"><b>is selected</b></span><span style=\"font-family:'Nirmala UI'\">,      he </span><span style=\"font-family:'Nirmala UI'\"><b>will</b></span><span style=\"font-family:'Nirmala UI'\"> receive      training.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate    one-word substitute for the following group of words:</span></p>    <p style=\"orphans:0;widows:0\">“<span style=\"font-family:'Nirmala UI'\">A    person who studies ancient human history through excavations and    artifacts.”</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Anthropologist</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Archaeologist</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Geologist</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Historian</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Anthropologist</b></span><span style=\"font-family:'Nirmala UI'\"> –     A person who studies human beings, their cultures, societies, and     evolution.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Archaeologist</b></span><span style=\"font-family:'Nirmala UI'\"> –     A person who studies ancient human history by excavating sites     and examining artifacts, monuments, and other physical remains.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Geologist</b></span><span style=\"font-family:'Nirmala UI'\"> –     A scientist who studies the Earth, rocks, minerals, fossils, and     geological processes.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Historian</b></span><span style=\"font-family:'Nirmala UI'\"> –     A person who researches, studies, and writes about historical     events, mainly using written records and historical sources.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Choose the most appropriate antonym    of the following word. Exonerate</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Convict</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Free</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Excuse</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Liberate</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Exonerate</b></span><span style=\"font-family:'Nirmala UI'\"> means     to officially absolve someone from blame or find them not guilty.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Convict</b></span><span style=\"font-family:'Nirmala UI'\"> means     to officially declare someone to be guilty of a criminal offense.     Hence, it is the exact antonym.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Free</b></span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-family:'Nirmala UI'\"><b>Excuse</b></span><span style=\"font-family:'Nirmala UI'\">,     and </span><span style=\"font-family:'Nirmala UI'\"><b>Liberate</b></span><span style=\"font-family:'Nirmala UI'\"> are     all synonyms or closely related terms to exonerate.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The question below consists of a    set of labelled sentences. Out of the four options given, select    the most logical order of the sentences to form a coherent    paragraph.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">P-    Epistemological idealists (such as Kant) might insist that the    only things which can be directly known for certain are ideas.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Q-    The approach to idealism by Western philosophers has been    different to that of Eastern thinkers.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">R-    In much of Western thought (though not in such major Western    thinkers as Plato and Hegel) the ideal relates to direct knowledge    of subjective mental ideas, or images.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">S-    It is then usually juxtaposed with realism in which the real is    said to have an absolute existence prior to and independent of our    knowledge.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">RQPS</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">PQSR</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">PRQS</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QRSP</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Q</b></span><span style=\"font-family:'Nirmala UI'\"> should     come first because it introduces the main topic: the difference     between the Western and Eastern approaches to idealism.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>R</b></span><span style=\"font-family:'Nirmala UI'\"> follows     because it elaborates on the </span><span style=\"font-family:'Nirmala UI'\"><b>Western     approach</b></span><span style=\"font-family:'Nirmala UI'\"> mentioned     in Q.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>S</b></span><span style=\"font-family:'Nirmala UI'\"> comes     next because the pronoun </span><span style=\"font-family:'Nirmala UI'\"><b>\"It\"</b></span><span style=\"font-family:'Nirmala UI'\"> refers     to </span><span style=\"font-family:'Nirmala UI'\"><b>\"the     ideal\"</b></span><span style=\"font-family:'Nirmala UI'\"> discussed     in R. It explains that the ideal is usually contrasted with     realism.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>P</b></span><span style=\"font-family:'Nirmala UI'\"> comes     last as it gives a </span><span style=\"font-family:'Nirmala UI'\"><b>specific     example</b></span><span style=\"font-family:'Nirmala UI'\"> of one     type of idealist (epistemological idealists such as Kant), making     it a concluding statement.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option D is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the correct option:<br> The    reforms, while ostensibly motivated by economic exigencies, were    in effect a veiled attempt to_______dissent under the guise of    austerity.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">impugn</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">rebut</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">swell</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">quell</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     sentence suggests that although the reforms appeared to be for     economic reasons, they were actually intended </span><span style=\"font-family:'Nirmala UI'\"><b>to     suppress or silence opposition (dissent).</b></span><span style=\"font-family:'Nirmala UI'\"> Therefore,     the verb should mean </span><span style=\"font-family:'Nirmala UI'\"><b>\"to     put an end to or suppress.\"</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Quell</b></span><span style=\"font-family:'Nirmala UI'\"> perfectly     fits this context.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Quell:</b></span><span style=\"font-family:'Nirmala UI'\"> to     suppress, calm, or put an end to.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Impugn:</b></span><span style=\"font-family:'Nirmala UI'\">  to     question or attack someone's integrity </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Rebut:</b></span><span style=\"font-family:'Nirmala UI'\">  to     refute or counter an argument </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Swell:</b></span><span style=\"font-family:'Nirmala UI'\">  to     increase or grow </span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option D is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate antonym    of the given word. Accentuate</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Emphasize</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Highlight</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Obscure</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Promote</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Accentuate</b></span><span style=\"font-family:'Nirmala UI'\"> means </span><span style=\"font-family:'Nirmala UI'\"><b>to     emphasize or make something more noticeable</b></span><span style=\"font-family:'Nirmala UI'\">.     Its antonym is </span><span style=\"font-family:'Nirmala UI'\"><b>Obscure</b></span><span style=\"font-family:'Nirmala UI'\">,     which means </span><span style=\"font-family:'Nirmala UI'\"><b>to hide     or make something less clear or noticeable</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Emphasize     - to give special importance </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Highlight     - to make prominent </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Promote     - to encourage or support </span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option C is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following passage, some    words have been deleted. Read the passage intently and choose the    most appropriate option to fill in each blank:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">To    speak of the political as an abstract structure is, perhaps,    already to concede to the logic of the archive: that which    preserves through containment, and (1) ______ through its very    naming. The subject here is neither born nor made—but suspended,    deferred in the machinic interplay of signifiers. One becomes    governable only to the extent that one appears, and to appear is    already to capitulate to the syntax of recognition. Power, then,    does not suppress but surfaces—it emerges in the folds of    citation, in the gentle violence of classification. The biometric    gaze is not ocular but computational; not what it sees, but what    it does not allow to vanish. Resistance, if it resists at all,    cannot be found in opposition, but in (2) ______—in the refusal    to be coherent, in the grammarless whisper. The body, meanwhile,    becomes a ledger: inscribed, decoded, re-encoded. What justice can    exist in such a system? Not that of law, but of rupture. A justice    that unbinds, that refuses the terms of its own invocation. It is    not reparation that is sought, but (3) ______—the unworking of    systems, the destitution of legibility. To enter this mode is to    abandon appeal, to relinquish the comfort of meaning. One must    instead submit to the possibility of a justice that never arrives,    that remains (4) ______, excessive and unlocatable. Only then can    we imagine a politics not of representation, but of presence    without capture, of subjectivity without scaffolding. What    remains, finally, is not identity but (5) ______—a presence that    eludes, that persists in the absence of affirmation.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">What    should come in the place of blank number [1]?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">extinguishes</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">reifies</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">evacuates</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">dissimulates</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     sentence suggests that the archive preserves things by </span><span style=\"font-family:'Nirmala UI'\"><b>giving     them a fixed identity through naming</b></span><span style=\"font-family:'Nirmala UI'\">. </span><span sty s in the folds of    citation, in the gentle violence of classification. The biometric    gaze is not ocular but computational; not what it sees, but what    it does not allow to vanish. Resistance, if it resists at all,    cannot be found in opposition, but in (2) ______—in the refusal    to be coherent, in the grammarless whisper. The body, meanwhile,    becomes a ledger: inscribed, decoded, re-encoded. What justice can    exist in such a system? Not that of law, but of rupture. A justice    that unbinds, that refuses the terms of its own invocation. It is    not reparation that is sought, but (3) ______—the unworking of    systems, the destitution of legibility. To enter this mode is to    abandon appeal, to relinquish the comfort of meaning. One must    instead submit to the possibility of a justice that never arrives,    that remains (4) ______, excessive and unlocatable. Only then can    we imagine a politics not of representation, but of presence    without capture, of subjectivity without scaffolding. What    remains, finally, is not identity but (5) ______—a presence that    eludes, that persists in the absence of affirmation.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">What    should come in the place of blank number [2]?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">conditionality</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">aesthetic refusal</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">algorithmic agency</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">asymbolic opacity</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     passage describes resistance as a </span><span style=\"font-family:'Nirmala UI'\"><b>refusal     to be coherent or fully understood</b></span><span style=\"font-family:'Nirmala UI'\">. </span><span style=\"font-family:'Nirmala UI'\"><b>Asymbolic     opacity</b></span><span style=\"font-family:'Nirmala UI'\"> refers to     a state of </span><span style=\"font-family:'Nirmala UI'\"><b>remaining     unreadable or resisting interpretation</b></span><span style=\"font-family:'Nirmala UI'\">,     making it the most appropriate choice in this philosophical     context.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conditionality</b></span><span style=\"font-family:'Nirmala UI'\"> :     dependence on certain conditions</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Aesthetic     refusal</b></span><span style=\"font-family:'Nirmala UI'\"> :     rejection based on artistic or aesthetic principles</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Algorithmic     agency</b></span><span style=\"font-family:'Nirmala UI'\"> : the     ability of algorithms to act or make decisions</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option D is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following passage, some    words have been deleted. Read the passage intently and choose the    most appropriate option to fill in each blank:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">To    speak of the political as an abstract structure is, perhaps,    already to concede to the logic of the archive: that which    preserves through containment, and (1) ______ through its very    naming. The subject here is neither born nor made—but suspended,    deferred in the machinic interplay of signifiers. One becomes    governable only to the extent that one appears, and to appear is    already to capitulate to the syntax of recognition. Power, then,    does not suppress but surfaces—it emerges in the folds of    citation, in the gentle violence of classification. The biometric    gaze is not ocular but computational; not what it sees, but what    it does not allow to vanish. Resistance, if it resists at all,    cannot be found in opposition, but in (2) ______—in the refusal    to be coherent, in the grammarless whisper. The body, meanwhile,    becomes a ledger: inscribed, decoded, re-encoded. What justice can    exist in such a system? Not that of law, but of rupture. A justice    that unbinds, that refuses the terms of its own invocation. It is    not reparation that is sought, but (3) ______—the unworking of    systems, the destitution of legibility. To enter this mode is to    abandon appeal, to relinquish the comfort of meaning. One must    instead submit to the possibility of a justice that never arrives,    that remains (4) ______, excessive and unlocatable. Only then can    we imagine a politics not of representation, but of presence    without capture, of subjectivity without scaffolding. What    remains, finally, is not identity but (5) ______—a presence that    eludes, that persists in the absence of affirmation.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">What    should come in the place of blank number [3]?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">abolition</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">restitution</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">destitution</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">reconciliation</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     passage seeks </span><span style=\"font-family:'Nirmala UI'\"><b>not     repair (reparation)</b></span><span style=\"font-family:'Nirmala UI'\"> but     the </span><span style=\"font-family:'Nirmala UI'\"><b>undoing of     systems and legibility</b></span><span style=\"font-family:'Nirmala UI'\">. </span><span style=\"font-family:'Nirmala UI'\"><b>Destitution</b></span><span style=\"font-family:'Nirmala UI'\"> here     is used in its </span><span style=\"font-family:'Nirmala UI'\"><b>philosophical     sense</b></span><span style=\"font-family:'Nirmala UI'\">: </span><span style=\"font-family:'Nirmala UI'\"><b>the     deactivation or unmaking of existing structures and power</b></span><span style=\"font-family:'Nirmala UI'\">,     not merely poverty. Hence, it best fits the context.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Abolition</b></span><span style=\"font-family:'Nirmala UI'\"> :     the formal ending of a system or institution</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Restitution</b></span><span style=\"font-family:'Nirmala UI'\"> :     restoration or compensation for loss</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Reconciliation</b></span><span style=\"font-family:'Nirmala UI'\"> :     restoration of harmony or friendly relations</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option C is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following passage, some    words have been deleted. Read the passage intently and choose the    most appropriate option to fill in each blank:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">To    speak of the political as an abstract structure is, perhaps,    already to concede to the logic of the archive: that which    preserves through containment, and (1) ______ through its very    naming. The subject here is neither born nor made—but suspended,    deferred in the machinic interplay of signifiers. One becomes    governable only to the extent that one appears, and to appear is    already to capitulate to the syntax of recognition. Power, then,    does not suppress but surfaces—it emerges in the folds of    citation, in the gentle violence of classification. The biometric    gaze is not ocular but computational; not what it sees, but what    it does not allow to vanish. Resistance, if it resists at all,    cannot be found in opposition, but in (2) ______—in the refusal    to be coherent, in the grammarless whisper. The body, meanwhile,    becomes a ledger: inscribed, decoded, re-encoded. What justice can    exist in such a system? Not that of law, but of rupture. A justice    that unbinds, that refuses the terms of its own invocation. It is    not reparation that is sought, but (3) ______—the unworking of    systems, the destitution of legibility. To enter this mode is to    abandon appeal, to relinquish the comfort of meaning. One must    instead submit to the possibility of a justice that never arrives,    that remains (4) ______, excessive and unlocatable. Only then can    we imagine a politics not of representation, but of presence    without capture, of subjectivity without scaffolding. What    remains, finally, is not identity but (5) ______—a presence that    eludes, that persists in the absence of affirmation.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">What    should come in the place of blank number [4]?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">imminent</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">incalculable</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">deferred</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">restitutive</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     phrase </span><span style=\"font-family:'Nirmala UI'\"><b>“remains     ______, excessive and unlocatable”</b></span><span style=\"font-family:'Nirmala UI'\"> describes     a justice that </span><span style=\"font-family:'Nirmala UI'\"><b>cannot     be measured, predicted, or fully     comprehended</b></span><span style=\"font-family:'Nirmala UI'\">. </span><span style=\"font-family:'Nirmala UI'\"><b>Incalculable</b></span><span style=\"font-family:'Nirmala UI'\"> means </span><span style=\"font-family:'Nirmala UI'\"><b>impossible     to calculate, estimate, or fully understand</b></span><span style=\"font-family:'Nirmala UI'\">,     which best matches the philosophical tone of the passage.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Imminent</b></span><span style=\"font-family:'Nirmala UI'\"> :     about to happen very soon</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Deferred</b></span><span style=\"font-family:'Nirmala UI'\"> :     postponed or delayed</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Restitutive</b></span><span style=\"font-family:'Nirmala UI'\"> :     intended to restore or compensate for loss</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following passage, some    words have been deleted. Read the passage intently and choose the    most appropriate option to fill in each blank:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">To    speak of the political as an abstract structure is, perhaps,    already to concede to the logic of the archive: that which    preserves through containment, and (1) ______ through its very    naming. The subject here is neither born nor made—but suspended,    deferred in the machinic interplay of signifiers. One becomes    governable only to the extent that one appears, and to appear is    already to capitulate to the syntax of recognition. Power, then,    does not suppress but surfaces—it emerges in the folds of    citation, in the gentle violence of classification. The biometric    gaze is not ocular but computational; not what it sees, but what    it does not allow to vanish. Resistance, if it resists at all,    cannot be found in opposition, but in (2) ______—in the refusal    to be coherent, in the grammarless whisper. The body, meanwhile,    becomes a ledger: inscribed, decoded, re-encoded. What justice can    exist in such a system? Not that of law, but of rupture. A justice    that unbinds, that refuses the terms of its own invocation. It is    not reparation that is sought, but (3) ______—the unworking of    systems, the destitution of legibility. To enter this mode is to    abandon appeal, to relinquish the comfort of meaning. One must    instead submit to the possibility of a justice that never arrives,    that remains (4) ______, excessive and unlocatable. Only then can    we imagine a politics not of representation, but of presence    without capture, of subjectivity without scaffolding. What    remains, finally, is not identity but (5) ______—a presence that    eludes, that persists in the absence of affirmation.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">What    should come in the place of blank number [5]?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">fugitive form</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">spectral coherence</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">passive unity</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ontic recurrence</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     passage ends by describing </span><span style=\"font-family:'Nirmala UI'\"><b>a     presence that eludes and persists without affirmation</b></span><span style=\"font-family:'Nirmala UI'\">. </span><span style=\"font-family:'Nirmala UI'\"><b>Fugitive     form</b></span><span style=\"font-family:'Nirmala UI'\"> means </span><span style=\"font-family:'Nirmala UI'\"><b>an     elusive or escaping form of existence</b></span><span style=\"font-family:'Nirmala UI'\">,     which perfectly matches this idea of identity resisting capture     and fixed definition.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Spectral     coherence</b></span><span style=\"font-family:'Nirmala UI'\"> :     ghost-like consistency or unity</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Passive     unity</b></span><span style=\"font-family:'Nirmala UI'\"> : inactive     or unresisting oneness</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Ontic     recurrence</b></span><span style=\"font-family:'Nirmala UI'\"> :     repeated existence or recurrence at the level of being</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate synonym    of the given word: Belligerent</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Aggressive</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Peaceful</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Timid</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Humble</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Belligerent</b></span><span style=\"font-family:'Nirmala UI'\"> refers     to a person who is hostile or inclined to fight.     Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>Aggressive</b></span><span style=\"font-family:'Nirmala UI'\"> is     the closest synonym.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Aggressive</b></span><span style=\"font-family:'Nirmala UI'\"> –     Ready to attack or confront; forceful.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Peaceful</b></span><span style=\"font-family:'Nirmala UI'\"> –     Calm and free from conflict or violence.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Timid</b></span><span style=\"font-family:'Nirmala UI'\"> –     Lacking courage or confidence; shy.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Humble</b></span><span style=\"font-family:'Nirmala UI'\"> –     Modest and not arrogant.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Choose the correct meaning of the    idiom </span><span style=\"font-family:'Nirmala UI'\"><b>“At sixes    and sevens.”</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In a state of confusion or disorder</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Living a luxurious life</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Completely satisfied</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Very punctual</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     idiom </span><span style=\"font-family:'Nirmala UI'\"><b>\"At     sixes and sevens\"</b></span><span style=\"font-family:'Nirmala UI'\"> means </span><span style=\"font-family:'Nirmala UI'\"><b>to     be in a state of confusion, disorder, or uncertainty</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The      idiom </span><span style=\"font-family:'Nirmala UI'\"><b>\"At      sixes and sevens\"</b></span><span style=\"font-family:'Nirmala UI'\"> originated      in </span><span style=\"font-family:'Nirmala UI'\"><b>medieval      England</b></span><span style=\"font-family:'Nirmala UI'\">. It is      believed to have come from a dispute between two London merchant      guilds—the </span><span style=\"font-family:'Nirmala UI'\"><b>Merchant      Taylors' Company</b></span><span style=\"font-family:'Nirmala UI'\"> and      the </span><span style=\"font-family:'Nirmala UI'\"><b>Skinners'      Company</b></span><span style=\"font-family:'Nirmala UI'\">—over      precedence in ceremonial processions. In </span><span style=\"font-family:'Nirmala UI'\"><b>1484</b></span><span style=\"font-family:'Nirmala UI'\">,      Act of Accord settled the dispute by allowing the two guilds to      alternate sixth and seventh positions each year. Another widely      accepted explanation links the phrase to the medieval dice      game </span><span style=\"font-family:'Nirmala UI'\"><b>Hazard</b></span><span style=\"font-family:'Nirmala UI'\">,      where the numbers </span><span style=\"font-family:'Nirmala UI'\"><b>six</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>seven</b></span><span style=\"font-family:'Nirmala UI'\"> represented      uncertainty or a risky situation. Over time, </span><span style=\"font-family:'Nirmala UI'\"><b>\"at      sixes and sevens\"</b></span><span style=\"font-family:'Nirmala UI'\"> came      to mean </span><span style=\"font-family:'Nirmala UI'\"><b>being in a      state of confusion, disorder, or uncertainty</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Find the part of the sentence that    contains an error:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">In    response to an alarming spike in fraudulent transactions, (1)/ the    bank introduced mechanism (2)/ to verify customer identities using    two-factor authentication, (3)/ biometric checks, and behavioural    patterns. (4)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(1)</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(2)</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(3)</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(4)</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     phrase </span><span style=\"font-family:'Nirmala UI'\"><b>\"introduced     mechanism\"</b></span><span style=\"font-family:'Nirmala UI'\"> is     incorrect because </span><span style=\"font-family:'Nirmala UI'\"><b>mechanism</b></span><span style=\"font-family:'Nirmala UI'\"> is     a </span><span style=\"font-family:'Nirmala UI'\"><b>countable     singular noun</b></span><span style=\"font-family:'Nirmala UI'\"> and     requires an article. It should be </span><span style=\"font-family:'Nirmala UI'\"><b>\"introduced     a mechanism\"</b></span><span style=\"font-family:'Nirmala UI'\"> or </span><span style=\"font-family:'Nirmala UI'\"><b>“introduced     mechanisms.”</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Correct     Sentence:  </b></span><span style=\"font-family:'Nirmala UI'\">In     response to an alarming spike in fraudulent transactions, the     bank introduced </span><span style=\"font-family:'Nirmala UI'\"><b>a     mechanism</b></span><span style=\"font-family:'Nirmala UI'\"> to     verify customer identities using two-factor authentication,     biometric checks, and behavioural patterns.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the option that expresses    the given sentence in passive voice.<br>  The government is    implementing new policies to reduce pollution in the city.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The government implemented new    policies to reduce pollution in the city.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The implementation of new policies    to reduce pollution in the city is by the government.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The government will implement new    policies to reduce pollution in the city.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">New policies are being implemented    by the government to reduce pollution in the city.</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     given sentence is in the </span><span style=\"font-family:'Nirmala UI'\"><b>Present     Continuous Tense</b></span><span style=\"font-family:'Nirmala UI'\"> (is     implementing). </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In     the passive voice, the structure becomes </span><span style=\"font-family:'Nirmala UI'\"><b>am/is/are     + being + past participle (V³)</b></span><span style=\"font-family:'Nirmala UI'\">.     Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>\"are     being implemented\"</b></span><span style=\"font-family:'Nirmala UI'\"> is     the correct passive form.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option D is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following question, a    sentence has been given in Direct/Indirect speech. Out of the four    alternatives suggested, select the one which best expresses the    same sentence in Indirect/Direct speech.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Rahul's    mother reminded him to take his wallet.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">\"Are you going to take your    wallet or not?\" said Rahul to his mother.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">\"Don't forget to take your    wallet, Rahul,\" said his mother.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Rahul's mother said, \"Remember    to take your wallet, Rahul?</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">\"Here is your wallet Rahul\"    said his mother.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     indirect sentence uses the reporting verb </span><span style=\"font-family:'Nirmala UI'\"><b>\"reminded\"</b></span><span style=\"font-family:'Nirmala UI'\">,     which used to express a </span><span style=\"font-family:'Nirmala UI'\"><b>reminder</b></span><span style=\"font-family:'Nirmala UI'\"> or </span><span style=\"font-family:'Nirmala UI'\"><b>advice</b></span><span style=\"font-family:'Nirmala UI'\">.     In direct speech, such reminders are commonly expressed     with </span><span style=\"font-family:'Nirmala UI'\"><b>\"Don't     forget to...\"</b></span><span style=\"font-family:'Nirmala UI'\">.     Therefore, </span><span style=\"font-family:'Nirmala UI'\"><b>Option     B</b></span><span style=\"font-family:'Nirmala UI'\"> accurately     conveys the same meaning.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the option that expresses    the given sentence in active voice.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">In    Japan, thousands of people were killed in the tsunami last week.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The tsunami has killed thousands of    people last week in Japan.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The tsunami killed thousands of    people in Japan last week.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The tsunami had killed thousands of    people last week in Japan.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The tsunami have killed thousands    of people in Japan last week.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     given sentence is in the </span><span style=\"font-family:'Nirmala UI'\"><b>Simple     Past Passive Voice</b></span><span style=\"font-family:'Nirmala UI'\"> (were     killed). To change it into the </span><span style=\"font-family:'Nirmala UI'\"><b>Active     Voice</b></span><span style=\"font-family:'Nirmala UI'\">, the object </span><span style=\"font-family:'Nirmala UI'\"><b>\"the     tsunami\"</b></span><span style=\"font-family:'Nirmala UI'\"> becomes     the subject and the verb changes to the </span><span style=\"font-family:'Nirmala UI'\"><b>Simple     Past Active</b></span><span style=\"font-family:'Nirmala UI'\"> (killed).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(A)</b></span><span style=\"font-family:'Nirmala UI'\"> Uses </span><span style=\"font-family:'Nirmala UI'\"><b>Present     Perfect</b></span><span style=\"font-family:'Nirmala UI'\"> (has     killed), which changes the tense.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(C)</b></span><span style=\"font-family:'Nirmala UI'\"> Uses </span><span style=\"font-family:'Nirmala UI'\"><b>Past     Perfect</b></span><span style=\"font-family:'Nirmala UI'\"> (had     killed), which changes the tense.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(D)</b></span><span style=\"font-family:'Nirmala UI'\"> Uses </span><span style=\"font-family:'Nirmala UI'\"><b>Present     Perfect</b></span><span style=\"font-family:'Nirmala UI'\"> and is     also grammatically incorrect (have killed).</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Choose the incorrectly spelt word.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Questionnaire</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Exaggerate</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Seperate</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Miscellaneous</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Questionnaire</b></span><span style=\"font-family:'Nirmala UI'\"> –     A set of questions designed to collect information.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Exaggerate</b></span><span style=\"font-family:'Nirmala UI'\"> –     To describe something as greater or more important than it really     is.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Seperate</b></span><span style=\"font-family:'Nirmala UI'\"> – </span><span style=\"font-family:'Nirmala UI'\"><b>Incorrect     spelling</b></span><span style=\"font-family:'Nirmala UI'\"> o \"catch a     Tartar\"</b></span><span style=\"font-family:'Nirmala UI'\"> means </span><span style=\"font-family:'Nirmala UI'\"><b>to     encounter a person who is much stronger, more capable, or more     difficult to deal with than expected</b></span><span style=\"font-family:'Nirmala UI'\">.     In the sentence, the bully expected an easy target, but the new     student resisted confidently, making the bully face an unexpected     challenge.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     option C is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Fill in the blanks with the set of    correct articles for the following sentence.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">____    report submitted by the committee revealed ____ unusual incident    during ____ inspection that lasted for ____ week.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The, an, an, a</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A, a, the , an</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">An, a, a, an</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The, a, the, an</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct sentence : The report    submitted by the committee revealed an unusual incident during an    inspection that lasted for a week.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     report</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Refers to a specific report.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>An     unusual incident</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     unusual begins with a vowel sound, so </span><span style=\"font-family:'Nirmala UI'\"><b>an</b></span><span style=\"font-family:'Nirmala UI'\"> is     used.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>An     inspection</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     inspection begins with a vowel sound, so </span><span style=\"font-family:'Nirmala UI'\"><b>an</b></span><span style=\"font-family:'Nirmala UI'\"> is     correct.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>A     week</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     week begins with the consonant sound /w/, so </span><span style=\"font-family:'Nirmala UI'\"><b>a</b></span><span style=\"font-family:'Nirmala UI'\"> is     used.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the most appropriate option    to change the narration (direct/indirect) of the given sentence.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    scientist said, \"Water boils at 100°C under normal    atmospheric pressure.\"</span></p>    <p style=\"orphans:0;widows:0\"> </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The scientist said that Water    boiled at 100°C under normal atmospheric pressure.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The scientist said that Water boils    at 100°C under normal atmospheric pressure.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The scientist said that water had    boiled at 100°C under normal atmospheric pressure.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The scientist said water boils at    100°C under normal atmospheric pressure.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">When     converting direct speech into indirect (reported) speech, the     tense of the verb typically shifts to the past. However, there is     a major exception: </span><span style=\"font-family:'Nirmala UI'\"><b>universal     truths, scientific facts, and habitual actions remain in the     simple present tense.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Universal     Truth: The scientist said that Water boils at 100°C under normal     atmospheric pressure.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Tense     Retention: Because the statement is still true at the time of     reporting, the verb \"boils\" does not change to \"boils\".</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 51, "question": "   initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>

</head>

  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);

  } catch (err) {

  }

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
