swer is: </span><span style=\"font-family:'Nirmala UI'\"><b>C) Boong.</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     film is the directorial debut of </span><span style=\"font-family:'Nirmala UI'\"><b>Lakshmipriya     Devi</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Plot:</b></span><span style=\"font-family:'Nirmala UI'\"> Set     against the backdrop of social and political tensions in Manipur,     it is a coming-of-age drama about a young boy named Boong who     embarks on a journey to find his father and surprise his mother     with a gift, hoping to reunite his family.</span></p>    </li>\n</ul>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Category</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Details</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Film Name</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><i>Boong</i></span><span style=\"font-family:'Nirmala UI'\"> (Manipuri       language)</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Award Category</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Best Children’s &amp; Family       Film (BAFTA 2026)</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Director</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Lakshmipriya Devi</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Lead Actors</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Gugun Kipgen and Bala Hijam</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Production House</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Excel Entertainment (Farhan       Akhtar &amp; Ritesh Sidhwani)</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding the Meandering of Rivers and identify the    correct option:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">1. Meandering    is a phenomenon where a river flows in a series of regular sinuous    curves, bends, or loops.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">2.    In India, rivers typically exhibit meandering behavior during    their youthful stage.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">3.    The Jhelum is the only river in India that exhibits    meandering in its youthful stage.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Statements 1 and 2 are correct</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Statements 2 and 3 are correct</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Statements 1 and 3 are correct</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">All Statements are correct</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "   <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>C)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Only    Statement 1 and 3 are correct.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Meandering     is the process where a river, instead of flowing straight,     develops a </span><span style=\"font-family:'Nirmala UI'\"><b>sinuous     (S-shaped)</b></span><span style=\"font-family:'Nirmala UI'\"> path.     This happens primarily due to lateral erosion and deposition. </span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>statement    1 is correct.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Erosion</b></span><span style=\"font-family:'Nirmala UI'\"> occurs     on the outer bank (cut bank), where the water velocity is high.</span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Deposition</b></span><span style=\"font-family:'Nirmala UI'\"> occurs     on the inner bank (point bar), where the water velocity is lower.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Stages    of a River</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In    general geomorphology, rivers </span><span style=\"font-family:'Nirmala UI'\"><b>do    not</b></span><span style=\"font-family:'Nirmala UI'\"> exhibit    meandering during their </span><span style=\"font-family:'Nirmala UI'\"><b>youthful    stage</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Youthful     Stage:</b></span><span style=\"font-family:'Nirmala UI'\"> The river     is in a mountainous region with a steep gradient. The energy is     focused on </span><span style=\"font-family:'Nirmala UI'\"><b>vertical     erosion</b></span><span style=\"font-family:'Nirmala UI'\">, leading to     V-shaped valleys and waterfalls.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Mature/Old     Stage:</b></span><span style=\"font-family:'Nirmala UI'\"> As the     river hits the plains (gentle gradient), its energy shifts     to </span><span style=\"font-family:'Nirmala UI'\"><b>lateral erosion</b></span><span style=\"font-family:'Nirmala UI'\">.     This is where meandering, oxbow lakes, and floodplains are     typically formed.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>statement    2 is incorrect.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Jhelum River is a unique case in Indian geography. Although it is     in its mountainous (youthful) stage while flowing through     the </span><span style=\"font-family:'Nirmala UI'\"><b>Kashmir Valley</b></span><span style=\"font-family:'Nirmala UI'\">,     it exhibits distinct meandering</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,</span><span style=\"font-family:'Nirmala UI'\"><b> statement    3 is correct.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Features Associated with Meanders</b></span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Feature</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Description</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Oxbow Lake</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">A crescent-shaped lake formed       when a wide meander is cut off from the main river channel.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Meander Neck</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">The narrow strip of land between       two loops of a meander.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Slip-off Slope</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">The gentle slope on the inner       bend where sediment is deposited.</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784896089548_html_1b455476b51a2dd8.png\" width=\"529\" height=\"353\" > </p>", "question_heading": ""}, {"sr_no": 15, "question": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Match the following historical    education commissions/milestones of British India with their    respective formation years and select the correct code:</span></p>    <table>     <col>      <col>      <thead>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>List-I        (Commission/Milestone)</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>List-II (Year)</b></span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>     </thead>     <tbody>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">(a) Macaulay’s Minute</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">(1) 1882</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">(b) Wood’s Despatch</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">(2) 1904</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">(c) Hunter Commission</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">(3) 1835</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">(d) Indian Universities Act</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">(4) 1854</span></p>       </td>      </tr>     </tbody>    </table>", "option1": "<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">(a)-3, (b)-4, (c)-1, (d)-2</span></p>", "option2": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">(a)-3, (b)-4, (c)-2, (d)-1</span></p>", "option3": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">(a)-4, (b)-3, (c)-1, (d)-2</span></p>", "option4": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">(a)-4, (b)-3, (c)-2, (d)-1</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>A)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>(a)-3,    (b)-4, (c)-1, (d)-2</b></span></p>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Macaulay’s Minute (1835)</b></span></p>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Key Aim:</b></span><span style=\"font-family:'Nirmala UI'\"> To     introduce </span><span style=\"font-family:'Nirmala UI'\"><b>Western     education in English</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Famously advocated for creating a     class of \"Indians in blood and color, but English in taste,     in opinions, in morals, and in intellect.\"</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Downward Filtration Theory:</b></span><span style=\"font-family:'Nirmala UI'\"> The     idea was to educate a small upper class, who would then \"filter\"     that knowledge down to the masses.</span></p>    </li></ul>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Wood’s Despatch (1854)</b></span></p>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Known as the </span><span style=\"font-family:'Nirmala UI'\"><b>\"Magna     Carta of English Education in India.\"</b></span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">It laid the foundation for     the </span><span style=\"font-family:'Nirmala UI'\"><b>modern     education system</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">It recommended setting up     universities in Calcutta, Bombay, and Madras (established in     1857) and stressed the importance of female education and teacher     training.</span></p>    </li></ul>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Hunter Commission (1882)</b></span></p>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Chairman:</b></span><span style=\"font-family:'Nirmala UI'\"> William     Wilson Hunter.</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">It was specifically tasked to look     into the progress of education since Wood’s Despatch.</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Its primary recommendation was     that the state should give special attention to </span><span style=\"font-family:'Nirmala UI'\"><b>Primary     Education</b></span><span style=\"font-family:'Nirmala UI'\">, leaving     higher education to private enterprise.</span></p>    </li></ul>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Indian Universities Act (1904)</b></span></p>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Viceroy:</b></span><span style=\"font-family:'Nirmala UI'\"> Lord</span><span style=\"font-family:'Nirmala UI'\"><b> Curzon.</b></span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Context:</b></span><span style=\"font-family:'Nirmala UI'\"> Based     on the recommendations of the </span><span style=\"font-family:'Nirmala UI'\"><b>Raleigh     Commission (1902)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">It brought universities under     tighter government control to curb the rising tide of nationalism     among the student population.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Indira Bora, conferred with the    prestigious Padma Shri in 2020, is primarily celebrated for her    pioneering contributions to which Indian classical dance form?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kuchipudi</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kathak</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sattriya</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Odissi</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>C)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Sattriya.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    Sangeet Natak Akademi officially recognized </span><span style=\"font-family:'Nirmala UI'\"><b>Sattriya</b></span><span style=\"font-family:'Nirmala UI'\"> as    a Classical Dance form on </span><span style=\"font-family:'Nirmala UI'\"><b>November    15, 2000</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sattriya    Dance</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     originated in the </span><span style=\"font-family:'Nirmala UI'\"><b>15th     century</b></span><span style=\"font-family:'Nirmala UI'\"> in </span><span style=\"font-family:'Nirmala UI'\"><b>Assam.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     was introduced by the great Vaishnava saint and social     reformer </span><span style=\"font-family:'Nirmala UI'\"><b>Srimanta     Sankardeva.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     dance was developed as a medium to spread the </span><span style=\"font-family:'Nirmala UI'\"><b>Bhakti     movement</b></span><span style=\"font-family:'Nirmala UI'\"> (specifically     Vaishnavism). </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     was traditionally performed by male monks (</span><span style=\"font-family:'Nirmala UI'\"><i><b>Bhokots</b></i></span><span style=\"font-family:'Nirmala UI'\">)     in monasteries known as </span><span style=\"font-family:'Nirmala UI'\"><b>Sattras</b></span><span style=\"font-family:'Nirmala UI'\">,     which is where the name \"Sattriya\" comes from.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Performances     are based on mythological stories, particularly the legends     of </span><span style=\"font-family:'Nirmala UI'\"><b>Lord Krishna.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is performed to the tunes of </span><span style=\"font-family:'Nirmala UI'\"><b>Borgeets</b></span><span style=\"font-family:'Nirmala UI'\"> (devotional     songs) and accompanied by instruments like     the </span><span style=\"font-family:'Nirmala UI'\"><b>Khol</b></span><span style=\"font-family:'Nirmala UI'\"> (drum), </span><span style=\"font-family:'Nirmala UI'\"><b>Taal</b></span><span style=\"font-family:'Nirmala UI'\"> (cymbals),     and flute</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Exponents     : Jatin Goswami, Guru Ghanakanta Bora, Maniram Dutta, Bhupen     Hazarika, Meenakshi Medha, Sharodi Saikia.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>List    of Classical Dances Recognized by Sangeet Natak Akademi</b></u></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">As    of now, the Akademi recognizes </span><span style=\"font-family:'Nirmala UI'\"><b>8    classical dances.</b></span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Bharatanatyam</b></span><span style=\"font-family:'Nirmala UI'\"> (Tamil     Nadu)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Kathak</b></span><span style=\"font-family:'Nirmala UI'\"> (North     India)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Kathakali</b></span><span style=\"font-family:'Nirmala UI'\"> (Kerala)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Kuchipudi</b></span><span style=\"font-family:'Nirmala UI'\"> (Andhra     Pradesh)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Odissi</b></span><span style=\"font-family:'Nirmala UI'\"> (Odisha)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Manipuri</b></span><span style=\"font-family:'Nirmala UI'\"> (Manipur)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Mohiniyattam</b></span><span style=\"font-family:'Nirmala UI'\"> (Kerala)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sattriya</b></span><span style=\"font-family:'Nirmala UI'\"> (Assam)     — The most recent addition (2000).</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">While    the Sangeet Natak Akademi recognizes 8 forms, the </span><span style=\"font-family:'Nirmala UI'\"><b>Ministry    of Culture</b></span><span style=\"font-family:'Nirmala UI'\"> recognizes </span><span style=\"font-family:'Nirmala UI'\"><b>9</b></span><span style=\"font-family:'Nirmala UI'\"> (including </span><span style=\"font-family:'Nirmala UI'\"><b>Chhau</b></span><span style=\"font-family:'Nirmala UI'\">).</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ascaris belongs to which of the    following phylum of the animal kingdom?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Annelida</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Platyhelminthes</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Arthropoda</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Aschelminthes</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>D)    Aschelminthes.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Ascaris    belongs to the phylum </span><span style=\"font-family:'Nirmala UI'\"><b>Aschelminthes. </b></span><span style=\"font-family:'Nirmala UI'\">They    are triploblastic, bilaterally symmetrical, and uniquely    categorized as </span><span style=\"font-family:'Nirmala UI'\"><b>pseudocoelomates.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Platyhelminthes     :</b></span><span style=\"font-family:'Nirmala UI'\"> Consists of     flatworms (like tapeworms and liver flukes) , lack a body cavity     (acoelomates).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Annelida     :</b></span><span style=\"font-family:'Nirmala UI'\"> Consists of     segmented worms (like earthworms and leeches) that have a true     body cavity (coelomates).</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Arthropoda     : </b></span><span style=\"font-family:'Nirmala UI'\">Largest phylum     in Animal Knigdom. Insecta is the largest class. They have joint     appendages(jointed legs). True coelom and triploblastic.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following statements    correctly explains the core idea and primary purpose of    a Constitution?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is a set of rules that primarily    grants absolute power to the government to maintain order</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is a legal document that defines    the relationship between different religions within a state</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is a fundamental legal document    that defines the framework of government and places limitations on    its power to protect the rights of citizens</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is a collection of ancient    traditions that can only be changed by the judiciary of a country</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>C)    It is a fundamental legal document that defines the framework of    government and places limitations on its power to protect the    rights of citizens.</b></span></p>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Key    Features of the Indian Constitution</b></u></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>A. Longest    Written Constitution</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>B. Drawn    from Various Sources</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>UK:</b></span><span style=\"font-family:'Nirmala UI'\"> Parliamentary     form of government, Rule of Law, Single Citizenship.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>USA:</b></span><span style=\"font-family:'Nirmala UI'\"> Fundamental     Rights, Judicial Review, Preamble.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Ireland:</b></span><span style=\"font-family:'Nirmala UI'\"> Directive     Principles of State Policy (DPSP).</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Canada:</b></span><span style=\"font-family:'Nirmala UI'\"> Federation     with a strong Centre</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>C. Federal    System with Unitary Bias</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>D. Parliamentary    Form of Government</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>E. Synthesis    of Parliamentary Sovereignty and Judicial Supremacy</b></span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784896089548_html_8692b3c1dfb0317.jpg\" width=\"529\" height=\"353\"> </p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following formulas    correctly explains the concept of Gross National Product    (GNP)?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">GNP = GDP + Depreciation</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">GNP = GDP + Net Factor Income from    Abroad</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">GNP = GDP - Indirect Taxes +    Subsidies</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">GNP = NNP + NFIA</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n   <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>B)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>GNP    = GDP + Net Factor Income from Abroad.</b></span></p>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1.    GDP (Gross Domestic Product)</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is the total market value of all final goods and services     produced </span><span style=\"font-family:'Nirmala UI'\"><b>within the     domestic territory</b></span><span style=\"font-family:'Nirmala UI'\"> of     a country in a year.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>GDP     = </b></span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784896089548_html_d3ce910b8ecc99b0.gif\"> </p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i>(Consumption    + Investment + Government Spending + Net Exports)</i></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>2.    NDP (Net Domestic Product)</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This     is GDP adjusted for the \"wear and tear\" of machinery     and assets used in production.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     shows the actual net output after accounting for the value lost     to depreciation.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>NDP     = </b></span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784896089548_html_9503124d8e0e746.gif\"> </p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>3.    GNP (Gross National Product)</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     total value of goods and services produced by the </span><span style=\"font-family:'Nirmala UI'\"><b>citizens     (nationals)</b></span><span style=\"font-family:'Nirmala UI'\"> of a     country, regardless of where they are located.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>GNP     =</b></span><span style=\"font-family:'Nirmala UI'\"> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784896089548_html_8d05b88779adbb41.gif\"> </p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i>(NFIA    = Net Factor Income from Abroad)</i></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>4.    NNP (Net National Product)</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is the GNP minus the depreciation of assets.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">When     calculated at </span><span style=\"font-family:'Nirmala UI'\"><b>Factor     Cost</b></span><span style=\"font-family:'Nirmala UI'\">, this is     officially known as </span><span style=\"font-family:'Nirmala UI'\"><b>National     Income (NI)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>NNP     =</b></span><span style=\"font-family:'Nirmala UI'\"> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784896089548_html_4a4ed229e1c91ec4.gif\"> </p>    </li>\n</ul>        <table>     <col>      <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Term</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Full Form</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Formula</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Logic / Focus</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>GDP</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Gross Domestic Product</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784896089548_html_d3ce910b8ecc99b0.gif\"> </p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Everything produced </span><span style=\"font-family:'Nirmala UI'\"><b>inside       India</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>NDP</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Net Domestic Product</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784896089548_html_9503124d8e0e746.gif\"> </p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">\"Net\" means we       removed </span><span style=\"font-family:'Nirmala UI'\"><b>wear and       tear</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>GNP</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Gross National Product</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784896089548_html_8d05b88779adbb41.gif\"> </p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Focuses on </span><span style=\"font-family:'Nirmala UI'\"><b>Indian       Citizens</b></span><span style=\"font-family:'Nirmala UI'\"> (anywhere).</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>NNP</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Net National Product</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784896089548_html_4a4ed229e1c91ec4.gif\"> </p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">The most refined measure of       production.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>NI</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>National Income</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784896089548_html_ca96b57cdb7eff29.gif\"> </p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">NNP at </span><span style=\"font-family:'Nirmala UI'\"><b>Factor       Cost</b></span><span style=\"font-family:'Nirmala UI'\"> (Actual       Income).</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>PCI</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Per Capita Income</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784896089548_html_387580e11f9e84d8.gif\"> </p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Average income </span><span style=\"font-family:'Nirmala UI'\"><b>per       person</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Who has been elected by the    International Olympic Committee (IOC) as its first female member    from Iran in Feb 2026?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Elnaz Rekabi</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Farzaneh Fasihi</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kimia Alizadeh</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Soraya Aghaei</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>D)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Soraya    Aghaei</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>International    Olympic Committee</b></u></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>International     Olympic Committee (IOC)</b></span><span style=\"font-family:'Nirmala UI'\"> is     the supreme authority of the modern Olympic Movement. It is a     non-governmental, non-profit organization based in </span><span style=\"font-family:'Nirmala UI'\"><b>Lausanne,     Switzerland</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Founded     on </span><span style=\"font-family:'Nirmala UI'\"><b>June 23, 1894</b></span><span style=\"font-family:'Nirmala UI'\">,     by </span><span style=\"font-family:'Nirmala UI'\"><b>Pierre de     Coubertin</b></span><span style=\"font-family:'Nirmala UI'\">, its primary     mission is to promote Olympism throughout the world and to lead     the Olympic Movement.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Olympic Rings:</b></span><span style=\"font-family:'Nirmala UI'\"> Five     interlaced rings (blue, yellow, black, green, and red)     representing the five continents united by Olympism.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Current     President: </span><span style=\"font-family:'Nirmala UI'\"><b>Kirsty     Coventry </b></span><span style=\"font-family:'Nirmala UI'\">from     Zimbabwe. (</span><span style=\"font-family:'Nirmala UI'\"><b>First female     President</b></span><span style=\"font-family:'Nirmala UI'\"> of the     IOC). She is Africa's most decorated Olympian, having won </span><span style=\"font-family:'Nirmala UI'\"><b>seven     Olympic medals</b></span><span style=\"font-family:'Nirmala UI'\"> (including     two golds) in </span><span style=\"font-family:'Nirmala UI'\"><b>swimming</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li>\n</ul>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Feature</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Detail</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Headquarters</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Lausanne, Switzerland</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Foundation Year</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1894</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Founder</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Pierre de Coubertin</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Official Languages</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">French and English</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Motto</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><i>Citius, Altius, Fortius –       Communiter</i></span><span style=\"font-family:'Nirmala UI'\"> (Faster,       Higher, Stronger – Together)</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following best    describes the central theme and subject matter of Arundhati    Roy’s \"The God of Small Things\" ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A political thriller focused on the    rise of the Naxalite movement in post-independence Bengal</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A family saga exploring \"The    Love Laws\" that dictate who should be loved, and how much,    set against the backdrop of caste and communism in Kerala</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A historical non-fiction account    detailing the environmental impact of large dams on indigenous    communities in South India</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A coming-of-age story about two    twins navigating the educational system and modernization in    Mumbai</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>B)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>A    family saga exploring \"The Love Laws\" that dictate who    should be loved, and how much, set against the backdrop of caste    and communism in Kerala.</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Arundhati     Roy’s debut novel \"The God of small things\" is a     masterpiece of Indian literature that won the </span><span style=\"font-family:'Nirmala UI'\"><b>Man     Booker Prize </b></span><span style=\"font-family:'Nirmala UI'\">(now     known as Booker Prize)</span><span style=\"font-family:'Nirmala UI'\"><b> in     1997.</b></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Arundhati     Roy was the first Indian citizen to win the Man Booker Prize.</span></p>    </li>\n</ul>        <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Feature</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Detail</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Author</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Arundhati Roy</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Year of Publication</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1997</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Major Award</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Man Booker Prize (1997)</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Genre</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Family Drama / Post-colonial       Literature</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Second Novel</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><i>The Ministry of Utmost       Happiness</i></span><span style=\"font-family:'Nirmala UI'\"> (2017)</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Her other works:</span></p>    <ul>     <li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>The Algebra of Infinite Justice</b></span></p>     </li>\n<li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Broken Republic</b></span></p>     </li>\n<li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Capitalism: A Ghost Story</b></span></p>     </li>\n<li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Azadi: Freedom. Fascism.     Fiction.</b></span></p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which article of the Constitution    of India mandates that “Public acts, records, and judicial    proceedings of the constitution of India shall be recognized and    respected throughout the India”.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 245</span></p>", "option2": " <p style=\"orphans:0;widows:0\">     <span style=\"font-family:'Nirmala UI'\">Article 261</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 248</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 251</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>B)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Article    261.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article    245 :</b></span><span style=\"font-family:'Nirmala UI'\"> Defines the    territorial extent of laws made by Parliament and by the    Legislatures of States.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span style=\"font-family:'Nirmala UI'\"><b>Article    248 : </b></span><span style=\"font-family:'Nirmala UI'\">Grants    Parliament exclusive power to make laws, including taxation, on    any matter not listed in the Concurrent or State Lists( residuary    powers).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article    251 : </b></span><span style=\"font-family:'Nirmala UI'\">If a State    law conflicts with a Parliament law made under Article 249 or 250,    the Parliament law prevails and the State law becomes void to the    extent of inconsistency.</span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Legislative Relations,       Articles (245–255)</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Administrative Relations,       Articles (256–263)</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Financial Relations, Articles       (268–293)</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">       <ul>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Division        of legislative power between Parliament and State legislatures</span></p>        </li>\n<li>\n<p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Procedures        for passing joint legislation</span></p>       </li>\n</ul>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Coordination between Parliament       and State legislatures in the implementation of laws and       policies</span></p>      </td>      <td style=\"border: 1px solid black;\">       <ul>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Distribution        of financial resources between Centre and states.</span></p>        </li>\n<li>\n<p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Mechanisms        for intergovernmental transfers</span></p>       </li>\n</ul>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which Indian dynasty is credited    with the original discovery of the world-famous Koh-i-Noor diamond    ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Chola Dynasty</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kakatiya Dynasty</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Tughlaq Dynasty</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Khilji Dynasty</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>B)    Kakatiya dynasty.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    original discovery of the </span><span style=\"font-family:'Nirmala UI'\"><b>Koh-i-Noor</b></span><span style=\"font-family:'Nirmala UI'\"> diamond    is most commonly credited to the </span><span style=\"font-family:'Nirmala UI'\"><b>Kakatiya    Dynasty</b></span><span style=\"font-family:'Nirmala UI'\">, which ruled the    Telugu-speaking regions (present-day Andhra Pradesh and Telangana)    between the 12th and 14th centuries.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It    is widely believed that the diamond was mined from the </span><span style=\"font-family:'Nirmala UI'\"><b>Kollur    Mines</b></span><span style=\"font-family:'Nirmala UI'\"> (part of the    famous Golconda group of mines) on the banks of the Krishna River.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Historical    Journey of the Diamond</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Kakatiya     Era:</b></span><span style=\"font-family:'Nirmala UI'\"> The diamond     was reportedly installed as the \"eye\" of a deity in a     temple in </span><span style=\"font-family:'Nirmala UI'\"><b>Warangal</b></span><span style=\"font-family:'Nirmala UI'\">,     the Kakatiya capital.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Khilji Invasion (1310):</b></span><span style=\"font-family:'Nirmala UI'\"> When     Malik Kafur, the general of </span><span style=\"font-family:'Nirmala UI'\"><b>Alauddin     Khilji</b></span><span style=\"font-family:'Nirmala UI'\">, invaded South     India, he looted the diamond from the Kakatiyas as part of a     massive tribute.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Mughals:</b></span><span style=\"font-family:'Nirmala UI'\"> The     diamond eventually passed to the Mughal Empire. </span><span style=\"font-family:'Nirmala UI'\"><b>Shah     Jahan</b></span><span style=\"font-family:'Nirmala UI'\"> famously had     it set into the head of a peacock on his legendary </span><span style=\"font-family:'Nirmala UI'\"><b>Peacock     Throne.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Nadir     Shah's \"Turban Trick\" (1739):</b></span><span style=\"font-family:'Nirmala UI'\"> When     the Persian invader Nadir Shah defeated the Mughal Emperor     Muhammad Shah, he allegedly obtained the diamond by convincing     the Emperor to swap turbans as a sign of friendship. Upon seeing     its brilliance, he exclaimed </span><span style=\"font-family:'Nirmala UI'\"><b>\"Koh-i-Noor!\"</b></span><span style=\"font-family:'Nirmala UI'\"> (Persian     for \"Mountain of Light\"), giving the stone its current     name.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Afghanistan     &amp; Punjab:</b></span><span style=\"font-family:'Nirmala UI'\"> After     Nadir Shah's death, the diamond went to Ahmad Shah Durrani     (Afghanistan). Eventually, it was surrendered to </span><span style=\"font-family:'Nirmala UI'\"><b>Maharaja     Ranjit Singh</b></span><span style=\"font-family:'Nirmala UI'\"> of     the Sikh Empire in 1813.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     British:</b></span><span style=\"font-family:'Nirmala UI'\"> Following     the Second Anglo-Sikh War in 1849, the British annexed Punjab.     The 10-year-old Maharaja Duleep Singh was forced to surrender the     diamond to the East India Company, which presented it to </span><span style=\"font-family:'Nirmala UI'\"><b>Queen     Victoria</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Kakatiya    dynasty</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Originally,     they were feudatories (subordinates) of the Western Chalukyas.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">They     declared independence under </span><span style=\"font-family:'Nirmala UI'\"><b>Prola     II</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>Rudradeva     I</b></span><span style=\"font-family:'Nirmala UI'\"> in the mid-12th     century.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     dynasty reached its peak under the reigns of </span><span style=\"font-family:'Nirmala UI'\"><b>Ganapati     Deva</b></span><span style=\"font-family:'Nirmala UI'\"> and his     daughter </span><span style=\"font-family:'Nirmala UI'\"><b>Rani     Rudrama Devi</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The     kingdom was eventually weakened by successive invasions from     the </span><span style=\"font-family:'Nirmala UI'\"><b>Delhi     Sultanate</b></span><span style=\"font-family:'Nirmala UI'\"> (Alauddin     Khilji and Ghiyasuddin Tughlaq). The dynasty ended in </span><span style=\"font-family:'Nirmala UI'\"><b>1323     AD</b></span><span style=\"font-family:'Nirmala UI'\"> with the defeat     of Prataparudra.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following sports is    set to make its Olympic debut or return at the Los Angeles    2028 (LA28) Summer Games?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Breakdancing</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Karate</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sport Climbing</span></p>", "option4": " <p style=\"orphans:0;widows:0\">
