LA28 program.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following institutions    was established based on the recommendations of the B.    Sivaraman Committee?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">NABARD (National Bank for    Agriculture and Rural Development) </span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">SIDBI (Small Industries    Development Bank of India)</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">SEBI (Securities and Exchange    Board of India)</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">IRDAI (Insurance Regulatory and    Development Authority of India)</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is : </span><span style=\"font-family:'Nirmala UI'\"><b>A)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>NABARD    (National Bank for Agriculture and Rural Development).</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>NABARD</b></u></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">NABARD    acts as the apex regulatory body for the overall regulation and    licensing of </span><span style=\"font-family:'Nirmala UI'\"><b>regional    rural banks</b></span><span style=\"font-family:'Nirmala UI'\"> and    apex cooperative banks in India.</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     provides refinance support for building rural infrastructure.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     prepares \"Potential Linked Credit Plans\" (PLP) for all     districts in the country to guide the banking industry.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     manages various funds like the </span><span style=\"font-family:'Nirmala UI'\"><b>Rural     Infrastructure Development Fund (RIDF)</b></span><span style=\"font-family:'Nirmala UI'\"> and     the </span><span style=\"font-family:'Nirmala UI'\"><b>Micro     Irrigation Fund</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Originally,     NABARD was a joint venture between the RBI and the Government of     India. However, as of </span><span style=\"font-family:'Nirmala UI'\"><b>2019</b></span><span style=\"font-family:'Nirmala UI'\">,     the Government of India holds </span><span style=\"font-family:'Nirmala UI'\"><b>100%     shareholding</b></span><span style=\"font-family:'Nirmala UI'\"> in     NABARD, making it a fully government-owned entity.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>B.     Sivaraman committee </b></span><span style=\"font-family:'Nirmala UI'\">was     set up by the</span><span style=\"font-family:'Nirmala UI'\"><b> Reserve     Bank of India (RBI)</b></span><span style=\"font-family:'Nirmala UI'\"> in </span><span style=\"font-family:'Nirmala UI'\"><b>1979.</b></span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Facts about NABARD</b></span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Feature</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Detail</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Established Date</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">July 12, 1982</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Act</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">NABARD Act 1981</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Headquarters</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Mumbai</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Initial Capital</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       ₹<span style=\"font-family:'Nirmala UI'\">100 Crore</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Purpose</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Development bank for       agriculture, cottage industries, and village industries.</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate synonym    of the given word:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Harbinger</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Aftermath</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Forerunner</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Result</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Outcome</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Answer: B. Forerunner</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Harbinger</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>अग्रदूत    </b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\">means </span><span style=\"font-family:'Nirmala UI'\"><b>a    person or thing that announces, signals, or foreshadows the    arrival of something else</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A </span><span style=\"font-family:'Nirmala UI'\"><b>Forerunner</b></span><span style=\"font-family:'Nirmala UI'\"> is </span><span style=\"font-family:'Nirmala UI'\"><b>someone    or something that comes before another and indicates or prepares    the way for what follows</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Since    both words refer to </span><span style=\"font-family:'Nirmala UI'\"><b>something    that precedes and signals the coming of another event or    person</b></span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-family:'Nirmala UI'\"><b>Forerunner</b></span><span style=\"font-family:'Nirmala UI'\"> is    the most appropriate synonym.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Why    the other options are incorrect:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>A.     Aftermath</b></span><span style=\"font-family:'Nirmala UI'\"> –     Refers to the consequences or results that occur </span><span style=\"font-family:'Nirmala UI'\"><b>after</b></span><span style=\"font-family:'Nirmala UI'\"> an     event.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>C.     Result</b></span><span style=\"font-family:'Nirmala UI'\"> – Means     the outcome or consequence of an action.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>D.     Outcome</b></span><span style=\"font-family:'Nirmala UI'\"> – Refers     to the final effect or end result of a process.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the correct meaning of    idiom:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Be    in the swim</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">to find oneself in a highly    dangerous or risky situation.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">to be an expert or professional    swimmer.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">to avoid socialising or prefer    being alone.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">to be actively involved in or    well-informed about current activities and trends.</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The idiom '</span><span style=\"font-family:'Nirmala UI'\"><b>Be    in the swim'</b></span><span style=\"font-family:'Nirmala UI'\"> means    to be actively involved in or well-informed about current    activities and trends.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Example</b></span><span style=\"font-family:'Nirmala UI'\">:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">\"If    you want to </span><span style=\"font-family:'Nirmala UI'\"><b>be in    the swim</b></span><span style=\"font-family:'Nirmala UI'\"> with local    fashion and art, you really should visit the downtown gallery    openings on Friday nights.\"</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate antonym    of the given word: </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Deride</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">praise</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ignore</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Condemn</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mock</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>Option    A (Praise)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Deride</b></span><span style=\"font-family:'Nirmala UI'\">: To    express contempt for; to ridicule, mock, or scoff at someone or    something.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Since </span><span style=\"font-family:'Nirmala UI'\"><b>deride</b></span><span style=\"font-family:'Nirmala UI'\"> means    to mock or put someone down, its exact opposite is to lift someone    up with kind words or admiration. Therefore, </span><span style=\"font-family:'Nirmala UI'\"><b>Praise</b></span><span style=\"font-family:'Nirmala UI'\"> is    the correct antonym.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Condemn    and mock are the synonyms of Deride.</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Spot the incorrectly spelt word</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">cemetary</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">leisure</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">personnel</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">rhythm</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>Option    A (cemetary)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    correct spelling is </span><span style=\"font-family:'Nirmala UI'\"><b>cemetery</b></span><span style=\"font-family:'Nirmala UI'\"> (with    all 'e's). It means a burial ground or graveyard.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">All    the other words (</span><span style=\"font-family:'Nirmala UI'\"><b>leisure</b></span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-family:'Nirmala UI'\"><b>personnel</b></span><span style=\"font-family:'Nirmala UI'\">,    and </span><span style=\"font-family:'Nirmala UI'\"><b>rhythm</b></span><span style=\"font-family:'Nirmala UI'\">)    are correctly spelt.</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the correct direct speech    for: </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">She    said that they might choose whichever route they preferred.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">She said, \"they might choose    whichever route they preferred.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">She said, “you may choose    whichever route you prefer.”</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">She said that “we may choose    whichever route we prefer.”</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">She said, “you can choose    whichever route you preferred.”</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: Option B</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span><span style=\"font-family:'Nirmala UI'\"> To    convert the indirect speech back to direct speech, the following    rules are applied:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Tense     Shift:</b></span><span style=\"font-family:'Nirmala UI'\"> The modal     verb </span><span style=\"font-family:'Nirmala UI'\"><b>\"might\"</b></span><span style=\"font-family:'Nirmala UI'\"> reverts     to its original present form </span><span style=\"font-family:'Nirmala UI'\"><b>\"may\"</b></span><span style=\"font-family:'Nirmala UI'\">,     and the past tense </span><span style=\"font-family:'Nirmala UI'\"><b>\"preferred\"</b></span><span style=\"font-family:'Nirmala UI'\"> shifts     back to the simple present tense </span><span style=\"font-family:'Nirmala UI'\"><b>\"prefer\"</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pronoun     Change:</b></span><span style=\"font-family:'Nirmala UI'\"> The     pronoun </span><span style=\"font-family:'Nirmala UI'\"><b>\"they\"</b></span><span style=\"font-family:'Nirmala UI'\"> changes     back to the second-person pronoun </span><span style=\"font-family:'Nirmala UI'\"><b>\"you\"</b></span><span style=\"font-family:'Nirmala UI'\"> to     match the direct address.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Punctuation:</b></span><span style=\"font-family:'Nirmala UI'\"> The     conjunction </span><span style=\"font-family:'Nirmala UI'\"><b>\"that\"</b></span><span style=\"font-family:'Nirmala UI'\"> is     removed, a comma is placed after the reporting verb (</span><span style=\"font-family:'Nirmala UI'\"><i>She     said,</i></span><span style=\"font-family:'Nirmala UI'\">), and the direct     speech is enclosed within quotation marks.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Therefore,    the correct direct sentence is: </span><span style=\"font-family:'Nirmala UI'\"><i><b>She    said, “you may choose whichever route you prefer.”</b></i></span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Rearrange the sentences to form a    logical paragraph.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A.    However, planting trees blindly without considering the local    ecosystem can do more harm than good.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">B.    Reforestation is widely celebrated as one of the most effective    weapons against climate change.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">C.    For instance, introducing non-native species can deplete local    water tables and destroy biodiversity.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">D.    Therefore, a scientific approach to tree-planting is essential for    true sustainability.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A-B-C-D</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">B-A-D-C</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A-B-D-C</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">B-A-C-D</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct answer:</span><span style=\"font-family:'Nirmala UI'\"><b> Option    D (B-A-C-D)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence    B</b></span><span style=\"font-family:'Nirmala UI'\"> introduces the    central topic: reforestation as a weapon against climate change.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence    A</b></span><span style=\"font-family:'Nirmala UI'\"> uses \"However\"    to present a counter-argument or a limitation to the idea in    Sentence B—planting trees blindly causes harm.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence    C</b></span><span style=\"font-family:'Nirmala UI'\"> provides a    specific example (\"For instance\") of that harm    (depleting water tables and destroying biodiversity).</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence    D</b></span><span style=\"font-family:'Nirmala UI'\"> concludes the    paragraph logically with \"Therefore\", emphasizing the    need for a scientific approach.</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Identify the sentence that uses the    correct spelling of the word:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The company implemented a strict    policy against workplace harrassment.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The company implemented a strict    policy against workplace harassment.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The company implemented a strict    policy against workplace harasment.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The company implemented a strict    policy against workplace harrasment.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The sentence in the option </span><span style=\"font-family:'Nirmala UI'\"><b>B</b></span><span style=\"font-family:'Nirmala UI'\"> uses    correct spelling of the word '</span><span style=\"font-family:'Nirmala UI'\"><b>Harassment'</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Choose the sentence that uses    articles correctly.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">I saw an unique bird in the garden.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">He is a honest man.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The Pacific Ocean is  the    largest ocean.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">My brother is a engineer.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>The    Pacific Ocean is  the largest ocean</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">We    use the definite article </span><span style=\"font-family:'Nirmala UI'\"><b>'The'</b></span><span style=\"font-family:'Nirmala UI'\"> before    the names of oceans, seas, and rivers (e.g., The Pacific Ocean).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">We    also use </span><span style=\"font-family:'Nirmala UI'\"><b>'the'</b></span><span style=\"font-family:'Nirmala UI'\"> before    superlative adjectives (e.g., the largest). Therefore, this    sentence is grammatically correct.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option    A:</b></span><span style=\"font-family:'Nirmala UI'\"> \"I saw an    unique bird in the garden.\"</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Even    though \"unique\" starts with the vowel letter 'u', it is    pronounced with a consonant sound (</span><span style=\"font-family:'Nirmala UI'\"><b>\"yoo-neek\"</b></span><span style=\"font-family:'Nirmala UI'\">).    We use </span><span style=\"font-family:'Nirmala UI'\"><b>'a'</b></span><span style=\"font-family:'Nirmala UI'\"> before    words starting with a consonant sound.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">correct    sentence: I saw </span><span style=\"font-family:'Nirmala UI'\"><b>a</b></span><span style=\"font-family:'Nirmala UI'\"> unique    bird in the garden.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option    B:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><i>\"</i></span><span style=\"font-family:'Nirmala UI'\">He    is a honest man.</span><span style=\"font-family:'Nirmala UI'\"><i>\"</i></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    'h' in \"honest\" is silent, so the word starts with a    vowel sound (</span><span style=\"font-family:'Nirmala UI'\"><b>\"on-ist\"</b></span><span style=\"font-family:'Nirmala UI'\">).    We use </span><span style=\"font-family:'Nirmala UI'\"><b>'an'</b></span><span style=\"font-family:'Nirmala UI'\"> before    words starting with a vowel sound.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">correct    sentence: He is </span><span style=\"font-family:'Nirmala UI'\"><b>an</b></span><span style=\"font-family:'Nirmala UI'\"> honest    man.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option    D:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><i>\"</i></span><span style=\"font-family:'Nirmala UI'\">My    brother is a engineer.</span><span style=\"font-family:'Nirmala UI'\"><i>\"</i></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">\"Engineer\"    begins with a clear vowel sound (</span><span style=\"font-family:'Nirmala UI'\"><b>\"en-jih-neer\"</b></span><span style=\"font-family:'Nirmala UI'\">).    Thus, it must take the article </span><span style=\"font-family:'Nirmala UI'\"><b>'an'</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">correct    sentence:  My brother is </span><span style=\"font-family:'Nirmala UI'\"><b>an</b></span><span style=\"font-family:'Nirmala UI'\"> engineer.</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Complete the sentence:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">\"He    is a very cautious driver; he __________ breaks the speed    limit.\"<br>  </span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">seldom or ever</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">seldom if never</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">seldom if ever</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">if ever seldom</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct answer:</span><span style=\"font-family:'Nirmala UI'\"><b> Option    C (seldom if ever)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>'Seldom    if ever' </b></span><span style=\"font-family:'Nirmala UI'\">means    rarely, or perhaps never at all.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    first clause of the given sentence establishes that he is \"very    cautious.\" This means his breaking of the speed limit must be    an extremely rare event.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>'Seldom    if ever'</b></span><span style=\"font-family:'Nirmala UI'\"> perfectly    fits both the meaning and the required grammatical structure.</span></p>    <p style=\"orphans:0;widows:0\"> <span style=\"font-family:'Nirmala UI'\">The    correct sentence: \"He is a very cautious driver; he </span><span style=\"font-family:'Nirmala UI'\"><b>seldom    if ever</b></span><span style=\"font-family:'Nirmala UI'\"> breaks the    speed limit.\"</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which sentence correctly handles    subject-verb agreement?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Not only the teacher but also the    students is attending the conference.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Not only the students but also the    teacher are attending the conference.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Not only the teacher but also the    students are attending the conference.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Not only the teacher but also the    students attending the conference.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>Not    only the teacher but also the students are attending the    conference.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">When    two subjects are joined by correlative conjunction </span><span style=\"font-family:'Nirmala UI'\"><b>\"not    only... but also\"</b></span><span style=\"font-family:'Nirmala UI'\">,    the verb must agree with the </span><span style=\"font-family:'Nirmala UI'\"><b>closer    subject</b></span><span style=\"font-family:'Nirmala UI'\"> (the one    nearest to the verb).</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Since </span><span style=\"font-family:'Nirmala UI'\"><b>\"the    students\"</b></span><span style=\"font-family:'Nirmala UI'\"> is    the subject closest to the verb, the verb must be plural (</span><span style=\"font-family:'Nirmala UI'\"><b>are</b></span><span style=\"font-family:'Nirmala UI'\">).</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Complete the sentence: </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">\"She    ________ English since she was a child, which explains why she is    so fluent now.\"</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">learned</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">had learned</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">has been learning </span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">is learning</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>Option    C </b></span><span style=\"font-family:'Nirmala UI'\">(</span><span style=\"font-family:'Nirmala UI'\"><b>has    been learning)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    present perfect continuous tense is used for an action that    started in past and continues into the present, especially with    '</span><span style=\"font-family:'Nirmala UI'\"><b>since</b></span><span style=\"font-family:'Nirmala UI'\">'.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    the complete sentence is:  “She has been    learning English since she was a child, which explains why    she is so fluent now.”</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Identify the part of the sentence    that contains a grammatical error: </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">\"The    real estate agent showed the house to my brother and I before    it was officially listed.\"</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The real estate agent</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">showed the house to my brother</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">and I before it</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">was officially listed.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The objective case of pronoun must    be used after the proposition '</span><span style=\"font-family:'Nirmala UI'\"><b>to</b></span><span style=\"font-family:'Nirmala UI'\">'.    here, instead of subjective case '</span><span style=\"font-family:'Nirmala UI'\"><b>I</b></span><span style=\"font-family:'Nirmala UI'\">',    the objective case '</span><span style=\"font-family:'Nirmala UI'\"><b>me</b></span><span style=\"font-family:'Nirmala UI'\">'    must be used.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    correct sentence: \"The real estate agent showed the    house to my brother and me before it was officially listed.\"</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Change the following from active to    passive:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Why    did the committee reject the proposal?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Why was the proposal rejected    by the committee?</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Why the proposal was rejected by    the committee?</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Why did the proposal was reject by    the committee?</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Why had the proposal been rejected    by the committee?</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The auxiliary verb </span><span style=\"font-family:'Nirmala UI'\"><b>\"did\"</b></span><span style=\"font-family:'Nirmala UI'\"> indicates    that the sentence is in the </span><span style=\"font-family:'Nirmala UI'\"><b>Simple    Past Tense.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">When    converting a simple past question starting with a Wh-word, the    structure is:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Wh-word</b></span><span style=\"font-family:'Nirmala UI'\"> + </span><span style=\"font-family:'Nirmala UI'\"><b>Auxiliary    Verb </b></span><span style=\"font-family:'Nirmala UI'\">(was/were)    + </span><span style=\"font-family:'Nirmala UI'\"><b>New    Subject </b></span><span style=\"font-family:'Nirmala UI'\">(Object of    active) + </span><span style=\"font-family:'Nirmala UI'\"><b>V3</b></span><span style=\"font-family:'Nirmala UI'\"> (Past    participle) + </span><span style=\"font-family:'Nirmala UI'\"><b>by</b></span><span style=\"font-family:'Nirmala UI'\"> + </span><span style=\"font-family:'Nirmala UI'\"><b>New    Object</b></span><span style=\"font-family:'Nirmala UI'\"> (Subject of    active)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Here,</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Wh-word:</b></span><span style=\"font-family:'Nirmala UI'\"> Why</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Subject:</b></span><span style=\"font-family:'Nirmala UI'\"> The     committee</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Verb:</b></span><span style=\"font-family:'Nirmala UI'\"> reject</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Object:</b></span><span style=\"font-family:'Nirmala UI'\"> the     proposal</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Auxiliary    verb '</span><span style=\"font-family:'Nirmala UI'\"><b>was</b></span><span style=\"font-family:'Nirmala UI'\">'    will be used as new subject (the proposal) is singular.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    correct answer:</span><span style=\"font-family:'Nirmala UI'\"><b> \"Why    was the proposal rejected by the committee?\"</b></span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the correct indirect speech    form: </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">She    said, 'I may buy a house next year.'</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">She said that she might buy a house    the following year.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">She told she might buy a house the    following year.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">She said that I might buy a house    the next year.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">She said that she may buy a house    the next year.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer:</span><span style=\"font-family:'Nirmala UI'\"><b> She    said that she might buy a house the following year.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">To    convert the given sentence into indirect speech:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Since    the reporting verb is in the past tense (said), </span><span style=\"font-family:'Nirmala UI'\"><b>\"may\"</b></span><span style=\"font-family:'Nirmala UI'\"> changes    to its past form, </span><span style=\"font-family:'Nirmala UI'\"><b>\"might\"</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    first-person pronoun </span><span style=\"font-family:'Nirmala UI'\"><b>\"I\"</b></span><span style=\"font-family:'Nirmala UI'\"> changes    to the third-person </span><span style=\"font-family:'Nirmala UI'\"><b>\"she\"</b></span><span style=\"font-family:'Nirmala UI'\"> to    match the speaker.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>\"next    year\"</b></span><span style=\"font-family:'Nirmala UI'\"> shifts    to </span><span style=\"font-family:'Nirmala UI'\"><b>\"the    following year\"</b></span><span style=\"font-family:'Nirmala UI'\"> in    indirect speech.</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Identify the sentence that uses a    pair of homonyms:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">I need to </span><span style=\"font-family:'Nirmala UI'\"><i>write</i></span><span style=\"font-family:'Nirmala UI'\"> a    letter with my </span><span style=\"font-family:'Nirmala UI'\"><i>right</i></span><span style=\"font-family:'Nirmala UI'\"> hand.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Please don't </span><span style=\"font-family:'Nirmala UI'\"><i>desert</i></span><span style=\"font-family:'Nirmala UI'\"> me    in the middle o     A</b></span><span style=\"font-family:'Nirmala UI'\">: Despite of the heavy    downpour</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    word </span><span style=\"font-family:'Nirmala UI'\"><b>\"Despite\"</b></span><span style=\"font-family:'Nirmala UI'\"> is    a preposition that should never be followed by the preposition    \"of\". It is directly followed by its object.</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the correct one-word    substitute for: </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">A    remedy or medicine that is supposed to cure all diseases or solve    all problems</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Antidote</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Panacea</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Placebo</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Elixir</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is:</span><span style=\"font-family:'Nirmala UI'\"><b> Option    B (Panacea)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Panacea</b></span><span style=\"font-family:'Nirmala UI'\">:    A remedy or medicine that is supposed to cure all diseases or    solve all problems.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Antidote</b></span><span style=\"font-family:'Nirmala UI'\">:    A medicine that countera lution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Given    number:- 8642357318</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">After    applying conditon we get:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">8    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    7</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">6    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    5</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">4    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    3</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">2    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    1</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">3    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    5</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">5    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    7</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">7    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    9</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">3    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    5</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">1    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    3</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">8    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    7</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">New    number: 7531579537</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Arrange    in ascending order</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(Left)    1, 3, 3, 5, 5, 5, 7, 7, 7, 9 (Right)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Sum    of first five number from left = (1 + 3 + 3 + 5 + 5) = 17</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>17 </b></span><span style=\"font-family:'Nirmala UI'\">is    the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">During a classroom activity, two    students start arguing loudly and disturb the learning    environment. What should the teacher do?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ignore the situation and continue    teaching</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Calm the students, understand the    issue, and resolve it fairly</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Punish both students immediately    without hearing them</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Send the entire class out of the    room</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(a)    Ignore the situation and continue teaching </b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This    is not appropriate because the argument can distract other    students and may become more serious if left unaddressed. A    teacher should maintain classroom discipline and ensure a    conducive learning environment.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(b)    Calm the students, understand the issue, and resolve it fairly </b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This    is the correct answer. The teacher should first stop the    disruption calmly, listen to both students, identify the cause of    the disagreement, and take fair action. This approach promotes    discipline, fairness, and problem-solving skills among students.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(c)    Punish both students immediately without hearing them </b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This    is unfair because the teacher does not know the facts of the    situation. One student may be more responsible than the other, or    there may be a misunderstanding. Effective discipline requires    understanding the issue before taking action.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(d)    Send the entire class out of the room </b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This    is not a reasonable response because it penalizes students who    were not involved in the argument. The teacher should address the    specific students causing the disruption rather than affecting the    whole class.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>(b)    Calm the students, understand the issue, and resolve it fairly</b></span><span style=\"font-family:'Nirmala UI'\">,    as it maintains discipline while ensuring fairness and supporting    students' social and emotional development.</span></p>", "question_heading": ""}, {"sr_no": 84, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The sequence of folding a piece of    paper and the manner in which the folded paper is cut is shown in    the following figures. How would this paper look when unfolded?</span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784896089548_html_d2c3ce95d421f2dc.jpg\" width=\"300\" height=\"99\" > </p>", "option1": " <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784896089548_html_c6caf57d845396da.jpg\" width=\"148\" height=\"144\" > <span style=\"font-family:'Nirmala UI'\">.</span></p>", "option2": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784896089548_html_69660d8e1eebfb51.jpg\" width=\"144\" height=\"136\" > <span style=\"font-family:'Nirmala UI'\">.</span></p>", "option3": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784896089548_html_c2d6cbd030c3c5ff.jpg\" width=\"150\" height=\"149\" > <span style=\"font-family:'Nirmala UI'\">.</span></p>", "option4": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_ n/website/bulk_uploader_images/1784896089548_html_8427d519544dc32e.jpg\" width=\"341\" height=\"179\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In    both the dice \"Done\" is common, and dice is rotated    clockwise direction from the common face.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Opposite    pairs are:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Loss    - Kite</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Won    - Love</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Clearly,    word 'Love' is face opposite to 'Won'</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>Love </b></span><span style=\"font-family:'Nirmala UI'\">is    the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">“Ramesh and Sohan are playing    cricket in a large ground near school.” What is the total number    of words that begin with a consonant?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">5</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">7</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">8</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <p style=\"orpha \">Read the following statement    carefully and identify the conclusion that follows. </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement:</b></span><span style=\"font-family:'Nirmala UI'\"> All    children under the age of five are eligible for free health    check-ups at the clinic.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusions:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">I.    Adults are not allowed to visit the clinic.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">II.    All children over five must pay for their health check-ups.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I follows</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only II follows</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both I and II follow</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither I nor II follows</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Explanation:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    statement defines eligibility for a \"free\" service for a    specific age group. </span><span style=\"font-family:'Nirmala UI'\"><b>Conclusion    I: </b></span><span style=\"font-family:'Nirmala UI'\">This does not    follow. The statement only discusses who gets free check-ups, not    who is allowed in the building.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion    II: </b></span><span style=\"font-family:'Nirmala UI'\">This does not    follow. While they aren't \"eligible\" for the free    check-up mentioned, the statement doesn't say if they have other    ways to get it free or what they must pay.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>option    (D)</b></span><span style=\"font-family:'Nirmala UI'\"> is the correct    answer.</span></p>", "question_heading": ""}, {"sr_no": 99, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A group of 53 students are standing    in a straight line facing the school gate. Neha is 18th from the    left end. If she moves 9 places to the right, what will be her new    position from the right end?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">27th</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">29th</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">21st</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">28th</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation</b></span><span style=\"font-family:'Nirmala UI'\">:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Initial    position from left = 18th</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">She    moves 9 places to the right:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">New    position from left = 18 + 9 = 27th</span></p>
