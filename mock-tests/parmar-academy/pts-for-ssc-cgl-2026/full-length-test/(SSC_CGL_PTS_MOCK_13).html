<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>25.) SSC CGL PTS  MOCK 13 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

const questions = [{"sr_no": 1, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which Act of British India    designated the Governor-General of Bengal as the \"Governor-General    of India\"?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Regulating Act of 1773</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Charter Act of 1813</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Charter Act of 1833</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Government of India Act of 1858</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>C)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Charter    Act of 1833.</b></span></p>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Charter    Act of 1833</b></span><span style=\"font-family:'Nirmala UI'\"> (also    known as the </span><span style=\"font-family:'Nirmala UI'\"><b>Saint    Helena Act </b></span><span style=\"font-family:'Nirmala UI'\">1833)    was a landmark piece of legislation that centralised the    administration of British India. Here are the main points    regarding this Act:</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     redesignated the </span><span style=\"font-family:'Nirmala UI'\"><b>Governor-General     of Bengal</b></span><span style=\"font-family:'Nirmala UI'\"> as     the </span><span style=\"font-family:'Nirmala UI'\"><b>Governor-General     of India</b></span><span style=\"font-family:'Nirmala UI'\">, vesting in     him all civil and military powers.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Lord     William Bentinck</b></span><span style=\"font-family:'Nirmala UI'\"> became     the first Governor-General of India under this Act.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Governors of Bombay and Madras were deprived of their legislative     powers, making the Governor-General of India the supreme     legislative authority for the entire British territory in India.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Act ended the activities of the </span><span style=\"font-family:'Nirmala UI'\"><b>East     India Company</b></span><span style=\"font-family:'Nirmala UI'\"> as a     commercial body, making it a purely administrative body.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     added a fourth member to the Governor-General's Council to act as     a </span><span style=\"font-family:'Nirmala UI'\"><b>Law Member</b></span><span style=\"font-family:'Nirmala UI'\">. </span><span style=\"font-family:'Nirmala UI'\"><b>Lord     Macaulay</b></span><span style=\"font-family:'Nirmala UI'\"> was the     first to be appointed to this position.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Act attempted to introduce a system of open competition for the     selection of civil servants, stating that Indians should not be     barred from holding any place, office, or employment under the     Company (though this provision was negated due to opposition from     the Court of Directors).</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Another     feature of this Act was that it directed the     Governor-General-in-Council to take steps to </span><span style=\"font-family:'Nirmala UI'\"><b>abolish     slavery</b></span><span style=\"font-family:'Nirmala UI'\"> in India.     Slavery was eventually declared illegal in British India in </span><span style=\"font-family:'Nirmala UI'\"><b>1843</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What is the height of Dhupgarh peak    in meters, the highest peak of the Satpura Range?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1450</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1350</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1300</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1400</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>B)    1350</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Dhupgarh</b></span><span style=\"font-family:'Nirmala UI'\"> (or    Mount Dhupgarh) is the highest point in the Satpura Range.</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     stands at an altitude of </span><span style=\"font-family:'Nirmala UI'\"><b>1,350     meters</b></span><span style=\"font-family:'Nirmala UI'\"> (approximately     4,429 feet) above sea level.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is located in </span><span style=\"font-family:'Nirmala UI'\"><b>Pachmarhi</b></span><span style=\"font-family:'Nirmala UI'\">,     which is the only hill station in the state of </span><span style=\"font-family:'Nirmala UI'\"><b>Madhya     Pradesh</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     belongs to the </span><span style=\"font-family:'Nirmala UI'\"><b>Mahadeo     Hills</b></span><span style=\"font-family:'Nirmala UI'\">, which form the     central part of the broader Satpura Range.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     peak is situated within the </span><span style=\"font-family:'Nirmala UI'\"><b>Satpura     Biosphere Reserve</b></span><span style=\"font-family:'Nirmala UI'\">,     known for its rich biodiversity and scenic sunrises and sunsets.</span></p>    </li>\n</ul>        <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Highest     Peaks of Other Ranges:</span></p>     <ul>      <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Aravalli      Range:</b></span><span style=\"font-family:'Nirmala UI'\"> Guru      Shikhar (1,722 m).</span></p>      </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Western      Ghats:</b></span><span style=\"font-family:'Nirmala UI'\"> Anamudi      (2,695 m).</span></p>      </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Eastern      Ghats:</b></span><span style=\"font-family:'Nirmala UI'\"> Jindhagada      Peak (1,690 m).</span></p>      </li>\n<li>\n<p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Vindhya      Range:</b></span><span style=\"font-family:'Nirmala UI'\"> Sadbhawna      Shikhar / Goodwill Peak (752 m)</span></p>     </li>\n</ul>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What is the main objective of the    'Ude Desh ka Aam Naagrik' (UDAN) scheme?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Free air travel for senior citizens</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Regional airport development and    connectivity</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Training for commercial pilots</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Privatization of Air India</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>B) Regional    airport development and connectivity.</b></span></p>    <ul>     <li>     <ul>      <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>UDAN      Scheme</b></span><span style=\"font-family:'Nirmala UI'\"> was      launched on </span><span style=\"font-family:'Nirmala UI'\"><b>21st      October 2016</b></span><span style=\"font-family:'Nirmala UI'\">;      the </span><span style=\"font-family:'Nirmala UI'\"><b>first UDAN      flight</b></span><span style=\"font-family:'Nirmala UI'\"> operated      between </span><span style=\"font-family:'Nirmala UI'\"><b>Shimla and      Delhi</b></span><span style=\"font-family:'Nirmala UI'\"> on </span><span style=\"font-family:'Nirmala UI'\"><b>27th      April 2017</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>625      UDAN routes</b></span><span style=\"font-family:'Nirmala UI'\"> have      been operationalized, connecting </span><span style=\"font-family:'Nirmala UI'\"><b>90      airports</b></span><span style=\"font-family:'Nirmala UI'\"> (including </span><span style=\"font-family:'Nirmala UI'\"><b>2      water aerodromes</b></span><span style=\"font-family:'Nirmala UI'\">,      and </span><span style=\"font-family:'Nirmala UI'\"><b>15      heliports)</b></span><span style=\"font-family:'Nirmala UI'\"> across      India.</span></p>      </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>More      than 1.49 crore passengers</b></span><span style=\"font-family:'Nirmala UI'\"> have      benefited from affordable regional air travel under UDAN.</span></p>      </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>India’s      airport network</b></span><span style=\"font-family:'Nirmala UI'\"> expanded      from </span><span style=\"font-family:'Nirmala UI'\"><b>74 airports      in 2014 to 159 airports in 2024</b></span><span style=\"font-family:'Nirmala UI'\">,      more than </span><span style=\"font-family:'Nirmala UI'\"><b>doubling</b></span><span style=\"font-family:'Nirmala UI'\"> in      a decade.</span></p>      </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\">₹<span style=\"font-family:'Nirmala UI'\"><b>4,023.37      crore</b></span><span style=\"font-family:'Nirmala UI'\"> disbursed      as </span><span style=\"font-family:'Nirmala UI'\"><b>Viability Gap      Funding (VGF)</b></span><span style=\"font-family:'Nirmala UI'\"> to      promote connectivity to underserved and remote regions.</span></p>      </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">UDAN      strengthened </span><span style=\"font-family:'Nirmala UI'\"><b>regional      tourism, healthcare access, and trade</b></span><span style=\"font-family:'Nirmala UI'\">,      catalyzing economic growth in Tier-2 and Tier-3 cities.</span></p>      </li>\n<li>\n<p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">It      is an initiative of Ministry of Civil Aviation.</span></p>     </li>\n</ul>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which category of prohibited    substances in sports includes drugs that increase alertness    and reduce fatigue?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Anabolic Agents</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Diuretics and Masking Agents</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Stimulants</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Beta-blockers</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer    is: </span><span style=\"font-family:'Nirmala UI'\"><b>C) Stimulants</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Stimulants</b></span><span style=\"font-family:'Nirmala UI'\"> are    a class of drugs that directly act on the central nervous system    (CNS) to speed up physical and mental processes. By mimicking or    boosting the body's natural adrenaline response, they increase    heart rate, blood pressure, and brain activity.</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding the concept of Judicial Review in the Indian    Constitution and select the correct option:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>I. </b></span><span style=\"font-family:'Nirmala UI'\">The    concept of Judicial Review is explicitly mentioned in the    Constitution.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>II. </b></span><span style=\"font-family:'Nirmala UI'\">It    allows the Judiciary to examine the constitutionality of both    legislative enactments and executive orders of both the Central    and State governments.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>III.</b></span><span style=\"font-family:'Nirmala UI'\"> If    a law is found to be violative of the Constitution, the Supreme    Court can declare it ultra vires and void.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Statement I and II are    correct.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Statement II and III are    correct.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Statement I and III are    correct.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">All Statements are correct.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>B) Only    Statement II and III are correct</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     I is Incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> The     phrase \"Judicial Review\" is </span><span style=\"font-family:'Nirmala UI'\"><b>nowhere     explicitly mentioned</b></span><span style=\"font-family:'Nirmala UI'\"> in     the Constitution of India. However, the power itself is derived     from various articles, most notably </span><span style=\"font-family:'Nirmala UI'\"><b>Article     13</b></span><span style=\"font-family:'Nirmala UI'\">, which declares that     any law that contravenes Fundamental Rights shall be void.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     II is Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> The     Supreme Court and High Courts can examine the constitutional     validity of </span><span style=\"font-family:'Nirmala UI'\"><b>legislative     enactments</b></span><span style=\"font-family:'Nirmala UI'\"> (laws     passed by Parliament or State Legislatures) and </span><span style=\"font-family:'Nirmala UI'\"><b>executive     orders</b></span><span style=\"font-family:'Nirmala UI'\"> (actions     taken by the government) at both the Central and State levels.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     III is Correct:</b></span><span style=\"font-family:'Nirmala UI'\"> If     a law or order is found to be in conflict with the Constitution,     the Judiciary has the authority to declare it </span><span style=\"font-family:'Nirmala UI'\"><b>ultra     vires</b></span><span style=\"font-family:'Nirmala UI'\"> (beyond its     power) and </span><span style=\"font-family:'Nirmala UI'\"><b>null and     void</b></span><span style=\"font-family:'Nirmala UI'\">. Once declared     void, the law cannot be enforced by the government.</span></p>    </li>\n</ul>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Judicial    Review is a fundamental feature of the Indian Constitution that    empowers the Judiciary to maintain the supremacy of the    Constitution.</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     concept of Judicial Review in India is borrowed from     the </span><span style=\"font-family:'Nirmala UI'\"><b>Constitution of     the USA</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Basic     Structure Doctrine:</b></span><span style=\"font-family:'Nirmala UI'\"> In     the </span><span style=\"font-family:'Nirmala UI'\"><b>Kesavananda     Bharati case (1973)</b></span><span style=\"font-family:'Nirmala UI'\">,     the Supreme Court ruled that Judicial Review is a </span><span style=\"font-family:'Nirmala UI'\"><b>\"Basic     Structure\"</b></span><span style=\"font-family:'Nirmala UI'\"> of     the Constitution, meaning it cannot be curtailed or removed even     by a Constitutional Amendment.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784896089548_html_358e49c4577b5108.png\" width=\"529\" height=\"353\"> </p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following questions, a    statement of assertion (A) is followed by a statement of reason    (R). Select  the correct option</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Assertion    (A):</b></span><span style=\"font-family:'Nirmala UI'\"> The Directive    Principles of State Policy (DPSP) are classified into three broad    categories—Socialistic, Gandhian, and Liberal-Intellectual—to    reflect the ideological goals of the Indian Constitution.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Reason    (R):</b></span><span style=\"font-family:'Nirmala UI'\"> The    Constitution of India explicitly provides this three-fold    classification under Part IV to ensure clear implementation by the    State.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both (A) and (R) are true, and (R)    is the correct explanation of (A)</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both (A) and (R) are true, but (R)    is NOT the correct explanation of (A)</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(A) is false, but (R) is true</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(A) is true, but (R) is false.</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is:</span><span style=\"font-family:'Nirmala UI'\"><b> D)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>(A)    is true, but (R) is false.</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Assertion     (A) is True:</b></span><span style=\"font-family:'Nirmala UI'\"> The     Directive Principles of State Policy (DPSP) are categorized     into </span><span style=\"font-family:'Nirmala UI'\"><b>Socialistic,     Gandhian, and Liberal-Intellectual</b></span><span style=\"font-family:'Nirmala UI'\"> groups.     These categories help understand the different ideological     influences—such as the welfare state (Socialistic), the vision     of Mahatma Gandhi (Gandhian), and modern democratic values     (Liberal-Intellectual).</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Reason     (R) is False:</b></span><span style=\"font-family:'Nirmala UI'\"> The     Constitution of India </span><span style=\"font-family:'Nirmala UI'\"><b>does     not explicitly provide</b></span><span style=\"font-family:'Nirmala UI'\"> any     such classification.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Directive    Principles of State Policy (DPSP)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Directive    Principles of State Policy</b></span><span style=\"font-family:'Nirmala UI'\"> are    the guidelines or principles given to the central and state    governments of India, to be kept in mind while framing laws and    policies. They are contained in </span><span style=\"font-family:'Nirmala UI'\"><b>Part    IV</b></span><span style=\"font-family:'Nirmala UI'\"> of the    Constitution </span><span style=\"font-family:'Nirmala UI'\"><b>(Articles    36 to 51).</b></span></p>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Features of DPSP</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Borrowed     from the </span><span style=\"font-family:'Nirmala UI'\"><b>Irish     Constitution</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Purpose:</b></span><span style=\"font-family:'Nirmala UI'\"> To     establish </span><span style=\"font-family:'Nirmala UI'\"><b>Social     and Economic Democracy</b></span><span style=\"font-family:'Nirmala UI'\"> and     a </span><span style=\"font-family:'Nirmala UI'\"><b>Welfare State</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">They     are </span><span style=\"font-family:'Nirmala UI'\"><b>Non-justiciable</b></span><span style=\"font-family:'Nirmala UI'\">.     This means you cannot go to court (Supreme Court or High Court)     to get them enforced if the government fails to implement them     (</span><span style=\"font-family:'Nirmala UI'\"><b>Article 37</b></span><span style=\"font-family:'Nirmala UI'\">).</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Fundamental     in Governance:</b></span><span style=\"font-family:'Nirmala UI'\"> Despite     being non-justiciable, the Constitution itself states that these     principles are fundamental to the governance of the country.</span></p>    </li>\n</ul>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Classification    of DPSPs</b></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Socialist</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Gandhian</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Liberal</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Article 38, 39, 41, 42, 43, 43A,       47</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Article 40, 43, 46, 47, 48</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Article 44, 45, 48A, 49, 50, 51</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Who was the President of the Indian    National Congress during the Lucknow Pact of 1916?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Dadabhai Naoroji</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Rash Behari Ghosh</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Annie Besant</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ambica Charan Mazumdar</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is:</span><span style=\"font-family:'Nirmala UI'\"><b> D) Ambica    Charan Mazumdar</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Lucknow    Session of 1916</b></u></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It    achieved dual-unification within the Congress and between the    Congress and the Muslim League.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Lucknow Pact:</b></span><span style=\"font-family:'Nirmala UI'\"> This     was a formal agreement between the </span><span style=\"font-family:'Nirmala UI'\"><b>Indian     National Congress (INC)</b></span><span style=\"font-family:'Nirmala UI'\"> and     the </span><span style=\"font-family:'Nirmala UI'\"><b>All India     Muslim League</b></span><span style=\"font-family:'Nirmala UI'\">. It was     the first time both organizations sat together to demand     constitutional reforms from the British.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Reunion     of Moderates and Extremists:</b></span><span style=\"font-family:'Nirmala UI'\"> After     the \"Surat Split\" of 1907, the two wings of the     Congress finally reunited, largely due to the efforts of </span><span style=\"font-family:'Nirmala UI'\"><b>Annie     Besant</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>Bal     Gangadhar Tilak</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Both     parties demanded </span><span style=\"font-family:'Nirmala UI'\"><b>\"Home     Rule\"</b></span><span style=\"font-family:'Nirmala UI'\"> (Self-Government)     and a greater representation of Indians in the government.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">A     significant aspect of the pact was that the Congress accepted the     Muslim League's demand for </span><span style=\"font-family:'Nirmala UI'\"><b>Separate     Electorates</b></span><span style=\"font-family:'Nirmala UI'\"> for     Muslims in provincial legislative councils.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">During a period of inflation in    the economy, what action is the Reserve Bank of India    (RBI) most likely to take regarding the Cash Reserve    Ratio (CRR) to stabilize prices?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Decrease the CRR to encourage banks    to lend more.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Increase the CRR to suck out excess    liquidity from the banking system.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Keep the CRR constant and only    change the Repo Rate.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Abolish the CRR requirement for    commercial banks temporarily.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>B)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Increase    the CRR to suck out excess liquidity from the banking system.</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">To     stabilize prices during inflation, the RBI uses </span><span style=\"font-family:'Nirmala UI'\"><b>\"Contractionary     Monetary Policy\"</b></span><span style=\"font-family:'Nirmala UI'\"> to     reduce the supply of money in the market.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Cash Reserve Ratio is the specific percentage of a bank's total     deposits (Net Demand and Time Liabilities or NDTL) that     it </span><span style=\"font-family:'Nirmala UI'\"><b>must keep     with the RBI in the form of liquid cash</b></span><span style=\"font-family:'Nirmala UI'\">.     Banks </span><span style=\"font-family:'Nirmala UI'\"><b>do not earn     any interest </b></span><span style=\"font-family:'Nirmala UI'\">on     this amount.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Reducing     Liquidity:</b></span><span style=\"font-family:'Nirmala UI'\"> When     the RBI raises the CRR, commercial banks are forced to keep a     larger portion of their deposits with the RBI. This leaves the     banks with </span><span style=\"font-family:'Nirmala UI'\"><b>less     money</b></span><span style=\"font-family:'Nirmala UI'\"> available to     lend to consumers and businesses.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">With     less loanable funds, interest rates usually go up, and borrowing     becomes more expensive. This leads to a decrease in investment     and consumer spending, which lowers the overall demand in the     economy and eventually brings down </span><span style=\"font-family:'Nirmala UI'\"><b>inflation</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li>\n</ul>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Additional    Points:</b></u></span></p>        <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     CRR is determined by the RBI and is applicable to all Scheduled     Commercial Banks. </span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Previously,     there was a floor (3%) and a ceiling (20%) for the CRR, but     the </span><span style=\"font-family:'Nirmala UI'\"><b>RBI Act of     1934</b></span><span style=\"font-family:'Nirmala UI'\"> was amended     in 2006 to remove these limits, giving the RBI more flexibility.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>CRR     vs. SLR:</b></span><span style=\"font-family:'Nirmala UI'\"> While CRR     must be kept with the </span><span style=\"font-family:'Nirmala UI'\"><b>RBI     in cash</b></span><span style=\"font-family:'Nirmala UI'\">, the </span><span style=\"font-family:'Nirmala UI'\"><b>Statutory     Liquidity Ratio (SLR)</b></span><span style=\"font-family:'Nirmala UI'\"> is     the percentage of deposits banks must maintain </span><span style=\"font-family:'Nirmala UI'\"><b>with     themselves</b></span><span style=\"font-family:'Nirmala UI'\"> in the     form of gold, cash, or government-approved securities.</span></p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What is India's rank in the Henley    Passport Index as of February 2026?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">80th</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">85th</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">90th</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">75th</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>D)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>75th</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Indian     passport holders can now travel to </span><span style=\"font-family:'Nirmala UI'\"><b>56     destinations</b></span><span style=\"font-family:'Nirmala UI'\"> without     a prior visa.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This     score includes a combination of </span><span style=\"font-family:'Nirmala UI'\"><b>visa-free</b></span><span style=\"font-family:'Nirmala UI'\"> entry, </span><span style=\"font-family:'Nirmala UI'\"><b>visa-on-arrival</b></span><span style=\"font-family:'Nirmala UI'\">,     and </span><span style=\"font-family:'Nirmala UI'\"><b>Electronic     Travel Authorization (eTA)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    top of the index remains dominated by </span><span style=\"font-family:'Nirmala UI'\"><b>Singapore </b></span><span style=\"font-family:'Nirmala UI'\">(Retains    the 1st position with visa-free access to </span><span style=\"font-family:'Nirmala UI'\"><b>192    destinations</b></span><span style=\"font-family:'Nirmala UI'\">).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Henley    Passport Index</b></u></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The Henley    Passport Index is the original, most authoritative ranking of    all the world’s passports according to the number of    destinations their holders can access without a prior visa.</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     index is based on exclusive and official data from     the </span><span style=\"font-family:'Nirmala UI'\"><b>International     Air Transport Association (IATA)</b></span><span style=\"font-family:'Nirmala UI'\">,     which maintains the world’s largest and most accurate database     of travel information.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     compares the visa-free access of </span><span style=\"font-family:'Nirmala UI'\"><b>199     different passports</b></span><span style=\"font-family:'Nirmala UI'\"> to </span><span style=\"font-family:'Nirmala UI'\"><b>227     different travel destinations</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li>\n</ul>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Feature</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Details</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Published By</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Henley &amp; Partners</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Frequency</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Quarterly updates</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Key Indicator</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Reflects a country's </span><span style=\"font-family:'Nirmala UI'\"><b>Diplomatic       Power</b></span><span style=\"font-family:'Nirmala UI'\"> and Global       Mobility</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Top Country (2026)</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Singapore</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>India's Rank (2026)</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">75th</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Which of the following pairs    correctly matches the scale used to measure earthquakes with its    primary characteristic?</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">1.    Richter Scale — Measures the intensity of an    earthquake based on observed damage.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">2.    Mercalli Scale — Measures the magnitude of an    earthquake using a logarithmic scale of energy release.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">None of them</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both I and II</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only II</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>B)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>None    of them</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1.    Richter Scale (Magnitude)</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     measures the </span><span style=\"font-family:'Nirmala UI'\"><b>magnitude</b></span><span style=\"font-family:'Nirmala UI'\"> (total     energy released) of an earthquake using a </span><span style=\"font-family:'Nirmala UI'\"><b>logarithmic     scale.</b></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is based on the </span><span style=\"font-family:'Nirmala UI'\"><b>amplitude </b></span><span style=\"font-family:'Nirmala UI'\">of     seismic waves recorded by a </span><span style=\"font-family:'Nirmala UI'\"><b>seismograph</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     has </span><span style=\"font-family:'Nirmala UI'\"><b>no theoretical     upper limit</b></span><span style=\"font-family:'Nirmala UI'\">, but each     whole number increase represents a </span><span style=\"font-family:'Nirmala UI'\"><b>10-fold     increase</b></span><span style=\"font-family:'Nirmala UI'\"> in     measured amplitude and roughly a </span><span style=\"font-family:'Nirmala UI'\"><b>32-fold     increase</b></span><span style=\"font-family:'Nirmala UI'\"> in energy     release.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is an objective, quantitative measurement.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence, Statement    I is incorrect.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>2.    Mercalli Scale (Intensity)</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     measures the </span><span style=\"font-family:'Nirmala UI'\"><b>intensity</b></span><span style=\"font-family:'Nirmala UI'\"> of     an earthquake based on the </span><span style=\"font-family:'Nirmala UI'\"><b>observed     damage</b></span><span style=\"font-family:'Nirmala UI'\"> to     structures and the effects on people and the environment.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is recorded using Roman numerals (from I to XII).</span></p>     <ul>      <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>I:</b></span><span style=\"font-family:'Nirmala UI'\"> Not      felt.</span></p>      </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>XII:</b></span><span style=\"font-family:'Nirmala UI'\"> Total      destruction.</span></p>     </li>\n</ul>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is a subjective, qualitative measurement that varies depending on     the distance from the epicenter and local soil conditions.</span></p>    </li>\n</ul>        <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, Statement    II is incorrect.</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following authorities    is NOT a Constitutional Body as per the provisions of    the Constitution of India?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">National Commission for Women</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">National Commission for Scheduled    Tribes</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Special Officer for Linguistic    Minorities</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Inter-State Council</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>A) National    Commission for Women.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>National    Commission for Women (NCW)</b></span><span style=\"font-family:'Nirmala UI'\"> is    the apex national-level organization in India mandated to protect    and promote the interests of women.</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     was established in January 1992 under the provisions of     the </span><span style=\"font-family:'Nirmala UI'\"><b>National     Commission for Women Act, 1990</b></span><span style=\"font-family:'Nirmala UI'\">.     Hence, it is a </span><span style=\"font-family:'Nirmala UI'\"><b>Statutory     Body</b></span><span style=\"font-family:'Nirmala UI'\">, not a     constitutional one.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     was formally constituted on </span><span style=\"font-family:'Nirmala UI'\"><b>January     31, 1992</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     NCW has the power to take </span><span style=\"font-family:'Nirmala UI'\"><i><b>suo     motu</b></i></span><span style=\"font-family:'Nirmala UI'\"> (on its     own motion) notice of matters relating to deprivation of women's     rights or non-implementation of protective laws.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">While     investigating any matter or inquiring into a complaint, the     Commission has the powers of a </span><span style=\"font-family:'Nirmala UI'\"><b>Civil     Court.</b></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Headquarters:</b></span><span style=\"font-family:'Nirmala UI'\"> New     Delhi.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>First     Chairperson:</b></span><span style=\"font-family:'Nirmala UI'\"> Jayanti     Patnaik.</span></p>    </li>\n</ul>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Current     Chairperson</b></span><span style=\"font-family:'Nirmala UI'\">: Vijaya     Kishore Rahatkar</span></p>    </li>\n</ul>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    Commission consists of:</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>A     Chairperson:</b></span><span style=\"font-family:'Nirmala UI'\"> Nominated     by the Central Government (must be committed to the cause of     women).</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Five     Members:</b></span><span style=\"font-family:'Nirmala UI'\"> Nominated     by the Central Government from amongst persons of ability and     integrity. At least one member each must be from the </span><span style=\"font-family:'Nirmala UI'\"><b>Scheduled     Castes</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>Scheduled     Tribes</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>A     Member-Secretary:</b></span><span style=\"font-family:'Nirmala UI'\"> Usually     an expert in the field of management, social movement, or an     officer of the civil service.</span></p>    </li>\n</ul>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    other three options are mentioned in the Constitution:</span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Authority</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Constitutional Article</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Nature</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>National Commission for       Scheduled Tribes (NCST)</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Article 338A</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Established by the 89th       Amendment Act, 2003.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Special Officer for       Linguistic Minorities</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Article 350B</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Added by the 7th Amendment Act,       1956.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Inter-State Council</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Article 263</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Established by the President to       investigate and discuss subjects of common interest between       States and the Union</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following is not the    primary motives for holding money?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Transactions Motive</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Investment Motive</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Precautionary Motive</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Speculative Motive</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer    is: </span><span style=\"font-family:'Nirmala UI'\"><b>B) Investment    Motive.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">There    are three primary motives for holding money.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1.    Transactionary Motive</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This    is the most basic reason. People hold cash to carry out day-to-day    transactions. Since there is usually a time gap between receiving    income (like a monthly salary) and spending it, people keep liquid    cash to pay for food, rent, and bills.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key     Factor:</b></span><span style=\"font-family:'Nirmala UI'\"> Directly     related to the </span><span style=\"font-family:'Nirmala UI'\"><b>level     of income</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>2.    Precautionary Motive</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This    refers to holding money for </span><span style=\"font-family:'Nirmala UI'\"><b>unforeseen    emergencies</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key     Factor:</b></span><span style=\"font-family:'Nirmala UI'\"> Also     depends largely on the </span><span style=\"font-family:'Nirmala UI'\"><b>level     of income</b></span><span style=\"font-family:'Nirmala UI'\"> and     general economic stability.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>3.    Speculative Motive</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This    is the desire to hold cash to take advantage of future changes in    the </span><span style=\"font-family:'Nirmala UI'\"><b>interest rate</b></span><span style=\"font-family:'Nirmala UI'\"> or    bond prices. If an individual believes that interest rates will    rise (and bond prices will fall), they will hold onto cash now to    invest later when the returns are higher.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key     Factor:</b></span><span style=\"font-family:'Nirmala UI'\"> Highly     sensitive to </span><span style=\"font-family:'Nirmala UI'\"><b>interest     rates</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">If    the interest rate is very low, the Speculative Demand for money    becomes perfectly elastic—a situation known as a </span><span style=\"font-family:'Nirmala UI'\"><b>Liquidity    Trap</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which Manipuri film, produced by    Farhan Akhtar, recently won the Best Children’s &amp;    Family Film award at the BAFTA Awards in London?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ishanou</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Eigi Kona</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Boong</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Onnam Lathi</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct an
