    Brahmana</b></span><span style=\"font-family:'Nirmala UI'\"> community    of the Konkan region. The shift in power became permanent    during the reign of </span><span style=\"font-family:'Nirmala UI'\"><b>Chhatrapati    Shahu</b></span><span style=\"font-family:'Nirmala UI'\"> (Shivaji's    grandson).</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Balaji     Vishwanath (1713–1720):</b></span><span style=\"font-family:'Nirmala UI'\"> He     was the first powerful Peshwa who helped stabilize Shahu’s     throne. He laid the foundation for the hereditary succession     of the Peshwaship within his family.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Baji     Rao I (1720–1740):</b></span><span style=\"font-family:'Nirmala UI'\"> Often     considered the greatest of the Peshwas, he expanded the Maratha     Empire across North India and transformed the Maratha state into     a \"Maratha Confederacy.\"</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Administrative     Hub:</b></span><span style=\"font-family:'Nirmala UI'\"> The seat of     power moved from Satara to </span><span style=\"font-family:'Nirmala UI'\"><b>Pune</b></span><span style=\"font-family:'Nirmala UI'\">,     which became the de facto capital of the Maratha Empire under the     Chitpavan Peshwas.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>The    Maratha Confederacy:</b></u></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Under    the Chitpavan Peshwas, the empire functioned as a confederacy    where powerful Maratha families held different regions:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Gaekwads</b></span><span style=\"font-family:'Nirmala UI'\"> in     Baroda</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Holkars</b></span><span style=\"font-family:'Nirmala UI'\"> in     Indore</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Scindias</b></span><span style=\"font-family:'Nirmala UI'\"> (Shindes)     in Gwalior</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Bhonsles</b></span><span style=\"font-family:'Nirmala UI'\"> in     Nagpur</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Which of the following is/are the    principal feature(s) of the Government of India Act, 1919?</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Introduction     of diarchy in the executive government of the provinces.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Introduction     of separate communal electorates for Muslims.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Devolution     of legislative authority by the centre to the provinces.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Select    the correct answer using the codes given below:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 and 3 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 and 3 only</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2 and 3</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>(c)    1 and 3 only</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Government    of India Act, 1919</b></span><span style=\"font-family:'Nirmala UI'\">, also    known as the </span><span style=\"font-family:'Nirmala UI'\"><b>Montagu-Chelmsford    Reforms</b></span><span style=\"font-family:'Nirmala UI'\">, was a    significant step toward \"progressive realization of    responsible government\" in India.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1.    Introduction of Diarchy in the Provinces — Correct</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    Act introduced a unique system called </span><span style=\"font-family:'Nirmala UI'\"><b>Diarchy</b></span><span style=\"font-family:'Nirmala UI'\"> (rule    of two) for the executive government of the provinces. Provincial    subjects were divided into two categories:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Reserved     Subjects:</b></span><span style=\"font-family:'Nirmala UI'\"> Handled     by the Governor and his Executive Council (e.g., Law and Order,     Finance, Land Revenue). They were not responsible to the local     legislature.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Transferred     Subjects:</b></span><span style=\"font-family:'Nirmala UI'\"> Handled     by the Governor with the aid of Ministers responsible to the     Legislative Council (e.g., Education, Health, Local     Self-Government).</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>2.    Separate Communal Electorates for Muslims — Incorrect</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Separate    electorates for </span><span style=\"font-family:'Nirmala UI'\"><b>Muslims</b></span><span style=\"font-family:'Nirmala UI'\"> were    actually introduced earlier by the </span><span style=\"font-family:'Nirmala UI'\"><b>Morley-Minto    Reforms (Government of India Act, 1909)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>What     the 1919 Act did:</b></span><span style=\"font-family:'Nirmala UI'\"> It </span><span style=\"font-family:'Nirmala UI'\"><i>extended</i></span><span style=\"font-family:'Nirmala UI'\"> the     principle of communal representation to include </span><span style=\"font-family:'Nirmala UI'\"><b>Sikhs,     Indian Christians, Anglo-Indians, and Europeans</b></span><span style=\"font-family:'Nirmala UI'\">.     It did not </span><span style=\"font-family:'Nirmala UI'\"><i>introduce</i></span><span style=\"font-family:'Nirmala UI'\"> it     for Muslims.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>3.    Devolution of Legislative Authority — Correct</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    Act relaxed central control over the provinces by demarcating and    separating the central and provincial subjects. Both central and    provincial legislatures were authorized to make laws on their    respective list of subjects. This was a    clear </span><span style=\"font-family:'Nirmala UI'\"><b>devolution</b></span><span style=\"font-family:'Nirmala UI'\"> (transfer)    of authority from the Centre to the Provinces.</span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Feature</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>1909 Act (Morley–Minto)</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>1919 Act (Mont–Ford)</b></span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Main Goal</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Extension of Councils</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Responsible Government</span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Electorates</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Introduced for Muslims</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Extended to Sikhs, Christians,       etc.</span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Executive</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">No Diarchy</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Diarchy at Provincial level</span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Legislature</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Unicameral at Centre</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Bicameral at Centre</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>Who Won The 2026    Tyler Prize for Environmental Achievement?<br> </span></span><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Jane Goodall</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Wangari Maathai</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">David Attenborough</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Dr. Toby Kiers</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Correct     Answer D. Dr. Toby Kiers</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Dr.     Toby Kiers</b></span><span style=\"font-family:'Nirmala UI'\"> :     American environmental scientist and biologist Won —</span><span style=\"font-family:'Nirmala UI'\"><b>2026     Tyler Prize for Environmental </b></span><span style=\"font-family:'Nirmala UI'\">Achievement     (Nobel Prize for the environment )</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which type of rocks is formed at    relatively high temperatures and by crystallization of solids?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Igneous rocks</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sedimentary rocks</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Volcanic rocks</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Metamorphic rocks</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>A.    Igneous rocks</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Igneous    rocks are defined by their origin from molten material and the    process of solidification through cooling.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>High     Temperatures:</b></span><span style=\"font-family:'Nirmala UI'\"> Igneous     rocks begin as </span><span style=\"font-family:'Nirmala UI'\"><b>magma</b></span><span style=\"font-family:'Nirmala UI'\"> (molten     rock underground) or </span><span style=\"font-family:'Nirmala UI'\"><b>lava</b></span><span style=\"font-family:'Nirmala UI'\"> (molten     rock on the surface). These materials exist at temperatures     ranging from approximately </span><span style=\"font-family:'Nirmala UI'\"><b>700°C     to 1,300°C</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Crystallization:</b></span><span style=\"font-family:'Nirmala UI'\"> As     the molten rock cools, the atoms lose their kinetic energy and     begin to arrange themselves into orderly, repeating structures.     This process is known as </span><span style=\"font-family:'Nirmala UI'\"><b>crystallization</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Solidification:</b></span><span style=\"font-family:'Nirmala UI'\"> Once     the entire mass has cooled enough to become a solid crystal     lattice, an igneous rock is formed.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Classification    of Igneous Rocks:</b></u></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Igneous    rocks are further divided based on </span><span style=\"font-family:'Nirmala UI'\"><i>where</i></span><span style=\"font-family:'Nirmala UI'\"> the    crystallization occurs, which significantly affects their texture:</span></p>    <table>     <col>      <col>      <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Type</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Formation Location</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Cooling Rate</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Grain Size</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Example</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Intrusive (Plutonic)</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Deep underground</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Very Slow</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Coarse (Large crystals)</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Granite</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Extrusive (Volcanic)</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">On the surface</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Rapid</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Fine (Small/No crystals)</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Basalt / Obsidian</b></span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The Swaran Singh committee had    formulated ________-point code of fundamental duties.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">9</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">8</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">7</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">11</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>B.    8</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">There    are currently </span><span style=\"font-family:'Nirmala UI'\"><b>11</b></span><span style=\"font-family:'Nirmala UI'\"> Fundamental    Duties in the Indian Constitution. However, the </span><span style=\"font-family:'Nirmala UI'\"><b>Sardar    Swaran Singh Committee</b></span><span style=\"font-family:'Nirmala UI'\">,    which was appointed by the Congress government in 1976, originally    recommended a code of only </span><span style=\"font-family:'Nirmala UI'\"><b>8</b></span><span style=\"font-family:'Nirmala UI'\"> duties.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1976     (42nd Amendment):</b></span><span style=\"font-family:'Nirmala UI'\"> The     Parliament added </span><span style=\"font-family:'Nirmala UI'\"><b>10</b></span><span style=\"font-family:'Nirmala UI'\"> Fundamental     Duties to the Constitution (Part IV-A, Article 51A).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>2002     (86th Amendment):</b></span><span style=\"font-family:'Nirmala UI'\"> The </span><span style=\"font-family:'Nirmala UI'\"><b>11th</b></span><span style=\"font-family:'Nirmala UI'\"> Fundamental     Duty (providing opportunities for education to children aged     6–14) was added.</span></p>    </li></ul>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Feature</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Details</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Source</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Inspired by the Constitution of       the erstwhile </span><span style=\"font-family:'Nirmala UI'\"><b>USSR</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Nature</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Non-justiciable</b></span><span style=\"font-family:'Nirmala UI'\"> (like       DPSPs), meaning they cannot be enforced by the courts through       writs.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Applicability</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Applicable </span><span style=\"font-family:'Nirmala UI'\"><b>only       to citizens</b></span><span style=\"font-family:'Nirmala UI'\"> of       India, not to foreigners.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Legal Status</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">While the duties themselves       aren't enforceable, Parliament can enact laws to implement them       (e.g., the Prevention of Insults to National Honour Act, 1971).</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following is correct ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Operating profit = Net profit -    Non-operating expenses - Non-operating incomes</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Operating profit = Net profit +    Non-operating expenses + Non-operating incomes</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Operating profit = Net profit +    Non-operating expenses - Non-operating incomes</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Operating profit = Net profit -    Non-operating expenses + Non-operating incomes</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>(c)    Operating profit = Net profit + Non-operating expenses -    Non-operating incomes</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The    Logic of the Formula:</b></span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Add     back Non-operating Expenses:</b></span><span style=\"font-family:'Nirmala UI'\"> Since     these expenses (like interest on a loan or a loss on the sale of     an asset) were subtracted to reach Net Profit, you must add them     back because they aren't part of day-to-day operations.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Subtract     Non-operating Incomes:</b></span><span style=\"font-family:'Nirmala UI'\"> Since     these gains (like dividend income or rent received from a sub-let     property) were added to reach Net Profit, you must subtract them     because they don't come from the primary business activity.</span></p>    </li></ol>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In November 2025, Narendra Modi    presented a revolutionary indigenous innovation of India, as the    country’s indigenous quantum security chip called:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Indian Quantum Encryption Module    (IQEM)</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Quantum Security Integrated    Processor (QSIP)</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Quantum Cyber Defence Chip (QCDC)</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Next-Gen Quantum Shield Chip (NQSC)</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>Quantum    Security Integrated Processor (QSIP)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">During    the </span><span style=\"font-family:'Nirmala UI'\"><b>Emerging    Science, Technology &amp; Innovation Conclave (ESTIC) 2025</b></span><span style=\"font-family:'Nirmala UI'\"> in    New Delhi, Prime Minister Narendra Modi dedicated three major    indigenous innovations to the nation:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>QSIP     (Quantum Security Integrated Processor):</b></span><span style=\"font-family:'Nirmala UI'\"> Developed     by the Bengaluru-based startup </span><span style=\"font-family:'Nirmala UI'\"><b>QNu     Labs</b></span><span style=\"font-family:'Nirmala UI'\">, this is described     as a \"Quantum Random Number Generator System in Package.\"     Its primary role is to provide quantum-certified randomness to     encrypt and decrypt data, offering the strongest defense against     cyber threats and future quantum attacks.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>25-qubit     QPU (Quantum Computing Chip):</b></span><span style=\"font-family:'Nirmala UI'\"> Developed     by </span><span style=\"font-family:'Nirmala UI'\"><b>QpiAI</b></span><span style=\"font-family:'Nirmala UI'\">,     another Bengaluru-based startup. This is India's first quantum     computing chip, integrated into the \"QpiAI-Indus\"     full-stack quantum computer.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>NexCAR19:</b></span><span style=\"font-family:'Nirmala UI'\"> India's     first indigenous cancer CAR-T cell therapy, developed by an </span><span style=\"font-family:'Nirmala UI'\"><b>IIT     Bombay</b></span><span style=\"font-family:'Nirmala UI'\"> spin-off     (ImmunoACT).</span></p>    </li></ol>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">According to Census of India 2011,    in which of the following states was the Scheduled Caste (SC)    population NOT recorded?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Manipur</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Nagaland</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Punjab</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gujarat</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>B.    Nagaland</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">According    to the </span><span style=\"font-family:'Nirmala UI'\"><b>Census of    India 2011</b></span><span style=\"font-family:'Nirmala UI'\">, there was no    population recorded under the </span><span style=\"font-family:'Nirmala UI'\"><b>Scheduled    Caste (SC)</b></span><span style=\"font-family:'Nirmala UI'\"> category    in the state of </span><span style=\"font-family:'Nirmala UI'\"><b>Nagaland</b></span><span style=\"font-family:'Nirmala UI'\">.    This is primarily because the state is predominantly inhabited by    various </span><span style=\"font-family:'Nirmala UI'\"><b>Scheduled    Tribe (ST)</b></span><span style=\"font-family:'Nirmala UI'\"> communities,    and no castes have been notified as \"Scheduled Castes\"    in Nagaland under the Constitution (Scheduled Castes) Order.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following films is    considered the first Indian sound (talkie) film, marking the    beginning of Bollywood?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mughal-e-Azam</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Alam Ara</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Raja Harishchandra</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sholay</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Correct     Answer B. Alam Ara</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Alam     Ara</b></span><span style=\"font-family:'Nirmala UI'\"> is regarded as     the </span><span style=\"font-family:'Nirmala UI'\"><b>first Indian     sound (talkie) film</b></span><span style=\"font-family:'Nirmala UI'\">. It     was released on </span><span style=\"font-family:'Nirmala UI'\"><b>14     March 1931</b></span><span style=\"font-family:'Nirmala UI'\"> and     directed by Ardeshir Irani.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     film marked the beginning of the </span><span style=\"font-family:'Nirmala UI'\"><b>talkie     era in Indian cinema</b></span><span style=\"font-family:'Nirmala UI'\">,     as it was the first Indian movie to feature synchronized sound     and dialogues. Before this, Indian films were silent.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Mughal-e-Azam     (1960)</b></span><span style=\"font-family:'Nirmala UI'\"> – A     famous historical film, but not the first talkie.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Alam     Ara (1931)</b></span><span style=\"font-family:'Nirmala UI'\"> –     First Indian sound film (talkie).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Raja     Harishchandra (1913)</b></span><span style=\"font-family:'Nirmala UI'\"> –     India's first full-length silent feature film, directed     by Dadasaheb Phalke.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Sholay     (1975)</b></span><span style=\"font-family:'Nirmala UI'\"> – One of     India's most successful films, but not related to the beginning     of sound cinema.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The Atal Pension Yojana (APY),    which completed over a decade of providing old-age income security    to the unorganised sector in 2026, was officially launched on    which date?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">15th August 2014</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">9th May 2015</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1st June 2015</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">25th September 2015</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     </span><span style=\"font-family:'Nirmala UI'\"><b>Atal Pension Yojana     (APY)</b></span><span style=\"font-family:'Nirmala UI'\"> was officially     launched on </span><span style=\"font-family:'Nirmala UI'\"><b>9 May 2015</b></span><span style=\"font-family:'Nirmala UI'\">     by Prime Minister Narendra Modi. </span>     </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Eligibility:     Any Indian citizen aged between 18 and 40 years can join.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Regulatory     Body: It is administered by the Pension Fund Regulatory and     Development Authority (PFRDA) under the National Pension System     (NPS) architecture.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Recent     Update: In January 2026, the Union Cabinet approved the     continuation of APY till FY 2030–31, maintaining its current     pension limits to ensure affordability for low-income     subscribers.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following is NOT an    example of inertia at rest?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Falling down backward when a    vehicle starts immediately</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Falling down of dust particle while    dusting a cloth</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The detachment of leaves/fruits due    to shaking</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The sudden application of brakes in    a vehicle</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>D.    The sudden application of brakes in a vehicle</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This    is because the sudden application of brakes is an example    of </span><span style=\"font-family:'Nirmala UI'\"><b>inertia of    motion</b></span><span style=\"font-family:'Nirmala UI'\">, not inertia at    rest.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Types    of Inertia</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Inertia</b></span><span style=\"font-family:'Nirmala UI'\"> is    the inherent property of an object to resist any change in its    state of rest or motion. It is categorized into two types:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1.    Inertia of Rest</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    tendency of a body to remain in its state of rest. If the    body is at rest, it will resist moving.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     A (Starting a vehicle):</b></span><span style=\"font-family:'Nirmala UI'\"> When     a vehicle starts suddenly, your lower body moves forward with the     car, but your upper body tries to stay at rest. Result: You     jerk </span><span style=\"font-family:'Nirmala UI'\"><b>backward</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     B (Dusting a cloth):</b></span><span style=\"font-family:'Nirmala UI'\"> When     you shake a cloth, the cloth moves, but the dust particles tend     to stay at rest. Result: The dust falls off.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     C (Shaking a tree):</b></span><span style=\"font-family:'Nirmala UI'\"> The     branches move, but the leaves and fruits try to remain at     rest. Result: They get detached and fall.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>2.    Inertia of Motion</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    tendency of a body to remain in its state of uniform motion.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Option     D (Applying brakes):</b></span><span style=\"font-family:'Nirmala UI'\"> When     a moving vehicle stops suddenly, your lower body stops with the     vehicle, but your upper body wants to continue moving forward at     the same speed. Result: You lurch </span><span style=\"font-family:'Nirmala UI'\"><b>forward</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 16, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Match the following.</span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">A Propene</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1. Unsaturated 3 carbon chains       with double bond</span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">B Propyne</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">2. Unsaturated 3 carbon chains       with triple bond</span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">C Propane</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">3. Saturated 3 carbon bonds</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "option1": "<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">A-3, B-1, C-2</span></p>", "option2": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">A-1, B-2, C-3</span></p>", "option3": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">A-3, B-2, C-1</span></p>", "option4": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">A-2, B-1, C-3</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>B.    A-1, B-2, C-3</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">This classification is based on the    type of carbon-carbon bonds present in the molecules, which    determines whether the hydrocarbon is </span><span style=\"font-family:'Nirmala UI'\"><b>saturated</b></span><span style=\"font-family:'Nirmala UI'\"> or </span><span style=\"font-family:'Nirmala UI'\"><b>unsaturated</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In organic chemistry, the    suffixes </span><span style=\"font-family:'Nirmala UI'\"><b>-ane</b></span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-family:'Nirmala UI'\"><b>-ene</b></span><span style=\"font-family:'Nirmala UI'\">,    and </span><span style=\"font-family:'Nirmala UI'\"><b>-yne</b></span><span style=\"font-family:'Nirmala UI'\"> tell    you exactly what kind of bonds are holding the carbon atoms    together:</span></p>    <table>     <col>      <col>      <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Molecule</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Suffix</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Bond Type</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Classification</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Formula</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>A. Propene</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>-ene</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Double bond</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Unsaturated</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">C</span><sub><span style=\"font-family:'Nirmala UI'\">3</span></sub><span style=\"font-family:'Nirmala UI'\">H</span><sub><span style=\"font-family:'Nirmala UI'\">6</span></sub></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>B. Propyne</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>-yne</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Triple bond</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Unsaturated</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">C</span><sub><span style=\"font-family:'Nirmala UI'\">3</span></sub><span style=\"font-family:'Nirmala UI'\">H</span><sub><span style=\"font-family:'Nirmala UI'\">4</span></sub></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>C. Propane</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>-ane</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Single bond</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Saturated</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">C</span><sub><span style=\"font-family:'Nirmala UI'\">3</span></sub><span style=\"font-family:'Nirmala UI'\">H</span><sub><span style=\"font-family:'Nirmala UI'\">8</span></sub></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The book titled 'Awaazon Ke Jugnu:    The Voice Masters of India', which documents the lives of    legendary Indian voice artists, was recently launched at IGNCA.    Who is the editor of this significant work?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Dr. Shefali Chaturvedi</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Dr. Meenakshi Lekhi</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Dr. Kapila Vatsyayan</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Dr. Sachidanand Joshi</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">\"Awaazon     Ke Jugnu: The Voice Masters of India,\" is curated by Dr.     Shefali Chaturvedi</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     launch took place at the Indira Gandhi National Centre for the     Arts (IGNCA) in January 2026.</span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Objective:     The book aims to provide a platform for voice-over artists, who     are often the \"unseen\" faces behind the most famous     voices in Indian broadcasting history.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Which of the following statements    relating to 2026 FIFA Men's Football World Cup islare correct ?</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">USA,     Mexico and Canada will jointly host the event.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">48     teams shall participate in the event.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Select    the answer using the codes given below:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both 1 and 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither I nor 2</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>(c)    Both 1 and 2</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>2026    FIFA Men's World Cup</b></span><span style=\"font-family:'Nirmala UI'\"> (officially    branded as </span><span style=\"font-family:'Nirmala UI'\"><b>FIFA    World Cup 26</b></span><span style=\"font-family:'Nirmala UI'\">) is set to    be a landmark tournament in sports history due to its    unprecedented scale and format changes.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1.    USA, Mexico, and Canada will jointly host the event — Correct</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This    is the first time in FIFA history that three countries will    co-host the tournament.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Mexico</b></span><span style=\"font-family:'Nirmala UI'\"> will     make history by becoming the first country to host or co-host the     men's World Cup three times (1970, 1986, and 2026).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     USA</b></span><span style=\"font-family:'Nirmala UI'\"> previously     hosted in 1994.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Canada</b></span><span style=\"font-family:'Nirmala UI'\"> will     be hosting the men's tournament for the first time.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>2.    48 teams shall participate in the event — Correct</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">FIFA    has expanded the tournament from the traditional 32-team format    (which was in place from 1998 to 2022) to </span><span style=\"font-family:'Nirmala UI'\"><b>48    teams</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Format:</b></span><span style=\"font-family:'Nirmala UI'\"> The teams     will be divided into </span><span style=\"font-family:'Nirmala UI'\"><b>12     groups of four</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Matches:</b></span><span style=\"font-family:'Nirmala UI'\"> The total     number of matches will increase from 64 to </span><span style=\"font-family:'Nirmala UI'\"><b>104</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>The     Duration:</b></span><span style=\"font-family:'Nirmala UI'\"> To     accommodate the extra games, the tournament will span 39 days,     culminating in the final on July 19, 2026, at the MetLife Stadium     in New Jersey/New York.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">High     clouds primarily reflect solar radiation and cool the surface of     the Earth.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Low     clouds have a high absorption of infrared radiation emanating     from the Earth’s surface and thus cause a warming effect.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the statements given above is/are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both 1 and 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither 1 nor 2</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>(d)    Neither 1 nor 2</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1.    High Clouds (e.g., Cirrus) — Incorrect</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Claim:</b></span><span style=\"font-family:'Nirmala UI'\"> That they     reflect solar radiation and cool the Earth.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Reality:</b></span><span style=\"font-family:'Nirmala UI'\"> High     clouds are thin, cold, and composed of ice crystals. They are     relatively \"transparent\" to incoming shortwave solar     radiation, meaning they </span><span style=\"font-family:'Nirmala UI'\"><b>do     not reflect much sunlight</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Effect:</b></span><span style=\"font-family:'Nirmala UI'\"> However,     they are very effective at absorbing longwave infrared radiation     (heat) emitted by the Earth's surface. Because they are so high     and cold, they radiate very little of that heat out into space,     effectively trapping it.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Result:</b></span><span style=\"font-family:'Nirmala UI'\"> They     have a net </span><span style=\"font-family:'Nirmala UI'\"><b>warming     effect</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>2.    Low Clouds (e.g., Stratus) — Incorrect</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Claim:</b></span><span style=\"font-family:'Nirmala UI'\"> That they     absorb infrared radiation and cause a warming effect.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Reality:</b></span><span style=\"font-family:'Nirmala UI'\"> Low     clouds are thick, dense, and composed of water droplets. Their     primary characteristic is a </span><span style=\"font-family:'Nirmala UI'\"><b>high     Albedo</b></span><span style=\"font-family:'Nirmala UI'\">, meaning they     reflect a vast majority of incoming solar radiation back into     space before it reaches the surface.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Effect:</b></span><span style=\"font-family:'Nirmala UI'\"> While they     do absorb some infrared radiation from the ground, they are much     warmer than high clouds and emit that heat back toward the     surface and space more readily. Their \"cooling\"     (reflection of sunlight) far outweighs their \"warming\"     (trapping of heat).</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Result:</b></span><span style=\"font-family:'Nirmala UI'\"> They     have a net </span><span style=\"font-family:'Nirmala UI'\"><b>cooling     effect.</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 20, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Match List-I with List-II and    select the answer using the code given below the Lists :</span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>List-I (Special provision in       the Constitution of India)</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>List-II (State)</b></span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">A. Article 371</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1. Nagaland</span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">B. Article 371-A</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">2. Gujarat</span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">C. Article 371-B</span></p>      </td>      <td style=\"
