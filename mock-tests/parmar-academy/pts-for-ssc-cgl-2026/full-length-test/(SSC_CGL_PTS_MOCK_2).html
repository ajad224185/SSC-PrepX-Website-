<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In    the traditional and historical accounts of the </span><span style=\"font-family:'Nirmala UI'\"><b>Vijayanagara    Empire</b></span><span style=\"font-family:'Nirmala UI'\">, different titles    were used to distinguish the regional powers based on their    perceived military strengths.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>The    \"Lords\" of the Deccan and South India:</b></u></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">According    to the contemporary descriptions (especially the </span><span style=\"font-family:'Nirmala UI'\"><i>Rayavachakamu</i></span><span style=\"font-family:'Nirmala UI'\">),    the three major powers of the time were often referred to using    these specific titles:</span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Title</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Meaning</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Refers to...</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Narapati</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Lord of Men</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Rayas</b></span><span style=\"font-family:'Nirmala UI'\"> of       Vijayanagara</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Ashvapati</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Lord of Horses</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Deccan       Sultans</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Gajapati</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Lord of Elephants</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Gajapati       Rulers</b></span><span style=\"font-family:'Nirmala UI'\"> of Odisha</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Context and Significance</b></span></p>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>The Rayas (Narapati):</b></span><span style=\"font-family:'Nirmala UI'\"> The     Vijayanagara kings were called </span><span style=\"font-family:'Nirmala UI'\"><i>Narapati</i></span><span style=\"font-family:'Nirmala UI'\"> because     of their massive infantry and the vast number of subjects they     commanded.</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>The Sultans (Ashvapati):</b></span><span style=\"font-family:'Nirmala UI'\"> The     Deccan Sultans (of Bijapur, Ahmednagar, Golconda, etc.) had     superior access to Central Asian and Arabian horses through sea     trade, giving them a formidable cavalry.</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>The Gajapatis (Gajapati):</b></span><span style=\"font-family:'Nirmala UI'\"> The     rulers of Odisha were famous for their large and powerful     war-elephant corps, which were a dominant force in the     jungle-heavy terrain of the east.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bana Bhatt, the court poet of    Harsha, wrote which famous historical biography?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Arthashastra</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Prithviraj Raso</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Harshacharita</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Rajatarangini</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Bana     Bhatt</b></span><span style=\"font-family:'Nirmala UI'\"> was the     court poet of </span><span style=\"font-family:'Nirmala UI'\"><b>Harshavardhana</b></span><span style=\"font-family:'Nirmala UI'\"> and     wrote </span><span style=\"font-family:'Nirmala UI'\"><b>‘Harshacharita’</b></span><span style=\"font-family:'Nirmala UI'\">,     which gives a detailed account of Harsha’s life,     administration, and the socio-political conditions of that     period.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Rajatarangini:</b></span><span style=\"font-family:'Nirmala UI'\"> Written     by Kalhana; history of Kashmir.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Prithviraj     Raso:</b></span><span style=\"font-family:'Nirmala UI'\"> Attributed     to Chand Bardai; about Prithviraj Chauhan.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Arthashastra:</b></span><span style=\"font-family:'Nirmala UI'\"> Written     by Kautilya/Chanakya; treatise on statecraft and economics</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In which of the following years,    were separate electorates introduced in the Imperial Legislative    Assembly elections in the name of Morley- Minto Reforms?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Indian Council Act, 1861</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Government of India Act, 1935</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Indian Council Act, 1909</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Government of India Act, 1919</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>C.    Indian Council Act, 1909</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Morley-Minto    Reforms</b></span><span style=\"font-family:'Nirmala UI'\">, named after the    then Secretary of State for India (Lord Morley) and the Viceroy of    India (Lord Minto), introduced the system of </span><span style=\"font-family:'Nirmala UI'\"><b>separate    electorates</b></span><span style=\"font-family:'Nirmala UI'\"> based    on religion, a move that significantly impacted the political    fabric of India.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Key    Features of the 1909 Act:</b></u></span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Separate     Electorates:</b></span><span style=\"font-family:'Nirmala UI'\"> This     was the most controversial feature. It granted Muslims a     separate electorate, meaning that only Muslim voters could elect     Muslim representatives. This effectively legalized the     concept of communalism.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Expansion     of Councils:</b></span><span style=\"font-family:'Nirmala UI'\"> The     number of members in the Central Legislative Council was     increased from 16 to 60.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Deliberative     Functions:</b></span><span style=\"font-family:'Nirmala UI'\"> For the     first time, members were allowed to ask supplementary questions     and move resolutions on the budget.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Indian     Entry into Executive Councils:</b></span><span style=\"font-family:'Nirmala UI'\"> It     provided for the association of Indians with the Executive     Councils of the Viceroy and Governors. </span><span style=\"font-family:'Nirmala UI'\"><b>Satyendra     Prasad Sinha</b></span><span style=\"font-family:'Nirmala UI'\"> became     the first Indian to join the Viceroy’s Executive Council as a     Law Member.</span></p>    </li></ol>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Act</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Key Development</b></span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>A. Indian Council Act, 1861</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Introduced the </span><span style=\"font-family:'Nirmala UI'\"><b>Portfolio       System</b></span><span style=\"font-family:'Nirmala UI'\"> and       initiated the process of decentralization.</span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>B. Govt. of India Act, 1935</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Established a </span><span style=\"font-family:'Nirmala UI'\"><b>Federal       structure</b></span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-family:'Nirmala UI'\"><b>Diarchy       at the Centre</b></span><span style=\"font-family:'Nirmala UI'\">,       and </span><span style=\"font-family:'Nirmala UI'\"><b>Provincial       Autonomy</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>D. Govt. of India Act, 1919</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Known as </span><span style=\"font-family:'Nirmala UI'\"><b>Montagu–Chelmsford       Reforms</b></span><span style=\"font-family:'Nirmala UI'\">;       introduced </span><span style=\"font-family:'Nirmala UI'\"><b>Diarchy       in provinces</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>bicameralism       at the Centre</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following is NOT a    principle of Jainism?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Monastic life is the only way to    salvation.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The whole world, including stone    and water, has life.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Rejection of the doctrine of Karma</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Practice of non-injury to living    beings</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Jainism </span><span style=\"font-family:'Nirmala UI'\"><b>accepts     and strongly emphasizes the doctrine of Karma</b></span><span style=\"font-family:'Nirmala UI'\">.     According to Jain philosophy, karma binds the soul and is the     main cause of the cycle of birth and death. Liberation (moksha)     is achieved by eliminating karmic bondage through right faith,     right knowledge, and right conduct.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Correct:     Jainism gives great importance to ascetic and monastic life for     attaining salvation.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Correct:     Jainism believes that even earth, water, fire, air, and plants     possess life (j</span><span>ī</span><span style=\"font-family:'Nirmala UI'\">va).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Correct: </span><span style=\"font-family:'Nirmala UI'\"><b>Ahimsa     (non-violence)</b></span><span style=\"font-family:'Nirmala UI'\"> is     the most important principle of Jainism.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Incorrect:     Jainism does </span><span style=\"font-family:'Nirmala UI'\"><b>not     reject</b></span><span style=\"font-family:'Nirmala UI'\"> the     doctrine of karma; it strongly supports it.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Therefore,     the correct answer is (3) Rejection of the doctrine of Karma.</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 25, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Match each ruler listed in Column A    with their respective period of reign given in Column B:</span></p>    <table>     <col>      <col>      <thead>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Column A: Ruler</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Column B: Reign Period</b></span></p>       </td>      </tr>     </thead>     <tbody>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">A. Qutbuddin Aybak</span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">1. 1175–1192</span></p>       </td>      </tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">B. Prithviraj Chauhan</span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">2. 1206–1210</span></p>       </td>      </tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">C. Alauddin Khalji</span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">3. 1296–1316</span></p>       </td>      </tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">D. Muhammad bin Tughluq</span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">4. 1324–1351</span></p>       </td>      </tr>     </tbody>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "option1": "<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">A </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    1, B </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    2, C </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    3, D </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    4</span></p>", "option2": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">A </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    4, B </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    1, C </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    3, D </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    2</span></p>", "option3": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">A </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    3, B </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    1, C </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    2, D </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    4</span></p>", "option4": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">A </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    2, B </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    1, C </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    3, D </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    4</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>D)    A </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    2, B </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    1, C </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    3, D </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    4</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Ruler</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Reign Period</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Dynasty / Context</b></span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">A. Qutbuddin Aybak</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">2. 1206–1210</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Founded the </span><span style=\"font-family:'Nirmala UI'\"><b>Slave       (Mamluk) Dynasty</b></span><span style=\"font-family:'Nirmala UI'\">. He       ruled for only four years befor :0\">    <span style=\"font-family:'Nirmala UI'\">÷ , +</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To find the correct mathematical    signs, we check each option one by one</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     2 (×, +):</b></span><span style=\"font-family:'Nirmala UI'\"> 9 × 3     + 2. The value becomes too big.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     3 (−, ×): </b></span><span style=\"font-family:'Nirmala UI'\">9 −     3 × 2. The value become too small.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     4 (÷, +): </b></span><span style=\"font-family:'Nirmala UI'\">9 ÷ 3     + 2. The value is not equal to 15.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     1 (+, ×): </b></span><span style=\"font-family:'Nirmala UI'\">9 + 3 ×     2 = 9 + 6 = 15. This satisfies the equation.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence, +,    × is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The workshop in Jaipur happened 4    days before Delhi. The workshop in Lucknow happened 3 days after    Delhi. If Jaipur's workshop was on </span><span style=\"font-family:'Nirmala UI'\"><b>10th    September</b></span><span style=\"font-family:'Nirmala UI'\">, when was    Lucknow's?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">16th September</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">17th September</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">18th September</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">19th September</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Jaipur workshop = 10th    September.</b></span><span style=\"font-family:'Nirmala UI'\"> It    happened 4 days before Delhi.<br> So, </span><span style=\"font-family:'Nirmala UI'\"><b>Delhi    workshop </b></span><span style=\"font-family:'Nirmala UI'\">date = 10    September + 4 days = </span><span style=\"font-family:'Nirmala UI'\"><b>14th    September.</b></span><span style=\"font-family:'Nirmala UI'\"><br> Now, </span><span style=\"font-family:'Nirmala UI'\"><b>Lucknow    workshop happened</b></span><span style=\"font-family:'Nirmala UI'\"> 3    days after Delhi.<br> So, Lucknow = 14 September + 3 days = </span><span style=\"font-family:'Nirmala UI'\"><b>17th    September</b></span><span style=\"font-family:'Nirmala UI'\"><br> </span><span style=\"font-family:'Nirmala UI'\"><b>Hence,    17th September is correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">What should come in place of the    question mark '?' in the following number series?</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">72,    70, 74, 68, 76, ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">66</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">78</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-fami  "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To find out the value of 5 * 4, we    will first observe the pattern in the given examples.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">4     * 2 = 18 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     (4² + 2) = 16 + 2 = 18</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">5     * 3 = 28 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     (5² + 3) = 25 + 3 = 28</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">6     * 2 = 38 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     (6² + 2) = 36 + 2 = 38</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pattern    is a * b = a² + b</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Now    apply to 5 * 4</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">5²     + 4 = 25 + 4 = </span><span style=\"font-family:'Nirmala UI'\"><b>29</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    29 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A number is increased by 25% and    then decreased by 20%. What is the net change in the number?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">5% increase</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">No change</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">5% decrease</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">10% increase</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781346599512_html_63f421cbeda6b108.png\" width=\"250\" height=\"232\" > </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    no change is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the one that is different.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Keyboard</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mouse</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Printer</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Windows</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Keyboard,     Mouse, and Printe</b></span><span style=\"font-family:'Nirmala UI'\">r are     all </span><span style=\"font-family:'Nirmala UI'\"><b>hardware </b></span><span style=\"font-family:'Nirmala UI'\">devices     (physical parts of a computer).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Window</b></span><span style=\"font-family:'Nirmala UI'\"> is     related to</span><span style=\"font-family:'Nirmala UI'\"><b> software</b></span><span style=\"font-family:'Nirmala UI'\"> (like     the interface or operating system screen), not a physical device.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    is Window the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Find the ODD one out from the    given options.</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><br> (Note:    Operations should be performed on the whole numbers, without    breaking down the numbers into their constituent digits. E.g., 15    – operation on 15 such as adding/subtracting/multiplying etc. to    15 can be performed. Breaking down 15 into 1 and 5 and then    performing mathematical operations on 1 and 5 is not allowed.)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1024</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2116</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1521</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1764</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To find out the odd number, we will    observe the given options first.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">1024     = 32</span><sup><span style=\"font-family:'Nirmala UI'\">2 </span></sup><span style=\"font-family:'Nirmala UI'\">(Even     number)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">2116     = 46</span><sup><span style=\"font-family:'Nirmala UI'\">2 </span></sup><span style=\"font-family:'Nirmala UI'\">(Even     number)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1521     = 39</b></span><sup><span style=\"font-family:'Nirmala UI'\"><b>2 </b></span></sup><span style=\"font-family:'Nirmala UI'\"><b>(Odd     number)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">1764     = 42</span><sup><span style=\"font-family:'Nirmala UI'\">2 </span></sup><span style=\"font-family:'Nirmala UI'\">(Even     number)</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">All    the options, except one is </span><span style=\"font-family:'Nirmala UI'\"><b>square    of even numbers.</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    1521 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In a certain code language, 'deep    water ocean' is coded as 'ra, ta, za', 'water clear sky' is coded    as 'pa, ma, ra' and 'ocean sky looks beautiful' is coded as 'za,    ma, ka, da' How will 'clear deep ocean' be coded in this    language? </span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">la, na, ma</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">la, ta, za</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ta, pa, za</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">la, ma, za</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To find the code for clear deep    ocean, compare all three sentences.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Water </b></span><span style=\"font-family:'Nirmala UI'\">is     common in the 1st and 2nd sentences, so its</span><span style=\"font-family:'Nirmala UI'\"><b> code     is ra.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sky</b></span><span style=\"font-family:'Nirmala UI'\"> is     common in the 2nd and 3rd sentences, so its </span><span style=\"font-family:'Nirmala UI'\"><b>code     is ma.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Now,     the remaining code in the 2nd sentence is</span><span style=\"font-family:'Nirmala UI'\"><b> pa     for clear.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Ocean</b></span><span style=\"font-family:'Nirmala UI'\"> is     common in the 1st and 3rd sentences, so its </span><span style=\"font-family:'Nirmala UI'\"><b>code     is za,</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Remaining     code in the 1st sentence is</span><span style=\"font-family:'Nirmala UI'\"><b> ta     for deep.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Code    for 'clear deep ocean' = pa ta za.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    pa ta za is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Find the missing number:<br> </span><span style=\"font-family:'Nirmala UI'\"><b>48    : 36 :: 59 : 45 :: 75 : ?</b></span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">60</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">56</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">63</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">54</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To find the number that is    related to 75, we have to find the relation between 48 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    36 and 59 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    45.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>48 </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    36</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">4     + 8 = 12</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">48     - 12 = 36</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>59 </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    45</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">5     + 9 = 14</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">59     - 14 = 45</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The    pattern is first number - (sum of digits of first number).</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Apply    this pattern on 75:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">7     + 5 = 12</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">75     - 12 = </span><span style=\"font-family:'Nirmala UI'\"><b>63.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    63 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Read the following statement    carefully and identify the conclusion that follows.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement:</b></span><span style=\"font-family:'Nirmala UI'\"><br> Some    books are magazines. All magazines are newspapers.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusions:</b></span><span style=\"font-family:'Nirmala UI'\"><br> I.    Some books are newspapers.<br> II. All newspapers are magazines.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I follows.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only II follows.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both I and II follow.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither I nor II follows.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Draw the Venn diagram according to    the given statement,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781346599512_html_e281d670e83efec7.png\" width=\"250\" height=\"86\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion     I</b></span><span style=\"font-family:'Nirmala UI'\">: We can see that some     part of books is overlapping with newspapers. </span><span style=\"font-family:'Nirmala UI'\"><b>Therefore,     this conclusion Follows.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion     II:</b></span><span style=\"font-family:'Nirmala UI'\"> We can see     that all magazines are newspaper, not all newspapers are     magazines.</span><span style=\"font-family:'Nirmala UI'\"><b> Therefore,     this conclusion does not follow.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    only conclusion I follows is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If \"COLD\" is    written as \"EQNF\", how will \"WARM\" be    written?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">YCTO</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">YCTN</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">XBSN</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ZDUO</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To find the answer, we need to    determine the numerical \"gap\" between the letters in the    first pair and apply that same logic to the second word.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>COLD    </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    EQNF</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">C     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     E (+2)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">O     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Q (+2)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">L     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     N (+2)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">D     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     F (+2)</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The    pattern is Each letter is moved 2 steps forward in the alphabet.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Now    apply the same rule to WARM:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">W     </span><span>→</span><span style=\"font-family:'Nirmala UI'\"><b> Y </b></span><span style=\"font-family:'Nirmala UI'\">(+2)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A     </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>C</b></span><span style=\"font-family:'Nirmala UI'\"> (+2)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">R     </span><span>→</span><span style=\"font-family:'Nirmala UI'\"><b> T</b></span><span style=\"font-family:'Nirmala UI'\"> (+2)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">M     </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>O</b></span><span style=\"font-family:'Nirmala UI'\"> (+2)</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>WARM    </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    YCTO</b></span><span style=\"font-family:'Nirmala UI'\"><br> </span><span style=\"font-family:'Nirmala UI'\"><b>Hence,    YCTO is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">What comes next in the series?</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">EH,    XJ, SN, PT, ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">MH</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">NQ</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">OB</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QR</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " e=\"font-family:'Nirmala UI'\"><b>no     defined relation</b></span><span style=\"font-family:'Nirmala UI'\"> between     trees and flowers.</span><span style=\"font-family:'Nirmala UI'\"><b> Therefore,     this conclusion does not follow.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    neither I nor II follows is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In each of the questions below, a    statement is followed by two assumptions numbered I and II. (An    assumption is something that is taken for granted or supposed    without proof.)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">You    have to consider the statement and decide which of the given    assumptions is/are implicit in the statement.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement:</b></span><span style=\"font-family:'Nirmala UI'\"><br> The    government has announced heavy penalties for industries that do    not comply with environmental safety standards.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Assumptions:</b></span><span style=\"font-family:'Nirmala UI'\"><br> I.    Some industries are currently not complying with environmental    safety standards.<br> II. Imposing heavy penalties will force    industries to follow environmental safety standards.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I is implicit</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only II is implicit</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both I and II are implicit</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither I nor II is implicit</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Assumption     I:</b></span><span style=\"font-family:'Nirmala UI'\"> If no industry     was violating the standards, there would be no need to announce     heavy penalties. </span><span style=\"font-family:'Nirmala UI'\"><b>So,     this assumption is implicit.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Assumption     II: </b></span><span style=\"font-family:'Nirmala UI'\">The government     is announcing penalties because it believes penalties will help     ensure compliance. If penalties were not expected to influence     industries, the announcement would not make sense. </span><span style=\"font-family:'Nirmala UI'\"><b>So,     this assumption is also implicit.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Therefore,    both I and II are implicit, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In each of the following questions,    a situation is given followed by four possible courses of action.     You have to assume everything in the situation is true and decide    which of the suggested courses of action logically and practically    follows.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Situation:</b></span><span style=\"font-family:'Nirmala UI'\"><br> A    government office has noticed a significant delay in processing    public grievance applications due to manual paperwork.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Courses    of Action:</b></span><span style=\"font-family:'Nirmala UI'\"><br> I. The    office should introduce a digital grievance redressal system.<br> II.    The office should ignore the complaints and continue with the    current system.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If only I follows</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If only II follows</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If both I and II follow</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If neither I nor II follows</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">There is significant delay in    processing public grievance applications because of manual    paperwork. So, the problem is delay caused by manual system.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Course     of action I:</b></span><span style=\"font-family:'Nirmala UI'\"> Introducing     a digital grievance redressal system will reduce paperwork, speed     up processing and improve efficiency. This directly addresses the     cause of delay. </span><span style=\"font-family:'Nirmala UI'\"><b>Therefore,     this course of action logically and practically follows.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Course     of Action II:</b></span><span style=\"font-family:'Nirmala UI'\"> Ignoring     the complaints and continue with the current system will not     solve the current situation. </span><span style=\"font-family:'Nirmala UI'\"><b>Therefore,     this course of action does not follow.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    only I follows is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If you multiply the first four even    natural numbers, what do you get?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">248</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">196</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">384</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">192</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The first four even natural numbers    are:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">2,     4, 6, 8</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Now    multiply them:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">2     × 4 × 6 × 8 = 384</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    384 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">What should come in place of    question (?) mark in the given number series.</span></p>    <p st ala UI'\"> In     the 18th and 19th centuries, hat makers (hatters) were exposed to     mercury used in making hats, which sometimes caused mental     instability. This gave rise to the expression.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Completely     insane (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>पूरी     तरह पागल</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> —     Mentally unstable or crazy.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, Option    B is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Select the incorrectly spelt    word.</b></span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>Incongruous</span></span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>Utilitarianism</span></span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span>Myriad</span></span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Caustisity</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Utilitarianism</b></span><span style=\"font-family:'Nirmala UI'\"> –     A theory that actions are right if they promote the greatest     happiness (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>उपयोगितावाद</span></span></span ,     which creates a </span><span style=\"font-family:'Nirmala UI'\"><b>dangling     modifier error</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Incorrect:<br> Being     a public holiday..., went to the park...</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Correct     sentence:<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Being a     public holiday and the weather being pleasant, I went to the park     with my friends to enjoy the fresh air and relax after a hectic     week at work.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, Option    B is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 83, "question": "Sधnपधncधौ यी ो ूोनोgनोूु ोनध giॅधn ृिधयथ in ुहंृिधक यनकधन. Aननोngध पुध ौधnपधncधौ in पुध cयननधcप यनकधन पय ीयनं ो ंधोningीिह ोnक cयुधनधnप ूोनोgनोूु. 1. Aिपुयहgु पधcुnिययgicोि innयॅोपiयn ुोौ हnकधniोृिद धnुोncधक धीीiciधncद ोnक cयnnधcपiॅiपद ोcनयौौ पुध gियृध, iप ुोौ ौiंिहपोnधयहौिद inपधnौiीiधक cयncधनnौ नधgोनकing कोपो ूनiॅोcद, ुयृ कiौूिोcधंधnप, ोnक पुध धनयौiयn यी inपधनूधनौयnोि cयंंहnicोपiयn. 2. In पुध ूोौप पथय कधcोकधौ, नोूiक कigiपोि पनोnौीयनंोपiयn ुोौ नधौुोूधक nयप यnिद पुध ौपनहcपहनध यी gियृोि धcयnयंiधौ ृहप ोिसय पुध ीहnकोंधnपोि थोदौ in थुicु inकiॅiकहोिस inपधनोcप, cयnौहंध inीयनंोपiयn, ोnक ूधनcधiॅध नधोिiपद. 3. Cयnौधतहधnिपद, ूियicदंोाधनौ ोnक cयनूयनोपध िधोकधनौ ोनध incनधोौingिद cयंूिधिधक पय ौपनiाध ो किधicोपध ृोिोncध ृधपथधधn ीयौपधनing innयॅोपiयn ोnक iंूिधंधnपing नधgिहोपयनद ौोीधgहोनकौ पुोप ूनयपधcप ौयciधपोि inपधनधौपौ. 4. Tुiौ कहोि iंूोcप—ंोनाधक ृद हnूनधcधकधnपधक ूनयgनधौौ यn यnध ुोnक ोnक cयंूिधस धपुicोि कiिधंंोौ यn पुध यपुधन—ुोौ ौूोनाधक थiकधौूनधोक कधृोपध ोंयng धcयnयंiौपौ, ौयciिययgiौपौ, ोnक पधcुnिययgiौपौ ोिiाध.", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1-2-4-3</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2-1-4-3</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2-1-3-4</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3-2-1-4</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>2 </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"> Introduces    the broader topic: digital transformation and its wide-ranging    impact.<br> It sets the context, so it must come first.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1    </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"> Expands    on the impact by presenting both positive and negative    consequences.<br> It logically follows the introduction.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>4    </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"> “This    dual impact” clearly refers to the positive and negative aspects    mentioned in sentence 1.<br> Hence, 4 must come after 1.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>3    </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"> “Consequently”    shows a result of the debate and dual impact mentioned in    4.<br> Therefore, it serves as the concluding sentence.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(2-1-4-3)</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option B is the right answer.</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Convert the sentence provided below    from its passive voice structure to an active voice structure:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">No    attempts were reported to have been undertaken by the management    to address the issue.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The management was reported    addressing the issue.<br> </span><br>     </p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It was reported that the management    had undertaken no attempts to address the issue.<br> </span><br>     </p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The management had been reported to    address the issue.<br> </span><br>     </p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It was reported that the management    undertook no attempts to address the issue.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">“<span style=\"font-family:'Nirmala UI'\"><b>were     reported to have been undertaken”</b></span><span style=\"font-family:'Nirmala UI'\"><br> This     is a complex </span><span style=\"font-family:'Nirmala UI'\"><b>Past     Perfect Passive with reporting structure</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Structure     breakdown</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>No      attempts</b></span><span style=\"font-family:'Nirmala UI'\"> (object)</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>were      reported</b></span><span style=\"font-family:'Nirmala UI'\"> (passive      reporting verb)</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>to      have been undertaken</b></span><span style=\"font-family:'Nirmala UI'\"> (perfect      passive infinitive)</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>by      the management</b></span></p>     </li></ul>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">When     converting into active voice:  Reporting structure     becomes:<br> </span><span style=\"font-family:'Nirmala UI'\"><b>It was     reported that + subject + had + past participle</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">So:  </span><span style=\"font-family:'Nirmala UI'\"><b>It     was reported that the management had undertaken no attempts to     address the issue.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option B is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate idiom    to fill in the blank:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In    response to the allegations of financial irregularities and    procedural lapses raised during the internal audit meeting, the    board of directors insisted that the n><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>कभार</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)     - </span><span style=\"font-family:'Nirmala UI'\">something that happens     very rarely.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Burn     the midnight oil</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>रात     देर तक काम करना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)     </span><span style=\"font-family:'Nirmala UI'\">means to work late into the     night.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Turn     a deaf ear</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>अनसुना     करना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)     -</span><span style=\"font-family:'Nirmala UI'\"> to ignore something     deliberately.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option A is the correct answer.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Select the most appropriate    ANTONYM of the underlined word:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    children became increasingly </span><span style=\"font-family:'Nirmala UI'\"><u>boisterous</u></span><span style=\"font-family:'Nirmala UI'\"> during    the celebration, making it difficult for the teacher to maintain    discipline.</span></
