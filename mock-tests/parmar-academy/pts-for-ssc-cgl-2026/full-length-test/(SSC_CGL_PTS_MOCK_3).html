</b></span><span style=\"font-family:'Nirmala UI'\"><br> The    company’s profit increased by 15% this year, which is the    highest in the last five years.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Conclusions:</b></span><span style=\"font-family:'Nirmala UI'\"><br> I.    The company performed better this year than in the previous four    years.<br> II. The profit growth in each of the last four years    was less than 15%.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Conclusion I follows.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Conclusion II follows.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both I and II follow.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither I nor II follows.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion     I</b></span><span style=\"font-family:'Nirmala UI'\">: Since the profit     increase is the highest in five years, it     indicates </span><span style=\"font-family:'Nirmala UI'\"><b>better</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>performance     compared to the previous four years </b></span><span style=\"font-family:'Nirmala UI'\">(in     terms of profit growth). </span><span style=\"font-family:'Nirmala UI'\"><b>This     conclusion follows.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion     II:</b></span><span style=\"font-family:'Nirmala UI'\"> If 15% is the     highest growth in five years, then none of the previous four     years could have had 15% or more growth. So, each of the     last</span><span style=\"font-family:'Nirmala UI'\"><b> four years     must have had profit growth less than 15%.</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>This     conclusion also follows.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    both I and II follows is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What will come at the place of    question mark?<br> </span><span style=\"font-family:'Nirmala UI'\"><b>3, 7,    23, 95, 479, ?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2879</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2875</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2881</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2873</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Check the pattern of the given    series,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781844807823_html_24a1cdc2c157045d.png\" width=\"283\" height=\"87\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Apply    this pattern on 479</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">479     × 6 + 5 = </span><span style=\"font-family:'Nirmala UI'\"><b>2879</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    2879 is the correct answer.</b></span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781844807823_html_2b8809db66f48cb3.png\" width=\"492\" height=\"329\" > </p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following question, a pair    of letters is given, followed by its corresponding product of    alphabetical positions (A = 1, B = 2, …, Z = 26). A second pair    of letters is given without its product. Identify the correct    product for the second pair that maintains the same relationship    as the first.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>CY    : 3 × 25 :: HT : ?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">7 × 21</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">8 × 20</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">8 × 19</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">9 × 20</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">First, solve the given example </span><span style=\"font-family:'Nirmala UI'\"><b>CY    : 3 × 25,</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Using    alphabetical positions (A = 1, B = 2, …, Z = 26):</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>C     = 3</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Y     = 25</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">So,    the relationship is expressed as the product of their    positions: </span><span style=\"font-family:'Nirmala UI'\"><b>CY </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    3 × 25</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Apply    the relationship to the second pair:</span><span style=\"font-family:'Nirmala UI'\"><b> HT    : ?</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>H     = 8</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>T     = 20</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Following    the same pattern, the product is: </span><span style=\"font-family:'Nirmala UI'\"><b>8 × 20.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Hence, 8×20 is    the correct answer.</b></span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781844807823_html_9db86a4d5c9b0587.jpg\" width=\"250\" height=\"242\" > </p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Which term is wrong in the series,</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>24,    12, 12, 19, 36, 90</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">90</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">19</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">36</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">12</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To find the wrong number in the    given series, always check the jump between the numbers.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781844807823_html_9adbb82c07b18d62.png\" width=\"250\" height=\"79\" > </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This     is a classic increasing multiplier pattern (0.5, 1, 1.5, 2, 2.5).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pattern:</b></span><span style=\"font-family:'Nirmala UI'\">      × 0.5, × 1, × 1.5, × 2, × 2.5</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    19 is the correct answer.</b></span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781844807823_html_556c788f55849c72.png\" width=\"411\" height=\"274\" > </p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Meena said, “The man in the    photo is my father’s only daughter’s husband.”  Who is    the man to Meena?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Brother</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Husband</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Father</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Brother-in-law</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>\"My     father’s only daughter\"</b></span><span style=\"font-family:'Nirmala UI'\">:     If Meena is speaking and she is her father's only daughter, then     she is referring to </span><span style=\"font-family:'Nirmala UI'\"><b>herself</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>\"Her     husband\"</b></span><span style=\"font-family:'Nirmala UI'\">: This     means she is talking about </span><span style=\"font-family:'Nirmala UI'\"><b>her     own husband</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Therefore,     the man in the photo is Meena's </span><span style=\"font-family:'Nirmala UI'\"><b>husband</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    husband is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Evaluate:</b></span><span style=\"font-family:'Nirmala UI'\"> (5    + 2) × (9 − 3)</span><sup><span style=\"font-family:'Nirmala UI'\">2 </span></sup><span style=\"font-family:'Nirmala UI'\">=    ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">210</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">252</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">294</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">196</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Apply BODMAS rule,</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(5     + 2) = 7</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(9     − 3)</span><sup><span style=\"font-family:'Nirmala UI'\">2</span></sup><span style=\"font-family:'Nirmala UI'\"> =     6</span><sup><span style=\"font-family:'Nirmala UI'\">2</span></sup><span style=\"font-family:'Nirmala UI'\"> =     36</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">7 × 36 = </span><span style=\"font-family:'Nirmala UI'\"><b>252</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    252 is the correct answer.<br> </b></span><br>     </p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If 6 # 2 = 32 and 4 # 3 = 28, then    what is the value of 8 # 5 = ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">65</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">70</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">52</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">80</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">We have given:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>6     # 2: </b></span><span style=\"font-family:'Nirmala UI'\">6 + 2 = 8 ×     4 = 32</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>4     # 3:</b></span><span style=\"font-family:'Nirmala UI'\"> 4 + 3 = 7 ×     4 = 28</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">So,    the pattern is: </span><span style=\"font-family:'Nirmala UI'\"><b>(a +    b) × 4</b></span><span style=\"font-family:'Nirmala UI'\"><br> Apply this    pattern to </span><span style=\"font-family:'Nirmala UI'\"><b>8 # 5:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(8     + 5) × 4 = </span><span style=\"font-family:'Nirmala UI'\"><b>52</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    52 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Study the following information    carefully and answer the question below:<br> A reputed financial    services company is recruiting Management Trainees. The    eligibility criteria are as follows:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     candidate must be between 21 and 30 years as on 1st January 2026.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     candidate must have scored at least 65% marks in Graduation (60%     for reserved categories).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     candidate must have minimum 1 year of work experience in a     relevant field.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     candidate must possess basic computer certification.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">However,    the company may relax only one of the above criteria (except age)    in case of deserving candidates.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Candidate    Details:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Rohit    is 28 years old and belongs to the OBC category. He has scored 62%    in Graduation. He has 2 years of experience in a finance-related    firm but does not have any computer certification.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the following decisions should the company take regarding    Rohit?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">He is eligible.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">He is not eligible.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">He is eligible only if the company    relaxes one criterion.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Data inadequate to decide.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Rohit     is </span><span style=\"font-family:'Nirmala UI'\"><b>28 years     old </b></span><span style=\"font-family:'Nirmala UI'\">(Meets     criteria).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Rohit     belongs to </span><span style=\"font-family:'Nirmala UI'\"><b>OBC </b></span><span style=\"font-family:'Nirmala UI'\">(reserved     category) and </span><span style=\"font-family:'Nirmala UI'\"><b>scored     62%</b></span><span style=\"font-family:'Nirmala UI'\"> (Meets     criteria since minimum required is 60%).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Rohit     has</span><span style=\"font-family:'Nirmala UI'\"><b> 2years     experience</b></span><span style=\"font-family:'Nirmala UI'\"> (Meets     criteria).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Rohit </span><span style=\"font-family:'Nirmala UI'\"><b>does     not have basic computer certification</b></span><span style=\"font-family:'Nirmala UI'\"> (Does     not meet this criterion).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Rohit     fails in </span><span style=\"font-family:'Nirmala UI'\"><b>only one     criterion</b></span><span style=\"font-family:'Nirmala UI'\"> (computer     certification). So, the company can relax that condition.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence, He    is eligible only if the company relaxes one criterion, is the    correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The average age of 6 students is 14    years. If one student whose age is 18 years leaves the group, what    will be the new average age?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">12.5</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">13.1</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">13.2</span></p>", "option4": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">13.5</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Total age of 6 students = 6 × 14 =    84<br> After removing the 18-year-old student:<br> 84−18=66</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Remaining    students = 5<br> New average = 66 ÷ 5<br> New average age    = </span><span style=\"font-family:'Nirmala UI'\"><b>13.2 years</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    13.2 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">P, Q, R, S and T are friends. R is    taller than Q but shorter than S. P is the shortest, and T is    taller than S. Who is the tallest among them?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">P</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Q</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">T</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">S</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">We have given,</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">S     &gt; R &gt; Q and T &gt; S.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">So,     the relation becomes: T &gt; S &gt; R &gt; Q</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">We     have also given that P is the shortest.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Now    arranging from tallest to shortest:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>T    &gt; S &gt; R &gt; Q &gt; P</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    T is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 69, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Choose the correct option to    complete the analogy:<br> Scarcity : Abundance :: Victory : ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Success</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Defeat</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">War</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Achievement</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>The relationship in the analogy    is opposites (antonyms).</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Scarcity </b></span><span style=\"font-family:'Nirmala UI'\">represents     a lack of something, while </span><span style=\"font-family:'Nirmala UI'\"><b>abundance</b></span><span style=\"font-family:'Nirmala UI'\"> represents     a plentiful supply.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Victory</b></span><span style=\"font-family:'Nirmala UI'\"> (the     state of winning) must be paired with its direct     opposite, </span><span style=\"font-family:'Nirmala UI'\"><b>defeat </b></span><span style=\"font-family:'Nirmala UI'\">(the     state of losing).</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    defeat is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 70, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Read the given statements and    conclusions carefully. Assuming that the information given in the    statements is true, even if it appears to be at variance with    commonly known facts, decide which of the given conclusion(s)    logically follow(s) from the statements.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statements:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Some    words are hard. All hard are sad. No sad is quiet.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Conclusions:</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">I.    No sad is word.<br> II. All word is quiet.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I follows.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only II follows.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both I and II follow.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither I nor II follow.</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">First, we draw the Venn diagram    according to the given statements:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781844807823_html_e3ba512c300f8303.png\" width=\"328\" height=\"87\" > </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion     I:</b></span><span style=\"font-family:'Nirmala UI'\"> We can see     there is some part of word that is overlapping with sad. </span><span style=\"font-family:'Nirmala UI'\"><b>So,     this conclusion is false.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion     II: </b></span><span style=\"font-family:'Nirmala UI'\">There is no     defined relation between word and quiet. </span><span style=\"font-family:'Nirmala UI'\"><b>So,     this conclusion is also false</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    neither I nor II follows, is the correct answer.</b></span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781844807823_html_4ae33836c7b61f08.png\" width=\"387\" height=\"259\" > </p>", "question_heading": ""}, {"sr_no": 71, "question": "In ो नयथ cयnौiौपing यी ृयदौ ोnक giिनस, Pन <b>21     boys</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    21 is the correct answer</b></span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781844807823_html_b8519b4de229657f.png\" width=\"371\" height=\"248\" > </p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In a certain coded language, COLD    is coded as 68 and WALL is coded as 96. What will be the code of    TALE?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">72</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">68</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">65</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">76</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "   <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Check the alphabetical positions    first and compare the given code:</span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">C = 3<br> O = 15<br> L = 12<br> D       = 4</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">W = 23<br> A = 1<br> L = 12<br> L       = 12</span></p>      </td>     </tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Sum of positions: 3 + 15 + 12 +       4 = 34; 34 × 2 = 68</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Sum of positions: 23 + 1 + 12        + 12 = 48; 48 × 2 = 96</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>The pattern: Code = 2 ×    (Sum of letter positions).</b></span></p>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Apply the pattern on TALE:</span></p>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">T = 20</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">A = 1</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">L = 12</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">E = 5</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Sum = 20 + 1 + 12 + 5 = 38; 38 ×     2 = </span><span style=\"font-family:'Nirmala UI'\"><b>76</b></span></p>    </li></ul>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Hence, 76 is the correct answer.</b></span></p>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781844807823_html_d124523b6faae04f.png\" width=\"250\" height=\"166\" > </p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Read the given statement and    conclusions carefully. Assuming that the information given in the    statement(s) is true, decide which of the given conclusions    logically follow(s) from the statement(s).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Statement: </b></span><span style=\"font-family:'Nirmala UI'\">G    = F &gt; J </span><span style=\"font-family:'Cambria Math'\">≥</span><span style=\"font-family:'Nirmala UI'\">    E &gt; C </span><span style=\"font-family:'Cambria Math'\">≥</span><span style=\"font-family:'Nirmala UI'\">    B = A<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Conclusion:</b></span><span style=\"font-family:'Nirmala UI'\"><br> I.    C &lt; G<br> II. C &gt; A</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Conclusion I follows.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only conclusion II follows.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both conclusions I and II follow.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither conclusion I nor II follow.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion     I: </b></span><span style=\"font-family:'Nirmala UI'\">From the given     statement, between G to C </span><span style=\"font-family:'Nirmala UI'\"><b>(G     = F &gt; J </b></span><span style=\"font-family:'Cambria Math'\"><b>≥</b></span><span style=\"font-family:'Nirmala UI'\"><b>     E &gt; C </b></span><span style=\"font-family:'Cambria Math'\"><b>≥</b></span><span style=\"font-family:'Nirmala UI'\">),</span><span style=\"font-family:'Nirmala UI'\"><b> &gt;     is the dominant symbol</b></span><span style=\"font-family:'Nirmala UI'\"> in     this chain. This definitively establishes that G &gt; C, which is     exactly the same as C &lt; G.</span><span style=\"font-family:'Nirmala UI'\"><b> This     conclusion definitely follows.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion     II: </b></span><span style=\"font-family:'Nirmala UI'\">Between C to     A, the </span><span style=\"font-family:'Nirmala UI'\"><b>dominant     symbol here is greater-than-or-equal-to (</b></span><span style=\"font-family:'Cambria Math'\"><b>≥</b></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\">,     which means </span><span style=\"font-family:'Nirmala UI'\"><b>C </b></span><span style=\"font-family:'Cambria Math'\"><b>≥</b></span><span style=\"font-family:'Nirmala UI'\"><b>     A</b></span><span style=\"font-family:'Nirmala UI'\"> and C &gt; A     cannot be confirmed. </span><span style=\"font-family:'Nirmala UI'\"><b>This     conclusion does not follow.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    only conclusion I follows, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In each of the following questions,    a specific alphabetical pattern is applied to the first word to    obtain the second word. Apply the same pattern to the third word    and find the correct answer from the given alternatives.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>HJKL    : IILM :: PRST : ?</b></span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QQRU</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QQTU</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QRSU</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QRTU</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Analyze the pattern for </span><span style=\"font-family:'Nirmala UI'\"><b>HJKL    </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    IILM</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">H     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     I (+1)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">J     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     I (−1)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">K     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     L (+1)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">L     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     M (+1)</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>So,    the pattern is: +1, −1, +1, +1</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Apply    same pattern to </span><span style=\"font-family:'Nirmala UI'\"><b>PRST</b></span><span style=\"font-family:'Nirmala UI'\">:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">P     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Q (+1)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">R     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Q (−1)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">S     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     T (+1)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">T     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     U (+1)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">So,     the new word becomes: </span><span style=\"font-family:'Nirmala UI'\"><b>QQTU</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    QQTU is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">How many such pairs of letters are    there in the word </span><span style=\"font-family:'Nirmala UI'\"><b>VICTORIA</b></span><span style=\"font-family:'Nirmala UI'\"> each    of which has as many letters between them in the word as in the    English alphabet (Both forward and backward)?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">None</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">One</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Two</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Three</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">We     have given word:</spa : "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Ride     roughshod over</b></span><span style=\"font-family:'Nirmala UI'\"> –     To treat others badly and dominate them (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>दूसरों     पर अत्याचार करना </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/     </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>हावी     होना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>।</span></span></span></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Origin</b></span><span style=\"font-family:'Nirmala UI'\">- The      idiom comes from the old practice of fitting horses with rough      shoes (</span><span style=\"font-family:'Nirmala UI'\"><b>called rough      shoes</b></span><span style=\"font-family:'Nirmala UI'\">) that had sharp      projections to prevent slipping on hard or icy roads. When a      horse rode roughshod, it would trample harshly and cause damage      without care. Over time, this expression came to mean treating      people harshly, dominating them, or ignoring their rights and      feelings </span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Turn     a blind eye</b></span><span style=\"font-family:'Nirmala UI'\"> – To     ignore something deliberately (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>जानबूझकर     अनदेखा करना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>।</span></span></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Throw     its weight around</b></span><span style=\"font-family:'Nirmala UI'\"> –     To use power to control or dominate others (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>अपनी     ताकत का रौब दिखाना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>।</span></span></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Bend     over backwards</b></span><span style=\"font-family:'Nirmala UI'\"> –     To make extra effort to help (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>बहुत     अधिक प्रयास करना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>।</span></span></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Cry     over spilt milk</b></span><span style=\"font-family:'Nirmala UI'\"> –     To feel sad about something that cannot be changed (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>बीती     बात पर पछताना</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>।</span></span></span></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option B is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style= ositive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Encumbrance</b></span><span style=\"font-family:'Nirmala UI'\"> –     a burden, obstruction, or legal liability that restricts freedom     or action (</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>बोझ     </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/ </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>बाधा     </span></span></span></span><span style=\"font-family:'Nirmala UI'\">/     </span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>दायित्व</span></span></span></span><span style=\"font-family:'Nirmala UI'\">)</span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span>।</span></span></span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Impediment     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>रुकावट</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     something that hinders progress </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Exoneration     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>दोषमुक्ति     </b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>/     </b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>बोझ     से मुक्ति</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     the act of freeing someone from blame or burden  (Closest     opposite in sense of release from burden)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Liability     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>दायित्व     </b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>/     </b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>जिम्मेदारी</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     legal responsibility; a burden </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Constraint     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>बंधन     </b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>/     </b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>प्रतिबंध</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     limitation or restriction </span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence, Option    B is the correct answer.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate    one-word substitution for the following:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">To    divide something into portions and share it among people, often    informally.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Allocate</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Divvy up</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Usurp</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Annex</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The phrase refers to dividing    something into parts and sharing it, usually in an informal way.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Divvy     up(</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>अनौपचारिक     रूप से बाँटना</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     to divide and distribute into shares </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Allocate     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>आवंटित     करना</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     to assign officially or formally </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Annex     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>संलग्न     करना </b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>/     </b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>कब्ज़ा     करन  proposal was very unclear, determining its meaning was almost    impossible.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Virtually     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>लगभग     </b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>/     </b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>लगभग     पूरी तरह से</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     almost; nearly (Correct fit: “virtually impossible”)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Scarcely     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>मुश्किल     से</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     barely; not quite</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Utterly     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>पूरी     तरह से</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     completely (would suggest absolutely impossible, not “almost”)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Faintly     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>हल्के     रूप से</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> –     slightly</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"> “<span style=\"font-family:'Nirmala UI'\">Virtually     impossible” is a common and correct expression meaning nearly     impossible.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option C is the correct answer.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The following sentence has been    split into four segments. Identify the segment that contains a    grammatical error.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">One-third    of the confidential documents / has been misplaced / during the    internal audit / conducted last month.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">One-third of the confidential    documents</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">has been misplaced</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">during the internal audit</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">conducted last month</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781844807823_html_9635ed920889b6d1.jpg\" width=\"362\" height=\"292\" > </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     error is in </span><span style=\"font-family:'Nirmala UI'\"><b>Segment     A</b></span><span style=\"font-family:'Nirmala UI'\"> (because it     affects verb agreement).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Rule:<br> When     a fraction like </span><span style=\"font-family:'Nirmala UI'\"><b>“one-third     of”</b></span><span style=\"font-family:'Nirmala UI'\"> is used, the     verb agrees with the noun that follows it.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Here, </span><span style=\"font-family:'Nirmala UI'\"><b>“documents”</b></span><span style=\"font-family:'Nirmala UI'\"> is    plural, so the verb must also be plural.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\">“<span style=\"font-family:'Nirmala UI'\">One-third     of the confidential documents </span><span style=\"font-family:'Nirmala UI'\"><b>have     been misplaced</b></span><span style=\"font-family:'Nirmala UI'\"> …” </span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option B is the correct answer.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Sentences of a paragraph are given    below in jumbled order. Arrange the sentences in the correct order    to form a meaningful and coherent paragraph.</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Artificial     Intelligence is increasingly being integrated into various     sectors, from healthcare to finance.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Nevertheless,     concerns regarding data privacy and job displacement continue to ans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence     4</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Concludes with a balanced opinion and recommendation.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Logical     flow: Introduction </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Benefits </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Concerns </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Conclusion.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, Option    A is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the option that expresses    the given sentence in active voice.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    proposal had been meticulously reviewed by the panel before it was    submitted to the board.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The panel had meticulously reviewed    the proposal before it was submitted to the board.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The panel had been reviewing the    proposal before submission to the board.<br> </span><br>     </p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The proposal reviewed the panel    before it was submitted to the board.<br> </span><br>     </p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The panel has meticulously reviewed    the proposal before it was submitted to the board.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     given sentence is in </span><span style=\"font-family:'Nirmala UI'\"><b>past     perfect passive</b></span><span style=\"font-family:'Nirmala UI'\"> form:<br> </span><span style=\"font-family:'Nirmala UI'\"><b>had     been + past participle (reviewed)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Structure:<br> Object     + had been + V³ + by + subject</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">“<span style=\"font-family:'Nirmala UI'\">The    proposal had been reviewed by the panel …”</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">To    convert into active voice:</span></p>    <ul>     <ol>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Make </span><span style=\"font-family:'Nirmala UI'\"><b>“the      panel”</b></span><span style=\"font-family:'Nirmala UI'\"> the      subject.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Change      the verb to </span><span style=\"font-family:'Nirmala UI'\"><b>past      perfect active</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><i>had      reviewed</i></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Keep      the time clause unchanged.</span></p>     </li></ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Correct     form:<br> </s in\"><span style=\"font-family:'Nirmala UI'\"><b>Incomplete     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>अधूरा</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Opposite meaning</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Ordinary     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>साधारण</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Not exceptional</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Mediocre     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>सामान्य</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>,     </b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>औसत</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Below excellence</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option B is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the most suitable option to    replace the highlighted words so that the sentence is    grammatically correct and clear:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    professor advised the students </span><span style=\"font-family:'Nirmala UI'\"><b>to    revising their assignments thoroughly before submitting it </b></span><span style=\"font-family:'Nirmala UI'\">to    avoid losing marks for minor errors</span><span style=\"font-family:'Nirmala UI'\"><b>.</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">to revise their assignments    thoroughly before submitting them</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">revising their assignments    thoroughly before submitting it</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">to revising their assignments    thoroughly before submitting them</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">revise their assignments thoroughly    before submitting it</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     verb </span><span style=\"font-family:'Nirmala UI'\"><b>“advise”</b></span><span style=\"font-family:'Nirmala UI'\"> is     followed by </span><span style=\"font-family:'Nirmala UI'\"><b>someone     + to-infinitive</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     “advise someone </span><span style=\"font-family:'Nirmala UI'\"><b>to     do something</b></span><span style=\"font-family:'Nirmala UI'\">.”</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     original sentence uses </span><span style=\"font-family:'Nirmala UI'\"><b>“to     revising”</b></span><span style=\"font-family:'Nirmala UI'\">, which is     incorrect because </span><span style=\"font-family:'Nirmala UI'\"><b>“to”     must be followed by a bare verb</b></span><span style=\"font-family:'Nirmala UI'\">,     not a gerund.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     object </span><span style=\"font-family:'Nirmala UI'\"><b>“assignments”</b></span><span style=\"font-family:'Nirmala UI'\"> is     plural, so the pronoun must also be plural: </span><span style=\"font-family:'Nirmala UI'\"><b>“them”</b></span><span style=\"font-family:'Nirmala UI'\">,     not “it.”</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     A:</b></span><span style=\"font-family:'Nirmala UI'\"> “to revise…     before submitting them” </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     correct </span><span style=\"font-family:'Nirmala UI'\"><b>to-infinitive</b></span><span style=\"font-family:'Nirmala UI'\"> form     + correct plural reference. </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     B:</b></span><span style=\"font-family:'Nirmala UI'\"> “revising…     submitting it” </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     uses gerunds incorrectly after “advise” and wrong pronoun     “it.”</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     C:</b></span><span style=\"font-family:'Nirmala UI'\"> “to revising…     submitting them” </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     “to revising” is ungrammatical; infinitive marker cannot     combine with gerund.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     D:</b></span><span style=\"font-family:'Nirmala UI'\"> “revise…     submitting it” </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     bare infinitive without “to” is incorrect after “advise,”     and “it” wrongly refers to plural assignments.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option A is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Identify the incorrectly spelled    word in the following sentence:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    scientist presented a comprehensive analyzis of the climate change    data at the conference.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">scientist</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">presented</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">analyzis</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">comprehensive</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>scientist</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     a person who studies or practices science.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>presented</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     past tense of “present,” meaning to show or display.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>analyzis</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Incorrect spelling; correct: </span><span style=\"font-family:'Nirmala UI'\"><b>analysis</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     detailed examination of data or information. </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>comprehensive</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     meaning thorough and complete.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Always     remember: singular of “analyses” is </span><span style=\"font-family:'Nirmala UI'\"><b>analysis</b></span><span style=\"font-family:'Nirmala UI'\">,     plural is </span><span style=\"font-family:'Nirmala UI'\"><b>analyses</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option C is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the most appropriate    one-word substitution for the following description:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A    person who travels to unknown places to explore and gather    information.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Explorer</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Adventurer</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Traveler</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Tourist</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explorer</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     someone who investigates unknown regions to discover new     information. </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Adventurer</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     emphasizes risk and excitement, not necessarily systematic     exploration.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Traveler</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     a traveler moves from place to place but may not explore unknown     areas.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Tourist</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     a tourist visits places for leisure, not for exploration or     research.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option A is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Convert the following active voice    sentence into passive voice:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    government has launched several welfare schemes for farmers this    year.</span></p>", "option1": "<p style= function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}
