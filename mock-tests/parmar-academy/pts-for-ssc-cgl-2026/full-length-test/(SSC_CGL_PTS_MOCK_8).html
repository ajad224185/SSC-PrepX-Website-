ym    of the word \"Haggard\"</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Exuberant</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Vile</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Emaciated</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Exquisite</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Haggard</b></span><span style=\"font-family:'Nirmala UI'\"> :</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Synonyms</b></span><span style=\"font-family:'Nirmala UI'\"> -      gaunt, drawn, emaciated, worn, tired.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Antonyms</b></span><span style=\"font-family:'Nirmala UI'\"> -      healthy, robust, energetic, fresh exuberant.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Exuberant: </b></span><span style=\"font-family:'Nirmala UI'\">ebullient,     high-spirited, vivacious, effervescent.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Vile</b></span><span style=\"font-family:'Nirmala UI'\">:     despicable, contemptible, loathsome, wicked, foul.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Emaciated</b></span><span style=\"font-family:'Nirmala UI'\">:     gaunt, haggard, skeletal, wasted, scrawny, bony.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Exquisite</b></span><span style=\"font-family:'Nirmala UI'\">:     elegant, superb, delicate, fine, magnificent, striking.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate meaning    of the following idiom :</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">haul    someone over the coals</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">to severely rebuke or reprimand</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">to act foolish</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">to get immense pleasure</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">to search in a hurry</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>\"Haul     someone over the coals</b></span><span style=\"font-family:'Nirmala UI'\">\"     is an idiom meaning to </span><span style=\"font-family:'Nirmala UI'\"><b>criticize,     scold, or reprimand someone severely for a mistake or wrongdoing.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Often     used in professional or authoritative contexts, it implies a     harsh verbal dressing-down, frequently because of incompetence or     negligence.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Choose the incorrect spelt word    from the following options.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Embarrassment</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Conscience</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Perseverence</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Millennium</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     incorrectly spelt word is </span><span style=\"font-family:'Nirmala UI'\"><b>Perseverence</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Perseverance</b></span><span style=\"font-family:'Nirmala UI'\"> –     Continued effort to achieve something despite difficulties </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Embarrassment</b></span><span style=\"font-family:'Nirmala UI'\"> –     A feeling of shame or awkwardness </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conscience</b></span><span style=\"font-family:'Nirmala UI'\"> –     A person's moral sense of right and wrong </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Millennium</b></span><span style=\"font-family:'Nirmala UI'\"> –     A period of one thousand years </span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option C is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Directions: A sentence is given    here with a blank and you need to fill the blank choosing the    word/words given below.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">As    the days gradually went by, it became _____ clear that the    grotesque monster was not in any mood to let go of the little    child.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">I.    intermittently</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">II.    pleasantly</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">III.    increasingly</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only III</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I and III</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only II <br>  </span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>\"Intermittently</b></span><span style=\"font-family:'Nirmala UI'\">\"     means at irregular intervals; not continuously or steadily.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     does not make any sense in the given sense. Hence, it can be     eliminated.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">From     the given sentence, it can be safely assumed that the child was     kidnapped by the grotesque monster. And, there is nothing     pleasant about it. Hence, the word 'pleasantly' also becomes     invalid in the context.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">\"</span><span style=\"font-family:'Nirmala UI'\"><b>Increasingly</b></span><span style=\"font-family:'Nirmala UI'\">\"     means to an increasing extent; more and more. As time went by, it     became more and more clear.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">As     time went by, it became increasingly clear. We can see that the     usage of 'increasingly' is appropriate here.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the most appropriate option    for the following one word substitution.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Idyllically    calm, peaceful, prosperous, or happy.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Halcyon</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Onomatopoeia</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Conscientious</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Somber</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Halcyon</b></span><span style=\"font-family:'Nirmala UI'\"> -     An adjective meaning </span><span style=\"font-family:'Nirmala UI'\"><b>idyllically     calm, peaceful, prosperous, or happy, often used to describe a     nostalgic, peaceful</b></span><span style=\"font-family:'Nirmala UI'\"> time     in the past.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Onomatopoeia</b></span><span style=\"font-family:'Nirmala UI'\"> -     Onomatopoeia is a figure of speech where words imitate the     natural sounds associated with objects or actions.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conscientious</b></span><span style=\"font-family:'Nirmala UI'\"> -     Conscientious describes someone who is meticulous, careful, and     driven by a sense of duty to do their work well.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Somber</b></span><span style=\"font-family:'Nirmala UI'\"> -     Somber (or sombre) refers to a mood, expression, or atmosphere     that is serious, sad, gloomy, or without humor.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Directions: A sentence is given    here with a blank and you need to fill the blank choosing the    word/words given below.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"or r a lot of efforts from its end,     the problem of large gender gaps in income persist means     continues.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the most appropriate option    for the narration change of the following sentence.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">He    said to me, ”I won’t be able to complete the work today. Can I    come tomorrow and complete it ?”</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">He told me he would not be able to    complete the work the next day. He again asked if he could come    the following day and complete it.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">He told me he would not be able to    complete the work that day. He again asked if he could come the    next day and complete it.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">He told me that he would not be    able to complete the work that day. He again asked if he could    come the next day and complete it.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">He told me that he should not be    able to complete the work that day. He again asked if he could    come the next day and complete it.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Indirect     speech</b></span><span style=\"font-family:'Nirmala UI'\"> - and without thought or care. So, the    relationship is synonym (or close meaning).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">We    need a word that is a synonym for</span><span style=\"font-family:'Nirmala UI'\"><b> \"Tiny\" </b></span><span style=\"font-family:'Nirmala UI'\">(extremely    small).</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Gargantuan</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     very large</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Lilliputian</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     very small</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Colossal</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     very large</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Tremendous</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     very large</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    Lilliputian is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If P + Q = 2R and R + S = 2P, then    which of the following is correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">P + R = 2Q</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">P + S = Q + R</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">P + R = 2S</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">P + R = Q + S</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">We have given;</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(P     + Q = 2R)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(R     + S = 2P)</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>From    (1);</b></span><span style=\"font-family:'Nirmala UI'\"> Q = 2R - P</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>From    (2);</b></span><span style=\"font-family:'Nirmala UI'\"> S = 2P - R</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Add    Q and S</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Q     + S = (2R - P) + (2P - R) = R + P</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Q     + S = P + R</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    P + R = Q + S, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 78, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the option figure in which    the given figure (X) is embedded (rotation is NOT allowed).</span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.ak no": 79, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In this question, three statements    are given, followed by three conclusions numbered I, II and III.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Assuming    the statements to be true, even if they seem to be at variance    with commonly known facts, decide which of the conclusions    logically follow(s) from the statements.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statements:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">All    nights are dark.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Some    dark is circles.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">No    circle is a ring.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusions:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">I.    No dark is a ring.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">II.    Some dark is not ring.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">III.    Some dark are nights.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">All the conclusions follow.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only conclusions I and III follow.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only conclusions II and III follow.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only conclusion III follows.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Draw the Venn diagram,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783255849618_html_443fa1d068dd9c51.png\" width=\"291\" height=\"72\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion    I: </b></span><span style=\"font-family:'Nirmala UI'\">Some part of    dark is not ring, but no part of dark is ring is not given. </span><span style=\"font-family:'Nirmala UI'\"><b>So,    this conclusion does not follow</b></span><span style=\"font-family:'Nirmala UI'\"> (It    is a possibility, but not a definite necessity).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion    II.</b></span><span style=\"font-family:'Nirmala UI'\"> Some part of    dark which is circle cannot be ring. Therefore, </span><span style=\"font-family:'Nirmala UI'\"><b>this    conclusion follows.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion    III.</b></span><span style=\"font-family:'Nirmala UI'\"> All nights are    dark If the entire set of \"Nights\" is inside \"Dark,\"    then logically, that shared area confirms that \"Some dark\"    (the part containing nights) are indeed \"Nights</span><span style=\"font-family:'Nirmala UI'\"><b>.\"    This conclusion follows.</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    only Conclusions II and III logically follow.</b></span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-fami ><span style=\"font-family:'Nirmala UI'\">—    “Compulsory” means all students will study it.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    I, II and III are implicit, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Using the reverse code (Z = 1 to A    = 26), what is the product of the reverse positions of the first    and last letters of “SYSTEMATIC”?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">182</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">192</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">112</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">171</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Using reverse coding (Z = 1 to A =    26), we use this rule:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Reverse    position = 27 − normal position</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Now    solve:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">First    letter S </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    normal position = 19</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Reverse    position = 27 − 19 = 8</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Last    letter C </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    normal position = 3</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Reverse    position = 27 − 3 = 24</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Now    find the product: 8 × 24 = 192</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    192 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 84, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The question contains pairs of    words that are related to each other in a certain way. Three of    the following four word pairs are alike as these have the same    relationship and thus form a group. Which word pair is the one    that DOES NOT belong to that group?</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">(The    words must be considered as meaningful English words and must not    be related to each other based on the number of letters/number of    consonants/vowels in the word.)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Cricket – 11 players in a team</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Basketball – 5 players in a team</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Volleyball – 6 players in a team</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Badminton – 2 players in a team</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Cricket, Basketball, and    Volleyball</b></span><span style=\"font-family:'Nirmala UI'\"> are team    sports with a fixed number of players on each side.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Badminton </b></span><span style=\"font-family:'Nirmala UI'\">(2    players) represents a doubles format, but the sport is also    commonly played individually, so it does not fit consistently with    the group.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    Badminton is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 85, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">How many triangles are there in the    given figure?</span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783255849618_html_344a235bb0396eb1.jpg\" width=\"250\" height=\"250\" > </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">41</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">38</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">44</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">36</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The Central Diamond (Rhombus):</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Smallest    (8) + Medium (4) + large (4) = 16</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    Hexagon:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Large    (6) + Medium (6) + small (12) = 24</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    pentagon: </span><span style=\"font-family:'Nirmala UI'\"><b>4</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Total:    16 + 24 + 4 = </span><span style=\"font-family:'Nirmala UI'\"><b>44</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    44 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 86, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the set in which the numbers    are related in the same way as are the numbers of the following    set:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(42,    11, 64)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(27,    13, 53)</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">(NOTE:    Operations should be performed on the whole numbers, without    breaking down the numbers into its constituent digits, then    performing operations on them is not allowed.)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(35, 12, 57)</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(18, 14, 45)</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(22, 16, 54)</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(40, 10, 55)</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Fist identify the pattern with the    given examples,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(42,    11, 64):</b></span><span style=\"font-family:'Nirmala UI'\"> Check the    difference between 42 and 64</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">64    - 42 = 22 (which is double of 11)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">And</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(27,    13, 53):</b></span><span style=\"font-family:'Nirmala UI'\"> Check the    difference between 27 and 53</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">53    - 27 = 26 (which is double of 13)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The    pattern is first number + (2 × second number) = third number.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Apply    this pattern to options:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(35,    12, 57):</b></span><span style=\"font-family:'Nirmala UI'\"> 35 + (2 ×    12) = 59 (</span><span style=\"font-family:'Cambria Math'\">≠</span><span style=\"font-family:'Nirmala UI'\">    57)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(18,    14, 45):</b></span><span style=\"font-family:'Nirmala UI'\"> 18 + (2 ×    14) = 46 (</span><span style=\"font-family:'Cambria Math'\">≠</span><span style=\"font-family:'Nirmala UI'\">    45)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(22,    16, 54):</b></span><span style=\"font-family:'Nirmala UI'\"> 22 + (2 ×    16) = 54</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>(40,    10, 55):</b></span><span style=\"font-family:'Nirmala UI'\"> 40 + (2 ×    10) = 60 (</span><span style=\"font-family:'Cambria Math'\">≠</span><span style=\"font-family:'Nirmala UI'\">    55)<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Hence, (22, 16,    54), is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the option that is related    to the fifth letter-cluster in the same way as the second    letter-cluster is related to the first letter-cluster and the    fourth letter-cluster is related to the third letter-cluster.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">KBT    : CDU :: QEX : IGY :: MGR : ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">EZS</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">EIJ</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">EIS</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">FIS</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>KBT </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    CDU</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>K    </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    C</b></span><span style=\"font-family:'Nirmala UI'\"> = –8 or 8    letters backward</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>B    </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    D</b></span><span style=\"font-family:'Nirmala UI'\"> = +2 or 2 letters    forward</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>T    </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    U</b></span><span style=\"font-family:'Nirmala UI'\"> = +1 or 1 letter    forward</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The    pattern is (–8, +2, +1)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Confirm    the pattern with QEX </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    IGY</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Apply    this pattern to MGR</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">M    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    13 – 8 = 5 = E</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">G    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    7 + 2 = 9 = I</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">R    </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    18 + 1 = 19 = S</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    EIS, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If 2 * 3 = 64 and 3 * 2 = 81    then 4 * 2 = ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">196</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">256</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">576</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">216</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">If you observe 64 and 81 in the    given examples, both are squares of 8 and 9. So,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>2    * 3</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    (2</span><sup><span style=\"font-family:'Nirmala UI'\">3</span></sup><span style=\"font-family:'Nirmala UI'\">)</span><sup><span style=\"font-family:'Nirmala UI'\">2 </span></sup><span style=\"font-family:'Nirmala UI'\">= 8</span><sup><span style=\"font-family:'Nirmala UI'\">2 </span></sup><span style=\"font-family:'Nirmala UI'\">=    64</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>3    * 2</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    (3</span><sup><span style=\"font-family:'Nirmala UI'\">2</span></sup><span style=\"font-family:'Nirmala UI'\">)</span><sup><span style=\"font-family:'Nirmala UI'\">2</span></sup><span style=\"font-family:'Nirmala UI'\"> =    9</span><sup><span style=\"font-family:'Nirmala UI'\">2</span></sup><span style=\"font-family:'Nirmala UI'\"> =    81</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">So, </span><span style=\"font-family:'Nirmala UI'\"><b>the    pattern is (1st number</b></span><sup><span style=\"font-family:'Nirmala UI'\"><b>2nd number</b></span></sup><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><sup><span style=\"font-family:'Nirmala UI'\"><b> 2</b></span></sup></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Apply    this pattern to 4 * 2:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(4</span><sup><span style=\"font-family:'Nirmala UI'\">2</span></sup><span style=\"font-family:'Nirmala UI'\">)</span><sup><span style=\"font-family:'Nirmala UI'\">2</span></sup><span style=\"font-family:'Nirmala UI'\"> =    256</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    256 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Read the given statements and    conclusions carefully and decide which of the conclusions    logically follow(s) from the statements.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statements:</b></span><span style=\"font-family:'Nirmala UI'\"> J    </span><span style=\"font-family:'Cambria Math'\">≥</span><span style=\"font-family:'Nirmala UI'\">    Q </span><span style=\"font-family:'Cambria Math'\">≤</span><span style=\"font-family:'Nirmala UI'\">    L &gt; U </span><span style=\"font-family:'Cambria Math'\">≥</span><span style=\"font-family:'Nirmala UI'\">    R, P </span><span style=\"font-family:'Cambria Math'\">≥</span><span style=\"font-family:'Nirmala UI'\">    Q &gt; K = S &lt; O</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusions:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">I.    P </span><span style=\"font-family:'Cambria Math'\">≤</span><span style=\"font-family:'Nirmala UI'\">    U</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">II. ly:'Nirmala UI'\">    Q &gt; K which made J &gt; K.</span><span style=\"font-family:'Nirmala UI'\"><b> So,    this is definite.</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    only II follows, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Z is V's father's only son's    daughter and R is V's mother's only son's son. How are Z and R    related?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Father - son</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mother - daughter</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Siblings</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Cousin</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">V’s father’s only son = V    himself. So, Z = V’s daughter.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">V’s    mother’s only son = V himself. So, R = V’s son.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Z    and R, </span><span style=\"font-family:'Nirmala UI'\"><b>both are    children of V.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Family    tree:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783255849618_html_5418eab16d6c9e6a.png\" width=\"250\" height=\"301\" > </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    siblings, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Find the missing number:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">17    : 4930 :: 19 : ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6860</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6861</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6859</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6878</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Find the pattern in the given    example:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>17    </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    4930:</b></span><span style=\"font-family:'Nirmala UI'\"> here 4930 is    near to 4913 which is the cube of 17.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    difference between 4913 and 4930 is </span><span style=\"font-family:'Nirmala UI'\"><b>4930    – 4913 = 17</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">So, </span><span style=\"font-family:'Nirmala UI'\"><b>the    pattern is 1st number</b></span><sup><span style=\"font-family:'Nirmala UI'\"><b>3</b></span></sup><span style=\"font-family:'Nirmala UI'\"><b> +    first number = second number.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Apply    this pattern for 19,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>19</b></span><sup><span style=\"font-family:'Nirmala UI'\"><b>3</b></span></sup><span style=\"font-family:'Nirmala UI'\"><b> =    6859 + 19 = 6878</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    6878 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following numbers has    a digital root equal to 6?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">843729</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">555555</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">987654</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">246812</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Digital root = sum of digits until    a single digit remains<br> </span><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>843729:</b></span><span style=\"font-family:'Nirmala UI'\"> 8+4+3+7+2+9    = 33 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    3+3 = 6</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>555555:</b></span><span style=\"font-family:'Nirmala UI'\"> 5+5+5+5+5+5    = 30 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    3+0 = 3</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>987654:</b></span><span style=\"font-family:'Nirmala UI'\"> 9+8+7+6+5+4    = 39 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    3+9 = 12 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    1+2 = 3</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>246812</b></span><span style=\"font-family:'Nirmala UI'\">:    2+4+6+8+1+2 = 23 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    2+3 = 5</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    843729, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If “CHINA” is written as    “DLJFF”, how will “JAPAN” be written?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">PPYQL</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QLPXY</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QYQYM</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">PXYPL</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Identify the pattern by comparing    the code with letters of the given word.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783255849618_html_5985fa481bd11eed.png\" width=\"250\" height=\"181\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The    pattern is +3, -2, +1, -2, +3 and then whole code is reversed.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Apply    this pattern in JAPAN:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">J    + 3 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    M</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A    - 2 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    Y</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">P    + 1 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    Q</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A    - 2 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    Y</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">N    + 3 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    Q</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    code will be </span><span style=\"font-family:'Nirmala UI'\"><b>QYQYM.</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    QYQYM, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">If @ = +, # = −, $ = ×, &amp; =    ÷, then what is the value of:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">(16</span><sup><span style=\"font-family:'Nirmala UI'\">2</span></sup><span style=\"font-family:'Nirmala UI'\"> $    6) &amp; 3 @ (14 $ 18) # 22 = ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">712</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">742</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">776</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">724</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Replace symbols with actual    operations:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(16</b></span><sup><span style=\"font-family:'Nirmala UI'\"><b>2 </b></span></sup><span style=\"font-family:'Nirmala UI'\"><b>×    6) ÷ 3+(14×18) − 22</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(256    × 6) ÷ 3+(14×18) − 22</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Solve    this equation with BODMAS:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(256    × 6) ÷ 3 = 512</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(14    ×18) = 252</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">512    + 252 – 22 = 742</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    742 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">If + = −, − = +, × = ÷, ÷ =    ×,</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Find:    720 + 60 × 4 − 12 ÷ 3 = ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">721</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">741</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">740</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">747</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">New equation after replacing the    signs<br> 720 - 60 ÷ 4 + 12 × 3<br> Apply BODMAS rule<br> 60    ÷ 4 = 15<br> 12 × 3 = 36<br> 720 - 15 + 36 = 741</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    741, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ten persons are sitting in two    parallel rows, with five persons in each row, facing each other.    In Row 1, J, K, L, M and N are sitting and all of them are facing    south. In Row 2, V, W, X, Y and Z are sitting and all of them are    facing north. K is diagonally opposite to Z and is second to the    left of J. J is sitting opposite to Y. L is not an immediate    neighbour of J. W is third to the right of X and is not an    immediate neighbour of Y. M is second to the left of N. Who is    diagonally opposite to L?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Y</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Z</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">W</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">X</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">K is diagonally opposite to Z and    is second to the left of J which means </span><span style=\"font-family:'Nirmala UI'\"><b>K    is sitting at the right end of the row 1.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Y    and J both are sitting in middle of both rows.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">L    is not neighbour of J which means </span><span style=\"font-family:'Nirmala UI'\"><b>L    is sitting left end of the row 1.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>W    is right end of the row 2</b></span><span style=\"font-family:'Nirmala UI'\"> and    is third to right of X.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">W    is not neighbour of Y which means W is at right end of the row 2.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Final    layout:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783255849618_html_3fd370fe8f72869b.jpg\" width=\"250\" height=\"166\" > </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    W is the right answer.</b></span></p>", "question_heading": ""}, {"sr_no": 97, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Which among the following is wrong    in the given number series?</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">342,    340, 332, 320, 304, 284</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">304</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">342</span></p>", "option3": " <
