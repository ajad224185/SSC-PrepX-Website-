     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Cyclostomata     is a group of jawless vertebrates (agnatha).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Includes     living forms: lampreys and hagfishes.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Considered primitive     and degenerate vertebrates (early offshoots of vertebrate     lineage).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Named </span><span style=\"font-family:'Nirmala UI'\"><i>Cyclostomata</i></span><span style=\"font-family:'Nirmala UI'\"> due     to their circular (round) suctorial mouth.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Jaws     are absent.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    about PM GatiShakti National Master Plan and answer which of    them is/are correct?</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">1-    PM GatiShakti was launched on 13 October 2021 as a digital    platform for integrated planning and coordinated implementation of    infrastructure projects across 16 Ministries simultaneously.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">2-    PM GatiShakti is built on a Geographic Information System (GIS)    platform and integrates data from all Central Ministries and    Departments to identify and eliminate siloed planning.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both 1 &amp; 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither 1 &amp; 2</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>Both    1 &amp; 2</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><br> </span><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Explanation</b></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     1:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><i>PM     GatiShakti was launched on 13 October 2021 as a digital platform     for integrated planning and coordinated implementation of     infrastructure projects across 16 Ministries simultaneously, is     True.</i></span><span style=\"font-family:'Nirmala UI'\"> </span>     </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Launched      by </span><span style=\"font-family:'Nirmala UI'\"><b>Prime Minister      Narendra Modi</b></span><span style=\"font-family:'Nirmala UI'\"> on </span><span style=\"font-family:'Nirmala UI'\"><b>13      October 2021</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Aim:      To bring </span><span style=\"font-family:'Nirmala UI'\"><b>various      Ministries/Departments</b></span><span style=\"font-family:'Nirmala UI'\">      (like Railways, Roads, Ports, Aviation, Power, Telecom, etc.)      together for </span><span style=\"font-family:'Nirmala UI'\"><b>integrated      infrastructure planning</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Helps      avoid duplication, reduce costs, and speed up project execution.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     2:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><i>PM     GatiShakti is built on a Geographic Information System (GIS)     platform and integrates data from all Central Ministries and     Departments to identify and eliminate siloed planning, is </i></span><span style=\"font-family:'Nirmala UI'\">True.</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It      is a </span><span style=\"font-family:'Nirmala UI'\"><b>GIS-based digital      platform</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Integrates      </span><span style=\"font-family:'Nirmala UI'\"><b>data layers from      multiple Ministries/Departments</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Enables      </span><span style=\"font-family:'Nirmala UI'\"><b>real-time coordination</b></span><span style=\"font-family:'Nirmala UI'\">,      better decision-making, and elimination of siloed planning.</span></p>     </li></ul>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Additional    Information:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>PM     GatiShakti National Master Plan (NMP):</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Vision:      </span><span style=\"font-family:'Nirmala UI'\"><i>“Holistic      Infrastructure Development”</i></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Supports      </span><span style=\"font-family:'Nirmala UI'\"><b>multi-modal      connectivity</b></span><span style=\"font-family:'Nirmala UI'\"> (roads,      railways, ports, airports, waterways).</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Linked      with </span><span style=\"font-family:'Nirmala UI'\"><b>National      Infrastructure Pipeline (NIP)</b></span><span style=\"font-family:'Nirmala UI'\">      and </span><span style=\"font-family:'Nirmala UI'\"><b>Atmanirbhar Bharat</b></span><span style=\"font-family:'Nirmala UI'\">      goals.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Helps      achieve </span><span style=\"font-family:'Nirmala UI'\"><b>logistics      efficiency</b></span><span style=\"font-family:'Nirmala UI'\"> and reduce      costs (~13–14% of GDP).</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key     Features:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">GIS-based      mapping of existing and planned infrastructure.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Unified      platform for ministries, states, and private sector.</span></p>      </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Focus      on </span><span style=\"font-family:'Nirmala UI'\"><b>time-bound      completion</b></span><span style=\"font-family:'Nirmala UI'\"> of      projects.</span></p>     </li></ul>    </li></ul>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which statement correctly describes    the biomechanical coordination involved in the throwing phase of a    discus throw?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The left foot stays grounded while    the right foot rotates with body movement.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both knees are straight during the    turn, but the right knee bends during forward drive for balance.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The shoulders and trunk keep    rotating for a few moments after the release to sustain momentum.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The body’s weight shifts mainly    to the left leg while the right leg helps stabilize the lean of    the torso.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct answer</b></span><span style=\"font-family:'Nirmala UI'\"> :    c)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Important    Terminologies in Discus Throw</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Throwing     Circle</b></span><span style=\"font-family:'Nirmala UI'\">: A circular area     measuring </span><span style=\"font-family:'Nirmala UI'\"><b>2.5     meters in diameter</b></span><span style=\"font-family:'Nirmala UI'\"> from     which the athlete must execute the throw.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Landing     Sector</b></span><span style=\"font-family:'Nirmala UI'\">: A designated     wedge-shaped field demarcated by lines at an angle of </span><span style=\"font-family:'Nirmala UI'\"><b>34.92     degrees</b></span><span style=\"font-family:'Nirmala UI'\">, inside which     the discus must land to count as valid.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Power     Position</b></span><span style=\"font-family:'Nirmala UI'\">: The brief     structural stance where the thrower's feet land firmly in the     center and front of the circle, setting up the final kinetic     whip.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Left     Leg Block</b></span><span style=\"font-family:'Nirmala UI'\">: The sudden     bracing or straightening of the left leg just before release to     stop linear momentum and convert it into rotational acceleration.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Rim     Grip</b></span><span style=\"font-family:'Nirmala UI'\">: The specific way     of holding the implement where only the first knuckles of the     fingers hook over the outer edge of the discus.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Foul</b></span><span style=\"font-family:'Nirmala UI'\">:     An invalid attempt occurring if an athlete steps out of the     circle or touches the top edge of the metal rim before the discus     lands.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which law states that if a body is    at rest or moving at a constant speed in a straight line, it will    remain at rest or keep moving in a straight line at constant speed    unless it is acted upon by a force?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Dalton's law</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Newton's first law</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Newton's second law</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Newton's third law</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct answer :</b></span><span style=\"font-family:'Nirmala UI'\"> b)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Newton’s     2nd Law </b></span><span style=\"font-family:'Nirmala UI'\">- The     acceleration of an object depends on the mass of the object and     the amount of force applied</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Newton’s     3rd Law </b></span><span style=\"font-family:'Nirmala UI'\">- Whenever     one object exerts a force on a second object, the second object     exerts an equal and opposite force on the first.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following correctly    explains the economic concept of opportunity cost?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The total expense incurred in    production</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The value of the next best    alternative that is given up</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The cost of employing labor</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The overall money spent on a    project or activity</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>b)    </b></span>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><br> </span><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Opportunity    cost</b></span><span style=\"font-family:'Nirmala UI'\"> is the value    of the </span><span style=\"font-family:'Nirmala UI'\"><b>next best    alternative forgone</b></span><span style=\"font-family:'Nirmala UI'\"> when    a choice is made. It reflects the benefits that could have been    gained from the alternative use of resources. It may    involve </span><span style=\"font-family:'Nirmala UI'\"><b>money, time,    or effort</b></span><span style=\"font-family:'Nirmala UI'\"> and is a    key concept in economic decision-making.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Who has become the first Indian    Grandmaster to participate in the Esports World Cup?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Prathmesh Tiwari</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mukund Sharma</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Arvind Chidambaram</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Abhinav Mehta</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct answer: c</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><br> </span><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><br> </span><span style=\"font-family:'Nirmala UI'\"><b>Viswanathan    Anand</b></span><span style=\"font-family:'Nirmala UI'\"> was the first    Indian to win at the highest levels of international chess,    becoming India's first Grandmaster in 1988 and the country's first    World Champion in 2000.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which team won the Ranji Trophy for    the 2024-25 season, as concluded in 2025?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Saurashtra</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Services</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kerala</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Vidarbha</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The winner of the Ranji Trophy    2024–25 season (concluded in February 2025) was </span><span style=\"font-family:'Nirmala UI'\"><i>Vidarbha</i></span><span style=\"font-family:'Nirmala UI'\">,    who defeated Kerala in the final to claim their third Ranji Trophy    title.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><br> </span><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Details:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Champion:</b></span><span style=\"font-family:'Nirmala UI'\">     Vidarbha (3rd title)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Runner-up:</b></span><span style=\"font-family:'Nirmala UI'\">     Kerala (first-ever Ranji final appearance)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Season     Dates:</b></span><span style=\"font-family:'Nirmala UI'\"> 11 October 2024     – 26 February 2025</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Venue     of Final:</b></span><span style=\"font-family:'Nirmala UI'\"> Vidarbha     Cricket Association Stadium, Nagpur</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Result:</b></span><span style=\"font-family:'Nirmala UI'\">     Vidarbha won on the basis of a </span><span style=\"font-family:'Nirmala UI'\"><b>first-innings     lead</b></span><span style=\"font-family:'Nirmala UI'\"> (Vidarbha 379 vs     Kerala 342).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Player     of the Series:</b></span><span style=\"font-family:'Nirmala UI'\"> Harsh     Dubey (Vidarbha) </span>     </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Most     Runs:</b></span><span style=\"font-family:'Nirmala UI'\"> Yash Rathod     (Vidarbha) – 960 runs.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Most     Wickets:</b></span><span style=\"font-family:'Nirmala UI'\"> Harsh Dubey     (Vidarbha) – 69 wickets.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The Government of India Act, 1858    led to the abolition of which of the following administrative    bodies?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Council of India and Secretary of    State’s Office</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Parliament and Privy Council</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Governor General’s Council and    Executive Committee</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Board of Control and Court of    Directors</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\">    </span><span style=\"font-family:'Nirmala UI'\"><b>d) </b></span>    </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><br> </span><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Government    of India Act, 1858:</b></u></i></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This     Act was passed after the suppression of the Indian Rebellion of     1857, also known as the First War of Indian Independence.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     abolished the East India Company's rule and transferred     administrative powers to the British Crown.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Act established the office of the Secretary of State for     India, who was a member of the British Cabinet and responsible     for the governance of India.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">An India     Council consisting of 15 members was set up to assist the     Secretary of State.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Governor-General of India was renamed the Viceroy of India,     representing the British Crown</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Assertion (A): </b></span><span style=\"font-family:'Nirmala UI'\">When    we rub a glass rod with a silk cloth, the glass rod acquires a    negative charge and the silk cloth acquires a positive    charge.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Reason    (R):</b></span><span style=\"font-family:'Nirmala UI'\"> During    rubbing, electrons are transferred from the glass rod to the silk    cloth.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both A and R are true and R is the    correct explanation of A.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both A and R are true and R is NOT    the correct explanation of A.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A is True, R is False.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A is False, R is True.</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>A    is False, R is True</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Explanation:</b></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Assertion     (A):</b></span><span style=\"font-family:'Nirmala UI'\"> When we rub a     glass rod with a silk cloth, the glass rod acquires a negative     charge and the silk cloth acquires a positive charge, is </span><span style=\"font-family:'Nirmala UI'\"><b>FALSE.</b></span><span style=\"font-family:'Nirmala UI'\">     </span>     </p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In      reality, the </span><span style=\"font-family:'Nirmala UI'\"><b>glass rod      becomes positively charged</b></span><span style=\"font-family:'Nirmala UI'\">      and the </span><span style=\"font-family:'Nirmala UI'\"><b>silk cloth      becomes negatively charged</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This      happens because electrons move </span><span style=\"font-family:'Nirmala UI'\"><b>from      the glass rod to the silk cloth</b></span><span style=\"font-family:'Nirmala UI'\">,      leaving the rod electron-deficient (positive) and the cloth      electron-rich (negative).</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Reason     (R)</b></span><span style=\"font-family:'Nirmala UI'\">: During rubbing,     electrons are transferred from the glass rod to the silk cloth,     is </span><span style=\"font-family:'Nirmala UI'\"><b>TRUE.</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The      transfer of electrons explains the charges:</span></p>      <ul>       <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Glass       rod loses electrons </span><span>→</span><span style=\"font-family:'Nirmala UI'\">       Positive charge.</span></p>       </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Silk       cloth gains electrons </span><span>→</span><span style=\"font-family:'Nirmala UI'\">       Negative charge.</span></p>      </li></ul>     </li></ul>    </li></ul>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    about earthquakes and their measurement, and answer which of them    is/are correct?</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">1-    The Richter Scale measures the magnitude of an earthquake (the    total energy released), while the Mercalli Scale measures the    intensity of shaking felt at a specific location on the surface.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">2-    Primary waves (P-waves) are the fastest seismic waves but can only    travel through solid layer of the Earth, while Secondary waves    (S-waves) are slower but they can travel through both solid and    liquid interior of the Earth.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both 1 &amp; 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither 1 &amp; 2</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>1    only.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><br> </span><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     1:</b></span><span style=\"font-family:'Nirmala UI'\"> The Richter Scale     measures the magnitude of an earthquake (the total energy     released), while the Mercalli Scale measures the intensity of     shaking felt at a specific location on the surface, is </span><span style=\"font-family:'Nirmala UI'\"><b>TRUE.</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Richter      Scale (1935, Charles Richter):</b></span><span style=\"font-family:'Nirmala UI'\">      Measures </span><span style=\"font-family:'Nirmala UI'\"><b>magnitude</b></span><span style=\"font-family:'Nirmala UI'\">      (energy released at the source). It is logarithmic.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Mercalli      Scale:</b></span><span style=\"font-family:'Nirmala UI'\"> Measures      </span><span style=\"font-family:'Nirmala UI'\"><b>intensity</b></span><span style=\"font-family:'Nirmala UI'\">      (effects felt by people, damage to buildings, etc.) on a scale      from I (not felt) to XII (total destruction).</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     2:</b></span><span style=\"font-family:'Nirmala UI'\"> Primary waves     (P-waves) are the fastest seismic waves but can only travel     through solid layer of the Earth, while Secondary waves (S-waves)     are slower but they can travel through both solid and liquid     interior of the Earth, is </span><span style=\"font-family:'Nirmala UI'\"><b>FALSE.</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>P-waves      (Primary waves):</b></span><span style=\"font-family:'Nirmala UI'\">      Fastest seismic waves, can travel through </span><span style=\"font-family:'Nirmala UI'\"><b>both      solids and liquids</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>S-waves      (Secondary waves):</b></span><span style=\"font-family:'Nirmala UI'\">      Slower, can travel </span><span style=\"font-family:'Nirmala UI'\"><b>only      through solids</b></span><span style=\"font-family:'Nirmala UI'\">, not      liquids.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This      difference is crucial in understanding Earth’s interior (e.g.,      absence of S-waves in outer core proves it is liquid).</span></p>     </li></ul>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Additional    Information:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Seismic     Waves:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>P-waves:</b></span><span style=\"font-family:'Nirmala UI'\">      Compressional, fastest, travel through solids &amp; liquids.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>S-waves:</b></span><span style=\"font-family:'Nirmala UI'\">      Shear, slower, travel only through solids.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Surface      Waves (L-waves):</b></span><span style=\"font-family:'Nirmala UI'\">      Slowest, cause maximum destruction on Earth’s surface.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Earthquake     Measurement:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Magnitude      (Richter, Moment Magnitude Scale):</b></span><span style=\"font-family:'Nirmala UI'\">      Objective, energy-based.</span></p>      </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Intensity      (Mercalli):</b></span><span style=\"font-family:'Nirmala UI'\">      Subjective, based on human experience &amp; damage.</span></p>     </li></ul>    </li></ul>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which Indian State is famous for    its 'Gota Patti' embroidery work?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Jharkhand</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Rajasthan</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Telangana</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Himachal Pradesh</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>Rajasthan</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><br> </span><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Explanation:</b></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Gota     Patti Embroidery:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A      traditional </span><span style=\"font-family:'Nirmala UI'\"><b>appliqué      embroidery</b></span><span style=\"font-family:'Nirmala UI'\"> originating      from </span><span style=\"font-family:'Nirmala UI'\"><b>Rajasthan</b></span><span style=\"font-family:'Nirmala UI'\">,      especially Jaipur.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Involves      sewing small pieces of </span><span style=\"font-family:'Nirmala UI'\"><b>gold      or silver ribbon (gota)</b></span><span style=\"font-family:'Nirmala UI'\">      onto fabric to create elaborate patterns.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Commonly      used in </span><span style=\"font-family:'Nirmala UI'\"><b>wedding attire,      lehengas, odhnis, and sarees</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Famous      for its </span><span style=\"font-family:'Nirmala UI'\"><b>shimmering      effect</b></span><span style=\"font-family:'Nirmala UI'\"> and intricate      designs, making it a hallmark of Rajasthani craft.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Other     states mentioned in options are known for different crafts:</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Jharkhand:</b></span><span style=\"font-family:'Nirmala UI'\">      Sohrai and Khovar paintings.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Telangana:</b></span><span style=\"font-family:'Nirmala UI'\">      Pochampally Ikat weaving.</span></p>      </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Himachal      Pradesh:</b></span><span style=\"font-family:'Nirmala UI'\"> Chamba Rumal      embroidery.</span></p>     </li></ul>    </li></ul>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In the 2026 ICC Men's T20 World    Cup, who was the Vice-Captain of the Indian team that won the    title?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Suryakumar Yadav</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Hardik Pandya</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Shubman Gill</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Axar Patel</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>Axar    Patel</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><br> </span><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>India     won the ICC Men’s T20 World Cup 2026.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Final      Match:</b></span><span style=\"font-family:'Nirmala UI'\"> India vs New      Zealand, Narendra Modi Stadium, Ahmedabad (8 March 2026)</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Result:</b></span><span style=\"font-family:'Nirmala UI'\">      India won by </span><span style=\"font-family:'Nirmala UI'\"><b>96 runs</b></span><span style=\"font-family:'Nirmala UI'\">      (India 255/5 vs New Zealand 159).</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Man      of the Match (Final):</b></span><span style=\"font-family:'Nirmala UI'\">      </span><span style=\"font-family:'Nirmala UI'\"><b>Jasprit Bumrah</b></span><span style=\"font-family:'Nirmala UI'\">      (India) – 4 wickets for 15 runs.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Player      of the Series:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Sanju      Samson</b></span><span style=\"font-family:'Nirmala UI'\"> (India) – 321      runs in the tournament.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Captain:</b></span><span style=\"font-family:'Nirmala UI'\">      Suryakumar Yadav</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Vice-Captain:</b></span><span style=\"font-family:'Nirmala UI'\">      Axar Patel</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">India’s     earlier wins: </span><span style=\"font-family:'Nirmala UI'\"><b>2007 (MS     Dhoni)</b></span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-family:'Nirmala UI'\"><b>2024     (Rohit Sharma)</b></span><span style=\"font-family:'Nirmala UI'\">.<br> India     defeated </span><span style=\"font-family:'Nirmala UI'\"><b>New Zealand by     96 runs</b></span><span style=\"font-family:'Nirmala UI'\"> in the final at     </span><span style=\"font-family:'Nirmala UI'\"><b>Narendra Modi Stadium,     Ahmedabad</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Under the FRBM Act, which specific    document must the Government of India lay before Parliament    alongside the annual Union Budget?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Economic Survey</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Macro Framework</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Revenue Report</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Financial Record</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer:</span><span style=\"font-family:'Nirmala UI'\"><b>    Macro Framework</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><br> </span><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Explanation:</b></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Under     the </span><span style=\"font-family:'Nirmala UI'\"><b>Fiscal     Responsibility and Budget Management (FRBM) Act, 2003</b></span><span style=\"font-family:'Nirmala UI'\">,     the Government of India is required to present certain documents     to Parliament </span><span style=\"font-family:'Nirmala UI'\"><b>alongside     the annual Union Budget</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     key mandated document is the </span><span style=\"font-family:'Nirmala UI'\"><b>Medium-Term     Fiscal Policy cum Fiscal Policy Strategy Statement</b></span><span style=\"font-family:'Nirmala UI'\">,     which includes the </span><span style=\"font-family:'Nirmala UI'\"><b>Macro-Economic     Framework Statement</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This     </span><span style=\"font-family:'Nirmala UI'\"><b>Macro Framework</b></span><span style=\"font-family:'Nirmala UI'\">     provides an assessment of the overall macroeconomic situation of     the country, including growth, inflation, fiscal balance, and     external sector outlook.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     ensures </span><span style=\"font-family:'Nirmala UI'\"><b>transparency and     accountability</b></span><span style=\"font-family:'Nirmala UI'\"> in     fiscal management and helps Parliament evaluate whether the     government is adhering to FRBM targets.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>FRBM    Act Documents:</b></span></p>    <ul>     <ol>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Medium-Term      Fiscal Policy Statement</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Fiscal      Policy Strategy Statement</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Macro-Economic      Framework Statement</b></span></p>     </li></ol>    </ul>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which specific term was used in the    Mughal Empire to describe land that was left uncultivated for a    period of three or four years?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Polaj</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Parauti</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Chachar</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Banjar</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>Chachar</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><br> </span><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In     the </span><span style=\"font-family:'Nirmala UI'\"><b>Mughal land revenue     system</b></span><span style=\"font-family:'Nirmala UI'\">, land was     classified into four categories based on cultivation status:</span></p>     <ol>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Polaj</b></span><span>→</span><span style=\"font-family:'Nirmala UI'\">      Regularly cultivated every year without rest.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Parauti</b></span><span>→</span><span style=\"font-family:'Nirmala UI'\">      Cultivated for some years, then left fallow for 1–2 years to      regain fertility.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Chachar</b></span><span>→</span><span style=\"font-family:'Nirmala UI'\">      Left uncultivated for </span><span style=\"font-family:'Nirmala UI'\"><b>3–4      years</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Banjar</b></span><span>→</span><span style=\"font-family:'Nirmala UI'\">      Left uncultivated for a very long time (more than 5 years, often      barren).</span></p>     </li></ol>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Revenue     Context:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This      classification was crucial for </span><span style=\"font-family:'Nirmala UI'\"><b>land      revenue assessment</b></span><span style=\"font-family:'Nirmala UI'\">      under the Mughal system.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Todar      Mal’s revenue reforms</b></span><span style=\"font-family:'Nirmala UI'\">      (under Akbar) emphasized measuring land and categorizing it for      fair taxation.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Significance:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Helped      determine productivity and tax liability.</span></p>      </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Prevented      over-taxation of temporarily uncultivated land.</span></p>     </li></ul>    </li></ul>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which specific constitutional    doctrine prevents the Executive from taking away a person's rights    through mere internal guidelines or circulars?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Rule of Law</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Severability</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Pith and Substance</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Colorable Legislation</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>Rule    of Law</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     </span><span style=\"font-family:'Nirmala UI'\"><b>Rule of Law</b></span><span style=\"font-family:'Nirmala UI'\">     is a fundamental constitutional doctrine in India.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     ensures that </span><span style=\"font-family:'Nirmala UI'\"><b>no person     can be deprived of rights or freedoms by mere executive     instructions, internal guidelines, or circulars</b></span><span style=\"font-family:'Nirmala UI'\">     unless backed by proper legislation.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Rights     can only be curtailed through </span><span style=\"font-family:'Nirmala UI'\"><b>law     enacted by Parliament or State Legislature</b></span><span style=\"font-family:'Nirmala UI'\">,     not by arbitrary executive action.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>Additional    Information:</b></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Origin:</b></span><span style=\"font-family:'Nirmala UI'\">     Concept popularized by </span><span style=\"font-family:'Nirmala UI'\"><b>A.V.     Dicey</b></span><span style=\"font-family:'Nirmala UI'\"> in British     constitutional law.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Indian     Context:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Enshrined      in </span><span style=\"font-family:'Nirmala UI'\"><b>Article 14 (Equality      before law)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Reinforced      by Supreme Court judgments (e.g., </span><span style=\"font-family:'Nirmala UI'\"><i>State      of Bihar v. Kameshwar Singh</i></span><span style=\"font-family:'Nirmala UI'\">,      </span><span style=\"font-family:'Nirmala UI'\"><i>Indira Gandhi v. Raj      Narain</i></span><span style=\"font-family:'Nirmala UI'\">).</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Other     Doctrines:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Severability:</b></span><span style=\"font-family:'Nirmala UI'\">      If part of a law is unconstitutional, the rest may survive.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pith      and Substance:</b></span><span style=\"font-family:'Nirmala UI'\"> Used to      determine legislative competence.</span></p>      </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Colorable      Legislation:</b></span><span style=\"font-family:'Nirmala UI'\"> Prevents      legislature from doing indirectly what it cannot do directly.</span></p>     </li></ul>    </li></ul>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In the context of Hindu temple    architecture, what is the specific term for the 'vestibule' or    transition area that connects the Mandapa to the Garbhagriha?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Jagati</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Antarala</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Amalaka</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kalasha</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>Antarala</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><br> </span><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In     </span><span style=\"font-family:'Nirmala UI'\"><b>Hindu temple     architecture</b></span><span style=\"font-family:'Nirmala UI'\">, the     </span><span style=\"font-family:'Nirmala UI'\"><b>Antarala</b></span><span style=\"font-family:'Nirmala UI'\">     is the </span><span style=\"font-family:'Nirmala UI'\"><b>vestibule or     transitional space</b></span><span style=\"font-family:'Nirmala UI'\"> that     connects the </span><span style=\"font-family:'Nirmala UI'\"><b>Mandapa     (pillared hall)</b></span><span style=\"font-family:'Nirmala UI'\"> with     the </span><span style=\"font-family:'Nirmala UI'\"><b>Garbhagriha (sanctum     sanctorum)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     acts as a </span><span style=\"font-family:'Nirmala UI'\"><b>passageway</b></span><span style=\"font-family:'Nirmala UI'\">     or </span><span style=\"font-family:'Nirmala UI'\"><b>intermediate chamber</b></span><span style=\"font-family:'Nirmala UI'\">,     symbolizing the transition from the outer, more public space to     the innermost sacred core.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Antarala is often small and narrow, emphasizing the sanctity of     the Garbhagriha.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Additional    Information:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Temple     Architecture Components:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Jagati:</b></span><span style=\"font-family:'Nirmala UI'\">      Raised platform for temple.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Mandapa:</b></span><span style=\"font-family:'Nirmala UI'\">      Pillared hall for devotees.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Antarala:</b></span><span style=\"font-family:'Nirmala UI'\">      Vestibule connecting Mandapa &amp; Garbhagriha.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Garbhagriha:</b></span><span style=\"font-family:'Nirmala UI'\">      Sanctum housing deity.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Shikhara/Vimana:</b></span><span style=\"font-family:'Nirmala UI'\">      Tower above sanctum.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Amalaka      &amp; Kalasha:</b></span><span style=\"font-family:'Nirmala UI'\">      Decorative elements at top of Shikhara.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Symbolism:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The      Antarala represents the </span><span style=\"font-family:'Nirmala UI'\"><b>threshold      between the material and spiritual worlds</b></span><span style=\"font-family:'Nirmala UI'\">,      guiding devotees into the sacred presence of the deity.</span></p>     </li></ul>    </li></ul>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following 'Noble    Gases' is frequently used in radiotherapy for the treatment of    cancer due to its radioactive properties?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Helium</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Argon</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Xenon</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Radon</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>Radon</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><br> </span><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Radon     (Rn)</b></span><span style=\"font-family:'Nirmala UI'\"> is a </span><span style=\"font-family:'Nirmala UI'\"><b>radioactive     noble gas</b></span><span style=\"font-family:'Nirmala UI'\"> that has been     used in </span><span style=\"font-family:'Nirmala UI'\"><b>radiotherapy for     cancer treatment</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Its     radioactive isotopes emit </span><span style=\"font-family:'Nirmala UI'\"><b>alpha     particles</b></span><span style=\"font-family:'Nirmala UI'\">, which can     destroy cancerous cells.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Historically,     radon was applied in sealed sources for </span><span style=\"font-family:'Nirmala UI'\"><b>brachytherapy</b></span><span style=\"font-family:'Nirmala UI'\">     (internal radiotherapy), though modern medicine now prefers safer     isotopes like </span><span style=\"font-family:'Nirmala UI'\"><b>Cobalt-60,     Cesium-137, and Iridium-192</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Other     noble gases like </span><span style=\"font-family:'Nirmala UI'\"><b>Helium,     Argon, Xenon</b></span><span style=\"font-family:'Nirmala UI'\"> are     chemically inert but </span><span style=\"font-family:'Nirmala UI'\"><b>not     radioactive</b></span><span style=\"font-family:'Nirmala UI'\"> in natural     form, hence not used in radiotherapy.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which specific environmental    principle, upheld by Indian courts, states that those who produce    pollution should bear the costs of managing it?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Polluter Pays</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Public Trust</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Precautionary</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sustainable</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>Polluter    Pays Principle</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><br> </span><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     </span><span style=\"font-family:'Nirmala UI'\"><b>Polluter Pays Principle     (PPP)</b></span><span style=\"font-family:'Nirmala UI'\"> is an     environmental law doctrine recognized and upheld by Indian     courts.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     states that </span><span style=\"font-family:'Nirmala UI'\"><b>those who     produce pollution should bear the costs of managing it</b></span><span style=\"font-family:'Nirmala UI'\">,     including prevention, control, and remediation.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This     principle ensures that the burden of environmental damage does     not fall on society or the government, but on the polluter.</span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Other     Environmental Principles:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Public      Trust Doctrine:</b></span><span style=\"font-family:'Nirmala UI'\">      Natural resources are held in trust by the State for public use.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Precautionary      Principle:</b></span><span style=\"font-family:'Nirmala UI'\"> Prevent      environmental harm even if scientific certainty is lacking.</span></p>      </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Sustainable      Development:</b></span><span style=\"font-family:'Nirmala UI'\"> Balance      between development and environmental protection.</span></p>     </li></ul>    </li></ul>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In the Buddhist Sangha, what was    the specific term used for the ceremony of confessing sins    committed during the Vassa period?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Upasampada</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Patimokkha</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kathina</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Pavarana</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Correct Answer: </span><span style=\"font-family:'Nirmala UI'\"><b>Pavarana</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><br> </span><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In     the </span><span style=\"font-family:'Nirmala UI'\"><b>Buddhist Sangha</b></span><span style=\"font-family:'Nirmala UI'\">,     monks observe the </span><span style=\"font-family:'Nirmala UI'\"><b>Vassa     (rainy season retreat)</b></span><span style=\"font-family:'Nirmala UI'\">,     a three-month period of meditation and discipline.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">At     the end of Vassa, a special ceremony called </span><span style=\"font-family:'Nirmala UI'\"><b>Pavarana</b></span><span style=\"font-family:'Nirmala UI'\">     is held.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pavarana     Ceremony:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Monks      confess any offences or lapses committed during the retreat.</span></p>      </li><li><p style=\"orphans: "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate synonym    of the word \"Vociferous\".</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Silent</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Noisy</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Timid</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Secretive</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Vociferous</b></span><span style=\"font-family:'Nirmala UI'\"> –     Loud, noisy, or expressing opinions forcefully and vehemently</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Synonyms:</b></span><span style=\"font-family:'Nirmala UI'\"> noisy,      clamorous, boisterous, loud, strident, uproarious, vehement</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Antonyms:</b></span><span style=\"font-family:'Nirmala UI'\"> silent,      quiet, subdued, muted, restrained, calm</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Noisy</b></span><span style=\"font-family:'Nirmala UI'\"> –     Making a lot of noise; loud</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Silent</b></span><span style=\"font-family:'Nirmala UI'\"> –     Making no sound; quiet </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Timid</b></span><span style=\"font-family:'Nirmala UI'\"> –     Lacking courage or confidence; shy</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Secretive</b></span><span style=\"font-family:'Nirmala UI'\"> –     Inclined to keep things secret; not open</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the most appropriate option    for the following narration change.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    teacher ordered Rahul to stand up and asked him why he had not    prepared his lesson. He also told him that he would write to his    father.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The teacher said to Rahul, “Stand    up, Rahul. Why haven’t you prepared your lesson? I will write to    your father.”</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The teacher asked Rahul, “Stand    up. Why haven’t you prepared your lesson? I shall write to your    father.”</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The teacher ordered, “Stand up    Rahul. Why haven’t you prepared your lesson? I shall write to    your father.”</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The teacher said Rahul, “Stand    up. I shall write to your father. Why haven’t you prepared your    lesson?\"</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">When     converting indirect speech to direct speech, the reported verb     \"ordered\", \"asked\" (or \"enquired\")     is replaced by say/said or said to, and the sentence is placed in     quotation marks. So option B and option C are incorrect.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     direct speech is: The teacher said to Rahul, \"Stand up,     Rahul. Why have you not prepared your lesson? I will write to     your father.\"</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">For     Option D, it should have been \"</span><span style=\"font-family:'Nirmala UI'\"><b>said     to Rahul</b></span><span style=\"font-family:'Nirmala UI'\">\" and not     said Rahul</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Breakdown    of changes for the narration change as in Option A:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Ordered     Rahul to stand up \"Stand up, Rahul\".</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Asked     him why... changes to \"Why have you...?\"</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Told     him... would write changes to \"I will write.\"</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option A is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate option    for voice change of the following sentence.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">I    request that you stop the bus.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">That the bus is stopped by you is    requested by him.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">You are requested by me to stop the    bus.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The bus stopped by you is requested    by me.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">You are ordered by me to stop the    bus.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     sentence </span><span style=\"font-family:'Nirmala UI'\"><b>\"I     request that you stop the bus.\"</b></span><span style=\"font-family:'Nirmala UI'\"> is     in the </span><span style=\"font-family:'Nirmala UI'\"><b>active     voice</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">To     change it into the </span><span style=\"font-family:'Nirmala UI'\"><b>passive     voice</b></span><span style=\"font-family:'Nirmala UI'\">, the     object </span><span style=\"font-family:'Nirmala UI'\"><b>\"you\"</b></span><span style=\"font-family:'Nirmala UI'\"> becomes     the subject, and the verb </span><span style=\"font-family:'Nirmala UI'\"><b>request</b></span><span style=\"font-family:'Nirmala UI'\"> changes     to </span><span style=\"font-family:'Nirmala UI'\"><b>are requested</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Active     Voice: I request that you stop the bus.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Passive     Voice: You are requested by me to stop the bus.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key     Changes:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>I</b></span><span style=\"font-family:'Nirmala UI'\"> (subject)      </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>by      me</b></span><span style=\"font-family:'Nirmala UI'\"> (agent)</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>you</b></span><span style=\"font-family:'Nirmala UI'\"> (object)      </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>You</b></span><span style=\"font-family:'Nirmala UI'\"> (subject)</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>request</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>are      requested</b></span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     infinitive clause </span><span style=\"font-family:'Nirmala UI'\"><b>to     stop the bus</b></span><span style=\"font-family:'Nirmala UI'\"> remains     unchanged.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option B is the correct answer.</span></p>    </li></ul>", "qu
