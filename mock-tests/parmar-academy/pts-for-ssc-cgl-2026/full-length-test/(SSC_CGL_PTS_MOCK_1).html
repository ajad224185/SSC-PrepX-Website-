<tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Kosala</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Awadh, UP</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Prasenajit</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Avanti</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Malwa, MP</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Pradyota</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Magadha</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Patna/Gaya, Bihar</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Bimbisara, Ajatashatru</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following social    movements:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Chipko     Movement</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Bardoli     Satyagraha</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Satyashodhak     Samaj</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    one of the following is the correct chronological order (starting    with the earliest) of the launch of the above social movements?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2, 1, 3</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3, 1, 2</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3, 2, 1</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2, 3</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>(c)    3, 2, 1</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>3.    Satyashodhak Samaj (1873)</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Founder:</b></span><span style=\"font-family:'Nirmala UI'\"> Jyotirao     Phule.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Purpose:</b></span><span style=\"font-family:'Nirmala UI'\"> Founded     in Pune, Maharashtra, this \"Truth-Seekers' Society\"     aimed to liberate the oppressed castes (Shudras and Ati-Shudras)     and women from exploitation and the psychological burden of     Brahminical supremacy. It focused on social equality and     education.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>2.    Bardoli Satyagraha (1928)</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Leader:</b></span><span style=\"font-family:'Nirmala UI'\"> Sardar     Vallabhbhai Patel.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Purpose:</b></span><span style=\"font-family:'Nirmala UI'\"> This     was a major episode of civil disobedience in the Indian     Independence Movement. It was a peasant protest against the     unjust 30% hike in land revenue (taxes) by the British government     in Gujarat. It was after this success that the women of Bardoli     gave Patel the title </span><span style=\"font-family:'Nirmala UI'\"><b>\"Sardar.\"</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1.    Chipko Movement (1973)</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key     Figures:</b></span><span style=\"font-family:'Nirmala UI'\"> Sunderlal     Bahuguna and Gaura Devi.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Purpose:</b></span><span style=\"font-family:'Nirmala UI'\"> This     was a post-independence forest conservation movement in the     Uttarakhand region (then part of Uttar Pradesh). Villagers,     especially women, hugged trees to prevent contractors from     cutting them down, highlighting the link between ecological     balance and rural livelihoods.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ISRO has announced that it will    launch its heaviest rocket by 2035. What is the name of that    rocket?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Chandrayaan-4</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">PSLV-XL</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lunar Module Launch Vehicle (LMLV)</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gaganyaan</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>c)    Lunar Module Launch Vehicle (LMLV)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In    late 2024 and 2025, ISRO outlined its long-term roadmap for space    exploration, culminating in a manned mission to the Moon by    2040. To achieve this, ISRO is developing a new,    high-capacity rocket designed specifically for lunar missions.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Designation:</b></span><span style=\"font-family:'Nirmala UI'\"> While     initially referred to as the </span><span style=\"font-family:'Nirmala UI'\"><b>Next     Generation Launch Vehicle (NGLV)</b></span><span style=\"font-family:'Nirmala UI'\"> or     \"Soorya,\" the specific configuration designated for     heavy lunar transport is often referred to as the </span><span style=\"font-family:'Nirmala UI'\"><b>Lunar     Module Launch Vehicle (LMLV)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Capacity:</b></span><span style=\"font-family:'Nirmala UI'\"> It     is designed to be a heavy-lift vehicle capable of carrying     significantly higher payloads to </span><span style=\"font-family:'Nirmala UI'\"><b>Geostationary     Transfer Orbit (GTO)</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>Trans-Lunar     Injection (TLI)</b></span><span style=\"font-family:'Nirmala UI'\"> compared     to the current \"Bahubali\" rocket, the LVM3.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Technology:</b></span><span style=\"font-family:'Nirmala UI'\"> It     will likely feature </span><span style=\"font-family:'Nirmala UI'\"><b>LOX-Methane</b></span><span style=\"font-family:'Nirmala UI'\"> (Liquid     Oxygen and Methane) engines, which are more efficient, less     polluting, and better suited for reusable rocket technology.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following is NOT a    tributary of Ganga?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Yamuna</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gandak</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kosi</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lohit</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is D. </span><span style=\"font-family:'Nirmala UI'\"><b>Lohit</b></span><span style=\"font-family:'Nirmala UI'\"> is    a major tributary of the </span><span style=\"font-family:'Nirmala UI'\"><b>Brahmaputra    River</b></span><span style=\"font-family:'Nirmala UI'\">, not the Ganga. It    originates in eastern Tibet and flows through Arunachal Pradesh    and Assam. It is known as the \"River of Blood\" due    to the lateritic red soils in its basin.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The    Ganga Tributaries (Options A, B, and C)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    Ganga has a vast network of tributaries divided into those coming    from the North (Himalayas) and those coming from the South    (Peninsular Plateau).</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Yamuna     (A):</b></span><span style=\"font-family:'Nirmala UI'\"> The largest     and most important right-bank tributary. It joins the Ganga     at the </span><span style=\"font-family:'Nirmala UI'\"><b>Triveni     Sangam</b></span><span style=\"font-family:'Nirmala UI'\"> in     Prayagraj.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Gandak     (B):</b></span><span style=\"font-family:'Nirmala UI'\"> A left-bank     tributary that originates in the Nepal Himalayas and joins the     Ganga near Sonpur, Bihar.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Kosi     (C):</b></span><span style=\"font-family:'Nirmala UI'\"> Known as     the </span><span style=\"font-family:'Nirmala UI'\"><b>\"Sorrow of     Bihar\"</b></span><span style=\"font-family:'Nirmala UI'\"> due to     its frequent course changes and flooding, it is a major left-bank     tributary.</span></p>    </li></ul>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Type</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Major Rivers</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Left-Bank (North)</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Ramganga, Gomti,       Ghaghara, </span><span style=\"font-family:'Nirmala UI'\"><b>Gandak</b></span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-family:'Nirmala UI'\"><b>Kosi</b></span><span style=\"font-family:'Nirmala UI'\">,       Mahananda</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Right-Bank (South)</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Yamuna</b></span><span style=\"font-family:'Nirmala UI'\">,       Son, Punpun</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Who among the following launched    the Home Rule League in September 1916 at Madras?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Annie Besant</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lokmanya Tilak</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sucheta Kriplani</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Rash Behari Bose</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>A.    Annie Besant</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In    1916, two separate Home Rule Leagues were launched in India to    demand \"Home Rule\" (self-government) within the British    Empire.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Annie     Besant (September 1916):</b></span><span style=\"font-family:'Nirmala UI'\"> She     launched her Home Rule League in </span><span style=\"font-family:'Nirmala UI'\"><b>Madras</b></span><span style=\"font-family:'Nirmala UI'\"> (now     Chennai). Her league had a wider reach, covering the rest of     India that was not covered by Tilak’s league. She used her     newspapers, </span><span style=\"font-family:'Nirmala UI'\"><i>New     India</i></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><i>Commonweal</i></span><span style=\"font-family:'Nirmala UI'\">,     to spread her message.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Lokmanya     Tilak (April 1916):</b></span><span style=\"font-family:'Nirmala UI'\"> He     launched his Home Rule League earlier than Besant, at </span><span style=\"font-family:'Nirmala UI'\"><b>Belgaum</b></span><span style=\"font-family:'Nirmala UI'\">.     His league was restricted to Maharashtra (excluding Bombay city),     Karnataka, the Central Provinces, and Berar.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Key    Differences Between the Two Leagues:</b></u></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Feature</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Tilak's League</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Besant's League</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Launched</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">April 1916</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">September 1916</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Headquarters</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Belgaum / Poona</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Adyar, Madras</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Area of Operation</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Maharashtra (excl. Bombay),       Karnataka, Central Provinces, Berar</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Rest of India (including Bombay       city)</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Newspapers</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><i>Maratha</i></span><span style=\"font-family:'Nirmala UI'\"> (English)       and </span><span style=\"font-family:'Nirmala UI'\"><i>Kesari</i></span><span style=\"font-family:'Nirmala UI'\"> (Marathi)</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><i>New India</i></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><i>Commonweal</i></span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">On which date is the 16th National    Voters’ Day scheduled to be celebrated in 2026?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">24 January</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">25 January</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">26 January</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">15 January</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Theme     for 2026: </span><span style=\"font-family:'Nirmala UI'\"><b>My India, My     Vote</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">To     encourage more young voters to take part in the political     process, the Government of India began celebrating NVD on </span><span style=\"font-family:'Nirmala UI'\"><b>January     25 </b></span><span style=\"font-family:'Nirmala UI'\">every year starting     from 2011.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate synonym    of the word \"Zany\".</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sane</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Dull</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Wacky</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Polite</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">“<span style=\"font-family:'Nirmala UI'\"><b>Zany”</b></span><span style=\"font-family:'Nirmala UI'\"> -     amusingly unconventional or silly in a funny way.</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Synonyms:</b></span><span style=\"font-family:'Nirmala UI'\"> Ludicrous,      eccentric, whimsical, farcical, droll.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Antonyms:</b></span><span style=\"font-family:'Nirmala UI'\"> Sedate,      staid, somber, prosaic, conventional</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Wacky     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>सनकी     </b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>/     </b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>अजीब     लेकिन मज़ेदार</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> -     someone funny in a slightly crazy way.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sane     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>समझदार</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> -     mentally stable</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Dull     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>उबाऊ</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> -     boring</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Polite     (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>विनम्र</b></span></span></span></span><span style=\"font-family:'Nirmala UI'\"><b>)</b></span><span style=\"font-family:'Nirmala UI'\"> -     relates to good manners, not funny craziness.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>Option    C</b></span><span style=\"font-family:'Nirmala UI'\"> is the correct    answer.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the idiom that is closest in    meaning to the underlined idiom.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Despite    many challenges, the young entrepreneur decided to </span><span style=\"font-family:'Nirmala UI'\"><u>stick    to his guns</u></span><span style=\"font-family:'Nirmala UI'\"> and    continue with his original plan.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Hold his tongue</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Stand his ground</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Jump the gun</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Go off the rails</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>“Stick to his guns</b></span><span style=\"font-family:'Nirmala UI'\">”    - to refuse to change one’s opinion or decision despite    opposition or criticism.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Origin</b></span><span style=\"font-family:'Nirmala UI'\">- The     idiom </span><span style=\"font-family:'Nirmala UI'\"><b>“stick to     his guns”</b></span><span style=\"font-family:'Nirmala UI'\"> comes     from old naval battles where soldiers stayed at their cannons     during dangerous fighting instead of running away. Over time, it     came to mean remaining firm in one’s opinion or decision     despite opposition.</span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Stand     his ground (</b></span><span style=\"font-family:'Mangal'\"><span><span style=\"font-family:'Nirmala UI'\"><span><b>अपने     फैसले पर दृढ़ रहना</b></span></span></span></span><span style=\"font-fam  </span><span style=\"font-family:'Nirmala UI'\"><b>was/were being +     past participle</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     The letter was being written by her.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Past     Perfect:</b></span><span style=\"font-family:'Nirmala UI'\"> Object     + </span><span style=\"font-family:'Nirmala UI'\"><b>had been + past     participle</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     The letter had been written by her.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    Option C is the correct answer.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate idiom    to fill in the blank.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">After    working non-stop for 12 hours, Ramesh decided to __________ and    get some rest.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">hit the sack</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bite the bullet</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">let the cat out of the bag</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">break the ice</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\" yle=\"font-family:'Nirmala UI'\">6</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">10</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781090573434_html_94e45d875fca3b8.jpg\" width=\"516\" height=\"908\" > </p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If x+1/x=5, then the value of    x</span><sup><span style=\"font-family:'Nirmala UI'\">2</span></sup><span style=\"font-family:'Nirmala UI'\">+1/x</span><sup><span style=\"font-family:'Nirmala UI'\">2 </span></sup><span style=\"font-family:'Nirmala UI'\">is    ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">21</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">23</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">25</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">27</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781090573434_html_fabf112a2bd1d0c8.jpg\" width=\"516\" height=\"596\" > </p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Four letter-clusters have been    given, out of which three are alike in some manner and one is    different. Select the letter-cluster that is different.    (Note: The odd one out is not based on the number of    consonants/vowels or their position in the letter cluster).</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">XWA</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">KJO</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">IHL</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">NMQ</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">First, observe all the options    given;</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">X     (-1) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     W (+4) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">A</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">K     (-1) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     J (+5) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     O</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">I     (-1) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     H (+4) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     L</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">N     (-1) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     M (+4) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Q</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    pattern is </span><span style=\"font-family:'Nirmala UI'\"><b>first    letter - 1 = second letter + 4 = third letter.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">All    except option b follows the same pattern.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence, KJO    is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Which of the following terms will    replace the question mark (?) in the given series?</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>ADXW,    DFVT, GHTQ, JJRN, ?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">KPLM</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">NLPK</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">MLPK</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">NJOL</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To find the next term in the    series, we analyze the pattern for each letter position    individually.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>First     Letter Position:</b></span><span style=\"font-family:'Nirmala UI'\"> Each     letter increases by 3</span><span style=\"font-family:'Nirmala UI'\"><i>(A     + 3 </i></span><span><i>→</i></span><span style=\"font-family:'Nirmala UI'\"><i>     D + 3 </i></span><span><i>→</i></span><span style=\"font-family:'Nirmala UI'\"><i>     G + 3 </i></span><span><i>→</i></span><span style=\"font-family:'Nirmala UI'\"><i>     J)  </i></span><span style=\"font-family:'Nirmala UI'\">  </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Second     letter position: </b></span><span style=\"font-family:'Nirmala UI'\">Each     letter increases by 2</span><span style=\"font-family:'Nirmala UI'\"><i> (D     + 2 </i></span><span><i>→</i></span><span style=\"font-family:'Nirmala UI'\"><i>     F + 2 </i></span><span><i>→</i></span><span style=\"font-family:'Nirmala UI'\"><i>     H + 2 </i></span><span><i>→</i></span><span style=\"font-family:'Nirmala UI'\"><i>     J)</i></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Third     letter position:</b></span><span style=\"font-family:'Nirmala UI'\"> Each     letter decreases by 2 </span><span style=\"font-family:'Nirmala UI'\"><i>(X     - 2 </i></span><span><i>→</i></span><span style=\"font-family:'Nirmala UI'\"><i>     V - 2 </i></span><span><i>→</i></span><span style=\"font-family:'Nirmala UI'\"><i>     T - 2 </i></span><span><i>→</i></span><span style=\"font-family:'Nirmala UI'\"><i>     R)</i></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Fourth     Letter Position:</b></span><span style=\"font-family:'Nirmala UI'\"> Each     letter decreases by 3 </span><span style=\"font-family:'Nirmala UI'\"><i>(W     - 3 </i></span><span><i>→</i></span><span style=\"font-family:'Nirmala UI'\"><i>T     - 3 </i></span><span><i>→</i></span><span style=\"font-family:'Nirmala UI'\"><i>     Q - 3 </i></span><span><i>→</i></span><span style=\"font-family:'Nirmala UI'\"><i>     N)</i></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Applying    the similar pattern on the given options, next set of alphabets    is </span><span style=\"font-family:'Nirmala UI'\"><b>MLPK.</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    the correct answer is MLPK.</b></span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Three of the following number-pairs    are alike in some manner and hence form a group. Which number-pair    does not belong to that group? (NOTE: Operations should be    performed on the whole numbers, without breaking down the numbers    into its constituent digits. E.g. 13 – Operations on 13 such as    adding/subtracting/multiplying etc. to 13 can be performed.    Breaking down 13 into 1 and 3 and then performing mathematical    operations on 1 and 3 is not allowed.)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">12 - 225</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">9 - 121</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">8 - 121</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6 - 81</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Pattern:</b></span><span style=\"font-family:'Nirmala UI'\"> Take    the first number, </span><span style=\"font-family:'Nirmala UI'\"><b>add    3</b></span><span style=\"font-family:'Nirmala UI'\">, and then </span><span style=\"font-family:'Nirmala UI'\"><b>square    the result</b></span><span style=\"font-family:'Nirmala UI'\"> (multiply    it by itself).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Check    the given options:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>12     - 225:</b></span><span style=\"font-family:'Nirmala UI'\"> If you take     12 and add 3, you get 15. 15</span><sup><span style=\"font-family:'Nirmala UI'\">2 </span></sup><span style=\"font-family:'Nirmala UI'\">=     225</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>8     - 121:</b></span><span style=\"font-family:'Nirmala UI'\"> Take 8 and     add 3, you get 11. 11</span><sup><span style=\"font-family:'Nirmala UI'\">2 </span></sup><span style=\"font-family:'Nirmala UI'\">=     121</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>6     - 81:</b></span><span style=\"font-family:'Nirmala UI'\"> Take 6 and     add 3, you get 9. 9</span><sup><span style=\"font-family:'Nirmala UI'\">2 </span></sup><span style=\"font-family:'Nirmala UI'\">=     81</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>9    - 121:</b></span><span style=\"font-family:'Nirmala UI'\"> If you    follow the rule here, you’d take 9 and add 3 to get 12.    But 12</span><sup><span style=\"font-family:'Nirmala UI'\">2 </span></sup><span style=\"font-family:'Nirmala UI'\">is </span><span style=\"font-family:'Nirmala UI'\"><b>144</b></span><span style=\"font-family:'Nirmala UI'\">,    not 121. To get 121 from 9, you’d only be adding 2 before    squaring it, which breaks the pattern the others established.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence, 9    - 121 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the number from among the    given options that can replace the question mark (?) in the    following series.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>572,    577, 586, 599, 616, ?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">673</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">637</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">642</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">625</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To find the next number in the    series, we will look at the Jump among the numbers:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781090573434_html_35cc591e234b6a15.png\" width=\"250\" height=\"81\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">If    you look at these differences (</span><span style=\"font-family:'Nirmala UI'\"><b>5,    9, 13, 17</b></span><span style=\"font-family:'Nirmala UI'\">), you’ll    notice they are increasing by </span><span style=\"font-family:'Nirmala UI'\"><b>4</b></span><span style=\"font-family:'Nirmala UI'\"> each    time.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Following    this pattern, the next difference should be </span><span style=\"font-family:'Nirmala UI'\"><b>21</b></span><span style=\"font-family:'Nirmala UI'\"> (17    + 4):</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">616     + 21 = </span><span style=\"font-family:'Nirmala UI'\"><b>637</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    637 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 80, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In a certain code language,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">‘<span style=\"font-family:'Nirmala UI'\">A    + B’ means ‘A is the mother of B’;</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">‘<span style=\"font-family:'Nirmala UI'\">A    − B’ means ‘A is the brother of B’;</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">‘<span style=\"font-family:'Nirmala UI'\">A    × B’ means ‘A is the wife of B’ and</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">‘<span style=\"font-family:'Nirmala UI'\">A    ÷ B’ means ‘A is the father of B’.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Based    on the above, how is X related to Z if ‘</span><span style=\"font-family:'Nirmala UI'\"><b>X    × Y − W ÷ Z - A’</b></span><span style=\"font-family:'Nirmala UI'\">?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Father</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mother</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mother's Brother's wife</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Father's brother's wife</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">First decode the expression given    in the question</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>X     × Y:</b></span><span style=\"font-family:'Nirmala UI'\">  X is the     wife of Y.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Y     − W: </b></span><span style=\"font-family:'Nirmala UI'\">Y is the     brother of W.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>W     ÷ Z: </b></span><span style=\"font-family:'Nirmala UI'\">W is the     father of Z.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Z     - A: </b></span><span style=\"font-family:'Nirmala UI'\">Z is the     brother of A.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Final family    tree:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781090573434_html_99cb2e97b6eafba.png\" width=\"250\" height=\"152\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">From    the family tree we can see that X is aunt of Z.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    father's brother's wife is the correct answer.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b><br> </b></span><br>     </p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781090573434_html_6345f9876468255b.jpg\" width=\"578\" height=\"386\" > </p>", "question_heading": ""}, {"sr_no": 81, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The position of how many letters    will remain unchanged if all the letters in the word MORDERN are    arranged in English alphabetical order?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">One</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Two</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Three</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">None</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Arrange the letters of MORDERN in    alphabetical order:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>D,     E, M, N, O, R, R</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Compare    the positions side by side;</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">MO     R D E </span><span style=\"font-family:'Nirmala UI'\"><b>R</b></span><span style=\"font-family:'Nirmala UI'\"> N</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">D     E M N O </span><span style=\"font-family:'Nirmala UI'\"><b>R</b></span><span style=\"font-family:'Nirmala UI'\"> R</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Only </span><span style=\"font-family:'Nirmala UI'\"><b>one</b></span><span style=\"font-family:'Nirmala UI'\"> letter    (the letter </span><span style=\"font-family:'Nirmala UI'\"><b>R</b></span><span style=\"font-family:'Nirmala UI'\"> at    the 6th position) remains unchanged when the letters are arranged    in alphabetical order.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    one is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 82, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In this question, three statements    are given, followed by three conclusions numbered I, II and III.    Assuming the statements<br> to be true, even if they seem to be    at variance with commonly known facts, decide which of the    conclusions logically<br> follow(s) from the statements.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statements:</b></span><span style=\"font-family:'Nirmala UI'\"><br> All    phones are Tablet.<br> Some Tablets are computer.<br> Some    computers are carts.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Conclusions:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">I.    Some Tablets are phones.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">II.    Some computers are Tablet.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I follows.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only II follows.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both I and II follow.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither I nor II follows.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">First, we will draw the Venn    diagram, according to the given statement:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781090573434_html_bd55ca9747993179.png\" width=\"284\" height=\"94\" > </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">We     can see that all phone is inside tablet, so some part of phone is     also inside tablet. </span><span style=\"font-family:'Nirmala UI'\"><b>Therefore,     Conclusion I Follows.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Some     part of computer is overlapping with tablet. </span><span style=\"font-family:'Nirmala UI'\"><b>Therefore,     conclusion II also follows.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    both I and II follows is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 83, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">What will come in the place of the    question mark (?) in the following equation if ‘+’ and ‘×‘    are interchanged and ‘−’ and ‘÷’ are interchanged?</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>84    ÷ 7 + 5 − 5 × 6 = ?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">81</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">79</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">78</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">83</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">First, replace the signs in the    given equation:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">84     − 7 × 5 ÷ 5 + 6</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Solve    the equation by BODMAS rule:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">7     × 5 ÷ 5 = 7</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">84     - 7 + 6 = </span><span style=\"font-family:'Nirmala UI'\"><b>83</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    83 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 84, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Six letters I, O, A, Y, Z and X are    written on different faces of a dice. Two positions of this dice    are shown in the figures below. Find the letter on the face    opposite to O.</span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781090573434_html_2ea12e39f74cd68b.jpg\" width=\"250\" height=\"151\" > </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">I</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Z</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">X</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">To     find the letter opposite to O, we will look at the common letter     in both images.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Common    letter in both images is O. Now start with clockwise letter    positioning from both images;</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Image     1: O, I, Z</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Image     2: O, A, Y</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">I    is opposite to A and Z is opposite to Y.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Remaining    letter </span><span style=\"font-family:'Nirmala UI'\"><b>X will be    opposite to O.</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    X is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">832 is related to 212 following a    certain logic.<br> 476 is related to 123 following the same    logic.<br> To which of the following is 684 related, following    the same logic?<br> (NOTE: Operations should be performed on the    whole numbers, without breaking them into digits.)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">173</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">175</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">171</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">169</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">We are given:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">832     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     212</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">476     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     123</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">We    must find how the first number is converted into the second using    whole-number operations.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Example 832    </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    212:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Try     dividing by 4; 832 ÷ 4 = 208</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Take     difference between 212 - 208 = 4</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Verify    the pattern with 2nd example.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">So,    the</span><span style=\"font-family:'Nirmala UI'\"><b> pattern    is Number ÷ 4 + 4</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Apply    the Rule to 684:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">684     ÷ 4 + 4 = </span><span style=\"font-family:'Nirmala UI'\"><b>175</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    175 is the correct answer.</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Trick:    compare both the numbers.</b></span></p>", "question_heading": ""}, {"sr_no": 86, "question": "  <p style=\"o r</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(n     + 1)</b></span><sup><span style=\"font-family:'Nirmala UI'\"><b>2</b></span></sup><span style=\"font-family:'Nirmala UI'\"><b> -1 =     second number</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Apply    the pattern for 63:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">8</span><sup><span style=\"font-family:'Nirmala UI'\">2 </span></sup><span style=\"font-family:'Nirmala UI'\">-     1 = 63</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">8</span><sup><span style=\"font-family:'Nirmala UI'\"> </span></sup><span style=\"font-family:'Nirmala UI'\">+1     = 9</span><sup><span style=\"font-family:'Nirmala UI'\">2 </span></sup><span style=\"font-family:'Nirmala UI'\">-     1 = 80</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    80 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following number-pairs, the    second number is obtained by applying certain mathematical    operations to the first number. Select the set in which the    numbers are related in the same way as are the numbers of the    following sets. (NOTE : Operations should be performed on the    whole numbers, without breaking down the numbers into its    constituent digits. E.g. 13 – Operations on 13 such as    adding /deleting /multiplying etc., to 13 can be performed.    Breaking down 13 into 1and 3 and then performing mathematical    operations on 1 and 3 is not allowed.)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-fam ple;</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">192 ÷     2 = 96 + 5 = 101</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The    pattern is first number ÷ 2 + 5 = second number</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Check    the given options, only option c is following the pattern.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">160 ÷     2 + 5 = 85</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    160, 85 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 90, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Identify the figure given in the    options which when put in place of the question mark (?) will    logically complete the image?</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781090573434_html_30ad044839a18f8c.png\" width=\"159\" height=\"150\" > </p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">a.</span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781090573434_html_3bc62f555bc4c557.png\" width=\"158\" height=\"124\" > </p>", "option2": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">b.</span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781090573434_html_ef46 n></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    ZUDUW is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 96, "question": "Tुनधध ौपोपधंधnपौ ोनध giॅधn ीियियथधक ृद पुनधध cयncिहौiयnौ nहंृधनधक I, II ोnक III. Aौौहंing पुध ौपोपधंधnपौ पय ृध पनहध, धॅधn iी पुधद ौधधं पय ृध ोप ॅोनiोncध थiपु cयंंयnिद ाnयथn ीोcपौ, कधciकध थुicु यी पुध cयncिहौiयnौ ियgicोििद ीियियथ(ौ) ीनयं पुध ौपोपधंधnपौ. Sपोपधंधnपौ: Sयंध cहपौ ोनध gनोौौधौ. Nय gनोौौ iौ ो ौपयnध. Aिि ौपयnधौ ोनध ंधपोिस. Cयncिहौiयnौ: Aिि cहपौ cोn nधॅधन ृध ौपयnधौ. Nय cहप iौ ो ंधपोि. Aिि ंधपोिस cोn nधॅधन ृध gनोौौधौ.", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only II and III conclusions follow</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">All I, II and III conclusions    follow</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only conclusion I follows</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only I and III conclusions follow</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">First, draw the Venn diagram    according to the given statement;</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781090573434_html_ab1b79023caed763.png\" width=\"250\" height=\"81\" > </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">We     can see that some part of cut is inside grass which makes     negative relation with stone. So, some part of cut cannot be     stone.  </span><span style=\"font-family:'Nirmala UI'\"><b>Therefore,     conclusion I follows.</b></span><
