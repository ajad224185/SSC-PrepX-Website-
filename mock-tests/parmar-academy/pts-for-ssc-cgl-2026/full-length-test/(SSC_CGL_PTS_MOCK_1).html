>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Between C and F</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Beyond C</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Enlarged</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Real &amp; Inverted</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">At F</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">At Infinity</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Highly Enlarged</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Real &amp; Inverted</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Between F and P</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Behind Mirror</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Enlarged</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Virtual &amp; Erect</b></span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Which of the following statements    with regard to the solid state drive (SSD) is/are correct?</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Spinning     speed of SSD is zero.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">SSD     consumes more energy compared to hard disk drive (HDD).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">SSD     could be used as virtual memory when RAM is insufficient.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">SSD     can replace the processor.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Select    the answer using the codes given below:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 and 3</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3 and 4</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 and 4</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>1    and 3 only</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1. Spinning    speed of SSD is zero.</b></span><span style=\"font-family:'Nirmala UI'\"> * </span><span style=\"font-family:'Nirmala UI'\"><b>Correct.</b></span><span style=\"font-family:'Nirmala UI'\"> Unlike    a Hard Disk Drive (HDD), which uses mechanical spinning platters    and a moving read/write head, an SSD has </span><span style=\"font-family:'Nirmala UI'\"><b>no    moving parts</b></span><span style=\"font-family:'Nirmala UI'\">. It    uses NAND-based flash memory (chips). Because nothing    physically spins, the spinning speed is indeed zero.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>2.    SSD consumes more energy compared to hard disk drive    (HDD).</b></span><span style=\"font-family:'Nirmala UI'\"> * </span><span style=\"font-family:'Nirmala UI'\"><b>Incorrect.</b></span><span style=\"font-family:'Nirmala UI'\"> SSDs    are significantly more </span><span style=\"font-family:'Nirmala UI'\"><b>energy-efficient</b></span><span style=\"font-family:'Nirmala UI'\"> than    HDDs. Because they don’t have to power a motor to spin    platters or move a mechanical arm, they use less power, which also    helps in extending the battery life of laptops.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>3. SSD    could be used as virtual memory when RAM is    insufficient.</b></span><span style=\"font-family:'Nirmala UI'\"> * </span><span style=\"font-family:'Nirmala UI'\"><b>Correct.</b></span><span style=\"font-family:'Nirmala UI'\"> When    the System RAM (Random Access Memory) is full, the operating    system uses a portion of the storage drive (SSD or HDD) as    \"Virtual Memory\" (or a page file/swap space) to handle    the overflow. SSDs are much better for this than HDDs because    their high read/write speeds reduce the performance lag typically    associated with virtual memory.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>4.    SSD can replace the processor.</b></span><span style=\"font-family:'Nirmala UI'\"> * </span><span style=\"font-family:'Nirmala UI'\"><b>Incorrect.</b></span><span style=\"font-family:'Nirmala UI'\"> These    are two entirely different components. The </span><span style=\"font-family:'Nirmala UI'\"><b>SSD    is a storage device</b></span><span style=\"font-family:'Nirmala UI'\"> (it    \"remembers\" data), while the </span><span style=\"font-family:'Nirmala UI'\"><b>Processor    (CPU) is a computing engine</b></span><span style=\"font-family:'Nirmala UI'\"> (it    \"thinks\" and executes instructions). One cannot    perform the function of the other.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>SSD    vs. HDD: A Quick Comparison:</b></u></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Feature</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Solid State Drive (SSD)</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Hard Disk Drive (HDD)</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Technology</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Flash Memory (NAND)</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Magnetic Platters &amp; Motor</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Speed</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Very High (Instant access)</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Slower (Mechanical delay)</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Durability</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">High (Shock resistant)</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Low (Fragile moving parts)</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Noise</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Silent</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Humming/Clicking sounds</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Cost</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">More expensive per GB</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Cheaper per GB</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Who has won the title of Miss World    2025 in May 2025?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Hasset Dereje Admassu</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Maja Klajda</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Opal Suchata Chuangsri</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Aurélie Joachim</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>c)    Opal Suchata Chuangsri</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Miss    World 2025</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>72nd    edition</b></span><span style=\"font-family:'Nirmala UI'\"> of the Miss    World pageant was held on </span><span style=\"font-family:'Nirmala UI'\"><b>May    31, 2025</b></span><span style=\"font-family:'Nirmala UI'\">, at the HITEX    Exhibition Centre in </span><span style=\"font-family:'Nirmala UI'\"><b>Hyderabad,    India</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Winner:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Opal     Suchata Chuangsri</b></span><span style=\"font-family:'Nirmala UI'\"> of     Thailand was crowned Miss World 2025 by her predecessor, Krystyna     Pyszková of the Czech Republic.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Historical     Significance:</b></span><span style=\"font-family:'Nirmala UI'\"> This     marked the </span><span style=\"font-family:'Nirmala UI'\"><b>first     time Thailand won</b></span><span style=\"font-family:'Nirmala UI'\"> the     Miss World title in the history of the pageant.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Advocacy:</b></span><span style=\"font-family:'Nirmala UI'\"> Opal     is a 21-year-old politics and international relations student who     is a prominent advocate for breast cancer awareness, having     survived a tumor removal at the age of 16.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Parliament     can bar the jurisdiction of courts over inter-state water     disputes.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Article     262 empowers the Inter-State Council to adjudicate water     disputes.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the above statements is/are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 1</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 2</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both 1 and 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither 1 nor 2</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>a)    Only 1</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    1: Correct</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Under </span><span style=\"font-family:'Nirmala UI'\"><b>Article    262(2)</b></span><span style=\"font-family:'Nirmala UI'\">, Parliament may    by law provide that </span><span style=\"font-family:'Nirmala UI'\"><b>neither    the Supreme Court nor any other court</b></span><span style=\"font-family:'Nirmala UI'\"> shall    exercise jurisdiction in respect of any dispute or complaint    related to the use, control, or distribution of waters of any    inter-state river or river valley.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">To     implement this, Parliament enacted the </span><span style=\"font-family:'Nirmala UI'\"><b>Inter-State     River Water Disputes Act, 1956</b></span><span style=\"font-family:'Nirmala UI'\">,     which shifts the resolution of these issues to ad-hoc tribunals.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    2: Incorrect</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article    262</b></span><span style=\"font-family:'Nirmala UI'\"> does not    empower the Inter-State Council to adjudicate these disputes.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article     262</b></span><span style=\"font-family:'Nirmala UI'\"> specifically     deals with the </span><span style=\"font-family:'Nirmala UI'\"><b>adjudication     of water disputes</b></span><span style=\"font-family:'Nirmala UI'\"> through     Parliament-created laws (Tribunals).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Inter-State     Council</b></span><span style=\"font-family:'Nirmala UI'\"> is     established under a completely different article—</span><span style=\"font-family:'Nirmala UI'\"><b>Article     263</b></span><span style=\"font-family:'Nirmala UI'\">. While the Council     can discuss or investigate disputes, it is a recommendatory body     and does not have the constitutional mandate to \"adjudicate\"     (legally resolve) water disputes under Article 262.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Key    Constitutional Mechanisms for State Relations:</b></u></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Feature</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Article 262</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Article 263</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Subject</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Adjudication of Water Disputes</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Inter-State Council</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Primary Goal</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Resolve river water sharing       conflicts</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Improve coordination between       Centre and States</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Authority</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Parliament</b></span><span style=\"font-family:'Nirmala UI'\"> (via       legislation)</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>President</b></span><span style=\"font-family:'Nirmala UI'\"> (via       order)</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Court Jurisdiction</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Can be barred by Parliament</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Not applicable</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The rule to determine the direction    of a current induced in a coil due to its rotation in a magnetic    field is:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Right-Hand Thumb Rule.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Fleming's Left-Hand Rule.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Fleming's Right-Hand Rule.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Hund's Rule.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>(c)    Fleming's Right-Hand Rule.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Fleming's    Right-Hand Rule</b></span><span style=\"font-family:'Nirmala UI'\"> is    specifically used for </span><span style=\"font-family:'Nirmala UI'\"><b>generators</b></span><span style=\"font-family:'Nirmala UI'\">. It    determines the direction of the </span><span style=\"font-family:'Nirmala UI'\"><b>induced    current</b></span><span style=\"font-family:'Nirmala UI'\"> when a    conductor moves inside a magnetic field.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Thumb:</b></span><span style=\"font-family:'Nirmala UI'\"> Represents     the direction of the </span><span style=\"font-family:'Nirmala UI'\"><b>Motion</b></span><span style=\"font-family:'Nirmala UI'\"> (or     force) of the conductor.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Forefinger:</b></span><span style=\"font-family:'Nirmala UI'\"> Represents     the direction of the </span><span style=\"font-family:'Nirmala UI'\"><b>Magnetic     Field</b></span><span style=\"font-family:'Nirmala UI'\"> (North to     South).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Middle     Finger:</b></span><span style=\"font-family:'Nirmala UI'\"> Represents     the direction of the </span><span style=\"font-family:'Nirmala UI'\"><b>Induced     Current</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1781090573434_html_e3e702d6f9fdbbe6.jpg\" width=\"250\" height=\"288\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Extra    facts:</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(a)     Right-Hand Thumb Rule:</b></span><span style=\"font-family:'Nirmala UI'\"> Used     to find the direction of the </span><span style=\"font-family:'Nirmala UI'\"><b>magnetic     field lines</b></span><span style=\"font-family:'Nirmala UI'\"> around     a straight current-carrying conductor.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(b)     Fleming's Left-Hand Rule:</b></span><span style=\"font-family:'Nirmala UI'\"> Used     for </span><span style=\"font-family:'Nirmala UI'\"><b>electric     motors</b></span><span style=\"font-family:'Nirmala UI'\">. It helps find     the direction of the </span><span style=\"font-family:'Nirmala UI'\"><b>force     (motion)</b></span><span style=\"font-family:'Nirmala UI'\"> acting on     a conductor that already has a current flowing through it in a     magnetic field.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>(d)     Hund's Rule:</b></span><span style=\"font-family:'Nirmala UI'\"> This     is a principle from </span><span style=\"font-family:'Nirmala UI'\"><b>Chemistry/Quantum     Mechanics</b></span><span style=\"font-family:'Nirmala UI'\"> regarding     the filling of electrons in atomic orbitals; it has nothing to do     with electromagnetism.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    in reference to the Payment of Wages Act, 1936:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Wages     may be paid in current coins.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Wage     period can be fixed for weekly payment.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Wages     are to be paid before the expiry of the seventh day after the     last day of the wage period in establishments employing more than     1000 persons.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the statements given above is/are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 and 2 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 only</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2 and 3</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>(a)    1 and 2 only</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    1: Correct</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">According    to </span><span style=\"font-family:'Nirmala UI'\"><b>Section 6</b></span><span style=\"font-family:'Nirmala UI'\"> of    the Payment of Wages Act, 1936, all wages must be paid in </span><span style=\"font-family:'Nirmala UI'\"><b>current    coins or currency notes</b></span><span style=\"font-family:'Nirmala UI'\">,    or both.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i>Note:</i></span><span style=\"font-family:'Nirmala UI'\"> Following     an amendment in 2017, the employer may also pay wages by cheque     or by crediting the wages in the bank account of the employee     without necessarily obtaining written authorization in certain     notified industries.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    2: Correct</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">According    to </span><span style=\"font-family:'Nirmala UI'\"><b>Section 4</b></span><span style=\"font-family:'Nirmala UI'\">,    every person responsible for the payment of wages shall fix    periods (wage-periods) in respect of which such wages shall be    payable.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Act specifies that </span><span style=\"font-family:'Nirmala UI'\"><b>no     wage-period shall exceed one month</b></span><span style=\"font-family:'Nirmala UI'\">.     Therefore, a wage period can be fixed as daily, weekly, or     fortnightly.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    3: Incorrect</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">According    to </span><span style=\"font-family:'Nirmala UI'\"><b>Section 5</b></span><span style=\"font-family:'Nirmala UI'\">,    the timeline for payment depends on the size of the workforce:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Establishments     with fewer than 1,000 persons:</b></span><span style=\"font-family:'Nirmala UI'\"> Wages     must be paid before the expiry of the </span><span style=\"font-family:'Nirmala UI'\"><b>7th     day</b></span><span style=\"font-family:'Nirmala UI'\"> after the last     day of the wage period.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Establishments     with 1,000 or more persons:</b></span><span style=\"font-family:'Nirmala UI'\"> Wages     must be paid before the expiry of the </span><span style=\"font-family:'Nirmala UI'\"><b>10th     day</b></span><span style=\"font-family:'Nirmala UI'\"> after the last     day of the wage period.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The     statement incorrectly attributes the 7-day rule to large     establishments (more than 1,000 persons).</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which one of the following    statements is not correct for benzene?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Each carbon atom forms sigma bonds    with two other carbon atoms with a bond angle of 120°.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Delocalized electrons create a    symmetrical 'cloud' of electrons above and below the plane.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The length of C-C bonds is    intermediate between single and double bonds.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It has six isomers.</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>(d)    It has six isomers.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(a)    Bond Angles — Correct</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Benzene    (C</span><sub><span style=\"font-family:'Nirmala UI'\">6</span></sub><span style=\"font-family:'Nirmala UI'\">H</span><sub><span style=\"font-family:'Nirmala UI'\">6</span></sub><span style=\"font-family:'Nirmala UI'\">)    is a planar molecule where each carbon atom    is </span><span style=\"font-family:'Nirmala UI'\"><b>sp</b></span><sup><span style=\"font-family:'Nirmala UI'\"><b>2</b></span></sup><span style=\"font-family:'Nirmala UI'\"><b> hybridized</b></span><span style=\"font-family:'Nirmala UI'\">. Each    carbon forms two sigma bonds with adjacent carbons and    one sigma bond with a hydrogen atom. This geometry    results in a perfect hexagonal shape with bond angles of    exactly </span><span style=\"font-family:'Nirmala UI'\"><b>120°</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(b)    Electron Cloud — Correct</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    unhybridized p-orbitals on each carbon atom overlap laterally    to form a (pi) system. Instead of being fixed between    two atoms, these six electrons are </span><span style=\"font-family:'Nirmala UI'\"><b>delocalized</b></span><span style=\"font-family:'Nirmala UI'\">,    rotating freely around the ring. This creates two continuous    \"doughnut-shaped\" clouds of electron    density—one </span><span style=\"font-family:'Nirmala UI'\"><b>above</b></span><span style=\"font-family:'Nirmala UI'\"> and    one </span><span style=\"font-family:'Nirmala UI'\"><b>below</b></span><span style=\"font-family:'Nirmala UI'\"> the    flat plane of the carbon atoms.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(c)    Bond Lengths — Correct</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In    a typical system, a C-C single bond is 1.54A and    a C=C double bond is 1.34A. However, due to    resonance, all bonds in benzene are identical. The bond    length is </span><span style=\"font-family:'Nirmala UI'\"><b>$1.39 A</b></span><span style=\"font-family:'Nirmala UI'\">,    which is intermediate between a single and a double bond.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>(d)    Isomers — Incorrect</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Benzene    itself does not have \"six isomers.\" It is a single,    highly stable aromatic compound. While benzene can form    many </span><span style=\"font-family:'Nirmala UI'\"><b>derivatives</b></span><span style=\"font-family:'Nirmala UI'\"> (like    ortho-, meta-, and para-xylene), the statement that \"it has    six isomers\" is factually wrong. Historically, scientists    like Kekulé proposed different structures, but these    are </span><span style=\"font-family:'Nirmala UI'\"><b>resonance    structures</b></span><span style=\"font-family:'Nirmala UI'\"> (contributing    forms), not separate isomers.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Benzene’s    Unique Properties:</b></u></span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Property</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Description</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Hybridization</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">sp</span><sup><span style=\"font-family:'Nirmala UI'\">2</span></sup><span style=\"font-family:'Nirmala UI'\"> for       all 6 carbons</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Geometry</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Planar Hexagonal</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Aromaticity</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Follows Hückel's Rule (4n       + 2)</span><span>π</span><span style=\"font-family:'Nirmala UI'\"> electrons       where n=1</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Stability</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">High resonance energy makes it       less reactive than alkenes</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "question_heading": ""}, {"sr_no": 8, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Match the points under Column A    with those under Column B.</span></p>    <table>     <col>      <col>      <thead>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Column A (Disease)</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Column B (Organism        Responsible)</b></span></p>       </td>      </tr>     </thead>     <tbody>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">i. Malaria</span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">a. Vibrio</span></p>       </td>      </tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">ii. Diarrhoea</span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">b. Salmonella</span></p>       </td>      </tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">iii. Typhoid</span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">c. Rotavirus</span></p>       </td>      </tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">iv. Cholera</span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">d. Plasmodium</span></p>       </td>      </tr>     </tbody>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "option1": "<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">i-b, ii-a, iii-c, iv-d</span></p>", "option2": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">i-d, ii-c, iii-b, iv-a</span></p>", "option3": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">i-a, ii-c, iii-b, iv-d</span></p>", "option4": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">i-a, ii-b, iii-c, iv-d</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct option is </span><span style=\"font-family:'Nirmala UI'\"><b>B.    i-d, ii-c, iii-b, iv-a</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>i. Malaria — d. Plasmodium</b></span></p>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Malaria is caused by a protozoan     parasite called </span><span style=\"font-family:'Nirmala UI'\"><b>Plasmodium</b></span><span style=\"font-family:'Nirmala UI'\">.     It is transmitted to humans through the bite of an infected     female </span><span style=\"font-family:'Nirmala UI'\"><b>Anopheles     mosquito</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>ii. Diarrhoea — c. Rotavirus</b></span></p>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">While many bacteria and parasites     can cause diarrhoea, </span><span style=\"font-family:'Nirmala UI'\"><b>Rotavirus</b></span><span style=\"font-family:'Nirmala UI'\"> is     the most common cause of severe diarrhoea in infants and young     children worldwide.</span></p>    </li></ul>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>iii. Typhoid — b. Salmonella</b></span></p>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Typhoid fever is a bacterial     infection caused by </span><span style=\"font-family:'Nirmala UI'\"><b>Salmonella     typhi</b></span><span style=\"font-family:'Nirmala UI'\">. It typically     spreads through contaminated food and water.</span></p>    </li></ul>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>iv. Cholera — a. Vibrio</b></span></p>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Cholera is an acute diarrhoeal     infection caused by ingestion of food or water contaminated with     the bacterium </span><span style=\"font-family:'Nirmala UI'\"><b>Vibrio     cholerae</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Disease</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Pathogen Type</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Specific Organism</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Malaria</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Protozoa</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><i>Plasmodium</i></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Diarrhoea</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Virus (Commonly)</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><i>Rotavirus</i></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Typhoid</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Bacteria</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><i>Salmonella typhi</i></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Cholera</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Bacteria</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><i>Vibrio cholerae</i></span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following is NOT true    with regard to the Green Revolution?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Cultivation became more intensive    in nature.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In its second phase, there was a    shift to from dry to wet (irrigated) cultivation in dry and    semi-arid regions of India.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Cultivation became more extensive    in nature.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">There was change in the cropping    pattern and types of crops grown in its second phase.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct option is </span><span style=\"font-family:'Nirmala UI'\"><b>C.    Cultivation became more extensive in nature.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Intensive     Cultivation (Statement A - True):</b></span><span style=\"font-family:'Nirmala UI'\"> The     Green Revolution focused on increasing yields from the </span><span style=\"font-family:'Nirmala UI'\"><b>same     piece of land</b></span><span style=\"font-family:'Nirmala UI'\"> using     high-quality inputs (HYV seeds, fertilizers, and irrigation).     This is the definition of intensive farming.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Extensive     Cultivation (Statement C - False):</b></span><span style=\"font-family:'Nirmala UI'\"> Extensive     cultivation refers to increasing total production by </span><span style=\"font-family:'Nirmala UI'\"><b>expanding     the area of land</b></span><span style=\"font-family:'Nirmala UI'\"> under     cultivation. While some new land was cleared, the core of the     Green Revolution was \"productivity per hectare\" rather     than \"expansion of area.\"</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Second     Phase Shift (Statement B - True):</b></span><span style=\"font-family:'Nirmala UI'\"> In     its first phase (mid-60s to mid-70s), the revolution was limited     to wheat-growing regions like Punjab and Haryana. In the second     phase (mid-70s to mid-80s), it spread to other crops and regions,     bringing irrigation to formerly dry and semi-arid zones.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Cropping     Patterns (Statement D - True):</b></span><span style=\"font-family:'Nirmala UI'\"> There     was a significant shift toward monocultures (wheat and rice) and     away from traditional coarse cereals like millets and pulses,     especially as irrigation became available.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Features of the Green Revolution:</b></span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Feature</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Description</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>HYV Seeds</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">High-Yielding Variety seeds       (specifically Wheat and Rice).</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>The \"Package\"</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Seeds required a precise       \"package\" of chemical fertilizers and steady       irrigation.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Regional Bias</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Initially benefited Punjab,       Haryana, and Western Uttar Pradesh.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Mechanization</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Increased use of tractors,       harvesters, and diesel pump sets.</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which folk dance of India uses    wooden dummy horses, vibrant costumes, and is performed to    commemorate battlefield valor?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bhangra</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Garba</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kummi</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Poikkal Kuthirai</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>The correct option is Poikkal    Kuthirai.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Poikkal    Kuthirai</b></span><span style=\"font-family:'Nirmala UI'\"> (which    literally translates to \"False-Legged Horse\") is a    traditional folk dance from </span><span style=\"font-family:'Nirmala UI'\"><b>Tamil    Nadu</b></span><span style=\"font-family:'Nirmala UI'\">. It is one of the    oldest and most visually striking art forms in the region.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Horse:</b></span><span style=\"font-family:'Nirmala UI'\"> Dancers     wear a lightweight frame shaped like a horse, made of jute,     cardboard, paper, and glass. It is hollow in the middle so the     dancer can fit inside.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Wooden     Legs:</b></span><span style=\"font-family:'Nirmala UI'\"> Since the     horse frame covers the dancer's waist and legs, the performer     wears </span><span style=\"font-family:'Nirmala UI'\"><b>wooden     stilts</b></span><span style=\"font-family:'Nirmala UI'\"> on their     feet. These stilts create a rhythmic \"clippity-clop\"     sound that mimics a horse's gallop.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Purpose:</b></span><span style=\"font-family:'Nirmala UI'\"> The     dance is performed to honor folk deities and to commemorate     the </span><span style=\"font-family:'Nirmala UI'\"><b>valor and     bravery</b></span><span style=\"font-family:'Nirmala UI'\"> of     warriors in battle. It is commonly performed during temple     festivals.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Performance     Style:</b></span><span style=\"font-family:'Nirmala UI'\"> It requires     great skill and balance to dance on wooden blocks while carrying     the weight of the horse frame. It is usually accompanied by     traditional music like the </span><span style=\"font-family:'Nirmala UI'\"><i>Nagaswaram</i></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><i>Thavil</i></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Read the following statements and    mark the correct option:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Assertion    (A): Potti Sriramulu fasted unto death for the formation of Andhra    Pradesh.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Reason    (R): His death marked the beginning of linguistic state formation    in India</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both A and R are true, and R is the    correct explanation of A.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both A and R are true, but R is not    the correct explanation of A.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A is true, but R is false.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A is false, but R is true.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct option is </span><span style=\"font-family:'Nirmala UI'\"><b>a)    Both A and R are true, but R is the correct explanation of A.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Assertion    (A): True</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Potti    Sriramulu, a devoted Gandhian and freedom fighter, undertook a    fast unto death in 1952. He demanded a separate state for the    Telugu-speaking people of the Madras Presidency. After </span><span style=\"font-family:'Nirmala UI'\"><b>56    days</b></span><span style=\"font-family:'Nirmala UI'\"> of fasting, he    passed away on December 15, 1952.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Reason    (R): True</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">His    death sparked widespread civil unrest and violence in the Andhra    region, which forced the Prime Minister, Jawaharlal Nehru, to    announce the formation of the first linguistic state (</span><span style=\"font-family:'Nirmala UI'\"><b>Andhra    State</b></span><span style=\"font-family:'Nirmala UI'\">) in October 1953.    This event set a precedent and led to the appointment of    the </span><span style=\"font-family:'Nirmala UI'\"><b>States    Reorganisation Commission (SRC)</b></span><span style=\"font-family:'Nirmala UI'\"> in    1953, which eventually reshaped the entire map of India along    linguistic lines.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Chronology    of Events:</b></u></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Date</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Event</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Significance</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Oct 1952</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Fast begins</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Demand for a Telugu-majority       state.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Dec 1952</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Sriramulu's Death</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Led to immediate political       pressure on the Centre.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Oct 1953</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Andhra State</b></span><span style=\"font-family:'Nirmala UI'\"> Created</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">First state formed on a       linguistic basis in India.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Dec 1953</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">SRC Appointed</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Led by Fazal Ali to study state       boundaries nationwide.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <t amily:'Nirmala UI'\">Q. By international agreement</span></p>       </td>      </tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">3. Art. 252</span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">R. On request of 2+ states</span></p>       </td>      </tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">4. Art. 253</span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">S. For national interest</span></p>       </td>      </tr>     </tbody>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>", "option1": "<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">1-P, 2-Q, 3-R, 4-S</span></p>", "option2": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">1-S, 2-P, 3-R, 4-Q</span></p>", "option3": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">1-Q, 2-R, 3-S, 4-P</span></p>", "option4": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">1-R, 2-S, 3-P, 4-Q</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>Option    2: 1-S, 2-P, 3-R, 4-Q</b></span></p>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>1. Article 249 — (S) For    National Interest</b></span></p>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">If the </span><span style=\"font-family:'Nirmala UI'\"><b>Rajya    Sabha</b></span><span style=\"font-family:'Nirmala UI'\"> passes a    resolution supported by not less than two-thirds of the members    present and voting, declaring that it is necessary in the </span><span style=\"font-family:'Nirmala UI'\"><b>national    interest</b></span><span style=\"font-family:'Nirmala UI'\">, Parliament    gains the power to make laws on a State subject.</span></p>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Duration:</b></span><span style=\"font-family:'Nirmala UI'\"> Such     a resolution remains in force for one year but can be renewed     indefinitely.</span></p>    </li></ul>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>2. Article 250 — (P) During    National Emergency</b></span></p>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">When a </span><span style=\"font-family:'Nirmala UI'\"><b>Proclamation    of Emergency</b></span><span style=\"font-family:'Nirmala UI'\"> (Article    352) is in operation, Parliament acquires the power to legislate    on any subject mentioned in the State List for the whole or any    part of India.</span></p>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Duration:</b></span><span style=\"font-family:'Nirmala UI'\"> Laws     made under this provision cease to have effect six months after     the emergency has ended.</span></p>    </li></ul>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>3. Article 252 — (R) On    request of 2+ states</b></span></p>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">If the legislatures of </span><span style=\"font-family:'Nirmala UI'\"><b>two    or more states</b></span><span style=\"font-family:'Nirmala UI'\"> pass    resolutions requesting Parliament to enact laws on a specific    State subject, Parliament can do so.</span></p>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Scope:</b></span><span style=\"font-family:'Nirmala UI'\"> The     resulting law applies </span><span style=\"font-family:'Nirmala UI'\"><b>only     to those states</b></span><span style=\"font-family:'Nirmala UI'\"> that     made the request (though other states can adopt it later by     passing a similar resolution).</span></p>    </li></ul>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>4. Article 253 — (Q) By    International Agreement</b></span></p>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Parliament can make laws on any    State subject for the purpose of implementing </span><span style=\"font-family:'Nirmala UI'\"><b>international    treaties, agreements, or conventions</b></span><span style=\"font-family:'Nirmala UI'\">.    This ensures the Union can fulfill its global obligations without    being blocked by state-level legislation.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In December 2025, the Kopra    reservoir has been declared a Ramsar site. In which state is the    Kopra reservoir located?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Madhya Pradesh</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span yle=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Ahmedabad-     Manchester</b></span><span style=\"font-family:'Nirmala UI'\"> of India     </span><span style=\"font-family:'Nirmala UI'\"><b>Textile</b></span><span style=\"font-family:'Nirmala UI'\"> industries </span></p>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Varanasi-</b></span><span style=\"font-family:'Nirmala UI'\">     </span><span style=\"font-family:'Nirmala UI'\"><b>Spiritual Capital</b></span><span style=\"font-family:'Nirmala UI'\">     of India</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What is the benefit of the NavIC    system?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Provides global internet services</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Detects earthquakes before they    occur</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Offers regional navigation and    positioning services</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Enables high-resolution space    photography</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>c)    Offers regional navigation and positioning services</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>NavIC</b></span><span style=\"font-family:'Nirmala UI'\"> (Navigation    with Indian Constellation) is India’s independent, indigenous    satellite navigation system developed by the </span><span style=\"font-family:'Nirmala UI'\"><b>Indian    Space Research Organisation (ISRO)</b></span><span style=\"font-family:'Nirmala UI'\">. It    was formerly known as the </span><span style=\"font-family:'Nirmala UI'\"><b>Indian    Regional Navigation Satellite System (IRNSS)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Benefits of NavIC</b></span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Regional     Focus:</b></span><span style=\"font-family:'Nirmala UI'\"> Unlike GPS     (USA), which is a global system, NavIC is specifically designed     to provide accurate positioning over </span><span style=\"font-family:'Nirmala UI'\"><b>India     and a region extending up to 1,500 km</b></span><span style=\"font-family:'Nirmala UI'\"> beyond     its borders.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Higher     Accuracy:</b></span><span style=\"font-family:'Nirmala UI'\"> For     civilian users in India, NavIC can provide a positional accuracy     of </span><span style=\"font-family:'Nirmala UI'\"><b>better than 5–10     meters</b></span><span style=\"font-family:'Nirmala UI'\">, whereas the     standard GPS accuracy for civilians is typically around 20     meters.</span></p>    </li></ol>", "question_heading": ""}, {"sr_no": 20, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Match the following Janapadas with    their capitals:</span></p>    <table>     <col>      <col>      <thead>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Janapada</b></span></p>       </td>       <td style=\"border:
