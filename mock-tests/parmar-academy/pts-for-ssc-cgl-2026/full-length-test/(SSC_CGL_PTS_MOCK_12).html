an style=\"font-family:'Nirmala UI'\">2.    Number of Latitudes - 181</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Statement I</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Statement II</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both Statement I and Statement II</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither Statement I nor Statement    II</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>A)</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Only    statement 1.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Longitudes-</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">They     are imaginary vertical lines over the globe that run</span><span style=\"font-family:'Nirmala UI'\"><b> North     to South.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Distance     between each longitude </span><span style=\"font-family:'Nirmala UI'\"><b>decreases     from Equator towards poles</b></span><span style=\"font-family:'Nirmala UI'\">,     at the </span><span style=\"font-family:'Nirmala UI'\"><b>poles it is     0</b></span><span style=\"font-family:'Nirmala UI'\">, while it is</span><span style=\"font-family:'Nirmala UI'\"><b> maximum     at the equator (111.32 km)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Total     longitudes- 360</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Prime     Meridian-</span><span style=\"font-family:'Nirmala UI'\"><b> 0°     longitude.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">International     date line- </span><span style=\"font-family:'Nirmala UI'\"><b>180°     E/W.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence     the</span><span style=\"font-family:'Nirmala UI'\"><b> statement 1 is     Incorrect.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Latitudes-</b></u></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">They     are imaginary horizontal lines on the globe that run from</span><span style=\"font-family:'Nirmala UI'\"><b> East     to West</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is the angular distance of a place from the equator.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Total     Latitudes = 181</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence     the</span><span style=\"font-family:'Nirmala UI'\"><b> statement 2     is</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Correct</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Distance     between each latitude is same</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1°     of latitude= 111 km</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Important     Latitudes</b></u></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>0°</b></span><span style=\"font-family:'Nirmala UI'\">-     Equator</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>23½°N</b></span><span style=\"font-family:'Nirmala UI'\">-     Tropic of Cancer</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>23½°S</b></span><span style=\"font-family:'Nirmala UI'\">-     Tropic of Capricorn</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>66½°N</b></span><span style=\"font-family:'Nirmala UI'\">-     Artic Circle</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>66½°S</b></span><span style=\"font-family:'Nirmala UI'\">-     Antarctic Circle</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">All    parallel circles from the equator to the poles are known    as</span><span style=\"font-family:'Nirmala UI'\"><b> \"Parallels    of Latitude\".</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Concept    of Great Circle-</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A     great circle is the largest possible circle that can be drawn     around a sphere.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>It     divides the Earth into two equal parts called Hemispheres.</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>All     longitudes are considered great circles</b></span><span style=\"font-family:'Nirmala UI'\">,     but only one latitude is considered a great circle and that     is </span><span style=\"font-family:'Nirmala UI'\"><b>Equator.</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Arrange the following    prominent Maratha Rulers in the correct chronological    order of their reign:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">1.    Bajirao I</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">2.    Rajaram I</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">3. Chhatrapati    Shivaji Maharaj</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">4. Sambhaji    Maharaj</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3 - 4 - 1 - 2</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3 - 4 - 2 - 1</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">4 - 3 - 2 - 1</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3 - 2 - 4 - 1</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is:</span><span style=\"font-family:'Nirmala UI'\"><b> B) 3    </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    4 </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    2 </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>    1</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">That    is:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Chhatrapati     Shivaji Maharaj</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sambhaji     Maharaj</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Rajaram     I</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Bajirao     I</b></span></p>    </li></ol>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>1. Chhatrapati    Shivaji Maharaj</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Reign:    1674-80</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Founder-    Maratha Empire</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Crowned    at: </span><span style=\"font-family:'Nirmala UI'\"><b>Raigad Fort in    1674</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Achievements- </span><span style=\"font-family:'Nirmala UI'\"><b>Ashtapradhan    council, Use of Guerrilla warfare.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>2. Sambhaji    Maharaj</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'N , "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">When the unfolded dice is folded,    the faces opposite to each other is</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784474184831_html_f9e607ccf02cd8a1.jpg\" width=\"182\" height=\"268\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     opposite of A is F</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    opposite of B is D</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    opposite of C is E</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Clearly,    The dice of A and D is cannot be formed when give sheet is folded    because the opposite faces appear together in these dice.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>Only    B and C </b></span><span style=\"font-family:'Nirmala UI'\">is the    correct answer.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">What should come in place of the    question mark (?)</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Blue    Revolution : Fisheries :: Golden Revolution : ?</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Milk</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Oilseeds</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Horticulture</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Food grains</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">As,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Blue    Revolution </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    Fisheries (Fish production)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Similarly,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Golden    Revolution </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    Horticulture (Fruits, vegetables, honey, etc.)</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>Horticulture </b></span><span style=\"font-family:'Nirmala UI'\">is    the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Read the given statements and    conclusions carefully. Assuming that the information given in the    statements is true, even if it appears to be at variance with    commonly known facts, decide which of the given conclusion(s)    logically follow(s) from the statements.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statements:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">All    electrons are protons.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">All    protons are particles.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Only    a few particles are elements.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusions:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">I:    Some particles are electrons.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">II:    Some Protons are elements,</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">III:    All Particles are not elements</span></p>", "option1": "<p style=\"orphans:0;widows:0\">     <span style=\"font-family:'Nirmala UI'\">Only conclusion (I) and (II)    follow</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only conclusion (II) and (III)    follow</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only conclusion (I) and (III)    follow</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">All conclusion (I), (II) and (III)    follow</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Draw the Venn diagram</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784474184831_html_26d832481a9e324e.jpg\" width=\"426\" height=\"243\" > <span style=\"font-family:'Nirmala UI'\"><br> </span><span style=\"font-family:'Nirmala UI'\"><b>Conclusion    I:</b></span><span style=\"font-family:'Nirmala UI'\"> Since all    electrons are protons and all protons are particles, all electrons    are necessarily particles. </span><span style=\"font-family:'Nirmala UI'\"><b>Therefore,    it is logically correct.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion    II:</b></span><span style=\"font-family:'Nirmala UI'\"> We know    some </span><span style=\"font-family:'Nirmala UI'\"><i>particles</i></span><span style=\"font-family:'Nirmala UI'\"> are    elements, but we don't have information about relation between    protons and elements. </span><span style=\"font-family:'Nirmala UI'\"><b>Therefore,    it is logically incorrect.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion    III:</b></span><span style=\"font-family:'Nirmala UI'\"> The phrase    \"Only a few explicitly implies that \"Some A are    B\" </span><span style=\"font-family:'Nirmala UI'\"><b>and</b></span><span style=\"font-family:'Nirmala UI'\"> \"Some    A are not B.\" </span><span style=\"font-family:'Nirmala UI'\"><b>Therefore,    this conclusion is logically correct.</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    Only conclusion (I) and (III) follow</b></span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Study the following information    carefully and answer the questions given below:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In    a certain language,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">“<span style=\"font-family:'Nirmala UI'\">tree    that green work” is coded as “gi, ni, pi, ci”</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">“<span style=\"font-family:'Nirmala UI'\">work    around the garden” is coded as “xi, ci, yi, bi”</span></p> hans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">8    @ 6 $ 8 % 6 = 46</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">·           8 × 6 – 8 + 6</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">·           48 – 2 = 46</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Apply    this pattern in 7 @ 6 $ 7 % 6</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">·           7 × 6 – 7 + 6 = 42 – 1 = </span><span style=\"font-family:'Nirmala UI'\"><b>41</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    41 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">How many meaningful four-letter    English words can be formed using the second, third, fifth and    sixth letters of the word \"CANDLE\" (when counted from    left to right), using each letter only once in each word? </span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">One</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Two</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Three</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Four</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    given word is: 'CANDLE’</span></p>    <p style=\ 2025 is a Monday, on    which day of the week will a wedding scheduled for 7th August 2025    take place?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Monday</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Tuesday</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Thursday</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sunday</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">We just need to count the number of    days between 7</span><span style=\"font-family:'Nirmala UI'\"><b> </b></span><span style=\"font-family:'Nirmala UI'\">March    2025 and 7 August 2025, then take mod 7.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">From    7 March to 7 August:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">March:    24 days (from 7th to 31st)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">April:    30</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">May:    31</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">June:    30</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">July:    31</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">August:    7</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Total    = 24 + 30 + 31 + 30 + 31 + 7 = 153 days</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Now    divide by 7: remainder 6</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">So,    the day shifts 6 days ahead from Monday:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Monday    + 6 days = Sunday</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    the wedding day will be on Sunday</b></span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">There are 40 students in a line.    Maya is 13th from the left and Kiran is 17th from the right. How    many students are there between them?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">7</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">9</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">10</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">12</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Total students = 40</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Maya    (from left) = 13</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Kiran    (from right) = 17</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">First,    add the two positions together to see if they cross each other:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Sum    of positions = 13 + 17 = 30</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Since    the sum (30) is less than the total number of students (40), Maya    and Kiran are not overlapping. Maya is on the left side, Kiran is    on the right side, and there is a gap between them.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Students    between = Total - (Position from Left + Position from Right)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Students    between = 40 - (13 + 17)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Students    between = 40 - 30 = 10</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>There    are 10 students between Maya and Kiran.</b></span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">What will come at the place of    question mark?</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">1250,    250, 75, 30, 15, ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">7</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">9</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">12</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Check the jump between the numbers,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784474184831_html_25c066486b90dadf.jpg\" width=\"602\" height=\"123\" > <span style=\"font-family:'Nirmala UI'\"><br>  </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    pattern is × 0.2, ×0.3, × 0.4, ×0.5</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Apply    this pattern for next number</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">15    × 0.6 = 9</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    9 is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If ‘A + B’ means ‘A is    brother of B’, ‘A – B’ means ‘A is sister of B’, ‘A    × B’ means ‘A is father of B’, ‘A ÷ B’ means ‘A is    mother of B’, then which of the following options signifies that    K is grandmother of M?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">K × L – O + M</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">K ÷ L – O + M</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">K ÷ L × O + M</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">K ÷ L + O – M</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To prove K is the grandmother of M,    K must be Female and two generations above M. K (Mother) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    Parent (Father/Mother) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    M.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(a)    K × L – O + M, K is the father of L. Since K is male, he cannot    be a grandmother.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(b)    K ÷ L – O + M, K is the mother of L, O, and M, she cannot be    grandmother of M.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(c)    K ÷ L × O + M, K is mother of L, L is father of O, O and M are    siblings. Which means K is grandmother of M.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(d)    K ÷ L + O – M, K is mother of L and L, O, M are siblings. So, K    cannot be grandmother.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    option c, is the correct answer</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Eight persons Diya, Deepak, Kush,    Sapna, Sudheer, Vaibhu, Veena and Vivek live on eight different    floors of an 8-storey building from bottom to top such as ground    floor is numbered as 1st and top floor is numbered as 8th. Vaibhu    lives on an even numbered floor but not on the 6th floor. Vivek    lives below Kush’s floor. Sudheer lives two floors above    Deepak’s floor. Diya lives on an even numbered floor but not    adjacent to Sudheer’s floor. Vaibhu lives just above Veena’s    floor. Kush lives on 3rd floor. Sudheer does not live on topmost    floor. Sapna’s floor is not adjacent to Deepak’s floor. How    many persons live between Vaibhav’s and Deepak’s floor?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Three</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Five</span></p>", "op la UI'\">Change the following from active    voice to passive voice:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Disha    plucks fresh flowers from the garden every day.  </span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Fresh flowers was plucked by Disha    every day.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Fresh flowers are plucked by Disha    every day.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Fresh flowers have been plucked by    Disha every day.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Fresh flowers had been plucked by    Disha every day.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The given sentence is in </span><span style=\"font-family:'Nirmala UI'\"><b>Simple    Present Tense</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">To    convert sentence in Simple Present Tense from active voice to    passive voice, the formula is:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Object    + is/am/are + Past Participle (V3) + by + Subject</b></span><span style=\"font-family:'Nirmala UI'\"><br> Since    object of the given sentence- \"fresh flowers\" is </span><span style=\"font-family:'Nirmala UI'\"><b>plural</b></span><span style=\"font-family:'Nirmala UI'\">,    we must use \"</span><span style=\"font-family:'Nirmala UI'\"><b>are</b></span><span style=\"font-family:'Nirmala UI'\">\"    as the helping verb.<br> Hence, the correct sentence is:<br>  </span><span style=\"font-family:'Nirmala UI  </b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Accomplice</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Hypocrite</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Conscientious</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Agile</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">One who pretends to be what he is    not is called </span><span style=\"font-family:'Nirmala UI'\"><b>Hypocrite</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    option</span><span style=\"font-family:'Nirmala UI'\"><b> B</b></span><span style=\"font-family:'Nirmala UI'\"> is    correct.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Accomplice</b></span><span style=\"font-family:'Nirmala UI'\">: A    person who helps another commit a crime.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conscientious</b></span><span style=\"font-family:'Nirmala UI'\">: Wishing    to do what is right, especially to do one's work or duty well and    thoroughly.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Agile</b></span><span style=\"font-family:'Nirmala UI'\">: Able    to move quickly and easily; or having a quick, resourceful and    adaptable character.</span></p>", "question_heading": ""}, {"sr_no": 90, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Find the part of the sentence that    contains an Nirmala UI'\"><b> </b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Every    shirt, tie, and jacket hanging in those display closets needs to    be dry-cleaned before the formal exhibition opens next week.</b></span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">A sentence is provided in direct    speech. From the four given options, choose the one that most    accurately conveys the sentence in its corresponding indirect    speech.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Mayank    said to me, \"Will you buy my car?\"</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mayank asked me if you would buy    his car.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mayank asked me if I would buy his    car.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mayank asked me if I would buy my    car.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mayank asked me if I would buy a    car?</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The sentence provided is an    interrogative sentence in </span><span style=\"font-family:'Nirmala UI'\"><b>Direct    Speech</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">To    convert interrogative sentence from direct speech to indirect    speech:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">'said    to' changes to 'asked' or 'inquired'.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">For    Yes/No question,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">if/whether    is used as a conjunction.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">'Will'    changes to 'would'.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">'You'    changes according to object of reporting speech. Here the    object is 'me'. Therefore, 'you' changes to 'I'.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">'My'    changes according to subject of reporting speech.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Here,    subject is 'Mayank'. Therefore, 'my' changes to 'his'.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    correct sentence is: </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Mayank    asked me if I would buy his car.</b></span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">A sentence is provided in indirect    speech. From the four given options, choose the one that most    accurately conveys the sentence in its corresponding direct    speech.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>She    said that she had cleaned the house the day before.</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">She said,\" I cleaned the house    the day before.\"</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">She said,\" she cleaned the    house yesterday.\"</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">She said,\" I cleaned the house    yesterday.\"</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">She said,\" I had cleaned the    house yesterday.\"</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">To convert indirect speech into    direct speech,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Past    perfect tense changes back to simple past tense.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,    'had cleaned' changes to 'cleaned'.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    subject 'She' changes to 'I'.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">'the    day before' changes back to 'yesterday'. </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Therefore,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    correct sentence is:</span></p>    <p style=\"orphans:0;widows:0\"> <span style=\"font-family:'Nirmala UI'\"><b>She    said,\" I cleaned the house yesterday.\"</b></span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Fill in the blanks:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">It    was not___ that he couldn't pay the bus___ to visit the    country____.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">fair, fare, fair</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">fare, fair, fair</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">fair, fair, fare</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">fare, fair, fare</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer: </span><span style=\"font-family:'Nirmala UI'\"><b>fair,    fare, fair.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    complete sentence:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It    was not </span><span style=\"font-family:'Nirmala UI'\"><b>fair</b></span><span style=\"font-family:'Nirmala UI'\"> that    he couldn't pay the bus </span><span style=\"font-family:'Nirmala UI'\"><b>fare</b></span><span style=\"font-family:'Nirmala UI'\"> to    visit the country </span><span style=\"font-family:'Nirmala UI'\"><b>fair</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    first part, 'It was not </span><span style=\"font-family:'Nirmala UI'\"><b>fair</b></span><span style=\"font-family:'Nirmala UI'\">' </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Here,    fair means Just, equitable, or right.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Second    part, 'pay the bus </span><span style=\"font-family:'Nirmala UI'\"><b>fare' </b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Here,     fare means the money paid for a journey on public transport.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">In    the third part, 'to visit the country </span><span style=\"font-family:'Nirmala UI'\"><b>fair</b></span><span style=\"font-family:'Nirmala UI'\">',    fair means an exhibition or carnival, often with stalls and    amusements.</span></p>", "question_heading": ""}, {"sr_no": 94, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">A. Consequently, the United    Nations' Sustainable Development Goal of reaching \"Zero    Hunger\" by 2030 appears increasingly out of reach.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">B.    Despite the planet producing more than enough food to feed every    individual, nearly one in eleven people still go to bed hungry    each night.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">C.    This systemic distribution failure is heavily exacerbated by    regional armed conflicts, severe climate shocks, and lingering    economic instability.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">D.    Global hunger remains one of the most persistent and devastating    humanitarian crises of the modern era.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A - B - C - D</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A - C - D - B</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">B - D - A - C</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">D - B - C - A</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking ents the opposing view (productivity gains and new jobs) to    the concerns mentioned in C.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence    B</b></span><span style=\"font-family:'Nirmala UI'\"> addresses the    need for policymakers to manage the ethical implications of this    evolution.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sentence    D</b></span><span style=\"font-family:'Nirmala UI'\"> Summarizes the    argument by stating the final impact depends on managing this    transition. </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,    the correct order of Jumbled up sentences is: </span><span style=\"font-family:'Nirmala UI'\"><b>C-    A - B - D</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Marie Curie was one of the most    accomplished scientists in history. Together with her husband,    Pierre, she discovered radium, an element widely used for treating    cancer, and studied uranium and other radioactive substances.    Pierre and Marie’s amicable collaboration later helped to unlock    the secrets of the atom. Marie was born in 1867 in Warsaw, Poland,    where her father was a professor of physics. At an early age, she    displayed a brilliant mind and a blithe personality. Her great    exuberance for learning prompted her to continue with her studies    after high school. She became disgruntled, however, when she    learned that the university in Warsaw was closed to women.    Determined to receive a higher education, she defiantly left    Poland and in 1891 entered the Sorbonne, a French university,    where she earned her master’s degree and doctorate in physics.    Marie was fortunate to have studied at the So let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
