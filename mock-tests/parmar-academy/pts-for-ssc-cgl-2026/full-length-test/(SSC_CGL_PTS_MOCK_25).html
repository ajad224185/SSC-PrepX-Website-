 " <p style=\"orphans:0;widows:0\">    apophatic</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>D) Apophatic</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Apophatic</b> refers to an approach that defines or understands    something through <b>negation, absence, or what cannot be said or    known</b>. In the sentence, freedom is described as “a rupture    from taxonomic legibility” and a departure from the compulsion    to be known. Therefore, <b>apophatic</b> best fits the idea of    freedom through refusing fixed definitions and established    categories.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Recuperative:</b> Intended to restore, recover, or bring     something back; contrary to the idea of rupture.      </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Regulatory:</b>     Intended to control or govern through rules; inconsistent with     the passage's rejection of normative structures.      </p>     </li><li><p style=\"orphans:0;widows:0\"><b>Valorized:</b> Regarded     as important, valuable, or worthy; does not fit the grammatical     or conceptual context.      </p>    </li></ul>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate option to substitute the underlined    segment in the given sentence</b>:</p>    <p style=\"orphans:0;widows:0\">It is high time the    administration <u>must pull up its socks and takes</u> the pending    reforms seriously.</p>", "option1": "<p style=\"orphans:0;widows:0\">    pulled up its socks and took</p>", "option2": " <p style=\"orphans:0;widows:0\">    should pull up its socks and take</p>", "option3": " <p style=\"orphans:0;widows:0\">    had pulled up its socks and taken</p>", "option4": " <p style=\"orphans:0;widows:0\">    pulls up its socks and takes</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>A) pulled up its socks and took</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The expression <b>“It is high time”</b> is followed by a verb    in the <b>simple past tense</b>, even though the action refers to    the present or immediate future. Therefore, <b>“pulled”</b>    and <b>“took”</b> are grammatically correct.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The original sentence incorrectly uses <b>“must pull”</b> and    <b>“takes”</b> after <i>It is high time</i>.</p>    <h3><a name=\"_3ulhimhwqrab\"></a>    <span><span style=\"font-size:13pt\"><b>Correct    Sentence:</b></span></span></h3>    <p style=\"orphans:0;widows:0;margin-top:0.17in\">“<i>It is    high time the administration </i><i><b>pulled up its socks and    took</b></i><i> the pending reforms seriously.”</i></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the option that expresses the given sentence in reported    speech.</b></p>    <p style=\"orphans:0;widows:0\">The soldier said to his fellow    soldiers, \"I have buried our brave comrade here.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The soldier told us that I had buried their brave comrade here.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The soldier told his fellow soldiers that I had buried our brave    comrade there.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The soldier told his fellow soldiers that he had buried their    brave comrade there.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The soldier told us that he had buried our brave comrade there.</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>C) The soldier told his fellow soldiers    that he had buried their brave comrade there.</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The reporting verb <b>“said to”</b> changes to <b>“told,”</b>    and the object <b>“his fellow soldiers”</b> is retained. Since    the reporting verb is in the past tense, <b>“have buried”</b>    changes to <b>“had buried.”</b> The pronoun <b>“I”</b>    changes to <b>“he,”</b> and <b>“our”</b> changes to    <b>“their.”</b> The adverb <b>“here”</b> changes to    <b>“there.”</b></p>    <p style=\"page-break-inside:auto;orphans:0;widows:0;margin-top:0.19in;page-break-after:auto\">    Correct Sentence: <i>“The soldier told his fellow soldiers that    </i><i><b>he had buried their brave comrade there</b></i><i>.”</i></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>A sentence is provided in indirect speech. From the four given    options, choose the one that most accurately conveys the sentence    in its corresponding direct speech.</b></p>    <p style=\"orphans:0;widows:0\">The professor remarked that    students needed to submit their papers before Friday.</p>", "option1": "<p style=\"orphans:0;widows:0\">    \"Students need to submit their papers before Friday,\"    the professor remarked.</p>", "option2": " <p style=\"orphans:0;widows:0\">    \"Students needed to submit their papers before Friday,\"    said the professor.</p>", "option3": " <p style=\"orphans:0;widows:0\">    \"Submit your papers before Friday,\" the professor    instructed.</p>", "option4": " <p style=\"orphans:0;widows:0\">    \"You were to submit your papers before Friday,\" said the    professor.</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>A) \"Students need to submit their    papers before Friday,\" the professor remarked.</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The indirect speech uses <b>“needed to submit”</b>, which is    the backshifted form of <b>“need to submit”</b> in direct    speech. Since the reporting verb <b>“remarked”</b> is in the    past tense, the original statement <b>“need”</b> is reported    as <b>“needed.”</b> The meaning and sentence structure are    best preserved in option A.</p>    <p style=\"page-break-inside:auto;orphans:0;widows:0;margin-top:0.19in;page-break-after:auto\">    Correct Direct Sentence: <i>“Students </i><i><b>need to submit</b></i><i>    their papers before Friday,” the professor remarked.</i></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Rearrange the following sentences to form a coherent paragraph:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. This    makes them ideal for tasks like image recognition, natural    language processing, and medical diagnostics.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2. Machine    learning is a subset of artificial intelligence that focuses on    the creation of algorithms that can learn from data without    explicit programming.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3. The    algorithm improves its performance by analyzing vast amounts of    input data and identifying underlying patterns.</b></p>    <p style=\"orphans:0;widows:0\"><b>4. Instead of being given a    set of rules, a machine learning model is trained on examples.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    2, 4, 3, 1</p>", "option2": " <p style=\"orphans:0;widows:0\">    4, 3, 2, 1</p>", "option3": " <p style=\"orphans:0;widows:0\">    3, 4, 2, 1</p>", "option4": " <p style=\"orphans:0;widows:0\">    2, 3, 4, 1</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>A) 2, 4, 3, 1</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    Sentence <b>2</b> introduces the topic by defining machine    learning. Sentence <b>4</b> explains how machine learning differs    from traditional programming, stating that models are trained on    examples rather than given explicit rules. Sentence <b>3</b>    logically follows by explaining how the algorithm learns from    those examples and improves its performance by identifying    patterns. Finally, sentence <b>1</b> describes the practical    applications that become possible because of these capabilities.</p>    <p style=\"page-break-inside:auto;orphans:0;widows:0;margin-top:0.19in;page-break-after:auto\">    Correct Order: <span><b>2 → 4 →    3 → 1</b></span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Rearrange the following sentences to form a coherent paragraph:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>1. This    stored water can be utilized for various domestic purposes such as    gardening, washing, and even drinking after proper treatment.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2. In    addition to conserving groundwater, it plays a crucial role in    mitigating urban flooding during heavy monsoons.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3.    Rainwater harvesting is a traditional yet highly relevant    technique used to collect and store rainwater runoff.</b></p>    <p style=\"orphans:0;widows:0\"><b>4. The collected precipitation    is typically gathered from rooftops or surface catchments and    directed through pipes into storage tanks</b>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    3, 1, 4, 2</p>", "option2": " <p style=\"orphans:0;widows:0\">    3, 4, 1, 2</p>", "option3": " <p style=\"orphans:0;widows:0\">    4, 3, 1, 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 3, 4, 2</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>B) 3, 4, 1, 2</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    Sentence <b>3</b> introduces the topic by defining <b>rainwater    harvesting</b>. Sentence <b>4</b> naturally follows by explaining    how the collected rainwater is gathered and stored. Sentence <b>1</b>    then explains how this stored water can be used for various    domestic purposes. Finally, sentence <b>2</b> highlights an    additional benefit of rainwater harvesting—<b>conserving    groundwater and reducing urban flooding</b>.</p>    <p style=\"page-break-inside:auto;orphans:0;widows:0;margin-top:0.19in;page-break-after:auto\">    Correct Order: <span><b>3 → 4 →    1 → 2</b></span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Choose the most suitable option to replace the highlighted part of    the sentence:</p>    <p style=\"orphans:0;widows:0\">You must prevent your brother <b>to    do such things</b>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    from doing such things</p>", "option2": " <p style=\"orphans:0;widows:0\">    of doing such things</p>", "option3": " <p style=\"orphans:0;widows:0\">    not to do such things</p>", "option4": " <p style=\"orphans:0;widows:0\">    doing such things</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>A) from doing such things</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The verb <b>“prevent”</b> is followed by the preposition    <b>“from”</b> and a gerund (<b>verb + -ing</b>). The correct    structure is <b>“prevent someone from doing something.”</b>    Therefore, “prevent your brother to do” is grammatically    incorrect and should be changed to “prevent your brother from    doing.”</p>    <h3><a name=\"_cw7ou2e50hz2\"></a>    <span><span style=\"font-size:13pt\"><b>Correct    Sentence:</b></span></span></h3>    <p style=\"orphans:0;widows:0;margin-top:0.17in\">“<i>You    must </i><i><b>prevent your brother from doing such things</b></i><i>.”</i></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0\">    <b>Which economic phenomenon refers to a situation where a    consumer's demand for a good increases simply because other people    are also buying or using that good?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Veblen effect</p>", "option2": " <p style=\"orphans:0;widows:0\">    Bandwagon effect</p>", "option3": " <p style=\"orphans:0;widows:0\">    Snob effect</p>", "option4": " <p style=\"orphans:0;widows:0\">    Substitution effect</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Bandwagon effect is an economic and psychological phenomenon    wherein the demand for a commodity increases as more people buy or    consume it, driven by a desire to follow popular trends or conform    to societal norms. In contrast, the Snob effect refers to a    decrease in demand as a commodity becomes widely consumed, while    the Veblen effect involves increased demand for high-priced goods    to display prestige.</p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0\">    <b>Earth observation satellites are primarily used for which of    the following purposes?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Monitoring environmental changes and natural resources</p>", "option2": " <p style=\"orphans:0;widows:0\">    Providing electricity directly to remote rural areas</p>", "option3": " <p style=\"orphans:0;widows:0\">    Controlling road traffic signals in major cities</p>", "option4": " <p style=\"orphans:0;widows:0\">    Measuring the temperature of the Earth's inner core</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Earth observation satellites collect valuable data and images of    the Earth's surface and atmosphere. They are primarily used for    monitoring natural resources, tracking environmental changes,    mapping land use, and managing disasters like floods and forest    fires.</p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following battles led to the establishment of the    Mughal Empire in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Battle of Khanwa</p>", "option2": " <p style=\"orphans:0;widows:0\">    Battle of Plassey</p>", "option3": " <p style=\"orphans:0;widows:0\">    First Battle of Panipat</p>", "option4": " <p style=\"orphans:0;widows:0\">    Battle of Chanderi</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The First Battle of Panipat was fought on 21 April 1526 between    Babur and Ibrahim Lodi, the Sultan of Delhi. Babur's victory in    this battle marked the end of the Lodi dynasty and the Delhi    Sultanate, thereby laying the foundation of the Mughal Empire in    India.</p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0\">    <b>Which pension scheme was launched by the Government of India in    2019 to provide an assured monthly pension of ₹3,000 to    unorganised sector workers after attaining the age of 60 years?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Pradhan Mantri Mudra Yojana (PMMY)</p>", "option2": " <p style=\"orphans:0;widows:0\">    Pradhan Mantri Shram Yogi Maan-dhan (PM-SYM)</p>", "option3": " <p style=\"orphans:0;widows:0\">    Pradhan Mantri Vaya Vandana Yojana (PMVVY)</p>", "option4": " <p style=\"orphans:0;widows:0\">    Stand-Up India Scheme</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Pradhan Mantri Shram Yogi Maan-dhan (PM-SYM) was launched in    February 2019 by the Ministry of Labour and Employment. It is a    voluntary and contributory pension scheme meant for old age    protection and social security of unorganised workers whose    monthly income is ₹15,000 or less, with an entry age between 18    and 40 years. Beneficiaries receive a minimum assured monthly    pension of ₹3,000 upon attaining 60 years of age.</p>", "question_heading": ""}, {"sr_no": 30, "question": "  <p style=\"orphans:0;widows:0\">    <b>An object is thrown vertically upwards with an initial velocity    of 20 m/s. What is the maximum height reached by the object? ( </b>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143436307_html_924eef4401015b4c.gif\" > <b>)</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    10 m</p>", "option2": " <p style=\"orphans:0;widows:0\">    20 m</p>", "option3": " <p style=\"orphans:0;widows:0\">    30 m</p>", "option4": " <p style=\"orphans:0;widows:0\">    40 m</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Using the third equation of motion under gravity:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143436307_html_b3633d6c9296ab41.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    At maximum height, final velocity     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143436307_html_23360c8576739a76.gif\" > .</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Given:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143436307_html_3e9b511461701a5a.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143436307_html_924eef4401015b4c.gif\" > .</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143436307_html_d22bbf85b77f94f0.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143436307_html_34cb46d7117dd081.gif\" > .</p>    <p style=\"orphans:0;widows:0\">Therefore, the    maximum height reached is 20 m.</p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0\">    <b>The Chhatrapati Shivaji Maharaj Terminus in Mumbai, designed by    Frederick William Stevens, is an outstanding example of which of    the following architectural styles?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Neo-Classical</p>", "option2": " <p style=\"orphans:0;widows:0\">    Victorian Gothic Revival</p>", "option3": " <p style=\"orphans:0;widows:0\">    Romanesque Revival</p>", "option4": " <p style=\"orphans:0;widows:0\">    Rococo</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Chhatrapati Shivaji Maharaj Terminus (formerly Victoria    Terminus) in Mumbai was designed by the British architect    Frederick William Stevens. Built between 1878 and 1887, it is    recognized as a UNESCO World Heritage Site and represents an    exceptional example of Victorian Gothic Revival architecture    blended with traditional Indian architectural elements.</p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following pigment molecules forms the core    reaction centre in the photosystems of green plants?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Carotenoid</p>", "option2": " <p style=\"orphans:0;widows:0\">    Chlorophyll b</p>", "option3": " <p style=\"orphans:0;widows:0\">    Chlorophyll a</p>", "option4": " <p style=\"orphans:0;widows:0\">    Xanthophyll</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In photosynthetic units (photosystems), hundreds of accessory    pigments like chlorophyll b, carotenoids, and xanthophylls form    the light-harvesting antenna complex. However, the core reaction    centre is always formed by a single molecule of chlorophyll a. In    Photosystem I (PS I), this reaction centre has an absorption peak    at 700 nm (P700), whereas in Photosystem II (PS II), it absorbs    maximally at 680 nm (P680).</p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0\">    <b>In which year did India host the Asian Games for the second    time?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1978</p>", "option2": " <p style=\"orphans:0;widows:0\">    1982</p>", "option3": " <p style=\"orphans:0;widows:0\">    1986</p>", "option4": " <p style=\"orphans:0;widows:0\">    1990</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    India has hosted the Asian Games twice, both times in New Delhi.    The inaugural edition was hosted in 1951, and the second time    India hosted the Games was in 1982 (the 9th edition of the Asian    Games).</p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following statements is correct regarding the    'Uniform Civil Code' in India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    It is classified as a Fundamental Right under Part III of the    Constitution.</p>", "option2": " <p style=\"orphans:0;widows:0\">    It is a Directive Principle of State Policy contained in Article    44 under Part IV.</p>", "option3": " <p style=\"orphans:0;widows:0\">    It is directly enforceable by courts under Article 32 of the    Constitution.</p>", "option4": " <p style=\"orphans:0;widows:0\">    It applies exclusively to procedures related to criminal offenses.</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Article 44 of the Indian Constitution, placed under Part IV    (Directive Principles of State Policy), directs the State to    endeavour to secure for the citizens a Uniform Civil Code    throughout the territory of India. As per Article 37, the    provisions contained in Part IV are non-justiciable and cannot be    directly enforced by any court.</p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Indian wrestler recently won the silver medal at the    Under-20 World Wrestling Championships?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Tanvi Gundesh Magdum</p>", "option2": " <p style=\"orphans:0;widows:0\">    Komal</p>", "option3": " <p style=\"orphans:0;widows:0\">    Kajal Dhochhak</p>", "option4": " <p style=\"orphans:0;widows:0\">    Mansi Lather</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Mansi Lather won the <b>silver medal in the 68 kg category</b> at    the Under-20 World Wrestling Championships held in <b>Slovakia</b>.</p>    <p style=\"orphans:0;widows:0\">In the gold-medal    bout, Mansi lost <b>1–2 to China’s Chenling Song</b> in a    closely contested match.</p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0\">    <b>'Yakshagana' is a traditional folk theatre dance form    predominantly associated with which of the following Indian    states?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Kerala</p>", "option2": " <p style=\"orphans:0;widows:0\">    Karnataka</p>", "option3": " <p style=\"orphans:0;widows:0\">    Tamil Nadu</p>", "option4": " <p style=\"orphans:0;widows:0\">    Andhra Pradesh</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Yakshagana is a traditional folk theatre and dance form that    originated in the coastal and Malenadu regions of Karnataka. It    combines dance, music, dialogue, elaborate costumes, and makeup to    depict stories primarily from Hindu epics such as the Ramayana and    Mahabharata.</p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding petroleum reserves    in India:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Digboi, Naharkatiya, and Moran-Hugrijan are major    oil-producing areas located in Assam.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. Mangala, Bhagyam, and Aishwarya are prominent onshore    oilfields located in the Krishna-Godavari basin.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both 1 and 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statement 1 is correct: Digboi, Naharkatiya, and Moran-Hugrijan    are major oilfields located in the Brahmaputra Valley of Assam.    Digboi is India's oldest operating oilfield and refinery.</p>    <p style=\"orphans:0;widows:0\">Statement 2 is    incorrect: Mangala, Bhagyam, and Aishwarya (MBA) are significant    onshore oilfields situated in the Barmer basin of Rajasthan, not    in the Krishna-Godavari basin.</p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>With reference to the rural-urban continuum and the peri-urban    interface, consider the following statements:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. The rural-urban fringe is a dynamic zone of transition    characterized by rapidly changing land-use patterns and mixed    rural-urban lifestyles.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. The concept of the 'rural-urban continuum' rejects the rigid    dichotomy between rural and urban settlements, proposing instead a    gradual and continuous socio-spatial transition.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. Circular migration between rural and urban areas generally    leads to a complete severance of rural ties and an immediate    cessation of inter-regional remittance flows.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 and 2 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 and 3 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    1 and 3 only</p>", "option4": " <p style=\"orphans:0;widows:0\">    1, 2 and 3</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Statements 1 and 2 are correct. The rural-urban fringe is the    transition zone surrounding a city where urban and rural land uses    intermingle and change rapidly due to urban expansion. The concept    of the 'rural-urban continuum' (formalized by Robert Redfield and    others) emphasizes that rural and urban areas are not mutually    exclusive, isolated categories, but rather exist along a    continuous spectrum of social, economic, and geographic traits.    Statement 3 is incorrect because circular (or seasonal) migration    is characterized by strong persistent linkages, frequent visits,    and sustained financial remittances sent back to rural households,    strengthening rather than severing rural-urban ties.</p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Consider the following statements regarding volcanoes:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. The 'Ring of Fire' around the Pacific Ocean basin accounts    for the majority of the Earth's active volcanoes.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. Narcondam Island in the Andaman Sea is India's only active    volcano.</b></p>    <p style=\"orphans:0;widows:0\"><b>Which of the    statements given above is/are correct?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    1 only</p>", "option2": " <p style=\"orphans:0;widows:0\">    2 only</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both 1 and 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Statement 1 is correct: The 'Ring of Fire' (Circum-Pacific Belt)    is a major area in the basin of the Pacific Ocean where many    volcanic eruptions and earthquakes occur. It contains    approximately 75% of the world's active volcanoes.</p>    <p style=\"orphans:0;widows:0\">Statement 2 is    incorrect: Barren Island, located in the Andaman and Nicobar    Islands, is the only confirmed active volcano in India (and South    Asia). Narcondam Island is classified as a dormant volcanic    island.</p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following is the oldest of the four Vedas?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Yajurveda</p>", "option2": " <p style=\"orphans:0;widows:0\">    Samaveda</p>", "option3": " <p style=\"orphans:0;widows:0\">    Rigveda</p>", "option4": " <p style=\"orphans:0;widows:0\">    Atharvaveda</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Rigveda is the oldest of the four Vedas. It is a collection of    1,028 Vedic Sanskrit hymns (suktas) divided into 10 books called    Mandalas.</p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0\">    <b>In an official match of Water Polo, how many players from each    team are in the pool at any one time during play?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    6</p>", "option2": " <p style=\"orphans:0;widows:0\">    7</p>", "option3": " <p style=\"orphans:0;widows:0\">    8</p>", "option4": " <p style=\"orphans:0;widows:0\">    5</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In an official Water Polo match, each team has seven players in    the pool at any one time, consisting of six field players and one    goalkeeper.</p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following British legislative Acts abolished the    commercial monopoly of the East India Company in India, except for    the trade in tea and trade with China?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Regulating Act of 1773</p>", "option2": " <p style=\"orphans:0;widows:0\">    Pitt's India Act of 1784</p>", "option3": " <p style=\"orphans:0;widows:0\">    Charter Act of 1813</p>", "option4": " <p style=\"orphans:0;widows:0\">    Charter Act of 1833</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    The Charter Act of 1813 deprived the East India Company of its    commercial monopoly in India, opening up Indian trade to all    British merchants. However, the Company's monopoly over the trade    in tea and trade with China was retained for another twenty years,    which was later completely abolished by the Charter Act of 1833.</p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0\">    <b>Who among the following is the author of the book 'Early    Indians: The Story of Our Ancestors and Where We Came From'?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Ramachandra Guha</p>", "option2": " <p style=\"orphans:0;widows:0\">    Tony Joseph</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sanjeev Sanyal</p>", "option4": " <p style=\"orphans:0;widows:0\">    Devdutt Pattanaik</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    'Early Indians: The Story of Our Ancestors and Where We Came From'    is written by journalist Tony Joseph and was published in 2018.    The book explores the prehistoric origins and migrations that    shaped the demographic composition of the Indian subcontinent    using genetic and archaeological evidence.</p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Which of the following statements is/are correct regarding the    Indian Olympic Association (IOA)?</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1) The Indian Olympic Association was officially established in    the year 1927.</b></p>    <p style=\"orphans:0;widows:0\"><b>2) Sir Dorabji    Tata served as its first President.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only 1</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only 2</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both 1 and 2</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither 1 nor 2</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Both statements 1 and 2 are correct.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    1. The Indian Olympic Association (IOA) was formally established    in 1927 to promote Olympic sports and select Indian athletes for    the Olympic Games.</p>    <p style=\"orphans:0;widows:0\">2. Sir Dorabji    Tata, a pioneering industrialist and sports patron who earlier    financed the Indian contingent for the 1920 Antwerp Olympics, was    appointed as the founding President of the IOA, while Dr. A. G.    Noehren became its first Secretary-General.</p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0\">    <b>Which of the following is NOT an All India Service under the    Constitution of India?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Indian Administrative Service</p>", "option2": " <p style=\"orphans:0;widows:0\">    Indian Foreign Service</p>", "option3": " <p style=\"orphans:0;widows:0\">    Indian Police Service</p>", "option4": " <p style=\"orphans:0;widows:0\">    Indian Forest Service</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Under Article 312 of the Constitution of India, there are only    three All India Services (AIS):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Indian Administrative Service (IAS)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Indian Police Service (IPS)</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Indian Forest Service (IFS) — established in 1966</p>    <p style=\"orphans:0;widows:0\">The Indian    Foreign Service (IFS) is a Central Civil Service (Group 'A'), not    an All India Service, as its officers work under the Union    Government (Ministry of External Affairs) and are not allotted to    state cadres.</p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0\">    <b>Who gave the famous slogan \"Do or Die\" during the    Quit India Movement in 1942?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Subhas Chandra Bose</p>", "option2": " <p style=\"orphans:0;widows:0\">    Mahatma Gandhi</p>", "option3": " <p style=\"orphans:0;widows:0\">    Jawaharlal Nehru</p>", "option4": " <p style=\"orphans:0;widows:0\">    Bal Gangadhar Tilak</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    Mahatma Gandhi gave the historic call of \"Do or Die\"    (Karo ya Maro) in his speech delivered at the Gowalia Tank Maidan    in Bombay on 8 August 1942, marking the launch of the Quit India    Movement.</p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0\">    <b>During the first phase of the Green Revolution in India    (mid-1960s to mid-1970s), the adoption of High Yielding Variety    (HYV) seeds was primarily concentrated in and benefited the    cultivation of which crop?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Pulses</p>", "option2": " <p style=\"orphans:0;widows:0\">    Wheat</p>", "option3": " <p style=\"orphans:0;widows:0\">    Oilseeds</p>", "option4": " <p style=\"orphans:0;widows:0\">    Millets</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    During the first phase of the Green Revolution (mid-1960s to    mid-1970s), the High Yielding Variety (HYV) seed technology was    primarily concentrated in affluent agricultural states (like    Punjab, Haryana, and western Uttar Pradesh) and was largely    restricted to wheat cultivation. The unprecedented surge in wheat    output during this period was so notable that the movement was    initially referred to as the 'Wheat Revolution'. Other crops like    rice, pulses, and oilseeds were incorporated more extensively only    in the second phase (mid-1970s to mid-1980s).</p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0\">    <b>In the context of the New Economic Policy of 1991 in India,    what does the letter 'L' stand for in the acronym 'LPG'?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Liquidity</p>", "option2": " <p style=\"orphans:0;widows:0\">    Liberalisation</p>", "option3": " <p style=\"orphans:0;widows:0\">    Legislation</p>", "option4": " <p style=\"orphans:0;widows:0\">    Licensing</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    In the New Economic Policy introduced in July 1991, LPG stands for    Liberalisation, Privatisation, and Globalisation. Therefore, the    letter 'L' stands for Liberalisation, which aimed to end the    license-permit raj and remove unnecessary trade and industrial    restrictions.</p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0\">    <b>Who will organise the ‘Khelo India Samvad – Khel Ki Baat PM    Ke Saath’ programme?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Ministry of Youth Affairs and Sports</p>", "option2": " <p style=\"orphans:0;widows:0\">    Sports Authority of India</p>", "option3": " <p style=\"orphans:0;widows:0\">    Mera Yuva Bharat</p>", "option4": " <p style=\"orphans:0;widows:0\">    NITI Aayog</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The <b>‘Khelo India Samvad – Khel Ki Baat PM Ke Saath’</b>    programme will be organised by <b>Mera Yuva Bharat (MY Bharat)</b>.</p>    <p style=\"orphans:0;widows:0\">As part of the    <b>National Sports Day 2026</b> celebrations, Prime Minister    <b>Narendra Modi</b> will address young people through <b>video    conferencing</b>.</p>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"orphans:0;widows:0\">    <b>Which Article of the Constitution of India empowers the    President to grant pardons and to suspend, remit, or commute    sentences in certain cases?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Article 72</p>", "option2": " <p style=\"orphans:0;widows:0\">    Article 74</p>", "option3": " <p style=\"orphans:0;widows:0\">    Article 76</p>", "option4": " <p style=\"orphans:0;widows:0\">    Article 78</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Article 72 of the Constitution of India empowers the President to    grant pardons, reprieves, respites, or remissions of punishment,    or to suspend, remit, or commute the sentence of any person    convicted of any offence in all cases where the punishment or    sentence is by a Court Martial, where it is for an offence against    a Union law, or where the sentence is a sentence of death.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Other relevant Articles:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Article 74: Council of Ministers to aid and advise the President.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Article 76: Attorney-General for India.</p>    <p style=\"orphans:0;widows:0\">Article 78:    Duties of the Prime Minister in furnishing information to the    President.</p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"orphans:0;widows:0\">    <b>In a club of 140 members, 28 members do not like either tea or    coffee. 75 members like tea and 62 members like coffee. How many    members like coffee only?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    32</p>", "option2": " <p style=\"orphans:0;widows:0\">    37</p>", "option3": " <p style=\"orphans:0;widows:0\">    42</p>", "option4": " <p style=\"orphans:0;widows:0\">    25</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Total number of members = 140</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Number of members who do not like either drink = 28</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Number of members who like at least one drink =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_acfb7703ad616abe.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Using the principle of inclusion-exclusion:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_b04c80e539fd009c.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_e76ab3e7df2a88a4.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_2becd0e3dbe62366.gif\" > </p>    <p style=\"orphans:0;widows:0\">Therefore, the    number of members who like coffee only =     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_5761a2dd2ded520d.gif\" > .</p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the letter-cluster from among the given options that can    replace the question mark (?) in the following series.</b></p>    <p style=\"orphans:0;widows:0\"><b>BRIGHT,    RIGHTB, IGHTRB, ?, HTGIRB, THGIRB</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    GHTRIB</p>", "option2": " <p style=\"orphans:0;widows:0\">    GHTIBR</p>", "option3": " <p style=\"orphans:0;widows:0\">    GHTIRB</p>", "option4": " <p style=\"orphans:0;widows:0\">    GHITRB</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed in the given series is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In each successive step, the first letter of the cluster is moved    towards the end, gradually reversing the word from right to left:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    BRIGHT <span>→</span> 'B' moves to the 6th    (last) position <span>→</span> RIGHTB</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    RIGHTB <span>→</span> 'R' moves to the 5th    position (just before 'B') <span>→</span>    IGHTRB</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    IGHTRB <span>→</span> 'I' moves to the 4th    position (just before 'R') <span>→</span>    GHTIRB</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    GHTIRB <span>→</span> 'G' moves to the 3rd    position (just before 'I') <span>→</span>    HTGIRB</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    HTGIRB <span>→</span> 'H' moves to the 2nd    position (just before 'G') <span>→</span>    THGIRB</p>    <p style=\"orphans:0;widows:0\">Therefore, the    missing term is GHTIRB.</p>", "question_heading": ""}, {"sr_no": 53, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct option that indicates the arrangement of the    given words in the order in which they appear in an English    dictionary.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>1. Deliver</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>2. Delinquent</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>3. Delicate</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>4. Delicious</b></p>    <p style=\"orphans:0;widows:0\"><b>5. Delightful</b></p>", "option1": "<p style=\ ding": ""}, {"sr_no": 57, "question": " <p style=\"orphans:0;widows:0\">    <b>In a certain code language, 'SILVER' is written as 'IVEORH'.    How will 'GOLDEN' be written in that language?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    TLOWVM</p>", "option2": " <p style=\"orphans:0;widows:0\">    MVOWLT</p>", "option3": " <p style=\"orphans:0;widows:0\">    MVWOLT</p>", "option4": " <p style=\"orphans:0;widows:0\">    MVOLWT</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern involves taking the opposite letter of each character    (sum of positional values = 27) and then reversing the entire    sequence:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    For 'SILVER':</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Opposite letters of S, I, L, V, E, R are H, R, O, E, V, I    respectively.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Reversing the order of these opposite letters gives: I, V, E, O,    R, H <span>→</span> 'IVEORH'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Applying the same logic to 'GOLDEN':</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Opposite letters of G, O, L, D, E, N are T, L, O, W, V, M    respectively.</p>    <p style=\"orphans:0;widows:0\">Reversing the    order gives: M, V, W, O, L, T <span>→</span>    'MVWOLT'.</p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"orphans:0;widows:0\">    <b>In a certain code language, ‘su la pe’ means ‘books are    old’, ‘pe ti mo’ means ‘old is gold’, and ‘la ti ke’    means ‘books is cheap’. What is the code for ‘gold’ in    that language?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    ti</p>", "option2": " <p style=\"orphans:0;widows:0\">    pe</p>", "option3": " <p style=\"orphans:0;widows:0\">    mo</p>", "option4": " <p style=\"orphans:0;widows:0\">    ke</p>", "answer": "3", "negativ ven, out of which three are    alike in some manner and one is different. Select the one that is    different.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    DGT</p>", "option2": " <p style=\"orphans:0;widows:0\">    NQL</p>", "option3": " <p style=\"orphans:0;widows:0\">    JMN</p>", "option4": " <p style=\"orphans:0;widows:0\">    TWD</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    1. 1st letter + 3 = 2nd letter</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    2. 2nd letter and 3rd letter are opposite letters (sum of their    positional values is     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_a1a003ac6727581d.gif\" > )</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Checking the options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    1) DGT: D (4) + 3 = G (7); G (7) and T (20) are opposite letters    as     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_a17154c3cc3eade7.gif\" > .</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    2) NQL: N (14) + 3 = Q (17); Q (17) and L (12) are not opposite    letters as     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_30061f995abb5a0a.gif\" >     (the opposite of Q is J).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    3) JMN: J (10) + 3 = M (13); M (13) and N (14) are opposite    letters as     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_379e424cd7155d49.gif\" > .</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    4) TWD: T (20) + 3 = W (23); W (23) and D (4) are opposite letters    as     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_aa8bc3f788b9a38d.gif\" > .</p>    <p style=\"orphans:0;widows:0\">Hence, NQL is the    different letter-cluster.</p>", "question_heading": ""}, {"sr_no": 61, "question": "  <p style=\"orphans:0;widows:0\">    <b>Using the reverse alphabetical code (where </b>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_2b65d9e04577c3c5.gif\" > <b>    to </b>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_b86f3598adae906c.gif\" > <b>),    what is the sum of the reverse positional values of all the vowels    in the word \"EDUCATION\"?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    78</p>", "option2": " <p style=\"orphans:0;widows:0\">    84</p>", "option3": " <p style=\"orphans:0;widows:0\">    82</p>", "option4": " <p style=\"orphans:0;widows:0\">    88</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    In the reverse alphabetical order (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_2b65d9e04577c3c5.gif\" >     to     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_b86f3598adae906c.gif\" > ),    the reverse rank of any letter is given by     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_7b68c5dd6bd1aaba.gif\" > .</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The vowels in the word EDUCATION are E, U, A, I, and O.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Their forward and reverse positional values are:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    E: Forward = 5     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_605f329b16caeae6.gif\" >     Reverse =     <img src=\"https://static-ap , Rajasthan    - 302017</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Brig. R. S. Rathor, 508-C, Gulmohar Avenue, Malviya Nagar, Jaipur,    Rajasthan - 302017</p>", "option2": " <p style=\"orphans:0;widows:0\">    Brig. R. S. Rathore, 508-C, Gulmohor Avenue, Malviya Nagar,    Jaipur, Rajasthan - 302017</p>", "option3": " <p style=\"orphans:0;widows:0\">    Brig. R. S. Rathore, 508-C, Gulmohar Avenue, Malviya Nagar,    Jaipur, Rajasthan - 302017</p>", "option4": " <p style=\"orphans:0;widows:0\">    Brig. R. S. Rathore, 508-C, Gulmohar Avenue, Malviya Nagar,    Jaipur, Rajasthan - 302071</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    On comparing the given address with all the options:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • In Option A, 'Rathore' is misspelled as 'Rathor'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • In Option B, 'Gulmohar' is misspelled as 'Gulmohor'.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    • In Option D, the PIN code is incorrectly written as '302071'    instead of '302017'.</p>    <p style=\"orphans:0;widows:0\">Hence, only    Option C matches the given address exactly in every detail.</p>", "question_heading": ""}, {"sr_no": 63, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Read the given statements and conclusions carefully. Assuming    the given statements to be true, decide which of the given    conclusions is/are definitely true.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Statements: </b>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_45f365eaf3ca919b.gif\" > <b>,T    &lt; U </b><span><b>≤</b></span><b> Z</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Conclusion I </b>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_e6401f504b33a6c.gif\" > </p>    <p style=\"orphans:0;widows:0\"><b>Conclusion II:    </b>    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_179436b1a6f9e234.gif\" > </p>", "option1": "<p style=\"orphans:0;widows:0\">    Only Conclusion I is true</p>", "option2": " <p style=\"orphans:0;widows:0\">    Only Conclusion II is true</p>", "option3": " <p style=\"orphans:0;widows:0\">    Both Conclusion I and Conclusion II are true</p>", "option4": " <p style=\"orphans:0;widows:0\">    Neither Conclusion I nor Conclusion II is true</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Given statements:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_45f365eaf3ca919b.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_2c92c38b27ef65ea.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    1. For Conclusion I (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_e6401f504b33a6c.gif\" > ):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    From     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_fe991bad2e0ba381.gif\" > ,    the common relationship between     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_e8b1350f591e8eaf.gif\" >     and     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_7d44a705941c7d34.gif\" >     gives     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_e6401f504b33a6c.gif\" > .    Hence, Conclusion I is definitely true.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    2. For Conclusion II (<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_179436b1a6f9e234.gif\" > ):</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    From     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_45f365eaf3ca919b.gif\" > ,    we have     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_2abf52cf68e8926e.gif\" > .    Therefore,     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_179436b1a6f9e234.gif\" >     is definitely false.</p>    <p style=\"orphans:0;widows:0\">Thus, only    Conclusion I is true.</p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>16 is related to 240 following a certain logic. Following the    same logic, 22 is related to 462. To which of the following is 18    related, following the same logic?</b></p>    <p style=\"orphans:0;widows:0\"><b>(NOTE:    Operations should be performed on the whole numbers, without    breaking down the numbers into its constituent digits. E.g., 13 –    Operations on 13 such as adding/subtracting/multiplying etc. to 13    can be performed. Breaking down 13 into 1 and 3 and then    performing mathematical operations on 1 and 3 is not allowed)</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    342</p>", "option2": " <p style=\"orphans:0;widows:0\">    288</p>", "option3": " <p style=\"orphans:0;widows:0\">    306</p>", "option4": " <p style=\"orphans:0;widows:0\">    324</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_53ef72d7ce2b1b48.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    For 16:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_fbe98efeb077fcf3.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    For 22:     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_5ca6a6f3e5225101.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    Similarly, for 18:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    ​<img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_710cff97f433f440.gif\" > </p>    <p style=\"orphans:0;widows:0\">Therefore, 306 is    the correct answer.</p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Three of the following four number-pairs are alike in a certain    way and one is different. Select the number-pair that is    different.</b></p>    <p style=\"orphans:0;widows:0\"><b>(NOTE:    Operations should be performed on the whole numbers, without    breaking down the numbers into its constituent digits. E.g., 13 –    Operations on 13 such as adding/subtracting/multiplying etc., to    13 can be performed. Breaking down 13 into 1 and 3 and then    performing mathematical operations on 1 and 3 is not allowed.)</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    14 : 51</p>", "option2": " <p style=\"orphans:0;widows:0\">    18 : 67</p>", "option3": " <p style=\"orphans:0;widows:0\">    16 : 61</p>", "option4": " <p style=\"orphans:0;widows:0\">    21 : 79</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    The pattern followed here is:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    First number × 4 - 5 = Second number</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    14 : 51 <span>→</span>     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_73354f548890e39b.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    18 : 67 <span>→</span>     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_7bcf77f6436ccf36.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    21 : 79 <span>→</span>     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_c2489b753d7056f5.gif\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    16 : 61 <span>→</span>     <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_b080aa144c4721.gif\" > </p>    <p style=\"orphans:0;widows:0\">Hence, '16 : 61'    is the odd number-pair.</p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In a certain code language,</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>'A + B' means 'A is the brother of B',</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>'A − B' means 'A is the daughter of B',</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>'A × B' means 'A is the husband of B', and</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>'A ÷ B' means 'A is the sister of B'.</b></p>    <p style=\"orphans:0;widows:0\"><b>Based on the    above, how is M related to Q in the expression 'M + N − O × P ÷    Q'?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Brother</p>", "option2": " <p style=\"orphans:0;widows:0\">    Nephew</p>", "option3": " <p style=\"orphans:0;widows:0\">    Uncle</p>", "option4": " <p style=\"orphans:0;widows:0\">    Son</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    From the given expression 'M + N − O × P ÷ Q':</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">1. M + N <span>→</span>    M is the brother of N (M is male).</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">2. N − O <span>→</span>    N is the daughter of O.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">3. O × P <span>→</span>    O is the husband of P, which means P is the wife of O (female).    Thus, O and P are the parents of N and M, making M the son of P.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">4. P ÷ Q <span>→</span>    P is the sister of Q.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_6d503dac97a64c82.gif\" > </p>    <p style=\"orphans:0;widows:0\">Since M is the son of Q's sister    P, M is the nephew of Q. Hence, the correct option is Nephew.</p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Times New Roman'\"><span style=\"font-family:'Nirmala UI'\"><b>Read    the given statements and conclusions carefully. Assuming that the    information given in the statements is true, even if<br> it    appears to be at variance with commonly known facts, decide which    of the given conclusions logically follow(s) from    the<br> statements.<br> Statements:</b></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>All wires are chargers.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Some chargers are phones.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>All chargers are equipment</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Conclusions:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>I. Some equipment are phones.</b></p>    <p style=\"orphans:0;widows:0\"><b>II. All wires    are phones.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Only conclusion (II) follows.</p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Both conclusions (I) and (II) follow.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Only conclusion (I) follows.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Neither conclusion (I) nor (II) follows.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    From the Venn diagram</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1789143494942_html_1c6fc0885a847926.png\" width=\"375\" height=\"149\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Times New Roman'\"><span style=\"font-family:'Nirmala UI'\">Since    all chargers are equipment and some of those chargers are phones,    it directly follows that the overlapping group of chargers/phones    is also included within equipment. Therefore, Conclusion I    logically follows.</span></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Times New Roman'\"><span style=\"font-family:'Nirmala UI'\">The    relationship between chargers and phones is only partial (\"some\").    A partial overlap between chargers and phones does not guarantee    that every wire falls inside the phone category. Wires could be    entirely separate from phones. Therefore, Conclusion II does not    follow.</span></span></p>", "question_heading": ""}, {"sr_no": 68, "question": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Times New Roman'\"><span style=\"font-family:'Nirmala UI'\"><b>Study    the given matrix carefully and select the number from among the    given options that can replace the question mark(?) in it.</b></span></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>    <table>     <col>      <col> let currentQuestion = 0;
