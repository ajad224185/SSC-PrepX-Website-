<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>49.) SSC CGL PTS  MOCK 25 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

"orphans:0;widows:0\">    To act recklessly without considering future consequences</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in\">    The correct option is <b>A) To endure severe criticism, harsh    treatment, or an ordeal</b>.<b><br> Run the gauntlet</b> means to    go through a difficult or unpleasant experience, especially one    involving severe criticism, attacks, or harsh treatment.</p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate antonym of the given word.</b></p>    <p style=\"orphans:0;widows:0\"><b>Vindicate</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Condemn</p>", "option2": " <p style=\"orphans:0;widows:0\">    Justify</p>", "option3": " <p style=\"orphans:0;widows:0\">    Defend</p>", "option4": " <p style=\"orphans:0;widows:0\">    Exonerate</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>A) Condemn</b>.<b><br> Vindicate</b>    means to clear someone of blame, guilt, or suspicion and prove    that they are right or innocent.<br> <b>Condemn</b> means to    declare someone guilty, blameworthy, or deserving of punishment,    making it the appropriate antonym.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Justify:</b> To show or prove that someone or something is     reasonable, right, or justified (synonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Defend:</b>     To protect someone from blame, criticism, or attack (synonym).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Exonerate:</b> To     officially clear someone from blame or guilt (synonym).</p>    </li></ul>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0\">    <b>Select the INCORRECTLY spelt word.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Convalescence</p>", "option2": " <p style=\"orphans:0;widows:0\">    Connoisseur</p>", "option3": " <p style=\"orphans:0;widows:0\">    Surveillance</p>", "option4": " <p style=\"orphans:0;widows:0\">    Idiosyncracy</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>D) Idiosyncracy</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct spelling is <b>Idiosyncrasy</b>, not    <i>Idiosyncracy</i>.<br> <b>Idiosyncrasy</b> means a distinctive    or peculiar characteristic, habit, or behavior of an individual.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Convalescence:</b> The period of recovery after an illness or     medical treatment.      </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Surveillance:</b>     Close observation or monitoring of a person, place, or activity.      </p>     </li><li><p style=\"orphans:0;widows:0\"><b>Connoisseur:</b> An     expert or knowledgeable person, especially in matters of art,     food, or taste.      </p>    </li></ul>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the option with the correct spelling to complete the    given sentence.</b></p>    <p style=\"orphans:0;widows:0\"><b>The forensic investigator used    the phenomenon of __________ to detect latent traces at the crime    scene</b>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Flourescence</p>", "option2": " <p style=\"orphans:0;widows:0\">    Fluorescence</p>", "option3": " <p style=\"orphans:0;widows:0\">    Fluoresence</p>", "option4": " <p style=\"orphans:0;widows:0\">    Flouresence</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>B) Fluorescence</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Fluorescence</b> is the emission of light by a substance after    it absorbs electromagnetic radiation, often used in forensic    investigations to detect latent traces or substances at a crime    scene.<br> The correct spelling is <b>Fluorescence</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Flourescence:</b> Incorrect spelling; the letters <b>“uo”</b>     are misplaced.      </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Fluoresence:</b>     Incorrect spelling; it is missing the <b>“c”</b> before     “ence.”      </p>     </li><li><p style=\"orphans:0;widows:0\"><b>Flouresence:</b>     Incorrect spelling; both the vowel sequence and <b>“c”</b>     are incorrect.      </p>    </li></ul>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate one-word substitute for the given    group of words<b>: 'A person who practices severe self-discipline    and abstains from all forms of physical and worldly pleasures,    typically for spiritual reasons.'</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Sybarite</p>", "option2": " <p style=\"orphans:0;widows:0\">    Hedonist</p>", "option3": " <p style=\"orphans:0;widows:0\">    Ascetic</p>", "option4": " <p style=\"orphans:0;widows:0\">    Epicure</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>C) Ascetic</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Ascetic</b> refers to a person who practices severe    self-discipline and deliberately abstains from physical, material,    and worldly pleasures, usually for spiritual or religious reasons.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Sybarite:</b> A person who is devoted to luxury, comfort, and     sensual pleasures (antonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Hedonist:</b>     A person who believes that pleasure is the most important goal in     life (antonym).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Epicure:</b> A person who     has refined tastes, especially in food and drink, and enjoys     luxury and pleasure.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate option to fill in the blank</b>:</p>    <p style=\"orphans:0;widows:0\">The committee interviewed five    leading environmentalists, all of _________ recommendations were    incorporated into the final policy draft.</p>", "option1": "<p style=\"orphans:0;widows:0\">    whom</p>", "option2": " <p style=\"orphans:0;widows:0\">    whose</p>", "option3": " <p style=\"orphans:0;widows:0\">    their</p>", "option4": " <p style=\"orphans:0;widows:0\">    which</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>B) whose</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Whose</b> is a possessive relative pronoun used to indicate    ownership or association. Here, the <b>recommendations</b> belong    to the five environmentalists, so <b>whose</b> is grammatically    correct.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Correct Sentence:</b>“The committee interviewed five leading    environmentalists, all of <b>whose</b> recommendations were    incorporated into the final policy draft.”</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Whom:</b> Used as the object of a verb or preposition; does     not indicate possession.      </p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Their:</b>     A possessive pronoun, but it cannot properly introduce the     relative clause after <b>“all of.”</b>      </p>     </li><li><p style=\"orphans:0;widows:0\"><b>Which:</b> Refers to     things or animals and does not indicate possession here.      </p>    </li></ul>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate option to fill in the blank:</b></p>    <p style=\"orphans:0;widows:0\">The young diplomat’s ______    nature and complete lack of artifice made him appear naive in the    cynical world of international politics.</p>", "option1": "<p style=\"orphans:0;widows:0\">    ingenious</p>", "option2": " <p style=\"orphans:0;widows:0\">    ingenuous</p>", "option3": " <p style=\"orphans:0;widows:0\">    indigenous</p>", "option4": " <p style=\"orphans:0;widows:0\">    indigent</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>B) Ingenuous</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Ingenuous</b> means innocent, sincere, and free from deceit or    artificiality. In the sentence, the diplomat’s sincere and    unaffected nature made him appear naive in the cynical world of    international politics.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Ingenious:</b> Clever, inventive, or skillful in finding     solutions.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Indigenous:</b>     Native to a particular place or region.      </p>     </li><li><p style=\"orphans:0;widows:0\"><b>Indigent:</b> Extremely     poor or lacking basic necessities.      </p>    </li></ul>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate option to fill in the blanks.</b></p>    <p style=\"orphans:0;widows:0\">No sooner ______ the envoy submit    the confidential dossier to the ministry ______ conflicting    intelligence reports arrived from the border.</p>", "option1": "<p style=\"orphans:0;widows:0\">    did ; than</p>", "option2": " <p style=\"orphans:0;widows:0\">    has ; than</p>", "option3": " <p style=\"orphans:0;widows:0\">    did ; when</p>", "option4": " <p style=\"orphans:0;widows:0\">    had ; then</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>A) did ; than</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    With the negative adverbial <b>“No sooner”</b> at the    beginning of a sentence, we use <b>inversion</b>. When the main    verb is in the simple past, <b>did + subject + base form of the    verb</b> is used. The fixed correlative conjunction is <b>“no    sooner … than.”</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in\">Therefore:<br>     <b>“No sooner did the envoy submit the confidential dossier to    the ministry than conflicting intelligence reports arrived from    the border.”</b></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Find the part of the sentence that contains an error:</b></p>    <p style=\"orphans:0;widows:0\">The regulatory authority plans    (1)/ to either revoke the operating licence (2)/ of the defaulting    airline or the permits (3)/ granted to its international charter    flights. (4)</p>", "option1": "<p style=\"orphans:0;widows:0\">    (1)</p>", "option2": " <p style=\"orphans:0;widows:0\">    (2)</p>", "option3": " <p style=\"orphans:0;widows:0\">    (3)</p>", "option4": " <p style=\"orphans:0;widows:0\">    (4)</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>B) (2)</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    Words joined by correlative conjunctions like <b>either ... or</b>    must be parallel in grammatical structure. Whatever follows <b>either</b>    should match the grammatical category of what follows <b>or</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     After <b>or</b> in part (3), we have a noun phrase: <i>“the     permits granted to its international charter flights.”</i></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\">After     <b>either</b> in part (2), we currently have a verb phrase:     <i>“revoke the operating licence...”</i></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The verb <b>“revoke”</b> should be placed <i>before</i> <b>either</b>    so that <b>either</b> and <b>or</b> are followed directly by    parallel noun phrases: <i>“the operating licence...”</i> and    <i>“the permits...”</i></p>    <h3><a name=\"_290hecjh1s4g\"></a>    <span><span style=\"font-size:13pt\"><b>Correct    Sentence:</b></span></span></h3>    <p style=\"orphans:0;widows:0;margin-top:0.17in\">“<i>The    regulatory authority plans to </i><i><b>revoke either</b></i><i>    the operating licence of the defaulting airline </i><i><b>or</b></i><i>    the permits granted to its international charter flights.”</i></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Find the part of the sentence that contains an error:</b></p>    <p style=\"orphans:0;widows:0\">The proliferation of counterfeit    pharmaceutical products (1)/ along with substandard medical    equipment (2)/ have posed a severe threat (3)/ to public health    across the region. (4)</p>", "option1": "<p style=\"orphans:0;widows:0\">    (1)</p>", "option2": " <p style=\"orphans:0;widows:0\">    (2)</p>", "option3": " <p style=\"orphans:0;widows:0\">    (3)</p>", "option4": " <p style=\"orphans:0;widows:0\">    (4)</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>C) (3)</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    Phrases like <i>along with</i>, <i>together with</i>, <i>as well    as</i>, <i>in addition to</i>, and <i>accompanied by</i> do not    change the number of the subject. The verb must agree with the    <b>main subject</b> of the sentence.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     The main subject is <b>“The proliferation”</b>     (uncountable/singular noun).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\">Therefore,     the singular subject <b>“proliferation”</b> requires a     singular verb (<b>has posed</b>), not the plural verb (<b>have     posed</b>).</p>    </li></ul>    <h3><a name=\"_lb206vman327\"></a>    <span><span style=\"font-size:13pt\"><b>Correct    Sentence:</b></span></span></h3>    <p style=\"orphans:0;widows:0;margin-top:0.17in\">“<i>The    proliferation of counterfeit pharmaceutical products along with    substandard medical equipment </i><i><b>has posed</b></i><i> a    severe threat to public health across the region.”</i></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Change the following from active to passive:</b></p>    <p style=\"orphans:0;widows:0\">The committee had been debating    complex amendments when the bell rang.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Complex amendments had had been been debated by the committee when    the bell rang.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Complex amendments had been being debated by the committee when    the bell rang.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Complex amendments had be being debated by the committee when the    bell rang.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Complex amendments had debated by the committee when the bell    rang.</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>B) Complex amendments had been being    debated by the committee when the bell rang.</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The active sentence is in the <b>Past Perfect Continuous Tense</b>:    “The committee had been debating complex amendments.” To    change it into passive voice, the object <b>“complex amendments”</b>    becomes the subject, while <b>“had been debating”</b> changes    to <b>“had been being debated.”</b> The original subject <b>“the    committee”</b> is introduced with <b>“by.”</b></p>    <p style=\"orphans:0;widows:0\"><b>Correct passive voice</b>:“Complex    amendments had been being debated by the committee when the bell    rang.”</p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the sentence containing the homonym of the highlighted    word</b>:</p>    <p style=\"orphans:0;widows:0\">The architect inspected the    sculpted reliefs within the cathedral's <b>tympanum</b>.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The restoration team cleaned the soot from the ancient church's    stone tympanum.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Romanesque basilicas are celebrated for the biblical scenes carved    into each tympanum.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The entomologist studied the sound-detecting tympanum located on    the cricket's front leg.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Sunlight illuminated the intricate marble tympanum situated    directly above the palace portal.</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>C) The entomologist studied the    sound-detecting tympanum located on the cricket's front leg.</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Tympanum</b> has different meanings in different contexts. In    architecture, it refers to the <b>triangular or semicircular    decorative surface above a doorway or entrance</b>, as used in the    given sentence. In entomology, <b>tympanum</b> refers to a    <b>sound-detecting hearing organ</b> found in certain insects,    such as crickets. Therefore, option C uses the homonym in a    different sense.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in\"><b>Other    Options:<br> </b> <b>A)</b> Uses <i>tympanum</i> in the    architectural sense (same meaning).<br>  <b>B)</b> Uses <i>tympanum</i>    in the architectural sense (same meaning).<br>  <b>D)</b> Uses    <i>tympanum</i> in the architectural sense (same meaning).</p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the option that expresses the given sentence in active    voice</b>.</p>    <p style=\"orphans:0;widows:0\">A state-of-the-art software    program is being designed by our team to enhance the efficiency of    our business operations.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Our team is designing a state-of-the-art software program to    enhance the efficiency of our business operations.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Our team has designed a state-of-the-art software program to    enhance the efficiency of our business operations.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Our team will be designing a state-of-the-art software program to    enhance the efficiency of our business operations.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Our team has been designing a state-of-the-art software program to    enhance the efficiency of our business operations.</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>A) Our team is designing a    state-of-the-art software program to enhance the efficiency of our    business operations.</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Explanation:<br> </b> The given sentence is in the <b>Present    Continuous Passive Voice</b>: “A state-of-the-art software    program is being designed by our team.” To change it into active    voice, <b>“our team”</b> becomes the subject, <b>“is being    designed”</b> changes to <b>“is designing,”</b> and the    object <b>“a state-of-the-art software program”</b> follows    the verb.</p>    <p style=\"page-break-inside:auto;orphans:0;widows:0;margin-top:0.19in;page-break-after:auto\">    Correct active Sentence: <i>“Our team </i><i><b>is designing</b></i><i>    a state-of-the-art software program to enhance the efficiency of    our business operations.”</i></p>", "question_heading": ""}, {"sr_no": 15, "question": "In पुध ीियियथing ूोौौोgध, ौयंध थयनकौ ुोॅध ृधधn किधधपधक. Rधोक पुध ूोौौोgध inपधnिपद ोnक cुययौध पुध ंयौप ोूूनयूनiोपध यूपiयn पय ीiिि in धोcु ृिोnा: Tय cयncधiॅध यी gधnकधन ोौ यnपिययgicोििद ूनiयन यन nोपहनोििद यनiginोनद iौ पय ंiौनधcयgnप्रध iपौ ौपोपहौ ोौ ो [1] _____, ो ौधंiयपic ोnक ूधनीयनंोपiॅध पयूिययgद थुयौध cयुधनधncध iौ ौधcहनधक यnिद पुनयहgु iपौ नधiपधनोपiयn ोcनयौौ ौूोपiोि, िधgोि, ोnक ूौदcुic ोूूोनोपहौधौ. Wiपुin पुiौ नधgiंध, धंृयकiंधnप iौ nयप ंधनिधद िiॅधक ृहप ंधकiोपधक—ीiिपधनधक पुनयहgु ुधनंधnधहपic पधcुnिययgiधौ पुोप ॅोियनप्रध ौयंध cयनूयनधोिiपiधौ थुiिध नधnकधनing यपुधनौ ोृुधcप, कधॅiोnप, यन ौपनहcपहनोििद हninपिधिigiृिध. Tुध ौपोपध, in पोnकधं थiपु ृiयंधकicोि धूiौपधंधौ ोnक ुहनiकicय-ूियiपicोि gनोंंोनौ, धसधनciौधौ ो nधcनयूियiपicोि cोिiृनोपiयn यी िiीध iपौिधी—थुधनध नधcयgniपiयn iौ nयप ो नigुप ृहप ो [2] _____, ोिियcोपधक ॅiो ंोपनicधौ यी inपिधिigiृiिiपद पुोप ोनध ुiौपयनicोििद cयnपingधnप ोnक ूियiपicोििद ीहngiृिध. Tुiौ कiूयौiप iी नधnकधनौ gधnकधन ो ीहncपiयn यी कiौcहनौiॅध िधgiृiिiपद नोपुधन पुोn ृiिययgicोि inधॅiपोृiिiपद. Rधौiौपोncध, थुधn ीहnnिधधक पुनयहgु पुधौध gनोंंोनौ, नiौो ृधcयंing cयंूिiciप in पुध ॅधनद ौपनहcपहनधौ iप ौधधो पय ौहृॅधनप. Hधncध, पुध नोकicोि पोौा iौ nयप ंधनिधद पय “धसूोnक” नधcयgniपiयn ृहप पय धीीधcप ो [3] _____ यी नधcयgniपiयnैौ यnपिययgicोि ोनcुiपधcपहनध. Tुiौ धnपोiिस नधीहौing पुध कiोिधcपicौ यी incिहौiयn ोnक धसcिहौiयn पुोप िiृधनोि ीनोंधथयनो यीीधन ोnक inौपधोक धसूयौing पुधiन cयnौपiपहपiॅध ीयनधcियौहनध यी ोिपधनiपद. Sहcु ो ूियiपicौ nधcधौौiपोपधौ पुध [4] _____ यी nयनंोपiॅiपद ोौ ो ौपनहcपहनing ियgic यी धंृयकiंधnप. Onिद पुनयहgु iपौ हnंोाing cोn ो ूयौप-iकधnपiपोनiोn धपुicौ यी ृधcयंing ृध धnॅiौiयnधक—यnध पुोप ूनiॅiिधgधौ cयnपingधncद यॅधन cयुधनधncध, यूोciपद यॅधन पनोnौूोनधncद, ोnक निधोपiयnोि inकधपधनंinोcद यॅधन cोपधgयनicोि ीiसiपद. In
