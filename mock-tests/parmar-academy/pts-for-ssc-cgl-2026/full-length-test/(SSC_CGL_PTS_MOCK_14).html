/p>       </td>      </tr>     </tbody>    </table>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following is the best    example of an open thermodynamic system?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Hot tea kept in a sealed thermos    flask</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gas enclosed in a perfectly    insulated cylinder</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ice kept in a closed container</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Water boiling in an open vessel</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n   <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>The correct answer is D.    Water boiling in an open vessel</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In    thermodynamics, systems are classified based on their ability to    exchange </span><span style=\"font-family:'Nirmala UI'\"><b>energy</b></span><span style=\"font-family:'Nirmala UI'\"> (heat/work)    and </span><span style=\"font-family:'Nirmala UI'\"><b>matter</b></span><span style=\"font-family:'Nirmala UI'\"> with    their surroundings.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Types    of Thermodynamic Systems:</b></span></p>    <table>     <col>      <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>System Type</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Exchange of Energy</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Exchange of Matter</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Example</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Open System</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Yes</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Yes</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Water boiling in an open       vessel</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Closed System</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Yes</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>No</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">A sealed pressure cooker or ice       in a closed container</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Isolated System</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>No</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>No</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Hot tea in a perfectly sealed       thermos flask</span></p>      </td>     </tr>    </table>    <ul>     <li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Option D (Correct):</b></span><span style=\"font-family:'Nirmala UI'\"> In     an open vessel, heat is transferred from the stove to the water     (energy exchange), and steam escapes into the air (matter     exchange). Therefore, it is an </span><span style=\"font-family:'Nirmala UI'\"><b>open     system</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Option A (incorrect):</b></span><span style=\"font-family:'Nirmala UI'\"> A     sealed thermos flask is designed to prevent both heat transfer     and matter leakage, making it an </span><span style=\"font-family:'Nirmala UI'\"><b>isolated     system</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Option B (incorrect):</b></span><span style=\"font-family:'Nirmala UI'\"> A     perfectly insulated cylinder prevents heat exchange, and the     enclosure prevents matter exchange. This is a closer     approximation of an </span><span style=\"font-family:'Nirmala UI'\"><b>isolated     system</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Option C (incorrect):</b></span><span style=\"font-family:'Nirmala UI'\"> Since     the container is \"closed,\" matter (ice/water vapor)     cannot escape, but heat can still be transferred through the     walls of the container. This is a </span><span style=\"font-family:'Nirmala UI'\"><b>closed     system</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li>\n</ul>        <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785071802880_html_3f3f162919dab1d1.png\" width=\"403\" height=\"270\"> </p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Eskers     are primarily formed by the action of subglacial meltwater     streams.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Lateral     moraines are deposited along the sides of a glacier.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the statements given above is/are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both 1 and 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither 1 nor 2</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>C.    Both 1 and 2</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     1 is correct:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Eskers</b></span><span style=\"font-family:'Nirmala UI'\"> are     long, winding ridges of stratified sand and gravel. They are     formed when meltwater streams flow through tunnels within or     beneath a glacier (subglacial). As the glacier retreats, the     sediment that was deposited in the stream bed is left behind as a     prominent ridge.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     2 is correct:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Lateral     moraines</b></span><span style=\"font-family:'Nirmala UI'\"> are     ridges of debris (till) that are deposited along the sides of a     glacier. As a glacier moves, it erodes the valley walls, and this     material accumulates at its margins. When the glacier melts,     these ridges remain along the valley edges.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Glacial Landforms:</b></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Feature</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Category</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Description</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Cirque</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Erosional</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">A bowl-shaped depression on a       mountain side.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Esker</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Depositional</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">A long, winding ridge of       stratified sand and gravel formed by subglacial meltwater       streams.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Moraine</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Depositional</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Accumulation of glacial debris       (Lateral, Medial, Terminal).</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Drumlin</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Depositional</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">An oval or egg-shaped hill       formed by glacial ice action.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Fjord</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Erosional</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">A deep, water-filled glacial       valley connected to the sea.</span></p>      </td>     </tr>    </table>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>\"U-shaped\" always     refers to glacial valleys, while \"V-shaped\" refers to     river valleys.</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Which of the following statements    define \"Chromatography\"?</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is the process of separation of components of a mixture.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is used to separate colors in dye.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">It     is used to separate a mixture of oil and water.</span></p>    </li></ol>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 and 3 only</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 and 2 only</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>D.    1 and 2 only</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     1 is correct:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Chromatography</b></span><span style=\"font-family:'Nirmala UI'\"> is     a versatile laboratory technique used for the </span><span style=\"font-family:'Nirmala UI'\"><b>separation     of components</b></span><span style=\"font-family:'Nirmala UI'\">, or     solutes, within a mixture. It relies on the principle that     different components move at different speeds through a medium.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     2 is correct:</b></span><span style=\"font-family:'Nirmala UI'\"> One     of the most common applications of chromatography (specifically     Paper Chromatography) is to </span><span style=\"font-family:'Nirmala UI'\"><b>separate     the individual colors or pigments</b></span><span style=\"font-family:'Nirmala UI'\"> that     make up a dye or ink.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     3 is incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> A     mixture of oil and water (immiscible liquids) is typically     separated using a </span><span style=\"font-family:'Nirmala UI'\"><b>separating     funnel</b></span><span style=\"font-family:'Nirmala UI'\">, which relies on     the difference in their densities, not chromatography.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Common    Applications of chromatography:</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Forensics:</b></span><span style=\"font-family:'Nirmala UI'\"> To     analyze blood or cloth samples found at crime scenes.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Environmental     Testing:</b></span><span style=\"font-family:'Nirmala UI'\"> To detect     pollutants in air and water.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pharmaceuticals:</b></span><span style=\"font-family:'Nirmala UI'\"> To     purify chemicals and test the purity of medicines.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Biological     Research:</b></span><span style=\"font-family:'Nirmala UI'\"> To     separate pigments from natural extracts (like chlorophyll from     leaves).</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Separation    Techniques:</b></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Technique</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Used For...</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Example</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Chromatography</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Components of a solution</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Colors in a dye; Drugs from       blood</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Distillation</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Miscible liquids with different       boiling points</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Acetone and water</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Separating Funnel</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Immiscible liquids</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Oil and water</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Centrifugation</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Fine solids suspended in liquid</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Cream from milk</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Who among the following replaced    Morarji Desai as the Prime Minister of India in 1979?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Jagjivan Ram</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Charan Singh</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Chandrashekhar</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">P.V. Narasimha Rao</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>The correct answer is</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>B.    Charan Singh</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Charan    Singh</b></span><span style=\"font-family:'Nirmala UI'\"> served as the    5th Prime Minister of India, heading the government from July 1979    to January 1980.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Facts about Charan Singh's Tenure</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Briefest     Term:</b></span><span style=\"font-family:'Nirmala UI'\"> He is often     remembered as the only Prime Minister of India who </span><span style=\"font-family:'Nirmala UI'\"><b>never     faced the Parliament</b></span><span style=\"font-family:'Nirmala UI'\"> during     his tenure, as the </span><span style=\"font-family:'Nirmala UI'\"><b>Congress     I(</b></span><span style=\"font-family:'Nirmala UI'\"> The \"I\"     stand for </span><span style=\"font-family:'Nirmala UI'\"><b>\"Indira\"</b></span><span style=\"font-family:'Nirmala UI'\">,     a designation adopted in 1978 when former Prime Minister Indira     Gandhi split from the parent organization to form her own party.     This faction was eventually recognized as the official INC.)     withdrew its support just before he was to prove his majority on     the floor of the House.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pro-Farmer     Stance:</b></span><span style=\"font-family:'Nirmala UI'\"> A     dedicated leader of the agrarian community, his birthday     (</span><span style=\"font-family:'Nirmala UI'\"><b>December 23rd</b></span><span style=\"font-family:'Nirmala UI'\">)     is celebrated as </span><span style=\"font-family:'Nirmala UI'\"><b>Kisan     Diwas</b></span><span style=\"font-family:'Nirmala UI'\"> (National     Farmers' Day) in India.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Succession:</b></span><span style=\"font-family:'Nirmala UI'\"> Following     his resignation, mid-term elections were held in 1980, which saw     the return of </span><span style=\"font-family:'Nirmala UI'\"><b>Indira     Gandhi</b></span><span style=\"font-family:'Nirmala UI'\"> to power.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Overview    of Other Personalities:</b></span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Personality</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Role / Context</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Jagjivan Ram</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">A prominent Dalit leader; served       as Deputy PM in the Janata government but never became PM.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Chandrashekhar</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Served as the 8th Prime Minister       of India much later, from </span><span style=\"font-family:'Nirmala UI'\"><b>1990       to 1991</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>P.V. Narasimha Rao</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Served as the 9th Prime Minister       from </span><span style=\"font-family:'Nirmala UI'\"><b>1991 to       1996</b></span><span style=\"font-family:'Nirmala UI'\">, known for the       1991 Economic Reforms.</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What is the central theme of the    book 'Friend of my Youth' by Amit Chaudhuri?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A collection of interconnected    stories exploring Indian family and identity</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A historical account of India's    independence struggle</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A travelogue about India's diverse    landscape</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A biography of a Indian politician</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>The correct answer is</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Nirmala UI'\"><b>A).    A collection of interconnected stories exploring Indian family and    identity</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Friend    of My Youth</b></span><span style=\"font-family:'Nirmala UI'\"> is a    work of fiction that blurs the lines between memoir and novel,    focusing on the narrator’s return to Mumbai (Bombay) and his    memories of a childhood friend.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Author:    Amit Chaudhuri</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Amit    Chaudhuri is a renowned contemporary Indian author, poet, and    musician known for his evocative prose and \"slice of life\"    storytelling.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Other    Novels by Amit Chaudhuri</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>A     Strange and Sublime Address</b></span><span style=\"font-family:'Nirmala UI'\"> (1991)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Afternoon     Raag</b></span><span style=\"font-family:'Nirmala UI'\"> (1993) </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Freedom     Song</b></span><span style=\"font-family:'Nirmala UI'\"> (1998)</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>The     Immortals</b></span><span style=\"font-family:'Nirmala UI'\"> (2009) </span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">During his early military    expeditions in India, which place was first brought under the    control of Babur?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Panipat</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lahore</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sialkot</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bhira</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>The correct answer is</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>D.    Bhira</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">While    many associate Babur's entry into India with the landmark Battle    of Panipat, he conducted several smaller expeditions into the    Indian frontier years before 1526.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The    Conquest of Bhira (1519)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Babur    first crossed the Indus River and entered the Indian subcontinent    in </span><span style=\"font-family:'Nirmala UI'\"><b>1519</b></span><span style=\"font-family:'Nirmala UI'\">.    During this expedition, his primary target was </span><span style=\"font-family:'Nirmala UI'\"><b>Bhira</b></span><span style=\"font-family:'Nirmala UI'\"> (located    in modern-day Pakistan).</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Babur     considered Bhira his rightful inheritance because it had once     been conquered by his ancestor, </span><span style=\"font-family:'Nirmala UI'\"><b>Timur</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This     expedition marked the first time Babur's authority was     established on Indian soil.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Timeline    of Babur's Early Indian Expeditions:</b></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Expedition</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Year</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Major Events / Places</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>First</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1519</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Capture of </span><span style=\"font-family:'Nirmala UI'\"><b>Bhira</b></span><span style=\"font-family:'Nirmala UI'\"> and       Bajaur</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Second</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1519</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Peshawar</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Third</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1520</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Reconquered Bhira and advanced       to </span><span style=\"font-family:'Nirmala UI'\"><b>Sialkot</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Fourth</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1524</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Captured </span><span style=\"font-family:'Nirmala UI'\"><b>Lahore</b></span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Major Battles of Babur    (1526–1529):</b></span></p>    <table>     <col>      <col>      <col>      <thead>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Year</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Battle</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Defeated</b></span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>     </thead>     <tbody>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>1526</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>First Battle of Panipat</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Ibrahim Lodi</b></span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>1527</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Battle of Khanwa</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Rana Sanga</b></span><span style=\"font-family:'Nirmala UI'\"> (of        Mewar)</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>1528</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Battle of Chanderi</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Medini Rai</b></span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>1529</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Battle of Ghaghra</b></span></p>       </td>       <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Mahmud Lodi</b></span><span style=\"font-family:'Nirmala UI'\"> (Afghan        Chiefs)</span></p>       </td>      </tr>     </tbody>    </table>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Babur's death : 1530</b></span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Tomb : </b></span><span style=\"font-family:'Nirmala UI'\">Babur     died in </span><span style=\"font-family:'Nirmala UI'\"><b>Agra in     1530</b></span><span style=\"font-family:'Nirmala UI'\"> and was     initially buried there (at </span><span style=\"font-family:'Nirmala UI'\"><b>Aram     Bagh</b></span><span style=\"font-family:'Nirmala UI'\">) before being     moved to Kabul.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">India     secured the 38th rank in the Global Innovation Index 2025.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     global Innovation Index is released by the World Intellectual     Property Organization (WIPO).</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the statements given above is/are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 1</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 2</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both 1 and 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither 1 nor 2</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct answer is C. Both 1    and 2</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     1 is correct:</b></span><span style=\"font-family:'Nirmala UI'\"> India     secured </span><span style=\"font-family:'Nirmala UI'\"><b>38th     rank</b></span><span style=\"font-family:'Nirmala UI'\"> in the 2025     index. </span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     2 is correct:</b></span><span style=\"font-family:'Nirmala UI'\"> The     Global Innovation Index is published annually by the </span><span style=\"font-family:'Nirmala UI'\"><b>World     Intellectual Property Organization (WIPO)</b></span><span style=\"font-family:'Nirmala UI'\">,     a specialized agency of the United Nations.</span></p>    </li>\n</ul>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Global    Innovation Index (GII)</b></span><span style=\"font-family:'Nirmala UI'\"> is    a comprehensive annual report that ranks the innovation    capabilities and performance of world economies. GII was launched    in </span><span style=\"font-family:'Nirmala UI'\"><b>2007</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>GII    2025 Global Top 5</b></span></p>    <ol>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Switzerland</b></span><span style=\"font-family:'Nirmala UI'\"> (Ranked     1st for the 15th consecutive year)</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sweden</b></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>United     States</b></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>South     Korea</b></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Singapore</b></span></p>    </li>\n</ol>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Parameter</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Details</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Released by</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>WIPO</b></span><span style=\"font-family:'Nirmala UI'\"> (World       Intellectual Property Organization) <br> Established       in </span><span style=\"font-family:'Nirmala UI'\"><b>1967.</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>India's Rank 2025</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>38th</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>India's Rank 2024</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>39th</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>WIPO Headquarters</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Geneva, Switzerland</b></span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following provisions    regarding Article 370 of the Constitution of India was    correct before its abrogation in 2019?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Financial Emergency under Article    360 could be declared automatically in Jammu and Kashmir.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The residuary powers of legislation    belonged to the Union Parliament.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Constitutional provisions related    to Defence, Foreign Affairs and Communications applied through the    Instrument of Accession.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The President of India could alter    the name and boundary of the state without the consent of the    state legislature.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct answer is</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>C.    Constitutional provisions related to Defence, Foreign Affairs and    Communications applied through the Instrument of Accession.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Before    the reorganization in 2019, Article 370 accorded a \"temporary\"    special status to the state of Jammu and Kashmir.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">When    Maharaja Hari Singh signed the </span><span style=\"font-family:'Nirmala UI'\"><b>Instrument    of Accession</b></span><span style=\"font-family:'Nirmala UI'\"> in    1947, he surrendered jurisdiction only over three    subjects: </span><span style=\"font-family:'Nirmala UI'\"><b>Defence,    External Affairs, and Communications</b></span><span style=\"font-family:'Nirmala UI'\">.    For all other matters, the concurrence of the State Government was    required for the Union's laws to apply.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Features of Article 370 (Pre-2019):</b></span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Feature</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Condition in Jammu &amp;       Kashmir</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Constitution</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Had its own separate       Constitution (adopted in 1956).</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Flag</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Had a separate state flag       alongside the Tricolor.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Citizenship</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Residents had \"Permanent       Resident\" status with exclusive rights.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Fundamental Rights</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Part III of the Indian       Constitution applied only with modifications.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>DPSP</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Directive Principles of State       Policy did not apply to the state.</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>The 2019 Changes</b></span></p>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">On </span><span style=\"font-family:'Nirmala UI'\"><b>August    5, 2019</b></span><span style=\"font-family:'Nirmala UI'\">, the President    of India issued the </span><span style=\"font-family:'Nirmala UI'\"><b>Constitution    (Application to Jammu and Kashmir) Order, 2019, </b></span><span style=\"font-family:'Nirmala UI'\">which    effectively made the entire Constitution of India applicable to    the state, leading to the following:</span></p>    <ol>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Abrogation of Article 370:</b></span><span style=\"font-family:'Nirmala UI'\"> The     special status was removed.</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Reorganization:</b></span><span style=\"font-family:'Nirmala UI'\"> The     state was bifurcated into two Union Territories: </span><span style=\"font-family:'Nirmala UI'\"><b>Jammu     &amp; Kashmir</b></span><span style=\"font-family:'Nirmala UI'\"> (with     a legislature) and </span><span style=\"font-family:'Nirmala UI'\"><b>Ladakh</b></span><span style=\"font-family:'Nirmala UI'\"> (without     a legislature).</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Uniformity:</b></span><span style=\"font-family:'Nirmala UI'\"> All     central laws, including the Right to Information (RTI) and the     Indian Penal Code (IPC), now apply uniformly.</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Article 35A:</b></span><span style=\"font-family:'Nirmala UI'\"> Which     defined \"Permanent Residents\", was also scrapped as it     derived its power from Article 370.</span></p>    </li></ol>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Laman, in which a group of girls    sing a stanza and a group of boys reply in the song which    continues for hours, is a popular folk music of which state?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gujarat</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Rajasthan</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Haryana</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Himachal Pradesh</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct answer is D.    Himachal Pradesh</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Laman</b></span><span style=\"font-family:'Nirmala UI'\"> is    a distinctive folk music tradition from the hills of Himachal    Pradesh, particularly prevalent in the </span><span style=\"font-family:'Nirmala UI'\"><b>Kullu    Valley</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Characteristics of Laman</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Format:</b></span><span style=\"font-family:'Nirmala UI'\"> It     is a lyrical dialogue where a group of girls sings a stanza, and     a group of boys replies with a corresponding stanza. This     rhythmic \"musical conversation\" can continue for     several hours.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Theme:</b></span><span style=\"font-family:'Nirmala UI'\"> The     songs are primarily based on themes of </span><span style=\"font-family:'Nirmala UI'\"><b>love     and romance</b></span><span style=\"font-family:'Nirmala UI'\">, often     expressing the beauty of the mountains and the emotions of the     youth.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Musical     Style:</b></span><span style=\"font-family:'Nirmala UI'\"> The tunes     are typically slow and melodious, reflecting the serene     environment of the Himalayan region.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Folk    Music of Himachal Pradesh:</b></span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Folk Form</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Description</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Jhuri</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Songs about extra-marital       romance, common in Sirmaur and Mahasu.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Chhanjoti</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">A popular traditional song sung       by women in the state.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Ainchali</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Religious songs sung at the       house of a bridegroom before the wedding.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Dholru</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Seasonal songs sung during the       month of Chaitra (spring).</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Find the error in the following    options fragmented </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The    increase in the number of unresolved Cases (1) / and the lack of    clear guidelines from the authorities (2)/ has contributed    significantly to the confusion (3)/ surrounding the recent    procedural changes. (4)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(1)</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(2)</span></p>", "option3": Nirmala UI'\">’    and its verb ‘</span><span style=\"font-family:'Nirmala UI'\"><b>took care    of’</b></span><span style=\"font-family:'Nirmala UI'\">. </span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">And,    part B contains the </span><span style=\"font-family:'Nirmala UI'\"><b>object</b></span><span style=\"font-family:'Nirmala UI'\">,    i.e. her younger brother. So, B will follow A. Further, part C    contains the </span><span style=\"font-family:'Nirmala UI'\"><b>subject    of another clause</b></span><span style=\"font-family:'Nirmala UI'\"> which    talks about their parents &amp; part D </span><span style=\"font-family:'Nirmala UI'\"><b>conveys    the idea</b></span><span style=\"font-family:'Nirmala UI'\"> that their    parents were away. So, D will follow C.</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate option    to fill in the blank.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Augmented    Reality (AR) continues to develop and become more _______ among a    wide range of applications.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">rare</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">amicable</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">idealistic</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">pervasive</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>‘Pervasive</b></span><span style=\"font-family:'Nirmala UI'\">’    means spreading widely throughout an area or group. The given    sentence states that Augmented Reality (AR) continues to develop    and become more pervasive among a wide range of applications.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>rare</b></span><span style=\"font-family:'Nirmala UI'\">-    less frequent</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>amicable</b></span><span style=\"font-family:'Nirmala UI'\">-    friendly in nature</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>idealistic</b></span><span style=\"font-family:'Nirmala UI'\">-    far from reality</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the option that can be used    as a one-word substitute for the given group of words:</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">A    word or phrase that reads the same backwards as forwards'.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Anagram</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Palindrome</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Homonym</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">synonym</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Palindrome </b></span><span style=\"font-family:'Nirmala UI'\">-    a word, phrase, or sequence that reads the same backwards as    forwards.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Anagram </ : 74, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In </span><span style=\"font-family:'Cambria Math'\">△</span><span style=\"font-family:'Nirmala UI'\">ABC,    an angle bisector from A meets BC at D. If AD bisects Angle BAC,    and AB = AC, are </span><span style=\"font-family:'Cambria Math'\">△</span><span style=\"font-family:'Nirmala UI'\">ABD    and </span><span style=\"font-family:'Cambria Math'\">△</span><span style=\"font-family:'Nirmala UI'\">ACD    congruent? If so, by what rule?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Yes, by SSS</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Yes, by SAS</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Yes, by ASA</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">No, they are not congruent</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785071802880_html_7cb08d5f1513af0d.jpg\" width=\"602\" height=\"832\" > </p>", "question_heading": ""}, {"sr_no": 75, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The ratio of a man's age to his    father's age is 4 : 5, and the ratio of his age to his son's age    is 6 : 1. Four years ago these were 11 : 14 and 11 : 1,    respectively. The ratio of the age of the grandfather to that of    the grandson 12 years from now will be:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">12 : 5</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">14 : 3</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">18 : 5</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">19 : 7</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785071802880_html_aeb330b6ca7bb3ba.jpg\" width=\"509\" height=\"931\" > </p>", "question_heading": ""}, {"sr_no": 76, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In a certain code language, 'LION'    is coded as '58' and 'SOME' is coded as '56'. How will 'MILK' be    coded in the same language?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">63</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">65</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">78</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">60</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Logic: Sum of the opposite    positional value of letter = Code</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">As,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Opposite    positional value of word LION is.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">=    L(15) + I(18) + O(12) + N(13) = 58</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">And,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Opposite    positional value of word SOME is.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">=    S(8) + O(12) + M(14) + E(22) = 56</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Similarly,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Opposite    positional value of word MILK is.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">=    M(14) + I(18) + L(15) + K(16) = 63</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>63 </b></span><span style=\"font-family:'Nirmala UI'\">is    the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Identify the relation between    Statement I and Statement II.</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    I:</b></span><span style=\"font-family:'Nirmala UI'\"> The company’s    sales increased by 25% in the last financial year.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Statement    II:</b></span><span style=\"font-family:'Nirmala UI'\"> The company    launched a new marketing campaign and expanded its distribution    network.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Statement I is the cause and    Statement II is the effect.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Statement II is the cause and    Statement I is the effect.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both are independent effects.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">No relation.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Statement I </b></span><span style=\"font-family:'Nirmala UI'\">states    that the company’s sales increased by 25% in the last financial    year. This statement presents a result or outcome that occurred    during the year. However, it does not explain the reason behind    the increase in sales.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement    II </b></span><span style=\"font-family:'Nirmala UI'\">mentions that    the company launched a new marketing campaign and expanded its    distribution network. These are strategic business actions that    are typically undertaken to attract more customers, increase    market reach, and make products available in more locations. Such    measures generally contribute to higher sales and business growth.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">When    we examine the relationship between the two statements, it is    reasonable to conclude that the actions described in Statement II    could have led to the outcome mentioned in Statement I. A    successful marketing campaign can increase customer awareness and    demand, while an expanded distribution network can improve product    availability. Together, these factors can result in a significant    rise in sales.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Therefore,    Statement II provides a logical explanation for the increase in    sales mentioned in Statement I.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    Statement II is the cause and Statement I is the effect.</b></span></p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The following equation is    incorrect. Which two sign should be interchanged to correct the    equation?</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">18 + 6 × 2 − 12 ÷ 3 = 10</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">+  and ×</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">× and ÷</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">+ and - </span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">- and ÷</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Given    equation: 18 + 6 × 2 − 12 ÷ 3 = 10</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option    (a) + and ×</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">18    × 6 + 2 - 12 ÷ 3 = 10</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">18    × 6 + 2 - 4 = ?</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">108    + 2 - 4 = ?</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">110    - 4 = 106</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">LHS    NOT EQUAL TO RHS</span></p>    <p st /b></span><span style=\"font-family:'Nirmala UI'\">is    the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Read the given statements and    conclusions carefully. Assuming that the information given in the    statements is true, even if it appears to be at variance with    commonly known facts, decide which of the given conclusions    logically follow from the statements.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statements:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Some    laptops are tablets.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">All    laptops are computers.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">All    computers are electronics.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusions:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">I.    All laptops are electronics.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">II.    All tablets are electronics.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">III.    Some electronics are tablets.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">All the conclusions follow</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only conclusions II and III follow</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only conclusions I and III follow</span></p>", "option4": " <
