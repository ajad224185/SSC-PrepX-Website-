>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">IIT Delhi</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">IIT Kanpur</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">IIT Madras</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">IIT Bombay</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>The correct answer is</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>: </b></span><span style=\"font-family:'Nirmala UI'\">(</span><span style=\"font-family:'Nirmala UI'\"><b>B)    IIT Kanpur</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    Delhi  government partnered with</span><span style=\"font-family:'Nirmala UI'\"><b> IIT    Kanpur</b></span><span style=\"font-family:'Nirmala UI'\"> to conduct    cloud seeding experiments to combat rising post- monsoon air    pollution.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">However,    experts from </span><span style=\"font-family:'Nirmala UI'\"><b>Ministry    of Earth Sciences</b></span><span style=\"font-family:'Nirmala UI'\"> have    cautioned that the absence of rain bearing clouds during the post    monsoon season makes </span><span style=\"font-family:'Nirmala UI'\"><b>the    timing scientifically unsuitable</b></span><span style=\"font-family:'Nirmala UI'\">,    casting doubt on the effectiveness.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Cloud    seeding:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is a</span><span style=\"font-family:'Nirmala UI'\"><b> weather     modification technique</b></span><span style=\"font-family:'Nirmala UI'\"> aimed     at enhancing precipitation from existing cloud.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">It     involves dispersing substance such as</span><span style=\"font-family:'Nirmala UI'\"><b> silver     iodide, potassium iodide, sodium chloride, or dry ice</b></span><span style=\"font-family:'Nirmala UI'\"> into     clouds using aircrafts.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Read the following Assertion (A)    and Reason (R) carefully:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Assertion    (A): The National Green Tribunal (NGT) was established under the    NGT Act, 2008.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Reason(R):    NGT provide speedy disposal of environmental and pollution related    disputes.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both Assertion (A) and Reason (R)    are true, and Reason (R) is the correct explanation of Assertion    (A).</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both Assertion (A) and Reason (R)    are true, but Reason (R) is NOT the correct explanation of    Assertion (A).</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Assertion (A) is true, but Reason    (R) is false.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Assertion (A) is false, but Reason    (R) is true.</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>The correct answer is :D)    Assertion (A) is false, but Reason (R) is true.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Assertion:(Incorrect)</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Established:     2010(</span><span style=\"font-family:'Nirmala UI'\"><b>NGT Act, 2010)</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Reason:    (Correct)</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Jurisdiction</b></span><span style=\"font-family:'Nirmala UI'\">-     Environmental protection, pollution, natural resources.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Main     Functions:</b></span><span style=\"font-family:'Nirmala UI'\"> Rapid     settlement of disputes related to environmental damage and     pollution; ensuring environmental justice.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Trade     winds blow from subtropical high-pressure belts towards     equatorial low-pressure belts.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Westerlies     blow from east to west in the mid-latitudes of both hemispheres.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the statements given above is/are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both 1 and 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither 1 nor 2</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>The correct answer is</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Nirmala UI'\"><b>A).    1 only</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     1 is correct:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Trade     Winds</b></span><span style=\"font-family:'Nirmala UI'\"> originate     from the Subtropical High-Pressure Belts (around 30° N and S)     and blow toward the Equatorial Low-Pressure Belt (Doldrums). Due     to the Coriolis effect, they are deflected to the right in the     Northern Hemisphere (North-East Trades) and to the left in the     Southern Hemisphere (South-East Trades).</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     2 is incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Westerlies</b></span><span style=\"font-family:'Nirmala UI'\"> blow     from the Subtropical High-Pressure Belts toward the Sub-Polar     Low-Pressure Belts (between 30° and 60° latitude). Crucially,     they blow from </span><span style=\"font-family:'Nirmala UI'\"><b>west     to east</b></span><span style=\"font-family:'Nirmala UI'\">, not east to     west. Their name \"Westerlies\" comes from the direction     they originate from (the West).</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Planetary Wind Belts:</b></span></p>    <table>     <col>      <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Wind Belt</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Latitudinal Range</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Direction</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Characteristics</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Trade Winds</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">0° – 30° N/S</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">NE to SW (NH) / SE to NW (SH)</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Consistent and steady; used       historically by sailors.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Westerlies</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">30° – 60° N/S</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>West to East</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Stronger in the Southern       Hemisphere due to lack of land (Roaring Forties).</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Polar Easterlies</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">60° – 90° N/S</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">East to West</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Cold, dry winds blowing from       polar highs.</span></p>      </td>     </tr>    </table>    <ul>     <li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Coriolis Effect:</b></span><span style=\"font-family:'Nirmala UI'\"> This     force, caused by the Earth's rotation, deflects moving objects     (like wind) to the right in the Northern Hemisphere and to the     left in the Southern Hemisphere (Ferrel's Law). It is</span><span style=\"font-family:'Nirmala UI'\"><b> zero     at the equator and maximum at the poles.</b></span></p>    </li>\n</ul>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Pressure Belts:</b></span><span style=\"font-family:'Nirmala UI'\"> Winds    always blow from </span><span style=\"font-family:'Nirmala UI'\"><b>High    Pressure</b></span><span style=\"font-family:'Nirmala UI'\"> to </span><span style=\"font-family:'Nirmala UI'\"><b>Low    Pressure</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Equatorial     Low: Doldrums</b></span><span style=\"font-family:'Nirmala UI'\">—officially     known as the</span><span style=\"font-family:'Nirmala UI'\"><b> Intertropical     Convergence Zone (ITCZ)</b></span><span style=\"font-family:'Nirmala UI'\">—is     a low-pressure belt located roughly between 5° North and 5°     South of the equator. It is characterized by hot, humid air, high     rainfall, and a near-total absence of steady surface winds</span></p>     </li>\n<li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Subtropical High:</b></span><span style=\"font-family:'Nirmala UI'\"> 30°     - 35° (Horse Latitudes).</span></p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The fourth Anglo-Mysore war was    fought in the year</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1797</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1796</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1800</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1799</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>The correct answer is</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>D.    1799</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The    Fourth Anglo-Mysore War (1799)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    Fourth Anglo-Mysore War was the final conflict between the Kingdom    of Mysore and the British East India Company. It ended the era of    the powerful Mysore Sultanate that had challenged British    expansion in South India.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key     Figures:</b></span><span style=\"font-family:'Nirmala UI'\"> The war     was fought between </span><span style=\"font-family:'Nirmala UI'\"><b>Tipu     Sultan</b></span><span style=\"font-family:'Nirmala UI'\"> and the     British forces led by </span><span style=\"font-family:'Nirmala UI'\"><b>Lord     Richard Wellesley</b></span><span style=\"font-family:'Nirmala UI'\"> (Governor-General).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The     Outcome:</b></span><span style=\"font-family:'Nirmala UI'\"> The     British and their allies (the Nizam of Hyderabad and the     Marathas) besieged Seringapatam. Tipu Sultan died defending his     capital on May 4, 1799.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Territorial     Changes:</b></span><span style=\"font-family:'Nirmala UI'\"> After the     war, the British took a large portion of Mysore's territory. The     central part of the kingdom was restored to the </span><span style=\"font-family:'Nirmala UI'\"><b>Wodeyar     dynasty</b></span><span style=\"font-family:'Nirmala UI'\"> (the     original Hindu rulers) under a </span><span style=\"font-family:'Nirmala UI'\"><b>Subsidiary     Alliance</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Summary    of all Anglo-Mysore Wars:</b></span></p>    <table>     <col>      <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>War</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Years</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Treaty / Outcome</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Key Personalities</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>First</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1767–1769</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Treaty of Madras</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Haidar Ali vs. British (Haidar       won)</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Second</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1780–1784</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Treaty of Mangalore</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Haidar Ali (died during war),       Tipu Sultan</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Third</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">1790–1792</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Treaty of Seringapatam</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Tipu Sultan vs. Lord Cornwallis</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Fourth</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>1799</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Death of Tipu Sultan</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Tipu Sultan vs. Lord Wellesley.</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Important Facts:</b></span></p>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>The French Connection:</b></span><span style=\"font-family:'Nirmala UI'\"> One     of the main reasons Lord Wellesley attacked Tipu Sultan was     Tipu's alliance with the French (Napoleon Bonaparte).</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Arthur Wellesley:</b></span><span style=\"font-family:'Nirmala UI'\"> The     future Duke of Wellington (who defeated Napoleon at Waterloo)     played a significant role in this war.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">India’s first operational PM    MITRA (Mega Integrated Textile Region and Apparel) Park was    inaugurated in which of the following places in 2026?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Dhar, Madhya Pradesh</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Surat, Gujarat</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Warangal, Telangana</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Coimbatore, Tamil Nadu</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>The correct answer is</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>C.    Warangal, Telangana</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Prime    Minister Narendra Modi virtually inaugurated India's first    operational </span><span style=\"font-family:'Nirmala UI'\"><b>PM    MITRA</b></span><span style=\"font-family:'Nirmala UI'\"> (Mega    Integrated Textile Region and Apparel) Park in Warangal,    Telangana. The facility aims to consolidate the textile value    chain from \"Farm to Foreign\".</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Details &amp; Financials</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Vision:</b></span><span style=\"font-family:'Nirmala UI'\"> Driven     by Prime Minister Narendra Modi's 5F vision: </span><span style=\"font-family:'Nirmala UI'\"><b>Farm     to Fibre to Factory to Fashion to Foreign.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Budget:</b></span><span style=\"font-family:'Nirmala UI'\"> ₹4,445     crore outlay (up to 2027–28).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Financial     Incentives:</b></span><span style=\"font-family:'Nirmala UI'\"> Up to     ₹500 crore in Development Capital Support per park, plus up to     ₹300 crore in Competitive Incentive Support (CIS) to     incentivize rapid unit deployment.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The    7 Approved Locations</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">These    mega hubs are being developed across seven states through Special    Purpose Vehicles (SPVs) owned by the Centre and respective State    Governments:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Tamil     Nadu:</b></span><span style=\"font-family:'Nirmala UI'\"> Virudhunagar     District</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Telangana:</b></span><span style=\"font-family:'Nirmala UI'\"> Warangal</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Gujarat:</b></span><span style=\"font-family:'Nirmala UI'\"> Navsari</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Karnataka:</b></span><span style=\"font-family:'Nirmala UI'\"> Kalaburagi     (Gulbarga)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Madhya     Pradesh:</b></span><span style=\"font-family:'Nirmala UI'\"> Dhar</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Uttar     Pradesh:</b></span><span style=\"font-family:'Nirmala UI'\"> Lucknow /     Hardoi</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Maharashtra:</b></span><span style=\"font-family:'Nirmala UI'\"> Amravati.</span></p>    </li></ol>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">According to the Law of Diminishing    Marginal Utility, as a consumer consumes more units of a    commodity, the:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Total utility always becomes    negative</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Marginal utility derived from each    additional unit tends to decline</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Price of the commodity    automatically decreases</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Consumer’s income increases    proportionately</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>The correct answer is</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>B.    Marginal utility derived from each additional unit tends to    decline</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The    Law of Diminishing Marginal Utility (DMU)</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    Law of Diminishing Marginal Utility is a fundamental principle of    economics which states that as a person consumes more and more    units of a specific commodity, the utility (satisfaction) derived    from each successive unit decreases.</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Total     Utility (TU):</b></span><span style=\"font-family:'Nirmala UI'\"> The     total satisfaction received from consuming a given total quantity     of a good.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Marginal     Utility (MU):</b></span><span style=\"font-family:'Nirmala UI'\"> The     additional satisfaction gained from consuming one more unit of a     good.</span></p>    </li>\n</ul>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     A is incorrect</b></span><span style=\"font-family:'Nirmala UI'\"> because     Total Utility typically increases as more units are     consumed, just at a slower rate. It only becomes negative in     extreme cases of \"disutility,\" but it is not a general     rule of the law that it always becomes negative.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     C is incorrect</b></span><span style=\"font-family:'Nirmala UI'\"> because     the law describes consumer psychology and satisfaction, not     market mechanics. While a lower marginal utility might make a     consumer willing to pay less, the market price does not     automatically drop just because one person consumes more.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     D is incorrect</b></span><span style=\"font-family:'Nirmala UI'\"> because     a consumer’s income is generally considered an independent     factor and is often assumed to be constant in basic utility     analysis.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785071802880_html_692211f4dab9a2d4.png\" width=\"387\" height=\"259\"> </p>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In Carnatic music, which type of    composition is most commonly performed during a concert, focusing    on a fixed melody and rhythm?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kriti</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Varnam</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Raga Alapana</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Tillana</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>The correct answer is</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>A.    Kriti</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Kriti</b></span><span style=\"font-family:'Nirmala UI'\"> is    the backbone of a modern Carnatic music concert. It is a highly    structured composition that focuses on a </span><span style=\"font-family:'Nirmala UI'\"><b>fixed    melody (Raga)</b></span><span style=\"font-family:'Nirmala UI'\"> and    a </span><span style=\"font-family:'Nirmala UI'\"><b>fixed rhythmic    cycle (Tala)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Structure:</b></span><span style=\"font-family:'Nirmala UI'\"> A     typical Kriti is divided into three sections:</span></p>     <ol>      <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pallavi:</b></span><span style=\"font-family:'Nirmala UI'\"> The      equivalent of a chorus or the first thematic line.</span></p>      </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Anupallavi:</b></span><span style=\"font-family:'Nirmala UI'\"> The      second section, which often moves into a higher register.</span></p>      </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Charanam:</b></span><span style=\"font-family:'Nirmala UI'\"> The      final and longest section, which concludes the piece.</span></p>     </li>\n</ol>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Significance:</b></span><span style=\"font-family:'Nirmala UI'\"> While     it is a composed piece, it provides the framework for     \"Manodharma\" (improvisation)     like </span><span style=\"font-family:'Nirmala UI'\"><i>Niraval</i></span><span style=\"font-family:'Nirmala UI'\"> or </span><span style=\"font-family:'Nirmala UI'\"><i>Kalpanaswaras</i></span></p>    </li>\n</ul>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     (B) Varnam is incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> While     also a fixed composition, the Varnam is usually performed as     an </span><span style=\"font-family:'Nirmala UI'\"><b>opening piece</b></span><span style=\"font-family:'Nirmala UI'\"> to     warm up the artist and showcase the scale of the Raga. It is more     of an \"etude\" or practice piece than the main focus of     the concert.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Raga     Alapana Option (C) is incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> This     is a form of </span><span style=\"font-family:'Nirmala UI'\"><b>unstructured     improvisation</b></span><span style=\"font-family:'Nirmala UI'\">. It has     no fixed rhythm (Tala) and no lyrics; it is used to explore the     nuances of a Raga before a composition begins.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Tillana     optoin (D) is incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> This     is a rhythmic piece usually performed at the </span><span style=\"font-family:'Nirmala UI'\"><b>end     of a concert</b></span><span style=\"font-family:'Nirmala UI'\">. It is     characterized by its fast tempo and the use of rhythmic syllables     (like </span><span style=\"font-family:'Nirmala UI'\"><i>dhim, tadhim</i></span><span style=\"font-family:'Nirmala UI'\">)     rather than extensive lyrics.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Summary    of Carnatic Composition Types:</b></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Type</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Timing in Concert</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala t-family:'Nirmala UI'\">Pre-composition</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Free-form; no rhythm; pure       melody.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Tillana</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Conclusion</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">High energy; rhythmic syllables.</span></p>      </td>     </tr>    </table>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following pairs    regarding the Directive Principles added by the 42nd    Amendment of the Constitution of India is correctly matched?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 39 — Protection of    monuments of national importance</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 43A — Organisation of    village panchayats</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 48A — Uniform Civil Code    for citizens</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 39A — Equal justice and    free legal aid</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>D.    Article 39A — Equal justice and free legal aid</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article     39A :</b></span><span style=\"font-family:'Nirmala UI'\"> Mandates the     State to provide </span><span style=\"font-family:'Nirmala UI'\"><b>equal     justice and free legal aid</b></span><span style=\"font-family:'Nirmala UI'\"> to     ensure that opportunities for securing justice are not denied to     any citizen by reason of economic or other disabilities.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article     43A :</b></span><span style=\"font-family:'Nirmala UI'\"> Directs the     State to take steps to secure the </span><span style=\"font-family:'Nirmala UI'\"><b>participation     of workers in the management of industries</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article     39 (Clause f):</b></span><span style=\"font-family:'Nirmala UI'\"> Directs     the State to ensure opportunities for the </span><span style=\"font-family:'Nirmala UI'\"><b>healthy     development of children</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Article     48A:</b></span><span style=\"font-family:'Nirmala UI'\"> Mandates the     State to </span><span style=\"font-family:'Nirmala UI'\"><b>protect     and improve the environment</b></span><span style=\"font-family:'Nirmala UI'\"> and     to safeguard forests and wildlife.</span></p>    </li>\n
