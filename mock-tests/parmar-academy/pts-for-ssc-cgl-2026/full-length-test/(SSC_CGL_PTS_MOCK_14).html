<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>27.) SSC CGL PTS  MOCK 14 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

span><span style=\"font-family:'Nirmala UI'\"> June     9 to 11, 2026.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>BRICS     Agriculture Ministers' Summit:</b></span><span style=\"font-family:'Nirmala UI'\"> June     12 and 13, 2026.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>India’s    2026 BRICS Presidency:</b></span><span style=\"font-family:'Nirmala UI'\"> India    formally assumed the BRICS Chairship from Brazil in late 2025.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Theme:</b></span><span style=\"font-family:'Nirmala UI'\"> \"Building    for Resilience, Innovation, Cooperation and Sustainability\".</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Chairship    History:</b></span><span style=\"font-family:'Nirmala UI'\"> This is    the </span><span style=\"font-family:'Nirmala UI'\"><b>fourth    time</b></span><span style=\"font-family:'Nirmala UI'\"> India has    chaired the BRICS bloc (previously in 2012, 2016, and 2021).</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Other    Meetings:</b></span><span style=\"font-family:'Nirmala UI'\"> While the    Agriculture Ministers meet in Indore, the </span><span style=\"font-family:'Nirmala UI'\"><b>BRICS    Foreign Ministers' Meeting</b></span><span style=\"font-family:'Nirmala UI'\"> was    held at </span><span style=\"font-family:'Nirmala UI'\"><b>Bharat    Mandapam, New Delhi</b></span><span style=\"font-family:'Nirmala UI'\">, on    May 14-15, 2026.</span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which Assamese Book won the Sahitya    Akademi Award in 2025, in the Novel category?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ata Nisongga Ghorar Aatmakatha</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Doibat Aehali Deonanh</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Naikhon Koloi Goise Tumiu Nejana    Moiu Nejanu</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Karhi Khelar Sadhu</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer: (D) Karhi    Khelar Sadhu<br> </b></span><span style=\"font-family:'Nirmala UI'\"> </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Details About the Book:</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Author:</b></span><span style=\"font-family:'Nirmala UI'\"> Devabrat     Das</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Content:</b></span><span style=\"font-family:'Nirmala UI'\"> The     book explores deep emotional and social reflections through     captivating storytelling.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Sahitya    Akademi Awards</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Established:1954</b></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Languages     Covered:</b></span><span style=\"font-family:'Nirmala UI'\"> 24     languages (22 languages mentioned in the </span><span style=\"font-family:'Nirmala UI'\"><b>8th     Schedule</b></span><span style=\"font-family:'Nirmala UI'\"> of the     Indian Constitution, plus </span><span style=\"font-family:'Nirmala UI'\"><b>English</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>Rajasthani</b></span><span style=\"font-family:'Nirmala UI'\">)</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Award     Components:</b></span><span style=\"font-family:'Nirmala UI'\"> The     award comprises a casket containing an engraved copper plaque, a     shawl, and an amount of </span><span style=\"font-family:'Nirmala UI'\"><b>₹1,00,000</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785071802880_html_d591897357c8919b.png\" width=\"557\" height=\"371\"> </p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Under the provisions of the    Bhartiya Sakshya Adhiniyam, 2023, which of the following    conditions is necessary for the admissibility of digital evidence    in a court of law?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Digital evidence should be    submitted only in printed (hard copy) format.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The electronic record must    originate from a government-authorized platform.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The electronic record should carry    a valid digital signatures for authentication</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Prior verification by a government    officer is compulsory before submission</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n   <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is </span><span style=\"font-family:'Nirmala UI'\"><b>(C).    The electronic record should carry a valid digital signature for    authentication</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Valid     digital signatures for authentication:</b></span><span style=\"font-family:'Nirmala UI'\"> The </span><span style=\"font-family:'Nirmala UI'\"><b>Bhartiya     Sakshya Adhiniyam (BSA), 2023</b></span><span style=\"font-family:'Nirmala UI'\">,     which replaces the Indian Evidence Act, 1872, places a heavy     emphasis on the authenticity of electronic records. While the Act     expands the scope of secondary evidence, </span><span style=\"font-family:'Nirmala UI'\"><b>Section     63</b></span><span style=\"font-family:'Nirmala UI'\"> (analogous to     the old Section 65B) stipulates that for an electronic record to     be admissible, its integrity must be verifiable. A </span><span style=\"font-family:'Nirmala UI'\"><b>valid     digital signature</b></span><span style=\"font-family:'Nirmala UI'\"> or     an electronic signature serves as a primary method for ensuring     that the record has not been tampered with and originates from     the stated source.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Summary    Table: Key Digital Evidence Provisions</b></span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Provision</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Detail</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Electronic Records</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Now treated as Primary Evidence.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Authentication</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Requires Digital Signatures or       Certificates for integrity.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Scope</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Includes server logs, emails,       smartphones, and cloud data.</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>Bharatiya    Nyaya Sanhita (BNS), 2023</b></span><span style=\"font-family:'Nirmala UI'\"> is    the official penal code of India, replacing the colonial-era    Indian Penal Code (IPC) of 1860.</span></p>    <ul>     <li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>New Offenses Defined:</b></span></p>     <ul>      <li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">      <span style=\"font-family:'Nirmala UI'\"><b>Terrorism:</b></span><span style=\"font-family:'Nirmala UI'\"> For      the first time, \"Terrorism\" is explicitly defined      under general penal law (Section 113).</span></p>      </li>\n<li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">      <span style=\"font-family:'Nirmala UI'\"><b>Organized Crime:</b></span><span style=\"font-family:'Nirmala UI'\"> Specific      punishments are introduced for organized crime, including      kidnapping and human trafficking (Section 111).</span></p>      </li>\n<li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">      <span style=\"font-family:'Nirmala UI'\"><b>Mob Lynching:</b></span><span style=\"font-family:'Nirmala UI'\"> Introduces      the death penalty or life imprisonment for murder committed by a      group of five or more on grounds of race, caste, or community.</span></p>      </li>\n<li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">      <span style=\"font-family:'Nirmala UI'\"><b>Snatching:</b></span><span style=\"font-family:'Nirmala UI'\"> A      new category of \"Snatching\" (Section 304) has been      added as a distinct offense from theft.</span></p>     </li>\n</ul>     </li>\n<li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Community Service:</b></span><span style=\"font-family:'Nirmala UI'\"> Introduced     as a new form of punishment for petty offenses to encourage     reformative justice.</span></p>     </li>\n<li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Crimes Against Women and     Children:</b></span><span style=\"font-family:'Nirmala UI'\"> The BNS     places these in a dedicated chapter (Chapter V). It includes a     new provision for \"sexual intercourse by deceitful means\"     or promise to marry.</span></p>     </li>\n<li>\n<p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>Sedition Replaced:</b></span><span style=\"font-family:'Nirmala UI'\"> The     offense of \"Sedition\" has been repealed and replaced by     a provision targeting \"Acts endangering sovereignty, unity,     and integrity of India\" (Section 152).</span></p>    </li>\n</ul>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1785071802880_html_64d99cb2e9c0a4c3.png\" width=\"564\" height=\"376\"> </p>", "question_heading": ""}, {"sr_no": 4, "question": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Match the following School of    Philosophy with their Founders:-</span></p>    <table>     <col>      <col>      <thead>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>List I (School)</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>List II (Founder/Key        Philosopher)</b></span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>     </thead>     <tbody>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">A. Samkhya</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">1. Patanjali</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">B. Yoga</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">2. Jaimini</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">C. Nyaya</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">3. Kapila</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">D. Purva Mimansa</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family: span style=\"font-family:'Nirmala UI'\">Logic, methodology, and the       means of attaining valid knowledge.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>D. Purva Mimansa</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>2. Jaimini</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Interpretation of the Vedas and       the importance of Vedic rituals.<br> </span><br>        </p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Other two schools:</b></span></p>    <table>     <col>      <col>      <col>      <thead>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>School (Darshana)</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Founder</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Key Focus Area / Philosophy</b></span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>     </thead>     <tbody>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Vaisheshika</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">Kanada</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Atomic Theory:</b></span><span style=\"font-family:'Nirmala UI'\"> Proposes        that all physical objects are made of atoms (</span><span style=\"font-family:'Nirmala UI'\"><i>parmanu</i></span><span style=\"font-family:'Nirmala UI'\">)        and the five elements.</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Uttar Mimansa(Vedant</b></span><span style=\"font-family:'Nirmala UI'\">)</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">Badarayana</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Metaphysics:</b></span><span style=\"font-family:'Nirmala UI'\"> Based        on the Upanishads; focuses on the relationship        between </span><span style=\"font-family:'Nirmala UI'\"><i>Atman</i></span><span style=\"font-family:'Nirmala UI'\"> (soul)        and </span><span style=\"font-family:'Nirmala UI'\"><i>Brahman</i></span><span style=\"font-family:'Nirmala UI'\"> (ultimate        reality).</span></p>       </td>      </tr>     </tbody>    </table>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Disguised     unemployment is generally found in the agricultural sector.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Cyclical     unemployment is caused by fluctuations in business activities.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the statements given above is/are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both 1 and 2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither 1 nor 2</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct answer (C): Both 1 and 2</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     1 is correct:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Disguised     unemployment</b></span><span style=\"font-family:'Nirmala UI'\"> is a     phenomenon where more people are employed in a task than are     actually required. It is most commonly found in the </span><span style=\"font-family:'Nirmala UI'\"><b>agricultural     sector</b></span><span style=\"font-family:'Nirmala UI'\"> of     developing economies like India. In this scenario, even if some     workers are removed, the total production remains unchanged     because the marginal productivity of the extra labor is zero.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement     2 is correct:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Cyclical     unemployment</b></span><span style=\"font-family:'Nirmala UI'\"> is     directly linked to the </span><span style=\"font-family:'Nirmala UI'\"><b>business     cycle</b></span><span style=\"font-family:'Nirmala UI'\">. It occurs when     there is an inadequate demand for goods and services in the     economy, usually during a recession or a period of economic     slowdown. As business activities fluctuate and demand falls,     companies lay off workers, leading to this type of     unemployment.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Key     Types of Unemployment:</b></span></p>    </li>\n</ul>    <dl>     <dd>     <table>      <col>       <col>       <col>       <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Type</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Core Cause</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Common Example</b></span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Disguised</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">Over-crowding in a specific        sector (surplus labor).</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">A family of 8 working on a        small farm that only needs 3 people.</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Cyclical</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">Economic recession or lack of        demand.</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">Mass layoffs in the IT or auto        sector during a global financial crisis.</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Structural</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">Mismatch between worker skills        and available jobs.</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">Workers losing jobs due to        automation or changes in technology.</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Frictional</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">Time spent searching for a new        job or transitioning.</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">A graduate looking for their        first job or a person switching companies.</span></p>       </td>      </tr>     </table>    </dd>\n</dl>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Permaculture is best described as:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A farming method based on extensive    monoculture cultivation</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A system of sustainable agriculture    designed to imitate natural ecosystems</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A technique of growing crops only    in desert regions</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A method of agriculture dependent    entirely on chemical fertilizers</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>The correct answer is</b></span><span style=\"font-family:'Nirmala UI'\"> (</span><span style=\"font-family:'Nirmala UI'\"><b>B)    A system of sustainable agriculture designed to imitate natural    ecosystems</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Permaculture     is a way of designing gardens, farms, and communities to work     exactly like a natural forest. Instead of fighting nature with     harsh chemicals and exhausting labor, it mimics natural     ecosystems to create self-sustaining, low-maintenance spaces that     grow food and protect the environment.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     A (Monoculture): Monoculture</b></span><span style=\"font-family:'Nirmala UI'\"> is     the practice of growing a single crop, plant, or livestock     species in a specific field or farming system at one time.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     C</b></span><span style=\"font-family:'Nirmala UI'\">: Growing crops     in desert regions is primarily known as </span><span style=\"font-family:'Nirmala UI'\"><b>desert     agriculture or arid farming</b></span><span style=\"font-family:'Nirmala UI'\">.     Because of extreme heat, water scarcity, and sandy soils, this     practice relies on highly advanced, resource-efficient techniques     designed to trap moisture and protect plants from extreme     conditions.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     D</b></span><span style=\"font-family:'Nirmala UI'\">: A method of     agriculture that is entirely or primarily dependent on chemical     fertilizers and other synthetic inputs is known as </span><span style=\"font-family:'Nirmala UI'\"><b>chemical     farming</b></span><span style=\"font-family:'Nirmala UI'\">, or more     broadly, </span><span style=\"font-family:'Nirmala UI'\"><b>conventional.</b></span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Some    Core Permaculture Techniques:</b></span></p>    <table>     <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Technique</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Primary Purpose</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>How it Works</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Swales</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Water Management</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Ditches dug along the contour of       a slope that capture rainwater runoff and allow it to slowly       seep into the ground, recharging the groundwater and hydrating       nearby planting beds.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Mulching</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Soil Building</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Uses organic materials like       straw, dry leaves, or wood chips to cover the soil, retain       moisture, and suppress weeds.</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Guilds</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Ecosystem Stability</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Planting a \"community\"       of plants that support a central species (e.g., a fruit tree       surrounded by nitrogen-fixers and pollinator-attractors).</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Rainwater Harvesting</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Water Management</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Using tanks, cisterns, or ponds       to collect roof runoff or surface water for use during dry       periods.</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Monoculture vs Permaculture:</b></span></p>    <table>     <col>      <col>      <col>      <thead>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Feature</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Monoculture</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Polyculture (Permaculture)</b></span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>     </thead>     <tbody>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Diversity</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">Single species</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">Multiple integrated species</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Resilience</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">Low (Vulnerable to shocks)</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">High (Self-buffering)</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Labor</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">Machine-intensive</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">Knowledge-intensive</span></p>       </td>      </tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr></tr>      <tr>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\"><b>Fertility</b></span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">        <span style=\"font-family:'Nirmala UI'\">External (Synthetic        fertilizers)</span></p>       </td>       <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\ "><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>2nd    edition of the Khelo India Para Games (KIPG)</b></span><span style=\"font-family:'Nirmala UI'\"> was    held in early 2025 across multiple venues in </span><span style=\"font-family:'Nirmala UI'\"><b>New    Delhi</b></span><span style=\"font-family:'Nirmala UI'\">. This initiative    by the </span><span style=\"font-family:'Nirmala UI'\"><b>Ministry of    Youth Affairs and Sports</b></span><span style=\"font-family:'Nirmala UI'\"> aims    to provide a platform for para-athletes to showcase their talent    and promote inclusivity in Indian sports.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>6    sports disciplines</b></span><span style=\"font-family:'Nirmala UI'\"> included    in this edition were:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Para     Athletics</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Para     Archery</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Para     Badminton</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Para     Table Tennis</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Para     Powerlifting</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Para     Shooting </b></span></p>    </li></ol>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Mascot: </b></span><span style=\"font-family:'Nirmala UI'\">The    mascot for the KIPG is </span><span style=\"font-family:'Nirmala UI'\"><b>'Ujjwala'</b></span><span style=\"font-family:'Nirmala UI'\">,    a sparrow, symbolizing pride and determination.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Top    3 states: Harayana &gt; Tamilnadu &gt; Uttar Pradesh</b></span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The modified petiole of Acacia    species that resembles a leaf blade is termed as</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Spine</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Phyllode</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Tendril</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bracts</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>The correct answer is B.    Phyllode</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In    certain species of </span><span style=\"font-family:'Nirmala UI'\"><i>Acacia</i></span><span style=\"font-family:'Nirmala UI'\"> (such    as the Australian Acacia or </span><span style=\"font-family:'Nirmala UI'\"><i>Acacia    auriculoformis</i></span><span style=\"font-family:'Nirmala UI'\">), the    true leaves are often short-lived or absent. To compensate for    this, the </span><span style=\"font-family:'Nirmala UI'\"><b>petiole</b></span><span style=\"font-family:'Nirmala UI'\"> (the    stalk of the leaf) or part of the </span><span style=\"font-family:'Nirmala UI'\"><b>rachis</b></span><span style=\"font-family:'Nirmala UI'\">(the    central, main axis or \"stem\" of a compound leaf where    individual leaflets attach) becomes flattened, green, and    leaf-like to carry out photosynthesis. This specific modification    is called a </span><span style=\"font-family:'Nirmala UI'\"><b>phyllode</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     (A) Spine is incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> These     are sharp, woody, pointed structures. While some </span><span style=\"font-family:'Nirmala UI'\"><i>Acacia</i></span><span style=\"font-family:'Nirmala UI'\"> species     have \"stipular spines\" for protection, they are not     modified leaf stalks used for photosynthesis.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     (C) Tendril is incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> These     are slender, spirally coiled structures used by climbing plants     for support. In plants like peas, the leaflets modify into     tendrils, but in </span><span style=\"font-family:'Nirmala UI'\"><i>Acacia</i></span><span style=\"font-family:'Nirmala UI'\">,     the modification is for surface area, not climbing.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Option     (D) Bracts is incorrect:</b></span><span style=\"font-family:'Nirmala UI'\"> These     are specialized leaves found at the base of a flower or     inflorescence. They are often colored to attract pollinators     (like in Bougainvillea) rather than being a modification of the     petiole for photosynthesis.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Key    Morphological Modifications:</b></span></p>    <table>     <col>      <col>      <col>      <col>      <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Term</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Modified Part</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Purpose</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Example</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Phyllode</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Petiole</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Photosynthesis</span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><i>Acacia</i></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Phylloclade</b></span></p>      </td>      <td style=\"border: 1px solid black;\">\n<p style=\"orphans:0;widows:0\">       <span
