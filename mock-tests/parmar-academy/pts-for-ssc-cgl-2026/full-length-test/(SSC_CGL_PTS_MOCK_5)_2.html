<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>10.) SSC CGL PTS  MOCK 5 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>महाबली      एक <b>परोपकारी असुर राजा </b>थे।</span></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>उन्हें      वर्ष में एक बार अपनी प्रजा      से मिलने की अनुमति दी गई      थी।</span></span></p>     </li></ul>    </li></ul>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>उत्सव     के मुख्य आकर्षण</span></span><span><b>:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>पूक्कलम      </b></span></span><span><b>(</b></span><span style=\"font-family:'Nirmala UI'\"><span><b>फूलों      की रंगोली</b></span></span><span><b>)</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>ओणम      सद्या</b> </span></span><span><b>(</b></span><span style=\"font-family:'Nirmala UI'\"><span><b>पारंपरिक      भोज</b></span></span><span><b>)</b></span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span><b>नौका      दौड़ </b></span></span><span><b>(</b></span><span style=\"font-family:'Nirmala UI'\"><span><b>सर्प      नौका दौड़</b></span></span><span><b>)</b></span></p>     </li></ul>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>महत्वपूर्ण    तथ्य</span></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>ओणम     एक <b>फसल उत्सव</b> है।</span></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><span>यह <b>मलयालम     महीने चिंगम </b></span></span><span><b>(</b></span><span style=\"font-family:'Nirmala UI'\"><span><b>अगस्त</b></span></span><span><b>-</b></span><span style=\"font-family:'Nirmala UI'\"><span><b>सितंबर</b></span></span><span><b>)</b></span><span> </span><span style=\"font-family:'Nirmala UI'\"><span>में     मनाया जाता है।</span></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><span>यह <b>भगवान     विष्णु के वामन अवतार और     राजा महाबली </b>से जुड़ा     है।</span></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0\">    <span>Choose the most appropriate word for the    description: <br> <br> A person who is or claims to be a    professional with specialized knowledge but is actually a fraud or    an impostor.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>virtuoso</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>charlatan</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>connoisseur</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>dilettante</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>charlatan</b></span><span>-     refers to a person falsely claiming to have a special knowledge     or skill; a fraud.</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Synonyms</b></span><span>-      Quack, Sham, Fraud, Impostor, Mountebank</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Antonyms</b></span><span>-      Professional, Authority, Expert, Adept, Specialist</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>connoisseur</b></span><span> -     an expert judge in matters of taste, such as fine art, wine, or     cuisine.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>virtuoso</b></span><span> -     describes a person highly skilled in music or another artistic     pursuit.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>dilettante</b></span><span> -     a person who cultivates an area of interest, such as the arts,     without real commitment or knowledge.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span>Hence, option    B is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Select the option that best expresses the    meaning of the idiom “in the offing” as used in the sentence    below.</span></p>    <p style=\"orphans:0;widows:0\"><span><br> Given    the recent diplomatic movements and military mobilization near the    border, it appears that a major geopolitical shift is in the    offing.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Completely abandoned</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Under severe criticism</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Imminent but not yet visible</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Officially declared</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     idiom </span><span><b>“in the     offing”</b></span><span> means </span><span><b>something     that is going to happen soon</b></span><span>,     especially something that can be expected or is likely to occur     in the near future.</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Origin:      In old sailing days, the </span><span><b>“offing”</b></span><span> referred      to the </span><span><b>part of the sea visible      from the shore but still at a distance</b></span><span>.      Ships that were </span><span><b>in the      offing</b></span><span> could be seen coming      toward the harbor but had </span><span><b>not      yet arrived</b></span><span>. So, if a ship was </span><span><b>in      the offing</b></span><span>, it meant: It was </span><span><b>on      the way</b></span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>In     the sentence, diplomatic movements and military mobilization     are </span><span><b>signs</b></span><span>,     which means the geopolitical shift has </span><span><b>not     happened yet</b></span><span>, but it is </span><span><b>likely     to happen soon</b></span><span>.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span>Hence, Option    C is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the most appropriate synonym of the    word: Puissant</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>feeble</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Potent</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>redundant</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>archaic</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>puissant</b></span><span> —     having great power, influence, or effect.</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Synonyms</b></span><span>-      Mighty, Formidable, Vigorous, Robust</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Antonyms</b></span><span>-      Impotent, Enervated, Feeble, Debilitated, Effete</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>potent </b></span><span>— </span><span><b> </b></span><span>having     great power, strength, or effect.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>feeble —     lacking physical strength, especially as a result of age or     illness.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>redundant</b></span><span> —     not or no longer needed or useful; superfluous.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>archaic</b></span><span>—     very old or old-fashioned.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span>Hence, option    B is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the incorrectly spelt word:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>maintenance</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>questionnaire</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>lieutenant</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>millenium</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>maintenance</b></span><span> (</span><span style=\"font-family:'Nirmala UI'\"><span>रखरखाव</span></span><span>)     — The act of keeping something in good condition.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>questionnaire</b></span><span> (</span><span style=\"font-family:'Nirmala UI'\"><span>प्रश्नावली</span></span><span>)     — A set of questions used to collect information.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>lieutenant</b></span><span> (</span><span style=\"font-family:'Nirmala UI'\"><span>लेफ्टिनेंट     </span></span><span>/ </span><span style=\"font-family:'Nirmala UI'\"><span>उप</span></span><span>-</span><span style=\"font-family:'Nirmala UI'\"><span>अधिकारी</span></span><span>)     — A junior army officer rank.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>millennium</b></span><span> (</span><span style=\"font-family:'Nirmala UI'\"><span>सहस्राब्दी     </span></span><span>/ </span><span style=\"font-family:'Nirmala UI'\"><span>एक     हज़ार वर्ष</span></span><span>) —     A period of 1000 years (it must have a double 'l' and a double     'n').</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span>Hence, Option    D is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the most appropriate antonym of the    word: Pulchritudinous</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>hideous</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>resplendent</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>ethereal</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>exquisite</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>pulchritudinous</b></span><span> —     a formal or literary term for possessing great physical beauty.</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Synonyms</b></span><span>-      Exquisite, Prepossessing, Comely, Ravishing</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Antonyms</b></span><span>-      Hideous, Grotesque, Repulsive, Uncomely, Inelegant</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>hideous</b></span><span> —     extremely ugly or unpleasant; the correct antonym.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>resplendent</b></span><span> —     attractive and impressive through being richly colorful or     sumptuous.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>ethereal</b></span><span> —     extremely delicate and light in a way that seems too perfect for     this world.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>exquisite</b></span><span> —     extremely beautiful and typically delicate.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span>Hence, Option    A is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>In the following questions, a part of the    sentence is underlined. Four alternatives are suggested for the    underlined part. Choose the most appropriate option that improves    the sentence grammatically and contextually. If no improvement is    required, choose Option D (No improvement).<br> </span><br>     </p>    <p style=\"orphans:0;widows:0\"><span>If I </span><span><u>would    have known</u></span><span> about the meeting, I    would have attended it.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>had known</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>knew</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>would know</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>No improvement</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>In     a </span><span><b>Third Conditional</b></span><span> sentence     (which refers to a hypothetical past situation), the structure     is:</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>If    + Past Perfect (had + V3), ... would have + V3.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Correct     Sentence:</b></span><span> \"If I </span><span><b>had     known</b></span><span> about the meeting, I     would have attended it.\"</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span><b>Hence,     Option A is the correct answer.</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Sentences of a paragraph are given below in    jumbled order. Arrange the sentences in the correct order to form    a meaningful and coherent paragraph.</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>In     the modern digital age, data has become one of the most valuable     assets for companies and governments.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>This     has made cyberattacks more frequent and more dangerous than ever     before.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Hackers     often target sensitive information such as financial records,     personal data, and government secrets.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Protecting     data has therefore become a top priority for both private and     public sectors.</span></p>    </li></ol>", "option1": "<p style=\"orphans:0;widows:0\">    <span>1-3-2-4</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>2-4-3-1</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>1-3-4-2</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>2-4-1-3</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Step     1: Find the introductory sentence</b></span><span><br> Sentence     1 introduces the topic: data is valuable in the digital age.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Step     2: Find what follows logically</b></span><span><br> After     talking about valuable data, we talk about hackers targeting data     </span><span><span>→</span></span><span>     Sentence 3.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Step     3: Then comes the result</b></span><span><br> Because     hackers target data, cyberattacks have increased </span><span><span>→</span></span><span>     Sentence 2.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Step     4: Then conclusion idea</b></span><span><br> Protecting     data becomes priority </span><span><span>→</span></span><span>     Sentence 4.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Logical     Flow:</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Introduction    </span><span><span>→</span></span><span>    Target </span><span><span>→</span></span><span>    Result </span><span><span>→</span></span><span>    Importance</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Correct    Order:</b></span><span><br> </span><span><b>1-3-2-4</b></span></p>    <p style=\"orphans:0;widows:0\"><span>Hence, option    A is the correct answer.<br> </span><br>     </p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Select the option that expresses the given    sentence in active voice.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><span>The detailed    research report on climate change and its long-term environmental    impact is being prepared by the team of international scientists.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>The team of international scientists is    preparing the detailed research report on climate change and its    long-term environmental impact.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>The team of international scientists prepares    the detailed research report on climate change and its long-term    environmental impact.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>The team of international scientists has    prepared the detailed research report on climate change and its    long-term environmental impact.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>The detailed research report is preparing the    team of international scientists.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     given sentence is in </span><span><b>Passive     Voice (Present Continuous Tense)</b></span><span>.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Passive    Structure (Present Continuous):</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Object    + is/am/are + being + V³ + by + Subject</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Sentence     Structure:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Object      </span><span><span>→</span></span><span>      The detailed research report</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Passive      Verb </span><span><span>→</span></span><span>      is being prepared</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Subject      </span><span><span>→</span></span><span>      the team of international scientists</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Conversion     Steps:</b></span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Make </span><span><b>the      team of international scientists</b></span><span> the      subject.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Change </span><span><b>is      being prepared </b></span><span><span><b>→</b></span></span><span><b>      is preparing</b></span><span>.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Place      the object after the verb.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Keep      the rest of the sentence unchanged.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Correct     Sentence</b></span><span>- The team of international     scientists is preparing the detailed research report on climate     change and its long-term environmental impact.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span>Hence, Option    A is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Select the most appropriate idiom to fill in    the blank:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><span>The company's    financial reports were a complete fabrication, but the auditors    failed to __________ and the fraud continued for years.\"</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>smell a rat</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>cook the books</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>throw a curveball</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>skate on thin ice</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>smell     a rat</b></span><span> (</span><span style=\"font-family:'Nirmala UI'\"><span>दाल     में कुछ काला लगना </span></span><span>/     </span><span style=\"font-family:'Nirmala UI'\"><span>संदेह     होना</span></span><span>) — to suspect     that something is wrong or that someone is being dishonest.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>cook     the books</b></span><span> (</span><span style=\"font-family:'Nirmala UI'\"><span>खातों     में हेरफेर करना</span></span><span>)     — to dishonestly change official records/accounts to steal     money or avoid taxes. (note: the reports </span><span><i>were</i></span><span> cooked,     but the auditors failed to </span><span><i>smell     a rat</i></span><span>).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>throw     a curveball</b></span><span> (</span><span style=\"font-family:'Nirmala UI'\"><span>अचानक     समस्या पैदा करना</span></span><span>)     — to surprise someone with something that is difficult or     unpleasant to deal with.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>skate     on thin ice</b></span><span> (</span><span style=\"font-family:'Nirmala UI'\"><span>जोखिम     मोल लेना</span></span><span>) — to     be in a risky or dangerous situation.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span>Hence, option    A is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Identify the error in the following sentence:</span></p>    <p style=\"orphans:0;widows:0\"><span>Whomever does    not report to the examination hall before the stipulated time will    not be permitted to mark his attendance in the official register.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Whomever does not report to the</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>examination hall before the stipulated</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>time will not be permitted to mark</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>his attendance in the official register.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0i  style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>In the following question, a part of the    sentence is underlined. Four alternatives are suggested for the    underlined part. Choose the most appropriate option that improves    the sentence grammatically and contextually. If no improvement is    required, choose Option D (No improvement).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><span>The CEO    insisted </span><span><u>to reviewing</u></span><span> the    final proposal before approving the budget.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>on reviewing</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>to review on</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>for reviewing</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>No improvement</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     verb </span><span><b>insist</b></span><span> is     followed by the preposition </span><span><b>on</b></span><span> and     a </span><span><b>gerund (V</b></span><span style=\"font-family:'Cambria Math'\"><span><b>₁</b></span></span><span><b>     + ing)</b></span><span>.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     correct structure is: </span><span><b>Insist +     on + V-ing</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Always     remember these common combinations</b></span><span>:     Insist on, Depend on, Object to, Look forward to, Succeed in,     Persist in, Prevent from, Accuse of, Apologize for, Congratulate     on</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>Sentences of a paragraph are jumbled.    Arrange them in the correct order.</b></span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>As     a result, productivity declines and the quality of work suffers     significantly.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Many     employees today struggle to maintain a balance between their     professional and personal lives.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Continuous     stress and long working hours often lead to mental and physical     exhaustion.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Therefore,     organizations must adopt policies that promote work-life balance     and employee well-being.</span></p>    </li></ol>", "option1": "<p style=\"orphans:0;widows:0\">    <span>2-3-1-4</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>3-2-1-4</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>2-1-3-4</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>3-1-2-4</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Sentence     2</b></span><span> – Introduces the main     topic: employees struggling with work-life balance.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Sentence     3</b></span><span> – Explains the reason:     stress and long working hours cause exhaustion.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Sentence     1</b></span><span> – Gives the result:     productivity declines and work quality suffers.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Sentence     4</b></span><span> – Concludes with the     solution: organizations should promote work-life balance.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Logical     Flow:</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Problem    </b></span><span><span><b>→</b></span></span><span><b>    Cause </b></span><span><span><b>→</b></span></span><span><b>    Result </b></span><span><span><b>→</b></span></span><span><b>    Solution</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Correct    Order:</b></span><span> </span><span><b>2    </b></span><span><span><b>→</b></span></span><span><b>    3 </b></span><span><span><b>→</b></span></span><span><b>    1 </b></span><span><span><b>→</b></span></span><span><b>    4</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Hence,    Option A is the correct answer.</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>Change the following sentence into indirect    speech:</b></span></p>    <p style=\"orphans:0;widows:0\"><span>The officer    said to the clerk, “If you do not submit the documents today,    the application will not be processed.”</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>The officer told the clerk that if he did not    submit the documents that day, the application would not be    processed.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>The officer told the clerk that if you do not    submit the documents today, the application will not be    processed.<br> </span><br>     </p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>The officer said that if he does not submit the    documents today, the application would not be processed.<br> </span><br>     </p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>The officer told the clerk if he had not    submitted the documents that day, the application would not be    processed.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>reporting     verb:</b></span><span> \"said to\"     changes into \"told\". (for     statements), </span><span><b>asked/enquired</b></span><span> (for     questions), or </span><span><b>requested/ordered</b></span><span> (for     imperatives).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>tense     shift:</b></span><span> move the tense one step     back (e.g., </span><span><b>is/am/are</b></span><span> </span><span><span>→</span></span><span> </span><span><b>was/were</b></span><span>, </span><span><b>will</b></span><span> </span><span><span>→</span></span><span> </span><span><b>would</b></span><span>, </span><span><b>do     not</b></span><span> </span><span><span>→</span></span><span> </span><span><b>did     not</b></span><span>).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>pronoun     change:</b></span><span> change </span><span><b>I/me/you</b></span><span> based     on who is speaking and who is being spoken to (</span><span><b>s.o.n.</b></span><span> rule).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>time/place     markers:</b></span><span> change </span><span><b>today</b></span><span> </span><span><span>→</span></span><span> </span><span><b>that     day</b></span><span>, </span><span><b>tomorrow</b></span><span> </span><span><span>→</span></span><span> </span><span><b>the     next day</b></span><span>, </span><span><b>here</b></span><span> </span><span><span>→</span></span><span> </span><span><b>there</b></span><span>,     and </span><span><b>now</b></span><span> </span><span><span>→</span></span><span> </span><span><b>then</b></span><span>.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>conditionals:</b></span><span> in     \"if\" clauses, the tense changes (e.g., </span><span><b>if     I do</b></span><span> </span><span><span>→</span></span><span> </span><span><b>if     I did</b></span><span>), but the third conditional     (</span><span><b>if I had done</b></span><span>)     usually remains the same.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span>Hence, Option    A is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>Identify the incorrectly spelled word in the    following sentence:</b></span></p>    <p style=\"orphans:0;widows:0\"><span>The    scientist’s hypothesis was rigorously tested to ensure its    accurracy before publication.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>scientist’s</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>hypothesis</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>accurracy</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>publication</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Scientist’s</b></span><span> –     possessive form of scientist (</span><span style=\"font-family:'Nirmala UI'\"><span>वैज्ञानिक     का</span></span><span>)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Hypothesis</b></span><span> –     proposed explanation for a phenomenon (</span><span style=\"font-family:'Nirmala UI'\"><span>परिकल्पना     </span></span><span>/ </span><span style=\"font-family:'Nirmala UI'\"><span>अनुमान</span></span><span>)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Accurracy</b></span><span> – </span><span><b>incorrect     spelling</b></span><span>,</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>correct      form: </span><span>   जगहों से डर</b></span></span><span><b>)</b></span><span> —     an extreme or irrational fear of confined or small spaces.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>xenophobia     (</b></span><span style=\"font-family:'Nirmala UI'\"><span><b>अजनबियों     या विदेशी चीज़ों से डर</b></span></span><span><b>)</b></span><span> —     dislike of or prejudice against people from other countries.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>acrophobia     (</b></span><span style=\"font-family:'Nirmala UI'\"><span><b>ऊंचाई     से डर</b></span></span><span><b>)</b></span><span> —     an extreme or irrational fear of heights.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span>Hence, Option    D is the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>The sentence has an underlined word, followed    by four choices. Select the most appropriate option that    improves/corrects the underlined word in the context of the    sentence.</span></p>    <p style=\"orphans:0;widows:0\"><span>Despite    the </span><span><u>tenuous</u></span><span> link    between the two events, the investigator was certain that one had    directly caused the other.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>substantial</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>robust</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>precarious</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>No improvement</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>tenuous</b></span><span> means     very weak or slight (</span><span style=\"font-family:'Nirmala UI'\"><span><b>बहुत     कमजोर या हल्का</b></span></span><span>)</span></p>     <ul> ans:0;widows:0;margin-bottom:0in\"><span>The     idiom </span><span><b>\"once in a blue     moon\"</b></span><span> means </span><span><b>very     rarely</b></span><span> or </span><span><b>not     very often</b></span><span>. Since the speaker lives     in another city, visiting the grandparents happens only on rare     occasions.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option C is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Choose the word which is most similar in    meaning to the given word: Subterfuge</span></p>    <p style=\"orphans:0;widows:0\"><br>     </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Candor</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Rectitude</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Artifice</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Magnanimity</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <br>     </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Subterfuge</b></span><span> –     a trick or cunning plan used to hide one’s true intentions     (</span><span style=\"font-family:'Nirmala UI'\"><span>चालाकी     </span></span><span>/ </span><span style=\"font-family:'Nirmala UI'\"><span>छल</span></span><span>-</span><span style=\"font-family:'Nirmala UI'\"><span>कपट</span></span><span>)</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Synonyms:</b></span><span> Chicanery,      stratagem, artifice, duplicity, guile</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Antonyms:</b></span><span> Candor,      probity, forthrightness, veracity, ingenuousness</span></p>     </li></ul>     </li><li><p style=\"orpha let currentQuestion = 0;

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
