tive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Solution: </b></span><span style=\"font-family:'Nirmala UI'\">The    correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>Apong.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Apong</b></span><span style=\"font-family:'Nirmala UI'\"> is     a traditional rice beer made by the</span><span style=\"font-family:'Nirmala UI'\"><b> Adi     tribe of Arunachal Pradesh.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is a significant cultural element during the solung festival,     promoting </span><span style=\"font-family:'Nirmala UI'\"><b>social     bonding and unity </b></span><span style=\"font-family:'Nirmala UI'\">among     the tribal community.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     solung festival is celebrated to mark </span><span style=\"font-family:'Nirmala UI'\"><b>prosperity,     good harvest, and the welfare of live stock</b></span><span style=\"font-family:'Nirmala UI'\">,     and Apong plays an integral role in these festivities.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Additional    facts:</b></u></i></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Thukpa:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Thukpa     is a</span><span style=\"font-family:'Nirmala UI'\"><b> traditional     noodle soup</b></span><span style=\"font-family:'Nirmala UI'\"> originating     from </span><span style=\"font-family:'Nirmala UI'\"><b>Tibet</b></span><span style=\"font-family:'Nirmala UI'\">,     widely consumed in Northeastern states.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is a</span><span style=\"font-family:'Nirmala UI'\"><b> popular     dish</b></span><span style=\"font-family:'Nirmala UI'\"> but is not     associated with tribal festival like Solung.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Chhang:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is a</span><span style=\"font-family:'Nirmala UI'\"><b> traditional     Himalayan alcoholic beverage</b></span><span style=\"font-family:'Nirmala UI'\"> made     from barley or millet, in popular regions like Ladakh, Nepal and     parts of Sikkim.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Soma:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is an</span><span style=\"font-family:'Nirmala UI'\"><b> ancient Vedic     drink</b></span><span style=\"font-family:'Nirmala UI'\"> mentioned     in </span><span style=\"font-family:'Nirmala UI'\"><b>Rig Veda</b></span><span style=\"font-family:'Nirmala UI'\">,     believed to have ritualistic and spiritual significance.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783594286815_html_971abe44c63c3f12.png\" width=\"418\" height=\"279\" > </p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding Bhartiya Nyaya Sanhita 2023:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     replaced the Indian Penal Code, 1860.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     introduces community service as a form of punishment.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span style=\"font-family:'Nirmala UI'\">It     completely removed all provisions related to sexual offences.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the statements given above are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 and 2 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 and 3 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 and 3 only</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2 and 3.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Solution:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>1    and 2 only.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Statement    1</b></u></span><span style=\"font-family:'Nirmala UI'\">:  </span><span style=\"font-family:'Nirmala UI'\"><b>Bhartiya    Nyaya Sanhita</b></span><span style=\"font-family:'Nirmala UI'\"> replaced    the</span><span style=\"font-family:'Nirmala UI'\"><b> IPC, 1860</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This     marked a </span><span style=\"font-family:'Nirmala UI'\"><b>major     shift</b></span><span style=\"font-family:'Nirmala UI'\"> from     colonial laws to modern Indian criminal laws.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence     the statement is</span><span style=\"font-family:'Nirmala UI'\"><b> Correct.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Statement    2</b></u></span><span style=\"font-family:'Nirmala UI'\">: BNS    introduced </span><span style=\"font-family:'Nirmala UI'\"><b>community    service</b></span><span style=\"font-family:'Nirmala UI'\"> for </span><span style=\"font-family:'Nirmala UI'\"><b>minor    offences</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This     reflects a shift towards </span><span style=\"font-family:'Nirmala UI'\"><b>reformative     justice</b></span><span style=\"font-family:'Nirmala UI'\"> instead of     only punitive measures.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence     the statement is</span><span style=\"font-family:'Nirmala UI'\"><b> Correct.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Statement    3</b></u></span><span style=\"font-family:'Nirmala UI'\">: Sexual offence    laws are still </span><span style=\"font-family:'Nirmala UI'\"><b>present</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In     fact, </span><span style=\"font-family:'Nirmala UI'\"><b>stricter     provisions</b></span><span style=\"font-family:'Nirmala UI'\"> for     crimes against women and children continue to exist.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence     the statement is</span><span style=\"font-family:'Nirmala UI'\"><b> Incorrect</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Quick    takeaway:-</b></u></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>BNS</b></span><span style=\"font-family:'Nirmala UI'\">-replaced</span><span style=\"font-family:'Nirmala UI'\"><b> IPC</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>BNSS</b></span><span style=\"font-family:'Nirmala UI'\">-     replaced</span><span style=\"font-family:'Nirmala UI'\"><b> CrPC</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>BSA</b></span><span style=\"font-family:'Nirmala UI'\">-     replaced</span><span style=\"font-family:'Nirmala UI'\"><b> Evidence     Act</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Additional    facts:</b></u></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>BNSS     2023</b></span><span style=\"font-family:'Nirmala UI'\"> replaced     the </span><span style=\"font-family:'Nirmala UI'\"><b>CrPC, 1973</b></span><span style=\"font-family:'Nirmala UI'\"> and     governs criminal procedure.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     promotes </span><span style=\"font-family:'Nirmala UI'\"><b>digital     processes </b></span><span style=\"font-family:'Nirmala UI'\">like     e-FIR , electronic investigation, and videography of searches.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Introduces </span><span style=\"font-family:'Nirmala UI'\"><b>Zero     FIR transferability</b></span><span style=\"font-family:'Nirmala UI'\"> and     strengthens victims rights (sharing chargesheets, witness     protection).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Makes </span><span style=\"font-family:'Nirmala UI'\"><b>forensic     investigation</b></span><span style=\"font-family:'Nirmala UI'\"> mandatory     for serious offences.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Also     allows </span><span style=\"font-family:'Nirmala UI'\"><b>alternatives     to arrest</b></span><span style=\"font-family:'Nirmala UI'\"> (like     security bond) and emphasizes faster trials.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783594286815_html_a8d3f0ad11fb9d51.png\" width=\"476\" height=\"318\" > </p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The Integrated Air Drop Test    (IADT-1) was conducted for which mission?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Chandrayaan-4</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Aditya L1</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gaganyaan</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">SPADEX</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>C)    Gaganyaan.</b></span><span style=\"font-family:'Nirmala UI'\"> </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">ISRO    successfully conducted its first </span><span style=\"font-family:'Nirmala UI'\"><b>Integrated    Air Drop Test (IADT 1)</b></span><span style=\"font-family:'Nirmala UI'\"> for    the </span><span style=\"font-family:'Nirmala UI'\"><b>Gaganyaan</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>mission</b></span><span style=\"font-family:'Nirmala UI'\">. </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">IADT-1    aimed to validate the performance of the parachute based    deceleration system for the Crew Module of the Gaganyaan mission    in real world scenario.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It    involved collaborations between </span><span style=\"font-family:'Nirmala UI'\"><b>ISRO,    DRDO,  the Indian Air Force,  Indian Navy, and Indian    Coast Guard. </b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Gaganyaan    mission:</b></u></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It    is India's first </span><span style=\"font-family:'Nirmala UI'\"><b>human    spaceflight program, </b></span><span style=\"font-family:'Nirmala UI'\">aiming    to send crew of 3 astronauts to </span><span style=\"font-family:'Nirmala UI'\"><b>Low    Earth Orbit</b></span><span style=\"font-family:'Nirmala UI'\"> at 400    km for 3 days and return them safely to Earth.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">First    manned mission expected to happen in early </span><span style=\"font-family:'Nirmala UI'\"><b>2027</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Read the below statement marked as    Assertion (A) and Reason (R). Mark the correct options:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Assertion    (A): Global Ease of Doing Business (EoDB) indicators excluded    informal sectors.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Reason    (R): Informal enterprises are difficult to measure consistently    across nations.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both A and R are true, R is the    correct explanation of A.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both A and R are true, R is not the    correct explanation of A.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A is true, but R is false.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A is false, but R is true.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Solution:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    correct answer is:</span><span style=\"font-family:'Nirmala UI'\"><b> Both    A and R true, and R is</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>the    correct explanation of A.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Why    A is true:</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     mainly </span><span style=\"font-family:'Nirmala UI'\"><b>assessed the     formal regulatory</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>environment</b></span><span style=\"font-family:'Nirmala UI'\">,     not the entire economy, which is why</span><span style=\"font-family:'Nirmala UI'\"><b> informal     sectors were not included</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Why    R is true:</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Informal     enterprises usually operate without registration, proper     accounting, or standardized reporting system. Because of this,     reliable data about their </span><span style=\"font-family:'Nirmala UI'\"><b>operations     is not systematically recorded.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Why    R correctly explains A.</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     (EoDB) indicators were designed to compare business regulations     across countries using measurable and verifiable data.     Since</span><span style=\"font-family:'Nirmala UI'\"><b> informal     firms lack consistent data</b></span><span style=\"font-family:'Nirmala UI'\">,     including them distort comparisons. Therefore, they were excluded     because they are difficult to measure uniformly- </span><span style=\"font-family:'Nirmala UI'\"><b>this     directly links R as the correct explanation of A</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><b>About    Global Ease of Doing Business:</b></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     EoDB report was published by the </span><span style=\"font-family:'Nirmala UI'\"><b>World     Bank.</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">It     ranked countries based on</span><span style=\"font-family:'Nirmala UI'\"><b> how     easy it is to start and run a business</b></span><span style=\"font-family:'Nirmala UI'\">,     using indicators like starting a business, getting credit, paying     taxes, and enforcing contracts.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The 9th edition of India pharma    2026 was hosted by which department?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Department of Biotechnology</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Department of Pharmaceuticals</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ministry of Health and Family    welfare</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">NITI Aayog</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Solution:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    correct answer is:</span><span style=\"font-family:'Nirmala UI'\"><b> Department    of Pharmaceuticals.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>9th     edition</b></span><span style=\"font-family:'Nirmala UI'\"> was hosted     by Department of pharmaceuticals.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span style=\"font-family:'Nirmala UI'\">Gathering     of </span><span style=\"font-family:'Nirmala UI'\"><b>top industry     leaders.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Theme</b></u></span><span style=\"font-family:'Nirmala UI'\">-</span><span style=\"font-family:'Nirmala UI'\"><b> Discover     in India:</b></span><span style=\"font-family:'Nirmala UI'\"> Leapfrogging     Life-Sciences Innovation.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Focus     on </span><span style=\"font-family:'Nirmala UI'\"><b>future biotech &amp;     R&amp;D</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Aiming     for </span><span style=\"font-family:'Nirmala UI'\"><b>global     pharmaceutical leadership.</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the most appropriate one    word substitution for the following :</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">To    express or feel sympathy or pity.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Commiserate</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Vagabond</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Hypocrite</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Drought</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Commiserate</b></span><span style=\"font-family:'Nirmala UI'\">:     to express or feel sympathy or pity.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Vagabond</b></span><span style=\"font-family:'Nirmala UI'\">:     a person who wanders from place to place without a fixed home,     job, or visible means of support.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Hypocrite</b></span><span style=\"font-family:'Nirmala UI'\">:     a person who pretends to have higher moral standards, beliefs, or     virtues that their actual behavior contradicts.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Drought</b></span><span style=\"font-family:'Nirmala UI'\">:     a prolonged period of little or no rainfall.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Choose the most appropriate synonym    of the word “Cascade”.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Waterfall</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Plateau</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Barrier</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Summit</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Cascade</b></span><span style=\"font-family:'Nirmala UI'\"> -     a small waterfall or a succession of stages in a process that     flows downward.</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Synonyms:</b></span><span style=\"font-family:'Nirmala UI'\"> Waterfall,      Cataract, Deluge, Rush, Flow</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Antonyms:</b></span><span style=\"font-family:'Nirmala UI'\"> Barrier,      Blockage, Stoppage</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Waterfall</b></span><span style=\"font-family:'Nirmala UI'\"> –     a mass of water falling from a height. </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Plateau</b></span><span style=\"font-family:'Nirmala UI'\"> –     an area of high, flat land.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Barrier</b></span><span style=\"font-family:'Nirmala UI'\"> –     an obstacle that prevents movement.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Summit</b></span><span style=\"font-family:'Nirmala UI'\"> –     the highest point of a hill or mountain.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Choose the correctly spelt word.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Colloquial</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Pronounciation</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Supercede</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Occurence</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Colloquial</b></span><span style=\"font-family:'Nirmala UI'\">:     relating to informal language used in everyday speech.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Pronunciation</b></span><span style=\"font-family:'Nirmala UI'\">:     the act of producing the sounds of a language, including word     stress, intonation, and rhythm.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Supersede</b></span><span style=\"font-family:'Nirmala UI'\">:     to take the place of, replace, or succeed something, often     because the original is older, inferior, or no longer functional.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Occurrence</b></span><span style=\"font-family:'Nirmala UI'\">:     an incident, event, or happening, particularly one that takes     place unexpectedly or frequently.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the most appropriate option    for the voice change of the following sentence.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Your    shirt needs washing.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Your shirt is needed to be washed.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Your shirt needs to be washed.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is your shirt that is needed to    be washed.<br>  </span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Your shirt is being needed to be    washed.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     passive voice form of \"Your shirt needs washing\" is     \"Your shirt needs to be washed\". This construction     indicates that the action of washing </span><span style=\"font-family:'Nirmala UI'\"><b>must     be done to the shirt by someon</b></span><span style=\"font-family:'Nirmala UI'\">e,     without specifying who.</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This      sentence structure is used for items that need maintenance or      fixing.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It      is similar to other quasi-passive forms like \"My hair needs      cutting\" or \"The room needs painting\".</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate option    for the narration change of the following question.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Mr.    Sharma said, “My children, this is the last lesson I shall give    you. </span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mr. Sharma addressed the children    affectionately and said that it was the last lesson he would give    them.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mr. Sharma told his children that    it is the last lesson he would give them.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mr. Sharma asked his children that    it was the last lesson he would give them.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mr. Sharma addressed the children    affectionately and told that it was the last lesson he will give    them.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     given sentence is in </span><span style=\"font-family:'Nirmala UI'\"><b>direct     speech</b></span><span style=\"font-family:'Nirmala UI'\">. To convert it     into </span><span style=\"font-family:'Nirmala UI'\"><b>indirect     speech</b></span><span style=\"font-family:'Nirmala UI'\">, the following     changes are made:</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     vocative </span><span style=\"font-family:'Nirmala UI'\"><b>\"My     children\"</b></span><span style=\"font-family:'Nirmala UI'\"> is     changed to </span><span style=\"font-family:'Nirmala UI'\"><b>addressed     the children affectionately</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">this     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     that</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">I     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     he</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">you     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     them</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">shall     </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     would</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Correct     Indirect Speech:</b></span><span style=\"font-family:'Nirmala UI'\"> Mr.     Sharma addressed the children affectionately and said that it was     the last lesson he would give them.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the option that can be used    as a one-word substitute for the given group of words.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">A    person who studies and collects stamps.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Numismatist</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bibliophile</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Philatelist</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Archaeologist</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A </span><span style=\"font-family:'Nirmala UI'\"><b>Philatelist</b></span><span style=\"font-family:'Nirmala UI'\"> is     a person who studies and collects </span><span style=\"font-family:'Nirmala UI'\"><b>postage     stamps</b></span><span style=\"font-family:'Nirmala UI'\"> and related     postal materials.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Numismatist</b></span><span style=\"font-family:'Nirmala UI'\"> –     A person who collects or studies coins and currency.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Bibliophile</b></span><span style=\"font-family:'Nirmala UI'\"> –     A person who loves or collects books.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Archaeologist</b></span><span style=\"font-family:'Nirmala UI'\"> –     A person who studies human history through excavations.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option C is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Choose the most appropriate meaning    of the following idiom.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hit    the nail on the head</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To strike someone with a hammer</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To describe exactly what is causing    a situation or problem</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To complete a task very quickly</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To make a careless mistake</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     idiom </span><span style=\"font-family:'Nirmala UI'\"><b>\"hit the     nail on the head\"</b></span><span style=\"font-family:'Nirmala UI'\"> means </span><span style=\"font-family:'Nirmala UI'\"><b>to     say or do exactly the right thing or to identify the exact cause     of a problem</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The      idiom </span><span style=\"font-family:'Nirmala UI'\"><b>\"hit      the nail on the head\"</b></span><span style=\"font-family:'Nirmala UI'\"> originated      from </span><span style=\"font-family:'Nirmala UI'\"><b>carpentry</b></span><span style=\"font-family:'Nirmala UI'\">.      When driving a nail into wood, the most effective way is to      strike </span><span style=\"font-family:'Nirmala UI'\"><b>the head of      the nail</b></span><span style=\"font-family:'Nirmala UI'\"> accurately      with a hammer. If you hit it precisely, the nail goes in      straight and the job is done correctly. If you miss the head,      the nail may bend or the work may be spoiled. This literal      action gave rise to the figurative meaning of </span><span style=\"font-family:'Nirmala UI'\"><b>doing      or saying exactly the right thing</b></span><span style=\"font-family:'Nirmala UI'\"> or </span><span style=\"font-family:'Nirmala UI'\"><b>identifying      the exact cause of a problem</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Directions: Read the sentence to    find out whether there is any grammatical or idiomatic error in    it. The error, if any, will be in one part of the sentence. Mark    the parts with the error as your answer. If there is No error,    mark (D). (Ignore errors of punctuation, if any).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">China    for its part expressed confidence on (A) / Ms. Lam and her    government but said it would (B) /not sit idly by if the unrest    threatened Chinese security and sovereignty (C) / No Error (D)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">China for its part expressed    confidence on</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ms. Lam and her government but said    it would</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">not sit idly by if the unrest    threatened Chinese security and sovereignty.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">No error</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     phrase </span><span style=\"font-family:'Nirmala UI'\"><b>\"expressed     confidence on\"</b></span><span style=\"font-family:'Nirmala UI'\"> is     incorrect. The correct preposition used with </span><span style=\"font-family:'Nirmala UI'\"><b>express     confidence</b></span><span style=\"font-family:'Nirmala UI'\"> is </span><span style=\"font-family:'Nirmala UI'\"><b>\"in\"</b></span><span style=\"font-family:'Nirmala UI'\">,     not </span><span style=\"font-family:'Nirmala UI'\"><b>\"on\"</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">There     is no other error in any other part of the given sentence.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Correct     sentence: China for its part expressed confidence in Ms. Lam and     her government but said it would not sit idly by if the unrest     threatened Chinese security and sovereignty.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option A is the correct answer. </span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Fill in the blank with the most    appropriate word.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Despite    facing several setbacks, she remained ________ and continued    working towards her goal.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Despondent</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Resolute</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Indifferent</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Timid</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     sentence indicates that despite difficulties, she continued to     work towards her goal. Therefore, the word should     convey </span><span style=\"font-family:'Nirmala UI'\"><b>determination</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Resolute</b></span><span style=\"font-family:'Nirmala UI'\"> –     determined and unwavering in purpose. </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Despondent</b></span><span style=\"font-family:'Nirmala UI'\"> –     feeling hopeless or discouraged.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Indifferent</b></span><span style=\"font-family:'Nirmala UI'\"> –     showing no interest or concern.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Timid</b></span><span style=\"font-family:'Nirmala UI'\"> –     lacking courage or confidence.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Choose the most appropriate synonym    of the word \"><span style=\"font-family:'Nirmala UI'\">To    convert it into the </span><span style=\"font-family:'Nirmala UI'\"><b>passive    voice</b></span><span style=\"font-family:'Nirmala UI'\">:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     object </span><span style=\"font-family:'Nirmala UI'\"><b>\"the     results\"</b></span><span style=\"font-family:'Nirmala UI'\"> becomes     the subject.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     auxiliary </span><span style=\"font-family:'Nirmala UI'\"><b>\"will     be\"</b></span><span style=\"font-family:'Nirmala UI'\"> is used     with the </span><span style=\"font-family:'Nirmala UI'\"><b>past     participle (V³)</b></span><span style=\"font-family:'Nirmala UI'\"> of     the verb (</span><span style=\"font-family:'Nirmala UI'\"><b>announced</b></span><span style=\"font-family:'Nirmala UI'\">).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     doer is introduced with </span><span style=\"font-family:'Nirmala UI'\"><b>\"by\"</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Correct     Passive Voice:</b></span><span style=\"font-family:'Nirmala UI'\"><br> The     results will be announced by the committee tomorrow.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate option    for the narration change of the following question.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p> mpressive yet ineffective</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">False hopes</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Necessary evil</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Total dominance</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A     \"damp squib\" is an idiom describing an event,     performance, or idea that is expected to be </span><span style=\"font-family:'Nirmala UI'\"><b>exciting</b></span><span style=\"font-family:'Nirmala UI'\">, </span><span style=\"font-family:'Nirmala UI'\"><b>important</b></span><span style=\"font-family:'Nirmala UI'\">,     or </span><span style=\"font-family:'Nirmala UI'\"><b>impressive</b></span><span style=\"font-family:'Nirmala UI'\"> but     turns out to be </span><span style=\"font-family:'Nirmala UI'\"><b>disappointing</b></span><span style=\"font-family:'Nirmala UI'\">,     boring, or a failure.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     refers to an anticlimax, often used when high anticipation leads     to a lackluster result.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Example     : The much-anticipated product launch was a total damp squib when     no one showed up\".</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Directions: Read the sentence to    find out whether t p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">34     × 2.5 = 85</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    85 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 77, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In a certain code language, ‘blue    is sky’ is written as ‘@ % #’, ‘clear sky’ is written as    ‘&amp; @’, and ‘water is clear’ is written as ‘% $ &amp;’.    What is the code for ‘blue’?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">#</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">$</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">@</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">&amp;</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">We will decode only those sentences    in which the asked word is present.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>'Sky' </b></span><span style=\"font-family:'Nirmala UI'\">is     present in first and second sentence, common code in both     sentences is @ </span><span style=\"font-family:'Nirmala UI'\"><b>(Sky     </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     @)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>'Is'</b></span><span style=\"font-family:'Nirmala UI'\"> is     present in first and third sentence, common code in both     sentences is % </span><span style=\"font-family:'Nirmala UI'\"><b>(Is     </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     %)</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>'Blue' </b></span><span style=\"font-family:'Nirmala UI'\">is     present in first sentence only and code for blue remaining is     # </span><span style=\"font-family:'Nirmala UI'\"><b>(Blue </b></span><span><b>→</b></span><span style=\"font-family:'Nirmala UI'\"><b>     #)</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    # is the correct answer.</b></span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783594286815_html_8b6096f5a2edb815.png\" width=\"342\" height=\"228\" > </p>", "question_heading": ""}, {"sr_no": 78, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Read the given statements and    conclusions carefully. Assuming that the information given in the    statements is true, even if it appears to be at variance with    commonly known facts, decide which of the given conclusion(s)    logically follow(s) from the statements.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Statements:</b></span><span style=\"font-family:'Nirmala UI'\"><br> All    desktops are monitors.<br> All monitors are CPUs.<br> No CPU is    a mouse<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Conclusions:</b></span><span style=\"font-family:'Nirmala UI'\"><br> I.    All desktops are CPUs.<br> II. Some monitors are not    desktops.<br> III. No mouse is a monitor.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">All conclusion (I), (II) and (III)    follow.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only conclusion (I) and (II)    follows.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only conclusion (I) and (III)    follows.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only conclusion (II) and (III)    follows.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Draw the Venn diagram, according to    the given statements:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783594286815_html_572e49955a00e7d5.png\" width=\"375\" height=\"122\" > </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion     I:</b></span><span style=\"font-family:'Nirmala UI'\"> All desktops     are inside monitor which is inside CPU. So, all desktops are     definitely CPU.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion     II:</b></span><span style=\"font-family:'Nirmala UI'\"> We have given,     all desktops are monitors but we have no information given about     some part of monitor having negative relation with desktop. So,     some parts of monitor is not CPU is not true. This conclusion is     definitely wrong.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion     III:</b></span><span style=\"font-family:'Nirmala UI'\"> All monitors     are CPU and no CPU is mouse. So, no mouse is monitor is     definitely true.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    only conclusion (I) and (III) follow, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Pointing to a photograph, a man    said, \"I have no brother or sister, but that man’s father    is my father’s son.\" Whose photograph was it?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">His nephew’s</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">His son’s</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">His father’s</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">His own</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     man says he has no brother or sister, so he is the </span><span style=\"font-family:'Nirmala UI'\"><b>only     child</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">So, </span><span style=\"font-family:'Nirmala UI'\"><b>“my     father’s son”</b></span><span style=\"font-family:'Nirmala UI'\"> means </span><span style=\"font-family:'Nirmala UI'\"><b>the     man himself</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Then     the statement becomes: </span><span style=\"font-family:'Nirmala UI'\"><b>“that     man’s father is me.”</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">So,     the person in the photograph is </span><span style=\"font-family:'Nirmala UI'\"><b>his     son</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;wido :0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Let's    put these values to both examples.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783594286815_html_d996fd67cb165b6.jpg\" width=\"298\" height=\"383\" > </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">After    putting the arithmetic signs in 6 # 5 @ 6 &amp; 7</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">6     × 5 + 6 − 7</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">30     + 6 - 7 = 29</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    29 is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 83, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the correct mirror image of    the given combination when the mirror is placed to its right:</span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783594286815_html_527912462f9ad242.png\" width=\"250\" height=\"189\" > </p>", "option1": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">a.</span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783594286815_html_be7b3617952c9b0b.png\" width=\"250\" height=\"53\" > </p>", "option2": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">b.</span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783594286815_html_1b04a14544c92866.png\" width=\"250\" height=\"52\" > </p> ption2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Conclusion II follows</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither I nor II follows</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both I and II follow</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion     I: Does not follow</b></span><span style=\"font-family:'Nirmala UI'\"> because     it talks about replacing the plastic which is </span><span style=\"font-family:'Nirmala UI'\"><b>not     mentioned </b></span><span style=\"font-family:'Nirmala UI'\">in the     given statement.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Conclusion     II:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Definitely     follow</b></span><span style=\"font-family:'Nirmala UI'\"> because the     statement </span><span style=\"font-family:'Nirmala UI'\"><b>mentioned</b></span><span style=\"font-family:'Nirmala UI'\"> the     ban of plastic to control environmental pollution.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    only II follows, is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 85, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">What will come at the place of    question mark?</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">3125,    625, 630, 126, ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">125</span></p>", "option2": " <p style= /span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">DFH</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Check the forward and backward    shift of the letters in the given options,</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">K     + 2 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     M + 2 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     O</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">P     + 2 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     R - 1 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     Q</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">T     + 2 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     V + 2 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     X</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">D     + 2 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     F + 2 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     H</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">All    the given options are following</span><span style=\"font-family:'Nirmala UI'\"><b> +2,    +2</b></span><span style=\"font-family:'Nirmala UI'\"> pattern except    PRQ.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    PRQ is odd.</b></span></p>", "question_heading": ""}, {"sr_no": 87, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Arrange the following words    according to the English dictionary.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">1.    Application</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">2.    Notification</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">3.    Exam</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">4.    Interview</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">5.    Result</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2, 1, 3, 5, 4</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 3, 4, 2, 5</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2, 1, 3, 4, 5</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2, 3, 1, 5, 4</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Dictionary order:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Application,     Exam, Interview, Notification, Result</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">So,    the correct order is:</span><span style=\"font-family:'Nirmala UI'\"><b> 1,    3, 4, 2, 5</b></span></p>", "question_heading": ""}, {"sr_no": 88, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If in a code A = 26, B = 25, …, Z    = 1, what is the code for </span><span style=\"font-family:'Nirmala UI'\"><b>REVISION</b></span><span style=\"font-family:'Nirmala UI'\">?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">9, 21, 5, 18, 8, 22, 2, 15</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">9, 22, 5, 18, 8, 22, 13, 12</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">18, 5, 22, 9, 8, 22, 12, 13</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">9, 22, 5, 18, 8, 18, 12, 13.</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The formula to find the place value    of any letter from right end (A=26, B= 25.... Z=1) is:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Code    = 27 - (letter position from the left end)</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">R     (18) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     27 - 18 = 9</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">E     (5) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     27 - 5 = 22</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">V     (22) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     27 - 22 = 5</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">I     (9) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     27 - 9 = 18</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">S     (19) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     27 - 19 = 8</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">I     (9) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     27 - 9 = 18</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">O     (15) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     27 - 15 = 12</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">N     (14) </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     27 - 14 = 13</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">By    combining these values, the code for REVISION is: </span><span style=\"font-family:'Nirmala UI'\"><b>9,    22, 5, 18, 8, 18, 12, 13.</b></span></p>", "question_heading": ""}, {"sr_no": 89, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Six people A, B, C, D, E, and F are    sitting in a circle facing the center. Two people sit between A    and C. D is third to the left of B, but not immediate neighbour of    C. E is immediate left of C. Who is sitting opposite to F?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">B</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">D</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">E</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "      <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Two     people between A and C means they are opposite to each other.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">E     is immediate left of C.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">D     is third to the left of B, but not immediate neighbour of C.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Final    layout,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783594286815_html_59086f0d78e0c618.jpg\" width=\"250\" height=\"250\" > </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    E is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 90, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Find the missing number.</span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783594286815_html_afd669875dc67677.png\" width=\"250\" height=\"209\" > </p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">10</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">18</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">5</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">9</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">There is some mathematical    operation done on the smaller numbers to get larger number.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">If    8 × 7 + 8 + 7 = 71 and 6 × 7 + 6 + 7 = 55</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Then,    the pattern must be</span><span style=\"font-family:'Nirmala UI'\"><b> (axb)    + (a + b) = c</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Now,    apply it to middle row:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(4     × b) + 4 + b = 29</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">4b     + 4 + b = 29</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">5b     = 29 - 4 = 25</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">b     = 25/5 = 5</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>So,    the missing value is 5.</b></span></p>", "question_heading": ""}, {"sr_no": 91, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A man starts from his house and    walks 4 km North, then turns right and walks 3 km, then turns left    and walks 2 km. In which direction is he now with respect to his    starting point?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">North-East</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">North-West</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">South-East</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">North</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">When the direction is asked, no    need to draw the diagram. simply check the directions.</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Man     is facing </span><span style=\"font-family:'Nirmala UI'\"><b>north     initially</b></span><span style=\"font-family:'Nirmala UI'\"> and move     4km in that direction.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Turns </span><span style=\"font-family:'Nirmala UI'\"><b>right</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     walks </span><span style=\"font-family:'Nirmala UI'\"><b>3 km East</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Turns </span><span style=\"font-family:'Nirmala UI'\"><b>left</b></span><span style=\"font-family:'Nirmala UI'\"> from     East </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     walks </span><span style=\"font-family:'Nirmala UI'\"><b>2 km North</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">So    overall, he moves:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">North     = 4 + 2 = 6 km and East = 3 km.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783594286815_html_2f204e1729bd2780.jpg\" width=\"250\" height=\"250\" > </p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    the man is North- East from the starting point.</b></span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the set in which the numbers    are related in the same way as the numbers in the following set:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">(9,    15, 25)</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">(8,    16, 25)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6, 10, 16</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">12, 20, 33</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">18, 30, 50</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">15, 25, 152</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Apply Mathematical operation on    smaller values to get larger value.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">If    we simply add the smaller value, we get:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">9     + 15 = 24 (which is 1 less then 25)</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">8     + 16 = 24 (which is 1 less then 25)</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It    means the pattern should be </span><span style=\"font-family:'Nirmala UI'\"><b>(a    + b) + 1 = c</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Check    the given options:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">6,     10, 16 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     6 + 10 +1 = 17</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">12,     20, 33 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     12 + 20 + 1 = 33</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">18,     30, 50 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     18 + 30 + 1 = 49</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">15,     25, 152 </span><span>→</span><span style=\"font-family:'Nirmala UI'\">     15 + 25 + 1 = 41</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Only    12, 20, 33 follows the pattern.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><b>Hence,    option b is the correct answer.</b></span></p>", "question_heading": ""}, {"sr_no": 93, "question": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the figure that will come    next in the following series.</span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783594286815_html_de3d5618ba6a835.png\" width=\"331\" height=\"77\" > </p>", "option1": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">a.</span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783594286815_html_1e44b240ef711cb6.png\" width=\"132\" height=\"115\" > </p>", "option2": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">b.</span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/web
