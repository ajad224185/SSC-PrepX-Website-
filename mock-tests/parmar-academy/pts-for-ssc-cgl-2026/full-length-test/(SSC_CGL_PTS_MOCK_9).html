<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>17.) SSC CGL PTS  MOCK 9 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

<span style=\"font-family:'Nirmala UI'\"><b> Anticlockwise</b></span><span style=\"font-family:'Nirmala UI'\"> in </span><span style=\"font-family:'Nirmala UI'\"><b>Northern    Hemisphere</b></span><span style=\"font-family:'Nirmala UI'\"> and</span><span style=\"font-family:'Nirmala UI'\"><b> Clockwise</b></span><span style=\"font-family:'Nirmala UI'\"> in </span><span style=\"font-family:'Nirmala UI'\"><b>Southern    Hemisphere</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Statement    2-</b></u></span><span style=\"font-family:'Nirmala UI'\"> The </span><span style=\"font-family:'Nirmala UI'\"><b>eye</b></span><span style=\"font-family:'Nirmala UI'\"> of    cyclone is a </span><span style=\"font-family:'Nirmala UI'\"><b>calm    region</b></span><span style=\"font-family:'Nirmala UI'\">. Hence the    statement is </span><span style=\"font-family:'Nirmala UI'\"><b>incorrect.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Some    important points regarding Cyclones</b></u></span><span style=\"font-family:'Nirmala UI'\"><b>-</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Cyclones     are rotating mass of air.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">During     cyclones, </span><span style=\"font-family:'Nirmala UI'\"><b>cumulonimbus</b></span><span style=\"font-family:'Nirmala UI'\"> clouds     are formed with extensive vertical development.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Favorable    conditions for formation of cyclones</b></u></span><span style=\"font-family:'Nirmala UI'\"><b>-</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">large     sea surface temperature.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Atmospheric     Instability.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Coriolis     force.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Pre     existing weak low pressure area.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The formation of a spectrum by a    glass prism occurs due to:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Scattering</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Refraction</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Dispersion</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Reflection</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>Dispersion.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Dispersion</b></u></span><span style=\"font-family:'Nirmala UI'\">-Dispersion     of light is the phenomenon where </span><span style=\"font-family:'Nirmala UI'\"><b>white     light splits into its constituent colors</b></span><span style=\"font-family:'Nirmala UI'\">—the     visible spectrum—as it passes through a refractive medium like     a glass prism.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This     separation occurs because different wavelengths (colors) of light     travel at </span><span style=\"font-family:'Nirmala UI'\"><b>different     speeds in the medium</b></span><span style=\"font-family:'Nirmala UI'\">,     causing each to bend, or refract, at a slightly different angle.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Scattering</b></u></span><span style=\"font-family:'Nirmala UI'\">-Scattering     of light occurs when light rays hit obstacles like dust, gas     molecules, or water droplets, causing the light to </span><span style=\"font-family:'Nirmala UI'\"><b>deviate     from its straight path</b></span><span style=\"font-family:'Nirmala UI'\"> and     spread in various directions.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Refraction</b></u></span><span style=\"font-family:'Nirmala UI'\">-Refraction     is the phenomenon where a light ray </span><span style=\"font-family:'Nirmala UI'\"><b>bends     as it passes obliquely</b></span><span style=\"font-family:'Nirmala UI'\"> from     one transparent medium to another due to a change in its speed.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">When     light travels from a </span><span style=\"font-family:'Nirmala UI'\"><b>rarer     to a denser medium</b></span><span style=\"font-family:'Nirmala UI'\"> (like     air to glass), it</span><span style=\"font-family:'Nirmala UI'\"><b> bends     toward</b></span><span style=\"font-family:'Nirmala UI'\"> the normal;     conversely, it</span><span style=\"font-family:'Nirmala UI'\"><b> bends     away</b></span><span style=\"font-family:'Nirmala UI'\"> from the     normal when </span><span style=\"font-family:'Nirmala UI'\"><b>entering     a rarer medium</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\"><u><b>Reflection</b></u></span><span style=\"font-family:'Nirmala UI'\">-Reflection     is the phenomenon where a </span><span style=\"font-family:'Nirmala UI'\"><b>light     ray strikes</b></span><span style=\"font-family:'Nirmala UI'\"> a     polished or smooth surface and </span><span style=\"font-family:'Nirmala UI'\"><b>bounces     back into the same medium</b></span><span style=\"font-family:'Nirmala UI'\"> from     which it originated.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which one among the following is    the earliest text?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Natyashastra of Bharata</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sushruta Samhita</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ashtadhyayi</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Manusmriti</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Solution:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>Ashtadhyayi.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">·         </span><span style=\"font-family:'Nirmala UI'\"><b>Ashtadhyayi, </b></span><span style=\"font-family:'Nirmala UI'\">work    on Sanskrit Grammar was written by Panini in </span><span style=\"font-family:'Nirmala UI'\"><b>500    BCE.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">·         </span><span style=\"font-family:'Nirmala UI'\"><b>Manusmriti,    (200 BC- 200 CE),</b></span><span style=\"font-family:'Nirmala UI'\"> also    known as laws of Manu.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">·         </span><span style=\"font-family:'Nirmala UI'\"><b>Charak</b></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><b>Sushruta    samhita,</b></span><span style=\"font-family:'Nirmala UI'\"> work on    medicine was written in </span><span style=\"font-family:'Nirmala UI'\"><b>100    CE.</b></span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">·         </span><span style=\"font-family:'Nirmala UI'\"><b>Natyashastra</b></span><span style=\"font-family:'Nirmala UI'\"> of    Bharata, a work on dramaturgy was written in </span><span style=\"font-family:'Nirmala UI'\"><b>300    CE,</b></span><span style=\"font-family:'Nirmala UI'\"> it is also    considered as 5th Veda.</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following is a key    feature of monopolistic competition?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Single seller with no close    substitutes.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Large number of firms selling    differentiated products.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Products are completely    homogeneous.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Full control over price with high    barriers to entry.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">     </p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Solution:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    correct answer is: Large number of firms selling differentiated    products.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Monopolistic    competition:</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Many     seller and many buyers for a product.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span style=\"font-family:'Nirmala UI'\">Products     are similar but not identical </span><span style=\"font-family:'Nirmala UI'\"><b>(differentiated).</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">some     control over price.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">easy     entry and exit.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">E.g.     Toothpaste.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Perfect    competition:</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Many     buyers and sellers.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Products     are</span><span style=\"font-family:'Nirmala UI'\"><b> identical     (homogenous)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">No     barriers to entry.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Price     is determined by supply and demand.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">E.g.     Agricultural products.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Oligopoly</b></u></span><span style=\"font-family:'Nirmala UI'\"><b>:</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>A     few large firms dominate the market</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Products     may be similar or differentiated.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Many     buyers for one product.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span style=\"font-family:'Nirmala UI'\">No     easy entry</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">E.g.     Telecom sector.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Monopoly:</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>One     seller controls the entire market</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">No     close substitute for the product. </span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">High     barriers to entry.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">E.g.     Indian Railways.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> </p>    <p style=\"orphans:0;widows:0\"> </p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding the Cabinet Mission Plan:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     total number of seats proposed for the Constituent Assembly was     389.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">All     members of the Constituent Assembly were directly elected by the     people.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Seats     were divided among General, Muslims, and Sikh categories.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     election to the Constituent Assembly was based on proportional     representation with single transferable vote.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the statements given above are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 3 and 4 only</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 and 2 only</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2, 3 and 4 only</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2, 3 and 4</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Solution:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>1,    3 and 4 only.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Statement    1</b></u></span><span style=\"font-family:'Nirmala UI'\">- The Cabinet    Mission Plan proposed a Constituent Assembly of</span><span style=\"font-family:'Nirmala UI'\"><b> 389    members</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">These    included representatives from British India and princely states.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence    the statement is </span><span style=\"font-family:'Nirmala UI'\"><b>Correct.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Statement    2</b></u></span><span style=\"font-family:'Nirmala UI'\">- Members</span><span style=\"font-family:'Nirmala UI'\"><b> were    not directly elected</b></span><span style=\"font-family:'Nirmala UI'\"> by    the public.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">They    were</span><span style=\"font-family:'Nirmala UI'\"><b> elected    indirectly</b></span><span style=\"font-family:'Nirmala UI'\"> by    provincial assemblies.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence    the Statement is</span><span style=\"font-family:'Nirmala UI'\"><b> Incorrect.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Statement    3- </b></u></span><span style=\"font-family:'Nirmala UI'\">Seats were    divided into </span><span style=\"font-family:'Nirmala UI'\"><b>General,    Muslims and Sikh categories.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This    was done to ensure community representation.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence    the Statement is</span><span style=\"font-family:'Nirmala UI'\"><b> Correct</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Statement    4</b></u></span><span style=\"font-family:'Nirmala UI'\">- Election were    based on </span><span style=\"font-family:'Nirmala UI'\"><b>Proportional    Representation.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     method used was Single Transferable Vote </span><span style=\"font-family:'Nirmala UI'\"><b>(STV)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence    the Statement is </span><span style=\"font-family:'Nirmala UI'\"><b>Correct.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u>Some    important facts:</u></i></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Total     seats-</span><span style=\"font-family:'Nirmala UI'\"><b> 389.</b></span></p>    </li></ul>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Elected     members</b></u></span><span style=\"font-family:'Nirmala UI'\"><b>: 296</b></span><span style=\"font-family:'Nirmala UI'\">-     represented British India.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">               <span style=\"font-family:'Nirmala UI'\">Out of    296</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>292</b></span><span style=\"font-family:'Nirmala UI'\">-     Governor's Provinces.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>4</b></span><span style=\"font-family:'Nirmala UI'\"> members     - Chief Commissioner's Provinces.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0\">          <span style=\"font-family:'Nirmala UI'\">2. </span><span style=\"font-family:'Nirmala UI'\"><u><b>Nominated    Members</b></u></span><span style=\"font-family:'Nirmala UI'\"> :</span><span style=\"font-family:'Nirmala UI'\"><b> 93</b></span><span style=\"font-family:'Nirmala UI'\">-    represented Princely states.</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the Following statements    about chemical bonding:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Ionic     bonds are formed by the transfer of electrons.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Covalent     bonds involve sharing of electrons pairs.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Metallic     bonding involves localized electrons between atoms.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the above statements are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 and 3 only.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 and 2 only.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2 and 3 only.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2 and 3 .</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Solution:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The    correct answer is: 1 and 2 only.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Statement     1: </b></u></span><span style=\"font-family:'Nirmala UI'\">Ionic bonds     are formed by the </span><span style=\"font-family:'Nirmala UI'\"><b>transfer     of electrons. (Correct)</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">In     ionic bonding, one atom (usually a metal) </span><span style=\"font-family:'Nirmala UI'\"><b>loses     electrons</b></span><span style=\"font-family:'Nirmala UI'\">, and another     atom (usually a non- metal) </span><span style=\"font-family:'Nirmala UI'\"><b>gains     electrons</b></span><span style=\"font-family:'Nirmala UI'\">. This creates     oppositely charged ions that attract each other.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">E.g.     NaCl.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Statement    2: </b></u></span><span style=\"font-family:'Nirmala UI'\">Covalent    bonds involve </span><span style=\"font-family:'Nirmala UI'\"><b>sharing    of electron pairs</b></span><span style=\"font-family:'Nirmala UI'\">. </span><span style=\"font-family:'Nirmala UI'\"><b>(Correct).</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span style=\"font-family:'Nirmala UI'\">In     covalent bonds, atoms (generally non-metals) </span><span style=\"font-family:'Nirmala UI'\"><b>share     electrons</b></span><span style=\"font-family:'Nirmala UI'\"> to     complete their valence shells.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">E.g.     H</span><sub><span style=\"font-family:'Nirmala UI'\">2</span></sub><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Statement    3:</b></u></span><span style=\"font-family:'Nirmala UI'\"> Metallic    bonding involves localized electrons between atoms.</span><span style=\"font-family:'Nirmala UI'\"><b> (Incorrect).</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span style=\"font-family:'Nirmala UI'\">In     metallic bonding, electrons are not localized (fixed between     specific atoms). Instead, they are </span><span style=\"font-family:'Nirmala UI'\"><b>delocalized</b></span><span style=\"font-family:'Nirmala UI'\">,     forming a \"</span><span style=\"font-family:'Nirmala UI'\"><b>sea of     electrons\"</b></span><span style=\"font-family:'Nirmala UI'\"> that </span><span style=\"font-family:'Nirmala UI'\"><b>moves     freely</b></span><span style=\"font-family:'Nirmala UI'\"> throughout     the metal lattice.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Because     of this </span><span style=\"font-family:'Nirmala UI'\"><b>delocalization</b></span><span style=\"font-family:'Nirmala UI'\">,     metals show properties like </span><span style=\"font-family:'Nirmala UI'\"><b>conductivity     and malleability</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In 2025, the 'Mangrove cell'    initiative, aimed at conservation and management of coastal    mangrove ecosystem, was introduced by which Indian state    government?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Odisha</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Andhra Pradesh</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Maharashtra</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">West Bengal</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Solution:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>Maharashtra.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     was launched in </span><span style=\"font-family:'Nirmala UI'\"><b> 2025</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     initiative focuses on</span><span style=\"font-family:'Nirmala UI'\"><b> protecting     and restoring mangroves in coastal areas.</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The</span><span style=\"font-family:'Nirmala UI'\"><b> Mangrove     Mitras</b></span><span style=\"font-family:'Nirmala UI'\"> initiative      encourages citizens involvement in mangrove conservation.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Consider the following statements    regarding Carnatic Music:</span></p>    <ol>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Carnatic     music originated mainly in North India and later spread to the     South.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Sama     Veda is an important source of Indian classical music.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Purandara     Dasa is known as the Father of carnatic Music.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Trinity of Carnatic music includes Tyagaraja, Syama Sastri and     Muttusvami Dikshitar.</span></p>    </li></ol>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Which    of the statements given above are correct?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2, 3 and 4 only.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2 and 3 only.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1 and 4 only.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2, 3 and 4.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Solution:</b></span></p>    <p style=\"o hods</b></span><span style=\"font-family:'Nirmala UI'\"> and     basic lessons.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence     the statement is</span><span style=\"font-family:'Nirmala UI'\"><b> Correct.</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Statement    4-</b></u></span><span style=\"font-family:'Nirmala UI'\"> Trinity    includes </span><span style=\"font-family:'Nirmala UI'\"><b>Tyagaraja,    Syama Sastri, Muttuswami Dikshitar.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">They     shaped the classical structure and composition of Carnatic music.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence     the Statement is </span><span style=\"font-family:'Nirmala UI'\"><b>Correct</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><i><u><b>Some    other important points-</b></u></i></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">1.    The Female Trinity-</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">D.K.     Pattammal</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">M.L.     Vasanthakumari</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">M.S.     Subbulakshmi</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">2. </span><span style=\"font-family:'Nirmala UI'\"><b>Venkatamakhi </b></span><span style=\"font-family:'Nirmala UI'\">is    regarded as the </span><span style=\"font-family:'Nirmala UI'\"><b>\"Grand    theorist</b></span><span style=\"font-family:'Nirmala UI'\">\" of    carnatic music.</span></p>    <p style=\"orphans:0;widows:0\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1783594286815_html_cbd441608443697e.png\" width=\"555\" height=\"370\" > </p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following statements    correctly describes the procedure for removal of a Judge of the    Supreme Court of India or High Courts of India?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Judge can be removed by the    President on the advice of the Prime Minister.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A judge can be removed by a simple    majority in Parliament.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A judge can be removed by the    President after an address by Parliament supported by a special    majority on grounds of proved misbehavior or incapacity.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A judge can be removed by the Chief    Justice of India.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Solution:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>A    judge can be removed by the President after an address by    Parliament supported by a special majority on grounds of proved    misbehavior or incapacity.</b></span></p>
