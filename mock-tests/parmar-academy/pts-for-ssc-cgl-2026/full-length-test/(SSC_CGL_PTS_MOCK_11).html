 style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both A and R are true and R is the    correct explanation of A</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both A and R are true but R is not    the correct explanation</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A is true, R is false</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A is false, R is true</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>A    is true, R is false</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Originally,     the Right to Property was a Fundamental Right under </span><span style=\"font-family:'Nirmala UI'\"><b>Article     19(1)(f) and Article 31</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     often hindered the government's ability to implement land reforms     and acquire land for public welfare.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Morarji Desai government passed the </span><span style=\"font-family:'Nirmala UI'\"><b>44th     Amendment in 1978</b></span><span style=\"font-family:'Nirmala UI'\"> to     remove its \"Fundamental\" status.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">It     is now a </span><span style=\"font-family:'Nirmala UI'\"><b>Legal     Right</b></span><span style=\"font-family:'Nirmala UI'\"> under     Article 300A in Part XII.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">What is the final stage in the    lifecycle of a star that has a mass similar to our Sun, after it    sheds its outer layers and its core cools down?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Black Hole</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Supernova</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">White Dwarf</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Red Giant</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>White    dwarf</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">When     a medium-sized star (like the Sun) runs out of hydrogen fuel, it     first expands into a </span><span style=\"font-family:'Nirmala UI'\"><b>Red     Giant</b></span><span style=\"font-family:'Nirmala UI'\">. Eventually, it     sheds its outer layers (forming a planetary nebula), leaving     behind only the hot, dense core.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">This     remaining core is called a </span><span style=\"font-family:'Nirmala UI'\"><b>White     Dwarf</b></span><span style=\"font-family:'Nirmala UI'\">. It is incredibly     dense; a teaspoon of its material would weigh as much as an     elephant on Earth. It no longer performs nuclear fusion but     shines by radiating leftover heat.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Why     not a Black Hole? </b></span><span style=\"font-family:'Nirmala UI'\">Only     massive stars (much larger than the  Sun) end their lives in     a </span><span style=\"font-family:'Nirmala UI'\"><b>Supernova</b></span><span style=\"font-family:'Nirmala UI'\"> explosion     and then collapse into a </span><span style=\"font-family:'Nirmala UI'\"><b>Neutron     Star</b></span><span style=\"font-family:'Nirmala UI'\"> or a </span><span style=\"font-family:'Nirmala UI'\"><b>Black     Hole</b></span><span style=\"font-family:'Nirmala UI'\">. Our Sun is too     small for that.</span></p>    </li>\n</ul>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>The    Chandrasekhar Limit</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Subrahmanyan    Chandrasekhar (an Indian-American Nobel laureate) proved that a    White Dwarf cannot have a mass greater than </span><span style=\"font-family:'Nirmala UI'\"><b>1.44    times the mass of the Sun</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Under the PM-eBus Sewa scheme, what    is the primary target for urban electric mobility?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">To replace all petrol cars in Metro    cities.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Providing free bus passes to    students nationwide.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Building dedicated cycle tracks in    Tier-2 cities.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Deployment of 10,000 electric buses    in 169 cities.</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>Deployment    of 10,000 electric buses in 169 cities.</b></span></p>    <ul>     <li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The </span><span style=\"font-family:'Nirmala UI'\"><b>PM-eBus     Sewa</b></span><span style=\"font-family:'Nirmala UI'\"> scheme is a     flagship initiative launched by the </span><span style=\"font-family:'Nirmala UI'\"><b>Ministry     of Housing and Urban Affairs (MoHUA) in 2023.</b></span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     scheme aims to </span><span style=\"font-family:'Nirmala UI'\"><b>augment     city bus operations </b></span><span style=\"font-family:'Nirmala UI'\">by     prioritizing cities that lack organized bus services, with a     specific focus on </span><span style=\"font-family:'Nirmala UI'\"><b>Green     Mobility</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     operates on a </span><span style=\"font-family:'Nirmala UI'\"><b>Public-Private     Partnership (PPP)</b></span><span style=\"font-family:'Nirmala UI'\"> model.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is a key pillar of India’s </span><span style=\"font-family:'Nirmala UI'\"><b>Net     Zero 2070</b></span><span style=\"font-family:'Nirmala UI'\"> goal,     aimed at reducing tailpipe emissions and noise pollution in dense     urban clusters.</span></p>    </li>\n</ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784289205611_html_a359c48b6db757fb.png\" width=\"518\" height=\"346\"> </p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which organization launched India's    first 24×7 LPG ATM as a pilot project in Gurugram?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bharat Petroleum Corporation    Limited (BPCL)</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Indian Oil Corporation Limited    (IOCL)</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Hindustan Petroleum Corporation    Limited (HPCL)</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gas Authority of India Limited    (GAIL)</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>Bharat    Petroleum Corporation Limited (BPCL)</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Bharat     Petroleum Corporation Limited (BPCL) has launched India’s </span><span style=\"font-family:'Nirmala UI'\"><b>first     24×7 LPG ATM in Gurugram</b></span><span style=\"font-family:'Nirmala UI'\">,     Haryana as a pilot program.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     is part of the pilot project ‘</span><span style=\"font-family:'Nirmala UI'\"><b>BharatGas     Insta LPG</b></span><span style=\"font-family:'Nirmala UI'\">’, aimed at     automated, 24×7 LPG distribution in urban areas, especially     during supply disruptions.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Customers     verify via mobile OTP, scan QR/barcode on cylinder, and pay     digitally via UPI/debit card for quick service.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The Central Vigilance Commission    (CVC) of India was established on the recommendations of which of    the following?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sarkaria Commission </span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Balwant Rai Mehta Committee </span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Santhanam Committee</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Administrative Reforms Commission</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>Santhanam    Committee</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Central    Vigilance Commission</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Set     up by an </span><span style=\"font-family:'Nirmala UI'\"><b>executive     resolution </b></span><span style=\"font-family:'Nirmala UI'\">of the     Government of India in </span><span style=\"font-family:'Nirmala UI'\"><b>1964.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">It     was created based on the recommendations of the </span><span style=\"font-family:'Nirmala UI'\"><b>Committee     on Prevention of Corruption</b></span><span style=\"font-family:'Nirmala UI'\">,     popularly known as the </span><span style=\"font-family:'Nirmala UI'\"><b>Santhanam     Committee</b></span><span style=\"font-family:'Nirmala UI'\"> (headed     by K. Santhanam).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Originally,     the CVC was neither a constitutional body nor a statutory body     (it was just an executive body).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Parliament     enacted the </span><span style=\"font-family:'Nirmala UI'\"><b>Central     Vigilance Commission Act, 2003</b></span><span style=\"font-family:'Nirmala UI'\">,     which granted </span><span style=\"font-family:'Nirmala UI'\"><b>statutory     status </b></span><span style=\"font-family:'Nirmala UI'\">to CVC.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Appointed     and removed by: </span><span style=\"font-family:'Nirmala UI'\"><b>President.</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Current     chairman:</span><span style=\"font-family:'Nirmala UI'\"><b> Praveen     Kumar Srivastava</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">King Harshavardhana shifted his    capital from Thanesar to Kanyakubja (Kannauj) primarily to unify    his kingdom with which other territory following the death of its    ruler, Grahavarman?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gauda</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Magadha</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Valabhi</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Maukharis</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>Maukharis</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Maukharis ruled over </span><span style=\"font-family:'Nirmala UI'\"><b>Kanyakubja</b></span><span style=\"font-family:'Nirmala UI'\"> (Kannauj).     Harshavardhana’s sister, Rajyashri, was married to the Maukhari     King, </span><span style=\"font-family:'Nirmala UI'\"><b>Grahavarman</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Grahavarman     was killed by the king of Malwa (Devagupta) in alliance with     Shashanka (the ruler of Gauda). This left the throne of Kannauj     vacant.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">By     shifting his capital from </span><span style=\"font-family:'Nirmala UI'\"><b>Thanesar</b></span><span style=\"font-family:'Nirmala UI'\"> to </span><span style=\"font-family:'Nirmala UI'\"><b>Kannauj</b></span><span style=\"font-family:'Nirmala UI'\">,     he effectively merged the Pushyabhuti and Maukhari kingdoms.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>Harshavardhana</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Dynasty:</b></span><span style=\"font-family:'Nirmala UI'\"> Pushyabhuti     (Vardhana) Dynasty; ruled from </span><span style=\"font-family:'Nirmala UI'\"><b>606     to 647 AD</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Capital:</b></span><span style=\"font-family:'Nirmala UI'\"> Shifted     from </span><span style=\"font-family:'Nirmala UI'\"><b>Thanesar</b></span><span style=\"font-family:'Nirmala UI'\"> (Haryana)     to </span><span style=\"font-family:'Nirmala UI'\"><b>Kannauj</b></span><span style=\"font-family:'Nirmala UI'\"> (UP).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Title:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Sakalauttarapathanatha</b></span><span style=\"font-family:'Nirmala UI'\"> (Lord     of all North India).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Major     Defeat:</b></span><span style=\"font-family:'Nirmala UI'\"> Beaten     by </span><span style=\"font-family:'Nirmala UI'\"><b>Pulakeshin     II</b></span><span style=\"font-family:'Nirmala UI'\"> (Chalukya) at     the </span><span style=\"font-family:'Nirmala UI'\"><b>Narmada     River</b></span><span style=\"font-family:'Nirmala UI'\"> (Source:     Aihole Inscription).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Literature:</b></span><span style=\"font-family:'Nirmala UI'\"> He     wrote </span><span style=\"font-family:'Nirmala UI'\"><b>Ratnavali,     Priyadarshika, Nagananda</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Court     Poet:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Banabhatta</b></span><span style=\"font-family:'Nirmala UI'\"> (Author     of </span><span style=\"font-family:'Nirmala UI'\"><i>Harshacharita</i></span><span style=\"font-family:'Nirmala UI'\"> and </span><span style=\"font-family:'Nirmala UI'\"><i>Kadambari</i></span><span style=\"font-family:'Nirmala UI'\">).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Foreign     Traveler:</b></span><span style=\"font-family:'Nirmala UI'\"> </span><span style=\"font-family:'Nirmala UI'\"><b>Hiuen     Tsang</b></span><span style=\"font-family:'Nirmala UI'\">; wrote </span><span style=\"font-family:'Nirmala UI'\"><i>Si-Yu-Ki</i></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Religion:</b></span><span style=\"font-family:'Nirmala UI'\"> Originally     a Shiva devotee; later a great patron of </span><span style=\"font-family:'Nirmala UI'\"><b>Mahayana     Buddhism</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Supported </span><span style=\"font-family:'Nirmala UI'\"><b>Nalanda     University</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Held     the </span><span style=\"font-family:'Nirmala UI'\"><b>Kannauj     Assembly</b></span><span style=\"font-family:'Nirmala UI'\"> (to honor     Hiuen Tsang) and </span><span style=\"font-family:'Nirmala UI'\"><b>Prayag     Assembly</b></span><span style=\"font-family:'Nirmala UI'\"> (every 5     years).</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which two economists are widely    considered the primary architects and founders of the    International Monetary Fund (IMF) at the 1944 Bretton Woods    Conference?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Adam Smith and David Ricardo</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">John Maynard Keynes and Harry    Dexter White</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Milton Friedman and Friedrich Hayek</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Paul Samuelson and Joseph Stiglitz</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>John    Maynard Keynes and Harry Dexter White</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><u><b>IMF</b></u></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     International Monetary Fund was established in 1944 under </span><span style=\"font-family:'Nirmala UI'\"><b>Bretton     Woods Agreement.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Headquarters- </span><span style=\"font-family:'Nirmala UI'\"><b>Washington     D.C., USA</b></span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Main    functions:</span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Promotes     global monetary cooperation.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Provides     financial assistance to countries.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Maintains     exchange rate stability.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Publishes     important economic reports.</span></p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Important    IMF Reports</b></span></p>    <table>     <col>      <col>      <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Report</b></span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\"><b>Purpose</b></span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">World Economic Outlook (WEO)</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Global economic growth analysis</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Global Financial Stability       Report (GFSR)</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Financial market stability</span></p>      </td>     </tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr></tr>     <tr>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Fiscal Monitor</span></p>      </td>      <td style=\"border: 1px solid black;\"><p style=\"orphans:0;widows:0\">       <span style=\"font-family:'Nirmala UI'\">Government fiscal trends</span></p>      </td>     </tr>    </table>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><u><b>Bretton Woods Conference</b></u></span></p>    <ul>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Formally known as the </span><span style=\"font-family:'Nirmala UI'\"><b>United     Nations Monetary and Financial Conference</b></span><span style=\"font-family:'Nirmala UI'\">,     it was a landmark gathering of </span><span style=\"font-family:'Nirmala UI'\"><b>44     nations</b></span><span style=\"font-family:'Nirmala UI'\"> in     July </span><span style=\"font-family:'Nirmala UI'\"><b>1944</b></span><span style=\"font-family:'Nirmala UI'\">.</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\">Its primary goal was to establish     a new international financial order to prevent the economic chaos     that followed World War I and the Great Depression.</span></p>    </li></ul>    <p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The conference resulted in the    creation of two massive global institutions:</span></p>    <ol>     <li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>International Monetary Fund     (IMF):</b></span><span style=\"font-family:'Nirmala UI'\"> Designed to     monitor exchange rates and provide short-term loans to countries     facing balance-of-payments crises.</span></p>     </li><li><p style=\"line-height:108%;orphans:0;widows:0;margin-bottom:0in\">     <span style=\"font-family:'Nirmala UI'\"><b>International Bank for     Reconstruction and Development (IBRD):</b></span><span style=\"font-family:'Nirmala UI'\"> Now     the primary component of the </span><span style=\"font-family:'Nirmala UI'\"><b>World     Bank</b></span><span style=\"font-family:'Nirmala UI'\">, it was created to     provide long-term loans for rebuilding war-torn Europe and     developing nations.</span></p>    </li></ol>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following question, a    statement of Assertion (A) is followed by a statement of Reason    (R).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Assertion    (A): The Chota Nagpur Plateau is often referred to as the \"Ruhr    of India\" and acts as the heavy industrial spine of the    country.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Reason    (R): The region is composed primarily of alluvial soil track    deposits brought down by the perennial Himalayan river systems.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Read    the statements and select the correct option.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both (A) and (R) are true, and (R)    is the correct explanation of (A).</span></p>", "option2": "\n     <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Both    (A) and (R) are true, but (R) is not the correct explanation of    (A).</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(A) is true, but (R) is false.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">(A) is false, but (R) is true.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">The correct answer is: </span><span style=\"font-family:'Nirmala UI'\"><b>(A)    is true, but (R) is false.</b></span></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The     Chota Nagpur Plateau (covering most of Jharkhand, along with     parts of Odisha, West Bengal, and Chhattisgarh) is incredibly     rich in minerals like iron ore, coal, manganese, and mica.     Because it mirrors Germany's mineral-rich Ruhr valley, it is     nicknamed the </span><span style=\"font-family:'Nirmala UI'\"><b>\"Ruhr     of India\"</b></span><span style=\"font-family:'Nirmala UI'\"> and     hosts major heavy industries like the </span><span style=\"font-family:'Nirmala UI'\"><b>Tata     Steel plant at Jamshedpur</b></span><span style=\"font-family:'Nirmala UI'\"> and     the </span><span style=\"font-family:'Nirmala UI'\"><b>Bokaro Steel     Plant. </b></span><span style=\"font-family:'Nirmala UI'\">Hence,</span><span style=\"font-family:'Nirmala UI'\"><b> assertion     is true.</b></span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">The     plateau is </span><span style=\"font-family:'Nirmala UI'\"><b>not</b></span><span style=\"font-family:'Nirmala UI'\"> made     of alluvial soil from Himalayan rivers. Instead, it is an     ancient, deeply elevated landmass made of old </span><span style=\"font-family:'Nirmala UI'\"><b>crystalline     igneous and metamorphic rocks</b></span><span style=\"font-family:'Nirmala UI'\"> (Gondwana     and Archean formations). This ancient geological structure is the     exact reason why it holds massive metallic mineral reserves,     whereas alluvial soil is found in the northern plains and is     meant for agriculture, not heavy mining. Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>reason     is false.</b></span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 26, "question": "\n <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following question, out of    the four alternatives, choose the one which can be substituted for    the given words/sentence.</span></p>        <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">An    instrument is used to measure pressure of fluid.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Barometer</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Anemometer</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Micrometer</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Manometer</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n     <ul>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">barometer-     an instrument measuring atmospheric pressure, used especially in     forecasting the weather and determining altitude.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">anemometer-     an instrument for measuring the speed of the wind, or of any     current of gas.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">micrometer-     a gauge that measures small distances or thicknesses between its     two faces, one of which can be moved away from or towards the     other by turning a screw with a fine thread.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">manometer-     an instrument for measuring the pressure acting on a column of     fluid, consisting of a U-shaped tube of liquid in which a     difference in the pressures acting in the two of the tube.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option D the correct answer.</span></p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 27, "question": "\n <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following question, a    sentence has been given in Active/Passive Voice. Out of the four    alternatives suggested, select the one which best expresses the    same sentence in Passive/Active Voice.</span></p>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Do    not disturb me.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Let me be disturbed not.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Let me not disturbed.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Let me not be disturbed.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Let I not be disturbed.</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n     <ul>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Structure:     This is an imperative sentence, so it is changed by starting with     \"Let,\" followed by the object (\"me\"), \"not     be,\" and the past participle of the verb (\"disturbed\").</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option C is the correct answer.</span></p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 28, "question": "\n <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following question, out of    the four alternatives, choose the alternative which best expresses    the meaning of the idiom/Phrase.</span></p>        <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">A    gentleman at large</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">a man in the crowd</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">a man without a job</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">a man who runs around</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">a man who is generous</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n     <ul>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A     \"gentleman at large\" is an idiom describing a man who     has no serious occupation, fixed employment, or professional     obligations.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option B is the correct answer.</span></p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 29, "question": "\n <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following question, the 1st    and the last part of the sentence/passage are numbered 1 and 6.    The rest of the sentence/passage is split into four parts and    named P, Q, R and S. These four parts are not given in their    proper order. Read the sentence/passage and find out which of the    four combinations is correct</span></p>        <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">1.    I got on a colourful bus filled with all kinds of strange people.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">P.    We arrived at a gate like the one in Salvador Dali's paintings.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Q.    The bus rode across the dirty expanses without roads.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">R.    At first, I wasn't aware that the bus roof was loaded with drugs.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">S.    Everyone was filled with dust and often the wheels would sink into    the soft soil.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">6.    It was a gate neither separated nor connected anything from or to    anything.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QRSP</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">SPQR</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">RQSP</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">RSPQ</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">As     the statement Q is explaining further about the bus so it will     come after 1 and will be the first sentence.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">As     the statement R starts with 'at first\" is will come after Q.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Statement     P will be the last sentence as it tells about the reaching at the     destination.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">So     we need to keep the part S before P.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Now     the final arrangement will be QRSP so it will be correct.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 30, "question": "\n <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following question, some    part of the sentence may have errors. Find out which part of the    sentence has an error and select the appropriate option. If a    sentence is free from error, select 'No Error'.</span></p>        <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">When    Albert stayed at the African jungle (A) / he chose to put up with    many inconveniences such as (B) /wild animals and poisonous    insects. (C)/ No Error (D)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">When Albert stayed at the African    jungle</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">he chose to put up with many    inconveniences such as</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">wild animals and poisonous insects.</span></p "orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">\"Fall     back on\" means to use or rely on something (or someone) as a     reserve, backup plan, or support after other options have failed     or are unavailable.</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option D is the correct answer.</span></p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 50, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following is not a    correct interrogative sentence ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Where you are going?</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Do you like coffee?</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Why did he leave so early?</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Is she coming to the party ?</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "\n     <ul>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Option     A is incorrect because it lacks proper subject-verb inversion. In     a standard English interrogative sentence, the auxiliary verb     (like are, do, or is) must come before the subject. The correct     form should be: \"Where are you going?\".</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Option     B is correct as it follows the standard structure for a \"yes/no\"     question by starting with the auxiliary verb \"Do\"     followed by the subject \"you\".</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Option     C is correct because it correctly places the auxiliary verb \"did\"     before the subject \"he\" after the \"Wh-\"     question word \"Why\".</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Option     D is correct because it begins with the auxiliary verb \"Is\"     before the subject \"she,\" which is the required     structure for forming a question with the verb \"to be\".</span></p>     </li>\n<li>\n<p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Hence,     Option A is the correct answer.</span></p>    </li>\n</ul>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Find the greatest value of 'k' in a    6-digit number 6745k2 such that the number is divisible by 3.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">7</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">8</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">9</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "  <p style=\"orphans:0;widows:0\">    <img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1784289205611_html_dda212d5d1e94c02.png\" width=\"429\" height=\"107\" > </p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The estimated expenditure of a    family was ₹2,50,000. Out of this, the estimated expenditure on    electricity was ₹40,000 and on rent was ₹60,000. It was found    that the actual expenditure on electricity was 10% more than the    estimated expendit  UI'\">That    means Sunita's original position from the left was 15.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Now,    If a person is 15th from the left and 13 from the right, then </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Total    persons = 15 + 13 - 1 </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">=    28 - 1 </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">=    27</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">So,    total number of person in a row is 27.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>27 </b></span><span style=\"font-family:'Nirmala UI'\">is    the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 79, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">In the following question, a word    has been given, followed by four other words, one of which cannot    be formed using the letters of the given word. Find the word.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">TRANSPORTATION </span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">TRAIN</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">PORT</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">SPACE</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">PRISON</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-botto \"font-family:'Nirmala UI'\">C(3)    - 2 = A(1)</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>HXA</b></span><span style=\"font-family:'Nirmala UI'\"> is    the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 92, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following is the odd    one out.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">60, 40,120</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">90, 70, 210</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">50, 35,105</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">140, 120, 360</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Logic: </b></span><span style=\"font-family:'Nirmala UI'\">First    number - 20 = Second number</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Second    number × 3 = Third number</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">As,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">60,    40, 120</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">60    - 20 = 40, 40 × 3 = 120</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">And,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">90,    70, 210</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">90    - 20 = 70, 70 × 3 = 210</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">140,    120, 360</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">140    - 20 = 120, 120 × 3 = 360</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">But,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">50,    35, 105</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">50    - 15 = 35,  35 × 3 = 105</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Clearly,    50, 35, 105  is the odd one out.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>option    C</b></span><span style=\"font-family:'Nirmala UI'\"> is the correct    answer.</span></p>", "question_heading": ""}, {"sr_no": 93, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Directions:</b></span><span style=\"font-family:'Nirmala UI'\"> Read    the given statement and conclusions carefully. Assuming that the    information given in the statement(s) is true, decide which of the    given conclusions logically follow(s) from the statement(s).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\"><b>Statement:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">P    = Q &gt; R </span><span style=\"font-family:'Cambria Math'\">≥</span><span style=\"font-family:'Nirmala UI'\" "><b>Explanation:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">As,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">W    = 23</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">O    = 15</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">O    = 15</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">D    = 4</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Sum    of letters place value: 23 + 15 + 15 + 4 = 57 Reverse the digit =    75</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">And,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">D    = 4</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">E    = 5</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">A    = 1 </span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">F    = 6</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Sum    of letters place value: 4 + 5 + 1 + 6 = 16 Reverse the digit = 61</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Similarly,</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">M    = 13</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">O    = 15</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">S    = 19</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">T    = 20</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Sum    of letters place value: 13 + 15 + 19 + 20 = 67 Reverse the digit =    76</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>76 </b></span><span style=\"font-family:'Nirmala UI'\">is    the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 95, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In a row of 70 students, Rahul is    28th from the left end and Aman is 25th from the right end. How    many students are there between them?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">16</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">18</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">19</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">17</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Aman’s    position from the left end = (70 − 25) + 1 = 46</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Rahul’s    position from the left end = 28</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Students    between them = (Aman’s position from the left end - Rahul’s    position from the left end) - 1</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">=    46 − 28 − 1 = 17</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Hence, </span><span style=\"font-family:'Nirmala UI'\"><b>17 </b></span><span style=\"font-family:'Nirmala UI'\">is    the correct answer.</span></p>", "question_heading": ""}, {"sr_no": 96, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\">Select the option that is related    to the third word in the same way as the second word is related to    the first word. (The words must be considered as meaningful    English words and must not be related to each other based on the    number of letters/number of consonants/vowels in the word.)</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Clarity    : Confusion :: Freedom : ?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Independence</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Captivity</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Movement</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Expression</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span style=\"font-family:'Nirmala UI'\"><b>Explanation:</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">The    question uses a pattern of opposite words.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">\"Clarity\"    is the direct opposite (antonym) of \"Confusion.\"</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span style=\"font-family:'Nirmala UI'\">Similarly,<
