<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>48.) SSC CGL PTS  MOCK 24 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

const questions = [{"sr_no": 1, "question": " <p style=\"orphans:0;widows:0\">    Select the most appropriate synonym of the given word: <b>CALUMNY</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Aspersion</p>", "option2": " <p style=\"orphans:0;widows:0\">    Eulogy</p>", "option3": " <p style=\"orphans:0;widows:0\">    Vindication</p>", "option4": " <p style=\"orphans:0;widows:0\">    Approbation</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>A) Aspersion</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Calumny</b> means the making of false and defamatory     statements about someone to damage their reputation     (slander/defamation).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\"><b>Aspersion</b>     means an attack on the reputation or integrity of someone or     something, making it the exact synonym.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Eulogy:</b> High praise or commendation (antonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Vindication:</b>     Clearing someone of blame or suspicion (antonym).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Approbation:</b> Approval     or praise (antonym).</p>    </li></ul>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate antonym of the given word.</b></p>    <p style=\"orphans:0;widows:0\"><b>Opulent</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    Affluent</p>", "option2": " <p style=\"orphans:0;widows:0\">    Impoverished</p>", "option3": " <p style=\"orphans:0;widows:0\">    Sumptuous</p>", "option4": " <p style=\"orphans:0;widows:0\">    Luxurious</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>B) Impoverished</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Opulent</b> means extremely rich, luxurious, or abundant in     wealth and possessions.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\"><b>Impoverished</b>     means poor or lacking wealth and resources, making it the exact     antonym.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Affluent:</b> Wealthy or prosperous (synonym).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sumptuous:</b>     Luxurious and expensive-looking (synonym).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Luxurious:</b> Very     comfortable, elegant, and expensive (synonym).</p>    </li></ul>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct meaning of the given idiom.</b></p>    <p style=\"orphans:0;widows:0\"><b>A storm in a teacup</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    A sudden and severe crisis</p>", "option2": " <p style=\"orphans:0;widows:0\">    A lot of anger or worry about something unimportant</p>", "option3": " <p style=\"orphans:0;widows:0\">    An unexpected financial loss</p>", "option4": " <p style=\"orphans:0;widows:0\">    A memorable and joyful celebration</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>B) A lot of anger or worry about    something unimportant</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>A storm in a teacup</b> means a lot of anger, excitement, or     worry about something that is actually unimportant or     insignificant.</p>     </li><li><p style=\"orphans:0;widows:0\">It is used when a situation     seems dramatic but has little real importance.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the option that gives the correct meaning of the given    idiom.</b></p>    <p style=\"orphans:0;widows:0\"><b>To steal someone's thunder</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    To cause a sudden disruption in a peaceful event</p>", "option2": " <p style=\"orphans:0;widows:0\">    To prevent someone from performing in public</p>", "option3": " <p style=\"orphans:0;widows:0\">    To take credit for another person's achievement or idea</p>", "option4": " <p style=\"orphans:0;widows:0\">    To destroy someone's reputation out of jealousy</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>C) To take credit for another person's    achievement or idea</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>To steal someone's thunder</b> means to take credit for     someone else's achievement, idea, or success, often by announcing     it before they get the opportunity to do so.</p>     </li><li><p style=\"orphans:0;widows:0\">It is commonly used when     someone <b>takes away another person's moment of recognition or     praise</b>.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0\">    Which <b>spelling is correct</b> for a word meaning 'a period of a    thousand years'?</p>", "option1": "<p style=\"orphans:0;widows:0\">    Millenium</p>", "option2": " <p style=\"orphans:0;widows:0\">    Milennium</p>", "option3": " <p style=\"orphans:0;widows:0\">    Millennium</p>", "option4": " <p style=\"orphans:0;widows:0\">    Milenium</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>C) Millennium</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Millennium</b> means a period of <b>one thousand years</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\">The     correct spelling contains <b>double “l”</b> and <b>double     “n”</b>: <b>Millennium</b>.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>A) Millenium:</b> Incorrect spelling; one <b>n</b> is missing.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>B)     Milennium:</b> Incorrect spelling; one <b>l</b> is missing.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>D) Milenium:</b>     Incorrect spelling; one <b>l</b> and one <b>n</b> are missing.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    Select the <b>correct spelling</b> of a word meaning 'the process    by which a cell engulfs solid particles'.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Phagocitosis</p>", "option2": " <p style=\"orphans:0;widows:0\">    Phagocytosis</p>", "option3": " <p style=\"orphans:0;widows:0\">    Phagocytocis</p>", "option4": " <p style=\"orphans:0;widows:0\">    Phagocytoses</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>B) Phagocytosis</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Phagocytosis</b> is the process by which a cell <b>engulfs and     takes in solid particles</b>, such as bacteria, cell debris, or     other large particles.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\">The     correct spelling is <b>Phagocytosis</b>, with <b>“phagocyto-”</b>     followed by <b>“-sis”</b>.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>A) Phagocitosis:</b> Incorrect spelling; <b>“cy”</b> is     incorrectly written as <b>“ci”</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C)     Phagocytocis:</b> Incorrect spelling; <b>“sis”</b> is     incorrectly written as <b>“cis”</b>.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>D) Phagocytoses:</b>     Incorrect form; <b>“phagocytoses”</b> is the plural/verb     form, not the noun naming the process.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0\">    Select the <b>correct one-word substitute</b> for the given group    of words: 'A short speech or poem delivered at the end of a play    or book'.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Prologue</p>", "option2": " <p style=\"orphans:0;widows:0\">    Epilogue</p>", "option3": " <p style=\"orphans:0;widows:0\">    Soliloquy</p>", "option4": " <p style=\"orphans:0;widows:0\">    Dialogue</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>B) Epilogue</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Epilogue</b> means a short speech, section, or poem that comes     <b>at the end of a play, novel, or other literary work</b>, often     providing a conclusion or commentary.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\">Therefore,     <b>Epilogue</b> is the correct one-word substitute.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Prologue:</b> An introductory section or speech at the     beginning of a play or book (antonym/opposite position).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Soliloquy:</b>     A speech in which a character expresses their thoughts aloud,     usually while alone.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Dialogue:</b> A     conversation between two or more characters.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0\">    Choose the <b>correct one-word substitute</b> for: 'The art of    effective or persuasive speaking or writing'.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Logic</p>", "option2": " <p style=\"orphans:0;widows:0\">    Grammer</p>", "option3": " <p style=\"orphans:0;widows:0\">    Rhetoric</p>", "option4": " <p style=\"orphans:0;widows:0\">    Semantics</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>C) Rhetoric</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Rhetoric</b> means the art of <b>effective or persuasive     speaking or writing</b>, especially the use of language to     influence or persuade an audience.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\">Therefore,     <b>Rhetoric</b> is the correct one-word substitute.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Logic:</b> The systematic reasoning used to determine whether     an argument is valid or sound.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Grammer:</b>     Incorrect spelling of <b>Grammar</b>, which refers to the rules     and structure of a language.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Semantics:</b> The study     of the meaning of words, phrases, and sentences.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the given passage, some words have been deleted. Read the    passage intently and choose the most appropriate option to fill in    each blank:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Climate    discourse, once the domain of ecological alarm and policy    whitepapers, has now become a theater of geopolitical    choreography. What masquerades as international cooperation often    (1) _____ the residues of colonial asymmetry—where culpability    is distributed politely, but power still negotiates who must    \"transition\" and who may continue. The carbon footprint    becomes a moral metric only when traced in Southern sand; in    Northern snow, it is reframed as \"developmental necessity.\"    Funding mechanisms are not immune to this dissonance. Green    finance flows in tributaries engineered by creditworthiness, not    climate need. Adaptation becomes a (2) _____, where vulnerable    nations perform resilience to attract capital, rather than receive    redress. \"Net zero,\" meanwhile, floats like a    talisman—invoked often, defined rarely. In such a paradigm,    technocratic optimism obscures the uneven cartography of    suffering. Satellites scan deforested zones with precision, but    remain blind to the (3) _____ histories beneath them. Carbon    markets, too, offer the illusion of absolution—one entity's    excess \"offset\" by another's austerity. But offsets do    not erase the heat; they only relocate the guilt. To resist    climate colonialism is to unmask the benevolence of treaties and    question the neutrality of metrics. Until the grammar of    environmental justice is (4) _____, and not merely adjusted, any    climate action risks becoming a ritual of (5) _____, not repair.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><b>What should come in the place    of blank number (1)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    redeems</p>", "option2": " <p style=\"orphans:0;widows:0\">    rehearses</p>", "option3": " <p style=\"orphans:0;widows:0\">    absolves</p>", "option4": " <p style=\"orphans:0;widows:0\">    recalibrates</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>B) rehearses</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Rehearses</b> means <b>repeats, re-enacts, or reproduces     something</b>, often in a familiar or established pattern.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">In the     passage, <i>“What masquerades as international cooperation     often rehearses the residues of colonial asymmetry”</i> means     that such cooperation <b>repeats or perpetuates the old patterns     of colonial inequality</b>, despite appearing cooperative.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\">This     fits the critical and analytical tone of the passage perfectly.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Redeems:</b> Saves or compensates for a fault or wrongdoing     (incorrect).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Absolves:</b>     Frees someone from blame or guilt (incorrect).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Recalibrates:</b> Adjusts     or changes something to achieve greater accuracy or suitability     (incorrect).</p>    </li></ul>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the given passage, some words have been deleted. Read the    passage intently and choose the most appropriate option to fill in    each blank:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Climate    discourse, once the domain of ecological alarm and policy    whitepapers, has now become a theater of geopolitical    choreography. What masquerades as international cooperation often    (1) _____ the residues of colonial asymmetry—where culpability    is distributed politely, but power still negotiates who must    \"transition\" and who may continue. The carbon footprint    becomes a moral metric only when traced in Southern sand; in    Northern snow, it is reframed as \"developmental necessity.\"    Funding mechanisms are not immune to this dissonance. Green    finance flows in tributaries engineered by creditworthiness, not    climate need. Adaptation becomes a (2) _____, where vulnerable    nations perform resilience to attract capital, rather than receive    redress. \"Net zero,\" meanwhile, floats like a    talisman—invoked often, defined rarely. In such a paradigm,    technocratic optimism obscures the uneven cartography of    suffering. Satellites scan deforested zones with precision, but    remain blind to the (3) _____ histories beneath them. Carbon    markets, too, offer the illusion of absolution—one entity's    excess \"offset\" by another's austerity. But offsets do    not erase the heat; they only relocate the guilt. To resist    climate colonialism is to unmask the benevolence of treaties and    question the neutrality of metrics. Until the grammar of    environmental justice is (4) _____, and not merely adjusted, any    climate action risks becoming a ritual of (5) _____, not repair.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><b>What should come in the place    of blank number (2)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    spectacle</p>", "option2": " <p style=\"orphans:0;widows:0\">    framework</p>", "option3": " <p style=\"orphans:0;widows:0\">    doctrine</p>", "option4": " <p style=\"orphans:0;widows:0\">    subsidy</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>A) spectacle</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Spectacle</b> means a <b>public display or performance</b>,     often designed to attract attention.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">In the     passage, <i>“Adaptation becomes a spectacle, where vulnerable     nations perform resilience to attract capital”</i> suggests     that adaptation is turned into a <b>performance or display</b>     for attracting financial support rather than receiving genuine     compensation.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\">The     word <b>“perform”</b> in the following clause strongly     reinforces this meaning.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Framework:</b> A basic structure or system used to organize     ideas or actions (incorrect).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Doctrine:</b>     A set of beliefs or principles, especially one formally taught or     followed (incorrect).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Subsidy:</b> Financial     assistance, usually provided by a government or institution, to     support an activity (incorrect).</p>    </li></ul>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the given passage, some words have been deleted. Read the    passage intently and choose the most appropriate option to fill in    each blank:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Climate    discourse, once the domain of ecological alarm and policy    whitepapers, has now become a theater of geopolitical    choreography. What masquerades as international cooperation often    (1) _____ the residues of colonial asymmetry—where culpability    is distributed politely, but power still negotiates who must    \"transition\" and who may continue. The carbon footprint    becomes a moral metric only when traced in Southern sand; in    Northern snow, it is reframed as \"developmental necessity.\"    Funding mechanisms are not immune to this dissonance. Green    finance flows in tributaries engineered by creditworthiness, not    climate need. Adaptation becomes a (2) _____, where vulnerable    nations perform resilience to attract capital, rather than receive    redress. \"Net zero,\" meanwhile, floats like a    talisman—invoked often, defined rarely. In such a paradigm,    technocratic optimism obscures the uneven cartography of    suffering. Satellites scan deforested zones with precision, but    remain blind to the (3) _____ histories beneath them. Carbon    markets, too, offer the illusion of absolution—one entity's    excess \"offset\" by another's austerity. But offsets do    not erase the heat; they only relocate the guilt. To resist    climate colonialism is to unmask the benevolence of treaties and    question the neutrality of metrics. Until the grammar of    environmental justice is (4) _____, and not merely adjusted, any    climate action risks becoming a ritual of (5) _____, not repair.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><b>What should come in the place    of blank number (3)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    fictional</p>", "option2": " <p style=\"orphans:0;widows:0\">    geological</p>", "option3": " <p style=\"orphans:0;widows:0\">    unatoned</p>", "option4": " <p style=\"orphans:0;widows:0\">    satellite</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>C) unatoned</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Unatoned</b> means <b>not compensated for, not reconciled, or     not having received redress for a wrong</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">In the     passage, <i>“Satellites scan deforested zones with precision,     but remain blind to the unatoned histories beneath them”</i>     refers to <b>unresolved historical injustices and harms</b>,     particularly those connected with colonialism and environmental     exploitation.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\">The     contrast between <b>technological precision</b> and <b>historical     injustice</b> makes <i>unatoned</i> the most contextually     appropriate choice.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Fictional:</b> Imaginary or not real (incorrect).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Geological:</b>     Related to the Earth’s physical structure or rocks (incorrect).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Satellite:</b> An object     or device orbiting a planet; it does not appropriately modify     “histories” (incorrect).</p>    </li></ul>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the given passage, some words have been deleted. Read the    passage intently and choose the most appropriate option to fill in    each blank:</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Climate    discourse, once the domain of ecological alarm and policy    whitepapers, has now become a theater of geopolitical    choreography. What masquerades as international cooperation often    (1) _____ the residues of colonial asymmetry—where culpability    is distributed politely, but power still negotiates who must    \"transition\" and who may continue. The carbon footprint    becomes a moral metric only when traced in Southern sand; in    Northern snow, it is reframed as \"developmental necessity.\"    Funding mechanisms are not immune to this dissonance. Green    finance flows in tributaries engineered by creditworthiness, not    climate need. Adaptation becomes a (2) _____, where vulnerable    nations perform resilience to attract capital, rather than receive    redress. \"Net zero,\" meanwhile, floats like a    talisman—invoked often, defined rarely. In such a paradigm,    technocratic optimism obscures the uneven cartography of    suffering. Satellites scan deforested zones with precision, but    remain blind to the (3) _____ histories beneath them. Carbon    markets, too, offer the illusion of absolution—one entity's    excess \"offset\" by another's austerity. But offsets do    not erase the heat; they only relocate the guilt. To resist    climate colonialism is to unmask the benevolence of treaties and    question the neutrality of metrics. Until the grammar of    environmental justice is (4) _____, and not merely adjusted, any    climate action risks becoming a ritual of (5) _____, not repair.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><b>What should come in the place    of blank number (4)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    amplified</p>", "option2": " <p style=\"orphans:0;widows:0\">    translated</p>", "option3": " <p style=\"orphans:0;widows:0\">    rewritten</p>", "option4": " <p style=\"orphans:0;widows:0\">    rescinded</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>C) rewritten</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Rewritten</b> means <b>written again in a different way, often     to improve or fundamentally change it</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">In the     passage, <i>“Until the grammar of environmental justice is     rewritten, and not merely adjusted”</i> means that the     <b>fundamental principles and language of environmental justice     need to be transformed</b>, rather than simply modified     superficially.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\">The     contrast between <b>“rewritten”</b> and <b>“not merely     adjusted”</b> makes this option the most appropriate.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Amplified:</b> Made stronger, louder, or more intense     (incorrect).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Translated:</b>     Converted from one language or form into another (incorrect).</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Rescinded:</b> Officially     cancelled or withdrawn (incorrect).</p>    </li></ul>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>In the given passage, some words have been deleted. Read the    passage intently and choose the most appropriate option to fill in    each blank</b>:</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">Climate    discourse, once the domain of ecological alarm and policy    whitepapers, has now become a theater of geopolitical    choreography. What masquerades as international cooperation often    (1) _____ the residues of colonial asymmetry—where culpability    is distributed politely, but power still negotiates who must    \"transition\" and who may continue. The carbon footprint    becomes a moral metric only when traced in Southern sand; in    Northern snow, it is reframed as \"developmental necessity.\"    Funding mechanisms are not immune to this dissonance. Green    finance flows in tributaries engineered by creditworthiness, not    climate need. Adaptation becomes a (2) _____, where vulnerable    nations perform resilience to attract capital, rather than receive    redress. \"Net zero,\" meanwhile, floats like a    talisman—invoked often, defined rarely. In such a paradigm,    technocratic optimism obscures the uneven cartography of    suffering. Satellites scan deforested zones with precision, but    remain blind to the (3) _____ histories beneath them. Carbon    markets, too, offer the illusion of absolution—one entity's    excess \"offset\" by another's austerity. But offsets do    not erase the heat; they only relocate the guilt. To resist    climate colonialism is to unmask the benevolence of treaties and    question the neutrality of metrics. Until the grammar of    environmental justice is (4) _____, and not merely adjusted, any    climate action risks becoming a ritual of (5) _____, not repair.</p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><b>What should come in the place    of blank number (5)?</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    reconstruction</p>", "option2": " <p style=\"orphans:0;widows:0\">    performance</p>", "option3": " <p style=\"orphans:0;widows:0\">    preservation</p>", "option4": " <p style=\"orphans:0;widows:0\">    contrition</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct answer is <b>B) Performance</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Performance</b> means an <b>act or display carried out to     impress, satisfy, or create an appearance</b>, rather than     necessarily producing genuine results.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     phrase <i>“a ritual of performance, not repair”</i> means     climate action risks becoming merely <b>symbolic or performative</b>,     creating the appearance of action without addressing the     underlying injustice.</p>     </li><li><p style=\"orphans:0;widows:0\">This fits the passage's     recurring idea of <b>“masquerades,” “spectacle,” “perform     resilience,”</b> and the criticism of superficial climate     action.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate option to fill in the blank</b>.</p>    <p style=\"orphans:0;widows:0\">________ mutual trust exists,    strong relationships thrive.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Where</p>", "option2": " <p style=\"orphans:0;widows:0\">    Unless</p>", "option3": " <p style=\"orphans:0;widows:0\">    Though</p>", "option4": " <p style=\"orphans:0;widows:0\">    Until</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>A) Where</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Where</b> means <b>in situations or circumstances in which</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     sentence means: <b>“In situations where mutual trust exists,     strong relationships thrive.”</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\">Therefore,     <b>Where</b> is the most appropriate choice.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Unless:</b> Means <i>except if</i>; it would change the     intended meaning.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Though:</b>     Means <i>although</i>; it introduces a contrast, which is not     suitable here.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Until:</b> Refers to a     time limit or point in time; it does not fit the meaning.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 15, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the correct option to fill in the blank</b>:</p>    <p style=\"orphans:0;widows:0\">The young engineer solved the    complex structural problem ____, surprising the senior architects    with her creative approach.</p>", "option1": "<p style=\"orphans:0;widows:0\">    ingenuously</p>", "option2": " <p style=\"orphans:0;widows:0\">    ingeniously</p>", "option3": " <p style=\"orphans:0;widows:0\">    ingenuity</p>", "option4": " <p style=\"orphans:0;widows:0\">    indigenously</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>B) ingeniously</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Ingeniously</b> means <b>in a clever, inventive, or highly     creative manner</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     sentence highlights the engineer's <b>creative approach</b>, so     <i>ingeniously</i> fits perfectly.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\">Since     the blank describes <b>how she solved</b> the problem, an <b>adverb</b>     is required.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Ingenuously:</b> In an innocent, sincere, or naïve manner     (incorrect).</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Ingenuity:</b>     Cleverness or inventiveness; it is a <b>noun</b>, so it cannot     grammatically fit here.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>Indigenously:</b> In a     manner native to a particular place or region (incorrect).</p>    </li></ul>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Find the part of the sentence that contains an error:</b></p>    <p style=\"orphans:0;widows:0\">The new manager (1)/ was known    for praising (2)/ not only the team leaders (3)/ but also to the    junior interns. (4)/</p>", "option1": "<p style=\"orphans:0;widows:0\">    (1)</p>", "option2": " <p style=\"orphans:0;widows:0\">    (2)</p>", "option3": " <p style=\"orphans:0;widows:0\">    (3)</p>", "option4": " <p style=\"orphans:0;widows:0\">    (4)</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>D) 4</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     The error is in <b>“but also to the junior interns.”</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">The     sentence uses the correlative conjunction <b>“not only … but     also”</b>, which requires <b>parallel structures</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\">“<b>praising”</b>     is followed by objects, so <b>“to”</b> should not be used     before <i>the junior interns</i>.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in\">Correct    sentence: <b>“The new manager was known for praising not only    the team leaders but also the junior interns.”</b></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Change the following from active to passive</b>:</p>    <p style=\"orphans:0;widows:0\">They should have had the matter    re-examined before escalation.</p>", "option1": "<p style=\"orphans:0;widows:0\">    The matter should have had to be re-examined before escalation.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The matter should have been re-examined before escalation.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The matter should have been had re-examined.</p>", "option4": " <p style=\"orphans:0;widows:0\">    The matter should have been made to be re-examined.</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>B) The matter should have been    re-examined before escalation.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     The active sentence <b>“They should have had the matter     re-examined”</b> uses the causative structure <b>“have +     object + past participle”</b>, meaning they arranged for     someone to re-examine the matter.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">In the     passive voice, the natural and grammatically correct form is <b>“The     matter should have been re-examined.”</b></p>     </li><li><p style=\"orphans:0;widows:0\">“<b>Before escalation”</b>     remains unchanged because it is a prepositional phrase.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the sentence containing the homonym of the highlighted    word</b>:</p>    <p style=\"orphans:0;widows:0\">The carpenter removed the rough    <b>bark</b> from the wooden log.</p>", "option1": "<p style=\"orphans:0;widows:0\">    Moisture had softened the bark of the fallen trunk.</p>", "option2": " <p style=\"orphans:0;widows:0\">    Moss was growing on the northern side of the tree's bark.</p>", "option3": " <p style=\"orphans:0;widows:0\">    The dog began to bark fiercely as the visitor approached.</p>", "option4": " <p style=\"orphans:0;widows:0\">    Birch bark was traditionally used by native tribes to make canoes.</p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>C) The dog began to bark fiercely as the    visitor approached.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Bark</b> in the given sentence means the <b>outer covering of     a tree</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Bark</b>     in option C means <b>the sharp sound made by a dog</b>.</p>     </li><li><p style=\"orphans:0;widows:0\">These words have the <b>same     spelling and pronunciation but different meanings</b>, making     them <b>homonyms</b>.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Convert the sentence provided below from its passive voice    structure to an active voice structure:</b></p>    <p style=\"orphans:0;widows:0\">The scientist is said to have    solved the complex mathematical problem.</p>", "option1": "<p style=\"orphans:0;widows:0\">    People say that the scientist solved the complex mathematical    problem.</p>", "option2": " <p style=\"orphans:0;widows:0\">    The scientist says that he solved the complex mathematical    problem.</p>", "option3": " <p style=\"orphans:0;widows:0\">    Someone said that the scientist has solved the complex    mathematical problem.</p>", "option4": " <p style=\"orphans:0;widows:0\">    A complex mathematical problem is said to be solved by the    scientist.</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>A) People say that the scientist solved    the complex mathematical problem.</b>     </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     The passive structure <b>“The scientist is said to have     solved…”</b> can be converted into the active structure     <b>“People say that the scientist solved…”</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\">“<b>is     said to have solved”</b> indicates a reported belief or     statement about a completed action, so <b>“People say that the     scientist solved…”</b> is the most natural active     construction.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>B)</b> Incorrect; the scientist cannot logically be the     subject of the reporting verb <i>says</i> without changing the     meaning.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C)</b>     Incorrect; <b>“said”</b> changes the reporting tense, and     <b>“has solved”</b> does not preserve the original structure     precisely.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>D)</b> Incorrect; this is     still a <b>passive</b> construction.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate option to substitute the    highlighted segment in the given sentence.</b></p>    <p style=\"orphans:0;widows:0\">He usually travels to his    workplace <b>in car</b> every morning.</p>", "option1": "<p style=\"orphans:0;widows:0\">    by car</p>", "option2": " <p style=\"orphans:0;widows:0\">    by the car</p>", "option3": " <p style=\"orphans:0;widows:0\">    with car</p>", "option4": " <p style=\"orphans:0;widows:0\">    on a car</p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>A) by car</b>.</p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     The correct expression for indicating a <b>mode of transportation</b>     is <b>“by car.”</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">We     generally use <b>“by + means of transport”</b> without an     article when talking about how someone travels.</p>     </li><li><p style=\"orphans:0;widows:0\">Therefore, the correct     sentence is: <b>“He usually travels to his workplace by car     every morning.”</b></p>    </li></ul>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the most appropriate option to replace the highlighted    part of the sentence</b>:</p>    <p style=\"orphans:0;widows:0\">She is confident <b>to win the    first prize</b> in the competition.</p>", "option1": "<p style=\"orphans:0;widows:0\">    to winning the first prize</p>", "option2": " <p style=\"orphans:0;widows:0\">    in winning the first prize</p>", "option3": " <p style=\"orphans:0;widows:0\">    for winning the first prize</p>", "option4": " <p style=\"orphans:0;widows:0\">    of winning the first prize</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>D) of winning the first prize</b>.     </p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     The adjective <b>“confident”</b> is followed by the     preposition <b>“of”</b> when expressing confidence about     achieving something.</p>     </li><li><p style=\"orphans:0;widows:0\">Therefore, the correct     sentence is: <b>“She is confident of winning the first prize in     the competition.”</b></p>    </li></ul>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the option that expresses the given sentence in indirect    speech.</b></p>    <p style=\"orphans:0;widows:0\">My daughter said, “I might go    out to the Mall with my friends tonight.”</p>", "option1": "<p style=\"orphans:0;widows:0\">    My daughter said that I might go out to the Mall with her friends    tonight.</p>", "option2": " <p style=\"orphans:0;widows:0\">    My daughter said that she might go out to the Mall with my friends    tonight.</p>", "option3": " <p style=\"orphans:0;widows:0\">    My daughter said that she may go out to the Mall with her friends    that night.</p>", "option4": " <p style=\"orphans:0;widows:0\">    My daughter said that she might go out to the Mall with her    friends that night.</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>D) My daughter said that she might go out    to the Mall with her friends that night.</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     In indirect speech, <b>“I”</b> changes to <b>“she”</b>     because the speaker is <i>my daughter</i>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">“<b>my     friends”</b> changes to <b>“her friends”</b> because the     possessive refers to the daughter.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">“<b>tonight”</b>     changes to <b>“that night”</b> in reported speech.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\">“<b>might”</b>     remains <b>“might”</b> as it is already a past form of the     modal verb.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>1)</b> Incorrect: <b>“I”</b> should be changed to <b>“she.”</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>2)</b>     Incorrect: <b>“my friends”</b> should be changed to <b>“her     friends.”</b></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3)</b>     Incorrect: <b>“might”</b> should remain <b>“might,”</b>     not <b>“may.”</b></p>     </li><li><p style=\"orphans:0;widows:0\"><b>4)</b> Correct: All the     required changes are made accurately.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <b>Select the option that expresses the given sentence in direct    speech</b>.</p>    <p style=\"orphans:0;widows:0\">They exclaimed sadly that India    had lost the match in the World Cup finals.</p>", "option1": "<p style=\"orphans:0;widows:0\">    They said, “Hurrah! India has lost the match in the World Cup    finals.”</p>", "option2": " <p style=\"orphans:0;widows:0\">    They said, “What a loss! India has lost the match in the World    Cup finals.”</p>", "option3": " <p style=\"orphans:0;widows:0\">    They said, “India has sadly lost the match in the World Cup    finals.”</p>", "option4": " <p style=\"orphans:0;widows:0\">    They said, “They are so sorry! India has lost the match in the    World Cup finals.”</p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>B) They said, “What a loss! India has    lost the match in the World Cup finals.”</b></p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Explanation:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     “<b>Exclaimed sadly”</b> indicates an expression of <b>sorrow     or disappointment</b>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">“<b>What     a loss!”</b> appropriately conveys the speaker's sadness over     India's defeat.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\">“<b>had     lost”</b> in indirect speech changes back to <b>“has lost”</b>     in direct speech.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\">Therefore,     option <b>B</b> most accurately conveys the original sentence in     direct speech.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Other Options:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>A)</b> “Hurrah!” expresses <b>joy</b>, which contradicts     <i>sadly</i>.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>C)</b>     Does not use an appropriate <b>exclamatory expression</b> to     convey the sadness.</p>     </li><li><p style=\"orphans:0;widows:0\"><b>D)</b> “They are so     sorry!” is unnatural and does not accurately reproduce the     intended exclamation.</p>    </li></ul>", "question_heading": ""}, {"sr_no": 24, "question": "Rधोननोngध पुध ीियियथing ौधnपधncधौ पय ीयनं ो ंधोningीिह ूोौौोgध: 1. Pधनयॅौाiपध ौियोन cिधिस ुोॅध धंधनgधक ोौ ो ूनयंiौing ोिपधनnोपiॅध पय पनोकiपiयnोि ौiिicयn ूोnिधस. 2. Tुधद यीीधन नधंोनाोृिद ुigु धnधनgद cयnॅधनौiयn धीीiciधncद ोप ियथधन ूनयकहcपiयn cयौपौ. 3. Hयथधॅधन, पुध  has become a critical environmental issue worldwide.</b></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>3. This    contamination harms marine life and disrupts aquatic ecosystems.</b></p>    <p style=\"orphans:0;widows:0\"><b>4. Huge quantities of    single-use plastics end up in rivers and oceans.</b></p>", "option1": "<p style=\"orphans:0;widows:0\">    2-3-4-1</p>", "option2": " <p style=\"orphans:0;widows:0\">    2-1-4-3</p>", "option3": " <p style=\"orphans:0;widows:0\">    4-2-3-1</p>", "option4": " <p style=\"orphans:0;widows:0\">    2-4-3-1</p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    The correct option is <b>D) 2-4-3-1</b>.</p>    <p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0.17in\">    <b>Explanation:</b></p>    <ul>     <li><p style=\"orphans:0;widows:0;margin-top:0.17in;margin-bottom:0in\">     <b>Sentence 2</b> introduces the main topic: plastic pollution as     a critical environmental issue.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sentence     4</b> explains the cause or scale of the problem by stating that     large amounts of single-use plastics enter rivers and oceans.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><b>Sentence     3</b> describes the <b>consequences</b> of this contamination,     particularly its impact on marine life and aquatic ecosystems.</p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0.17in\"><b>Sentence     1</b> begins with <b>“Therefore,”</b> so it logically     concludes the passage with the suggested solution.</p>    </li></ul>    <p style=\"orphans:0;widows:0;margin-top:0.17in\">Hence, the    correct sequence is <b>2-4-3-1</b>.</p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><span><span style=\"font-size:11pt\"><b>निम्नल
