<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>20.) SSC CGL PTS  MOCK 10 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

in-bottom:0in\">    <span>Fill in the blank/s with the most suitable    option for the following sentence.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><span>If you don't    want to ____ the team's progress, it's better to keep your    opinions to yourself.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Support</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Undermine</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Encourage</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>improve</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     sentence suggests that expressing one's opinions could have     a </span><span><b>negative effect</b></span><span> on     the team's progress. The word </span><span><b>\"undermine\"</b></span><span> means     to weaken, damage, or reduce the effectiveness of something.     Hence, it fits the context perfectly.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Support</b></span><span> –     to help or strengthen</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Encourage</b></span><span> –     to give confidence or motivation</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Improve</b></span><span> –     to make better</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0\">    <span>Find the correctly spelled word meaning having    a harmful effect.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Deleterious</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Deliterious</span></p>" ans:0;widows:0;margin-bottom:0in\"><span>The     verb </span><span><b>\"be\"</b></span><span> is     incorrect in this context. Since the sentence is a real future     condition, it should use the </span><span><b>present     simple</b></span><span> after </span><span><b>if</b></span><span>. </span><span><b>If     he is selected</b></span><span> for the     position…</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><u><b>Correct     Sentence: </b></u></span><span><b>If he is     selected for the position, the management will provide him with     the necessary training before assigning him to the project.</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Conditional     Sentences (First Conditional):</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>If     + Subject + Present Simple</b></span><span>, </span><span><b>Subject     + will + Verb</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Example:</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>If      she </span><span><b>arrives</b></span><span> early,      we </span><span><b>will</b></span><span> start      the meeting.</span></p>      </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>If      he </span><span><b>is selected</b></span><span>,      he </span><span><b>will</b></span><span> receive      training.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Select the most appropriate one-word substitute    for the following group of words:</span></p>    <p style=\"orphans:0;widows:0\">“<span>A person    who studies ancient human history through excavations and    artifacts.”</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Anthropologist</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Archaeologist</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Geologist</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Historian</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Anthropologist</b></span><span> –     A person who studies human beings, their cultures, societies, and     evolution.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Archaeologist</b></span><span> –     A person who studies ancient human history by excavating sites     and examining artifacts, monuments, and other physical remains.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Geologist</b></span><span> –     A scientist who studies the Earth, rocks, minerals, fossils, and     geological processes.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Historian</b></span><span> –     A person who researches, studies, and writes about historical     events, mainly using written records and historical sources.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0\">    <span>Choose the most appropriate antonym of the    following word. Exonerate</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Convict</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Free</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Excuse</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Liberate</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Exonerate</b></span><span> means     to officially absolve someone from blame or find them not guilty.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Convict</b></span><span> means     to officially declare someone to be guilty of a criminal offense.     Hence, it is the exact antonym.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Free</b></span><span>, </span><span><b>Excuse</b></span><span>,     and </span><span><b>Liberate</b></span><span> are     all synonyms or closely related terms to exonerate.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>The question below consists of a set of    labelled sentences. Out of the four options given, select the most    logical order of the sentences to form a coherent paragraph.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>P-    Epistemological idealists (such as Kant) might insist that the    only things which can be directly known for certain are ideas.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Q-    The approach to idealism by Western philosophers has been    different to that of Eastern thinkers.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>R-    In much of Western thought (though not in such major Western    thinkers as Plato and Hegel) the ideal relates to direct knowledge    of subjective mental ideas, or images.</span></p>    <p style=\"orphans:0;widows:0\"><span>S- It is then    usually juxtaposed with realism in which the real is said to have    an absolute existence prior to and independent of our knowledge.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>RQPS</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>PQSR</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>PRQS</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>QRSP</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Q</b></span><span> should     come first because it introduces the main topic: the difference     between the Western and Eastern approaches to idealism.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>R</b></span><span> follows     because it elaborates on the </span><span><b>Western     approach</b></span><span> mentioned in Q.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>S</b></span><span> comes     next because the pronoun </span><span><b>\"It\"</b></span><span> refers     to </span><span><b>\"the ideal\"</b></span><span> discussed     in R. It explains that the ideal is usually contrasted with     realism.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>P</b></span><span> comes     last as it gives a </span><span><b>specific     example</b></span><span> of one type of     idealist (epistemological idealists such as Kant), making it a     concluding statement.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option D is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the correct option:<br> The reforms,    while ostensibly motivated by economic exigencies, were in effect    a veiled attempt to_______dissent under the guise of austerity.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>impugn</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>rebut</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>swell</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>quell</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     sentence suggests that although the reforms appeared to be for     economic reasons, they were actually intended </span><span><b>to     suppress or silence opposition (dissent).</b></span><span> Therefore,     the verb should mean </span><span><b>\"to     put an end to or suppress.\"</b></span><span> </span><span><b>Quell</b></span><span> perfectly     fits this context.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Quell:</b></span><span> to     suppress, calm, or put an end to.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Impugn:</b></span><span>  to     question or attack someone's integrity</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Rebut:</b></span><span>  to     refute or counter an argument</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Swell:</b></span><span>  to     increase or grow</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option D is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the most appropriate antonym of the    given word. Accentuate</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Emphasize</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Highlight</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Obscure</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Promote</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Accentuate</b></span><span> means </span><span><b>to     emphasize or make something more noticeable</b></span><span>.     Its antonym is </span><span><b>Obscure</b></span><span>,     which means </span><span><b>to hide or make     something less clear or noticeable</b></span><span>.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Emphasize     - to give special importance</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Highlight     - to make prominent</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Promote     - to encourage or support</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option C is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>In the following passage, some words have been    deleted. Read the passage intently and choose the most appropriate    option to fill in each blank:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>To    speak of the political as an abstract structure is, perhaps,    already to concede to the logic of the archive: that which    preserves through containment, and (1) ______ through its very    naming. The subject here is neither born nor made—but suspended,    deferred in the machinic interplay of signifiers. One becomes    governable only to the extent that one appears, and to appear is    already to capitulate to the syntax of recognition. Power, then,    does not suppress but surfaces—it emerges in the folds of    citation, in the gentle violence of classification. The biometric    gaze is not ocular but computational; not what it sees, but what    it does not allow to vanish. Resistance, if it resists at all,    cannot be found in opposition, but in (2) ______—in the refusal    to be coherent, in the grammarless whisper. The body, meanwhile,    becomes a ledger: inscribed, decoded, re-encoded. What justice can    exist in such a system? Not that of law, but of rupture. A justice    that unbinds, that refuses the terms of its own invocation. It is    not reparation that is sought, but (3) ______—the unworking of    systems, the destitution of legibility. To enter this mode is to    abandon appeal, to relinquish the comfort of meaning. One must    instead submit to the possibility of a justice that never arrives,    that remains (4) ______, excessive and unlocatable. Only then can    we imagine a politics not of representation, but of presence    without capture, of subjectivity without scaffolding. What    remains, finally, is not identity but (5) ______—a presence that    eludes, that persists in the absence of affirmation.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><span>What should    come in the place of blank number [1]?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>extinguishes</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>reifies</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>evacuates</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>dissimulates</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     sentence suggests that the archive preserves things by </span><span><b>giving     them a fixed identity through naming</b></span><span>. </span><span><b>Reifies</b></span><span> means </span><span><b>to     treat an abstract idea as something concrete or real</b></span><span>,     which perfectly fits the context.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Extinguishes</b></span><span> :     puts an end to</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Evacuates</b></span><span> :     empties or removes</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Dissimulates</b></span><span> :     conceals or disguises</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>In the following passage, some words have been    deleted. Read the passage intently and choose the most appropriate    option to fill in each blank:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>To    speak of the political as an abstract structure is, perhaps,    already to concede to the logic of the archive: that which    preserves through containment, and (1) ______ through its very    naming. The subject here is neither born nor made—but suspended,    deferred in the machinic interplay of signifiers. One becomes    governable only to the extent that one appears, and to appear is    already to capitulate to the syntax of recognition. Power, then,    does not suppress but surfaces—it emerges in the folds of    citation, in the gentle violence of classification. The biometric    gaze is not ocular but computational; not what it sees, but what    it does not allow to vanish. Resistance, if it resists at all,    cannot be found in opposition, but in (2) ______—in the refusal    to be coherent, in the grammarless whisper. The body, meanwhile,    becomes a ledger: inscribed, decoded, re-encoded. What justice can    exist in such a system? Not that of law, but of rupture. A justice    that unbinds, that refuses the terms of its own invocation. It is    not reparation that is sought, but (3) ______—the unworking of    systems, the destitution of legibility. To enter this mode is to    abandon appeal, to relinquish the comfort of meaning. One must    instead submit to the possibility of a justice that never arrives,    that remains (4) ______, excessive and unlocatable. Only then can    we imagine a politics not of representation, but of presence    without capture, of subjectivity without scaffolding. What    remains, finally, is not identity but (5) ______—a presence that    eludes, that persists in the absence of affirmation.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\"><span>What should    come in the place of blank number [2]?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>conditionality</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>aesthetic refusal</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>algorithmic agency</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>asymbolic opacity</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     passage describes resistance as a </span><span><b>refusal     to be coherent or fully understood</b></span><span>. </span><span><b>Asymbolic     opacity</b></span><span> refers to a state     of </span><span><b>remaining unreadable or     resisting interpretation</b></span><span>, making it     the most appropriate choice in this philosophical context.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Conditionality</b></span><span> :     dependence on certain conditions</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Aesthetic     refusal</b></span><span> : rejection based on     artistic or aesthetic principles</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Algorithmic     agency</b></span><span> : the ability of     algorithms to act or make decisions</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option D is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>In the following passage, some words have been    deleted. Read the passage intently and choose the most appropriate    option to fill in each blank:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>To    speak of the political as an abstract structure is, perhaps,    already to concede to the logic of the archive: that which    preserves through containment, and (1) ______ through its very    naming. The subject here is neither born nor made—but suspended,    deferred in the machinic interplay of signifiers. One becomes    governable only to the extent that one appears, and to appear is    already to capitulate to the syntax of recognition. Power, then,    does not suppress but surfaces—it emerges in the folds of    citation, in the gentle violence of classification. The biometric    gaze is not ocular but computational; not what it sees, but what    it does not allow to vanish. Resistance, if it resists at all,    cannot be found in opposition, but in (2) ______—in the refusal    to be coherent, in the grammarless whisper. The body, meanwhile,    becomes a ledger: inscribed, decoded, re-encoded. What justice can    exist in such a system? Not that of law, but of rupture. A justice    that unbinds, that refuses the terms of its own invocation. It is    not reparation that is sought, but (3) ______—the unworking of    systems, the destitution of legibility. To enter this mode is to    abandon appeal, to relinquish the comfort of meaning. One must    instead submit to the possibility of a justice that never arrives,    that remains (4) ______, excessive and unlocatable. Only then can    we imagine a politics not of representation, but of presence    without capture, of subjectivity without scaffolding. What    remains, finally, is not identity but (5) ______—a presence that    eludes, that persists in the absence of affirmation.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><br>     </p>    <p style=\"orphans:0;widows:0\ udes and persists without affirmation</b></span><span>. </span><span><b>Fugitive     form</b></span><span> means </span><span><b>an     elusive or escaping form of existence</b></span><span>,     which perfectly matches this idea of identity resisting capture     and fixed definition.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Spectral     coherence</b></span><span> : ghost-like     consistency or unity</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Passive     unity</b></span><span> : inactive or     unresisting oneness</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Ontic     recurrence</b></span><span> : repeated     existence or recurrence at the level of being</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the most appropriate synonym of the    given word: Belligerent</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Aggressive</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Peaceful</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Timid</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Humble</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Belligerent</b></span><span> refers     to a person who is hostile or inclined to fight.     Hence, </span><span><b>Aggressive</b></span><span> is     the closest synonym.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Aggressive</b></span><span> –     Ready to attack or confront; forceful.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Peaceful</b></span><span> –     Calm and free from conflict or violence.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Timid</b></span><span> –     Lacking courage or confidence; shy.</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Humble</b></span><span> –     Modest and not arrogant.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0\">    <span>Choose the correct meaning of the idiom </span><span><b>“At    sixes and sevens.”</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>In a state of confusion or disorder</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Living a luxurious life</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Completely satisfied</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Very punctual</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     idiom </span><span><b>\"At sixes and     sevens\"</b></span><span> means </span><span><b>to     be in a state of confusion, disorder, or uncertainty</b></span><span>.</span></p>     <ul>      <li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The      idiom </span><span><b>\"At sixes and      sevens\"</b></span><span> originated      in </span><span><b>medieval England</b></span><span>.      It is believed to have come from a dispute between two London      merchant guilds—the </span><span><b>Merchant      Taylors' Company</b></span><span> and      the </span><span><b>Skinners' Company</b></span><span>—over      precedence in ceremonial processions. In </span><span><b>1484</b></span><span>,      Act of Accord settled the dispute by allowing the two guilds to      alternate sixth and seventh positions each year. Another widely      accepted explanation links the phrase to the medieval dice      game </span><span><b>Hazard</b></span><span>,      where the numbers </span><span><b>six</b></span><span> and </span><span><b>seven</b></span><span> represented      uncertainty or a risky situation. Over time, </span><span><b>\"at      sixes and sevens\"</b></span><span> came      to mean </span><span><b>being in a state of      confusion, disorder, or uncertainty</b></span><span>.</span></p>     </li></ul>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option A is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Find the part of the sentence that contains an    error:</span></p>    <p style=\"orphans:0;widows:0\"><span>In response to    an alarming spike in fraudulent transactions, (1)/ the bank    introduced mechanism (2)/ to verify customer identities using    two-factor authentication, (3)/ biometric checks, and behavioural    patterns. (4)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>(1)</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>(2)</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>(3)</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>(4)</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     phrase </span><span><b>\"introduced     mechanism\"</b></span><span> is incorrect     because </span><span><b>mechanism</b></span><span> is     a </span><span><b>countable singular noun</b></span><span> and     requires an article. It should be </span><span><b>\"introduced     a mechanism\"</b></span><span> or </span><span><b>“introduced     mechanisms.”</b></span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Correct     Sentence:  </b></span><span>In response to an     alarming spike in fraudulent transactions, the bank introduced </span><span><b>a     mechanism</b></span><span> to verify customer     identities using two-factor authentication, biometric checks, and     behavioural patterns.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the option that expresses the given    sentence in passive voice.<br>  The government is    implementing new policies to reduce pollution in the city.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>The government implemented new policies to    reduce pollution in the city.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>The implementation of new policies to reduce    pollution in the city is by the government.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>The government will implement new policies to    reduce pollution in the city.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>New policies are being implemented by the    government to reduce pollution in the city.</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     given sentence is in the </span><span><b>Present     Continuous Tense</b></span><span> (is     implementing).</span></p>     </li><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>In     the passive voice, the structure becomes </span><span><b>am/is/are     + being + past participle (V³)</b></span><span>.     Hence, </span><span><b>\"are being     implemented\"</b></span><span> is the     correct passive form.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option D is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>In the following question, a sentence has been    given in Direct/Indirect speech. Out of the four alternatives    suggested, select the one which best expresses the same sentence    in Indirect/Direct speech.</span></p>    <p style=\"orphans:0;widows:0\"><span>Rahul's mother    reminded him to take his wallet.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>\"Are you going to take your wallet or    not?\" said Rahul to his mother.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>\"Don't forget to take your wallet, Rahul,\"    said his mother.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Rahul's mother said, \"Remember to take    your wallet, Rahul?</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>\"Here is your wallet Rahul\" said his    mother.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": "     <ul><li><p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The     indirect sentence uses the reporting verb </span><span><b>\"reminded\"</b></span><span>,     which used to express a </span><span><b>reminder</b></span><span> or </span><span><b>advice</b></span><span>.     In direct speech, such reminders are commonly expressed     with </span><span><b>\"Don't forget to...\"</b></span><span>.     Therefore, </span><span><b>Option B</b></span><span> accurately     conveys the same meaning.</span></p>     </li><li><p style=\"orphans:0;widows:0\"><span>Hence,     Option B is the correct answer.</span></p>    </li></ul>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Select the option that expresses the given    sentence in active voice.</span></p>    <p style=\"orphans:0;widows:0\"><span>In Japan,    thousands of people were killed in the tsunami last week.</span let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
