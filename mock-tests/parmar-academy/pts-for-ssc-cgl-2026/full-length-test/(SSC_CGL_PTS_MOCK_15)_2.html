<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>30.) SSC CGL PTS  MOCK 15 - English</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

@media print {
  .header-controls, .navigation, .palette-fab, .palette-overlay, .question-palette, .action-buttons, .bookmark-btn {
    display: none !important;

<p style=\"orphans:0;widows:0\">    <span>A</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>B</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>C</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>D</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Subjunctive mood after mandative verbs (order,    demand, insist, suggest, recommend):</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Correct:    'ordered that the respondent RETURN' (base form, no -s).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>'Returns'    is indicative mood — grammatically incorrect after 'ordered    that.'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Error    in (B): 'returns' </span><span><span>→</span></span><span>    'return'.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Correction</b></span><span>:    'The tribunal ordered that the respondent return the seized    documents...'</span></p>    <p style=\"orphans:0;widows:0\"><span>SSC frequently    tests: 'I suggest that </span><span><b>he go'    (not 'goes'</b></span><span>); 'She insisted that he    be present' (not 'is').</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Find the error in the following options    fragmented from the question into four parts marked as A, B, C and    D.</span></p>    <p style=\"orphans:0;widows:0\"><span>Having been    found guilty of embezzlement, (A) / the court sentenced the    accountant (B) / to seven years of imprisonment (C) / and a    substantial fine. (D) No error</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>(A)</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>(B)</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>(C)</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>(D)</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>Dangling </b></span><span>modifier:    'Having been found guilty' </span><span><b>must    modify the subject of the main clause</b></span><span>.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>The    subject of (B) is 'the court' — but the COURT was not found    guilty; the ACCOUNTANT was.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Error    in (A)-(B) structure: misplaced/dangling participial phrase.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>The    error is in (B) because the wrong noun is made the subject.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span><b>Correction</b></span><span>:    'Having been found guilty of embezzlement, the accountant was    sentenced by the court...'</span></p>    <p style=\"orphans:0;widows:0\"><span>Trap: Students    check only (C) for 'imprisonment' vs 'imprisoned' — but 'years    of imprisonment' is acceptable.</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Find the error in the following options    fragmented from the question into four parts marked as A, B, C and    D.</span></p>    <p style=\"orphans:0;widows:0\"><span>Not only did    the auditors (A) / expose the accounting irregularities (B) / but    also they discovered (C) / evidence of systematic fraud. (D) No    error</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>(A)</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>(B)</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>(C)</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>(D)</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Correlative conjunction parallelism: '</span><span><b>Not    only... but also..</b></span><span>.'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>With    inversion: 'Not only did the auditors expose... but also they    discovered...'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Problem:    after 'but also,' subject-verb order should mirror structure for    parallelism.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Preferred:    '</span><span><b>but also discovered' (without    'they') to parallel 'did... expose</b></span><span>.'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>OR:    'but they also discovered.'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Current    (C): 'but also they discovered' — awkward and breaks parallel    structure.</span></p>    <p style=\"orphans:0;widows:0\"><span>Error in (C):    'but also they discovered' </span><span><span>→</span></span><span>    'but also discovered' or 'but they also discovered.'</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Improve the underlined part of the sentence:</span></p>    <p style=\"orphans:0;widows:0\"><span>The    committee </span><span><u>is comprised    of</u></span><span> representatives from all    stakeholder ministries.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>comprises of</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>comprises</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>is comprised by</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>no improvement</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>'Comprise' = consist of (no preposition    needed).</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>'Be    comprised of' is widely used but purists reject it; SSC accepts    'comprises' as the fix.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>'Is    comprised of' is considered incorrect in strict SSC marking.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(a)    'comprises of' — still has redundant 'of.' ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(b)    'comprises' — 'The committee comprises representatives.'    CORRECT.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(c)    'comprised by' — non-standard. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0\"><span>(d) ELIMINATE.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Choose the most appropriate Improvement of the    underlined part of the sentence:</span></p>    <p style=\"orphans:0;widows:0\"><span>No sooner </span><span><u>the    whistleblower had disclosed </u></span><span>the    evidence than the investigation commenced.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>had the whistleblower disclosed</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>the whistleblower disclosed</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>did the whistleblower disclose</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>no improvement</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Inversion rule: '</span><span><b>No    sooner' + had + subject + V3 </b></span><span><span><b>→</b></span></span><span><b>    than + subject + V2.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Correct    opening: 'No sooner HAD the whistleblower disclosed...'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Current    error: missing inversion after 'No sooner.'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(a)    Correct inversion. CORRECT.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(b)    No inversion, wrong tense. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0\"><span>(c) 'did    disclose' — wrong auxiliary for 'no sooner' structure. ELIMINATE</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Select the most appropriate option to fill in    the blank.</span></p>    <p style=\"orphans:0;widows:0\"><span>The CEO's    ______ remarks at the press conference praising austerity while    awarding executives record bonuses struck many observers as rank    hypocrisy.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>ingenuous</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>disingenuous</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>perspicacious</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>munificent</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Context: praising austerity + record bonuses =    insincere/deceptive.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(a) </span><span><b>Ingenuous </b></span><span>=    innocent, sincere. Opposite. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(b) </span><span><b>Disingenuous </b></span><span>=    not candid; pretending to know less or concealing true motives.    CORRECT.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(c) </span><span><b>Perspicacious </b></span><span>=    discerning. Positive trait; doesn't fit hypocrisy. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0\"><span>(d) </span><span><b>Munificent </b></span><span>=    very generous. Doesn't capture deception. ELIMINATE.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Select the most appropriate option to fill in    the blank.</span></p>    <p style=\"orphans:0;widows:0\"><span>The    archaeological findings were so ______ that they compelled    historians to revise long-accepted chronologies.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>anodyne</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>paradigm-shifting</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>derivative</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>quotidian</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Findings compelled revision of chronologies </span><span><span>→</span></span><span>    groundbreaking.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(a) </span><span><b>Anodyne </b></span><span>=    bland, inoffensive. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(b) </span><span><b>Paradigm</b></span><span>-</span><span><b>shifting</b></span><span> =    fundamentally changing accepted models. CORRECT.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(c) </span><span><b>Derivative </b></span><span>=    unoriginal. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0\"><span>(d) </span><span><b>Quotidian </b></span><span>=    everyday, ordinary. ELIMINATE.</span></p>", "question_heading": ""}, {"sr_no": 38, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Find the error in the following options    fragmented from the question into four parts marked as A, B, C and    D.</span></p>    <p style=\"orphans:0;widows:0\"><span>The reason why    he was late (A) / for the meeting was because (B) / his train had    been delayed (C) / due to heavy fog. (D) No error</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>A</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>B</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>C</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>D</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Grammar Rule: '</span><span><b>The    reason... is that' (not 'is because').</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Using    'reason' and 'because' together is redundant — both express    causation.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Standard    forms:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  ✓    <span>'The reason why he was late is THAT his train    was delayed.'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  ✓    <span>'He was late BECAUSE his train was delayed.'</span></p>    <p style=\"orphans:0;widows:0\">  ✗ <span>'The    reason... was because...' — REDUNDANT</span></p>", "question_heading": ""}, {"sr_no": 39, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Choose the correct Improvement of  the    underlined part of the sentence:</span></p>    <p style=\"orphans:0;widows:0\"><span>She has    been</span><span><u> suffering with</u></span><span> malaria    for the past three weeks.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>suffering from</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>suffering by</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>suffering since</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>no improvement</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Error Type: Incorrect preposition with    ‘suffer.’</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Standard    collocations:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  ✓    <span>'suffer FROM a disease/illness' — e.g.,    suffer from malaria, suffer from anxiety</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  ✓    <span>'suffer FOR a cause' — e.g., suffer for one's    beliefs</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  ✗    <span>'suffer WITH' — Non-standard in formal    English</span></p>    <p style=\"orphans:0;widows:0\">  ✗ <span>'suffer    BY' — Incorrect</span></p>", "question_heading": ""}, {"sr_no": 40, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the word most similar in meaning to:    PERFIDIOUS</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Loyal</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Treacherous</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Courageous</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Meticulous</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Word: PERFIDIOUS (adjective)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Meaning: </span><span><b>Deceitful    and untrustworthy; deliberately faithless; violating trust.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Option    Analysis:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(a) </span><span><b>Loyal </b></span><span>—    Faithful and devoted. ANTONYM, not synonym. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(b) </span><span><b>Treacherous </b></span><span>—    Guilty of or involving betrayal; likely to betray trust. Direct    synonym of perfidious. KEEP.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(c) </span><span><b>Courageous </b></span><span>—    Brave. Different meaning entirely. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(d) </span><span><b>Meticulous </b></span><span>—    Showing great attention to detail. Unrelated. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Usage:    ‘The perfidious ally leaked military secrets to the enemy.’</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Word    Family for SSC:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span>Synonyms: treacherous, deceitful, traitorous,    faithless, disloyal</span></p>    <p style=\"orphans:0;widows:0\">  <span>Antonyms:    loyal, faithful, trustworthy, steadfast</span></p>", "question_heading": ""}, {"sr_no": 41, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the word most opposite in meaning to:    EPHEMERAL</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Transient</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Fleeting</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Perpetual</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Momentary</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Word: EPHEMERAL (adjective)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Meaning: </span><span><b>Lasting    for a very short time; transitory; short-lived.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>We    need the ANTONYM — something that lasts a LONG time.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Option    Analysis:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(a) </span><span><b>Transient </b></span><span>—    Lasting only a short time. SYNONYM. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(b) </span><span><b>Fleeting </b></span><span>—    Passing quickly. SYNONYM. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(c) </span><span><b>Perpetual </b></span><span>—    Never ending; lasting forever; continuous. ANTONYM. KEEP.</span></p>    <p style=\"orphans:0;widows:0\"><span>(d) </span><span><b>Momentary </b></span><span>—    Lasting a very short time. SYNONYM. ELIMINATE.</span></p>", "question_heading": ""}, {"sr_no": 42, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Arrange the following sentences P, Q, R, S in a    logical sequence to form a coherent paragraph.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>P.    Consequently, many species are now listed as critically    endangered.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Q.    Unregulated deforestation has fragmented habitats across the    tropics.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>R.    This loss of canopy cover disrupts breeding and migration    patterns.</span></p>    <p style=\"orphans:0;widows:0\"><span>S.    International conservation treaties have struggled to enforce    compliance uniformly.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Q-R-P-S</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>P-Q-R-S</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Q-P-R-S</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>S-Q-R-P</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Step 1 — Identify the opening sentence.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>A    good opening introduces the TOPIC without referring back to    something undefined.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  • <span>P    starts with 'Consequently' — a result connector; something must    come BEFORE it.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  • <span>Q    introduces a clear topic: deforestation fragmenting habitats.    Strong opener.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  • <span>R    has 'This loss of canopy cover' — 'This' refers back to    deforestation in Q. Must follow Q.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  • <span>S    starts with a contrast ('struggled') — likely a concluding or    contrasting statement.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Step    2 — Build the chain.</span></p>    <p style=\"orphans:0;widows:0\"><span>Q (cause:    deforestation) </span><span><span>→</span></span><span>    R ('This loss' = deforestation effect on breeding/migration) </span><span><span>→</span></span><span>    P ('Consequently' = result: endangered species) </span><span><span>→</span></span><span>    S (contrast: treaties still fail)</span></p>", "question_heading": ""}, {"sr_no": 43, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Choose the word that can substitute the given    phrase:</span></p>    <p style=\"orphans:0;widows:0\"><span>Phrase:    'government by religious leaders'</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Democracy</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Plutocracy</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Autocracy</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Theocracy</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Option Analysis:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(a)    Democracy — Demo (people) + cracy = government by the people.    ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(b)    Plutocracy — Pluto (wealth) + cracy = government by the wealthy.    ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(c)    Autocracy — Auto (self) + cracy = government by one person with    absolute power. ELIMINATE.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>(d)    Theocracy — Theo (god) + cracy = government by religious    leaders. CORRECT.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>SSC    '-cracy' words to memorise:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span>Democracy — by the people</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span>Aristocracy — by the nobility/best</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span>Bureaucracy — by officials/administration</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span>Plutocracy — by the wealthy</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span>Theocracy — by religious authority</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span>Autocracy — by one ruler</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span>Technocracy — by technical experts</span></p>    <p style=\"orphans:0;widows:0\">  <span>Oligarchy    — by a small group</span></p>", "question_heading": ""}, {"sr_no": 44, "question": " <p style=\"orphans:0;widows:0\">    <span>Find the most appropriate meaning of the idiom:    'To burn the midnight oil'</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>To waste resources unnecessarily</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>To work or study late into the night</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>To destroy evidence of wrongdoing</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>To celebrate a festive occasion with lamps</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Idiom: ‘To burn the midnight oil’</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Meaning: </span><span><b>To    work diligently late into the night; to stay up studying or    working.</b></span><span>.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Usage:    ‘She burned the midnight oil for weeks to prepare for the civil    services examination.’</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Similar    SSC idioms about hard work:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  •    <span>'To pull one's socks up' — to make an effort    to improve</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  •    <span>'To leave no stone unturned' — to try every    possible means</span></p>    <p style=\"orphans:0;widows:0\">  • <span>'Against    the clock' — in a great hurry to meet a deadline</span></p>", "question_heading": ""}, {"sr_no": 45, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Select the most appropriate phrase to replace    the underlined segment:</span></p>    <p style=\"orphans:0;widows:0\"> <span>\"The    minister's explanation for the policy U-turn did not </span><span><u>hold    water</u></span><span> with the opposition.\"</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>carry weight</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>seem credible</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>create waves</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>hold office</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Meaning: </span><span><b>To    be valid, sound, and convincing; to withstand scrutiny or    criticism.</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Context:    The minister's explanation did NOT hold water — it was NOT    convincing to the opposition.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>We    need a phrase meaning 'seem credible/convincing.'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Corrected    sentence: 'The minister's explanation for the policy U-turn did    not seem credible to the opposition.'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Similar    phrase-replacement idioms in SSC:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  •    <span>'Ring hollow' = sound insincere</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  •    <span>'Cut corners' = do something cheaply or    improperly</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  •    <span>'Beat around the bush' = avoid the main topic</span></p>    <p style=\"orphans:0;widows:0\">  • <span>'Hold    water' = be valid/convincing</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0\">    <span>Select the correctly spelt word from the given    options:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>Millenium</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>Millennuim</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>Millennium</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>Milennium</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>DETAILED SOLUTION</b></span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Correct    spelling: MILLENNIUM</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Breakdown:    Millenni + um</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  •    <span>'Milli-' = thousand (Latin 'mille')</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  •    <span>'ennium' = year (from Latin 'annus' = year)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">  •    <span>Double 'n' and double 'l': millenn-ium</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Commonly    misspelt SSC words:</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span>Accommodation (cc, mm)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span>Embarrass (rr, ss)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span>Occurrence (cc, rr)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span>Millennium (ll, nn)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span>Privilege (no 'd' — not 'priviledge')</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\">     <span>Separate (e in middle — not 'seperate')</span></p>    <p style=\"orphans:0;widows:0\">  <span>Definitely    (finite in the middle — not 'definately')</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Select the option that expresses the given    sentence in the Active/Passive voice:</span></p>    <p style=\"orphans:0;widows:0\"> <span>'The    authorities will have implemented the new regulations by next    month.'</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span>The new regulations will have been implemented    by the authorities by next month.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span>The new regulations will be implemented by the    authorities by next month.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span>The new regulations would have been implemented    by the authorities by next month.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span>The new regulations are implemented by the    authorities by next month.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span>Step 1 — Identify the tense in the active    voice.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Active:    'will have implemented' = Future Perfect Tense</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Structure:    Subject + will have + V3</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span>Step    2 — Apply the passive conversion rule for Future Perfect.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Active:    will have + V3</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Passive:    will have been + V3 (by agent)</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"> <span>Step    3 — Convert the sentence.</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Active    object </span><span><span>→</span></span><span>    Passive subject: 'the new regulations'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Verb:    'will have been implemented'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Agent:    'by the authorities'</span></p>    <p style=\"orphans:0;widows:0;margin-bottom:0in\"><span>Time    expression: 'by next month' (retained)</span></p>    <p style=\"orphans:0;widows:0\"> <span>Result:    'The new regulations will have been implemented by the authorities    by next month.'</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0;margin-bottom:0in\">    <span><b>Rearrange the following sentence parts to    form a meaningful and grammati let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>

  <meta name="viewport" content="width=device-width, initial-scale=1.0">

    const url = URL.createObjectURL(blob);

    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;

  }

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
