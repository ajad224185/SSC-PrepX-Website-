<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>39.) SSC CGL PTS  MOCK 20 - Hindi</title>
<style>
:root {
  --primary-color: #007bff;
  --primary-hover: #0069d9;
  --success-color: #28a745;
  --success-hover: #218838;
  --danger-color: #dc3545;
  --warning-color: #ffc107;
  --secondary-color: #6c757d;
  --bg-primary: #ffffff;
  --bg-secondary: #f8f9fa;
  --bg-tertiary: #e9ecef;
  --text-primary: #212529;
  --text-secondary: #6c757d;
  --border-color: #dee2e6;
  --shadow: 0 4px 6px rgba(0,0,0,0.1);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.15);
  --overlay: rgba(0,0,0,0.5);
  --nav-height: 80px;
}

[data-theme="dark"] {
  --primary-color: #4dabf7;
  --primary-hover: #339af0;
  --success-color: #51cf66;
  --success-hover: #40c057;
  --danger-color: #ff6b6b;
  --warning-color: #ffd43b;
  --secondary-color: #868e96;
  --bg-primary: #1a1a1a;
  --bg-secondary: #2d2d2d;
  --bg-tertiary: #404040;
  --text-primary: #f8f9fa;
  --text-secondary: #adb5bd;
  --border-color: #495057;
  --shadow: 0 4px 6px rgba(0,0,0,0.3);
  --shadow-lg: 0 10px 30px rgba(0,0,0,0.4);
  --overlay: rgba(0,0,0,0.7);
}

* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
  -webkit-tap-highlight-color: transparent;
  touch-action: manipulation;
}

html {
  -webkit-text-size-adjust: 100%;
  -ms-text-size-adjust: 100%;
  scroll-behavior: smooth;
}

body {
  font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
  background: var(--bg-secondary);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  overflow-x: hidden;
  position: relative;
  padding-bottom: var(--nav-height);
}

body.palette-open {
  overflow: hidden;
  position: fixed;
  width: 100%;
}

.container {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

.header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  background: var(--bg-primary);
  padding: 20px 30px;
  border-radius: 15px;
  margin-bottom: 20px;
  box-shadow: var(--shadow);
}

.header h1 {
  font-size: 28px;
  color: var(--primary-color);
  font-weight: 700;
  user-select: none;
}

.header-controls {
  display: flex;
  gap: 15px;
  align-items: center;
}

.theme-toggle, .fullscreen-btn {
  background: var(--bg-tertiary);
  border: none;
  padding: 10px 15px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 20px;
  transition: all 0.3s;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
}

.theme-toggle:active, .fullscreen-btn:active {
  transform: scale(0.95);
}

.theme-toggle:hover, .fullscreen-btn:hover {
  background: var(--primary-color);
  color: white;
}

.bot-link-btn {
  background: var(--primary-color);
  color: white;
  text-decoration: none;
  padding: 8px 15px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 16px;
  display: flex;
  align-items: center;
  transition: all 0.3s;
}
.bot-link-btn:active {
  transform: scale(0.95);
}
.bot-link-btn:hover {
  background: var(--primary-hover);
}

.timer {
  background: var(--warning-color);
  color: #000;
  padding: 10px 20px;
  border-radius: 8px;
  font-weight: 600;
  font-size: 18px;
  min-width: 100px;
  text-align: center;
  user-select: none;
}

.timer.warning {
  animation: pulse 1s infinite;
}

@keyframes pulse {
  0%, 100% { transform: scale(1); }
  50% { transform: scale(1.05); }
}

.palette-fab {
  position: fixed;
  bottom: calc(var(--nav-height) + 20px);
  right: 20px;
  width: 56px;
  height: 56px;
  border-radius: 50%;
  background: var(--primary-color);
  color: white;
  border: none;
  cursor: pointer;
  font-size: 24px;
  box-shadow: 0 6px 20px rgba(0,123,255,0.4);
  transition: all 0.3s ease;
  z-index: 998;
  display: flex;
  align-items: center;
  justify-content: center;
  user-select: none;
  touch-action: manipulation;
}

.palette-fab:active {
  transform: scale(0.9);
}

.palette-fab:hover {
  transform: scale(1.05);
  box-shadow: 0 8px 25px rgba(0,123,255,0.6);
}

.palette-fab.active {
  background: var(--danger-color);
}

.palette-fab .badge {
  position: absolute;
  top: -5px;
  right: -5px;
  background: var(--success-color);
  color: white;
  border-radius: 50%;
  width: 24px;
  height: 24px;
  font-size: 12px;
  font-weight: 700;
  display: flex;
  align-items: center;
  justify-content: center;
  border: 2px solid var(--bg-secondary);
  pointer-events: none;
}
.solution-section {
  margin-top: 20px;
  padding: 15px;
  background: #e7f3ff;
  border-left: 4px solid var(--primary-color);
  border-radius: 8px;
}

.solution-label {
  font-weight: 700;
  color: var(--primary-color);
  margin-bottom: 10px;
  font-size: 15px;
}

.solution-content {
  line-height: 1.6;
  color: #333;
}

.solution-image {
  max-width: 100%;
  height: auto;
  border-radius: 5px;
  margin-top: 10px;
}
.palette-overlay {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: var(--overlay);
  opacity: 0;
  visibility: hidden;
  transition: all 0.3s ease;
  z-index: 999;
  touch-action: none;
}

.palette-overlay.active {
  opacity: 1;
  visibility: visible;
}

.question-palette {
  position: fixed;
  top: 0;
  right: -100%;
  width: 100%;
  max-width: 450px;
  height: 100vh;
  height: 100dvh;
  background: var(--bg-primary);
  box-shadow: -5px 0 20px rgba(0,0,0,0.2);
  transition: right 0.3s ease;
  z-index: 1000;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.question-palette.active {
  right: 0;
}

.palette-header {
  padding: 20px;
  background: var(--primary-color);
  color: white;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
  user-select: none;
}

.palette-header h3 {
  font-size: 20px;
  margin: 0;
}

.palette-close {
  background: transparent;
  border: none;
  color: white;
  font-size: 32px;
  cursor: pointer;
  width: 44px;
  height: 44px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 8px;
  transition: background 0.2s;
  line-height: 1;
  touch-action: manipulation;
}

.palette-close:active {
  transform: scale(0.9);
}

.palette-close:hover {
  background: rgba(255,255,255,0.2);
}

.palette-stats {
  padding: 15px 20px;
  background: var(--bg-tertiary);
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 10px;
  font-size: 13px;
  text-align: center;
  flex-shrink: 0;
  border-bottom: 1px solid var(--border-color);
  user-select: none;
}

.palette-stat {
  display: flex;
  flex-direction: column;
}

.palette-stat .number {
  font-size: 24px;
  font-weight: 700;
  line-height: 1;
  margin-bottom: 5px;
}

.palette-stat.answered .number { color: var(--success-color); }
.palette-stat.unanswered .number { color: var(--secondary-color); }
.palette-stat.bookmarked .number { color: var(--warning-color); }

.palette-search {
  padding: 15px 20px;
  background: var(--bg-secondary);
  flex-shrink: 0;
}

.palette-search input {
  width: 100%;
  padding: 10px 15px;
  border: 2px solid var(--border-color);
  border-radius: 8px;
  background: var(--bg-primary);
  color: var(--text-primary);
  font-size: 14px;
  -webkit-appearance: none;
  appearance: none;
}

.palette-search input:focus {
  outline: none;
  border-color: var(--primary-color);
}

.palette-content {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  padding: 20px;
  -webkit-overflow-scrolling: touch;
}

.palette-grid {
  display: grid;
  grid-template-columns: repeat(8, 1fr);
  gap: 10px;
}

.palette-btn {
  aspect-ratio: 1;
  border: 2px solid var(--border-color);
  background: var(--bg-secondary);
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  font-weight: 600;
  transition: all 0.2s;
  min-width: 40px;
  min-height: 40px;
  color: var(--text-primary);
  position: relative;
  user-select: none;
  touch-action: manipulation;
}

.palette-btn:active {
  transform: scale(0.9);
}

.palette-btn:hover {
  transform: scale(1.1);
  z-index: 10;
  box-shadow: var(--shadow);
}

.palette-btn.current {
  background: var(--primary-color);
  color: white;
  border-color: var(--primary-color);
  animation: currentPulse 2s infinite;
}

@keyframes currentPulse {
  0%, 100% { box-shadow: 0 0 0 0 rgba(0,123,255,0.7); }
  50% { box-shadow: 0 0 0 8px rgba(0,123,255,0); }
}

.palette-btn.answered {
  background: var(--success-color);
  color: white;
  border-color: var(--success-color);
}

.palette-btn.bookmarked::after {
  content: '🔖';
  position: absolute;
  top: -8px;
  right: -8px;
  font-size: 16px;
  pointer-events: none;
}

.palette-btn.bookmarked.answered {
  background: var(--success-color);
}

.palette-legend {
  padding: 20px;
  border-top: 1px solid var(--border-color);
  font-size: 13px;
  background: var(--bg-secondary);
  flex-shrink: 0;
  user-select: none;
}

.legend-grid {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 12px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 10px;
}

.legend-color {
  width: 24px;
  height: 24px;
  border-radius: 6px;
  flex-shrink: 0;
}

.quiz-container {
  background: var(--bg-primary);
  border-radius: 15px;
  box-shadow: var(--shadow-lg);
  padding: 30px;
  max-width: 900px;
  margin: 0 auto;
  scroll-margin-top: 20px;
}

.quiz-header {
  text-align: center;
  margin-bottom: 20px;
}

.marking-info {
  display: inline-block;
  background: var(--bg-tertiary);
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-section {
  margin-bottom: 25px;
}

.progress-stats {
  display: flex;
  justify-content: space-between;
  margin-bottom: 10px;
  font-size: 14px;
  color: var(--text-secondary);
  user-select: none;
}

.progress-bar-container {
  background: var(--bg-tertiary);
  border-radius: 12px;
  overflow: hidden;
  height: 10px;
}

.progress-bar {
  height: 100%;
  background: linear-gradient(90deg, var(--primary-color), var(--success-color));
  transition: width 0.4s ease;
  border-radius: 12px;
}

.question-section {
  min-height: 300px;
  scroll-margin-top: 80px;
  margin-bottom: 20px;
}

.question-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
  flex-wrap: wrap;
  gap: 10px;
}

.question-number {
  font-size: 14px;
  font-weight: 600;
  color: var(--primary-color);
  user-select: none;
}

.bookmark-btn {
  background: transparent;
  border: 2px solid var(--border-color);
  padding: 8px 16px;
  border-radius: 8px;
  cursor: pointer;
  font-size: 14px;
  transition: all 0.3s;
  display: flex;
  align-items: center;
  gap: 8px;
  min-width: 44px;
  min-height: 44px;
  user-select: none;
  touch-action: manipulation;
}

.bookmark-btn:active {
  transform: scale(0.95);
}

.bookmark-btn.active {
  background: var(--warning-color);
  border-color: var(--warning-color);
  color: #000;
}

.question {
  font-size: 18px;
  line-height: 1.7;
  margin-bottom: 25px;
  color: var(--text-primary);
  user-select: text;
}

.question-image {
  max-width: 100%;
  max-height: 400px;
  border-radius: 10px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.options {
  display: flex;
  flex-direction: column;
  gap: 12px;
  margin-bottom: 20px;
}

.option-label {
  display: flex;
  align-items: center;
  border: 2px solid var(--border-color);
  padding: 16px 20px;
  border-radius: 12px;
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
  min-height: 60px;
  user-select: none;
  touch-action: manipulation;
}

.option-label:active {
  transform: scale(0.98);
}

.option-label:hover {
  background: var(--bg-tertiary);
  border-color: var(--primary-color);
}

.option-label.selected {
  background: var(--primary-color);
  border-color: var(--primary-color);
  color: white;
}

.option-label input[type="radio"] {
  margin-right: 15px;
  width: 20px;
  height: 20px;
  cursor: pointer;
  accent-color: var(--primary-color);
  flex-shrink: 0;
}

.option-content {
  flex: 1;
  display: flex;
  align-items: center;
}

.option-image {
  max-width: 100%;
  max-height: 200px;
  border-radius: 8px;
  object-fit: contain;
  background: var(--bg-primary);
  padding: 10px;
}

.option-label.selected .option-image {
  background: rgba(255,255,255,0.1);
}

/* FIXED NAVIGATION - KEY UPDATE */
.navigation {
  position: fixed;
  bottom: 0;
  left: 0;
  right: 0;
  background: var(--bg-primary);
  border-top: 2px solid var(--border-color);
  box-shadow: 0 -4px 20px rgba(0,0,0,0.1);
  z-index: 997;
  padding: 15px 20px;
  display: grid;
  grid-template-columns: 1fr auto 1fr;
  gap: 10px;
  max-width: 100%;
}

.nav-btn {
  padding: 14px 20px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-height: 50px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  user-select: none;
  touch-action: manipulation;
  white-space: nowrap;
}

.nav-btn:active {
  transform: scale(0.97);
}

.nav-btn:disabled {
  opacity: 0.5;
  cursor: not-allowed;
  transform: none;
}

.nav-btn.prev {
  background: var(--secondary-color);
  color: white;
}

.nav-btn.prev:hover:not(:disabled) {
  background: #5a6268;
}

.nav-btn.next {
  background: var(--primary-color);
  color: white;
}

.nav-btn.next:hover:not(:disabled) {
  background: var(--primary-hover);
}

.nav-btn.clear {
  background: var(--danger-color);
  color: white;
}

.nav-btn.clear:hover {
  background: #c82333;
}

.nav-btn.submit {
  background: var(--success-color);
  color: white;
  grid-column: 1 / -1;
}

.nav-btn.submit:hover {
  background: var(--success-hover);
}

.result-section {
  animation: fadeIn 0.5s;
}

@keyframes fadeIn {
  from { opacity: 0; transform: translateY(20px); }
  to { opacity: 1; transform: translateY(0); }
}

.score-card {
  background: linear-gradient(135deg, var(--primary-color), var(--success-color));
  color: white;
  padding: 30px;
  border-radius: 15px;
  text-align: center;
  margin-bottom: 30px;
  user-select: none;
}

.score-card h2 {
  font-size: 48px;
  margin-bottom: 10px;
}

.score-card p {
  font-size: 18px;
  opacity: 0.9;
}

.stats-grid {
  display: grid;
  grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
  gap: 15px;
  margin-bottom: 30px;
}

.stat-card {
  background: var(--bg-secondary);
  padding: 20px;
  border-radius: 12px;
  text-align: center;
  border: 2px solid var(--border-color);
  user-select: none;
}

.stat-card h3 {
  font-size: 32px;
  margin-bottom: 8px;
}

.stat-card.correct h3 { color: var(--success-color); }
.stat-card.wrong h3 { color: var(--danger-color); }
.stat-card.unattempted h3 { color: var(--secondary-color); }

.question-review {
  border: 2px solid var(--border-color);
  border-radius: 15px;
  padding: 25px;
  margin-bottom: 20px;
  background: var(--bg-secondary);
}

.question-review h4 {
  margin-bottom: 15px;
  font-size: 16px;
  line-height: 1.6;
}

.review-option {
  padding: 12px 16px;
  border-radius: 10px;
  margin-bottom: 10px;
  border: 2px solid var(--border-color);
  background: var(--bg-primary);
  user-select: none;
  display: flex;
  align-items: center;
  gap: 10px;
}

.review-option .option-image {
  max-width: 150px;
  max-height: 100px;
}

.review-option.correct {
  background: #d4edda;
  border-color: var(--success-color);
  color: #155724;
}

.review-option.wrong {
  background: #f8d7da;
  border-color: var(--danger-color);
  color: #721c24;
}

.review-option.user-selected {
  border-width: 3px;
  font-weight: 600;
}

.action-buttons {
  display: flex;
  gap: 15px;
  justify-content: center;
  flex-wrap: wrap;
  margin-bottom: 20px;
}

.action-btn {
  padding: 14px 30px;
  border-radius: 10px;
  border: none;
  font-size: 16px;
  cursor: pointer;
  font-weight: 600;
  transition: all 0.3s;
  min-width: 150px;
  user-select: none;
  touch-action: manipulation;
}

.action-btn:active {
  transform: scale(0.95);
}

.action-btn.restart {
  background: var(--danger-color);
  color: white;
}

.action-btn.restart:hover {
  background: #c82333;
}

.action-btn.download {
  background: var(--primary-color);
  color: white;
}

.action-btn.download:hover {
  background: var(--primary-hover);
}

.action-btn.print {
  background: var(--secondary-color);
  color: white;
}

.action-btn.print:hover {
  background: #5a6268;
}

.hidden {
  display: none !important;
}

.palette-content::-webkit-scrollbar {
  width: 8px;
}

.palette-content::-webkit-scrollbar-track {
  background: var(--bg-tertiary);
}

.palette-content::-webkit-scrollbar-thumb {
  background: var(--primary-color);
  border-radius: 4px;
}

.palette-content::-webkit-scrollbar-thumb:hover {
  background: var(--primary-hover);
}

@media (max-width: 768px) {
  :root {
    --nav-height: 140px;
  }

  .container {
    padding: 10px;
  }

  .header {
    flex-direction: column;
    gap: 15px;
    padding: 15px;
  }

  .header h1 {
    font-size: 22px;
  }

  .quiz-container {
    padding: 20px 15px;
  }

  .question-palette {
    width: 100%;
    max-width: 100%;
  }

  .palette-grid {
    grid-template-columns: repeat(6, 1fr);
    gap: 8px;
  }

  .palette-btn {
    font-size: 13px;
    min-width: 36px;
    min-height: 36px;
  }

  .palette-fab {
    bottom: calc(var(--nav-height) + 10px);
    right: 15px;
    width: 56px;
    height: 56px;
    font-size: 22px;
  }

  .navigation {
    grid-template-columns: 1fr;
    gap: 10px;
    padding: 12px 15px;
  }

  .nav-btn {
    min-height: 44px;
    font-size: 15px;
  }

  .nav-btn.clear {
    order: 3;
  }

  .nav-btn.submit {
    grid-column: auto;
  }

  .stats-grid {
    grid-template-columns: repeat(2, 1fr);
  }

  .legend-grid {
    grid-template-columns: 1fr;
  }

  .question {
    font-size: 16px;
  }

  .option-label {
    padding: 14px 16px;
    font-size: 15px;
  }

  .option-image {
    max-height: 150px;
  }

  .action-buttons {
    flex-direction: column;
  }

  .action-btn {
    width: 100%;
  }
}

@media (max-width: 480px) {
  .palette-grid {
    grid-template-columns: repeat(5, 1fr);
    gap: 6px;
  }

  .palette-btn {
    font-size: 12px;
    min-width: 32px;
    min-height: 32px;
  }

  .header h1 {
    font-size: 20px;
  }

  .timer {
    font-size: 16px;
    padding: 8px 16px;
  }

  .option-image {
    max-height: 120px;
  }
}

const questions = [{"sr_no": 1, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The 2026 Abel Prize was awarded to    Gerd Faltings for major contributions to arithmetic geometry. This    field lies mainly at the intersection of which two branches of    mathematics?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Differential equations and topology</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Algebraic geometry and number    theory</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Probability theory and    combinatorics</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Theoretical computer science</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (2) Algebraic geometry and    number theory<br> Gerd Faltings received the 2026 Abel Prize for    introducing powerful tools in arithmetic geometry and resolving    long-standing Diophantine conjectures of Mordell and Lang.    Arithmetic geometry combines methods from algebraic geometry and    number theory.<br> Exam points:<br> • Faltings proved the    Mordell Conjecture in 1983; it is now known as Faltings'    Theorem.<br> • The Abel Prize is awarded by the Norwegian    Academy of Science and Letters and is often called the Nobel Prize    of Mathematics.<br> • Michel Talagrand received the 2024 Abel    Prize, mainly for work in probability theory and functional    analysis.</span></p>", "question_heading": ""}, {"sr_no": 2, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which wetland was designated as    India's 101st Ramsar Site in August 2026?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Surha Tal (Uttar Pradesh)</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Glaw Lake (Arunachal Pradesh)</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Loktak Lake (Manipur)</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Wular Lake (Jammu and Kashmir)</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (2) Glaw Lake (Arunachal    Pradesh)<br> Glaw Lake in Arunachal Pradesh was designated as    India's 101st Ramsar Site on 3 August 2026. It also became the    first Ramsar Site of Arunachal Pradesh. The freshwater lake lies    within the Kamlang Tiger Reserve and Wildlife Sanctuary in Lohit    district.<br> Exam points:<br> • Ramsar Sites are wetlands of    international importance under the Ramsar Convention.<br> • The    Convention was adopted at Ramsar, Iran, in 1971; India became a    contracting party in 1982.<br> • Glaw Lake is located in the    Eastern Himalayas, an ecologically rich biodiversity region.</span></p>", "question_heading": ""}, {"sr_no": 3, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Where was Exercise 'ROTOR CLAP III'    of the Indian Air Force conducted in 2026?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Jaisalmer, Rajasthan</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Leh, Ladakh</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Jodhpur, Rajasthan</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ambala, Haryana</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (1) Jaisalmer,    Rajasthan<br> The Indian Air Force conducted the week-long    Exercise ROTOR CLAP III at the Pokhran Field Firing Range in    Jaisalmer district, Rajasthan. The exercise concluded in early    August 2026 and focused on countering unmanned aerial systems    using rotary-wing platforms.<br> Exam points:<br> • Theme:    Counter-Unmanned Aerial Systems (Counter-UAS).<br> •    Participating platforms included AH-64 Apache, Mi-25/35, LCH    Prachand, Chinook, Mi-17 and Dhruv helicopters.<br> • The drill    tested rapid response, precision strikes, reconnaissance and    coordinated helicopter operations against drone threats.</span></p>", "question_heading": ""}, {"sr_no": 4, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which statement correctly describes    XPoSat, India's X-ray Polarimeter Satellite?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is a NASA rover sent to search    for life on Mars.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is India's first dedicated space    mission to study the polarization of astronomical X-ray sources.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It is a European Space Agency    satellite designed to study the Sun.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">It was built only to analyse soil    at the Moon's south pole.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (2) It is India's first    dedicated space mission to study the polarization of astronomical    X-ray sources.<br> ISRO launched XPoSat on 1 January 2024 aboard    PSLV-C58. It is India's first dedicated X-ray polarimetry mission    and was designed to study energetic celestial sources such as    black holes and neutron stars.<br> Exam points:<br> • Main    payloads: POLIX and XSPECT.<br> • XPoSat was placed in a    low-Earth orbit of about 650 km.<br> • It is the world's second    dedicated X-ray polarimetry mission after NASA's IXPE mission.</span></p>", "question_heading": ""}, {"sr_no": 5, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which statement is correct    regarding the tenure and removal of the Chairman and members of    the Union Public Service Commission (UPSC)?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Their tenure is 5 years or up to    the age of 62 years.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">They may be removed by the    President for proved misbehaviour only after an inquiry and report    by the Supreme Court.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">After leaving office, every member    can be re-employed by any State Government.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Their salaries and allowances are    subject to annual voting in Parliament.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (2) They may be removed by    the President for proved misbehaviour only after an inquiry and    report by the Supreme Court.<br> Article 317 provides that    removal on the ground of misbehaviour requires a reference by the    President to the Supreme Court and a report that the member ought    to be removed. Article 316 fixes the tenure at six years or until    the age of 65 years for the Union Commission, whichever is    earlier.<br> Exam points:<br> • Article 319: the UPSC Chairman    is ineligible for further government employment.<br> • A UPSC    member other than the Chairman may later become Chairman of the    UPSC or of a State Public Service Commission, but is not eligible    for other government employment.<br> • Expenses of the UPSC are    charged on the Consolidated Fund of India under Article 322 and    are not put to vote in Parliament.</span></p>", "question_heading": ""}, {"sr_no": 6, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which change was made by the    Constitution (104th Amendment) Act, 2019?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Constitutional status was granted    to the National Commission for Backward Classes.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Reservation of seats for Scheduled    Castes and Scheduled Tribes in the Lok Sabha and State Legislative    Assemblies was extended by 10 years, while the Anglo-Indian    nomination provision was discontinued.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Goods and Services Tax was    introduced.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">10% reservation was provided for    Economically Weaker Sections.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (2) Reservation for SCs and    STs was extended, and the Anglo-Indian nomination provision was    discontinued.<br> The Constitution (104th Amendment) Act amended    Article 334. It extended the reservation of seats for Scheduled    Castes and Scheduled Tribes in the Lok Sabha and State Legislative    Assemblies for another ten years, up to 25 January 2030. The    special representation of the Anglo-Indian community by nomination    was not extended.<br> Exam points:<br> • 101st Amendment:    Goods and Services Tax.<br> • 102nd Amendment: constitutional    status to the National Commission for Backward Classes.<br> •    103rd Amendment: 10% reservation for Economically Weaker Sections.</span></p>", "question_heading": ""}, {"sr_no": 7, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which Article of the Indian    Constitution deals with the powers, privileges and immunities of    the Houses of Parliament and their members?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 105</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 194</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 110</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 124</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (1) Article 105<br> Article    105 deals with the powers, privileges and immunities of    Parliament, its members and committees. It protects freedom of    speech in Parliament subject to the Constitution and parliamentary    rules, and gives immunity from court proceedings for anything said    or any vote given in Parliament or its committees.<br> Exam    points:<br> • Article 194: corresponding privileges of State    Legislatures and their members.<br> • Article 110: definition    of a Money Bill.<br> • Article 124: establishment and    constitution of the Supreme Court.</span></p>", "question_heading": ""}, {"sr_no": 8, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Under which Article may a Governor    reserve a Bill passed by the State Legislature for the    consideration of the President?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 161</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 200</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 213</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Article 226</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (2) Article 200<br> Article    200 deals with the Governor's action on Bills passed by a State    Legislature. The Governor may assent, withhold assent, return a    non-Money Bill for reconsideration, or reserve a Bill for the    consideration of the President. A Bill that, in the Governor's    opinion, would so derogate from the powers of the High Court as to    endanger its constitutional position must be reserved for the    President.<br> Exam points:<br> • Article 201: President's    decision on Bills reserved by the Governor.<br> • Article 161:    Governor's pardoning power.<br> • Article 213: Governor's    ordinance-making power.<br> • Article 226: power of High Courts    to issue writs.</span></p>", "question_heading": ""}, {"sr_no": 9, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Inflation measured after excluding    highly volatile items such as food and fuel is generally called:</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Headline inflation</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Core inflation</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Hyperinflation</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bottleneck inflation</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (2) Core inflation<br> Core    inflation attempts to measure the underlying trend in prices by    excluding highly volatile components, commonly food and fuel.    Because these prices can change sharply due to seasonal conditions    or supply shocks, core inflation is useful for assessing    persistent inflationary pressure.<br> Exam points:<br> •    Headline inflation includes the full basket, including food and    fuel.<br> • In India, the RBI's statutory inflation target is    based on headline CPI inflation, not core inflation.<br> •    Hyperinflation refers to an exceptionally rapid and uncontrolled    rise in the general price level.</span></p>", "question_heading": ""}, {"sr_no": 10, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which Five-Year Plan of India is    commonly known as the 'Gadgil Plan' and aimed at developing a    self-reliant and self-generating economy?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">First Five-Year Plan</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Second Five-Year Plan</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Third Five-Year Plan</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Fifth Five-Year Plan</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (3) Third Five-Year    Plan<br> The Third Five-Year Plan (1961-66) is commonly known as    the Gadgil Plan. It aimed to establish a self-reliant and    self-generating economy, with strong emphasis on agriculture and    expansion of basic industries. The plan was disrupted by the 1962    India-China War, the 1965 India-Pakistan War and severe    droughts.<br> Exam points:<br> • First Plan (1951-56):    Harrod-Domar model; priority to agriculture and irrigation.<br> •    Second Plan (1956-61): Mahalanobis model; emphasis on heavy    industries.<br> • Fourth Plan (1969-74), not the Third, is    especially associated with the objective 'growth with stability    and progressive achievement of self-reliance'.</span></p>", "question_heading": ""}, {"sr_no": 11, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following is not    recorded in the Current Account of a country's Balance of    Payments?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Import and export of goods</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Trade in services</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Unilateral transfers/remittances</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Foreign Direct Investment (FDI)</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (4) Foreign Direct    Investment (FDI)<br> The Current Account records transactions in    goods, services, primary income and secondary income/transfers.    Foreign Direct Investment creates a cross-border financial asset    or liability and is therefore not part of the Current Account.    Under modern balance-of-payments classification, FDI is recorded    in the Financial Account; many Indian exam texts traditionally    group such flows under the broader 'capital account'.<br> Exam    points:<br> • Goods trade = merchandise/visible trade.<br> •    Services include transport, tourism, software and financial    services.<br> • Remittances are recorded under secondary    income/transfers.</span></p>", "question_heading": ""}, {"sr_no": 12, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which statement best describes the    Elephanta Caves?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">They are primarily Buddhist caves    dominated by large stupas.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">They are rock-cut caves dominated    by Shaivite themes and monumental sculptures.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">They mainly combine Jain and    Vaishnava sculptures in pillared halls.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">They are entirely Mauryan-period    monolithic caves.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (2) They are rock-cut caves    dominated by Shaivite themes and monumental sculptures.<br> The    Elephanta Caves are located on Elephanta (Gharapuri) Island near    Mumbai. The main cave is famous for monumental Shaivite    sculptures, especially the large three-faced Sadashiva/Trimurti    representation of Shiva.<br> Exam points:<br> • UNESCO World    Heritage Site since 1987.<br> • UNESCO dates the construction    of the rock-cut caves mainly to about the mid-5th to 6th centuries    CE.<br> • Ajanta is best known for Buddhist caves and    paintings; Ellora contains Buddhist, Hindu and Jain monuments;    Barabar Caves belong to the Mauryan period.</span></p>", "question_heading": ""}, {"sr_no": 13, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which pass connects Himachal    Pradesh with Tibet and lies near the point where the Sutlej River    enters India?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Nathu La Pass</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Shipki La Pass</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Zoji La Pass</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lipulekh Pass</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (2) Shipki La Pass<br> Shipki    La is a high Himalayan pass in Kinnaur district of Himachal    Pradesh on the India-Tibet border. The Sutlej River enters India    from Tibet near Shipki La. The pass has historically been    associated with trans-Himalayan trade.<br> Exam points:<br> •    Nathu La: Sikkim-Tibet; important India-China trade route.<br> •    Zoji La: connects the Kashmir Valley with Ladakh.<br> •    Lipulekh: Uttarakhand-Tibet; associated with the Kailash    Mansarovar route.</span></p>", "question_heading": ""}, {"sr_no": 14, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The Sundari tree (Heritiera fomes)    is a characteristic species of which type of forest in India?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Tropical deciduous forests</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mangrove or tidal forests</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mountain coniferous forests</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Tropical thorn forests</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (2) Mangrove or tidal    forests<br> The Sundari tree (Heritiera fomes) is a    characteristic mangrove species of the Ganga-Brahmaputra-Meghna    delta, especially the Sundarbans. Mangroves are salt-tolerant    plants adapted to tidal, waterlogged and oxygen-poor soils.<br> Exam    points:<br> • Many mangroves develop breathing roots    (pneumatophores) that project above the soil or water surface.<br> •    Teak and sal are important tropical deciduous species.<br> •    Deodar, pine and spruce are typical coniferous trees.<br> •    Babool and other xerophytic plants are common in thorn forests.</span></p>", "question_heading": ""}, {"sr_no": 15, "question": "Wुicु यी पुध ीियियथing थधनध ौयciय-कधंयgनोूुic gयोिस यी पुध Nोपiयnोि Pयूिहोपiयn Pियicद, 2000? 1. Fनधध ोnक cयंूिहसयनद धकहcोपiयn हू पय पुध ोgध यी 14 2. Incनधोौing पुध ीधनपiिiपद नोपध पय धnौहनध ो कधंयgनोूुic कiॅiकधnक 3. Rधकहcing inीोnप ंयनपोिiपद पय ृिधयथ 30 ूधन 1,000 िiॅध ृiनपुौ 4. Pनयंयपing किधोदधक ंोननiोgध ीयन giिनस", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 1 and 2 are correct</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 1 and 3 are correct</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only 1, 3 and 4 are correct</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1, 2, 3 and 4 are all correct</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (3) Only 1, 3 and 4 are    correct<br> The National Population Policy, 2000 sought to reduce    fertility to replacement level, not increase it. Its    socio-demographic goals included free and compulsory school    education up to age 14, reducing the Infant Mortality Rate below    30 per 1,000 live births, and promoting delayed marriage for    girls.<br> Exam points:<br> • Marriage for girls: not before    18 years and preferably after 20 years.<br> • Medium-term    objective: achieve replacement-level TFR of 2.1.<br> •    Long-term objective: achieve a stable population consistent with    sustainable economic growth by 2045.<br> Therefore, Statement 2    is incorrect.</span></p>", "question_heading": ""}, {"sr_no": 16, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">During whose reign did the Italian    traveller Niccolò de' Conti visit the Vijayanagara Empire?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Deva Raya I</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Deva Raya II</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Krishnadeva Raya</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Achyuta Deva Raya</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (1) Deva Raya I<br> Italian    merchant-traveller Niccolò de' Conti visited Vijayanagara around    1420-21, during the reign of Deva Raya I of the Sangama dynasty.    His account is an important foreign description of Vijayanagara in    the early 15th century.<br> Exam points:<br> • Abdur Razzaq    visited during the reign of Deva Raya II.<br> • Domingo Paes    visited during the reign of Krishnadeva Raya.<br> • Fernão    Nuniz is associated with the reign of Achyuta Deva Raya.<br> These    traveller-ruler pairs are frequently asked in competitive exams.</span></p>", "question_heading": ""}, {"sr_no": 17, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Saint Dnyaneshwar's celebrated    Marathi work 'Dnyaneshwari' (Bhavarth Deepika) is a commentary on    which scripture?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ramayana</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Shrimad Bhagavad Gita</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mahabharata</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Upanishads</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (2) Shrimad Bhagavad    Gita<br> Dnyaneshwari, also called Bhavarth Deepika, is Saint    Dnyaneshwar's Marathi commentary on the Bhagavad Gita. Composed in    the late 13th century, it made the philosophical teachings of the    Gita accessible to Marathi-speaking people.<br> Exam points:<br> •    Dnyaneshwar was a major saint of the Varkari tradition of    Maharashtra.<br> • Another important work attributed to him is    Amrutanubhav.<br> • Namdev, Eknath and Tukaram are other major    saints associated with the Maharashtra Bhakti tradition.</span></p>", "question_heading": ""}, {"sr_no": 18, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which option best describes    Annamacharya's contribution to Indian devotional music?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">He composed Sanskrit hymns centred    on caste-based rituals.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">He composed more than 32,000    devotional songs, many of which emphasized devotion and spiritual    equality.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">His songs were restricted only to    temple priests.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">He focused only on musical    aesthetics and not on devotional or social themes.</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (2) He composed more than    32,000 devotional songs, many of which emphasized devotion and    spiritual equality.<br> Tallapaka Annamacharya (1408-1503) was a    Telugu saint-poet closely associated with the worship of Lord    Venkateswara at Tirumala. Tradition credits him with over 32,000    sankirtanas. He is often called 'Padakavita Pitamaha' for his    major contribution to Telugu devotional song literature.<br> Exam    points:<br> • His compositions are mainly in Telugu, with some    in Sanskrit.<br> • 'Brahmam Okate' is among his best-known    compositions and stresses the essential oneness of the divine and    equality of human beings.<br> • He is regarded as one of the    earliest major Telugu vaggeyakaras, combining lyric composition    with music.</span></p>", "question_heading": ""}, {"sr_no": 19, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The Wood's Dispatch of 1854 is    often called the 'Magna Carta of English Education in India'. Who    was the Governor-General of India when it was issued?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lord Dalhousie</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lord Auckland</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lord Hardinge</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Lord Canning</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (1) Lord Dalhousie<br> Wood's    Dispatch was issued in 1854 when Lord Dalhousie was    Governor-General of India (1848-56). It was named after Sir    Charles Wood, then President of the Board of Control, and laid    down a comprehensive scheme for the expansion of education in    British India.<br> Exam points:<br> • Recommended Departments    of Public Instruction in the provinces.<br> • Recommended    universities at Calcutta, Bombay and Madras; these universities    were established in 1857.<br> • Supported teacher training,    grants-in-aid, women's education and vernacular instruction at the    primary level.<br> • Lord Canning became Governor-General in    1856 and the first Viceroy in 1858.</span></p>", "question_heading": ""}, {"sr_no": 20, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Arrange the following events in    chronological order:<br> a. 25th meeting of the Eastern Zonal    Council (2022)<br> b. Enactment of the States Reorganisation    Act<br> c. First meeting of the Central Zonal Council</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">b-c-a</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">c-b-a</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">a-b-c</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">b-a-c</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (1) b-c-a<br> The States    Reorganisation Act was enacted in 1956 and provided for five Zonal    Councils. The Central Zonal Council began functioning thereafter    in the late 1950s, so its first meeting necessarily came after the    1956 Act. The 25th meeting of the Eastern Zonal Council was held    in Kolkata on 17 December 2022. Hence the correct order is b </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    c </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    a.<br> Exam points:<br> • Zonal Councils are statutory, not    constitutional, bodies.<br> • Five Zonal Councils were created    under the States Reorganisation Act, 1956.<br> • The Union Home    Minister is the ex-officio Chairman of each Zonal Council.<br> •    The North Eastern Council is a separate body created under the    North Eastern Council Act, 1971.</span></p>", "question_heading": ""}, {"sr_no": 21, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which is the only non-metal that is    liquid at ordinary room temperature (about 25°C)?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mercury</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bromine</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Gallium</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Iodine</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (2) Bromine<br> Bromine    (Br), atomic number 35, is a halogen in Group 17 of the periodic    table. At ordinary room temperature it is a reddish-brown volatile    liquid and is the only non-metal that is liquid under these    conditions.<br> Exam points:<br> • Mercury is the only metal    commonly liquid at room temperature.<br> • Gallium is a metal    with a low melting point of about 29.8°C, so it can melt in the    hand.<br> • Iodine is a solid non-metal at room temperature and    sublimes readily on heating.</span></p>", "question_heading": ""}, {"sr_no": 22, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which cells of the pancreas secrete    insulin?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Alpha cells</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Beta cells</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Delta cells</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">F/PP cells</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (2) Beta cells<br> Insulin    is secreted by the beta (</span><span>β</span><span style=\"font-family:'Nirmala UI'\">)    cells of the Islets of Langerhans in the pancreas. It lowers blood    glucose by promoting glucose uptake and storage, including    glycogen formation in the liver and muscles. Deficiency or    ineffective action of insulin is associated with diabetes    mellitus.<br> Exam points:<br> • Alpha cells </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    glucagon, which raises blood glucose.<br> • Delta cells </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    somatostatin.<br> • PP/F cells </span><span>→</span><span style=\"font-family:'Nirmala UI'\">    pancreatic polypeptide.<br> Remember: insulin and glucagon act    antagonistically in maintaining blood-glucose balance.</span></p>", "question_heading": ""}, {"sr_no": 23, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">How is an ammeter connected in an    electric circuit, and what is the resistance of an ideal ammeter?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Parallel; Infinite</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Series; Zero</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Series; Infinite</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Parallel; Zero</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (2) Series; Zero<br> An    ammeter measures the current through a circuit branch, so it is    connected in series with that branch. An ideal ammeter has zero    resistance so that it does not change the current being measured;    a practical ammeter has very low resistance.<br> Exam points:<br> •    Voltmeter is connected in parallel across two points.<br> • An    ideal voltmeter has infinite resistance; a practical voltmeter has    very high resistance.<br> • Wrong connection of an ammeter    directly in parallel can cause a very large current because of its    low resistance.</span></p>", "question_heading": ""}, {"sr_no": 24, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which classical dance-drama of    Kerala is especially known for elaborate colour-coded facial    make-up, headgear and costumes used to identify different    character types?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kathakali</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bharatanatyam</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Kuchipudi</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mohiniyattam</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (1) Kathakali<br> Kathakali    is the classical dance-drama tradition of Kerala known for highly    stylised facial make-up, elaborate costumes, headgear, hand    gestures and facial expressions. Character types are indicated    through distinctive make-up conventions rather than ordinary    masks.<br> Exam points:<br> • 'Pacha' (green) generally    represents noble and heroic characters.<br> • 'Kathi' is used    for proud or villainous characters; 'Kari' is associated with    dark/demonic female characters; beard types are used for other    character categories.<br> • Bharatanatyam is associated with    Tamil Nadu, Kuchipudi with Andhra Pradesh, and Mohiniyattam with    Kerala.<br> • Kathakali stories are drawn mainly from the    Ramayana, Mahabharata and Puranic traditions.</span></p>", "question_heading": ""}, {"sr_no": 25, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Pandwani, a folk singing and    storytelling tradition based mainly on episodes from the    Mahabharata and associated with Teejan Bai, belongs primarily to    which state?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Odisha</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Chhattisgarh</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Madhya Pradesh</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Jharkhand</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Answer: (2) Chhattisgarh<br> Pandwani    is a celebrated folk singing and storytelling tradition of    Chhattisgarh that narrates episodes from the Mahabharata,    especially stories connected with the Pandavas. The lead performer    uses song, narration, gesture and acting, often holding a tambura    as both a musical instrument and a dramatic prop.<br> Exam    points:<br> • Two major styles: Vedamati and Kapalik.<br> •    Teejan Bai is famous for the Kapalik style.<br> • Teejan Bai    received the Padma Shri (1988), Padma Bhushan (2003) and Padma    Vibhushan (2019).<br> • Pandwani is also known in adjoining    regions, but its strongest cultural identification is with    Chhattisgarh.</span></p>", "question_heading": ""}, {"sr_no": 26, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate synonym    of the given word.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>REBARBATIVE</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Appealing</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Repellent</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Cordial</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Congenial</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\"> Option    2 - Repellent<br> <br> </span><span style=\"font-family:'Nirmala UI'\"><b>Meaning:</b></span><span style=\"font-family:'Nirmala UI'\"> Rebarbative    means unpleasant, unattractive, objectionable, or likely to cause    dislike.<br> <br> Why Repellent? Repellent means causing    aversion, dislike, or rejection, so it is the closest    synonym.<br> <br> </span><span style=\"font-family:'Nirmala UI'\"><b>Other    options:</b></span><span style=\"font-family:'Nirmala UI'\"><br> •    Appealing = attractive or pleasing.<br> • Cordial = warm and    friendly.<br> • Congenial = pleasant or agreeable.<br> <br> Therefore,    Repellent is the most appropriate synonym of Rebarbative.</span></p>", "question_heading": ""}, {"sr_no": 27, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate synonym    of the given word.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>INSUPERABLE</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Inconsequential</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Irreversible</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Insurmountable</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Incurable</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\"> Option    3 - Insurmountable<br> <br> </span><span style=\"font-family:'Nirmala UI'\"><b>Meaning:</b></span><span style=\"font-family:'Nirmala UI'\"> Insuperable    means impossible to overcome, defeat, or surmount.<br> <br> Insurmountable    has the same sense: a difficulty, obstacle, or problem that cannot    be overcome.<br> <br> </span><span style=\"font-family:'Nirmala UI'\"><b>Other    options:</b></span><span style=\"font-family:'Nirmala UI'\"><br> •    Inconsequential = unimportant.<br> • Irreversible = impossible    to reverse.<br> • Incurable = impossible to cure.<br> <br> Therefore,    Insurmountable is the most precise synonym.</span></p>", "question_heading": ""}, {"sr_no": 28, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate antonym    of the given word.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>FACTITIOUS</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Artificial</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Genuine</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Contrived</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Manufactured</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\"> Option    2 - Genuine<br> <br> </span><span style=\"font-family:'Nirmala UI'\"><b>Meaning:</b></span><span style=\"font-family:'Nirmala UI'\"> Factitious    means artificially created, contrived, or not arising    naturally.<br> <br> Genuine means real, authentic, or natural,    which gives the clearest opposite meaning.<br> <br> Artificial,    Contrived, and Manufactured are all close in meaning to    Factitious.<br> <br> Therefore, Genuine is the correct antonym.</span></p>", "question_heading": ""}, {"sr_no": 29, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate meaning    of the following idiom.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>GALL    AND WORMWOOD</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Something that produces intense    bitterness or resentment</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A situation involving excessive    financial expenditure</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A difficult task that requires    exceptional physical endurance</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A secret arrangement made between    opposing parties</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\"> Option    1<br> <br> Gall and wormwood means something that causes extreme    bitterness, annoyance, or resentment.<br> <br> The expression is    used figuratively for an event or situation that is deeply    unpleasant or galling to someone.<br> <br> Example: His rival's    unexpected promotion was gall and wormwood to him.<br> <br> Hence,    Option 1 gives the correct meaning.</span></p>", "question_heading": ""}, {"sr_no": 30, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the correctly spelt word.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bourgeoisie</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bourgeoisy</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bourgeosie</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Bourgeoizie</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\"> Option    1 - Bourgeoisie<br> <br> Bourgeoisie is the correct    spelling.<br> <br> </span><span style=\"font-family:'Nirmala UI'\"><b>Meaning:</b></span><span style=\"font-family:'Nirmala UI'\"> the    middle or capitalist class, especially in social, economic, or    Marxist contexts.<br> <br> Spelling pattern:    B-O-U-R-G-E-O-I-S-I-E<br> <br> The other options contain    incorrect letter sequences. Therefore, Bourgeoisie is the only    correctly spelt word.</span></p>", "question_heading": ""}, {"sr_no": 31, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the correctly spelt word.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sesquipedallian</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sesquipedalian</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sesquipedaliane</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sesquipedelian</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\"> Option    2 - Sesquipedalian<br> <br> Sesquipedalian is the correct    spelling.<br> <br> </span><span style=\"font-family:'Nirmala UI'\"><b>Meaning:</b></span><span style=\"font-family:'Nirmala UI'\"> characterised    by the use of long words; it can also describe a person who    habitually uses long words.<br> <br> Spelling pattern:    S-E-S-Q-U-I-P-E-D-A-L-I-A-N<br> <br> The other options contain    extra or misplaced letters. Hence, Option 2 is correct.</span></p>", "question_heading": ""}, {"sr_no": 32, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate    one-word substitution for the given group of words.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>A    person who deliberately challenges or attacks established beliefs,    customs, or revered institutions</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Iconoclast</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Plutocrat</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Hedonist</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Ascetic</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\"> Option    1 - Iconoclast<br> <br> An iconoclast is a person who challenges    or attacks established beliefs, traditions, customs, or    institutions.<br> <br> </span><span style=\"font-family:'Nirmala UI'\"><b>Other    options:</b></span><span style=\"font-family:'Nirmala UI'\"><br> •    Plutocrat = a person whose power comes from wealth.<br> •    Hedonist = a person who considers pleasure the main aim of life.<br> •    Ascetic = a person who practises severe self-discipline and avoids    worldly pleasures.<br> <br> Therefore, Iconoclast is the correct    one-word substitution.</span></p>", "question_heading": ""}, {"sr_no": 33, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate    one-word substitution for the given group of words.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>To    leave a place suddenly, especially secretly, in order to avoid    an unpleasant situation or responsibility</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Decamp</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Mediate</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Capitulate</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Recompense</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\"> Option    1 - Decamp<br> <br> Decamp means to leave a place suddenly or    hurriedly, often secretly, especially to avoid an unpleasant    situation.<br> <br> </span><span style=\"font-family:'Nirmala UI'\"><b>Other    options:</b></span><span style=\"font-family:'Nirmala UI'\"><br> •    Mediate = intervene to settle a dispute.<br> • Capitulate =    surrender or stop resisting.<br> • Recompense = compensate or    repay.<br> <br> Hence, Decamp is the most appropriate word.</span></p>", "question_heading": ""}, {"sr_no": 34, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the correctly spelt word.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Phantasmagorea</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Phantasmagoria</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Phantasmagoriah</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Phantasmagorya</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\"> Option    2 - Phantasmagoria<br> <br> Phantasmagoria is the correct    spelling.<br> <br> </span><span style=\"font-family:'Nirmala UI'\"><b>Meaning:</b></span><span style=\"font-family:'Nirmala UI'\"> a    strange, dreamlike, or rapidly changing sequence of images,    scenes, or ideas.<br> <br> Spelling pattern:    P-H-A-N-T-A-S-M-A-G-O-R-I-A<br> <br> The other options contain    incorrect endings or letter combinations. Therefore, Option 2 is    correct.</span></p>", "question_heading": ""}, {"sr_no": 35, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the correctly spelt word.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sacrilegious</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sacriligious</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sacrilegeous</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sacrilegous</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\"> Option    1 - Sacrilegious<br> <br> Sacrilegious is the correct    spelling.<br> <br> </span><span style=\"font-family:'Nirmala UI'\"><b>Meaning:</b></span><span style=\"font-family:'Nirmala UI'\"> showing    disrespect towards something regarded as sacred or    holy.<br> <br> Remember: the correct sequence is -rilegious, not    -riligious or -rilegous.<br> <br> Hence, Option 1 is correct.</span></p>", "question_heading": ""}, {"sr_no": 36, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate option    to change the given sentence from Active Voice to Passive    Voice.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>The    archivists restored the fragile manuscript before the exhibition    opened.</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The fragile manuscript was restored    by the archivists before the exhibition opened.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The fragile manuscript has been    restored by the archivists before the exhibition opened.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The fragile manuscript had restored    by the archivists before the exhibition opened.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The fragile manuscript was being    restored by the archivists before the exhibition opened.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\"> Option    1<br> <br> </span><span style=\"font-family:'Nirmala UI'\"><b>Rule:</b></span><span style=\"font-family:'Nirmala UI'\"> Simple    Past Active (Subject + V2 + Object) changes to Simple Past Passive    (Object + was/were + V3 + by + Subject).<br> <br> </span><span style=\"font-family:'Nirmala UI'\"><b>Active:</b></span><span style=\"font-family:'Nirmala UI'\"> The    archivists restored the fragile manuscript.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Passive:</b></span><span style=\"font-family:'Nirmala UI'\"> The    fragile manuscript was restored by the archivists.<br> <br> The    object 'the fragile manuscript' is singular, so 'was' is used. The    tense and meaning remain unchanged.</span></p>", "question_heading": ""}, {"sr_no": 37, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Determine whether any part of the    following sentence contains an error. If there is no error, select    'No Error'.<br> If the excavation team had followed the revised    protocol, / the contamination might have been avoided / and the    artefacts would have remained / suitable for laboratory analysis.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">If the excavation team had followed    the revised protocol</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">the contamination might have been    avoided</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">and the artefacts would have    remained</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">No Error</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\"> Option    4 - No Error<br> <br> The sentence correctly uses a past unreal    conditional.<br> <br> </span><span style=\"font-family:'Nirmala UI'\"><b>Rule:</b></span><span style=\"font-family:'Nirmala UI'\"> If    + subject + had + V3, subject + would/could/might have +    V3.<br> <br> Here, 'had followed' is correct in the if-clause,    while 'might have been avoided' and 'would have remained' are    valid modal-perfect structures expressing different possible    consequences.<br> <br> Therefore, the sentence is grammatically    correct.</span></p>", "ques
