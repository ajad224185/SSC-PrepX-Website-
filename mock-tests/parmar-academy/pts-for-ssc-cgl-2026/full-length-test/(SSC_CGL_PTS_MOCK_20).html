le=\"font-family:'Nirmala UI'\">Cautiously analytical and pragmatic</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Alarmist and dismissive</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Sarcastic and confrontational</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\"> Option    2 - Cautiously analytical and pragmatic<br> <br> The author    recognises the potential of green hydrogen but also examines its    cost, infrastructure, electricity-demand, and efficiency    constraints.<br> <br> The passage neither promotes the    technology uncritically nor rejects it. Instead, it recommends    practical, targeted deployment.<br> <br> This balanced    evaluation makes the tone cautiously analytical and pragmatic.</span></p>", "question_heading": ""}, {"sr_no": 46, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Choose the option that correctly    completes both blanks using the appropriate homophones:<br> (i)    The committee's recommendations were intended to ______ the    existing regulatory framework rather than replace it.<br> (ii)    The colour of the curtains was chosen to ______ the muted tones of    the interior.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">compliment, complement</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">complement, compliment</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">complement, complement</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">compliment, compliment</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\"> Option    3 - complement, complement<br> <br> Complement means to    complete, enhance, or go well with something.<br> Compliment    means to praise or express admiration.<br> <br> (i) The    recommendations were intended to complement the framework =    strengthen or complete it.<br> (ii) The curtains were chosen to    complement the muted tones = go well with them.<br> <br> Therefore,    complement is required in both blanks.</span></p>", "question_heading": ""}, {"sr_no": 47, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Select the most appropriate option    to change the given sentence from Direct Speech to Indirect    Speech.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>The robotics    researcher said to me, \"You can operate the prototype only    after completing the safety calibration.\"</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The robotics researcher told me    that I could operate the prototype only after completing the    safety calibration.</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The robotics researcher told me    that I can operate the prototype only after completing the safety    calibration.</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The robotics researcher told me    that I might operate the prototype only after completing the    safety calibration.</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The robotics researcher told me    that I should operate the prototype only after completing the    safety calibration.</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\"> Option    1<br> <br> In indirect speech, 'said to me' normally changes to    'told me'. Because the reporting verb is in the past, can changes    to could under normal backshift.<br> <br> The pronoun you refers    to 'me', so it changes to I.<br> <br> </span><span style=\"font-family:'Nirmala UI'\"><b>Direct:</b></span><span style=\"font-family:'Nirmala UI'\"> The    researcher said to me, \"You can operate ...\"<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Indirect:</b></span><span style=\"font-family:'Nirmala UI'\"> The    researcher told me that I could operate ...<br> <br> Hence,    Option 1 is correct.</span></p>", "question_heading": ""}, {"sr_no": 48, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Choose the most appropriate phrasal    verb to complete the sentence:<br> </span><span style=\"font-family:'Nirmala UI'\"><b>The    negotiations gradually lost momentum and appeared to have ______    by the end of the week, but an unexpected concession from the    mediator eventually revived the process.</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">fallen through</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">petered out</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">broken in</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">carried over</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\"> Option    2 - petered out<br> <br> Peter out means to gradually become    weaker, less active, or less effective until coming to an    end.<br> <br> The clue 'gradually lost momentum' directly    matches this meaning.<br> <br> • fall through = fail to happen    or be completed.<br> • break in = enter forcibly or    interrupt.<br> • carry over = continue or transfer to a later    time.<br> <br> Therefore, petered out is the best fit.</span></p>", "question_heading": ""}, {"sr_no": 49, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Rearrange the following four    sentences (P, Q, R and S) to form a meaningful and coherent    paragraph.<br> P. This apparent paradox has encouraged    researchers to examine whether urban density itself is the problem    or whether the quality of neighbourhood design matters more.<br> Q.    Cities with compact populations often consume less land and can    support efficient public transport, yet their residents do not    necessarily experience better living conditions.<br> R. The    distinction is important because poorly planned density can    intensify congestion, noise, heat, and pressure on public    amenities.<br> S. Well-designed compact neighbourhoods, by    contrast, can combine accessibility with public spaces, pedestrian    mobility, and adequate environmental safeguards.<br> </span><span style=\"font-family:'Nirmala UI'\"><b>Select    the correct sequence.</b></span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QPRS</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QRPS</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">PQRS</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QSPR</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\"> Option    1 - QPRS<br> <br> Q opens the paragraph by presenting a paradox:    compact cities can be efficient, yet living conditions may not    improve.<br> <br> P must follow because 'This apparent paradox'    refers directly to the contrast in Q.<br> <br> R then explains    why the distinction between density and design matters by    describing the problems of poorly planned density.<br> <br> S    provides the contrast with well-designed compact    neighbourhoods.<br> <br> </span><span style=\"font-family:'Nirmala UI'\"><b>Correct    sequence:</b></span><span style=\"font-family:'Nirmala UI'\"> Q - P - R    - S.</span></p>", "question_heading": ""}, {"sr_no": 50, "question": "Rधोननोngध पुध ीियियथing ीयहन ौधnपधncधौ (P, Q, R ोnक S) पय ीयनं ो ंधोningीिह ोnक cयुधनधnप ूोनोgनोूु. P. Cयnौधतहधnिपद, पुध ॅोिहध यी ो ौciधnपiीic ीयनधcोौप कधूधnकौ nयप यnिद यn iपौ nहंधनicोि ूनधciौiयn ृहप ोिसय यn ुयथ cिधोिनद iपौ ोौौहंूपiयnौ ोnक िiंiपोपiयnौ ोनध cयंंहnicोपधक. Q. A ीयनधcोौप iौ nधॅधन ौiंूिद ो ौपोपधंधnप ोृयहप थुोप थiिि ुोूूधnे iप iौ ोn धौपiंोपध cयnौपनहcपधक ीनयं ोॅोiिोृिध धॅiकधncध, ंयकिधस, ोnक ोौौहंूपiयnौ ोृयहप ीहपहनध cयnकiपiयnौ. R. Wुधn पुयौध ोौौहंूपiयnौ नधंोin ुiककधn, हौधनौ ंोद ंiौपोाध ो cयnकiपiयnोि ूनयुधcपiयn ीयन ो cधनपोinपद ोnक ंोाध कधciौiयnौ पुोप पुध धॅiकधncध कयधौ nयप ुहौपiीद. S. Mोाing पुयौध हnकधिनदing cयnकiपiयnौ धसूिiciप पुधनधीयनध धnोृिधौ कधciौiयn-ंोाधनौ पय inपधनूनधप ूनधकicपiयnौ ोccयनकing पय पुध कधgनधध यी हncधनपोinपद ोपपोcुधक पय पुधं. Sिधधcप पुध cयननधcप ौधतहधncध.", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QRSP</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QSPR</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">RQSP</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">QPRS</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\"><b>Correct Answer:</b></span><span style=\"font-family:'Nirmala UI'\"> Option    1 - QRSP<br> <br> Q introduces the idea of a forecast and    mentions the assumptions on which it depends.<br> <br> R follows    because 'those assumptions' refers directly to the assumptions in    Q and explains the danger of hiding them.<br> <br> S then gives    the solution: making those underlying conditions explicit.<br> <br> P    concludes with 'Consequently' and states the overall    principle.<br> <br> </span><span style=\"font-family:'Nirmala UI'\"><b>Correct    sequence:</b></span><span style=\"font-family:'Nirmala UI'\"> Q - R - S    - P.</span></p>", "question_heading": ""}, {"sr_no": 51, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In an election, 10% of the    registered voters did not vote, and 20% of the votes cast were    declared invalid. If the winning candidate received 60% of the    valid votes and won by 1440 votes, find the total number of    registered voters.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">9000</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">9500</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">10000</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">10500</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Let total number of    registered voters = 100 units<br> Casting votes = 100 × 90/100 =    90 units<br> Valid votes = 90 × 80/100 = 72 units<br> Winning    Margin = 72 units × (60 - 40) % = 72 units × 20%<br> Now,<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    72 units × 20% = 1440<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    100 units = 10000<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    Total number of registered voters = 10000</span></p>", "question_heading": ""}, {"sr_no": 52, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A leak empties the tank in 40    hours. A pipe fills it at a rate of 15 liters/hour. If both are    open simultaneously, the tank empties in 60 hours. Find the    capacity of the tank.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1,800 liters</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2,000 liters</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2,400 liters</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">1,500 liters</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Let capacity of tank =    LCM (40,60) = 120<br> Efficiency of leakage pipe (-A) = 120/40 =    - 3<br> Efficiency of (leakage pipe + inlet pipe) = 120/60 = -    2<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    Efficiency of inlet pipe (B) = 1<br> Now, 1 unit = 15 liters<br> 120    unit = 1800 liters<br> Capacity of the tank = 1800 liters</span></p>", "question_heading": ""}, {"sr_no": 53, "question": "  <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The bar graph below shows the    number of books sold by a shop from the year 2015 to 2021. Based    on the bar graph, answer the question that follows.<br> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786898563785_html_550ea7fcac78e8a9.png\" width=\"296\" height=\"182\" > <span style=\"font-family:'Nirmala UI'\"><br> In    which year is the percentage increase in books sold, compared to    the previous year, the highest?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2016</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2018</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2019</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">2021</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> 2016: Increase % =    (260−200)/200 × 100% = (60)/200 × 100% = 30%<br> 2018:    Increase % = (300−230)/230 × 100% = (70)/230 × 100% </span><span style=\"font-family:'Cambria Math'\">≈</span><span style=\"font-family:'Nirmala UI'\">    30.4%<br> 2019: Increase % = (350−300)/300 × 100% = (50)/300 ×    100% </span><span style=\"font-family:'Cambria Math'\">≈</span><span style=\"font-family:'Nirmala UI'\">    16.7%<br> 2021: Increase % = (500−300)/300 × 100% = (200)/300    × 100% </span><span style=\"font-family:'Cambria Math'\">≈</span><span style=\"font-family:'Nirmala UI'\">    66.7% Required year = Highest percentage increase = 2021</span></p>", "question_heading": ""}, {"sr_no": 54, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In a two-digit number, the tens    digit is 3 less than the units digit. Three times this number,    when added to the number obtained by reversing its digits, gives    83. Find the sum of the digits of the number.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">5</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">6</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">7</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">8</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Let number = 10x + y<br> ATQ,    y − x = 3……………. (1)<br> And 3(10x + y) + (10y + x) =    83<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    31x + 13y = 83……………. (2)<br> From equation (1) &amp;    (2),<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    x = 1, y = 4<br> Number = 10 × 1 + 4 = 14<br> Sum of digits = 1    + 4 = 5</span></p>", "question_heading": ""}, {"sr_no": 55, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A can complete a work in 24 days.    He works for 8 days and then B completes the remaining work in 20    days. Find in how many days A and B together can complete the    whole work.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">12 days</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">13 (1/3) days</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">14 days</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">15 days</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> 24A = 8A +20B<br> 16A =    20B<br> A : B = 5 : 4<br> Total work = 24 × 5 = 120<br> Required    time = 120/(5 + 4) = 120/9 = 40/3 = 13(1/3) days</span></p>", "question_heading": ""}, {"sr_no": 56, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The average of m numbers is 52. If    each of 70% of the numbers is increased by 12 and each of the    remaining numbers is decreased by 8, then find the new average.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">58</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">66</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">38</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">20</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Let total numbers =    100<br> Increment = 100 × 70/100 × 12 = 840<br> Decrement =    100 × 30/100 × 8 = 240<br> Total increment = 840 - 240 =    600<br> Required average = 52 + 600/100 = 52 + 6 = 58</span></p>", "question_heading": ""}, {"sr_no": 57, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In a partnership, A gets 3/8 of the    total profit for managing the business, and the remaining profit    is divided between B and C in the ratio 2:3. If C's share is ₹3000    more than B's share, find the total profit.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">20000</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">22000</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">24000</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">26000</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Profit (A : B : C) = 3 :    5 × 2/5 : 5 × 3/5<br> = 3 : 2 : 3<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    (3 - 2) units = ₹3000<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    8 units = ₹24000<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    Total profit = ₹24000</span></p>", "question_heading": ""}, {"sr_no": 58, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The volumes of three containers are    in the ratio 2 : 3 : 4, and they contain milk and water in the    ratios 3 : 1, 2 : 1, and 4 : 3, respectively. All the contents are    mixed into a fourth container. Find the ratio of milk to water.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">9 : 5</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">5 : 9</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">7 : 4</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">8 : 5</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Container 1, Milk : Water    = (3 : 1) × 3 × 7 × 2 = 21 : 7<br> Container 2, Milk : Water =    (2 : 1) × 4 × 7 × 3 = 28 : 14<br> Container 3, Milk : Water =    (4 : 3) × 4 × 3 × 4 = 32 : 24 <br> Total, Milk : Water =    (21 + 28 + 32) : (7 + 14 + 24)<br> = 81 : 45<br> = 9 : 5</span></p>", "question_heading": ""}, {"sr_no": 59, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A shopkeeper earns a 20% profit on    the cost price even after offering a 20% discount. During a    clearance sale, he reduces this discounted price by a further 25%.    Find the overall profit/loss percentage.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Profit, 10%</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Loss, 10%</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Loss, 15%</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Profit, 15%</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Let CP = 100 units<br> SP</span><sub><span style=\"font-family:'Nirmala UI'\">1</span></sub><span style=\"font-family:'Nirmala UI'\"> =    100 × 120/100 = 120 units<br> SP</span><sub><span style=\"font-family:'Nirmala UI'\">2</span></sub><span style=\"font-family:'Nirmala UI'\"> =    120 × 75/100 = 90 units<br> Now,<br> Loss % = (100 – 90) % =    10%</span></p>", "question_heading": ""}, {"sr_no": 60, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Find the equation of the    perpendicular bisector of the line segment joining the points    (2,3) and (6,7).</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">x + y = 9</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">x – y = 9</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">x + y = 8</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">x – y = 8</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Midpoint = [(2 + 6)/2, (3    + 7)/2]<br> = (4,5)<br> Slope of the segment = (7 - 3)/(6 - 2) =    4/4 = 1<br> Slope of a perpendicular line = -1/1 = -1<br> Equation,<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    y - 5 = -1 × (x - 4)<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    y - 5 = -x + 4<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    x + y = 9</span></p>", "question_heading": ""}, {"sr_no": 61, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The population of a village    increases by 20% in the first year, and decreases by 10% in each    of the next two years due to migration. In the fourth year, it    increases by 25%. If the population at the end of four years is    48,600, find the population at the beginning.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">35000</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">30000</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">40000</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">45000</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Let initial population = m<br> ATQ,<br> m    × 120/100 × 90/100 × 90/100 × 125/100 = 48600<br> m = 48600 ×    100/120 × 100/90 × 100/90 × 100/125<br> = 40000<br> Initial    population = 40000</span></p>", "question_heading": ""}, {"sr_no": 62, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A person deposits ₹5,000 into a    scheme at the end of each year. The scheme earns simple interest    at a rate of 8% per annum. If he deposits the amount for 4    consecutive years, what total amount will he receive at the end of    the 4 years?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">20400</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">18400</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">22400</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">15400</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> On the 1st year's ₹5,000    = Interest for 3 years<br> = 5000 × 8 × 3/100 = ₹1,200<br> On    the 2nd year's ₹5,000 = Interest for 2 years<br> = 5000 × 8 ×    2/100 = ₹800<br> On the 3rd year's ₹5,000 = Interest for 1    year = 5000 × 8 × 1/100 = ₹400<br> On the 4th year's ₹5,000    = Interest for 0 years<br> = 5000 × 8 × 0/100<br> = ₹0<br> Total    interest = 1200 + 800 + 400 + 0 = ₹2400<br> Total amount = 4 ×    5000 + 2400 = 20000 + 2400 = ₹22400</span></p>", "question_heading": ""}, {"sr_no": 63, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Find the compound interest on ₹1998    for 2 years 6 months at 10% per annum, compounded annually.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">540.459</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">440.559</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">340.559</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    ₹<span style=\"font-family:'Nirmala UI'\">240.459</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Principal = ₹1998<br> Rate    = 10%<br> Time = 2 years 6 months<br> Amount = 1998 × 110/100 ×    110/100 × 105/100<br> = 2538.459<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    Compound interest = 2538.459 - 1998 = ₹540.459</span></p>", "question_heading": ""}, {"sr_no": 64, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A shopkeeper offers two successive    discounts of 20% and 10% on the marked price of an item.    Additionally, for every ₹2,000 of marked-price purchases, he    provides an item worth ₹300 for free. If a customer purchased    items with a total marked price of ₹4,500, what was the    effective benefit percentage relative to the original marked    price?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">33.33%</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">45.33%</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">23.33%</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">41.33%</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> After two successive    discounts, SP = 4500 × 80/100 × 90/100<br> = 3240<br> Discount    received = 4500 - 3240 = 1260<br> Value of free articles = 2 ×    300 = 600<br> Total benefit = 1260 + 600 = 1860<br> Effective    benefit % = 1860/4500 × 100% = 41.33%</span></p>", "question_heading": ""}, {"sr_no": 65, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A person has to cover a distance of    500 km. He travels at a constant speed of 50 km/h and stops for 10    minutes after covering every 75 km. How much total time will it    take him to complete the 500 km journey?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">12 hours</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">11 hours</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">15 hours</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">18 hours</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Travelling time = 500/50    = 10 hours<br> Number of stoppages = 500/75 = 6.66 = 6<br> Stoppage    time = 10 × 6 = 60 min = 1 hour<br> Total time = 10 hours + 1    hour = 11 hours</span></p>", "question_heading": ""}, {"sr_no": 66, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Arrange the following fractions in    ascending order.<br> 7/12, 5/8, 11/15, 3/5</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">7/12 &lt; 3/5 &lt; 5/8 &lt; 11/15</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3/5 &lt; 5/8 &lt; 11/15 &lt; 7/12</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">3/5 &lt; 5/8 &lt; 7/12 &lt; 11/15</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">11/15 &lt; 7/12 &lt; 3/5 &lt; 5/8</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> 7/12 = 0.58<br> 5/8 =    0.625<br> 11/15 = 0.733<br> 3/5 = 0.60<br> Ascending order </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    7/12 &lt; 3/5 &lt; 5/8 &lt; 11/15</span></p>", "question_heading": ""}, {"sr_no": 67, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A person traverses the three sides    of an equilateral triangle at speeds of 6 km/h, 8 km/h, and 12    km/h, respectively. If the length of each side is 1444 km, what    will be his average speed for traversing the entire perimeter of    the triangle?</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">9 km/h</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">8 km/h</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">10 km/h</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">12 km/h</span></p>", "answer": "2", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Let the length of each side be d    km.<br> ATQ,<br> Total distance = 3d km<br> Total time = d/6 +    d/8 + d/12<br> = d(4 + 3 + 2)/24<br> = 3d/8 hours<br> Average    speed = Total distance/Total time<br> = 3d ÷ (3d/8)<br> = 8    km/h</span></p>", "question_heading": ""}, {"sr_no": 68, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Two trains start at the same time    from stations A and B towards each other and, after crossing each    other, take 4 hours and 9 hours respectively to reach B and A ownstream = 24<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    Speed of the boat = (24 + 16)/2 = 20 km/h</span></p>", "question_heading": ""}, {"sr_no": 71, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">The sum of a positive number and    its square is 90. Find the number.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">7</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">8</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">9</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">10</span></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Let number = m<br> m +    m² = 90<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    m² + m – 90 = 0<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    m² + 10m – 9m – 90 = 0<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    m (m + 10) – 9 (m + 10) = 0<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    (m + 10) (m - 9) =0<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    (m + 10) = 0 and (m - 9) = 0<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    m = - 10 (Invalid) and m = 9 (Valid)<br> Required number = 9</span></p>", "question_heading": ""}, {"sr_no": 72, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In a group of 100 people, 50 like    tea, 40 like coffee, and 30 like milk. 20 like tea and coffee, 15    like coffee and milk, 10 like tea and milk, and 5 like all three.    Find the number of people who like none of the three.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">15</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">18</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">22</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">20</span></p>", "answer": "4", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Let T = Those who like    tea<br> C = Those who like coffee<br> M = Those who like milk<br> At    least one likes = n(T</span><span style=\"font-family:'Cambria Math'\">∪</span><span style=\"font-family:'Nirmala UI'\">C</span><span style=\"font-family:'Cambria Math'\">∪</span><span style=\"font-family:'Nirmala UI'\">M)<br> n(T</span><span style=\"font-family:'Cambria Math'\">∪</span><span style=\"font-family:'Nirmala UI'\">C</span><span style=\"font-family:'Cambria Math'\">∪</span><span style=\"font-family:'Nirmala UI'\">M)    = n(T) + n(C) + n(M) − n(T</span><span style=\"font-family:'Cambria Math'\">∩</span><span style=\"font-family:'Nirmala UI'\">C)    − n(C</span><span style=\"font-family:'Cambria Math'\">∩</span><span style=\"font-family:'Nirmala UI'\">M)    − n(T</span><span style=\"font-family:'Cambria Math'\">∩</span><span style=\"font-family:'Nirmala UI'\">M)    + n (T</span><span style=\"font-family:'Cambria Math'\">∩</span><span style=\"font-family:'Nirmala UI'\">C</span><span style=\"font-family:'Cambria Math'\">∩</span><span style=\"font-family:'Nirmala UI'\">M)<br> =    50 + 40 + 30 - 20 - 15 - 10 + 5 = 80<br> </span><span style=\"font-family:'Cambria Math'\">⇒</span><span style=\"font-family:'Nirmala UI'\">    The number of people who like none of the three = 100 - 80 = 20</span></p>", "question_heading": ""}, {"sr_no": 73, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">A bucket is in the form of a    frustum of a cone with radii of the top and bottom as 6 cm and 3    cm, and height 7 cm. Find its volume. (</span><span>π</span><span style=\"font-family:'Nirmala UI'\">    = 22/7)</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">440 cm</span><sup><span style=\"font-family:'Nirmala UI'\">3</span></sup></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">451 cm</span><sup><span style=\"font-family:'Nirmala UI'\">3</span></sup></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">462 cm</span><sup><span style=\"font-family:'Nirmala UI'\">3</span></sup></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">473 cm</span><sup><span style=\"font-family:'Nirmala UI'\">3</span></sup></p>", "answer": "3", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">ATQ,<br> Volume of frustum = 1/3 ×    </span><span>π</span><span style=\"font-family:'Nirmala UI'\">    × h × (R</span><sup><span style=\"font-family:'Nirmala UI'\">2</span></sup><span style=\"font-family:'Nirmala UI'\"> +    r² + Rr)<br> = 1/3 × 22/7 × 7 × (62 + 32 + 6 × 3)<br> = 1/3    × 22 × (36 + 9 + 18)<br> = 1/3 × 22 × 63<br> = 1/3 × 1386<br> =    462 cm</span><sup><span style=\"font-family:'Nirmala UI'\">3</span></sup></p>", "question_heading": ""}, {"sr_no": 74, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">In a cyclic quadrilateral ABCD, A =    (3x+5)° and C = (2x+15)°. Find the value of x.</span></p t in the statement.</span></p>    <p style=\"orphans:0;widows:0\"><span style=\"font-family:'Nirmala UI'\">Statement:<br> To    boost overall productivity, the management of company X has    decided to introduce flexible working hours for its    employees.<br> Assumptions:<br> I. Flexible working hours can    positively impact employee productivity.<br> II. Employees were    completely unproductive under fixed working hours.</span></p>", "option1": "<p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Assumption I is implicit</span></p>", "option2": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Only Assumption II is implicit</span></p>", "option3": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Both I and II are implicit</span></p>", "option4": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Neither I nor II is implicit</span></p>", "answer": "1", "negative_marking": "0.50", "positive_marking": "1", "solution_text": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Assumption I (Flexible working    hours can positively impact employee productivity):<br> Is    implicit. Management implemented flexible working hours with the    sole purpose of boosting productivity. Any action taken is assumed    to yield the desired positive results.<br> Assumption II    (Employees were completely unproductive under fixed working    hours):<br> Not implicit. The statement talks about \"boosting\"    productivity, which implies that productivity existed before, but    needs to be improved further. Assuming that employees were    \"completely unproductive\" before is an extreme and    incorrect assumption.</span></p>", "question_heading": ""}, {"sr_no": 98, "question": " <p style=\"orphans:0;widows:0\">    <span style=\"font-family:'Nirmala UI'\">Which of the following terms will    replace the question mark (?) in the given series?<b  Similarly<br> </span><img src=\"https://static-appxdb-v2.akamai.net.in/website/bulk_uploader_images/1786898563785_html_97dce2060f77a874.png\" width=\"240\" height=\"92\" > </p>", "question_heading": ""}];

let currentQuestion = 0;
let answers = {};
let bookmarks = new Set();
let timerSeconds = 0;
let timerInterval = null;
let isPaletteOpen = false;

const STORAGE_KEY = 'quizState_' + (document.title || 'default');

function isImageURL(str) {
  return str && (str.startsWith('http://') || str.startsWith('https://'));
}

function createOptionContent(optionText) {
    const contentDiv = document.createElement('div');
    contentDiv.className = 'option-content';
    
    if (isImageURL(optionText)) {
        const img = document.createElement('img');
        img.src = optionText;
        img.className = 'option-image';
        img.alt = 'Option image';
        img.loading = 'lazy';
        img.onerror = function() {
            this.style.display = 'none';
            const errorText = document.createTextNode('Image failed to load');
            contentDiv.appendChild(errorText);
        };
        contentDiv.appendChild(img);
    } else {
        contentDiv.innerHTML = optionText;
    }
    
    return contentDiv;
}

document.addEventListener('DOMContentLoaded', () => {
  initTheme();
  initQuiz();
  initEventListeners();
  loadFromLocalStorage();
  startTimer();
  createPalette();
  preventDoubleTapZoom();
});

function preventDoubleTapZoom() {
  let lastTouchEnd = 0;
  document.addEventListener('touchend', (event) => {
    const now = Date.now();
    if (now - lastTouchEnd <= 300) {
      event.preventDefault();
    }
    lastTouchEnd = now;
  }, { passive: false });
}

function initTheme() {
  const savedTheme = localStorage.getItem('quizTheme') || 'light';
  document.documentElement.setAttribute('data-theme', savedTheme);
  updateThemeIcon();
}

function updateThemeIcon() {
  const theme = document.documentElement.getAttribute('data-theme');
  const themeBtn = document.getElementById('themeToggle');
  if (themeBtn) {
    themeBtn.textContent = theme === 'dark' ? '☀️' : '🌙';
  }
}

function toggleTheme() {
  const currentTheme = document.documentElement.getAttribute('data-theme');
  const newTheme = currentTheme === 'dark' ? 'light' : 'dark';
  document.documentElement.setAttribute('data-theme', newTheme);
  localStorage.setItem('quizTheme', newTheme);
  updateThemeIcon();
}

function initQuiz() {
  loadQuestion(currentQuestion);
  updateMarkingInfo();
}

function initEventListeners() {
  const themeBtn = document.getElementById('themeToggle');
  const fullscreenBtn = document.getElementById('fullscreenBtn');
  
  if (themeBtn) {
    themeBtn.addEventListener('click', toggleTheme);
    themeBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleTheme();
    });
  }
  
  if (fullscreenBtn) {
    fullscreenBtn.addEventListener('click', toggleFullscreen);
    fullscreenBtn.addEventListener('touchend', (e) => {
      e.preventDefault();
      toggleFullscreen();
    });
  }
  
  addButtonListener('prevBtn', prevQuestion);
  addButtonListener('nextBtn', nextQuestion);
  addButtonListener('clearBtn', clearAnswer);
  addButtonListener('submitBtn', confirmSubmit);
  addButtonListener('bookmarkBtn', toggleBookmark);
  
  addButtonListener('paletteFab', togglePalette);
  addButtonListener('paletteClose', closePalette);
  
  const overlay = document.getElementById('paletteOverlay');
  if (overlay) {
    overlay.addEventListener('click', closePalette);
    overlay.addEventListener('touchend', (e) => {
      e.preventDefault();
      closePalette();
    });
  }
  
  const searchInput = document.getElementById('paletteSearch');
  if (searchInput) {
    searchInput.addEventListener('input', handleSearch);
    searchInput.addEventListener('change', jumpToQuestion);
  }
  
  document.addEventListener('keydown', handleKeyPress);
  
  setInterval(saveToLocalStorage, 5000);
  
  document.addEventListener('visibilitychange', () => {
    if (!document.hidden) {
      updatePalette();
    }
  });
}

function addButtonListener(id, handler) {
  const btn = document.getElementById(id);
  if (btn) {
    btn.addEventListener('click', handler);
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      handler();
    });
  }
}

function jumpToQuestion(e) {
  const questionNum = parseInt(e.target.value);
  if (questionNum >= 1 && questionNum <= questions.length) {
    goToQuestion(questionNum - 1);
    closePalette();
    e.target.value = '';
  }
}

function togglePalette() {
  isPaletteOpen = !isPaletteOpen;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (isPaletteOpen) {
    palette.classList.add('active');
    overlay.classList.add('active');
    fab.classList.add('active');
    fab.innerHTML = '✕<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
    document.body.classList.add('palette-open');
  } else {
    closePalette();
  }
}

function closePalette() {
  isPaletteOpen = false;
  const palette = document.getElementById('questionPalette');
  const overlay = document.getElementById('paletteOverlay');
  const fab = document.getElementById('paletteFab');
  
  if (palette) palette.classList.remove('active');
  if (overlay) overlay.classList.remove('active');
  if (fab) {
    fab.classList.remove('active');
    fab.innerHTML = '📋<span class="badge" id="answeredBadge">' + Object.keys(answers).length + '</span>';
  }
  document.body.classList.remove('palette-open');
}

function handleSearch(e) {
  const searchTerm = e.target.value.toLowerCase();
  if (!searchTerm) {
    document.querySelectorAll('.palette-btn').forEach(btn => {
      btn.style.display = '';
    });
    return;
  }
  
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    const questionNum = (index + 1).toString();
    if (questionNum.includes(searchTerm)) {
      btn.style.display = '';
    } else {
      btn.style.display = 'none';
    }
  });
}

function handleKeyPress(e) {
  if (document.getElementById('resultSection').classList.contains('hidden')) {
    if (e.key === 'Escape' && isPaletteOpen) {
      closePalette();
    } else if (!isPaletteOpen && e.target.tagName !== 'INPUT') {
      if (e.key === 'ArrowLeft') {
        e.preventDefault();
        prevQuestion();
      } else if (e.key === 'ArrowRight') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'Enter') {
        e.preventDefault();
        nextQuestion();
      } else if (e.key === 'b' || e.key === 'B') {
        e.preventDefault();
        toggleBookmark();
      } else if (e.key === 'c' || e.key === 'C') {
        e.preventDefault();
        clearAnswer();
      } else if (e.key === 'p' || e.key === 'P') {
        e.preventDefault();
        togglePalette();
      } else if (e.key >= '1' && e.key <= '4') {
        e.preventDefault();
        selectOption(parseInt(e.key));
      }
    }
  }
}

function selectOption(optionNum) {
  const q = questions[currentQuestion];
  const radio = document.querySelector(`input[name="q${q.sr_no}"][value="${optionNum}"]`);
  if (radio) {
    radio.checked = true;
    const label = radio.closest('.option-label');
    if (label) {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    }
  }
}

function toggleFullscreen() {
  try {
    if (!document.fullscreenElement) {
      document.documentElement.requestFullscreen().catch(err => {
        console.log('Fullscreen error:', err);
      });
    } else {
      document.exitFullscreen();
    }
  } catch (err) {
    console.log('Fullscreen not supported');
  }
}

function startTimer() {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
  timerInterval = setInterval(() => {
    timerSeconds++;
    updateTimer();
    if (timerSeconds > 600) {
      const timer = document.getElementById('timer');
      if (timer) timer.classList.add('warning');
    }
  }, 1000);
}

function updateTimer() {
  const minutes = Math.floor(timerSeconds / 60);
  const seconds = timerSeconds % 60;
  const timer = document.getElementById('timer');
  if (timer) {
    timer.textContent = 
      `${minutes.toString().padStart(2, '0')}:${seconds.toString().padStart(2, '0')}`;
  }
}

function createPalette() {
  const grid = document.getElementById('paletteGrid');
  if (!grid) return;
  
  grid.innerHTML = '';
  questions.forEach((q, index) => {
    const btn = document.createElement('button');
    btn.textContent = index + 1;
    btn.className = 'palette-btn';
    btn.setAttribute('aria-label', `Go to question ${index + 1}`);
    btn.setAttribute('type', 'button');
    
    btn.addEventListener('click', () => {
      goToQuestion(index);
      closePalette();
    });
    
    btn.addEventListener('touchend', (e) => {
      e.preventDefault();
      goToQuestion(index);
      closePalette();
    });
    
    grid.appendChild(btn);
  });
  updatePalette();
}

function updatePalette() {
  const buttons = document.querySelectorAll('.palette-btn');
  buttons.forEach((btn, index) => {
    btn.className = 'palette-btn';
    if (index === currentQuestion) btn.classList.add('current');
    if (answers[questions[index].sr_no]) btn.classList.add('answered');
    if (bookmarks.has(questions[index].sr_no)) btn.classList.add('bookmarked');
  });
  
  updatePaletteStats();
}

function updatePaletteStats() {
  const answered = Object.keys(answers).length;
  const unanswered = questions.length - answered;
  const bookmarkedCount = bookmarks.size;
  
  const answeredEl = document.getElementById('paletteAnswered');
  const unansweredEl = document.getElementById('paletteUnanswered');
  const bookmarkedEl = document.getElementById('paletteBookmarked');
  
  if (answeredEl) answeredEl.textContent = answered;
  if (unansweredEl) unansweredEl.textContent = unanswered;
  if (bookmarkedEl) bookmarkedEl.textContent = bookmarkedCount;
  
  const badge = document.querySelector('.palette-fab .badge');
  if (badge) badge.textContent = answered;
}

function goToQuestion(index) {
  if (index < 0 || index >= questions.length) return;
  saveAnswer();
  currentQuestion = index;
  loadQuestion(currentQuestion);
  
  const questionSection = document.getElementById('questionSection');
  if (questionSection) {
    setTimeout(() => {
      questionSection.scrollIntoView({ behavior: 'smooth', block: 'start' });
    }, 100);
  }
}

function loadQuestion(index) {
  const q = questions[index];
  
  const questionNumber = document.getElementById('questionNumber');
  const questionText = document.getElementById('questionText');
  
  if (questionNumber) {
    questionNumber.textContent = `Question ${index + 1} of ${questions.length}`;
  }
  
  if (questionText) {
    questionText.innerHTML = '';
    
    // 🌟 NEW: Create the Heading Box if it exists!
    let headingHtml = '';
    if (q.question_heading && q.question_heading.trim() !== '') {
      headingHtml = `<div style="background: var(--bg-tertiary); padding: 15px; border-left: 4px solid var(--primary-color); margin-bottom: 20px; border-radius: 8px; overflow-x: auto;">${q.question_heading}</div>`;
      questionText.innerHTML = headingHtml; // Inject heading first
    }

    if (isImageURL(q.question)) {
      const img = document.createElement('img');
      img.src = q.question;
      img.className = 'question-image';
      img.alt = 'Question image';
      img.loading = 'lazy';
      img.onerror = function() {
        this.style.display = 'none';
        questionText.innerHTML += q.question;
      };
      questionText.appendChild(img);
    } else {
      questionText.innerHTML += q.question; // Append question after heading
    }
  }
  
  const container = document.getElementById('optionsContainer');
  if (!container) return;
  
  container.innerHTML = '';
  
  for (let i = 1; i <= 4; i++) {
    const label = document.createElement('label');
    label.className = 'option-label';
    if (answers[q.sr_no] == i) label.classList.add('selected');
    
    const radio = document.createElement('input');
    radio.type = 'radio';
    radio.name = `q${q.sr_no}`;
    radio.value = i;
    radio.checked = answers[q.sr_no] == i;
    
    const changeHandler = () => {
      document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
      label.classList.add('selected');
      saveAnswer();
    };
    
    radio.addEventListener('change', changeHandler);
    label.addEventListener('click', (e) => {
      if (e.target !== radio) {
        radio.checked = true;
        changeHandler();
      }
    });
    
    label.appendChild(radio);
    
    const optionContent = createOptionContent(q[`option${i}`]);
    label.appendChild(optionContent);
    
    container.appendChild(label);
  }
  
  const bookmarkBtn = document.getElementById('bookmarkBtn');
  if (bookmarkBtn) {
    if (bookmarks.has(q.sr_no)) {
      bookmarkBtn.classList.add('active');
    } else {
      bookmarkBtn.classList.remove('active');
    }
  }
  
  const prevBtn = document.getElementById('prevBtn');
  const nextBtn = document.getElementById('nextBtn');
  const submitBtn = document.getElementById('submitBtn');
  
  if (prevBtn) prevBtn.disabled = index === 0;
  
  if (index === questions.length - 1) {
    if (nextBtn) nextBtn.classList.add('hidden');
    if (submitBtn) submitBtn.classList.remove('hidden');
  } else {
    if (nextBtn) nextBtn.classList.remove('hidden');
    if (submitBtn) submitBtn.classList.add('hidden');
  }
  
  updateProgress();
  updatePalette();
}

function updateMarkingInfo() {
  if(questions.length > 0) {
      const q = questions[0];
      const markingInfo = document.getElementById('markingInfo');
      if (markingInfo) {
        markingInfo.textContent = `Marking: +${q.positive_marking}, -${q.negative_marking}`;
      }
  }
}

function updateProgress() {
  const attempted = Object.keys(answers).length;
  const currentProgress = ((currentQuestion + 1) / questions.length) * 100;
  
  const progressBar = document.getElementById('progressBar');
  const progressText = document.getElementById('progressText');
  const attemptedText = document.getElementById('attemptedText');
  
  if (progressBar) progressBar.style.width = `${currentProgress}%`;
  if (progressText) progressText.textContent = `${currentQuestion + 1}/${questions.length}`;
  if (attemptedText) attemptedText.textContent = attempted;
}

function saveAnswer() {
  const q = questions[currentQuestion];
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  
  if (selected) {
    answers[q.sr_no] = selected.value;
  }
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function clearAnswer() {
  const q = questions[currentQuestion];
  delete answers[q.sr_no];
  
  const selected = document.querySelector(`input[name="q${q.sr_no}"]:checked`);
  if (selected) selected.checked = false;
  
  document.querySelectorAll('.option-label').forEach(l => l.classList.remove('selected'));
  
  updateProgress();
  updatePalette();
  saveToLocalStorage();
}

function toggleBookmark() {
  const q = questions[currentQuestion];
  const btn = document.getElementById('bookmarkBtn');
  
  if (bookmarks.has(q.sr_no)) {
    bookmarks.delete(q.sr_no);
    if (btn) btn.classList.remove('active');
  } else {
    bookmarks.add(q.sr_no);
    if (btn) btn.classList.add('active');
  }
  
  updatePalette();
  saveToLocalStorage();
}

function nextQuestion() {
  saveAnswer();
  if (currentQuestion < questions.length - 1) {
    currentQuestion++;
    loadQuestion(currentQuestion);
  }
}

function prevQuestion() {
  saveAnswer();
  if (currentQuestion > 0) {
    currentQuestion--;
    loadQuestion(currentQuestion);
  }
}

function confirmSubmit() {
  const unattempted = questions.length - Object.keys(answers).length;
  let message = 'Are you sure you want to submit the quiz?';
  
  if (unattempted > 0) {
    message += `\n\nYou have ${unattempted} unanswered question(s).`;
  }
  
  if (confirm(message)) {
    submitQuiz();
  }
}

function submitQuiz() {
  if (timerInterval) {
    clearInterval(timerInterval);
    timerInterval = null;
  }
  saveAnswer();
  closePalette();
  
  let correct = 0, wrong = 0, unattempted = 0, score = 0;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    const posMark = parseFloat(q.positive_marking) || 0;
    const negMark = parseFloat(q.negative_marking) || 0;
    
    if (!userAns) {
      unattempted++;
    } else if (userAns == q.answer) {
      correct++;
      score += posMark;
    } else {
      wrong++;
      score -= negMark;
    }
  });
  
  displayResults(correct, wrong, unattempted, score);
  
  const fab = document.getElementById('paletteFab');
  const nav = document.getElementById('navigation');
  if (fab) fab.style.display = 'none';
  if (nav) nav.style.display = 'none';
  
  document.body.style.paddingBottom = '20px';
  
  clearLocalStorage();
}

function displayResults(correct, wrong, unattempted, score) {
  const totalQuestions = questions.length;
  const percentage = ((correct / totalQuestions) * 100).toFixed(1);
  const timerEl = document.getElementById('timer');
  const timeText = timerEl ? timerEl.textContent : '00:00';
  
  let html = `
    <div class="score-card">
      <h2>${score}/${totalQuestions}</h2>
      <p>Your Score: ${percentage}%</p>
      <p>Time Taken: ${timeText}</p>
    </div>
    
    <div class="stats-grid">
      <div class="stat-card correct">
        <h3>${correct}</h3>
        <p>Correct</p>
      </div>
      <div class="stat-card wrong">
        <h3>${wrong}</h3>
        <p>Wrong</p>
      </div>
      <div class="stat-card unattempted">
        <h3>${unattempted}</h3>
        <p>Unattempted</p>
      </div>
      <div class="stat-card">
        <h3>${totalQuestions}</h3>
        <p>Total</p>
      </div>
    </div>
  `;
  
  questions.forEach(q => {
    const userAns = answers[q.sr_no];
    
    // 🌟 NEW: Add the Heading to the results review screen!
    let headingHtml = (q.question_heading && q.question_heading.trim() !== '') 
      ? `<div style="background: var(--bg-tertiary); padding: 10px; margin-bottom: 15px; border-left: 4px solid var(--primary-color); border-radius: 5px; overflow-x: auto;">${q.question_heading}</div>` 
      : '';
      
    const questionHeader = isImageURL(q.question)
      ? `<h4>Q${q.sr_no}:</h4>${headingHtml}<img src="${q.question}" class="question-image" alt="Question ${q.sr_no}">`
      : `<h4>Q${q.sr_no}:</h4>${headingHtml}<div style="margin-bottom: 10px;">${q.question}</div>`;
      
    html += `<div class="question-review">${questionHeader}`;
    
    for (let i = 1; i <= 4; i++) {
      const isCorrect = i.toString() === q.answer;
      const isUserAnswer = userAns == i.toString();
      
      let className = 'review-option';
      if (isCorrect) className += ' correct';
      if (isUserAnswer && !isCorrect) className += ' wrong';
      if (isUserAnswer) className += ' user-selected';
      
      const optionValue = q[`option${i}`];
      
      if (isImageURL(optionValue)) {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''} 
          <img src="${optionValue}" class="option-image" alt="Option ${i}">
        </div>`;
      } else {
        html += `<div class="${className}">
          ${isCorrect ? '✓ ' : ''}${isUserAnswer ? '➤ ' : ''}${optionValue}
        </div>`;
      }
    }
    
    if (q.solution_text && q.solution_text.trim() !== '') {
      const solutionContent = isImageURL(q.solution_text)
        ? `<img src="${q.solution_text}" class="solution-image" alt="Solution">`
        : q.solution_text;
      html += `<div class="solution-section">
        <div class="solution-label">📝 Solution:</div>
        <div class="solution-content">${solutionContent}</div>
      </div>`;
    }
    
    html += `</div>`; 
});
  
  html += `
    <div class="action-buttons">
      <button class="action-btn restart" onclick="restartQuiz()">Restart Quiz</button>
      <button class="action-btn download" onclick="downloadResults()">Download Results</button>
      <button class="action-btn print" onclick="window.print()">Print Results</button>
    </div>
  `;
  
  const resultSection = document.getElementById('resultSection');
  const questionSection = document.getElementById('questionSection');
  const progressSection = document.querySelector('.progress-section');
  
  if (resultSection) {
    resultSection.innerHTML = html;
    resultSection.classList.remove('hidden');
  }
  if (questionSection) questionSection.classList.add('hidden');
  if (progressSection) progressSection.classList.add('hidden');
  
  const quizContainer = document.getElementById('quizContainer');
  if (quizContainer) {
    setTimeout(() => {
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }, 100);
  }
}

function restartQuiz() {
  if (confirm('Are you sure you want to restart? All progress will be lost.')) {
    currentQuestion = 0;
    answers = {};
    bookmarks.clear();
    timerSeconds = 0;
    
    const resultSection = document.getElementById('resultSection');
    const questionSection = document.getElementById('questionSection');
    const progressSection = document.querySelector('.progress-section');
    const fab = document.getElementById('paletteFab');
    const nav = document.getElementById('navigation');
    
    if (resultSection) {
      resultSection.classList.add('hidden');
      resultSection.innerHTML = '';
    }
    if (questionSection) questionSection.classList.remove('hidden');
    if (progressSection) progressSection.classList.remove('hidden');
    if (fab) fab.style.display = 'flex';
    if (nav) nav.style.display = 'grid';
    
    document.body.style.paddingBottom = 'var(--nav-height)';
    
    if (timerInterval) {
      clearInterval(timerInterval);
    }
    startTimer();
    
    loadQuestion(currentQuestion);
    createPalette();
  }
}

function downloadResults() {
  const resultSection = document.getElementById('resultSection');
  if (!resultSection) return;
  
  const resultHTML = resultSection.innerHTML;
  const fullHTML = `
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Quiz Results</title>
  <style>
    body { font-family: Arial, sans-serif; padding: 20px; background: #f5f5f5; max-width: 900px; margin: 0 auto; }
    .score-card { background: linear-gradient(135deg, #007bff, #28a745); color: white; padding: 30px; border-radius: 15px; text-align: center; margin-bottom: 20px; }
    .score-card h2 { font-size: 48px; margin-bottom: 10px; }
    .stats-grid { display: grid; grid-template-columns: repeat(4, 1fr); gap: 15px; margin-bottom: 30px; }
    .stat-card { background: white; padding: 20px; border-radius: 10px; text-align: center; border: 2px solid #ddd; }
    .stat-card h3 { font-size: 32px; margin-bottom: 8px; }
    .stat-card.correct h3 { color: #28a745; }
    .stat-card.wrong h3 { color: #dc3545; }
    .stat-card.unattempted h3 { color: #6c757d; }
    .question-review { background: white; border: 2px solid #ddd; border-radius: 10px; padding: 20px; margin-bottom: 15px; }
    .question-review h4 { margin-bottom: 15px; font-size: 16px; line-height: 1.6; }
    .review-option { padding: 10px 15px; margin: 8px 0; border-radius: 8px; border: 2px solid #ddd; display: flex; align-items: center; gap: 10px; }
    .option-image { max-width: 150px; max-height: 100px; border-radius: 8px; }
    .review-option.correct { background: #d4edda; border-color: #28a745; color: #155724; }
    .review-option.wrong { background: #f8d7da; border-color: #dc3545; color: #721c24; }
    .review-option.user-selected { border-width: 3px; font-weight: bold; }
    @media print { body { background: white; } }
    @media (max-width: 600px) { .stats-grid { grid-template-columns: repeat(2, 1fr); } }
  </style>
</head>
<body>
  <h1 style="text-align: center; color: #007bff;">Quiz Results</h1>
  <p style="text-align: center; color: #666; margin-bottom: 30px;">Generated on: ${new Date().toLocaleString()}</p>
  ${resultHTML.replace(/<div class="action-buttons">[\s\S]*?<\/div>/, '')}
</body>
</html>
  `;
  
  try {
    const blob = new Blob([fullHTML], { type: 'text/html' });
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a');
    a.href = url;
    a.download = `Quiz_Results_${new Date().getTime()}.html`;
    document.body.appendChild(a);
    a.click();
    document.body.removeChild(a);
    URL.revokeObjectURL(url);
  } catch (err) {
    alert('Download failed. Please try using the Print option instead.');
    console.error('Download error:', err);
  }
}

function saveToLocalStorage() {
  try {
    const state = {
      currentQuestion,
      answers,
      bookmarks: Array.from(bookmarks),
      timerSeconds,
      timestamp: Date.now()
    };
    localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  } catch (err) {
    console.error('Save error:', err);
  }
}

function loadFromLocalStorage() {
  try {
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved) {
      const state = JSON.parse(saved);
      const hasProgress = (state && (
        (state.currentQuestion && state.currentQuestion > 0) ||
        (state.answers && Object.keys(state.answers).length > 0) ||
        (state.timerSeconds && state.timerSeconds > 0)
      ));
      if (hasProgress && (Date.now() - state.timestamp < 24 * 60 * 60 * 1000)) {
        if (confirm('Resume previous quiz session?')) {
          currentQuestion = state.currentQuestion || 0;
          answers = state.answers || {};
          bookmarks = new Set(state.bookmarks || []);
          timerSeconds = state.timerSeconds || 0;
          updateTimer();
          loadQuestion(currentQuestion);
        }
      } else {
        clearLocalStorage();
      }
    }
  } catch (err) {
    console.error('Load error:', err);
    clearLocalStorage();
  }
}

function clearLocalStorage() {
  try {
    localStorage.removeItem(STORAGE_KEY);
  } catch (err) {
    console.error('Clear storage error:', err);
  }
}

window.addEventListener('beforeunload', (e) => {
  const resultSection = document.getElementById('resultSection');
  if (resultSection && !resultSection.classList.contains('hidden')) {
    return;
  }
  e.preventDefault();
  e.returnValue = '';
});

window.addEventListener('unload', () => {
  if (timerInterval) {
    clearInterval(timerInterval);
  }
});
</script>
</body>
</html>
