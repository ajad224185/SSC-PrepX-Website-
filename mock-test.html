<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#ffffff">
<title>Mock Test Hub</title>
<style>
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    width: 100%;
    min-height: 100%;
    overflow: hidden;
    background: #f4f6fb;
    color: #171528;
    font-family: "Segoe UI", Roboto, Arial, sans-serif;
  }

  /* White header like the reference Mock Test Hub screen */
  .top {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    z-index: 5;
    height: 66px;
    min-height: 66px;
    display: grid;
    grid-template-columns: 90px minmax(0, 1fr) 46px;
    align-items: center;
    gap: 10px;
    padding: 6px 10px;
    background: #ffffff;
    box-shadow: 0 2px 10px rgba(20, 24, 40, .08);
  }
  .top button {
    border: 1px solid #e7e8ef;
    background: #ffffff;
    color: #171528;
    height: 50px;
    border-radius: 15px;
    font: inherit;
    font-size: 15px;
    font-weight: 750;
    box-shadow: 0 3px 12px rgba(20, 24, 40, .08);
  }
  .back {
    justify-self: start;
    width: 100%;
  }
  .top b {
    min-width: 0;
    text-align: center;
    font-size: clamp(18px, 4.5vw, 28px);
    font-weight: 850;
    white-space: nowrap;
  }
  .profile {
    justify-self: end;
    width: 46px;
    height: 46px !important;
    border: 0 !important;
    border-radius: 50% !important;
    background: #100d2b !important;
    color: #ffffff !important;
    display: grid;
    place-items: center;
    line-height: 1;
    box-shadow: none !important;
    display: grid;
    place-items: center;
  }
  .profile svg { width: 58%; height: 58%; display: block; }
  .wrap {
    position: fixed;
    inset: 0;
    width: 100%;
    height: 100vh;
    height: 100dvh;
    min-height: 300px;
    background: #f4f6fb;
  }
  iframe {
    position: absolute;
    inset: 0;
    width: 100%;
    height: 100%;
    border: 0;
    background: #ffffff;
  }

  @media (max-width: 480px) {
    .top {
      height: 66px;
      min-height: 66px;
      grid-template-columns: 90px minmax(0, 1fr) 46px;
      gap: 6px;
      padding: 6px 10px;
    }
    .top button.back {
      height: 50px;
      border-radius: 15px;
      font-size: 15px;
    }
    .top b { font-size: 18px; }
    .profile {
      width: 46px;
      height: 46px !important;
      font-size: 28px !important;
    }
    .wrap {
      height: 100vh;
      height: 100dvh;
    }
  }
</style>
</head>
<body>
  <header class="top">
    <button class="back" type="button" onclick="goBack()">← Back</button>
    <b>Mock Test Hub</b>
    <div class="profile" aria-label="Profile"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="4" fill="#fff"/><path d="M4.5 21c.5-4.2 3.4-6.5 7.5-6.5s7 2.3 7.5 6.5" fill="#fff"/></svg></button>
  </header>

  <main class="wrap">
    <iframe
      src="https://mocktesthub.vercel.app"
      title="Mock Test Hub"
      allow="clipboard-write; fullscreen; autoplay"
      allowfullscreen
      referrerpolicy="no-referrer-when-downgrade">
    </iframe>
  </main>

<script>
  function goBack() {
    if (history.length > 1) history.back();
    else location.href = "index.html";
  }
</script>
</body>
</html>
