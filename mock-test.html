<!DOCTYPE html>
<html lang="hi">
<head>

<title>SSC PrepX • Mock Test Hub</title>
<style>
*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;background:#0e0b1f;color:#f6f3ff;font-family:Segoe UI,Roboto,Arial,sans-serif}
.top{height:58px;display:flex;align-items:center;gap:10px;padding:8px 12px;background:#19152e}
.top a,.top button{border:0;border-radius:12px;background:#231e3d;color:#f6f3ff;text-decoration:none;height:40px;padding:0 13px;font-weight:700}
.top b{flex:1;text-align:center;font-size:16px}
.wrap{height:calc(100vh - 58px);height:calc(100dvh - 58px);position:relative}
iframe{position:absolute;inset:0;width:100%;height:100%;border:0;background:#fff}
</style>
</head>
<body>
<div class="top">
  <button onclick="history.back()">← Back</button>
  <b>🏆 Mock Test Hub</b>

</div>
<div class="wrap">
  <iframe src="https://mocktesthub.vercel.app" title="Mock Test Hub" allow="clipboard-write; fullscreen; autoplay" allowfullscreen referrerpolicy="no-referrer-when-downgrade"></iframe>
</div>
