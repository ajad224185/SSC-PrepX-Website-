// --- SSC PrepX patch: hide login/signup + "Get the app" banner (runs continuously, React re-renders) ---
(function(){
  function textOf(el){ return (el.textContent || "").trim(); }
  function hideAncestor(el, levels){
    var n = el;
    for (var i=0;i<levels && n.parentElement;i++) n = n.parentElement;
    n.style.display = "none";
  }
  function sweep(){
    document.querySelectorAll("a,button,h4,h3").forEach(function(el){
      var t = textOf(el);
      if (!el.dataset.mthPatched && (t === "Log In" || t === "Sign Up" || t === "लॉग इन" || t === "साइन अप")) {
        el.dataset.mthPatched = "1";
        hideAncestor(el, 2); // hide the Log In / Sign Up button row
      }
      if (!el.dataset.mthPatched && (t === "Student Account" || t === "अभ्यर्थी लॉगिन")) {
        el.dataset.mthPatched = "1";
        hideAncestor(el, 3); // hide the whole "Student Account" card
      }
      if (!el.dataset.mthPatched && (t === "Get the Mock Test Hub app" || t === "Mock Test Hub ऐप डाउनलोड करें")) {
        el.dataset.mthPatched = "1";
        hideAncestor(el, 3); // hide the "Get the app" banner card
      }
    });
  }
  sweep();
  new MutationObserver(sweep).observe(document.documentElement, { childList: true, subtree: true });
})();
